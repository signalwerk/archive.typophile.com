    html: <p>You should consider the possibility that the wordmark was modified on the basis of an existing typeface (maybe to emulate the look of an older, pre-digital logo). Given that, I think you were on the right track with PTL Notes. When you start with the small caps&nbsp;(!) of the medium cut and scale the letters non-proportionally (mainly condensing them), you will see that you can make ‘G’, ‘M’, ‘O’, ‘H’, ‘N’ and ‘E’ match the sample perfectly. In ‘R’, they made the diagonal steeper; in ‘A’, they raised the crossbar; in ‘P’, they made the bowl smaller—not necessarily wise decisions, by the way. That’s as close as you’re going to get, I think.</p>
