      <p>Bumping this thread for another attempt at nailing this font...</p>
      <p>Since my last post, I went on several font sites, including whatfontis... and narrowed it down to the following 3:</p>
      <p>UBIK   <a href="http://www.fontshop.com/search/?q=ubik" title="http://www.fontshop.com/search/?q=ubik">http://www.fontshop.com/search/?q=ubik</a><br>
      PTL NOTES   <a href="http://www.fontshop.com/search/?q=ptl+notes&amp;num=50" title="http://www.fontshop.com/search/?q=ptl+notes&amp;num=50">http://www.fontshop.com/search/?q=ptl+notes&amp;num=50</a><br>
      INFORMATIC  <a href="http://new.myfonts.com/fonts/fatchair/informatic/" title="http://new.myfonts.com/fonts/fatchair/informatic/">http://new.myfonts.com/fonts/fatchair/informatic/</a></p>
      <p>but I fear that none of these is a 100% match.  To me it looks like a combination of all 3, which is of course unlikely. There's also the possibility that I've missed a style (such as Condensed etc). </p>
      <p>Input from anyone with sharper eyes much appreciated.</p>
