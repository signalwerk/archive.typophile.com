    <p>Hi there...  I'm pretty new to font creation / fontographer.  That being said I have a little question for all you old pros. <br> <br>I'm having trouble having the inner cut-outs of certain letters (R, g, P.  <br> <br>Everything looks like it should be working properly in fontographer as you can see in these following images <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="fontographer image 01"> <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="fontographer image 02"> <br> <br>But when I generate the font files some of those letters get all filled in.. as you can see in this screenshot from Fontbook <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="fontbook image 01"> <br> <br>Not really sure what I'm doing wrong and having trouble finding much documentation online. <br> <br>Thanks in advance for the help!</p>
