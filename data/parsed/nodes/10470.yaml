    html: <p>Tyler, a few things, first you images aren't showing it could be a number of reasons like CMYK instead of RGB (have to be RGB), BMP files don't show up use Gif or Jpg. When you post on this site it will give you an error message. That is this sites way of saying your post went through. To test it go back one screen when you get an error message then scroll up to topics and go to design and you will see your name as the last person to post.</p>
