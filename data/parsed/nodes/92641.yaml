      <p>I'd love to see some demographics, even just for Myfonts.</p>
      <p>For example, knowing what the bell curve looks like for number of units sold over price per unit, weather the majority of buyers are working in some way for design firms, or if they are just regular people with no real design knowledge.  Knowing thigs like this would change how I go at the game in the extreme.</p>
      <p>I have thought often about whether I would gross more overall if I priced my fonts incredibly low ($5) or relativity high ($100).  I'd certainly rather sell 30 copies at $5/each then only one copy at $100/each.  But without knowing what the demographics are and average and mode, median, and all the math, it's hard to tell which strategy would work better.</p>
