      <p>Just finding this thread well into it's evolution . . .</p>
      <p>What's interesting is that a majority of the posts and posters here really only are looking at desktop sales and not counting OEM licensing at all. While Font Bros enjoys a fair and growing share of desktop sales for its foundries, we're best at obtaining a good deal of OEM licensing for all the folks we represent and it's paid at the 65% rate, same as our rate on desktop sales.</p>
      <p>I think it's short sided to only look at annual desktop sales to determine the whole ball of wax and there isn't any designer among us who isn't thrilled to still make income off of fonts made 5 or 10 years ago.</p>
      <p>This sorta gets back to the original topic about all distributors which is to say each has their own audience and it took me many years to figure this out. It makes perfect sense that a foundry could do great at 10 distributors without harming its own income, yet it becomes a matter of convenience for those who just don't want to hassle with setting up and maintaining their own web store, licensing, etc . . .</p>
      <p>And there is no question it's a lot of time and effort that goes into making graphics, descriptions and getting a font prepped for resale that nearly always results in delayed releases.</p>
