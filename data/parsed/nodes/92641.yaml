      <p><em>I have often wondered if there is a good way to target these markets with lower prices than those charged to the wealthy nations</em></p>
      <p>I try to accommodate equal opportunity at affordable prices. I’m in the process of updating my entire commercial library to support the 1250, 1252, 1254 and 1257 codepages for the same retail price—typically a rousing 7.95 U.S. Dollars, with quantity discounts available. The current line contains all the aforementioned except the Baltic-specific characters—all autohinted (because the vast majority are display faces, typically used in larger sizes) but manually spaced and kerned.</p>
  - id: 508813
    user_id: 3135
    user_name: dezcom
    user_path: null
    date_raw: 6 May 2012 — 3:28pm
    date: 2012-05-06T15:28:00
    votes: null
    html: |-
      <p>The CE glyphs all use the Latin alphabet as a basis with a few exceptions.  Most of the work involves the diacritics which are rarely seen in English but essential to most other languages that use the Latin script.<br>
      Regarding pricing dovetailed to users,  I don't think it is just a geographical issue.  There are plenty of $5 font users in the Americas and Europe.  I don't see how anyone could enforce it without great cost.  We cannot even enforce the system we have.  There are type designers all over the World including the countries you might target as having a lower cost of living.  The type designers there share that lower cost of living and can support their own nations if they so desire.  It would be equally unfair for a type designer living in the UK and paying that cost of living to sell his work at less than he needs to survive where he lives.<br>
      I am more in favor of letting the type designer choose their own market or markets and doing the work that fulfills those needs.  The clients of course decide with their wallets if the design has missed the mark.  This eliminates the need for the income-level police from, most likely badly, enforcing the rules.  Any wealthy person can buy an IP address from Mumbai so who are we helping? Only the poor have no options.  The wealthy and or devious are quite adept at working around the best laid plans of mice and men. So just design what you choose and market to whom or where you choose.  If you fail in your perception of the market, your balance sheet will soon tell you if you either need to revise your market strategy or the product you produce.</p>
