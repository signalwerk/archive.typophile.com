      <p><cite>The $5 folks have much less need for broad character sets and don't perceive quality as well as your $100 folks.</cite></p>
      <p>I disagree. Broad character sets were developed to add support for central and eastern Europe, where income levels are often much lower than the US and Western Europe. These are also places where piracy is often considered the normal way of doing business. I have often wondered if there is a good way to target these markets with lower prices than those charged to the wealthy nations. This is actually something that could be easily addressed by mapping font prices to geography, verified by IP address and credit card data. Some font vendors—most notably Veer—already do this, but only to charge higher prices in the UK and Euro zone, and without lower prices where they would be appropriate.</p>
