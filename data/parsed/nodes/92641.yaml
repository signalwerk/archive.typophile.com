      <p>Unless you do a “split run”—i.e. selling the same product with different advertising/pricing to equal segments of the same market—then you have no way of telling how a variable such as price is affecting sales.</p>
      <p>With multiple distributors, the same price point will produce different results. Some cater to customers with more “house money”, presumably, among other factors. </p>
      <p>Complicating matters further, any optimum price point will vary according to the features and language support of a font.</p>
