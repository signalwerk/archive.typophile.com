      <p>I'm willing to bet there is a mathematical statistical formula that looks like this:</p>
      <p>(font release date - current date) + price point + scope of distribution + relative adoption/popularity = OEM licensing potential</p>
      <p>The thought is simply that the duration of time a font has been 'out' directly affects the saturation of that font in the marketplace and accordingly the number of folks who find and wish to use it outside of the scope of it's initial EULA or licensed uses.</p>
      <p>My conclusion is that older released fonts receive perhaps 4-8x as many OEM licensing requests as newer ones, so if you look at older more established foundries with a large body of work, chances are OEM font licensing could be anywhere from 20% to up to 45% of their annual income.</p>
      <p>We also cannot rule out income generated from infringement settlements in cases where the font use has been egregiously abused and law suits are required to remedy these cases - It is a random thing, but it could account for 5-10% of annual income on a random given year . . .</p>
      <p>My 2¢<br>
      Stuart</p>
