      <p>I wonder if anybody would be willing to reveal how many licenses they sell at which prices?</p>
      <p>Of course there is more the font consumer is attracted to then pure price.   How much they actually like the font surely plays a big role. But I would bet they would buy a font they pretty much like for $20 before they would buy a font they absolutely love for $200. Unless they are using "house money" as we used to call it in my stock trading days.  That is, if they are given a budget by their employer and are not spending their own cash.</p>
      <p>I believe there must be a critical mass price point in this market.  Just not sure what it might be.... $20? $30? 5$</p>
