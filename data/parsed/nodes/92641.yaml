      <p>Monotype's 2011 annual report states they had creative professionals revenue* of roughly $31,556,000.</p>
      <p>Now the question is, how much of a market share does MT have in this area? A lot of their sales (and growth in creative professionals revenue) is from non-web, direct to corporate customer sales. I take they own a very large share of that market, but am unsure about the web retail market. Given that they own fonts.com, this will also be a decent chunk. But Myfonts.com is of course not yet on their balance, given they only acquired it in 2012.</p>
      <p>---</p>
      <p><img src="http://thierryblancpain.com/files/grabup/dp/sazvqrwu0wos8.png"></p>
      <p>* "We derive revenue from two principal sources: licensing our text imaging solutions to CE device manufacturers and independent software vendors, which we refer to as our OEM revenue, and licensing our fonts to creative and business professionals, which we refer to as our Creative Professional revenue."</p>
      <p>MT's 2011 Annual Report is available on their corporate website.<br>
      ---</p>
