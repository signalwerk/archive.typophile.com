      <p>Nonetheless, I think you’d come out even further ahead if you also sold through distributors. They reach a great many customers who have never heard of Terminal. Font Bureau and Emigre, two of the oldest digital foundries, were slow to adopt the distributor route; I doubt they have any regrets.</p>
