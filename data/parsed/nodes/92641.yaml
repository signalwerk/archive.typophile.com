  html: |-
    <p>I've been wondering recently, what's the amount of revenue of the global type (fonts) market each year? </p>
    <p>This figure would include the revenue of all the indie foundries, of the large players like Monotype, and of resellers like FontShop and MyFonts, webfont services like Typekit, but exclude type-related software products like FontLab or Linotype FontExplorer X. Basically all the revenue that is generated directly through font files.</p>
    <p>What's your guess?</p>
