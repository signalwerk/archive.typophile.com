      <p>I've been thinking about this some more. While MT will earn a lot through royalties themselves, a lot of that revenue will also be their fees for selling through their sales channels. While at first I thought MT had something like 80% of the market, I'm now thinking that it could be more around 60%, especially if custom type projects for large clients are part of the mix – those can have quite the price tag.</p>
