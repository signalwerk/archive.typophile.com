  html: "<p>November 22, 2002 <br> <br>After more than a year - the final code has been typed <br>in - the new Fountain site is finished. We introduce to <br>you a new design, new typefaces and new designers. <br> <br>New typefaces include: <br> <br>Baskerville 1757 by Lars Bergquist <br>Grimoire by Felix Braden <br>Lucifer by Lotta Bruhn <br>Montrachet by Lars Bergquist <br>Monteverdi by Lars Bergquist <br>Sadness by Felix Braden <br> <br>In a few weeks you will also see the release of:  <br> <br>Alita by Peter Hoffmann <br>and <br>Girl by Dirk Uhlenbrock <br> <br> <br>       <br> <br>I hope you'll enjoy the new site. <br> <br>Peter Bruhn <br>[principal designer &amp; owner] <br> <br><a href=\"http://www.fountain.nu\" target=\"_top\">http://www.fountain.nu</a></p>"
