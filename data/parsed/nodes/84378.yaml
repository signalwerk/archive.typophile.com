    html: |-
      <p>Here's what James Felici has to say:</p>
      <blockquote><p>The same thing occurs when character spacing is altered. For instance, if you open up the tracking of a text passage containing ligatures, InDesign will drop the ligatures in favor of their constituent characters and open their spacing accordingly. The same thing happens when tracking is tightened, because otherwise the fixed spacing between the component elements of the ligature would stand out in contrast to the spacing of their neighbors. Ditto for justified type, where spacing has to be stretched or squeezed to fit type into fully filled lines. <strong>When a certain, rather small, spacing threshold has been crossed, InDesign will revert to handling the ligatures’ constituent parts as independent characters.</strong> Hand kerning can also cause ligatures to disappear.</p></blockquote>
      <p>Source: <a href="http://layersmagazine.com/the-art-of-type-ligatures-fusion-power.html" title="http://layersmagazine.com/the-art-of-type-ligatures-fusion-power.html">http://layersmagazine.com/the-art-of-type-ligatures-fusion-power.html</a></p>
