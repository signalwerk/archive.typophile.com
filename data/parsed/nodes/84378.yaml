    <p>So i've been working on my first typeface in fontlab for the last 6 months or so, and I have a quick ligature question.</p>
    <p>I've designed a few simple ligatures, /fi/ /ffi/ /fl/, but was wondering what people do when dealing with tracking of the font in-use? Lets say someone is designing a book with my typeface, and they track out a whole block of text to 20, or maybe -20; all the type will look correct but the ligatures because they have a predefined spacing because it is a specific character.</p>
    <p>Is there any way in fontlab through some fancy opentype coding to tell it, "use these ligatures up until the user changes the tracking past -10, or +10"? Is that just too complicated of a task for an opentype feature? </p>
    <p>thanks!</p>
