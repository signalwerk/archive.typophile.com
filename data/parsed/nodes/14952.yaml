      <p>Your -2- is wonderful. That ampersand is absolute narcissism ... and I love it! The -W- is falling backwards. So is the -s-. So is the -5-, but I think it is because you need to extend the bottom exit stroke by one pixel. The -A- seems a hair too tricky. The -f- seems too short. </p>
      <p>Can you show us another setting of the entire set spaced out a bit more?</p>
