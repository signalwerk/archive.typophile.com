    html: |-
      <p>Miss Tiffany,</p>
      <p>Please take a look at <a href="http://typophile.com/system/files?file=two.gif" rel="nofollow">two.gif</a>. You were absolutely right about the swashy 'W'; it's much better now. As for the 's', the alternatives aren't any better, are they? And is that what you had in mind for the '5'? Because I don't think it works. So doesn't the longer 'f'. Now, what do you mean by <cite>The -A- seems a hair too tricky</cite>? As for the spacing, it's either that loose or dense as it was before; I'm not sure which one is preferable. What do you say?</p>
      <p>Many thanks,<br>
      Ori</p>
