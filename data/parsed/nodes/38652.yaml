      <p>with regard to mr. berkson’s commentary and opinions...</p>
      <p>If typing in lowercase is an issue for the majority on this forum, I will gladly compromise. Let me clarify that I’m not looking for degradation or a “flame war.” I really do want feedback. This forum was recommended to me by a professor for research purposes - as a tool.</p>
      <p>I’m not asking anyone to do my “homework” for me. I’m  interested in thoughts, opinions and suggestions. I want to learn. I understand that at this venue in my career, I don’t know as much about typography as a middle-aged individual who has dedicated their life to design.</p>
      <p>Back to the subject at hand...</p>
      <p>Thanks in advance for any contributions, I really do appreciate it. I am in talks with the head of  “special collections” at my university library, which is also proving helpful. He is the only mentor I have right now, aside from my type instructor.</p>
