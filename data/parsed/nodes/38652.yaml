    html: <p>Agreed. Call me limited, but I cannot imagine a more practical and efficient communication tool than the alphabet. I’d like to see English spelling become more phonetic and logical, but that would take one serious bit of house cleaning, and everyone would have to be on board...or maybe that’s evolving right now in the world of instant messaging (something else I know nothing about!). Finding a way to incorporate and convey tone and tempo might be nice, seeing as that’s what people tend to have problems with when communicating with strangers over emails and in discussions like this. So, like economics, think about what the demands are, or will be, and start the forecasting there.</p>
