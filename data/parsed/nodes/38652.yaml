    html: <p>Find a library that has issues of Emigre magazine and read them. Fuse magazine will be harder to find, but seems quite applicable here. You should also read Gerard Unger’s book <em>While You’re Reading</em>. It is not directly relevant and will not answer any of your questions, but it will give you a great foundation in understanding what type and reading are, and why they are what they are, which will make it easier to think about where it’s all headed. Last, contact Nick Shinn about his essay <em>It’s Hip to Be Square</em>. It’s a great read about why traditional type designs will become less relevant and new type will be square.</p>
