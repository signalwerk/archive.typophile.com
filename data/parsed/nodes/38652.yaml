      <p>I highly suggest you absorb mr. Martin Venezy’s written thoughts called “Design and Melancholy.” You can find this essay in his amazing book “It is Beautiful ... Then Gone.”  [ along with the most impressive hand-made typographic experiments I have ever seen. ]</p>
      <p>In great depth and consideration, it ponders the simple moments of our lives when we find an arrangement of things, circumstances, interactions, and / or ideas that appear in a fleeting instance as perfectly designed — as if beyond human capability — and then are just as quickly gone from our perceptions. Within that moment, pure beauty is realized in the simplest of forms and it is in this realization that we, as designers, can create the kind of conceptual wonders that you are aiming for. </p>
      <p>martin’s design studio can be found here :: <a class="freelinking-external" href="http://www.appetiteengineers.com/"> Appetite Engineers </a></p>
