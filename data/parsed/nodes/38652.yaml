      <p>The opening chapter of David Consuegra’s <em>American Type Design &amp; Designers</em> (Allworth Press) provides an excellent time-line of the technological changes in typography, with related events.</p>
      <p>Text usually seems to be at the vanguard of new media technology, due, I think, to the alphabet’s low “bit-rate” of information required for meaningful communication. So although we may develop more sophisticated ways of communicating with existing technologies, as long as we are inventing new media it will depend on text from the outset.</p>
