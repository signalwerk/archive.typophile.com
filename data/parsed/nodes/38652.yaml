    <p>written language is how human beings store and communicate information. it seems like there is no other way... i’m very interested in the radical directions typography could take in the near and distant future. are we always going to use glyph-based forms? how will type be presented in a world that is becoming more and more technologically-dependent? will text always exist? these are questions i ponder.</p>
    <p>in short,  i’m trying to build a bridge between technological progress/evolution and typography. i will also be contacting futurists/singulatarians and typographers as part of my research.</p>
    <p>i’m looking for feedback - opinions, thoughts, contacts, essays, lectures etc. i realize my sketch is  very broad. anything goes.</p>
    <p>i’m a young college student in my first year of graphic design, and i’m trying to collect an archive of information so i can build a conceptual font hybrid [as opposed to a purely aesthetic font]. i’m struggling with how i can <strong>visually</strong> manifest letterforms based on the concepts that interest me. as of now, i have found very little relative literature. blogs seem like a good alternative.</p>
    <p>whatever you can offer will help, i assure you!</p>
