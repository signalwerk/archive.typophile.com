      <p>In some ways text is more efficient than speech—more easily stored and searched, arguably easier to render decipherable—and in fact you can already see it encroaching on verbal communication. It might be an issue of not quite having reached the tipping point here, but why do people still use IM with the advent of things like Skype or other “internet phone” applications? </p>
      <p>Think: have you ever seen someone send a text message when they’re perfectly free to call someone? Or seen someone shoot off an email when they could just shout over the cubicle wall?</p>
