    html: |-
      <p>In <em>Alphabets to Order,</em> Alastair Johnston notes that the classic type specimen text (Quousque tandem abutere etc.) was in Latin, without the diagonals, and hence, as he termed it, IIRC, "prime beef".</p>
      <p>Another "cheat" in the old specimens (and one which I am presently reviving!) was to set justified copy, but without hyphens, and without even breaking words in the correct place, which produces nicely even text.</p>
