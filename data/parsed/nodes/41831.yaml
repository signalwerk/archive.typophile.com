      <p>In general I don't think these extra sorts were to introduce randomness at all. Quite the opposite. I think they are there to produce a deliberately better optical fit. John, your theory may be right. It sounds pretty plausible. There is not a TON of difference in the i shapes. And if they didn't take the precaution Craig imagined then they might easily have been mixed.</p>
      <p><cite> Might this have been a kind of compensation for the improved consistency in the casting technology? </cite> I don't think that was the idea. But I also don't think introducing a gentle noise into the forms would be an utterly bad idea. I think some gentle variation is pleasant for the brain/eye.</p>
