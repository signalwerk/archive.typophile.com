      <p>For the alternate 'f' in the 1913 Bremer Presse I do have a possible idea.<br>
      The second one with the longer crossbar might have been used at the end of words.</p>
      <p>I came to such a design decision in one of my font concepts (not digitalised [yet?]) as a contextual alternative (i.e. giving the f a longer crossbar before space, period and comma for better balance). -- And I guess I was not the first one to have this idea (while I did not see it anywhere else before).</p>
      <p>Investigating the actual use of the 1913 f-s would be interesting!</p>
