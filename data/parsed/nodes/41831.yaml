  html: <p>Anybody know a Bremer Presse font with the alternative "r" and "e"? I was reading about Blumenthal's font Spiral (Later Emerson with monotype) which, before Monotype sold it, had an r with a short arm and another with a long arm. But in the book it mentions that Blumenthal was very influenced by ideas about paper and type that were in vogue at the Bremer Presse. And that the Bremer Presse had a font with the alternative "r" and "e". The book is called "American Proprietary Typefaces", and the section was written by Jerry Kelly. Actually if anybody has info on how to contact him that would be great too.</p>
  html_clean: <p>Anybody know a Bremer Presse font with the alternative "r" and "e"? I was reading about Blumenthal's font Spiral (Later Emerson with monotype) which, before Monotype sold it, had an r with a short arm and another with a long arm. But in the book it mentions that Blumenthal was very influenced by ideas about paper and type that were in vogue at the Bremer Presse. And that the Bremer Presse had a font with the alternative "r" and "e". The book is called "American Proprietary Typefaces", and the section was written by Jerry Kelly. Actually if anybody has info on how to contact him that would be great too.</p>
