      <p>Eben: <em>It would be great if somebody would quote us a title so we could get ahold of it and see this face at work.</em></p>
      <p>The two Bremer Presse volumes I have, one about the press and one publication of the press, are <em>Die Bremer Presse: Königin der deutchen Privatpressen,</em> 1964, and <em>Albii Tibulli: Elegiae</em> 1920. The latter is set in the 16pt type, with elegant initial letters and titles by Anna Simons, who did a lot of work for the Bremer Presse.</p>
      <p>A quick perusal of the latter book indicates that the variants of i were, in fact, interspered freely, and not used contextually. It would be interesting to compare this setting with earlier use of the type, including initial specimens if available, to see whether the different i characters were originally contextually selected. Maybe they were, and Wiegand later decided that it wasn't worth the trouble.</p>
