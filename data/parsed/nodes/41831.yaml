      <p>Thanks very much! This is terrific.</p>
      <p>These examples are quite wonderful. What I am struck by is the multiple t glyphs with their various cross bar lengths. They make a great deal of sense to me. I agree the double i makes sense as well in the context you mention. As do the double f's and perhaps especially the a's. The a corresponds very nicely to what I have seen H. Zapf do in his calligraphy, and 15th century scribes do as well. </p>
      <p>In the book I mentioned above it was stated that the long r in Spiral was supposed to be set to make an over-lose justified line set better. The example I saw didn't suggest that to me at all. Instead they seemed to use the long r as a calligrapher would; setting it at the end of words. The short one was used next to other letters on the right. John, have you see the seen the book I an talking about? If not, would like to see the Spiral?</p>
      <p>I have requested the book shown in the sample ( RW Emerson's "Nature") but I don't know yet if I get get it. </p>
      <p>Interestingly Erik S talked about the utility of the ck &amp; ch glyphs shown in the same here. Also there are two kinds of them. That have to be for a reason. I would like to see why they are so useful in general and why they would require two kinds. Maybe it was for cultural/linguistic reasons rather than optical ones. At the moment I don't have enough insight into that.</p>
      <p>It niggles at me that “American Proprietary Typefaces” is very clear about a second e but none is here. Could this be an incomplete showing? Or an early one; prior to the second e? Could there be another Bremer Presse type font/face with that feature?</p>
      <p>It would be great if somebody would quote us a title so we could get ahold of it and see this face at work. Maybe we could get Dan to find one in Germany or Paul to dig one up at Reading...</p>
