      <p>oops. optical justification, not scaling.<br>
      The Bremer Presse by design restricted the number of Fonts they used. A Folio page (Bible, Tacitus) could take a day to set, and these were the most skilled typesetters in their Time.<br>
      The BP was a private Press in the true sense of the word, as it was not a commercial enterprise, if you look at the Cranach press and how financially draining it was on Kessler, you get an idea about the BP.  Fritz Krinitz (Frieda Thiersch und ihre Handbuchbinderei) worked with Frida Thiersch at the BP.</p>
