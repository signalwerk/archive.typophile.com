      <p><em>do you know of any precedent in metal type of designed alternates intended to be mixed in, presumably to give the printed copy a more varied, perhaps handlettered appearance?</em></p>
      <p>William Dana Orcutt, discussing the design of his Humanistic type in <em>In quest of the perfect book,</em> writes 'I decided to introduce the innovation of having several characters for certain letters that repeated most frequently, in order to preserve the individuality of the hand lettering, and still keep my design within the rigid limitations of type'. I'm not sure when the Humanistic type was first used, but Pankow's <em>Proprietary American Typefaces</em> shows a setting from 1906. Here is a sample from Orcutt's book:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/OrcuttHumanistic_6246.jpg"></div><p></p>
