    html: "<p>The Gutenberg 42-line Bible also shows evidence, as explained by Hermann Zapf, of variant letters as an aid to justification: letters of different width are used to maintain consistent letter and word spacing. Zapf had the idea to do the same thing dynamically, by intelligently scaling glyphs horizontally without distorting them or changing stem weights. This was implemented by URW as part of the Hz text layout engine, but not currently active in any shipping software, so far as I am aware.</p>"
