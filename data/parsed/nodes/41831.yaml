  - id: 261460
    user: 2942
    date: 2008-02-25T11:49:00
    date_raw: 25 Feb 2008 — 11:49am
    votes: null
    html: <p>Agreed. And I think that's why with narrower spacing more standard you see the narrower type of r become dominant in the 20th century. Of course if you take this too far the r ends up too narrow and it's saliency is reduced. I have seen some fonts where this is clearly a problem. Also how you space the letters will determine the ideal shape of the arm of the r. Unfortunately there is no script to let the arm shirk or expand with setting. But clearly a wider setting would make a wider arm feel better or more acceptable. Also when you have an r at the end of the word there cannot be too much white space because there is no next letter, and the full sized arm on the r looks and reads the best I think. That is what I think the example of Spiral above shows.</p>
