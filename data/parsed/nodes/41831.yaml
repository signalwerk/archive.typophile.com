    html: <p>I got a xeroxed copy of the setting Of Emerson's Nature with Spiral yesterday. Absolutely contrary to what was stated in APT the use of the long "r" is exclusively at the end of words. The short r is used inside words. What I am not seeing is the long &amp; short "r" used to help justify a line. It's use might be different later but this was it's fist use and I think the full measure of zeal and intention in it's use by Blumenthal is likeliest here. Moreover it works extremely well which is gratifying to me because my theory of contextual shapes ( and scribal tradition ) predicts this use rather than the use suggested by APT.</p>
