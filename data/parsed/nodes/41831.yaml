      <p>As far as I know, no one has made a digital version of the Bremer Presse type designed by the printer publisher Will Wiegand. If someone has, I think I might prefer not to know about it, because I quite like the idea of private press typefaces remaining what they were -- the exclusive working tools of the people who made them or commissioned them to be used in very particular ways in specific books.</p>
      <p>I have a couple of Bremer Presse books, though, Eben, and have scanned the 1922 12pt roman, which includes the variants to which you refer. I had not noticed this feature of the types before, so thank you for drawing my attenion to it. Interestingly, only the 12pt has them: the 1924 11pt does not.</p>
      <p>The differences between the variants are quite subtle. I'm afraid I would need longer to track down examples of the individual variants in use, so we could determine in what contexts they were used.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bremer12_3906.jpg"></div><p></p>
      <p>In the earlier, 1913 16pt there are variants for a f i and t, but not for r. The variant i is particularly interesting: the difference is in the size of the dot, and I'm guessing that one is for use after the non-ligating f. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bremer16_6743.jpg"></div><p></p>
      <p>There are also similar variants in the eccentric Bremer Presse Greek type.</p>
