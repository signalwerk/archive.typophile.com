    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Jim Ford</strong></p>
    <p>Jim Ford (b. 1981)</p>
    <p>Jim is a type designer with Ascender Corp. and a graduate of Columbia College in Chciago, He has also started his own foundry, VersaType, to market his own type designs.</p>
    <p>"I like to think of typefaces as voices for the content they are presenting. In some cases, they are merely gladiators, trained to fight the forces of less-than-perfect conditions. Type is [not only the most effective, but also] the primary vehicle for visual communication. Thanks Gutenberg!" - Jim Ford</p>
    <p>Font families currently in production for VersaType include: Kingston, Magneticus, Coggeshall, Ford Sans and Ford Serif</p>
    <p>Related Links<br>
    <a href="http://www.myfonts.com/foundry/versatype/" title="http://www.myfonts.com/foundry/versatype/">http://www.myfonts.com/foundry/versatype/</a></p>
