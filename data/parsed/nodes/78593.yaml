      <p>Thanks cerulean, I'll try that and see how it looks (I've been working on a copy in case I end up liking the original better).</p>
      <p>Nick, everyone keeps saying that! I'm actually a right-handed girl, but I tend to really crank the paper to an angle before I write on it, so that backwards slant results. I didn't even realize I had a backwards slant until I tried to digitize it, and it was hard as heck not to try to *fix* it as I went. Which is why I was afraid to tweak much more. Thanks for the advice on overworking :)</p>
