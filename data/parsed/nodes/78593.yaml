      <p>Relax; mine is only one opinion, and it is perfectly reasonable to solicit others before doing anything. Goodness knows I don't hurry to follow every bit of advice I get.</p>
      <p>I see how this change may be stiffening up the G and losing some of the natural look of your handwriting. To get it back, I think the curve could <em>lean</em> forward to that point without having to <em>bend</em> so much, if you see my meaning. You could try using the curve of the C as a guide.</p>
