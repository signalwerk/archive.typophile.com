      <p>Very feminine, indeed.<br>
      It’s nice how the letters connect so naturally!<br>
      To me, your /X/ stands out a bit – even more if compared to the way you write your lc x, but who am I to judge your handwriting … :)</p>
      <p>And, as Nick said, overworking would kill the spontaneity.</p>
      <p>Edit: It’s funny – usually the geometry and evenness of the lines give away that it is a font. But your writing is very balanced and even in colour so it works quite well IMO.</p>
      <p>I’m wondering if the space is slightly too big compared to ‘real’ handwriting?</p>
