  html: '<p>Finally, somebody did it: put together all the detritus from the past 15 years in one place so we can perform one godzilla-grade puke and get it over with: all the gridcrap, handshit and photophlegm you could even want, page after page after crap after crap after page after page... <br> <br>"Type 1: Digital Typeface Design" (Nathan Gale) <br><a href="http://www.amazon.com/exec/obidos/tg/detail/-/0789306883/qid=1037851833/sr=1-10/ref=sr_1_10/102-0039778-0392961?v=glance&amp;s=books" target="_top">http://www.amazon.com/exec/obidos/tg/detail/-/0789306883/qid=1037851833/sr=1-10/ref=sr_1_10/102-0039778-0392961?v=glance&amp;s=books</a> <br> <br>The very very very few good ones are like a cold Westmalle to a poor slob stuck in the Texan desert - Tonnage, Jude, Zebugrades forming the majority. <br> <br>hhp</p>'
