  html: |-
    <p>Hi There,</p>
    <p>Is there any Linotype expert over there who can help me a little?</p>
    <p>One of our clients at Smidswater need to buy an OT version of Helvetica with the characters for ALL european languages.<br>
    We need also a good set of versions.</p>
    <p>The Linotype versions I had the opportunity to check support only Latin1, cyrilic and some extra accents, but not all the necessary for Central European texts.</p>
    <p>Thanks in advance.</p>
    <p>Ramiro Espinoza.<br>
    <a href="mailto:ramiro.espinoza@smidswater.nl">ramiro.espinoza@smidswater.nl</a></p>
