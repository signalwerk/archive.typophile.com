  html: "<p><b>FontShop Keyword Update #23 - ATypI/Prague trip announcement</b> <br>-------------------------------------------- <br>  <br>Hello Fellow Keyworders. <br> <br> Today we are announcing the winner of the Prague trip!  <br> <br>CONGRATULATIONS to IVY SHEN!  <br> <br> She is the proud winner of a fabulous trip to Prague for the ATypI Conference. She's never been to this conference so this will be a treat.  <br> <br> We will also ship a \"Stop Stealing Sheep\" book to each keyworder who committed to the 250 minimum. If you didn't finish the minimum, it was not your fault...we ran out of fonts and you'll still get the book.  <br> <br>Please make sure to send an email to me (<a href=\"mailto:joanna@fontshop.com\">joanna@fontshop.com</a>) with a shipping address where you can receive a package delivered via UPS.  <br> <br>Please contact <a href=\"mailto:david@fontshop.com\">david@fontshop.com</a> for any remaining kw rewards you would like to cash in on. Give him some time to respond, he may get slammed with emails. If I've forgotten anything, you'll hear from me again next week. Otherwise, we're wrapping up the project and calling it a day!  <br> <br> kind regards from SF,  <br> Joanna</p>"
