    <p>Hi All,<br>
    I am really struggling.....I am designing wedding stationery for a lady who loves Geosans light and desperately wants her heading text, extra large in it. However, I am really struggling with a body text pairing. Her design is very stark and modern. Any ideas? Thanks so much</p>
