    html: <p>Yes, typographic space. US postal systems are tricky. Some go through and some dont even if it does violate the system. Also think of whatever medium you are using as an opportunity. Use both sides of the business card for better pacing. Use the inside of envelopes for wild patterns or hidden messages.</p>
