    html: <p>Better, but still needs work. the guy is still scary. I would try outlining the figure instead of coloring him in. That could resolve a lot of issues. Also, the rounded rectangular line is annoying me. Its not needed and doesn’t help in any way. I would somewhat understand the relationship if the printed medium (card, letterhead) was also round. Your name running vertically is also strange. Again, you dont use it anywhere else. Set up relationships between each element and carefully think the hierarchy out. Its not so easy is it?</p>
