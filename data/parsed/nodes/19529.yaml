    html: |-
      <p>I’m appreciating your input. Retro technology, retro office, folder tabs, etc. these are all parts of the idea. I have seen too much focusing on the keyboard keys though. I feel like that has been thoroughly digested by even stock photography at this point.</p>
      <p>Now I’m really looking at the image, and having to explain, so that is a real negative. I wish I had a couple more opinions. The image is Pam and myself with vintage camera/typewriter replacing our heads. I think it is valid to call this scary, but it seems like it simply is not reading for you. It may be the way I’ve presented it here.</p>
      <p></p><div class="imageWrap"><img src="/files/Image_6384.jpg"></div><p></p>
      <p>What catches me off gaurd is that, for me, this is humorous.</p>
      <p>Jenifer Sterlings work is wonderful. In my situation, I do believe that many of my potential clients could be turned off by something this deconstructed. I think I may work with a radial sub-composition structure though, because I think this might work well. </p>
      <p>Look at this work. See how there is a constrained context and a formalism that is very imposed?<br>
      <a href="http://store.mcsweeneys.net/index.cfm/fuseaction/catalog.list/object_id/625A37B0-2E23-4472-A99B-E39BB0FED607/Periodicals.cfm" title="http://store.mcsweeneys.net/index.cfm/fuseaction/catalog.list/object_id/625A37B0-2E23-4472-A99B-E39BB0FED607/Periodicals.cfm">http://store.mcsweeneys.net/index.cfm/fuseaction/catalog.list/object_id/...</a></p>
      <p>I want to look in that direction without nailing everything down so tightly, rather  than blowing everything up and working like a painter.</p>
