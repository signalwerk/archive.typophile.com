    html: |-
      <p>I have to admit this is one occasion that a pdf might have been more useful, because until now I had thought it was only one figure with a typewriter on his shoulder and a camera for a head. I have to say that I don’t like the type on the illy, it seems unnecessary, I think you could look at separating the two figures slightly, or at least increasing the weight of the strokes and making the clear area between your shoulder and the typewriter white. You could also look at reducing some of the texture or making one figure have texture and the other not or using the tints in your pallette and running the colour over or short of the strokes slightly more. Pallette is a good choice but it is kind of difficult to assess the type.<br>
      I cannot help with the envelope, the rules for Royal Mail are bound to be different to US Mail.<br>
      Tim</p>
