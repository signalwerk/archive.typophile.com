      <p>Good layout. Nice colors. Work on hierarchy of the information more. You could add more negative spacing for more elegance + better visual balance. The character looks a bit scary at the moment. On the envelope I think its a bit large. And too much information. Use the envelope as a hint or a lead in. Think of it as telling a story. Check out this guide.</p>
