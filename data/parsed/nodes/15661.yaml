  html: |-
    <p>Corporate Type Solution by <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>. A family of four typefaces, whose characters share the same metrics across each of the four families (a sans serif, a slab serif, a baroque serif, and a renaissance&nbsp;serif).</p>
    <p>Compatil can be found on the <a href="http://www.linotype.com">Linotype website</a>. Here is the direct link to the <a href="http://www.linotype.com/94405/compatilfontfamilygroup-clan.html">Compatil font family overview</a>. Compatil is part of Linotype’s <a href="/node/15662" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Platinum Collection</a>.</p>
