    <p>I am stuck! I always find it hard to create a good logo consisting of three words.<br>
    i was intending to go for a wordmark, but the client insists on having a depiction of a starfish in there! (which is easily to be mistaken with a star).</p>
    <p>so we have a symbol and three words!</p>
    <p>refresh me with ideas/suggestions or simply blame me for being creatively stuck.</p>
