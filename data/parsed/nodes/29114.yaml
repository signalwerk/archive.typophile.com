  html: <p>In preparation of my print portfolio, I'm considering in using a sans together with my serif of choice, Relato Serif by Emtype.net. It's too bad that Relato Sans isn't out yet. I'm open to any suggestions to pair Relato Serif together with a Sans. Cheerio.</p>
