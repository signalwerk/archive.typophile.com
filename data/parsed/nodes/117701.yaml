    html: <p>Pretty much what JamesM said. If you need to italicise a word in a bolded paragraph, you need bold italic. Bold is occasionally used in text for "darker spot on the page that you see immediately" emphasis (I do it myself in emails to make them easier to parse, or when a new key term is introduced in an academic paper) but more often in serious typographic settings for entire sections, for instance in newspaper ledes. (And of course for headings, display type, in tables etc.)</p>
