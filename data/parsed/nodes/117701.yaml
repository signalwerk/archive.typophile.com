    html: <p>I'd also like to know  because with some fonts I find that italic does not stand out enough (for transparencies) and bold (or even semibold) is too agressive and the corresponding italic looks more pleasant. My intent is not double insistance. In a mathematical definition, the term that is being defined is normally put in italic.</p>
