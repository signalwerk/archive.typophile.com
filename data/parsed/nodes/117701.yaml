    <p>¶ The digital typefaces designed for text offer a bold and a bold italic weight. Bold italic implies a double emphasis. Why?</p>
    <p>1. Can you elaborate on the use of <em><strong>bold italic<strong></strong></strong></em> in the contemporary world?<br>
    2. Who invents the first <strong>bold</strong> typeface?</p>
