    date: 2008-09-22T09:49:00
    date_raw: 22 Sep 2008 — 9:49am
    votes: null
    html: <p>InDesign translates the f-ligature character values to Unicode in a document if the user typed  them on the Mac or imported them, so they will work cross platform. Likewise, other differences between platform encodings are not an issue because they are always resolved to Unicode. The only cross-platform problem that I remember right now has to do with fonts that don't have the expected CMAPs.</p>
