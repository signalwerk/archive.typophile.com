    <p>Hi everyone,</p>
    <p>I need help with the AFDK tools.</p>
    <p>I have been “designing” fonts for about a half year in FontLab, and I have some work finished (sort of) now, and ready for testing.</p>
    <p>I downloaded the AFDKO and installed the software with the “FinishInstallOSX” dropped into the Terminal.</p>
    <p>My problem is basic... I don’t know how to use Terminal well enough to use the tools now that I have them. I need the five-minute tutorial from someone who might have been through this already. Specifically, I need help with the checkOutlines routine.</p>
    <p>Where to I put the path to the font I want to check?</p>
    <p>(and that sort of thing)</p>
    <p>Thank you in advance.</p>
    <p>Brian</p>
