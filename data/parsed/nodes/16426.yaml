    <p>I am in need of more information about creating and editing bitmap fonts for multiple platforms. </p>
    <p>Softy works excellently for the PC, and Linux has several good programs, but I know of no free (or reasonably priced) font editor for the Macintosh that will either convert or create bitmap fonts.  If you know of one, please let me know.</p>
