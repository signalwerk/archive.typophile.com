  html: |-
    <p>Looking for an aproximate analog or ID on this historic bronze lettering found in the Massachusetts Statehouse. Pictures are from the Spanish American War Memorial in the Massachusetts Statehouse, 'signed' by Calvin Coolidge in 1919.<br><a href="http://www.waymarking.com/gallery/image.aspx?f=1&amp;guid=01d29da6-4427-48ce-a8d6-164acd8085a0">http://www.waymarking.com/gallery/image.aspx?f=1&amp;guid=01d29da6-4427-48ce...</a></p>
    <p>R and W are reminiscent of a "low-contrast Garamond," but it is clearly different, as can be seen with the unicase-style U. I understand an ID is probably unlikely, and this may have been proprietary to the particular artisan/forge/foundry that may have done this, but any help would be much appreciated.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/brass_dimensional_quote_1.jpg" width="1024" height="768" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/brass_dimensional_quote_2.jpg" width="1024" height="768" alt="">
