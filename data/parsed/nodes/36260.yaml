    <p>Here's some samples of a new pointed brush font I've been working on. It's being drawn on the wrong side of Epson photo paper with a Japanese Pentel brush pen and of course redrawn (I do ok with a brush but I'm not that good yet) and edited in Illustrator to create the connections. I've redrawn the upper and lowercase about 5 times now to get to where I'm at. I'm unsure about the L, k, s and z and I'd like some opinions on what everyone thinks about the direction it's going.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pointed_brush_5275.gif"></div><p></p>
