      <p>&gt; <em>The S seems wonky, something just not quite right about it.</em></p>
      <p>Could that be because of the very thin spine?</p>
      <p>I understand that the tool dictates the shapes in this case, but maybe if the weight would be on the spine a bit more, it might look better.<br>
      I think most writing tools put the weight on the 'ears' of the S (because of the angle), so to speak, and that historically speaking, the weight was shifted to the spine, to balance the shape. Or am I mistaken?</p>
