    html: |-
      <p>I like this very much. It has a nice loose flow, but still looks a bit tight - you could easily make the lead-outs a bit longer to get more inter-character space. For a more authentic handwritten look you could also introduce many two or three character ligatures in OpenType, (especially duplicate characters together), and also have some replacement end characters without the long lead-out stroke.</p>
      <p>Nick Cooke</p>
