      <p>Sorry wannab1, it came up with nothing free and convincing. I'm also convinced it'd be very hard to find a free and legal alternative to it, the design is really too specific and I'm afraid you'll find only illegal copies or rip-offs. Talking about illegality, if you finally decide to go with some freebie, come back here again and post your choice, we'll try to find out if it could be used safely.<br>
      Here are some resources you might find useful: <a class="freelinking external" href="http://www.identifont.com/find?similar=Cousin+Beth" rel="nofollow">list of similar to Cousin Beth</a> compiled at Identifont, <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/list/category/Decorative" rel="nofollow">Decorative</a> section and <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/list/category/Curly" rel="nofollow">Curly tagged fonts</a> at Fontsquirrel, <a class="freelinking external" href="http://www.google.com/fonts" rel="nofollow">Google Web Fonts</a> directory, <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=105" rel="nofollow">Curly section</a> at DaFont</p>
