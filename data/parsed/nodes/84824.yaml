      <p>Fábio: ‘<em>Frank Blokland designs this beautiful cover. [...] But this typeface was design by him?</em>’</p>
      <p>The letters on the cover (also on the back) are mine indeed, but actually Gerrit Noordzij designed (and edited) this <em>Lecturis</em> edition on type design by Dutch graphic design students. The letters I made as a student were placed on the cover at the original drawing size (by hand at that time, of course). The backside of the cover shows a very large lower case g (roughly ten inches), also from my hand. The types on right page of the last spread show type designs I made as a student too (thirty years ago). I ﬁnished some of these, but I never published them, because I did not consider them to be good enough.</p>
      <p>FEB</p>
