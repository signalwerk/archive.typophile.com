      <p>Frank Blokland thanks!</p>
      <p>In my (inexperienced) opinion, when I saw the cover, what I really consider super super <em>'good enough'</em> was that serifs and the contrast in the upper shoulder of the 'f'; these details catch my eyes at once. I never saw the back side of the cover, because the it is out of stock and sold. But I really love to see that 'g', and of course the whole family: even <em>"not…good enough"</em></p>
      <p>Again: Thanks a lot for answer me.</p>
