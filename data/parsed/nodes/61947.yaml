    html: <p>Christopher, if a thread goes in a direction that you think gets away from the original topic, while leaving some things on that topic unsaid, I think you need to re-strike the original topic, not just provide a new thread. In other words, it would help if you were to identify those aspects of the previous discussion to which you would like to return.</p>
