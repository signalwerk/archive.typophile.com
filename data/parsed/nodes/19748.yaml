      <p>Hey,<br>
      If its just for fun, you would want to print it in cmyk. I dont think that a printer would print process colours unless its above 1000 units. And with all those colours, it is expencive.<br>
      That said, I really like the idea and fonts. I agree with Timid, and maybe have it like:</p>
      <p>758 Terrace St<br>
      Santee CA,<br>
      99960</p>
      <p>803-670-9014</p>
      <p>Just a suggestion. But it is a good idea to have the address follow the invisible line of the "L". Also you might check that the stars are not geeting in the way of the readability of "erin ferrell's".</p>
      <p>Hope it helped, and good luck.</p>
      <p>&gt;ER</p>
