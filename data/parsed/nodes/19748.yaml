    <p>Hi guys:</p>
    <p>There is so much about design I have yet to learn. I just play with graphics on my mac but I would like to take it to the next level some day. </p>
    <p>Here is something I'm playing with. A business card for a friend... just playing around... she does not own a business nor is she even black...hehehehe.  Its cute and that's why I like it. </p>
    <p>I think there is something wrong with the address placement. Perhaps there may be a scale problem too with some of the stars.</p>
    <p>Tell me what you think.</p>
    <p>Thanks,</p>
    <p>Mikey</p>
    <p>PS... sugar, spice and everything nice was the inspiration.</p>
