    html: |-
      <p>I would make the Erin's name larger and check the kerning especially the apostrophe s. It is reading CUNIC to me, you could kern out the first I and even have it hanging off the R's vertical and adjust the INI kerning so it is equal while tightening the RO. Since you are making things align in AFRO CLINIC you might align the address with that, for example on the vertical of the L. As for the stars a more varied scale could help the movement and try having some come from behind the figure and type. The figure's neck is bothering me as well there is a triangular shape, presumably a collar, that is not working as a silhouette and her right earring looks quite large. Nick's point about the colour is worth bearing in mind because unless you are having that printed in  spot colour, I counted 7 (which will be expensive, even if you can find a printer that has the capacity to do that), four colour process doesn't handle purples and oranges that well, I suppose you could go Hexachrome (which will also be expensive).<br>
      Tim</p>
