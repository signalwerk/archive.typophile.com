    html: |-
      <p>The KENICHI lettering looks hand-drawn as you guessed, but you can find many similar styles by looking for childrens lettering fonts, or brush-drawn fonts.</p>
      <p>The place names sans at the bottom is too small to see well, but the high M crotch is not too common. If you could describe the G it might be easier to guess some possibilities.</p>
      <p>- Mike Yanega</p>
