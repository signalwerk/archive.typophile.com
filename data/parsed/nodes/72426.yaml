      <p>The nick is a result of the specific body mold used in casting the type. Type foundries commonly used differing nick positions and multiple nicks to indicate a specific face, thus distinguishing among multiple sizes of a face such as Copperplate Gothic or Engravers Roman which had several sizes of Caps on the same size body. The nick commonly also was specific for a specific face, so wrong font characters could be noticed easily while setting. Since it was the set-up of the mold that determined the nick arrangement, variations occured as various foundries changed their equipment and procedures. Also, the mold normally used in Monotype casting machines had only a single position for the nick, so different Monotype faces and multiple sizes such as Copperplate often cannot be distinguished or sorted by this mark.</p>
      <p>The nick almost always indicates the bottom position of the typeface design, thus allowing a visual check as type is hand-set in the composing stick with the nick facing up (with the typeface upside down but reading left to right as it is set). The only exception to this is when a type might have been cast upside down on the body due to some peculiarity in the matrix or design - I have one font of Hebrew type, for example, which has the nick at the top side of the letterform, and a couple of European fonts, and a couple of 19th century oddities resulting from use of old matrices to fit on more recent body molds.</p>
      <p>The groove on the foot of the type results from the spew where the metal flowed into the body mold, which must be broken off and trimmed. The Monotype caster cuts this jet off flat, so there is no groove on monotype though there may be air bubbles in the casting that leave a pattern where the groove would be. Most foundry type has a groove in the center between the feet. Type cast on a Thompson caster often has the groove closer to one edge on the foot, though that machine could be adjusted to cut the groove in the center to look like other foundry type. The depth and shape of the groove is immaterial although it would indicate a differing machine or plough was used to cut the foot of that type, thus suggesting it was cast at a different time.</p>
      <p>These markings are useful indications that something may be amiss in setting type, but variations and contradictions occur. They are consequences of the various possible ways type may be cast, and are part of the compositor's awareness though not always reliable.</p>
