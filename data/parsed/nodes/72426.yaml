      <p><em>I'm under the impression that the Nick is simply a visual and tactile reference when working with type, and its size, shape and general orientation or height on the Belly are not specific?</em><br>
      From what I can tell, this is correct – in my (limited) experience, the nick differs between fonts in order to visually determine whether or not all the characters being composed in a line are indeed from the same family. An example I can cite is when I was typesetting last week and inadvertently mixed up a 12pt Bodoni with the 12pt Walbaum I was setting my lines in – a quick glance at the nicks plainly showed that one character in my line was not of the same font. It could very well be that there is some kind of system that determines where the nick is located, but I can't seem to find any from working with metal type. The only pattern I can discern is that it tends to be in the top half of the character.</p>
      <p><em>As for the Groove, is there a contextual consistency held within each font, or are the ways of determining it's impression depth and orientation between the Feet?</em><br>
      Like the nick, it seems that the groove can differ between fonts, but within the same font it stays consistent.</p>
      <p><em>Need measurements for the profile of a metal type body at 30pts</em><br>
      I can grab a photo of all the sides of a piece of 30pt next to a pica stick for you this weekend if you'd like. Get in touch and let me know if you'd like a specific face; I'll do my best to accomodate.</p>
