    <p>It pains me to post this, but having no practical experience with metal type, I find myself in a quagmire... I'm looking for general information and specific/general measurements if they exist.</p>
    <p>The Long:<br>
    I'm building a model of a metal type form. I'm under the impression that the Nick is simply a visual and tactile reference when working with type, and its size, shape and general orientation or height on the Belly are not specific?</p>
    <p>As for the Groove, is there a contextual consistency held within each font, or are the ways of determining it's impression depth and orientation between the Feet?</p>
    <p>My model is being made as if it were a 30pt piece.</p>
    <p>The Short:<br>
    Need measurements for the profile of a metal type body at 30pts</p>
    <p>Any help or advice is appreciated.<br>
    -Brock</p>
