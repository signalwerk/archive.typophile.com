    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Myriad</strong></p>
    <p>A <a href="/node/79593" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Humanist</a> <a href="/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sans serif</a> design that was the product of the collaboration between <a href="/node/16060" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Robert Slimbach</a> and <a href="/node/16061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Carol Twombly</a>with <a href="/node/add/wiki?edit%5Btitle%5D=Fred%20Brady" title="Create node &quot;Fred Brady&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fred Brady</a> <span class="amp">&amp;</span> <a href="/node/16057" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Christopher Slye</a>. Myriad was orignally released in <a href="/node/add/wiki?edit%5Btitle%5D=1992" title="Create node &quot;1992&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1992</a>.<br>
    A prominent use of this typeface is by <a href="/node/add/wiki?edit%5Btitle%5D=www.apple.com" title="Create node &quot;www.apple.com&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Apple</a> (it is actually Myriad Pro Semibold).<br><img src="/sites/default/files/old-images/myrdpdh100806_4781.gif"><br>
    A comparison of the principal differing characters in Myriad and Frutiger*.<br>
    * This is actually Bitstream’s Humanist 777, which is based directly on the Frutiger&nbsp;typeface.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/28518">Adrian Frutiger on&nbsp;Myriad</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://en.wikipedia.org/wiki/Myriad_%28typeface%29">Wikipedia:&nbsp;Myriad</a></p>
