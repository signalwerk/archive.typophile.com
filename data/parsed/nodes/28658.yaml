    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Myriad</strong></p>
    <p>A <a href="/wiki/humanist" class="freelinking" rel="nofollow">humanist</a> <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> design that was the product of the collaboration between <a href="/wiki/Robert%20Slimbach" class="freelinking" rel="nofollow">Robert Slimbach</a> and <a href="/wiki/Carol%20Twombly" class="freelinking" rel="nofollow">Carol Twombly</a>with <a href="/wiki/Fred%20Brady" class="freelinking" rel="nofollow">Fred Brady</a> &amp; <a href="/wiki/Christopher%20Slye" class="freelinking" rel="nofollow">Christopher Slye</a>. Myriad was orignally released in <a href="/wiki/1992" class="freelinking" rel="nofollow">1992</a>.<br>
    A prominent use of this typeface is by <a href="/wiki/www.apple.com" class="freelinking" rel="nofollow">Apple</a> (it is actually Myriad Pro Semibold).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/myrdpdh100806_4781.gif"></div><br>
    A comparison of the principal differing characters in Myriad and Frutiger*.<br>
    * This is actually Bitstream's Humanist 777, which is based directly on the Frutiger typeface.<p></p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/28518" rel="nofollow">Adrian Frutiger on Myriad</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://en.wikipedia.org/wiki/Myriad_%28typeface%29" rel="nofollow">Wikipedia: Myriad</a></p>
