  html: "<p>this is continued from: <br><a href=\"http://www.typophile.com/cgibin/show.pl?30/67250\" target=\"_blank\">http://www.typophile.com/cgibin/show.pl?30/67250</a> <br> <br>The paper at this link: <br><a href=\"http://www.kringelbach.dk/papers/NI_Pammer2004.pdf\" target=\"_blank\">http://www.kringelbach.dk/papers/NI_Pammer2004.pdf</a> <br>takes the discussion of the 'visual word form area' referenced in my _Typo#13_ contribution significantly further than McCandliss, et. al., (see my footnote #32). The interesting results, from a perceptual processing in reading point of view, are on pdf page 3 (1821). The 'discussion' is framed according to a 'letter recognitional' model of word recognition, so my conclusions--favouring a more direct 'visual wordform resolutional' model--might look somewhat different than those of the authors. But I post this here, because the 'understanding reading' discussion Hrant champions must be engaged at this level if we want to go beyond 'intuitive confidence' to 'grounded beliefs'. <br> <br>Also important to this end might be the paper at this link: <br><a href=\"http://www.psy.vanderbilt.edu/faculty/palmeri/vita/pwg04-tics.pdf\" target=\"_blank\">http://www.psy.vanderbilt.edu/faculty/palmeri/vita/pwg04-tics.pdf</a> <br>The paper provides a nice map of the presumed stages of visual information processing (and an interesting chart of 'representational changes' occurring with the development of perceptual expertise).  <br>I include the link because of Hrant's earlier comments about where Kevin, Hrant and I stand in relation to each other. As I understand it Hrant differs from Kevin and myself in placing much (about 66%) of the burden of perceptual processing in reading on the far right path (relative to parafoveal material). Kevin and I take a greater interest in what happens on the left path (heading off of the retinal image) in central vision. Kevin and I diverge in our understanding of what happens at the 'component-tuned units' level and beyond.  <br>My previous post was an attempt to fill out my notion of what happens to 'word[s] n+1' when 'word n' is in central vision (and I had to sharpen somewhat my view of the left-hand side processes). <br>The first paper linked to in this post focuses closely on the areas where Kevin and I diverge.</p>"
  html_clean: "<p>this is continued from: <br><a href=\"http://www.typophile.com/cgibin/show.pl?30/67250\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/cgibin/show.pl?30/67250</a> <br> <br>The paper at this link: <br><a href=\"http://www.kringelbach.dk/papers/NI_Pammer2004.pdf\" target=\"_blank\" class=\"link-external\">http://www.kringelbach.dk/papers/NI_Pammer2004.pdf</a> <br>takes the discussion of the 'visual word form area' referenced in my _Typo#13_ contribution significantly further than McCandliss, et. al., (see my footnote #32). The interesting results, from a perceptual processing in reading point of view, are on pdf page 3 (1821). The 'discussion' is framed according to a 'letter recognitional' model of word recognition, so my conclusions--favouring a more direct 'visual wordform resolutional' model--might look somewhat different than those of the authors. But I post this here, because the 'understanding reading' discussion Hrant champions must be engaged at this level if we want to go beyond 'intuitive confidence' to 'grounded beliefs'. <br> <br>Also important to this end might be the paper at this link: <br><a href=\"http://www.psy.vanderbilt.edu/faculty/palmeri/vita/pwg04-tics.pdf\" target=\"_blank\" class=\"link-external\">http://www.psy.vanderbilt.edu/faculty/palmeri/vita/pwg04-tics.pdf</a> <br>The paper provides a nice map of the presumed stages of visual information processing (and an interesting chart of 'representational changes' occurring with the development of perceptual expertise).  <br>I include the link because of Hrant's earlier comments about where Kevin, Hrant and I stand in relation to each other. As I understand it Hrant differs from Kevin and myself in placing much (about 66%) of the burden of perceptual processing in reading on the far right path (relative to parafoveal material). Kevin and I take a greater interest in what happens on the left path (heading off of the retinal image) in central vision. Kevin and I diverge in our understanding of what happens at the 'component-tuned units' level and beyond.  <br>My previous post was an attempt to fill out my notion of what happens to 'word[s] n+1' when 'word n' is in central vision (and I had to sharpen somewhat my view of the left-hand side processes). <br>The first paper linked to in this post focuses closely on the areas where Kevin and I diverge.</p>"
