      <p>I think your kern would disappear when the quote began a line? Or ended one? No character to kern against. I'd imagine other problems, too.</p>
      <p>BTW, you're trick is the reason I'd start a new document to make sure there isn't something in the file causing this. Probably not, but without a look with a font editor...</p>
      <p>BTW, a better work around might be to just set two single quotes when you need to set a double...what we always did when we used TeX.</p>
      <p>If it is sidebearings, I'd complain about a bug to the publisher. And if they didn't respond soon, I'd fix it with a font editor &amp; let 'em sue me. Actually, I believe in the EU that kind of fix is allowed, whatever the license.</p>
