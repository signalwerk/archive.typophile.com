      <p>The space comes either from the sideberaings or a kern -- you can eliminate a kern as a possibility by looking at the character panel with the cursor between the quote and the space (I've seen  kerns between the left &amp; right quotes and the space character before, &amp; they're usually a disaster, one way or another).</p>
      <p>Or turn the kerning off in a paragraph style, &amp; see if the space disappears...</p>
      <p>Just possibly, some routine is adding a spacing character, but I doubt it. The "info" panel should show that.</p>
      <p>Open a new file, with no tracking. scaling, or other ID feature, and type a double open quote mark as the first character. Is it away from the margin? If so, it's likely messed up sidebearings. Of course, a font-editing program would let you check for sure, but not everyone has that software.</p>
      <p>EDIT:</p>
      <p>After the checks above, I'd get up with whoever you purchased the font from. If it is in the font, it is a serious bug, &amp; any reputable type publisher should fix the problem, free of charge.</p>
