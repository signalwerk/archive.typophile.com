      <p>That's certainly bizarre.</p>
      <p>Charles — it's a sidebearing thing, as you can see in the bottom paragraph of the middle column, where a quote starts a line.</p>
      <p>This is not an ideal solution, but if you need a work-around within InDesign, you can make a GREP style that applies the appropriate negative amount of kerning to any character before an open quote and also the close quote character. Then you just incorporate this as part of your base paragraph style, and the defect is hidden.</p>
