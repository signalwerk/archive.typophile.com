    <p>I've just purchased the URW++ version of Baskerville, and I'm encountering a bizarre problem when using quotation marks. Oddly, the same problem seems to exist in ITC Baskerville — but not in other typefaces.<br>
    I've uploaded a screenshot to show what's happening. For some reason, the quotation marks in Baskerville have far too much space around them. I can't manually correct the problem by adjusting the tracking on the character, either.<br>
    Again, this is only happening in Baskerville, and I'm using a brand new version that I just purchased from Linotype.</p>
    <p>Has anyone else encountered this problem, and if so, did you find a solution?</p>
    <p> <img src="/sites/default/files/old-images/quotespacing_6154.png"></p>
