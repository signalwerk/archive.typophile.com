      <p>&gt;found in classical Hebrew</p>
      <p>Yes, but not nearly as extensively. The traditional spelling is called 'ketiv chaser', abbreviated spelling, and the 'ketiv male' or full spelling includes the yod whenever there is a chirik alone and a vav for a kubutz or a holam alone in traditional spelling. This considerably reduces ambiguity without vowel points--though there is still a considerable amount. But for native speakers, it is rarely an obstacle, I understand. </p>
      <p>&gt;Not right William.</p>
      <p>To clarify: I meant for competent readers in ordinary reading. I know that kids start with vowels, but as I understand it after a few years leave them behind for reading. Of course immigrants start the same way--with vowel points as a learning tool. Aside from this it's only sacred texts, which traditionally have vowel points, and the dictionary which are read with vowel points. </p>
      <p>What isn't accurate about this? I'm here to learn.</p>
