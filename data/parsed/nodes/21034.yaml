    <p>I have recently bought Indesign CS2 ME (with Mac OSX) in order to set <a href="/node/34368" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Hebrew</a> with vowels. For quite a while I have tried to read about fonts suitable for Biblical Hebrew and decided to buy Narkisim, after having read that Zvi Narkis was responsible for the Typography in the new Hebrew University Bible. The font has an impressive number of characters, but it does not appear to interact well with Indesign. In particular does it place tsere under nun completely wrong (see example in the attachment) in a text. When the nun is written alone with tsere it looks fine. I assume that the problem is connected automatic positioning in Indesign and would appreciate some suggestions on how to solve this. My questions are:</p>
    <p>a) is there a way to turn off the incorrect "automatic positioning" or is the problem connected to something that I do wrong?<br>
    b) is there another font which works better with Indesign (I'm not particulatly fond of the Ezra SIL).</p>
    <p>Thanks in advance.</p>
    <p>sefer</p>
