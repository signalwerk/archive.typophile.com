      <p>This is one of the more interesting threads I have seen in a while, so thank you first for that. Secondly, I just wanted to say that I have always thought it strange that vowels are not always used in the Hebrew language. My heritage, being jewish, means that I have had many years to witness and realize that this is one language that can be sometimes cryptic, as the vowels may or may not be present. I suppose I really just don't understand why it is that the sacred Torah lacks such pronunciation clues, were as most books and such do contain them.</p>
      <p>I have read for many years, not recently, but, I did have a bar-mitzvah which I was required to recite a significant portion of scripture from the Torah. This was very difficult, as you must first learn to read the section with the vowels, and then remove them. Somewhat relying on memory, and even more so on my Rabbi standing next to me in case I stumbled over a word that I simply couldn't remember. Granted, I was reading this particular section to a group of about 100 or so people, so that didn't make it any easier for me.</p>
      <p>There may have been a time when I knew the reason for the lack of the vowels in the torah, and their use in more everyday materials, but I just can't remember now. It is one thing to be able to read the language, another to be able to write it, and yet another to be able to understand and translate it. Personally, I was only fortunate enough to read it, and when studying specific sections, I would understand through the translations of my teachers. Today, I have to say that I have forgotten most of it, and really, I would be hard pressed to make even a meager attempt at reading anything with or without vowels.</p>
