      <p>SBL is currently the only relatively decent teamey mikra font, however it's far from perfect and even though it's probably the best there is, it's certainly not good enough as it stands for good bible typesetting.</p>
      <p>We are currently developing the Koren font for this purpose which will be available for sale once completed from Masterfont. We also will be making the entire Tanach text available digitally so this could be used with other fonts that have been programmed according to this text.</p>
      <p>The real problem is that in order to create a good positioning you need a text and every Tanach text is slightly different. So if you solve the problem of positioning for a particular word in one text, you will find that in another text of the Tanach, that word has different diacritics. </p>
      <p>By making the Koren Bible text available digitally, this will mean that an accurate, proofread text (both for mistakes and trop positioning) will be available.</p>
