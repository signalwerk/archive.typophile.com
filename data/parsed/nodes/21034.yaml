    html: <p>If you want just nikud, then the best solution out there are the fonts by Fontbit, <a href="http://www.fontbit.co.il" title="www.fontbit.co.il">www.fontbit.co.il</a>. If you want teamey mikra, then Fontbit has currently two fonts, Livorna and Hadassa with teamey mikra. But please note, typesetting teamey mikra in InDesign ME is a lot more work than nikud. With nikud, (at least with Fontbit’s nikud) you can expect to see the nikud to sit 100% correctly. However, with teamey mikra you have the problem of collisions. I have developed software that generates a script of thousands of search and replaces to move the teamim to the correct position. Further if you need to typeset a Bible for example, then Fontbit will (for a fee) add the teamim into any of their fonts.</p>
