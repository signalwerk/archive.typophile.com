    html: <p>When I studied at religious school as a child, up until about 8th grade or so, vowels were always secondary to the letters. Reading from the Torah, like I said, is the main experience I remember where the vowels are not present. Also, it was always just understood, by students, that as you progressed you would need to be able to read with or without. It's been sometime since I have really sat and looked at anything, but, if you look at the portfolio that I posted above, I think I remember seeing some of his works also lacking the addition on vowels.</p>
