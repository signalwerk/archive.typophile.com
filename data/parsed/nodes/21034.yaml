      <p>I think you need an Open Type version of Narkisim, if you want to stay with that font. As <a href="http://www.masterfont.co.il/web_articles_show_e.php?article_id=3" rel="nofollow">this  note</a> explains, you need open type for accurate placing of vowels. Masterfont says they have 50 open type fonts that are programmed to place nikud (vowel points) properly in Page Maker and InDesign. I have been using their Hadasa MFO which places nikud beautifully in InDesign.  </p>
      <p>I bought mine at My Fonts, but I don't see the Masterfont open type fonts now on the My Fonts site. But you can contact <a href="http://www.masterfont.co.il/" rel="nofollow">Masterfont</a>, the publisher of Narkisim, directly. From what I read somewhere I think the font that Narkis did for the bible was a special one and not Narkisim.<br>
      You will see that they have some English parts to their site, though not a lot. Just e-mail them in English and I'm sure they can help you. </p>
      <p>Fontbit I have heard also has excellent open type fonts that place nikud correctly. You can contact them <a href="http://www.fontbit.co.il/indexENG.html" rel="nofollow">here</a>.</p>
      <p>If you want to set the marks for chanting Torah also, you will have to ask for that, as that is more demanding again. Typophile John Hudson's SBL Hebrew, which is based on the Sefardic style, sets all marks beautifully and is available for free download from the Society for Biblical Literature <a href="http://www.sbl-site.org/Resources/default.aspx" rel="nofollow">here</a>.</p>
