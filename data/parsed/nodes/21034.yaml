      <p>Matthew, as I understand it, native speakers of Hebrew have never used vowels--neither before 200, when Hebrew was first spoken, nor in modern Israel. (Some religious texts are vowelled, but that is a holdover; also dictionaries are voweled for the same reason that English dictionaries use phonetic spelling.)</p>
      <p>The vowels, as I understand it, were developed as system to insure that people would know how to pronounce the sacred Hebrew literature at a time when Hebrew was losing strength as a widely used language. </p>
      <p>The vowels to me are a very artificial system, and I sometimes doubt whether anyone ever really uses them to read, as opposed to decode the pronunciation of words. *If* you know the language--and my Hebrew is poor--then reading without vowels is actually not hard. </p>
      <p>Except for short words, "evn in Englsh you cn dspns wth vwls nd ndrstnd a lt." Since Hebrew is almost all based on three consonant roots, and most of the conjugation is in the vowels, for a native speaker the consonantal spelling doesn't really pose a problem. Also note that the consonantal system of spelling was actually the first alphabetic script. </p>
      <p>Also currently the vav and yud are used widely as vowels in the 'full spelling' of Hebrew, so there is even less ambiguity than in classical Hebrew.     </p>
      <p>The Hebrew speakers here will correct me, hopefully, but that's my understanding.</p>
