      <p>InDesign is I think a user-friendly program, but it is very feature-rich. So to start using it is easy, but to make best use of it is an other story. </p>
      <p>Davkawriter I believe has a legacy encoding and their fonts will not port over to InDesign ME. Dagesh's fonts will port over to InDesign (if I remember it does via MS Word). Word also does Hebrew, and Davkawriter does English. Trying to mix Davkawriter, MS Word, and Tiff files sounds to me like a nightmare, but I may be wrong. </p>
      <p>A basic advantage of InDesign ME is that you have access to all the regular Hebrew fonts, and the InDesign's power as a layout program. </p>
      <p>I don't know enough to tell you what is the best way to go for your project, as I don't know the capacities of Davka writer as a layout program--eg whether it can place the TIFFs easily where you want them, which InDesign certainly can. </p>
      <p>Also if you are going to have this printed offset, you have the important question of what files the printer can handle. With InDesign ME you can reliably export everything to PDF files, and the printer will be happy.  </p>
      <p>Also you might want to consider MS Publisher which will be a lot cheaper, is a lay-out program and I believe does Hebrew. I believe it doesn't have nearly the power of InDesign, but it may work for you, depending on your needs. </p>
      <p>My suspicion is that you are going to want to dump DavkaWriter, but again the key questions are lay-out capacity and whether the files will work for the printer. </p>
      <p>Hopefully, others who know more about the limitations of the different programs will come on and help you out.</p>
