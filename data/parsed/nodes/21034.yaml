      <p>What encoding are you using for these characters in your OSX apps? They are correctly encoded in the font according to the Unicode Hebrew encoding:</p>
      <p>U+05C3 - HEBREW PUNCTUATION SOF PASUQ<br>
      U+05F3 - HEBREW PUNCTUATION GERESH<br>
      U+05F4 - HEBREW PUNCTUATION GERSHAYIM</p>
      <p>My guess is that perhaps these were encoded using the ASCII : ' and " characters in the old Mac Hebrew 8-bit codepage, and so are still misrepresented in OSX. If you can confirm what character codes are used for these Hebrew codepoints in your apps, I can check to see whether it will be possible to double-map them in the SBL Hebrew font.</p>
