      <p>David, Avichay confirms the point I was trying to make: the use of vowels is for exeptional, special uses and not normal reading such as newspapers, magazines, books, signs advertisments, etc. I left out grammar texts, which I knew about. I didn't know about the poems and teen works with nikud--why is that done? </p>
      <p>Also as I understand it traditionally the vowel points were not used. The text of the Mishnah (finished c. 200) is originally not vowelled. So again native speakers did not ordinarily use vowel points. I don't know how far back they go. The Babylonians would have spoken Aramaic, and so likely would have needed vowel points so as not to mispronounce Hebrew words as Aramaic ones. As John says, the currently used system is relatively late as the history of Hebrew language goes. </p>
      <p>By the way, John, I don't think it is correct to say that in classical Hebrew the yod and vav and hey used as vowels are simply for ease of reading--if that's what 'matres lectiones' means. They are there because they are part of the root of the word, and hence figure in conjugation as well as pronounciation. In other words they are there for essential grammmatical reasons. That's why in studying grammar you need traditional spelling plus vowel points. </p>
      <p>ps. Matthew. One prime reason why most American Jews find the traditional Hebrew service crashingly boring is that they don't understand Hebrew--they only know how to pronounce it phonetically, which is not remotely the same experience. When late in life I learned enough Hebrew to actually understand the liturgy, I was astonished by the power of the language in the sacred texts. Reading the Hebrew sacred texts (including the psalms) in another language is like reading Shakespeare in Italian or something; the power of the language is just a shadow of the original.</p>
