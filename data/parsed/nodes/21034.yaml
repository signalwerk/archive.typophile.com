      <p><em>SBL is currently the only relatively decent teamey mikra font, however it’s far from perfect and even though it’s probably the best there is, it’s certainly not good enough as it stands for good bible typesetting.</em></p>
      <p>Raphael, I'm always interested in knowing how I can improve SBL Hebrew, so if you want to write to me with specific criticisms I would be grateful. I released v1.5 of the font this summer, which adds support for Dead Sea Scrolls transliteration, but does not significantly change any of the existing spacing or mark positioning, which I know need some more attention. In version 2.0, which has been in development for some time, I have revised the mark positioning approach and am adding contextual spacing lookups to improve the relationship of marks on adjacent letters. This is based on an analysis of letter and mark combinations in the Leningrad Codex, which is the most widely studied masoretic Bible text. It sounds like we are working in very similar ways, with different texts, and I agree with your comments about the need to have a complete text for good positioning.</p>
      <p>The primary purpose of the SBL font is for use in scholarship, rather than in Bible publishing per se, and I'm conscious of the fact that much of the academic and publishing community that is funding the work and is the principle audience for the font is non-Jewish, and that there are some differences in the evolved conventions of typesetting the Biblical texts in different communities. I can imagine future versions of the SBL font tailored to the needs of particular communities, individual publishers and even specific texts.</p>
