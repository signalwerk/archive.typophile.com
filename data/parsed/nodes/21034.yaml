      <p>In Israel, pupils learn to read with nikud, then gradually learn to read without it, as they develop their reading vocabulary and gain the ability to predict the context.</p>
      <p>A writer might opt for nikud of a word that can be read in two ways, each giving the sentence a different meaning.</p>
      <p>Finally, the trend for ktiv maleh, that is, the use of the vowels alef, heh, vav, and yod, to indicate the sound, makes nikud less critical.</p>
