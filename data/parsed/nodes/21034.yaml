    html: <p>Regarding DavkaWriter, you can most certainly use it as your text-entry program and you can even copy and paste text with teamey mikra into InDesign (well copy and paste if you are on a PC). However, you will need a font in InDesign that supports nikud and teamey mikra. However, you will lose the kamatz katan and shva na when copying a pasting. The workaround for this is to do a search and replace in DavkaWriter for a kamatz katan and replace it with a different character that you are not using. I used this method successfully when typesetting the new Singer's Prayer Book recently published by HarperCollinsUK. The texts were all input on DavkaWriter and I typeset the siddur in Fontbit's Hadassa using InDesign CS2 ME.</p>
