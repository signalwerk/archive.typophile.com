      <p>Matthew: <em>I really just don’t understand why it is that the sacred Torah lacks such pronunciation clues, were as most books and such do contain them.</em></p>
      <p>Vowel signs are not included in Torah scrolls because they were not included when the text was first written down. The Tiberian vowel system is a mediaeval development (c. 800-1000 AD*), applied to the Tanakh by the Masoretes. When you read the Torah aloud at your bar-mitzvah, you were actually reading a mediaeval, Masoretic pronunciation of the text, which is likely different in a number of ways from the way in which the text was pronounced when it was first written down using only consonants and matres lectiones (consonant letters used as vowels, just to make things even more confusing). The classic examples of an evident distinction between classical and Masoretic prounciation is the word Yerushalem. The ancient consonantal text has YRSHLM but the Masoretic text inserts two vowels between the L and M, because the pronunciation had changed from the classical -LEM to the contemporary -LAYIM. Because the consonantal text is sacred and cannot be modified, it cannot be changed to -LYM, so a basic rule of Hebrew orthography, that there can only be one vowel per consonant, is broken in order to maintain the consonantal text but also reflect the later pronunciation. The conventional way to write this is for the second vowel to sit under the right sight of the final M. Needless to say, this requires some special handling in fonts:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/yerushalaim_3657.gif"></div><p></p>
      <p>Note also that the Tiberian pointing system used for vowels by the Masoretes is only one of a number of vowel systems devised for Hebrew, although it is the only one still in current use. Other extant systems are the Palestinian and Babylonian, and the latter was in widespread use for some time. I know someone who is working on a proposal to encode the Babylonian pointing system in Unicode.</p>
      <p>* I use the BC AD dating system, rather than the relgiously neutral BCE CE system, because I am a Christian, and obviously believing what I believe about the person of Christ makes this an important reckoning for me. I mean no offense by this, especially not to my Jewish brothers in faith, and trust that people will mentally substitute whatever date reckoning system is important to them.</p>
