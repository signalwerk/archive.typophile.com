  html: |-
    <p>Hi all,</p>
    <p>I'm looking at designing books for a sports book publisher. To that end I want to choose one serif and one sanserif type family which can be applied to all books, but are large enough to allow for a decent amount of variation.</p>
    <p>The serif I think should be clean and modern, with a serious touch. Right now I'm considering <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/utopia/" rel="nofollow">Utopia</a>. For the sans I would like a lot of weights, and also oblique forms (preferably true italics). I'm thinking serious, but with a twist. <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/interstate/" rel="nofollow">Interstate</a> has occurred to me, but I'm not sure how well it works together with Utopia.</p>
    <p>Any suggestions?</p>
    <p>/Måns</p>
