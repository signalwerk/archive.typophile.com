    html: <p>I'm diggin' the idea, and it looks cool... the "s" with the full line is killer, but I'm not so sure that the tail on the T is working.  It adds an interesting element, but in regular type it gets a little distracting.  Maybe keep it as an alternate.  Overall, though, it looks cool.</p>
