    <p>What more persuasive way to raise awareness of disabling genetic defects in purebred dogs than to <a href="http://blog.peta.org/archives/2010/03/peta_uks_dog.php" title="PETA U.K. poster">employ a Hitler moustache and blackletter type</a>?</p>
