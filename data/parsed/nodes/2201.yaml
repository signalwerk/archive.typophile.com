  html: <p>I hope this is experimental enough. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> I made "Ascii" back in the late '80s for a school assignment, intrigued by the effect of overlapping shapes in Fontographer. If there's interest, I'll release it. <br>Comments pro or con are welcome. <br> <br><img src="http://www.typophile.com/forums/messages/29/213.gif" alt="Ascii"></p>
