    html: <p>The "journal of contemporary type" gag is a totally real but less in-your-face part of that li'l endeavor (the other themes are pretty obvious, really), since doing a little side project gives me a chance to work with some of my favorite typefaces made by some of my favorite folks, like <a class="freelinking external" href="http://www.typejockeys.com/fonts/Ingeborg" rel="nofollow">Ingeborg</a> by the <a class="freelinking external" href="http://typejockeys.com" rel="nofollow">Typejockeys</a>, <a class="freelinking external" href="http://processtypefoundry.com/fonts/maple/" rel="nofollow">Maple</a> and <a class="freelinking external" href="http://processtypefoundry.com/fonts/seravek/" rel="nofollow">Seravek</a> by the <a class="freelinking external" href="http://processtypefoundry.com" rel="nofollow">Process Type Foundry</a>, the <a class="freelinking external" href="http://www.houseind.com/fonts/studiolettering" rel="nofollow">Studio Lettering</a> set from <a class="freelinking external" href="http://www.houseind.com" rel="nofollow">House Industries</a>, <a class="freelinking external" href="http://typography.com/fonts/font_overview.php?productLineID=100003" rel="nofollow">Cyclone</a> by <a class="freelinking external" href="http://typography.com" rel="nofollow">Hoefler &amp; Frere-Jones</a> and some beloved old gems that I rarely get to use otherwise, like <a class="freelinking external" href="http://www.linotype.com/284/cooperblack-family.html" rel="nofollow">Cooper Black</a> and <a class="freelinking external" href="http://www.linotype.com/90269/stilla-family.html" rel="nofollow">Stilla</a>. It even gives me an excuse to blow the cobwebs of my own (still unfinished, still unreleased) Gina family and  encourage me to keep at it.</p>
