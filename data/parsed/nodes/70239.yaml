  html: |-
    <p>Is Typophile stalwart <a href="http://www.typophile.com/user/4356" title="Dan Rhatigan" rel="nofollow">Ultrasparky</a>’s zine <cite><a href="http://www.pinkmince.com/" rel="nofollow">Pink Mince</a></cite> “<a href="http://www.dogpoet.com/blog/archives/1367" title="Mention at Dogpoet" rel="nofollow">a smart homage to old physique mags or a journal of contemporary type and vintage lettering with pictures of dudes</a>”?</p>
    <p>Whyever can’t it be <em>both</em>? </p>
    <p>Surely such a publication must be immediately attractive to the thronging coterie of typographic homosexualists, among others.</p>
  html_clean: |-
    <p>Is Typophile stalwart <a href="/user/4356/" title="Dan Rhatigan" rel="nofollow" class="link-kept">Ultrasparky</a>’s zine <cite><a href="http://www.pinkmince.com/" rel="nofollow" class="link-external">Pink Mince</a></cite> “<a href="http://www.dogpoet.com/blog/archives/1367" title="Mention at Dogpoet" rel="nofollow" class="link-external">a smart homage to old physique mags or a journal of contemporary type and vintage lettering with pictures of dudes</a>”?</p>
    <p>Whyever can’t it be <em>both</em>? </p>
    <p>Surely such a publication must be immediately attractive to the thronging coterie of typographic homosexualists, among others.</p>
