    <p>I need some type that looks like it is from a 1950s-1960s space program. Not like the Jetsons or boomerang-table-hepcat stuff, but something that might actually appear on the side of a rocket or test-plane in the early supersonic jet propulsion era. </p>
    <p>There is one in particular that I saw, but I forgot what it was called. I think the name of it was a near-meaningless, short mix of letters and numbers, and it looked like what you would see painted on the side of a bomber, a bit naïve and engineered-looking, the typographic equivalent to a telephone pole. It had an tall octagonal shape and was quite stark. </p>
    <p>I am sure there are others, but I am stumped as display type is not my specialty. Please help if you can. Thanks!</p>
