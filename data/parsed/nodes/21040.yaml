      <p>Albeit off topic, but I can't resist... The "worm" logo was also called the "spaghetti" mark. After seeing several shuttle launches from the press center in my earlier journalist days, I have a great affinity for NASA and actually prefer the historical "meatball" logo.</p>
      <p>Here's a page from NASA's site about the history of the "meatball" logo (<a href="http://history.nasa.gov/meatball.htm" title="http://history.nasa.gov/meatball.htm">http://history.nasa.gov/meatball.htm</a>), with this priceless quote:</p>
      <p><cite>When the meatball was reinstated in 1992, Greg Patt, then Graphics Manager for [the Glenn Research Center's] Publishing Services contractor, remarked "It's a design nightmare. It doesn't print well on laser printers because of the gradations on the airfoil, and it can't be used at less than 5/8 inch because the stars disappear and the type becomes illegible." </cite></p>
      <p>Oh, and this one, too:</p>
      <p><cite>"Meatball" has also been used for a dull, unattractive person and for a penant for battle efficiency or an athletic scholarship. </cite></p>
      <p>I love their honesty on both counts.</p>
      <p>More about NASA's logos at their Graphics Standards Website: <a href="http://www.hq.nasa.gov/office/pao/insignia/" title="http://www.hq.nasa.gov/office/pao/insignia/">http://www.hq.nasa.gov/office/pao/insignia/</a></p>
