      <p>The original 1958 sci-fi looking NASA symbol, referred to as "The Meatball" by insiders, predated the NASA symbol Norbert posted (done by Bruce Blackburn of Danne &amp; Blackburn in 1975).  After fall from grace in 1992, the Danne &amp; Blackburn NASA "Worm" logo was banished and the "Meatball" returned. Tacky committee zombies win out over good design one more time.</p>
      <p>ChrisL</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nasameatball58_6426.png"></div><p></p>
