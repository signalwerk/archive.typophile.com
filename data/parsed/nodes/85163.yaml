    html: |-
      <p>Font Bureau is in the habit of putting substitutions for additional tabular sorts, like figurespace and certain tabular punctuation, in a separate stylistic set so it can be ‘added on’ to {tnum} in situations that require. (And they’ve settled on a standard of {ss20} across their fonts.)</p>
      <p>Of course, this doesn’t make the figurespace any more accessible in Photoshop or Illustrator (which sounds like the original motive behind this thread) since these apps don’t support ssets.</p>
    html_clean: |-
