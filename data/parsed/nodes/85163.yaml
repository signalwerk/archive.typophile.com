    <p>I'm thinking it would be useful to add a line to Tnum feature to substitute normal  space with figurespace, especially as not all softwares can access it.<br>
    But I didn't find any mention of it here.<br>
    Anyone do it already, or are there any good reasons to avoid it?</p>
    <p>Thanks in advance</p>
    <p>Jan</p>
