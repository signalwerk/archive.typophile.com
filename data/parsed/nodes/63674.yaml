      <p>Back again,</p>
      <p>I've actually found an even better match for Franklin Gothic: Century! It's brilliant, it fits perfectly, and they have comparable origins as well (originally designed by Morris Fuller Benton) which is nice. I've chosen the ITC Century because of the many different versions, and it seems to match well with ITC Franklin Gothic, probably because they come from the same place. Thanks all!</p>
      <p>Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
