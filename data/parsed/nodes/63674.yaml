    <p>Hi all,</p>
    <p>I'm looking for a good serif companion to ITC Franklin Gothic. I've searched the site, but haven't found anything there. I've tried fonts like Dante and Sabon but I think there might be a better match somewhere. I hope you have some good ideas! </p>
    <p>Thanks, Jeffrey<br>
    <a class="freelinking external" href="http://www.infraordinaire.com/wordpress/" rel="nofollow">infraordinaire</a></p>
