      <p>@5star</p>
      <p>And it's TOO bad you're such an ignorant putz, but I hear tell that Capitalism can rot the brain, so it's probably not your fault that you're such a maroon.</p>
      <p>As an inveterate revivalist myself, I find the practice a noble calling. Resurrecting engaging designs and bringing them into the Digital Age exposes young whippersnappers to the great designers of the past. In all of my efforts, I always give credit where credit is due. And even revivals present opportunities for your own creative input. When I made a digital version of Stephenson Blake's Glenmoy, I took exception with some of the original letterforms, and revised the /p/ and /x/ characters so that they were more to my liking (and, presumably, more attractive to type buyers). So, if you can improve or expand a venerable workhorse, go for it. Just make sure that whatever you name your efforts doesn't violate one of Berthold's trademarks...</p>
