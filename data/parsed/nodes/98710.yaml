      <p>Well, perhaps “hobbyist” was a bit strong, but that, I think, would be the consensus—and addresses Alex’s concern over professional reputation rather than legalities. Revivals of classic serif faces have been undertaken by type designers in the digital era (indeed, it was a feature of the early days), but the vein has now been mined out and the interest is in new designs.</p>
      <p>Hiding away or giving away one’s work would seem to suggest something not quite right about it.</p>
      <p>Alex, as an antiquarian (which many type designers, myself included, are—it comes with the territory), and interested in doing a revival, why not do a sans? Vogue, for instance, a 1930s American Futura clone.<br>
      <a href="http://pinterest.com/pin/49539664621222523/" title="http://pinterest.com/pin/49539664621222523/">http://pinterest.com/pin/49539664621222523/</a></p>
      <p>If you intend to publish your Centaur revival, be aware that it is a revival of a revival, and while there may not presently be a good text Centaur, there are many good Jensons. Also, I wouldn’t be surprised if Monotype were to publish a book version of Centaur, as they did with Bembo.</p>
