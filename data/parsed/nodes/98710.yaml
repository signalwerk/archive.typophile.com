      <p>@Nick &amp; John, very good points.  In my current phase, I'm mostly interested in book and document faces.  For me that mostly means old style or transitional serifs.  It's not that I'm uninterested in display types, but there's something about book text that I find compelling.</p>
      <p>In fact, all the fonts I designed prior to my <a href="http://typophile.com/node/93634" rel="nofollow">Suzuran</a> concept work were sans-serifs.  I won't delude myself into thinking they're particularly good, and they certainly aren't particularly original; they were designed for specific purposes within fairly narrow parameters.  But I am interested in expanding into serif types, hence these experiments.</p>
      <p>I also figured it might be a useful way of getting my feet wet, so to speak.  How can I move into creating original and innovative types if I don't have an intimate understanding of how existing types work and fit together?</p>
      <p>One reason Centaur (the book version) in particular fascinated me is how it consciously uses irregularities and imperfections as part of its charm.  Adobe Jenson and Cloister also do this up to a point, but Centaur really takes the concept and runs with it.  It has an almost intimate feel to it, in spite of its elegance.</p>
