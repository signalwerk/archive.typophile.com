    html: |-
      <p>The only downside that the book is printed with toner and not with the less reflective ink of book presses. I recently bought a book from amazon that was printed on demand. It was printed with ink not toner, but the scan was somewhere around the neighborhood of only 300-400dpi. More readable than the pdf on my screen of course, but janky nonetheless. If this machine uses pdfs with embedded fonts or 1200 dpi scans, I imagine customers will be happy. There should be a warning if the file you're printing from is less than 600 dpi. </p>
      <p>Also, their home page has a new video for a "2.0" version: <a href="http://www.youtube.com/watch?v=ZDe_Jy4HnMY" title="www.youtube.com/watch?v=ZDe_Jy4HnMY">www.youtube.com/watch?v=ZDe_Jy4HnMY</a></p>
      <p>There are also other photos on the web of models in use, such as here:<br>
      <a href="http://www.telegraph.co.uk/technology/google/6205386/Google-Espresso-promises-on-demand-book-printing.html" title="http://www.telegraph.co.uk/technology/google/6205386/Google-Espresso-promises-on-demand-book-printing.html">http://www.telegraph.co.uk/technology/google/6205386/Google-Espresso-pro...</a></p>
      <p>The machine is ugly and not friendly at all, unlike those trashy but easy photo kiosks. There needs to be a counter/shelf under the keyboard (I'm looking at the telegraph article) for people to put their backpack/pocketbook and coffee on. Otherwise you feel like a tool standing in front of that thing.</p>
    html_clean: |-
