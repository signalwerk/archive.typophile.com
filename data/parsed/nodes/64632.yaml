    html: |-
      <p>&gt; If this machine uses pdfs with embedded fonts or 1200 dpi scans, I imagine customers will be happy.</p>
      <p>The way I read it, the system will use whatever is available. Many out-of-print books exist only as scans, often at 200 or 300 dpi, due to the size of a raster-based book file.</p>
      <p>I suspect that quality will vary widely. But if the book is something that has been out-of-print for 30 years, and you really want it, 200 dpi is better than nothing.</p>
