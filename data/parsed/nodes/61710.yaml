      <p>Hi Ray,</p>
      <p>The first solution did the trick... simply wiping out the existing Unicode table and start anew without checking that little box (!). Thank you very much! </p>
      <p>Your description of the 'rare case' is also interesting: I'll keep that in mind (just like all Fontlab users have grown accustomed to all those 'rare cases'... ;-)</p>
