    <p>Hi,<br>
    Maybe someone can help!</p>
    <p>My Fontlab Studio 5.0.4. keeps crashing. I did quite a lot of copying and pasting glyphs with a handdrawn font. Now I'm ready to generate the font, but it freezes on 98% and says:<br>
    'multiple glyphs oslash _191 mapped to code'.</p>
    <p>I'n thinking of applying the command<br>
    Glyph &gt; Glyph names &gt; Generate names or 'Generating unicode'<br>
    but I'm not sure if these commands mix everything up.</p>
    <p>Anybody knows the best solution?</p>
    <p>Pierre</p>
