    html: |-
      <p>The effects is a gradient printed at a very coarse screen ruling, somewhere in the vicinity of 30 or so LPI. One way to mimic this effect would be to create a vector gradient by following the instructions here...</p>
      <p><a href="http://illustrationinfo.com/?p=46" title="http://illustrationinfo.com/?p=46">http://illustrationinfo.com/?p=46</a></p>
      <p>Then insert the gradient into type converted into a clipping path.</p>
