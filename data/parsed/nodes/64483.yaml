      <p>A quote from <a class="freelinking external" href="http://typophile.com/node/52374" rel="nofollow">this</a> discussion:</p>
      <p>"The font is called ’Larish’ and was indeed drawn specially for Secession identity which was developed together with Willi Schmid, in 2007-2008. Its appearence is inspired by an old prints from Vienna of late 19th century. Even it is not re-drawn typeface, its shape it true to the spirit to its example."</p>
      <p>(The actual font name appears to be Larisch Alte.)</p>
