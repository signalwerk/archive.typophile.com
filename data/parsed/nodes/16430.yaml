      <p>Yeah its nice to shed light on this subject. But my point about if you have fonts you use them more is valid. atleast in my case and my design friends. </p>
      <p>Example:</p>
      <p>I had a client that i did some identity redesign for and i gave them 2 examples of fonts to use. dax wide and prokyon. Overused fonts i know, but they usualy impress clients. so i told them the price tag of the two. and i said if you want me to use this in your design you have to pay for the license of eighter one. Then i showed them the same identity design with another free font and they got the point. </p>
      <p>What happened here. well 2 things basicly. the fontdesigner got payed and i futhered my design career. </p>
      <p>If i didnt have thouse fonts installed id never know if they would work on just that design. would I?</p>
      <p>Id like your take on this sistuation. david and bald condensed. </p>
      <p>Oh yeah. i bet David is american. Sounds like it. </p>
      <p>Yours in faith insearchof</p>
