      <p>You obviously don't know who you're talking to here. There was even an interview with Yves at TypeCon this year on Type Radio where they asked him about his type collection. There is no reason why he would lie about cleaning his computer of faces that he hadn't properly licensed...end of story.</p>
      <p>You'll find that this community is pretty tight knit and a lot of the members know each other in real life, have met through the board or have become friends through typography conferences such as TypeCon and ATypI. This is not a place to come in and throw your weight around when you are unaware of who you are talking to. The respect and massive knowledge base of the users, of which many are professionals in the field of design or type design, here is what brings us together...there's no need to try and discredit the other designers/typophiles here. This is my opinion anyways and I know you're new so I think this is a good way to inform you for your future stay here at Typophile! If you write coherently too, it helps us understand.</p>
