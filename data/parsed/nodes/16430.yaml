    html: |-
      <p>Actually it isn't huge at all. I do have a Bitstream Collection on CD-ROM, but for the rest it's a hand-picked compact selection. As my independent design business is pretty low-scale, I can't really go wild on licensing type unfortunately. Furthermore I finally did the right thing a couple of years ago and removed all and any fonts that weren't duly licensed (we're not talking libraries here, just a couple of families that I had "lying about"). Apart from the odd family that I need to finish something at home for my daytime job and that gets deleted after the job is done, my computer is clean.</p>
      <p>I do get type for my reviews on an occasional basis, but I take great care to remove all files after the review has been published or even earlier if the review license stipulates so (for example Typothèque review licenses are limited to 7 days).</p>
