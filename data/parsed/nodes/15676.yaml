      <p>Hi Jafo,<br>
      I think this is already both original and aesthetically coherent. No doubt you're working on it at the moment, and also going for a paler, more elegant look than I am with my own Aldine face*, but it might be worth bearing in mind that one tends to underestimate how much of each letter's area its smaller elements, and indeed serifs, have to occupy if it is to represent one's intentions at text sizes. </p>
      <p>I would also add to what Paul has said that the a, though nicely modelled on the bowl, might be a little too wide for this style. Perhaps the s too? f and especially t could want stronger bars to carry the eye along, and x is cross-eyed: you could extend the serifs outwards. Some caps, like G, are rather narrow for the expansive lowercase. V and W lean left pretty hard. And is there some Frutiger here as well as Griffo and Zapf, in the zippy c and f?<br>
      This should be both lovely and usable when it's finished.</p>
      <p>George</p>
      <p>*the New Improved Mamillius (q.v.)</p>
