      <p>Hey Mike,</p>
      <p>I disagree about bdpq. Those letters have the most vitality in your alphabet. They need not be mechanical copies of each other. Instead, consider how other round elements could harmonize with them. Can you remove the straight segment in the bowls of hmnu? Make the curves fuller? </p>
      <p>Look at all your diagonals; lowercase kvwy especially. Your round and vertical shapes (n,o) have much more contrast than they do. The k especially looks scrambled. Diagonals are very tricky; they look heavy when they are the exact same weight as verticals, but they can look too light if you take too much weight off. W will be most difficult to match in visual (not mechanical) weight.</p>
      <p>Unfortunately the slanted top right feature on the lowercase vertical stems is very apparent. It seems to be a straight segment. Please examine whether this has any purpose in your design. If you intend for this face to be useful onscreen and in small sizes, try to examine how certain elements might snag the reader's eye (loop of g, heavy horizontals of EF, excessive tail of J), and how some features need to be stronger to maintain texture (outstrokes of ceC, tails of RK). Especially for onscreen use, consider whch elements do not rasterize well.</p>
      <p>Spacing is intrinsic to a successful typeface, but primarily I think you need to focus on getting control of your lettershapes. Do not think about hinting at all until you have gone through the steps to harmonize the outlines, spaced it, and eventually kerned it, in that order. You're doing well. Please post updates.</p>
