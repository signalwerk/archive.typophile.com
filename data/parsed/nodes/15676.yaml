      <p>pretty good for a first attempt, i must say. i think the most major concern is that a majority of characters feel out of balance: either they feel they are leaning back or leaning forward. I think some of this has to do with the modeling on your bowls of your round letters. some of this has to do with slightly wonky proportions. For exmaple, the b and p seem to have a forward and upward thrust on the bowl, whereas the c, d, e and q feel like they're being pulled back and toward the bottom of the letter. the f is a little shy for my tastes. the g has great potential! the tail of the g could be smoothed out a bit and maybe beef up that ear just a bit, and it'll be killer! h, i, j, l and m look good, but the k is out of whack. the m may be a bit too wide. did you make it with a doubled n? the arm of the r seems like it's going to snap off. the s is not so smooth. t, u, v, w, x: look good. the tail of the y is another week spot. give it a bit of oomph. and i'd completely start over on that z.<br>
      now for the caps: the A is leaning backward. the C and G have a bad underbite. I'd rework the proportions on the E: the top bar is too much shorter than the bottom for my liking. the tail of the J is out of control! i'd tame it down just a bit. the leg of the K seems very weak. the M is not right. see how there's more white space under the left portion? try to even those out. the tail of the Q could be more elegant. the S definately leaning forward and again, not so smooth. the T looks too narrow to my eye. the arms of the Y seem imbalanced. and i guess i just don't like that Z form... the accents seem to be a bit sickly. make the accent/grave beefier, but maybe not so long. your dieresis and probably the dots on the i and j could all be bigger. and make that tilde sexy, tell it to eat something!<br>
      anyhow, i hope that helps without being discouraging. of course i should give a disclaimer that all advice from me should be taken with a healthy dose of salt. feel free to use or ignore any of the above suggestions to your own detriment. but honestly, i think this is a solid start with some great potential. keep up the good work!</p>
