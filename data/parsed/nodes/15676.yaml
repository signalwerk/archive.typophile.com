    <p>Hello. I've been lurking here for a while, and having recently decided to post replies, I've finally decided to post a font of my own. This one is approximately an Aldine, with a certain Palatino/Aldus influence, in roman and italic. The spacing is a work in progress and I haven't even begun to hint it, but the letter forms are complete enough for a decent critique. It's a text face, and it seems to work well in small sizes and on-screen. All comments are welcome. Thanks.</p>
