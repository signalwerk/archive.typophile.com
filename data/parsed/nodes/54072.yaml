    <div class="info">Submitted by <a href="/user/15244" title="View user profile.">peterf</a> : 27.Jan.2009 7.26pm </div>
      <p>Exquisite Letterpress is happy to present “Almost Free” small card letterpress services.<br>
    Useful for business cards, tags, labels, etc, we work with your press ready PDF.<br>
    We’ve got a project estimator on our site at:<br>
    <a href="http://slowprint.com/almostfreelp" title="http://slowprint.com/almostfreelp">http://slowprint.com/almostfreelp</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/iPhoto-1_4342.jpg"></div><p></p>
    <p>We’re also very happy to work with designers, typographers, and consultants on any project requiring fine papers with a perfect impression.</p>
    <p>Capabilities include embossing, die-cutting and extremely tight multi-impression registration (on the Heidelberg "Windmill" 10x15 Platen. We're expecting a second Windmill and a 14x20 inch (chase size) Miehle Vertical press to be up and running within the next few weeks.</p>
    <p>Please visit us online, or if you’re in the midwest, stop in at the studio in Dubuque’s historic Millwork District, along the mighty Mississippi!</p>
    <p>Thanks for your indulgence!</p>
    <p>Peter Fraterdeus</p>
