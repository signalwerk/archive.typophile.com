      <p>Thanks, Tim. I do expect drawing the heavier weights to require a lot more reworking. Meanwhile, quick and dirty extrapolation from the light and regular masters for your amusement:</p>
      <p></p><div class="imageWrap"><img src="/files/a_extrapo_6168.gif"></div><p></p>
      <p>Not happy with the curves (I had to draw the extra-light again since I lost my previous work), but I can fix that later when I have the time. I think it makes sense to use an extrapolated bold weight as the basis for an extra-bold master. Lots of tweaking will be necessary, of course. Then I could interpolate the resulting master with the regular master to generate the intermediate weights. So I’ll be using three masters (extra-light, regular, extra-bold) to generate all the weights in this scheme.</p>
      <p>Just how I’m going to find the time to do all that remains to be seen.</p>
