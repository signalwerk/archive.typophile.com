      <p>I agree with Thomas, a little less tapering on the light version would be good.</p>
      <p><cite>I can probably do the same thing for darker weights.</cite></p>
      <p>Do you mean interpolating intermediate weights? Yes, that’s possible as well but you will find that it requires a little more reworking than in the lighter weights.</p>
      <p>Note that you can even generate the heavier weights from your light and regular using extrapolation (essentially the same as interpolation). Just enable extrapolation in the FontLab settings and drag the weight slider “into the yellow” and see what happens. Sometimes the results are more entertaining than useful but it’s definitely worth a try.</p>
