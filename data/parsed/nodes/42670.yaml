      <p>BTW  you’ve made up a word: envoke. It’s a nice combo of evoke (to produce or suggest through artistry and imagination a vivid impression of reality: a short passage that manages to evoke the smells, colors, sounds, and shapes of that metropolis.) and invoke (to call for with earnest desire; make supplication or pray for: to invoke God’s mercy.)</p>
      <p>I think evoke was more what you had in mind.</p>
