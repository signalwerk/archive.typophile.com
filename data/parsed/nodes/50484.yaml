    <p>Hi everybody at Typophile. </p>
    <p>I’ve been trying to identify the headline font used in the Swedish magazine “På stan” for a while. I tried the “what the font”- search engine at myfonts after separating the letters a bit but came up with nothing. I have attached an image showing various headlines copied from their website (pastan.nu).</p>
    <p>I’m now begging you guys for help, hoping you might know what typeface is used. </p>
    <p>// Oskar</p>
