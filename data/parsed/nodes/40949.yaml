    date: 2008-01-15T11:17:00
    date_raw: 15.Jan.2008 11.17am
    votes: null
    html: |-
      <p>It introduces a few new features...</p>
      <p>1. Remote Desktop... it uses the wireless network card (802.11N) to connect to any other networked computer and “borrows” their optical drives. This will let you install programs from disk, or burn CDs/DVDs. But if you don’t have one, Apple is offering an external Superdrive for $100 more.</p>
      <p>2. The 1.6GHz and 1.8GHz processors are 60% smaller than their predecessors.</p>
      <p>3. It uses a multi-touch input pad instead of just a mouse pad. </p>
      <p>4. Used in conjunction with <a href="https://web.archive.org/web/20081015202427/http://www.apple.com/timecapsule/specs.html" title="http://www.apple.com/timecapsule/specs.html">http://www.apple.com/timecapsule/specs.html</a>, you don’t really need much else.</p>
      <p>I think it’s pretty impressive. 3lbs and .76” at it’s thickest point. I’m really more impressed with the technology and how it might factor in to the next iPhone.</p>
    html_clean: |-
