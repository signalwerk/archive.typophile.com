    html: |-
      <p>Another problem - the glossy screen. I vastly prefer the matte.</p>
      <p>I would never buy a laptop that was dependent on an external drive or a wireless network for such basic functionality as installing software or watching a movie. It defeats the purpose of having a laptop. My current laptop doesn’t have a CD/DVD burner and it’s a huge pain. Plus I think one port isn’t sufficient, no matter how wireless you go. </p>
      <p>I’d rather go for the 17” MacBook Pro which is marked down (refurb) from $2799 to $2199.</p>
