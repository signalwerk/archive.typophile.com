    html: |-
      <p>You could at least have told him about the pay-for-play webfont services:<br><a href="http://fontspring.com/">http://fontspring.com/</a><br><a href="http://typekit.com/">http://typekit.com/</a><br><a href="http://www.webtype.com/">http://www.webtype.com/</a></p>
      <p>It may also be possible to host webfonts yourself. The abovementioned services may allow so (I haven’t checked). Freely-available fonts, other than Google’s, often have to be self-hosted anyway.</p>
