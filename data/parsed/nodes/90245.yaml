    html: |-
      <p>&gt; I wish there was an in between.</p>
      <p>FontLab can interpolate between (and even extrapolate from) two<br>
      weights of a typeface with good results. Of course producing an<br>
      entire font in this way would most probably violate the House<br>
      Industries license agreement; but taking two EPSs of a handful<br>
      of glyphs, interpolating those and producing a new intermediate<br>
      EPS is most probably OK. If you go this route you know who to<br>
      ask for help.  :-)  That's assuming the House boys themselves<br>
      don't want to do it for you.</p>
      <p>hhp</p>
