    <p>Hello everyone,</p>
    <p>Im working on a logo and I was using Chalet-ParisNineteenEighty, but I realize I might need a font thats just a little bit bolder. I don't seem to be able to find the same thing but just a  bit bolder. The other variations of chalet don't have the curves and raffinement of the paris one. Any suggestions ? Thanks.</p>
