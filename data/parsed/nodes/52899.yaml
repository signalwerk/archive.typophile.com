    html: <p>This is probably a photocompositor font that has not been digitized. Your best bet is <a href="http://www.fontshop.com/fonts/downloads/font_bureau/titling_gothic_compressed/" rel="nofollow">Tilting Gothic</a> or <a href="http://www.fontshop.com/fonts/downloads/red_rooster/block_gothic_extra_condensed/" rel="nofollow">Block Gothic</a>.</p>
