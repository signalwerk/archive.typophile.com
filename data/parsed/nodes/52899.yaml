  html: |-
    <p>Need help with this classic poster font, very common throughout the 70s! It’s sometimes mis-identified as Univers Condensed, but the lower case “g” is totally different, as is the upper case “S”. It's also commonly mistaken for SF Movie Poster.  Any help would be appreciated. Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1941 font_5070.jpg"></div><p></p>
