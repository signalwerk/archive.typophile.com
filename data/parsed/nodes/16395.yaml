      <p>&gt;When we do something often enough, it becomes (at least in part) a subconscious thing</p>
      <p>My old teacher Popper wrote about this phenomenon. His view was that everything that can become routine, does, and goes unconscious. Consciousness is to deal with what is not routine, what is changing in the moment. In fact, that is the main function of consciousness, and if I remember rightly he conjectures that consciousness evolved because of this need. </p>
