      <p>At several points in the thread the term 'subconscious' has been bandied about.  Here's the thing: When you write subconscious you seem to be suggesting that your model of the human mind hails from a Jungian form ( muddy at best ) or a new-age offshoot of a Jungian model ( usually even muddier still ). </p>
      <p>Prior to Jung, Freud used to the term unconscious. To Jung the unconscious was a term applied to 'the collective'. The Subconcsious was a term appling to an individual. </p>
      <p><cite>"1912 FREUD in Proc. Soc. Psychical Res. XXVI. LVI. 315 The term unconscious, which was used in the purely descriptive sense before, now comes to imply something more. It designates not only latent ideas in general, but especially ideas with a certain dynamic character, ideas keeping apart from consciousness in spite of their intensity and activity. 1925 C. E. M. JOAD Mind &amp; Matter iv. 111 This greater part is known as the unconscious mind, or simply as ‘the unconscious’. The theory of the unconscious is based mainly on the work of..Freud." </cite>-OED</p>
      <p><cite>"The personal unconscious, of which I also speak as the ‘subconscious’, in contrast to the absolute or collective unconscious, contains forgotten memories, suppressed..painful ideas..apperceptions sometimes described as below the threshold (subliminal). - Jung" </cite>- OED</p>
      <p>When you write 'subconscious' I can guess that you probably mean to refer to some process occuring in the mind without the mind being consciously aware of it - but then thats what 'unconscious' means. I am not saying that we all have to be Freudian. But the Freudian model of the mind is the one I think you are working with ( Conscious &amp; Unconscious mind) rather than the Jungian one ( Anima and Animus, The shadow, Synchronicity etc.)</p>
      <p>Of course there is also the popular conflation of the terms but ultimately I think the intent of the writers use in each case was to urge or suggest a more scientific or analytical perspective or tendency; in which case I suggest 'unconscious' is the term of choice because it means something more precise. 'Subconscious' is all about the waving of hands and pop psychology.</p>
