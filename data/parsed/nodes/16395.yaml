      <p>That is not really true.  It is just an illusion.  By adjusting your H&amp;J settings consistantly between rag and justified (except for the justify command of course), you will see the same economy in both.  It is actually easier to get more economy out of ragged right text. I have done experiments with my students on this several years ago when I was still teaching.</p>
