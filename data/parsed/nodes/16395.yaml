      <p>First, an important recap:<br>
      &gt; I don’t think maximizing speed of reading is that crucial a priority</p>
      <p>Actually, you're totally right. As I said in my Daidala interview, virtually everything type designers do is of trivial importance. To me there are two areas that really matter: good "safety" typography, like on medicine jars; and preserving cultural authenticity of threatened scripts (basically fighting Latinization). In my book Latinization is the single worst thing a type designer can ever do. I know because I used to do it  - and to my own script no less.</p>
      <p>--</p>
      <p>&gt; And how does the parafovea know?</p>
      <p>The parafovea pretty clearly indicates when there is no more information on the line [to be disambiguated]. That's why we never saccade beyond the end of a line, even if the previous fixation is far from the end.</p>
      <p>&gt; The parafovea I would think could see easily the right edge</p>
      <p>Sure, but it can see the end of a single line just fine too (as long the leading isn't negative or something). Now, if saccades were dozens of characters long (which they never are) then yes, a larger marker (in the form of large "wall" at the end) would help.</p>
      <p>&gt; perhaps the brain fixes an orientation based on a first look at the text block.</p>
      <p>That's too macro.</p>
      <p>&gt; We switch back and forth between looking at the page for orientation and reading.</p>
      <p>Sure, but when in deliberation performance is pretty much moot (like John was saying about "tolerances"). It's in long-haul immersion that the right edge (ie word space variance) matters.</p>
      <p>&gt; Aesthetic considerations are important, but a separate issue.</p>
      <p>I think it is indeed important to see the distinction, but just as important is the need to integrate the two eventually. When we like how something looks, we're more likely to read it, and continue reading it (although once we're reading immersively it doesn't matter). The question is, how aesthetically pleasing do people find Das Box? Enough to justify the loss in performance?</p>
      <p>&gt;  I would say this is modernist thinking: that appearance should correspond with meaning.</p>
      <p>But when forced to choose between the macro appearance of the text block versus the micro appearance of fixated text, a Modernist will go for the former almost all the time.</p>
      <p>&gt;&gt; an even right hand margin helps to maintain a regular back and forth from one line to the next.</p>
      <p>There's no reason to believe this.<br>
      Sufficient leading enables this just fine.</p>
      <p>&gt; ... is subjugated to an aesthetic. </p>
      <p>Bingo.</p>
      <p>&gt; goes against the view of most, including Bringhurst and Felici, that<br>
      &gt; for single column text 2 1/2 lower case alphabets is the ideal measure</p>
      <p>You ignored my asterisk.</p>
      <p>&gt; especially if I am trying to avoid hyphenation</p>
      <p>I dislike hyphenation* a lot. But sometimes it's<br>
      useful, so I would recommend being more flexible.</p>
      <p>* I mean end-of-line hyphenation. The hyphenation<br>
      of compound words (like "re-adjust") I'm a big fan of.</p>
      <p>But yes, making a smooth rag (especially when one<br>
      doesn't have the luxury/gall to rewrite the copy)<br>
      is no piece of cake at all.</p>
      <p>&gt; In my Globe and Mail justification helps me distinguish between<br>
      &gt; stories biased toward hard news and stories biased toward opinion.</p>
      <p>Do you think laymen do this too?</p>
      <p>&gt; keeping a justified text option in the typographic toolkit</p>
      <p>Totally, do keep all options.<br>
      Just know what they actually do.</p>
      <p>&gt; Sometimes using a rag will induce some visual distractors that will<br>
      &gt; overwhelm the benefit caused by the good word spacing a rag can give.</p>
      <p>Yes. But justification will ALWAYS ruin word spacing.</p>
      <p>hhp</p>
