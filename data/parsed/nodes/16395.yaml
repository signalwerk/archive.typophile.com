      <p>On several occasions here on Typophile, I have asked for data which shows how much better or worse a given typesetting attribute affects reading. I have received summary conclusions but never a usable measure. I know I am banging my head against the wall but I will ask again in the context of this thread:<br>
      If I were to read two 100 page books of the exact same text, with all typography exactly the same except one was set rag and one set justified, how much faster or slower would I read each than the other?  Having found that out, I would ask if that was a significant enough amount of time to be concerned with?<br>
