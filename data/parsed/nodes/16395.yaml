      <p>&gt;an even right hand margin helps to maintain a regular back and forth from one line to the next.</p>
      <p>This is what I was also suggesting. My feeling is that there are trade-offs--advantages and disadvantages to ragged right and to justification. And so what is best depends on the context. Sometimes it doesn't make much difference, sometimes ragged right is definitely better, and sometimes justified is definitely best. </p>
      <p>I'm not experienced enough to know how to define these guidelines very fully, but I would say that in general books with a single column of ample measure are best justified.  </p>
      <p>By the way, Hrant's view above that "Columns that are wider than one saccade are all the same" goes against the view of most, including Bringhurst and Felici, that for single column text 2 1/2 lower case alphabets is the ideal measure, and varying from it too much hurts readability. I have tested this for myself, and am satisfied that they are right, and that this is an important feature of good typography.</p>
