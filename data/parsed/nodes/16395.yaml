      <p>Once Hrant has decided to misuse a word, at least he is consistent in his misuse and will not be swayed from it :)  Of course, the irony in this case is that 'asymetric typography' and the rejection of justification was the rallying cry and most obvious characteristic of modernist typography.</p>
      <p>I often set text ragged-right and then, once all the text is flowed, turn on justification to see how it looks. If it looks good, i.e. even and without significant detriment to word spacing, I keep it justified, otherwise I go back to ragged-right. I don't have an ideological preference for either, but generally agree with those old monks: a nicely square text block is a happy thing, and if you can achieve it without disrupting the appropriate evenness of the word spacing (bearing in mind that we obviously have a tolerance for some variation in word spacing) then it seems merely stylistic not to. As a matter of style, there are certain kinds of texts that I would be inclined to set ragged-right: most correspondence, for example. As a matter of function, type at low resolution such as on websites usually benefits from being ragged-right simply because the pixel grid is too crude to preserve decent word spacing in justified settings.</p>
