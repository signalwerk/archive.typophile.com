      <p>Well, Hrant, if you are open then what's wrong with the possible advantages that I, Hector, timd, and Nick Shinn have mentioned in this thread: I mentioned that consistent line endings might help the eye plan where to make the last fixation on a line, and when to jump to the next line. Also that aligment left and right helps navigation signals like subheads stand out. </p>
      <p>Hector concurred with this second hypothesis. And timd pointed out that paragraph indents can sometimes look awkward with rag right text, so necessitating a full space between paragraphs. Nick Shinn pointed out a related phenomenon--that uneven rags can be distracting to the eye, seeming to give false visual queues. </p>
      <p>Of course I see that ragged right text allows you to have even word spacing, and I agree this is an advantage. But I see the advantages to justified text mentioned above.</p>
      <p>I don't see what 'modernist' aesthetics--and I really don't know what you mean by the term--has to do with the advantages or disadvantages of justified text under different conditions. It seem to me that it has specified advantages, and disadvantages or it doesn't. Then you can make your choice given the advantages or disadvantages, given your purpose and aesthetic preferences.</p>
