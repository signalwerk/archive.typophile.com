      <p>&gt;But maybe much of it gets discarded, basically because it’s useless?<br>
      The subconscious is nothing if not brutally efficient.</p>
      <p>Hrant, I think you're forgetting that reading is not just getting the meaning of individual words quickly, but interaction with the information and ideas of the author. I believe this is where Kevin Larson found the difference. The people who read the same material with good typography were able to better use what they read--a proof of better comprehension. And this makes sense as good typographic lay out is a lot about matching the visual structure to the information and ideas in the text. </p>
      <p>The ragged vs justified isn't about structure, but the 'macro' look is a lot about structure, as well as maybe where the text is in the visual field. </p>
      <p>On identifying where the text block is, and begins and ends. There is good evidence that we are amazingly good at using this information. Images bounce all around the back of the eye, but the brain sees a fixed scene out there in the world, where an amateur movie of the same scene will have the picture jumping all over the place, with our eyes unable to correct. So discard this useless information? No way.</p>
