      <p>&gt;Nothing mere about macro.</p>
      <p>I certainly agree; I gave some guesses above on how the macro might influence the micro. These may be right or not, but I am pretty confident that the marcro plays an important role, for this reason: we always scan the macro page first--except maybe if there's a carry over hyphenated word. Then after catching the word or first line, we look at the whole page. I don't think the brain consistently makes moves that are functionally useless. Since this is so consistent, I think it must be an important factor.</p>
      <p>And that is basically why justified type holds sway in longer texts, I think, in spite of the damage it does to word spacing.</p>
