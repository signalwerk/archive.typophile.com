      <p>Psychoanalysis is a form of psychiatry not psychology - but it obviously influenced both professions. And almost nobody outside of some folks in NYC and it's enviorons practice it anymore. It isn't the professional term of art I am interested in but the intellectual model in use by the public - or the lack of one.</p>
      <p>And none of this need be about belief. I am not interested in scoring points or promoting a dogma. I am advocating intellectual clarity &amp; precision. That clarity can coexist perfectly with an open or even a skeptical point of view. </p>
      <p>Moreover when I quip about Hrant defending intuition it's because I am curious. On the one hand he decrys an arty approach to type design by 'aaartists' I think he said (or something similar). But then he promotes 'intuition' - a very fruity arty sort of idea. I don't fault him for it. Holding two seemingly contradictory ideas firmly in firmly in mind doesn't make you a hypocrite  - it is a necesary state. For instance, the world looks flat &amp; the sun seems to go around the earth. I know that's not the case but I also know it does look that way. So I am still interested in how he resolves what looks to me (superficially) like a contradiction.</p>
      <p>Also, I don't really buy the Jungian opposition of the intuitive female arty &amp; the male scientific &amp; rational. It strikes me as a model that obscures more than it reveals.</p>
