      for a long time. But you yourself think serifs help readability, no?</p>
      <p>Good point, but I think practice largely supports me on this point as well. With shorter lines, well leaded, sans approach serifs in readability. This is where you find them, by and large. For example, if you check the NY Times best seller list, I bet none of the novels for many years are in a sans. And I bet you will be hard put to find even a non-fiction book in a sans. People are used to reading sans, but they don't like it in extended texts.</p>
