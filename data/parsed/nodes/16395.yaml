      <p>One thing that I find most fascinating about the conscious versus subconscious realms is that there is a migration from the former to the latter. When we do something often enough, it becomes (at least in part) a subconscious thing. Think of how some people report physically trying to hit Command-Z after breaking a cup; I myself have tried to see behind me by looking to the left... at the mirror of my motorcycle, that isn't there. And once I tried to slide the pointer off the monitor to something on the table (I was trying to point something out to a coworker) and for a fraction of a second -long enough to utter a profanity- actually got frustrated why the damn thing wouldn't go beyond the bottom-left corner of the screen!</p>
      <p>But something changes, or at least can change, when the migration happens. For example in reading we got from compiling individual letters to leveraging the parafovea and taking in (greater-than-letter) boumas.</p>
      <p>How does this migration work?<br>
      It seems Extremely Relevant.<br>
      And goddam fascinating.</p>
      <p>hhp</p>
