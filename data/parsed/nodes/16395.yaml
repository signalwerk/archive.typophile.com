      <p><em>Nick’s post suggested a 4 second window before information moves from the foreground into the background (memory).</em></p>
      <p>Memory is complicated and not necessarily background. Studies of brain activity show that the parts of the brain associated with memory -- i.e. the parts that show increased activity when subjects are asked to remember something -- are active in the perception of motion. This suggests that awareness of motion is at least partly from memory of the previous state of a moving object. This is sort of alarming when I think about how forgetful I can be :)</p>
      <p>Of course, this is background activity in terms of our being unconscious of the activity itself, but we are very much aware of the effect.</p>
