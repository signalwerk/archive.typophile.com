      <p>I like rag right. This is probably the result of too much exposure to poorly done Justified texts but practically speaking it seems safer/more pleasant for the reader to Rag.  </p>
      <p>Justification often seems to come about not as a result of desire to serve a reader but because of a twitchy, nervous, oldfashioned, english major-y or just plain compulsive book quoting client who can't be bothered to actually look at something and then trust the evidence of their own eyes. 'It say here that...' </p>
