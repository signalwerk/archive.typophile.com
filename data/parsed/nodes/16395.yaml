      <p>When it comes to ranged-left/ragged-right alignment, I find the commonly used one-em indentation of the first paragraph line insufficient. In order to work, it better be significantly deeper. To me, the practice of <em>Typographische Monatsblätter</em> of 1970s is a good model. And, of course, they never set the first paragraph after a heading without indentation when they used r-l/r-r alignment.</p>
