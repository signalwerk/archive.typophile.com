      <p>nothing profound from me, folks, just my two cents.</p>
      <p>this is why i love typophile. i'm getting the education i never had. full disclosure: i'm a newbie here and most of my work is in motion graphics &amp; animation. typography has only played a minor role in my overall time spent (though of course major if and when required).</p>
      <p>i never formally studied design; i was a painting and animation major. i tend to approach design "as a consumer", which brings me to my response to this thread: as a reader i prefer justified, and analyzing the reasons why has been fascinating. </p>
      <p>my first gut feeling is that justified is usually more pleasing to the eye, which is closely related to - but not exactly the same as - "easier to read". on further consideration i wonder if, as a consumer, i "expect" justified type as an indication of professionalism, based on expectations conditioned over time. arbitrary in a sense, but well conditioned.</p>
      <p>i like the occasional surprise of seeing clever combinations on a page, and i have both combined and sought editorial revision in various assignments. </p>
      <p>on screen and on page also present very different experiences. i find on screen reading very taxing no matter what the layout, as i am required to gaze into a light source.<br>
      and so many html defaults end up as bizarre and fragmented, complete with ads and boxes and spacing anomolies, until the eyes is led on a labyrinthine journey just to read two paragraphs. amazingly, i've seen a few magazines begin to emulate this chaos.<br>
      to my eyes the symmmetry and formality of well justified print is a real pleasure by comparison.</p>
      <p>ultimately, as many here have noted, column width, page width, font, leading, etc. all play a part. so context is everything ? including history, familiarity, language...</p>
