      <p><em>John, Do you not think the mind is busy doing things it is not conscious of? Or is it that the idea of the subconscious isn’t substantial. Or something else altogether?</em></p>
      <p>There seems to me something worryingly Platonist about 'the subconscious'. We have come to speak about this theoretical construct as if it were substantial, and many non-specialists simply presume its existence as a result of the popular use of the term.</p>
      <p>I do think the mind is busy doing things that it is not conscious of, and these things are <em>unconscious.</em> The fact that they may have effects of which the mind is conscious does not make them any less unconscious that those things that are ineffective. We are conscious of the results without being conscious of the causes. We don't need this additional construct of the subconscious as a kind of vague no-mans-land between conscious and unconscious activity.</p>
