      <p>&gt; Why do you keep acting as if everyone is talking<br>
      &gt; just about aesthetics and deliberative attention?</p>
      <p>No, I think some -probably most- people here are talking about both the deliberative and immersive aspects of this. But relying on an incorrect reading model naturally throws off a proper grasp of the latter; while the former is mostly a matter of taste. We're all humans with emotions about things (like Regularity) and our opinions derive largely from these emotions - which however other people don't [need to] share - the important thing is to worry more about what other people need rather than what you or I prefer. For example I can see myself using justification sometimes - but I can't see myself ignoring the fact that this reduces readability. Just like how I make some of my glyphs intentionally less readable in some ways, to promote aesthetics. When one harms something, the least one can do is admit it. Most annoying is when somebody pretends to care just to be more accepted by his peers.</p>
      <p>hhp</p>
