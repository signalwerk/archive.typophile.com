      <p>Justification avoids the "interference" of having shapes and coinicidences occur at the right column edge, which can be a distraction, as the reader will interpret these as potentially significant. And indeed they may be, as statistically a short line tends to indicate a paragraph end.</p>
      <p>By shapes, I mean, for instance, a succession of lines each of which is shorter than the previous, followed by the opposite, creating a concave indent.<br>
      By coincidences, I mean, for instance, two lines at full measure, followed by two much shorter lines of equal length.</p>
      <p>Of course, these ragged phenomena can be removed by artfully adjusting where word-breaks occur, but that's extra work.</p>
      <p>***</p>
      <p>It should also be noted that symmetry is aesthetically pleasing, deriving perhaps from the most fundamental level of sexual attraction. Recent research correlating physical symmetry of people's faces against the attractiveness of their pheromones discovered that symmetrical people smell sexier. Or was it that asymmetrical people wash less? Scary stuff.</p>
