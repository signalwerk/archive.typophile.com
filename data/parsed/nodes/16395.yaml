      <p>But it suggest to me that yes, there could be a part of the mind that we don't recognize conscously that nevertheless does important work. I don't pretend to be able to charcterize that part of the mind but I think the idea seems sound as a working idea. And again, it's an idea descended from Freud. An idea ( according to me ) best refered to as 'the unconscious' as you already know.</p>
