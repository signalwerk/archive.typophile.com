      <p>It all depends on...</p>
      <ul>
      <li>first and foremost, the column width;</li>
      <li>the overall layout;</li>
      <li>the number of runarounds you're dealing with; andli&gt;
      </li><li>the typeface being used.</li>
      </ul>
      <p>Too narrow a column width can create rivers of white space and/or excessive hyphenation if you justify. If it makes sense within the context of the layout to set ragged right, do so, although ragged left is far more common and, in most cases, more readable. In regard to runarounds, see the first observation. And, IMHO, some typefaces just don't look good justified.</p>
