      <p>Christian, you seem to be treating evenness of word spacing in absolute terms: it should be identical on every single line. Why? The purpose of word spaces is to delineate the beginning and end of words and so to cue fixations. I can see a very good argument for all the spaces on one line to be as even as possible, but a slight variance between the word spacing on different lines <em>so long as they remain within our functional tolerance*</em> is perfectly defensible.</p>
      <p>*When I wrote much earlier in this thread that it is clear that we have a tolerance for variation in word spacing, I did not mean, as Hrant seemed to understand me, that we have a toleration, i.e. that we put up with it. I meant that we have a <em>functional tolerance</em> within which I challenge you to find any significant measurable difference in speed or accuracy. Even word spacing is very desirable, and this is why we are able to identify bad justification so easily. But this evenness is not an absolute, and that is plainly demonstrated by the fact that even in ragged right setting the actual white space between words varies depending on the letters at the beginning and end of the words. Letters with particularly large inherent whitespace, such as T, are best kerned to the wordspace slightly, but I have not seen a single typeface or piece of typesetting in which some wordspace-absolutist has gone to the trouble of making the optical space between all words on all lines identical. We have a functional tolerance for some variation in word spacing, and if justification can produce results within this tolerance, then it is good.</p>
      <p>When it comes to reading, it is fruitless to search for the optimal or the absolute. In microtypographic terms, reading is an activity that takes place on a plateau. Once one has climbed to a certain level of readability, further typographic refinements simply move one horizontally: they alter the terrain (the reading experience) but don't actually get you noticeably higher in terms of speed or accuracy. There is no peak, no summit to be achieved.</p>
