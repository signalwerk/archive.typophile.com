      <p>Equivalent or natural spacing is and should remain the standard for typographical formatting. This standard has a perceptual processing and an aesthetic dimension. On the scale of word and line, unjustified setting preserves the optical integrity of the word or line, facilitating effortless perceptual processing and unencumbered eye movements. And the eveness of colour at the text-block level is monumentally appealing.</p>
      <p>Well-written expository prose, though, is carefully structured according to paragraphs and sections. Justified texts with appropriate indentation  and subheading mechanisms do a very good job of conveying basic discourse-structure and discourse-type to the reader. Is it loosely conceived or tightly structured?</p>
      <p>In the grounding texts of a people or in the fictional texts of a literary tradition, justification helps differentiate between the narrative portions and dialogue, or between the narrative portions and mythopoeic glosses or versified intrusions. </p>
      <p>In my <em>Globe and Mail</em> justification helps me distinguish between stories biased toward hard news and stories biased toward opinion.</p>
      <p>In my <em>Globe and Mail</em> there are as many problems with the rag as there are with the justification. On short measures sometimes lines become too short, to the point where it becomes difficult to distinguish them from the last line of the paragraph endings. Elsewhere a particle like 'to' or 'in' or 'at'(or a hyphenated 'or-') hangs far beyond a preceeding or / and subsequent line, and turning it would create a pocket of whitespace, or a concave shape that is both ugly and can be confusing to our reading-ware. So there is a lack of care because of the press of production time, but also inherent difficulties. This levels the playing field somewhat.</p>
      <p>So the benefits of keeping a justified text option in the typographic toolkit are text-presentational and gestural-atmospheric benefits. Much of what justification provides has a subconscious impact on the reader's approach to the text. I have problems when one dimension of the reading / text-presentational equation is placed over against another to the point where attentivenes to the one becomes villified or seen in inherently oppositional terms.</p>
      <p>My fourier experiments convince me that there is a margin of variability in spacing before the optimum distribution of role-architectural components (from a 'visual wordform resolutional' or 'perceptual processing' point of view) on the horizontal axis begins to break down, and seamless processing suffers.</p>
