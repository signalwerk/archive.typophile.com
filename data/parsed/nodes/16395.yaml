      <p>&gt;are more determinative of, or foundational to, readability than questions of aesthetics</p>
      <p>Peter, I think you may be separating readability and aesthetics a bit too much. I suspect in some cases they may have common foundations. For example, the eye seems more sensitive to verticals being out of true than horizontals. This is probably because a beam or tree that is leaning can fall on our heads, so seeing 'leaning' is a survival trait. But then 'vertical' gets the emotional overlay of being strong, "upright," honest, and has an aesthetic dimension. But at the same time, because of the survival aspect, our brains are I think wired to quickly see verticals, so they may be slightly more efficient--eg roman vs italic. </p>
      <p>All of this is speculation, of course, but it has enough plausibility to me that I don't think one should assume that aesthetics and quick recognition are completely separate matters.</p>
