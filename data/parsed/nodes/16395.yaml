      <p>I'm unimpressed with the kind of grammar and typography employed by newspapers (usually.)</p>
      <p>Case in point, The Globe and Mail (yes, that's right): A little over a month ago there was a long article, showcased on the front page, about the rising economic power of China. A salient feature of the article was a comparison between Canadian and Chinese imports/exports. </p>
      <p>The headline: "Where We're At." </p>
      <p>I immediately tossed the paper aside, no longer interested in "where we're at." Where we ARE, in fact, is in a dismal state of affairs when it comes to grammar, not just typography.</p>
      <p>Which leads me to my next problem: so-called "hard" news is justified, while "soft" opinion pieces or editorials are typically left rag-right. This is all as if to suggest that rag-right is unprofessional or too casual and unimportant to be taken seriously. As if the rag can't be massaged and adjusted. While the mock-professionalism or the palpable desperation for gravitas exuded by justified type will grab our attention.</p>
      <p>I notice no difference in "importance" communicated by the structure of rag-right vs. justified text. It's just easier to read ragged-right text, that's all.</p>
