      <p>Modernism was a recognition, at the level of theory, of a change at the level of material production. It was the intellectual expresion of the growth of mass-produced typography. Mass production brought about a division of labour between designers (who specified an original) and typesetters (who executed the original over and over). The preoccupations of modernists were efficiency of form, logical specification of design, new forms for new (modern) functions. Tschichold’s New Typography is a clear and energetic expression of all this. </p>
      <p>Wordspaces:<br>
      Adrian Frutiger calls wordspaces ‘boundary instruments’, ie, they mark the end of one word and the start of the next. Ernst Hoch proposed that every wordspace means the same thing, therefore every wordspace should look the same. I have a lot of sympathy for this argument. I would say this is modernist thinking: that appearance should correspond with meaning. </p>
      <p>The only argument I’ve seen in print for justified setting was in<br>
      Notes on Book Design by Derek Birdsall. He suggests -- and I’m not entirely convinced -- that an even right hand margin helps to maintain a regular back and forth from one line to the next.</p>
    html_clean: |-
