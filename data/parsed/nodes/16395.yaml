    html: |-
      <p>&gt;superior spacing of rag-right always outweighs any modest aesthetic benefit of justified</p>
      <p>So far as I can see, almost all books and newspapers are justified. My hunch is that sticking to this is not just a matter of conservatism, but  that justified text unifies text blocks. With the text blocks unified, the sub-heads and other navigational signals stand out more.</p>
      <p>Another possibility is that the consistent ending location of the line makes it easier for the eye to plan and know when to jump to the next line.  </p>
      <p>So it may well be that the stubborn preference for justified text has a basis in readability, and not just aesthetics and habit. </p>
      <p>No doubt the ragged right has more consistent spacing, but with longer lines, as in a book, I personally don't find the spacing of justified lines with hyphenation present any problem as far as readablity. (Hyphenation itself can sometimes slow you down, particularly if there is a lot of it, or across page or column breaks.)</p>
      <p>So it may be that ragged right, at least at longer measures, is more of an aesthetic choice, and the justified more functional.--The opposite of what most here are arguing.</p>
      <p>I most often see ragged right in shorter material, such as advertising, where navigation is handled by large spacing and placement, something not so possible in books and newspaper columns, crowded with text. </p>
      <p>I don't know whether my hypothesis on the functionality of justified text is correct, but I'd be interested to hear others' views.</p>
