      <p>"data"</p>
      <p>Chris, I doubt the data will be forthcoming because too many of the variables not relevant to the issue--but factors in speed--can't be controlled.</p>
      <p>Another problem is that for competant readers the bottleneck is not at the perceptual (visual wordform resolution) and mechanical (eye-movement) end, but at the cognitive processing or sense-following end. This can be inferred from tests on numbers.</p>
      <p>If we were able to compare the computation costs in the visual cortex in neural activation terms of natuaral versus adjusted spacing, we might find something like an inflection point, where for a range of adjustments things stay on a plateau, and with more dramatic adjustments neural "work" increases at a steeper rate.</p>
      <p>Unfortunately testing of neural activity ain't there yet.<br>
      Kevin's tests on spacing might reveal something about spacing that we can hang our sense of the importance of space-craft on. From this we might be able to infer ranges of tolerence, and an assessment of the impact of justification.<br>
      </p>
