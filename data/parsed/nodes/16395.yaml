      <p>I find that right-ragged text often doesn't work* with a paragraph indent so it requires extra leading between paragraphs, and if this is on a two – or more – column grid the space needs to be at least half line space (so that occasionally, at least, the baselines align), ideally the space would be a full line space (on multi-column layouts) so you end up using more space with ragged-right, than you would with justified, indented pargraphs.<br>
      * and reduces the attractiveness of one straight side</p>
