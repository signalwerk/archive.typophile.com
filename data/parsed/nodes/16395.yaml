      <p>The main argument for always using rags over justified paragraphs seems to be that even word spacing is better to legibility. But if we ponder other factors such as the election of a good typeface, good printing conditions, good page design, good typesetting, etc... it seems to me that a perfect word spacing is not as important as it would seem (of course that a bad word spacing will ruin any text).</p>
      <p>Sometimes using a rag will induce some visual distractors that will overwhelm the benefit caused by the good word spacing a rag can give.</p>
      <p>Héctor</p>
