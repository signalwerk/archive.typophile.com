      <p>This thread has been interesting but frustrating, because we have a lot of different analyses of the merits of justification vs rag, but no evidence. Can we bring evidence to bear, lacking systematic tests? I think we can. Readers, including designers, evidently find no big burden in reading either type of text, as is evidenced by the fact that they are mixed in the same publication, as has been pointed out. </p>
      <p>In other words, both are so widespread that I don't think we can simply dismiss the persistence of justified text by conservatism. If readers and designers experienced a big difference, conservative aesthetic tastes wouldn't hold them back from demanding and supplying rag text. Thus whatever the functional differences--and I do think there are functional differences in some circumstances--they must have a small impact. So while I think that the plateau which John argues for has some hills and scenery, I think the evidence shows that the moutain peak for rag text that some are arguing for is contradicted by the reactions of readers.</p>
