      <p>"Typical typesetting: get some copy, put it in a rectangle, hit Justify. Tweaking the default settings? Maybe. But certainly not at the level of individual lines."</p>
      <p>I consider myself a typical and decent typographer.<br>
      In any given year I am given miles of copy.<br>
      Typically I flow it into a rectangular grid, lock to a baseline grid and about 75% of the time I hit justify.<br>
      (When I set up the typographical specs for the project I dramatically adjusted the default settings and did several cycles of testing, often using film output.)<br>
      When I have completed my layout (magazine) or formated the text (book), I scan the columns and textblocks for gappy lines and problem paragraphs. I am good at spotting problem lines, and if I miss some, my copy-editor will point them out. I usually don't open the spacing to fix the problems, I usually tighten within very constrained parameters. If problems remain I do my adjustments line by line. If problems still remain I ask the editor if anything can be done about it.</p>
      <p>So when I am tweaking type in a justified context, most of my attention is on spacing. Within the typographical parameters I have set I believe I can acheive spacing within tolerence 99 percent of the time, or better. If not, my specs or the choosen type is at fault.</p>
      <p>When I am setting unjustified text, I do not have to worry about the spacing. I need to worry about line endings and the rag. The amount of work is about equal, and about 5 percent of the time I have to be satisfied with rags I don't like, even in wide columns.</p>
      <p>In both cases my perceptual processing read-ware picks up the slack without to much complaint.</p>
