      <p>I guess I'm not using a formal model. I tend to base my terminological choices on what I think the "audience" reads into the terms. I do this by observing and thinking. For example, I believe that "unconscious" conveys an element of ignorance, while immersive reading has none of that; "subconscious" does not convey any ignorance - it does convey "hidden" which is in fact great; as for "non-conscious", that's not as bad as "unconscious", but negativisms generally make for bad terminology (think of how disliked the term "non-Latin" rightly is). Also, psychologists -at least ones who don't have the sense to realize I'm not addressing them in particular- are not a big part of the audience here, so I don't have to worry about Freud versus Jung versus Santa Claus.</p>
