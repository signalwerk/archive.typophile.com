      <p>&gt;This sounds entirely anti-saccadic.</p>
      <p>Not really. In a narrow column there is less space for side-to-side eye movement (saccadic or otherwise) to occur. Therefore the meaningful field of vision of reading (foveal and immediately parafoveal, during the span of conscious awareness) is constrained to a more vertical dimension. More straight down = less slalom.</p>
      <p>But I can't prove this, it's just an idea. Perhaps there are instead upwards saccades that slow things down. However, it should be possible to conduct experiments to determine an optimum line length, or whether ragged is faster than justified -- the same type of tests that Kevin Larson did for ClearType, which determined that it was 5% faster. Having said that, I don't think maximizing speed of reading is that crucial a priority, or that mechanical efficiency is the best criterion to apply to typography.</p>
      <p>&gt; Please, it’s been over 100 years already.</p>
      <p>Does this kind of scathing comment add anything to the discussion?</p>
