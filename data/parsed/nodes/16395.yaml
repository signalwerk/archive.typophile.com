      <p>"used commonly for any mental process we are unaware of that affects us"</p>
      <p>Unless we have been made aware of them through disciplined probing we are unaware of the neurophysical, motor, attentional and anticipatory mechanisms underlying perceptual processing in reading. They remain hidden.</p>
      <p>My complaint with calling all of this 'subconscious' is that that might obsure the identity and specificity of these mechanisms, keep veiled in mystery their actual functioning, or deflect attention away from their proper scrutiny. Yet an important factor in all these mechanisms is that they proceed without overt deliberation. </p>
      <p>Where I agree with Hrant is that it a mark of responsible action in the type-design domain to be mindful of these underlying processes that proceed without deliberative effort, because they are more determinative of, or foundational to, readability than questions of aesthetics might be.</p>
