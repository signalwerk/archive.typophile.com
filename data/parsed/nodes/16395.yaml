      <p>Fully-justified text is an aesthetic construction/form/device that forces the natural spaces between words to vary in order to achieve a straight margin on either side of a block of text (usually the right side.)</p>
      <p>Ragged-right (or rag-right, etc.) text does not alter the spaces betwen words, leaving instead a "ragged" margin, where lines might end at varying distances from the margin.</p>
      <p>I'm not a typographer, typesetter, or a designer (though I do design what I produce on the page.) But something tells me that there is something wrong with justified text, when the rule for optimum comfort and efficiency in reading is that word-spacing must be even, and it must be tight. Justified text, even when adjusted, ignores that rule as a matter of course, in order to achieve some kind of gravitas, or air of order and neatness. The natural spaces between words, the very even spaces that allow the eye to move easily across the line without fixating for a brief yet perceptible moment on the unusual distance between two words, is subjugated to an aesthetic. And this aesthetic does not offer variety, interest, or a reprieve of any kind (in the case of long tracts of text.) Instead, it tries to promote exact order, straight, unyielding angles, and an air of "professionalism", whatever that means.</p>
      <p>All this, often at the expense of tight, even wordspacing.</p>
      <p>I find this, even on principle, rather disturbing. The very idea that word spacing must be adjusted and "put back in order" somehow under these conditions so that some semblance of readability remains in this aesthetic straitjacket, seems to fly in the face of common sense. And I see it in my own experience. No matter how accustomed I've become to reading justified text, I always have an easier and more pleasant time (even if it is only slight) reading a well-set rag. And it doesn't take a lot of work to achieve a fairly smooth rag.</p>
      <p>I've been trained to prize one thing above all when it comes to readin' and ritin': Readability. Anything that compromises this must have a damned good justification for its existence, or should be avoided altogether.</p>
      <p>Am I becoming a zealot of some kind?</p>
