    <p>Do you prefer a well-set right rag, or a well-set justified page (body copy, long tracts of text)?</p>
    <p>Give reasons, if you can. I usually prefer a nice rag, but I've been improving my ability to set justified type as of late, so I find myself torn between the two styles.</p>
