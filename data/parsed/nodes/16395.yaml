      <p>&gt;I don’t think I believe in the subconscious.</p>
      <p>Looking on the internet, 'subconscious' does not seem to be a technical term in psychology, except for psychoanalysis. However, it is used commonly for any mental process we are unaware of that affects us, as the Oxford Concise definition indicates. So while there may be a better term for those features of a typeface that affect the reader unawares--such as Eben's suggestion 'subliminal'--the term 'subconscious' is not a misuse of words. </p>
      <p>Alfred Adler's objection to Freud's notion of the unconscious was that it is too much like a "demon from the deep" which comes up and acts on its own. Adler believed strongly in the importance of the unconscious in emotional psychology, but expressed its role in his phrase "we know more than we understand." By this, he meant that our feelings and actions are organized around purposes that we may not understand ourselves--such as proving we are better than the other fellow by defeating him in argument! In this sense, I do believe in 'subconscious' purposes. </p>
      <p>Also for seriously disturbed persons, such as those suffering from delusions, Freud's "demon from the deep" may not be so far off base. But for people in the more normal range, I think Adler has it more right.</p>
