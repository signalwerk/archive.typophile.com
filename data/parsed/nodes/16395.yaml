      <p>The problem is far from boiling down to pure esthetics or paper-saving.</p>
      <p>A review article titled 'Typographics' appeared in the Scientific American magazine in the early 1980's, which mentioned, among other interesting things, tests demonstrating the human-engineering significance of typesetting a text in way that supports a uniform reading pace. It was found out that a reading process, which was not smothly rythmic like a lullaby melody, led to stresses and might eventually become harmful to the reader's nervous and/or ophtalmological state. A pronounced ragged-margin layout generates similar consequences.</p>
      <p>Hence, the more uniformly the word spaces and line endings are distributed the better for the reader.</p>
      <p>My personal years-long practice as an engineer and a researcher having to work a lot with the technical literature just confirms the above observations.</p>
      <p>Much of the discussion at this forum tacitly implies English (except for a few references to Armenian). However, there are languages like my native Russian or, say, German, which abound with long words so that you will get either word spaces or line end positions jumping drastically from line to line unless words are hyphenated. Thus what may appear acceptable if not preferrable in English can be unfit for other languages.</p>
      <p>For me this is a rather sensitive issue since for more than a decade I've been involved in a project in the course of which a great number of bilingual (English-Russian) documents are issued and many of them are finally formatted by the Americans. Setting the English version unhyphenated flash left, they insist on us applying the same typesetting rules to the Russian. So far all my attempts to convince my opposite numbers that this is inconvenient and is not good for my colleagues' mental/eye health have failed.</p>
