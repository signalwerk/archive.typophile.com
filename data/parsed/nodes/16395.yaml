      <p>&gt; One can’t ignore that their ideas are everywhere, at least in western society, and we “learn” them from outside sources, even if in a quite “un-conscious” manner.</p>
      <p>Exactly. We are exposed to them and without ever thinking 'do I think this model of x holds water?' we accept them as a given &amp; go on basing new ideas on the shared cultural assumptions.</p>
      <p>&gt; There seems to me something worryingly Platonist about ‘the subconscious’.</p>
      <p>I agree actually. But my main point is that to you it is possibly platonist, To Hrant it is equivalent to unconscious, so somebody else yet another definition &amp; so on. It's a murky muddy sort of term. Until it gains better definition it will fail to be all that useful.</p>
      <p>&gt; this temporal window should not be dismissed</p>
      <p>Agreed.</p>
      <p>As far as we know has anybody done tests that compare rag vs justified texts? If so it would be important to look at the texts too to see if the justification was a hash job or well done. </p>
      <p>&gt; An interesting experiment would be to see if someone could read their own writing as fast/well as a text typeface.</p>
      <p>That would be interesting if ( and I think this is increasingly not true ) the person had spent a decent amount of time reading his or her own handwritting. Just because you make something doesn't mean you are familiar with it as a product - or as a user. Ultimately I bet that more objective factors would trump the effect familiarity in handwriting.</p>
      <p>&gt;Or maybe good typography takes into account how<br>
      little relative relevance that period can have.</p>
      <p>I am inclined to agree. But we won't know until studies are done.</p>
      <p>What strikes me about the debate about indentation or rag vs justified is the extent to which any of these methods if it is well done is pretty marvelously effective.  And they make me eager to read a text. The reverse is fully true as well.  Given me a sweet justified text over a botched rag anytime.</p>
      <p>Which means that for me the important things have to do with appropriate font choice line spacing paper &amp; the like. That said, if all other things are equal, rag is what I like to set &amp; read the best. I must like my words neat &amp; tidy more than I like my paragraphs to be flat on both sides.</p>
