  html: |-
    <p>The Tiger Widget, <a href="http://www.figlet.org">Figlet</a>, generates ascii text in about 9 different styles. You type in the word and it generates the ascii. It's fantastic. It offers the convenience of adding the text to your clipboard so all you need to do is paste it into your app.</p>
    <pre> ___         _           _   _    
    | __|_ _ _ _| |_ __ _ __| |_(_)__ 
    | _/ _` | ' \  _/ _` (_-&lt;  _| / _|
    |_|\__,_|_||_\__\__,_/__/\__|_\__|
                                      

     _____                                
    () |_  _,       _|_  _,   , _|_ o  _  
      /| |/ |  /|/|  |  / |  / \_|  | /   
     (/   \/|_/ | |_/|_/\/|_/ \/ |_/|/\__/
                                          
    </pre><p>
    <a href="http://www.code-line.com/typecast/">Type Cast</a> is a Tiger widget from Code Line Communications that lets you preview fonts installed on your system. Good for its simplicity. One problem is it seems the kerning falls out, leaving some awkward spacing.</p>
