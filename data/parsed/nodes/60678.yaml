  html: |-
    <p>Why do you insist on resizing my text in a text box as I type!? (Even when I uncheck the "shrink text to fit" box.)</p>
    <p>Why does copy/paste not retain basic stuff like font attributes (size, color, font even)?</p>
    <p>Why is everything positioned relatively (and not with coordinates or measurements)?</p>
    <p>PowerPoint is the anti-typography.</p>
    <p>Srsly.</p>
