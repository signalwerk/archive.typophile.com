    html: |-
      <p>Joe,</p>
      <p>I dislike PP as much as the next guy. But you can position/move using coordinates/inches.</p>
      <p>If you select an object and Ctrl+click/right click, and choose Format Shape, you can move and item down to the hundredth of an inch. If you set the "origin" to the top left corner, that will give you a de facto coordinate system.</p>
      <p>Helpful?</p>
      <p>jarrod</p>
    html_clean: |-
