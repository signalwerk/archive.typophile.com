    <p>One of my friends comissioned me to make a logo for his organic food imports company. Basically the idea is that its a combination of organics and nicaragua, so it's called Organíca. Innitially he wanted me to do something that looked like OrgaNica or orgaNICA to make the distinction between the terms clear, but i got him away from that style of blunt information. So this is what i've come up with so far. Im not sure how i feel about it and im not sure if i like the two colored leaves or just one. Any feedback would be much appreciated</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/organica.jpg" width="642" height="800" alt="">
  html_clean: |-
    <p>One of my friends comissioned me to make a logo for his organic food imports company. Basically the idea is that its a combination of organics and nicaragua, so it's called Organíca. Innitially he wanted me to do something that looked like OrgaNica or orgaNICA to make the distinction between the terms clear, but i got him away from that style of blunt information. So this is what i've come up with so far. Im not sure how i feel about it and im not sure if i like the two colored leaves or just one. Any feedback would be much appreciated</p>
