    html: <p>Also i forgot to point out, in the top one the text is slightly heavier than the other three. I thought the text overall looked a little too heavy compared to the leaves (if you stand back you'll see it), but I couldnt think of a better way to fix that. Im not totally happy with the thinned out text on the lower ones, i dont think its thin enough to balance, but if i thin it more it looks worse. I couldnt think of a good way to make the leaves bolder.</p>
