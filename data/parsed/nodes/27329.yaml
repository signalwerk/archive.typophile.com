      <p>First of all, I think the overall idea works, and I like the two leaves. Number one is also my preference.</p>
      <p>However, I think that if there's one thing here that can be improved, it's the choice of typeface. I find this face very "inorganic" -- no modulation, no torque, too "mathematical". I think the face should feel natural, and this one feels artificial to me.</p>
