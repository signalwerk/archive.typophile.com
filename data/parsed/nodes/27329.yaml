    html: <p>Personally, I'd go with the first option. The double leaves sort of wrap around each other, giving a feeling of warmth and trust, while a single lonely leaf is just that, a single lonely leaf. Also, in my opinion, having the leaves next to the name makes it feel a bit tacked on, almost as an afterthought, while putting them on top of the 'i' makes them feel a bit more integrated. The difference isn't that great, and there is something to be said for having it on the same line as the text. There's something about the leaf design itself that puts me off a bit, though. Maybe you could look at some other leaf shapes to see if you can find some other forms that work well.</p>
    html_clean: <p>Personally, I'd go with the first option. The double leaves sort of wrap around each other, giving a feeling of warmth and trust, while a single lonely leaf is just that, a single lonely leaf. Also, in my opinion, having the leaves next to the name makes it feel a bit tacked on, almost as an afterthought, while putting them on top of the 'i' makes them feel a bit more integrated. The difference isn't that great, and there is something to be said for having it on the same line as the text. There's something about the leaf design itself that puts me off a bit, though. Maybe you could look at some other leaf shapes to see if you can find some other forms that work well.</p>
