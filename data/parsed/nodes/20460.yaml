    html: |-
      <p>Ah, I see. </p>
      <p>These Garamonds are from different families, even though they are all named Garamond. Have you seen samples or specimens of these? </p>
      <p>I wonder what the final result is suposed to be: will you distribute the fonts to your organization, or keep them for your use, or...? I ask because you might not need to go through all these steps if your goal is simply to use them on your own machine. Also, re-combining them may be unnecessary....</p>
      <p>It looks from the font names like you are trying to combine 3 or 4 different families of Garamonds. ITC Garamond, which it looks like you have, is very different from Adobe Garamond and that is noticeably different from Garamond Three, which you also have. So you may want to seek out the original install discs of these fonts to see where they came from and how they were grouped originally. That may explain why they appeared in the font menu in more than one place, and why you received them in sub categories. They are different.</p>
      <p>I’ve attached a gif showing a variety of the available Garamonds (just the romans, regular or book weight). You can see that some of them would not work very well together (visually) if you had them all in the same suitcase. Since you have been assigned to be the font guy there, you may want to become familiar with these. Be advised, however, that this is the tiny tip of a gigantic iceberg; if you don’t want a new obsession to take over your other work, you might have to tell your boss to find another font guy or gal. Figuring out the different Garamonds is a good first task to attempt; if you don’t have the patience or interest for it then you may not be a type nerd like me. </p>
      <p>In your list there are some small cap and Oldstyle figure fonts (end with OSF or SC). They are separate fonts from the Regular ones. In PostScript we always had to choose between small caps and lowercase because you could only ever have 256 characters in a font. You can use them together, but you have to mix them in your document, like epoxy. OpenType is a new format that allows much larger character sets, which means the small caps, oldstyle figures, alternates, ligatures, etc. that are part of a single style (Roman, for example) can all go in one file. That would clean up your font list a lot. However you cannot group all the characters from the Bold Condensed in the main Bold OpenType font. Each style has its own font. And of course you would not put the characters from ITC Garamond in a file with the Adobe Garamond. You would have a revolt on your hands! ;)</p>
      <p>There are some books you might like to have to help with this: </p>
      <p>How To Boss Your Fonts Around,  by Robin Williams,<br>
      Anatomy of a Typeface, by Alexander Lawson,<br>
      Thinking With Type, A critical Guide... By Ellen Lupton<br>
      The Elements of Typographic Style, by Robert Bringhurst</p>
      <p>There are others, maybe some other typophiles will recommend. There are other books listed in the typowiki as well. </p>
      <p>Now, I haven’t really solved the problem you wrote about. I didn’t ask which version of FontLab, or platform, but I think I should suggest you check the FontLab site for support info (there’s a forum to visit), since the problem you’re having could be a bug. The newer version of FL (5.02) seems to be more stable than the previous one. I realize the FontInfo window in FL is a hornet’s nest, and managing a lot of styles from FL is likely to make anyone cry, So don’t get too burned up. </p>
      <p>Another option is to employ a font management program, and there’s a great new free one out from Linotype: FontExplorer X. I am not sure, and others can chime in here, but I think it might have the ability to organize and re-unite font families. That could solve the problem for the whole office, without cost. Just an idea. </p>
      <p>Birthday cards sound nice, but I’d rather that you have a good experience with your fonts and keep your boss happy.</p>
      <p></p><div class="imageWrap"><img src="/files/garamonde_4108.gif"></div><p></p>
