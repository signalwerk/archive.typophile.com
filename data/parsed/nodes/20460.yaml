      <p>Awesome, thank you so much.  I was starting to suspect that I’d have to totally submerse myself in this font stuff to ever get a real grasp on it.  It looks like my worst fears have been realized.  It’s time I become a type-nerd.<br>
      Now, I’m working on Fontlab 5.0.2, and I understand you can make a single opentype font that is many characters deep.  However, I don’t see how you make them.  Is that what glyph generating does?  And once you do generate some glyphs, i.e. “A.smcp;B.smcp;C.smcp...” how do you toggle between those when you’re in another program like InDesign?<br>
      Maybe I should tackle a smaller font family first, like the Garamond Books.  If I have each style in Fontlab 5 and they’re all seperated and I have them saved as vfb’s or seperate otf’s or whatever I need to save them as, how do I get them to combine into one file that can be dropped into Extensis Suitcase and turned on so that all programs can use it?  Does that make sense?  It does to me, but I’m not sure I’m sane anymore.</p>
      <p>Also, I was also starting to see that book and regular Garamonds wouldn’t work together, so thank you Miguel.  You’ve saved me another entire eight hour shift of complete frustration.<br>
      Tell me, do you guys dream about font vectors?  Because I do.  And it sucks.</p>
      <p>Thanks again for everyone’s help.  And I really am having fun.</p>
