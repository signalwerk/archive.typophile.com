    html: <p>I’m sure we’ve got the liscencing, that’s not really my issue.  My problem is that I don’t know what I’m doing, but everytime I mess around with it, I get something new.  Like, the set of fonts my boss gave me seems to be a mixture of some ITC’s and then the standard Adobe fonts, which I now see will never mix, and all of them are post-scrypt fonts.  There’s two major issues there.  One, he asked me to make a set of Open Type fonts out of these post-script fonts to match this Small Caps OpenType Garamond we have.  Two, I have no idea what the hell that means.  I thought I could just stick it all into Fontlab, regenerate them as Open-Types, and tthey’d naturally group themselves together in InD CS2.</p>
