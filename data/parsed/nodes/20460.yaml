      <p>A-ha!</p>
      <p>It may be that you don’t know what you’re doing, but your boss really doesn’t know. It isn’t worth your or your boss’ time ( = Money ) for you to try to make OpenType fonts from what you have. </p>
      <p>1. It’s MUCH harder than you are prepared for - weeks and weeks of tedious work you’ve never done before</p>
      <p>2. The typefaces you are starting with aren’t that versatile or useful anyway (ITC Garamond is only useful for a very dated kind of display work, no text)</p>
      <p>3. The problem is easily solved by licensing well-made OpenType fonts for your whole company. OpenType fonts are cross-platform and can be installed on Macs or PCs. Same file goes to anyone. Professionally-made OpenType fonts will have appropriate kerning, encodings, character sets, and functional OpenType features which are useful to you when using InDesign or Illustrator. Worth the money.</p>
      <p>Consider conferring with the design people in the company and see if there’s any consensus on what typefaces they would want. Choose one serif and one sans family, license them, distribute them and declare them corporate typefaces. Delete the others and join the 21st century. Then you can get back to your regular work. </p>
      <p>Versatile, workhorse OpenType Pro serif types: </p>
      <p>Bembo Book Pro<br>
      Adobe Garamond Pro<br>
      Adobe Garamond Premier Pro (a different design from Adobe Garamond with more size variants)<br>
      Minion Pro<br>
      Adobe Caslon Pro<br>
      Galliard Pro<br>
      Utopia Pro<br>
      ITC Charter Pro</p>
      <p>Versatile, workhorse OpenType Pro sans fonts:<br>
      Myriad Pro<br>
      Meta Pro<br>
      Gill Sans Pro</p>
      <p>And superfamilies with harmonious Serif and Sans variants (can’t go wrong here):</p>
      <p>Legacy Serif and Sans Pro<br>
      Mentor Serif and Sans Pro<br>
      Absara Serif and Sans OpenType<br>
      Freight Text and Sans OpenType</p>
      <p>Best of luck!</p>
