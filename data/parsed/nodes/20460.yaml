    <p>Okay, I’m a really new user of Fontlab, and I have an extremely frustrating problem.  My boss has given me the company’s old Garamond font which, right now, is broken up into about four sub catagories.  That is, when you go into InDesign CS2 the font pulldown menu shows Garamond as all over the place.  All together there are 31 styles and about 3 catagories for them all to go into.  So, I singled out all the fonts, put them into Fontlab where I can now save them as vfb’s or otf’s but I can’t generate a suitcase that will allow for so many different styles within one Family.  I’m sorry if I’m confusing anyone, this is really hard to explain.<br>
    I’ve tried changing the FOND IDs and made sure the Family Name, the Font Name,  and the Full Names were all written the way they should be according to Adam Twardoch’s posts and Leslie Cabarga’s book.  Every time I wind up with the same message...</p>
    <p>“Styles in FOND named “Garamond Book” cannot be merged.<br>
    You have used duplicate styles.<br>
    Cannot Proceed.  Please fix the conflict.”</p>
    <p>But that’s not true, I went through every single font info box and made them all unique to the font, regardless of file type.  There’s no way the fonts have identical styles, they’re all named differently.  Especially in the FOND ID line.  Am I just way off track and there’s no way to stick so many fonts into a single family?  Have I been pulling my hair out for no reason.  It seems like a perfectly normal application for the program.  Right?  Thing is, the end result has to be an Open Type font.  Mac Type 1 will work, but what I really need is an Open Type.</p>
