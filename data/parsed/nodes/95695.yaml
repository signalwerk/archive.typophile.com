    <p>All,</p>
    <p>I see lots of Golden Type and Italian Old Style influence in Parkinson, and at the same time it has a lot of attitude, which I love. But it's clearly a display face; I couldn't get it to work as body text for a newsletter-type publication. So I'm looking for its partner(s).</p>
    <p>I know that people generally say that a sans isn't good for body text, unless it's a certain kind of sans. Here's Frutiger as body-text, obviously: <a href="http://www.fonts.com/browse/designers/jim-parkinson" title="http://www.fonts.com/browse/designers/jim-parkinson">http://www.fonts.com/browse/designers/jim-parkinson</a> -- and I'm just a big fan of Frutiger in general. (Avenir is a close second.)</p>
    <p>Thus, the question, posed in the Subject: what <a href="http://www.myfonts.com/fonts/linotype/frutiger/" rel="nofollow">Frutiger</a>-esque sans might you know of that shares some features or DNA with <a href="http://www.myfonts.com/fonts/fontbureau/parkinson/" rel="nofollow">Parkinson</a> so as to make it a good, toned-down-but-compatible companion to it? And while we're at it, would you hazard an opinion about a serif text face to complete the triumvirate?</p>
    <p>Titling/Display: Parkinson<br>
    Web text / print captions: sans<br>
    print (newsletter) body text: serif</p>
    <p>Many thanks.</p>
