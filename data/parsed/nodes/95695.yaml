      <p>Until I finish my own, I'm looking at <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/parkinson/" rel="nofollow">Parkinson</a> / <a class="freelinking external" href="http://www.myfonts.com/fonts/type-together/soleil/" rel="nofollow">Soleil</a> / <a class="freelinking external" href="http://www.myfonts.com/fonts/shinn/goodchild/regular/" rel="nofollow">Goodchild</a> as a tripling. Turns out I don't think Goodchild and Parkinson are similar enough to conflict with one another. Goodchild might not have the "mood" I'm looking for, but it's unfussy, plainly communicative, and soooo clean, and I'm starting to suspect that I'm trying way, way too hard.</p>
      <p>Not that I'm expecting anyone to be too interested in my lunatic ramblings.</p>
      <p>Wishing Soleil had a double-decker /g/, and would make a true italic. Ah well. If wishes were horses...</p>
