      <p>Another designer with some beautiful, yet personal-looking, scripts is Laura Worthington. Her <a class="freelinking external" href="http://www.myfonts.com/fonts/laura-worthington/alana/?refby=bowfin" rel="nofollow">Alana</a>  is similar, and has many alternates allowing a choice of fancy-to-plain script looks.</p>
      <p>Another prolific designer, who used to work for Hallmark is <a class="freelinking external" href="http://www.myfonts.com/search/Leuschke/fonts/" rel="nofollow">Rob Leuschke</a>.</p>
      <p>- Mike Yanega</p>
