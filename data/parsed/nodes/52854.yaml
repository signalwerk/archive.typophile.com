      <p>Tom, if you cast you mind back to the first thread we had about web font embedding you may recall yourself questioning why several of us on that thread were grumbling about Adobe softrware given the great boon of the OpenType format.</p>
      <p>My response was along the lines of, "I am grateful to Adobe for giving us a font format that allows me to realize dream projects."</p>
      <p>I stand by that response. At the time I neglected to make a clear distinction between Adobe application software and the OpenType format. These are two quite different animals. It is Adobe application programs that disappoint me, not the OpenType format itself.</p>
      <p>This thread provides one more example of the infuriating engineering standard of Adobe application programs. For me it includes other stuff such as the messed-up ergonomics and interface design of Adobe apps, their sheer stupidity at not being able to keep track of folder locations I use repeatedly, resource hogging, and generally unintuitive software design. Photoshop for example annoys me so much I only use it when no alternative app will suffice.</p>
      <p>It's worth saying that Microsoft application programs are barely any better engineered than Adobe's.</p>
      <p>I don't mean to hijack this thread. Just sayin', as a follow up.</p>
      <p>j a m e s</p>
