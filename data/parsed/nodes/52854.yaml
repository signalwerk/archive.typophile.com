      <p>It may be helpful to know how the InDesign algorithm for turning ligature features on and off relative to tracking works. I asked Eric Menninga about this at TypeCon this year, because it has implications for how to design ligating alternates (contextual variant letters that form on-the-fly ‘ligatures’, activated by ligature features).</p>
      <p>The amount of positive or negative tracking triggering disabling of the ligature features is relative to the width of the /space/ glyph in the font. An increase of more than 8% of the width of the /space/ glyph turns off the ligatures, as does a decrease of more than 22% of the width of the /space/ glyph. That is to say, for a font with a /space/ glyph 200/1000 em units wide, the ligature features will turn off beyond +16 units tracking and -44 units tracking.</p>
