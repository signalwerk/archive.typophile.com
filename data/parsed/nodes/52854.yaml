      <p>My post of yesterday night was a bit grumpy. I should clarify:<br>
      The idea that ligature substitution is switched off with increased tracking is a nice one. But it should be the font which defines up to which amount of tracking ligatures be applied. It depends on the design, e.g. the extend at which the f reaches out to the right. The amount could be a lookup-related flag.<br>
      Given fonts like Caflisch Script I can understand that switching off calt too was not regarded as problematic -- a connected script shouldn't be tracked anyway. The flaw is in the implicit assumption that calt is used in connected scripts only, rather than considering connected fonts as a subset of fonts that may use calt.&nbsp;&nbsp;;-)</p>
