      <p>&gt;<cite>But it should be the font which defines up to which amount of tracking ligatures be applied. It depends on the design, e.g. the extend at which the f reaches out to the right. The amount could be a lookup-related flag.</cite></p>
      <p>It does not need to be a lookup, because this functionality is already defined in OpenType for more than a decade now. <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/JSTF.htm" rel="nofollow">Justification Maximum Table</a> seems appropriate: <cite>[...] values define the maximum shrinkage or extension allowed per glyph.</cite> For example, a ﬁ glyph.</p>
      <p>Needless to say, there is no GUI in FontLab to specify proper amounts, but also no way to code it. Well, we can expect support for this thing in InDesign in decade or two. Hard to predict, really :-)</p>
