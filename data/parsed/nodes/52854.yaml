  html: <p>If I apply a certain amount of tracking to, say, a paragraph of text, InDesign will turn off ligatures and contextual alternates (actually not in the OpenType menu within the character window but the way it type sets text in a document). A situation I'm  not really happy with since I'm providing my typeface with these features not for nothing. Fortunately the ligatures and contextual alternates will remain when doing this in Illustrator. Does anyone know how this happen, or preferably, how to get rid of this happening?</p>
