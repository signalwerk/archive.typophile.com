      <p>Adobe's reasoning as expressed by Thomas sounds good. I wonder it the ligature breaking happens only when the ligature was formed by 'liga', as opposed to directly entered -- either by entering the Unicode value when one is assigned to ligatures, or directly selected from the glyph pallet?</p>
      <p>There are other reasons to have this kind of layout engine behavior. Traditionally, ligatures weren't used above a certain size. I never much agreed with that one, but of course, in metal they also weren't generally available above a certain size.</p>
      <p>If such a notion could be implemented (unbreaking only when created by 'liga'), it might cover the situation. Automatic ligaturing is only an aid to the compositor -- we used to have to spot them &amp; set them ourselves.</p>
