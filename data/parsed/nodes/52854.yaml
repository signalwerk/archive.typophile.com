      <p><cite>Traditionally, ligatures weren’t used above a certain size.</cite></p>
      <p>Traditionally, tracking increases with size.</p>
      <p>Since a ligature is drawn as two characters at a fixed distance, you cannot allow for tracking -- not unless OT has a major overhaul!</p>
      <p>The OpenType 'size' feature could be put to good use here, except I understand it has a few implementation flaws that should be ironed out first. Then again, people might complain ligatures <em>disappear</em> at a certain size ...</p>
