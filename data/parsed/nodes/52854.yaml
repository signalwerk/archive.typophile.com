      <p>I agree that an application preference or some way of turning this off would be nice.</p>
      <p>I think the basic idea of breaking the ligature when the tracking gets too extreme is a reasonable one. I personally confirmed both the general idea and the specific values InDesign uses back before the behavior was introduced. I agreed with the engineer proposing the change that past a certain amount of tracking, having a ligature results in such deviant spacing that things tend to look better without the ligature.</p>
      <p>Applying the same logic to 'calt' was a more unfortunate call. At the time, years ago, we believed that 'calt' would get used for what the feature specs originally suggested, making connecting alternate forms. Implicit in that, we thought, was the idea that the default forms would not be connecting. So overriding the connecting behavior in a connecting script when it got too heavily tracked "seemed like a good idea at the time." In retrospect, not so much, I must say.</p>
      <p>Regards,</p>
      <p>T</p>
