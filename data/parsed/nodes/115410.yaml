      <p>Rick,<br>
      It's indeed custom. De Bijloke is a music center in Ghent, Belgium hosting a variety of concerts, from ancient music to symphonic, from classical Western and Eastern music to jazz. <a class="freelinking external" href="http://baselab.casasin.com/project/fonts" rel="nofollow">Base</a> created an identity for this music center, with the goal of reaching a new public and bringing classical music to life. A vibrant yellow dot enlivens the medieval building and the visuals expected of classical music. This graphic element was applied to signage, and translated to typography. </p>
      <p>titled: Debijloke Bold</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/De_Bijloke_Font1_5304.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/De_Bijloke_Font2_5386.png"></div><p></p>
      <p>for inspiration have a look at <a class="freelinking external" href="http://www.helmo.fr/ongoing/palais-de-tokyo/" rel="nofollow">Palais.</a></p>
