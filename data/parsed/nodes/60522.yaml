  html: |-
    <p>Chomsky is released by T26 today. This is my first commercial typeface, a fun typeface to play with, hence the great family price-cut. A mini site is scheduled to come real soon.<br>
    <a href="http://www.t26.com/fonts/5886-Chomsky" title="http://www.t26.com/fonts/5886-Chomsky">http://www.t26.com/fonts/5886-Chomsky</a></p>
    <p>A PDF specimen is also available at my site:<br>
    <a href="http://merdekaataoemati.com/downloads/chomsky_specimen_latest.pdf" title="http://merdekaataoemati.com/downloads/chomsky_specimen_latest.pdf">http://merdekaataoemati.com/downloads/chomsky_specimen_latest.pdf</a></p>
    <p>Cheers!</p>
