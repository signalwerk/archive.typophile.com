    <p>(Not intended to SPAM you all - just want to make sure you know about the party)</p>
    <p>Mark your calendar for our biggest event of the year, and join us for a unique and provocative party, unlike any we've thrown before.</p>
    <p>In 2004, The Pub Project posed 26 questions to the local design community. Distributed hand-to-hand, they made their way organically from person to person. The resulting 1000+ responses will be presented in a pulsing, interactive exhibition of design ideas great and small.</p>
    <p>Meet, mingle, discuss and contribute — aided and abetted by food, drink, fine musical entertainment, and the latest offerings from more than 20 industry sponsors). </p>
    <p>Save the Date: December 1, 2006</p>
    <p>Tickets<br>
    AIGA Members: FREE with food donation ($10 without)<br>
    Non Members: $15 with food donation ($30 without)<br>
    Students: $10 with food donation ($20 without)</p>
    <p>RSVP<br>
    Tickets are available with a credit card by calling AIGA San Francisco at 415.626.6008 or by mail by sending your check (made payable to AIGA SF) to AIGA SF at 1111 8th Street, San Francisco CA, 94107. Admission will also be available at the door, space permitting.</p>
