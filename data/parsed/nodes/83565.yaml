    <p>Hi all,<br>
    I'm trying to find out which typeface is used in the «water/colour» installation co-created by Callum Innes and Colm Tóibín.</p>
    <p>These are the best images I've been able to find of the type (these have perspective distortion and all):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/another_way_5451.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/3d891fdf_5901.jpg"></div><p></p>
    <p>And this: «the world in front of her had been washed down»<br>
    <a href="http://www.flickr.com/photos/wefindwildness2/5834050522/" title="http://www.flickr.com/photos/wefindwildness2/5834050522/">http://www.flickr.com/photos/wefindwildness2/5834050522/</a></p>
    <p>It feels familiar... but I can't quite put my finger on it. Anyone?</p>
