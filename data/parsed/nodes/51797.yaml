      <p>Hey Gerald and Robert, Thank you for taking the time to mock up different approaches to the connections. </p>
      <p>I did have several attempts at the connection you suggested Robert but felt the e-y-e ended up a little too tightly kerned in relation to the rest of the letters. I agree that it does seem the most natural connection but I worry that at smaller sizes the last three letters will run together. I think the e-y works better than the y-e as it makes the top right side of the y rather heavy.. I will have another crack at it this afternoon and see how I feel about it. </p>
      <p>Gerald, I don't mind the connection of the tail of the y to the e, I haven't tried that so will give it a go. The second suggestion I did try and was not happy with the way the last e sat on the end of the word and also the top right side of the y ends up rather heavy.</p>
