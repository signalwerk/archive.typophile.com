      <p>So, I have spent the last few days trying different combinations of a join between the letters e-y-e and am feeling a little stumped. </p>
      <p>This is the best I have come up with so far. I took the approach of following the line of the first e through to connect with the center of the second e.</p>
      <p>Any suggestions regarding this approach? Anyone think of a more natural connection between such difficult letters?</p>
