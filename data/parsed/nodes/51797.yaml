    html: |-
      <p>Love the version with the bird sitting on the lettering! Exploring various modes of conjunction may be a good idea, though; in small applications like business cards, the bird will likely suffer when it is this small, especially seeing that it has a much higher level of detail than the lettering already.</p>
      <p>Come to think of it, this offers a great wealth of possibilities. Why not make the bird a brand character, like a mascot? Depending on media / context, he could even be animated, sit on the logo in different ways, flap his wings, maybe pick away at the counters or attack the mouse cursor from time to time … especially seeing that you do interactive and probably animated work, that may be a befitting (and fun) expansion of the 'logo' idea. (Reminds me a bit of <a href="http://www.fontshop.de/typo2006/" rel="nofollow">what the TYPO Berlin conference in 2006 did with the cat</a> – they had a black Flash cat as a mascot, who 'lived' on the website. She'd often sit still for a while, but had a number of (sometimes surprising, playful and funny) behaviours that were randomly played; a whole bunch of people came back to the website just to see 'what the cat was doing', and she became the secret star of the conference).</p>
