      This sample shows a very chiseled sharp edge that makes a clean line.  That took some mighty skill to master! Now you have me hooked!  I have to dig into this and find more, now :-)</p>
      <p>I used to watch my grandmother write with great wonderment because of her arm and wrist movement. She seemed to pivot about her elbow as if it were a moving compass for certain curved strokes but her elbow would jut out at a right angle for the bolder horizontal straights.  She would smile and say to me in a whisper, "Don't write with your fingers like your mother [her daughter] learned in American school."  Actually, watching για για cooking and rolling grape leaves had the same flourished, sure motions of the arm as in writing.  She may have talked with her hands, but wrote with her arms.</p>
      <p>Thanks, John.  I just looked at Noordij again.  I see what you mean!</p>
      <p>Chris</p>
