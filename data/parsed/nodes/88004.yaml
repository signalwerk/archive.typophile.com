      <p>Chris — </p>
      <p>What might not have been evident from Michael’s response is that when using a ruling pen for this kind of calligraphy, it is manipulated in pretty much the exact opposite way from what it was designed for and how you’re accustomed to using it. ;-)</p>
      <p>Instead of ruling in a direction parallel to the blades to get an even, consistent-width line, for lettering like this you generally run the broad edge of the blades against the paper and work more *against* the direction of the blades, dragging across the page. Varying the angle of the ruling pen in relation to the surface, more vertical or more shallow, will bring more or less blade surface in contact and yield variations in width. </p>
      <p>I don’t know how you held your ruling pen when drafting. I know many people held it with a more or less normal pen grip. But I believe most letterers use a grip more akin to how you would hold a steak knife. This allows a great range of whole-arm movement for angling and rotating.</p>
      <p>(And I think most letterers grind down the tips of the blades, so they aren’t so sharp and won’t catch on the page.)</p>
      <p>If the paper is cold pressed or rough, you get textured edge effects like in Michael’s “ruling pen” example. If the paper is smooth, you generally get cleaner edges, as in the “Scio me” example (the subtler edge effect there looks more like a result of absorbancy than surface texture).</p>
      <p>Michael will correct me if I’ve made any errors in my description.</p>
    html_clean: |-
      <p>Chris — </p>
      <p>What might not have been evident from Michael’s response is that when using a ruling pen for this kind of calligraphy, it is manipulated in pretty much the exact opposite way from what it was designed for and how you’re accustomed to using it. ;-)</p>
      <p>Instead of ruling in a direction parallel to the blades to get an even, consistent-width line, for lettering like this you generally run the broad edge of the blades against the paper and work more *against* the direction of the blades, dragging across the page. Varying the angle of the ruling pen in relation to the surface, more vertical or more shallow, will bring more or less blade surface in contact and yield variations in width. </p>
      <p>I don’t know how you held your ruling pen when drafting. I know many people held it with a more or less normal pen grip. But I believe most letterers use a grip more akin to how you would hold a steak knife. This allows a great range of whole-arm movement for angling and rotating.</p>
      <p>(And I think most letterers grind down the tips of the blades, so they aren’t so sharp and won’t catch on the page.)</p>
      <p>If the paper is cold pressed or rough, you get textured edge effects like in Michael’s “ruling pen” example. If the paper is smooth, you generally get cleaner edges, as in the “Scio me” example (the subtler edge effect there looks more like a result of absorbancy than surface texture).</p>
      <p>Michael will correct me if I’ve made any errors in my description.</p>
