      <p>Bill, Michael, how do we know that different people did the illumination and the calligraphy?</p>
      <p>I would imagine that just as in subsequent centuries, the work may have been divided any which way, contingent on circumstance.</p>
      <p>I suspect that if an illuminator had created a title page with a small amount of text, he might have been inclined to do the whole page, including the text. </p>
      <p>Similarly, if a page only had one or two decorated initials, then the scribe churning out the body text may have also been allowed to take a crack at the initials.</p>
      <p>This presupposes a model of apprenticeship in which one starts mixing ink as a young lad, progressing to doing plain old transcription, then to full-fledged gold-leaf pictorial representation. With a “masterpiece” required at each step along the way. So all illuminators would have been more than capable scribes.</p>
      <p>And you have to wonder whether economic conditions would have been able to support a specialist illuminator at all times in all scriptoria, without having him also pitch in with more mundane scribeling.</p>
