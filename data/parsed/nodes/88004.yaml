      <p>The Wikipedia article on <a href="http://en.wikipedia.org/wiki/Palaeography" rel="nofollow">Palaeography</a> contains this passage: "Their efforts were mainly directed at reconstructing 'the ductus' — the movement of the pen in forming the letter" and cites the New Encyclopaedia New York.</p>
      <p>Here at Typophile "ductus" usually seems to mean the pen angle implied by the stress of a face's chirographic elements, though there is the occasional focus on the imagined pen path when it is in question.</p>
