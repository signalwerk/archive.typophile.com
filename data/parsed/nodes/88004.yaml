    html: <p>That's right, Chris. Chirography is just a fancy Greek-derived word for handwriting. Calligraphy is a subcategory of chirography. The term chirography is useful because it obliges one to consider all the cultural aspects of literacy, not just calligraphy, which has different significance at different times and places. I'm interested in professional text production, for instance, which in scribal cultures involves copyists whose work is typically distinguished, in those cultures, from the work of calligraphers.</p>
