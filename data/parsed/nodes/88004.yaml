    html: |-
      <p>[I posted the following response on the ATypI e-mail list, but figured I'd repeat it here for the sake of future reference.]</p>
      <p>I'm glad you asked this question, as I've seen the term used to describe different things in the context of typography, writing, letterform design, etc.</p>
      <p>1) Some people use ductus to refer to the flaring or "reverse entasis" in the stokes of a letter.</p>
      <p>2) I've also seen people use ductus to refer to the kind of meta-design of a letter – its basic underlying structure. For example, in this sense of the word, a single-storey g and a double-storey g represent the same character, but have a different ductus. Other people describe this kind of basic construction of a letter as its "topology", a term which I would be more inclined to use.</p>
      <p>3) Finally, I've also seen ductus used as a parallel to how the term is used in the context of spoken language – to refer to the unique characteristics of flow, speed, direction, and tone of written text. In this sense of the word, it could be said that variations in ductus are what allow you to identify people by their handwriting.</p>
      <p>With all that in mind, it seems that ductus is a commonly confused/confusing term, so one would be advised to use it cautiously. Especially because the varying interpretations are so closely related, it is easy to imagine a misunderstanding of any statements which use the term.</p>
