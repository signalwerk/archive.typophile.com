      <p><em>So does it just do the basics of making the letters into a font? I guess that is about all I want but then again if there are features that FLS has as far as helping you see how each letters work together.. lining them up etc.. then I wouldnt mind having that.</em></p>
      <p>All font editors do that. It's usually called a "metrics" window. Font Tool does all the basic stuff--drawing, spacing, kerning, generating fonts. FontLab Studio adds more advanced features that professional font developers need. It's like the difference between Photoshop Elements and Photoshop. Or between a scooter and a motorcycle.</p>
