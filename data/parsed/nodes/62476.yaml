      <p><em>So does it just do the basics of making the letters into a font? I guess that is about all I want but then again if there are features that FLS has as far as helping you see how each letters work together.. lining them up etc.. then I wouldn't mind having that.</em></p>
      <p>Yes, TypeTool will help you turn beziers drawn in Illustrator into fonts and it has a Metrics and Kerning window which is what you mean when you talk about seeing how the letters work together. Once you become comfortable with the interface, you will probably draw your glyphs directly in TypeTool.</p>
