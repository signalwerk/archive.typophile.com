    html: |-
      <p>There are many people for whom FontForge is not the right tool; it's not for the faint of heart or for those who require an aesthetically pleasing work environment (the same might be said for Linux in general...), and it does like to crash on occasion (although there's rarely any data loss, as it backs up your work regularly).  The author warns that it should be considered perpetual beta software which will probably never see a stable release.  But if you're already using Linux and are willing to put up with the somewhat steep learning curve and the ugly-as-sin, overcomplicated interface, it may be the right tool for you.</p>
      <p>FontForge and Inkscape can be a particularly nice combination, since FontForge can import SVG images directly.  FontForge is also the only tool I know of with support for Raph Levien's Spiro (I generally find Bézier curves easier, but the point is that in FontForge both are available, assuming you've installed Spiro).  Another area where FontForge outshines the competition is combining diacritical marks; after an initial setup, adding anchors to base glyphs and diacritics is as easy as adding any other point.</p>
      <p>Finally, it's not out of the question to begin your font development in, say, TypeTool, then use FontForge to add more advanced features.  This workflow won't appeal to most people, but it's available nonetheless.</p>
