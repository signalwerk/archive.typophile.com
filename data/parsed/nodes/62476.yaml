    <p>I am looking to get a font editor. So far i am looking and comparing Font Lab Studio and Fontographer. I am new at this though I am good at lettering. I just need to know what I need to convert my vectors to fonts without spending too much money and having more software than I really need.</p>
    <p>Font Lab studio is more expensive but seems to be the buzz. what does it do that Fontographer doesnt?</p>
    <p>Any feedback would be appreciated. Thanks!</p>
