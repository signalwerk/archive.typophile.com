    html: |-
      <p>If you want to draw some glyphs but do not need every possible advanced feature, get TypeTool. It is is inexpensive and you will be able to draw a complete typeface. If you want the challenge of a more complex and sophisticated interface with every feature, get FontLab.</p>
      <p>The problem with Fontographer is that while it seems like a nice middle ground, it is rarely updated. The last update was in 2006 so it's obsolete in software terms, and it will not import or export the Open Type file format unless you purchase FogLamp for an additional $79. In my opinion, the ability to work with OTF files in today's world is critical. TypeTool gives you this functionality for $99. Also worth mentioning is that if you use a PC, Fontographer has established problems with operating systems 2000 and on. Don't get Fontographer.</p>
      <p>You asked what does FontLab Studio have that Fontographer does not. The short answer is: a lot of "behind the scenes stuff" that matters to professional typographers but does not matter much to casual hobbyists and beginners. It is truly too much to explain in one breath if you are first starting out. Run some Google searches (FontLab Studio 5 versus Fontographer) to find some specifics and read FontLab's website for more information on the differences.</p>
      <p>From what you wrote above, I would purchase TypeTool if I were you. FontLab Studio will be too much software for you. Just because TypeTool is inexpensive does not mean it is a poor piece of software lacking in features you will need.</p>
      <p>If you enjoy drawing letters on paper and wish to "vectorize" those drawings you may also wish to consider ScanFont ($99 also from FontLab). This means you would have two programs: TypeTool and ScanFont.</p>
