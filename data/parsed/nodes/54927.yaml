    <p>Hello,</p>
    <p>I'm looking for a quick critique on the logo attached if anyone fancies leaving a comment or two, that would be great. Its a logo for a University post grad society. The colours were set in the brief and can't be changed as they have to correlate with the main University logo. The letter shapes are intended to resemble ladder shapes, based on the idea of 'climbing the ladder of higher education', or something to that effect!  </p>
    <p>Any comments, criticisms or suggestions would be greatly received.</p>
    <p>Thanks</p>
