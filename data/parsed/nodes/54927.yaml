    html: |-
      <p>Ok, I'm going to be brutally honest. Brace yourself. I don't mean to offend. </p>
      <p>I quite literally winced and pulled away from the screen. I suspect this is not the response you're going for ... man, the font just could NOT be worse. Choose something that is the <strong>most opposite that font. </strong> </p>
      <p>A quick google search shows the <a class="freelinking external" href="http://www2.hud.ac.uk/news/index.php" rel="nofollow">university colors</a> are a much darker navy blue and burnt orange. Why not use those actual color values rather than these neon versions?</p>
      <p>The ladder metaphor is cliche, but in this example it's too fragile to even execute the metaphor properly. </p>
      <p>Bottom line? I don't think you need a logo mark -- I'd just focus on a logotype alone. It's a lot of words; and with the right type treatment, it can be more than enough by itself. </p>
      <p>AK</p>
