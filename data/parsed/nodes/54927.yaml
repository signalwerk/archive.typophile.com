    html: |-
      <p>It might be of value to draw from inspiration gathered from campus architecture as well. Letter forms to me are more architechtural than sculptural (depending on the typeface I suppose). Anyway, the Huddersfield University logo itself is based on a building, so it would be a good place to start.</p>
      <p>My thoughts on the logo as it stands 1) lose the box/stroke around the graphic and tie the required colors into the illustration 2) As stated above, you need a different typeface preferably the standard for Huddersfield or a clean sans 3) Use the light blue/orange as accent colors and the darker blue for the type and better part of the image. Orange is my favorite color, but don't kill it.</p>
    html_clean: |-
