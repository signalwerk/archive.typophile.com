    <p>I've been reading through the various threads (<a href="http://typophile.com/node/31762" title="http://typophile.com/node/31762">http://typophile.com/node/31762</a>) regarding UPM size but I'm struggling to draw my conclusions.</p>
    <p>Following these threads I tentatively drew a font at 2000 UPM. However when I generate OpenType PS I am encountering several issues including the halving of kerning values (or nearest possible half) in InDesign.</p>
    <p>Additional problems:<br>
    When I reopen this file in FontLab the cap height has been capped at 1500 (the actual value is 1522).<br>
    When I preview the font the leading is halved.</p>
    <p>I was led to believe that it was possible to up the UPM to 2000! Can someone please offer a definitive answer?</p>
    <p>Thanks in advance.</p>
