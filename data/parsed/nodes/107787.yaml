    <p>Hi philes!</p>
    <p>Wow, this is my first post in ages in here! Real life takes time I guess :-)</p>
    <p>Anyway, I'm looking for some inspiration and new blood to my font collection, so I'm hoping to find a list of favorite fonts from leading brand designers in the world. I have found some examples on <a href="http://fontsinuse.com" title="http://fontsinuse.com">http://fontsinuse.com</a> (amazing site!).</p>
