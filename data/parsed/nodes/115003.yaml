      <p>Hi Mike, Asteroid Primo Two by Jim Spiece is a good addition to the list of possible substitutes, although Latin CT still seems the best one so far. Jim Spiece is not very forthcoming as to his source for the design,.  Asteroid Primo Two seems to be a simplified and conventionalized version of Asteroid Primo One. As for  Asteroid Primo One, it  is very similar to Ambrosia LHF <a href="http://www.myfonts.com/fonts/letterheadfonts/lhf-ambrosia/" title="http://www.myfonts.com/fonts/letterheadfonts/lhf-ambrosia/">http://www.myfonts.com/fonts/letterheadfonts/lhf-ambrosia/</a> and <a href="http://www.letterheadfonts.com/fonts/ambrosia.php" title="http://www.letterheadfonts.com/fonts/ambrosia.php">http://www.letterheadfonts.com/fonts/ambrosia.php</a> Perhaps Ambrosia is the 1900ca name for this design? Dan X. Solo used the term Asteroid, but he was known for renaming old typefaces. May be in one of the old type specimen books. Whatever it was called, here it is in an engraved version used in a Brooklyn liquor license from about the 1890s<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BrooklynLiquorLicense1890caTypophile101844_6363.jpg"></div><br>
      Don<p></p>
