    <p>Hi, </p>
    <p>Can anyone identify the typeface (or know of one if it's hand lettered) used for the text "Barthelemy Ferrer Fils." It's vintage French receipt from 1911. </p>
    <p>It would also be great to know they typeface used for the BF inside the shield on the left. </p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/VINTAGE-FRENCH-RECEIPT-WITH-BF_4955.jpg"></div><p></p>
