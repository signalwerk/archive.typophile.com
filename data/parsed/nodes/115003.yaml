      <p>Nothing really interesting since my last comment unfortunately and still considering Asteroid Primo/Ambrosia as the best substitute here. Just dropping some names I've encountered with during the search: <a class="freelinking external" href="http://www.myfonts.com/fonts/coffee-bin-fonts/youths-companion" rel="nofollow">Youth's Companion</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/durham-abbey-nf" rel="nofollow">Durham Abbey</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/archivetype/archive-tale" rel="nofollow">Archive Tale</a>, <a class="freelinking external" href="http://creativemarket.com/Aditsaputra/13450-LongMarch" rel="nofollow">Long March</a>, <a class="freelinking external" href="http://www.dafont.com/campanile.font" rel="nofollow">Campanile</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontmesa/american-west" rel="nofollow">American West</a> and Solotype <a class="freelinking external" href="http://www.myfonts.com/fonts/solotype/gashouse-gang" rel="nofollow">Gashouse Gang</a>, <a class="freelinking external" href="http://typophile.com/node/114990" rel="nofollow">Chorus Girl</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/solotype/seminary" rel="nofollow">Seminary</a> and Toussant<br>
      For what it's worth, I'd probably start with <a class="freelinking external" href="http://www.myfonts.com/fonts/shinn/beaufort" rel="nofollow">Beaufort</a> Condensed as base font and try to rework some terminals as flourish. This one could also work for the /BF initials on the badge you're after too.</p>
