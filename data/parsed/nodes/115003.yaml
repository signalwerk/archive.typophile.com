      <p>Don's suggestions are probably better, but I thought I'd mention two I thought might work nicely with an added shadow. They have fewer big latin serifs but, to me, match the upright, more squared-off appearance better. Both date from just before 1900.</p>
      <p><a href="http://old.myfonts.com/fonts/spiecegraphics/asteroid-primo/" target="_blank" rel="nofollow">Asteroid Primo Two</a> and <a href="http://old.myfonts.com/fonts/solotype/estienne/" target="_blank" rel="nofollow">Estienne</a></p>
      <p>Unfortunately, in both cases, the 'S' rather gives away the Art Nouveau roots, but Asteroid comes with a small caps version and Asteroid One has lightly ornamented caps for the F and T.</p>
