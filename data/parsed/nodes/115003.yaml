    html: <p>Hadn't the time to dig this one unfortunately. Actually, too many great letterings on this one... Wow, I wish all actual advertisings were like this one. I directly thought about <a class="freelinking external" href="http://www.letterheadfonts.com" rel="nofollow">Letterhead Fonts</a> without reminding an exact one and knowing LHF are most of the time a bit fancy/catchy/cheesy/too much (to my taste at least) and less classy than this one. LHF Ambrosia might be the closest until somebody found somebody closer but less flourish. Adding for,the moment another LHF, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/ironhorse.php" rel="nofollow">Iron Horse</a>. I'd try to have a look to Solotype collection tomorrow to see if there's some more.</p>
