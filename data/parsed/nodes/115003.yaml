      <p>As for BF, it's again engraving of an idea to fit the two letters together in a monogram. The big slashing serif on the top stroke of the F is very 19th century. If you want more of this sort of exuberance, I suggest Ronaldson <a href="http://www.myfonts.com/fonts/canadatype/ronaldson/" title="http://www.myfonts.com/fonts/canadatype/ronaldson/">http://www.myfonts.com/fonts/canadatype/ronaldson/</a> or it's offspring Tiffany <a href="http://www.myfonts.com/fonts/itc/tiffany/" title="http://www.myfonts.com/fonts/itc/tiffany/">http://www.myfonts.com/fonts/itc/tiffany/</a><br>
      Don</p>
