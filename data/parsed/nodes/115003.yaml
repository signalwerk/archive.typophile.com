      <p>Engraving--note the way the tips come to sharp points. Can't do that with metal type. Well executed--differences between repeating letters are not obvious and treatment of serifs etc is very consistent.<br>
      "Barthelemy Ferrer Fils." is in a style that probably looked a little old fashioned in 1911.<br>
      Except for the shadow line it is not very different from a narrow 19th century "Latin." Here are a few -- mostly too wide and with differences in details -- Latin CT <a href="http://www.myfonts.com/fonts/castletype/latin-ct/" title="http://www.myfonts.com/fonts/castletype/latin-ct/">http://www.myfonts.com/fonts/castletype/latin-ct/</a> Spike <a href="http://www.myfonts.com/fonts/quadrat/spike/" title="http://www.myfonts.com/fonts/quadrat/spike/">http://www.myfonts.com/fonts/quadrat/spike/</a> Etienne <a href="http://www.myfonts.com/fonts/paratype/etienne/ITC" title="http://www.myfonts.com/fonts/paratype/etienne/ITC">http://www.myfonts.com/fonts/paratype/etienne/ITC</a> Barcelona <a href="http://www.myfonts.com/fonts/itc/barcelona/" title="http://www.myfonts.com/fonts/itc/barcelona/">http://www.myfonts.com/fonts/itc/barcelona/</a> or   More digging might find something closer.<br>
      Don</p>
