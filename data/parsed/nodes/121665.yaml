  html: |-
    <p>Hello Everyone,</p>
    <p>I am in love with a custom typeface by Nico Schweizer created for Phaidon's publication of Area. It is called Typ 1441. Lineto sells Schweitzer's Typ 1451 (<a href="http://lineto.com/1.0/content_5.html" title="http://lineto.com/1.0/content_5.html">http://lineto.com/1.0/content_5.html</a>) but it is too wide for my purposes (a design c.v.). I was wondering if anyone could recommend a close match?</p>
    <p>Thanks much.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/specimen2_5882.jpg"></div><p></p>
