    html: |-
      <p>The whole point of a custom typeface is that it’s unique; the following suggestions are decent substitutes based on overall form and proportions, but may miss on some of the details (DIN comes closest on both the numerals and the letters).</p>
      <p>ITC Conduit:<br>
      <a href="http://www.myfonts.com/fonts/itc/conduit/" title="http://www.myfonts.com/fonts/itc/conduit/">http://www.myfonts.com/fonts/itc/conduit/</a></p>
      <p>Modus:<br>
      <a href="http://www.myfonts.com/fonts/garagefonts/modus/" title="http://www.myfonts.com/fonts/garagefonts/modus/">http://www.myfonts.com/fonts/garagefonts/modus/</a></p>
      <p>DIN Text Condensed, by Parachute:<br>
      <a href="http://www.parachute.gr/typefaces/allfonts/din-text-condensed-pro" title="http://www.parachute.gr/typefaces/allfonts/din-text-condensed-pro">http://www.parachute.gr/typefaces/allfonts/din-text-condensed-pro</a></p>
