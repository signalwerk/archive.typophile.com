    html: |-
      <p>You could commission a custom font from Lineto, or another foundry. Or you could modify Typ 1451, but: it's not easy to do a clean job; you have to make sure the results don't leak out to the world.</p>
      <p>DIN does indeed have too much baggage.</p>
      <p>hhp</p>
