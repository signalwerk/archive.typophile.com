    <p>Hello,</p>
    <p>I'm hoping to get some feedback and critique on a logotype I'm currently designing a for a website. I want to explain a little of the background for this project, so I apologize if this is long-winded.</p>
    <p>The logotype will be incorporated into the site masthead as well as appear on its own in promotional material and business cards. The site will be an online magazine in blog format exploring issues of popular culture with an academic and investigative angle, with accompanying data visualizations and scholarly references.</p>
    <p>The title of the site, "Special Topics in Tąxidermy", is not literal but it can be broken down into two layers of meaning. The first part of the title "Special Topics" is intended to connote the aforementioned academic, investigative angle. This preface is commonly used in published work pertaining to a certain topic, such as an academic essay. Secondly, the word "Tąxidermy" can be seen as a sort of placeholder, connoting the obscure or under-appreciated. The site will really not have anything to do with taxidermy, but it will deal with topics that aren't ordinarily explored in-depth.</p>
    <p>Process:</p>
    <p>After working with some original, hand drawn logotypes in an earlier stage, I didn't feel I was capturing the academic angle very well. In this iteration, I'm hoping that first line "Special Topics in" set in the traditional serif accomplishes this. "Tąxidermy" is intended to be more quirky and connote a sort of craft-like quality. In the end, it's likely that I will apply some treatment to roughen the look of the mark, of which I attached an example, along with the original version.</p>
    <p>Critique:</p>
    <p>I'd like to know what you think about the overall composition, scale and font harmony. Font suggestions are appreciated. For those interested, "Tąxidermy" is currently set in <a class="freelinking external" href="http://www.fonthaus.com/fonts/emigre/quartet/em21218">Quartet Bold</a> by Emigre.</p>
    <p>Thanks for reading, I very much appreciate the input!</p>
