    html: |-
      <p>I would tighten the space between the 'T' and the ‘a' in taxidermy, and suggest you try lowercase, italic or even an altogether different font for ‘in', so as to both solve your problem with hierarchy and further amplify the eccentricity. I do not mind the underline, although, I don't see why the serifs should be resting on it (would create noise at smaller sizes) and so I'd rather see it go through them, and share their thickness.</p>
      <p>I would also suggest not extending the underline to the ‘in' : restrict it to ‘special topics'. </p>
      <p>My one problem is the font used for ‘Taxidermy' ; this may be a matter of taste, but for me it is <em>too</em> Emigre for comfort, which is to say free-font / retro-90's... Not to disparage your choice, because I do see how it functions to capture that sort of strange quality required, and it is not a bad choice altogether... However, I do think that you'd be well-served with another selection whose strangeness is met with a more authoritative feeling. Perhaps it is simply because I love the quality in the font used in ‘special topics' and I would like to see a font that plays better with it... Can anyone who would agree with me think of some ideal slab-serif with a post-modern feel to it for this? </p>
      <p>( Or, better yet, taking a page from the literal meaning of taxidermy - and seeing as how that very practice is in some ways the very definition of ‘post-modern' perhaps you can create custom letterforms based on your interventions of an appropriate font? Might be a nice way to incorporate some of what works with the existing font yet in a more pleasing way? )</p>
      <p>( BTW, I would not go with the ‘rough' version, but what I like in it is the way that it almost renders the emigre font into an italic. )</p>
