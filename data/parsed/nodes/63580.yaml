    html: |-
      <p>Thanks for all your feedback.</p>
      <p>After some discussion with my cohorts on the project, I'm leaning toward using hand-drawn serif in lieu of the Quartet face for "Taxidermy". While I drew it myself, the letterforms are inspired by old glyphs from  historical documents. </p>
      <p>The aim still obscurity, evoking the study of something forgotten, perhaps unearthed from an aged manuscript. I resonate very much with what CGI is saying about "strangeness is met with a more authoritative feeling". As for "Special Tøpics" I thought a more extended serif would help differentiate the two parts of the title.</p>
      <p>So here are my concerns with the "Taxidermy" portion: While I like the connotation of ancient typesetting, I don't want to necessarily relate to a particular tradition or style, be it a certain time period, region or art movement. At the same time, I don't want it to be generic—as of this iteration I do have concerns about the originality and uniqueness of the logotype.</p>
      <p>Lastly. I'm not sure if the overall shape is very interesting, or the negative space that is created. This is something that I felt the logotype I originally posted did very well, and I feel like it's lost because this one is more evenly rectangular. </p>
      <p>So here are two options, one more rigid and regular (option 1), and another that I tweaked slightly (option 2). I also made one of the version with the underline left off of the "IN", per feedback from CGI. I very much appreciate everyone's input, let me know what you think!</p>
      <p><a class="freelinking external" href="http://i34.tinypic.com/34gwxg8.jpg">Option 1</a><br>
      <a class="freelinking external" href="http://i36.tinypic.com/2n8zmz7.jpg">Option 2</a></p>
