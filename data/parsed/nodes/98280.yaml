    html: |-
      <p>I just asked my Chinese wife about this. She didn't think it was that successful. It was readable to her, but the blackletter style looked forced, something like the 'chop suey' styles look to us readers of latin scripts. </p>
      <p>The 'Black Butler' thing is more successful. It's a fanciful extreme high contrast version of a woodcut style, so it's more rooted in the 'ductus' of Chinese characters, though as used by Japanese. The broad pen logic is so far from the pointed brush logic that I don't know if you can get from one to the other...</p>
