    html: "<p> You're right. The condensed font isn't Tempo Heavy Condensed, it's (Linotype) Erbar Bold Condensed. <br> <br>Only a few Linotype fonts were available over 36 point, and all of those were condensed. Erbar Condensed was one of the few available up to 60 point. It's quite likely that they used a Ludlow machine for headlines and the Linotype for smaller settings.  <br> <br>I mentioned above that Ludlow machines were similar to Linotypes, but they were very different in one important way: Linotype was automated and had a keyboard. On the Ludlow, the operator would handset the matrices (molds) for a line of type and the line would be cast as one piece. <br> <br>Ludlow offered fonts from 4 point up to 144 point, but nobody in their right mind would set a whole newspaper with one. They were mainly used for display type. I imagine they were popular at newspapers as an economical alternative to foundry type for headlines.  <br> <br>Obviously, Linotype could be used for smaller display type as well, and this appears to be what's going on in the sample page. </p>"
    html_clean: "<p> You're right. The condensed font isn't Tempo Heavy Condensed, it's (Linotype) Erbar Bold Condensed. <br> <br>Only a few Linotype fonts were available over 36 point, and all of those were condensed. Erbar Condensed was one of the few available up to 60 point. It's quite likely that they used a Ludlow machine for headlines and the Linotype for smaller settings.  <br> <br>I mentioned above that Ludlow machines were similar to Linotypes, but they were very different in one important way: Linotype was automated and had a keyboard. On the Ludlow, the operator would handset the matrices (molds) for a line of type and the line would be cast as one piece. <br> <br>Ludlow offered fonts from 4 point up to 144 point, but nobody in their right mind would set a whole newspaper with one. They were mainly used for display type. I imagine they were popular at newspapers as an economical alternative to foundry type for headlines.  <br> <br>Obviously, Linotype could be used for smaller display type as well, and this appears to be what's going on in the sample page. </p>"
