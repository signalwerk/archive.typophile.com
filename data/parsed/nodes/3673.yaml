    html: <p> I believe that most newspapers from this era were still using the Linotype for their composition, though possibly not for headlines, which may have been handset or Monotype. <br> <br>Although WAD never designed italics for the Metro series, Linotype did release some. Undoubtedly these were developed by the drawing office, possibly by mechanical means -- i.e., obliqued. The italic headlines above bear some resemblance to the Metro italics, but there are some distinct differences that I notice, particularly in the width and aperture of the 'C' and 'G'.  <br> <br>The roman, all-caps headline is not Metro, although it, too, bears similarities. The crossbar of the 'A' is too low. The crossbar on the 'T' is too narrow. The angled terminals of the 'S' are not Metro. A Metro 'N' and 'A' would have pointed vertices. <br> <br>I can't say what it is, however. <br> <br>There were no condensed versions of Metro. The smaller, condensed headlines look like Erbar to me, though it's hard to tell at this resolution. Although originally designed for Ludwig &amp; Mayer in Germany, the Erbar faces did make it to these shores and were copied by Linotype. They were very popular for newspaper headlines. <br> <br>-- K. </p>
    html_clean: <p> I believe that most newspapers from this era were still using the Linotype for their composition, though possibly not for headlines, which may have been handset or Monotype. <br> <br>Although WAD never designed italics for the Metro series, Linotype did release some. Undoubtedly these were developed by the drawing office, possibly by mechanical means -- i.e., obliqued. The italic headlines above bear some resemblance to the Metro italics, but there are some distinct differences that I notice, particularly in the width and aperture of the 'C' and 'G'.  <br> <br>The roman, all-caps headline is not Metro, although it, too, bears similarities. The crossbar of the 'A' is too low. The crossbar on the 'T' is too narrow. The angled terminals of the 'S' are not Metro. A Metro 'N' and 'A' would have pointed vertices. <br> <br>I can't say what it is, however. <br> <br>There were no condensed versions of Metro. The smaller, condensed headlines look like Erbar to me, though it's hard to tell at this resolution. Although originally designed for Ludwig &amp; Mayer in Germany, the Erbar faces did make it to these shores and were copied by Linotype. They were very popular for newspaper headlines. <br> <br>-- K. </p>
