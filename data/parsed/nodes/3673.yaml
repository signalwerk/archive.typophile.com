    html: |-
      <p>Yes, Tempo is one font family that I would someday love to see make a full comeback in all its glory.</p>
      <p>For years, many people dismissed Tempo as being "just another Futura knockoff."  But there are plenty of noticeable differences:</p>
      <p>*on Futura, the capital <strong>G</strong> has a full round body, with a relatively long spur; on Tempo the spur is quite short, and connected to the curve by a vertical line</p>
      <p>*Futura's lowercase <strong>u</strong> has an unusual "upper-case" construction; Tempo's is more traditional</p>
      <p>*In most (but not all) weights of Tempo, the lowercase <strong>a</strong> has two-storied construction.</p>
      <p>Tempo is also noticeable in that it is one of the very few sans-serif fonts in which the italic completely differs from the regular.</p>
