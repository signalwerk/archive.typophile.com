    html: <p>Good call on that Tempo. I'm looking at McGrew's <i>Metal Typefaces</i> and the all-caps and italics are dead ringers.  <br> <br>But there's something nagging me about that condensed.The Tempo Condensed specimens that I'm looking at show a 't' with a typical curved tail at the baseline. But the scan above seems to have a straight, abrupt 't' ("Ac<b>t</b>ual Killer To Take S<b>t</b>and Agains<b>t</b> Lawyer).  <br> <br>Mark, can you check the Ludlow book to see if an alternate was provided? McGrew doesn't show one. <br> <br>-- Kent.</p>
