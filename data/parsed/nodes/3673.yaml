    html: <p> Tempo was modeled after Futura and similar typefaces. Ludlow didn’t own Futura, so they had Robert Hunt Middleton do their own version. It’s quite a bit diﬀerent in the details, escpecially in the italics, but the overall impression is similar. Most noticeably, it has a two-story “a.” It’s less geometric than Futura. In the lightest weights (Light and Medium), the italics have slight curves to some of the strokes and even sport alternate swash caps, and tails on some of the lowercase characters. <br><br>(I would love to do a revival of this face, but perhaps Ludlow <span class="caps">UK</span> is already on the&nbsp;case?) </p>
    html_clean: <p> Tempo was modeled after Futura and similar typefaces. Ludlow didn’t own Futura, so they had Robert Hunt Middleton do their own version. It’s quite a bit diﬀerent in the details, escpecially in the italics, but the overall impression is similar. Most noticeably, it has a two-story “a.” It’s less geometric than Futura. In the lightest weights (Light and Medium), the italics have slight curves to some of the strokes and even sport alternate swash caps, and tails on some of the lowercase characters. <br><br>(I would love to do a revival of this face, but perhaps Ludlow <span class="caps">UK</span> is already on the&nbsp;case?) </p>
