    html: <p> The lowercase italic does have some semblance, the uppercase however reminds me more of Nobel. Although even that isn't the same. But the feel is much closer in Nobel than it is in Metro, especially the condensed face 'Actual Killer' above. WAD never designed an italic for Metro either, so what you are seeing above, if it is Metro is more of an oblique than it is an italic. </p>
