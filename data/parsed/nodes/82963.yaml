    html: <p>You may be interested to know that there was an ancient style of insular monumental writing used in Ireland in which letters from different alphabets were mixed together in text. Examples can be seen in the illuminated manuscripts, including the most famous Book of Kells held in Trinity College Dublin, and some inscriptions. Usually in this style evident in the extant epigraphic examples there was a practice of interesting ligatures that seem to suggest ambigrams. On the inscription on the Ardagh Chalice, which dates from perhaps about 750 AD and is now housed in the National Museum of Ireland, the twelve apostles are spelt using letters from the Greek and Roman alphabets. I have recently noticed that this inscription also seems to contain Semitic letters, including a zigzag lamed three times and probably aleph. The Greek letter pi occurs in the inscription three times, in the names of the apostles Peter, Paul, and Philip. Is the insular monumental the earliest example of a pied script? By the way, I have read that magpies used to be called simply pies.</p>
