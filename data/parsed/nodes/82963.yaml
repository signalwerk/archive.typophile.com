    html: |-
      <p>Hi Nick</p>
      <p>Interesting question; have you asked around at work about this? I believe it is one of those ‘transatlantic-divide’ questions, whereby different answers are possible, according to US or UK usage.</p>
      <p>The ‘printer's pie’ attribution for ‘pi fonts’ appears on p.44 of James Felici’s <a>‘The Complete Manual of Typography’</a> and this is also a definition given in the Webster dictionary (which might be why a lot of American typos believe it, although I find it hard to credit ‘pie’ getting shortened to ‘pi’ – particularly when both words sound identical).</p>
      <p>However, on p.128 of Ken Garland’s much earlier ‘Illustrated Graphics Glossary’ (1980) – the definition states <cite>“pi characters: US term for ‘special sorts’ or ‘peculiars’, now in use in UK due to importation of US photocomposition machines.”</cite> Note the use of the individual noun, <em> character</em>, rather than the collective noun, <em>font</em>.</p>
      <p>The introductory text on p.2 of the Mergenthaler Linotype catalogue of 1986 also refers to ‘pi characters’, where they number over 10,000 in stock, and this is the crux of the arguments for either Greek characters or even (abbreviated) pictograms; you won't find<br>
      <cite> any letterpress type catalogs that refer to symbol fonts in general with the term “pi”</cite> – because at that point there were never any entire fonts of ∏. It was always a single character, borrowed, like so many other characters symbolising mathematical functions, from the nearest-sized or styled font of Greek, and I would expect this practice to pre-date any American printing history.</p>
      <p>Possibly, after Adobe Linotype produced the digital fonts called <a>Universal-Greek w.Math Pi and Universal News w.Commercial Pi</a> (dates for these?) the common usage slipped to ‘font’ rather than ‘character’, but we’d need more industry sources from the mid-’80s to corroborate this.</p>
    html_clean: |-
