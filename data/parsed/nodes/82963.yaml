    <p>Where does the term “pi fonts” come from? And who was the first to use or popularize it?</p>
    <p>I always assumed it was an odd abbreviation of “pictogram”, but it was never clear because the term is sometimes used to describe <em>any</em> non-alphanumeric/symbol font. If pi does indeed stand for pictogram, that would limit its relevance to a specific subset of symbol fonts – for example, mathematical symbols aren't pictograms.</p>
    <p>That doesn't really match up with the kinds of fonts I typically think of when I hear the term “pi” either, which tend to be be more technical and abstract than they are pictorial. Maybe there's a connection to the mathematical concept of pi?</p>
    <p>I also considered that there might be a connection to the letterpress concept of “<a href="http://letterpressdaughter.blogspot.com/2010/05/printers-pie-pi.html" rel="nofollow">printers pi(e)</a>”, but any connection there seems rather weak.</p>
    <p>For whatever it's worth, the term doesn't show up in anything on Google books <a href="http://ngrams.googlelabs.com/graph?content=pi+fonts%2Cdingbats%2Csymbol+fonts&amp;year_start=1800&amp;year_end=2000&amp;corpus=0&amp;smoothing=3" rel="nofollow">until about 1970</a>.</p>
