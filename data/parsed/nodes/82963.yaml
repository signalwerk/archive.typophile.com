      <p>On the date:</p>
      <blockquote><p>The perfect type are advanced to a selecting mechanism, where type which have been turned end for end, or become otherwise disarranged, are removed; then all wide type and regular <strong>'pi' characters</strong>, such as stars, daggers, etc., are separated from the ordinary kind of characters, while the remaining type are advanced to their proper channels, the distribution being stopped when any channel is full.</p></blockquote>
      <p>"The Type-Composing Machine Upon Which Mark Twain Lost His Fortune." <em>Inland Printer</em>, April <strong>1896</strong>, p. 55.</p>
