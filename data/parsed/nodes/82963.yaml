    html: |-
      <p>The expression ‘Pi’ fonts indeed stems from the greek letter π.<br>
      In the days of metal typesetting, the character sets were somewhat limited. Thus, setting special characters (such as mathematical symbols) had to be done using a font of symbols, which usually contained the letter π.</p>
      <p>While the printer’s pie is a nice analogy, it would only really contain a π when you dropped a line including a ‘pi’ character.</p>
      <p>I noticed that the expression ‘Pi fonts’ is much more common in the US, while in Europe you’d refer to dingbats or symbol fonts.<br>
      Probably the term just has been carried along through history here, ending up in font names of e.g. Adobe and Linotype. </p>
      <p>Thank you for bringing up that topic! I had to ask some questions myself before being able to answer. :)</p>
