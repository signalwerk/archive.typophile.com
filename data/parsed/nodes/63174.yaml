    <p>Hello typophiles!<br>
    Cocijotype has a new type release, Miniblock, designed by Manolo Guerrero, this typeface is defined by its counters and has a labyrinthic style. It's available at <a href="http://new.myfonts.com/fonts/cocijotype/miniblock/" rel="section">MyFonts</a>.</p>
