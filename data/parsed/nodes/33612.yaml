      <p>Sushi, I think that's DTL Elzevir bold italic. See p. 49 of their PDF <a href="http://www.dutchtypelibrary.nl/" rel="nofollow">here</a>. I think I've seen that  wild ry ligature in the PDF, but I don't see it right now. </p>
      <p>It is related to Caslon as many say that the types of Van Dijck, which are the basis of DTL Elzevir, served as models for William Caslon. </p>
      <p>By the way, heinous use of Caslon 540 :)</p>
