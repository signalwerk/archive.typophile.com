    html: |-
      <p>A few points and suggestions:</p>
      <p>1) I'm not inherently against using an initial as the basis of a mark, but in your current configuration, I don't think the logo is functioning well for these reasons:</p>
      <p>Because both the R in the title and the R in the mark use the same typeface, the mark becomes superfluous. It seems like overkill - like I'm seeing the logo twice, especially because there's not really any separation or differentiation between the mark and the title. I would suggest using a different typeface for one of the components, or just integrating your idea into the title, as shown below. If you went that route, you could use the standalone R as an alternate logo.</p>
      <p>2) It is possible people won't get the thermometer symbolism, so why not embrace your idea more literally? Perhaps stylize the R more like a thermometer, or scrap the R all together, and create some type of real estate/thermometer symbol, something like what I've shown below.</p>
      <p>Good luck.</p><div class="imageWrap"><img src="http://typophile.com/files/rh_01_4954.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/rh_02_5361.jpg"></div><p></p>
    html_clean: |-
