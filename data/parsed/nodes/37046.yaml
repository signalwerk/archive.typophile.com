    <p>Hi Typophiles, been a regular lurker here for a while, and now I actually have a question.</p>
    <p>I am looking for an approximation of the very elegant sans serif font that is the basis for the Houston Astros logotype.  The font used is obviously NOT a script font like Fenway Park or Sarah Script but a nice sans serif font that has been connected to make a script font effect.  Very nice and I think it increases legibility.</p>
    <p>Any ideas what the original font that the handlettering is based on might have been?  I figure the uppercase A is custom drawn, but the other lowercase letters look very familiar....Hmm....</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/astros_5037.gif"></div><p></p>
