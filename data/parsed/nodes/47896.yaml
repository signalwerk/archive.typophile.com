    <p>Apologies if this is the wrong thread, I am happy for it to moved if it is in the wrong area.</p>
    <p>Basically, I am embarking on a logo design for a client, at this stage I am just sketching some ideas.</p>
    <p>Currently I have this:</p>
    <p><a href="http://lw-d.co.uk/concept.gif" title="http://lw-d.co.uk/concept.gif">http://lw-d.co.uk/concept.gif</a></p>
    <p>Just a rough sketch, the clients names consists of the letters c and f, I wanted to try and tie in the two letters as a symbol, with the logo-type to the right (signified by the three lines.</p>
    <p>Now, I know this is a very rough sketch, but I was wondering if anyone can recommended any fonts that would get me started with the logotype, I am considering illustrating the c and f, but think that an existing font would be easier, and, with complexitites of typography.... better formed.</p>
    <p>So, to conclude this lenghty post, can anyone recommend any fonts that would set up a nice c and f logotype, the added benefit of using an exsiting font is that I can compliment the font with the full company name on the right.</p>
    <p>Appreciate any help.</p>
    <p>Thanks</p>
