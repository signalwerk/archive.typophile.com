    html: <p>ok, may be just a base, but try Kievit Italic. A smooth sans serif logo, if you wish to scape from the traditional serifed italics (like a sabon next italic or bodoni italic, for instance), or the tendency for a script face, like Zapfino. Hope it helps. Good luck!</p>
