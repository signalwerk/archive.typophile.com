    html: <p>I think you should try draw this form by hand and make it truly your own. There's great potential in your initial sketch. However there's no harm looking some other typefaces. I'm a big fan of the work of Argentine typographer <a class="freelinking external" href="http://www.myfonts.com/person/paul/alejandro/" rel="nofollow">Alejandro Paul</a> of <a class="freelinking external" href="http://www.sudtipos.com" rel="nofollow">Sudtipos</a>. He does some excellent calligraphic faces from which you could probably take some inspiration. Have a look at <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000181" rel="nofollow">Affair</a> or maybe something a bit more tame like <a class="freelinking external" href="http://www.sudtipos.com/fonts/3" rel="nofollow">Chocolate</a>. Go n-éirí leat.</p>
