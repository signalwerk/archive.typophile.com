      <p>I believe this is the work of Non-Format. <a href="http://www.non-format.com" title="http://www.non-format.com">http://www.non-format.com</a></p>
      <p>Their typefaces aren't commercially available, except for one they released last year. </p>
      <p>You might be hard pressed to find anything similar that is as precisely drawn or well balanced, as their work is quite exceptional. Of the abundance of similarly styled typefaces out on the market, most are of questionable quality.</p>
