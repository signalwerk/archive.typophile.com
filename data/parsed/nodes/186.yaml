    html: "<p> \x06??I would bring with me to a deserted island <br> <br>1. Gill Sans <br>For its timeless uniqueness and likeability <br> <br>2. Linotype Frutiger Condensed <br>For its 100% clarity. Perfect for signage. <br> <br>3. Verdana <br>I need a good font for my browser -- and we were allowed to bring our G4, remember? <br> <br>4. Linotype Univers Condensed <br>I may be the sole inhabitant on the island, but sooner or later I will have the need to publish a catalogue or a list. Univers Condensed will come in handy. <br> <br>5. PMN Caecilia <br>At the moment I can't stand the sight of it. But this typeface is *so good* that I simply must bring it. <br> <br>6. Lexicon <br>I have never used this font. I have never owned it. By choosing it to this forum I hope that some yuletime-spirited guy at Enschedé will *give* it to me. In return I shall study it closely. <br> <br>7. Tate Gallery Corporate Typeface (Wolff Olins) <br>God, it's beautiful! Recently I asked about it in Typophile Forum Type Identification Board. One of you guys said it resembled both VAG and DIN. <br> <br>8. Minion <br>As good a text face as any when treated right. <br> <br>9. ITC Bodoni <br>I guess I can't do without a good Bodoni. <br> <br>10. Parisine <br>I greatly admire the work of JFP! </p>"
