    html: "<p>Partly because it's so hard to narrow the list down to 10, this list isn't exactly my top 10 *individual* favorites, it's more like the 10 faces that come together to paint my favorite picture. <br> <br>1. Centaur (Jenson, Rogers) - First real font. <br> <br>2. Galliard (Granjon, Carter) - One giant on another's shoulders. <br> <br>3. Perpetua (Gill) - The pure essence of Latin. <br> <br>4. Electra (Dwiggins) - Depths yet to be fathomed. <br> <br>5. Rotis (Aicher) - Classiest, gutsiest babe this side of Berlin. <br> <br>6. Lexicon (de Does) - Function and Style living in total bliss. <br><a href=\"http://www.teff.nl/fonts/lexicon/lexicon.html\" target=\"_top\">http://www.teff.nl/fonts/lexicon/lexicon.html</a> <br> <br>7. Quadraat (Smeijers) - Youthful energy plus ancient wisdom. <br><a href=\"http://www.fontfont.de/packages/quadra6180/about6180.html\" target=\"_top\">http://www.fontfont.de/packages/quadra6180/about6180.html</a> <br> <br>8. Colorado (Mandel) - Trench warfare, but with panache. <br>Very hard to find a specimen, but here's something: <br><a href=\"http://www.themicrofoundry.com/other/mandel.gif\" target=\"_top\">http://www.themicrofoundry.com/other/mandel.gif</a> <br> <br>9. Salome (Schulz) - The organic rebirth of humanity. <br>I guess the only real place to see it is in \"Alphabook\": <br><a href=\"http://isbn.nu/0688168515\" target=\"_top\">http://isbn.nu/0688168515</a> <br> <br>10. Mis-hafi (Al-Saadi, Diwan) - Zapfino, eat your heart out. <br><a href=\"http://www.diwan.com/mishafi/main.htm\" target=\"_top\">http://www.diwan.com/mishafi/main.htm</a> <br> <br>BONUS for 2001: <br>Compatil (Linotype) - Intelligent ambition. <br><a href=\"http://www.fontexplorer.com/FontStore/1078185705/UserTemplate/44\" target=\"_top\">http://www.fontexplorer.com/FontStore/1078185705/UserTemplate/44</a> <br> <br>hhp</p>"
