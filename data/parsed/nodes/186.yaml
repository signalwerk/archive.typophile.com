    html: <p>Here are my top 10, with the disclaimer that this  <br>list changes almost weekly. Yeah, I'm late. I  <br>promise not to be influenced by the posts above,  <br>having only skimmed over them. <br> <br> <br>Sans <br> <br>Verdana - I can't get used to anything else on <br>my screen. <br><a href="http://www.myfonts.com/FontFamily458.html" target="_top">http://www.myfonts.com/FontFamily458.html</a> <br> <br>Knockout - I've used this more than any single  <br>family. It's amazingly versatile with a nod to  <br>the warm wood type of the past. <br><a href="http://www.typography.com/catalog/knockout/index.html" target="_top">http://www.typography.com/catalog/knockout/index.html</a> <br> <br>Avenir - The geometry and clarity of Futura, only <br>less austere. <br><a href="http://www.myfonts.com/FontFamily3439.html" target="_top">http://www.myfonts.com/FontFamily3439.html</a> <br> <br> <br>Serif <br> <br>Poynter Oldstyle - Emminently readable. Weights <br>that don't increase the width allow for quick  <br>changes in color. <br><a href="http://www.fontbureau.com/readability/" target="_top">http://www.fontbureau.com/readability/</a> <br> <br>FB Californian - The best of Goudy. I will set <br>all my poetry about my dreary fate on the  <br>deserted island in this family. <br><a href="http://www.fontbureau.com/specimens/californian.html" target="_top">http://www.fontbureau.com/specimens/californian.html</a> <br> <br> <br>Script <br> <br>Freehand 521 - Retro. <br><a href="http://www.myfonts.com/FontFamily220.html" target="_top">http://www.myfonts.com/FontFamily220.html</a> <br> <br>Sloop - Formal. <br><a href="http://www.myfonts.com/FontFamily566.html" target="_top">http://www.myfonts.com/FontFamily566.html</a> <br> <br> <br>Display <br> <br>Bauer Topic/Futura Steile - It's just so cute. <br>I will cheat and bundle Futura Display here  <br>for poster makin'. <br><a href="http://www.precisiontype.com/main.asp" target="_top">http://www.precisiontype.com/main.asp</a> <br><a href="http://www.myfonts.com/FontFamily2429.html" target="_top">http://www.myfonts.com/FontFamily2429.html</a> <br> <br>Dante Titling - Lovely proportions for large    <br>sizes. The alternative in a world where Trajan <br>is used for everything but bubblegum wrappers. <br><a href="http://www.adobe.com:80/type/browser/F/DANT/F_DANT-10005020.html" target="_top">http://www.adobe.com:80/type/browser/F/DANT/F_DANT-10005020.html</a> <br> <br>Farao - My new favorite Egyptienne. Good for  <br>tough, bold jobs when it's big, and sparkle when  <br>it's small. <br><a href="http://www.stormtype.com/htm/farao.html" target="_top">http://www.stormtype.com/htm/farao.html</a> <br> <br> <br>Stephen</p>
