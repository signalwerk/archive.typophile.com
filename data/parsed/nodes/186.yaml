    html: <p> Here goes my list too which don't have a order, all are very important for me and to the typography history. Sorry about I did't mention others that contributed for the big transformations around the typography design and our social and intelectual environmment during the time. This list is some of the type faces that I most admire which one for their resons ( Function=Purpose, Form, Legibilty ). <br> <br>1_Univers - Adrian Frutiger <br>2_Meta - Erik Spekermann <br>3_Bembo - Francesco Griffo <br>4_ Gill Sans - Eric Gill <br>5_ Bodoni - Giambattista Bodoni <br>6_ Jenson - Nicholas Jenson <br>7_ Scala - Martin Majoor <br>8_Bembo - Francesco Griffo <br>9_Baskerville - John Baskerville <br>10_Hoefler Text - Jonathan Hoefler <br> <br>Regards for all / Ricardo Santos </p>
