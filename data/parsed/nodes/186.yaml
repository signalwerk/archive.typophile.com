    html: "<p>MY FAVORITE FACES from the PAST TEN YEARS. <br>My list is influenced by a background in magazine and t-shirt design, and an affinity for display work. I could not settle on an order for these ten. <br> <br>bj <br> <br> <br>Anisette by Porchez <br> <a href=\"http://www.fontbureau.com/specimens/anisette.html\" target=\"_top\">http://www.fontbureau.com/specimens/anisette.html</a> <br><a href=\"http://www.typofonderie.com/Alphabets/Anisette.html\" target=\"_top\">http://www.typofonderie.com/Alphabets/Anisette.html</a> <br>Art Deco Beauty. <br> <br>Biblon by Storm <br><a href=\"http://www.stormtype.com/htm/bibl.html\" target=\"_top\">http://www.stormtype.com/htm/bibl.html</a> <br>So much to love, especially the inconsistencies that he manages to keep consistent and the feeling that the letters were 'inked' by a hand-letterer. Download a pdf. <br> <br>Hoefler Fetish No. 338 by Hoefler <br><a href=\"http://www.typography.com/catalog/fetish338/index.html\" target=\"_top\">http://www.typography.com/catalog/fetish338/index.html</a> <br>I can look at this all day. Type candy. <br> <br>The Royal Family by Giasson <br><a href=\"http://www.THIRSTYPE.COM/font_royalfamily.html\" target=\"_top\">http://www.THIRSTYPE.COM/font_royalfamily.html</a> <br>A ingenious mix of DIN and fraktur, the Royal Family is another well-executed Thirstype face. On the job when a particular mall-based chain of goth music stores needs a T-shirt design. <br> <br>Radio by Rakeng <br><a href=\"http://www.THIRSTYPE.COM/font_radio.html\" target=\"_top\">http://www.THIRSTYPE.COM/font_radio.html</a> <br>Was there ever a face worth waiting for, what was it, three years? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>Poetica by Slimbach <br><a href=\"http://www.adobe.com:80/type/typedesign/slimbach.html\" target=\"_top\">http://www.adobe.com:80/type/typedesign/slimbach.html</a> <br>Not just another swashbuckling chancery face, Poetica rises above because of its completeness and attention to detail. The alternates and ligatures and ornaments...so much beautiful stuff.  <br> <br>Zapfino by Zapf <br><a href=\"http://www.fontexplorer.com/FontStore/\" target=\"_top\">http://www.fontexplorer.com/FontStore/</a> <br>Linotype says it better than I can: \"A masterpiece from the master himself.\" What they really meant was: Typorgasm. <br> <br>The Shire Types by Tankard <br><a href=\"http://www.TYPOGRAPHY.NET/\" target=\"_top\">http://www.TYPOGRAPHY.NET/</a> <br>A classic in the making. Would love to see these carved out of...coal and hold them in my hands. Would love to see this used more here in the States. I love the fixed height for both uppers and lowers, and the variations. <br> <br>Sauerkrauto by Core <br><a href=\"http://www.chank.com/font_detail.php?sku=5267\" target=\"_top\">http://www.chank.com/font_detail.php?sku=5267</a> <br>Lettering based on Germany's license plates? You'd think this was a throwaway font, but such care has been placed on getting it perfect. On the cover of WIRED last month. <br> <br>Mantinia by Carter <br><a href=\"http://www.fontbureau.com/specimens/mantinia.html\" target=\"_top\">http://www.fontbureau.com/specimens/mantinia.html</a> <br>I love the mix of points and curves. Also, the lovely descenders on the 'Q' and 'R' are songs of the siren. <br> <br>Faces from the past decade regrettably not included:  <br> <br>Oz by Chester (thirstype.com) <br>SuperDuper by Rakeng (thirstype.com) <br>**((Alchemy by Tankard (typography.net) Mason by Barnbrook (emigre.com), Idiosynoptium by Griek (www.plusism.u-net.com)))** <br>most anything by Storm (stormtype.com) <br>most anything by Rian Hughes <br>anything by Rodrigo Cavazos (psyops.com) <br>faces by Jim Parkinson, Jim Marcus and Chank Diesel</p>"
