    html: <p> Not to fret, not to worry. Add to the list whenever you get a chance, this year, next year. The thread never ends. There is no strict deadline. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">   <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">   <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>&gt;&gt; The reason for the 'deadline' seemed obvious, but I guess not because we went from 'greatest' faces to 'favorite' faces. If you are posting a 'greatest' list, then you want lists that are not influenced by others, thus everyone posts at a certain time. Favorites, it doesn't really matter. So by all means post, this year, next year, whenever. As you can see, the 'strict' deadline was not a deadline at all. (By the way, the first post was made on Dec. 6.) Personally, I'm learning a lot about type, getting exposure to great opinions and having, uh, fun. I don't see a reason to be sore. <br> <br>&gt;&gt;  I was going to make a couple of suggestions to enrich the Typophile community. If you 'interract remotely' then every time there is a post at Typophile, it sends a copy to your email address. If you do not choose this option, and want to see what's going on since you last visited, click on 'Search_Last Day, or _Last Week or _Last Visit." <br> <br>bj </p>
