    html: "<p>I divided my list into my top ten favorite TEXT faces, and my top ten favorite DISPLAY faces, as comparing between the two seemed unrealistic. Even this distinction is subjective, admittedly, as fonts from one category could easily fit into the other (and, in fact, a few are listed in both). <br> <br>These lists reflect the way I use the fonts most of the time, and they reflect my thinking as of today. If we were to post this list again in a week, it's likely that my selections would be slightly different. I surprised myself with the excellent fonts that I considered (and use quite often), but DIDN'T include, among them: Akzidenz Grotesk, Baskerville, Bodoni, Caslon (Adobe, Berthold, or Caslon 540), Centaur, Century, Cochin, Franklin Gothic, Galliard, Helvetica Neue, Italian Old Style, Kabel (not ITC's), Officina, Meta, Syntax, Triplex and Walbaum. <br> <br>I also refrained from including my own designs in this list. <br> <br> <br>TOP TEN FAVORITE TEXT FACES: <br> <br>#10: BOOKMAN / OLD STYLE (Ludlow, 1925; Merganthaler-Linotype, 1936; Agfa-Monotype ?) <br>     (No direct link available; search at fonts.com) <br> <br>AGFA-Monotype has the best version that I've found; Bitstream's is okay. Avoid ITC's parody. <br> <br> #9: PLANTIN (Agfa-Monotype </p>"
