    html: "<p>Whoops. It was pointed out to me quite correctly that I neglected to credit the US Federal Highway Administration for the design of the FHWA Series fonts, which are the standard typefaces used for highway signs in the US, and the inspiration for my #10 display face choice, Interstate. <br> <br>I haven't yet been able to track down the name(s) of the designer(s) of the FHWA Series, nor its design date. <br> <br>I believe the following information may have been posted elsewhere on the Typophile Forums, but I can't recall where. It's fairly interesting stuff nonetheless. According to Richard C. Moeur's website (<a href=\"http://members.aol.com/rcmoeur/alphabet.html\" target=\"_top\">http://members.aol.com/rcmoeur/alphabet.html</a>): <br> <br>\"The standard typefaces used for highway signs in the US are defined in the 'Standard Alphabets for Highway Signs', published by the Federal Highway Administration.\" <br> <br>Apologies for the omission. <br> <br>David</p>"
