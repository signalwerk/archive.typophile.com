    html: |-
      <p>There’s a (custom) font similar to this one: Gill Sans “Volk und Wissen”.<br>
      “Volk und Wissen” is a German publishing company, specialised in educational / school books (as far as I know...).<br>
      Sorry, couldn't find a sample of this font right now though I remember seeing one in “Erste Hilfe in Typografie” by Hans Peter Willberg and Friedrich Forssmann.<br>
      I doubt that this font is available for the public. But i might be wrong.</p>
      <p>I think the lc a is slightly different, so this is most likely an altered version of the original Gill Sans.</p>
      <p>@SuperUltraFabulous: <a href="http://www.fonts.com/aboutfonts/articles/fyti/typography+for+children.htm" title="http://www.fonts.com/aboutfonts/articles/fyti/typography+for+children.htm">http://www.fonts.com/aboutfonts/articles/fyti/typography+for+children.htm</a></p>
      <p>(e.g. AG Schulbuch / Schoolbook wd be another “infant font”)</p>
      <p>Cheers,<br>
      Günni G.</p>
