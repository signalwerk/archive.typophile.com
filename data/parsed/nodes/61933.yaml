      <p>In my opinion the best hangul font for on-screen use at the moment is Nanum Gothic 나눔고딕, which is available for free at <a class="freelinking external" href="http://hangeul.naver.com/index.nhn?goto=fonts#fonts" rel="nofollow">http://hangeul.naver.com/index.nhn?goto=fonts#fonts</a>. It is a contemporary sans-serif with a warm touch and is expertly hinted for screen use, I think by the same individual who was in charge of hinting Malgun Gothic, the font bundled with Windows from XP onwards (and which is also an excellent screen font).</p>
      <p>Along with it serif counterpart Nanum Myeongjo 나눔명조, it is one of a pair of fonts (called the Nanum fonts 나눔글꼴) commissioned by the NHN Corporation which is behind Naver, a hugely popular search portal in Korea. They decided to distribute the Nanum fonts for free.</p>
      <p>The usage guideline in Korean is provided on the page that I linked to. Here's a fairly literal translation:</p>
      <p><cite>The Nanum fonts are the intellectual property of the NHN Corporation.<br>
      The Nanum fonts are provided free of charge for individuals and companies, and can be used in all publications and works.<br>
      To foster a culture of copyright protection, it is recommended that the source of the fonts is stated when using the Nanum fonts.<br>
      In addition, users may freely and directly distribute the Nanum fonts to others.<br>
      However, one may not charge for the copying and distribution for any reason in the process.<br>
      The Nanum fonts may not be modified and sold by users other than the intellectual property holders for any reason, and they must be used in the form distributed.</cite></p>
      <p>They don't deal in very detailed EULAs, but I hope this makes it clear what you can use the fonts for.</p>
      <p>A third of the way down the page I linked you will see the huge letters 나눔고딕 in the said typeface, and a series of six white boxes. The first three are links for downloading the TTF files, the last three for OTF files. To take advantage of the hints in a ClearType environment you should download the TTF files, and you probably want the third link, a zip file, as the first two are installation programs for Windows and Mac respectively.</p>
      <p>I hope this helps anyone looking for a good hangul font for on-screen use but frustrated by the language barrier.</p>
