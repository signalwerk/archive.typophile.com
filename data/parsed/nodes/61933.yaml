      <p>These fonts just got re-released under OFL. I’ve blogged about it at<br>
      <a href="http://hotlead.levien.com/2010/06/nanum-korean-fonts-now-released-under.html" rel="nofollow">hotlead</a>, and in particular am interested in whether anyone would be trying these out as-is as web fonts, or whether we need to do more work to squeeze the file size down.</p>
