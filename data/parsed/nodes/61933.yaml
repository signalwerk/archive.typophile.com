    date_raw: 1 Jul 2010 — 1:56pm
    votes: null
    html: |-
      <p>Thanks, I had missed the announcement. This is great news, especially for the Korean Linux community. It bears repeating that these are top quality fonts.</p>
      <p>The obvious way of squeezing down the file size would be to limit the character coverage to only the most used hangul syllables. For most purposes, only a fraction of the 11,172 hangul syllables would suffice. The question is what to keep; the 2,350 syllables of the EUC-KR standard are an absolute minimum, and maybe a statistical analysis of Korean text corpora will let us know which ones are sufficient to cover 99.9% of Korean texts.</p>
