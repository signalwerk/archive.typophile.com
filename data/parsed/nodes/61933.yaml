      <p>We bundle only one Korean font with our products, specifically AdobeMyungjoStd-Medium. It is a serif design. Given the lack of choice, it is better than nothing. Ideally, you would want to use a lighter sans serif design for on-screen use. In terms of what we offer on our Type Showroom, the Light or Medium weight of SM Gothic might be suitable. They are $29 each. See: <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1748" title="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1748">http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=...</a></p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
