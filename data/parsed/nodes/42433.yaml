      <p>I read an article that Akira Kobayashi of Linotype attended a type design competition in Shanghai as a jury last year. According to his blog, he thought that designing typeface skills in China would improve in a few years judging from the winning piece of works. Especially, type designers who had calligraphy skills designed good works.</p>
      <p>After I read his blog, I've been curious about the latest type design in China. Of course, the one in Korea too. And maybe some of Japanese typeface designers aren't aware of the development of type design in China. As Brian mentioned, I have little chance to know about the design scenes of my neighbors. I got the Idea magazine <a class="freelinking external" href="http://www.idea-mag.com/cgi-bin/book/catalog.cgi?language=en&amp;item=327" rel="nofollow">No.307</a> that featured Graphic design in Korea to know about type design in Korea few  years ago, which was the only stuff that I was able to know about design scenes of Korea. And also I bought the latest issue of Idea magazine <a class="freelinking external" href="http://www.idea-mag.com/cgi-bin/book/catalog.cgi?language=en&amp;item=307" rel="nofollow">No.327</a>  that featured "Book design today in China." Both issues are very interesting. I felt that there are some similarity between China and Korea but I found its originality in every work. I like the works that is a mixture taste of traditional and modern. I don't know how is the Japanese design because I'm in Japan. Maybe, it is easy to understand it from outside of Japan. In order to obtain the latest situation in Japan, you can also see Akira Yoshino's flickr photos from <a class="freelinking external" href="http://www.flickr.com/photos/akira1975/" rel="nofollow">here</a>. I think this library covers several categories such as posters, signage and billboards in Japan.</p>
      <p>I attended TypeCon 2007 Seattle last year, but there was no presentation concerned about East Asia area language except Robert Bringhurst's great one. Meanwhile, the speaker who showed about Arabic were really enthusiastic. So the audience seemed to be interested in their presentations. After the conference, I thought it was important to introduce the CJK type design to the people who lives in the other language area.</p>
