      <p>Interesting to hear that the Japanese stroke order is the most classical. I had a Japanese friend in university who would always laugh when she saw me write Chinese characters because my stroke order was all wrong. That's probably because my stroke order is wrong by any standard, though, including Korean. Since most Koreans of my generation don't really ever write Chinese characters, we don't bother to learn the correct stroke order.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gwagwagwagwa_6353.gif"></div><p></p>
      <p>For your amusement, here are four Korean designs of the same character 過. From left to right, they are (1) Chosunilbo Myeongjo (a sample of which I posted earlier), (2) Batang, (3) Sinmyeong Gungseo, and (4) #Gungseo.</p>
      <p>To my Korean eyes, (2) has the most recognizable form of the radical for print, and (3) is the preferred form for handwriting. I've already commented on (1), as has Eyedunno, and frankly (4) is just bizarre.</p>
