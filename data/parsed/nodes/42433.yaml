      <p>Plenty of good points here to mull over.</p>
      <p><cite>I predicted that in 25 years or so, genuine unification is likely to take place, and the catalyst for this is Unicode.</cite></p>
      <p>I think a lot will depend on the handful of foundries are responsible for producing CJK fonts that are likely to be used by the wider public. I would guess that compared to the innumerable designers and foundries contributing to the development of latin fonts, the producers of CJK fonts are far fewer in number.</p>
      <p>I could see this going in either direction. CJK unification could be accelerated by more exchange and collaboration between outfits from different countries, as type designers will try to come up with single forms that will please the mainland Chinese as well as the Japanese, Korean as well as the Taiwanese. Then again, type designers might choose to emphasize the national differences, even to the point of creating differences where there really weren't any before. In any case, it might be a handful of people that end up determining the future of CJK font production.</p>
