      <p>I think my problem with Song-style faces is that they often have spindly, thin horizontals and exaggerated triangular serifs, resulting in a harsh look, especially printed on glossy paper. This sample makes me think these features were originally introduced to compensate for ink gain in the past, because the forms in the sample are much warmer and more graceful than what I am used to seeing. I'd like to see a return to this sensibility in text faces.</p>
      <p>The article mentions the Imitation Song style (仿宋体) faces, which I didn't know about. I'm curious about their role in Chinese typography. Are they acceptable text faces? Are they used in conjunction with Song style faces, maybe like italics are used in conjunction with roman faces?</p>
      <p>In China, I think I saw a lot of sans faces with round forms or rounded corners. We don't see a lot of fun Chinese display faces at all in Korea, so they were really interesting to see, and I'm glad more different designs are appearing. But as Janus (Oisín) said, I don't see them or any sans faces really working for text.</p>
      <p>Speaking of heavy sans faces, what do people think of TDC2 2008 winner <a href="http://tdc.org/news/2008Results/LogoJrBlack.html" rel="nofollow" class="link-external">Logo Jr Black</a>, probably the blackest Chinese face I've seen?</p>
