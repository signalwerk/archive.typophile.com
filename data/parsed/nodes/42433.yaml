      <p>Sorry for replying so late at this point. Yes, you are right about the it. It's 楷体. It doesn't fit into the era that we are in, but still it's very classy. It is based on the stand calligraphic style which I was learning when I was young.</p>
      <p>宋体 is also another classy font, but apart from being used in texts, it has little presence in other forms, partly due to the fact that when it gets enlarged, the strokes are not bold enough to be legible enough. Of course, there are some improvements out there, but maybe being a serif font makes it not that popular.</p>
      <p>The current trend is using more sans font. 黑体 is the most used font now as far as I can see. 黑体 in Konghong is much bolder than the one in Mainland, which shows the creativeness when it comes to types in Hongkong. I kind of like bolder version of 黑体.</p>
      <p>But as a whole, the design scene is China doesn't care about the types. Even the great designers ignore the types, which quite spoils everything. I feel sick seeing those ugly fonts used on the streets. Even the fonts used in the Olympic slogan is hideous in a way that it's so predictable as if it had been chosen randomly in Word.</p>
      <p>The good thing is that everyday I see more different Chinese fonts appearing everywhere, which were quite non-existent. I still don't know the name yet.</p>
