      <p><cite>Yifei, what is that style called? In Korea we would just call it haeseo (楷書), so would it be kaishu in Chinese? Or does that just refer to the style of calligraphy? </cite></p>
      <p>楷书 is indeed <em>kǎishū</em> in Mandarin, and it refers to a particular style of calligraphy, though it’s so predominant that it’s dubious whether it’s appropriate to think of it as just ‘a style’ of calligraphy. Its English name is Regular Script (or Normal Script—it also has plenty of other names). Wikipedia has a <a href="http://en.wikipedia.org/wiki/Regular_script" title="Wikipedia article about 楷书" rel="nofollow">fairly good 楷书 article</a> on the topic.</p>
      <p>The computer typefaces based on Regular Script are also called 楷书 in Chinese.</p>
      <p>&nbsp;</p>
      <p><cite>In terms of glyph forms, I think Koreans prefer the four-stroke form of the grass radical (looking like ++). The three-stroke form is acceptable as a simplification, but the four-stroke form is considered proper.</cite></p>
      <p>In China, the four-stroke version of the 草字头 was officially abolished with the advent of the First Simplified Character Scheme. It’s still used occasionally in more exuberant, ‘flowing’ typefaces, but only in traditional characters (which the more exuberant calligraphic scripts tend to be, anyway).</p>
      <p>&nbsp;</p>
      <p><cite>The only form of the walk radical (as in the character 過) that I’ve seen Koreans write is the one in the Korean font sample. That’s the way we are taught to write it.</cite></p>
      <p>This form is also seen in China, but is also associated with traditional characters. It is seldom used among simplified characters. It is quite commonly written that way in handwriting, though. The regular form in Mainland China, 辶, is merely a further simplification of 辵 <em>chuò</em>, from which the character derives (ultimately from a character written something like 彳止亍 (a 止 inserted into the middle of a 行).</p>
      <p>&nbsp;</p>
      <p><cite>The Korean form of 靑 (blue/green) has a lower part that looks like 円 instead of 月, at least the way I learnt it. But I think Koreans are used to reading the other forms that you find in Japanese fonts. I think Koreans find most Japanese forms perhaps odd but acceptable, and most people won’t even notice the differences.</cite></p>
      <p>円 would perhaps be the more logical development here, but the Chinese development of 月 is also not far-fetched. 青 is, of course, from 生 and 丹 originally, and the 点 in 丹 has merely become a 横, rather than a 竖, in the Chinese form of the character. (Notice how this is also the case in the composite character 静, both in the Korean and the Japanese typefaces—I wonder why this particular 点 has developed in two different ways, apparently according to the complexity of the character, in Korean and Japanese.)</p>
      <p>To me, though, the Korean 有 that has a 撇 as its third stroke, rather than a 竖, simply looks... odd. Very odd. I can imagine how you feel when you see Mainland Chinese typefaces where half the characters are somehow ‘wrong’ like that.</p>
      <p>&nbsp;</p>
      <p><cite>The forms I saw in China, though, took quite a bit of getting used to, and not just because Simplified Chinese is used. I caught differences in characters like 入 (enter) and 化 (become), which have forms that look almost wrong to Korean eyes.</cite></p>
      <p>With 入, I assume you refer to the calligraphy-like style that looks merely like a reversed 人, without the ‘hook’ (dare one call it a serif? :-P) at the top? Both styles are in equally common use in China.</p>
      <p>In the case of 化, the main difference seems to be that in China (and Japan?), the upside-down 人 has morphed into the unique shape</p>
