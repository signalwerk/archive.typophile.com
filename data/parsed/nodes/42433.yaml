      <p>Caleb, I have to confess I know very little about Chinese graphic design, and rely on impressions gathered from several short visits and reports appearing on Korean magazines and blogs. There seem to be a lot of international design-related conferences going on that involve people from across East Asia, and there is growing interest here in the Chinese and Japanese design scenes.</p>
      <p>There was very little cultural exchange in general between South Korea and China until the 1990s. So until recently, the Korean and Chinese design scenes were largely independent of each other. Japan had more of an influence, at least in type production. The earliest western-technology hangul type, designed by Choe Jihyeok for a Korean-French dictionary, was cut in Yokohama in 1880. Many of the important pre-digital era hangul types were cut (or produced for phototypesetting) in Japan, right up to the 1970s.</p>
      <p>That is for type design technology, though, and I'm not sure how much of an influence there was on the content, or for other areas of graphic design. I can only offer impressions, but I'm sure the influence is there, if only through the familiarity bred by Japanese magazines and manga books that are widely available in Korea. Japanese books and magazines make up the second largest section of the foreign books sections of large Korean book stores.</p>
      <p>I'm sorry I'm not able to answer more about graphic design and advertising since my interests tend to be focused on type design. I don't know any Chinese design blogs; I just turned that one up through searches. Then there is the language and script barrier between the three countries, which one has to keep in mind before overestimating the influence the design scenes have on each other. I'm feeling a bit guilty, because this thread made me realize just how little I know about the design scenes of our neighbours. Maybe it's not just me and Korean designers are mostly oblivious to developments in China and Japan. (Then again, maybe they religiously consult the latest Japanese design annuals.)</p>
      <p>As for periods in East Asian graphic design, the only thing I can think of right now is for calligraphy. If you want a history of the different styles of calligraphy throughout the different dynasties of China, I can do some research. It will take some time, though.</p>
