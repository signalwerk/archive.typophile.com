      <p>Wow!  The fact that they're expanding the Joyo Kanji list is news to me.  It looks like they've chosen good characters to add and get rid of, too, except that 鬱 will go from a "can you write this?" challenge character (like 薔薇) to something that middle-schoolers will be expected to read and write.  Oh well, good. :)</p>
      <p><cite>Given enough time, mainly for the current generation to grow old and pass on, the distinctions that are considered important today are likely to become unimportant in the future.</cite></p>
      <p>Yeah, I agree with this.</p>
      <p><cite>I could see this going in either direction. CJK unification could be accelerated by more exchange and collaboration between outfits from different countries, as type designers will try to come up with single forms that will please the mainland Chinese as well as the Japanese, Korean as well as the Taiwanese. Then again, type designers might choose to emphasize the national differences, even to the point of creating differences where there really weren’t any before. In any case, it might be a handful of people that end up determining the future of CJK font production.</cite></p>
      <p>I don't really see either of these happening.</p>
      <p>On one hand, there's little incentive to make truly unified forms, since memory and hard disk space are cheap enough that all modern OSes, and even portable devices like iPods, include fonts for all four CJK schemes.  I suppose it could be attempted as a cost-cutting move, but if the product doesn't sell, then cutting costs isn't worth it.  Besides, I don't know too much about type design, Asian or otherwise, but would imagine that a large part of an East Asian type designer's job is piecing together elements rather than making 10,000 characters completely from scratch.  To change 認識 to 认识seems like it would only require adding 人 and 只 to 讠 and fiddling a bit with the proportions of the elements.  If I'm right about this, then, for example, converting a Traditional Chinese face to a Simplified Chinese one would be a lot easier than making a whole new Simplified Chinese face.</p>
      <p>And type designers try to sell their work to the public, so I can't see them making a concerted effort to create new peculiarities that stay confined to their country of origin (AND having it sell).  What COULD happen is that a quirky design could become popular in one country, but not in the others.  Even this seems unlikely though, given how quickly the same pop faces move, say, from Japan to China (with adaptations, of course).</p>
      <p>Ken's prediction that the differences will just be less important seems much more plausible.</p>
