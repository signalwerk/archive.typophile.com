      <p>I have a question of my own. What do people think of the designs of Chinese ideograph (hanzi/hanja/kanji) fonts coming out of China, Taiwan, Hong Kong, Japan, Korea, and other scenes? Are there noteworthy country-specific trends? Who does the best Chinese ideograph fonts for display and for text?</p>
      <p>I wonder what non-Koreans think of Chinese characters designed by Koreans, for instance in the Chosunilbo Myeongjo (used by the daily newspaper <em>Chosun Ilbo</em>) font whose sample appears below. The sample is a poem by Kim Sisŭp (1435-1493) called "Vagabond". The original hanja (Chinese characters) on the left, the Korean translation in hangul (Korean alphabet) on the right.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/yugaek_6169.gif"></div><p></p>
      <p>Is it even possible to detect a difference in the design of the Chinese ideographs from works by Chinese, Taiwanese, or Japanese teams?</p>
