      <p>In terms of glyph forms, I think Koreans prefer the four-stroke form of the grass radical (looking like ++). The three-stroke form is acceptable as a simplification, but the four-stroke form is considered proper. The only form of the walk radical (as in the character 過) that I've seen Koreans write is the one in the Korean font sample. That's the way we are taught to write it. The Korean form of 靑 (blue/green) has a lower part that looks like 円 instead of 月, at least the way I learnt it. But I think Koreans are used to reading the other forms that you find in Japanese fonts. I think Koreans find most Japanese forms perhaps odd but acceptable, and most people won't even notice the differences.</p>
      <p>The forms I saw in China, though, took quite a bit of getting used to, and not just because Simplified Chinese is used. I caught differences in characters like 入 (enter) and 化 (become), which have forms that look almost wrong to Korean eyes. The character 天 (sky) is interesting, because the Chinese seem to use the form where the upper horizontal stroke is shorter than the lower one. Koreans write the character in the same manner, but are used to seeing the version with the longer upper stroke in print (maybe that's a Japanese thing?). I see though that Chosunilbo Myeongjo (the font I picked for the sample) has the version with the shorter upper stroke.</p>
      <p>From what I can tell, they did a lot of research for Chosunilbo Myeongjo to pick glyph forms considered proper by Koreans. Because we use a lot of hanja designs imported from elsewhere (chiefly Japan), we are used to seeing a proliferation of variant glyph forms for hanja in print (which might explain some of my struggles with hanja).</p>
      <p>I wonder how the current vogue in studying Chinese as a foreign language will influence the Korean preferences for certain hanja forms in the future.</p>
