      <p>Thank, Janus, for your in-depth contribution! I think it's fair to say that Korean hanja forms tend to be quite conservative, especially compared to the character forms in China. Hanja has fallen out of everyday use a long time ago in Korea, so it makes sense that Koreans use 'fossilized' forms while the glyph forms continue to evolve in China.</p>
      <p>Also, Koreans don't learn much about cursive or shorthand forms of Chinese characters, which seem to be the base of a lot of alternate forms in China and Japan.</p>
      <p>I didn't even notice that the Korean 有 form was significantly different from the other examples until you pointed it out. For me, it's just a stylistic variation, just like the two different and equally acceptable forms of the hangul vowel ㅠ (yu) where the left vertical stroke may be either straight or curved. It's good to learn that the Korean form looks so odd to you.</p>
      <p>It looks like an opportunity is there for some team to do the research into country-specific forms and to develop a Chinese OpenType font with the appropriate alternates so that you can set culturally-appropriate Chinese, Japanese, and Korean characters with a single monster font family. If there is indeed a team combining the international expertise and the ability to put in ridiculous amounts of man-hours... One can dream, right?</p>
