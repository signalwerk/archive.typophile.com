      <p>Oh, one more thing to add that just occurred to me.  <em>Tonbo</em>, the Japanese word for dragonfly, is rendered in kanji as 蜻蛉, with 靑 to the right of 虫 as the only possibility, but just about every common character normally uses 青 (though, as I said above, 靑 is still seen occasionally).  So  I guess Japanese is all mixed up.</p>
      <p>And since I'm doubleposting, I might as well give some input to the OP, old thread or not.  There are several basic Chinese script types commonly used:<br>
      1) Song/Ming (宋 or 明) - Previously mentioned, this is the Chinese equivalent to a serif face, and is used for similar purposes.<br>
      2) Hei/Gothic (黑 or Gothic) - A Chinese sans serif.<br>
      3) Regular script (楷書) - Standard brush-written script<br>
      4) Cursive script (草書) - Script where even complicated characters can be written with a single brush stroke.  Looks like squiggles to most people, so it's not very useful for anything but decoration.<br>
      5) Semi-cursive script (行書) - Has the flowing beauty of cursive script with most of the legibility of regular script.<br>
      6) Clerical script (隸書) - the predecessor to regular script, and still used for its stylish yet very clear appearance.<br>
      7) Seal script (篆書) - As the name suggests, this is used for carved personal seals (as in stamps).  Normally straight strokes tend to be heavily curved, and examples of this can be extremely complicated (to frustrate potential counterfeiters).<br>
      8) Oracle bone script (甲骨文) - As far as I'm aware, this is the oldest Chinese writing, and most of the characters still look like pictograms.  This is pretty much used only for decoration, and rarely at that.<br>
      9) Bronze script (金文) - Used in ancient China on cast bronze.  The earliest examples resemble Oracle bone script, while later examples anticipate seal script.  Modern versions of bronze script have a tall, thin, and slightly warped appearance, which can be used for anything from a refined, high-class look to a spooky look.  Here's an example:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/2008102421174495_4601.gif"></div><br>
      10) Edomoji (江戸文字) - Japanese styles that came into use a few hundred years ago, but can now be seen in other countries and in Chinese computer fonts as well.  Most of these are very heavy faces.  I think the most common type of Edomoji today is Kanteiryu (勘亭流).  Wiki Edomoji (or any of these) if you're curious.<p></p>
      <p>There are also numerous pop faces that have come around in recent years, and I'd say that most are stylized variants of Gothic faces.</p>
