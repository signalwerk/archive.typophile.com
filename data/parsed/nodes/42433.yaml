    <p>Hey everyone,</p>
    <p>I'm trying to find information about the history/styles of Chinese typography and graphic design. I'm also looking for blogs related to that topic. I've found some resources but I  wanted to try "crowd-sourcing" to see if anyone knows of sites that I'm not aware of. I just launched a <a href="http://www.calebkramer.com" rel="nofollow">blog</a> where I'm concentrating on advertising and design in China and Taiwan, it's a personal research project of sorts that I've been wanting to start for a while. So if you have anything that may help me, I'd be most grateful!</p>
    <p>Caleb</p>
    <p><a href="http://www.designbrandchina.com" rel="nofollow">www.designbrandchina.com</a></p>
