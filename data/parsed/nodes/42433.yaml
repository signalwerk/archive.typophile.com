      <p>I happened upon this thread by accident and felt compelled to reply.  Apologies for resurrecting it for the second time.</p>
      <p>JongSeong:<br>
      My feeling is that different CJK-using cultures have bastardized the characters in different ways over time, and talking about "correctness" is futile.</p>
      <p>In Japan, the character 拝 is used, as opposed to the more historically-correct Chinese 拜.  On the other hand, Japanese stroke order is more in tune with classical forms than any other CJK country.  For example, 右 is written with the sloping stroke first in Japan, which reflects the oracle-bone form better than the more intuitive stroke order used in other countries.</p>
      <p>I know very little about hanja in Korean, but from what you posted, I will say that while most of that stuff looks fine (though the typeface design itself seems a little limp), 過 and 遊 indeed look funny.  I would guess that this is a Korean bastardization; it looks like somebody mixed up the radicals for 進 and 延.</p>
      <p>And mainland China is, of course, guilty of the most hanzi tomfoolery with all its rounds of ugly simplification.  I suspect 天 with the top stroke shorter is another product of the mainland, though I can't be sure about that.  Note however that Microsoft's MingLiU font for traditional Chinese has the top stroke longer (though confusingly, the newer JhengHei font has the top shorter).</p>
      <p>Anyway, I believe there is already a system of putting lots of variant forms into fonts, and it's called Unicode.  I personally think it would be pointless to take things further than Unicode already does, as a lot of the things mentioned are stylistic preferences that don't change the fundamental legibility of the script, and as such, Koreans using a made-in-Korea Unicode font seems like it would be just fine.  But the grass radical written with either three or four strokes is not unheard-of in either China or Japan (艹, 艹, and 艹 are all radical forms of 艸), and neither is 靑.  Even in Japan, the less familiar forms are sometimes chosen as a stylistic gesture.  Also note that both 青 and 靑 have separate Unicode code points, and both variants should be found in any decent kanji/hanzi dictionary and in most Chinese and Japanese fonts (though Microsoft's Korean fonts only seem to have the latter, hrmph).</p>
      <p>akira1975:<br>
      I really like to see kana when judging a Japanese mincho font though.  は／ほ／け, を, う, ら, and く in particular say a lot about a given typeface, as does the size of the kana compared to that of the kanji.</p>
      <p>mydot2001:<br>
      Actually, Song is known as Mincho (明朝 "Ming Dynasty") in Japan and Ming in Taiwan.  From what I've heard, this is because, while the face is a product of the Song Dynasty, it really gained prominence in the Ming Dynasty.</p>
