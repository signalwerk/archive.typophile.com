      <p><cite>«The article mentions the Imitation Song style (仿宋体) faces, which I didn’t know about. I’m curious about their role in Chinese typography. Are they acceptable text faces? Are they used in conjunction with Song style faces, maybe like italics are used in conjunction with roman faces?»</cite></p>
      <p>Just to make sure we’re on the same page here (since you mention being unfamiliar with the term), this is a (very quick ’n’ dirty) sample text of STFangSong, OS X’s default Imitation Song face.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fangsong_5351.png"></div><p></p>
      <p>Imitation Song faces are sometimes used much like italics are used in Western type, for names, quotes, titles, &amp;c. They are often used as regular text faces, too, though I’m not really sure if this is considered ‘proper’ by knowledgeable Chinese typographers. Text set in Imitation Song faces will then often use either a sans-serif face or an actual Song face for the ‘italic’ function, although actual italics (which are of course not actual italics, but false, computer-generated italics) are becoming increasingly common, despite looking ghastly. The Chinese script was <em>not</em> meant to be digitally slanted.</p>
      <p>&nbsp;</p>
      <p><cite>«Speaking of heavy sans faces, what do people think of TDC2 2008 winner Logo Jr Black, probably the blackest Chinese face I’ve seen?»</cite></p>
      <p>I have to say I rather dislike it. Heavy sans faces work somewhat better for Japanese in general, since the interspersion and mixture of kana and kanji gives the overall text a lighter and less stroke-heavy look than is the case for Chinese; but even for Japanese, I think this face is too thick. Not only a display font, but a display font only suitable for headings of no more than around 8–10 characters, to my eyes.</p>
