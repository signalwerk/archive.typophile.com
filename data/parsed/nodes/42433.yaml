      <p>I'll go ahead and give two examples of the stroke order thing.  Here's an composite image from scans I made of my kanji dictionary that should make this easier to explain:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/kanjistrokeorder_3788.png"></div><p></p>
      <p>I already mentioned 右.  This is written the same as 左 in Japanese, but going back to the bronze and seal scripts, it should be easy to see that the hand should be drawn first, followed by the arm, which cuts through.  Incidentally, 有 is written with the same initial stroke as 右, since the top part represents a right hand.</p>
      <p>必 is trickier to explain.  While in classifying the character, 心 (heart) is treated as the radical, the original character had nothing to do with a heart.  It's a forked stick held down to two stakes with a rope.  This sense of "tied down" thus connects to the current meaning of "necessary" or "must".  In Japan, this is still reflected in the stroke order, where the stick is drawn first, then the rope, then the stakes.</p>
      <p>But really, Chinese (and apparently Korean, according to the one Korean I've asked) stroke orders are designed to be more practical for education, while Japanese stroke order stays closer to old forms for the benefit of calligraphers.  So it ultimately boils down to two different ways of thinking, and each is correct, in a sense.</p>
      <p>And yeah, I agree that (4) is strange, as, from what I've heard, the part underneath the dot in the handwritten form IS the second dot; it's just connected.  In Japan, the usual standard is to omit the second dot, even in print forms.  This seems to be true of simplified Chinese fonts as well.  Here are some Japanese Mincho (Song/Ming) and Kaisho (Regular) fonts:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/minchokaisho1_6083.png"></div><p></p>
