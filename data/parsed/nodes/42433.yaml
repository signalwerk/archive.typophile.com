      <p>Briefly, it notes that simplified Chinese characters have less variation in density and can therefore look quite dull. For example:</p>
      <p>心臟，醫生 (traditional Chinese)</p>
      <p>心脏，医生 (simplified Chinese)</p>
      <p>What do you think about this?</p>
