      <p>The recent posts to this thread have struck a few nerves, and I mean that in a good sense. In other words, Eyedunno has raised several key issues related to ideographs.</p>
      <p>One issue is that of simplified forms. Conventional wisdom states that China has embraced this, which is correct. But, Japan has as well, but not nearly to the same degree as in China. In fact, they share many of the same simplified forms, such as 国 (U+56FD) for 國 (U+570B). But, there are some for which only Japan standardized a simplified form, such as 黒 (U+9ED2) for 黑 (U+9ED1).</p>
      <p>The interesting thing about simplified forms is that they result in a more complex world. In effect, they add to the total number of characters, and to some extent has the opposite effect. Of our CJK fonts, our Simplified Chinese ones have significantly more glyphs than for other CJK locales.</p>
      <p>The other is the notion of correctness. It is absolutely correct that any attempt to do so is somewhat futile. Each locale that has adopted ideographs as part of their writing system has modified it for their own use. I am reluctant to use the word bastardize in this context, but it is fairly accurate. Vietnam, Japan, and Korea have even coined their own ideographs, and a small number were borrowed back by the Chinese, such as 腺 (U+817A). Getting back to the notion of correctness, Japan is currently struggling with this in their attempt to update the Joyo Kanji list. The current Joyo Kanji list is built on principles, one of which is that the forms are simplified. Some of the kanji that they plan to add are from the NLC (National Language Council) Kanji set, which was defined in 2000 and contains 1,022 characters. This set uses the traditional forms. It's a balancing act between simplified and so-called correctness.</p>
      <p>I predicted that in 25 years or so, genuine unification is likely to take place, and the catalyst for this is Unicode. Today, a single CJK Unified Ideograph code point may require more than one glyph in order to display the character as intended for each locale that uses it. Given enough time, mainly for the current generation to grow old and pass on, the distinctions that are considered important today are likely to become unimportant in the future. As communication mediums improve, the world gets smaller. That, along with the tendency for things to simply, will cause this to happen.</p>
      <p>I could go on and on...</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
