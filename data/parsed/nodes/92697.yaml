      <p>This has nothing to do with typography, but ...<br>
      You can change Windows' system icons (this is for XP - later versions should be similar)<br>
      Right-click on an empty area of your desktop.<br>
      Select properties.<br>
      Click the Desktop tab<br>
      Click the Customize Desktop button.<br>
      Select the icon you want to change and click on the 'change icon' button.</p>
      <p>Just found the Windows 7  method. Very similar:<br>
      <a class="freelinking external" href="http://www.marmalademoon.com/change-system-folder-icons-windows-7/" rel="nofollow">http://www.marmalademoon.com/change-system-folder-icons-windows-7/</a></p>
