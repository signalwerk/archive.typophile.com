    html: <p>DMV means Department of Motor Vehicles around here, so that is all I thought of in the name.  The stars and stripes motif reinforced that governmental idea, and the M mark reminded me of racing.  VA looks very tight comparatively and feels overly clean and modern next to the rest.  Honestly, I can't even guess what sort of organization would be represented by this, so I would go back to the drawing board.  What exactly is the message you are trying to send?  What impression should this identity create?  What does it have to do with three states?  Who is your audience?  etc.</p>
