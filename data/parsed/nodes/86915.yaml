    <p>How's it going peeps.</p>
    <p>Designing a logo for a brand me and good friend are starting in our area.</p>
    <p>The logo is a representation of D.c, Maryland, &amp; Virginia. hence DMV. Here all 3 states are so closely related we refer to it as the "DMV"<br>
    I kept it as simple as i could. The type I was looking for the same feel and went w/ a thin italic type for "'sthemove" to symbolize a<br>
    "moving effect" or "on the way". </p>
    <p>Please be Hard on me w/ the critique I love constructive criticism. lol</p>
    <p>Take care.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/offdmv3_5245.png"></div><p></p>
