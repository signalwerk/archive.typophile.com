      <p>It's hard to critique a logo without knowing more about the company it represents. </p>
      <p>But without knowing any background info, my offhand comment is that it looks like several different logos rather than one unified logo. The big circle overpowers the elements it contains. And "DMV's the move" sounds more like a tag line rather than part of a logo itself. You need it all to be simpler and more direct.</p>
