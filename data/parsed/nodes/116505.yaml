    html: |-
      <p>I think everything is OK, except the optical scaling of the font.<br>
      The body text is too wispy—that is a shortcoming of this rendition of Centaur; but you can heavy it up with the Stroke feature in InDesign.<br>
      And the Drop cap is too clunky—try thinning it down with Stroke, or use a display face.<br>
      Hoeﬂer’s Requiem would be an alternative.</p>
