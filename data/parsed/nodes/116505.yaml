    html: |-
      <p>I will agree that the main problem is with the typeface. Centaur is beautiful but the digitized version does not really serve as a text typeface.<br>
      Maybe you can save it by using a larger size but it seems you can't change the type size much before your lines become too sort.<br>
      A very interesting alternative to Centaur is <a class="freelinking external" href="http://emigre.com/EF.php?fid=130" rel="nofollow">Vendetta</a>. I just received a test copy of a book I made with Vendetta (medium weight) and I am very happy with the result. Or else you can use Arno or a Jenson revival.</p>
