  - id: 578339
    user: 7409
    date: 2014-05-14T13:38:00
    date_raw: 14 May 2014 — 1:38pm
    votes: null
    html: <p>Both Hrant and Dimitris have come up with good alternative faces to consider. I am a fan of Iowan Oldstyle by John Downer and was not aware of Vendetta - another sucess for him. As to Centaur, Nick makes a good point about Centaur being wispy - when Bruce Rogers used it he had ink spread to give it more body - when I have used it I always track it close and that seems to give it more "bulk". I would say you should look at Vendetta and Faunus but also try Nick's idea with Centaur.</p>
