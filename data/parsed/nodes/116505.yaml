  html: |-
    <p>I'm setting a devotional book (selections from the BCP) and am trying Centaur for it. Adobe Centaur is what I have. I know it's often, though not always, been used in larger text sizes (e.g., Bruce Rogers used a custom version for the Bible with 22 point text if memory serves). Anyway, I'm trying 13/16 with a fairly narrow line length. I welcome any criticism, but want to particularly ask for thoughts on (1) whether the type size is too small to make effective use of Centaur, (2) whether the leading is sufficient, and (3) whether the italic is too tight and needs some letterspacing (not that I want to steal sheep or anything). But all criticisms are welcome. Thanks.</p>
