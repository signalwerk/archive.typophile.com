    date: 2014-05-14T17:22:00
    date_raw: 14 May 2014 — 5:22pm
    votes: null
    html: <p>Thank you all for the excellent suggestions. I liked Vendetta and Faunus (especially the latter--amazing) but had some concern that they might call attention to themselves for this particular project. I've set it in Requiem, as suggested by Nick (using 12/15). It looks great to my eyes. I would post a new set of sample pages here in Requiem, but I can't add an attachment to a comment. If anyone is interested in seeing the Requiem version, I'll start a new thread for it. Again, thanks to all for the suggestions.</p>
