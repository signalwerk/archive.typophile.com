  html: |-
    <p>Could anyone suggest a digital printer to be used by a small company with occasional needs for printing flyers or small catalogs (&lt;=A3) in small quantities (&lt;100 pieces)?<br>
    Would you suggest a laser or an inkjet printer?</p>
    <p>(If you feel that it will be bad to advertise particular brands or particular model numbers on the forum, it would be great if you could just send me an email with these informations)</p>
    <p>Thanks in advance for any suggestions.</p>
