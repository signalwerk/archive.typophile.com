    <p>I think I've been looking at this for waaaaay too long, but I feel as if no matter how many hours I spend moving letters by 1/1000 em increments, it still doesn't look right to me. My company uses "Univers Light" as its *official* font, and I hate it! I just feel as if some of the letters have awkward spacing/are disproportionate. Anyway, I'm really stuck on the "PLAY" part of this headline. Can anyone help/does anyone have any suggestions?</p>
    <p>Thank you so much for any feedback!</p>
