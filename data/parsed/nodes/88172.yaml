    html: |-
      <p>Getting back to what Joshua said: To my eye "LA" is too loose. That is the most (naturally) gaping hole that you need to control (and that will, in turn, help define the other spaces). Try not to look at linear distance of letters to each other, but rather the space (size of white area) in between.<br>
      Also, the wordspace is maybe a little too narrow compared to the inter-letter space.</p>
      <p>Oh, and max width for inline images is something around 590px. I've used 590 successfully.</p>
