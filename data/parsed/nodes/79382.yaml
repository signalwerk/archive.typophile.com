      <p>And this is why upper-case letters are usually set much, much more widely spaced. ;) Any solution for /RA/ and /KA/ is going to be an unfortunate one.</p>
      <p>Here's my shot, in Berling but close enough:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nebraskan_5671.png"></div><p></p>
      <p>I've tightened up the D and Y in DAILY, meaning it's probably a bit tighter-spaced overall than NEBRASKAN but I think that might be needed.</p>
