      <p>It is for this very reason that nameplate’s should ideally be hand-lettered/-crafted, not off-the-shelf type kerned to within an inch of its life. </p>
      <p>In this example, especially, the RA and KA combinations require custom treatments.</p>
      <p>Steve — your exercise is passable. The RA in particular still needs considerable attention, but suffers from the limits of the particular leg in that face.</p>
      <p>BTW, the base type in the original looks like Stempel Garamond to me.</p>
