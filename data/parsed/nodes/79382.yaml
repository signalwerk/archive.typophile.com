    <p>I was on campus yesterday and picked up a copy of the Daily Nebraskan. The kerning on the name was so bad I felt queazy. </p>
    <p>Went home and took a shot at improving it.</p>
    <p>Don't know the Garamond they used exactly, but came close with AGaramond Titling.</p>
    <p>It is admittedly tricky to kern with capital A's in the word. </p>
    <p>Am I close?</p>
    <p>Someone else like to take a shot? Feel free.</p>
