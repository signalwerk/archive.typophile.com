    html: |-
      <p>We know that logo designer's distort fonts for effect. Otherwise how can they claim to have done any work worth paying for. The closest I can find to the logo, with its boxy S and R  is Binder-Style and as far as I can see from checking Nick's digital version against an old specimen it is indeed a true revival.<br>
      Anyway, I didn't claim that it is a 100% match, I merely said to "try" the font. Sans fonts are ultra easy to churn out and there could well be a descendant of the Binder design that is a 100% match, either as an in-house font by Cover Girl or as a font generally available.<br>
      Don</p>
