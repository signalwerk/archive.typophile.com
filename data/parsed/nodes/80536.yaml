    html: |-
      <p>There is no aligment tool to achieve this in Illustrator. The <em>Snap to object</em> available in CorelDraw is an old lacking feature in IL. And more I work with FontLab, less I like Illustrator.</p>
      <p>But these techniques can help:</p>
      <p><strong>1.</strong><br>
      Simply use Outline view (Ctrl+Y), increase the zoom and do manual alignment. Although manual, it is absolutely precise when you work at maximum zoom. This would be my first choice.</p>
      <p><strong>2.</strong><br>
      If you know where you want each ellipse to touch the other, you can use <em>Snap to point</em>.</p>
      <p>Enable this option under View menu. With pen tool, create nodes where you want ellipses to be aligned. Drag and drop one ellipse to another positioning you mouse over the created nodes. When close enough, ellipses will snap.</p>
      <p>You can let this a bit easier increasing the Snap to point option in Preferences &gt; Selection and set Snap to point to 8 (the max value).</p>
      <p>This procedure may be not the more quick to your need, but to handle it can be useful in a number of situations.</p>
