    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Example_6241.jpg"></div><p></p>
    <p>Very broadly, I'm having a bit of difficulty attempting to align elliptical shapes to each-other in specific ways. </p>
    <p>If you look at the attached image (a simple hypothetical example), all I'm trying to do is position the darker blue circles within the larger lighter blue circle such that the intersecting edges of each ellipse align *absolutely and exactly* on top of each-other. </p>
    <p>The intersections I am talking about are highlighted via the red ellipses. </p>
    <p>I cannot for the life of me finagle Illustrator to accomplish this deceptively complex task and I've just resorted to approximation.</p>
    <p>Anyone have any idea? It would be a huge help as I've spent hours tonight trying to figure out how to reliably do this. :(</p>
