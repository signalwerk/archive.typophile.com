    html: <p>Corey - There's definitely room for more cute typefaces. <br> <br>In the world of toys/cartoons, there's way too much Fontesque <br>and Countryhouse going on. Both are solid display faces <br>but get overused in these areas. <br> <br>Can you show this a little bit bolder?  <br> <br>The only thing I could suggest is opening the curlicues (sp.) <br>on the Q, 2 and 3 a bit more. <br> <br>If you want to go more cute, more curlicues. <br> <br>bj <br> <br></p>
