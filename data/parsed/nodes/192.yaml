    html: <p>The idea of a softened typewriter face is interesting. I would study Goudy's faces, including Goudy sans, as he was the master of the softer look without getting overly cute.  <br> <br>I think the stem of the m, n should rise higher, and the i j be taller. They looked squashed below the x height. </p>
