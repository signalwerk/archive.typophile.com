  html: |-
    <p>This is a typewriter inspired typeface I have been working on when things are slow at work. I would appreciate any advice on how to tighten the whole thing up. I realize that the kerning is abysmal, I think I should get the characters working first though. <br> <br>What I'm trying to accomplish is a typeface that is instantly recognizable as a typewriter font, but at the same time is 'cute'. I don't know why I'm compelled to do this, but lately I've been obsessed with typewriter typefaces. <br> <br>I feel the uppercase T and Z are pretty weak, but am uncertain how to tie them in better while still retaining a little cuteness (or maybe this is the problem - they shouldn't be cute). <br> <br></p>
