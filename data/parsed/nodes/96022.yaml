    <p>The September edition of the Metal Type newsletter is now out.</p>
    <p>Plenty to tell you about, as usual, plus a look at some items that arrived in the post.</p>
    <p>This month's "extra footage" is of the Bradford Jowett van, a British van (from Yorkshire) that was produced between 1946 and 1953. Find out what "extras" an additional £38 for the Deluxe version would have bought you in those days!</p>
    <p>Click here to take a look at this month’s video:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=17" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=17">http://www.metaltype.co.uk/rail/clicks/click.php?id=17</a></p>
    <p>Some of you may know that I've been working on an ebook called "Printers' Tales" that I'm hoping to make available on the Amazon Kindle in the very near future. The idea is to give some of the stories from the website a more permanent home, and, hopefully, take them to a wider audience.</p>
    <p>Click the link below to see a list of contributors to the ebook. All authors have given their permission for their articles to appear on the Metal Type website, please let me know if you don't want your article/s to appear in the ebook. Contributors will, of course, receive a free copy of the ebook:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=12" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=12">http://www.metaltype.co.uk/rail/clicks/click.php?id=12</a></p>
    <p>I'm also looking for help in choosing a cover for the ebook. I've posted several candidates and you can vote for your favourite (there is no need to register, etc.). Bear in mind that they need to look good, both as a small thumbnail, and full-size. Click the link below to vote:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=18" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=18">http://www.metaltype.co.uk/rail/clicks/click.php?id=18</a></p>
    <p>Still not getting the monthly HTML Metal Type newsletter? Subscribe now: <a href="http://j.mp/n3wkjc" title="http://j.mp/n3wkjc">http://j.mp/n3wkjc</a> - you can take a look at some previous issues on that page.</p>
    <p>All the Best</p>
    <p>Dave Hughes</p>
    <p>York, UK</p>
