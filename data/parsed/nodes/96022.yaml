    html: |-
      <p>David,</p>
      <p>Thanks for your efforts to preserve the pre-digital heritage of type. Have you considered special promotional pricing for the academic market? Scholarly works like this would make a great adjunct to the academic distribution package I am currently developing for my new iLUVfonts line, which would encourage students to develop specimen sheets for various typefaces, as "payment" for cheap access to the entire type library. PDFs of some great old specimen books are already available on the internet, and I have a limited number of the "real things" to add to a lending library.—although my humble collection can't come near Stephen Saxe's.</p>
      <p>However, I must be quite frank about the proposed cover designs: none of them sings to me. Personally, I would prefer a clever visual take on the concept of "twenty-six lead soldiers"…</p>
