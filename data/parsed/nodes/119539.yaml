      <p>Hi James,<br>
      some of your characters are rounded, some are made up of straight lines with sharp corners; some are skewed, some not.  The proportions and line widths of the characters also do not match.  You should stick to a common style for your letters.<br>
      My advice is to first draw simple letter forms as a beginner before you try to design a typeface with a lot of idiosyncrasies.</p>
