    <p>Hello my name is James leahy and this is one of my first fonts.  I am trying to take inspiration for the Russian style of serif type with its sharp corners but I wanted to bring this in the san serif style and soften it up a bit in order not to look so harsh.  The typeface is unnamed and I haven't started working on the spacing yet but I would really like to hear if there is anything wrong with the design or opinions about the design and style.</p>
