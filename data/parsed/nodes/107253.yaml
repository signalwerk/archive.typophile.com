      <p>Interesting, but I can't place it offhand.<br>
      The upper case _S_and lower case _s_ are unusual enough to be earmarks.<br>
      UC _S_ digital fonts include Walbaum [1800].<br>
      LC _s_ digital fonts include ITC Clearface [ATF 1907], Cheltenham [1896-1904], Academy [based on Sorbonna, H. Berthold, Berlin, 1905], Gloucester Old Style [based on a design created in 1896 by Bertram G. Goodhue], Filosofia [recent], and Patchouli Display [recent].<br>
      Don</p>
