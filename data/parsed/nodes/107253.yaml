  html: |-
    <p>Saw this poster at the <a class="freelinking external" href="http://www.dansmuseet.se/en/" rel="nofollow">Rolf de Maré Dance Museum</a> today, and I quite dig the large display serif type in the headline, that is in "Ballets Suèdois". (Not sure about the era classification on this one, the combo of chunky top serifs and variable stress is confusing. None of the more common transitionals, at least, unless it's an unusual cut of one of them.)</p>
    <p>Does anyone have an idea what it could be? Digitised, I assume not? Anything close?</p>
