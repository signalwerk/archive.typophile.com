    <p>This is the very first design for a business card for my friend who wants to start her own PR thing. I don't have other designs yet but I hope to develop different directions soon. There weren't very many specs to go from. She is elegant, likes pink and has a certain sophistication about her that I wanted to deliver through the design. I created the "flourish" out of an F and by adding to its curves. The little "*" is for the shine in the tagline. If just this design is too insufficient to critique, let me know. </p>
    <p>I am also attaching my intention for the logo even though we never actually talked about creating one. She mostly wants a little BC for self promotion and I may not be the one doing the website.</p>
