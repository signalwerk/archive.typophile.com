    html: |-
      <p>Somehow this feels a little too "in the moment" for a PR firm. From what I know about PR (admittedly not much), trust and stability might be as important to some clients as "making a splash" is for others. </p>
      <p>I'd increase the font size for contact info, put a physical address on the card, and balance your white space so it all feels grounded on the paper. </p>
      <p>For a new business, I would even go so far as to list 2 or 3 of their key services on one side (this is especially helpful the morning after a party, when the recipient is sorting through 50 cards and trying to place names to faces). </p>
      <p>I also worry that the light green and fuchsia might not have enough contrast for a logo with such thin lines. </p>
      <p>As for the identity, the script of the logo and the italic of the name feel like they are coming from two aesthetic sensibilities which are just different enough to be disconcerting. Look at the details of the italic (ball terminals, strong contrast between vertical vs. horizontal strokes) and the script (more gradual changes in stroke width, no ball terminals, based on calligraphy). </p>
      <p>I would think again about how you can convey elegance and sophistication. It doesn't necessarily mean scripty fonts. You have other variables to speak with, including spacing, color choice, paper choice, etc. </p>
      <p>hope that helps.</p>
