    <p>Hello,</p>
    <p>I have been working on a display font based on the inscriptions I've seen on the catacombs of a church here in Porto Portugal, the "Igreja de São Francisco". These are painted grave inscriptions. In was interested in them because, even though they are clearly based on victorian leters, I think they may have something of portuguese (like the "A" or the "R"), or at least a unic interpretation of, may be, british influences which can be seen, for instance, in older stores, in Porto. I would like ask for your opinions on this. What do you think about these letters? Can you relate these forms to other alphabeths from the early 20th century?</p>
    <p>Thanks in advanced:)</p>
    <p>Here is a pdf file:</p>
