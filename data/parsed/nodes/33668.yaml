    html: |-
      <p>Wow, these are both awesome!  </p>
      <p>Catacumba One: I really like the swooping horizontal stroke-serifs of the T, E, L, Z, etc.  And does Portuguese really use MB, MP, TE, HE, TU, TT ligatures? Wild.  The only thing I don't like is the foot of the R -- it seems like an accident.  I want it to go more horizontal at the end, or go from narrow to wide, maybe like the diagonal in the 4.  </p>
      <p>Catacumba Two:  I think the E and F are too narrow, and the H is too wide -- it looks like it's two letters stuck together.  The  tail on the R is great -- looks like a dangerous fishook.  The tail on the 6 and the 9 don't match the rest of the font -- they are too geometric. Maybe make the two forked ends go in separate directions, or use a tail like that on the R.  And the serifs on the 2, 3, and 7 should look like the serifs on the T. </p>
      <p>Oh, and I want to see what a lowercase would look like.</p>
      <p>Overall, this looks really great!</p>
