      <p>Sorry Matt but the ligatures were my idea, to make the font more fun to use. The original grave inscriptions doens't have any ligatures (I think) although I have seen ligatures in stone inscriptions.<br>
      I know the foot of the R is very strange, it's a litle uncomfortable perhaps, but it caught my eye since the first time I saw it, I don't know where it came from. Thanks for your comments they will be very helpfull.<br>
      About the font's width, I suppose I'll have to something about it, because my idea was to make two mixable fonts, and the uniforming the widths woud help.</p>
