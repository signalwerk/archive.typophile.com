    <p>Hi Everyone. I hope you can help me with this.</p>
    <p>The font I am trying to ID is a relatively contemporary, square faced sans-serif.<br>
    I am not sure that the “A” in this sample is accurate to the font; because of the way this has been used on a movie prop it is possible they “tweaked” the A to better match the source image.</p>
    <p></p><div class="imageWrap"><img src="/files/USPS_4881.gif"></div><p></p>
    <p>This is a blown up sample of the original. The rounding on the corners might be a result of my blowing the fuzzy image up and sharpening it.</p>
    <p>This is driving me nuts. I am sure I have seen this font before. I’m pretty sure I used it as a dry transfer lettering in the 1980’s. It is also making me think of Star Trek.</p>
    <p>Can anybody help?</p>
