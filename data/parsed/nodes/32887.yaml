      <p>I wasn't actually looking for anything too similar to Franklin. So I surprised myself when I realised that it was the first thing I stumbled upon - embarrasingly not recognising the cut. Maybe unconsciously I am not yet ready to give up on Franklin, it has served me well.</p>
