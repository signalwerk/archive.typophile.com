      <p>Hi,<br>
      It could be. I didn't see that, and I'm supposed to be looking for a font to <em>replace</em> Franklin Gothic... This is why this site humbles me.</p>
      <p>But, the example is from Bon Magazine, so the problem is I wouldn't expect them to squoosh fonts, unless it's a custom made squooshing they've ordered. Here are also a few more examples where I think at least 'j', 'c' and 'y' are different to Franklin? </p>
