      <p>Hi Georg</p>
      <p>Thanks for your comments. The image is from the Berlin art magazine G, edited by El Lissitzy, Werner Graeff and Hans Richter in the early 1920s. The typeface is a little bit like Italia in structure, but different in many details.</p>
      <p>Richard</p>
