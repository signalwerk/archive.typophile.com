    html: |-
      <p>Good evening,<br>
      or whatever time it is when you read my comment...</p>
      <p>The problem is:<br>
      two dozend of Antiqua were built between, lets say,<br>
      1900 up to 1920. All called with a name part like<br>
      "Roman" (Römische or Romanische). They all look<br>
      a little bit the same way.</p>
      <p>This one shows some typical signs like the lower<br>
      case "e" or the upper case "A", not to forget the<br>
      special "R" rounding (this is typical for those<br>
      Romans.</p>
      <p>The best source "Seemann - Handbuch für Schriften"<br>
      is not senseful to use because they used the word<br>
      "Hamburg" or "Hamburger". But not in this case,<br>
      I checked it.</p>
      <p>Its a typography book, mh?<br>
      It tells something about form and spirit (Ausdruck).<br>
      Can you tell me in which year the book was printed?<br>
      Or the title and author? That makes it easier to find<br>
      it. Is it printed in Leipzig e.g.? So it could be a<br>
      Schriftguss or Schelter &amp; Giesecke type. </p>
      <p>You see... I'ld like to help, but I'ld need your support.</p>
      <p>Regards,</p>
      <p>Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
