  html: |-
    <p>In the 'Special Interest Groups' we have now:<br>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-&nbsp;&nbsp;Arabic Typography &amp; Type Design<br>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-&nbsp;&nbsp;Hebrew Typography &amp; Type Design</p>
    <p>I suggest to create a similar group:<br>
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-&nbsp;&nbsp;Cyrillic Typography &amp; Type Design</p>
    <p><img src="http://indians.ru/design/p0043-font-cinzel-cyrillic-glyphs.png" alt="Cyrillic Typography &amp; Type Design"></p>
    <p>Because the Cyrillic type design is an area that is interesting enough for everybody here with its rich history and its boom in nowadays. And the Russian type designers need a suitable place to join their efforts.</p>
    <p>Also a non-Cyrillic authors can post here their requests to add a Cyrillic glyphs to their typefaces.</p>
    <p>What do you think?</p>
