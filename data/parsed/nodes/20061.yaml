    html: |-
      <p>Tim, actually redge was leading off from my suggestion to use guillemets in English and pointing out that the modern convention on the French side is to use more than thin spaces (between them and the quoted material). I based my suggestion of thin spaces on what I've seen in older books (see below), but I stand corrected on modern usage. (It's a good thing I only make fonts, and rarely actually  <cite>use</cite> them. :-)</p>
      <p>The thing is though, if you've decided to go against English convention in such a big way in the first place by using guillemets, I think you can safely ignore the <cite>spacing</cite> conventions of the language you're borrowing the symbols from!</p>
      <p>BTW, as is quite often the case, a <cite>hybrid</cite> solution I feel can really click. Check out this setting from the Imprimerie Nationale's "Origines de l’imprimerie en France" (A Christian) of 1901:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/IN1901_53_6327.gif"></div><p></p>
      <p>Simply wonderful, and something that could serve for both English and French, especially in a publication featuring both. Also note the spaces around the... "quotemets". :-)  Although the setting is justified, it seems they're not full spaces on the "insides". Why the discrepancy between that sample and modern practice? I have to think it's <cite>quality</cite>: the IN was the height of it, while the last 50 years was... not. I'd suggest that in the modern era the need to have <cite>some</cite> space on the inside coupled with the general unavailability of thinner spaces is what led to full spaces. A little bit like how many people -incorrectly- drop the accents from French caps.</p>
      <p>hhp</p>
