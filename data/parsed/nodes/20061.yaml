    <p>Ok, here it is. Any quick replies would be greatly appreciated: </p>
    <p>The title of a poem/article normally appears in quotation marks, not italicized like a book title, and words in a foreign language within an English text are set in italics. </p>
    <p>I have an English text which mentions a poem with a French title. Should it be both italicized and in quotes, or do I leave off the italics?</p>
    <p>It seems simple (I think it should be in both italics and quotes), but I am unsure all of a sudden.</p>
    <p>Thanks, </p>
    <p>Kristina</p>
