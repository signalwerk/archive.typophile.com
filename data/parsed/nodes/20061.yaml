    html: |-
      <p>&gt; a guillemet was already alien enough to them without adding extra spacing</p>
      <p>Ah, I get it - makes sense.</p>
      <p>&gt; do you think [quotemets] are intended as a Didone development of the guillemet?</p>
      <p>I don't think so, since other Didone fonts don't have them.<br>
      In fact I'd say that something with a ball-and-curl is less<br>
      Didone than a chevron shape. BTW, I actually prefer to<br>
      see "fake" (straight) quotes used with Bodoni et alia.</p>
      <p>&gt; what’s with the extra stroke on the l’s and g’s?</p>
      <p>The one on the "el" is famous. It came about with the RdR,<br>
      reputedly in order to help maintain the copyright given to<br>
      that design by the roi. But looking at what the "el" would<br>
      have looked at without it, I have to think there's a much<br>
      more pragmatic reason: clear differentiation with the "I"<br>
      and the numeral 1.* In any case, it was taken up in some<br>
      later Didone designs of the IN, sometimes being flipped to<br>
      the other side (by Luce, I think).</p>
      <p>* Here's a scan from my hand-set Balzac printed at the IN:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CharlesX_6220.gif"></div><p></p>
      <p>-</p>
      <p>The one on the "g", in fact that "g" as a whole,<br>
      seems to have been an affectation: merely a way<br>
      for one of the Didot brothers to differentiate<br>
      himself from the others, as far as I understand.<br>
      One of Porchez's Didot fonts revives it nicely.</p>
      <p>hhp</p>
