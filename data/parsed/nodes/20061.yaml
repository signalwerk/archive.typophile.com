      <p>I have always enjoyed seeing translations of expressions from different languages. In the native language, it makes perfect ordinary sense to anyone but translated, it brings laughter. A perfect example might be the American expresion "It is raining cats and dogs" which means it is raining quite hard. I imagine translated to Finnish, this sounds quite silly.<br>
      Typeface is not quite as silly but is understood by English speakers without a pause. There is a Greek expression (ou na hchatheis) which translates to "If you would lose yourself" and sounds odd to Americans.  The meaning is more like "get lost!" or even "Go to hell!" but it rolls off the tongue with a much more nasty sound than that in Greek.:-)</p>
      <p>I actually like the idea that my use of "Typeface" makes you laugh since I often say things in silly ways :-) </p>
      <p>ChrisL</p>
