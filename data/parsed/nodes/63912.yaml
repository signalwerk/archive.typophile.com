    html: |-
      <p>It's 11.36 of the Chicago Manual of Style, though they prefer long quotations to be set as indented block quotes. Opening quotation mark shouldn't be imposed at the beginning of each sentence, but the beginning of each paragraph. The closed quotation mark is on the final paragraph only. Thus speaks the CMoS. </p>
      <p>They taught us the same lesson in seventh grade.</p>
