    <p>"What's the point? Why do I keep seeing paragraphs in magazines like this?</p>
    <p>"It's as if they want to remind us at the beginning of every sentence.</p>
    <p>"Say the entire article is pulled from a book..</p>
    <p>"Doesn't this just become redundant and way, way too repetitive?</p>
    <p>"How come the end of the sentence is ignored?</p>
    <p>"Because then they would have to quote/unquote every single paragraph?</p>
    <p>.<br>
    .<br>
    .</p>
    <p>"Why not at the very beginning?</p>
    <p>Followed by the very end?"</p>
