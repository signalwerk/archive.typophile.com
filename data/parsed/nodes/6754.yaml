  - id: 47159
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I don't think that specifying a logarithmic scale will make it OK, for two reasons. <br> <br>1. This is a graphic. Specifying a log scale would make it honest, but the instinctive reaction to the scale would still be wrong. As a graphic it would not be doing its job. <br> <br>2. The perspective would have to be reversed. As it stands, the impression given by the perspective (earth small and distant, moon large and near, plus the circular scale bands) is that 1cm of "graphic" movement near the torch is *more* "on the ground" than 1cm of graphic movement near the moon, but the log scale would have to be quite the reverse for this to work. <br> <br>Perhaps with an explicitly log scale and a reversal of the perspective (so we viewed it from the earth/torch end) the impression might be better. But I doubt it can be made quite right.</p>
