    html: <p>&lt;font class="dontLookLikeCrap"&gt;It's neat, but the graphic seems to me to be misleading. The impression the graphic gives is that a bullet travels at roughly 1/3 of the speed of light, a plane at around 1/4 and a car at around 1/10. <br> <br>This is nonsense. Taking your figures, a bullet actually travels at around 1/25,000 of the speed of light. <br> <br>Or, put differently, your chart makes it look like after one second a bullet fired from a handgun would be nearly halfway to the moon, and a car would be an appreciable way there. But depending on the date it would take (by my rough calculation) around 34,000 seconds (around 9 hours) for an object going at a constant 25,000 mph to make it to the moon. So after a second a bullet is not 1/3 of the way there, it's about 1/34,000 of the way there. It's the equivalent for a bullet to 1 second on the journey from London to New York is for a person. And as for the car ... <br> <br>I doubt you can produce any sort of chart which will meaningfully compare something travelling at around 7 miles per second with something travelling at around 180,000 miles per second. <br> <br>I don't think that the perspective scale makes it OK. The size of the markers for planes and so forth don't respect the scale (your car is about 100 times the size of earth). And if anything it has the opposite effect, because it makes it look like the objects at the torch end have actually gone further than a regular scale would suggest they had, in other words the perspective is going in the wrong direction for these purposes.&lt;/font&gt;</p>
    html_clean: <p>&lt;font class="dontLookLikeCrap"&gt;It's neat, but the graphic seems to me to be misleading. The impression the graphic gives is that a bullet travels at roughly 1/3 of the speed of light, a plane at around 1/4 and a car at around 1/10. <br> <br>This is nonsense. Taking your figures, a bullet actually travels at around 1/25,000 of the speed of light. <br> <br>Or, put differently, your chart makes it look like after one second a bullet fired from a handgun would be nearly halfway to the moon, and a car would be an appreciable way there. But depending on the date it would take (by my rough calculation) around 34,000 seconds (around 9 hours) for an object going at a constant 25,000 mph to make it to the moon. So after a second a bullet is not 1/3 of the way there, it's about 1/34,000 of the way there. It's the equivalent for a bullet to 1 second on the journey from London to New York is for a person. And as for the car ... <br> <br>I doubt you can produce any sort of chart which will meaningfully compare something travelling at around 7 miles per second with something travelling at around 180,000 miles per second. <br> <br>I don't think that the perspective scale makes it OK. The size of the markers for planes and so forth don't respect the scale (your car is about 100 times the size of earth). And if anything it has the opposite effect, because it makes it look like the objects at the torch end have actually gone further than a regular scale would suggest they had, in other words the perspective is going in the wrong direction for these purposes.&lt;/font&gt;</p>
