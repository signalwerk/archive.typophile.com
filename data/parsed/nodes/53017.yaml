    date_raw: 2 Jan 2009 — 2:03pm
    votes: null
    html: "<p>Tools / Transform Range, Transformation Range: Fonts in the Fonts List, ..., +, add the fonts you want to convert, Destination format: choose the destination format, Destination folder: choose the destination folder, OK, Run.</p>"
