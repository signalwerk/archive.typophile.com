    html: <p>The grid is sifting depending on the pt (PPEM) size. The grid is the pixels &amp; where they can be on or off at a given point size. See how they shift when you are in hint mode &amp; you pick different point sizes? If you want, you can pick a give pt size (8 maybe) and fit your outlines to the pixels available at that size. After that you have to compromise at all other sizes. The alternatives are to simply fit the pixels to your design as best you can ( an outline centric approach) or pick a middle path. Pick two sizes say 12 &amp; 11 ( or whatever ) and make the outlines a compromise that works pretty well ( but not exactly) for both. Does that make sense to you?</p>
    html_clean: <p>The grid is sifting depending on the pt (PPEM) size. The grid is the pixels &amp; where they can be on or off at a given point size. See how they shift when you are in hint mode &amp; you pick different point sizes? If you want, you can pick a give pt size (8 maybe) and fit your outlines to the pixels available at that size. After that you have to compromise at all other sizes. The alternatives are to simply fit the pixels to your design as best you can ( an outline centric approach) or pick a middle path. Pick two sizes say 12 &amp; 11 ( or whatever ) and make the outlines a compromise that works pretty well ( but not exactly) for both. Does that make sense to you?</p>
