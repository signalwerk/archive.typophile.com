      <p>Based on what you have written I think the answer is no. The grid of pixels at 12pt ( or any size) is fixed. You can either change your shape to match or accept the alteration. You can Hint a font too; but in bitmaps ( not anti-aliased rendering - that's a whole other thing ) a pixel is either on or off. A hint will be to turn that pixel on or off at a size in particular.</p>
      <p>Ah I see I have an email from you!</p>
