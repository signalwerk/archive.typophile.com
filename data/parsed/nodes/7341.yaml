    html: <p>I think Ignacio was right, David -- I can't spot any differences in the underlying letterforms between the sample and Aggie (the R looks identical to me, and look at that distinctive lowercase f, which is also identical). It looks to me like someone took Aggie and added a stroke or used Fontographer to make a faux-bold. The 'i', 'j' and 's' especially bear the scars of indiscriminate stroke-widening.</p>
