    <p>Hi all ---  I'm an artist who is very new to the world of fonts.  </p>
    <p>There is a font I've come across several times recently that was used in the 1980's and I need to replicate it.  Can anyone lead me to a similar font?</p>
    <p>I'm attaching a picture from the cover of the movie "Exposed"....  it's the pink lettering.</p>
    <p>Thanks VERY much in advance for any leads.</p>
    <p>Best,<br>
    Ryan</p>
