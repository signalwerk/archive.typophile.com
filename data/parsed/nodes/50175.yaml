    html: |-
      <p>I can't think of any script fonts with such long connectors between the letters. You might be able to adapt Letraset's <a class="freelinking external" href="http://www.myfonts.com/fonts/letraset/rapier/" rel="nofollow">Rapier</a> which is a late '80s design.</p>
      <p>Also look through all these scripts by:<br>
      <a class="freelinking external" href="http://www.myfonts.com/person/leuschke/rob/" rel="nofollow">Rob Leuschke</a>,<br>
      <a class="freelinking external" href="http://www.myfonts.com/person/borges-de-oliveira/charles/" rel="nofollow">Charles Borges de Oliveira</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/foundry/sudtipos/" rel="nofollow">Sudtipos</a></p>
      <p>Your example looks as if it was done in some kind of crayon or pastel. If you want this exact look it will be even harder to match with a digital font. You might be better off getting a few different script fonts and use them as a starting point to draw your own lettering.</p>
