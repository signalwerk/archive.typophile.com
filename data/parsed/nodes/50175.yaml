      <p>In the 1980s there was apparently a device called a "brush", and with a substance called "ink" or "paint" one could make lettering like this. I've never used one myself, and I still don't understand how these "brushes" even interfaced with a computer, since they don't seem to have any wires, and wireless technology wasn't really that big back then.</p>
      <p> - Lex</p>
