    <p>From <a href="http://www.facebook.com/photo.php?pid=4214401&amp;id=6884261622" rel="nofollow">a FontShop Facebook photo</a>, the FontShop profile asks the following question:</p>
    <p>"<em>Quick Poll: Facebook has introduced a way to include their "Like" buttons on other websites. Should we add them to FontShop.com pages so you can show your love for your favorite typefaces?</em>"</p>
    <p>I say no for the following reasons:</p>
    <p>1. It will create another piece of information to process, digest, enter &amp;c. when looking for fonts.</p>
    <p>2. People will find a way to game the system to put more "likes" on fonts.</p>
    <p>3. It will perpetuate the success of already successful typefaces and put newcomers at a disadvantage.</p>
    <p>4. "Like" is so subjective that it's useless information. Typefaces should be selected based upon fitness for purpose, not weather you, or anyone else "like's" them.</p>
    <p>IF implemented, users should be required to provide a valid reason. This reason will then need to be moderated and accepted (= hours of work) because people will simply say "just because." Just because McDonalds sells a lot of hamburgers doesn't make them "good."</p>
    <p>Cast your vote by becoming a fan of the FontShop profile and then commenting on the question.</p>
