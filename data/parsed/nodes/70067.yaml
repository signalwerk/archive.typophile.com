      <p>nick said:<br>
      &gt;   This is so grade school, all about who is the most popular girl in class.</p>
      <p>well, um, no, actually, it isn't.  it isn't nearly that trivial at all.</p>
      <p>it's data-collection, for the purpose of collaborative filtering.</p>
      <p>collaborative filtering is the _ultimate_ "killer app", because<br>
      it solves the ever-growing problem of information overload,<br>
      pulling your personal needles out of the content haystack,<br>
      as quickly and efficiently as a super-turbo-charged magnet.</p>
      <p>the big question is whether we want this "killer" functionality<br>
      tied up by a private company looking for a revenue-stream,<br>
      especially one which values neither our privacy nor our data,<br>
      and has been slippy-slidey when it comes to telling us that...</p>
      <p>i say no.  emphatically.</p>
      <p>this technology needs to be owned collectively, by all of us.</p>
      <p>-bowerbird</p>
