  html: |-
    <p>I am setting up a table of contents that will have middots connecting items and page numbers (with apologies to Bringhurst); I’m wondering if there is some method I am not aware of that would allow me to have all of the dots set with perfectly consistent spacing, rather than doing it by hand (which yields imperfect results in addition to being intensely laborious). To further complicate matters, there will be, in some cases, a third column inserted into the center of the middots, which makes doing it by hand nearly impossible to do without creating a bunch of separate text boxes. Any ideas?</p>
