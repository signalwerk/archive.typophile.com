  html: |-
    <p>Hello all,<br>
    I'm looking for this font for use in my publications.</p>
    <p>This font is used in many books published by دار الأضواء - بيروت (Dar-al-Adwaa - Beirut). It comes with Bold variant, as seen in the sample.<br>
    The sample I had attached is from a book named Tawil-al-Daim.</p>
    <p>Please help in identifying this font for me.</p>
    <p>Thanks and regards.</p>
    <p>Moiz.</p>
