  html: |-
    <p>Could anybody tell me what are the specific names given to parts of a character, if indeed they are named, e.g. the descender of a “g”, the horizontal cross through an “f”, etc.<br>
    Are there different types of curve, lean or point/apex and is the dot of an “i” just a dot?<br>
    “Serif” is about all I know!<br>
    Thanks, Syd</p>
