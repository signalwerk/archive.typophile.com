  html: |-
    <p>Using Fontlab 5.0.4 and adding an onum feature to a font that's generated as OTF.</p>
    <p>I've added just the onum feature but InDesign CS6 has activated both the "Proportional Oldtyle" menu as well as the "Tabular Oldstyle" menu.</p>
    <p>Is that something InD just does or is there something I've done wrong?</p>
    <p>Feature is pretty simple, I've created an onum1 and onum2 class, the feature is simply:<br><code><br>
    feature onum {<br>
     # Latin (default)<br>
      	sub @onum1 by @onum2;<br>
    	script grek;<br>
      	sub @onum1 by @onum2;<br>
    } onum;<br></code></p>
    <p>Thanks for reading,<br>
    Ken</p>
