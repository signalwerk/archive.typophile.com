  html: |-
    <p>I'm a wanna-be type designer living vicariously through the typophile forums.</p>
    <p>My 5 year old is having a birthday soon and has been talking about starting a rock band called Black Eagle. I have no idea where he came up with this, but, being a dad, and a graphic designer, I obviously had to take the opportunity to make some T-shirts for him.</p>
    <p>This is the logo I came up with.</p>
    <p>I was originally trying to come up with some funky blackletter, which I failed at, but accidentally ended up with this somewhat funky type solution. Thoughts? It's cheesy in a Spinal-Tap way, hopefully. Worth making it into a font?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blackeagle_3695.gif"></div><p></p>
