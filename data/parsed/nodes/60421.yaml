    html: |-
      <p>Bert - The Organon is the name given by Aristotle’s followers, the Peripatetics to the standard collection of his six works on logic. A fair amount of logic coupled with creativity goes into the creation of a typeface. And of course those six works of logic by Aristotle are essential reading - they’re on my bedside table right now.</p>
      <p>But really I got the name from the first line of “Cloudbusting” by Kate Bush. Though naming a typeface after a machine that makes rain is not such a good idea - that's the last thing we need here in the UK, we've had more than enough already (again).</p>
      <p>Michael - Thanks a lot, and congratulations to you too for Peanut.</p>
      <p>Jan, I'm glad you said that as it means the fonts look anonymous enough for text setting, but the subtleties of the designs reveal themselves when used for display.</p>
      <p>Rahim - no italics yet, maybe after I've done converting some of my older stuff to OT.</p>
      <p>BTW - I mentioned the Sans style sets but neglected to show them in the sample - here's an update:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Osan_5964.gif"></div><p></p>
      <p>Nick Cooke</p>
