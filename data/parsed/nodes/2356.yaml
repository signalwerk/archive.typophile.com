  html: "<p>20 August 2002 <br> <br>CHANK ARMY JAMS OUT A NEW GARAMOND <br>Collaborative Free Font from Designers around the World <br> <br>For the first official font release from ChankArmy.com, all 12 members of the Chank Army chipped in a few letters to create a new Garamond, now available for free at <a href=\"http://www.chankarmy.com\" target=\"_top\">www.chankarmy.com</a>. Martin Fredrikson of Sweden had the idea for the font jam. The font took months to create and became an exercise in self-discipline and collaboration.  <br> <br>\"It forced people who make poster fonts to take a closer look at a traditional text face and recreate it as best they could with their technical abilities,\" explains Chank Diesel of <a href=\"Http://www.chank.com\" target=\"_top\"> www.chank.com</a>, founder of the Chank Army. \"Some of us drew the letters on paper and scanned them in. Others recreated the characters entirely on the computer.\"  <br> <br>The Chank Army Garamond font is chock full of irregularities and quirkiness, but works surprisingly well at smaller sizes, giving the face a weathered-appearance. Letters that are particularly well crafted include David Cushman's Q with an extra fancy swash, David Buck's killer lowercase g, and precise lowercase vowels by Martin Fredrikson.  <br> <br>Although it is a free font, the Chank Army encourages users who download it to make a donation to the Red Cross. \"With the European contingency and their anti-military beliefs, we tried to tone down the aggressive tones of the Army theme and balance that off by making this a donation-ware font,\" says Chank. There is a link to the Red Cross from the download page. The page was designed by Milan Zrnic of Florida.  <br> <br>Diesel started the Chank Army in 1997 to give exposure and encouragement to talented up-and-coming font designers. This is the second Chank Army troop. It is represented by people from U.S., Canada, Sweden, Germany, Denmark, and New Zealand. <br> <br>The Chank Army is: <br>Dan Bailey - USA <br>Ben Balvanz - USA  <br>David Buck - New Zealand <br>Stefan Claudius - Germany <br>Dave Cushman -USA <br>Chank Diesel - USA <br>Jakob Fischer - Denmark <br>Martin Fredrikson -Sweden <br>Jess Latham - USA <br>Michael Piercey - Canada <br>Jason Ramirez -USA <br>Milan Zrnic -USA <br> <br>For more information, visit www.chankarmy.com or call 1-877-GO-CHANK! <br> <br>-END-</p>"
