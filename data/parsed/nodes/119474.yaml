  html: |-
    <p>Good day!</p>
    <p>I am a designer/technical writer at a software company and am having a difficult time determining whether or not we can develop a documents package that includes Myriad Pro. The end user would receive this typeface a part of our software installation process; I just can't seem to figure out how to find accurate information on this subject. Someone at typophile should be able to tell me!:</p>
    <p><strong>What do I need to do to determine--WITH ABSOLUTE CONFIDENCE--the legality of distributing this font?</strong></p>
    <p>Put another way: we are considering incorporating Myriad Pro into an installation that would affect 40,000 (yes, 40k) computers.</p>
    <p>Thanks in advance for your advice!</p>
