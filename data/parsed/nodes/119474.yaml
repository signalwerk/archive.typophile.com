    html: |-
      <p>Thanks to you both. I sent my inquiry to Adobe and received just the information I needed in a response from Typekit staff. This definitely put the kibosh on using Myriad Pro for our development effort, hehe (As it turns out, this would have probably gone on 50k+ systems). Here's the email, in the off chance that it may help someone else!</p>
      <p><strong>"At this time, we don't offer licenses for inclusion in apps. We hope to in the future, but don't have such a program at this time. In the meantime, I recommend that you use the App+ program from FontShop. <a href="http://www.fontshop.com" title="www.fontshop.com">www.fontshop.com</a> They won't be able to offer you Myriad, but they have a nice selection of fonts at reasonable prices."</strong></p>
      <p>Cheers!</p>
