      <p>- - - - - - - - - - - - - - - - - - - - -<br>
    Press Release<br>
    19 January 2006</p>
    <p>- - - - - - - - - - - - - - - - - - - - -<br>
    <strong>BASKERVILLE IN THE CITY</strong></p>
    <p>This year John Baskerville—writing master, letter cutter, printer, typeface designer, and one time resident of Birmingham, UK—will be 300 years old. To celebrate this landmark in the life of Birmingham’s typographic genius, graphic designers, typographers and artists of all kind will be staging a series of creative events across the city in recognition of Baskerville’s spirit of non-conformity and celebration of his pursuit of the experimental. </p>
    <p>At the centre of these activities will be the annual Friends of St Bride Library conference, which will take place at the Custard Factory, Birmingham, 16-18 October 2006. </p>
    <p><strong>‘FAST TYPE, SLOW TYPE’</strong><br>
    ‘Fast type, slow type’ is the 5th in the series of annual Friends of St Bride Library conference and is the first time the event has been held outside London. The original conference was born out of a desire for a UK-based typographic forum that was diverse in content, eclectic in spirit, marginal in its sympathies yet international in appeal. Each year the event has built on these aspirations, attracting a diverse range of speakers and exhibitors prepared to experiment and push the boundaries of design and letterforms. The conference attracts around 200 international delegates including design practitioners, artists, publishers, and advertisers, teachers, researchers and historians and those just starting their careers. </p>
    <p>Applications to participate in the event are now being sought from interested individuals, organisations, institutions and businesses from across the international design, print and creative communities. </p>
    <p>‘Fast type, slow type’ is open to individual interpretation but it may include letter forms made by professionals or amateurs using any method—print, pen, brush, aerosol—in any medium—paper, wood, stone or metal, on screen, in water, in the air, or on the street, and which may include the spoken word. The ‘Fast type, slow type’ conference aims to push the boundaries of typography to the limit and encourages the participation of those who might not consider themselves as typographers but who utilise letterforms in their work. The experimental is actively encouraged.</p>
    <p>If you have a topic that fits the theme, and would like to talk, exhibit or demonstrate, please send an outline proposal and brief biographical note in not more than 500 words to <a href="mailto:info@typevents.com">info@typevents.com</a> by 1 March 2006. </p>
    <p>- - - - - - - - - - - - - - - - - - - - -<br>
    Typevents partners: Beacon Press, UK;  FontWorks, London, UK;  Iconstorm, Germany;  Print Week, UK;  VIP Paper, UK</p>
    <p>Typevents LLP is a UK-based multi-national partnership that provides comprehensive events, marketing and PR consultancy services to the printing, paper, type and graphic design communities.</p>
    <p>- - - - - - - - - - - - - - - - - - - - -<br>
    Info | Typevents LLP</p>
