  html: "<p>A new app was released today that looks like it will prove quite useful - <a href=\"http://www.koingosw.com/products/font_pilot.shtml\">Font Pilot 1.1.8</a> by Josh Hague of <a href=\"http://www.koingosw.com\">Koingo Software</a>. <br> <br>This shareware utility ($11.95 after 30 days) allows you to browse fonts that are not activated on your system, giving you an easy, low-committal way to locate, browse and test fonts on a font CD or font server before activating them in your Font Manager software of choice. <br> <br><img src=\"http://www.typophile.com/forums/messages/72/8790.gif\" alt=\"fontpilot\"> <br> <br>Useful features include the ability to activate a whole folder of fonts, customizable text settings in font (ideal for Font ID!), view a complete character set of the font you are browsing, and the ability to print your text setting in the browsed font. <br> <br>Negative aspects: It didn't recognize nested folders, and the character set window (current a list view) could be better designed to show more letters at a time (ie. grid view) <br> <br>Overall, a promising app! <br> <br>//jared</p>"
  html_clean: "<p>A new app was released today that looks like it will prove quite useful - <a href=\"http://www.koingosw.com/products/font_pilot.shtml\" class=\"link-external\">Font Pilot 1.1.8</a> by Josh Hague of <a href=\"http://www.koingosw.com\" class=\"link-external\">Koingo Software</a>. <br> <br>This shareware utility ($11.95 after 30 days) allows you to browse fonts that are not activated on your system, giving you an easy, low-committal way to locate, browse and test fonts on a font CD or font server before activating them in your Font Manager software of choice. <br> <br><img src=\"http://www.typophile.com/forums/messages/72/8790.gif\" alt=\"fontpilot\"> <br> <br>Useful features include the ability to activate a whole folder of fonts, customizable text settings in font (ideal for Font ID!), view a complete character set of the font you are browsing, and the ability to print your text setting in the browsed font. <br> <br>Negative aspects: It didn't recognize nested folders, and the character set window (current a list view) could be better designed to show more letters at a time (ie. grid view) <br> <br>Overall, a promising app! <br> <br>//jared</p>"
