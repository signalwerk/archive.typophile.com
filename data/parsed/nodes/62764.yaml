  html: |-
    <p>Hello World!</p>
    <p>this blog has started! It meant to be a blog for multilingual writers.<br>
    <a>Tastaturaufkleber</a> is a German word that people use to describe stickers that are used for multilingual tipping.<br>
    It’s all about the smallest efforts for maximal results. I want to share my experience and also see which experience other people already have with that type of a solution.<br>
    I have also started a blog <a href="http://www.aufklebertastatur.de" title="http://www.aufklebertastatur.de">http://www.aufklebertastatur.de</a> to see how people handle this problem of bilingual computer use.<br>
    I’m also wondering if there are any different fonts on keyboard stickers. Does somebody know this?<br>
    I’ll be pleased to read your comments!</p>
