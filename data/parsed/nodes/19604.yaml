    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Alessandro Segalini</strong></p>
    <p>Born in Piacenza, <a href="/wiki/Italy" class="freelinking" rel="nofollow">Italy</a> (<a href="/wiki/1976" class="freelinking" rel="nofollow">1976</a>). He studied design at the Polytechnic of Milan and Visual Communication at the University of Art and Design of Helsinki (2002), earning a MSc degree in Industrial Design from the Polytechnic University of Milan (2004).</p>
    <p>Self-taught in <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphy</a>, he developed font editing skills in Philadelphia (2005), and developed skills as typographic designer, lecturer and pre-press person at studios, ateliers, agencies, institutions and publishing houses in Piacenza, Milan and Rome. He has studied philosophy and history of typography, and has written articles on the subject for the Italian magazines <a href="http://web.archive.org/web/20071219024501/http://www.eurographicus.com/archivio_en.asp?L=2" rel="nofollow">Graphicus</a> and <a href="http://www.aiap.it/progettografico.php" rel="nofollow">Progetto grafico</a>.</p>
    <p>In regards to education, he believes that knowledge is constructed by the learner through action; it is mediate, not immediate. Action initiated by the learner himself is the indispensable ingredient of the act of knowing, and art is with us to give structure to reality.</p>
    <p>In <a href="/wiki/2005" class="freelinking" rel="nofollow">2005</a>, he accepted a position as graphic design instructor at the Department of Graphic Design at Bilkent University (<a href="/wiki/Turkey" class="freelinking" rel="nofollow">Turkey</a>), where he taught graphic design and typography.<br>
    He is member of the editorial board of <a href="http://wally.rit.edu/oajournals/index.php/multi/about/editorialPolicies" rel="nofollow">Multi</a>, the Rochester Institute of Technology journal of diversity &amp; plurality in design, and co-creator of <a href="http://istype.com" rel="nofollow">ISType</a> (Istanbul Type Seminars), a lecture and workshop series devoted to encouraging typographic literacy in Turkey.</p>
    <p>He is currently teaching typographic design and design education at the Faculty of Fine Arts and Design at Izmir University of Economics. Alessandro currently lives in Izmir, Turkey.</p>
    <p><a href="http://new.myfonts.com/fonts/redrooster/hemingway/" rel="nofollow">Hemingway™</a> designed by Alessandro Segalini was inspired by the prize winning novel <em>The Old Man and the Sea</em> by Ernest Miller Hemingway. The typeface has been selected for the UK <em>Creative Review</em> Type Annual 2011 within the Display category.</p>
    <p><a href="http://www.as8.it" title="www.as8.it">www.as8.it</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/firma_5858.gif"></div><p></p>
