  html: |-
    <p>dear friends! it's about my very new type: Seaside, contrast sans-serif.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/seaside_poster00_3687.jpg"></div><p></p>
    <p>it shares proportions and basic shapes with <a class="freelinking external" href="http://use.type.org.ua/tagged/osnova" rel="nofollow">Osnova</a>, so they will plays well together.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/seaside_poster01_6232.png"></div><p></p>
    <p>now it covers only western latin charset, but more features, faces and languages will be added soon, i hope.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/seaside_charset_display_4168.png"></div><p></p>
    <p>please look closer:  <a class="freelinking external" href="http://new.myfonts.com/fonts/andrijtype/seaside/" rel="nofollow">Seaside@myfonts</a></p>
