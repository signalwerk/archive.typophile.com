  html: "<p>Hello, <br> <br>I'm currently tracking down a problem I've had using different versions of Adobe's ITC Franklin Gothic and was wondering if others have had the same problem. <br> <br>The current issue: an outside vendor sent us a job using Franklin Gothic Book which they had purchased from Adobe. Their particular font was created Aug 18, 1995 and modified Feb 5, 1997. <br> <br>Our version of the font purchased from Adobe does not have a book version. It has a screen font named \"Franklin Gothic\", created and modified on Jan. 16, 1997. <br> <br>These different-named versions appear to be the same font.  Anyone know why the naming is inconsistent?  <br> <br>Thanks for your help <br> <br>Kristin</p>"
  html_clean: "<p>Hello, <br> <br>I'm currently tracking down a problem I've had using different versions of Adobe's ITC Franklin Gothic and was wondering if others have had the same problem. <br> <br>The current issue: an outside vendor sent us a job using Franklin Gothic Book which they had purchased from Adobe. Their particular font was created Aug 18, 1995 and modified Feb 5, 1997. <br> <br>Our version of the font purchased from Adobe does not have a book version. It has a screen font named \"Franklin Gothic\", created and modified on Jan. 16, 1997. <br> <br>These different-named versions appear to be the same font.  Anyone know why the naming is inconsistent?  <br> <br>Thanks for your help <br> <br>Kristin</p>"
