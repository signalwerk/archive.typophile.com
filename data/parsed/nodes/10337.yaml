    html: <p>Adobe often updates their faces. <br> <br>If you own an old version it's very likely that it also uses old Unique-ID numbers and may cause conflicts. <br> <br>The best thing is to write Adobe to ask for an update. Even if they possibly ask you some upgrade payment, If you are a registered user they may give you a more recent version for free. <br> <br>A thing to note is that, if they have even slightly changed the metrics value the text may reflow. <br>Check this in your layout or design application in which the job is typeset.</p>
