      <p>Thank you for the answer; this is my question: how characters above 18 units were handled.</p>
      <p>I'm surprised, though, that this was done so... routinely. I would have thought that the characters would have been scaled to fit 18 units (not by changing their general size - a higher set would be used) so as to avoid anything as cumbersome as that. Even several sizes of Caslon Old Face, I've found, had this property.</p>
