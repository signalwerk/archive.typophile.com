    html: |-
      <p>You're very welcome. I learned this working on a Monotype caster this past summer. They also have two different keys for a, e, and o: one set sets the letters with a negative left kern, for using after T, V, etc. A lot to remember. So to type "Wa", you had to type a high space, then W, and then remember to use the alternate "a" key. But yes, it is strange that you need to use a high space so frequently. I think the reason they couldn't just make the character bodies wider is that the lead would take too long to cool and mess up the caster somehow. This is why I was told that you can't type em/em/em/em etc to fill out a blank line. You need to type en/en/en/en because having too many wide characters in a row causes problems as the metal cools.</p>
      <p>Josh</p>
