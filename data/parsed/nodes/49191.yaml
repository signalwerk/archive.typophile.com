    <p>Can anyone help me identifying the typeface in the recent FIAT ads? Here is a sample:</p>
    <p><a class="freelinking external" href="http://typophile.com/files/94ca5d16a4b4e29d401b8c1143ebaa2b.44077.jpeg.jpg" rel="nofollow">http://typophile.com/files/94ca5d16a4b4e29d401b8c1143ebaa2b.44077.jpeg.jpg</a></p>
    <p>It looks similar to a free font called Market Deco:</p>
    <p><a class="freelinking external" href="http://typophile.com/files/Picture2_0.png" rel="nofollow">http://typophile.com/files/Picture2_0.png</a></p>
    <p>Or a modified Neutraface:</p>
    <p><a class="freelinking external" href="http://typophile.com/files/Picture3.png" rel="nofollow">http://typophile.com/files/Picture3.png</a></p>
    <p>Any ideas?</p>
