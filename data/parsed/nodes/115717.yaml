      <p>1st &amp; 3rd row must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Letraset&amp;ffam=Caxton%20Book%20-%20Regular&amp;fid=f86ef782ed50a7a7e8747a636dcc1938&amp;fsize=60&amp;text=Tampereen%20KAUPPA&amp;wrap=2" rel="nofollow">Caxton Book</a></strong> by Leslie Usherwood [1981, Letraset]</p>
      <p>"TUPAKKA" could be a manually emboldened <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=Cloister%20Open%20Face%20-%20Regular&amp;fid=ccd6c879df49da290d67c00531b821b2&amp;fstyle=b&amp;fsize=60&amp;text=TUPAKKA&amp;fit=1" rel="nofollow">Cloister Open Face</a></strong><br>
      (myfonts.com mentions Morris Fuller Benton, Jim Rimmer or Robert Hunter Middleton as the designer of the font, depending on which foundry's version are you looking at)</p>
