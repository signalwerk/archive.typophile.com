    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_5734.png"></div><p></p>
    <p>Hi guys.</p>
    <p>I'm wondering what are those fonts, used in that logo. The store is Cigarette Store in Tampere and every time I walk past that logo, I keep wondering of those fonts. Especially letter "K" in the third row. I'm designer myself and this is really disturbing that I can't identify those fonts. :D</p>
    <p>So, can you help me? I'm looking for both fonts.</p>
    <p>Thank you so much!</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        caxton book, cloister open face        </div>
            </div>
