    html: <p>Yes. This is caused by missing or poor hinting instructions in the font. Since this is going to be used both online and in Microsoft Office, I strongly suggest making use of TrueType outlines and the advanced capabilities of TrueType hinting. There are automated solutions, but if you have a budget for high quality manual TT hinting, feel free to drop me a line.</p>
