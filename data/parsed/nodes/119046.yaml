  html: |-
    <p>We have a font that we created in FontLab Studio 5 and is generated as OTF for use in MS Word and InDesign. The product's web site is getting ready to launch but they're having trouble with the display of the font on the web.</p>
    <p>In the most recent iteration of the site, using the most recent fonts (glyphs were recently added to the font) the font displays different ways at different sizes as shown in the below screen caps. The screen caps are small, medium and large, the medium being the one that will be used as the main size on the site.</p>
    <p>In the medium, as you can see, there are different characters that are different sizes within words. In the word "wisdom" the m clearly seems smaller as do the n, the belly of the h and the r in some of the other words.</p>
    <p>The site host, of course, is telling the client the problem is with the font we provided. Not knowing how they have things set up we're having a difficult time even guessing what might be happening.</p>
    <p>So my basic question is: Does anyone know what causes this sort problem?</p>
    <p>Thanks for having a look,<br>
    Ken</p>
