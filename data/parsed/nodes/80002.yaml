    html: |-
      <p>I do pencil and ink drawings of lettering like this but I don't imagine that's much help.</p>
      <p>Some fonts a little bit like it:</p>
      <p><a class="freelinking external" href="http://www.ffonts.net/Cyklop-Regular.font" rel="nofollow">Cyklop Regular</a>. There's also an italic of this Polish font which is based on a 1920s Polish typeface.</p>
      <p>From Ryoichi Tsunekawa's Prop-A-Ganda fonts: <a class="freelinking external" href="http://new.myfonts.com/fonts/prop-a-ganda/pag-karogs/" rel="nofollow">PAG Karogs</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/prop-a-ganda/pag-etiketa/" rel="nofollow">PAG Etiketa</a> and probably a few others.</p>
      <p><a class="freelinking external" href="http://home.tiscali.nl/r_keijzer/searchpage.htm" rel="nofollow">Richard Keijzer</a> has some Amsterdam School fonts, but something about the look of his website has never prompted me to look into these properly.</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/itc-juanita/" rel="nofollow">ITC Juanita</a>.</p>
