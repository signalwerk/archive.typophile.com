  html: |-
    <p>Hi there,<br>
    I'm working on a logo and need some help identifying the right font to use.<br>
    I'm looking for a sans-serif font with soft rounded edges, preferablly something with a single-stack lowercase "a".  I like the humanistic qualities of Avenir but obviously this font isn't rounded.  </p>
    <p>I also like the style of the font in the new esurance logo, which I have attached below. </p>
    <p>Fonts that I've considered so far include:<br>
    1. Comforta (although I feel like it's almost too rounded).<br>
    2. Museo (getting closer but some of the elements remind me of an old typewriter font). </p>
    <p>Any suggestions would be really helpful.  Thanks so much!<br>
    Adon</p>
