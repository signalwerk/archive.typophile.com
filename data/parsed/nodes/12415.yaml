      <p>This is very interesting. It surprises me a bit because I’ve only ever encountered one RvdL statement about Typophile before. In fact, that one statement can be found on the bottom of page 6 of <em>Emigre No. 66: Nudging Graphic Design</em> (Princeton Architectural Press, 2004). The article is the issue’s introduction, in which RdvL sings the praises of Armin Vit and SpeakUp. </p>
      <p>Quote: “There are other type-related blogs I visit. Typographi.ca and Typophile.com are musts if you’re interested in type design. If you think <em>Emigre</em>’s discussions on legibility in the early 90s were somewhat tedious, check out the depth and extent to which these bloggers discuss the topic.” (Author’s emphasis)</p>
      <p>So, RdvL seems to have written that in 2004 that Typophile was very important to type designers, while subtly belittling its participants at the same time. I have not seen the above-mentioned issue of <em>Print</em>.</p>
      <p>It is no secret that some key leaders of the type industry dislike Typophile. Incorrect rumors spread here that can hurt individuals or sales, and some (almost always anonymous) posters can just be plain rude. However, it has been my experience that these people are almost always shot down, or at least well rebuted, by regulars (who are not anonymous).</p>
      <p>As an aside, I am grateful for Typophile, and have enjoyed every opportunity to meet fellow posters live at various conferences. If it hadn’t been for Typophile, I’m sure that I woun’t have met any of you yet. Every time I hear a disparaging mark about Typophile (in person, or on another forum) I get very sad.</p>
      <p>I could understand if RvdL had a grudge against this board’s discussions, though. The wiki listing for Mrs. Eaves is actually quite rude. And it has been a whipping boy in too many discussions. Do you think that makes RdvL and Zuzana Licko more likely, or less likely to want to chime in?<br>
      __<br>
      <a href="https://web.archive.org/web/20080906160527/http://www.typeoff.de/" title="www.typeoff.de">www.typeoff.de</a></p>
