      <p>Let’s be honest. Some people on this board have written some very presumptuous, uninformed disparaging things about Emigre. And moderators let it stand in some spirit of “openness” or what have you. If I were in Emigre’s position, I’d want to go elsewhere for discussions or answers. It’s not enough for Emigre’s detractors to simply not buy and use Emigre fonts. They simply cannot accept Emigre’s profound success and influence.</p>
      <p>And people either need online forums or they don’t. I happen to need them. I work on type alone, so online interaction is my only interaction. And I will say now it is the WORST kind. Face-to-face or even the telephone is better. Once I write something online, some yapping Pomeranian can always waltz in, scrutinize the tiniest discrepancy and derail the whole thread from ever arriving at a satisfactory answer. And online arguments wear me out. Online a cowering twit can talk and act like a hulking thug. It only takes two or three such people to drive away those who have the most to contribute to a forum.</p>
      <p>That said, I would first point at the technical forums and the new editable wiki pages as examples of the most useful parts of typophile. And the Critique forums are a treasure chest full of young new designers looking for a good home at a foundry. And I have had rewarding first encounters here on typophile—Dan Reynolds, Tiffany Wardle and Andreas Seidel, for example. And Joe!</p>
