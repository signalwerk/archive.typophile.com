      <p>&gt; The wiki listing for Mrs. Eaves is actually quite rude.</p>
      <p>For the record: although that phrase in mine, I didn’t make that wiki entry (in fact I’ve barely even checked out the Typophile wiki stuff). Somebody must have thought it’s a good encapsulation of the typeface. Personally, although I stand by that characterization, I think Mrs Eaves is a complex enough face that it deserves at least a full paragraph, to put things in an adequate context. Also, believe it or not I do think there’s a place for tact, and there are things you can say -and ways you can say them- in “conversation” that are better left out of something “formal” like a wiki, or at least not given all the weight. On the other hand, there’s also something to be said for admitting that one’s font is badly spaced, coming to terms with it, and moving on - not<!--
