    votes: null
    html: |-
      <p>Hrant, I’ll admit that I was a bit worried before I met you in person. I thought that I was going to get it for all the disagreement we’d had online, especially those that took place before and after the last US election. But it was a delight to meet you in Beirut. You certainly were not boring, a little “quieter” perhaps, but that is never boring (I think that the people who can’t stop talking are the most boring…).</p>
      <p>__<br>
      <a href="https://web.archive.org/web/20080906160527/http://www.typeoff.de/" title="www.typeoff.de">www.typeoff.de</a></p>
