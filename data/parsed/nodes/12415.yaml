      <p>Hey, people on this board have written some very presumptuous, uninformed disparaging things about me too, but I’m still here! Because I like the abuse? No, because I’m strong enough to prevent it from stopping me from benefiting from Typophile. Although it sort of helps that 99% of them have been anonyrats. Oh yeah, I’m sure it’s because if they’d used their real names I’d gun ’em down... Also, people have written crap about a bunch of other people and organizations too (like Linotype and Bitstream), but Dan (your buddy) for example is going strong.</p>
      <p>BTW, one thing you should know (and I think you do, it’s just more convenient for you to ignore it) is that Rudy and I have been on decent terms since 2002. That doesn’t mean we agree on everything (or even much), like what makes a Good Font, but it sort of throws a wrench in your polarization...</p>
      <p>&gt; people either need online forums or they don’t. </p>
      <p>Well of course. As William said, the issue isn’t what’s useful to Rudy, but what’s useful to people as a whole. Some people are more fruitful communicators via ponderous, hierarchic magazine articles, others via a whirlwind of ASCII, others via lapdancing, others whatever. Don’t stick your nose up at an environment you can’t handle. And don’t show up exclusively to strike us down.</p>
      <p>Typophile members (like those who’ve had actual font releases after a long public gestation here) constantly express their appreciation. And what kind of organization manages to soft-sell people memberships in return for virtually nothing? Face it, it’s a good thing, overall. Don’t defend somebody who thinks otherwise simply because it’s an opportunity to attack certain people.</p>
      <p>&gt; it is the WORST kind.</p>
      <p>Yeah, it really sucks that it doesn’t cost anything, it overcomes geographic barriers, and everything is archived.</p>
      <p>&gt; I have had rewarding first encounters here on typophile—Dan<br>
      &gt; Reynolds, Tiffany Wardle and Andreas Seidel, for example.<br>
      &gt; And Joe!</p>
      <p>Hey, same here! Many people you like don’t like other people you like. What does that mean? As for me, the only people I tend to have trouble with is fundamentalists.</p>
      <p>hhp</p>
