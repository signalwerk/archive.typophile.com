      <p>Whoah, mister, calm down. I totally understand what John Butler is saying: online interaction is the worst not because it’s bad in absolute terms, it’s the worst because it’s worse than other forms of interaction, like meeting someone face to face. I went to see you speak at CCSF not because I thought you were going to say anything different than what you’ve said online (and, indeed, I recognized an awful lot of your presentation materials), but just to see Hrant Papazian in action. The person I saw was modest, knowledgeable and charming. If I lived in LA, I’d totally sign up for your class. I think it’s going to be a lot of fun. Would I have wanted to before I saw you speak? Probably not, because the online Hrant is a pretty schizophrenic entity, frankly.</p>
      <p>Being a type nerd can be a really alienating thing. I’m lucky, because San Francisco is a designer’s town, and it’s not hard for me to find people to talk to about my obsession with fonts and type design. Talking to friends about what I’m doing and showing them my feeble efforts at type design have done a lot to fuel the fires of my passion. I get a lot out of Typophile, but it’s sort of removed, at a distance.</p>
      <p>I can understand why <a href="/web/20080906160527/http://typophile.com/wiki/Emigre" class="wiki">Emigre</a> would be pissy towards Typophile, for exactly the reasons John outlines. I wrote the entry on <a href="/web/20080906160527/http://typophile.com/wiki/Zuzana%252BLicko" class="wiki">Zuzana Licko</a>, who is probably one of my favorite type designers, and even that, though positive and short, is pretty far from hagiography. Lots of people here have bagged on their work numerous times. That said, it’s a little surprising they’d care enough about the smack that gets talked here to single Typophile out. I’ve always been pleased at how moderate and cordial Typophile is, but then again, I’ve been dealing with Internet culture for a long time. My expectations are pretty low.</p>
