      <p>&gt;And I will say now [on line] is the WORST kind [of interaction].</p>
      <p>Hmmm, this is getting interesting. </p>
      <p>John, it is the worst in the ways you mention - people tend to be much ruder than in person, and the garrolous and irrelevant talkers have much more power in an on-line conversation. </p>
      <p>But it also has some unique benefits that face to face conversation does not. It enables communication at a time of your convenience - a fabulous thing about e-mail also. And it enables you to reach a wide group of people of like interests all across the world, and to learn from each other - and to form new friendships, as you mention. </p>
      <p>I find this instant, international reach of the internet dazzling and wonderful. </p>
      <p>I haven’t explored other on-line discussion venues much, but when I follow links to others, I haven’t seen anything that compares to Typophile. Maybe it is something about the size of the interest group (not too little or too big) or its common passion, but the sustained discussion over time on a pretty high level is quite impressive to me. </p>
      <p>And of course Jared and Joe deserve the hats off for creating and now recreating it.</p>
