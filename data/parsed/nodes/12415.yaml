      <p>&gt; it’s worse than other forms of interaction</p>
      <p>I don’t agree. Clearly, each environment has its pros and cons. And yes, different people are more in tune with different environments. John likes telephone conversations better; to me the telephone is quite abhorrent. But I’d never claim it has no value. And you like Typophile yourself, and I bet not just because it’s moderate and cordial, not because you have an unfortunate addiction to it or something, but because it’s stimulating and educational - because it has value to you. You don’t show up just to throw a hissy-fit.</p>
      <p>Yes, you attended my talk (thank you), but you nonetheless realize the geographic barriers at play in the fact that hundreds of other people didn’t attend. You are lucky that you live in the Bay Area. But maybe you’re unlucky that you don’t live close enough to Beirut. Maybe Rudy is lucky that he doesn’t need Typophile. But you and Rudy are just single individuals, not benchmarks against which my talk, Typophile, or anything else should be judged.</p>
      <p>You think I’m a schizo online, but fine in person. Other people appreciate my online presence (I know because they email me out of the blue to tell me so), but are sometimes disappointed that I can seem downright boring in person. Everybody is different, and that’s exactly why saying Typophile has no value -and eagerly defending people who say that- is a bad reflection on such people.</p>
      <p>hhp</p>
