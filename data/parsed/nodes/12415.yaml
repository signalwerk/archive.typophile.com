      <p>I haven’t seen the context of the remark, but it sounds like a rather self-centered perspective. Typophile may not offer much of value to Rudy Van der Lans, but it does offer tremendous value to me as a comparative novice. You have roughly half the board of ATypI who post on Typophile, some quite regularly, and others of comparable experience and accomplishment. They obviously enjoy talking type both to each other and to help mentor those of us of lesser experience - from whom they might even learn a thing or two now and then.</p>
      <p>So I say Hooray Typophile! </p>
      <p>Now if they would just fix the damn measure and type size on the new site design...</p>
