  html: |-
    <p>We received a Russian translation for a Dutch brochure as an MS Word document. Our contact in the Netherlands says the text opens and displays perfectly on her PC, but when we open the document on our Macs or import it into Adobe InDesign CS all cyrillic characters are substituted by underscores. We have tried this using different fonts — the default Arial (which I presume is Unicode), Myriad Pro OpenType, Helvetica LT OpenType and Pragmatica. Neither of them do the job.</p>
    <p>Does anyone know if there is a way I can check which coding was used for this Cyrillic text, or is there anyone who is willing to take a quick look at the attached text and tell me what I need to do to access the cyrillic characters?</p>
    <p>Thank you very much,</p>
    <p>Yves</p>
