      <p>The 'larger eyes' are also a feature of <a class="freelinking external" href="http://www.houseind.com/fonts/collections/neutraface" rel="nofollow">House Neutraface</a>. There are alternates for many of the letters, and Neutraface No.2 has more conventional forms, if you need them.</p>
