      <p>another angle on these very good questions is the overall issue of what we are a part of: consumerism and disposability, the commodification of desire, the impact of the products and services we help to promote, the creation and maintenance of identity-based illusions: coolness, hipness, cleanly drawn facades, etc.  i feel there may be no clear answer to these questions; only debate, controversy, survival issues, the inevitable politics of the free market, and the infinite complexities of culture itself.</p>
      <p>but the extent to which we participate, select, and respond might make a difference.</p>
      <p>recommended reading: "captains of consciousness" by stuart ewen. "commodify your dissent" and "the conquest of cool" by thomas frank. "no logo" by naomi klein. "emotional branding" by marc gobe. </p>
      <p>i am not endorsing the opinions in any of these books. i recommend them as food for thought.</p>
