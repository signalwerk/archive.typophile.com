      <p>1. My last design job was working for next to nothing a nonprofit whose ideas I supported passionately. It's one of the shining starts of the nonprofit world, and dozens of people work there, for free, year round. They took advantage of me, treated me like crap, and from here on out I'm following Sagmeister's idea: nonprofits I like get a discount, but nothing free, because if they're not paying they have little reason to care about a designer or his/her work. </p>
      <p>2. It all depends on the client. Clients that really do shirk their responsibilities, such as Exxon refusing to pay for cleaning up oil spills, are definitely out. Work that's just blatantly wrong, like tobacco advertising, is also out. But I would happily do work for Kraft foods, even though it is part of Altria, because there's a big difference in selling food and selling addictive carcinogens. To paraphrase Chris, I wouldn't do anything that I won't be proud to show to my potential kids.</p>
