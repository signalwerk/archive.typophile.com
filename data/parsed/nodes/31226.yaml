      <p>I like fine art and the process of creating it, but it's not as fun for me as designing commercial art for the masses. I'm sure that sounds shallow/dull/uninspired, but in truth I actually thrive working under the corporate umbrella. My heart is in that kind of work and the fun part for me is seeing how far I can push the limitations I'm given... yes, I am a silent design rebel in starched clothing. :-) And that is the statement that I wish to make, and I make it almost every time.</p>
      <p>One lady I did design work with had spent some time illustrating shoes and furniture for store catalogs (I believe Sears Roebuck, IIRC). She was one of the best fine artists I'd ever worked with, and of course with the abilities she had, drawing shoes was a very narrow scope of her talents. I never considered her as some kind of corporate sell-out or someone who compromised her beliefs for cash. She was simply making a living and it certainly didn't affect her ideals or her talents. She taught me so much.</p>
