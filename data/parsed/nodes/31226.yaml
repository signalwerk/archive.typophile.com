    <p>Hello all,</p>
    <p>I have just been assigned to produce an essay on ethical design for college and i would be interested to know your views for my research. I would be very grateful if you could assist me by answering the following questions or by giving me any opinions that you have:</p>
    <p>Whether you are prepared to design for charities for free or if you would demand a fee? </p>
    <p>Would you design for a firm that goes against your own personal beliefs? Or is money more important to you than your beliefs?</p>
    <p>Any response would be much appreciated! Thanks</p>
