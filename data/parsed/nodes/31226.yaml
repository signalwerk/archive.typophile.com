      <p><cite>Whether you are prepared to design for charities for free or if you would demand a fee?</cite></p>
      <p>I'll go with "it depends." How poor am I, what's the charity, and how much work is involved?</p>
      <p><cite>Would you design for a firm that goes against your own personal beliefs?</cite></p>
      <p>If the firm went far enough against my personal beliefs, I wouldn't work for them. Even in a full-time job situation, I have discovered that there are things I could be asked to do that I would say "no" to, for ethical reasons. If that means risking getting fired, or (in some extreme case) quitting, I'd be willing to do that.</p>
      <p>Of course, I speak from the comfortable position of having a good income and some savings and so on. I am not about to judge people who take work for clients they are less comfortable with because they feel that's what they need to do just to make a living. I'm just grateful that I don't have to make those kinds of choices.</p>
      <p>The parallel to the legal system doesn't do much for me, btw. The legal system is predicated on lawyers taking cases for people who are or may be guilty. I don't think the universe of design and typography would fall apart if designers and typographers followed their conscience in accepting clients.</p>
      <p>Cheers,</p>
      <p>T</p>
