      <p>i'm not sure what jpad means by "leftist fine art world and its cult of genius" - you'd have to show me a survey of collectors' politics before i'll buy that one. i think the problem is rooted more in the mysterious process we specialize in. the bulk of our efforts is unseen or misunderstood. the hours spent in sketching, deliberation, revision, and pixel surgery.<br>
