      <p>Not to mention the way the art world has changed in the last 30-40 years. It's a lot less friendly to "idealists". New York in 2007, where it is virtually impossible to find an affordable apartment anywhere you'd want to live and the overhyped art world is dominated by vast international fairs, white box galleries and collectors, is a wildly different place than NY of the 70s and 80s when artists lived in subsidized lofts in SoHo and there was an energetic and experimental cross pollination between the various art disciplines. And you could visit all the major galleries in an afternoon! Today's art stars seem unfortunately, to be the gallerists and guest curators, not the artists themselves.</p>
      <p>IMHO it'll take a major economic downturn and the wallstreeters moving onto the next big thing before the art scene in NY recaptures it's vibrance. I'm glad I was young &amp; idealistic (and broke) in a different era!</p>
