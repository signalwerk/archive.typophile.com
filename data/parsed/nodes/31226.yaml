      <p>I have done and will continue to do work for charities that I believe in. I get leary when solicited by strangers though. It is sad that there are con-men out there who scam people by pretending to be charities.<br>
      I would not do any work for shady outfits. I am not clear on what is meant by "against my beliefs". It would be a case by case thing. If it bothered me, I would not do it. I do not believe in any religion but would not turn down work for a religious group. I don't believe in suntan shops and think they are silly but I would not turn down work for them. I would certainly turn down work for racist or hate groups and for gun lobby groups like the NRA. Certainly forget any criminal or sleezy work.</p>
      <p>The litmus test is, would I be willing to show my kids the work.</p>
      <p>ChrisL</p>
