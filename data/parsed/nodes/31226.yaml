      <p>Q1. I too do a lot of volunteer work for charities and create for them. However, some are prosperous and wouldn't allow me to design for free (thank you!!!) but I charge them flat rates and much less than I would one of my not-for-profit customers.</p>
      <p>Q2. I once designed for a small company in NY - they wanted a rip-off Nike logo. I felt so bad that day, I couldn't sleep -- and when they came in the next day to pick up the work - I asked them to leave. I remember one guy pulling out dollar bills - and I told him it wasn't about the money. I felt that I had sunk so low. I just couldn't live with myself. I do remember I had my office door open when I asked them to leave, and the business next door heard my pleas -- and came in to "help" out. We were a very friendly building on E. 44th St. But that's off-topic.</p>
      <p>What is difficult about your question - is most won't know until they are in that situation. Mine came when the end of typesetting shops was near -- I had payroll, bluecross and so many other expenses to consider, it is why I even talked to those jokers. But in the end, I just couldn't do it.</p>
