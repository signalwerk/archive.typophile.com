      <p>"Whether you are prepared to design for charities for free or if you would demand a fee?"</p>
      <p>Not sure what the ethical slant on that question is. Doesn't seem to be an ethical-centric question to me.</p>
      <p>But, the answer, of course, is 'it depends'. ;0)</p>
      <p>"Would you design for a firm that goes against your own personal beliefs? Or is money more important to you than your beliefs?"</p>
      <p>I think there's two angles to take:</p>
      <p> - pick and choose your work and only work for companies you feel meet your moral and ethical standards</p>
      <p> - accept the fact that we are a commercial service provider and that the goal is to give the customer the best of what they ask for independant of any moral and ethical standards of the company.</p>
      <p>The latter is more akin to law. A lawyer is committed to representing the client regardless of their moral and ethical views of the person.</p>
      <p>I don't think either one is more wrong/right than the other.</p>
