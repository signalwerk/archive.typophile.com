      <p>Sam</p>
      <p>It's great that you've been assigned this as a subject (judging from the clouds of ethical dust this post has stirred up); I don't know when you have to have it done by, but my tuppence worth on this subject would include <a href="http://www.papress.com/bookpage.tpl?isbn=1568985827&amp;cart=117101787221725" rel="nofollow">Fresh Dialogue 6: Friendly Fire,</a> convened by James Victore for the AIGA and published by Princeton Architectural Press. A very interesting read.</p>
      <p>To answer your questions<br>
      1. I did work for free and/or volunteer assignments for the charities and non-profits I supported when I was a student in London. It was a privilege (I also worked for some of them on a salaried basis, but not as a designer. That was just work). These days I would charge a fee – if only to avoid the faffing-around factor.<br>
      2. To do something you don't believe in for the sake of money is to relegate yourself to the point of prostitution, whatever your line of work is. Having said that, I've done commercial work that was 'less than noble' because the noble thing to do at the time was pay my bills and feed my family. But I've never put myself in the position of having to fire a client outright on ethical grounds.</p>
