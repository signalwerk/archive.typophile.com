      <p>1) Yes. Or, No, but I'll make exceptions.</p>
      <p>2) I work 2 ways. As a graphic designer, I do as I please, higgledy-piggledy. I choose projects and clients on the very limited knowledge I have of their ethics, and warm rapidly to like minds, as a relationship matures. I tend to give people the benefit of doubt, as I am aware that my own opinions and ethics change over time. And being repellent is, well, repellent. I try to be a moderate fanatic.</p>
      <p>As !Exclamachine, I am not normally targeting individual clients. I put something out there, and it sinks or swims. I have limited control of the use of my faces. Nevertheless, I can affect my ethics regardless of the source of any funds, and make the purchasers aware of that. In order ensure !Exclamachine's agenda is funded, 5% off the top goes to Sabre International, and more goes to supporting Typosium and another non-profit project, along with a considerable amount of time.</p>
      <p>If AcmeWorldCorp Inc. wants what I offer, they can buy my world view with it.</p>
      <p>⁂</p>
      <p>America is good for the advancements of the arts only through strength in numbers. I know too many proud citizens who have never been to any show but SFMOMA's "The Art of Star Wars". The general tendency of many Americans only to respect financial success, to shun elitism, and to choose casual individuation paired with from-the-hip analysis makes it a poor spawning ground of high culture. But dang if there aren't enough of us to have an impact anyway.</p>
