      <p><cite>Whether you are prepared to design for charities for free or if you would demand a fee?</cite></p>
      <p>For free only if it's something I not only believe in, but have total creative control over. The charities must agree on a a quick thumbnail sketch I do on-site. No revisions allowed afterwards unless it's something critical (such as the date for a flyer changing). They are allowed to request what details they want in the beginning, but not after I start the job. </p>
      <p>Example: I designed flyers for the local firemen who had a fundraising event to buy new equipment. This was immediately following 9-11. They gave me full creative control and lots of respect and appreciation, and they got a great flyer. The only changes made were adding some program times. </p>
      <p>What was only intended to be an overnight illustration freebie wound up becoming one of the most talked-about portfolio pieces I've ever had, and it actually helped me get work at one point (the employer had friends at NYFD).</p>
      <p><cite>Would you design for a firm that goes against your own personal beliefs? Or is money more important to you than your beliefs?</cite></p>
      <p>That depends on how much it goes against your beliefs and how much you are willing to compromise to make a living. If it's something I wouldn't be proud to show to anyone, there's no use doing it.</p>
      <p>I turned down an offer to design a web site selling pornographic materials. I did not seek out the work. I had done completely unrelated artwork for one of the company's investors, and that apparently led him to ask me if I'd be interested in doing the job. The money offered for the work was awful hard to ignore, but I just couldn't do something like that.</p>
    html_clean: |-
