      <p><cite>The latter is more akin to law. A lawyer is committed to representing the client regardless of their moral and ethical views of the person</cite>. </p>
      <p>That's not a good analogy. Lawyers often represent people who appear to be just this side of pure evil, only to be exonerated through something the lawyer turns up, sometimes after a conviction. Designers are in a very different position; designers don't defend people accused of committing unethical acts, designers <em>become complicit</em> in said acts. The designers behind Joe Camel and the Kool penguin made a lot more effort to sell cigarettes to kids than the tobacco executives, whom simply provided the funding and collected the profits. The law firms that represented the tobacco companies only got involved after the fact.</p>
