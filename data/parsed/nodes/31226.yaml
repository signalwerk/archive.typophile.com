      <p>1. I've donated time to charities for work, and write it off at the end of the year. My mom runs one, so it's kind of expected that I do something for her when asked. I never mind. I've also done work for a few no-profits while working in a studio and some of them really take everything to the nth degree and it's torture. </p>
      <p>2. What I find morally unacceptable and the work I do have not crossed paths. I've come up against unethical and that's enough for me to walk away from a project, however.</p>
      <p>I'm sure you already know, but professional organizations like AIGA and GDC provide ethical guidelines for designers as well, which is worth checking out, if only to have another view of 'ethics'.</p>
