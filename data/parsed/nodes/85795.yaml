    html: <p>Hi Yves, I don't know if this is what you are looking for, but <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/font_bureau/williams_caslon_text_ot/" rel="nofollow">Williams Caslon Text</a> has small cap figures, which are 2/3 the height of the caps. <a class="freelinking external" href="http://www.fontshop.com/search/?q=benton+sans" rel="nofollow">Benton Sans</a>, which is where I got the idea, also has small caps figures, and probably so do some other recent Font Bureau fonts. I've found the small caps figures actually pretty useful.</p>
