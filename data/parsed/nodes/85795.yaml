    html: |-
      <p>And by “recent” do you mean more recent than Miller Text (1997)? MC maintained Austin’s original three-quarter lining figure scheme, which is somewhat endemic to Scotches (as witnessed also in Nick’s interpretations).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/MillerText-figs_3686.png"></div><p></p>
      <p>&nbsp;<br>
      Less expected, perhaps, are Dante’s three-quarter lining figs (default in the original digital versions). Not usually seen with an oldstyle like this.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dante-figs_6424.png"></div><p></p>
      <p>&nbsp;<br>
      But probably not recent enough for you.</p>
