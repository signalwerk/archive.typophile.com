  html: |-
    <p>Hi all,</p>
    <p>For the sequel to yesterday’s <em><a href="http://fontfeed.com/archives/figuring-out-numerals/" rel="nofollow">Figuring Out Numerals</a></em> post on The FontFeed, I need an example of a typeface (preferably recent) that has ¾ figures: lining figures that are halfway the x-height and the cap height. It should be a typeface that I can link to on <a href="http://www.fontshop.com/" rel="nofollow">FontShop.com</a>. Thanks in advance.</p>
