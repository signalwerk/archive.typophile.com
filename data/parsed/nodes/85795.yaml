    html: |-
      <p>Scotch Modern (2008) and Figgins Sans (2008) have them as default (for mixed-case setting), as well as alternate, cap-height figures weighted and proportioned for all-cap settings.</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/shinntype/figgins_sans_family/" title="http://www.fontshop.com/fonts/downloads/shinntype/figgins_sans_family/">http://www.fontshop.com/fonts/downloads/shinntype/figgins_sans_family/</a><br>
      <a href="http://www.fontshop.com/fonts/singles/shinntype/scotch_modern_regular/" title="http://www.fontshop.com/fonts/singles/shinntype/scotch_modern_regular/">http://www.fontshop.com/fonts/singles/shinntype/scotch_modern_regular/</a></p>
      <p>Compare the difference by clicking on the "Gear" icon and applying "case sensitive forms".</p>
