    <p>Ever since visiting the V&amp;A in London I have been wanting to find out more about <a class="freelinking-external" href="http://www.flickr.com/photos/criminalintent/2744038788/sizes/l/"> THIS</a> engraved type. </p>
    <p>It’s obviously hand-done and possible one-of-a-kind. How would one classify the style? Is it art nouveau? Have any of you seen fonts like this?</p>
    <p>Any info would be useful!</p>
    <p>Thanks</p>
