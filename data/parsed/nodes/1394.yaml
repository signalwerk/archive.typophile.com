  - id: 138052
    user: 110
    date: 2003-09-24T13:40:00
    date_raw: 24.Sep.2003 1.40pm
    votes: null
    html: "<p>I made a comparison between the digitizations by  <br>Adobe and those by Bitstream in regards to quality <br><a href=\"http://www.typophile.com/forums/messages/30/4651.html\" target=\"_blank\">  earlier this year</a>. <br> <br>It said in my original post: <br><i>I've got [Bitstream's] full type collection on CD-ROM  <br>(that was actually my very first purchase as an  <br>independent (typo)graphic designer) and I can  <br>assure you their digitizations are top notch. Just  <br>compare their <a href=\"http://www.myfonts.com/fonts/bitstream/zapf-humanist-601/\" target=\"_blank\"> Zapf Humanist</a> or <a href=\"http://www.myfonts.com/fonts/bitstream/humanist-slabserif-712/\" target=\"_blank\"> Humanist Slabserif</a>  <br><a href=\"http://www.myfonts.com/fonts/bitstream/humanist-slabserif-712/\" target=\"_blank\"> 712</a> to Adobe's version of <a href=\"http://www.adobe.com/type/browser/P/P_1244.jhtml\" target=\"_blank\"> Optima</a> (not that I would  <br>use that face in a million years) or <a href=\"http://www.adobe.com/type/browser/P/P_1174.jhtml\" target=\"_blank\"> Egyptienne F</a>.  <br>Suddenly, you'll realize that a lot of lines were meant  <br>to be oh so slightly curved, not straight.</i> <br> <br>Here it's even the other way round: the 'similar  <br>to' version is superior to the so-called original. <br>Shows how much Mr. Fonts 4 All knows. There's  <br><a href=\"http://www.typophile.com/forums/messages/30/14101.html#POST24463\" target=\"_blank\"> some ethical problems too</a>, but it appears that  <br>Bitstream have <a href=\"http://www.bitstream.com/categories/news/press/2003_bitstream/071803_linotype.html\" target=\"_blank\"> cleaned up their act</a>.</p>"
