    date: 2003-09-24T14:09:00
    date_raw: 24.Sep.2003 2.09pm
    votes: null
    html: "<p>As for Barmeno, strange as it may sound, the best thing  <br>to do is to purchase <a href=\"http://www.typophile.com/forums/messages/83/12665.html#POST22383\" target=\"_blank\"> another type family</a>: <a href=\"http://www.philsfonts.com/showing.html?sku=FF011097X1P2&amp;start=1\" target=\"_blank\"> FF Sari</a>. <br> <br>Hans Reichel created Barmeno for Berthold in 1983. <br>\"Hans Reichel (born 1949) is a musician/inventor/composer  <br>as well as being a type designer. For 20 years he's  <br>made a name for himself as an accomplished acoustic  <br>and electric guitar player. He's also the inventor of  <br>the Daxophon <a href=\"http://www.philsfonts.com/showing.html?sku=FF010269X1P1&amp;start=1\" target=\"_blank\"> (sic)</a>, an instrument where thin strips  <br>of wood are played with a bow to mimic animal sounds  <br>and human voices.\" <br>Reichel redesigned and expanded his popular Barmeno  <br>family for FontFont, but had to change the name to  <br>FF Sari to avoid being sued by the new owners of the  <br>Berthold Type library. See <a href=\"http://cgm.cs.mcgill.ca/~luc/berthold.html\" target=\"_blank\"> aforementionned article</a>: <br><i>Berthold made FontShop change the name of two of  <br>their packages (FF New Barmen 1 and 2, now called  <br>FF Sari 1 and 2), which evidently must have cost  <br>Fontshop some money and embarrassement. The name  <br>change was because FF New Barmen was too close to  <br>Barmeno, which is a Berthold font. As Apostrophe  <br>puts it: \"I can only imagine the stream of curses  <br>that went through Hans Reichel's head when he was  <br>told of what happened.</i> <br> <br>Which in short means he doesn't own his creation anymore.  <br>Same thing happened to Albert Boton who <i>can't use  <br>his own name</i> to brand his type designs anymore  <br>because one of his typefaces in the Berthold type  <br>library is called Boton.</p>"
    html_clean: "<p>As for Barmeno, strange as it may sound, the best thing  <br>to do is to purchase <a href=\"http://www.typophile.com/forums/messages/83/12665.html#POST22383\" target=\"_blank\" class=\"link-lost\"> another type family</a>: <a href=\"http://www.philsfonts.com/showing.html?sku=FF011097X1P2&amp;start=1\" target=\"_blank\" class=\"link-external\"> FF Sari</a>. <br> <br>Hans Reichel created Barmeno for Berthold in 1983. <br>\"Hans Reichel (born 1949) is a musician/inventor/composer  <br>as well as being a type designer. For 20 years he's  <br>made a name for himself as an accomplished acoustic  <br>and electric guitar player. He's also the inventor of  <br>the Daxophon <a href=\"http://www.philsfonts.com/showing.html?sku=FF010269X1P1&amp;start=1\" target=\"_blank\" class=\"link-external\"> (sic)</a>, an instrument where thin strips  <br>of wood are played with a bow to mimic animal sounds  <br>and human voices.\" <br>Reichel redesigned and expanded his popular Barmeno  <br>family for FontFont, but had to change the name to  <br>FF Sari to avoid being sued by the new owners of the  <br>Berthold Type library. See <a href=\"http://cgm.cs.mcgill.ca/~luc/berthold.html\" target=\"_blank\" class=\"link-external\"> aforementionned article</a>: <br><i>Berthold made FontShop change the name of two of  <br>their packages (FF New Barmen 1 and 2, now called  <br>FF Sari 1 and 2), which evidently must have cost  <br>Fontshop some money and embarrassement. The name  <br>change was because FF New Barmen was too close to  <br>Barmeno, which is a Berthold font. As Apostrophe  <br>puts it: \"I can only imagine the stream of curses  <br>that went through Hans Reichel's head when he was  <br>told of what happened.</i> <br> <br>Which in short means he doesn't own his creation anymore.  <br>Same thing happened to Albert Boton who <i>can't use  <br>his own name</i> to brand his type designs anymore  <br>because one of his typefaces in the Berthold type  <br>library is called Boton.</p>"
