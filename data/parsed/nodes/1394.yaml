    html: <p>Hi Dawn, I'm back, all clean and smelling good. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>If you're going to purchase Barmeno there's quite  <br>a few options. <br> <br>The obvious thing would be to purchase the "original", <br>that being the <a href="http://www.bertholdtypes.com/bq_library/90042.html" target="_blank"> Berthold version</a>. Unfortunately since  <br>the rights to the Berthold Types Library were  acquired  <br>by Harvey Hunt and his wife a couple of years ago,  <br>things have been going from bad to worse. Read all  <br>about it in this excellent aricle on <a href="http://cgm.cs.mcgill.ca/~luc/berthold.html" target="_blank"> Luc Devroye</a>'s  <br>website and cringe. <br> <br>Though the quality of Berthold BQ Types is simply superb, <br>ethically I feel it's plain wrong to purchase them. <br> <br>P.S. I'm going to break up my post because I need to  <br>research some stuff.</p>
