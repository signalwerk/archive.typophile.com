    <p>I've never run into this before so I thought I would ask the experts. I want to purchase a font but I have two font houses that I can select from for the same font package. I know the reasoning behind why there are two but don't know if one font house (in my case adobe or berthold) is better than the other. Is there any difference in the quality of the type? What types of things do I need to take into consideration when given choices of font houses? Any input would be greatly appreciated.  <br> <br>Note: I'm looking to purchase at Philsfonts which has been highly recommended to me, but have never purchased there before.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/1391" class="topic-previous" title="Go to previous forum topic">‹ Where do you buy fonts?</a> <a href="/node/1525" class="topic-next" title="Go to next forum topic">Archive through September 24, 2003 ›</a></div>
