    html: <p>I agree hhp. I started doing design work when Apple IIe ruled and Bitstream was the only font house. I still have the original ps fonts from them. Please no dinosaur jokes! <br> <br>So, Yves, you wrote about going to the source. Should I then be looking at FF Sari or stick with Barmeno? I had found a font example that gave enough character yet elegant simplicity for a logo I need to design. Michael Yanega (bowfinprints.com) was kind enough to identify it for me and put me on to this site. I started searching for Barmeno and found out about the Berthold "scandal" and also about the original type designer. <br> <br>The font doesn't have to be perfect (it's going on tractors and excavating equipment), but I'm such a type-aholic that when I buy a font I want to get the best one out there at the best price I can afford. Notice I did not say cheap, low cost always helps...but quality is always first with me. And thanks for spending the time to explain all this.  <br> <br>So given all the controversy is there another font I should be looking at that would have a similar character? Or should I go over to FF? <br> <br>BTW, bored--absolutely not. I wish I had time to learn a lot more about the fine details of type. I found all the articles very informative and enlightening. It would have been great to have these kind of places to go to when I was first starting out. I've learned more in the last week about type than I have in the past 5 years. Thanks all!</p>
