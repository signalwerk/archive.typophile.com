    html: <p>This is a joke, right? These are taken from books published by Christopher Plantin in the 16th century. These typefaces don't exist anymore, except at the <a href="http://www.vandekerckhove-devos.be/plantin/index.html" target="_blank">Plantin Museum in Antwerp</a>. <br> <br>There are some modern interpretations of them. The best known is Matthew Carter's <a href="http://www.myfonts.com/fonts/linotype/itc-galliard/" target="_blank">Galliard</a>.</p>
