      <p>Thanks for replying. I'm using Windows 7; my font manager is Serif Font Manager.<br>
      Checking the fonts in Font Creator, I've checked Font Family Name, Unique font Identifier, Full Font Name and Postscript Name, also checking Font Settings Classification, Weight and Design. I've also run Auto Naming, (which necessitates manual 'fixing' anyway).<br>
      I've checked Torino's entry in the Windows font folder; it will NOT display Torino Bold there either. When I paste Torino Bold into this folder, it vanishes!? Is THIS a pointer to what goes on? Note that this is not a Windows font Collection; they're all just True Types.</p>
