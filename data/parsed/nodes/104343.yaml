    html: <p>To me it seems that BT und OPTI may indicate that these Torino weights come from different foundries. Maybe one or more of their font name and/or style entries are too similar and cause a font name conflict. Are you sure that you have deleted all of the font caches after ‘fixing’ the names?</p>
