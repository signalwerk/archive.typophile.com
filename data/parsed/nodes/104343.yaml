  html: <p>I have long used Torino BT as a text font, and recently obtained Torino OPTI Bold, Extra Bold, Heavy. I was delighted to finally have a bold, but Torino doesn't co-operate. It 'substitutes' a font like Old Standard bold, which is similar, but will not show Torino OPTI Bold, now named as simply, 'Torino bold' Having re-named the entire family, the problem persists. I'm stumped. Can anyone shed light?</p>
