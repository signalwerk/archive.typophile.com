  - id: 68387
    user: 1215
    date: 2003-03-28T05:12:00
    date_raw: 28 Mar 2003 — 5:12am
    votes: null
    html: "<p>It does indeed look like News Gothic. If you're trying to match this sample exactly, however, beware that versions from different foundries may not all be quite the same. <br> <br>Compare for yourself: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/8086.gif\" alt=\"News Gothic Linotype\"> <br>Linotype <br> <br><img src=\"http://www.typophile.com/forums/messages/83/8087.gif\" alt=\"News Gothic Adobe\"> <br>Adobe <br> <br><img src=\"http://www.typophile.com/forums/messages/83/8088.gif\" alt=\"News Gothic Agfa Monotype\"> <br>Agfa Monotype <br> <br><img src=\"http://www.typophile.com/forums/messages/83/8089.gif\" alt=\"News Gothic Bitstream\"> <br>Bitstream <br> <br><img src=\"http://www.typophile.com/forums/messages/83/8090.gif\" alt=\"News Gothic URW\"> <br>URW <br> <br>Adobe's and Monotype's are probably interchangeable. Linotype's has basically the same letterforms, but is fitted differently. Bitstream's is a little more open in the counters and seems closest to Benton's original design to my eye. URW's is clearly different on the body.  <br> <br>I tend to prefer the Bitstream, but that's probably because I first fell in love with News Gothic through Pentagram's use of it in Potlatch materials and this is the version they use. <br> <br>-- K. <br></p>"
  - id: 68388
    user: 1262
    date: 2003-03-28T12:40:00
    date_raw: 28 Mar 2003 — 12:40pm
    votes: null
    html: "<p>For completion's sake, there's also this: Heidelberg Gothic, which is a variant of News Gothic that Linotype's parent company, Heidelberger Druckmaschinen AG, uses as a corporate face. Not shown here, and a dead giveaway is the Heidelberg Gothic lowercase <i>l</i>, which has a small hook at the bottom. <br><img src=\"http://www.typophile.com/forums/messages/83/8107.gif\" alt=\"Heidelberg Gothic\"></p>"
