    <p><cite>Ogonek</cite> <a href="http://oed.com/help/updates/latest-additions.html#oos" title="Among many other words" rel="nofollow">has been added to the Oxford English Dictionary</a>, a statement that requires explanation: The word has been added to the electronic corpus, not to any specific print dictionary.</p>
    <p>You can probably search OED Online through your library, but for the hell of it, here’s the entry (emphasis added):</p>
    <p><cite>ogonek</cite>, n.<br>
    A diacritic resembling a hook ( ̨), which is placed beneath a letter.<br>
    The ogonek is used in Polish to indicate nasalization of a vowel; the diacritic also occurs in some other languages, typically (but not always) with this function.</p>
    <p>1981 Yellow Bk. (Internat. Telecomm. Union) 80 Capital U with ogonek. 1995 F. DE LAGUNA <cite>Tales from Dena</cite> IV. 78 An ogonek or hook ( ̨̨) under a vowel indicates that it is nasalized. <strong>2002 A. TWARDOCH in J. D. Berry <cite>Lang. Culture Type</cite> 155 In uppercase Ę, ogonek should be attached at the baseline near the right part of the baseline stroke.</strong> 2006 Globe &amp; Mail (Toronto) (Nexis) 19 July, A few manual typewriters, including..an Olympia Monica with a standard QWERTY keyboard supplemented by exotic Polish diacritics such as the kreska, ogonek and superior dot.</p>
