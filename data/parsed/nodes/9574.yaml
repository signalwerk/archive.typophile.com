  html: <p>We have a job in, to be set in "New" (or ITC) Baskerville that calls for some Old English characters -- the thorn &amp; eth are of course already in the font, but we also need a wynn &amp; yogh &amp; paet (easy to make) &amp; the ampersand that looks like an os "7". <br> <br>Anybody know of a Baskerville close to "New Baskerville" that has these?" <br> <br>TIA, <br> <br>Charles</p>
  html_clean: <p>We have a job in, to be set in "New" (or ITC) Baskerville that calls for some Old English characters -- the thorn &amp; eth are of course already in the font, but we also need a wynn &amp; yogh &amp; paet (easy to make) &amp; the ampersand that looks like an os "7". <br> <br>Anybody know of a Baskerville close to "New Baskerville" that has these?" <br> <br>TIA, <br> <br>Charles</p>
