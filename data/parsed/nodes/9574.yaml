    html: <p>Charles <br> <br>Don't know if this will help you or if it is in your budget but Michael Bixler does superb Monotype composition that he can furnish in camera ready copy (he supplied the comp for the earlier Edward Tufte books) and he has the English Baskerville 169 with all the characters you need. We did an 1830's entymological dictionary a very long ways back with metal type furnished by Bixler and it required all these characters, and more. <br> <br><a href="http://www.mwbixler.com/" target="_blank">http://www.mwbixler.com/</a></p>
