    html: <p>Patternmaker -- Thanks, the Junicode fonts will be useful. <br> <br>Ms. Fabricant -- You can get an idea of what these characters look like from the Unicode chart, Latin Extended B -- their Unicode values are 021C (cap Yogh), 021D (lowercase yogh), 01F7 (cap Wynn) 01BF (lowercase wynn). <br> <br>But, and the reason samples don't help if you don't know Old English, the runic characters from which some are borrowed, as well as variations in both scribal forms &amp; 17th century fonts is, for example, that 01B7 can &amp; has also served as a cap Yogh, as well as another glyph also known as the "Old English g" (haven</p>
