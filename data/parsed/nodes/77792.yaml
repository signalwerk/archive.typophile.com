  html: <p>I have received a support request for a PS flavored OTF family we recently sold, saying that it cannot be installed in Font Book. I have no problems whatsoever doing it on 10.6 and cannot replicate the problem, but the customer is on 10.5.8 - are there any known bugs with PS OTFs and that version of OS X? Resetting the font cache didn't help, either.</p>
  html_clean: <p>I have received a support request for a PS flavored OTF family we recently sold, saying that it cannot be installed in Font Book. I have no problems whatsoever doing it on 10.6 and cannot replicate the problem, but the customer is on 10.5.8 - are there any known bugs with PS OTFs and that version of OS X? Resetting the font cache didn't help, either.</p>
