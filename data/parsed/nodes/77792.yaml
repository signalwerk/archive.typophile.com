      <p>Font Book is extremely picky about what it considers to be errors that make font unusable and often does not actually explain the problem. When testing my fonts I sometimes have to scour warnings in MS Font Validator and FontQA to find what non-problem Fontbook’s developers decided represents total font corruption. </p>
      <p>The version difference is probably because Fontbook was overhauled for 10.6 to make it a less horrible piece of software but I don’t think that Apple backported some of the bug fixes. It may be that your font is fine and that the problem is just bugs in older versions of Fontbook and that the customer will have to either upgrade to 10.6 or buy a decent font management app. This is one of those circumstances where designers have to educate clients that the actual quality of Apple’s software is far less than what the public perceives it to be.</p>
