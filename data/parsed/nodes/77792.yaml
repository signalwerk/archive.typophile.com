    html: |-
      <p>Two potential sources of problems with OTFs on Mac OS X (esp. 10.5 and earlier) are:<br>
      1. Subroutine compression: Mac OS X sometimes fails to decompress subroutines properly. Generate a font without subroutinization and try if that works.<br>
      2. Too long glyph names in the font (in total): Mac OS X imposed a limit on the overall length of all glyphnames in the font. However, to hit that limit, your font needs to have at least 2,500-3,000 glyphs. If that's the case, shorten the glyph names as much as possible (use one-letter suffixes for OpenType alternates, and the uXXXX notation for encoded glyphs). </p>
      <p>I've been using Linotype FontExplorer X Pro since its very first version, and love it. It deals very well with duplicates (e.g. same-named fonts in various formats), where FontBook gets confused. The only feature I'm still missing from Font Explorer (and having asked for it for many times) is the ability to search within character sets (as in: show me all the fonts that have a glyph for "ж"). You'd think it's absolutely trivial, but I haven't seen any single font management application that would allow that.</p>
