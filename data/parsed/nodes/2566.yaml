    html: "<p>It's nice for typography to get recognition in the mass media occasionally, but a couple of items doesn't constitute a trend. <br> <br>Remember when Hoefler and Deck were in Wired? <br> <br>Another snippet: in eye 50 (the latest, winter 2003, \"typography\" issue), a short story about an Australian newspaper that ran a feature on Stephen Banham's \"Death to Helvetica\" campaign. <br> <br>Anyone in an obscure line of work (Notwithstanding Crime Scene Investigators) can relate to the puppeteer in \"Being John Malkovich\". </p>"
