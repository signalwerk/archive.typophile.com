    html: <p>Nick, Wired and Eye are both niche market magazines. National Public Radio and Vanity Fair have a very much broader audience, which is something fairly new in terms of public consciousness of type design.</p>
    html_clean: <p>Nick, Wired and Eye are both niche market magazines. National Public Radio and Vanity Fair have a very much broader audience, which is something fairly new in terms of public consciousness of type design.</p>
  - id: 20585
