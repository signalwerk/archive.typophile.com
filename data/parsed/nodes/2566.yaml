    date_raw: null
    votes: null
    html: <p>Wired had a mighty big niche before the bust, 400,000 in 1998 when it was bought by Conde Nast. Vanity Fair has a circulation of 1.1 million. (Thanks, Jeeves.) <br> <br>Yes, eye is a small circulation journal, but the newspaper that carried the story about Banham was a mass-circulation, daily mainstream paper, The Age, in Melbourne, Australia.  <br> <br>I'm sure there are occasional stories in various countries' national media about type design, but they will always be isolated incidents. <br> <br>I was on the front page of the Montreal Gazette and in several other papers across Canada in 2001 when I designed the Richler typeface, and was even interviewed on TV (wearing a tuxedo, actually, Eric, on my way to join the glitterati at the Giller Awards). That was my 15 minutes! <br> <br></p>
    html_clean: <p>Wired had a mighty big niche before the bust, 400,000 in 1998 when it was bought by Conde Nast. Vanity Fair has a circulation of 1.1 million. (Thanks, Jeeves.) <br> <br>Yes, eye is a small circulation journal, but the newspaper that carried the story about Banham was a mass-circulation, daily mainstream paper, The Age, in Melbourne, Australia.  <br> <br>I'm sure there are occasional stories in various countries' national media about type design, but they will always be isolated incidents. <br> <br>I was on the front page of the Montreal Gazette and in several other papers across Canada in 2001 when I designed the Richler typeface, and was even interviewed on TV (wearing a tuxedo, actually, Eric, on my way to join the glitterati at the Giller Awards). That was my 15 minutes! <br> <br></p>
