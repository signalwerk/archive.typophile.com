  html: <p>As further evidence of the growing public consiciousness of type design -- following close on the heels of Matthew Carter's recent radio interview in the USA -- this month's <i>Vanity Fair</i> has a photo feature on 'Modern Masters' that includes Hermann Zapf, looking very distinguished in his study, surrounded by <i>objet de type</i>.</p>
