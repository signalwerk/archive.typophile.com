  html: |-
    <p>Does anyone have a list of ADA approved typefaces or know of any easy way to figure out if a typeface is functional without having to do a handful of measuring?<br>
    I am trying to create indoor wall signs for an upcoming apartment complex and the signs must be ADA approved. The typeface I would like to use is TheMix (caps), but again, there is no easy way to find out if it is useable or not without measuring out every letter.</p>
