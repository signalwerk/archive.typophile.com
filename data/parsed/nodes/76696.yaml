    <p>Hello!</p>
    <p>I build my first typography, and works well... but I have a problem with non postcript printers, because one character from muy typography, not appear</p>
    <p>This character is very wide (the typography is not usual), has 8600 units, in a UPM font size 1000</p>
    <p>Shall you help me?</p>
    <p>Thank you!<br>
    m</p>
