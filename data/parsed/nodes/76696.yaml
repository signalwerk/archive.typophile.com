    html: <p>Very wide glyphs can be a problem in some programs, especially MS Office. The widest thing I’ve been able to make work consistently in a 1,000 UPM font is 5991 units wide. I’ve never been able to find documentation about exactly what the width limits in various apps are, so you just have too keep shrinking it or chopping it up until it works.</p>
