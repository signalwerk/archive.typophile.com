    html: <p>Thank you Alan.  <br>Unfortunaly, with Adobe Standard Encoding I loose all the standard diacritics. <br> <br>I finally used MacOS Roman and MSWindows 1252 Latin1. I'll loose some unimportant (for the client) characters but that's OK. <br></p>
