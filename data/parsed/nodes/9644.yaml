    html_clean: <p>4.5.1  - macOSX 10.2.4 <br> <br>If I choose Adobe Standard encoding some of the charcters aren marked with yellow anymore. <br>I thought it was a sign of those charcters not being able to be used? Or am I wrong?  <br></p>
  - id: 61579
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>I think the grey bar above the character just means that it is outside the normal scope of the encoding, but they will still be included. It's true, if you create a new \"empty\" font and immediately switch it to Adobe Standard, those accented slots won't be there. But if they're already represented in your font file, they should export properly. <br> <br>My understanding is that that is the entire point of Adobe Standard encoding: to be cross-platform. It provides a basic set of characters that can be extended, without the font then being considered as \"custom\" encoding. <br> <br>Alan</p>"
