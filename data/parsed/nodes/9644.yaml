  html: <p>I've just finished the work of a type family for a client. The fonts are Reg, Italic, Nold and Bold Italic. <br>Since I wanted to learn more about Fontlab, I did the the last kerning and hinting there. <br> <br>Now I'm ready to generate, but there's so many encodings to choose from my head is spinning. <br> <br>It's a TrueType family and it should work for both Mac and PC. I used the Fontlab Standard Encoding (in Name mode) to be sure I didn't get any platform conflicts.  <br>When I try to change to Unicode mode everything changes.  Which codepages should I choose? <br> <br>If I choose Mac Roman, which is the equalent PC encoding in Fontlab? I still need to keep the standard diacritic characters. <br></p>
  html_clean: <p>I've just finished the work of a type family for a client. The fonts are Reg, Italic, Nold and Bold Italic. <br>Since I wanted to learn more about Fontlab, I did the the last kerning and hinting there. <br> <br>Now I'm ready to generate, but there's so many encodings to choose from my head is spinning. <br> <br>It's a TrueType family and it should work for both Mac and PC. I used the Fontlab Standard Encoding (in Name mode) to be sure I didn't get any platform conflicts.  <br>When I try to change to Unicode mode everything changes.  Which codepages should I choose? <br> <br>If I choose Mac Roman, which is the equalent PC encoding in Fontlab? I still need to keep the standard diacritic characters. <br></p>
