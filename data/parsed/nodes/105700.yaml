    html: |-
      <p>You've got too much going on and the main elements — the cupcake and the bakery's name — are getting lost. And some elements like the bottom type and that dotted line are going to disappear when the logo is reproduced small. Simplify and work on improving the proportions.</p>
      <p>And unless the client requests it, I'd avoid using wheat as a decorative element because there's a growing interest in gluten-free products. Even if the bakery doesn't do gluten-free now, they might in the future.</p>
    html_clean: |-
      <p>You've got too much going on and the main elements — the cupcake and the bakery's name — are getting lost. And some elements like the bottom type and that dotted line are going to disappear when the logo is reproduced small. Simplify and work on improving the proportions.</p>
      <p>And unless the client requests it, I'd avoid using wheat as a decorative element because there's a growing interest in gluten-free products. Even if the bakery doesn't do gluten-free now, they might in the future.</p>
