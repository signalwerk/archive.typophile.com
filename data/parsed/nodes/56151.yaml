      <p>Just to clarify, this is how you want the articles to be displayed online, or the reader clicks a link and opens a PDF?</p>
      <p>One thing I would suggest is making more contrast between your headers and the body copy on pages 2 and 3. If you look at where you have a longer subhead, to me it blends in with the body copy. "About the Author" is pretty good, but I'd make even more contrast. A little bigger, maybe all caps or space beneath the subhead. Just play with it a bit.</p>
