    html: |-
      <p>My main response, which others will probably say also, is that it would help to see the content of the articles before deciding on a suitable design. You can point out some things with Lorem Ipsum text but the majority of the design decisions have to be made in the context of the real text being set.</p>
      <p>Apart from that, my 2 cents is:</p>
      <p>Both the headings would stand out better if you put in a blank line before the paragraph. Since you are using blank lines between paragraphs, it looks especially unbalanced having the headers glued to the top of them.</p>
      <p>The rest of it seems to work pretty well. It's certainly a clean look, but if you want it to be distinctive you might want to add more stylistic features.</p>
      <p>I don't think the pull quote works going across two columns like that and the brown is too dark to be a contrast to the black. I'd either stick with black or use a lighter brown or a grey. Also, some structure around the pull quote might help it. The way I usually do them is across a single column with a 5pt stroke top and bottom with the text centred and italicised.</p>
      <p>Page numbers would probably be a good idea.</p>
