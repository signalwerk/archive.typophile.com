    <p>I'm developing an article template for companion articles for my blog.  The blog will include a larger article about once per month.  The blog is a companion to a book I'm hopefully release this year.  I'm trying for a simple and clean look.  It needs to be professional and appeal to my target audience of engineers.  The current design is inspired by the article format of the Harvard Business Review.  </p>
    <p>Any overall feedback would be appreciated.  I'm also wondering if it is too plain or if I need to add a logo somewhere.  The other open question is do I need a running head or foot for an article this short?  Should I at least include page numbers?</p>
    <p>Thank you very much for the help.</p>
    <p>Cheers,<br>
    Zack</p>
    <p>Update:  The previous attachment got lost in the Typophile server change.  The new attachment is working.</p>
