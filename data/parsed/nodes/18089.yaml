      <p>Maybe what Christian is saying gets at the difference between type design and lettering.  In lettering, the entire piece is the end use.  In type design, we are only making tools for some designer or typographer to create the end use.  Bezier letters for a font can be cold, but when put in context and tweaked, colored, and fussed with, they become an end product.  All the "found type" was end product and therefore had character.</p>
      <p>ChrisL</p>
