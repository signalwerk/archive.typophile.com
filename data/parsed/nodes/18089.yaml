    html: |-
      <p>It's interesting to see how everyone is interpreting this stuff. What does everyone think about extending this one into next week? I wouldn't mind having another go at it, and from what people are telling me, it sounds like a lot of people what to jump in, but need some more time. What does everyone think?</p>
      <p>I had a harder time with this one than I thought. I had some troubles taking the warm living stone letters into cold bezier curves. At first I tried to follow the original characters more literally. In particular, I love the wacky variation in stem width. When I aped the same variations in splines, though, it just looked like a bad free font. What looks like character and warmth in stone, just looked tacky when digitized. So I evened out the characters, which I think is working out pretty well in its own right, but it has a totally different soul from the original.</p>
      <p>I think Mark's entry suffers from the same issue. So much of the flavor in that incredible lettering comes in the texture and subtle imperfections. I think they get a little lost in the transition to splines. That being said, sometimes I get stuck designing for the specimen, and not thinking about how designers might use the characters. I think Mark's alphabet could work really well once it is placed back into a context by a designer.</p>
      <p>Dan, if you don't have access to a camera, try flickr. Found type is found type, right? Just cite your source.</p>
    html_clean: |-
