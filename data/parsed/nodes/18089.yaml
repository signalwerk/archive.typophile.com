    html: |-
      <p>Christian, what you're saying about found type is very true. And I agree with your assessment of my attempt. I think I could do better if I spent more time on it, but it may not be possible to really capture the spirit of the original in any case, as you point out.</p>
      <p>When you think about it, type--even digital type--, as a medium, is severely restricted in terms of visual expression. It's just black and white and there are limits on complexity. (This is why I like doing lettering--there are fewer restrictions.) Once you have a font, you can go further, using color, texture, and context to make something visually rich and unique, but a font by itself is limited (not that this is necessarily bad, it just is).</p>
      <p>In any case, it all comes down to interpretation when drawing from any source material--even your own sketches. I remember seeing a piece written by Oswald Cooper (reprinted in U&amp;lc. I think) about the endless ways the same historical typographic source material might be interpreted by a type designer. It will be different for every designer, and each designer may have multiple interpretations.</p>
    html_clean: |-
      <p>Christian, what you're saying about found type is very true. And I agree with your assessment of my attempt. I think I could do better if I spent more time on it, but it may not be possible to really capture the spirit of the original in any case, as you point out.</p>
