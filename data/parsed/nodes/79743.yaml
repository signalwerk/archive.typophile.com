      <p>– I did! See this part of the file:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/key_6272.jpg"></div><br>
      .<br>
      The marked line must be nº 549. The little square is a musical character. Code: F831 (PUA) or 1D147 (SMP 1).<p></p>
      <p>I tried this: I changed the little black squares into an ordinary ASCII char. and saved the file. Whooops – Ukelele does open it! But I wonder: there are many other F8xx or 1Dxxx characters which now seem to cause no problem. At the moment (no further alterations made) the file closed re-opens normally. </p>
      <p>Still don’t quite understand that syntax of the xml file completely.</p>
