    <p>Hi there!</p>
    <p>I'm working on a 120 page catalogue at the moment. Now, the client asked me to replace one of their house fonts (containing all their icons and numbers etc) with a newer version. Unfortunately all the spaces (as in hit the spacebar spaces) have changed. I was wondering if this might be a problem re-exporting the fonts as otf or did someone manually change the space?</p>
    <p>Hope this makes sense.</p>
    <p>Jörg</p>
