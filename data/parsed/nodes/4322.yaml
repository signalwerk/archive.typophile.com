    html: <p>Actually, Richard, Alt + 0165 in a properly made Windows <br>font ought to get you the Yen symbol. While the infinity glyph <br>is part of the MacRoman character set, it is not present in <br>the 255 glyphs of the Basic Latin and Latin 1 Supplement <br><a href="http://www.alanwood.net/demos/ansi.html" target="_blank"> character sets</a> used in Windows fonts. <a href="http://www.alanwood.net/demos/charsetdiffs.html" target="_blank"> This page</a> shows <br>other characters that differ between the two platforms.</p>
    html_clean: <p>Actually, Richard, Alt + 0165 in a properly made Windows <br>font ought to get you the Yen symbol. While the infinity glyph <br>is part of the MacRoman character set, it is not present in <br>the 255 glyphs of the Basic Latin and Latin 1 Supplement <br><a href="http://www.alanwood.net/demos/ansi.html" target="_blank" class="link-external"> character sets</a> used in Windows fonts. <a href="http://www.alanwood.net/demos/charsetdiffs.html" target="_blank" class="link-external"> This page</a> shows <br>other characters that differ between the two platforms.</p>
