  html: |-
    <p>Baseline Font Foundry (<a href="http://www.baselinefonts.com" target="_blank">http://www.baselinefonts.com</a>) fonts are now available for purchase through UnionFonts.com, with several exclusives planned for release Fall 2003. <br> <br>Union Fonts (<a href="http://www.unionfonts.com" target="_blank">http://www.unionfonts.com</a>) is a UK based independent foundry representing designers from all over the world. The foundry aims to be a central resource for designers looking for something different.  <br> <br>Much of their type has never been used by a magazine or multi-national corporation. These are fonts not seen on TV. These are mass-culture virgins. To a designer struggling to make an impact in a world over-saturated with the same old look, this stuff is gold.  <br></p>
