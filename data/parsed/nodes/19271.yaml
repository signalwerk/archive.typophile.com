    html: |-
      <p>Some people like the "Q"s that Luc[as] de Groot makes. The original Caslon Italic has a killer "Q". I like "Q"s where the tail cuts in -and removes- part of the body, like the Italic one here: <a href="http://www.themicrofoundry.com/other/Emerson.gif" title="http://www.themicrofoundry.com/other/Emerson.gif">http://www.themicrofoundry.com/other/Emerson.gif</a></p>
      <p>BTW, if you can get a hold of Rookledge's "Typefinder",<br>
      it has a section towards the end that shows hundreds of<br>
      different variants of each letter, indexed to the fonts.</p>
      <p>hhp</p>
