  html: |-
    <p>I'm trying to identify or find close substitutes for three fonts from a series of computer books from my childhood.  Specifically, I'm interested in the title/heading font, the body text font, and the code font from Compute!'s First Book of Commodore 64.  Pictures follow.</p>
    <p>The heading font, from the cover, chapter heading, and section heading:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/heading_font_3_4641.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/heading_font_2_5278.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/heading_font_1_5943.jpg"></div><p></p>
    <p>The text font, with examples of quotes, numbers and boldface:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/text_font_5264.jpg"></div><p></p>
    <p>The code font, with examples of numbers (note the 0 with the line through it), uppercase and lowercase letters (lowercase code is very rare in this book, and may not even be the same typeface):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/code_font_6084.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/code_font_lc_4927.jpg"></div><p></p>
    <p>I'm particularly interested in the code font, since it's the one that gives me the warmest fuzzies, and also seems to be the hardest to find a substitute for.  Compute! always used a Selectric-like typewriter font for Commodore 64 program listings, and for some reason used uglier dot-matrix-style text for listings for other computers.  I don't know how these books were typeset, but I wouldn't be surprised if the code sections were imaged from the output of the actual machines connected to certain printers (but I could be totally wrong about that).</p>
    <p>Thanks for any assistance you can provide!</p>
    <p>-- Dan</p>
