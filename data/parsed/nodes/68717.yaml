      <p>The font on the cover is "ITC Avant Garde". The chapter headings are in "Antique Olive". I'm not positive on the text but it appears to be "Palatino" (judging from the "P"). The code font seems to be your standard "Courier", though it looks like they might be using a slashed "O" instead of the zero (I think in the version of Courier I have the alternate zero has a dot inside of it, not the slash).</p>
      <p>Hope this helps!</p>
      <p>EDIT: Whoops! Looks like maxgraphic beat me to it.</p>
