    html: <p>The code was probably printed on a daisy wheel printer. Magazines back then usually used a standard daisy wheel for their code. A few even used ribbon print for code samples. A had an Epson with that very same font and I remember doing a copy replace to add a backspace and slash to all the zeros for some reason. I don't know if print wheels had a slash on the zero.</p>
