    <p>Folks,</p>
    <p>My boys at the letterpress museum are putting together a specimen book of all the hand-set metal fonts they own. They have identified all sorts, except this one—it is the last one! Does anyone have any ideas? It will make a lot of retired letterpress enthusiasts very, very happy.</p>
    <p>—K</p>
