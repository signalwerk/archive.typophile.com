    date_raw: 22.Aug.2006 6.00pm
    votes: null
    html: <p>Goudy Cursive was meant to combine with either Goudy Oldstyle Italic or <a href="http://www.myfonts.com/fonts/redrooster/goudy-38-rr/goudy-thirty-eight-rr-light-italic/">Goudy 38 Italic</a>. (Goudy 38 is also called Goudy Oldstyle Light) I digitized this as Goudy Oldstyle Cursive. The Lanston version of Goudy Oldstyle and Oldstyle Bold have all the alternates in the Pro versions of the italic fonts.</p>
