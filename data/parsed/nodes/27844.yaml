      <p>Mac McGrew’s book ’American Metal Typefaces of the Twentieth Century’ shows this as Goudy Cursive too. Says it was designed by him for ATF in 1916, as an expansion of Goudy Italic. The sample in the book appears to show that some of the letters in your posted sample (A, K and N) were alternate characters in the typeface.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
