    html: |-
      <p>Agree with Ryuk on the digital versions. The font was originally cut by Henry Schuenemann for Cleveland in about August 1890 and was sold as Euclid. Nick Curtis mentions the Central Typefoundry. This is also correct as Central and Cleveland often sold each others fonts.<br>
      Euclid would be the correct name to use for all the digital versions.<br>
      Don</p>
