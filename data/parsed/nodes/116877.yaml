    html: |-
      <p>According to an article by Loy in the _Inland Printer_ April 1900 on Schuenemann, he worked for Central before Cleveland and while at Cleveland also cut some fonts for Central. Which may or may not clarify the Central vs. Cleveland origin of Euclid.<br>
      The fancy swash alternate capitals shown in the Dharma Type version are based on the original mortised alternate capitals cut by Schuenemann. They have also been independently digitized by Claude Pelletier as Euclid CP <a href="http://www.dafont.com/euclidcp.font?text=E+U+C+L+I+D+C+P" title="http://www.dafont.com/euclidcp.font?text=E+U+C+L+I+D+C+P">http://www.dafont.com/euclidcp.font?text=E+U+C+L+I+D+C+P</a><br>
      Don</p>
