    html: <p> a couple centuries late - but the 17th century manuscript 'Miracles of Mary" produced at a single scriptorium in Gondar, Ethiopia, is on display in Chicago. A page is turned every 2 weeks for viewing. Not sure if you can really study the rotation online. But the site is www.artic.edu <br> <br>The sheets supposedely still have the scored lines that guided the calligrapher in aligning text - could be intersting. </p>
