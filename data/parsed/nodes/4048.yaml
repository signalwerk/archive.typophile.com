  html: <p> I am currently the Artist in Residence at the University of Wisconsin Stout within their Graphic Design department with a focus on typography. More specifically the handwritten alphabet and it's effect upon typographic construction. I am traveling to Madrid Spain to do research on 13th and 14th century calligraphic manuscripts at the Spanish National library over the holidays. If anyone has any leads on information pertaining to this topic it would be appreciated. <br>thanks, <br>A... </p>
  html_clean: <p> I am currently the Artist in Residence at the University of Wisconsin Stout within their Graphic Design department with a focus on typography. More specifically the handwritten alphabet and it's effect upon typographic construction. I am traveling to Madrid Spain to do research on 13th and 14th century calligraphic manuscripts at the Spanish National library over the holidays. If anyone has any leads on information pertaining to this topic it would be appreciated. <br>thanks, <br>A... </p>
