      <p>This one has been asked <a href="http://www.typophile.com/node/34210" rel="nofollow">before</a>.</p>
      <p>It's the Premier League proprietary font (called Premier League!) and is used on all shirts (not just Everton's).</p>
      <p>It's a custom design by <a href="http://thebrandunion.com/OurWork/CaseStudy/82/RevitalisingAGlobalBrand" rel="nofollow">The Brand Union</a> (possibly when it was still Enterprise IG). Click on the flash and you can see all the letters. Also a very interesting project sketchbook to look at.</p>
      <p>For those who want to take a closer look, see <a href="http://www.premierleague.com/staticFiles/7a/71/0,,12306~94586,00.pdf" rel="nofollow">here</a>.</p>
