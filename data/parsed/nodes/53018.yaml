      <p>This is cool. That 8 is blowing my mind.</p>
      <p>I'd enlarge the period (and dot of exclamation/question marks). </p>
      <p>Of the glyphs that lose the "dimensionality" on some horizontal parts (ESZ25), I think the 5 crossbar misses it most - but shortening it might be all it really needs.</p>
      <p>4's trunk looks too stubby, and 2 seems to be falling rightwards.</p>
