  - id: 322597
    user: 20652
    date: 2009-01-14T13:27:00
    date_raw: 14 Jan 2009 — 1:27pm
    votes: null
    html: |-
      <p>This is really funky. You could even do a shaded version to overlay? I love that K!<br>
      It reminds me of a childhood book, <a class="freelinking external" href="http://www.amazon.com/Adventures-Impossible-Figures-Bruno-Ernst/dp/0906212545" rel="nofollow">Adventures with Impossible Figures</a>.<br>
      In a way it is difficult to critique this as it plays tricks on my eyes.<br>
      So this is to do with the underlying shapes: I think J could be narrower, and the top bowl of B and R smaller. Y should be wider.<br>
      And i think the 3-d needs to be resolved slightly on N, S, and B.<br>
      Hope that's helpful! It's pretty good in every way. Are you going to do lowercase? (Not that it needs lowercase)</p>
