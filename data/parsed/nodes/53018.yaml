      <p>I think V is meant to look that way --- like the ryte half of W. Anyway there is no ryte way or orientation for elements in this font as it defies the rules of perspective and three dimensions.</p>
      <p>Regan—helo and welcome to Typophile. This type design looks to be in the spirit of Roger Penrose's impossible triangle, Moebius strips, M.C. Escher et al.</p>
      <p>j a m e s</p>
