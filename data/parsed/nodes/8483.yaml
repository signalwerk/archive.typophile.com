    date: 2005-01-06T08:55:00
    date_raw: 6 Jan 2005 — 8:55am
    votes: null
    html: <p>On the TYPO-L list last fall, Michele Miller of Chermayeff &amp; Geismar, in a reply to a query about who Wolff Olins hired to make the font, said it was an in-house type designer [at Wolff Olins] working with a design team of four and that the final templates went to Agfa. Type designer Patrick Giasson added that he did the initial typographic development with Adam Throup and Douglas Sellers art directing the project. Further development was done by Mike Abbink. (I gather that Patrick and the others work for various Wolff Olins offices.) Patrick also stated that additional weights, the extended character set and final fonts were done by Agfa Monotype US.</p>
    html_clean: <p>On the TYPO-L list last fall, Michele Miller of Chermayeff &amp; Geismar, in a reply to a query about who Wolff Olins hired to make the font, said it was an in-house type designer [at Wolff Olins] working with a design team of four and that the final templates went to Agfa. Type designer Patrick Giasson added that he did the initial typographic development with Adam Throup and Douglas Sellers art directing the project. Further development was done by Mike Abbink. (I gather that Patrick and the others work for various Wolff Olins offices.) Patrick also stated that additional weights, the extended character set and final fonts were done by Agfa Monotype US.</p>
