    <p>Today's the last day to win a free hoodie from my outfit <a class="freelinking external" href="http://typographyshop.com" rel="nofollow">TypographyShop</a> or take advantage of our hoodie sale. To be eligible simply leave our link somewhere on the web and <a class="freelinking external" href="http://typographyshop.com/win_a_free_shirt.html" rel="nofollow">click here</a> to enter.</p>
    <p>Choose from <a class="freelinking external" href="http://bit.ly/uoqIF8" rel="nofollow">Sans</a>,  <a class="freelinking external" href="http://typographyshop.com/ilovetypography-a-z-unisex-hoodie.html" rel="nofollow">ilovetypography a-z</a> or  <a class="freelinking external" href="http://typographyshop.com/helvetica-unisex-hoodie.html" rel="nofollow">Helvetica Neue Descending a Hoodie</a>.</p>
