      <p>Georg, this typeface design goes back I think to the late 1800's, so it seems very possible that there have been copies of it made by various foundries on both sides of the Atlantic. There were several U.S. foundries with versions of it, why not some German ones as well?</p>
      <p>Agfa had a digital version of the PhotoLettering typeface (1st sample below, from the Serif Guide) called Latin Elongated. The second (lower) sample is from Monotype, called Latin Condensed.</p>
