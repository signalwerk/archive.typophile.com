      <p>They are definitely related to each other. In fact a few of them are practically identical. My understanding is that it was a common practice for metal type founders to imitate popular designs of other foundries, often re-naming the copies. Unfortunately my library is not complete enough to pin down the true origin of this condensed Latin typeface, but my inclination is to believe Jaspert's "Encyclopaedia of Type Faces" that the Stephenson Blake foundry in England was the original source of both the German and American typefaces, even though no year was specified as the origination date.</p>
      <p>Perhaps someone else here, like Mark Simonson, who has a good historical library might be able to shed more light on this. I will look in a few other books I have to see if anything shows up. The closest digital version is <a class="freelinking external" href="http://www.linotype.com/157464/pllatinelongated-font.html" rel="nofollow">PL Latin Elongated</a>, which Linotype states was designed in 1988 by David Quay for Photo Lettering Inc. But we know that it was based on a much older typeface.</p>
      <p>- Mike Yanega</p>
