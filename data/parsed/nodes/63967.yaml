      <p>First of all, I think Mike is right – Latin elongated is the original design. But at that time – late 1800's – "piracy" was most common and a lot of foundries produced commercial highly successful type cuts shamelessly under a new name - as Cristobal has pointed out for this specific case. </p>
      <p>About the names of types ... in my observation from the mid 1850s till about 1910 a lot of foundries tended to organize their products in a kind of families vs the earlier generic denomination. </p>
      <p>So in the specimen I cited, there is the "Schmale Renaissance" but also a "Fette Renaissance", "Renaissance Versalien" and "Renaissance Zierschriften", wich all show different cuts but all have one common element – large, heavy triangular serifs. But very confusingly there is also a "Breite Renaissance" and a "Renaissance-Italienne" with more or less spiky serifes. And last there is a "Skelett-Renaissance" that shows none of the elements of the later known "Skelett" typefaces.</p>
      <p>If anyone has interest in the above mentioned specimen, drop me a line and I will either send via email or post somewhere.</p>
