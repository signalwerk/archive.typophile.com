    html: |-
      <p>Hi there. I started design on what became Playfair, as my first stab at typeface design for Gerard Unger’s class when he was teaching at the Rietveld. That was back in 2008. At that time I knew nothing of Carter’s Miller, only Georgia I did know, and later found out how it was derived from the Miller design (or was it the other way around?). In any event, at that time there was no particular inspiration for my proto-design.</p>
      <p>Where Miller is much closer to the historical ‘scotch romans’, my Playfair is much more of a conglomerate. You can read more about the sources of inspiration on my website, but I did not mention there that also Caslon was an inspiration (eg. the C). What I did do was to think that the large x-height and slightly condensed letter shapes of goût hollandais would probably also be a good idea for a typeface meant primarily for screens, and that I hadn’t seen that done before (not really counting something like ITC Garamond et al.) done in a transitional design.</p>
      <p>So was Playfair inspired by Miller? No is the short answer. If anything, it’s present form was inspired by the original specimens of Caslon, Baskerville, Fry, Miller, and Wilson which I viewed at St. Brides.</p>
    html_clean: |-
