    <p>Beside that you get Open Type, I sometime heard that they improve kerning and letterspacing. But FontShop Sweden dont seem to have a clue about it. Is there anyone who knows?</p>
    <p>Background:<br>
    I got Clarendon from Adobe.<br>
    But its from 1989–91.<br>
    If you buy a new one, is it better kerning? Have they added more kerningpairs etc?</p>
