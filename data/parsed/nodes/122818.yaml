  html: |-
    <p>There is a typeface called "Prismania" by Headliners Inc., which appears to look similar to "Prisma", a typeface available in Mecanorma/Letraset dry lettering catalogue. Also, there seems to be another typeface called "Prismatic" which revived by Mr. Nick Curtis.<br>
    <a href="https://www.myfonts.com/fonts/nicksfonts/pentaprism-nf/" title="https://www.myfonts.com/fonts/nicksfonts/pentaprism-nf/">https://www.myfonts.com/fonts/nicksfonts/pentaprism-nf/</a></p>
    <p>All of them appears to look the same except that Prismania and Prismatic have some alternates and variant designs...<br>
    Curious which one is a knockoff of which?....</p>
    <p>Prisma<br>
    <img src="http://bowfinprintworks.com/LinedFonts/prisma.gif"></p>
    <p>Here is another topic about "Prisma" but the sample posted seems to be slightly different (ie. 7)<br>
    <a href="http://typophile.com/node/84218" title="http://typophile.com/node/84218">http://typophile.com/node/84218</a></p>
    <p>This topic shows some samples of "Prisma" and "Prismania"<br>
    <a href="http://typophile.com/node/80866" title="http://typophile.com/node/80866">http://typophile.com/node/80866</a></p>
