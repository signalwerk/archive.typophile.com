      <p>Prisma was originally designed by Rudolf Koch and first cast by Klingspor in 1931. See the info on Fonts In Use:<br>
      <a href="http://fontsinuse.com/typefaces/7413/prisma" title="http://fontsinuse.com/typefaces/7413/prisma">http://fontsinuse.com/typefaces/7413/prisma</a><br>
