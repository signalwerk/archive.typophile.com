      <p>wolfgang: Such type specimens are hard to find. Due to the two world wars, mostly all German public libraries don't have such old books. So my <a href="http://typophile.com/node/17689" rel="nofollow">two cents</a> try to watch ebay regularly and have some money you don't need.</p>
      <p>My Theinhardt specimen have no date like most of the specimens of this time. It shows also:</p>
      <p>Schmale magere Grotesk<br>
      Enge fette Grotesk<br>
      Fette Grotesk</p>
      <p>Your "Breite-Grotesque" looks very close to the "Halbfette Accidenz-Grotesk" of my specimen. The e and r are a bit different.</p>
      <p>A good place is the special department for type specimens of the <a href="/wiki/Deutsche%20Buecherei" class="freelinking" rel="nofollow">Deutsche Buecherei</a> at Leipzig, Germany. But its not really public. You  have to made an registration first and you should inform what you are looking for in advance. So if you hope to look around, you will get nothing.</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
