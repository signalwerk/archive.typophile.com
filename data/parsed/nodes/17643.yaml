  - id: 160258
    user: 1042
    date: 2006-10-01T15:08:00
    date_raw: 1 Oct 2006 — 3:08pm
    votes: null
    html: |-
      <p><em>John Kane’s book A Type Primer states that you added the oldstyle numbers to AG in 1990.</em></p>
      <p>That is correct. But I only did them for the light weight, Akzidenz Grotesk Mager, and only for in-house use on Berthold’s own stationery. It was never supposed to be released. I think that only happened after Berthold went bankrupt in 1993 and the library was taken over by someone claiming to be the legal successor (there is no legal successor to a bankrupt company, unless they would also take over the liabilities). BTW: We (myself and my colleagues at MetaDesign Mark I and II) designed all the forms, invitations, exhibition stands, brochures and type specimens for Berthold between 1983 and 1993, including the revised logo.</p>
    html_clean: |-
