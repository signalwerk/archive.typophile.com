      <p><cite>Neue Haas Grotesk</cite></p>
      <p>Indeed. I enclose some scans from the first specimen binder, designed by ”Atelier Müller-Brockmann”, no less. It is not dated, but must have been published around 1958. In the next specimen book from Haas, the face is already called Helvetica, available on Linotype machines and has been expanded to Italic and Extended weights. The weights and sizes for Neue Haas Grotesk can be seen on the postcard (haas03.jpg).</p>
      <p>BTW: I wrote that AG Series 57 and 58 were available for Intertype. That is, of course, rubbish. The fonts were made available for Linotype matrices. The fact that my brain hurts now and again could also be the explanation for the fact that <em>I cannot find my Berthold specimen books!</em> All the most precious books are missing. I may have lent them to somebody. You know who you are, so please come forward, I need to research the Akzidenz Grotesk story.</p><div class="imageWrap"><img src="http://typophile.com/files/haas01.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/haas02.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/haas03.jpg"></div><p></p>
