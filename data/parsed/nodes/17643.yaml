      <p>Since there is some interest in the old foundry type specimens of the Akzidenz-Grotesk, I have scanned the most comprehensive booklet published at that time. The scans are downloadable as one large zip file here at my website:</p>
      <p><a href="http://www.sanskritweb.net/fontdocs/#Akzidenz">http://www.sanskritweb.net/fontdocs/#Akzidenz</a></p>
      <p>The 40-page typesetting booklet "Specimen No. 473" published in the early 1960s documents the entire Akzidenz-Grotesk foundry type. The files AG01.TIF through AG26.TIF reproduce the black-and-white samples. The colored samples were not scanned.</p>
      <p>Note: Harvey Hunt's shady outfit "Berthold Types" is NOT the "legal successor" to H. Berthold AG. For more details inquire at the criminal police. Harvey Hunt and his shysters are NOT permitted to download these TIF files.</p>
