      <p><em>Strangely enough Accidenz-Grotesk is presented by both H. Berthold, Berlin and Bauer &amp; Co, Stuttgart.</em></p>
      <p>That is <em>not</em> strange. On 9 November 1897, H. Berthold bought Bauer &amp; Co in Stuttgart.</p>
      <p>In 1896 Berthold decided to release more typefaces for advertising, in the German tradition of narrow, black faces with hardly any descenders. The first one was Carola, a brush face with strong Art Noveau overtones, designed by Heinrich Hoffmann. This was the mother of later designs like Herkules and Herold.<br>
      The anniversary book from 1921 shows Accidenz-Grotesk, simply stating that it was issued in 1898, and that "these days one would perhaps make it look a little more modern", but that all its imitators had never emulated it.<br>
      I have a picture of Berthold’s family tree and should manage to scan it by this weekend.<img src="/sites/default/files/old-images/berthold_accidenz.jpg"></p>
    html_clean: |-
