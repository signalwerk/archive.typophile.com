    html: <p>How many new designs, rather than revivals, since 1904 have introduced new kinds of excellence in roman letters? I can't think of any except Johnson's Underground, Gill's Solus, Lutetia and Romulus, Kennerley, Electra, Scala, and Bloemsma's Legato. Others might add Palatino or Koch Antiqua. Accidenz-Grotesk belongs with them, being the first type with its own kind of excellent plainness, and these designs are always going to be more interesting because more intensely imagined (even if by anonymous workmen) than contemporary riffs on them.</p>
