      <p>&gt; I have a picture of Bertholds family tree and should manage to scan it by this weekend.</p>
      <p>I am looking forward to see this. </p>
      <p>In the meantime to keep the audience entertained, here's another specimen. This specimen doesn't say when it was published, but it must have been the Akzidenz Grotesk at Berthold before the 57 and 58 version, which Uli posted above, was released.<br>
      The typeface of the 57 and 58 seems to be partly based on the version in this specimen.</p>
      <p>Akzidenz Grotesk von Berthold (Probe 429) Akzidenz-Grotesk<br>
      (this specimen is in the Type Museum, London)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AG1.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/AG2.jpg"></div><br>
      The following Typefaces are shown in this specimen:<p></p>
      <p>Akzidenz-Grotesk mager (Royal-Grotesk)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG3.jpg"></div><p></p>
      <p>Akzidenz-Grotesk<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG4.jpg"></div><p></p>
      <p>Akzidenz-Grotesk halbfett<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG5.jpg"></div><p></p>
      <p>Akzidenz-Grotesk fett<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG6.jpg"></div><p></p>
      <p>Akzidenz-Grotesk eng<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG7.jpg"></div><p></p>
      <p>Akzidenz-Grotesk schmal mager<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG7a.jpg"></div><p></p>
      <p>Akzidenz-Grotesk schmal halbfett (Steinschrift eng)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG8.jpg"></div><p></p>
      <p>Akzidenz-Grotesk schmal fett (Buecher-Grotesk halbfett)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG9.jpg"></div><p></p>
      <p>Akzidenz-Grotesk Skelett<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG10.jpg"></div><p></p>
      <p>Akzidenz-Grotesk breit mager<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG11.jpg"></div><p></p>
      <p>Akzidenz-Grotesk breit<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG11a.jpg"></div><p></p>
      <p>Akzidenz-Grotesk breit fett<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG12.jpg"></div><p></p>
      <p>Liliput-Grotesk<br>
      (The picture of the Liliput-Grotesk is much more enlarged, compared to the other pictures.)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AG13a.jpg"></div><p></p>
      <p>And this is what G. G. Lange (the artistic director of Berthold from 1960 until Berthold closed down) said about the different versions (see Typographische Monatsblaetter 2 2003, pp 24-25) (my translation from German):</p>
      <p>Akzidenz-Grotesk mager (Royal-Grotesk):<br>
      'A delicate, light version, which stemmed from 'the punchcutter of the King', Ferdinand Theinhardt. His foundry came to Berthold in 1908. It was always said that this Grotesk was an anonymous design, but now it is clear that it is actually the Theinhardt Grotesk. The Royal-Grotesk was used for printed matter for the King and for scientific printing.<br>
      In addition to this version, Theinhardt also had normal, halbfett [semibold] and fett [bold] ... The Royal-Grotesk was later called Akzidenz Grotesk mager'</p>
      <p>'Whereas the schmale [condensed] Buecher-Grotesk from 1896 is an independent typeface. Later this typeface became Akzidenz-Grotesk schmal fett.'</p>
      <p>'The former Steinschrift became the schmale Akzidenz-Grotesk. ... The Liliput Grotesk in 4 pt was also used for these purposes [security printing]</p>
      <p>BTW:<br>
      G. G. Lange said also in this article (in fact, it was an interview) that Herman Zapf worked on the redesign of the Akzidenz-Grotesk for the Linotype typesetting machine. (Can anyone see any Zapf in the Akzidenz Grotesk?) The version for the Linotype typesetting machine was for the smaller sizes from 6 to 12 pt. The name 57 and 58 is indicating the year of release of the revised Akzidenz-Grotesk.<br>
      I am not sure if this new version is already shown in this specimen. I tend to believe that the specimen uploaded by Uli rather shows this new version with some Zapf in it.</p>
      <p>All in all, Uli's version is much more homogenised than this one. The theory of heterogenous origins for the Akzidenz-Grotesk looks much more plausible in this specimen.</p>
