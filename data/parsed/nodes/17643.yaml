      <p>&gt; So what about the Karl Gerstner version then?</p>
      <p>Gerstner was not an accomplished type designer,<br>
      as one can see when looking at Gerstner Original<br>
      <a href="http://www.bertholdtypes.com/bq_library/90012.html" title="http://www.bertholdtypes.com/bq_library/90012.html">http://www.bertholdtypes.com/bq_library/90012.html</a><br>
      but he was for sure one of the best graphic designers and typographic designers of his time.</p>
      <p>He was obsessed with a systematic approach to design.<br>
      His grid systems were much more flexible<br>
      (and therefore more complicated) than those of most of his fellow designers.<br>
      If you want to see and read Gerstner at his best I recommend his book<br>
      Karl Gerstner: Programme entwerfen  / Designing programmes<br>
      (Its out of print, but sometimes you can find it in antiquarian bookshops.)</p>
      <p>He also worked as a fine artist. His hard-edge paintings were always based on geometric  constructions, and permutation was also quite important for him. </p>
      <p>Being a Swiss typographer he loved Akzidenz Grotesk, whereas Univers was a little bit too smooth and polished for his taste. But he did appreciate the systematic way in which the different weights and widths of Univers were organised: Univers light was 45, regular was 55, semibold was 65. Univers regular italic was 46, and so on - we know it.</p>
      <p>Gerstner took the Akzidenz Grotesk and squeezed it into a similar system like Univers.</p>
      <p>G. G. Lange said in the interview (see Typographische Monatsblaetter 2 2003, pp 24-25) about Gerstners Akzidenz-Grotesk:</p>
      <p>'He let Christian Mengelt design it in his studio, and he started with something entirely wrong: He modified the typeface by stretching it. Therefore the shapes had the usual distorted curves. ... Eventually the typeface was called Gerstner Programm, because it was based on his concept. ... The typeface was not available commercially.'</p>
      <p>An early case of multiple master and automatic slanting without any optical corrections, as it seems</p>
      <p>In Programme entwerfen there is an entirely chapter about Gerstners Akzidenz Grotesk.<br>
      I suppose you can see his version of Akzidenz Grotesk also in this book about Gerstner<br>
      <a href="http://www.amazon.com/gp/product/3775790594/sr=1-2/qid=1139145004/ref=sr_1_2/002-4582731-3599244?%5Fencoding=UTF8" title="http://www.amazon.com/gp/product/3775790594/sr=1-2/qid=1139145004/ref=sr_1_2/002-4582731-3599244?%5Fencoding=UTF8">http://www.amazon.com/gp/product/3775790594/sr=1-2/qid=1139145004/ref=sr...</a><br>
      Unfortunately the latter is set in Gertner Original.</p>
      <p>I do not know whether Gerstner ever intended to publish his version of Akzidenz Grotesk commercially or whether he saw it rather as some sort of experimental design exercise.</p>
    html_clean: |-
