      <p>erik wrote: "was acquired by Berthold in Berlin when they bought another foundry, Pöpplbaum in Vienna" ... </p>
      <p>Pöppelbaum was in 1926. It was the Theinhardt foundry at Berlin, how brought the Royal and the Accidenz to B. in 1908. </p>
      <p>acquisitions and shared acquisitions of B.</p>
      <p>-1897 Bauer &amp; Co, Stuttgart, 100%, Germany<br>
      -1898-1900 Branch St. Petersburg, 100%, Russia<br>
      -1901 Georg Ross &amp; Co. St. Petersburg + new Branch at Moskau, 100% Russia<br>
      -1905 J. H. Rust &amp; Co. Wien, 100%, Austria<br>
      -1907 A. Haase, Prag, 100%<br>
      -1908 Ferdinand Theinhardt GmbH Berlin, 100%, Germany<br>
      -1912 St. Petersbrug Branch of Flinsch (later Bauer), 100%, Russia<br>
      -1917 Emil Gursch Berlin, 100%, Germany<br>
      -1918 Gottfried Böttger, Leipzig, 100%, Germany<br>
      -1918 A. Kahle, Weimar, 100%, Germany<br>
      -1920 Julius Klinkhardt, Leipzig, 100%, Germany<br>
      -1922 C. Kloberg, Leipzig, 100%, Germany<br>
