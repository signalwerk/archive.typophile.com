      <p>The only Theinhardt specimen I found so far is from c. 1895, with a sans serif which looks like an (earlier and therefore a little bit clumsier) proto-version of Akzidenz-Grotesk, but this is not called Royal Grotesk but rather Breite Grotesque. The specimen is in St Bride, London. Probably this is the direct predecessor of Royal-Grotesk and of Akzidenz Grotesk. </p>
