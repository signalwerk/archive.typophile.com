    <p>In <a href="/wiki/Anatomy%20of%20a%20Typeface" class="freelinking" rel="nofollow">Anatomy of a Typeface</a>, A. Lawson says that sometime around the 50s "Berthold reissued the even older <a href="/wiki/Akzidenz%20Grotesk" class="freelinking" rel="nofollow">Akzidenz Grotesk</a>", but there's no date for the original release or the reissuing. I would be very very thankful if someone pointed me to these dates.<br>
    Thank you! :)</p>
