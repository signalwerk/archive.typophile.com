      <p>&gt; All in all, Uli’s version is much more homogenised than this one.</p>
      <p>After comparing "Specimen Nr. 473" more closely with "Hauptprobe Nr. 470", I think that "Specimen Nr. 473" was issued circa 1966. In "Hauptprobe Nr. 470", only "Extrafett" is missing. All other cuts were already available. "Hauptprobe Nr. 470" came out shortly before "Specimen Nr. 473", presumably in the same year.</p>
      <p>Who needs reproductions of the various AG alphabets in very large points sizes, i.e. up to 60 points, should use the German translation of Ben Rosen's "Typos", which was published in 1964 in Ravensburg as "Das große Buch der Druckschriften", edited by Kurt Weidemann.</p>
      <p>I have just uploaded at</p>
      <p><a href="http://www.sanskritweb.net/fontdocs/#Akzidenz">http://www.sanskritweb.net/fontdocs/#Akzidenz</a></p>
      <p>a comprehensive document displaying the *final* versions of Akzidenz-Grotesk published shortly before the bankruptcy of the Berthold stock corporation. Note that these old fonts did not comprise the entire 1252 character set, e.g. Icelandic Eth and Thorn and the currency symbols Cent and Florin were missing in all Berthold fonts.</p>
