      <p>I just got back from some personal time with the copy of <em>Haus Berthold</em> in the Library of Congress. I've just posted some images from the book at <a href="http://www.jpad.biz/pdfs/selections-from-haus-berthold.pdf" rel="nofollow">http://www.jpad.biz/pdfs/selections-from-haus-berthold.pdf</a></p>
      <p>Included are:<br>
      - The Berthold Family tree spread, in full color<br>
      - The short chronology that ends the book (From a photocopy)<br>
      - The AG and Theinhardt pages. (From a photocopy.)</p>
      <p>Please don't ask me questions about the text. I don't know German, so any translation I provide would be extremely bad.</p>
