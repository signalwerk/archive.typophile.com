      <p>wolfgang: Such type specimens are hard to find. Due to the two world wars, mostly all German public libraries don't have such old books. So my <a href="http://typophile.com/node/17689">two cents</a> try to watch ebay regularly and have some money you don't need.</p>
      <p>My Theinhardt specimen have no date like most of the specimens of this time. It shows also:</p>
      <p>Schmale magere Grotesk<br>
      Enge fette Grotesk<br>
      Fette Grotesk</p>
      <p>Your "Breite-Grotesque" looks very close to the "Halbfette Accidenz-Grotesk" of my specimen. The e and r are a bit different.</p>
