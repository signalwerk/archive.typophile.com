      <p><cite>I was wondering if it had been discontinued and then reissued because of the increased demand for Grotesks.</cite></p>
      <p>The demand from the proponents of the <cite>International</cite> or <cite>Swiss</cite> was the reason for them redesigning the series in the late 50s. For the first time, most of the text sizes were coordinated, missing sizes added, and – most importantly – the cooperation with <em>Intertype</em> supplied matrices for machine setting. Don’t forget that Berthold only ever cast founder’s type for handsetting. That was ok for jobbing work (which is what <strong>Akzidenz</strong> meant in a German composing room), but would hardly suffice for timetables, books and other text-heavy jobs that the new style demanded to be set in a sans serif face. And Helvetica appeared the same year as Series 57 (as did Univers), answering the same market demand, itself going back to late 19th-century sources (which Univers did not), like Scheltersche Grotesk (see <a href="http://www.orangeitalic.com/bau.shtml">FFBau</a>) et al.</p>
