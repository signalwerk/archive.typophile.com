      <p>Accidenz (sic) Grotesk was acquired by Berthold in Berlin when they bought another foundry, Pöpplbaum in Vienna. That was 1896 or 1898, depending whether one takes the date of the sale or the release of AG. The original weight was quite light, and Berthold kept adding weights, some of them from other faces, acquired from other foundries. Every foundry had a version of that type of face, more often than not available in a few sizes only. The original series remained quite divers, individual weights showing not much resemblance but name. It was mainly a marketing and naming success. That only changed when they cut (I’m talking foundry type, with some sizes and weights also available on Intertype slug casters)  Series 57, and then Series 58, named for the years of release. These had some sizes (but not all) recut under the direction of Günter Gerhard Lange, who was their (freelance) artistic director at the time. </p>
      <p>I’m writing this from memory at home, 11pm, with no chance to get to my Berthold specimen books. If I remember, I can show some of the versions, e.g. Series 57’s 14pt, which looked totally different from the others, no spur on the a. for example. Lange also had the condensed and bold weights built out for the family, an exercise he had to re-do when Berthold went over to photosetting in the late 60s. Among others, that is when he added the coolest of the AGs: the <strong>Super</strong> weight. But that is another story.</p>
    html_clean: |-
