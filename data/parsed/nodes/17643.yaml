      <p><cite>Akzidenz Grotesk was based on the Royal-Grotesk by Theinhardt.</cite></p>
      <p>As I wrote, various versions of AG came from various sources. Sometimes they took just one size from one foundry and renamed it without changing anything. The first weight was a very light Regular. They picked up a Light and a Medium (Halbfett) along the way. And here, too, the difference between, say, a 9pt, a 12pt and a 14 or 16pt (the German system didn’t know 18pt, but it had 20pt, called Text after the size in Gutenberg’s Bible) was considerable.</p>
      <p>In other words: sorting out which size, weight and version of Akzidenz Grotesk came from which source would be a great topic for a thesis. Berthold may have given some credits, but they weren’t all that interested in revealing all the real sources, as they wanted to present an integrated family under one name, which AG never was, except in marketing terms.</p>
