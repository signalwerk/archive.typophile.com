      <p>I just got back from some personal time with the copy of <em>Haus Berthold</em> in the Library of Congress. I've just posted some images from the book at <a href="http://www.jpad.biz/pdfs/selections-from-haus-berthold.pdf">http://www.jpad.biz/pdfs/selections-from-haus-berthold.pdf</a></p>
      <p>Included are:<br>
      - The Berthold Family tree spread, in full color<br>
      - The short chronology that ends the book (From a photocopy)<br>
      - The AG and Theinhardt pages. (From a photocopy.)</p>
      <p>Please don't ask me questions about the text. I don't know German, so any translation I provide would be extremely bad.</p>
      <p>I've also photographed the entire book, and will be putting together a  digital facsimile soon. Unfortunately I had to shoot the book with an automatic camera under fluorescent light with no flash, so the shutter speed was too slow and some pages are blurry. After I've had time to clean it up in Photoshop and possibly reshoot the pages that didn't come out (I'm taking a mini-tripod next time!) I'll post the entire book.</p>
