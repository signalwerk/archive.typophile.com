      <p><cite>“halbfett” is the German word for bold<br>
      “fett” is black</cite></p>
      <p>Dan, that is actually not true. Halbfett (meaning "half fat") used to be Medium, as in Akzidenz Grotesk Halbfett. AG Fett is Bold and there is no Black, but a Super. Black is a fairly new title, in German the weights used to go from Mager to Normal to Buch to Halbfett to Fett to Extrafett. AG has the Buch (Book) missing, since the Normal (Regular) is heavy enough. Futura has a Buch between Mager (literally: Lean, we stay within the food categories, as suggested by a "weight" classification) and Halbfett, which really isn’t bold at all. They even added a DemiBold, which in German was called Dreiviertelfett (Threequarter Fat) See  <a href="http://www.neufville.com/uk/startfuk.htm" rel="nofollow">neufville</a>.</p>
      <p>But now we have at least 7 weights, so we need numbers, or – best still – our eyes.</p>
