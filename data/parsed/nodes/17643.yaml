      <p>Erik - and what about the Royal-Grotesk by Ferdinand Theinhardt? </p>
      <p>G.G. Lange said in Typographische Monatsblaetter 2 2003 (on page 38)<br>
      that the Akzidenz Grotesk was based on the Royal-Grotesk by Theinhardt.<br>
      According to Lange, in 1908 Theinhardt's foundry was bought by Berthold,<br>
      and so Berthold acquired also the Royal-Grotesk. </p>
      <p>Seemann: Handbuch der Schriftarten shows Royal-Grotesk on page 192<br>
      (it actually has much in common with Akzidenz Grotesk Light),<br>
      and attributes it to Berthold.</p>
      <p>Is the 1899 specimen (shown in Manfred Klein: Type &amp; Typographers) the earliest specimen of the Accidenz Grotesk? Is this already a release by Berthold?<br>
      (And if so, how can Berthold sell the Royal-Grotesk already in 1899 under the name<br>
      Accidenz Grotesk, when they actually bought the Theinhardt foundry in 1908?)</p>
      <p>Was G.G. Lange wrong with his information about Theinhardt?<br>
      Did he get the date - 1908 - wrong, or is there actually no connection<br>
      between Theinhardt and Akzidenz Grotesk?<br>
      (Theinhardt didn't have anything to do with Poppelbaum, I suppose.)</p>
      <p>Are there any specimen of Poppelbaum which show the early Akzidenz Grotesk?</p>
