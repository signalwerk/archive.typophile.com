      <p>"Different weights have different functions (beyond intermixing)"</p>
      <p>That is quite true. I have used the different weights.  I just meant that the weights in AG do not intermix as well as Univers or Frutiger, for example.  This seems to be due to the way AG came about with a mixture of designers, foundries, and time periods.  Univers was designed as a system right from the start by one designer in one era so it makes sense that it would be more successful in mixing weights.</p>
      <p>ChrisL</p>
