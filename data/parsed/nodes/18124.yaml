  html: <p>I'm trying to access the glyph features for Bickham Script Pro using Illustrator v. 10 ( i know! i'm outdated!) i'm having trouble even finding the glyph menu. It doesn't show up as something I can choose when I select the letter I wish to change. Is it not possible with this font?</p>
