    html: <p>InDesign will use the "standard" ligatures if the "ligatures" box is checked, which it is by default. This means that the Mac PST1-standard fi and fl glyphs will be accessed. But if the designer happened to stick ff, ffi, ffl, or any other ligatures to replace programming or mathematic glyphs, InDesign won't recognise them. That's because a ffi ligature inserted in the spot normally taken up by pi - for example - will still be pi as far as InDesign is concerned.</p>
