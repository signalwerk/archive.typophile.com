    votes: null
    html: |-
      <p>AFAIK, Illustrator 10 doesn't support OpenType features or Unicode. Illustrator CS and CS2 do.</p>
      <p>InDesign will recognize ligatures if they have names like "ffi" or "f_f_i" and automatically use them, if they exist in Type 1 fonts and even OpenType fonts that don't have a "liga" feature. Not sure if it works with TrueType fonts, but I would think so. </p>
      <p>NB: If you are making a font, you have to be careful about this. It will work with any ligature, even discretionary ones, if you don't explicitly add the "liga" and "dlig" features. You may end up with st and ct ligatures showing up whether you want them to or not.</p>
