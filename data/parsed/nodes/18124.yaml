    html: |-
      <p>Is that font in OpenType format?</p>
      <p>I mainly use InDesign CS2, and, of course, alternative glyphs can only be employed in OpenType fonts. In InDesign there is a glyph "flyout" menu where you click on an arrow and it displays the alternates.</p>
      <p>Correct me, anyone, if I'm wrong. Because the other day, I wuz working with a PS font and I typed "f" and then "i", and it became the "fi" glyph. Evidently, if a font has those glyphs, InDesign will use them, regardless of whether the font is OpenType or not.</p>
