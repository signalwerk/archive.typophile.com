      <p>I had the most fun a few years ago, with CS and early OS X.<br>
      I needed to use a filter in CS Illustrator.<br>
      Then I saved from CS Illustrator in OS X to Illustrator 8 running in Classic.<br>
      Then saved down from Illustrator 8 to an earlier eps format before importing into my 1994 Fog.<br>
      It required a lot of experimenting with the various Illustrator settings to get it to work.</p>
