      <p>Hi,</p>
      <p>I just found the sollution for your CS2 problem when trying to import eps files created in Illustrator CS2. I can't waith sharing it with the world. Its a bit stupid, but it works fine. Fontographer needs level 1 postscripts to import, CS2 can't make those. Maybe there are other sollutions, but this one could be the one to use when everything else fails.</p>
      <p>You create your vector thingies in CS2. Make your path as simple as it can get (no overlapping and such). Copy it and paste in Photoshop as path. Then you export the path in Photoshop as ai. This ai file is ideal to import in fontographer. No error messages what so ever, not when importing and not when creating the font files.</p>
      <p>I work with windows and fontographer 4.1, but i think this will work on a Mac too.</p>
