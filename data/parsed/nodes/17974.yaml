    <p>Hi all,</p>
    <p>It's my first ever post here on Typophile. Apologies for not presenting me further, but for now my frustration over Fontographer is getting the most attention.</p>
    <p>Problem:<br>
    I can't import EPS-files into Fontographer. When I import it says Syntax Error... I've tried the backwards compability in Illustrator too. I've exported to EPS 3.0, 8, 9, 10 - and still same Syntax error.</p>
    <p>I can't cut &amp; paste Illustrator vectors to Fontographer either...<br>
    It becomes pixel out of the vectors and it put's itself on some kind of invisible layer OR nothing happens at all. The funny thing is that it HAS worked one time...</p>
    <p>Is there some kind of trick I have to pull here to get the vectors from illustrator to Fog?</p>
    <p>Hope anybody can help me.</p>
    <p>I have Illustrator CS1, Fontographer 4.72, OSX 10.4.5</p>
    <p>Thanks in advance and regards from Sweden.</p>
