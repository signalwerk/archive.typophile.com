    <p>Hello<br>
    I use Fontlab for create digital typefaces and when I want to test my font in metrics window I need to type every glyph name and in some scripts (like arabic) it's not easy.<br>
    I need a utility to convert my text (it could be in a PDF) to glyph names of the font used in the text file. I did a comprehensive search and I couldn't find anything useful. is there anything out there that could do such a thing? or maybe convert text to Unicode values so I can convert them to glyph names?</p>
    <p>any suggestions are appreciated,<br>
    Thanks.</p>
