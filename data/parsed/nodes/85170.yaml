    html: |-
      <p>Python dictionaries are indeed fantastic for that type of processing. I have a small Python script, using the FontForge python module, that takes a font as input and produces a dictionary unicode:glyphname that can then be imported to output glyphnames instead of uniXXXX (<code>print charname[ord(char)],</code>). </p>
      <pre>import fontforge,sys
      fnt=fontforge.open(sys.argv[1],1)

      print 'charname = {',
      for g in fnt.glyphs():
         if (g.unicode &gt;= 0x21):
            print "  0x%04X:'%s'," % (
                    g.unicode,g.glyphname)
      print '}'
      </pre>
