    html: |-
      <p>I didn't need the Unicode values, since I was mapping to human-friendly glyph names, not uniXXXX format. So I just had a list of characters and my own corresponding glyph names.</p>
      <p>You could use Word's ToggleCharacterCode function, which converts a character to its Unicode hex value or vice versa (manually, you can do this with alt+X after a character or code). So what you want a macro to do is to step through the text one character at a time and convert each character to its Unicode value preceded by 'uni'. I'm not a good enough programmer to figure out how to do this, but someone here probably is. Note also that you'll want to try to control the length of the Unicode hex, if that is possible, since Word by default does not include preceding 0s; so, for instance, converting 'A' to Unicode hex produces '41' not '0041'.</p>
