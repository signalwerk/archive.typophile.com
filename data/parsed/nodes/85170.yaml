    html: |-
      <p>If you save the following lines </p>
      <pre>import sys, codecs
      infile=codecs.open(sys.argv[1],"r","utf-8")
      text=infile.read(); infile.close()
      for char in text:
         print 'uni%04x ' % (ord(char)),
      </pre><p>to a file named <code>dmptxt.py</code>, then</p>
      <pre>python dmptxt.py file.txt
      </pre><p>will take take a utf8 encoded file <code>file.txt</code> and output the list of corresponding uniXXXX.</p>
