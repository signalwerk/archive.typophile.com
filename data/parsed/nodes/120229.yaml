    <p>Looking to identify the typeface used in the JM (Johns Manville) logo lockup. It looks similar to Frutiger, but alas, it's not. That uppercase “J” breaking below the baseline got me in the right ballpark, but I suspect I'm just missing the obvious. Thanks in advance for any direction / help.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JMBH_C_Blk_5846.jpg"></div><p></p>
    <p>Matt D</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Lucida Sans Bold (manually slanted)        </div>
            </div>
    </div>
