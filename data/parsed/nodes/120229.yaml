      <p>Thanks fvilanakis. I reviewed Lucida Sans Bold as well, and noticed the same inconsistencies. Stroke weights are off for the lowercase v (right side is thinner than specimen), but that might be one cut vs. another. I suspect (and as you mentioned re the manually slanting) that the letterforms have been altered.</p>
      <p>Thanks for the assistance.</p>
