      <p>All letters, except /a &amp; /M looks very close (if not an exact match) to a manually slanted <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype%20%2F%20%28Commercial%29&amp;ffam=Lucida%20Sans%20Std%20-%20Bold&amp;fid=62280376d21c8e58e4020e56533ff067&amp;fstyle=i&amp;fsize=60&amp;text=Johns%20Manville&amp;fit=1" rel="nofollow">Lucida Sans (Bold)</a></strong><br>
      The problem with Lucida is that /a has a curly terminal and /M middle is not touching the baseline.</p>
