    html: |-
      <p>No, I don't believe in bookbinder remarks.<br>
      Its too close inside the printed area and would apear in the printed book atleast. I think the bookbinders around 1800 were professional enough, to avoid this solution and find a better one.</p>
      <p>Can it be, this are remarks for footnotes, which are listed anywhere at the end of the book, explaining or analysing this text part?</p>
      <p>There are to gramar mistakes "...auf diesen kanapee". It should be "...auf dieseM Kanapee" (on this Canapée). But alright, N is Akkusativ, but it must be M = Dativ. But I do not know enough german gramar of the 19th century, sry.</p>
      <p>Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
