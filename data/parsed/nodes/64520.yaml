    html: |-
      <p>It must be some sort of folio numbering, although I cannot recognize the system used.<br>
      If so, the first A-folio contains twelve pages, and the 2nd, B, sixteen pages. Kind of odd -- both are possible, but are generally the same for the larger part of a book. (The decision to print either a 12-page or a 16-page sheet depends on the sheet size and the size of individual pages.)</p>
