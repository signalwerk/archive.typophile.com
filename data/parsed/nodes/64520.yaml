    html: |-
      <p>As Ulrich Stiehl rightly pointed out, these are instructions for the binding, very common in German books from the late 17th –&nbsp;early 19th century. Not only are these extremely common, sometimes they are set even in bigger type than the example.</p>
      <p>By the way, the sample text is from the beginning of Christoph Martin Wieland’s verse epic »Oberon« (1780), and the edition is most certainly from about 1800. The grammar (accusative) is sound –&nbsp;not only for 18th century standards.</p>
