    <p>I was looking through the Google book archive, and found a curious thing:<br>
    Most German books printed in 1800s have the following numeration(?)<br>
    scheme printed at the bottom of the pages. Initially, I assumed those letter and number combination to be binders marks, destined to aid in folding pages. But the irregularity of their appearance seems odd. They always appear on the recto page, never seem to go above 5, and are followed by a varying number of unmarked pages until the next letter is introduced.</p>
    <p>Does anyone have an idea what those are?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/numero_4184.gif"></div><p></p>
    <p>Recto: A<br>
    Verso: Nothing<br>
    Recto: A 2<br>
    Verso: Nothing<br>
    Recto: A 3<br>
    Verso: Nothing<br>
    Recto: A 4<br>
    Verso: Nothing<br>
    Recto: A 5<br>
    Verso: Nothing<br>
    Recto: Nothing<br>
    Verso: Nothing<br>
    Recto: B<br>
    Verso: Nothing<br>
    Recto: B 2<br>
    Verso: Nothing<br>
    Recto: B 3<br>
    Verso: Nothing<br>
    Recto: B 4<br>
    Verso: Nothing<br>
    Recto: B 5<br>
    Verso: Nothing<br>
    Recto: Nothing<br>
    Verso: Nothing<br>
    Recto: Nothing<br>
    Verso: Nothing<br>
    Recto: Nothing<br>
    Verso: Nothing<br>
    Recto: C<br>
    Verso: Nothing<br>
    ...</p>
