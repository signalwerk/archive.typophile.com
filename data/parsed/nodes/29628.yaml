  html: <p>I am creating a transitional serif face and it occurred to me that it was pointless to create an italic and a bold weight of it. Is it normal to create just a Roman/normal weight? Has this been done before (for a commercial face)?</p>
  html_clean: <p>I am creating a transitional serif face and it occurred to me that it was pointless to create an italic and a bold weight of it. Is it normal to create just a Roman/normal weight? Has this been done before (for a commercial face)?</p>
