    date_raw: 19 Nov 2006 — 8:31pm
    votes: null
    html: <p>Just a roman is enough for me. But just wanted to make sure that it wasn't necessary or strange not to have one. Kinda felt obligated.</p>
    html_clean: <p>Just a roman is enough for me. But just wanted to make sure that it wasn't necessary or strange not to have one. Kinda felt obligated.</p>
  - id: 169554
