    date: 2006-11-19T22:37:00
    date_raw: 19 Nov 2006 — 10:37pm
    votes: null
    html: |-
      <p>If your goal is to produce a fully featured text face, sure, you need at least a plain (Roman), bold, italic, and bold italic. Small caps, old style figures, and extended ligature and swash sets in each of those styles are highly desirable.</p>
      <p>Other than that, making a single style is not at all unheard of.</p>
