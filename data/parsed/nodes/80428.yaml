    html: <p>Well, it's pretty obvious that the cursor problem is caused by the HUGE negative value in the bbox. You may be able to track down the errant point/object that's causing this anomaly by selecting the first character in your font (usually the exclamation mark), selecting VIEW &gt; ZOOM &gt; FIT, then stepping through your characters (CMD/CTRL+]). When you hit the offending character, you oughta know it...</p>
