    html: <p>Old style numerals, or “text figures” (<a href="http://en.wikipedia.org/wiki/Text_figures">http://en.wikipedia.org/wiki/Text_figures</a>) are centered on the x-height, with ascenders and descenders, and are made to better flow in lowercase settings.</p>
