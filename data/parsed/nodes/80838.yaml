    <p>Hi everyone!</p>
    <p>I recently finished this font (which I've named Shine) based on a typeface briefly seen in the 20th Century Fox/Blue Sky Studios animated movie 'Robots.'  I assumed the font was only made for the two phrases seen in the film and was not rendered as a complete character set.  Using a few screen shots from the movie I proceeded to draw them all by hand.  Yes, on paper!  Having to design about half the characters myself.  Then scanned them and used my rather primitive (but still much loved) HP Image Zone program to complete them.  </p>
    <p>Note: a better resolution image of the character map can be found here:<br>
    <a href="http://typophile.com/node/94121" title="http://typophile.com/node/94121">http://typophile.com/node/94121</a></p>
