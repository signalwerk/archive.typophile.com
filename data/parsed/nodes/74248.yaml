    html: |-
      <p>Worldwide, Windows XP PCs outnumber all other Windows-equipped machines by two to one, according to the most recent statistics from Web metrics company Net Applications.<br>
      	In August, Windows XP powered 66.7% of the globe's Windows systems that went online in the month, while the three-year-old Vista accounted for 15.3% and 2009's Windows 7 for 17.4%.<br>
      	—computerworld.com</p>
      <p>If Microsoft's new browser is as popular as the company hopes, it may reverse Internet Explorer's (IE) market share slide -- but it might also help to do something that the software giant has been trying unsuccessfully to accomplish for several years -- kill off Windows XP.<br>
      	—internetnews.com</p>
      <p><em><strong>Give up XP and buy a new computer for a browser?! Mozilla and Google must be jumping for joy!</strong></em></p>
      <p>That Microsoft is keeping IE9 exclusive to those running Vista SP2 or higher seems like a foolish move that is likely to inspire millions to find an alternative browser, such as Firefox or Chrome. This could further damage IE's current supremacy of the browser market. All versions of Internet Explorer combined currently dominate with 60.4 percent of the Web browser market. Firefox has 22.93 percent, and Chrome has 7.52 percent.<br>
      	—msnbc.msn.com</p>
      <p>Microsoft has ruled out putting Internet Explorer 9 on Windows XP, leaving millions of PCs open to Mozilla and Google browsers providing hardware-accelerated rich-internet.<br>
      	—theregister.co.uk</p>
