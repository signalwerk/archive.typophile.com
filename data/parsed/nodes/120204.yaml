    html: <p>Agree with Bob that Pottery Barn is probably the closest you could get but I really doubt about it's legitimacy as it looks really too close to Imre Reiner's <a class="freelinking external" href="http://www.myfonts.com/search/corvinus" rel="nofollow">Corvinus Skyline</a>. <a class="freelinking external" href="http://www.myfonts.com/fonts/ortizlopez/ol-corvinus" rel="nofollow">Corvinus</a> OL has the same bottom spurred /V but <a class="freelinking external" href="http://www.myfonts.com/fonts/grouptype/corvinus-skyline" rel="nofollow">Corvinus Skyline</a> AP might be closer to your sample for the overall design. Another point for Corvinus Skyline is 'Pottery Barn' font has most probably been named after furniture company... Well... '<a class="freelinking external" href="http://www.potterybarn.com" rel="nofollow">Pottery Barn</a>' which <a class="freelinking external" href="http://typophile.com/node/12729" rel="nofollow">woodmark has been asked and identified</a> as... <a class="freelinking external" href="http://www.myfonts.com/fonts/grouptype/corvinus-skyline" rel="nofollow">Corvinus Skyline</a>.</p>
