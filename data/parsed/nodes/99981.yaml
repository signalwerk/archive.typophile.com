    <p>Shket is a modern sans serif designed to be used at big point sizes, for example in spread headers or posters. Unlike many of the fonts that are given for free, Shket offers a pretty big charset that will cover many languages and symbols, making it ideal for any design job</p>
    <p><a href="http://fontm.com/shket-font/" rel="nofollow">Download</a></p>
    <p><img src="http://cdn.fontm.com/wp-content/uploads/2013/01/shket-font1.jpg"></p>
