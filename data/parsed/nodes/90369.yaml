    <p>A long-time friend and colleague (Gunnar Swanson*) is writing a<br>
    book about copies/copying, and for the chapter on typeface design<br>
    is looking for coherent and well-articulated opinions. I've already<br>
    pointed him to the pieces by Downer** and Hische*** but I also<br>
    suggested getting broader and deeper with this via Typophile.</p>
    <p>* Among other things:<br>
    <a href="http://books.google.com/books/about/Graphic_design_reading.html?id=XP-CSBfjkywC" title="http://books.google.com/books/about/Graphic_design_reading.html?id=XP-CSBfjkywC">http://books.google.com/books/about/Graphic_design_reading.html?id=XP-CS...</a></p>
    <p>** <a href="http://www.emigre.com/Editorial.php?sect=2&amp;id=1" title="http://www.emigre.com/Editorial.php?sect=2&amp;id=1">http://www.emigre.com/Editorial.php?sect=2&amp;id=1</a></p>
    <p>*** <a href="http://www.jessicahische.is/obsessedwiththeinternet/andbeingresponsivelyinspired/inspiration-vs-imitation-2" title="http://www.jessicahische.is/obsessedwiththeinternet/andbeingresponsivelyinspired/inspiration-vs-imitation-2">http://www.jessicahische.is/obsessedwiththeinternet/andbeingresponsively...</a></p>
    <p>Below are two passages from his emails to me<br>
    that should hopefully guide your contributions.</p>
    <p>"<br>
    Obvious issues include deciding when a typeface is too derivative<br>
    of another face, when tracing or electronic reproduction is kosher<br>
    and why. Type designers' statements about copyright and legal<br>
    issues would be of help, too but how people make personal ethical<br>
    decisions is my main focus.<br>
    "</p>
    <p>"<br>
    It would be interesting to see if anyone has any vaguely objective<br>
    descriptions of what is right/honorable/acceptable regarding<br>
    influence in type design. I know that there's no unanimity about<br>
    any given judgement but I'm not sure that there's even a consistent<br>
    logic on the part of any given individual.<br>
    "</p>
    <p>Fire at will!</p>
    <p>hhp</p>
