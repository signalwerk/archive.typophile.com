      <p>Apart from designing type i do love bicycles. The most common shape for racing bicycles is called a diamond shape. Because the UCI (Union Cycliste International) forbids other frame shapes to keep the sportive competition equal (it would be far better to be that strict concerning doping, but that’s a completely different story), there is only the diamond shape around.<br>
      You could compare this diamond frame to the small letter a. For hundreds of years (not as long in cycling frames building) the skeleton of these two entirely different shapes (or glyphs) remain the same. I have never discovered similar forums of bicycle manufacturers hitting at each other because another manufacturer has copied design features for giving his diamond shape something that he believes would be unique.<br>
      This is certainly not enlightening this thread here, but when i was reading through this weird discussion (<a href="http://fontfeed.com/archives/new-fontfonts-ff-yoga-a-type-system-for-the-new-decade/" title="http://fontfeed.com/archives/new-fontfonts-ff-yoga-a-type-system-for-the-new-decade/">http://fontfeed.com/archives/new-fontfonts-ff-yoga-a-type-system-for-the...</a>) i had to think of this bicycle example. There are many many more in whatever industry. Just my two cents.</p>
