      <p>&gt;&gt;"Inspiration" doesn't always mean derivativeness<br>
      Like how I was inspired by seeing Fertigo to try and make a text font. My font looks nothing like Fertigo, but before Jos put out his font, I was unable to envision anything new being said in a text font.</p>
      <p>When I am designing fonts, I try really hard not to retread old ground. I would never copy outlines, or even retrace from a scan, but when I am using fonts for a project, I feel that I have a right to modify them in any way that my vision demands. As a designer, I keep in mind the maxim of Wally Wood: "Never draw what you can copy, never copy what you can trace, never trace what you can cut and paste." That philosophy goes so against my natural inclinations that it dazzles me. Still, it amazes me that I have often had bosses who were willing to pay me fifty or sixty bucks worth of salary to hand letter a title to look like a font they could have licensed for 19$ (except font licences were not in the budget).</p>
