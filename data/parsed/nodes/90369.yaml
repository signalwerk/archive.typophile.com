      <p>Yes, derivativeness (“inspiration”) and originality are poles of the same spectrum, which is an aspect of authorship.</p>
      <p>Authorship is an evolving cultural concept, like money (I have just been reading <em>The Ascent of Money</em>, which is why I thought of that).</p>
      <p>It is impacted by developments in technology, law, economics, cultural theory, politics (e.g. the role of professional bodies), &amp;c. &amp;c.</p>
