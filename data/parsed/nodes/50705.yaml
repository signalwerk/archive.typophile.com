  html: |-
    <p>Have a client who signed off on a logotype set in PMN Caecilia. Now need to find a suitable companion typeface for text and taglines, and a web equivalent. </p>
    <p>The client runs a large executive placement firm and like things 'clean &amp; modern'.</p>
    <p>Any thoughts?</p>
    <p>Thanks!</p>
