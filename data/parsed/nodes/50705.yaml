  - id: 307320
    user: 3972
    date: 2008-10-20T13:02:00
    date_raw: 20 Oct 2008 — 1:02pm
    votes: null
    html: |-
      <p>I think that putting a member of the Thesis family and PMN Ceacilia in ‘one bed’ could be a bit indelicate. The designers came from the same school and the same influences, but PMN Caecilia is more coherent than TheSerif (formerly known as Thesis Serif). </p>
      <p>For what it’s worth: I have used Caecilia extensively for headlines as well as text (which I preferred slightly compressed, say to 92 or 94%), and have combined it with for instance Metro Sans (Bold) for captions and such, or with Avenir (that has some of that Neo-Humanist quality that Caecilia has too.</p>
      <p>PMS Caecilia is one of my all time favorites, as you might guess : )</p>
      <p>Web equivalent? Not amongst the usual suspects, I am afraid.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
