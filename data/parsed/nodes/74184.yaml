    <p>I am working on a text with some mathematical content, and I can't find a prime mark in Adobe Garamond Premier Pro.</p>
    <p>I have looked for PRIME (U+2032): ′ in the complete glyph set, and the closest I can find is Greek Numeral Sign (U+0374). The prime mark seems to be lacking, but can this really be correct?</p>
    <p>I have also tried to set the prime mark in Times New Roman, using Unicode U+2032 and then change the font to Garamond, but this does not work since the glyph is missing.</p>
    <p>Any help would be appreciated. If it really is missing, I would really appreciate suggestions of how to replace it from some suitable typeface.</p>
    <p>Regards,</p>
    <p>Viktor Grut</p>
