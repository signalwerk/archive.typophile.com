    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GeorgiaHiRes  small_4306.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/VerdanaHiRes small_4904.JPG"></div><p></p>
    <p><strong>Creators of the Original Georgia and Verdana Fonts Collaborate to Expand their Versatility </strong></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has released the <a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?productid=915237" rel="nofollow">Georgia® Pro</a> and <a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?productid=915167" rel="nofollow">Verdana® Pro</a> typeface families, available from <a class="freelinking external" href="http://www.fonts.com/" rel="nofollow">Fonts.com</a>. Originally designed by Matthew Carter 15 years ago and adopted by every major computer operating system, Georgia and Verdana are now available as Pro families. Each comprises 20 weights and features advanced typographic capabilities and extended character sets. </p>
    <p>Carter teamed up with Tom Rickner of Monotype Imaging, who provided technical support on the initial release of Georgia and Verdana in 1996 as fonts for Microsoft's "Core fonts for the Web" pack. The duo collaborated on the new Pro versions with typeface designers David Berlow of Font Bureau, who led the design effort on Verdana Pro, and Steve Matteson of Monotype Imaging, who did the same for Georgia Pro. </p>
    <p>"Georgia and Verdana represented major milestones in the 1990s because they worked so well on screen and were among the first Web-safe fonts," said Allan Haley, director of words and letters at Monotype Imaging. "However, with four fonts each, Georgia and Verdana were limited in their use. The new Pro versions empower these highly legible, tried-and-true designs with newfound typographic versatility, thanks to the addition of several weights and OpenType® features. The new condensed fonts, for example, will be appealing for environments that mandate blocks of text to fit in tight spaces, such as mobile website displays and printed package labels." </p>
    <p>"The new Pro series of Georgia and Verdana are being released at a time that seems particularly auspicious," said Carter. "The design of websites will certainly benefit, and I hope that designers who have long been familiar with Verdana and Georgia will take full advantage of the greater versatility of the Pro series, both on screen and in print." </p>
    <p>New weights for both families include a light, semibold and black, each with matching italics, in addition to new condensed families and complementary italics. All the fonts have been hand-tuned, or hinted, to ensure high legibility on screen, and each of the fonts has an extensive character set to support all Pan European languages, including Greek and Cyrillic. OpenType capabilities include the ability to insert typographic features such as small caps, ligatures and old style figures. The fonts also contain enhanced kerning pair suites. </p>
    <p>"The enhancements to the families are significant — especially in this new age of Web fonts. With the explosion of devices that provide for on-screen reading experiences, these fonts are more relevant than ever," said Matteson, Monotype Imaging's creative type director. "The new weights and styles add to the Web developer's palette for headlines, subheads, captions and pull quotes." </p>
    <p>"The expanded and enhanced Georgia and Verdana families will appeal to many who publish in print and online," said Berlow. "This expansion adds breadth for creative professionals who rely on these two workhorse font families." </p>
    <p>Carter created the original Georgia and Verdana families with legibility in mind — legibility for on-screen applications using low-resolution monitors of the day. Each design shares characteristics conducive to easier reading, such as large x-heights, which refers to the height of lowercase letters, and generous open counters, which concerns the openness of characters such as ‘c' and ‘d.' In addition, Georgia and Verdana include ample letter spacing, the appearance of distinct transitions between the regular and bold weights, and the ability to clearly distinguish characters that often look similar, such as the numeral "1" and letter "l." </p>
    <p>The original Georgia and Verdana fonts differ in their default settings for numerals. While Verdana defaults to lining figures, which rest on the baseline and commonly share the same height as capital letters, Georgia defaults to old style figures, which have varying heights to better harmonize with lowercase characters. With the release of the latest fonts, the new Georgia Pro is now consistent with Verdana Pro, as both use lining figures as their default settings. </p>
    <p><strong>Availability </strong></p>
    <p>The <a class="freelinking external" href="http://www.fonts.com/FindFonts/RecentReleases/2011/GeorgiaVerdana.htm" rel="nofollow">Georgia Pro and Verdana Pro typefaces</a>, available in TrueType® and OpenType formats, may be purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> and <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a>. In addition, the new fonts are available for Web design at <a class="freelinking external" href="http://webfonts.fonts.com/en-USFonts.com " rel="nofollow"> Fonts.com Web Fonts</a>. Georgia Pro and Verdana Pro are also available from Font Bureau and Webtype, Font Bureau's Web font service. </p>
    <p>Customers may contact Monotype Imaging in the U.S. toll-free at 800-424-8973 or in Europe at 44-1737-765959 (U.K.). Linotype may be reached at 49-6172-484-418 (Germany). Customers from other parts of the world may dial 1-781-970-6020 (U.S.). </p>
    <p><strong>About Monotype Imaging </strong></p>
    <p>Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, automotive devices, tablets, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers, page description language interpreters, printer user interface technology and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. Linotype is trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Georgia, Verdana and OpenType are either registered trademarks or trademarks of Microsoft Corp. in the U.S. and/or other countries. TrueType is a registered trademark of Apple Inc. Webtype is a trademark of Webtype LLC. All other trademarks are the property of their respective owners. ©2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
