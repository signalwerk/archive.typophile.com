    html: |-
      <p>More, on the alphabetics:</p>
      <p>- Since this has an element of blackletter in it, I might do things like make the right stem of the "h" descend (and probably turn left instead of right).<br>
      - The "r" is out of character.<br>
      - The "f" is slightly narrow, but the "t" is definitely so.<br>
      - I would encourage you to try a binocular "g", maybe Koch-style.<br>
      - The "s" is leaning forward; instead of shortening the top bar, I might leverage the diagonal part of the spine.<br>
      - I don't think the "v" and "w" are working.<br>
      - The "Q" is da bomb. So is the "z".<br>
      - The "J" needs to go lower, and might benefit from a top half-serif.<br>
      - "p": unless you apply my suggestion of lowering and flipping the right stem of the "h", I would flip its terminal the other way.</p>
      <p>hhp</p>
