      <p>I really like the joins!</p>
      <p>This may be personal preference, but it feels to me that your OSFs ascenders and descenders don't ascend and descend quite enough. If you have a good reason for where they stop then it's not worth quibbling over; otherwise maybe try extending them just a little.</p>
      <p>This begs the question, though: how much should OSFs ascend and descend? I defer to someone with more experience!</p>
