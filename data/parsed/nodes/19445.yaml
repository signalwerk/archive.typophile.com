      <p>Thanks for the feedback.</p>
      <p>&gt;&gt;OSFs ascenders and descenders don’t ascend and descend quite enough<br>
      Somehow, they look out of proporion when they're long. However, I started with really long ascenders and descenders and I think I overcompensated a little when I made the smaller. I'm surre they can be a little longer and still look proportionate.</p>
      <p>&gt;&gt;BTW, great pragmatism in your zero.<br>
      Thanks :). “l” also works nicely with “I” in “Illicit” for example (didn't Matthew carted call these “picket fences”?)</p>
      <p>&gt;&gt;The “Q” is da bomb. So is the “z”.<br>
      “Q” is my favorite. I'm getting a lot of mixed feedback about it though. Binocular g is definitely on my list, along with some alternates and ligatures.</p>
      <p>Thanks</p>
