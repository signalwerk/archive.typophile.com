    <p>My first attempt at designing a typeface. Still in early stage, but ready for a cirt :)</p>
    <p>Partly inspired by City, partly by Briem's Akademi, my goal was to design a display face working with relatively easy, blocky shapes but still challenging myself with Beziers in those curved terminals.</p>
    <p><a href="http://ebukva.cidamon.com/type/" rel="nofollow">http://ebukva.cidamon.com/type/</a></p>
    <p>Any suggestions? Is there any extremely similar typefaces out there?</p>
    <p>P.S. Sorry for linking; I couldn't upload the attachments through the form for some reason. (I'll try to get a pdf up soon)</p>
