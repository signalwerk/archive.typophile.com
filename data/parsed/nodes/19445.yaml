    html: |-
      <p>This is not only sufficiently original, but I think it's<br>
      actually a pretty nice addition to the spectrum as well.</p>
      <p>OS num extenderness: for text fonts I'm a big fan of hybrids, where the bodies are larger than the x-height while the extenders are shorter than in the lc; this strikes the best balance in running text. But for a design like this it might be a better idea to be more "dramatic" (and geometrically congruent) maybe by keeping the bodies small (at the x-height) and making the extenders a bit long.</p>
      <p>BTW, great pragmatism in your zero.</p>
      <p>hhp</p>
