    html: |-
      <p>The specimens tend to be a bit over the top, as they are required to show as many swashes as possible.<br>
      Sure, a lot of typographers got carried away, but there were many lovely examples of flairing.<br>
      Canada Type has done a nice revival of <a href="http://new.myfonts.com/fonts/canadatype/goudy-two-shoes/" rel="nofollow">Goudy Flair.</a></p>
