      <p>Andreas asked:<br>
      <cite>wer entscheidet, welche Schriften beworben werden?</cite><br>
      [Who decides which typefaces are featured?]</p>
      <p>Well, the editorial team, of course!<br>
      As you can tell from the hitherto published articles, there is a focus on local designers and (their) recent releases. But that’s not a strict rule. The <a href="http://www.myfonts.de/2009/07/schlesinger/" rel="nofollow">Schlesinger story</a> that you mentioned is a perfect example that we will also unearth some more historical characters. </p>
      <p>Regarding the tag translation: Very nice! Feel free to <a href="http://www.myfonts.de/infos/kontakt/" rel="nofollow">contact us</a> with your suggestions. </p>
      <p>Thanks,<br>
      Florian</p>
