    <p>The beta site was a well-kept secret for several months (it was a <cite>real</cite> beta site) but now we're live: MyFonts.de is <a class="freelinking external" href="http://www.myfonts.de/" rel="nofollow">here</a>. MyFonts' German-language website is not a copy of the main site – that would require years of work. We've conceived it as a magazine- or blog-like portal to the main site. We'll offer type reviews and case studies, interviews, historical articles and the occasional book or magazine review. We also introduce German-speaking users to the background of MyFonts.com, and explain the workings of services such as WhatTheFont.<br>
    MyFonts.de is a joint venture between myself and designer/co-editor Frank Rausch (also an interface designer, type designer and the author of a smart piece of font-viewing software called <a class="freelinking external" href="http://www.typeshow.net/" rel="nofollow">Type Show</a>). <a class="freelinking external" href="http://florian.hardwig.com/" rel="nofollow">Florian Hardwig</a> is contributing editor. Needless to say, we have the full approval of MyFonts.com. German speakers, do check out our growing German-English tag dictionary (suggestions or additions are very welcome; many thanks to <a class="freelinking external" href="http://http://www.gordoskop.de/" rel="nofollow">Gordon Protz</a>).<br>
    Viel Vergnügen; wir hoffen, dass es Ihnen gefällt. Bitte weitersagen. (=Enjoy!)</p>
