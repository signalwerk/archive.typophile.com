      <p>S A L V E – to those who made this happening. – For this time I am so free to continue in my mother tongue.</p>
      <p>Dieses neue Portal ist ein großer Gewinn! Mit dem denkwürdigen Artikel über Schlesinger ist für mich eine völlige Neuentdeckung verbunden. Die übersetzte Schlagwortdatenbank ist eine feine Sache, ich habe dergleichen leit längerem vermißt. Speziell zu diesem Teil biete ich hiermit meine Mitarbeit an (es gibt in den Übersetzungen noch Wackligkeiten).</p>
      <p>Eine vielleicht etwas heikle Frage: wer entscheidet, welche Schriften beworben werden?</p>
      <p>Gott grüß die Kunst! Andreas Stötzner.</p>
