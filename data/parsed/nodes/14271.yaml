    <p>David John Earls is a graphic designer based in London (a small polluted backwards city in ­western Europe), and the author of <a href="http://www.amazon.com/exec/obidos/ASIN/2880466997/qid=1122764626/sr=2-1/ref=pd_bbs_b_2_1/104-0906691-9954329" target="new" rel="nofollow">Designing Typefaces</a>, a book published by RotoVision. He considers it a personal quest to persuade owners of his book to burn its detestable dust jacket.</p>
    <p>In 1999, David Earls founded <a href="/wiki/Typographer.org" class="freelinking" rel="nofollow">Typographer.org</a>, which has since that time offered impartial and non-commercial writing on matters type. He sometimes designs typefaces for his own enjoyment, but considers himself to be very much an amateur with a great deal to learn.</p>
