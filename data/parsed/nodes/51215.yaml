      <p>I find that when I look at it, although I don’t get the feeling that it’s 100% done yet, I think it works.</p>
      <p>The first thing that popped into my head is a sheet music book my sister used to have, Chopin and others I think.</p>
      <p>You certainly communicated something with class, something musical and also something that’s current.  Those are all what you seem to be going for, just finish up the details and I think you’ll be golden!</p>
      <p>EDIT: ah, and I got that it was a staff because of the number (5) of lines, I’m not sure you need more than that, but I do find the ends of the lines too abrupt. a tapering of the lines at the end might soften them and make them feel more calligraphic.  Just my 2¢</p>
