      <p>utt73-</p>
      <p>those are beautiful. I’m not sure of your level rose, but this might be a pretty good idea for a direction. I think the design you have is too static. Also, maybe try another typeface. I think you might want a lighter face, possibly script face?. it’s just that now, the lines of the “staff” and the lines of “CORO” are practically the same width. Think contrast in scale.</p>
      <p>Also, just one small thought about the staff, it doesn’t read musical staff yet. Because it’s wavy...it reminds me more of water...or the more obvious...waves ;) Maybe add the end vertical bars at the end? (The thick and thin lines that are at the end of the sheet music.) Again..,just a thought, but ya know :D</p>
      <p>courtney</p>
