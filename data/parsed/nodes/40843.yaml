      <p>albriks<br>
      I had about 2 1/2 years working for Saul Bass. He had a big staff of designers that submitted work to him for approval and he usually<br>
      picked a simple solution and was a great teacher. His film work was not a financial success; especially with clients like Otto Preminger.  He created a whole industry for motion picture title design. I even acted in commercials for him. Probably the biggest project I worked on was the film titles for "Mad, Mad, Mad, World". There were 24 actors that had 100% billing and had to be the same size, but different type faces. I remember doing the credits on an Easter Sunday. He was associated with the famous film maker Haskell Wexler and Saul was able to direct the cinema photography as well as the graphics. It was a creative experience I'll never forget!</p>
