    <p>I received the CD on Helvetica and was surprised that there were a few inaccuracies in the story of the development of the Helvetica family. There wasn't any information about the first release of the Helvetica family which contained some of the Anzeigen Grotesk fonts and the competition of families such as Folio. When I worked with Saul Bass he preferred the Folio series over the first release of Helvetica. The official type face for the city of West Berlin was the Akzidenz Grotesk Buch  designed by G.G. Lange for Berthold and not Helvetica. The Neue Helvetica was shown and not mentioned as a remake by Linotype.<br>
    Having lived during that period of early Helvetica and worked with both Bauer, Berthold and Stempel I was aware of the competition and the maketing. The first typographer in the USA to put in the Helvetica was Spartan Typographers in Oakland, California and the fame of Helvetica from there. If you run across the original showing can see a hodge podge of fonts.</p>
    <p>I LIKED THE FILM</p>
