    date_raw: 22 Oct 2004 — 10:31am
    votes: null
    html: <p>I think it looks quite nice already. <br>I like the idea of 'connecting' a horizontal stroke to a vertical one. Maybe you should try implementing this kind of connection into more letters. The conventional script-y connection adds confusion to letter-pairs like 'ui', 'wn' and 'um'. Another possibilty is to <i>not</i> connect some letters. <br> <br>There are some inconsistencies regarding the horizontal proportions (widths). Lowercase 'e', for example, looks too wide. <br> <br>Another observation. In 'q', 'y' and 'g', the two bowls touch each other. I think you should have some more space between the bowls.</p>
    html_clean: <p>I think it looks quite nice already. <br>I like the idea of 'connecting' a horizontal stroke to a vertical one. Maybe you should try implementing this kind of connection into more letters. The conventional script-y connection adds confusion to letter-pairs like 'ui', 'wn' and 'um'. Another possibilty is to <i>not</i> connect some letters. <br> <br>There are some inconsistencies regarding the horizontal proportions (widths). Lowercase 'e', for example, looks too wide. <br> <br>Another observation. In 'q', 'y' and 'g', the two bowls touch each other. I think you should have some more space between the bowls.</p>
  - id: 49855
    user: 1975
    date: 2004-10-22T13:30:00
    date_raw: 22 Oct 2004 — 1:30pm
    votes: null
    html: "<p>I also see a problem with your <b>g</b> vs. your <b>q</b>: The bottom loop on cursive <b>q</b> goes around the other  <br>way. I don't think the lack of an ear on the <b>g</b> would be enough to disambiguate <b>guilt</b> and <b>quilt</b>.</p>"
