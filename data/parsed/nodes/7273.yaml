  html: "<p>This is my first attempt at a serious typeface, and  here is my first \"draft\". It still needs a lot of overall polishing, but i'm having a very hard time with some of the letterforms, in particular: v,s,z,r,e and x.  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/51724.gif\" alt=\"monolinear font\"> <br> <br>Opinions and suggestions will be very welcome.</p>"
