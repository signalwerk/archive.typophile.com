    html: <p>good points, both of you. <br> <br>my problem with both c and e is incorporating the connector into the letter, as opposed to the extra loop in most letters. when put next to a non-connecting letter (v and r in the previous example, it does look too wide.) <br> <br><img src="http://www.typophile.com/forums/messages/29/51877.gif" alt="centered"></p>
