  html: |-
    <p>The Goudy International Center for Font Technology and Aesthetics is the first worldwide independent resource center for dissemination of information about type, its history, development, and its use in documents, and is housed in the School of Printing Management and Sciences at <a href="/node/add/wiki?edit%5Btitle%5D=RIT" title="Create node &quot;RIT&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Rochester Institute of Technology</a>. The Center offers courses addressing a broad range of technical, aesthetic, historic, and legal aspects of alphabets and typefaces, including those from both Western and non-Western cultures, as well as offering courses focused on the typography and design of documents. A major area of concern in the Center’s courses and research is the development of multicultural document creation&nbsp;skills.</p>
    <p><a href="http://www.rit.edu/~goudyctr/">http://www.rit.edu/~goudyctr/</a></p>
