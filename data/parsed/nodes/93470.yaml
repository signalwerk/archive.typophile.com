    html: |-
      <p><em>Automated methods of hinting and spacing/kerning may also be considered robotic font-making.</em></p>
      <p>However, if we’re talking about robotic fonts, then a kerning app, whether stand-alone, incorporated in font production software, or in a layout app (InDesign’s “Optical” kerning) doesn’t make the font robotic. </p>
      <p>What’s different about OpenType fonts that perform contextual substitutions is that they respond to the text they’re setting—a feedback loop, a little AI, and it’s that imitation of human decision-making behavior that we associate with robots.</p>
      <p>This concerns the argument whether fonts are software or just data.</p>
