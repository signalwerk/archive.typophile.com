      <blockquote><p>Automated methods of hinting and spacing/kerning may also be considered robotic font-making.</p></blockquote>
      <p>Robotics is most often implemented as a means of reduced labour, and this is implicit in the origin of the word. As such, FontStruct as a font creation engine is a prime example of robotic type design, automating and reducing elements of the design process while imposing restrictions and limiting factors on what can be achieved. Parametric type design systems can also reduce the labour of the font creator in similar ways but with very different and less limiting results. Of course the human engineering, programming and labour involved in creating these constructs to begin with is enormous.</p>
    html_clean: |-
