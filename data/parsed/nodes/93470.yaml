      <p>Ironically, the most robotic fonts are those “smart” fonts which imitate expert calligraphy with Contextual and Swash OpenType features.</p>
      <p>Another genre of robotic fonts is the pseudo-random script, which is actually not really suspposed to be random, but to mimic the irregularities of hand-made writing and lettering.</p>
      <p>A primer:<br>
      <a href="http://ilovetypography.com/2011/04/01/engaging-contextuality/" title="http://ilovetypography.com/2011/04/01/engaging-contextuality/">http://ilovetypography.com/2011/04/01/engaging-contextuality/</a></p>
      <p>Automated methods of hinting and spacing/kerning may also be considered robotic font-making.</p>
