    <p>I am gingerly searching for help to expand my tried and true font vocabulary. One project in particular, interests me. </p>
    <p>The story involves a team of robots that are not your "Transformer" (mean, warlike) types but not "Rollie Pollie Ollie" either.   Everything from "Iron Giant", to "Johnny 5-0", to "iRobot" solve this challenge differently.</p>
    <p>Any faces the guru's here might add to a list of type-faces that frame this "spectrum" between, from warlike to infantile, first-shooter warrior villain robots to the ever-cuddly but futuristic Wall-e (and his girlfriend – way sexy and modernly futuristic)?  </p>
    <p>I hope I'm being helpful.  I think it could be a fun list to build top to bottom. I'd have to say even Pixar strikes me as a candidate, because that animated mascot Lamp is so lifelike – and thus, a robot of sorts.</p>
    <p>Thanks :)</p>
