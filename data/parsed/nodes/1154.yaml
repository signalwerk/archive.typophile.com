  html: <p>la idea es transformar al tipico peroo vago chileno que abunda por las calles de santiago en una atraccion turistica, el proyecto va dirigido a los turistas y sera aplicado en souvenires  <br> <br>the idea is to transform the typical chilean tramp dog (that you meet in every place in Santiago) into a turist atraction, the proyect points to the tourists and the logo will be applied on souvenirs  <br> <br></p>
