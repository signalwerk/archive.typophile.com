    html: <p>Why do you need to choose? I would do 3 variations and alternate them on the applications. As long as the type treatment is consistent, you will not have a problem with branding. Version 2 looks as if he is peeing on the T. Was that the intention? He looks quite guilty. Very funny. <br> <br>Seriously though, I would do 3 different variations of the doggy interacting with the type. Maybe with one he is licking the Q! <br> <br>Be careful with scale also. He seems a little large in relation to the type.</p>
