      <p>Lucida is more a brand than a typeface:<br>
      <a href="http://new.myfonts.com/search/lucida/" title="http://new.myfonts.com/search/lucida/">http://new.myfonts.com/search/lucida/</a></p>
      <p>That said, if you need a fairly modern sans serif, Lucida Sans could work pretty well.<br>
      Lucida Grande, on the other hand, isn't practical for print mostly because it lacks an italic.</p>
