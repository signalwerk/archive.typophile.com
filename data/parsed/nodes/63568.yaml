  html: |-
    <p>As far as I am aware, Lucida Grande was developed screen use (correct?). My question is:</p>
    <p>How acceptable would it be to use Lucida Grande (or something from the same family) for print (as opposed to screen)?</p>
    <p>And/or</p>
    <p>What are some similar alternatives that work well in print?</p>
