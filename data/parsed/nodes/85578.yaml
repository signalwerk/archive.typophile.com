      <p>Hi Sam,</p>
      <p>The closest match I can see is:<br>
      <strong>Century751 SeBd BT [Semi Bold]</strong> - Copyright 1990-1999 Bitstream Inc.<br>
      <a href="http://new.myfonts.com/fonts/bitstream/century-751/semi-bold/characters.html" title="http://new.myfonts.com/fonts/bitstream/century-751/semi-bold/characters.html">http://new.myfonts.com/fonts/bitstream/century-751/semi-bold/characters....</a><br>
      Is a bit lighter than your sample, but maybe there is also a Bold version.</p>
      <p><strong>EDIT</strong>: Maybe this one is a closer match:<br>
      <strong>Century751 No2 BT [Bold]</strong><br>
      <a href="http://new.myfonts.com/fonts/bitstream/century-751/no-2-bold/" title="http://new.myfonts.com/fonts/bitstream/century-751/no-2-bold/">http://new.myfonts.com/fonts/bitstream/century-751/no-2-bold/</a></p>
      <p>..and for the italic:<br>
      <strong>Century751 SeBd BT [Semi Bold Italic]</strong> - Copyright 1990-1999 Bitstream Inc.<br>
      <a href="http://new.myfonts.com/fonts/bitstream/century-751/semi-bold-italic/characters.html" title="http://new.myfonts.com/fonts/bitstream/century-751/semi-bold-italic/characters.html">http://new.myfonts.com/fonts/bitstream/century-751/semi-bold-italic/char...</a></p>
      <p><strong>Century751 No2 BT [Bold Italic]</strong> -  Copyright 1990-1999 Bitstream Inc.<br>
      <a href="http://new.myfonts.com/fonts/bitstream/century-751/no-2-bold-italic/characters.html" title="http://new.myfonts.com/fonts/bitstream/century-751/no-2-bold-italic/characters.html">http://new.myfonts.com/fonts/bitstream/century-751/no-2-bold-italic/char...</a></p>
      <p>An interesting detail is that both italic typefaces have the single story italic g<br>
      while the regular version is not!</p>
      <p>Fivos</p>
      <p>PS: I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
