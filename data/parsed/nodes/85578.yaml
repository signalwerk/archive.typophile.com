  html: |-
    <p>Hello all,</p>
    <p>This is from Pantheon paperback edition of <em>Hopscotch</em> by Julio Cortázar, published in 1966. I cannot for the life of me, etc etc. The designers at Knopf guessed it was Primer, and most likely set in metal. My scan is from a reprint, so allow for thickening of everything. You can still see some of the remnants of a medium-to-high contrast face.</p>
    <p>I seem to be unable to attach or upload, so please go here to see the scan: <a href="http://www.sampottsinc.com/H/hopscotch_text_face_F.jpg" title="http://www.sampottsinc.com/H/hopscotch_text_face_F.jpg">http://www.sampottsinc.com/H/hopscotch_text_face_F.jpg</a></p>
    <p>I've highlighted some of the things that make this unusual (to me at least): the Century-like tail of the R with old-style figures, an unkerned f and a longish and quite vertical tail to the y. The italic is wide and certainly not of the Century style, and the single-story italic g throws me.</p>
    <p>My best guess is that it's derived from a Zapf face, perhaps some rounder, more classical kind of Melior. Or something that was an imitation of Caledonia, maybe (if it's odd, it might be Dwiggins, as they say).</p>
    <p>Thanks! </p>
    <p>Sam</p>
    <p>[The save Attachment error is<br>
    An HTTP error 0 occurred.<br>
    /upload/js<br>
    with latest Flash player installed]</p>
