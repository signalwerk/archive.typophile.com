    <p>I'm looking for some suggestions for a font.</p>
    <p>I've roughed out a logo concept using the font "Yanone Kaffeesatz."</p>
    <p><a href="http://www.yanone.de/typedesign/kaffeesatz/" title="http://www.yanone.de/typedesign/kaffeesatz/">http://www.yanone.de/typedesign/kaffeesatz/</a></p>
    <p>I'd like to find some fonts that are similar in shape to Yanone (humanist, condensed, san-serif, rounded, with multiple weights), but maybe have some more distinct characteristics. Yanone is a great font, but it just feels a bit "vanilla" for my purposes.</p>
    <p>Any thoughts?</p>
