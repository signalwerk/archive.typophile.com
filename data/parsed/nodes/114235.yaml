  html: |-
    <p>Hi all,<br>
    I'm working on a farm to table restaurant design. But it will be more than a restaurant, with packaging and food products down the line.<br>
    I'm looking for a slab serif that has some light, somewhat feminine qualities. The brand I'm working on has a light feel to it, and I don't want to use a thick slab to move in on that.</p>
    <p>I know lots of designers deride archer as overused, but it's still stands up.</p>
    <p>Just wondering if anyone knows of a slab serif that has multiple weights that could have similar qualities.</p>
  html_clean: |-
    <p>Hi all,<br>
    I'm working on a farm to table restaurant design. But it will be more than a restaurant, with packaging and food products down the line.<br>
    I'm looking for a slab serif that has some light, somewhat feminine qualities. The brand I'm working on has a light feel to it, and I don't want to use a thick slab to move in on that.</p>
    <p>I know lots of designers deride archer as overused, but it's still stands up.</p>
    <p>Just wondering if anyone knows of a slab serif that has multiple weights that could have similar qualities.</p>
