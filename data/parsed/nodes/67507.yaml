    html: |-
      <p>You can use any suffix you want. These aren't normally seen by the user, and don't affect how the font behaves. You want to use something that makes sense to you.</p>
      <p>Adobe suggests using feature tags as suffixes, but nothing bad will happen if you don't follow this recommendation provided the base glyph (i.e. the part before any suffixes) is correctly named.</p>
      <p>André</p>
