    html: |-
      <p>I'm not sure why only ordinal masculine and ordinal feminine are given (well, likely a backwards-compatibility issue), because even in Spanish it's possible to have something other than º or ª:</p>
      <p>Officially, when used with numbers they should always go after a period (DPHD: numerales: 1).  In practice, they might not, and visually I think it's best to kern them pretty much directly over the period, or even better, combine them such that the period appears more as a combining underdot.</p>
      <p>The most common endings are -o and -a, but they can also be used in the plural, -os and -as.  Additionally, primero and tercero (and all ordinals that end with them) have an apocoptic singular form -er.</p>
      <p>They're not just used on numbers though, and are often found in abbreviations, most especially Mª for María.  But I've seen hrmn^os for "hermanos" amongst others.  (edit: unlike French, in Spanish they should become capital in all, though limitations in computer typography make this less common in day-to-day typing)</p>
      <p>My ultimate recommendation is to make a good superscript variant and place the o and a from that into the º and ª of the regular, since that covers you for other languages that might have even more complex forms.  Opentype coding to place the dot(s) is just a superficial nicety.</p>
    html_clean: |-
