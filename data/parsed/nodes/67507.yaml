      <p>&gt;&gt;&gt;What, a through z? Wow.</p>
      <p>And A through Z. But not really wow as they are all based squarely on a series of mathematical transformations of the originals to achieve thickness, y-position and additional spacing on either side. Some designers also give the glyphs a bit of a stretch in the x-direction too but there are only so many hours in the day.</p>
      <p>Incidentally, my lower case superiors have a slightly bigger x-height relative to the caps superiors compared with the original upper and lower case.</p>
      <p>You also get some very particular and thorough designers who add accented superiors so as not to disappoint, for example, continental European users.</p>
