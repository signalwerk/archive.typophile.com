      <p>Hi Nick,<br>
      I don´t know if that is now usefull for you...<br>
      The ordinals feminine and masculine are part of the written Spanish language.<br>
      1º means first masculine (primero), 2ª means second feminine (segunda), and so on: Piso 34º = 34th Floor. You have to work with all the numbers that would need kerning<br>
      If your font has only caps or caps and small caps you can use the caps as ordinals.<br>
      When has upper and lowercase than your ordinals should be lowercase.<br>
      The old fashion is to underscore the ordinals.<br>
      But you can also eliminate the underscore.<br>
      I am working with a Caps/Small caps alphabet and I send you a sample of the matter.<br>
      Regards, Luis<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Ordinales_4799.gif"></div><p></p>
