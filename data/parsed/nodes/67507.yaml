    html: "<p>Nick: (Speaking strictly about Spanish) Underscore is seen too, but I think, without much basis in actual knowledge, that's an English influence to it.  In handwriting one doesn't place a mark under it nearly as much as much as we do in English.  But, for the record doing it 1.º with the º being underlined is seen in the standards as an option (explicitly contrasted with 1.º without an underline).  But that just looks too busy for my taste.  The dot satisfies the \"correctness\" [insert smirking mock] and the visual nicety.  Now what would be really fancy is to have the long over-tilde for abbreviations that went out of fashion about 150-250 years ago on inscriptions.  But OT isn't great for variable-letter diacritics.</p>"
