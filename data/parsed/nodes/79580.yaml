    html: "<p>John, I think you are over-analysing the situation, and I don't think the complexities of differing religious viewpoints -- even ignoring the likely high percentage of agnostics and atheists among British Linux tweeters -- are especially relevant. The proposal here is to change a letter in a writing system, part of the cultural heritage of many millions of people, to a letter borrowed from another writing system, part of the cultural heritage of many millions of other people, because of an <em>unfounded</em> belief that the letter prompts suicidal thoughts because of an association with the shape of the confluence of some rivers of which the majority of readers are unaware and which, if one looks at a map, the letter K doesn't actually look that much like. This belief has nothing to do with Hinduism: it is an idiosyncratic obsession of one man.</p>"
