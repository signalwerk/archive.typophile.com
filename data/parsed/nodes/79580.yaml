    html: |-
      <p>There was in a few of the above comments. It may not be excusable, but it is not surprising either. But many of the comments quoted didn't involve racial or religious insults, yet they were all given as examples:</p>
      <p>"We're _too short of decent free font designers. Please stop trying to drive them off"</p>
      <p>"You are offtopic, please do not continue this thread here."</p>
      <p>Weasel word racists?</p>
      <p>I want to avoid being rude to him myself, but I do want him to somehow understand that the rationale he gives for his proposed reform will not appear to have any validity whatever to people here - and, thus, when he advances such a reform on such a rationale, and gives every appearance of expecting other people to take it seriously, he will be regarded as less than intelligent and less than rational.</p>
      <p>It may be that a cultural factor is contributing to the misunderstanding.</p>
      <p>Incidentally, his use of a Sansqrit letter was because it was what he had handy, as a placeholder. But instead of designing a new letter, there is a much simpler way to achieve what he wishes.</p>
      <p>Simply use the letter Q to replace the 11th letter of the alphabet. And where Q is currently used, replace QU by CW, which is a combination not in use. That way, there would be no cwestion about which words are intended. Of course, languages other than English might need a different spelling reform.</p>
