    html: |-
      <p>@John Hudson:<br>
      It is true that, as far as I am aware, no other Hindus have felt the need to advocate reform of the Latin alphabet. Thus, even when A. C. Bhaktivedanta Swami Prabhupada was alive, <em>Back to Godhead</em> magazine was typeset in plain old ordinary Times Roman with no alterations to the characters.</p>
      <p>My "over-analysis", though, had one specific purpose - to reach that one man. The issue about Hinduism being syncretistic has nothing to do with the alphabet reform <em>per se</em>, it has to do with why the response to the proposal is so dismissive and even derisive.</p>
      <p>Because it is true that it is natural in Hinduism to take the legends in the scriptures of non-Hindu religions more seriously than it is normal in Christianity to take the content of non-Christian faiths seriously. If he is aware of this cultural fact, then he will be less surprised at not being taken seriously, and less likely to attribute the disinterest he encounters to causes such as racism.</p>
