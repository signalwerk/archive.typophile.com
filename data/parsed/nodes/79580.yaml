    html: |-
      <p>Derision does not help to promote dialogue and understanding.</p>
      <p>But it is necessary to understand <em>why</em> little else but derision is the reaction to your recommendation concerning the shape of the 11th letter in the Latin alphabet.</p>
      <p>Your stated reason for changing the letter is that its current shape promotes suicidal thoughts because it resembles a junction of rivers where a famous battle between Gods took place, as recorded in Hindu scriptures.</p>
      <p>The overwhelming majority of users of the Latin alphabet are not believing members of the Hindu faith. So, to them, this is <strong>not a reason</strong>.</p>
      <p>Latin alphabet users are usually Christians; Christianity takes a different view of other faiths than Hinduism does. Hinduism is <em>syncretistic</em>; that is, if the Muslims say that an angel came down and spoke to Muhammad, or the Jews say that God parted the Red Sea so that their ancestors could escape slavery in Egypt, Hindus generally don't feel a need to say that these things didn't actually happen.</p>
      <p>The view taken by Christianity (and related religions such as Judaism and Islam) towards other faiths is very different. They believe that their holy books are the <em>sole and exhaustive</em> record of all interactions between humanity and the Divine.</p>
      <p>If it isn't in the Bible, it didn't happen.</p>
      <p>Outside the Bible, of course, most of the purely natural events of human history took place. Possibly black magic, done by Satan and his demons, could also occasionally take place - some Christians believe this to be possible, others do not accept this as a possibility Christians should accept.</p>
      <p>So anything miraculous that is not in the Bible, or that doesn't promote Christianity (or, before Christ, Judaism) - since some Christian faiths do accept the idea of their present-day saints performing miracles in addition to those recorded in the Bible - is either something that never happened, but was simply a made-up human legend, or it was an example of the dark powers of the demons of Hell.</p>
      <p>Other religions may teach people to respect their parents, to be faithful to their spouses, not to steal or do violence. But in no other religions but their own is the presence and power of God made manifest.</p>
      <p>So the traditions of Hinduism say there is something wrong with the shape of the 11th letter of our alphabet. Since we are not ourselves Hindus, and since our own religious outlook is the opposite of syncretistic, we do not consider the teachings of the Hindu faith to have the kind of value - as accurate history, or authentic revelation - to be in any way useful as a source of new information, in addition to that which we have from reason, that could serve as a guide to action.</p>
      <p>Since, therefore, people here see <em>absolutely no reason whatsoever</em> to exert the slightest effort to change the forms of their alphabet, but you present your proposed change in a way that implies that it's obvious that we should see the merit in this idea, they wonder why you can't see what's obvious to them - that your rationale for this change has no substance.</p>
      <p>@Té Rowan:<br>
      The foregoing may address your point somewhat as well.</p>
      <p>Because Hinduism is a syncretistic faith, Hindus have no problem in believing that Jesus might have been a genuine Avatar, and worked genuine miracles. And, so, while they wouldn't convert to Christianity because of it, they might well accept that Christian scriptures also contain some real messages from God - and so they might accept, for example, the new information that the number 666 is unlucky, instead of reacting the way <em>we</em> do to things from other faiths - if it isn't our religion, it's purely human superstition, nothing more.</p>
