      <p>John, remember that part of the offending cross-section of rivers is <em>invisible</em>. I wonder how many more symbols ought to be outlawed because of Evil Invisible rivers.</p>
      <p>As for outright outlawing the entire concept of "the letter K" -- what about the Greenlandic kra? What about the Greek Kappa, and the Cyrillic Ka? The Cherokee character tso?</p>
      <p>What about characters that are not a K but share the same evil characteristics? (Well, sort of -- who can tell, given that some of these characteristics are invisible): X, Y, R, F, H ... B, P, Q, W (oh my god they might all be evil!)</p>
      <p>What about fonts where the letter K does <em>not</em> consist of straight lines: Brush Script, for example, or Arnold Boecklin, or Park Avenue?</p>
