      <p>Some Christians (of which I am not) might well decide in their narrowmindedness that the swinging stroke in U+0915 stands for <em>The</em> Serpent, and the whole glyph therefore stands for the Triumph of Evil.</p>
      <p>As far as I'm concerned, U+0915 and U+004B are no more and no less evil than any other glyph anywhere else, with no need to replace one with the other. To be good/evil, you must be sapient and able to tell the difference between good and evil. Said difference is a variable, not a constant.</p>
      <p>In practice, there is also inertia. 'K' is perfectly adequate, so why change? Same with the nagari glyph, U+0915. Why change what works when there is nothing (obvious) to gain?</p>
