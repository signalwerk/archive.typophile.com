    date_raw: 11 Apr 2009 — 3:06am
    votes: null
    html: |-
      <p>But certainly some sort of space is gonna work better in the long run than none at all. Consider whether any of the notes will run to more than one line: are you going to do a hanging indent? If yes, that would support the space. Might there ever be two footnotes on one page? Asterisk &amp; dagger aren't <em>necessarily</em> going to have the same width so some tab-based space would then make sense to line up the text of both notes. If you were doing numbered footnotes, they'd certainly have a space!<br>
      ________________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
