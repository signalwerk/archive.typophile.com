      <p>&gt; Might there ever be two footnotes on one page?</p>
      <p>I've done scholarly notes, with up to 20 on a page (at worst). Those would be numbered notes, however. </p>
      <p>For symbol notes, there is a progression of about six symbols (asterisk, dagger, double dagger, section mark, paragraph mark ... ??? my mind is foggy, perhaps someone else will clarify.) I believe the rule is that if you pass the six, you start to double asterisk, etc. (But over six notes on a page and you really should be using numbered notes. )</p>
