    html: "<p> Jonathan,  <br> <br>I echo Hrant's comments. Looks like the 'f' does <br>descend, but try another pixel. I really enjoy <br>the tapering terminals (f, p, K, R). It gives <br>the thing a nice blackletter feel without <br>sacrificing legibility. Very nice start. <br> <br>One more idea: drop the script tails on the  <br>numerals. I'm not sure they need to be a part  <br>of a connected line. <br> <br>Stephen </p>"
