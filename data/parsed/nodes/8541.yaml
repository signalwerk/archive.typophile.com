    html: <p>Fun. It reminds me of Matthew Bardram's  <br>Scriptometer (with a larger cap height?).  <br> <br>I was skeptical of Scriptometer at first but  <br>actually grew quite fond of it. (In the  <br><a href="http://typophile.com/articles/bardram" target="_top">Bardram interview</a> here.) <br> <br>As to Hrant's suggestion for alternates-- <br>although it might add some depth to the face,  <br>I'm not convinced it's necessary. <br> <br>I agree with Stephen about the numerals. <br> <br>//joe</p>
