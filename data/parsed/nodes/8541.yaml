    date_raw: 11 Dec 2001 — 2:10pm
    votes: null
    html: <p> I would agree with everything that's been posted so far. <br> <br>On the lc "s", why not experiment with even more of a cursive form, dropping the upper loop altogether and widening the lower one? <br> <br>Regarding that lc "g", I like the look of the elongated lower loop, but it does stand out from the other glyphs. I think Hrant's suggestion to vertically condense the lower loop by a pixel is a good one. <br> <br>The only other suggestion I have is to check the "M" and "N", as well as the "U", "V" and "W". When set together, these characters seem to be running in to each other a bit, causing some legibility problems. Perhaps adjusting the script connectors somehow would help, or maybe a pixel of kerning added to these letter combinations.... <br> <br>It strikes me that these forms would make an interesting vector-based font as well. Nice work. </p>
    html_clean: <p> I would agree with everything that's been posted so far. <br> <br>On the lc "s", why not experiment with even more of a cursive form, dropping the upper loop altogether and widening the lower one? <br> <br>Regarding that lc "g", I like the look of the elongated lower loop, but it does stand out from the other glyphs. I think Hrant's suggestion to vertically condense the lower loop by a pixel is a good one. <br> <br>The only other suggestion I have is to check the "M" and "N", as well as the "U", "V" and "W". When set together, these characters seem to be running in to each other a bit, causing some legibility problems. Perhaps adjusting the script connectors somehow would help, or maybe a pixel of kerning added to these letter combinations.... <br> <br>It strikes me that these forms would make an interesting vector-based font as well. Nice work. </p>
