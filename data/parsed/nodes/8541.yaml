    votes: null
    html: <p> Getting nicer, indeed. <br> <br>The new lc "g" (as well as lc "f" and "j") is really nice. <br> <br>The uc "M" and "N" are much improved, but the uc "U", "V" and "W" (with the connectors activated, anyway) still read like one long piece of hard ribbon candy. (Mmmmm, hard ribbon candy....!) I guess it's sort of the point of the connectors, and I must admit, the connectors most probably wouldn't be used with this combination in the caps all that often, but it still might warrant one more look. <br> <br>And if that's the only criticism I can come up with on second draft, I'd say you're on to something here. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> Very nice. <br> <br>David </p>
