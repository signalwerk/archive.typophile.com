    html: <p>Nice ! I'm actually listening to your set on the website. I attend Mutek shows every year but I didn't have the chance to see you performing. <br> <br>Now, about the logo... <br> <br>To answer your original question, I contacted a friend of mine that is working on the graphic design for Mutek 2004 (probably not the whole thing, but a part of it). He then asked his boss who said that he slightly changed the logo himself last year... not using a font but using a grid. I agree with you that the logo always looked like that, but I believe that there have been some minor changes. <br> <br>But again, I don't know who is the original designer. He/She might have been inspired by a font.</p>
