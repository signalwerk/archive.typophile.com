    html: "<p>Mutek (Music, Sound and New Technologies) is a Montreal based festival. They also do international events and release cd compilations. <br> <br>You can have some info here : <a href=\"http://www.mutek.ca/\" target=\"_blank\">http://www.mutek.ca/</a> <br> <br>Regarding this logo, I believe that it's not made from a font. It was originaly created a couple years ago by a local designer and has been very slightly modified every year using a special grid. <br> <br>It may be inspired form a font, but I can't say which one. <br> <br>I'm not 100% sure about this answer. I hope someone will be able do confirm what I say. <br> <br>Good luck, <br> <br>jf</p>"
