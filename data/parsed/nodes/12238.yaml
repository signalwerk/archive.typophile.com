    <p>I just found <a href="http://www.apple.com/downloads/macosx/dashboard/typecast.html">this type widget</a> on Apple’s widgets download area. I’ve used it a little bit, and it’s quite nice. It responds quickly and gives you a nice area to check out your type as you want to, check out the basic character set, and go to the font file itself, which is nice.</p>
    <p>Here’s an example of the typing preview (notice the lack of kerning) and an example of the character set preview:</p>
