    html: |-
      <p>Best would do it by hand, but you could approximate it by:</p>
      <p> - posterizing the photo (to reduce the colors used and to provide areas of flat color)<br>
       - reduce the resolution using nearest neighbor interpolation.<br>
       - increase the resolution back up using nearest neighbor interpolation</p>
      <p>You'd then have to go in to add the 'grout' between the pixels and tweak things (specifically, giving the image the black outline).</p>
