    <p>GURU<br>
    NT Guru is a multiple layered typeface especially designed for display use. To create beautiful typographic designs the possibilities are endless by using layers and colors. A beautiful set of arrows and multiple language support makes Guru complete for any unique and ornamental design.<br>
    Available on July 15th 2013 via the website.<br>
    <a href="http://www.novotypo.nl" title="www.novotypo.nl">www.novotypo.nl</a><br>
    Nt Guru is a set of 5 fonts designed by Novo Typo (typo)graphic designers from Amsterdam - The Netherlands.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Guru-01_3780.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-02_5143.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-03_4959.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-04_6486.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-05_4456.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-06_5266.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-07_6707.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-08_3693.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-09_4372.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-10_6192.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Guru-11_5116.jpg"></div><p></p>
