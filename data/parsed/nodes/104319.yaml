    <p>GURU<br>
    NT Guru is a multiple layered typeface especially designed for display use. To create beautiful typographic designs the possibilities are endless by using layers and colors. A beautiful set of arrows and multiple language support makes Guru complete for any unique and ornamental design.<br>
    Available on July 15th 2013 via the website.<br><a href="http://www.novotypo.nl">www.novotypo.nl</a><br>
    Nt Guru is a set of 5 fonts designed by Novo Typo (typo)graphic designers from Amsterdam - The Netherlands.<br><img src="/sites/default/files/old-images/Guru-01_3780.jpg][img:sites/default/files/old-images/Guru-02_5143.jpg][img:sites/default/files/old-images/Guru-03_4959.jpg][img:sites/default/files/old-images/Guru-04_6486.jpg][img:sites/default/files/old-images/Guru-05_4456.jpg][img:sites/default/files/old-images/Guru-06_5266.jpg][img:sites/default/files/old-images/Guru-07_6707.jpg][img:sites/default/files/old-images/Guru-08_3693.jpg][img:sites/default/files/old-images/Guru-09_4372.jpg][img:sites/default/files/old-images/Guru-10_6192.jpg][img:sites/default/files/old-images/Guru-11_5116.jpg"></p>
