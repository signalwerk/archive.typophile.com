  html: |-
    <p>I'm in the proces of designing a logo for an exclusive handmade leather bag brand. The logo must contain 'wings' and the name 'soesah'. The client is looking for a minimal approach so this is what I came up with. Geometric but still kind of organic.</p>
    <p>I would very much appreciate your feedback, primarily on the DIN inspired custom lettering. Furthermore do you have any suggestions regarding the mark / logotype composition?</p>
    <p>I know logotype is not yet properly kerned. This is because I first want to deal deal with the things above. :-)</p>
    <p>Thanks!</p>
    <p><img src="/sites/default/files/old-images/logo_3781.jpg"></p>
