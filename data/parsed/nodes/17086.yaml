    html: |-
      <p>That makes sense. This field in the OpenType Names panel relates to name table ID 18:</p>
      <p><code>Compatible Full (Macintosh only); On the Macintosh, the menu name is constructed using the FOND resource. This usually matches the Full Name. If you want the name of the font to appear differently than the Full Name, you can insert the Compatible Full Name in ID 18.</code></p>
      <p>It is OpenType related insofar as it was added in the OT specification, and was not previously part of the TT spec.</p>
