    <p>I have 8 OT fonts that have been divided into two 4 font families to work in non OT applications. (Regular, Bold, Italic, Bold Italic) On the Windows side they appear as expected, two Family names in the font menu, and style linked correctly. On the Mac side the 4 roman font appear in the menu under their Full Names. I have followed <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2843">Adam’s naming advice</a>, but cannot get the WIndows style naming to appear on the Mac.</p>
    <p>Suggestions?</p>
    <p>James</p>
