    html: <p>Not at all. It is rather a simple solution, but I have always misunderstood the Mac Names field in the OpenType Names panel in FontLab. Mark Simonson’s comments made me realize that that particular field had no relationship to OT (I always thought it did). Since MS Word reads The “short” Family name along with the style, I just made sure that Mac Names field was filled in with the exact same info. That coupled with Adam’s naming tips and everything works fine. More of a relief than a breakthrough. Thanks for the insight Mark.</p>
