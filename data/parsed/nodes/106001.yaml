    html: <p>Have you tried putting the lookups under the 'DFLT' script tag? This might make a difference for Uniscribe apps such as MS Word, although I have not tested this. Layout engines normally determine how to process glyphs in a run based first on their cmap entries; in the case of PUA codepoints, there doesn't seem to be any standard about how OTL processing is expected to proceed.</p>
