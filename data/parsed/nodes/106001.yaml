    html: <p>Thanks, John.  I gave that a try and didn't observe anything different.  I haven't seen anything in the documentation that singles out PUA glyphs but it hasn't been an exhaustive reading, either.  I checked the cmap entries (via ttx) and the glyph is present for both Mac and Windows.  It seems that it doesn't work on the in Word for Windows, either.  Hmmm.</p>
