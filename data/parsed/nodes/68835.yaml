    <p>I've been looking for a Scotch for some time to be my all-around workhouse face, but I haven't been able to choose between Miller, Chronicle, and Ingeborg. I need something that would look good at 11 or 12 pt.</p>
    <p>Here are my thoughts: Miller is absolutely lovely to me, great numerals, great italic, great punctuation, but had the ill fortune of being born too soon (pre-Opentype era), so it has certain lacks. Chronicle is executed amazingly, but comes off--to my eyes, anyway--almost over-refined (and bland in comparison with Miller). Ingeborg is intriguing, but I haven't seen it in print anywhere (and it's the most expensive).</p>
    <p>Advice?</p>
