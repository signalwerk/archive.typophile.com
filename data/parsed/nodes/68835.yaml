      <p>Ingeborg is <em>not</em> a Scotch Roman. It is, however, an absolutely splendid typeface, and I'd buy it anyway if I were you.</p>
      <p>If you are absolutely set on having a Scotch Roman, then Nick's Scotch Modern is one of the most authentic. I think of Miller and Chronicle more as ‘inspired-by’ than true Scotches (H&amp;FJ describe Chronicle, amusingly, as a ‘blendid Scotch’): they update the style for contemporary tastes, notably in reducing the stroke contrast. They're both very nice types, and Miller is largely responsible for reviving interest in the genre, but whether it is appropriate depends on how much you want to evoke the full on spiky look of a page of Victorian typesetting.</p>
      <p>[Nick, I think you should market Scotch Modern as ‘The single malt of Scotch Romans’.]</p>
