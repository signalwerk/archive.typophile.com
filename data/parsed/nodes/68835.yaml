      <p>John — As Nick hints at, you’re conflating the Scotch Roman style with the Scotch branch of Victorian moderns, which came to be known as Scotch (without the Roman qualifier).</p>
      <p>Matthew once chastised me for the same mistake: <em>“I would not refer to the types cut by Austin for Miller as "Moderns." Scotch Roman was really a warmer reaction against the more rigorous Moderns.”</em></p>
      <p>Ironically, the appellation “Scotch Roman” doesn’t actually attach to this style until it is imported to America by the foundry of A. D. Farmer &amp; Sons in 1903. </p>
      <p>Later adaptations blended with other modern strains and dropped the "Roman." Another branch fed into designs like Century and Caledonia.</p>
      <p>The nomenclature and taxonomy are a bit confusing.</p>
