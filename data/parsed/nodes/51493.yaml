      <p>I have a lot of trouble with "juxtaposing the old with the new." A look at <cite>Art of the Printed Book</cite> should show the reasons I think this . . .</p>
      <p>Or maybe you mean post-2000 as "the new," which would leave me out of it. I think of Richard Eckersley as "new" &amp; "modern," but he liked a longer, skinny page, while still preserving somewhat classical margins. Still, I suppose he's a 1990s designer.<br>
      . . .</p>
      <p>I will say that there are a few sans fonts that hold up for text even to my old-fashioned eyes. One is TheSans, which oddly enough pairs nicely with TheSerif, unlike many of the other serif/sans pairs (Quadraat &amp; Scala to mention two where either the sans or the serif is quite nice, but somehow don't pair all that well).</p>
      <p>FWIW</p>
