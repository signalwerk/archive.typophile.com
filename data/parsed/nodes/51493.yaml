      <p>&gt;&gt; <em>I am acutely aware—I rail about it often-how sans type for long stretches of body text is irritating to the eye and done to death these days. Still, I’m considering it.</em></p>
      <p>Go for it. I think the claim that sans serifs aren't as legible as serifs is based on nothing. Especially with the evolvement of the concept sans serif typeface. There are tons of very legible sans serifs specifically designed for longer stretches of body text. Like FF Milo and FF Kievit, to name two from the top of my head. I've set whole books with those, and it works fine.</p>
      <p>And then theres always the typefaces that sit somewhere in between, like the excellent <a class="freelinking external" href="http://www.farhill.nl/01_typefaces/versa.html}" rel="nofollow">Versa</a> (used very succesfully in the book Dutch Type, for example. Which is a book with quite hefty pieces of text).</p>
      <p>I wouldn't let myself be restrained by such conventions, as long as you use a typeface that is designed for text.</p>
