    html: <p>Although you say square pages with much negative space are contemporary, I also see a variety of page sizes with smaller margins and a great deal of modularity. By saying juxtapose I think contrast rather than complement. Not knowing the subject I would consider approaching it by including a classic golden page within a larger page, and look to type that conflates and or updates features associated with the period you are considering. Maybe keep the type rigidly authentic, and let the page geometry unfold in a way that has a wink.</p>
