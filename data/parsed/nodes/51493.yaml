    <p>Of course, this is not a new subject to typographers, much less type designers. But it's the first time in a long time that I've consciously given thought to it. I'm presented with a book that gives me the opportunity to play off the "oldness" of its subjects with the contemporary nature of its presentation: photos, computer typesetting, an ages-old issue discussed anew.</p>
    <p>So, without asking for specific recommendations--<em>I'm not</em>--what about the avenues I might use to demonstrate this. For instance, there's the page size and dimension:  <em>the</em> classic proportion: the golden pean, for the text area. But a big square page which lots of negative space, as is modern day preference. Old types and new types is obvious, I guess.</p>
    <p>And also, possibly, the reversal of display and body text type--sans for text and serif for display. Now, about the latter: I am acutely aware--I rail about it often-how sans type for long stretches of body text is irritating to the eye and done to death these days. Still, I'm considering it.</p>
    <p>What other areas of the page design offer the opportunity for this kind of contrast?</p>
