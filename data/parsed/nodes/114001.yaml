    <p></p><div class="imageWrap"><img src="http://typophile.com/files/identify_6647.jpg"></div><p></p>
    <p>The top looks like it could be Nimbus Sans, but I feel like it is a little wider, unless it is stretched.</p>
    <p>The bottom looks almost identical to Helvetica Neue UltraLight but it appears to be a different font-weight...too thin to be Light and too thick to be Ultralight? :s Maybe it's stroked?</p>
