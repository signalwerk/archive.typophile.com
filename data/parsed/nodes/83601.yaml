      <p>If you could mean Neutraface No. 2 then <a href="http://new.myfonts.com/fonts/marksimonson/proxima-nova/">Proxima Nova</a> from Mark Simonson is available as a web font.</p>
      <p>Kabel or Futura are also geometric and have the pointed vertex letters.</p>
      <p>- Mike Yanega</p>
