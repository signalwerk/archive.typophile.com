      <p>Thank you for giving the issue your attention.</p>
      <p>First, I want to get your mind cleared of any unintentional prejudice you may have. </p>
      <p><em>Question:</em><br>
      Why do people have freedom to make fonts that represent combinations of Latin characters using Fraktur and Gaelic glyphs?</p>
      <p><em>Possible answers:</em><br>
      They too are 'Latin' shapes; they do not have their own code pages; they are European languages; they are not as radically different from generally perceived Latin text though Latin Alphabet has only capitals and only 22 letters.</p>
      <p><em>Here's the long answer to your question:</em><br>
      First, I cannot personally launch another Korean Mess for Singhala. The officials in Sri Lanka are personally benefiting from the Unicode Sinhala implementation. I live in US and went back there (after 15 years) and found them understandably hardened on opposition.</p>
      <p>There is no earthly reason for Singhala to have its own code page. (May be for ET when we annihilate ourselves).  Besides, the benefits of romanizing far, far outweighs the lame objections.</p>
      <p>It is not compatible with Sanskrit and Pali because it takes two scipt-ligatures (not font ligatures) as base letters: U+0DA5 and U+0DA5. -- This issue completely invalidates the code page. I have counted 22 such ligatures. There are three other contracted letter shapes that combine iteratively with consonants. </p>
      <p>Singhala is spoken and written intermixed with Sanskrit. All Sanskrit words are subject to orthographic ligatures. Although you can type some, you cannot do meaningful text processing in it. When it comes to complex Sanskrit language ligatures, many cannot be constructed. This is like an electric typewriter with dead keys enhanced for the computer better functaionality and impossible to use keylayouts. Unicode constrains you to its limitations. We are in the digital age! The era of letterpress printing is over when we had to adjust to what the lead type limited you to. I was a printer 40 years ago ad know this.</p>
      <p>The consonant shapes shown are not of consonants but Consonant plus 'a' vowel. (ka, kha, ga, gha etc.). The grammar (vyAkaraNa) tells clearly what is a vowel and what is a consonant and what is a phoneme and what is a letter shape. Just because the consonant carries a vowel indicater flag on it does not make it a composite letter. (i with a dot is not a composite).</p>
      <p>Each vowel, long and short has two code points, one for the stand alone shape and another for combining marks ('sign'). This makes text processing extremely hard to program if not impossible (I think the latter). This is not a language solution, it is for typing.</p>
      <p>Check out this page and see how efficient romanized Singhala is: ( read the JavaScript in the coding):<br>
      <a class="freelinking external" href="http://www.lovatasinhala.com/restrict/liyanna-e.php" rel="nofollow">Some conversion functions</a></p>
      <p>I have many things done with this. One is this project to dig out Pali and Polish form <a href="http://www.metta.lk" title="www.metta.lk">www.metta.lk</a> web site maintained by a Danish Buddhist monk. He did a monumental work of digitizing ancient Pali, but with hack fonts. You may call my Singhala font one such too but the romanized Singhala is the thing that is doing the magic:<br>
      <a class="freelinking external" href="http://ahangama.com/rs/" rel="nofollow">Tripitaka demo</a></p>
      <p>Last November I discovered moths eating up books in Colombo museum. (They did not all0w me to see books in the Archive).</p>
