      <div class="comment-spam-body"><p>Thank you Michel.</p>
      <p>You can almost read it. But discover what you'll see if you go to any page like the following, newspaper site which is in  Unicode Singhala.<br>
      <a class="freelinking external" href="http://divaina.com/" rel="nofollow">A Singhala newspaper web site</a></p>
      <p>Now understand that this is phonetic writing. That means taday there is technology to record speech and instantly transmit it and convert it into text! (Who would want to do such a thing?).</p>
      <p>All Indian languages have this <em>same</em> behavior. Singhala is perhaps the most complex of all of them where the orthography is concerned.</p>
      </div>
