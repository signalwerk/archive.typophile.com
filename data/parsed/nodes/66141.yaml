      <p>The Palatino Linotype one looks like it is an afterthought, like a diacritic pasted on top of the letterforms, although it’s not too bad on the lowercase e. I can understand why it sticks out to the left of the lowercase a, but it would have been better to properly incorporate it with the inside of the serif. On the uppercase i it’s oddly off center, but seems okay on the lowercase i.</p>
      <p>The URW Palladio ogonek looks like it was taken from Verdana or some other sans serif font. It’s totally out of place. It looks especially weird on both upper and lowercase i, it should have been visually centered instead.</p>
      <p>The ogonek of URW Palladio L is particularly vile with its foreign shape and poking out to the left. It’s also far too small, and far too spindly. Easily missed in reading.</p>
      <p>Has anyone else noticed that the ogonek in TeX Pagella seems to be a tweaked chunk of the terminal of the lowercase a? It’s nicely long and dark, easily seen. It needs a little bit more work, but I like it.</p>
      <p>The Palatino Nova ogonek looks spindly and weak, out of proportion with the heaviness of the stems. It also looks pasted on, or rather tacked on the edge. The juncture between it and the letterforms is too thin, which is what seems to be causing this. Also, the angle of departure is very narrow, and doesn’t harmonize with the pen angle elsewhere.</p>
      <p>Although I don’t read Polish, I do work with Tlingit and the Athabaskan languages where the ogonek (U+0328) is frequently used in various orthographies to represent nasalized vowels. Unlike in Polish, in the Athabaskan languages it can occur on all five orthographic vowels: ą (U+0105), į (U+012F), ų (U+0173), ę (U+0119), ǫ (U+01EB). Also unlike Polish, it often occurs with acute and grave accents, for example ę́ (U+0119 U+0301). Since long vowels are usually represented with pairs of letters, it’s common to see sequences like ę́ę́ and ǫ́ǫ́. A particularly nasty problem is with į́ (U+012F U+0301) or į̀ (U+012F U+0300), where the tittle is never properly removed. To get this to work one usually must abuse the dotless ı (U+0131) like so: ı̨́ (U+0131 U+0328 U+0301). Of course none of this will display correctly here given the typically lousy state of support for such characters.</p>
    html_clean: |-
