      <p>Christopher, I see what you mean with the right-angle thing, but I'm not sure I agree. In the "A" and "a" the idea was to tilt/lift the serif, like a foot, off the baseline, which makes it flat on top and slanted on the bottom (and then let that slant extend into the ogonek); the serif isn't being distorted or enlarged, it's just flipped.<br>
      The situation in the "E" is different in that the structure of the base glyph is not changed with the addition of the ogonek (which does bother me a bit).</p>
