      <p>No opposition, thus:<br>
      altaira - thank you for engagement in making good ogoneks!<br>
      hrant - "maybe you agree, they're already very good!" yes; this is talk about polishing/perfecting the font. (polishing = making the font appropriate to use in Polish language;)</p>
      <p>- "make the ogonek itself more rounded" yes, to be in a mood with the design of letter e.<br>
      I want to start with designing the ogonek matching the principles of the letter e and "letting the ogonek «grow» organically out of the base glyph" (small e). Next step is conecting the ogonek to the remaining letters. Again Adam Twardoch's words: "As ogonek is a glyph modifier and it should be integrated smoothly, you will be usually forced to separately design the area where ogonek merges with all base letters."<br>
      - "does it actually seem like a good idea, in principle, to have that hard corner between the edge of the base "E" and the ogonek?" Yes, in my opinion.<br>
      - "letting the ogonek «grow» organically out of the base glyph" Not out of the right-bottom corner of the base glyph (A, E, I...). Such design, in my own opinion, disqualify the delicate serif font (look at Palatino Nova above, IMHO disastrous). This is, on the other hand, good idea with fat sans-serifs.<br>
      Very likely the picture helps more (not being familiar with English...)<br>
