      <p>Not being very familiar with the form of the ogonek, I did some Google searching. I found that it is used for A and E in Polish, but for A, E, I and U in Lithuanian. Somewhere I found a mention that Lithuanian used a slightly different standard for its appearance, but I couldn't find out what it was.</p>
      <p>Also, when this is used with American Indian languages, <em>then</em> the usual approach is to center it below the letter, so for those languages it might be considered a separate accent (although, at least in Polish, the ogonek is not treated as an accent; instead, the letter with the ogonek is a new member of the alphabet).</p>
      <p>I wanted to see what the ogonek looked like in older typefaces, so I tried searching for a Polish-language dictionary on Google Books. At first, I had no success, so I changed my search terms. I ended up finding a book for learning the Polish language written in Hebrew (or, perhaps more likely, Yiddish) which had title pages in Russian and Polish in addition to the language in which the book was written. ("Grammatyka polska, w języku żydowsko-niemieckiem", my first result when I searched on public-domain only on the word Polska... as different books are available with such a search in the U.S., U.S. searchers may have different results.)</p>
      <p>A book from 1883, for Jews in Russia, on how to learn Polish - presumably so they could move to Poland to escape the risk of pogroms in Tsarist Russia. I had not expected to encounter a reminder of the Holocaust as a result of a search on so apparently innocuous a topic.</p>
