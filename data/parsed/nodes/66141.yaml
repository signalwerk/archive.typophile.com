      <p>Chris, </p>
      <p>the following shows the necessary steps of "degradation" (i.e. size reduction and shape complexity reduction) of an ogonek if the descenders were getting shorter and shorter:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ogonek_smaller2_4879.png"></div><p></p>
      <p>(The one on the left is the original FF Good by Łukasz Dziedzic, the further examples are my take on that "degradation"). I hope this explains the idea. </p>
      <p>The one furthest right probably makes no sense anymore in lowercase (since descenders are unlikely to be that short), but in an all-uppercase alphabet that is supposed to be "all of the same height", i.e. where all the Latin uppercase letters are supposed to fill out the vertical space, and the diacritic marks kind of "interfere", this is how you'd make it. Just a short, thick stroke, oblique to the right, that hints the beginning of an ogonek curve, is appropriate. </p>
      <p>Please scroll to the right to see the entire image. </p>
      <p>Adam</p>
