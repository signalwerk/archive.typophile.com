      <p>Hi everyone,<br>
      It is the joy and the honour for me to write here some my opinion.<br>
      P. Linotype: not bad, needs some adjustment, the ogonek is definitely too small, rating 3/5<br>
      URW Palladio: it is not an ogonek, rating 0/5<br>
      URW Palladio L.: it is an ogonek, but in wrong place, way too small, rating 1/5<br>
      TeX Pagella: almost perfect, could be a bit smaller and a bit thinner near the end (I am not sure), rating 5/5<br>
      P. Nova: this idea ogonek+serif is very strange, good for nothing, one must shift the ogonek to the left, rating 2/5</p>
      <p>The winner is TeX Palladio, the second place P. Linotype.</p>
      <p>hrant - I like your design here very much! Try to shift your ogoneks a bit to the left. Where are yours Eogonek and eogonek?<br>
      "I might make it completely smooth" I do not like that idea with letter a, with letter e necessarily!<br>
      jcrippen - agree<br>
      Christopher Adams - "it also appears that the serif on the aogonek is shorter than the regular a?" It also appears that the ogonek is thicker on aogonek than on Aogonek (truly they are the same). So it nedds to be a bit thinner.</p>
      <p>Regards from Poland<br>
      Jan Żurawski</p>
