      <p>Chris, </p>
      <p>generally, if you take a very abstract view on the ogonek and imagine that it's a part of a circle (which of course it isn't, but just very broadly), then you have the liberty to take various "slices" of the circle: 2/3 of a circle would be the fullest, 1/2 of the circle is quite common, and 1/3 or even 1/4 of the circle are shorter. Here's this idea:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ogonek_skeleton_5803.png"></div><p></p>
      <p>Of course in fact, it's not part of a circle but of a calligraphic, oblique ellipse:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ogonek_skeleton_oblique_4797.png"></div><p></p>
      <p>The size of the ogonek on the left is exagerrated (for the sake of comparison), and it's very basic skeletons, but the principle stands.</p>
