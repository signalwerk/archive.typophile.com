      <p>Linotype Palatino also has the merit that its ogoneks make an effort to reach the descent line.</p>
      <p>Ideally, each letter should be drawn individually with the ogonek flowing gracefully from the base character. The right effect can rarely be achieved with a composite glyph.</p>
