      <p>Chris, in your examples, #1 and #2 work, but #3 and #4 I feel are too complex, The proportions are too exagerrated into the horizontal. I generally prefer ogoneks that are somewhat within the proportions (height-to-width aspect ratio) of the base letters, preferrably "neutral" lowercase (i.e. such as "a" or "n"). If you look at the image below: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ogonek_proportions1_3445.png"></div><p></p>
      <p>I've marked with grey the area that the "a" glyph would take. The "e" is typically wider than the "a". So an ogonek that has the same aspect ratio as the "a" or as the "e" usually works well. If it's too narrow (like the red ones on the left) or too wide (like the red ones on the right), then it starts looking strange. </p>
      <p>Of course, the actual "scaling factor" between the base lowercase body and the ogonek body depends very much on the descenders. If they're short, you need to compress more. In the example above, the condensed letters (in the top row) would in reality unlikely have so long descenders, so some downscaling compensation would apply, as described below. </p>
      <p>Here's an image that shows the lowercase x-height body (darker gray), the ascenders and descenders zones (lighter gray) and the ogonek "zone": </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ogonek_proportions2_4830.png"></div><p></p>
      <p>Just like with optical sizing, if you scale down more, you have to widen a bit (that's the downscaling compensation I'm talking about). So if the descenders are quite long compared to the x-height, then the ogonek can be fairly long and then generally maintain the height-to-width ratio of the neutral lowercase letters. If the descenders are very short, so the ogonek needs to be scaled down a lot to fit into the descender zone, then it can be relatively a bit wider, but not too wide. If you make it too wide, the deviation of the aspect ratio between the main body of the letters and the ogoneks becomes too distracting. And that's what is happening in Chris's #2 and #3 examples, I think. </p>
      <p>Hope this helps.</p>
