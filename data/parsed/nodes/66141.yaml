      <p>BTW, the "original" glyph to which the ogonek attaches is the "e", because the letter "ę" is actually the Latin letter <em>e caudata</em>, which in the Middle Ages was an alternative way of writing <em>æ</em>. Later, when the Latin spelling standardized on using <em>æ</em> and later just <em>ae</em>, the <em>e caudate</em> letter was repurposed by the Polish to denote the nasalized <em>e</em>. </p>
      <p>Claude Garamond's Gros Canon includes a really beautiful <em>e caudata</em> which works 100% as the Polish <em>ę</em> today: <a href="http://www.flickr.com/photos/adamt/3630379481/" rel="nofollow">(my image on Flickr)</a>. </p>
      <p>The <em>cauda</em> or <em>ogonek</em> (tail) was later added to the other letters in Polish, and later in Lithuanian. But I still find that the form that merges with <em>e</em> is the key, and for me always the origin. In handwriting, <em>ę</em> is written in one move, as a kind of "two semi-loops". This is why for calligraphic designs, I usually try to replicate the curvature and the endine of the bottom part of <em>e</em> in the ogonek. The top part of the ogonek is usually a somewhat flat curve. In Palatino, I tend to make it a bit flatter than in other typefaces, because you have lots of those "sudden flat curves" as in the bottom part of the Roman <em>a</em> bowl. </p>
      <p>In more constructed typefaces, especially those with a small aperture (i.e. where the glyphs <em>c</em> or <em>e</em> are rather closed), the ogonek cannot be drawn in one stroke with the <em>e</em> (e.g. in Univers). Then, it is usually not so "closed" either, and can be placed more freely, e.g. a bit more towards the middle of the letter as in Łukasz Dziedzic's FF Good:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ogonek_ffgood_6254.png"></div><p></p>
