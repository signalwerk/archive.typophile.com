      <p>John</p>
      <p>"<cite>The two that are identified in the MS Devanagari spec are conjuncts that are traditionally treated as separate letters in some situations, e.g. being mapped to individual keys on keyboards.</cite></p>
      <p>Indeed, using the Devanagari keyboard I was able to get the glyphs क्ष and ञ, as I have just done here. For the glyph क्ष, I used the key corresponding to the '&amp;' on the US keyboard, and it seems to be equal to the KaSsa ligature mentioned above. The second one though, which I obtained by typing '}' in the US kb, doesn't seem to equal the JaNya ligature. Just by looking at the <a class="freelinking external" href="http://en.wikipedia.org/wiki/File:Devanagari_INSCRIPT_Keyboard.JPG" rel="nofollow">Devanagari keyboard</a>, I couldn't find any other candidate for the JaNya ligature glyph. Could you clarify ?</p>
