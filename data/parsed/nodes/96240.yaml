      <p>'Akhand' is a fairly loose concept. From an OpenType perspective, it simply refers to conjunct ligatures that are formed before other shaping occurs. The two that are identified in the MS Devanagari spec are conjuncts that are traditionally treated as separate letters in some situations, e.g. being mapped to individual keys on keyboards.</p>
      <p>[The word 'akhand' had an entirely different meaning in some earlier typesetting technologies.]</p>
