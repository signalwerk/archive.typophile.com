      <p>I'm still striving to correctly recognize the devanagari characters. After a few hours of research on this issue, I think I finally found out the answer for the doubts, I expressed above.</p>
      <p>In the first case, the KaSsa ligature, that was no problem, it was correctly recognized and reproduced in MS Word, by typing :</p>
      <p>          क + ् + ष = क्ष</p>
      <p>using the Devanagari keyboard.</p>
      <p>The problem with the JaNya ligature was due to the fact that I didn't recognized correctly the character ज्ञ in the alluded keyboard, mistaking it with the character ञ. Making this correction, I obtained in MS Word the expected result :</p>
      <p>          ज + ् + ञ = ज्ञ</p>
      <p>And more, these two characters (or glyphs), क्ष and ज्ञ, although not Unicode points, they are present in the Devanagari keyboard, on the keys corresponding, respectively, to the characters '&amp;' and '%', in the American keyboard, as John mentioned above.</p>
      <p>One other important point : when I said "obtained in MS Word", I meant that MS Word automatically replaced the typed characters with the glyphs at the right of the equal signs, when the ligatures were identified by the shaping engine, used by Word.</p>
