    <p>I am setting up a font that I hope will look somewhat hand written when set. I have a stylistic alternate for every glyph with just slight changes in hand variance and attitude. </p>
    <p>I would like to set up an OT feature where whenever two of the same glyphs are repeated side by side, the second glyph switches to the alternate.</p>
    <p>I have page 868 of the FontLab manual open. But it is not making a lot of sense to me right now.</p>
    <p>First, what would I call this feature in the OT window?</p>
    <p>Would the code look something like this?:</p>
    <p>Sub e e’ by e.alt;</p>
    <p>And then set that up for every glyph. Or am I confused?</p>
    <p>And then, how would that feature be turned on and off in the app?</p>
    <p>I have it set up to where I can switch out the alternates by hand, but other users will be lazier than me and I would love to see some kind of automatic feature.</p>
    <p>As long as my head doesn’t explode trying to code it…</p>
