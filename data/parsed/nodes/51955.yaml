    html: |-
      <p>I just finished a font like this. I used three of every glyph in the font (including punctuation, spaces, nonbreaking spaces, and soft hyphens) in three classes; default, alt1, and alt2. My code (<a href="http://www.adobeforums.com/cgi-bin/webx?50@755.561rfSM0Gas.1@.3bbc5ea4" rel="nofollow">based on older code by Tom Phinney and others</a>) is:</p>
      <p>feature calt {<br>
      lookup rotate {<br>
        sub @default @default' by @alt1;<br>
        sub @alt1 @default' by @alt2;<br>
      } rotate;<br>
      lookup rotate;<br>
      } calt;</p>
      <p>To make it work in Indesign one has to use CALT (contextual alternates), because Indesign does not support SALT (<a href="http://www.adobe.com/cfusion/mmform/index.cfm?name=wishform" rel="nofollow">complain about that here</a>).</p>
      <p>You also need to set up kerning classes to control interaction between the different character sets (unless all of the characters vary enough to require manual kerning of everything). I recommend that you set up all of the classes in a text editor, proof them, and then import them. Otherwise you’ll have to find your mistakes by looking at the errors the Opentype compiler generates, which can be a PITA because errors fonts with large classes can cause the compiler to mangle the classes.</p>
