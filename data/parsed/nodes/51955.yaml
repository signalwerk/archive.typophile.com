    html: |-
      <p>Yes that's it, You have it right.</p>
      <p>There is also a alternate way of doing it with very large sets of substitutions and that is with classes.</p>
      <p>Basically you just drag and drop all the sets into classes and as long as they are in the correct order and size the code would be as follows:</p>
      <p>feature calt { # Or whatever feature you choose.<br>
        sub @letter @letter2' by @letter3 ;</p>
      <p>} calt;</p>
      <p>So you would make open type classes and drag all the first letters into one called<br>
      letter into it and make a new open type class called letter2 and drag all the second letters into it and then make a third class called letter3 and drag in all the replacement glyphs into that.</p>
      <p>Now that is not exactly correct but I'm pretty sure Fontlab will change and compile it correctly when you make the font. It will run in the open type preview correctly inside Fontlab as written just fine for debugging.</p>
      <p>If you do it your way I'm pretty sure Fontlab will make it sort of like my way on compiling the font. It will try to add them all to classes to make the code much smaller. You just have to make sure they are all in the correct order and that all three classes have the same exact amount of glyphs. It will not compile and give you a warning if that is not the case.</p>
