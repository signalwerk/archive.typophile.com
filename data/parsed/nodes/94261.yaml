    <p>Hello,</p>
    <p>i spent one full day on looking for a font as close as possible to this one. Now i found this site and i really hope someone here might help out.<br>
    My best guess is its a modification or mixture of <a class="freelinking external" href="http://www.myfonts.com/fonts/paragraph/tenby-four/7-light/" rel="nofollow">Tenby Seven Light</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/eurostile/extended-2/" rel="nofollow">Eurostile Extended #2</a>.</p>
    <p><img src="http://typophile.com/files/vertexarts.jpg"></p>
    <p>Regards,<br>
    Chris</p>
