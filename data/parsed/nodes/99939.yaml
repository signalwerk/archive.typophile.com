    <p>Hello 2013, Bellissima Script is the first Sudtipos release of the year.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilebellissima_4291.png"></div><p></p>
    <p>While in the same vein and spirit as Burgues and Compendium, <strong><a href="http://www.myfonts.com/fonts/sudtipos/bellissima-script-pro/" rel="nofollow">Bellissima</a></strong> began from an entirely different thread as those fonts. It started with Alex Trochut generously showing me a gorgeous lettering book from his grandfather's library: Bellezas de la Caligrafía, by Ramón Stirling, 1844. Stirling was one of the Latin calligraphy pioneers who introduced a refined version of English calligraphy in Spain and made it popular in the nineteenth century.</p>
    <p>Some scans from that book served as initial basis for the caps in my Poem Script. But it was always in the back of my mind that I should do a copperplate, and the Stirling model was the perfect source. My intention was to veer away from Stirling's exuberant ornamentation, and work within simplified forms of his ideas. As it usually is with most of my projects, Bellissima became its own bird and shaped its own flying patterns. Suddenly there were many ligatures, multiple endings and swashed connections, hundreds of alternates for both uppercase and lowercase.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophi_beau_4374.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/typophi_krasny_6483.jpg"></div><p></p>
    <p><strong><a href="http://www.myfonts.com/fonts/sudtipos/bellissima-script-pro/" rel="nofollow">Bellissima</a></strong> has an effusive energy that appeals much beyond its sourcing. It's intended for these modern times of appreciation for old crafty things like stationary and letterpress, where its origins  help it shine brightly.</p>
    <p><strong><a href="http://www.myfonts.com/fonts/sudtipos/bellissima-script-pro/" rel="nofollow">Bellissima Script Pro</a></strong> is a complete font with almost 2000 characters full of alternates, swashes, ligatures &amp; ornaments covering a wide palette of latin languages and Bellissima Script Redux is a random sample of glyphs totally usable with a reduced price.</p>
    <p>3D art in that <strong><a href="www.sudtipos.com/downloads/Bellissima_Specimen.pdf" rel="nofollow">Specimen</a></strong> generously provided by Corey Holms.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophi_schon_3669.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/typophi_bella_5720.jpg"></div><p></p>
    <p>To celebrate this new font release there is a 30% off <strong><a href="http://www.myfonts.com/fonts/sudtipos/bellissima-script-pro/" rel="nofollow">discount</a></strong> at @myfonts and you can get the Pro version for just 55$ or a Redux (a random selection of 256 glyphs) for only 34$</p>
    <p>More fonts at:<br>
    <a href="http://www.sudtipos.com" rel="nofollow">www.sudtipos.com</a></p>
