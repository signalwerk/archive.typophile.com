      <p>I think it is modified <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/perpetua/" rel="nofollow">Perpetua</a>, which does have a stemmed U. The only obvious modification is the gap that was added to the P and R stem join.</p>
      <p>- Mike Yanega</p>
