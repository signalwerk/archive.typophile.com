      <p>Hi Mike:</p>
      <p>Thanks for your response.  I also thought it might be a modified Perpetua, but I tried several different versions directly on top of the logo art and, while some were pretty close, none were exact matches: serifs were sized a little differently, stroke and stem weights didn't quite match, bowl shapes were a little different.  The search goes on...</p>
