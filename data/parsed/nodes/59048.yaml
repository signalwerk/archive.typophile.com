    html: |-
      <p>Clive, The resemblances to Perpetua are too close (I think), and the differences you describe are so minor, that I still believe this is a customized version of Perpetua. Maybe 'customized' isn't how the vendor would describe it, because they want to represent it as a new typeface, but the changes from Perpetua are very easy for anyone with font design tools.</p>
      <p>I also considered that it's another Eric Gill design, since some designers tend to have a letterform vocabulary they like, but <a class="freelinking external" href="http://new.myfonts.com/fonts/grouptype/aries/roman/" rel="nofollow">Aries</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/pilgrim-lt/roman/" rel="nofollow">Pilgrim</a> are his most similar serifs and not as close to your samples as Perpetua, in my estimation.</p>
      <p>- Mike Yanega</p>
