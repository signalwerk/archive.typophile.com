    <p>Trying to identify a font (obviously) used, in two weights, in a logo.  It's quite similar to Perpetua – some of the key differences: bowl doesn't meet the vertical in the cap R and P; the cap U is stemmed.</p>
    <p>Thanks in advance</p>
