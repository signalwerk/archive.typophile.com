      <p>The very first thing I thought of was The Rolling Stones' <em>Flashpoint</em> album cover. Not sure how you feel about this association, that is probably going to be very strong with some people.</p>
      <p>Here are the <a href="http://images.google.com/images?q=rolling%20stones%20flashpoint&amp;hl=en&amp;lr=&amp;c2coff=1&amp;safe=off&amp;client=safari&amp;rls=en&amp;sa=N&amp;tab=wi" rel="nofollow">Google Image Search results</a>. See what I mean?</p>
      <p>That said, I don't think it's a bad logo, but it's treading familiar ground in a very common manner. The personality is missing. Make it your own. Make it unique.</p>
