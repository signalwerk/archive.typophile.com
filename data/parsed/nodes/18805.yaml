      <p>I like your letters. They are developable. Especcially the italic has a nice look.</p>
      <p>But before criticise your letters you have to improve some things. First off all: your upstrokes have the same width like the downstrokes. Thats wrong. Even in the constructed DIN the upstrokes are thinner. Even if it doesnt look so. You can prove it by putting circles with the same radius into the stems! Round strokes are a little bit wider too have the same optical thickness as straight strokes. Your approach was correct but a bit too much. And you have to pay attention that both sides of the strokes on the C, O, Q etc looks identical.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AC-stitch.jpg"></div><p></p>
      <p>learn more about it here:<br>
      <a href="http://www.kleindaten.de/kaech/" title="http://www.kleindaten.de/kaech/">http://www.kleindaten.de/kaech/</a></p>
      <p>Also your counters looks a bit too eggy.</p>
      <p>I like trapping flowers. But when you use them pay attention that you use them continuous. They are missing in the V, W, M etc. But you have done them incorrect.</p>
      <p><a href="http://www.themicrofoundry.com/ss_trapping1.html" title="http://www.themicrofoundry.com/ss_trapping1.html">http://www.themicrofoundry.com/ss_trapping1.html</a></p>
      <p>Greetings: Steven</p>
