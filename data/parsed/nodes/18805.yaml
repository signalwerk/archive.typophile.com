    html: |-
      <p>1) I think the lowercase f's would be a bit easier to read if the ascenders continued a little bit further than they do.  It jumped out at me in the italic, and then I looked at the roman and saw it there too.  Maybe if the ascender curve were a little squarer and less oval it would help in that regard, even though there isn't much precedent for it in the rest of your face.</p>
      <p>2) I agree with Steven about your round lc letters.</p>
      <p>3) I think your round uppercase letters -- or maybe just C and O -- have  the opposite problem, though, and look optically a little shorter than what I would expect them to be.</p>
      <p>4) Have you considered a tail for the italic g instead of the loop descender?  I think it might fit better with the other short descenders.</p>
      <p>5) Does your $ harmonize with the numerals?</p>
