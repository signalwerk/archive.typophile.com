      <p>I remember the Süddeutsche Zeitung's masthead from when I studied in Stuttgart. I had a friend that loved that 'g' and used to refer to it as "the g that looks like a baby". I'm still not sure what makes that 'g' resemble a baby, but I have admit that she's right.</p>
      <p>In terms of design I've always preferred the <a href="http://www.stuttgarter-zeitung.de/" rel="nofollow">Stuttgarter Zeitung</a>. It's one of the few that uses <a href="/wiki/Gerard%20Unger" class="freelinking" rel="nofollow">Unger's</a> <a href="http://www.gerardunger.com/allmytypedesigns/allmytypedesigns14.html" rel="nofollow">Gulliver</a>.</p>
