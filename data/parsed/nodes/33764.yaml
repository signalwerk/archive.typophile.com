    html: |-
      <p>@ Florian<br>
      Preußen is everywhere where its flagg is blowing in the wind - strong and free.</p>
      <p>Every successful newspaper in the world has its own strong face, controlled by its layouters. I found this striktly rules everywhere in Europe and US, too. E.g. the Sun in London has its own girlie macro for page 3. (I know it, 'cause I wrote the first version of it in 1986(?) being part of "No Stopping - Wapping", when Mr. Murdoch broke the big fleet street strike together with 70 Kodak newspaper spezialists :-)</p>
      <p>A change of a layout or only a font is a major thing. They discuss it for months before changes will appear. And what ever they change: Lots of readers of the paper will give protest. They want their paper like it was before.</p>
      <p>So - to write "The Helvetica headlines hurt my eyes" is not enough for a discussion about a newspaper's layout bible.</p>
      <p>Georg</p>
