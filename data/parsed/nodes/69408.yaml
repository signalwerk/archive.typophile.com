    <p>hi there,</p>
    <p>I recently started a design blog focussing on typography (at the moment),</p>
    <p><a href="http://carlyhitchcock.wordpress.com/" title="http://carlyhitchcock.wordpress.com/">http://carlyhitchcock.wordpress.com/</a></p>
    <p> I was wondering how do you fellow bloggers attract followers?</p>
    <p>Anything I could improve on?</p>
    <p>The main purpose of the blog is personal (ie. research and reflection) but it would be great if I could get a lot of followers also- to give opinions, feedback etc...</p>
    <p>any advice welcome...</p>
