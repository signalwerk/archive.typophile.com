      <p>Confirming both feeling. Definitely "Century Gothic customized". Add a horizontal bar to /C, pull down /H middle crossbar and done :)<br>
      Some alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/samosata-nf" rel="nofollow">Samosata</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/talbot/kessel-205" rel="nofollow">Kessel 205</a></p>
