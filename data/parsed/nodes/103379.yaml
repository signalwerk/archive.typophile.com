      <p>It's most probably a one-off, custom "E" for Century Gothic. In fact if it <em>is</em> a font, it's likely to be plagiarized from Century Gothic, so best avoided.</p>
      <p>But anyway: how hard is it to add a line to the "C"? In fact it would take less time than trying to find a font!</p>
      <p>And while you're at it, tighten the "EW".</p>
      <p>hhp</p>
