    <p></p><div class="imageWrap"><img src="http://typophile.com/files/NewChapterLogo_6189.gif"></div><p></p>
    <p>Specifically, the font on top that reads "A New Chapter." I've tried using identifont and whatthefont but neither came up with an option that was even close. I'm beginning to think the original designer of the logo adjusted an existing font in Illustrator using outlines, but i'm hoping this isn't so. </p>
    <p>It looks like it could be Century Gothic, or some other gothic, yet the capital "E" is really different. </p>
    <p>I'm redesigning this logo for a client and they want me to use the same font, yet they don't remember what it is, and I can't find it. :)</p>
    <p>Thank you so much,</p>
    <p>-Piasaw</p>
