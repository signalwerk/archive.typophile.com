    html: <p>Photo-Lettering's Alphabet Thesaurus, Volume 3 (copyright 1960-1971), lists it as <strong>Baghdad Backslant</strong>, and lists it in their Art Nouveau section (p. 371). This listing doesn't show a complete alphabet, only the phrase "Skidding Along Rapidly into First Place?" You might check the Solotype catalog...</p>
