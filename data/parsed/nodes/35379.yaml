    html: |-
      <p>the victor moscoso has the same problems as the 'psychedelic smoke' font. For instance, the crossbar on the T is drawn with tiny loops on the ends, you can see a stroke on each side crossing back over the crossbar... see below.</p>
      <p>liquid night is a version of this typeface that I was working on prior to discovering better quality lettering samples.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/t-compare_4364.jpg"></div><p></p>
      <p>edit: upon closer inspection, Psychadelic smoke is definitely the better of all the available choices (so far). I may use it, and my original specimens to try and update this font.</p>
