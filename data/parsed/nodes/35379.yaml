    <p>I know this is a William Page typeface, but I'm trying to track down the whole alphabet.</p>
    <p>So far, I know this much:<br>
    a) it exists in digital form, as a font called Psychedelic Smoke<br>
    b) when I compare 'Psychedelic Smoke' (an early 90s truetype version) to my references (taken from old newspapers), that font does not really come close to showing the intricacies of the font.<br>
    c) the earliest use I can find in the small town paper I work at is 1965, but it seemed more popular (at least with the ad agencies) through the 70s.</p>
    <p>I want to know:<br>
    a) if anyone knows any more details<br>
    b) the source used for 'Psychedelic Smoke,' the only original William Page example I can find is only one word, not the whole alphabet.<br>
    c) where I might be able to find more information if no one here can help any further</p>
    <p>I expect:<br>
    a) few replies and little interest, but feel free to surprise me!</p>
    <p>Link to 'psychedelic smoke' <a href="http://www.searchfreefonts.com/fonts/p36.htm" title="http://www.searchfreefonts.com/fonts/p36.htm">http://www.searchfreefonts.com/fonts/p36.htm</a><br>
    There are some other versions here, but I believe 'smoke' to be the source for them, as well.</p>
    <p>Thanks!</p>
