      <p>Hi There</p>
      <p>The element (and color) you show has an upper class feel. It looks a bit like a crown, but I think it could be refined. Perhaps some shapes of the mentioned islands?</p>
      <p>But there is no coherency between the 'crown' and the fonts used. The ratio of the image and the type. See my image. </p>
      <p>Especialy the upper version strikes me as a bit odd.</p>
      <p>The lowest looks much better (much classier), but the typography used is somewhat common. Not always a bad thing, though.</p>
      <p>Have you looked at lowercase lettering?</p>
      <p>The idea of three inhabited islands is a good find. But be 100% sure of that. It will be a selling point and you don't want the customer to tell you otherwise. </p>
      <p>Could you explain the 'crown'? What does it represent?</p>
      <p>Hope this helps.</p>
      <p>Best of luck.</p>
      <p>Raymond</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Naamloos-1_3554.jpg"></div><p></p>
