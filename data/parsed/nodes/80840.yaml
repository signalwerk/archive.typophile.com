      <p>Trevor —&nbsp;I think adding romans based on Granjon (handsome and deserving as they are) would be expanding the brief beyond what Thomas is attempting to do here, which is to divvy up the various romans typically called “Garamond”s into those truly derived from Garamont’s types and those derived from the Caractère de l’Université, which was originally mistakenly attributed to Garamont, but was in fact designed by Jannon.</p>
      <p>Thomas — Both Garamond No. 4 and Garamond No. 5 seem to be digitized from the same source: Typoart Garamond, which looks to be derived from the Jannon lineage, not the Garamont.</p>
      <p>Garamond 96 DT looks to be from the Garamont lineage. Whereas Garamond DT appears to be from the Jannon side of things.</p>
      <p>Original Garamond BT is based closely on Stempel Garamond and thus can claim to descend from Garamont.</p>
      <p>If you’d provided links to all your unclassified fonts, it would be easier to help you out.</p>
