      <p>Font Bureau’s <a href="http://www.fontbureau.com/fonts/GaramondFB/" rel="nofollow">FB Garamond</a> is a digitization &amp; expansion of the Garamond that Robert Hunter Middleton designed for Ludlow in 1929. Middleton based his design on the 1592 Egenolff-Berner specimen.</p>
      <p>So, I would classify FB Garamond under Garamont.</p>
