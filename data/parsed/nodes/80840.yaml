    <p>I created a list of fonts that can be assigned to Garamont and those going back on Jannon. Here is a <a href="http://dl.dropbox.com/u/246689/Pictures/Garamond%20vs.%20Jannon.pdf" rel="nofollow">pdf file</a>, and here is a brief list:</p>
    <p><em>Claude Garamont:</em></p>
    <p>    1530 Garamond<br>
        Adobe Garamond Pro<br>
        Garamond Premier Pro<br>
        Berthold Garamond Pro<br>
        Tyma Garamond<br>
        Stempel Garamond LT Std<br>
        Granjon LT Std<br>
        Sabon LT Std<br>
        Sabon MT Pro<br>
        Sabon Next LT Pro</p>
    <p><em>Jean Jannon:</em></p>
    <p>    Amsterdamer Garamond P OT<br>
        Garamond 3 LT Pro<br>
        Garamond MT Pro<br>
        Garamond Classico<br>
        Garamond Simoncini EF OP<br>
        LTC Garamont Text OT<br>
        Jannon T Modern Pro</p>
    <p><em>Typefaces I could not classify:</em></p>
    <p>    Garamond 96 DT Pro<br>
        Garamond FB Text<br>
        Garamond No. 4<br>
        Garamond No. 5 EF OP<br>
        Garamond TB<br>
        HS Garamond Pro<br>
        Original Garamond BT</p>
    <p>Can you confirm my previous assignments? And can you assign the last listed fonts? Witch is based on Garamont and witch is based on Jannon?</p>
