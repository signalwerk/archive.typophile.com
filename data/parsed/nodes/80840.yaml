      <p>Trevor — I guess maybe the OP will have to clarify his intention. If the objective is really to sort all Garaldes, well, that is a much larger task.</p>
      <p>With regard to italic styles, yes, many Garalde italics are based on Granjon’s model(s). In terms of romans, however, I’m not so certain that there are really all <em>that</em> many. </p>
      <p>For one thing, Granjon didn’t cut as many romans as he did other types. In the Plantin Folio Specimen c. 1585, for instance, I count that of the faces attributed to Granjon, 11 are italics, 9 are other (greek, bâtarde, civilité, syriac, etc.), and only 5 are roman. </p>
      <p>That was a quick count, so I could be off by one or two. And that one specimen is certainly not a thorough inventory of Granjon’s work, but I would expect it to be more or less representative.</p>
      <p>Maybe I’m just not thinking of all the ones you are. We could hijack the thread and count them up here anyway. ;-)</p>
      <p>I get <a href="http://new.myfonts.com/fonts/adobe/itc-galliard/" rel="nofollow">ITC Galliard</a>, <a href="http://www.fontbureau.com/fonts/Meno" rel="nofollow">Meno</a>, <a href="http://commercialtype.com/typefaces/lyon" rel="nofollow">Lyon</a>, and <a href="http://www.mvbfonts.com/mvb_verdigris_pro/" rel="nofollow">MVB Verdigris</a>. What’ve you got?</p>
      <p>P.S. You can just call me Kent.</p>
