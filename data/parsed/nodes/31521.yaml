      <p>Looks like a fun project. You really don't need open type if you choose a font family that has an expert collection.</p>
      <p>I recently ran into the same set of issues - looking for a sans family to use for caps etc. in an art book. Unfortunately most early to mid-century sans don't have the open type features - or the full expert set. I ended up creating style sheets for my fractions. I used Electra and Geometric 415 - both by Dwiggins from the 30s. But there are a lot of beautiful serif fonts that have all the requisite bells and whistles such as Dante.</p>
      <p>I don't find DynaGrot appropriate for the period, and find Centaur way too antique looking (altho it does have an expert set). Whitman is lovely.</p>
    html_clean: |-
