      <p>Thanks for the comments, including hijacks et al.</p>
      <p>DynaGrot has some endearing quirks, but doesn't have the right feel. Pre-Helvetica is exactly right. I keep coming back to Trade Gothic, but have to test it in layout with the serif body copy font.</p>
      <p>For body copy, I adore Centaur but agree that it is too old world for this project. Joanna's italic has always had a pinched feel to me. Caledonia would work really well. But at the moment, I'm exploring a surprising possibility: Chapparel. Mark Jamra suggested it and at first I dismissed this, but then discovered that there was a resemblance to a font on a brochure from 1913 (it looks like a Cheltenham Bold). I usually prefer historic fidelity, but am struck by how workable and appealing Chapparel has been so far. It is handsome in widely letterspaced all caps for pull quotes and titles, and very legible as body copy.</p>
