      <p>"Modern American Painting" by Peyton Boswell Jr., Dodd, Mead &amp; Co. New York, 1940, is a big upscale art book--all figurative stuff, of course, pre-Pollock.</p>
      <p>The title is set in Weiss Initials, and the text in 14 pt Centaur. Weiss Italic is used for captions, and Weiss Roman for the catalog.</p>
      <p>As the Centaur is letterpress, with a lot of gain, it's quite like Adobe Jenson.</p>
      <p>They avoided anything with commercial or European Modernist associations, which narrowed the field considerably!</p>
