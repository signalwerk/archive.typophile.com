      <p>No linky 'cause it's Storm. You have to go to his page and scroll it in.</p>
      <p>From Storm's page—</p>
      <p>"In all italics of the DynaGrotesk family, however, the design of lower-case letters markedly differs from that of upright lower-case letters. The warm character of DynaGrotesk derives from early sans-serif type faces, those which appeared before Helvetica. The complete installation of all designs of DynaGrotesk is the professional choice of the designer of the most demanding magazine."</p>
      <p>It does appear less colorful in small sizes, but the pre-Helvetica-institution quirkiness always shines through. There are so many weights and widths I was sure to fail at presenting an example but it seemed to have some resonance with the geometry of Caledonia/Joanna/Whitman. The ear on the "g" and several other details are not a good match though IMO.</p>
