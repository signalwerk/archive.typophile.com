    <p>Working on a 200+ page exhibition catalog for a museum; the show is a collection of early and mid twentieth century American paintings and drawings. The donor of the collection was described as forward-thinking for his time, but also elegantly classical in his bearing. I got approval on the cover painting and a typographic direction. At the moment I'm using for the title Alternate Gothic 3 and Adobe Jenson Pro for the body copy font (and the italic for the sub-head). I want to use a Pro font because there will be a thicket of fractions, etc. in the lengthy Catalog Raisonée for this book.</p>
    <p>My two questions to you esteemed type hounds are: </p>
    <p>1. Do Alternate Gothic 3 and Adobe Jenson Pro look too strange together? See cover sketch attached.</p>
    <p>2. I'd like to use a sans serif family as a secondary font set for captions/pull quotes/folios/whatever. Considering Trade Gothic and News Gothic. Any other font ideas?</p>
    <p>Thanks in advance.</p>
