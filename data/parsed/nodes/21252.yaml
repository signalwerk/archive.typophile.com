      <p>I know the complaints about typefaces lacking accents for setting Sanskrit. The problem which I see -- I mean, for foundries to support these special accented glyphs -- is that university/scholarly segment is not really a market. A generalization, but at least true for Germany: Universities/scholars don't have a budget for fonts, nor do certain publishers of scientific books. Some even ask authors to "design" books on their own. And then ask university departments or authors to finance the printing. This is especially the case for doctoral theses which <cite>must</cite> be published ... (To counter my own generalization: There are publishers of scientific books who do well designed and produced books.)</p>
      <p>But it would really be great if there were a few solid text faces equipped for setting scientific books. Just like Adobe added polytonic Greek to some. I also wished that -- since you mentioned it -- Monotype would extend Bulmer to cover accented glyphs required for Sanskrit &amp;c. It's wonderful typeface for this kind of books.</p>
      <p><cite>Even if you are willing to make up the required characters for free, there is a time factor. You gonna do the work &amp; get it shipped in an hour?</cite></p>
      <p>Hm. I thought that for this kind of books it were better to rely on three, four, five typefaces which have proven or been adjusted/extended to work well instead of making a quick decision to use something "new" for each title.</p>
