    <p>I need to buy Sabon as an opne type font and I see Adobe lists what they call a standard family package for $99. Over at Fonts.com the Monotype Pro package lists for $158. I thought the price difference might be due to the fact that the Adobe set only has small caps in the roman and that perhaps the Monotype edition may have small caps in all the families. But I checked and this is not the case. </p>
    <p>And I see the Monotype says it's a semi bold while Adobe says their's is bold.</p>
    <p>Does anyone have any idea why the price difference? Am I getting the same font and cut with both packages?</p>
    <p>Thanks for any help you can offer.</p>
    <p>John</p>
