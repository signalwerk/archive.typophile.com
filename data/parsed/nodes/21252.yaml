      <p>Marcel,</p>
      <p>You need something like RENAMECH, originally a part of a Y&amp;Y TeX package. Y&amp;Y is gone, but as I remember, Berthold gave all his ancillary programs to the TeX User's Group, so they may have the routine. If you have RENAMECH.EXE, you can write a simple search &amp; replace file to run on both the .PFA and the .AFM files (you also need PFBTOPFA). When you then open the .PFA in FontLab, the characters will have their new names &amp; the associated metrical data.</p>
      <p>This is different than reencoding a font -- you are changing the glyph names, not their location. But Y&amp;Y also wrote routines for reencoding a font; again, I'd get up with TUG.</p>
    html_clean: |-
      <p>Marcel,</p>
      <p>You need something like RENAMECH, originally a part of a Y&amp;Y TeX package. Y&amp;Y is gone, but as I remember, Berthold gave all his ancillary programs to the TeX User's Group, so they may have the routine. If you have RENAMECH.EXE, you can write a simple search &amp; replace file to run on both the .PFA and the .AFM files (you also need PFBTOPFA). When you then open the .PFA in FontLab, the characters will have their new names &amp; the associated metrical data.</p>
      <p>This is different than reencoding a font -- you are changing the glyph names, not their location. But Y&amp;Y also wrote routines for reencoding a font; again, I'd get up with TUG.</p>
