      <p>The Difference between the MT pro and all other "classical" Sabon variants including MT Sabon (not Sabon next, which is in fact a different type face) is the number of characters included.<br>
      For example, it includes the ligatures "ffi" and "ffl". These are not available within LT Sabon, Adobe Sabon or MT Sabon.<br>
      If you have a look at the character maps (e.g. at fonts.com -&gt; search for "Sabon Pro" -&gt; "Try first - click here" -&gt; "Character Map") you will see the difference.</p>
