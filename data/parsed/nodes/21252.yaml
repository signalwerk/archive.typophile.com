    html: |-
      <p>Sure. But first, this is the second time in one day you've come at me, so as a preamble, I'll admit (even state!) that I generalize a fair bit, particularly on an internet forum. So when I say "No foundry to date includes all the characters you might need" I'm making presumptions about both (1) material you might need to set, and (2) what restrictions might apply to font selection.</p>
      <p>As to the first: I set books for university presses. So for example: Some of these presses in the Southwest (New Mexico, Arizona) have accepted manuscripts which include significant amounts of Navajo and Apache. Orthographies differ, but one common one is to use certain vowels that have both an acute accent and an ogonek. These are not in Unicode as precomposed characters I believe, so maybe that doesn't count. The point is the comp faced with setting the material has to come up with a solution, and that solution will not be found looking for a typeface that has these characters. They are easy to make, but you do have to make them.</p>
      <p>There are presses in the Midwest and Northeast that handle different Native American Languages. Same problem with characters not available.</p>
      <p>Or if this is too esoteric, how about transliterated Arabic? Comes up a lot these days. I grumble about having to set the underdots, but am told that without them, it is very hard to tell just which Arabic character is being represented. Mainly, these are Dd, Hh, Ss, Tt, and Zz with dotbelow. They are in Unicode, I believe Latin Extended Additional. I haven't found them in any Adobe, Monotype, or Linotype Opentype font. So again, the comp has to come up with a solution. Now you can set a period (full stop), change the point side (smaller), lower it, kern it back under the letter, set the next letter &amp; kern it "forward" to where it should fall. </p>
      <p>One down, 749 to go.</p>
      <p>Just one reason I rant about EULAs. There is no difference in the look of the final product, the printed book, but there is a hell of a lot of difference in effort, and resulting cost to the publisher. There is also the matter that publishers today don't regard the printed book as the final product. For the XML file to be useful, somebody is going to have to go into it &amp; change all those kerned periods (which also have code to change &amp; varying position for different letters &amp; font styles) to the proper Unicode index. I suppose you don't have to change it to the precomposed glyph (that would involve more searches) but to just the combining diacritic. </p>
      <p>As for me, if the EULA allows, I'll "modify" the font by making up the character. Which reminds me, hove about putting the combining diacritics in fonts?</p>
      <p>Now if Native American and Arabic Transliterations aren't enough, you can add "Sanskrit". We got one job from a publisher that usually set their books in house because they couldn't set the transliterated (Latin alphabet) characters (See ISAT at Wikipedia). These too are in Unicode.</p>
      <p>Or the scholars who deal with Old English. They want more than their (frequently missing) yoghs. Take a look at the Junicode fonts down in the private use area. And some of these scholars have submitted a set of characters to the Unicode consortium, &amp; I'd bet they will be added.</p>
      <p>So much for (1).</p>
      <p>I told a little fib earlier -- because the solution for a comp encountering a need for these characters is not "looking for a font." Font selection in scholarly publishing is done by the book designer. They are not going to use Junicode, or Gentium for that matter. As useful as these fonts may be for manuscripts (typescripts, really), they are not going to be acceptable to any book designer at any publishing house I know of. Some designer's will consult with the comp about font selection in a book, most won't. Their attitude is they want it set in Minion or Scala or whatever, and it is the comp's job to figure out how to do so. </p>
      <p>A P.S by-the-way. Using InDesign, take a look at Monotype Bulmer OT sold through Adobe. Set the fi-ligature followed by an apostrophe. oops. Best I can tell, the class code for the _f set (which contains all the f-ligatures) is set up to allow class-based kerns on the left only. But somehow the kern for "f" "apostrophe" &amp; a whole host of punctuation following the "f" got included in the class-based kerning. All the kerns are on the right, for every member of the class. Fortunately I have the Adobe EULA on this one and can go in &amp; fix it, before I have to set a book where the main character has the nickname "Jiffi"</p>
      <p>The point isn't to pick on type designers or foundries. How can they possibly foresee all the uses their work will be put to. The point is that the "font" isn't done when released by the foundry. It never was, even in the days of hand-set type -- quick, "where's the saw?"</p>
