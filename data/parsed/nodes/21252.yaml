    html: |-
      <p>You need to check of course, but as I remember, the Monotype EULA doesn't permit the end user to modify the font for his/her own use. Adobe on the other hand, does. It is not hard to make ligatures, or for that matter, many other characters which are simply accented. No foundry to date includes all the characters you might need.</p>
      <p>As to Sabon, I think Monotype at some point licensed the font from Linotype. The reason I think this is that the italic is the wide-set version you get from the days when the Linotype linecaster used duplexed mats, so the ital had the same setwidth (perforce) as the roman.</p>
      <p>When Linotype went from metal to film, they kept the same italic, even though the technical reasons for it were gone. When Tschichold dew up Sabon, he made three versions: One for Linotype, one for Monotype, and one for Stempel for hand-setting. The Linotype and Monotype versions were drawn with the limitations of machine setting in mind. Monotype and Linotype (metal) machines were quite different, so the compromises were different.</p>
      <p>If one were to argue which is best, it would be the Stempel; as a hand-set font, it had none of the mold problems of Linotype nor the unit-based compromises of Monotype. And of course, the Stempel is the one we can't get.</p>
      <p>I have owned both Linotype &amp; Monotype PostScript fonts, though the Monotype I bought was back in the early 1990s, thinking it might have a better italic than the Linotype. It was exactly the same. So I recut it, looking at the Stempel to a large degree.</p>
      <p>As to the "new" Sabon, well, what was Sabon ever but a nice Garamond, with some thought into it to have harmonious versions for differing technologies. As those technologies are no longer used (i.e., no longer impose restrictions ), The "New" Sabon is just another nice Garamond variant. But to my eye, it certainly isn't Sabon. I'm sure I'll take some heat over that statement, so let me say it is only my opinion.</p>
      <p>As to converting Type 1 to OpenType, it is more a matter of saving work you have put into them rather than saving money. It takes me about 8 hours to convert &amp; write features for a new OT version of the roman text font. Less for italic &amp; much less for display. Part of that is getting all the superscripts for footnote calls, and numerator/denominators for unlimited fractions, and then kerning them all. Etc. But the way I work isn't likely one you could use; all our old Type 1 fonts were database versions (all glyphs in one font), which saves me a bunch of time. And I have Y&amp;Y TeX tools, which lets me make a PFA from a PFB, then run  a script I wrote to change all the old names (like Asmall to A.smcp). I do most of the "features" work in a text editor outside FontLab &amp; can get a list of the characters I want for each feature from the AFM. Likely you could do this with Python &amp; any text editor that let you shift into a column mode, but it all takes time, and if you don't have something you've worked hard on in your Type 1 fonts, you would likely be better off to re-buy them.</p>
    html_clean: |-
