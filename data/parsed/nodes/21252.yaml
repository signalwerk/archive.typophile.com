      <p>Charles --</p>
      <p>I always enjoy reading your comments, and I respect your vast experience in book composition.</p>
      <p>However, I believe you were mistaken above when you stated that Tschichold drew three versions of Sabon, one for each of the three technologies. I'm pretty certain that the original brief was for a single design that would set identically in all three technologies. </p>
      <p>That proved an enormous challenge, especially addressing the conflicting limitations of the Monotype and Linotype. The resulting design was constrained to an 18-unit system (Monotype's primary technical restriction) <em>and</em> the italic had to be duplexed to the roman (Linotype's technical primary limitation). </p>
      <p>As far as I know, the Stempel version could just go along for the ride. The main advantage of the Stempel fonts was that they were made in larger display sizes, something that was not done for the machines. As a consequence, I believe that the larger sizes had some additional refinements, since they no longer needed to be identical to Mono or Lino versions.</p>
      <p>This would be the reason that your MT version exhibited the same wide italics as the LT version. They were, in fact, the same originally.</p>
      <p>Now, why the digitizations retained the original machine-metal limitations, that's another question . . . one which presumably Sabon Next was meant, in part, to answer. But then, it took off on a slightly different track. </p>
      <p>Perhaps when you release Sabon from the technical constraints that gave birth to it, it ceases to be the Sabon that we know and love.</p>
      <p>-- K.</p>
