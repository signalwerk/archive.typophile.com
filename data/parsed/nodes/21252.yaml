      <p>&gt;&gt;Even if the EULA does not allow modifications, one could contact the designer of the font to add the necessary characters. Perhaps this is easier to do with a smaller shop (and an advantage with working with independent designers).&gt;&gt;</p>
      <p>Well, as one small voice in the wilderness, my solution to foundries that don't allow modification for ones own use is to not use those fonts. Why should I pay to have a dot or macron put under or over a letter? And you have to understand this whole matter of "paying." When a publisher accepts a manuscript, a lot of people wind up with their hands on it. The designer is the person who selects the typefaces. There are obviously some restrictions put on him/her. Sometimes the designer is a freelancer, sometime an employee of the publishing company or university press or whoever. The minute some foundry starts forcing the letter of the EULA, the press director is going to issue an edict "only use fonts from foundries that don't do this" -- or since most directors handle things in a generalized manner -- "Only use Adobe fonts," letting the designer come back with a list of foundries who permit modifications to a font.</p>
      <p>Even if you are willing to make up the required characters for free, there is a time factor. You gonna do the work &amp; get it shipped in an hour?</p>
      <p>And if you are going to charge – the old practice from the days of the Linotron 202 for example. Linotype’s practice was to make up the characters (supplemental font), which was available to anybody, EXCEPT as a concession to the guy who paid, it wasn’t advertised or listed in the catalogue. So unless you saw a lot of work &amp; poked about, you didn’t know those supplemental sorts were available. If you’re gonna charge and then make it available to all &amp; publicize this, you’ll get grumbles from the person who had to pay extra.</p>
      <p>My personal feeling about EULA’s is that whoever licenses the type promises two things: (1) They won’t bring any discredit to the foundry, and (2) they won’t cost the foundry a sale. The rest is the language of Lawyers.</p>
      <p>Now there are a few who say, “No. My little gem is perfect as is, you can’t do anything to it, including changing the kerning.” I won’t buy those fonts, and will turn down any book where the designer has selected such a font, unless they can show me a site license which covers both the publisher and their subcontractors – which doesn’t happen. Ever. And does “no kerning” imply you can’t “track” the font? Or, using InDesign, ignore the metrical kerning &amp; go with ID’s optical kerning &amp; tracking? Makes no sense, just like making up accents via kerning, size change, etc. in an “applications program” instead of making up the character in FontLab.</p>
      <p>And Miguel (if I may) what isn’t a specific segment of the market?</p>
      <p>And Kent, likely you’re right. I had some fleeting conversation with Carter about Sabon, but probably mis-remembered what he described as the problems implementing it. I always wondered why the italic foundry version chopped off the terminal on the “j” and others didn’t. But if you look in the ENCYCLOPEDIA OF TYPEFACES, the italic shown is surely the Spempel (it even says so), and if you look at the Linotype version of the italic, the spacing &amp; even some of the letterforms are quite different. But I imagine you’re right that Tschichold only made one set of drawings.</p>
      <p>Charles</p>
