    html: |-
      <p>Fonts can be lightened in font production applications, although it is easier IMO to make very light weights by drawing a skeletal path and thickening it by stroking or parallel pathing. </p>
      <p>In apps like InDesign, type can be thinned by applying a very fine outline in the background colour.</p>
