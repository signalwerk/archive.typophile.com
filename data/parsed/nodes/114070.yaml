    html: |-
      <p>Unless you need to support legacy systems, the various encodings serve as more of a tool to subset the full Unicode range down to something fathomable.</p>
      <p>For a basic western Latin font, I suggest switching among several encodings to form a character set that is a superset of Latin 1 (iso 8859-1), Latin 0 (iso 8859-15), MacRoman and Windows Latin (MS Windows 1252 Western). I use FontForge so the menu labels are slightly different, but I think they correspond.</p>
      <p>There are certain glyph slots that need to be filled for Windows and maybe other OSs for a font to be recognized as valid, and I am reasonably sure that the above superset covers those (and much more, perhaps too much). I'll have to pore through some references to confirm. I should have this committed to memory but that doesn't work as well as it used to.</p>
      <p>Aside from that, other encodings include glyphs for various language support extensions, but even they relate more to legacy teletype systems rather than real language requirements.</p>
