  html: <p>Hello everyone! I am an extreme newbie, so please forgive my total ignorance. I'm a graphic designer who is just starting to experiment with font design for fun. I'm using TypeTool 3 and I have a question about codepages. How does one go about deciding what codepage to build a font in? TypeTool defaults to 'MS Windows 1252 Western' but I don't understand how or why I would choose that codepage over say 'Latin 2' (of course, Cyrillic, Greek, Turkish, etc codepages have an obvious use). Like I said, I'm sure the answer is obvious - thank you so much for your help!</p>
  html_clean: <p>Hello everyone! I am an extreme newbie, so please forgive my total ignorance. I'm a graphic designer who is just starting to experiment with font design for fun. I'm using TypeTool 3 and I have a question about codepages. How does one go about deciding what codepage to build a font in? TypeTool defaults to 'MS Windows 1252 Western' but I don't understand how or why I would choose that codepage over say 'Latin 2' (of course, Cyrillic, Greek, Turkish, etc codepages have an obvious use). Like I said, I'm sure the answer is obvious - thank you so much for your help!</p>
