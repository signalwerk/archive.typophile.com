    html: |-
      <p>FontFont fonts are expensive. IF you're looking for a sample of a *typeface* to use as a model for hand stitching, and IF a chancery is to be that model, here is a place where you can get them legitimately, for free.</p>
      <p><a href="http://www.fontspace.com/category/chancery" title="http://www.fontspace.com/category/chancery">http://www.fontspace.com/category/chancery</a></p>
      <p>particularly -- though the W is different --</p>
      <p><a href="http://www.fontspace.com/gust-e-foundry/texgyrechorus" title="http://www.fontspace.com/gust-e-foundry/texgyrechorus">http://www.fontspace.com/gust-e-foundry/texgyrechorus</a></p>
      <p>A generally more useful site for free fonts is font squirrel</p>
      <p><a href="http://www.fontsquirrel.com/fonts/list/category/Calligraphic" title="http://www.fontsquirrel.com/fonts/list/category/Calligraphic">http://www.fontsquirrel.com/fonts/list/category/Calligraphic</a></p>
      <p>If you're really after a *font*, that is, some software that will be used (more or less automatically) to drive a printing press, laser printer, sign-painting machine, or in your case, a sewing machine, you may need to keep looking</p>
