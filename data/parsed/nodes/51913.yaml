    <p>//////////////////////////////////////////////////////////////////////////<br>
    <strong>NOVEMBER.08 NEW RELEASES</strong><br>
    //////////////////////////////////////////////////////////////////////////</p>
    <p><strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000374#specimen">Angelus</a></strong><br>
    The latest typographic creation by Angel Koziupa and Alejandro Paul. It is a flowing script that can perhaps be seen as a casual, modern version of the traditional copperplate script. A fresh take on how ascenders and descenders interact with the context of the setting. Angelus is ideal for use in package design, as well as on personalized collateral and book covers.</p>
    <p>//////////////////////////////////////////////////////////////////////////<br>
    NEGRO FONTS BY SUDTIPOS<br>
    //////////////////////////////////////////////////////////////////////////</p>
    <p><strong><a href="http://www.myfonts.com/fonts/sudtipos/lynda/familytree.html">Lynda</a></strong><br>
    A post-modern, monoline rounded sans ideal for club flyers, music covers and fashion publications.</p>
    <p><strong><a href="http://www.myfonts.com/fonts/sudtipos/paz/familytree.html">Paz</a></strong><br>
    A squarish 4-weight industrial family, ranging from extreme hairline to black.<br>
    It is ideal for editorial headlines where type plays a major role in the overall design.</p>
    <p><strong><a href="http://www.myfonts.com/fonts/sudtipos/santino/familytree.html">Santino</a></strong><br>
    A rounded monoline, post-bauhaus geometric font with smooth extremes and a touch of modern sensuality. It is named after Ariel “Negro” Di Lisio’s son.</p>
    <p>All the Negro fonts were designed by Ariel Di Lisio and digitized by Alejandro Paul.</p>
