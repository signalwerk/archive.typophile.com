  html: <p> I saw an ampersand used in a Spanish logo today.  Is this common?  I can understand why English uses the ampersand - besides its elegance, it's brief and requires fewer strokes and less space to write than "and".  But in Spanish, "y" is easier and faster to write. <br> <br>Paul </p>
