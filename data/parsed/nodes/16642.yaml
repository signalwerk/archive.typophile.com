    html: |-
      <p>This is a sweet, fun, naïve font, and I like it. Some of the crazy inconsistency is charming, but I would evaluate the following:<br>
      _ Why are the counters of the B, P, and R circles? Look at D, O, U. These glyphs are more successful.<br>
      _ The thins of the C, G, J, and S are thinner than the thins of D, E, O, etc.<br>
      _ I love how wack the V is, but wonder if an inverse of the A might not be more consistent.<br>
      _ I love how wack the M is, and wouldn't change it.<br>
      _ The circle in the G is lower, which gives you permission to lower the circles in A and F; they need it.</p>
