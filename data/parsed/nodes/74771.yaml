    html: |-
      <p>If you click the "Rename Glyphs in all Classes" option when you use the "Rename Glyphs..." command (which I noted above), then, yes, the glyphs names will be changed in the classes as well, most importantly in the kerning classes.</p>
      <p>If you want the vertical metrics to be the same across several font, then use the same values. Regarding vertical metrics, I recommend this document: <a href="http://kltf.de/downloads/FontMetrics-kltf.pdf" title="http://kltf.de/downloads/FontMetrics-kltf.pdf">http://kltf.de/downloads/FontMetrics-kltf.pdf</a></p>
