  html: |-
    <p>What would be the best/smart/easy way to transform an OT font that is fully featured and has several stylistic variants, into separate fonts for each feature, <strong>while still maintaining the kerning pairs </strong> etc.?</p>
    <p>For example if an OT font has the standard latin characters + small caps + titling characters + alternates... to have the SC and Titling as standalone functional separate fonts.</p>
    <p>What would be a good way to do do that?</p>
