      <p>Actually, you don't really need to change the glyph names. All you need to do is to reassign the Unicode codepoints. In FontLab Studio, this can be fairly easily done with a different .nam file. You pick it and choose "Generate Unicode", then pick the different .nam file. </p>
      <p>Best,<br>
      Adam</p>
