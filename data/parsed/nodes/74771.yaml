      <p>The script keeps all other OpenType lookups in the font as is, so may be you want old "kern" table. Change line 117 from:<br>
        <code>outfont.generate(outfile)</code><br>
      To:<br>
        <code>outfont.generate(outfile, flags=("opentype", "old-kern"))</code></p>
      <p>And see if this works (I assume you are generating the font from the script directly not creating an intermediate SFD file).</p>
