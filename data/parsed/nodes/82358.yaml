  html: |-
    <p>I routinely google the term Fontry. That is the name for our very small foundry. The name turns up in some very interesting places. It's usually good for a laugh. Yesterday, I found that I could download almost our entire catalogue on filesonic, and we are in good company. Many of the largest foundries are represented/pirated there. I wasn't certain if I should be angry, amused, or flattered. Now I have to go through all of the red tape to get our fonts removed, afterwhich I have to keep doing searches waiting for the person to put them online somewhere else. I would love for someone to help me see the silver lining in this.</p>
    <p>James</p>
