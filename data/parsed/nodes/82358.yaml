    html: |-
      <p>I would say its an honor. The music theft pov goes like this:</p>
      <p>1. Piracy is a fairly sincere form of flattery.<br>
      2. In the "attention economy," they're actually helping get your work "out there." ie. With hundreds of thousands other fonts out there, the trick is getting people to notice your work.<br>
      3. The people stealing your work aren't people who were likely to buy it anyway. They're kids, students, etc. - people not even close to being professional designers.  It's a homemade educational discount.</p>
