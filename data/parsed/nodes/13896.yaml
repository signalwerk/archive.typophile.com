      <p>Echoing what Tim said: It's a bit too ambiguous for me right now. I have a hard time picking it apart visually and mentally. The forms aren't distinct enough for me yet, but I like the direction. Maybe avoid outlined shapes and make the telescope mildly less abstract.</p>
      <p>Normally I'd never say this, but the shapes of the mark and the type might be too integrated. Mainly it's the circle, which I assume is a head. It's too much like a letter to me, but not enough like the type, so my mind's eye keeps trying to resolve it, like an optical illusion that flickers between two interpretations. Find a balance between contrasting the shapes and the type and integrating them. Also, the star is a bit close to the telescope. My wife commented that it read like a cannon for her, rather than a telecsope, at first glance.</p>
      <p>Regardless, it looks like you've got a strong concept in mind and a clear sense of the aesthetics. Keep refining, and it'll be really sharp.</p>
