      <p>I suppose the first question should be whether the client would be happy to see their activities reduced to a very basic interpretation.<br>
      If the answer is yes then the weight of the strokes of the observer and star might be better if they were equal and the arm might benefit from being more geometric like the star and head. As you have chosen Futura Condensed the bar of the A formed by the arm is rather high. There is a shape formed by the inside of the top bowl of the S that could be used as a left shoulder that might be worth exploiting. The telescope doesn't immediately reveal itself, the tapered/irregular shape could be a megaphone, maybe a more conventional telescope, a series of rectangles perhaps. Have you looked at having the objects filled rather than stroked, at least in the colour version it might be too much in the black version, the head looks too close to the S.<br>
      For the type I would look at having equal tracking throughout and centred, maybe tighter tracking and larger point size or as a single line, the looser tracking of the second line is too light and the alignment of the I, L and E will be difficult to bring off.<br>
      Tim</p>
