      <p>First off, I'd like to thank all of you for your thoughts and ideas! :) Sorry it's taken so long to reply, I've been a busy man (new baby, new summer job). But now work is done, and I'm back to school - my last semester. This logo was a project in school, and I'd like to refine it for my portfolio. </p>
      <p>This particular logo will be on hold for a few more weeks, as I need to work on my self-identity first, so I can get some cards and stationary printed.  (Maybe I'll show you all that too, as I work on it)</p>
      <p>I'll definitely work on the shape of the telescope, to make it more readable. And play around with the star some more (it was originally filled, not outlined). When I've come up with some new stuff I'll post it. </p>
      <p>Above all, I want to keep the logo economical and efficient. So saying that it's simplistic is sort of okay - that's what I'm going for. I believe a scientific group would appreciate an economical solution. And being able to visually represent an activity with a few geometrical shapes is my goal. </p>
      <p>And yes it's named for Harlow Shapley, a much under-appreciated astronomer imho. (I was almost a physics/astronomy major).</p>
      <p>Thanks,</p>
      <p>Chad</p>
