  html: |-
    <p>As the Beatles sang: Help!<br>
    I have two font weights with the same number of glyphs, same encoding, and  glyph names, but the unicode entries are incomplete or missing in one of them.  How do I either:<br>
    Copy the good unicode names from one font to the other without changing the outline, bearings or anything else?<br>
    or<br>
    Copy the outline and side-bearings to the font with the good unicode names?<br>
    Another question: is there a quick method to sort and color all the component glyphs of a font in Fontlab?<br>
    Many thanks.<br>
    Vladimir</p>
