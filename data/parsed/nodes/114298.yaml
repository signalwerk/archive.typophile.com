    html: |-
      <p>The easiest way to do this would be to simply copy the cmap table from the good font to the other one. I would use DTL OTMaster for this, which is a simple copy/paste operation, but if you want a no-cost option you could use TTX: dump cmap table from one font and merge it to the other.</p>
      <p>Note that this relies on the glyph ordering of the two fonts being identical.</p>
      <p>Another way to do this, in FontLab, is to save a .nam name-to-unicode file of the good font, and then use it to Apply Unicodes to the other font.</p>
