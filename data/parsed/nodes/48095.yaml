    <p>Hi all, </p>
    <p>Can anyone recommend any san-serif faces that have serif attributes such as tails? </p>
    <p>Apologies for the newbie question, I am not exactly sure when a san-serif becomes a serif?</p>
    <p>I am trying to create a logo that has a nod towards the traditional aspect of the company, as well as the forward thinkingness of the company.</p>
    <p>Appreciate any help to get me on the right track.</p>
    <p>Thanks</p>
