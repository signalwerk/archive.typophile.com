      <p><cite>How can we create the central white lines that we find in the middle of all the curly letters?<cite></cite></cite></p>
      <p>You could draw a skeleton of your script in pencil. Then still in pencil build up where the strokes need to be thicker. When you are ready, outline your drawing in ink. Finally, erase the pencil lines when the ink is dry. </p>
      <p><cite>or we can follow different rules/ using different tools.<cite></cite></cite></p>
      <p>Yes.</p>
