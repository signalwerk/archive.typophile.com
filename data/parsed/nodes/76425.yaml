    <p>Hello everyone!<br>
    The "Almighty" Seb Lester updated his website with brand new lettering posters.</p>
    <p><a class="freelinking external" href="http://ilovetypography.com/2010/11/15/typographic-posters-dreams-stars-so-much-to-do/?utm_source=feedburner&amp;utm_medium=feed&amp;utm_campaign=Feed:+ILoveTypography+(i+love+typography)&amp;utm_content=Google+Reader" rel="nofollow">Here you can read an interview from ILT blog</a></p>
    <p>Scketches show us how he got to the final solution, developing the entire process.</p>
    <p>I'm a big fan of all Lester works (who is not?...lol) and I wish I could start developing some fine lettering artworks...<br>
    We can see a lot of hand-writing developement, then vectorized.<br>
    About the vector-converting  process, do you have any, suggestion, tutorials, links, guides, in order to understand the right way to do that?<br>
    Is that an amazing and endless pen-tool masterpiece, or we can follow different rules/ using different tools. How can we create the central white lines that we find in the middle of all the curly letters?</p>
    <p>Thank you so much in advance. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dreams_roughs2_4014.jpg"></div><p></p>
