    html: |-
      <p>I would be inclined to say that none of them work well enough to be tolerable.</p>
      <p>However, in the old days, people did put up with typewritten copy, and it was readable enough. And there were a couple of typestyles for the Selectric, such as Bookface Academic and Diplomat, which even resembled serif typefaces.</p>
      <p>I'm not sure that they're equalled by any monospaced typeface currently available, since now that proportional spacing is easy, monospaced typefaces are intended to look like typewriter faces so as to contrast with normal typefaces.</p>
      <p>EDIT: There may be some choices out there.</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/mvbfonts/mvb-fantabular/medium/" rel="nofollow">http://www.myfonts.com/fonts/mvbfonts/mvb-fantabular/medium/</a><br>
      resembles Diplomat;</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/alix-fb/" rel="nofollow">http://www.myfonts.com/fonts/fontbureau/alix-fb/</a><br>
      resembles Prestige Elite;</p>
      <p>Lucida Typewriter seems to be worth consideration as well.</p>
      <p>EDIT: Oops! In going through MyFonts, I ended up finding two Nick already mentioned!</p>
      <p>This one didn't turn up in my search:</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/century-schoolbook/century-schoolbook-monospaced-10058/" rel="nofollow">http://www.myfonts.com/fonts/bitstream/century-schoolbook/century-schoolbook-monospaced-10058/</a></p>
      <p>but while the glyphs look all right, there appears to be too much spacing between the letters to make it a good choice.</p>
