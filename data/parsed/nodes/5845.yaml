    html: <p>&gt; <i>Was this designed by the same person(s) that designed Motter Corpus?</i> <br> <br>Yes. Othmar Motter. <br> <br>He also designed <a href="https://web.archive.org/web/20141113071224/http://www.myfonts.com/fonts/itc/motter-femina/familytree.html">ITC Motter Femina</a>, <a href="https://web.archive.org/web/20141113071224/http://www.myfonts.com/fonts/fontfont/motter-festival/">FF Motter Festival</a>, <a href="https://web.archive.org/web/20141113071224/http://www.myfonts.com/fonts/itc/motter-sparta/familytree.html">ITC Motter Sparta</a> and <a href="https://web.archive.org/web/20141113071224/http://www.paratype.com/pstore/fonts/Motter_Tektura.htm">Motter Tektura</a> - which was Apple used in its early <a href="https://web.archive.org/web/20141113071224/http://www.maclab.dk/dokumentation/logoet/grafik/logo_lysskilt.jpg">corporate branding</a>.</p>
    html_clean: <p>&gt; <i>Was this designed by the same person(s) that designed Motter Corpus?</i> <br> <br>Yes. Othmar Motter. <br> <br>He also designed <a href="https://web.archive.org/web/20141113071224/http://www.myfonts.com/fonts/itc/motter-femina/familytree.html" class="link-external">ITC Motter Femina</a>, <a href="https://web.archive.org/web/20141113071224/http://www.myfonts.com/fonts/fontfont/motter-festival/" class="link-external">FF Motter Festival</a>, <a href="https://web.archive.org/web/20141113071224/http://www.myfonts.com/fonts/itc/motter-sparta/familytree.html" class="link-external">ITC Motter Sparta</a> and <a href="https://web.archive.org/web/20141113071224/http://www.paratype.com/pstore/fonts/Motter_Tektura.htm" class="link-external">Motter Tektura</a> - which was Apple used in its early <a href="https://web.archive.org/web/20141113071224/http://www.maclab.dk/dokumentation/logoet/grafik/logo_lysskilt.jpg" class="link-external">corporate branding</a>.</p>
