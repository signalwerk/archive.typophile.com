      <p>Update: </p>
      <p>The official digitization of <a href="https://web.archive.org/web/20141113071224/http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=162648" rel="nofollow">Motter Ombra</a> is available digitally for two weeks now at <a href="https://web.archive.org/web/20141113071224/http://www.motterfonts.com/" rel="nofollow">Motterfonts.com</a>. So are  Motter Faktum,&nbsp;Motter Femina,&nbsp;Motter Ferrum and Motter Ornata. Soon available will be Motter Tektura and Motter Air.<br>
