      <p>I have one ongoing freelance project currently and another strong lead for some freelance work that would require travel (although I'm not sure how consistent it would be). I am also trying to open my own design studio and build up a collection of illustration and design available for licensing. To really pursue my leads, I need more flexibility. On top of that, I already work from home and the offer with this stationery company is only guaranteed through September as the companies merge and transition. After September they could cut me loose or keep me. </p>
      <p>To me it makes sense to contract and have my hand in other pursuits, but I guess I could be wrong. And again, I'm not sure what kind of hourly compensation to ask for if I do.</p>
