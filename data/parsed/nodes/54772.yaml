    <p>I was offered a full-time salaried position nearly identical to the one I hold now, but at this point I think I would rather work as an independent contractor, negotiate a higher hourly rate and purse other freelance and personal projects at the same time. I currently feel like I am underpaid and would like to ask for more. However, I don't want to alienate the new management so I am worried about asking for too much.</p>
    <p>I know you don't know my exact situation but what would you do if you were in my shoes, my savvy fellow designers?</p>
