      <p>Given the economy, I would stick with the stationery job as long as possible while writing up a business plan, designing promotional materials, and networking. I would also spend a lot of time researching what kind of rates other local designers charge and find out if those rates are profitable, and consider whether you can survive on lower rates in a year when there are more freelancers competing and businesses have less to spend.</p>
      <p>As for asking for more money, be very careful unless research shows that you are VERY underpaid. They can probably just drop you and hire a desperate laid-off designer/illustrator to work for even less, so you’d better have a lot to bring to the table when you start that negotiation.</p>
    html_clean: |-
