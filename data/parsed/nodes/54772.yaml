    html: <p>Never make your employer believe that you would be prepared to work for less money or that you would think your work would not be worth more than the company is paying for it. Asking for a lot more money and then simply staying at the company with your present salary is not a credible option either. So maybe proposing to discuss your salary based on your qualifications,  your actual work and responsibilities, and the economic situation of the company is the way to go, and leaves you several options how to proceed based on their response. -- cs</p>
