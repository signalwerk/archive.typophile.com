    html: <p>My advice is - take the full-time position while building up your freelance client base on the side. Then, when you have enough clients and leads make the jump. This is what I did back in 2000. Unless you're incredibly good at selling yourself, marketing and networking - which most designers aren't that great at, myself included - it will be tough getting new business right now in this economy. Good luck.</p>
