      <p>Best advice I can give you is NEVER fear you're asking too much. More often than not, if you're at the point where you're discussing salaries, they want you, and will do their best to come to an agreeable salary.</p>
      <p>Also, as a graphic designer, throughout your career you will likely work for a company, miss freelancing, so then eventually quit and freelance, then miss the paycheck and benefits, so will then go back to work for a company, and then repeat that for 40 years or so.</p>
