    html: "<p>Hey, so is there a Rule that says the poser of the question can ignore other Rules at will?... <br>Why exactly didn't Matha win? <br> <br>-- <br> <br>HD, are you sure about the Microtek business? Maybe it was the other way around, or maybe it was a recent thing? Back when I used to sell pre-press equipment (don't ask...) Agfa was a bastion of quality. Anyway, the reasons I like Agfa are that: they didn't engage in the total bullshit about resolution (some companies would advertise like 14 million dpi while keeping the true optical resolution secret), and their software was ultra powerful from day one, unlike the dumbest-common-denominator \"user-friendly\" stuff out there. My lowly SnapScan (which I got for like $50) performs marvelously - you can tell it's serious when it forces an extensive warm-up/calibration after prolonged lack of use. <br> <br>BTW, I personally haven't met a single Epson product I've liked - except maybe when they first came out with their high-end color inkjets. <br> <br>hhp <br></p>"
