  html: <p>I am working on a proposal that my company is putting together. It's a huge binder filled with a lot of financial info as well as photographs and architectural renderings of our stores. <br> <br>We are using Neutraface as the display face, but I want to use a serif that complements Neutraface and is legible, hopefully making long financial pages less dull. <br> <br>Suggestions?</p>
