    html: <p>Neutraface has those tall, spindly ascenders, which makes it a little hard to match. I'd suggest an antiqua like <a href="http://www.myfonts.com/fonts/linotype/koch-antiqua/">Koch Antiqua</a> or <a href="http://www.myfonts.com/fonts/spiecegraphics/eva-sg/">Eva SG</a>, but those are too overtly calligraphic and achieve much of their effects through low x-height rather than tall ascenders. Also, it's too spindly for use as a text setting. <br> <br><a href="http://www.myfonts.com/fonts/emigre/filosofia/">Filosofia</a> has a similar amount of personality as Neutraface, and is roughly the same age.</p>
    html_clean: <p>Neutraface has those tall, spindly ascenders, which makes it a little hard to match. I'd suggest an antiqua like <a href="http://www.myfonts.com/fonts/linotype/koch-antiqua/" class="link-external">Koch Antiqua</a> or <a href="http://www.myfonts.com/fonts/spiecegraphics/eva-sg/" class="link-external">Eva SG</a>, but those are too overtly calligraphic and achieve much of their effects through low x-height rather than tall ascenders. Also, it's too spindly for use as a text setting. <br> <br><a href="http://www.myfonts.com/fonts/emigre/filosofia/" class="link-external">Filosofia</a> has a similar amount of personality as Neutraface, and is roughly the same age.</p>
