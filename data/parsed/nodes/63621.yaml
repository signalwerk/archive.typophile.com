      <p>I see: country music only. </p>
      <p>I don't see a hat, I thought it was a button.</p>
      <p>I can't get past the folksy country vibe; it feels a bit too homegrown to be management. "Folksy" might be very unappealing to any musicians other than country. When I think of all the types of musicians out there - rock, punk, classical, orchestra, reggae, opera, jazz - it makes me seriously wonder if folksy is the best way to go. </p>
      <p>Does this firm handle just one type of musician?</p>
