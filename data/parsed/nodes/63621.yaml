      <p>When I think of top hat, I think of a magic wand too - which is performing + magic, not performing + music. But that is just my take.</p>
      <p>I would choose a different font for BIG STAR. </p>
      <p>When I think of "Big Star" I think of hopes and dreams of becoming a big star, and making it big, having your name in lights, glitz, broadway, etc. Not "folksy". So the title and the folksy font seem to conflict.</p>
      <p>Creative way to show a top hat though - I would keep pushing out more iterations to see what you come up with.</p>
