    <p>This is a rough idea. They will be managing musicians and what not so I wanted to make it look folksy. </p>
    <p>I'm trying to use simple shapes to create a generic hat with a star on top. However, I don't think the fonts completely work. What do you all think?</p>
    <p>I'm using Giza and Gotham. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_gif_03_5329.gif"></div><p></p>
