    html: |-
      <p>The top hat feels like a strong mark, but it is a bit confusing. A top hat hints at Broadway or Charles Dickens - You could potentially go full-country: a cowboy hat with star conchas. Or use multiple logos ala typophile - a jazz fedora with a star on a playing card stuck in the hat band, or 80's metal hair with a star on the headband. </p>
      <p>Well, that's probably over-the-top. But you've got some fun leeway, that's for sure.</p>
