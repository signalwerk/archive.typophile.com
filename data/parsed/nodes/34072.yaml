    <p>A small subset of this forum resides in the city of Calgary. And we have taken to meeting once a week at a local pub to continue our discussions about type. (Also, some beer drinking is involved.)</p>
    <p>This is a general invitation for any others in the Calgary area who would like to accompany us. The conversation isn't always about serifs and such, and there are other people at the table who aren't typophiles. Everybody is welcome. Bring a friend, bring a spouse. Bring a biker gang. No appetite for beer? Still welcome.</p>
    <p>Other typophiles passing through the city (yeah, right!) are also invited.</p>
    <p>Interested? Feel free to contact Linda Cunningham or myself for details.</p>
