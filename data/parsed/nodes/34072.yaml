      <p>In some ways it still is -- you can see men in dress western suits and boots in the corporate world, but not like it was when I was a kid (far too many years ago). </p>
      <p>Unfortunately, there's a serious push on to make the whole "Stampede Experience" (blech) warmer, fuzzier, and a whole lot less "icky" and "offensive" to city slickers.  :-(</p>
      <p>(You can still learn to milk a cow at Stampede, except it's a full-sized, plastic cow so no one -- cow or human -- gets hurt. And if you go into the barns, there's all kinds of signs around saying no one is liable if anything happens, and "don't forget to wash your hands when you leave." That sure wasn't how the west was tamed: a century ago, men were men and sheep were nervous.)</p>
