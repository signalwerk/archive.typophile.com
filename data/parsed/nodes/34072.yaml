      <p>A short report after a successful meeting:</p>
      <p>We managed to assemble a goodly portion of Veer's jigsaw puzzle. We were hampered by the overall painted artwork on the surface of Table 49. It interfered with the {same color palette of the} puzzle. There was some beer drinking and throwing of jigsaw pieces involved. But the typographic bits of the puzzle got done. </p>
      <p>We're sending a package off to Veer which includes a large portion of the puzzle (assembled or not), some beer-stained coasters, and possibly a few well-gnawed chicken bones.</p>
      <p>Lex was unavailable because of previous commitments, so we put his name to the courier waybill.</p>
