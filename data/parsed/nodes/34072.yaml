      <p>The eastern/southern version of a classic summer biz style would be the pink/powder blue seersucker suit. And a bow tie. When I first arrived in T.O. in the 1970s, there would still be a few around on Bay St. The summer version with shorts and a straw hat, maybe even a boater (very Mad. Av.) was way cool. But I guess you could wear seersucker with cowboy boots and a Stetson? No doubt Veer has a stock shot...</p>
