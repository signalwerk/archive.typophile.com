    <p><a href="http://www.houseind.com/index.php?page=showfont&amp;category=&amp;id=14#14" title="http://www.houseind.com/index.php?page=showfont&amp;category=&amp;id=14#14">http://www.houseind.com/index.php?page=showfont&amp;category=&amp;id=14#14</a></p>
    <p>but don’t really want to purchase the entire collection; I really just need this one font. Does anyone know of anywhere else I can find it?</p>
    <p>Thanks in advance</p>
    <p>Jared</p>
