    <p>Not really a ID-question but I don't know where else to go with my question. </p>
    <p>I made something a booklet with Dala Floda as Headline Font. Now the same booklet will be translated to Russian and I desperately need a cyrillic font, similar to the Dala Floda. Any lovely suggestions?</p>
    <p>This is the Dala Floda:<br>
    <a href="http://typedesk.com/2010/12/09/dala-floda-by-paul-barnes/" title="http://typedesk.com/2010/12/09/dala-floda-by-paul-barnes/">http://typedesk.com/2010/12/09/dala-floda-by-paul-barnes/</a></p>
    <p>Thank you so much for your help!</p>
