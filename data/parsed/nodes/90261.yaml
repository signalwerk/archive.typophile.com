    <p>Hello everyone.<br>
    I have a presentation coming up about "Calligraphy - A relaxing and inexpensive hobby."</p>
    <p>I am thinking to start off with the topic of Machines vs Humans. Then I will move to <strong>advancement in digitalization of Calligraphy, But the problem I am having is that I dont have enough material. I need help in this topic.</strong></p>
    <p>After that I will be talking about Typefaces and after that I will cover the topic of Language... and then I will come to Digital Calligraphy in Arabic/Persian/Urdu(as they all are of same kind.</p>
    <p><strong>I want to know that what should I say in the advancements in digitalization of Calligraphy, and how it is more effective.</strong></p>
