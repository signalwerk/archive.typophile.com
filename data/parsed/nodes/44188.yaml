    html: <p>My take, working with UX designers (as they like to be called) is that more obstacles are being placed in the users path with respect to UI customization. I think this has to do with the increasing level of power that UX designers are able to exert - they are able to make the case that user font choice will break their UI. They can perhaps point to increased support costs and increased testing matrix required when you allow user-font choice in UI. Case in point being the iPhone, maybe?</p>
