    html: <p>For menus, file listings, and icon titles, I've switched to Nina. It was designed by Matthew Carter and hinted by Tom Rickner for Microsoft as <a class="freelinking external" href="http://www.microsoft.com/typography/links/news.aspx?NID=1470" rel="nofollow">a UI font for handhelds</a>. It squeezes in more character per inch than its close relatives, Tahoma and Verdana, without sacrificing their legibility at small sizes. At FontMarketplace.com, a single-user license for Nina is $4.99 per font or $17.99 for <a class="freelinking external" href="http://www.fontmarketplace.com/font/eco-friendly-font-pack.aspx" rel="nofollow">the four-font family</a>. This month, you can get the complete family even more economically in the <a class="freelinking external" href="http://www.fontmarketplace.com/font/eco-friendly-font-pack.aspx" rel="nofollow">Ascender Eco-Friendly Font Pack</a>, which is currently on sale for $14.99. The font pack has seven other fonts besides the Ninas, along with some templates and images.</p>
