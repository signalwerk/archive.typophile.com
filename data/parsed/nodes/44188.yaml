      <p>I used to be a fan of UI modification in the pre-MacOS X days. There was a program called Kaleidoscope that let you completely change the look of the Mac UI. It was a lot of fun, but eventually I realized it was little more than a distraction, a way to avoid doing real work. The UI was fine the way it was and all those themes were only skin deep--it didn't change or improve anything fundamental in the way the UI worked. It actually made things worse: A good UI should be invisible, and putting a new skin on it makes it visible, at least until you get used to it, and becomes invisible again. Until you go to a different computer with a different theme.</p>
      <p>I feel the same about system UI fonts in OS X. I'm not crazy about them, but they do the job adequately and don't call attention to themselves, which is as it should be.</p>
