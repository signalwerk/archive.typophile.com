      <p>A very interesting question. I've looked at this and am very happy that windows does allow OS font preferences, which is so contrary to the Mac's dire warning that changing the system font will destroy your performance. (I set windows to Interstate too, for a while.) </p>
      <p>It leaves one wondering, if both companies 'claim' to be responding to 'user desires', how is it that two totally different user species have developed. This is hardly the only case, with the respective browsers heading north and south on fonts relative to each other. </p>
      <p>Is it possible that humans divide their typographic desires so contrastingly along OS lines, as the vendors would have us believe. ;)</p>
      <p>Cheers!</p>
