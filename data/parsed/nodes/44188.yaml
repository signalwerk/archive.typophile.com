    html: |-
      <p>"Seems natural."<br>
      lol! There is nothing natural, to me, about being compelled to make the choice of choice at the purchase of the OS. Maybe we have different natures. I, like many before me and you (most likely), don't, naturally, take tools and use them as they are, favoring tailoring to our own needs, uses and environments. (Looking around at the millions and millions of wheels, don't you wonder what lazy genius invented that stupid phrase about reinvention?)</p>
      <p>"Case in point being the iPhone, maybe?"<br>
      The iPhone seems to me an extension of the Apple philosophy of no design taste is design, i.e. a clean, clear, blank, is better than taste. I think this's been imported from British design over the last decade plus. The first Mac, the Newton, the work stations, all Apple's previous products had personality in appearance. The customized Garamond Apple used, was the typographic embodiment of that old look. </p>
      <p>Helvetica is the typographic embodiment of the blank look... except if the size/resolution combination fails in a given size, then mash it (?), or head to a Myriad that works for a slightly different blank look. This is fine specific to Apple's design, don't get me wrong, 'How much personality can a mass-produced hand-held device allow?' is an evolving door. But, to enforce that philosophy on work stations, laptops, and presentations, which I feel are closer in use and appearance to furniture than to a phone is, I think, a misconstrued semi-infinite loop, naturally.</p>
      <p>Cheers!</p>
