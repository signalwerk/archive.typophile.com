    html: <p>My other guess, er, I mean...my research indicates  <br>1/20th of an inch. <br> <br>Rule 12a. If the question is so obscure, the answer tucked away <br>in some out-of-print book, then the poser of the question ought <br>to encourage guesses, otherwise the thread would end, eh? <br>Also, the poser of future questions might gain a measure of smug <br>satisfaction that the question posed is sooo good it leaves the <br>local type experts dumbfounded. <br> <br>or something like that. <br> <br>bj <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br></p>
  - id: 68030
