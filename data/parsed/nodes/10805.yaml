    html: "<p>Vetsch would be in a different time frame. <br> <br>But chara Matha got it! Congrats Matha! <br>One major glitch: it was not \"Le nouvel art graphique\" <br>(you're cheating!) but \"Graphisme actuel\": <br>Neue Grafik, New Graphic Design, Graphisme actuel. <br> <br>Two minor glitches: it started in September 1958 <br>(it may have ended in '65, I'm not sure, but there <br>were 18 issues indeed.) and it was Neuburg, not <br>Neuberg: Josef Müller-Brockmann, Hans Neuburg, <br>Carlo Vivarelli and Richard Paul Lohse, the death <br>squad. <br> <br>Now, you still owe me the masthead's typeface <br>(very easy one, it was mentioned in another <br>thread in this forum very recently).</p>"
