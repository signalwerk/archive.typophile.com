    date: 2003-03-20T12:06:00
    votes: null
    html: <p><i>my suspicion is that the ribbon actually carried   <br>encoded data of the text stream, not images of the type</i>   <br>   <br>Yes, this encoding was two punches for character,   <br>controlling respectively the vertical and the   <br>horizontal positioning of the matrix holder.   <br>   <br>My references were for about 3 mm advance for   <br>character, which would be 1/8 inch - I'm not   <br>sure if this refers to the specific machine design  <br>JH is talking about.   <br></p>
  - id: 68032
    user_id: 1262
    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 20 Mar 2003 — 12:09pm
    date: 2003-03-20T12:09:00
    votes: null
    html: "<p>Hrant is correct about the mechanism: the ribbon recorded data in a pattern of punched holes at regular intervals. I'm pretty sure he's also correct that the ribbon advanced when the key was depressed, but I'm not 100% sure which is why I worded the question to avoid that issue. <br> <br>BJ, I do encourage guessing, but not the admission of guessing. Wouldn't you rather guess the answer and have everyone think 'Wow! Who knew BJ was so knowledgeable about Monotype keyboard operation?' <br> <br>The question remains live: just what was that regular interval between hole patterns on the ribbon?</p>"
