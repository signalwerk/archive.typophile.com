    html: "<p>I spoke too soon... <br> <br>WE HAVE A WINNER: <br> <br>Rodolfo has the correct answer: 1/8 inch <br> <br>Well done. <br> <br>I expect there are numerous sources for this information. I found it last night in Bapurao S. Naik's <i>Typography of Devanagari</i> (Bombay, 1965). I believe the 1/8 inch advance was standard to all Monotype machines, but phrased the question the way I did because I'm not sure that it was so on the very earliest machines. The machines that Bancroft designed in 1899 became the model for all subsequent machines. <br> <br>Unless there is a challenge to this answer within the next hour, Rodolfo may pose the next question on any subject except technical operation of hot metal composing machines.</p>"
