    date_raw: 20 Mar 2003 — 1:34pm
    date: 2003-03-20T13:34:00
    votes: null
    html: "<p>Ha! Cool.   <br>  <br>Are you challenging me, Hrant? Don't be a sore  <br>loser, respect the hanging chads of my monotype  <br>ribbon. You have 48 hours to comply, or...  <br>  <br>Hmm, asking a good question is more difficult  <br>than answering one. Well, I'll ask something  <br>about the modern movement, that's what interests   <br>me more. I'm not sure if this is too easy, so  <br>I'm subdividing the question in parts. If this is   <br>against the rules, the quizmaster may rephrase  <br>it as he sees fit.  <br>  <br>At the height of the Swiss typographic movement  <br>there was a magazine that embodied its spirit,  <br>its editors being so rigorous that someone once   <br>dubbed them the 'death squad'. What was this  <br>magazine - or rather, since it was a trilingual  <br>magazine, what was its name in each of the  <br>languages -, who were its editors, and for how  <br>long did it run? (Well, this last item is not really  <br>fundamental).  <br>  <br>Bonus question: in which typeface was the   <br>masthead of the magazine set?</p>"
  - id: 68038
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 20 Mar 2003 — 1:52pm
    date: 2003-03-20T13:52:00
    votes: null
    html: "<p>Kalb ibn'l kalb, I'll send my snakes after you, infidel!!!  ;-) <br> <br>-- <br> <br>Name(s): <br>Typografische Monatsblaetter, Schweizer Grafische Mitteilungen <br>Revue swisse de l'imprimerie <br>Swiss Typographic Monthly Magazine <br> <br>Editors: which part(s), all of them?! <br> <br>Duration: Again, which part? The swiss half (in French and English) started much earlier than the German. <br> <br>Masthead: Univers. <br> <br>Heil Das Grid, ja! <br> <br>hhp <br></p>"
  - id: 68039
    user_id: 916
    user_name: rcapeto
    user_path: null
    user_image: null
    date_raw: 20 Mar 2003 — 2:05pm
    date: 2003-03-20T14:05:00
    votes: null
    html: <p>Ha... that would be <i>too</i> easy, Hrant. <br>Wrong. <br> <br>Remember that the magazine you're referring <br>to, TM, being a trade magazine, embraced all <br>aspects of the typographic/editorial trade, <br>not only what we now call the "Swiss movement". <br>When this was in its heyday, it would be, of  <br>course, the gist of TM, but TM wasn't, say,  <br>the movement's "standard-bearer". <br> <br>I should add that the magazine I'm talking about  <br>is no longer in circulation.</p>
