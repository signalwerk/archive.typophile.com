    date: 2003-03-20T11:44:00
    votes: null
    html: <p>Tiffany, my suspicion is that the ribbon actually carried encoded data of the text stream, not images of the type. This ribbon was fed into another machine that set a given font using the data. Right? So there was some fixed metric (or Imperial - more fitting these days...) amount the ribbon moved for each character, and I suspect that happened upon the <i>release</i> of the key (the pressing only serving to punch the ribbon, not move it). <br> <br>BJ, John isn't discouraging guessing, he's disallowing its admission. <br>Of course, I do know the answer, I'm just playing along...  ;-&gt; <br> <br>On the other hand, we do need a rule that says what happens if nobody gets it (and after how much time). <br> <br>hhp <br></p>
  - id: 68031
