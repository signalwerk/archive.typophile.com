  html: "<p>A few days ago, in the midst of another thread, Hrant posed a 'pop quiz' question (what was Beatrice Warde's mother's maiden name?). This gave me an idea for a new thread, one that might perhaps run for a while. This is a pop quiz thread. Here are the rules: <br> <br>1. The winner of a quiz poses the next question. <br> <br>2. The winner of a quiz is the first person to answer the current question correctly. <br> <br>3. The person who poses the question should declare the winner according to these rules within 1 hour (exceptions will be made in the event that the person who posed the question is asleep). <br> <br>4. After the winner has been declared, there will be a 1 hour grace period during which time the answer may be challenged by anyone who believes that both the person who posed the question and the person who answered it are wrong; the winner may not pose a new question during this hour, or until any resulting challenge has been resolved. <br> <br>5. If the challenger can offer convincing evidence that he or she is correct, the challenger is declared the winner and may pose the next question; the person who posed the question and declared the incorrect answer correct is barred from winning any of the next three questions regardless of whether he or she correctly answers them. <br> <br>6. If the challenger is proven to be incorrect, the original declaration stands and the winner poses the next question; in this event the disgraced challenger is barred from winning any of the next three questions regardless of whether he or she correctly answers them. <br> <br>7. Other rules may be invented by the quizmaster (that's me) as the need arises. <br> <br>8. In the event of inconclusive disputes (e.g. if a challenger proves the original winner to be incorrect but is also found to be incorrect), the quizmaster (that's me again) reserves the right to declare the quiz null and to pose a new question or invite a previous winner to pose a new question. <br> <br>9. In order to reduce the likelihood that the same group of individuals will keep winning, due to their shared obsessions with particular typographic esoterica, no new question may be of a similar theme to the immediately previous question (e.g. if one question is about an obscure operating detail of Monotype keyboarding, the next question must be of a non-technical nature). <br> <br>10. People who don't like the quizmaster's rules (that's my rules) should start their own pop quiz threads; this is called the Democracy of Bandwidth. <br> <br>11. If Gerald Lange objects that this is subverting a serious typographic discussion forum for 'entertainment', he should consider that the quality of questions is in the hands of the people who pose and answer them, and that if all goes well we might learn some interesting facts (in any case, it's got to be better than the very silly 'six degrees' threads) <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>As this was my idea, and because I successfully answered Hrant's pop quiz re. Mrs Lamberton (okay, so I checked my answer with Shelley Gruendler before I posted it), I will pose the first question. This one is about an obscure operating detail of Monotype keyboarding: <br> <br> <br>HOW FAR DID THE PAPER RIBBON ADVANCE EACH TIME A KEY WAS PRESSED AND DEPRESSED  ON THE BANCROFT DESIGN (POST-1899) MONOTYPE KEYBOARD?</p>"
