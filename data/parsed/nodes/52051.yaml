    votes: null
    html: |-
      <p>As far as I can tell, many foundries do not disallow font embedding in Flash files — or they are not specific about it. Photofont WebReady uses Flash as the container of the font. </p>
      <p>However, I must say that we have explicitly taken a "protective" approach. Outline fonts (OpenType, TrueType) will be converted into outline-based Flash containers only if the font allows editable embedding. This was my reasoning because the functionality of the application is to create Flash font containers that allow rendering of arbitrary choice from outside of the Flash container. So this sort of embedding is "editable". </p>
      <p>Since the bitmaps generated by a font are not subject to the same copyright protection as outlines (which are considered to be font software), my reasoning was that if the font's embedding permission disallow editable embedding, Photofont WebReady will still allow to embed the bitmaps of the font. However, if the font disallows embedding completely, Photofont WebReady will also disallow it (even for bitmaps). </p>
      <p>Of course, Photofont WebReady still does provide a link to the Copyright string and the EULA of the font right on the first screen — so the user can consult the details. </p>
      <p>There are a few sIFR-compatible font converters out there, but as far as I know, none of them respects the font vendors' rights to the same extent as Photofont WebReady. </p>
      <p>Best,<br>
      Adam</p>
