    html: <p>I'm curious to know what other foundries think about this technology. I'd assume it is viewed as embedding still and so not allowed by most foundries and their EULAs.</p>
    html_clean: <p>I'm curious to know what other foundries think about this technology. I'd assume it is viewed as embedding still and so not allowed by most foundries and their EULAs.</p>
  - id: 314630
