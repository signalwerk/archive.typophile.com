    <p>Web fonts are in everyone’s mouth. While the browser makers and the type industry agrees on a common standard for HTML font embedding (will it be .eot or .ttf/.otf with some special tables? — we shall see,) FontLab is offering a more immediate solution. </p>
    <p>Web designers have used the Flash-based “sIFR” font replacement technique for a few years now to enhance their web pages with custom fonts of their choice. It is not perfect but works better than saving text as images: it at least allows searchability and copy-paste, plus it performs well on mobile devices that don’t support Flash. </p>
    <p>FontLab’s new product <strong><a class="freelinking external" href="http://www.fontlab.com/photofont/webready/">Photofont WebReady</a></strong> is compatible with sIFR 2 but goes beyond its capabilities. It can create dynamic web headlines using not only OpenType and TrueType fonts but also using the Photofont font format. Photofont WebReady can also create bitmap-based dynamic web headlines from any OpenType and TrueType fonts, allowing a customized text appearance on the web while preventing extraction of font outlines out of Flash files. </p>
    <p>Developed by FontLab, Photofont brings the beauty of full-color bitmap fonts (with alpha transparency) to print and web. After BitFonter (a bitmap font editor that can create photofonts) and Photofont Start (a plugin that allows using photofonts in Adobe Photoshop), Photofont WebReady is the next product in the Photofont line. Plugins that allow using photofonts in Adobe InDesign and QuarkXPress are under development. </p>
    <p>Photofont WebReady retails at US$79.95. For more information visit the Photofont WebReady product page at <a class="freelinking external" href="http://www.fontlab.com/photofont/webready/">http://www.fontlab.com/photofont/webready/</a> and the Photofont technology page at <a class="freelinking external" href="http://www.photofont.com/">http://www.photofont.com/</a>. </p>
    <p>Regards,<br>
    Adam Twardoch<br>
    Fontlab Ltd.</p>
