    html: |-
      <p>The condensed sans looks like Arizona, published by Brendel &amp; Pabst. This company was sued for forging lots of fonts but also selling some unique ones. I don’t know if this is an original. </p>
      <p>Read more in <a href="http://www.sanskritweb.net/forgers/greenstreet.pdf" rel="nofollow">this PDF</a>. </p>
      <p>More about Brendel at <a href="http://luc.devroye.org/fonts-23628.html" rel="nofollow">Luc Devroyes site</a>.</p>
