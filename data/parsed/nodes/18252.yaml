      <p>I've been wondering if the whole working model between type designer, graphic designer (GD) and client is the problem, and has to be changed. </p>
      <p>The question has to be asked, "Who is the customer for the font?" </p>
      <p>Currently font foundries look at the designer as the customer, and hence the restrictive (or not so) EULA. But the real customer is the GD's client. No? They are the ones that derive the most benefit from the chosen typeface. It seems to me that the model for the small independent type designer may be one of providing their fonts to the GD at no charge, and have the GD pay for the fonts every time they are used in a client's job, passing those costs off to the client. That way the customer (the designer's client) pays for using the font, not the designer. Sort of what was the working model when type shops set the type. The client was the one who always paid for the typesetting, with a markup added by the designer as the cost of capital outlay for the typesetting.</p>
      <p>Now this would require type designers vetting their potential partnerships with GDs and not all GDs would pass the vetting process. Legal agreements would be required. Frightening penalties but in place for non-compliance, etc. </p>
      <p>I know these agreements are in place with several foundries. Terminal Design has several of them with our long time GD associates, but I think this could be an interesting approach on a broader scale.</p>
      <p>GD's would gain the added benefit of not having to do any of their desired modifications. If a group of fonts was chosen for a project, and certain mods were required the GD contacts the type designer, and a cost for the work is agreed upon, these costs would be passed on to the client.</p>
      <p>This may not work for large resellers, but it could be one of the selling points of working with your independent type design professional.</p>
      <p>Just a thought.</p>
      <p>James</p>
