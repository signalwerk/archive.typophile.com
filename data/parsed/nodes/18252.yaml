      <p>&gt;One of the other things not defined in the OT spec is, what’s a font</p>
      <p>Spec seems to suggest "the font" is the actual OpenType font being embedded. <a href="http://www.microsoft.com/typography/otspec/os2.htm#fst" title="http://www.microsoft.com/typography/otspec/os2.htm#fst">http://www.microsoft.com/typography/otspec/os2.htm#fst</a> - we know that some applications convert the font into another format, and respect the embedding permissions, some do not.  </p>
      <p>Spec doesn't define what a document is either. To be honest giving this some thought I don't think the spec should. That's not to say a future version of the spec shouldn't introduce embedding permissions for 'app embedding' – although I feel that for app embedding there won’t be a one-size-fits all solution.</p>
