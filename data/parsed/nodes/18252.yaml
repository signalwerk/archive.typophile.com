      <p>James:<br>
      You ask:<br>
      "If modfying is important would you pay a premium for that option?"</p>
      <p>I know it seems illogical, but I usually just move on to a different choice if the basic EULA doesn't suit me. I'm a very small outfit, buying fonts for the use of my home based business: restrictions and surcharges just put me of. I'd probably end up paying more at a foundry that had the rights I want in their basic EULA.</p>
      <p>If the kerning pairs don't kern the small caps with the figures to accommodate Canadian postal codes, or if the f ligs haven't been added to the basic font in such a way as to allow them to function in InDesign, it's going to stick in my craw to pay extra for the privilege of making those adjustments myself. And let's face it, it's hard to tell about such thing from an online type tester, or even a PDF sample.</p>
