      <p>I know I've posted something similar before, but imho there is no real difference between a typeface being used in print or on-screen. So long as the data is protected against code theft, it's pretty much the same thing if a font is embedded in a video game's code or if it's printed on a magazine page. Like so many other "protectionist" EULA clauses, the PDF embedding clause dates to a bad old time when it was easy as pie to pull the font code out of a PDF file. (This tendency to add another clause after getting burned by someone has been discussed before.)</p>
      <p>Si, what are "small fonts"? Ones built on a 500 em unit body? ;-)</p>
