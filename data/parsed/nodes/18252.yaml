      <p>Mostly because I have constantly raised issues of licensing in the 7 years I've been here - when we began to put PDFs online of all our brochures, I brought up - against much resistance - the fact that I'd have to redesign several, as they were based on images that were licensed from Getty and Corbis - licenses that did not allow electronic dissemination, and which would be ridiculously expensive to license for the tens of thousands of copies which will eventually be downloaded or otherwise distributed. I've been reasonably succesful in making people see type EULAs as just as important as stock photo EULAs and image and software-related copyright issues.</p>
      <p>Once I've audited everything in my own office and the rest of the Senate - probably will take two years - we'll have the cleanest and most legal type of any government office anywhere. I can't be responsible for what people bring in to their offices and run on their own machines, but since almost everything system-level is refreshed regularly, I doubt there are many folks in the organization using pirated commercial type.</p>
      <p>---</p>
      <p>jlt : <a href="http://www.hewnandhammered.com" title="http://www.hewnandhammered.com">http://www.hewnandhammered.com</a> : rnrmf!</p>
