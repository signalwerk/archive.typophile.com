      <p>Personally, I've never understood the geographical restrictions some foundry place. What do I care where the fonts are, as long as it is within the limits of number of users purchased. AFA I'm concerned, people can use my fonts on the moon if they wish to do so.<br>
      I also think restricting the number of printers is outdated, as a typical office often consists of a number of printers for different purposes. What I care is that people who *use* the fonts pay for them.</p>
      <p>I've been pondering for a while about the modification stuff. I can see the demand for it and generally I don't have any objections. However, I think I would like to keep some sort of control over it in as far that I would like to be informed if someone makes modifications. This for a number of reasons: retain certain control on quality, retain control on usage re workstations, support queries may come my way for work I have not done.<br>
      I am thinking of changing our EULA to allow modifactions with the restriction that we are informed of all work done, and will have a copy of all work done to our fonts. We may also reserve the right to refuse the release of a modification if we feel that it is detrimental to our reputation.</p>
      <p>Embedding? There are different opinions. Users demand embedding rights to make their life easier. Foundries are afraid it may slow revenue due to (enforced) sales lost. Other say, that in regards to embedding fonts should be treated like music broadcast via radio. Problem is that it is near impossible to police. And why have policies that you can't enforce, not only because it's logistically near impossible but because it may interfere with local legislation.</p>
      <p>Well, my two pennies.</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
