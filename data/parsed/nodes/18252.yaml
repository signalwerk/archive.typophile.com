      <p>&gt;Embedding means many things to many people. I can mean:</p>
      <p>In terms of the OpenType specification (and TrueType before it) "embedding" relates purely to including fonts (or parts of fonts or converted fonts) within a <em>document</em> file. </p>
      <p>Of course we don't try to define what a document is, and over the past few years font makers have tacked on additional restrictions/clarifications to their EULAs. For example some say PDF embedding is okay but Web embedding is not. Others say commercial documents (ebooks or subscription eperiodicals) require an additional license. </p>
      <p>&gt; - embedding into an application</p>
      <p>In the OpenType or TrueType sense this isn't “embedding” and it's not covered by the embedding permissions in the fonts. We call this "shipping" a font, others may call it “bundling”. Fonts can be either permanenetly (fonts folder) or privately installed (for the application's private use) - but either way 99% of font EULAs don't allow this. </p>
      <p>I think this is basic common sense, but there are gray areas - one being doc-apps, things that are mostly documents but have some application-like features - we call these doc-apps. An example might be an electronic document advertising a mortgage broker that has an in-build mortgage calculator. </p>
      <p>Cheers, Si</p>
