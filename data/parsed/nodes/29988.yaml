    html: |-
      <p>More information needed: which OS X-version? How much memory on the machines? Networked? Off at night or not?</p>
      <p>In general: after installing progs one should run Apples Disk Utility:First Aid (resetting privileges).<br>
      Regelar maintanace is built in, providing the machines are on at night; otherwise run a tool like Onyx, at least once a week.</p>
      <p>Common way to test whether the slugginess is user– or machinerelated, is to set up a new user and try InDesign under that account.</p>
