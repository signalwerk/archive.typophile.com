    <p>Hey folks,</p>
    <p>I’m working on a logo for an organisation called Food &amp; Fitness that teach children aged 7-11 about healthy eating and exercise. The organisation is part of a company which promotes dairy products - this is why they have tried to replicate a milk bottle to be part of the scales in their current logo (if you can call it that).</p>
    <p>The client would like a 'modernised' version of their logo - but I haven't quite nailed this as yet - Fitness is a longer word than Food so the words naturally look unbalanced and the scales have to be 'balanced' so that each word is of equal merit. So still pondering this one...</p>
    <p>The client is also interested to see totally new designs and possibly a new strapline - so I have attached my thoughts so far... Design 3 could be an 'encased' logo instead of a drop shadow i.e. so the dark blue follows the shape of the letters but forms one solid backdrop - if anyone can advise how I would do this that would be cool as I've never tried that type of logo form before. I would really like to create a 3D, stamp-like option that was appealing to kids.</p>
    <p>Any feedback you can give is gratefully received, thanks in advance :-)</p>
