      <p>I like your new concept better than your previous ones, and I like the font and use of lowercase letters. </p>
      <p>I don't like having the tag line ("for happy, healthy kids") inside the logo, It's way too small and it clutters up the logo. I'd suggest making it larger (perhaps the same width as "fitness") and putting it below the logo. Then tighten up the leading slightly where it used to be. When the logo is reproduced small (on a business card, for example), you may need to eliminate the tag line completely.</p>
      <p>Regarding colors, I can see the connection of green to food, but I don't see the connection of blue to either food, dairy or fitness. And blue and green are both cool, passive colors. Have you considered using a warmer 2nd color, like maybe something in the orange-red range, to reflect the active element of fitness?  The light blue/dark blue combination looks rather sleepy.</p>
