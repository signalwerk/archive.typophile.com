  html: |-
    <p>Hi all, I'm working on a font in Fontlab, and trying to expand the classes. But, when I do this, then rebuild the kern feature, then go the open type window and look at the kern feature, I notice that the class definitions remain at the bottom. </p>
    <p>The classes that will NOT expand are "key glyph" to "key glyph" definitions. </p>
    <p>On the other hand, the "key glyph" to "individual glyph" (enum pos) stuff WILL break down into individual pairs.</p>
    <p>Is this a bug, or am I misunderstanding the nature of expanding class-kerning?</p>
    <p>Unfortunately, when I began, I built my classes in a way that isn't working now, so I need to break them down into individual pairs, and build up new classes. If I can't break about the classes, I can't do this, since if I just delete them, I'll lose all the important kerning info that's in them.</p>
