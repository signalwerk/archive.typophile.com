    html: <p>My guess is that they refer to Pierre Moreau who, according to <a href="http://cg.scs.carleton.ca/~luc/history.html" rel="nofollow">Luc Devroye's page</a> on the history of type "endeavoured to cut printing types in the style of handwriting". He gives a link to a <a href="http://cg.scs.carleton.ca/~luc/imrereiner/imrereiner-ornament3-pierremoreau1643.jpg" rel="nofollow">scan of his cripts and ornaments from 1643</a>.</p>
