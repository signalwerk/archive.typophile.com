      <p>??? or is it without <strong>reference</strong>? In an event, <em>Encyclopædia of Type Faces</em> credits the first French cursive to Robert Granjon of Lyons in 1557, and asserts that Morris Fuller Benton's <strong>Civilité</strong> is a faithful rendering of same.</p>
