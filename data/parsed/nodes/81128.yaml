  html: |-
    <p>Just curious, who is this obscure Parisian figure made mention of beneath 'Script'?<br>
    <a class="freelinking external" href="http://www.adobe.com/type/browser/classifications.html" rel="nofollow">http://www.adobe.com/type/browser/classifications.html</a></p>
    <p>"Since a Parisian printer created the first in 1643, script typefaces..."</p>
    <p>Did that first script type receive a name?</p>
    <p>A quick gooogle indicates the Adobe material has been regurgitated without reverence...</p>
    <p>Any help appreciated.</p>
