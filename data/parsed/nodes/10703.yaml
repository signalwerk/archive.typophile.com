    html: "<p>A-HA! Things are getting clearer. You could've told us from the start what the exact motives were for your peculiar question. ;) <br> <br>One thing I can say: there's more than enough room for some extra <a href=\"http://www.typofonderie.com/Alphabets/ParisinePlus.asp\" target=\"_blank\"> Parisine Plus</a> in Germany, trust me. A delightful face like that is not likely to get overused that quickly. And it's just as much <i>HOW</i> you use it. I just did three different magazine designs using Tarzana, and they couldn't be further apart (I need to get some mileage out of my license fees, yaknow ;) ). Maybe reconsider your decision. <br> <br>If you really insist, why don't you hop over at <a href=\"http://www.lucasfonts.com/\" target=\"_blank\"> LucasFonts</a> and check what they have in store? Another \"young\" type designer who does incredible work, just like Mr. Porchez. <br>(Sorry, J-F, I know: Luc(as) again.)</p>"
