  html: <p>does anyone know if fontlab can automatically vertically center all glyphs in a font? In fact, what I a m trying to do is just center all glyphs both vertically and horizontally, or at least align all of them on the same horizontal baseline. <br>I now have over 1038 glyphs in my font and can't imagine doing that manually (off course I can, but it is such a waste of time...) <br> <br>tnx</p>
