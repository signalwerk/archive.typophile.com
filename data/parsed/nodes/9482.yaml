      <p>Ok, the idea was clever but also the implementation was not as straight forward as the idea. Here is a link to a fontlab action set that centers your glyphs vertically:<br>
      <a href="https://dl.dropbox.com/u/102586488/center_glyph_vertically.prg" title="https://dl.dropbox.com/u/102586488/center_glyph_vertically.prg">https://dl.dropbox.com/u/102586488/center_glyph_vertically.prg</a></p>
      <p>Note that you'll lost your original sidebearings (metrics) after running this action set.</p>
      <p>Bahman</p>
