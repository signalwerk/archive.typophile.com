      <p>I don't think the glyphs D.es and E.es are necessary. I believe it can be done in one shot. The FDK syntax should be something like this:<br>
      <code><br>
      languagesystem latn dflt;<br>
      languagesystem latn ESP;</code></p>
      <p>@ALL_LETTERS = [A-Z a-z];</p>
      <p>feature liga {<br>
      	script latn;<br>
      		language ESP;<br>
      			ignore sub @ALL_LETTERS D' E';<br>
      			ignore sub D' E' @ALL_LETTERS;<br>
      			sub D' E' by D_E;<br>
      } liga;<br>
      </p>
