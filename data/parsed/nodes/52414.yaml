      <p>Hey Randy,</p>
      <p>1. Yes, it is toggled by the Language dropdown in the character palette, but it will only work in InDesign CS3 and up. Photoshop CS4 and Illustrator CS4 support it as well.</p>
      <p>2. If the app does not have support for language-specific lookups, things won't work. For example, Adobe has been putting language-specific code in its fonts (e.g. Turkish) for quite some time, but only with InDesign CS3 we've started seeing the results of that code.</p>
      <p>3. You'll be able to compile the features and see the results in Fontlab, but you should also include the line <code>languagesystem DFLT dflt;</code> in the features. However, the current Fontlab 5 will throw an error message because of that. You'll have no problems if you use the FDK.</p>
      <p>4. The end of ESP would be signaled by the end of the feature, the start of another language, or the start of another script. Matthew's case had to do with a language-specific ligature, so the best way to do it is through 'liga'. In the case of Polish diacritics I'd say 'locl' is more appropriate. In the case of French, it depends on what you're trying to do. Below is some code for language-specific ligatures and diacritics.</p>
      <p><code><br>
      languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br>
      languagesystem latn ESP;<br>
      languagesystem latn FRA;<br>
      languagesystem latn PLK;</code></p>
      <p>feature locl {<br>
      script latn;<br>
      language FRA;<br>
      sub eacute by eacute.FRA;</p>
      <p>language PLK;<br>
      sub cacute by cacute.PLK;<br>
      } locl;</p>
      <p>@ALL_LETTERS = [A-Z a-z];</p>
      <p>feature liga {<br>
      script DFLT;<br>
      language dflt;<br>
      lookup LIGA {<br>
      sub f i by f_i;<br>
      } LIGA;</p>
      <p>script latn;<br>
      language dflt;<br>
      lookup LIGA;</p>
      <p>language PLK include_dflt;</p>
      <p>language ESP include_dflt;<br>
      ignore sub @ALL_LETTERS D' E';<br>
      ignore sub D' E' @ALL_LETTERS;<br>
      sub D' E' by D_E;</p>
      <p>language FRA include_dflt;<br>
      sub e t by e_t;<br>
      } liga;<br>
      </p>
      <p>The code in 'locl' is straightforward; glyphs are replaced by other glyphs depending on the language. The code in 'liga' is a little more tricky because there are ligatures that you'll want to have for all the languages and/or scripts in addition to the language-specific ones. In this case, all Latin languages (including ESP, FRA and PLK) will have the 'f_i' ligature. In addition, the 'D_E' ligature will be available to Spanish, and the 'e_t' ligature will be available to French.</p>
      <p>I could have been more concise with the 'liga' code but when it comes to coding language-specific behavior I like to be as explicit as I can to avoid unexpected behaviors. For example, the keyword 'include_dflt' could be omitted (because the lookups under 'language dflt;' are inherited by default by other languages within the same script). However, 'language PLK;' needs to be included in 'liga' otherwise 'f_i' will NOT be available for Polish.</p>
