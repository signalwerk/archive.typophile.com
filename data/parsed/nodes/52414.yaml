      <p>Seems like this is something for locl or salt or ss1 (stylistic sets) or a combo:<br>
      (taking a stab as I'm trying to improve my OT mind)</p>
      <p>@UC = uppercase;</p>
      <p>feature locl { # Localized Forms<br>
      language ESP exclude_dflt; # Spanish;<br>
      sub @UC D' E @UC by D.es; #D.es is a duplicate D marker glyph<br>
      sub D E by D_E;<br>
      } locl;</p>
      <p>feature salt { # Spanish DE ligature<br>
      sub @UC D' E @UC by D.es; #D.es is a duplicate D marker glyph<br>
      sub D E by D_E;<br>
      } ss1;</p>
      <p>feature ss1 { # Spanish DE ligature<br>
      sub @UC D' E @UC by D.es; #D.es is a duplicate D marker glyph<br>
      sub D E by D_E;<br>
      } ss1;</p>
      <p>This could well be garbage :-) but it's what I'd try.<br>
      Whoops that's fontlab, not fontforge.</p>
      <p>It'd be nice to get rid of both marker glyphs, not just one. The only other way I figured required an illegal one to many substitution. You could try to define when you do want the sub, not when you don't, but it's trickier.</p>
