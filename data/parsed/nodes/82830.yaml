    html: |-
      <p>The bulging is a classic optical issue - like if you attach exact semi-circles to the ends of a rectangle it doesn't look smooth - you have to shift the joins. But if you like the way it looks as it stands then there's no problem; in fact it might give it a nice organic twist in contra to the pervasive rigidity. Just be prepared to say "yeah, I meant to do that" :-) when certain pesky type designers challenge you on it!</p>
      <p>w: I think you might make the center overlap more.</p>
      <p>พ and ฟ: Why not curl the left stem outward? Spacing trouble? It could be a small curl.</p>
      <p>hhp</p>
