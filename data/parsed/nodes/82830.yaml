      <p>Ben have a look at this book:</p>
      <p><a href="http://www.flickr.com/photos/marcwathieu/2615313436/sizes/l/in/photostream/" title="http://www.flickr.com/photos/marcwathieu/2615313436/sizes/l/in/photostream/">http://www.flickr.com/photos/marcwathieu/2615313436/sizes/l/in/photostream/</a></p>
      <p>It's hard to tell from that image but the inner counters for the artist's name have been modified to a more square form. It creates a very technical impression. Designed by Gavillet &amp; Rust.</p>
      <p>In Frutiger's sans serifs the inner contours are a bit squarer than the outer contours.</p>
      <p>For me your lower case is much more successful than the upper case. In the lower case the presence of curved outer contours is natural - less so in the capitals.</p>
