    <p>Following Hrant's request, I'm happy to post Argon here for some crit. </p>
    <p>This was one that I drew in my sketchbook whilst travelling. I wanted to explore what would happen if black and white shapes became somewhat disconnected. Counterforms are made of perpendicular straight lines while outer edges are wide superellipses. </p>
    <p>I wanted to try my hand at Thai glyphs, so added the main alphabetics — a few vowels and tone marks are missing for the moment.</p>
    <p>Think there's already a font called Argon, so any name suggestions also welcome ;)</p>
    <p>Thanks.</p>
    <p>EDIT, adding a nice pic!</p><div class="imageWrap"><img src="http://typophile.com/files/Argon Colours 588px_4458.jpg"></div><p></p>
