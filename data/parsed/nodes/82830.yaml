      <p>As I've told Ben, it's rare for me to feel envy... but I do badly wish I'd made this!  :-)</p>
      <p>The main "global" concern I think is the optical illusion of warping where straights meet rounds, most visible in the "oh": look how the counter seems to have bulging corners. Now, you might actually want this effect; but if you don't it might be tempting to pretend it's not there since it's a bit of work to fix, but of course that's weak.</p>
      <p>Specifics:<br>
      - The "r" and "w" are too wide.<br>
      - The "E" and "F" seem too plain; I'd add a shear like in the "f".<br>
      - The diagonal of the "2" tapers too much towards the bottom.</p>
      <p>I know little about Thai, but it seems nicely NON-Latinized to me. Except for that "w"-like shape; I wonder if it can be authentically "twisted" somehow, like you've done so nicely with the "s"-like shape.</p>
      <p>Name? Retro-futuristic? Galactica!</p>
      <p>hhp</p>
