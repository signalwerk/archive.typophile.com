    html: |-
      <p>I wondered if you'd notice the changed 'ร', Hrant, but of course! Thanks for pushing me to reconsider :)</p>
      <p>Hm, about the bulging...I can't fully see what you mean — I guess I've been getting used to the shapes so I don't see optical difficulties so much. Anyway, I guess either you're seeing the centre of each round corner being pulled outwards, or a bump where the straight meets the round?</p>
      <p>Agree on r; w I'm not sure for the moment but will see what can be done. Are the vertices too wide or the overall width do you think?</p>
      <p>2: thanks, I hadn't caught that. I'll take the right side of the join outwards and take a bite out of it too. I find 2 pretty much the hardest glyph, apart from the section mark.</p>
      <p>E&amp;F: I was considering a Handel-style E and F, but really liked the squared forms better. Interesting idea to shear the crossbars, I'll try that.</p>
      <p>I'll see what other examples of ผ, ฝ, พ and ฟ I can dig up from online research!</p>
      <p>Galactica, nice, I'm rather fond of that cap G!</p>
