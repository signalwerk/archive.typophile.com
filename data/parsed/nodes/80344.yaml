      <p><cite>ITC Tom's Roman is on My Fonts from Bitstream</cite></p>
      <p>From MyFonts: "ITC font, digitized by Bitstream, is no longer available due to ITC's termination of licensing agreements with many resellers in January 2001. We leave it on display at MyFonts for completeness, since it has been a Bitstream font for several years."</p>
