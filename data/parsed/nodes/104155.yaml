    html: <p>Many thanks for the helpful feedback I got here on Typophile! It was my first serious attempt at typemaking, and I had a lot to learn. Special thanks to Hrant, who did the base spacing on the fonts as well as some touch-ups to the letter shapes, as well as to Rainer, who helped me with technical issues and finishing.</p>
