    <p>So I finally got round to finishing up Numina, formerly known as Catharsis Glamour &amp; Glory...  it's out on MyFonts now, with a 25% introductory discount. Get it while it's fresh!  :)</p>
    <p><a href="http://www.myfonts.com/fonts/catharsis-fonts/numina/" title="http://www.myfonts.com/fonts/catharsis-fonts/numina/">http://www.myfonts.com/fonts/catharsis-fonts/numina/</a></p>
    <p>Numina is an elegant, dignified, highly condensed modern display family comprising two complementary faces. Numina Glory capitalizes on the family’s strong, relentless vertical texture, eschewing diagonals in favor of robust pillars, whereas Numina Glamour opts for more traditional letterforms for improved legibility and a classy, airy grace. Both faces are well-suited for headlines, logos, block quotes, and editorial work.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bla_5907.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bli_3980.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blu_6573.png"></div><p></p>
    <p>See the MyFonts page for more posters.</p>
