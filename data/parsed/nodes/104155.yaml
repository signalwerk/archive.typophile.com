    html: |-
      <p>Very nice.</p>
      <p>It just goes to show that formal invention is quite possible in mature genres, if done with taste and subtlety—one doesn’t have to follow the conventions slavishly.</p>
      <p>I like the way these are separate fonts, avoiding the elitism of doing one with the other(s) as a mere set of stylistic alternates.</p>
