    <p>Hello type wizards!</p>
    <p>Does anyone recognize the attached sample’s name. It appeared in Julia.uk.com’s project for the Arika film festival. I’ve often admired it from afar, and decided to have a closer look at it. I know they’ve produced custom faces in the past, so I wouldn’t be at all surprised if this was custom too. I feel like I’ve seen it elsewhere though… or something very similar. If you have any suggestions, I would be most grateful.</p>
    <p>Thanks in advance.<br>
    Gordon</p><div class="imageWrap"><img src="http://typophile.com/files/Arika_5458.png"></div><p></p>
