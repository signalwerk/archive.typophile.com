    html: "<p>OK, had to stop looking for a while while I watched Leeds get robbed by Sunderland &amp; a crap ref. <br> <br>Well, both the answers so far are less than seven, so neither are the route I was looking for. <br> <br>Now, to complicate things, I just noticed you can get there in 6 by this route too, but its not the way David went. <br>As I'm expected to declare the winner, do they have to find the same route I found, or do I just have to ensure that they found a valid route? <br>If its the latter, as I found that it can be done via my original route in 6, then David wins. <br> <br>If the exact route has to be discovered then its still open, in which case: <br>Clue #1. <br>You'll need to go via one of Apple's national home pages (ie <a href=\"http://www.apple.com/COUNTRYCODE/\" target=\"_blank\">www.apple.com/COUNTRYCODE/</a>)</p>"
