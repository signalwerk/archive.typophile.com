      <p>I'm not sure it's what you're looking for, but I love the effect of <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/grotesque-mt/" rel="nofollow">Monotype Grotesque</a> - it has this terrific misshapenness I find sort of wacky and entertaining. It seems very sixties to me (I'm British) since while it's much older Gill Sans totally eclipsed it in the thirties and forties until it came back into fashion around then. The <a href="/wiki/https%3A/%252Fwww.myfonts.com/fonts/mti/grotesque-mt/bold-extended/" class="freelinking" rel="nofollow">bold extended weight</a> is perhaps the wildest, but it has lots of styles. </p>
      <p>Stephen Coles' <a class="freelinking external" href="http://fontfeed.com/archives/helvetica-and-alternatives-to-helvetica/" rel="nofollow">list of Helvetica alternatives</a>, which I found it on, is probably worth checking through for other options. <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/modernica/" rel="nofollow">Modernica</a> is also rather lovable, though it lacks condensed/extended versions.</p>
