    <p>Hey everyone, at the risk of ridicule and being thought a madman, I was trolling a UFO site and came across some documents. These represent script from a supposed extra-terrestrial craft the government is in possession of. I have seen the main "alien" type someplace, but it has been more than a few years ago. It looks like a faux kanji or some other fake script. </p>
    <p><a href="http://isaaccaret.fortunecity.com/pacl-lang-analysis-p119-fullsize.jpg" title="http://isaaccaret.fortunecity.com/pacl-lang-analysis-p119-fullsize.jpg">http://isaaccaret.fortunecity.com/pacl-lang-analysis-p119-fullsize.jpg</a></p>
    <p>This is one of the better pages, but there are several at:</p>
    <p><a href="http://isaaccaret.fortunecity.com" title="http://isaaccaret.fortunecity.com">http://isaaccaret.fortunecity.com</a></p>
    <p>I am currently looking through my library and will update if I find it.</p>
    <p>-Mike</p>
    <p>UPDATE: It looks like flipped Katakana i.e. Matrix rain... there are a few pics online... I actually am going to link a new image.<br>
    (rotated 180°)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Alienscript_5975.jpg"></div><p></p>
    <p>and the matrix-esque sample:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MatrixCodeCloseUp_4308.jpg"></div><p></p>
    <p>From the wikipedia... thanks.</p>
