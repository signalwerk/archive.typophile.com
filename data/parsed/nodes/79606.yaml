    <p>Hi everybody!<br>
    This is my first time posting here, so here it goes:<br>
    I'm looking for the original font of this logo.<br>
    At first sight to me it looks like a very badly treated Trajan - if you look at the detail you see that it even may be a "live-traced" version of the logo.</p>
    <p>Can you help me out?<br>
    I tried recreating it with Trajan, but trajan seems to wide... (or too short) also, the serifs are different from (what is left of) the original serifs.</p>
    <p>Thanks a lot! It got me puzzling...</p>
