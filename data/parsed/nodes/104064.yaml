    html: <p>Thanks for sharing this, John. I was vaguely aware of Linotype’s modular approach, but hadn’t seen all the individual components layed out. I certainly did not expect to see the क split down the middle like that, with its permutations. Some interesting compromises — not always completely happy, but clever nonetheless, given the constraints of the technology.</p>
