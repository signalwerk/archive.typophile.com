    html: |-
      <p>Some clever modularity. The way that the letters are made up of vertical splits is fascinating. I wonder how far we can take these ideas into our own practice.</p>
      <p>We already make our glyphs of reusable parts. But this seems unconventional even with that in mind. Exciting! :-)</p>
