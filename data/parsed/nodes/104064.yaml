  date: 2013-06-23T14:22:00
  date_raw: 23 Jun 2013 — 2:22pm
  votes: null
  html: "<p>I've uploaded a scan of something I picked up a while ago: a <a href=\"http://www.tiro.com/John/LT-Dev-KB-300-Col.PDF\" rel=\"nofollow\">Linotype keyboard operation manual for hot metal Devanagari typsetting</a>, dated 1933 [PDF, 5.06MB]. It's interesting as an example of the decisions made in adapting a complex script to a mechanical typesetting system, and a useful contribution to the history of the development of the 'half form' mechanism, here used not only for conjuncts but also to build many of the basic letters in combination with the common vertical stroke.</p>"
  html_clean: "<p>I've uploaded a scan of something I picked up a while ago: a <a href=\"http://www.tiro.com/John/LT-Dev-KB-300-Col.PDF\" rel=\"nofollow\" class=\"link-external\">Linotype keyboard operation manual for hot metal Devanagari typsetting</a>, dated 1933 [PDF, 5.06MB]. It's interesting as an example of the decisions made in adapting a complex script to a mechanical typesetting system, and a useful contribution to the history of the development of the 'half form' mechanism, here used not only for conjuncts but also to build many of the basic letters in combination with the common vertical stroke.</p>"
