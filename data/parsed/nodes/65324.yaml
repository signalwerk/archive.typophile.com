      <p>Looks similar to <a class="freelinking external" href="http://new.myfonts.com/fonts/comicraft/sign-language/">Sign Language</a> from Comicraft, and also the <a class="freelinking external" href="http://www.houseind.com/fonts/signpainterfontkit/viewfonts">House Sign Painter collection</a>'s House Brush and House Slant. This is definitely some sort of sign painter's font, even though none of those I mentioned is exactly the same, they are close.</p>
