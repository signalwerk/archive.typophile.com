  - id: 581643
    user: 205259
    date: 2014-06-28T05:37:00
    date_raw: 28 June 2014 - 5:37am
    votes: null
    html: |-
      <p>Bob, Plak Blak is a good find. Plak Black Condensed is quite close for most of the letters in the image <img src="/sites/default/files/old-images/PlaxBlackCondInUse_4666.jpg"> Only the _S_ stands out as being too rounded. Perhaps this photo lettering era font is a revision of Paul Renner's design for Plak Black Condensed. Most people would not notice if it was used as a substitute for the letters, particularly if the _S_ is adjusted and the punctuation replaced.<br>
      The numbers appear to be from an entirely different font. If they had to be made from scratch, I would start with an _8_ to make the _3_.<br>
      Don</p>
