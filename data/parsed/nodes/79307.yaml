      <p>By the way, <a href="http://www.gostedu.ru/29304.html" rel="nofollow">here</a> you can find information on the old Soviet industrial standard (GOST) on Cyrillic OCR type design: GOST 16330-85, <em>Information processing systems. Founts for optical character recognition. Types, basic parameters and dimensions</em>. The 16330-85 was an update of an earlier standard, 16330-70 (the last two digits in the number stood for the year of adoption). The expiration date of that new standard was July 1, 1991. Those ROS-A and ROS-B types looked pretty scary.</p><div class="imageWrap"><img src="http://typophile.com/files/ROS-A_4319.gif"></div><p></p>
