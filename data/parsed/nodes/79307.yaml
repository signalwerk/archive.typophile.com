    html: |-
      <p>The Panoptic alphabet (unicase + monowidth) was created for a certain kind of constraints-based concrete poetry, in particular <em>Diamonds</em> by Christian Bök. Here's a page:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Diamonds_4221.png"></div><br>
      Subsequently, I rendered the alphabet in a variety of type styles, beyond the original "old style" (shown), which is most suitable for poetry.<br>
      In fact, it would be possible to do a Panoptic version of just about any typeface.<br>
      I've thought about providing Panoptic versions of the types I design, but I don't think it would be worth the effort. My next development along these lines will more likely be display cuts of the original Panoptica fonts, with proportional widths. That doesn't really make sense according to the original premise, but would probably be much more useful.<p></p>
