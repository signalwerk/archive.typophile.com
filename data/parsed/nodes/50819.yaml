      <p>If price is your concern (as I imagine from you asking for freeware), there's a few budget options:<br>
      - <a href="//www.cr8.netfirms.com/typelight.html" rel="nofollow">Typelight</a> is a super simple freeware font editor, that will let you do all the basics.<br>
      -<a href="http://fontforge.sourceforge.net/" rel="nofollow">FontForge</a> is an open source font editor, from what I understand, has quite a lot of features, but is also not straightforward to install on windows.<br>
      -<a href="http://www.cr8.netfirms.com/type.html#header" rel="nofollow">Type 2.2</a> is typelight older brother, with loads more features. You can buy it for €46.00 EUR (approx US $65)<br>
      -<a href="http://www.high-logic.com/fontcreator.html" rel="nofollow">FontCreator </a>is another shareware editor, you can buy a home/professional licence for $79/$149<br>
      -And finally, <a href="http://www.fontlab.com/font-editor/typetool/" rel="nofollow">Typetool</a> is Fontlab's younger brother, with less features but still a quite robust font editor. It's $99</p>
