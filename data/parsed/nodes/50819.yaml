      <p>&gt; FontLab bought Fontographer<br>
      &gt; (their biggest threat)</p>
      <p>I never considered Fontographer being a threat for FontLab simply because Macromedia stopped doing any work on it (including marketing) in 1996. When I was looking for my first tool for type design in 1997, I had some experience with Fontographer but I felt it was on its dying verge, so I decided to buy FontLab (version 3.0 at that point). I ended up being hired by the company seven years later, and all that time I did not see much movement on Fontographer, and I actually gave up on it. </p>
      <p>It was Macromedia that approached FontLab with the idea that we should buy Fontographer off them before they merge with Adobe. In fact, we were quite surprised by this. I think Macromedia felt that within Adobe Fontographer will follow the fate of FontStudio and FontChameleon (all tools thaken over by Adobe and removed from the market). Font editors is just too small a market for a giant for Adobe, and was also too small for Macromedia when the company grew rapidly due to the enormous success of Flash. </p>
      <p>So please be assured that we did not consider Fontographer a "threat". But of course we did see a value in acquiring it: we wanted to learn from the best practices of the application, have access to some of the best algorithms, and reconnect with the existing customers. </p>
      <p>And yes, we do have plans to continue Fontographer, but it's too early for me to talk about it publicly. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      product and marketing manager<br>
      Fontlab Ltd.</p>
