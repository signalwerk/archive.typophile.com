      <p>It's too bad that the FontLab people don't make a demo of Fontographer 4.7 for Mac.</p>
      <p>It's really a much cleaner, and intuitive (easy to understand) interface. I used it professionally for over two decades, and do not see the great advantage of FontLab, besides the fact the industry now expects it to be ones primary tool.</p>
      <p>I really hope the FontLab people develop it into a 5th version (Fontographer 5) and add basic OpenType support and better integration with Adobe Illustrator (one used to simply option-cut and option-paste from each other).</p>
      <p>Even if they jacked up the price to FontLab's level, I'd pay it, like thousands of others who prefer Fontographer to FontLab.</p>
      <p>(Don't get me wrong: FontLab has some really great sophisticated features, so the pros would need both.)</p>
