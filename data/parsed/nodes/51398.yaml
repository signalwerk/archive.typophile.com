    <p>Hello everyone :)<br>
    I've just registered in Typophile, and I'm a third year graphic design student at the American university of Beirut, Lebanon.</p>
    <p>I'm working on my logo, and my identity as a designer, and since I'm interested in Arabic type, I made my logo in a way that reflects this interest.</p>
    <p>I'm just looking for some feedback from non-Arabs, because I feel it would be very helpful and beneficial to me.</p>
    <p>my picture is attached (there was a problem inserting the image)</p>
    <p>Looking forward for any reply.</p>
    <p>Thank you :)</p>
