      <p>@Frode: <em>I think those look more like c+o, James.</em></p>
      <p>To ensure that somebody would say that, I left them out of context. In context they function as OO units.</p>
      <p>@Altaira: <em>As per the “non-true ligature” attached to the first post, James, I don’t think it is so much about the unusual placement of the second “O” than because it is quite visible that the second O was scaled down in size.</em></p>
      <p>Scaling down the second O in size is the best thing about it and to my way of designing using ratios and sizing for repeating letters is essential. It makes loads of sense to me, and so on, and such-like etcetera. I put lots of ratio and sized bowl elements into Pyke's Peak and have <a href="http://www.flickr.com/photos/arboghast/3047131121/in/set-72157610797698500/" rel="nofollow">continued</a> the <a href="http://www.flickr.com/photos/arboghast/3080401721/in/set-72157610797698500/" rel="nofollow">theme and technique</a> in <a href="http://www.flickr.com/photos/arboghast/sets/72157610797698500/" rel="nofollow">Jabberwub</a>.</p>
      <p>Florian that's a great example of Caren's! </p>
