      <p>Frode, this is crazy, we have a supermarket chain in Switzerland that's also called Coop and has <em>almost exactly</em> the same (new, very ligatured) logo as yours. I wonder if they're connected somehow, or if they aren't, who stole whose logo? ;)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Coop-70-rgb_6157.gif"></div><p></p>
      <p>As per the "non-true ligature" attached to the first post, James, I don't think it is so much about the unusual placement of the second "O" than because it is quite visible that the second O was scaled down in size. FWIW, the differring weight makes it hard for me to see it as a ligature that was originally designed like this, as one glyph.</p>
