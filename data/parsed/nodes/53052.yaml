    html: |-
      <p><a href="http://www.ateliergassner.at/wood.htm" rel="nofollow">This logo</a> uses a moebius loop (infinity symbol) as a double o ligature, it is probably even more of a wedding symbol though. <a href="http://new.myfonts.com/fonts/dstype/esta/ligatures/" rel="nofollow">Esta</a> has a double O ligature that I had wanted to use/develop for a logotype, however due to other considerations it didn’t work out.</p>
      <p>I would accept your description of the Mary’s Woods one as not a <em>true ligature</em>, it doesn’t seem that the second O has had enough consideration of differences in weights through scaling and the triangle device appears to be included for consistency with the A but hanging out off centre (frankly I would doubt it is very user-friendly for the inhabitants). In my opinion for a ligature to be a <em>true ligature</em> it doesn't have to join or overlap but to be designed with consideration of the pair (or more) of characters and with consideration to possible surrounding characters.</p>
      <p>Tim</p>
    html_clean: |-
