      <p>I don't know of any other logos that use a dubble O ligature. The Bloomingdale's logo isn't well known outside the United States, and I happen to dwell in Australia.</p>
      <p><em>Someone sent me the logo for a retirement home that makes use off two intersecting “o’s” but I don’t think it is a true ligature.</em></p>
      <p>Why not? What disqualifies the overlapping structure from being a ligature? I think what you're getting at is the departure from normal or accepted structure for a ligature. Saying it's "not a true ligature" is an exclusionist and conservative view. If that's true, then you should be able to define "true ligature".</p>
      <p>And you know, the moment somebody defines "true ligature" I will be along to demolish all such notions.</p>
      <p><em>I would like to use the double-O ligature in the title of a publication, but feedback from someone said that overlapping O’s reminded her of unity, or gender symbols (male and female). While that’s true, I wouldn’t normally think of that when seeing it in text.</em></p>
      <p>Oh dear, one whole person says it reminds her of unity or gender symbols, so that's it man, it's no good ;^) I think your friend isn't seeing this in context, and as you know context counts for a lot.</p>
      <p><em>I think the double-o ligature looks classy in certain circumstances.</em></p>
      <p>So do I. What do you make of these dubble O ligatures I designed for my <a href="http://www.flickr.com/photos/arboghast/sets/72157605345678800/" rel="nofollow">Pyke's Peake font</a>?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dubble_o_4170.gif"></div><p></p>
      <p>j a m e s</p>
