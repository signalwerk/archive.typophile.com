      <p>Thank you to everyone who posted a response to my question! I really appreciate all the great examples that you've found. </p>
      <p>When I mentioned in my original posting that I didn't think St. Mary's used a true double-o ligature, I'm talking about an actual ligature; i.e, one single character, or glyph in the typeface. I think St. Mary's logotype was created by using two distinct letter o's. </p>
      <p>The Audi and Olympic symbols are excellent examples of O's that intersect, but these are not true ligatures either. They are wonderful examples of how circles were used to form a distinct logo.</p>
      <p>I love all the examples. Thank you again for all the logos you've found, including the font families that were mentioned.</p>
      <p>Glenn</p>
    html_clean: |-
