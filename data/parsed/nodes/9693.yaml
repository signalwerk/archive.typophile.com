  html: <p>Hey everyone -- <br> <br>I'm looking for a good typeface that simulates a heavily-used (I won't say grunge) ticket or receipt printer.  I'm looking for better fonts than what I find from searching for "receipt" on myfonts.com and would like some recomendations.  I would prefer something that looks like it was thermally printed like the first example below rather than dot matrix, but right now I could go either way with this.  <br> <br>Here are some scans of a few styles of type that I would love to find fonts for. <br> <br><img src="http://www.typophile.com/forums/messages/83/6709.jpg" alt="tickets"> <br> <br>Thanks, I appreciate it!</p>
