    <p>This commercial was running on Canadian Discovery Channel for a while now. I don't think I ever saw ligatures used in a TV commercial before. The whole ad is done very well, and this is one of many nice touches in it. </p>
    <p>Though the cheese itself I don't like :-)</p>
