    html: <p>I might've seen "fi" lig in an ad before. Thing is, it's hard to tell in many typefaces if it's the lig or actually two adjacent letters. It looks nice. The line might be drawn at "ct" or "st" ligs, outside of commercials calling for Renaissance or pirate overtones. Thanks for sharing. :)</p>
