    html: <p>I wonder if the lack of typographic sophistication on TV ads is due to the tools being used to generate the text. It would be easy to point the finger at Adobe but there's probably more to it than that?</p>
    html_clean: <p>I wonder if the lack of typographic sophistication on TV ads is due to the tools being used to generate the text. It would be easy to point the finger at Adobe but there's probably more to it than that?</p>
  - id: 386246
    user: 46051
    date: 2009-12-30T12:29:00
    date_raw: 30 Dec 2009 — 12:29pm
    votes: null
    html: <p>I think that lack <em>is</em> due to those tools as long as they do not do automatic glyph replacement or proper kerning <em>by default.</em> Only few designers in TV advertising will see these as that important as to switch them on manually. If they know about them in the first place.</p>
    html_clean: <p>I think that lack <em>is</em> due to those tools as long as they do not do automatic glyph replacement or proper kerning <em>by default.</em> Only few designers in TV advertising will see these as that important as to switch them on manually. If they know about them in the first place.</p>
  - id: 386300
    user: 50909
    date: 2009-12-30T21:51:00
    date_raw: 30 Dec 2009 — 9:51pm
    votes: null
    html: <p>Also, think about signs. Alot of the time, display text is relatively even spaced so as to be legible and straightforward. I'm thinking of letter boards outside a church or movie theater. Most of those are majuscule-only anyways. But then you've got cursive script on wedding invitations and wine bottles replete with ligatures, swashes, and what have you. Ah the beauty of diversity!</p>
