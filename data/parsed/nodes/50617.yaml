    html: |-
      <p>Eben</p>
      <p>as far as I can see, Updike relates with those words to the italics (Kanon cursijf and Paragon cursijf) mentioned some lines before – see page 20. If you look at Ill. 201 (between page 14 and 15), you will find a lot of unusual ligatures besides the usual ones (st sp ct ss st etc and so on) and the swashes in the type. </p>
      <p>There is a “us” in line 1: Largus, a “as” in proprias, a “ta” in line 2: monimenta, a “at” in line 3: Illustrat, a “is” in line 9: Sudantis, and I’m sure there are a lot more of those ligatures. Although the example is taken from a 1616 imprint, the type was in use at least from 1575 onwards. There are also a lot of swashy alternate capitals in this type.</p>
      <p>So I think Updike speaks mostly of those elements.</p>
      <p>wolfgang</p>
      <p></p><div class="imageWrap"><img src="/files/rc-updike-201_3859.jpg"></div><p></p>
      <p>Part of Updike, Ill. 201</p>
