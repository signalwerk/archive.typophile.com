      <p><a href="http://www.columbia.edu/cu/lweb/data/indiv/rare/type-exhibit/2rvi/arrighi.htm" title="http://www.columbia.edu/cu/lweb/data/indiv/rare/type-exhibit/2rvi/arrighi.htm">http://www.columbia.edu/cu/lweb/data/indiv/rare/type-exhibit/2rvi/arrigh...</a></p>
      <p>Note also the Greek letters, for spelling reform.<br>
      All very experimental.</p>
      <p>There was a lot of interest in italics during the 16th century, whole books were printed in them.<br>
      But eventually it transpired that mixing roman and italic was a more useful complexity than trying to parse the effect of calligraphy.<br>
      But as long as typefounders were wrapping their heads around such complexity, perhaps some of the contextuality rubbed off on their treatment of roman? Keep looking...</p>
      <p>That title page is engraved.</p>
