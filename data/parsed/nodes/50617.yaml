    html: "<p>I think you are jumping too far in associating Updike’s ’unusual’ with specifically ’contextual shapes’, enamoured as you are of the latter. Linking obviously refers, as you note, to the various ligated letters: ff us et ta ll st etc. as illustrated in your second post. But note also the scribal abbreviation in ferroque in line eight, which doubtless Updike would have classified with ’unusual’, along with swash forms, and perhaps even the long s. Unusual means ’unusual to Updike’s time and taste’, of course, not unusual to the makers or users of the original type.</p>"
    html_clean: "<p>I think you are jumping too far in associating Updike’s ’unusual’ with specifically ’contextual shapes’, enamoured as you are of the latter. Linking obviously refers, as you note, to the various ligated letters: ff us et ta ll st etc. as illustrated in your second post. But note also the scribal abbreviation in ferroque in line eight, which doubtless Updike would have classified with ’unusual’, along with swash forms, and perhaps even the long s. Unusual means ’unusual to Updike’s time and taste’, of course, not unusual to the makers or users of the original type.</p>"
