      <p>I was saddened to hear this news. I had not known that Jim was ill. </p>
      <p>I was also fortunate to spend an afternoon visiting with Jim at his studio. This was the last day of ATypI in Vancouver back in 2003. Michelle Hill and I bailed on the afternoon sessions and drove over to Jim's. It was wonderfully inspiring and educational.</p>
      <p>I only wish that I'd been able to take him up on his standing invitation to come spend a week working with him, learning to cut matrices and cast type.</p>
