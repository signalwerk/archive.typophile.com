      <p>My favourite memories of Jim involve visits to his workshop in New Westminster: one of those very humane workspaces that printers seem so good at creating for themselves. Of course, Jim was both a printer and a typefounder, and the two rooms expressed something of the natures of these two undertakings: the printing room expansive and light, filled with warm wood and carefully cleaned pressed; the foundry cramped and dark, filled with lead-spattering and jerry-rigged industrial machinery.</p>
      <p>In 2003, Brian Morgan and I went to document Jim cutting and casting a keepsake for that year's ATypI conference in Vancouver, and I'm pleased to see that the <a href="http://www.atypi.org/news_tool/news_html?newsid=127&amp;from=" rel="nofollow">photographs and account of that visit</a> are still on the ATypI website.</p>
