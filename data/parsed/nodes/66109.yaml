    <p>As many of you have heard, Canadian typographer Jim Rimmer passed away in his home on Friday, January 8 after a courageous fight with cancer. Jim designed dozens of typefaces, most of which were issued digitally through P22, some released in metal through his Pie Tree Press &amp; Typefoundry, and even a few faces were issued in both digital and metal formats. </p>
    <p>I was fortunate to have known Jim and to have learned from him how to print and how to cut my own type in metal, but most of all to have been friends with the man over the past 12 years. Undoubtedly there will be many tributes to Jim, one of which is the Facebook page Remembering Jim Rimmer, which you can see -- and contribute to -- here:</p>
    <p><a href="http://www.facebook.com/pages/Remembering-Jim-Rimmer/277069136998" title="http://www.facebook.com/pages/Remembering-Jim-Rimmer/277069136998">http://www.facebook.com/pages/Remembering-Jim-Rimmer/277069136998</a></p>
