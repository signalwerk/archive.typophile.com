      <p>I'm one of the lucky people personally touched by spending a few intense<br>
      hours witnessing Jim's prolific multiple-mastery in his studio, being exposed<br>
      first-hand to the rarified crafts of pantograph usage and punchcutting:<br>
      <a href="http://www.flickr.com/photos/48413419@N00/sets/72157622668087871/" title="http://www.flickr.com/photos/48413419@N00/sets/72157622668087871/">http://www.flickr.com/photos/48413419@N00/sets/72157622668087871/</a></p>
      <p>I haven't known anybody so generous with sharing such expertise.<br>
      He was the best possible influence on us. And that's gone now.</p>
      <p>Paul, I don't have a Facebook account.<br>
      But this has the best chance of changing that.</p>
      <p>hhp</p>
