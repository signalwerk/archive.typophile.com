    html: <p>Mr Rimmer was my first type hero, as a young graphic designer in the late '80s. His Albertan was used extensively in Mediamatic Magazine back then, and I loved the way it looked, especially at display sizes. It took me several months, back in the pre-internet days, to identify it. I still have the original floppy from Giampa. Rest in peace, Mr Rimmer.</p>
