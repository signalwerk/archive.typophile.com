    <p>I am in the process of working my way into an Junior Art Director position.  I am wondering what is a good salary range to ask?  It is not a full-blown Art Director job so I can't ask too much, but if I don't ask enough they will not take me seriously.  If I get the job it will be my first job in this position, so I am not super experienced.  I am also in a good-sezed metropolitan area (Denver, Colorado).  Is $35,000 too much for a rookie Junior Art Director?</p>
