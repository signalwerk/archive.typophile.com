    html: |-
      <p>It really depends on the company and the type of work you are doing. Off the bat, $35,000 sounds at least $10k too little. I'd say mid-$40k range and let them make you an offer from there. </p>
      <p>Do some research on the Bureau of Labor Statistics Web site, which is more reliable than salry surveys. You can find figures for Art Directors or Senior Designers working in the Denver Metropolitan area, and then break those figures down by industry (publishing, advertising, etc.)</p>
      <p>I believe the concept of a Junior Art Director or Associate Art Director is kind of a tough one in terms of figuring out salaries. Most places seem to stick with Junior Designer, Senior Designer, Art Director and Creative Director.</p>
      <p>Trust me, unless the amount you ask for is extremely high, employers will not be put off by your request. They expect them and they will always come down to a lower figure. So aim high.</p>
