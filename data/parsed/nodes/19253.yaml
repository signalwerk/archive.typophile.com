      <p>I suspect that, like most logos, this is custom lettering, but you could approximate this with Scangraphic’s <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=SG.102124.0.1&amp;attributes.sampleSize=48&amp;sampleText=Baskin+Robbins&amp;sampleSize=32">’Times Black’</a> and a bit of ’squooshing’. The x-height is nearly as high, and the letterforms are pretty close, in my opinon. The ’3’ has even the right attributes, if you distort it some.</p>
      <p>- Mike Yanega</p>
