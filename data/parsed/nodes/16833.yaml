      <p>try your luck at ZVAB.com and search for "Bremer Presse".<br>
      A good book about the historie of the Bremer Presse is:</p>
      <p>Die Bremer Presse, Königin der deutschen Pressen, 1964 Typographische Gesellschaft München</p>
      <p>But its a bit pricey!</p>
      <p>The Bibelschrift is available at <a href="https://web.archive.org/web/20150124091336/http://www.moorstation.org/typoasis/blackletter/htm/bibelschrift.htm" rel="nofollow">moorstation</a>.</p>
      <p>I like the Antiqua and the Greek, of course a bit plumb and dark, but something differend for its time. </p>
      <p>BTW, all his typefaces are cutted by Louis Hoell. I thing his influence is a last 50%. </p>
      <p>--<a href="https://web.archive.org/web/20150124091336/http://www.astype.de/" target="_blank" rel="nofollow">astype.de</a>--</p>
