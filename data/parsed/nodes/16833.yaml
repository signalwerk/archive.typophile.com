      <p>So it's been over a year already?! Scary.</p>
      <p>One of my students* is considering digitizing the Latin/Roman font cut by Hoell for Bremer. He says it's unlikely to go further than his own hard drive, but we agree that it might still be useful to research the rights situation (even though the design is over 80 years old) and/or find out if anybody has already digitized it. If things turn out to be sufficiently accomodating I'd like to encourage him to eventually release it, since it's a lustrous rara avis of a typeface.</p>
      <p>* <a href="https://web.archive.org/web/20150124091336/http://typophile.com/node/30444" title="http://typophile.com/node/30444">http://typophile.com/node/30444</a></p>
      <p>Any ideas?</p>
      <p>hhp</p>
