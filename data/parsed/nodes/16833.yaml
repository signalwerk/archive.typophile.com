      <p>Louis Hoell 1860-1935</p>
      <p>He cut also all typefaces for P. Behrens, F.H. Ehmcke and E.R.Weiss. In this context he worked for or with the foundries Klingspor and Bauer/Flinsch.</p>
      <p>The second book you found has nothing to do with the "Bremer Presse". </p>
      <p>--<a href="https://web.archive.org/web/20150124091336/http://www.astype.de/" target="_blank" rel="nofollow">astype.de</a>--</p>
