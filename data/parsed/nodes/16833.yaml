    <p>Does anybody know where to find samples of the four fonts*<br>
    made by Willy Wiegand, in the first half of the 20th century?</p>
    <p>* A Bible, something called "Latin/Roman", a Greek and a Liturgica.</p>
    <p>hhp</p>
