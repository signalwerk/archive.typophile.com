    <p>Recently I been working on the latest member of the Aviano series. I hope that you'll take a look and give me some suggestions about the design; I appreciate any feedback.</p>
    <p>I am also trying to decide on a name. I'm not really happy with any of these ideas. If you have a better one, let me know.</p>
    <p>Aviano Grotesque</p>
    <p>Aviano Contrast</p>
    <p>Aviano Sans Didone</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aviano-Contrast-Sample-Page-Source3_6212.png"></div><p></p>
    <p>Thank You!</p>
