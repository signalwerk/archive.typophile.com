    html: |-
      <p>Good comments. I considered "Stress," "Stressed" or "Stressed Sans," but I want to avoid the word. Currently going with contrast.</p>
      <p>I made some adjustments; mostly subtle, but the K and R are perhaps the most visibly changed. I balanced the 's' and adjusted some letter widths.  I am working on the kerning; here is what I have so far. I'd appreciate comments on the kerning and spacing in particular as I feel  I am not so great at it. Also, it seems more difficult or less forgiving with extended faces.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Aviano-Contrast-Sample-Page-Source3_3943.png"></div><p></p>
      <p>Kerning/Spacing Sample: <a class="freelinking external" href="http://www.insignedesign.com/pdfs/AvContrastinitialkerns.pdf" rel="nofollow">http://www.insignedesign.com/pdfs/AvContrastinitialkerns.pdf</a></p>
      <p>Thanks!</p>
