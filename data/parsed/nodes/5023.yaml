    html: <p>Scott, <br> <br>Wow! I didn't get that connotation at all! In fact, when I first read your input, I still didn't get what you meant. Did you mean the smiley face was some sort of slang symbol meaning sex nowadays? Or (slowly dawning on me) that a man symbol plus a woman symbol meant a smile? I assume that this is what you meant. <br> <br>I don't see an overt relationship between a man and a woman equalling a (post coital I assume) smile. That train of thought could easily head toward love or friendship too, no? <br> <br>I do recognize your point though, and it is a good one. I need to think about the photo idea though. I really would like to keep the logo as blocked out as possible. Even the secondary colors are pushing it a bit. <br> <br>BJ, <br> <br>Great icon! So funny <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> TYC will be a regular old photographer resume site--weddings, family portraits, modeling portraiture, commercial location work, and even pro-bono alternative sports coverage. I want the logo to be unassuming and welcoming, rather than the fancy image most photographer sites project (including, in its own way, the current tyc site).</p>
