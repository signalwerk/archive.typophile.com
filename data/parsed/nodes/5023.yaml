    html: <p>I agree with Scott's interputation of the man, woman, sex look of the letterforms. The C looks like a couple embracing not like a smiley face on it's side. The first two characters are upright figures, to then switch to a face on it's side is a bit of a jump. I had to go back to try and see the smiley. Did you try it with a plain C, sans eyes (heads)? The logo on it's own says fertility center or family planning, not photography. And so I also agree with Scott on his suggestion of incorporating photos with the letters. It could work with the photo inside the letter or the circle as a photo and the letter ko's. It might be a little difficult finding the right photo to work with the letter forms. If your plan is to build a weddings/family portrait client base, perhaps a simple textural image would work - close up of lace, or hair, etc. However, that approach may not work with the no-frills persona you are trying to represent. The soft rounded forms and human element does say friendly and approachable, however if you are aiming this at the general public they are not going to understand the RGB color wheel. Since you are going through the creative process of creating a logo for yourself it should somehow reflect your personality/photographic style (imo). I see a lot of energy in your photos which isn't expressed by this logo. Then again if your aim is weddings that might not be appropriate. Looking forward to seeing your next post.</p>
