    html: <p>Et - (or and) and it's called an ampersand.</p>
    html_clean: <p>Et - (or and) and it's called an ampersand.</p>
  - id: 446275
    user: 1043
    date: null
    date_raw: null
    votes: null
    html: <p>If you study fonts, you'll find lots of ampersands like this, mostly in italic faces. Considering that the ampersand represents "et", the more common one that looks like a figure-8 is the weirder one, where the original letters are almost completely hidden.</p>
