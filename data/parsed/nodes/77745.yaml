    <p>Hello, and thank you very much for reading my post.</p>
    <p>I have found this E-like, &amp;-like symbol online, and I was wondering what this symbol means and what typography it is.</p>
    <p>I am thinking it is one of H&amp;FJ typography, but note sure.</p>
    <p>Does anyone know what symbol and font this can be!?</p>
    <p>Again, thank you very much for your time and kindness :).</p>
