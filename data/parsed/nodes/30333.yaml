    <p>Pingmag has a new feature article on Iranian typography. As expected, most of it is purely calligraphic. However, it's interesting to see a visual culture known for its avoidance of imagery using typography as a representational or illustrative tool.</p>
    <p><a href="http://www.pingmag.jp/2006/12/11/iranian-typography-now/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.pingmag.jp/2006/12/11/iranian-typography-now/" rel="nofollow"><img src="http://typophile.com/files/iraniantypo39_6330.jpg"></a></div><a href="http://www.pingmag.jp/2006/12/11/iranian-typography-now/" rel="nofollow"><br>
    </a>(poster by Mehdi Saeedi, “The Blind Owl” typography exhibition)<p></p>
    <p>Check out <a href="http://www.pingmag.jp/2006/12/11/iranian-typography-now/" rel="nofollow">Iranian Typography Now</a></p>
