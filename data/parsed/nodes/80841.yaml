      <p>A grid is meant to provide some form of consistent pattern to the flow of the layout. If you're asking if you can just put stuff wherever you want, then sure. Though that's not a grid, then. That's just putting stuff wherever. ;)</p>
      <p>If you are asking if grids are still popular, then 'yes'. They're a core tool in the graphic designer's toolbox.</p>
