    html: |-
      <p>I've always thought it'd be a good idea for InDesign to have more options on their margins/columns/gutter setup dialog. As it stands you can choose the margin and gutter size and number of columns, and you get whatever column width fits. It might be useful to be able to choose, say, column and gutter width and number of columns and either right or left margin and have it calculate the other margin for you (or choose margins and column width and have it calculate the gutter width for you). At least that way you wouldn't be doing math with a pencil on the back of an envelope to get the column width you want.</p>
      <p>Sometimes I use guides instead, and draw my column text boxes to those. I'm no expert though.</p>
