    html: <p>thanks, that was what I was asking. I had an exchange with someone who said  a grid isn't as fundamentally solid or sound if you don't lock the horizontal divisions onto increments of a base unit, but my feeling is that that's kind of arbitrary, given that there's no equivalent of a baseline grid that the eye looks to align to</p>
