    html: |-
      <p>So, for example, if your baselines are 12 points apart, does each column need be a multiple of 12 points wide? Is that what you're asking?</p>
      <p>I guess my viewpoint is that grids are essential for adding structure to a layout, but since the reader isn't going to pull out a ruler and measure everything, it ultimately comes down to how it looks. </p>
      <p>If your mathematically precise grid looks great, then use it.  But if you're trying to use a 12 point grid but the columns look better if they are 15 points apart, then go with what looks better, as long as you're consistent about it.</p>
