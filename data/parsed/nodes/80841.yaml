      <p>thanks, James,</p>
      <p>yes, but they won't fall on even, pre-established grid units, for instance, 12 point gutters and columns in multiples of 12 points. I personally don't see that this is a problem, but I have heard of people referring to this as the way a real grid is built.</p>
