      <p>Well, this is exactly what is so disheartening for me when I approach web issues. I am a book designer, so I want to control <em>everything,</em> and of course I can't! </p>
      <p>My hope was that Corbel could pop up first, on the newer Windows machines that happened to have it, but would rely on Verdana and Trebuchet as next choices for everyone else, and certainly ahead of Helvetica and Arial. Yet I see now that not everyone has even these fonts.</p>
      <p>Thank you for the link to the codestyle study. Useful and  interesting. When I went to their site, I noted that Gill is not displayed correctly (in Gill) in the list of font names, and when I asked for samples of Calibri and Corbel they both displayed in Times. Oh well, I'm sure the hard data in percentages is correct.</p>
      <p>I look with envy at Sumner's site (<a href="http://www.stonetypefoundry.com/" title="http://www.stonetypefoundry.com/">http://www.stonetypefoundry.com/</a>) and how gorgeously he sets up everything, <em>controls</em> everything! Every line break! Every subtlety of linespacing! Every alignment with illustrations! And of course he's doing that through PDFs, over which he <em>does</em> have complete control. But my collaborator and friend, who'll be writing code for this new site, keeps telling me to have as few "pictures of words" as possible, since it runs directly counter to the idea of searches, appearances in rankings, and so forth. </p>
      <p>What a strange tug of war this is, between the modern practices of searchability and any-browser-displayable type on the one hand, and my hot-metal, lock-it-all-up-in-the-chase and control every hairspace desires on the other . . . Am I a curmudgeon who can't change? Or am I a person who justifiably wishes to see information displayed in a particular and refined way, on every computer? </p>
      <p>I'm sure many of you have these conversations with yourselves on a regular basis. And in the end, I guess I should put up, shut up, and just keep on using Verdana.</p>
