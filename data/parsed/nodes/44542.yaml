      <p>I’m afraid it’s not as easy as that. Fonts that come with Acrobat – and reside somewhere on the computer – still might be unavailable to the browser. If one can believe this study, Myriad is actually very rare: <a href="http://www.codestyle.org/css/font-family/sampler-CombinedResultsFull.shtml" rel="nofollow">The most common fonts, codestyle.org</a><br>
      Maybe Joe Clark can elaborate on this topic? I reckon he knows quite a lot about the spread of fonts.</p>
      <p>I’d go with Calibri and rely on the fact that those come bundled, if any.<br>
      Keep in mind most users won’t see neither Corbel nor Calibri.<br>
      In any case, make sure to add Corbel to the end of your font stack, as a fallback, so that your users don’t end up with some random default sans like Arial. That might look worse than having the old-style figures in the first place.</p>
