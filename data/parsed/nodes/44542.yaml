      <p>Why would it be ‘not a good thing’ if the author could suggest a figure style that goes best with the content?</p>
      <p>Three years later, there is hope for more typographic control: W3C’s CSS Fonts Module Level 3 Working Draft includes a section about <a href="http://www.w3.org/TR/css3-fonts/#font-variant-numeric-prop" rel="nofollow">numerical formatting: the font-variant-numeric property</a>.</p>
      <p>John Daggett (Mozilla) explains the <a href="http://hacks.mozilla.org/2010/11/firefox-4-font-feature-support/" rel="nofollow">OpenType font feature support</a> in Firefox 4. In this browser, you can select lining figures via the vendor-specific CSS declaration <code>-moz-font-feature-settings: "lnum=1";</code>.</p>
      <p>See also Christopher Slye’s article on Typblography,  <a href="http://blogs.adobe.com/typblography/2010/09/opentype-features-come-to-the-web.html" rel="nofollow">OpenType Features Come to the Web</a>.</p>
