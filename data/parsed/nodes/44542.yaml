      <p>Hi Bruce!</p>
      <p>What Thomas said.</p>
      <p>A bit more detailed here:<br>
      <cite>The css3 fonts module is still a working draft […] so there remains the possibility to address the omission of figure case selection.  […] the numerals cannot be ‘transformed’ to upper- or lower-case, in the style of text-transform. This implies that a ‘variant’ property should be used, much like font-variant is used to specify small caps. As such, it is proposed that a numeral-variant property be added to the css3 fonts module.</cite> — <a href="http://webtypography.net/Harmony_and_Counterpoint/Numerals__Capitals_and_Small_Caps/3.2.1/" rel="nofollow">webtypography.net</a></p>
      <p>However, you can use a workaround similar to the one described here: <a href="http://css-tricks.com/using-the-best-ampersand-available/" rel="nofollow">Using The Best Ampersand Available</a>.</p>
      <p>Just tag all instances of ‘MM2’ in your HTML with something like <code>&lt;span class="lf"&gt;MM2&lt;/span&gt;</code> (lf for lining figures here, you can pick any name). Then, in the CSS, specify a sequence of sans fonts that are similar to Corbel – but have lining figures, as default:<br>
      <code>.lf {font-family: "Myriad Pro", "Myriad", Calibri, sans-serif;}</code></p>
      <p>There certainly are more (possibly better) options. Still, Myriad is quite widespread, and users that have Corbel will most likely also have Calibri. Both do a great job.<br>
      For some other faces, you’d have to adjust the size (see Lucida Sans), otherwise they’d stand out. Unfortunately, and afaik, you can’t do that dependent on the font, yet.</p>
      <p>This example is rendered by Safari on Mac OSX; font-size: 18px. I assume your text will actually be even smaller, so the differences would really be insignificant.</p><div class="imageWrap"><img src="http://typophile.com/files/corbel_4776.png"></div><p></p>
      <p>F</p>
