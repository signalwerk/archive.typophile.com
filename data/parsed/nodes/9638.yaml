    html: "<p>I know I'm coming late to the party here, but I'll just weigh in with what I know, and what I see around. <br> <br>While the glyph in most sans serif fonts is nothing but a pair of boxes, the correct mark to indicate inches is \", the double prime. The prime is used for feet. <br> <br>The 'Hungarian Umlaut' accent, as it is known to users of Fontographer and FontLab - that's likely the accent's official ISO name - is composed of two acute accents arranged close together, with an umlaut-like proximity. This is not a double prime, and the acute accent is not a prime. <br> <br>Close-quotation marks (single and double) are likewise not primes, and should not be used to indicate feet and inches, although your page layout software has a preference for 'Typographer's Quotes' which will replace errant primes and double primes for their correct quotation mark. You can turn this function off in order to insert correct primes and double primes, but watch out that your apostrophes and  quotes don't revert to the 'email' state of primes and double primes. (For example, I have been using primes and double primes to indicate quotation marks, since this is HTML / ASCII text, and quotation marks are not supported.) <br> <br>Every font's accents, prime marks, and quotation marks have been designed by the type designer, and so should be used where they should, even if an acute accent or close-quotation looks good. After all; what if you change your mind and your font at the last minute? You will end up with surprises... <br> <br>I don't have Frutiger loaded on my machine at the moment, but have made a little image showing the differences between the various glyph's in Adrian Frutiger's Univers font, and in my own ApexSans font. And I threw in the comma as well for further comparison: in some fonts, the comma and quotation marks are identical, in others they are not. <br> <br>Hope this helps somewhat. <br>Best, <br>c <br> <br><img src=\"http://www.typophile.com/forums/messages/30/6727.gif\" alt=\"\"></p>"
