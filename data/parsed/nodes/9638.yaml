    html: <p>Yeah, a screen shot of those three characters would help, Gerry, but (going out on a limb) chances are that your option 1 is an inch mark (or "double prime"); 2 is a typographic (or curly) quote; and 3 is a Hungarian umlaut. Hungarian umlauts aren't inch marks, and they're not that common. E.g., the "umlaut" in the mathematician Paul Erdös' name should be a Hungarian umlaut.  <br> <br>Don't quote me, though. All this is <i>assuming</i> that you're running a Mac, and your font is based on the standard MacOS Roman codepage.</p>
