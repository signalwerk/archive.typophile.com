    html: <p>So should I take the CMOS rule to mean that they think inch and foot marks should be italicized primes rather than the accents? That doesn't really make sense to me, as I don't think that any other symbols are normally italicized when used with roman text, but I'm willing to be swayed. <br> <br>I think the CMOS rule is meant, as most CMOS rules are, to avoid misunderstanding. The CMOS rule may stem from an era in which newspaper writers sent in typewritten stories wherein they didn't have the luxury of curly quotes, hence the opportunity for quotation-mark/inch-mark confusion. Thus, the CMOS rule may be outdated.</p>
