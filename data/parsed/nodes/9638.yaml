    html: <p>Cheshire, most typographers will disagree with you.  <br> <br>Option 1 is the double prime, also known as dumb quote, and is the proper mark for inches.  <br> <br>Option 2 is the typographic quotation mark -- or "curly" or "smart" quote (as styled for Frutiger, not very curly, I grant you).  <br> <br>Option 3 is the hungarian umlaut, an accent mark. (Bringhurst prefers to call it double acute or long umlaut, as the Hungarian language also includes traditional umlauts.) Your corresponding shift-option-e on the Mac yields the acute accent mark. <br> <br>Prime marks are usually vertical, but you will also find an occasional design which features slightly sloped primes. When they are, they look very similar to Frutiger's quotation mark. <br> <br>You can refer to Bringhurst's Appendix A for more description of each of these. (The Elements of Typographic Style ) <br> <br>-- K. <br></p>
