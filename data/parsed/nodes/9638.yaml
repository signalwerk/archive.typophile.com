    html: "<p>Cheshire, your examination was more thorough than mine. I did not look on to observe that the <i>or</i> is not usually followed with italic.  <br> <br>Still, I find it hard to comprehend that the CMOS would dictate either accent marks or italicized primes over plain ol' font-specific, designer-designed primes.  <br> <br>I don't have my copy with me now to try to find any other evidence to support my unswayed conviction that the slantedness of the primes in CMOS is not intended to be prescriptive. I have no further explanation. <br> <br>For those who may not be aware: in Quark on the Mac you can type prime marks without turning off the \"smart quotes\" preference by using the control key to override the substitution -- control-' gives the single prime, control-shift-' gives the double prime. <br> <br>-- K. <br> <br></p>"
    html_clean: "<p>Cheshire, your examination was more thorough than mine. I did not look on to observe that the <i>or</i> is not usually followed with italic.  <br> <br>Still, I find it hard to comprehend that the CMOS would dictate either accent marks or italicized primes over plain ol' font-specific, designer-designed primes.  <br> <br>I don't have my copy with me now to try to find any other evidence to support my unswayed conviction that the slantedness of the primes in CMOS is not intended to be prescriptive. I have no further explanation. <br> <br>For those who may not be aware: in Quark on the Mac you can type prime marks without turning off the \"smart quotes\" preference by using the control key to override the substitution -- control-' gives the single prime, control-shift-' gives the double prime. <br> <br>-- K. <br> <br></p>"
  - id: 61536
