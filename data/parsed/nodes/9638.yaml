    date: 2003-02-19T13:25:00
    date_raw: 19 Feb 2003 — 1:25pm
    votes: null
    html: "<p>I guess it didn't seem unnatural to me to use accents for another purpose, as there are other symbols that do multiple duties as well: the tilde is used in Spanish or Portuguese in conjunction with other letters, but it's also used in English to symbolize \"approximately\"; the asterisk is used both as a footnoting device as well as a mathematical symbol; and the pi and delta symbols are used in mathematics but are also used as shorthand in the legal sphere to denote \"plaintiff\" and \"defendant.\" Though the marks in question here were primarily accents for languages other than English, I don't see a problem with reassigning them for use in the English language as marks to represent something else. Note also that the slanted primes (which I've always referred to as \"hash marks,\" by the way) are also used to denote minutes and seconds, as mentioned <a href=\"http://www.fontsite.com/Pages/RulesOfType/ROT1097.html\">here</a>. <br> <br>I would be interested to know the development of the primes in the first place. </p>"
    html_clean: "<p>I guess it didn't seem unnatural to me to use accents for another purpose, as there are other symbols that do multiple duties as well: the tilde is used in Spanish or Portuguese in conjunction with other letters, but it's also used in English to symbolize \"approximately\"; the asterisk is used both as a footnoting device as well as a mathematical symbol; and the pi and delta symbols are used in mathematics but are also used as shorthand in the legal sphere to denote \"plaintiff\" and \"defendant.\" Though the marks in question here were primarily accents for languages other than English, I don't see a problem with reassigning them for use in the English language as marks to represent something else. Note also that the slanted primes (which I've always referred to as \"hash marks,\" by the way) are also used to denote minutes and seconds, as mentioned <a href=\"http://www.fontsite.com/Pages/RulesOfType/ROT1097.html\" class=\"link-external\">here</a>. <br> <br>I would be interested to know the development of the primes in the first place. </p>"
  - id: 61537
    user: 1215
    date: 2003-02-19T13:54:00
    date_raw: 19 Feb 2003 — 1:54pm
    votes: null
    html: "<p>Well argued, Cheshire. But going back to the original question: what is the correct way to show the inch mark? I maintain that it is the font's proper primes.  <br> <br>An aesthetic decision to press accents into service in the place of primes is a slightly different matter. I will confess that I don't care for the clunky design of the Frutiger primes (most primes for that matter), but that doesn't change the fact that they are still the proper primes for the face. The long umlaut as double prime just looks strange to my eyes, at least in the Frutiger. Perhaps in another typeface, they could pass. <br> <br>I know that the prime mark is used in mathematics to distinguish . . . actually, I'm not sure I can articulate just what it distinguishes -- two similar, but distinct entities? Something like that. I wonder if the use for inches and feet, or seconds and minutes, derives originally from a mathematical function. <br> <br>BTW, I've always thought of the number sign, or octothorp, as the \"hash mark.\" <br> <br>-- K. <br></p>"
    html_clean: "<p>Well argued, Cheshire. But going back to the original question: what is the correct way to show the inch mark? I maintain that it is the font's proper primes.  <br> <br>An aesthetic decision to press accents into service in the place of primes is a slightly different matter. I will confess that I don't care for the clunky design of the Frutiger primes (most primes for that matter), but that doesn't change the fact that they are still the proper primes for the face. The long umlaut as double prime just looks strange to my eyes, at least in the Frutiger. Perhaps in another typeface, they could pass. <br> <br>I know that the prime mark is used in mathematics to distinguish . . . actually, I'm not sure I can articulate just what it distinguishes -- two similar, but distinct entities? Something like that. I wonder if the use for inches and feet, or seconds and minutes, derives originally from a mathematical function. <br> <br>BTW, I've always thought of the number sign, or octothorp, as the \"hash mark.\" <br> <br>-- K. <br></p>"
  - id: 61538
    user: 1112
    date: 2003-02-19T15:20:00
    date_raw: 19 Feb 2003 — 3:20pm
    votes: null
    html: "<p>I was going to make my hash-mark comment yesterday, but it suddenly occurred to me that I was no longer sure that was accurate, because writing it down for the first time (as opposed to saying it, which I've done for years), the word <i>hash</i> suddenly looked suspicious, as though it really deserved to belong to the octothorpe (or, as I've always referred to it, the \"pound sign\"). Then when I found the page I referenced above, it confirmed my original thought. Now that I've done some more searching, I think consensus runs toward hash-mark-as-octothorpe, which of course makes more sense. Still, there are apparently a lot of people like me who have been running around pell-mell calling quotation marks \"hash marks.\" Well, I'm stopping such nonsense right now. <br> <br>Anyway, back to the original topic: I guess we will agree to disagree. On simply aesthetic terms, I think that the long umlaut tends to look better in serif faces, a more elegant mark compared to the short wedges found, for example, in Helvetica and Futura. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/6760.gif\" alt=\"primes.gif\"> <br> <br>As usual, Adobe Garamond is my favorite.</p>"
