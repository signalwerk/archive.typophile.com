    html: <p>Neither Helvetica or Arial are really good for extended text. Not because they are sans but because of nuances of their design. Verdana holds up far better for that purpose. And has been mentioned, is quite screen oriented whereas Arial is less so. You might also consider coding your CSS for Candara which is also a MS font. It has been specially hinted for screen as well and is a sans like Araila &amp; Verdana. Keep in mind that 11pt Verdana and 12pt Candara have similar apparent sizes - not 12 &amp; 12.</p>
    html_clean: <p>Neither Helvetica or Arial are really good for extended text. Not because they are sans but because of nuances of their design. Verdana holds up far better for that purpose. And has been mentioned, is quite screen oriented whereas Arial is less so. You might also consider coding your CSS for Candara which is also a MS font. It has been specially hinted for screen as well and is a sans like Araila &amp; Verdana. Keep in mind that 11pt Verdana and 12pt Candara have similar apparent sizes - not 12 &amp; 12.</p>
