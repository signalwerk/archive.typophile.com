  html: |-
    <p>We are currently revising our website, which uses Verdana for most of the body copy and navigation etc.  My boss thinks that using arial instead is a great idea, and despite my protestations that Verdana was designed for the web and screen and arial is a dirty Microsoft knock-off, designed only to save money, he needs some convincing.  Put on the spot I mumbled something about Verdana being more accessible and legible on screen and more efficient, but as I'm not a typographer I thought I'd ask for help from the real experts.</p>
    <p>Can someone help me out with some solid reasons that might convince a typographically illiterate person that the choice of font for the web IS important, and that Verdana is preferable to Arial in this case?</p>
    <p>Of course if people agree with him I'll shut my mouth and never give an opinion on typographical matters again.</p>
    <p>cheers.</p>
