    html: |-
      <p>Find your AD's machine, uninstall Verdana, change the CSS to:</p>
      <p>body {font-family: verdana, arial}</p>
      <p>Everyone is happy!</p>
      <p>;o)</p>
      <p>To be fair, Arial isn't THAT bad on screen...in fact it's arguably better than Helvetica. That said, Verdana was specifically designed for the web, has a large x-height, and is pretty much ubiquitous and therefor, one could argue, 'friedlier' to the average web reader.</p>
