    <p>My friend had some graphics work done for him in the early 1990's and the graphic company went out of business.<br>
    I am trying to place the font and I know that it is not just a picture because some of the other advertising used other letters than just the cameo pizza logo letters. I was wondering if anyone could help me locate this font.</p>
