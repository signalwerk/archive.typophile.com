      <p>I think I will try finding a compromise concept, roughly in the direction of the third sketch in my original post, work the joins / apexes / vertices of the AMVWZ in a similar fashion &amp; then see what that does for the liveliness of the font – see if it becomes too bland or neutral. I'm really just at the start of this, in fact the only letters I've started to work on seriously are the O, N, A and T (and even the T is asymmetrical to a wild degree, but I don't think I can make myself keep that).<br>
