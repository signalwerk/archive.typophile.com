      <p>Nina --</p>
      <p>This asymmetrical approach to the two joins in a gothic N is not that unheard of. Here are a few other examples I found quickly.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AsymmetricNs_5072.gif"></div><p></p>
      <p>Left to right: Trade Gothic, ITC Franklin (the new revision by David Berlow), Benton Gothic. Varying degrees of asymmetry (that Benton Gothic is actually pretty subtle), but all following the same basic pattern.</p>
      <p>As to "why," I offer this supposition: As you and Craig have hinted at, I think it derives from the pattern of serif types (but not so much because of handwritten stroke order, as Craig suggests, though this is interesting). Consider the nature of N in a typical serif style. The joins are not the same. The upper join is capped with a serif form — strong, flat, relatively wide, reinforcing the cap line. The baseline join, on the other hand, is a vertex pure and simple — sharp, acute, and often undershooting the baseline.</p>
      <p>The asymmetrical treatment that you're noting is probably a vestige of this character of N. I believe you'll find that this quality is not uncommon in sans serifs that descend from the Grotesque/Gothic lineage. </p>
      <p>BTW, Blair — an all-caps face originally released by the Inland Type Foundry ca. 1900, and later produced by ATF — bears a remarkable similarity to your caps, and in the original metal the N had asymmetrical joins of this type; but the ITC revival does not retain that detail.</p>
      <p>-- Kent.</p>
