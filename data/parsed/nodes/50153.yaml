      <p>I would indeed call type design a Black Art. Except it's not Art.</p>
      <p>&gt; I still hope I’ll get a result that is usable</p>
      <p>I think the consensus is that you're on the right track! One thing to keep in mind here is something rather harsh that I've come to realize over time: to arrive at something <em>usable</em>, one must consciously NOT put <em>everything</em> one knows into a single font, as tempting as that might be. Unless your talent is one-in-a-million, trying to make a font some sort of "ultimate" always ends in tears.</p>
      <p>&gt; has anyone ever done this, just for fun, just to see how it doesn’t work?</p>
      <p>Yes, I have a sample of something like that from a design book, where the author showed a before/after of optical correction. I'll try to find it for you.</p>
      <p>&gt; this should have a future as a titling font too.</p>
      <p>Note that a single font is really only suitable for a narrow range of sizes, so a font for text* cannot be used well very large (although some designers disagree). In effect, a text font has to have a certain ugliness to do its job. Scary, I know. <em>Be</em> afraid, be <em>very</em> afraid.  :-&gt;</p>
      <p>* In this case very short text however.</p>
      <p>hhp</p>
