      <p>&gt; I just spent the entire afternoon trying to figure out the N</p>
      <p>It seems that you've chosen the right field.  :-)</p>
      <p>&gt; While I would like to “filter out” some of the weirdnesses that stem<br>
      &gt; from the lead “medium”, as well as some of the historical specialties,<br>
      &gt; I would still want my digitization to remain as true as possible to<br>
      &gt; the original typeface</p>
      <p>1) It's not so simple to separate the medium from the decisions.<br>
      2) This weirdness can't be from the medium, so if you really do want to make a faithful revival* you should definitely keep it. That said, it's always nice to try to read the minds of dead people!</p>
      <p>* Not something I myself generally recommend.</p>
      <p>&gt; can anyone tell me some reason why this asymmetry in the joins could have been a valid design decision?</p>
      <p>1) Dynamism. The "N" is more boring than most letters, so it needs more help.<br>
      2) Incorporating a vestige of a serif; see the many serif "N"s that have a strong top-left but a weak bottom-right. There is no such thing as a pure sans or pure serif face; this one could very well be 98% sans, but 2% serif.<br>
      3) Maybe an optical effect (like some people have suggested).</p>
      <p>&gt; Does it relate to any of the other letterforms?</p>
      <p>Hopefully yes!</p>
      <p>&gt; The whole thing looks pretty inconsistent to me</p>
      <p>More dynamism (potentially). If the whole thing was consistent except for the "N", then I'd worry.</p>
      <p>hhp</p>
