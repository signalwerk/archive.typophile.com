      <p>Wow, this is getting really exciting. :-)</p>
      <p>Chris,<br>
      I am afraid I do not know either of the people you named. Then again, although I am from Basel and now living in Basel, I have been utterly unconnected to the Basel school – until now that I am studying under some Basel graduates. I did my own studies in <a href="http://www.burg-halle.de/" rel="nofollow">Halle, Germany</a>.<br>
      At least seen from this close distance, I would say the Basel school has lost much of the "shine" it had a couple of decades ago. They do not even do type design anymore, that happens in Zurich now. :-/</p>
      <p>What I meant about humiliation: In this occasion, I do find it to be humbling to find my own limits – of understanding, of (re-)production – to be very narrow when set against the complex beauty of letterforms. It is this humility (in a positive sense) that I need to be as open as possible about approaching new fields. I admit the quote may read as harsh but it does help me – usually, I like to be in charge of stuff, but that doesn't really work here. :-)<br>
      "Illumination", of course, makes a very neat quote as well.</p>
      <p>Hrant,<br>
      Seeing sans and serif not as a binary "decision" but a gradual axis is a highly illuminating (!) thought. I am getting more and more convinced that any type classification system that would make sense today would need axes in numerous dimensions; then again, it would probably not be very usable. But I digress.<br>
      Why are you not in favor of "faithful revivals": Is it because transplanting a font in the exact same shape into a new medium, time, and context would not pay enough homage to its original circumstances? – I would not want to just trace it and voilà; I think it needs a slight degree of "modernization" (plus there are some letters I simply can not live with, like the uppercase G, which I find incredibly hideous).<br>
      That said, I'm also a little worried about the other extreme – putting too much of myself into this so it would end up looking like a different typeface vaguely inspired by this one. That would feel like disrespecting the intentions of the dead person who designed it in the first place. Hmm.</p>
      <p>Also, your respective comments on dynamism offer a very interesting perspective. I have long ago given up the idea that "cool, if you have the b, you can make the dpq in 2 seconds", but I guess it's time I forgot about the copy paste concept altogether. Coming from a graphic / interface design background, it sounds pretty wild to me to *not* render elements with the same function and position in the same style, for the sake of dynamism. I will have to think about how that may translate to other fields. Or maybe it does not, or in a very different form.</p>
      <p>And yes … I have to admit I am loving this. I have always been obsessed with details, and with letterforms and symbols anyway, so it is feeling good. :-) Thanks a lot for sharing your views!</p>
      <p>Nina</p>
      <p>--<br>
