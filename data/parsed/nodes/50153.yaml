      <p><cite>My teacher told me to do the lowercase first, as it is more interesting and complex, but I am half thinking I should first get some basic shape principles down as shown in the uppercase.</cite></p>
      <p>Make your ideas work in the minuscules first. That’s what people will be seeing most of the time, so it really makes sense to have the majuscules complement the minuscules. It also takes more drama to make the majuscules stand out, and that drama might not transfer to minuscules so well.</p>
      <p>And don’t be afraid to stick with the asymmetric N regardless of what the professor wants. But before you do, design a symmetric version so that you know what works better and why.</p>
