      <p>&gt; Do you mean the danger lies in trying to make an “ultimate” font<br>
      &gt; that would work for any size, any situation, any context, any purpose?</p>
      <p>That too, but there I was talking about resisting the urge to use all of one's "tricks" in a single design. NOT doing so might seem like short-changing your design, but my belief is that in practice -maybe because type design is so convoluted- it tends to backfire.</p>
      <p>&gt; I always thought of it as a titling and display font</p>
      <p>Well, the lines are never very clear, but to me this looks like it can be used for a few lines at a time, maybe more if you make a darker version with a smaller x-height.</p>
      <p>hhp</p>
