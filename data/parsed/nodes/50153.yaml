      <p>I haven't thought much about this before but</p>
      <p>1) It doesn't surprise me that a "darker" join works better at the bottom, but not at the top where it might look "top-heavy."</p>
      <p>2) The way I would write a capital N is not symmetrical - I do the first stroke downwards, then the diagonal downwards and the other vertical upwards - like an I and a V. So conceptually, with writing in mind, a greater break works at the top left (where the pen actually picks up and restarts) than at the bottom right (where it just changes direction). </p>
      <p>I'm just making this up - I have no idea if either of these might have been rationale for your original design decision, but there you go. It's an interesting question.</p>
