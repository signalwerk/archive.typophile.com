      <p>"...confuses me when lc is slighly lighter than Uc in the same font"</p>
      <p>Nina,<br>
      Some degree of weight increase in the uppercase is there to overcome the vaster stretches of counter space in caps. The color perception humans make compares and figuratively averages the amount of black ink color with the amount of white paper enclosed. Since the strokes of caps are much further apart, it gives the illusion the the caps would be lighter than the lowercase. To combat this, the cap strokes are made just a bit bolder as compensation. (This is sort of like overshoot in round letters.) The trick is to find out how much is enough weight increase to achieve a balance of color with lowercase without having caps that jump off the page. </p>
      <p>ChrisL</p>
