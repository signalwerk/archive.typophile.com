      <p><cite>I believe you’ll find that this quality is not uncommon in sans serifs that descend from the Grotesque/Gothic lineage.</cite></p>
      <p>Agreed. I was sifting through an old gothics last night and asymmetric Ns were in the majority. As a new type designer I always get stopped by this.</p>
      <p>I think that this really comes down to making these letters work within the proportions of the overall font; the same thing happens with the middle vertexes of M and W. That it seems to appear more in older sans types might be a symptom of the drawing rooms where fonts were designed and manufactured by groups of people who weren’t necessarily sharing an office and had limited options for communicating over distances and for testing and previewing type. Digital technology makes it easier to wipe out every perceived inconsistency—although, as Hrant likes to point out, this is can be to the detriment of letters.</p>
