    html: |-
      <p>Nina,</p>
      <p>you've gotten some good feedback no doubt due to your own thoughtful and considered questions. Welcome. </p>
      <p>The difference in cap/lc weight is mostly optical. Chris is right that they can look too light if not slightly bolder. Illusion! But suppose it is a text face for mostly German typesetting.... Or is it French, for stylish display in a magazine? Caps for text faces are typically spaced rather tightly, because they are used with lc. If you set all caps from such a face, they need some space. Now there is a "cap spacing" feature in some OT fonts which fixes this automatically when lines are styled as all caps. It's also true that lowercase stems might vary in weight depending on how the typeface is used. Bold weights of early metal sans faces had outrageous amounts of this visual adjustment, and it was necessary to keep them from closing up with ink and looking blotchy. Whitney's heavier weights have some of this inconsistency built into them, and it's intentional. </p>
      <p>Type design is almost like cinema; it requires a series of tricks, illusions, inconsistencies, flat out continuity flaws and fakery to appear true. The more one tries to adhere to rules, the more frustration. Diagonals are very tricky; sometimes their weight only looks right slightly thinner than verticals, sometimes diagonals without tapers look "wrong", and I'm sure you've already noticed that many X and x shapes depend on non-continuous cross strokes to look right. </p>
      <p>There are various factors at play in deciding about how to treat this N feature. It's difficult, and there are various tricks available, which depend on your priorities. If even color is most important, traps will help a lot. If a rigidly consistent stroke width is important (suppose this was a design for a monument-engraving machine), then engineering joins with sharp terminals might be best, and traps might not be an option. If stylishness is more important, entirely different decisions can take precedence. </p>
      <p>And then the next typeface will give you entirely different things to think about.  ;)</p>
