      <p>Nina,<br>
      I am not one to do revivals so you might take this with a grain of salt. I would say, the point of making a digital version of a metal font is to make it available and usable in modern day equipment. To me that means to make it better for digital type and offset printing. To do that, you must make some departures from the metal face to make it work. This makes you decide what you mean by "faithful" or "true" revival. First, make it a good typeface. If that means cleaning up the joins to look better to you, then do it. My idea of better might differ from yours. As a student, your job is to define what is better for yourself. You will learn more that way than if you just take my advice or anyone elses. Try all the angle joins several ways and see which makes the best sense with the whole font. For example, to me that z looks crazy. I could not stand looking at it. If it does not bother you, ignore it but whatever you do, make all the letters live together in comfort. Comfort does not mean everything is exactly the same. Sometimes a contrast is good--as Hrant puts it, a "dynamism".<br>
      Type design is about hours of tinkering and debating nuances. If you start working on your typeface one afternoon and find that morning has come without your even knowing it, you may have found a field suitable for you :-)</p>
      <p>ChrisL</p>
