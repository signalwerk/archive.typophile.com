      <p>Thanks again for the wonderful welcome. Sorry I didn't reply earlier, in fact I was away for a couple of days, went to the library of the Gutenberg Museum im Mainz to scan the original font sample. The next night, I dreamed about the B, K, and R. And now I'm battling 350MB TIFFs. :)</p>
      <p>Hrant, your latest post in this thread had me a bit baffled. I've always assumed that type design is just about the most complexly detailed thing one can possibly attempt to do in the graphic field, but I've never thought remotely <em>that</em> far – choosing, or even making!, typefaces with a different contrast between caps and minuscules for different types of text. Wow. It makes a huge lot of sense, though, now that I think about it. </p>
      <p>I'm not scared, though. Just trying to get used to the thought that this typeface is going to serve as a practicing field &amp; the provider of a steep learning curve for me rather than the ultimate digitization of this font. I still hope I'll get a result that is usable, and will be very happy to show it again here once I've got a reasonable character set together to judge the shapes in context.</p>
      <p>Carl,<br>
      I'm guessing I'm mostly aiming at the German language market (haha). Funny you mention "stylish magazines"; the first time I saw the light weight Industria, my inner eye immediately set it as a magazine title, large, light, dark violet (?), partly overlaying a picture with light colours. I'm not a fan, or even a reader, of fashion magazines, but I can picture this font in one.</p>
      <p>The cinema metaphor is just great. I actually worked in video production for a bit and do absolutely see the parallels. Also how you spend endless hours on tiny details on the individual snippets, &amp; in the end it all comes together and looks like a "finished whole" (well, ideally).</p>
      <p>The thing about adhering to rules and how it doesn't work, I find that to be maybe the most difficult feature of type design to explain to outsiders. I tried to convince my aunt (who asked about the project) why optical correction is what counts, &amp; not mathematical correctness. I think she had serious doubts about my ideas (she's a mathematician). If I didn't already have more than enough work on my hands, I'd make a little font for her where nothing is optically corrected (the O being a circle, the bar of the H in the mathematical center etc.) – has anyone ever done this, just for fun, just to see how it <em>doesn't</em> work?</p>
      <p>And regarding the N, um, what I can say for sure is I'd love to be able to do it without traps, at least without them actually being discernible. Firstly because in general, I hate the look of them more often than not and find they quickly distract too much attention from the letterform itself (I'm still visually scarred by seeing this huge poster with Bell Gothic with about a meter of cap height); and secondly because I think this should have a future as a titling font too. Maybe, if it ends up not working without traps in small sizes, I'd consider doing optical sizes.</p>
      <p>Cheers!</p>
      <p>--<br>
      <em>learning is inherently an act of humiliation.</em></p>
