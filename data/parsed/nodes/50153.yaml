      <p><cite>Does a symmetric N, to you, look like it’s heavier at the bottom, or like the diagonal is too low?</cite></p>
      <p>I hesitate to decide by staring at a single N.<br>
      Some time ago I revised/redesigned the same kind of typeface, wondered about it too, tried the symmetric approach and found that the diagonal was too low and went back to the original approach.<br>
      Whether it looks heavier at the bottom is a different story and depends on how you solve the bottom-right join. (Independent of the symmetric/asymmetric question.) Looking at the samples posted by Kent Lew above, in ITC Franklin there is a little ink trap preventing it to look too heavy. Another way is to make the diagonal slightly thinner towards the bottom. So it is not a binary either--or. There are some additional means of visual compensation.</p>
      <p>Very similar issue: Usually you learn that the u should be narrower than the n so they look equally wide. But a bunch of sanserifs don't really care -- and obviously nobody objects. So, the real question is, what is your approach to this typeface. If you prefer a more "rational" approach and apply this consequently, why not.</p>
