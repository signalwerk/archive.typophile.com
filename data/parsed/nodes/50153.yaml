      <p>Think of it as the UC being darker, the rationale being that -especially in a titling font- you could set a fair amount of all-caps, in which case you want to speak a little louder. (I think it was David who brought up this insight, some years ago, on Typophile. IIRC it was in relation to a question by Dan Reynolds about some grots.) I agree that this throws off even color in mixed-case text (especially for German) but back then making/affording a Demi was more prohibitive than today, so they "overloaded" the functionality of single fonts. And that of course is a good example of the medium affecting the decisions, and an argument against revival literality (although keeping/making the caps darker does give a font a certain archaic/quixotic charm).</p>
