      <p>There's one other big functional factor in determining whether/how_much caps should be darker than the lc: if the font is for one-time immersive reading (like a steamy novel) then you want more even color, while if it's a reference work (like a history textbook) where you need to frequently go back and scan for proper names* in a text then you want the caps to stand out. On the other hand, this particular design being a rather mannered sans, it probably won't be used much for either! So I'd say it becomes mostly an aesthetic decision. But anyway, practically speaking, first decide if you're going literal or interpretive.</p>
