      <p>What does the M, V, W, and Z look like in terms of joins? Try to maintain some conistency with them. Metal type usually requires a bit more allowance for inkspread and traps. You may want a tad less for your digital version.  Also, that is a very wide font. With that much width, the N is easier to deal with either way you approach it. Visually, you want a join both without a dark spot or a falling apart. Your eyes will tell you when it is right, not your ruler.</p>
      <p>ChrisL</p>
