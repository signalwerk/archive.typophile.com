      <p>To me, there is a very simple reason for different joins: raising the diagonal a bit and make it look more centered, just as one raises the bar of the H above the mathematical vertical center (where it would sit too low). With an N, there is no other way to achieve this effect than at the price of different joins.<br>
      As your remark about the Chanel logo indicates -- <cite>(I have actually seen that picture before but that was before I noticed asymmetric Ns.)</cite> -- obviously this is subtle enough to go unnoticed unless one starts measuring or reconstructing it.</p>
      <p><cite>... in the original metal [of Blair] the N had asymmetrical joins of this type; but the ITC revival does not retain that detail.</cite></p>
      <p>It looks like reinterpreting type for another medium encourages designers to make details more consistent. Which does not necessarily mean improving them.&nbsp;&nbsp;:)</p>
