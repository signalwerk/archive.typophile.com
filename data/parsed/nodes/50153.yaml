      <p>I think Karsten's got the right idea about the asymmetry of the cap N. </p>
      <p>I noticed it as being a common feature among sans serifs very early on and assumed (or maybe read somewhere) that it was done for the same reason as the slightly-raised cross-bar, the smaller upper bowl, and other asymmetrical construction: to keep conceptually symmetrical forms looking symmetrical, and not top-heavy or upside down. It's one of those optical illusion things. </p>
      <p>It's more subtle in the case of the N since it's a diagonal, so you can get away with not doing it, especially if the face is very geometric. (Sometimes you have no choice, if the corners of the N are pointed, for instance.)</p>
