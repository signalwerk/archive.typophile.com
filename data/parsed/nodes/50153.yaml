      <p>&gt; Why are you not in favor of “faithful revivals”</p>
      <p>One reason is that any person has <em>something</em> to contribute*, plus it's impossible to remain totally faithful to somebody else's original intent** anyway, so why not make a clean break? Another reason is that today is not yesterday, and today's users cannot fully benefit from something that worked (and we're really just guessing that it did) in the past. For example we might mostly agree that that "G" is too ugly, but it's possible that back in that time, in that environment, it was just dandy.</p>
      <p>* Although there should be severe limits on self-expression in type, especially text type (essentially making expression happen naturally, in a way in spite of yourself, as opposed to pushing it out) the fact that it is always there means we should see it as a good thing.</p>
      <p>** In fact a designer's intent typically changes over the course of the design! So which intent are you going to revive?  :-)</p>
      <p>Instead of seeing literal revivals as respecting the dead original designer, I see non-literal revivals as respecting the living users.</p>
      <p>&gt; I have long ago given up the idea that “cool, if you have the b, you can make the dpq in 2 seconds”</p>
      <p>Good! Some people remain stuck on that (in different dimensions, often the dimension of chirography, where the bowls of those letters are make too similar) for years, or even their entire careers.</p>
      <p>&gt; I guess it’s time I forgot about the copy paste concept altogether</p>
      <p>Well, it depends on the design. Copy-paste isn't totally useless, it's just a dangerous tool to be used carefully.</p>
      <p>hhp</p>
