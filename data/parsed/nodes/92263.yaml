    html: |-
      <p>I concur: lack of comment here about a particular typeface/font does not indicate hatred of it; merely apathy toward it.</p>
      <p>But what you've got there is clearly a Display font with a lot of personality. Hey, I like <a href="http://www.fontsquirrel.com/fonts/Daniel" title="http://www.fontsquirrel.com/fonts/Daniel">http://www.fontsquirrel.com/fonts/Daniel</a>. And for somethings, I like <a href="http://www.fontsquirrel.com/fonts/open-sans" title="http://www.fontsquirrel.com/fonts/open-sans">http://www.fontsquirrel.com/fonts/open-sans</a>. Neither typeface gets a lot of discussion here, and I get that. They are not to everyone's taste.</p>
      <p>And, many people here (as they are type designers themselves) have highly-developed tastes, experienced eyes, and have spent a lot of time thinking about bezier curves and things that you and I are hundreds of man-hours away from being able to compare ourselves to.</p>
      <p>Don't worry about whether or not your pet typeface is a hot favorite among type designers. Go create something that looks awesome (to you) in it. Go design something for which careful, tasteful use of your pet typeface solves the design challenge perfectly. If it works, it will work. If it doesn't, learn something from that.</p>
    html_clean: |-
