      <p>It certainly does express a lot of excitement, and it's very eye-catching. I mean that in the literal sense, use this font surrounded by a lot of other fonts and graphic design (such as on the web) and it captures ones eyes.  In fact this is how I first noticed Badaboom. It was used in one of those run-of-the-mill ads like "you may have already won!" Now, I usually tend to never look at ads, certainly not one as lame (font selection aside) as this ad was.  But every time I came back to the page, my eye kept wandering over to it, and I could feel its sense of excitement.  So excited! Maybe I DID WIN SOMETHING?! (I never clicked on the ad to find out).</p>
      <p>hrant, I wonder if you dislike all types close to this (excited ultra-bold brush sans, lets call it) or just this one in particular.  Complete fail? Really?</p>
