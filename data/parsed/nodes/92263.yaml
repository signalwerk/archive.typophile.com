    <p>Can't seem to find much information on Bada Boom here on Typophile. </p>
    <p> I like this font.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bada_5782.png"></div><p></p>
    <p>Without a doubt, it is the 'o' that takes this font from simple brush, to brilliance.<br>
    The evenness of the counter's tops and bottoms, don't hurt either.  And look at that crazy 's,' is it's baseline at 30 degrees? So much excitement packed to into yet very simple lines.</p>
