    html: |-
      <p>Thanks, yaneczech, for your comments on the serifs. This point has been addressed numerous times since I started working on the font and I believe it is a characteristic, a style of this typeface that I don’t want to homogenise too much. I don’t intend to mimic Sabon and other Garamonds, I want to create a modern one, more minimalist and reducing serifs to a minimum. My origin with this design, the starting point, was the idea to have as little and minimal down- or up-pointing serifs as possible. The endings of E, F middle strokes were just enforced, they don’t have serifs for this reason. I improved the down- and up-pointing serifs while working on the font, but because it is meant for screen reading, I don’t want to accentuate them more.</p>
      <p>The weight or volume of the top terminals of C, G and S have been slightly increased, following elian’s advice, but the length of the serif has not been changed.</p>
      <p>As for the lowercase r, did you look at it in the word ‘Theory’ or in the alphabet? The combination “ry” is a ligature in ‘Theory’.</p>
