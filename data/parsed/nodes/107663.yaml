    <p>I’d like to introduce you to my new typeface, Theory Serif. If all goes as planned, this will be the foundation to a Serif, a Sans and a Monospace family.</p>
    <p>With the revival of long-form journalism on the Web and on mobile devices, I wanted to create a typeface that provides a pleasant and streamlined reading experience on screen.</p>
    <p>This is work in progress, but now I feel the Regular version of the font is ready for the public. Please feel free to criticize and share your ideas.</p>
