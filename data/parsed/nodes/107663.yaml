    html: |-
      <p>Actually, my point was in unifying of serifs to keep more shape consistency, not to copy other styles. For me there are two different serif types. For instance your /i/ letter has relatively distinctive serifs, both top and bottom. On the other hand, the /s/ letter has rather triangular serifs – the connection is much more smooth, at least in smaller sizes it appears so, and they lack of spurs (unlike /z/, /T/, /E/...).<br>
      The /r/ letter is problematic because of its empty space underneath the terminal. To make it more balanced and legible I would suggest to enlarge the terminal a bit (and maybe moving the connection to stem slightly down). To that /r_y/ ligature: I'm not sure if it is necessary to create ligatures for these cases. I think it would be better to make one version, something like an average of the original /r/ and that one from the ligature.<br>
      Have you tried the typeface with different rasterizers in small sizes already? (e.g. in Photoshop)<br>
      Otherwise it looks nice, I like /N/ and /eszett/. :)</p>
  - id: 567936
    user: 181047
    date: 2013-12-19T08:40:00
    date_raw: 19 Dec 2013 — 8:40am
    votes: null
    html: |-
      <p>Yes, Jan, I have tried it in different sizes. I appreciate your detailed explanations and recommendations. </p>
      <p>To explain my conceptual (and visual) idea, I think of the serifs as two dimensions:  – |</p>
      <p>Because this typeface was designed for screen first, I tried to shave off as much as possible from the vertical serifs in every instance, so this would affect the glyphs C, G, F, E, S, etc. in the uppercase range and c, s, etc. in the lowercase range. I then “worked my way up” steadily expanding these serifs to the point where I felt “this is just enough”, trying to avoid to make them more distinct. This is of course tricky, because such details are important character influences. I think there are three serif types in Theory Serif, because the curved terminals are different than the ones in the lowercase i, but they are consistent throughout all curved terminals throughout the font.</p>
      <p>There was also a weight problem: terminals with no distinctive vertical serif looked too light, the glyph was unbalanced. So adding weight (broadening the respective serifs) helped, and that is easier with curved letters, like the upper terminal of c, s, etc.</p>
      <p>As for the lowercase r—I had changed the flag to be a match with the flag in the lowercase f. This was on recommendation of Claus Eggers Sørensen and Vernon Adams. I quite like it now and if I bend it down a little (to make it more distinctive, as you write) I need to change its unique shape. I found this an elegant solution that renders nicely on screen.</p>
      <p>Given your advice, I have already visited the shapes of E, F, C, G, S, and let the serifs end on the same height level. I adjusted their weight as well for the reasons I just laid out.</p>
