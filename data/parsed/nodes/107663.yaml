      <p>MDrucker, Eben Sorkin’s Merriweather has quite a different character and glyph proportions. There are also differences in details, like the closing stroke in shapes of a, d, p, b, etc. Look at how the incoming stroke meets the main stem in the lowercase a (bottom curve). The main characteristic of Theory Serif is probably the proportion of the glyphs, which tends to be wide, like with Sabon or Plantin.</p>
      <p>I am not sure if I can complete everything I had in mind, but my plans include a complete Serif family, a Sans Serif family as well as a Monospace family. The Serif would include Regular, Italic, Bold and Bold Italic, but the Sans and Monospace families would additionally include Medium, Black and Light versions.</p>
      <p>It is likely that I’ll make Theory Serif Regular and Italic available under Google fonts, the bold versions can be licensed commercially. The same could be done with other families of the series.</p>
