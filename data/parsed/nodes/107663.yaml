      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Specimen-Theory-Serif-14-02-07-850px_6153.png"></div><p></p>
      <p>Development of the Regular cut of Theory Serif is close to completion. I am currently working on accents and glyphs in Greek and other languages.</p>
      <p>The typeface has seen a complete redesign of most characters, particularly the serifs, with glyph width, stroke width, all numbers have been redesigned and more kerning pairs were added (including numbers, punctuation and space kerning).</p>
      <p>There has been extensive testing with screen reading in various resolutions. I am using ReadKit (a Mac RSS reader app) to do most of the testing. This typeface was primarily designed for on-screen reading. You can always see the font in action on my website (<a href="http://core-ux.com" title="http://core-ux.com">http://core-ux.com</a>). It’s the body font throughout the site.</p>
      <p>The next step will be the design of an Italic cut, which will probably take another couple of months, followed by bold versions. When all four are completed, I may add old style figures, but I first have to learn how to add them as an Open Type choice within the same font.</p>
