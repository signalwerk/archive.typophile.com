    html: |-
      <p>Eliason, thanks for your comments. The typeface was optimized for the screen experience as text, not necessarily as titles. This means I made concessions and adjustments based on the impression in small sizes (a pixel height that gives an impression of what would be 10 to 14 points in print). I am considering a Display version, but if I would make one, it would be at the far end of the project.</p>
      <p>I thought the glyph N was roughly within roman Antiqua proportions, but it seems a tad too wide. The left shoulder has been deliberately designed differently than the M shoulders, for better rendering in small sizes. </p>
      <p>I went with a classic dollar sign instead of removing the inner lines, as some recent typeface designs have introduced. I’ll revisit the dollar sign’s look, especially in small sizes.</p>
      <p>I will revisit the lowercase g as well. I liked the slightly oval upper bowl and expanding it to the top will probably make it rounder. I’ll see how that goes.</p>
