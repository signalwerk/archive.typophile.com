      <p>I think you really need more weight in the /r/ terminal, the /T/ has too short unilateral serifs at sides of the bar, serifs at /s/, /S/, /z/, /Z/, /c/, /C/, /G/ and right serifs at /E/, /F/ would need some xtra volume (lenght) too (as eliason wrote). I would recommend to make the right side of the bottom serif longer at /F/, /P/,/f/ and /r/ to add more visual stability to the letters. And the swash at /Q/ could be a little thicker, at least in comparison with the /f/ terminal.</p>
