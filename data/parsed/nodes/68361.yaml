    <p>Hi,</p>
    <p>I'm just a high school student that needs a few fonts for everyday use, and I've developed a particular liking for Futura. </p>
    <p>Unfortunately as a student, I obviously cannot afford the whole family and I'll probably  buy just one weight. I've narrowed it down between Futura Book and Futura Medium, both in the URW++ variant as it is the cheapest:<br><a href="http://new.myfonts.com/fonts/urw/futura/t-book/">http://new.myfonts.com/fonts/urw/futura/t-book/</a><br><a href="http://new.myfonts.com/fonts/urw/futura/t-medium/">http://new.myfonts.com/fonts/urw/futura/t-medium/</a></p>
    <p>So I just need some help choosing between the two. The two are similar, though I'm pretty undecided over which one of the two to get. My emotional response is pretty much identical between the two weights. It's going to be for things such as various school projects(posters,etc.),headings for papers,etc. No commercial work or any of that stuff. </p>
    <p>Any thoughts? </p>
    <p>Thanks,<br>
    James</p>
