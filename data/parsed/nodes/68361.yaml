    html: <p>If you go for the book weight, consider buying <a href="http://www.fontshop.com/fonts/singles/elsnerflake/futura_book_text_pro_ot/?&amp;sample_text=efficient&amp;sample_size=96&amp;update=0">Futura Book Text Pro</a>. It contains old-style figures, some nice ligatures and <a href="http://www.100besteschriften.de/bilder/005/Futura_Muster_web.png">alternate forms</a> from the original metal Futura for several letters. Unfortunately, it is much more expensive than the URW version ($20 vs. $80).</p>
