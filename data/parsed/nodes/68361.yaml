    html: |-
      <p>I would suggest Book.<br>
      You can use it for text, and at large sizes for display.<br>
      However, Medium is too strong for sustained text.<br>
      The all-cap setting of the Book is very classical, it has a style that can suit many different subjects.<br>
      The Book is also the original weight of the typeface, and embodies the principle behind it in its purest form.</p>
