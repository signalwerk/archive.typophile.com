  html: <p>Please excuse me for interrrupting the <br>fascinating helvetica debate, but I have a  <br>question. I am a student in New Zealand, <br>and we have been charged with a brief -  <br>to brand NZ. I am, naturally, taking a typogra- <br>phic approach. I woner if any of you typophiles <br>have been to NZ, or know any thing about it? <br>If so, what strikes you as being quintessent- <br>ially kiwi typefaces? Thank you, keep up the  <br>debate. (We students learn quite a lot from <br>these ramblings)</p>
