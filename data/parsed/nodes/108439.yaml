    <p>Hello!</p>
    <p>I came across with some letters that were draw in some old typeface design software.<br>
    Does anyone here recognize this software and how it did work?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bv_5133.jpg"></div><p></p>
