    html: "<p>Better than “what looks right” is to do “what <em>reads</em> right”. Typesetting is really all about producing text you can read and comprehend without distraction. If you don’t read and care about the content you’re setting you’re much less likely to set it well. So, experiment: try various settings using various texts (that you aren’t already familiar with) and see what you read most comfortably.</p>"
