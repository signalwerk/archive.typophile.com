      <p>1. Line length, or 'measure', is not a 'perhaps' but a critical variable.</p>
      <p>2. Generally, some recommend more leading for sans serifs, and I personally think this is right. </p>
      <p>3. How loosely or tightly the letter and word spacing is also has an effect. </p>
      <p>Generally, there are too many variables and with computers and laser printers it is easy to test different samples. So I agree with Stephen. Just test it. </p>
      <p>Oh, and leading is a critical factor in readablity, so all the more reason to test it in each case.</p>
