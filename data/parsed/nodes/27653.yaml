    html: |-
      <p>Perhaps there's a reasonable formula we could generate through collaboration, however, that gives a fair approximation...<br>
      something that takes into account:<br>
         * font size in points (<em>S</em>)<br>
         * x-height (<em>x</em>)<br>
         * cap height (<em>c</em>)<br>
         * ascender length above cap height (<em>a</em>)<br>
         * descender length below baseline (<em>d</em>)<br>
         * and perhaps even line length (<em>L</em>)</p>
      <p>Are there any other math fiends out there who also want to give this a whirl?</p>
      <p>I'm imagining an equation that allows:<br>
         * leading is proportional to <em>a</em>, <em>d</em>, &amp; <em>L</em><br>
           <em>(meaning fonts with longer ascenders &amp; descenders and longer line lengths require more leading)</em><br>
         * leading is inversely proportional to <em>S</em>, <em>x</em>, &amp; <em>c</em><br>
           <em>(meaning fonts with larger point sizes, x-heights, &amp; cap heights require less leading)</em></p>
      <p>To get started, let's establish some good target values. For example, what should the suggested leading be for:<br>
      <em>Adobe Garamond</em><br>
         * at 8-point with 52 chars/line?<br>
         * at 10-point with 52 chars/line?<br>
         * at 12-point with 52 chars/line?<br>
         * at 8-point with 26 chars/line?<br>
         * at 10-point with 26 chars/line?<br>
         * at 12-point with 26 chars/line?<br>
      <em>Gill Sans</em><br>
         * at 8-point with 52 chars/line?<br>
         * at 10-point with 52 chars/line?<br>
         * at 12-point with 52 chars/line?<br>
         * at 8-point with 26 chars/line?<br>
         * at 10-point with 26 chars/line?<br>
         * at 12-point with 26 chars/line?</p>
      <p>Ouch, my nerdliness is REALLY showing.</p>
      <p>--Michael.</p>
      <p>------------------------------------------------------<br>
      // love what you do or do something else. //<br>
      Michael Ebert -- graphic designer, jazz saxophonist, horror movie devotee<br>
      ------------------------------------------------------</p>
