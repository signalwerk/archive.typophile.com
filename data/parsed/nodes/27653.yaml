      <p>Damned network security, I had to rewrite this post.</p>
      <p>I find it hard to get a working formula for leading because there are some factors that can't be accounted in it such as aesthetic preferences or design needs. Also we have to consider the specific typeface's rythm and weight (for example didones requiring greater leading than garaldes) and also letterspacing as William pointed.</p>
