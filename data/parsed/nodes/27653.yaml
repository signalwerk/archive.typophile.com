      <p>Language should affect leading.</p>
      <p>In German all nouns are capitalised, and I think “k” is more common than “c”. This means there are more tall letters, so the leading should be greater.</p>
      <p>In Latin literature as printed nowadays, capitals are usually only used for proper nouns, not for new sentences (which may mean extra space between sentences); “k” is very rare. There are fewer tall letters, so less leading is needed.</p>
