    html: |-
      <p>Hi Billy</p>
      <p>Stephen's right. There ain't no magic number.</p>
      <p>The closest you might come to a pre-set formula is the (factory set) default value for auto leading in Adobe InDesign and Quark XPress – 120% of the type size. In other words if you set 10pt type the leading will measure 12pt from baseline to baseline. That's only two points extra to the body size – almost certainly too tight for sans serif faces, and not necessarily ideal for the majority of the serif faces either; I advise my students NOT to use auto leading.</p>
