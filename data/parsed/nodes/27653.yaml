      <p>While a formula (a mathematical one) isn't a solution, a method should exist. I'm sure that most of you have a method that you use in order to find the best leading. „It has to look right.” Of course, but what does right look like. What should you look for? I would really appreciate if someone took the time to describe a method like this and really exemplify how the leading should be modified on different criteria. How to achieve that balance between the lines of letters and the lines of space.</p>
      <p>There are guidelines that tell you to have the linespace grater than the wordspace, but not having it too big or the lines will fall apart. But how does this translate in relation to the inner spacing and such? When is the leading too small? When is it to big? I would like to be able to answer these questions just by looking at the way that the different spacings relate to one another, but I don't know how to check this.</p>
