    html: <p>I'd stay away from the 120% formula. There's no way that anyone can depend on a set formula, even if it "works" some of the times. X-heights, ascenders, descenders, style of the typeface, weight of the typeface, and the personality of the typeface are all factors. The secret is optical adjusting.</p>
