      <p>Something else affects leading. Suppose you have a paragraph of block capitals.</p>
      <p>If it is a copy of a Latin inscription you want to make it as easy to read as possible. The language is not the first language of the reader. This may mean generous leading.</p>
      <p>If it is an end user licence agreement, the object is to make it unpleasant to read without being illegible, so that the end user clicks the “I have read the EULA and agree to it” button without having read it.</p>
