      <p>It's certainly true that 120% is not going to be always right. However, maybe the poster was never going to use any other typeface but Times Roman, in which case a simple number, whether it was 120% or not, <em>would</em> work.</p>
      <p>Could one generate a magic formula if one knew the x-height of the typeface in question, in addition to its point size?</p>
      <p>I don't see why not. It still wouldn't yield perfect results in all circumstances, but as a rule-of-thumb for a first cut at typical body copy, with all the usual qualifications, it might work.</p>
      <p>I suppose the idea would be that Caslon and Jenson don't need leading, and other typefaces need as much leading as makes up for the missing height in their ascenders and descenders.</p>
      <p>However, if the x-height is given as a ratio between x-height and cap height, you still need the ratio between cap height and point size.</p>
