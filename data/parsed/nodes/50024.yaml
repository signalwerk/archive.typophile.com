      <p>Hi,</p>
      <p>Don’t spark and ignite mean more or less the same thing here? Creativity has only one e.</p>
      <p>Not sure about the colours – they’re fairly low-contrast on white.</p>
      <p>I don’t think it says ’revelation’. In fact it looks more like revolution.</p>
      <p>A revelation is an unveiling, an exceptional disclosure even. I don’t think your mark reflects this.</p>
      <p>Cheers,<br>
      Ross</p>
