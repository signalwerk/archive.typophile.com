    <p>Hi, My first post. This is a new idea and personal project I’m working on for a designers creative resource. I’m really not good at designing for myself and get in a rut after a while trying. This web site will include podcast, articles, tutorials or anything to inspire other designers. Also what do you think of this idea, do we really need another website out there? Is this different enough? Honest feedback wanted here on the brand, colors and look please. Feel free to tear into this one if you see issues. Thank you in advance for your constructive criticism.</p>
    <p>Kind Regards</p>
    <p>DA</p>
    <p><a href="http://geocities.com/lyletrush2001/creative-revelation-logo.jpg" title="http://geocities.com/lyletrush2001/creative-revelation-logo.jpg">http://geocities.com/lyletrush2001/creative-revelation-logo.jpg</a></p>
    <p>P.S. I was trying to embed the image inside the source of the HTML here but I could not. I’m not much of html or coder person.</p>
