    html: |-
      <p>Maybe it is the colours or the names but this has a religious feel. I cannot see the point of the little flick on the v – it affects the kerning of iv, perhaps you will need to kern out the other characters, which might work with the tracking on Revelation, the split-C really reminds me of something I cannot bring to mind at the moment, but, especially with the gradient, it renders the C less legible.</p>
      <p>I am afraid that the second iteration is a step back from the first. Personally in this situation (designing for designers) I default to as simple as possible – no icon, simple type, simple alignment, single colour – as basic as basic gets, but getting the choice of typeface and the kerning spot on.</p>
      <p>Tim</p>
