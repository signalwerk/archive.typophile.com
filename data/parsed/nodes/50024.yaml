      <p>If this is a project is something you are determined to pursue further, then I highly recommend looking at what else is already out there. Your website will need to fill a need that isn’t already available (or at least percieved as not already available). To simply offer similar things that another website successfully provides will fail to generate sustained interest in your website. </p>
      <p>———————————-<br>
      Michael Browers<br>
