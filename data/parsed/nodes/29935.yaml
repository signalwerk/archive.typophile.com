    html: |-
      <p>Nicholas,<br>
      Is it ever okay to mix two serifs? Yes.<br>
      Can it be done without some consideration? No.</p>
      <p>The contrast is hard to take in given the size differences. It will take someone with better eyes to tell you if they’re working or not, but I can give you a bit of hope. For every rule concerning what can &amp; can’t or should &amp; shouldn’t be done with type, there are many exceptions. If you’re interested and haven’t already been through it, Bringhurst has a chapter on choosing &amp; combining typefaces in <em>The Elements of Typographic Style</em>. In the forward to the book, RB writes “By all means break the rules, and break them beautifully, deliberately, and well. That is one of the ends for which they exist.” </p>
      <p>What is the font size for your body text by the way? Could just be my display or perhaps I’m just getting tired, but it’s pushing the limits of legibility on my screen.</p>
