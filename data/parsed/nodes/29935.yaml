    <p>G’day people, </p>
    <p>I’m desiging a layout for a textbook-type work and I want to use two serifs in the opening chapter pages (Janson text for body and Linotype Centennial for heads) for me it seems OK because the head and the body have a lot of space B/W them, for the intextheads I’m considering meta so there isn’t that clash. What are your thoughts? Is it ever OK to mix serifs in this way, what do you think of my font-choice?<br>
    cheers</p>
    <p>—N</p>
