    html: |-
      <p>In a simple text editor, declare the liga feature in aalt:</p>
      <p><code>feature aalt{<br>
        feature liga;<br>
      } aalt;</code></p>
      <p>Then program the ligatures thus:</p>
      <p><code>feature liga {<br>
      # Latin<br>
          sub f i by fi;<br>
          sub f l by fl;<br>
          sub X X by XX;<br>
          etc.<br>
      } liga;</code></p>
      <p>Then, SAVE AS your_file_name.fea. In FOG5, navigate to Element &gt; Font Info &gt; Encoding, then select the radio button for an external feature file, and browse for and select your feature file.</p>
