      <p><cite>I know the answer is in Robofab or Python…</cite></p>
      <p>Nick’s answer is correct, but just to elaborate, character substitution is done with OpenType features. Robofab and Python are used to automate font design tasks; they don’t actually introduce any code into a font.</p>
  - id: 450233
    user: 1133
    date: 2011-02-02T09:16:00
    date_raw: 2 Feb 2011 — 9:16am
    votes: null
    html: |-
      <p>Also, I'll mention that recommended glyph names for ligatures are "f_l", "f_i", "f_f", "s_t", "f_adieresis" etc. </p>
      <p>So your code would look like</p>
      <p><code>feature liga {<br>
      # Latin<br>
      sub f i by f_i;<br>
      sub f l by f_l;<br>
      sub f f by f_f;<br>
      sub s t by s_t;<br>
      # etc.<br>
      } liga;</code></p>
      <p>(after "sub" you type in sequences of glyph names that should be replaced, after "by" you type in the glyph name that is inserted).</p>
      <p>A.</p>
