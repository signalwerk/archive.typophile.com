    html: |-
      <p>Dunwich/James, </p>
      <p>it's VFB, so it can — but since FOG doesn't have any UI for displaying the font features, the code won't be visible/accessible. </p>
      <p>I do recommend installing the demo version of FontLab Studio along Fontographer 5. The demo version of FL Studio is free, and serves as an excellent in-depth font viewer. If you open an OpenType font in the FontLab Studio demo, you can export the font feature definitions from the OpenType panel into a .fea text file, edit it in a text editor and then use it in FOG 5 when generating the font. </p>
      <p>FontLab Studio 5 can only export font feature definitions in the older AFDKO 1.6 syntax. If you want to export font feature definitions including things like mark attachment, ie. in the AFDKO 2.5 syntax, you need to use a different tool, such as DTL OTMaster, which is also available from fontlab.com. </p>
      <p>Best,<br>
      Adam</p>
