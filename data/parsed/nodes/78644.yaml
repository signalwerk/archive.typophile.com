    html: |-
      <p><cite>The glyphnames for the ligatures should be EXACTLY the same as those entered in your feature file.</cite></p>
      <p>Exactly. So, if your glyph in the font is named fi, it will have to be so named in the feature file.</p>
      <p>Better to change the name to f_i in the font -- and of course, use f_i in the feature file (as Adam suggested). The "fi" glyph hangs around in some fonts, and is in Unicode, to accommodate legacy issues. Sort of like corsets . . .</p>
