    <p>Hi all,<br>
    First off, I have zero experience with coding and syntax for proper output.</p>
    <p>I have just finished a typeface with the usual ligatures (fl, fi, ffl, ffi, even st &amp; ct) and I want to make the ligatures automatic instead of being forced to navigate to the glyphs palette and manually apply ligatures.</p>
    <p>I know the answer is in Robofab or Python but I do not have any experience with them and can't find a decent walk-through in the context of type design, specifically ligatures (since Python does all sorts of applications, type design being one).</p>
    <p>Is there not a standard snippet of code that applies to all typefaces that automates the ligatures? "when U+0066 &amp; U+0066 appear consecutively with U+FB00"?<br>
    I presume not.</p>
    <p>Also, I use Fontographer 5.</p>
    <p>Thanks in advance.</p>
