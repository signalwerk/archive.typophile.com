    html: "<p>Be careful about tracking: different apps use different units for tracking. Notoriously, Quark tracking is in some terribly coarse units like 1/200 of an em, while Adobe's is more like 1/1000 of an em. <br> <br>Specifying % of em is quite a good idea, if this is what your British standard intends, but only so long as you know what units your application is using. 10% of the em is going to be a different value in Quark than it is in Adobe apps, but if you know the unit used you can calculate the value from the x% em specification. <br> <br>That's just my guess though. Can you contact the authors of the document for clarification?</p>"
    html_clean: "<p>Be careful about tracking: different apps use different units for tracking. Notoriously, Quark tracking is in some terribly coarse units like 1/200 of an em, while Adobe's is more like 1/1000 of an em. <br> <br>Specifying % of em is quite a good idea, if this is what your British standard intends, but only so long as you know what units your application is using. 10% of the em is going to be a different value in Quark than it is in Adobe apps, but if you know the unit used you can calculate the value from the x% em specification. <br> <br>That's just my guess though. Can you contact the authors of the document for clarification?</p>"
