  html: "<p>Working with some standards developed by a firm in Britain. <br> <br>All over the place they refer to some percentage and \"em Kerning\". This is not only in headlines but also body text and caption areas where they specify the standard as such: (albeit 10 million different variations for different applications and all with an reference to \"em Kerning\") <br> <br>\"Stone Sans 14pt, Left Justified 10% em Kerning.\" <br> <br>I'm only guessing that \"em Kerning\" is an English term for tracking?...but percentages? I'm confused. <br> <br>Thanks in advance  <br></p>"
