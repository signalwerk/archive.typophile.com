    votes: null
    html: <p>Ah, I remember c/p charts and haberules. I was fortunate to have a younger brother who operated a Compugraphic at the local typesetters, and I would call him up and say, "Could you reset that job 10 on 11 instead and bring it home with you?" <br> <br>Tanya, computers mostly just make it different, not always easier. The computer transferred so much more control to the designer. But with that came a whole lot more responsibility -- which many designers didn't/don't recognize, and consequently a lot of subtlety and quality was lost in the transition. It seems now, also, that often the technology dictates the design rather than the other way around. <br> <br>That said, I'm grateful for the computer. But I'm also grateful to have learned design without one. <br> <br>-- Kent. <br></p>
