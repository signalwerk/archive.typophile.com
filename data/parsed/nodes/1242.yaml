    html: <p>Tanya -- <br> <br>I'm not a Brit. But I am in agreement with the others. The "em" here goes with the 10%, not with the "kerning". The instructions are asking for kerning in the amount of 10% em. An em is, of course, a relative value equal to the point size of the type in question. <br> <br>As John points out, different applications use different size units for measuring kerning/tracking. In Quark, the smallest unit is indeed 1/200th of an em. In InDesign, it is 1/1000th of an em. So in Quark, 10% em would be 20 units; whereas in InDesign, it would be 100 units. <br> <br>These days the terms "kerning" and "tracking" are often used interchangeably. I've always considered them separate, though similar, adjustments. Kerning is fit adjustment between specific individual pairs. Tracking is set-width adjustment over a range of glyphs -- global kerning, if you will.  <br> <br>It may just be me, but I've always considered the default direction of kerning/tracking to be negative, so in the absence of a specification like "positive" kerning, my interpretation is to close up the space. <br> <br></p>
    html_clean: <p>Tanya -- <br> <br>I'm not a Brit. But I am in agreement with the others. The "em" here goes with the 10%, not with the "kerning". The instructions are asking for kerning in the amount of 10% em. An em is, of course, a relative value equal to the point size of the type in question. <br> <br>As John points out, different applications use different size units for measuring kerning/tracking. In Quark, the smallest unit is indeed 1/200th of an em. In InDesign, it is 1/1000th of an em. So in Quark, 10% em would be 20 units; whereas in InDesign, it would be 100 units. <br> <br>These days the terms "kerning" and "tracking" are often used interchangeably. I've always considered them separate, though similar, adjustments. Kerning is fit adjustment between specific individual pairs. Tracking is set-width adjustment over a range of glyphs -- global kerning, if you will.  <br> <br>It may just be me, but I've always considered the default direction of kerning/tracking to be negative, so in the absence of a specification like "positive" kerning, my interpretation is to close up the space. <br> <br></p>
