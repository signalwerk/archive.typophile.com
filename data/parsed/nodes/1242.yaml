    html: <p>Nathan's got it. It's all relative. <br> <br>When you type in 20 for tracking in Quark, you're indicating 20/200ths of an em (which is the same thing as 10% -- 20 divided by 200, right?). The actual physical value of this will change depending upon the point size of the type that has been tracked. If the type is 14 point, then the net effect will be to track it open by 1.4 pts. But if you change the type size to 24 points, the physical value of your 10% tracking will change to 2.4 points. But it's still 10% of an em. <br> <br>BTW, this is all regardless of what units you have your application set to work in -- points, ciceros, millimeters. It doesn't matter. An em is a relative measure. And the tracking is specified in fractions of an em.  <br> <br>-- K. <br> <br></p>
    html_clean: <p>Nathan's got it. It's all relative. <br> <br>When you type in 20 for tracking in Quark, you're indicating 20/200ths of an em (which is the same thing as 10% -- 20 divided by 200, right?). The actual physical value of this will change depending upon the point size of the type that has been tracked. If the type is 14 point, then the net effect will be to track it open by 1.4 pts. But if you change the type size to 24 points, the physical value of your 10% tracking will change to 2.4 points. But it's still 10% of an em. <br> <br>BTW, this is all regardless of what units you have your application set to work in -- points, ciceros, millimeters. It doesn't matter. An em is a relative measure. And the tracking is specified in fractions of an em.  <br> <br>-- K. <br> <br></p>
