    html: <p>well yes, in school we learned to draw faces to scale by hand, failed if our bowls were inconsistent, layed out columns of dummy copy by hand and then was told that the fictional "art director" changed his mind and wanted .5in gutter during the last half hour of class. all the while teased with the g3's sitting over on the other side of the room.   <br> <br>I do know and have respect for the ol days, still it seems that sometimes computers confuse the art more then it helps.</p>
