    <p>This is a friendly reminder.</p>
    <p>The early bird discount for submitting your type designs to the Letter.2 competition ends on June 20. Only 12 days to go.<br>
    Visit <a href="http://www.letter2.org" title="www.letter2.org">www.letter2.org</a> to find out more about the competition rules and register to submit your entries.</p>
    <p>About Letter.2<br>
    Letter.2 aims to provide a wide-angled snapshot of the state of typeface design around the globe ten years after the 2001 competition, and to promote typographic excellence and best professional practices. It also intends to raise awareness about the role of typography at encouraging and maintaining cultural diversity.</p>
    <p>All typefaces published (commercially or non-commercially) between October 2001 and August 2011 are allowed to enter the competition. The jury will meet in Buenos Aires in October 2011 and will make a selection of winning entries based on their design excellence. The winning designs will be exhibited at the 2012 ATypI conference</p>
    <p>Kind regards,<br>
    José Scaglione</p>
