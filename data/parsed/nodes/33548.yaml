  html: |-
    <p>Hello typophiles,</p>
    <p>this is the first 'rough cut' of my first attempt at type design. I want to learn about letterforms and spacing, and also want to be able to use a typeface i've designed myself. I've been reading Karen Cheng's book on type design and looking at a few well-designed faces for guidance on the 'rules' (where strokes should taper, placement of letterform features etc.). </p>
    <p>It's still early days and as i'm sure you'll see immediately that there's heaps of work left to do. What I was hoping for were some of your opinions on, and some criticism of, how the face works generally. Does it lack character? Is it too similar to existing designs? Are there letters that don't fit?</p>
    <p>It's here as a <a href="https://web.archive.org/web/20150123095732/http://www.chrisgaul.net/fonttest3.jpg" rel="nofollow">.jpg</a> or as a <a href="https://web.archive.org/web/20150123095732/http://www.chrisgaul.net/fonttest3.pdf" rel="nofollow">.pdf</a>.</p>
    <p>Thanks in advance,</p>
    <p>Chris</p>
