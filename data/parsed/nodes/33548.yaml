    html: |-
      <p>This is great as a learning exercise, but not as something people would want to use because it's too bland (without being technically brilliant). Work in your own ideas of what the letters "should" be, but subtly. The way to develop your own ideas is to observe, think and try.</p>
      <p>The most obvious thing that's wrong with it is that the caps are too big. Also, most of the curves are very wobbly, the curves are not thick enough compared to the straights, and the spacing is too loose. The "R" is nice though.</p>
      <p>hhp</p>
