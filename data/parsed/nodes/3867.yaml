    html: <p>i was a bit thrown off because it was so rounded... but i guess you enlarged it from <br><a href="http://www.tacojohns.com/" target="_top">http://www.tacojohns.com/</a> ? <br>the E is bit different in the top. weird. <br>it must be Belwe, and like Scoles said, the W is fixed up. and if you look closely at tacojohns.com, the white space to the right in the W is too big... which implies that they simply removed the little flag thing and put a serif there.</p>
