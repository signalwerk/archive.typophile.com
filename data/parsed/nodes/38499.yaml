    <p>This is a school project for an introductory type course. These are the rough logos for Quantum skateboard bearings. The logo should reflect the technological breakthroughs in bearing design that my pseudo company is making. The one on the left has some centering problems, but i am still happier with that one. I like the concept of the one on the right, but somethings off. Critiques PLEASE PLEASE PLEASE.</p>
