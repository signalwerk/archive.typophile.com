      <p>The “um” ligature does not work for me at all.</p>
      <p>I like the mark on the left, although something seems off in the centre. Maybe it’s the way the white circle is just “punched out” of the ’q’s. I’d like to see something that flows a little nicer in the centre of the symbol.</p>
      <p>I’d also make the type in the left logo much larger - it looks too small in proportion to the darkness of the mark. Maybe bring the mark down to the left of the type.</p>
      <p>Watch your curves in the right-hand logo where the base of the ’q’ becomes the ’b’.</p>
      <p> - Lex</p>
