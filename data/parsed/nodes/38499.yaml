    html: |-
      <p>In the left mark you’ve got a q form that looks much more like a 6 or a 9. Also, repeating and rotating a character has been done so often, that it looks like an obvious and uninteresting choice. (Sure, you could talk me into a bearing company being the most logical company where you could pursue that... but here it’s lost its spark.)</p>
      <p>In the right mark, you’ve got a letterform with a traditional cut (the cuts where the circlular shape meets the stem of the q) mashed up with a modern cut (a b with a very uniform bowl). That’s why it’s not working, in addition to the other reason mentioned. Despite the problems, I think the one on the right has more potential to be interesting, because of its asymmetry. Just decide if it’s going to lose or hang on to recognizable and traditional letter shapes or whether it’s going to be more modern. </p>
      <p>And Ratbaggy, you have the coolest avatar icon I’ve seen in a long time. Nice.</p>
    html_clean: |-
