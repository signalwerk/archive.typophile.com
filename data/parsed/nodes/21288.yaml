    <p>So a friend works for this company and wants to make some spoof t-shirts for an outting some of them are planning. I want to make the logo as accurate as possible, but I can’t seem to figure out the font. The closest I get is Myriad Pro Semibold and Maurea-Medium Caps Lf—but neither of them are it.</p>
    <p>Any ideas?</p>
    <p>(image removed)</p>
