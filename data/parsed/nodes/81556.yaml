  html: |-
    <p>The Type Directors Club is proud to announce, from June 6th to June 10th, the Type Masters Week in New York City. By celebrating 65 years of typographic excellence, the Type Directors Club will be offering the unique opportunity for you to participate in one day workshops with the Masters; Erik Spiekermann, Cyrus Highsmith, Ale Paul, and Luc(as) de Groot.</p>
    <p>One Day Workshops, 8:30am – 4:00pm<br>
    The following workshops will take place at Type Directors Club, 347 West 36th Street, Suite 603, New York, NY 10018.</p>
    <p>What makes a good typeface?<br>
    Erik Spiekermann, Tues. | June 7</p>
    <p>Thinking in Contours<br>
    Cyrus Highsmith, Wed. | June 8</p>
    <p>Lettering for the masses<br>
    Ale Paul, Thurs. | June 9</p>
    <p>Perceiving type — optical mathematics<br>
    Luc(as) de Groot, Fri. | June 10</p>
