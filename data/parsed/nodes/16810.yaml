    html: <p>It’s interesting that the 16th century spelling reformer Trissino proposed three reforms, adding characters to distinguish between u and v, i and j, and short and long o. He printed works demonstrating these reforms, including using the Greek omega for the long o. Two of these innovations were eventually universally adopted by the 17th century. And the other, well, if a butterfly had flapped its wings in Japan ... we might have an omega in the Latin alphabet today. (And no “w”?!)</p>
    html_clean: <p>It’s interesting that the 16th century spelling reformer Trissino proposed three reforms, adding characters to distinguish between u and v, i and j, and short and long o. He printed works demonstrating these reforms, including using the Greek omega for the long o. Two of these innovations were eventually universally adopted by the 17th century. And the other, well, if a butterfly had flapped its wings in Japan ... we might have an omega in the Latin alphabet today. (And no “w”?!)</p>
