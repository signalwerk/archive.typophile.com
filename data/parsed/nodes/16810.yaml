      <p>There are some other problems, too. According to this little animation, the U is a variant of the V, and not the other way around. By the same token, the I shouldn’t slide over to fill the empty slot, but rather a new slot should open for the J.</p>
      <p>And “Some European Additions” to describe the Eth and a handful of accented letters is really simplistic, and seems to indicate that accents are an afterthought, and with no clear date of adoption.</p>
