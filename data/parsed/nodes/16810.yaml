    <p><a href="http://janpeters.net/pics/stuff/alphabet.gif">Nifty animation documenting the evolution of the current Latin alphabet</a></p>
    <p><em>(As seen on other <a href="http://www.boingboing.net/2005/12/12/alphabet_evolution_a.html">blogs</a> and <a href="http://www.designobserver.com/archives/009187.html">design-related sites</a>, but you may have missed it!)</em></p>
    <p>I’m no historian, but I was curious about the accuracy of this thing. Can anyone verify it  (or find mistakes)? If it’s correct, it could be a great teaching tool.</p>
