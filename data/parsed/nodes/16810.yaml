    html: <p>The later stages, showing the moving and introduction of new letters in the Latin script, are quite good. The early Phoenician -&gt; Greek -&gt; Etruscan development is a bit over simplified, but no worse than one finds in most non-specialist books on the alphabet. What is missing is the range of variation in letterforms in the early Greek. And the whole notion of ’Phoenician’ is problematic, since what it really is is an ancient Canaanite alphabet that was used by lots of different semitic peoples and languages. It just happens that the Greeks got it from the Phoenicians, and this has led to the myth that the Phoenicians invented the alphabet.</p>
