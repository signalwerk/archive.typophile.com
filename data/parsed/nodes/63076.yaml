    <p>hi all,</p>
    <p>im working on a brochure for a national ferry company and have been playing around with layouts with the theme of maritme/maps in mind. i still have to nail it but the experiments are quite fun!</p>
    <p>anyways ive chosen frutiger for body text as i think it is clean, simple and clear, but im struggling with the headlines/sub heads. </p>
    <p>can anyone suggest san serif that would be a nice compliment to frutiger?</p>
    <p>thanx in advance.</p>
