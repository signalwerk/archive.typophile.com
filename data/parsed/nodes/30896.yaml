      <p>&gt; <em>Which is the most historically accurate version of Garamond?</em></p>
      <p>The metal one made by Claude Garamond himself, back in the mid-1500s.</p>
      <p>Now if you're looking for a digital version of it, <a href="http://www.adobe.com/type/browser/P/P_1737.html" rel="nofollow">Garamond Premier Pro</a> is by far the best revival of it, in my opinion.</p>
    html_clean: |-
