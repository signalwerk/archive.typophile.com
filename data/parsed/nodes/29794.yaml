    html: <p>You know, you're right. I think I will just get one of the ITC Bookman Swashes; I just frankly don't have the time or desire to invest this much time in making the nameplate as exact as possible. What I'll do is customize the swash R's by removing the lefthand swash, but I think I'll substitute ITC Bookman's Th lig for Bookman JF's lig (although I do prefer Bookman JF's). Thanks for all your suggestions.</p>
