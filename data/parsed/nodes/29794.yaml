    <p>For my school's centennial, we're recreating the school newspaper's past nameplates, one in each new issue. The one we're up to (originally from around 1990, but I don't think we were digital at that point) uses <a href="/node/29639" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bookman</a> Italic (<em>not</em> ITC Bookman) with some swash characters. In looking for a font online to approximate it, I've only been able to find Jukebox Type's <a href="http://www.veer.com/products/typedetail.aspx?image=JBT0000087">Bookman JF</a>, which does match it almost exactly. The problem is that the font family costs $119, which is out of my publication's price range (especially after buying Farnham and Mercury for our redesign). I was wondering if anyone knows of another digitization of Bookman that preserves the Th swash ligature and the R swashes present in the nameplate attached below. I haven't been able to find one after much searching, but maybe someone around here could help me out. Thanks very much in advance.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/RR%20Bookman%20Nameplate.jpg" width="600" height="66" alt="">
