      <p>Terminaldesign-</p>
      <p>Thanks for the link. It's indeed a bliss to know there's such a law firm for such niche industry. I would consider their service in future, but not for this particular project though.</p>
      <p>No, we are not cheapskate. </p>
      <p>We are often the victims of cheapskate and we fully understand the pain of being one. The world doesn't need another cheapskate and we work hard not to be one and we believe we are not one. We have invested thousands in licienced fonts for our studio and blow people head off with M16 whenever we see them copying fonts without observing the right. We have purchased fonts from almost every major font foundry- FF, ITC, Emigre, T-26, ...you name it, we got it. You can reserve your preaching for the truly guilty.</p>
      <p>We handle big corporations all the time, some are international clients, and we read our local clients pretty well, and I think we pretty much know what we are doing in term of negotiation. It's not always that straightforward when you are dealing with a business negotiation. Many aspects to be considered but at the same time you got to keep things within budget for a project (no matter how big the budget is) and I don't think I need to preach to the converted here in regards to this. (I am sorry I am allowed to reveal details here. It would lead to unnecessary complications)</p>
      <p>What i am trying to say is that we have made certain business decisions in regards to the project after considering all aspects and we won't be able to undo that. As I mentioned earlier, I am looking for suggestions for writing the language, not about how to deal with the negotiation.</p>
      <p>I don't mind if some of us want to discuss about business negotiation here, but it won't be able to help me much. </p>
      <p>Also bear in mind that we are not talking about running a font business here, nor are we being commissioned to design a corporate font. It's an ID project which happened to arrive at a new font as a solution- which we knew clearly not included in the brief. Otherwise I would prefer to invest in a good legal advisers (which we do all the time anyway) in order to get things done in proper way. </p>
      <p>This is an one-off project and it's probably the first in the history of this country where a design firm are given the opportunity to design a set of fonts for a client's brand ID. (LOL- I know) Things are wired differently in this part of the world and font design is DEAD (or rather, it has never really be born) in this country and I am one of the very, very, very few rare species who are into font design. (again that is another lamentation which I would prefer to share in other time)</p>
      <p>We try to push and advocate font design whenever we can at the same time at the same time without compromise too much...</p>
      <p>OK, you can see how these whole things are heading. I am trying to start a lengthy discussion on business negotiation and I am not looking for one- as I said in the beginning.</p>
