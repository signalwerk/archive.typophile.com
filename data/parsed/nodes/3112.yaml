  html: <p>I want to use a number of TTF Chinses fonts in Photoshop as graphic elements.  Unfortunately, Windows can install non-english fonts, but cannot recognize them.  I hear that you can go to the "Regions" area in Control Panel, and add Chinese functionality, but naturally, I don't want to set my WHOLE PC to display nothing but Chinese!  Can anyone assist me in enabling the Chinese fonts so that Photoshop can use them to make vector font shapes in images, while retaining my english core WIndows funcationality???  I don't want to start fiddling with the core display attributes of Windows without knowing what I'm doing, of course.  Thanks in advance!!!</p>
