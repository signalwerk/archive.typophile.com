    html: "<p>I currently have eleven different keyboard drivers installed: there's a little box in my taskbar that tells me which one is currently active and lets me switch between them. I have not noticed any performance hits from having these installed. Obviously installed Asian language support requires some disk space to store the huge fonts, but there seems to be very little impact on processing power or time. <br> <br>Yes, it is perfectly possible to install and uninstall language support at will without affecting your computer.</p>"
