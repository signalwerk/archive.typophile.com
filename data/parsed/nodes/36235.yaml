    <p>I know I know, <a href="http://www.typophile.com/node/32705">last time I cheated</a>, but this time the computer’s <em>NOT</em> coming with us. Sabine, the kids and I are off to the Côte d’Azur. I’ll be gone all week, starting from tomorrow Saturday, August 18 till Sunday, August 26th.</p>
    <p>As usual, don’t mind the mess during my absence, and in the event of an emergency (spam, abuse, unidentified typeface) please contact the <a href="http://www.typophile.com/user/103">Stewfmeister</a> or one of the other moderators.</p>
    <p>Now that I mention it — does everybody know who all the moderators are? Is there a need for a list or sumptin’? Maybe something to pick up when I’m back.</p>
