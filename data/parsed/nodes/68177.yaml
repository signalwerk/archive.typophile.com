    html: |-
      <p>Well perhaps in the native country things should just be fine.</p>
      <p>But for me, the question is in the middle vowels. Obviously there's at least 2 ways to stress each vowel and there's three vowels in a row, which makes for a lot of possible combinations of how to pronounce the name.</p>
      <p>Now I don't expect you to be changing the name, but I also don't know how set in stone it is. My particular concern was that your audience can't say the name correctly. Personally, I would always want them to "get it" right away, just the same as I don't like people mispronouncing my own name.</p>
      <p>But for the business, is it detrimental? Will people be likely to remember the name if they aren't sure of which way to pronounce it in the first place? Same goes for a recommendation of your business--will the person who is told, "Play-ee-ah-do," (or whatever) "does great work, you should go with them." Will they remember?</p>
      <p>Perhaps it's wont affect leads--that would be based on your business model and how and where you approach your marketing.</p>
      <p>So litera I'm curious what you think, and if it's not a problem why--it's always fun for me to think through things and learn something in the process.</p>
