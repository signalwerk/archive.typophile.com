    html: |-
      <p>Looks like I'm a bit off. But the thing is when I look at logos from various companies they don't always tell you directly what the company/business is about. So first of all:</p>
      <ul>
      <li>this logo is for a company that's primarily in agile software development business but a part of it also in graphic design; that's why all the colors.</li>
      <li>Pleiado is derived out of Pleiades, seven stars, that are also related to <em>similar minded group of people</em>, which relates to team software development.</li>
      <li>circles represented as bubbles are just part of this draft; they may be replaced with anything; stars as well...</li>
      <li>bubbles start on top of the "i" to replace the dot on it.</li>
      <li>bubbles overlap to give a sense of dimension</li>
      <li>lifting shapes (in draft's case bubbles) give a sense of lightness that I can easily relate to Agile principles</li>
      </ul>
      <p>@Bendy: I agree I could place bubbles (shapes) more sporadically to not pose an exact shape and make them more playful</p>
      <p>@ricardo: I thought to deliberately overlap shapes in the final version (possibly with a hint of transparency) to relate logo to visual aspect of company's business (graphic desing).</p>
      <p><strong>@everyone</strong> I definitely didn't intend to relate this logo to pharmaceutical industry. The thing is <strong>I don't know how to relate agile software development</strong> with visual elements. I don't have a workable idea. Except growing/composing shapes/sizes/weights... but that's just growth. No agile-ness in it.</p>
      <p>I still want to make this logo professional but not bound to square/round shape.</p>
      <p>I thought I could place lifting smoke over type... It would make my logo design a bigger challenge (think of Silverlight logo), especially because I MUST make it work in BW as well.</p>
      <p><strong>Now that you know much more, would you change your opinion or suggest new things or give some additional observations and directions?</strong> Please do.</p>
      <p>Thank you very much and I hope you will all (at least the ones that did so far) reply again.</p>
