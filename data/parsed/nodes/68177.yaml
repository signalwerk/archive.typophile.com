    <p>Haven't been here awhile.</p>
    <p>This is the very beginning of a new logo. It has started on a piece of paper and this is the first digitized draft (and just a draft). I'm deliberately not providing any additional info on the logo, because I would like to hear from your:</p>
    <ul>
    <li>critique of this draft</li>
    <li>associations/emotions you get by looking at it</li>
    <li>what came to your mind when you first saw it</li>
    <li>what industry you think could be suitable for</li>
    <li>what other ideas may popped up your mind</li>
    <li>any suggestions you may have</li>
    </ul>
    <p>Thank you very much.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pleiado II_6541.jpg"></div><p></p>
