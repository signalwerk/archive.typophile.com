      <p>According to <a href="http://www.typotheque.com/fonts/opentype_feature_support/" rel="nofollow">Opentype support in applications</a> (where I simply got by following the links on the page you provided), Photoshop CS5 does not support Stylistic Sets 1-20.</p>
      <p>Just checked: Stylistic Set 1-20 don't appear as a selectable option in P'shop either, grayed or not, but they <em>do</em> in InDesign.</p>
