      <p>First thing that comes to mind is <a class="freelinking external" href="http://www.linotype.com/384/Eurostile-family.html" rel="nofollow">Eurostile</a>, which on this side of the Atlantic at least is having a bit of a revival lately. Square 721 I think is the same font published by Bitstream.</p>
      <p>In case you’ll find it useful it’s <em>serifs</em>, not <em>serif’s</em> — just a plural so no apostrophe needed.</p>
