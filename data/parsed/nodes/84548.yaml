    <p>Mennah = Gift of God</p>
    <p><img>http://farm7.static.flickr.com/6129/6034686209_10aeb2d173_b.jpg</p>
    <p>We, at Aratypo, are glad to announce the immediate release of “Menna”, a new Arabic Suite composed from 3 fonts (light, normal &amp; bold), designed by Abdoullah Aref (Egypt).</p>
    <p>Mennah is designed as children writing, not following formal Arabic calligraphic rules and it is freely distributed for non-commercial use. However, if you want to use Mennah for commercial purposes, please contact the designer: <a href="mailto:abdoulla_aref@hotmail.com">abdoulla_aref@hotmail.com</a></p>
    <p>Please feel free to discuss this font or ask for adding any special feature...</p>
    <p>Download link: <a href="http://www.mediafire.com/file/x357yds6rbrk2ka/ArefMennaFont.zip" title="http://www.mediafire.com/file/x357yds6rbrk2ka/ArefMennaFont.zip">http://www.mediafire.com/file/x357yds6rbrk2ka/ArefMennaFont.zip</a></p>
    <p>The information in Arabic: <a href="http://www.aratypo.net/forums/showthread.php?t=470&amp;p=1075&amp;viewfull=1#post1075" title="http://www.aratypo.net/forums/showthread.php?t=470&amp;p=1075&amp;viewfull=1#post1075">http://www.aratypo.net/forums/showthread.php?t=470&amp;p=1075&amp;viewfull=1#pos...</a></p>
