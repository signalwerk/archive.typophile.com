    <p>Hi,</p>
    <p>I was wondering was the font is used for the cover of LIFE OF BRIAN by the Monty Python folks.</p>
    <p>And how I could get this desired effect when designing?</p>
    <p>I have a feeling it was likely hand drawn, but I might be able to get some tips?!</p>
    <p>Thanks typophiles!</p>
    <p>Stackhat</p>
