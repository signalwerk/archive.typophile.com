  html: <p>O, how this typeface, Poynter Old Style, has been haunting me. It is ubiquitous — everywhere you see, it is there; magazines, newspapers and books. It is everywhere. But the problem is single-users cannot purchase it for personal use. Why do they do that? Anyone else obsessed with Poynter?</p>
