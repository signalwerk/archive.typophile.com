      <p>If you can simply send a link and anyone can check the 'forum', then you are missing a primary source for font data on the web. :)</p>
      <p>BTW, I know there is a debate on this topic that will go on Ad nauseam, but within the design group, exposure and use of a commercial font (prior to payment for said font) is likely more helpful than not. Since the designers get the clients to pay for the font, and anyone not interested in buying a license would have never paid for one anyway.</p>
      <p>Any type designer that actually makes money off their creations is probably making good fonts. Everyone else... I still see no evidence that any font designer can make a living off fonts - except for those few who license their fonts to HP, Microsoft, Apple, or another entity of similar stature. Even commissions for custom corporate fonts are usually subsidized with additional design work, yes?</p>
