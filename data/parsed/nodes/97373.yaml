    html: |-
      <p>For a start, I started sending emails requesting from data sharing services (Mediafire, Depositfile, Rapidshare...) to remove content from their servers. So far, from one of them did what I asked. We'll see in few days will the others do the same.</p>
      <p>It's not solution to this problem, since they can upload it again, under another link, but it's one small battle won.</p>
      <p>@frode – If I understood what they wrote on their website, they will start doing it after they raise some planned amount of money and after you make donation to them, according to donation level scheme they have offered on website. Which is all OK, but I understood that they still haven't started fully their services.</p>
      <p>@ Ryan – I won't comment this, sorry.</p>
      <p>@ majus – That sounds like a good idea! Actually, that gave me an idea (which may sound ridiculous to some). What about making an organization of foundries, type designers, distributions... with one aim – to fight on legal ways against such websites who share font files illegally. Organization that will have lawyers, membership fee. Since individual fight is pretty useless and rarely succeeds. I don't know how all this sounds nor would it be possible to make something like this, but I'd say sooner or later, something must be done on some serious level by font market.</p>
