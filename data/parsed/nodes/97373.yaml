      <p>Surely I won't share the link without checking senders background or some introduction first.</p>
      <p>About what you said... your right is to protect what's your ownership and that's starting point. What comes after that is just a collection of other relative things (luck, verbal skills, realistic view, contacts, will...).</p>
      <p>I don't agree with you about second part – "Any type designer that actually makes money off their creations is probably making good fonts. Everyone else..." That is very relative statement. Mostly, the number of those who recognize what's good and what's not is on the side of the NOTs. Very often, font sale is dictated by customers opinion, those who buy it make something good, "good", bad or "bad". So when some type designer makes something, he might can predict how it will show up on market, but much more often it's hit or miss situation, just like with other things that are designed – different types of templates, themes, stock materials...</p>
