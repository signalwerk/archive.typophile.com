      <p>Hrant - surely you jest! Perhaps you can count that number on one hand - possibly two. Beyond that... Even our good friend Mr. OldNick has shown that his revenues (and he has a sh*t ton of fonts) equates to less that US$50,000 per year BEFORE TAX, on average over the course of 11 years.</p>
      <p>The smaller font aggregators are pulling in a little from everybody, but they have the overhead of a digital storefront, payment processing, etc. I would estimate they clear a few times that amount? Monotype seemingly owns the rest of the market (commercial licensing and embedded products). Eh, just my opinions.</p>
      <p>Mr. tourdeforce: I was not asking for, nor wanting a link to the site you reference. I just note that there are at least two *private* forums that provide access to just about all fonts &amp; foundries. Any site you could send someone to, without providing your login details will be inconsequential. I do agree that type designers never know what will be popular (i.e., actually sell), but more often than not, the good designers sell, and the not-so-good ones do not. 'Good' being the relative descriptor. Price point helps too :)</p>
