    <p>Design Legends &amp; Luminaries Slated to Speak<br>
    at TYPO San Francisco</p>
    <p>Contact: Meghan Arnold, <a href="mailto:sanfrancisco@typotalks.com">sanfrancisco@typotalks.com</a>, +1.415.813.5992</p>
    <p>Jessica Hische, Neville Brody, Tina Roth Eisenberg, Michael Bierut and Erik Spiekermann will share a stage April 5-6 at TYPO San Francisco.</p>
    <p>With an emphasis on design, society, culture – with a little bit of kerning, TYPO San Francisco, based on one of Europe’s most successful design conferences, will take place at Yerba Buena Center for the Arts (YBCA), centering around the theme Connect.</p>
    <p>The two-day conference will feature a diverse array of local and international, creative and inspiring speakers across multiple industries in the Novellus Theater at YBCA, including:</p>
    <p>Juliette Bellocq — handbuiltstudio<br>
    Michael Bierut — Pentagram<br>
    Neville Brody — Research Studios<br>
    Thomas Castro — LUST<br>
    Peter Cho — Inkling<br>
    Jessica Hische<br>
    Nat Hunter — Airside<br>
    Morag Myerscough — Supergroup<br>
    Jim Parkinson — Parkinson Type Design<br>
    Yves Peters — The FontFeed<br>
    Hugo Puttaert — visionandfactory<br>
    Oliver Reichenstein — iA<br>
    Tina Roth Eisenberg — swissmiss<br>
    Erik Spiekermann and Kali Nikitas will facilitate in the main hall. The event will also feature typographic workshops and presentations by visual and performance artists.</p>
    <p>Regularly priced tickets ($500) are available through February 29, with late registration ($600) beginning March 1 up until the conference. Group rates are available. Additionally, a limited number of student tickets will also be available at a reduced rate.</p>
    <p>TYPO sponsors include FontShop, FontFont, Adobe, Emigre and Communication Arts. Several corporate sponsorship opportunities are still available, please email <a href="mailto:sanfrancisco@typotalks.com">sanfrancisco@typotalks.com</a> for more information on sponsoring.</p>
    <p>Bloggers are invited to connect with their readers at the event by placing a badge on their site for a discounted ticket. More information at: <a href="http://typotalks.com/sanfrancisco/blog/" rel="nofollow">http://typotalks.com/sanfrancisco/blog/</a></p>
    <p>Continuously updated details on the event are available at <a href="http://www.typotalks.com/SanFrancisco" title="www.typotalks.com/SanFrancisco">www.typotalks.com/SanFrancisco</a>, on Twitter (@TYPOSF) and Facebook (facebook.com/TYPOSanFrancisco).</p>
    <p>About TYPO</p>
    <p>TYPO Conferences are a huge success in Europe. TYPO Berlin has become Europe’s premier annual design conference featuring a veritable who’s-who from the elite of design with cultural commentary and social relevance presenting a design barometer of the rapidly changing creative arena of the last 17 years, and as you might expect, more than a little key knowledge of the world of typography. TYPO London premiered in London to rave reviews in October 2011.</p>
    <p>About TYPO San Francisco Connect</p>
    <p>San Francisco is a key location for design. Technology and software development have seamlessly entered the design process with creativity and innovation underpinning the way people are educated, conduct business and think about society. We all connect with the world every day. Good design makes this fun and easy, bad design ruins the experience. Being overly connected can be fulfilling or overwhelming. Disconnecting can be a relief or isolating. And all of this is changing constantly with technology. TYPO San Francisco brings together incredible speakers from both European and American design communities to share their work and insights on what it means to connect.</p>
