    html: |-
      <p>I like the story, and I like the design :) Having said that:</p>
      <p>- The Serifs could be little wider. Not thicker, but wider. Especially at the bottom of T, and in I this is clearly visible.<br>
      - Copy the bottom of E to L. And my suggestion would be, also (rotated) to the left top of T. The right top of T then would need to be adjusted accordingly (the serif doesn't have to have the same direction, but the same thickness and length), which would then need to be copied to the top of E.<br>
      - R is too Dark. I think you should make the bottom of the inside of the bowl a bit more horizontal.<br>
      - N is too wide and too light. Make the thin strokes slightly thicker, and consider a different approach for the bottom right: cut if off vertically, rather than horizontally.<br>
      - Copy the top right serif in S to G. The one in G is too meaty.<br>
      - The sudden blackletter-like style in B is a bit odd. I'd say give it a flat bottom.<br>
      - A is too wide. I like the serifless right leg though.<br>
      - W is also really nice.<br>
      - The white space in the top half of K is too large compared to the bottom. Main cause of this is the weird serif construction on the top right. Try if you can keep the weirdness, but fix the colour.</p>
      <p>Good luck!</p>
