    <p>I'm developing some custom type to be used on a sign adorning the boat barn my father is building. A stencil serif was requested and this is what I've come up with. It needs some cleaning up, as I drew it with the AI Blob Brush tool, but I'd be curious what others see regarding proportions and overall aesthetics. Once I'm happy with the type I'll manipulate it into a cohesive design around a half-hull model of the boat being built, which will live in the barn during the off-season.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lhb_5621.png"></div><p></p>
