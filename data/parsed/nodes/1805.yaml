  html: <p>I have two type-related domain names that expire on November 2nd. I've decided not to renew them this time around and I'm wondering if anyone may be interested in taking them over. I'm not looking at selling them, just finding them new homes. There's currently next to no traffic hitting the domains, as they have been simply sitting as placeholders for a past several years. <br> <br><a href="http://www.typopolis.com/">typopolis.com</a> <br><a href="http://www.fontopolis.com/">fontopolis.com</a> <br> <br>They are registered at <a href="http://www.dotster.com/">Dotster</a> and I can easily transfer them directly into another Dotster account. The new account holder can then renew them as they see fit. <br> <br>Send me a message if you're interested. <br> <br>Grant</p>
