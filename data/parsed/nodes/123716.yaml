      <p>Here is a trace on OS X 10.9. that uses the <code>ftxinstalledfonts</code> command from the Apple font tools. That gives a list of the Helvetica fonts installed and in what file they are contained.</p>
      <pre>% ftxinstalledfonts -l -f | grep -i helvetica | awk 'BEGIN{FS="\t"}{printf "%-45s %s\n", $3, $2}' | sort
      /Library/Fonts/HelveticaCY.dfont              Helvetica CY Bold
      /Library/Fonts/HelveticaCY.dfont              Helvetica CY BoldOblique
      /Library/Fonts/HelveticaCY.dfont              Helvetica CY Oblique
      /Library/Fonts/HelveticaCY.dfont              Helvetica CY Plain
      /System/Library/Fonts/Helvetica.dfont         Helvetica
      /System/Library/Fonts/Helvetica.dfont         Helvetica Bold
      /System/Library/Fonts/Helvetica.dfont         Helvetica Bold Oblique
      /System/Library/Fonts/Helvetica.dfont         Helvetica Light
      /System/Library/Fonts/Helvetica.dfont         Helvetica Light Oblique
      /System/Library/Fonts/Helvetica.dfont         Helvetica Oblique
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Bold
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Bold Italic
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Condensed Black
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Condensed Bold
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Italic
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Light
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Light Italic
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Medium
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Medium Italic
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Thin
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue Thin Italic
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue UltraLight
      /System/Library/Fonts/HelveticaNeue.dfont     Helvetica Neue UltraLight Italic
      </pre><p>As for the embedding rights, they are determined by the font fsType. Cf <a href="https://www.microsoft.com/typography/otspec/os2ver0.htm#fst" title="https://www.microsoft.com/typography/otspec/os2ver0.htm#fst">https://www.microsoft.com/typography/otspec/os2ver0.htm#fst</a>. Here they are in the file Helvetica.dfont on OS X 10.9. </p>
      <pre><strong>Font</strong>                      <strong>fsType</strong>
      Helvetica                 0x0000
      Helvetica Bold            0x0000
      Helvetica Oblique         0x0000
      Helvetica Bold Oblique    0x0000
      Helvetica Light           0x0004
      Helvetica Light Oblique   0x0004
      </pre>
