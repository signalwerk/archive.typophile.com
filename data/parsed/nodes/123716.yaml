    html: |-
      <p><cite>The closest I've been able to find is Helvetica LT Std Roman. Is this the same thing, or an updated version?</cite></p>
      <p>Helvetica is the general name that describes the typeface design. Like “Sebring” describes a car model. But not all Sebrings are the same because they are all called this way. There were versions of that model produced at different times, and you could have it with different extras if you wish.<br>
      It’s the same with such fonts. There are old PostScript versions of Helvetica still floating around from the 1980s and 1990s and then there are “re-mastered” OpenType versions with the old name or the new name Helvetica Neue with new character designs and font styles. And some versions come with a basic character set, some with a larger character set. Some are OTF, some are TTF. It all depends. If you were told to use Helvetica, follow the trail back to the source where this specification comes from. They will know which Helvetica to use and they should also know about how this font was licensed and can be used.</p>
