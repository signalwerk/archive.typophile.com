      <p>For general information on Helvetica see <a href="http://en.wikipedia.org/wiki/Helvetica" title="http://en.wikipedia.org/wiki/Helvetica">http://en.wikipedia.org/wiki/Helvetica</a>. To license Helvetica, you can have a look at <a href="http://www.myfonts.com/search/helvetica/fonts/" title="http://www.myfonts.com/search/helvetica/fonts/">http://www.myfonts.com/search/helvetica/fonts/</a>.<br>
      On my macintosh, if I give the following input file to XeLaTeX</p>
      <pre>\documentclass{article}
      \usepackage{fontspec}
      \setmainfont{Helvetica}

      \begin{document}
      Hello World! \textit{Hello World}, \textbf{Hello World}
      \end{document}
      </pre><p>I get a pdf file with Helvetica, Helvetica-Oblique and Helvetica Bold embedded. Notice that the file Helvetica.dfont contains fonts with AAT features (an Apple format) that not all applications can handle.</p>
