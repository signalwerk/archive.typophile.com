      <p>Sorry, I was misled by J. Weltin's post which mentions the Mac. The original message mentions nothing about the operating system on which the report generator is installed. The message of interest above mentions that you can send to a postscript printer a postscript file that does not contain Helvetica embedded and the printer should be able to render it. There is an example of such a PostScript input in <a href="https://www.adobe.com/products/postscript/pdfs/PLRM.pdf" title="https://www.adobe.com/products/postscript/pdfs/PLRM.pdf">https://www.adobe.com/products/postscript/pdfs/PLRM.pdf</a>. </p>
      <pre>/Helvetica findfont
      12 scalefont setfont 
      288 720 moveto
      (ABC) show
      </pre><p>That however does not answer the initial question. If you need to embed, you need to know the file format your generator takes as input and the Helvetica your company has licensed, as was mentioned above. On the other hand, there are also free fonts that can easily replace Helvetica if you are not fussy about your outputs.</p>
