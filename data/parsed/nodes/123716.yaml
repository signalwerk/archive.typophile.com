    <p>Hello everyone, I'll start this post off by saying that I'm a system administrator and typography isn't my forte, so if you could bear with me on my ignorance it would be appreciated. </p>
    <p>I'm working on a system that generates pdf reports, and I'm trying to get it setup to properly embed the fonts in the pdf. I'm good on the technical side, but I'm a bit confused trying to figure out what fonts I'm actually looking for. The standard font for reports in our company is Helvetica, but I'm finding it quite difficult to find a font actually called "Helvetica". Is there no such thing as just "Helvetica"? I'm specifically looking for these three fonts: Helvetica, Helvetica-Bold, Helvetica-Oblique, which are the ones that are needed by the PDF.<br>
    Again, please excuse my ignorance as I don't claim to know anything about typography, but any help is appreciated.</p>
