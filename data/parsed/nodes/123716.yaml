      <p><cite> Is there no such thing as just "Helvetica"? </cite></p>
      <p>There is, but that typeface is around since the 1950s and exists in dozens of versions — both regarding the actual design as well as the font formats. So you might want to check with the design department (or whoever is responsible for the corporate design) to see which version you should use and you might also check the licensing for those fonts. There might be special requirements for embedding, server use and things like that.</p>
