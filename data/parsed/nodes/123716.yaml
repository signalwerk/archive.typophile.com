      <p>Welcome,<br>
      No need to be shy and no, this is not about typography, this is a technical issue ;-)<br>
      The just Helvetica fonts you are looking for are system fonts on Apple Macintosh whose purpose is solely to display things like software menues. If your company’s corporate typeface is Helvetica you should look for fonts called ›Neue Helvetica‹ (Roman, Bold, Italic). Those are needed to prepare printable documents.</p>
