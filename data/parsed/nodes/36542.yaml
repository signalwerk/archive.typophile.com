      <p>If you expect the spectator (let alone the casual or hurried spectator) to recognize an ’h’ and an ’m’ you are asking too much.</p>
      <p>For starters, the ’h’ is cropped by the left edge. Look at the ’h’ right at that point: The thin horizontal line grows into the vertical stem in a smooth curve, identical to the curves in the ’m’. But it should not be a curve, it should be a 90 degree corner, to facilitate the identification of the ’h’.</p>
      <p>At least, *I* had this problem ... have you tested this design (ie showed it to friends and family) and asked them what they see?</p>
      <p>Some may see ’hm’<br>
      Some may see ’lm’<br>
      Some may see ’hi’<br>
      Some may just see Mother Penguin and her two children.</p>
      <p>Maybe you should try other fonts, other ideas as well. Stick to the ’feeling’ that the Orlando Bloom type design gave you, while you try other variations.</p>
      <p>Hey - great photo of OB ... all of a sudden, he looks interesting ;-)</p>
