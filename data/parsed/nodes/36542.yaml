    <p>I’m pretty lost on where I’d like to go with my own logo. I’ve even hired someone to help me steve jenks(retrodc.com). The previous logo was a quick slapdash idea. Name of the company is holy molee photography. </p>
    <p>The idea is a best friend of mine would do wedding photography together. Now he’s lost interest and I’ve kind taken over. Well the concept of the logo is merging names “Moler &amp; Lee”.</p>
    <p>Anyway, I am by far no expect at graphic design. I did this by hacking away didot in illustrator. I’ve tried to imitate this type: <a href="http://www.vman.com/1_davidsims_orlandobloom.php" title="http://www.vman.com/1_davidsims_orlandobloom.php">http://www.vman.com/1_davidsims_orlandobloom.php</a> and customize it in my own way. </p>
    <p>Communicately, I’d like to express some flair of high fashion influence.</p>
