    html: |-
      <p>Hey, that episode was written by Larry DiTillio, who not only went on to be the executive story editor for Babylon 5, but also did some great writing for role-playing games ("Masks of Nyarlathotep" for Call of Cthulhu).</p>
      <p>Babylon 5 creator J Michael Straczynski was a staff writer for He-Man, too....</p>
      <p>Cheers,</p>
      <p>T</p>
