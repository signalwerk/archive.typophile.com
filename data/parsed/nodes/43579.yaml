    html: |-
      <p>For what it is worth, I have used the old Cycles a fair bit. My only grumble is that is is a bit thin with direct-to-plate printing, which is quite understandable given that Sumner made it in the repro days. I have the new Cycles in various sizes, but have not used it so cannot confirm my impression it will still be a tiny bit thin with DTP printing. But I have this complaint about lightness-when-printed with a lot of fonts; other may find it just to their taste.</p>
      <p>Have also used Stone Print for a long text. Wonderful font if you don’t specify the measure too long. You can really pack in the characters, to either save space (book length) or increase margins.</p>
      <p>San Francisco Public Library looks very interesting, in between Cycles and Stone Print in terms of how condensed it is. There is a fair need for slightly condensed fonts, and SFPL looks like it might fit the bill for this.</p>
      <p>I have been using Magma Compact for a few books now, and like that too. I’ve used it paired with Quadraat, and for a companion display sans, like it better than Quadraat sans.</p>
      <p>As to ITC — Sumner once remarked that he had to license the Stone “clan” (Stone regular, sans, and informal) back from ITC in order to sell them, even though he was the designer.</p>
      <p>All in all, I think there are some good bargains here on some pretty darn good fonts.</p>
