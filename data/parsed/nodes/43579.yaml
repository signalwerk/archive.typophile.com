      <p>I can hazard a guess why Stone’s font site is becalmed. The older serif text faces have been around a long time and nobody needs to acquire them here. But the newer ones, which ought to be flying off the shelf on merit alone, offer deal-breaking problems of incompleteness and formatting. </p>
