      <p>The biggest difference for normal home use seems to be that the Home edition makes it harder for you to play around in the system files. This can normally be got around by using safe mode. I’ve had to do this once or twice to remove nasty viruses. Nearly all default settings treat you like you’re an idiot, but they can mostly be changed.</p>
      <p>If it’s for ’nothing special, really...’ I’d save your money and go with Home.</p>
      <p>Ed.</p>
      <p>(ps. yes, as Edwh said, the first things to get are a firewall* and antivirus software**, don’t trust the ones that come built in.</p>
      <p>*<a href="http://www.zonelabs.com/store/content/catalog/products/sku_list_za.jsp?lid=dbtopnav_zass"> Zone Alarm </a> and **<a href="http://free.grisoft.com/doc/Get+AVG+FREE/lng/us/tpl/v5">AVG</a> keep my PC clean for free.)</p>
