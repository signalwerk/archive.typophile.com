      <p>I think you should get Pro Edition. If you are getting another PC for a member of your family who just use the PC for basic internet use or school work, then get Home.</p>
      <p>If you are getting a PC put together from components, think about getting the OEM version of whichever edition you choose. Its half price ... one caveat is that the license is tied to the hardware, it means you cannot move that version of windows to another PC after Activation (30 days). If you don’t activate during that 30 days, you can’t do Windows update (a simple workaround was published in slashdot regarding this). What happens if you don’t activate? Answered here (<a href="http://www.annoyances.org/exec/forum/winxp/t1010414167" title="http://www.annoyances.org/exec/forum/winxp/t1010414167">http://www.annoyances.org/exec/forum/winxp/t1010414167</a>)</p>
      <p>So after activation you will not be allowed to install it to another PC even if your PC exploded! I think the activation might be tied to the motherboard and processor? My harddisk recently broke and had to change the drive, this was allowed, but could notdo activation over the internet anymore, you will have to call a provided number by the activation screen (it is so annoying being treated like a crook when you paid for the goods!!). I was plenty stressed out during re-installation, was relieved that that was allowed (very very annoying).</p>
      <p>Since you are getting XP, beware fo spyware, adware and viruses, plenty of online articles regarding how to protect yourself from these. When surfing the internet use Firefox instead of IE as your main browser.</p>
      <p>ugh I’m so longwinded ...</p>
