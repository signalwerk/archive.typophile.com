    <p>Thanks to the "Typophile Merchandise?" thread* I've realized that letterforms that have no fully-enclosed counters can be useful (for ease of manufacturing certain things). They're like the inverse of stencil letterforms. Kind of like some of the letters here: <a href="http://typophile.com/node/76578" title="http://typophile.com/node/76578">http://typophile.com/node/76578</a></p>
    <p>* <a href="http://typophile.com/node/101919" title="http://typophile.com/node/101919">http://typophile.com/node/101919</a></p>
    <p>What to call that?</p>
    <p>hhp</p>
