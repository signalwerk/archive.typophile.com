      <p>There are some contradictions here: comfort food vs healthful; traditional down-home southern vs urbanly hip. And of course, a takeout should be friendly and maybe a little loud, or at least noticeable. And maybe there should be a nod to the graffiti. But nothing that might be offensive or a cliché. That's a lot for a font.</p>
      <p>If "Soul Food" is part of the name of the restaurant, then everyone probably understands the menu. How about Winco? It's solid and reliable (like soul food) and somewhat friendly (not corporate) and a little bit hip and has a clean (healthful) look?<br>
      <a href="http://www.fontshop.com/fonts/downloads/retype/winco_complete_ot/" title="http://www.fontshop.com/fonts/downloads/retype/winco_complete_ot/">http://www.fontshop.com/fonts/downloads/retype/winco_complete_ot/</a><br>
      <a href="http://www.re-type.com/fonts/fonts-winco.html" title="http://www.re-type.com/fonts/fonts-winco.html">http://www.re-type.com/fonts/fonts-winco.html</a></p>
      <p>Or are you looking for something hipper?<br>
      <a href="http://www.myfonts.com/fonts/sudtipos/hipster-script-pro/" title="http://www.myfonts.com/fonts/sudtipos/hipster-script-pro/">http://www.myfonts.com/fonts/sudtipos/hipster-script-pro/</a></p>
      <p>Or something bolder and neon-y for a takeout shop? Can you give a hint about what direction you are leaning?.</p>
