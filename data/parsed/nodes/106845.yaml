    <p>I'm designing for a take out Soul Food place, but with a healthier twist.<br>
    The restaurant will have  a graffiti wall, so there's an 'urban' element to it (I hate that word!)</p>
    <p>I could use some advice on:<br>
    1. A font that could serve as a logo/wordmark<br>
    2. Some supporting faces for menus and such. </p>
    <p>I'm trying to steer clear of anything too cliche (and offensive).</p>
    <p>Any help is much appreciated.</p>
