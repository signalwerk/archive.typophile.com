      <div class="comment-spam-body"><p>Hi,<br>
      Thanks for this. So the physical location the client has in mind, is that this is going to be next to a basketball court, plus we'll have a wall of graffiti as mentioned before.</p>
      <p>I don't want to try to outdo graffiti style stuff. We can't go too hip hop. I'd like a nod to it, but w/o seeming like a poser (even though I used to write graffiti in the 80's!).</p>
      <p>It's Soul Food, so the menu will be familiar, but with some slight variations.</p>
      <p>I do like winco, and it might find it's way as a supportive typeface if not a primary. Perhaps with a treatment behind it, or an outline, it might get loud in the right way.</p>
      <p>The place will be called 'soul sammich' so I'm going to try mixing a bold 'soul' face, perhaps with a script. Maybe because the word 'sammich' is non standard, a script could be used for 'soul' perhaps like a graffiti style script w/o overreaching.</p>
      <p>Does that paint a clearer pic of the place? Any feedback helps, so thanks...</p>
      </div>
