    html: |-
      <p>Soul Sammich. I like it. </p>
      <p>Want to see some good examples? Come to Memphis and I'll drive you around. No offense intended to the other posters, but Hipster-script, hipster anything it is not. There's an inherent lack of stylish pretension in soul food. For the most part the hipness of all good soul food graphics is going to be hand-lettering and not typography. There's more soul in works by hand. When typography is used at soul food places, at least around the South, it's usually bad vernacular sign shop slop, which sometimes actually has it's own quirky charm, but most often is just plain lame and ugly. The best menus that set the mood are also done by hand. </p>
      <p>We had a great soul sammich here called the Soul Burger, served at an ancient South Memphis whorehouse, now just a funky bar, called Ernestine &amp; Hazel's. Unfortunately the owner killed himself a few weeks ago in the upstairs bar, which is allegedly  haunted. The new management says they'll continue unchanged, but we'll have to wait and see. </p>
      <p>I think you should maybe look for a few fonts for inspiration, but mainly stick with putting some funk in your pens and laying some ink on paper. (And stay away from haunted whorehouses.)</p>
      <p>That's a fun project, enjoy it.<br>
      D</p>
