      <p>More similars unfortunately: <a class="freelinking external" href="http://www.myfonts.com/fonts/lanston/ltc-obelysk-grotesk/" rel="nofollow">Obelysk Grotesk</a> (/R close but overall not matching), <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/normandy-isle/" rel="nofollow">Normandy</a> (same kind of /R but same problem, off)<br>
