    html: |-
      <p>Congrats, Bruno. Caturrita has a very nice design. These are the problems I found:</p>
      <p><strong>01</strong>. tilde is very heavy and does not fit the base weight.<br>
      <strong>02</strong>. the same occurs with commaccent, although it is less apparent.<br>
      <strong>03</strong>. tilde distance to base letter is excessive.<br>
      <strong>04</strong>. cedilla is dislocated to the left.<br>
      <strong>05</strong>. ogonek exceeds the base glyph limit at right.<br>
      <strong>06</strong>. ogonek weight is also very heavy to lowercase bases.<br>
      <strong>07</strong>. macron needs more distance to lowercase bases.<br>
      <strong>08</strong>. hungarumlaut needs to be more narrow.<br>
      <strong>09</strong>. slash is not centered in ø.<br>
      <strong>10</strong>. slash is very heavy in Ø.<br>
      <strong>11</strong>. the final group shown in MyFonts uses PUA Unicodes.<br>
      <strong>12</strong>. there are two glyphs not shown between the last ones.</p>
