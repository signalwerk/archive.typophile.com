    <p>Hello everybody!</p>
    <p>I'd like to promote Armasen, a new digital type foundry that I am developing in Brazil. It's still fresh and young, and that's a lot of work to do!</p>
    <p>Just like to get in touch and show you my work.</p>
    <p><a href="http://www.armasen.com/" title="http://www.armasen.com/">http://www.armasen.com/</a></p>
    <p><a href="https://www.facebook.com/pages/Armasen-Typefaces/104239443014894?ref=ts" title="https://www.facebook.com/pages/Armasen-Typefaces/104239443014894?ref=ts">https://www.facebook.com/pages/Armasen-Typefaces/104239443014894?ref=ts</a></p>
    <p>And here is the first release, Caturrita:</p>
    <p><a href="http://new.myfonts.com/fonts/armasen/caturrita/" title="http://new.myfonts.com/fonts/armasen/caturrita/">http://new.myfonts.com/fonts/armasen/caturrita/</a></p>
    <p>Feel free to comment and talk about!</p>
    <p>Thank you all!<br>
    Best regards,</p>
