    <p>First off, I did see this post: <a href="http://typophile.com/node/10317">http://typophile.com/node/10317</a></p>
    <p>Recently I've made the switch to InDesign (CS2) and have been using the optical kerning for headlines, titles and larger type. There are tweaks to be made after applying it, depending on the situation but it seems like a much better starting point than Metrics for large type. Has the technology improved since the above posts in the new versions of InD? Is this bad practice? How do others use this feature? or do you use it at all? I feel like this optical spacing would be inappropriate for body copy? Are some typefaces setup with 'optical' AND 'metrics' or is this purely an InD technology? Discuss!</p>
  html_clean: |-
