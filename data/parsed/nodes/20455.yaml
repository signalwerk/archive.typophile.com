      <p>Art Rafaeli's "Book typography" has an interesting discussion comparing and discussing the Optical, Metrics and Auto kerning functions of both InDesign and Quark.</p>
      <p><a href="http://www.amazon.com/gp/product/1584561572/sr=8-1/qid=1149529135/ref=pd_bbs_1/104-7115885-0516760?%5Fencoding=UTF8">Book Typogaphy</a></p>
      <p><strong>Here's a quote from Fig. 12 on page 29 in which a sample of text utilizing optical kerning is shown. The same text is sampled in the book's Figure 11 with metrics kerning applied:</strong></p>
      <p><cite>The optical kerning option tends to increase the spacing of characters as it moves from rightways or leftways and so the user's guide recommends that after the 'kerning' is applied some negative tracking should be applied generally to compensate for this. The literature does not say how much tracking might be needed but -7 seems  sufficient for this example. Note that the r and the comma in 'matter,' (in the tenth line) are now agreeably spaced.</cite></p>
