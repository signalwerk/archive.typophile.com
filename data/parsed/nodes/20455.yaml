    html: <p>One thing to note is that ID will do its own, different (looser) kerning on smaller text. So, you would not get the *same* spacing/kerning at small sizes. Try out some text and see which setting you like better. For that matter try both Optical and Metrics kerning on several different typefaces.... You will find that ID loosens text at small sizes compared to the built-in kerning (Metrics), and tightens at large sizes.</p>
