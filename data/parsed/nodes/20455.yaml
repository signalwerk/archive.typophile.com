    html: |-
      <p>Mrs. Eaves looks best using it.</p>
      <p>On a well done font, I tend to use built in metrics but track it tighter for large sizes. Fonts are typically tuned for a certain size range.  If I have a small amount of type for a heading at a large size (and if the standard metrics don't quite work) I track and kern it myself.  Sometimes I try the Adobe Optical and tweak it afterward. Mr. Cosgrove is right, just putz with it and see what works best.</p>
      <p>ChrisL</p>
