  html: |-
    <p>a client of mine uses <a href="http://www.myfonts.com/fonts/urw/corporate-s/" rel="nofollow">Corporate S</a> as his CD-font. i wasnt the designer of his collateral stuff, but i need to design a brochure for him. he is a consultant, specialised on start-ups.</p>
    <p>so now im looking for a serif font that works well with «Corporate S», mainly for text-blocks.</p>
    <p>im probably looking for something warm, with a human (not necessarily humanistic) touch.</p>
    <p>anyone knows a good choice? im really a beginner when it comes to issues like that.. any help warmly appreciated!</p>
    <p>thierry blancpain</p>
