    html: "<p><i>I am aware that Linotype hot metal had no hard and fast grid of units for a new typeface, but it is my understanding that they did establish grids when they entered the field of making fonts for new technology.</i> <br> <br>Yes, this is what Kent referred to above: Linotype's adoption of an 18-unit grid in their photosetting equipment. This would have corresponded with the design of Cartier, I believe. <br> <br>When I was working on Helvetica Linotype a couple of years ago, I found that the digital Helvetica had inherited the unit widths of the phototype version, so promptly re-spaced it.</p>"
