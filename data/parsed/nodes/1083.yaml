    html: <p>For everyone, <br> <br>I am of the opinion that since Hrant and others have confused Linotype duplex matrices as a fault of Monotype then it goes to show just how good Linotype did in hiding the deficiencies in their systems. <br> <br>Otherwise the confusion would never have come up, especially in the particularly critical nature of this discussion. <br> <br>It should have been obvious, would you not think! <br> <br>Gerald Giampa <br>Lanston Type Company <br>P.S. And no, I am not working for Linotype. <br> <br></p>
