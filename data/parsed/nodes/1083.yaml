    html: <p>Hrant, <br> <br>You finally read the caption. Good on you! Says nothing about ink trapping. "Probably" does not mean "positively", and "difficult" does not mean "impossible".  <br> <br>I do not know what they are doing. I can only assume the same for you. But I would be happy to find out. <br> <br>Supposing the author is correct, I read "difficult" as "quicker" for a "foundry" however I am of the opinion earned, "slower" for a punchcutting room providing many "punches for a type composing system". <br> <br>"Quality controls" and "extra effort" does not necessarily mean "bad" and "sloppy" as you would wish to think! You may have noticed I am kinder than you on this punchcutting room. But that error would never have passed inspection at Lanston, or Monotype or either of the Linotypes. <br> <br>This same punchcutting room repeated the same error in a different point size. "That sir, is most strange." <br> <br>And I am not convinced, as the picture is poor, that the galley nearest is one of punches, it could be just type! <br> <br>Maybe you could send me a clearer picture! <br> <br>.0001 <br> <br>Gerald Giampa <br>Lanston Type Company</p>
