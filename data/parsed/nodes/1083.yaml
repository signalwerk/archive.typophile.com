  - id: 8452
    user: 2094
    date: 2003-08-26T22:21:00
    date_raw: 26 Aug 2003 — 10:21pm
    votes: null
    html: "<p>INFORMATION ON UNITS FOR THE LINOTYPE SYSTEM <br> <br>I contacted Mike Parker. I would provide a bio of his credentials, however I feel that his reputation is well enough known for his work at Linotype. Parker and Mat Carter were both founders of Bitstream, presently Parker is working as a consultant to the Font Bureau. <br> <br>Graciously Mike sent me this material because I asked him to clarify the Linotype unit system. Also I have a note in uppercase which is not his words. The text is in its entirety with the exception of materials at the end which were edited because they do not pertain to the Linotype question but are personal arrangements for the two of us to meet. <br> <br>\"Dear Gerald,  <br>  <br>Normal Linotype matrices were machined to the appropriate width of the pair of characters to be placed one above the other on the matrix,typically:  <br>roman &amp; bold roman 'a' for 10 point Excelsior with Bold, roman &amp; italic 'a' for 10 point Excelsior with Italic, or bold roman &amp; bold italic 'a' for Excelsior Bold with Bold Italic.  <br> <br>To obtain the normal character the matrix sat on normal alignment. To obtain the auxiliary character the matrix was raised a fixed amount, placing the auxiliary character opposite the mold, correctly  <br>aligned.  <br>  <br>The Linotype problem in preparing each character was to design the roman, italic, bold and bold italic versions to all fit on on the same width (without, of course, permitting any character to kern off the matrix).\" (NOTE,GERALD GIAMPA: LINOTYPE FIT WAS SLIGHTLY WIDER BECAUSE OF MATRIX CONTSTRUCTION.) <br>  <br>'During the nineteen forties Teletype driven Linotype machines came into existence. The idea was to replace linotype operators with faster tape drives. In order to justify lines predictably, each character had to have a predictable width. Fairchild established a standard width for each character expressed in a single fixed set of eighteen units to the set width em to be used for all typefaces regardless of typeface design. The wider the column width, the larger the eighteen unit set width required.  <br>  <br>The Associated Press and United Press International distributed their stories in printed form accompanied by punched paper tape containing codes for characters, word spaces, and line endings. You would hang the tape on a teletypesetter-equipped linecaster.  <br> <br>Slugs would emerge at a great pace as long as the machine was equipped with a TTS font with characters cut to the appropriate TTS set widths for the column width. <br>  <br>By the 1960s the most popular newstext font had become 9 point 8 set Corona with Boldface No. 2. The most popular classified font was 5 1/2 point 6 set Spartan Book with Heavy. These two fonts were produced in huge volume, along with others like them, perhaps leading some folk to wrongly believe that all Linotype fonts were cut to the eighteen unit system. <br> <br>Mike Parker\" <br> <br></p>"
    html_clean: "<p>INFORMATION ON UNITS FOR THE LINOTYPE SYSTEM <br> <br>I contacted Mike Parker. I would provide a bio of his credentials, however I feel that his reputation is well enough known for his work at Linotype. Parker and Mat Carter were both founders of Bitstream, presently Parker is working as a consultant to the Font Bureau. <br> <br>Graciously Mike sent me this material because I asked him to clarify the Linotype unit system. Also I have a note in uppercase which is not his words. The text is in its entirety with the exception of materials at the end which were edited because they do not pertain to the Linotype question but are personal arrangements for the two of us to meet. <br> <br>\"Dear Gerald,  <br>  <br>Normal Linotype matrices were machined to the appropriate width of the pair of characters to be placed one above the other on the matrix,typically:  <br>roman &amp; bold roman 'a' for 10 point Excelsior with Bold, roman &amp; italic 'a' for 10 point Excelsior with Italic, or bold roman &amp; bold italic 'a' for Excelsior Bold with Bold Italic.  <br> <br>To obtain the normal character the matrix sat on normal alignment. To obtain the auxiliary character the matrix was raised a fixed amount, placing the auxiliary character opposite the mold, correctly  <br>aligned.  <br>  <br>The Linotype problem in preparing each character was to design the roman, italic, bold and bold italic versions to all fit on on the same width (without, of course, permitting any character to kern off the matrix).\" (NOTE,GERALD GIAMPA: LINOTYPE FIT WAS SLIGHTLY WIDER BECAUSE OF MATRIX CONTSTRUCTION.) <br>  <br>'During the nineteen forties Teletype driven Linotype machines came into existence. The idea was to replace linotype operators with faster tape drives. In order to justify lines predictably, each character had to have a predictable width. Fairchild established a standard width for each character expressed in a single fixed set of eighteen units to the set width em to