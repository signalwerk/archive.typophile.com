    html: <p>Gerald, <br> <br>I remember the trapping argument between you and Hrant from a previous thread. <br>I have no idea which of you is correct and though I had initial, mild, passing interest in the question, the way the debate ran soon cured me of that. <br>My current position on the trapping debate is that I don't know, and I don't care. In fact, I don't give a flying •••• through a ring donut whether trapping is a real phenomena, or a fantasy. <br>What is blindingly obvious though, is the connection between the previous debate and Hrant's image. In the previous debate you refuted the idea of ink trapping by (among other things) suggesting that the pantograph was not capable of cutting the sharp details required by Hrant's trapping theory. The caption on the new picture from Hrant shows that the fine detail was not in the hands of the pantograph operators, but was left to hand-cutters. <br>If you can't see the connection then you are either being deliberately stupid, or you are...well...just stupid. <br> <br></p>
