    html: "<p>&gt; Once the pattern is completed it can within some size constraints be used to cut other sizes of punches with the proper scaling. <br> <br>Could you please elaborate on this? I'd be very interested. <br> <br>&gt; It is possible to hand-nick out tight corners with a graver once the punch is cut, and I have done this to every patrix and punch I have cut over the past 25 years.  <br> <br>There you go. <br>This is exactly the type of thing that Tetterode is doing in that photo/caption. <br>How is this <i>not</i> a limitation of the pantograph? <br> <br>&gt; not a soul has mentioned a thing about a good fitting. <br> <br>Because it's unrelated, not unimportant. <br> <br>Concerning the use of Monotype fonts for hand-setting, is it not true that: <br>1) The quality is highly variable (much more than foundry type), because it's a DYI deal? <br>2) It necessarily uses softer alloys which wear faster? <br>3) The italics are made to fit the Roman widths, which most people consider a serious flaw? <br> <br>As for Linotype, you can't handset it, plus from what I <br>know the alloys are even worse, and there's no kerning. <br> <br>BTW, what about photopolymer, Jim? <br> <br>I'm not being elitist, just quality-minded, more than cost-minded. When it comes to preserving the integrity of a type designer's design decisions (for example the incorporation of trapping, or even just making very sharp inside corners), it seems that the pantograph needs help. That doesn't make it useless, not at all (like I opined above), but it does make it dangerous not to see its limitations. You can't blame the tool for the results, but you can admit for example that the pantograph created a great excuse for (gradually) dismissing optical scaling, as well as making fonts with rounded inside corners. <br> <br>hhp <br></p>"
