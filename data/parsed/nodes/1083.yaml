    html: <p>Kent, <br> <br>Kerning was easy on a Monotype, 6 pt. just as easy as 12pt. Foundry type "very not easy" with 6pt. <br> <br>There were two methods of kerning. One by keyboarding, the other by casting kerned characters and inserting by hand. <br> <br>There were obvious advantages to keyboarding by unit subtraction on the keyboard. The skills required nothing more than reading the manual. <br> <br>I believe the unit system for Linotype was 12 units Monotype commonly 18. However there were, 19, 21 units and possibly others. Universe for instance, stepped outside the usual 18 units. <br> <br>American Monotype produced the Monomatic Caster which eliminated any imaginable complaints with the introduction of their "divorced wedge". <br> <br>So the question is "which Monotype", American, or English, and "which model" are we talking about? <br> <br>Gerald Giampa <br>Lanston Type Company <br> <br> <br> <br></p>
    html_clean: <p>Kent, <br> <br>Kerning was easy on a Monotype, 6 pt. just as easy as 12pt. Foundry type "very not easy" with 6pt. <br> <br>There were two methods of kerning. One by keyboarding, the other by casting kerned characters and inserting by hand. <br> <br>There were obvious advantages to keyboarding by unit subtraction on the keyboard. The skills required nothing more than reading the manual. <br> <br>I believe the unit system for Linotype was 12 units Monotype commonly 18. However there were, 19, 21 units and possibly others. Universe for instance, stepped outside the usual 18 units. <br> <br>American Monotype produced the Monomatic Caster which eliminated any imaginable complaints with the introduction of their "divorced wedge". <br> <br>So the question is "which Monotype", American, or English, and "which model" are we talking about? <br> <br>Gerald Giampa <br>Lanston Type Company <br> <br> <br> <br></p>
