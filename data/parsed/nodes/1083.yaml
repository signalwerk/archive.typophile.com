    html: <p><i>&gt;I have never set type on a Linotype machine. Probably you have?</i> <br> <br>Gerald -- No, I haven't actually set type on the Linotype. While I was growing up, however, I used to spend a little time in the back room of the local newspaper where my mother worked and where they were still using Linos into the late 70s.  <br> <br>My interest in Linotype derives from my research on Dwiggins. My understanding of designing type for the Linotype has also been augmented by conversations with Matthew Carter, who provided much of the information I cited above. My understanding of the practical operation of the machine (at least the Model 31) comes from time spent with Gardner Le Poer at the Museum of Printing in No. Andover. <br> <br>Hrant -- Which 7-unit typeface(s) are you referring to? <br> <br>-- Kent. <br></p>
