    html: <p>I should clarify that when I answered Gerald's questions, above, I was not intending to suggest that the pantograph is inferior in either output or efficiency to hand cutting punches. I was simply indicating which process I would choose to have a design cut with if I had the choice and all else was equal (no time constraint, equal cost, etc.) I'm simply attracted to the directness of the hand cutting process, in which design and manufacture are so closely entwined, as opposed to the industrial process in which design and manufacture are more distinct. It is the same thing that I enjoy about designing type directly on the computer.</p>
