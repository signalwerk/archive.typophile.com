    date_raw: 26 Aug 2003 — 7:53am
    votes: null
    html: <p>Gerald -- <br> <br>Linotype had no unit system. Not in metal. (With the exception of TTS faces, of course.) Widths were independent within a design. The only constraint was that the duplexed characters must match each other.  <br> <br>There are a few characters which were usually most severely affected -- like the italic 'f' and 'j' and, to a lesser extent, often the italic 'a'. These are frequently tell-tale in identifying Linotype setting. <br> <br>Later, in photofilm, the early Linofilm had an 18-unit system (adopted presumably from Monotype's) because of constraints in the movement of the writing prism.  <br> <br>Hrant -- <br> <br>I believe that the "em" which was divided into 18 units was not a standard face-size em and could be varied according to the requirements of the design (condensed, italic, etc.) So it wasn't as rigid as it first appears. But, of course, it is still a restriction.  <br> <br>-- K.</p>
    html_clean: <p>Gerald -- <br> <br>Linotype had no unit system. Not in metal. (With the exception of TTS faces, of course.) Widths were independent within a design. The only constraint was that the duplexed characters must match each other.  <br> <br>There are a few characters which were usually most severely affected -- like the italic 'f' and 'j' and, to a lesser extent, often the italic 'a'. These are frequently tell-tale in identifying Linotype setting. <br> <br>Later, in photofilm, the early Linofilm had an 18-unit system (adopted presumably from Monotype's) because of constraints in the movement of the writing prism.  <br> <br>Hrant -- <br> <br>I believe that the "em" which was divided into 18 units was not a standard face-size em and could be varied according to the requirements of the design (condensed, italic, etc.) So it wasn't as rigid as it first appears. But, of course, it is still a restriction.  <br> <br>-- K.</p>
