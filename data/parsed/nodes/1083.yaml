    html: <p>Jim <br> <br>Thanks for all the information. If I may though.... <br> <br>In regard to your statement "Remember that Arion Press and Pennyroyal Press and most of the fine presses of the UK use Monotype. Nobody could exist if they had to have Stempel type." The recent Pennyroyal Press Bible and many of the Arion Press books are done with photopolymer and, while the UK is somewhat of a holdout, many of the fine presses there are now turning to photopolymer, as have many in the US and elsewhere. The reason is as you stated. Nobody could exist if they had to have Stempel type... but today that would also include Monotype. I could not survive as a letterpress printer without photopolymer. The economics of metal, which includes the labor factor, are quite difficult to work with. <br> <br>I don't have a problem with metal, I still have tons of it, but I can't afford to stay in business if that is all I have. Since my concerns are primarily typographic (mainly book typography), I will readily admit I am enamored with, and thankful for, the opportunities the digital era has brought with it. Water-washout sheet photopolymer was not used very much by fine printers prior to the digital era and I think the partnering of the two technologies did indeed save letterpress and has ensured its survival. Well, at least, for the moment and the forseeable future.</p>
