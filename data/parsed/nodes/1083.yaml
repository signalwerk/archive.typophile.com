    html: "<p><i>&gt;&gt; An 18 unit system could be very flexible  <br> <br>&gt;But not enough to prevent Sabon's lc \"a\" from being regrettably wide, for example. </i> <br> <br>I forgot to mention: this was most likely a consequence of meeting Lino restrictions, not Mono. (Or possibly a combination of the two.) Lowercase italic 'a' usually suffered in Lino from being too narrow in order to adapt to duplexing with roman. I imagine Tschichold was trying to balance out a bit by making the roman a touch wider. <br> <br><i>&gt;&gt; Which 7-unit typeface(s) are you referring to?  <br> <br>&gt;<a href=\"http://www.themicrofoundry.com/other/lino7.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/lino7.gif</a> </i> <br> <br>Oh, okay. You realize, of course, that this is a self-imposed restriction, not a machine constraint -- the purpose being to make justification easier by having widths in only a few ratios. ATF had a similar idea with their Quick-set Roman. I mentioned this before on the ATypI list but forgot to get back with a post. You can find an image here: <br> <br><a href=\"http://www.kentlew.com/Type/QuickSet10pt.gif\" target=\"_blank\">http://www.kentlew.com/Type/QuickSet10pt.gif</a> <br> <br>And didn't I just read that Boyd Benton was the first to invent such a system of \"self-spacing\" type in 1882? <br> <br>-- Kent. <br> <br> <br> <br></p>"
