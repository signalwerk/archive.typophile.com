    html: <p>Jim <br> <br>Yeah, Arion has been using photopolymer for quite some time. They also do processing for other printers. But yes, the Bible was done in Monotype. <br> <br>It is more a case of apples and oranges with Monotype vs photopolymer. As a buyer of Monotype versus having my own photopolymer machine, yes, much cheaper for me. If I had my own Monotype caster/composition machine versa buying photopolymer, don't know exactly. Patrick Reagh and Bradley Hutchinson (who did the comp for the Pennyroyal) both were major Monotype printers/casters who switched over to photopolymer. Both Berliner and Hoyem (as mentioned) offer photopolymer as well as Monotype. <br> <br>Nothing wrong with being happy. And nothing wrong with the old ways. Metal is the founding technology; let's keep that alive as long as we are able. It will always serve as the guide. <br> <br>Gerald</p>
