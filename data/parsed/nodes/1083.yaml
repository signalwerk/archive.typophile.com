    html: <p>Gerald, <br> <br>Good morning to you, from Finland. <br> <br>You are not misunderstanding it. Monotype have single cellular composition matrices.  <br>  <br>A Linotype face, on the other hand, have both the roman and italic "A, B C &amp; so on" punched into the same matrix. <br> <br>The fit of a Linotype face is determined by the width of the "matrix" itself. In other words Linotype matrices are composed side by side, then cast into a line-of-type. <br> <br>Monotypes casts each character individually. <br> <br>That been said, Linotype did an absolutely incredible job of disguising this technical handicap and my hat goes off to them. <br> <br>However, there is without doubt, a compromise. I think in hindsight their great contribution to the history of printing should not be disparaged. That their punch cutting departments monumental task of manipulating typefaces with great sensitivity should be admired. <br> <br>I say that knowing that all typefaces are not equal. In other words, instead of looking for some face that is not so good, you should look for their faces that were unbelievably good. Unfortunately my books are in Vancouver or I would show for you an example. But, I think it would not be hard to find that example of Linotype Caslon Oldstyle. There is dangers in saying much bad about it, because I could surprise you with something. The "Caslon Challenge" was not my idea. <br> <br>The difficulty in mechanical typesetting was no easy feat and that many fortunes were lost trying to make typesetting quicker. Linotype did that.  <br> <br>Monotype also. <br> <br>The printing and publishing industries have gained by the inclusion of mechanical setting. <br> <br>Linotype Companies were fierce competitors to both the English and American Monotypes. I am the owner of the Lanston Type Library, I supplied American Montypes matrices for over a decade, and if I can admire Linotypes great work, I believe all of us should capable of keeping our opinions in perspective. <br> <br>I admire them because they simply did a remarkable job. They gave us lots of trouble. <br> <br>Gerald Giampa <br>Lanston Type Company</p>
