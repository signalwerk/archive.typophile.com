    html: <p>Jim, <br> <br>Thank you, if I had said the same thing I would have been accused of trying to sell used Monotypes. <br> <br>Goudy's Kennerly was indeed the first. That story began, however, with the trauma Goudy had while designing Goudy 38. A story best left untold.  <br> <br>It is illustrative to note that Goudy opted for "less than 18 units" choosing instead "only 15 units" for Kennerley Oldstyle. <br> <br>This was also the case with the even later typeface, Universe 15 units where chosen, not 18. So some designs required more, some less, some got them and some did not. <br> <br>But Jim has said much and rather well. I advise a good read. <br> <br>Gerald Giampa <br>Lanston Type Company</p>
