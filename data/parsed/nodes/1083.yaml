    html: "<p><i>I have two questions for those that think Hrant is right about pantographs.</i> <br> <br>I don't know whether I think he's right, because I'm not sure what he actually thinks, but can I answer the questions anyway? <br> <br><i>1.) Would you rather have your type cut by an expert hand punchcutter, or by an expert Benton Pantograph punch cutter?</i> <br> <br>An expert hand punchcutter. <br> <br>2.) And why? <br> <br>First of all let me say that this has absolutely nothing to do with ink trapping or whether the pantograph can get a sharp inside corner or not. I would prefer to have a punchcutter cut my type by hand because it would remove several stages of the industrial manufacturing process: no precise and scaled drawings, no card patterns, no brass patterns. The pantograph is an industrial tool that enables a technician to reproduce as a punch a design by a type designer; this is not to say that the technician is without skill or that operating a pantograph is easy, but it is something that large numbers of people were successfully trained to do. In order for those people to be able to do their work, type designers and/or drawing offices had to produce precisely drafted outline drawings of type at large sizes, from which patterns could be derived. Meanwhile, the hand punchcutter can sit down with just the designer's rough-and-ready drawings at any size and produce a typeface. I admire the directness of this process, and the non-division of labour it implies.</p>"
    html_clean: "<p><i>I have two questions for those that think Hrant is right about pantographs.</i> <br> <br>I don't know whether I think he's right, because I'm not sure what he actually thinks, but can I answer the questions anyway? <br> <br><i>1.) Would you rather have your type cut by an expert hand punchcutter, or by an expert Benton Pantograph punch cutter?</i> <br> <br>An expert hand punchcutter. <br> <br>2.) And why? <br> <br>First of all let me say that this has absolutely nothing to do with ink trapping or whether the pantograph can get a sharp inside corner or not. I would prefer to have a punchcutter cut my type by hand because it would remove several stages of the industrial manufacturing process: no precise and scaled drawings, no card patterns, no brass patterns. The pantograph is an industrial tool that enables a technician to reproduce as a punch a design by a type designer; this is not to say that the technician is without skill or that operating a pantograph is easy, but it is something that large numbers of people were successfully trained to do. In order for those people to be able to do their work, type designers and/or drawing offices had to produce precisely drafted outline drawings of type at large sizes, from which patterns could be derived. Meanwhile, the hand punchcutter can sit down with just the designer's rough-and-ready drawings at any size and produce a typeface. I admire the directness of this process, and the non-division of labour it implies.</p>"
