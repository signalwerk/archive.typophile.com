    html: <p>&gt; the hand punchcutter can sit down with just the designer's <br>&gt; rough-and-ready drawings at any size and produce a typeface. <br> <br>Yes, like Radisch for example did so amazingly. Even people like JvK have trusted the master punchcutter. <br> <br>But the rub is that it's too rarified/slow/expensive, and we'll very rarely get what we "want". So what's a good balance between having the pantograph cut all the sizes from one set of exact drawings versus pure handcutting? For one thing, some characters in some faces can be mathematically derived to satisfation (like the "n") while others (like the "s") can't, at least not without some amazing algorithm. So to me a selective use of the pantograph with subsequent/parallel handcutting is a realistic ideal. <br> <br>In this scenario, handcutting can be used to sharpen corners (and add traps), since the pantograph was unable. <br> <br>Note also that ATF used to have complex methods of automatically scaling master drawings to different sizes, to great satisfaction, thanks to the mysterious Benton "cutting slips"... <br> <br>hhp <br></p>
