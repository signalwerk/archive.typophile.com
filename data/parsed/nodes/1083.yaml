    html: "<p>Hrant -- <br> <br>I think your question about the different constraints may have been answered here, but just to summarize . . .  <br> <br>Linotype had the constraints of duplexing (roman with italic, or roman with bold, usually) wherein the equivalent letters in each design had to have the same set width. It also had the constraint of being unable to perform any kerning. <br> <br>Monotype had the constraint of a unit-width system. I am not as familiar with Monotype's matrix grid, so I may not have a grasp of all the details, but: due to the arrangement of the grid, I believe, certain characters were required to have the same unit value. This was the source of the 18-unit system, although it's unclear to me whether all Monotype models conformed to the same system. I think there were a few different configurations developed. See McGrew, page 294, for a diagram of one such arrangement. <br> <br>So, in creating Sabon, Tschichold had to contend with both the Monotype unit system and the Linotype duplexing and nonkerning.  <br> <br>-- Kent. <br></p>"
    html_clean: "<p>Hrant -- <br> <br>I think your question about the different constraints may have been answered here, but just to summarize . . .  <br> <br>Linotype had the constraints of duplexing (roman with italic, or roman with bold, usually) wherein the equivalent letters in each design had to have the same set width. It also had the constraint of being unable to perform any kerning. <br> <br>Monotype had the constraint of a unit-width system. I am not as familiar with Monotype's matrix grid, so I may not have a grasp of all the details, but: due to the arrangement of the grid, I believe, certain characters were required to have the same unit value. This was the source of the 18-unit system, although it's unclear to me whether all Monotype models conformed to the same system. I think there were a few different configurations developed. See McGrew, page 294, for a diagram of one such arrangement. <br> <br>So, in creating Sabon, Tschichold had to contend with both the Monotype unit system and the Linotype duplexing and nonkerning.  <br> <br>-- Kent. <br></p>"
