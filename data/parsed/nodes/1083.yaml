    html: "<p>Jim, that was a golden post! Thanks. <br> <br>&gt; The resulting round in the corners was very small; two-one-thusandths of an inch. <br> <br>What I would point out is that 2 mils is about <i>twice</i> the typical ink gain (as reported by Dwiggin, Justin Howes, and the Flexographic Institute). And it's also much coarser than the fine details type designer generally obsess over... So I don't think it's \"very small\". That said, I totally understand when you say that over-inking/over-impression (sadly the norm in these days of sensationalistic letterpress) makes that moot. <br> <br>I think the panrograph is fine, as long as you: <br>1) Fix the inside corners (including any trapping). <br>2) Greatly limit the size scaling per source drawing - or maybe use those mysterious cutting slips. <br> <br>Unfortunately, both of those (especially the latter) are/were rare. By vying only to please the superficial <i>wants</i> of the typographically insensitive (if not whorish) customer, type designers failed in their duties to provide for the deep <i>needs</i> of the reader. <br> <br>&gt; You may be confusing the italic restrictions with Linotype and Intertype <br> <br>I guess, but I do remember for example that when Sabon was being made, it had to overcome/incorporate a large set of limitations, different for each of Monotype, Linotype, and I forget what else (the German baseline?). So what would the Monotype limitation have been? I remember it being the italic duplexing issue. Anyway, I'll double-check. <br> <br>&gt; There is just something about the actual handling of type that makes me feel good. <br> <br>I can dig that. <br> <br>Here's what I feel as a novice: <br><a href=\"http://www.typophile.com/forums/messages/4100/8907.html\" target=\"_blank\">http://www.typophile.com/forums/messages/4100/8907.html</a> <br>Mostly starting from mid-June. <br> <br>&gt; blacksmith <br> <br>Funny! I'll have to remember that. <br> <br>hhp <br></p>"
