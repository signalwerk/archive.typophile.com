    <p>two questions:</p>
    <p>* first, what is the typographic term for the junction of the axis between the two u’s (v shapes, normally) of the letter w?</p>
    <p>(see uploaded image)</p>
    <p>* is there an easy to find a font (preferably sans-serif) for everyday use where the junction of the axis occurs lower than the two stems on ether side? I guess the same might be true for a letter M as well. I’ve gone through my font explorer and library and can only find a few examples, like lithos but that’s not really what I want.</p>
    <p>thanks in advance.</p>
    <p>— </p>
