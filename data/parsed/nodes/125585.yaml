    <p>I had been browsing, several days, for a font and got lost.<br>
    I wonder if you could make a couple of suggestions on<br>
    suitable fonts for a wordmark conveying education, culture.<br>
    It should look modern, active and slightly quirky. </p>
    <p>Thank you so much.</p>
