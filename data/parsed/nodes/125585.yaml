      <p>What type of education, and what type of culture?</p>
      <p>How you set and/or alter the type (wordmarks or logotypes are rarely straight settings of a typeface) will also influence how the mark “reads.”</p>
      <p>Perhaps start with one foundry, like Sudtipos:<br><a href="http://sudtipos.com/home">http://sudtipos.com/home</a></p>
      <p>They produce beautiful work in a range of styles; run your cursor over the typeface names to see samples (they have a typeface tester on the site, but not for all of their offerings; you can also find most of their catalog on MyFonts).</p>
