  - id: 137573
    user: 1160
    date: 2002-06-18T10:51:00
    date_raw: 18 Jun 2002 — 10:51am
    votes: null
    html: "<p>That book is 2 years old. Ancient in Web time  <br>(the industry has learned a lot since then). In  <br>fact, my clients never quote Nielsen  <br>anymore... thankfully. <br> <br>In the end, you've gotta decide who your user  <br>is and what will work best for them. (For most  <br>of Typophile, we've gone with the belief that  <br>Flash is the best way to deliver content that is  <br>typographically true to the design. We also  <br>know that most of our users have the plugin  <br>already.) <br> <br>You asked about Flash... A paste from  <br>Nielsen's <a href=\"http://www.useit.com\" target=\"_blank\"> www.useit.com</a> says it better than I could: <br> <br>&gt;The version of Flash introduced in 2002  <br>&gt;(Flash MX) has solved many of the technical  <br>&gt;usability problems in previous versions of  <br>&gt;Flash. Among other things, Flash MX  <br>&gt;supports accessibility and the \"Back\" button  <br>&gt;in the browser. A very important usability  <br>&gt;improvement is that Flash now ships with a  <br>&gt;standard set of interaction controls: finally,  <br>&gt;no more random scroll bars made up at the  <br>&gt;whim of a Flash designer.} <br> <br>(As an aside: Interesting how Nielsen's  <br>changed his tune now that Macromedia is his  <br>client... read the piece for yourself. In the end,  <br>anything that helps this dogmatist think more  <br>about context is a good thing.) <br> <br>(The lesson: Bash a company publicly long  <br>enough and they'll hire you as an expert?)</p>"
    html_clean: "<p>That book is 2 years old. Ancient in Web time  <br>(the industry has learned a lot since then). In  <br>fact, my clients never quote Nielsen  <br>anymore... thankfully. <br> <br>In the end, you've gotta decide who your user  <br>is and what will work best for them. (For most  <br>of Typophile, we've gone with the belief that  <br>Flash is the best way to deliver content that is  <br>typographically true to the design. We also  <br>know that most of our users have the plugin  <br>already.) <br> <br>You asked about Flash... A paste from  <br>Nielsen's <a href=\"http://www.useit.com\" target=\"_blank\"> www.useit.com</a> says it better than I could: <br> <br>&gt;The version of Flash introduced in 2002  <br>&gt;(Flash MX) has solved many of the technical  <br>&gt;usability problems in previous versions of  <br>&gt;Flash. Among other things, Flash MX  <br>&gt;supports accessibility and the \"Back\" button  <br>&gt;in the browser. A very important usability  <br>&gt;improvement is that Flash now ships with a  <br>&gt;standard set of interaction controls: finally,  <br>&gt;no more random scroll bars made up at the  <br>&gt;whim of a Flash designer.} <br> <br>(As an aside: Interesting how Nielsen's  <br>changed his tune now that Macromedia is his  <br>client... read the piece for yourself. In the end,  <br>anything that helps this dogmatist think more  <br>about context is a good thing.) <br> <br>(The lesson: Bash a company publicly long  <br>enough and they'll hire you as an expert?)</p>"
