    html: <p> It's interesting that when Nielsen talks about web usability he doesn't think about me. <br> <br>If I view his very own site, the text is next to unreadable because of the completely liquid layout. I don't like to read lines which contain over 200 characters. <br> <br>Besides that, the yellow colour on his page makes me nauscious. Usability doesn't have to equal ugliness.  <br> <br>He's right on the other hand when he says that 99% (or whatever it is) of flash pages don't really need flash. </p>
