    html: <p>Jack Schofield from The Guardian newspaper here in the UK spouted this regarding Mr Nielsen last year... <br> <br><a href="http://www.guardian.co.uk/Archive/Article/0%2C4273%2C4211693%2C00.html" target="_top">http://www.guardian.co.uk/Archive/Article/0,4273,4211693,00.html</a> <br> <br>The Guardian were also decent enough to publish my rebuttal too, bless them, though I got a bit of a slating from the public the following week <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> Fancy suggesting that there might be an optimum number of words per line - I should be killed slowly... <br> <br><a href="http://www.guardian.co.uk/Archive/Article/0%2C4273%2C4215812%2C00.html" target="_top">http://www.guardian.co.uk/Archive/Article/0,4273,4215812,00.html</a></p>
