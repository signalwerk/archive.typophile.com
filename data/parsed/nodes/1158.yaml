  html: <p>Hmmm. Reading the Jakob Nielsen interview at pixelsurgeon.com. <br> <br>Have been learning Flash over the last couple months and we are using it for our site. <br> <br>Would like to be judicious with motion, but at the same time, want our site to be fun, not boring. We're not selling embalming fluid. We're not actuaries. <br> <br>Can anybody justify Nielsen's take, or debunk it? Do design/font sites get special exemption from the Nielsen Rules? <br> <br>Here are some links, including Porky's take.  <br> <br> <br><a href="http://www.pixelsurgeon.com/pages/interview/design/jakobnielsen/index.html" target="_top">http://www.pixelsurgeon.com/pages/interview/design/jakobnielsen/index.html</a> <br> <br><a href="http://www.useit.com/alertbox/20001029.html" target="_top">http://www.useit.com/alertbox/20001029.html</a> <br> <br><a href="http://www.typographer.com/html/mag-opinion-speedway.html" target="_top">http://www.typographer.com/html/mag-opinion-speedway.html</a> <br> <br>bj</p>
