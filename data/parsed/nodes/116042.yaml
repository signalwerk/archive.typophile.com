    html: <p>Slashes should be consistent with parentheses and brackets. The general idea with all of these is that they are vertically centered on the main mass of the text. Prescriptive text faces have them span ascender to descender, centered on the lowercase body, and usually supply an Opentype feature that shifts them upward for all caps. The "in between" school is accounting for the fact that descending letters are fewer and occur less frequently (in English and most other languages) than ascending letters, and so regards the bulk of the text on average to be higher. Stopping at the baseline tends to be the mark of a display face that expects to be used in all caps most often. Even then, some protrusion is called for. The slash functions as a divider, and so should not be lost among letters. You don't want it mistaken for an I or l in an italic sans. Same, more emphatically, goes for the vertical bar.</p>
