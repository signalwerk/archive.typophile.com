    html: |-
      <p>The backslash is a character that was included in the ASCII character set because it was thought that people might be able to use it to compose AND and OR operators as /\ and \/. Despite that, the original backslash, on the Model 33 Teletype, whether ASR, KSR, or RO, was a short slash at a 45 degree angle.</p>
      <p>Basically, it's a weird character that nobody uses, which has no business occupying prime real estate in the 128-character subset of UNICODE. But it's too late to change things now.</p>
      <p>As the previous reply noted, the solidus should go slightly above cap height and slightly below the baseline by an equal amount. This may vary if you are using old-style numerals. There would also be the issue with metal type that if lower-case ascenders did not extend above cap height, there would be no way (without kerning which would mandate leading) to so extend the solidus on the type body.</p>
      <p>This is still relevant in the digital era how? For accurate recreations of typefaces which existed in the era of hot metal.</p>
