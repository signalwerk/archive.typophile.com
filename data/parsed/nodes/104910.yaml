    <p><em>Berlin, Germany – Wednesday 24 July 2013:</em> <a href="https:/www.fontfont.com" rel="nofollow">FontFont</a> announced today a brand new <a href="https://www.fontfont.com/formats#app" rel="nofollow"><strong>App+ license.</strong></a></p>
    <p><a href="https://www.fontfont.com/formats#app" rel="nofollow"></a></p><div class="imageWrap"><a href="https://www.fontfont.com/formats#app" rel="nofollow"><img src="http://typophile.com/files/fontfont_appplus_5908.gif"></a></div><p></p>
    <p>Comprehensive, affordable and available online, the new <a href="https://www.fontfont.com/formats#app" rel="nofollow">App+ License</a> is ideal for apps, games, editable PDFs, and hardware.</p>
    <p>With <a href="https://www.fontfont.com/formats#app" rel="nofollow">App+</a>, customers can now embed all FontFonts in software, hardware and editable documents that can be viewed, printed or edited.</p>
    <p>Available <a href="https://www.fontfont.com/formats#app" rel="nofollow">online</a> with pricing based on the number of years, there is now no need to buy a license for every app or device, one license will cover them all.</p>
