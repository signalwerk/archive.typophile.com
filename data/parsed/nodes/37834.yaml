    <p>Hi all. I’m currently writing an editorial piece in regards to the University of Kansas changing their typeface to <a href="/wiki/Trajan" class="wiki">Trajan</a>. I’m trying to compile a list of all other companies that use Trajan for the branding identies. I could really use all your guys help! Much thanks in advance!  </p>
    <p>Also, if anyone has a link or a brief history of the orgin of the Trajan font, that would be much appreciated!</p>
