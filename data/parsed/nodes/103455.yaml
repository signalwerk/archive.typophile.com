    html: |-
      <p>FWIW, unless I missed it in my quick scan, it's not in Jaspert's Type Encylopedia of 1970. There seems to be a connected version for the smaller size and an un-connected for the larger. As for substitutes, there are a variety of possibilities that would evoke the style and possible era of the sample<br>
      <a href="//www.myfonts.com/fonts/profonts/arabella-pro/" rel="nofollow">Arabella</a>,<br>
      <a href="//www.myfonts.com/fonts/berthold/ariston-bq/" rel="nofollow">Ariston</a>,<br>
      <a href="//www.myfonts.com/fonts/profonts/bernhard-script/" rel="nofollow">Bernhard Script</a>,<br>
      <a href="http://www.myfonts.com/fonts/berthold/boulevard-bq/" rel="nofollow">Boulevard</a>,<br>
      <a href="//www.myfonts.com/fonts/linotype/gavotte/" rel="nofollow">Gavotte</a>,<br>
      <a href="//www.myfonts.com/fonts/adobe/coronet/" rel="nofollow">Coronet</a>,<br>
      <a href="//www.myfonts.com/fonts/bitstream/liberty/" rel="nofollow">Liberty</a>,<br>
      <a href="//www.myfonts.com/fonts/canadatype/mayfair/" rel="nofollow">Mayfair</a>,<br>
      <a href="//www.myfonts.com/fonts/canadatype/wagner-script/" rel="nofollow">Wagner Script</a>.<br>
      Happy scripting!<br>
      Don</p>
