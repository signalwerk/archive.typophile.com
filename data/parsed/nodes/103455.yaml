    html: |-
      <p>Close to it:<br>
      Quill Script by Tommy Thompson. Very popular in the 60's.<br>
      It was included in Photolettering, Letraset, VCG, Solotype and Monotype Catalogs.<br>
      There are lots of digitization by various foundries. All pretty similar (but not exactly the same).</p>
