    html: <p>I saw a souvenir shop in Vienna whose sign was set in Souvenir. Has anyone ever seen a comic book set in Comic Sans? <br> <br>I bet that there are clients out there who demand that thier designers use comic sans. I once remade the CI of a law firm. Their old logo was Arial, all caps. I tried for weeks, with three separate presenations to get them to decide upon another typeface. My third-and final-proposal even showed how they'd be better of if they would at least consider switching to Helvetica. <br> <br>They kept Arial. At least I was able to make it upper and lowercase. This was then followed by my designing the most boring letterhead I have ever made. <br> <br>This could happen to you too! But it could be Comic Sans, instead of Arial. <br> <br>Another time, I was working at a summer camp (one time, at band camp...). This was before I started studying graphic design. I was on the team of counselors responsible for working with the campers to create their camp year book (100 pages, double sided, black and white xerox). We had some Pentium 3s running MS Office and <i>Photoshop.</i> I laid out the entire thing using PowerPoint and Comic Sans (I was young and stupid and needed the money, please don't hate me <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> )!</p>
