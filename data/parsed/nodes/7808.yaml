    html: "<p>Danielle, that's good news about the tuition on your course. I'm aware a little of the graphic design department here in Glasgow and there really doesn't seem to be much rigour in their teaching of typographical matters. This pretty much squares with most of what I know about Glasgow vs DoJ: DoJ seems to put a lot of emphasis on good tuition and facilities, Glasgow relies on having a nice building and being in a cool city. <br> <br>Incidentally, I'm a graduate of Glasgow School of Art. I studied Fine Art Photography and then did a Masters in Fine Art there.  <br> <br>R</p>"
