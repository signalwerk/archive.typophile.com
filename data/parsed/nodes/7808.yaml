    html: "<p>Hi Robert, thanks for your feedback.  <br> <br>re. your inquiry as to 'whether there are people in schools like DoJ who can and will teach good typographic practice to their students' then that's a definite yes. Two of our tutors: David Herbert and Gary Gowens, are assessors on the board of ISTD and take part in the yearly student assessments. In the classroom they place strong importance on rigorous typographic control, setting us projects that concentrate entirely on these skills.  <br> <br>Where Gary is a great advocate of Why Not Associates, Dave is very much a stickler for the old school; Muller-Brockman et al. The grid is very important to them however they do allow room for those students who seek to break the grid in an informed way.  <br> <br>Talking to Dave on the same topic as this thread, he commented on the low pass rate of ISTD in recent years with 'approximately 70% of entries failing to meet the benchmark standards set by the society'. (He went on to stress that Duncan of Jordanstone achieved an 80% pass rate) He seemed to feel students are not evidencing enough typographic control or respect for 'the history and foundations of the subject'.  <br> <br>My friend doing Graphics at Glasgow school of art  never seems to have any tuition in these areas, this shows up the imbalance of the priorities in design education today. <br> <br>PS. Amy Conger, you will be pleased to know that I do not know a single graphic design student who would ever use Comic Sans! As for the rest of the country, well you cant have everything. (I have recently managed to wrestle the designing of the music society concert posters out of the hands of those determined to use bad clip art and Comic sans set in rainbow colours!) <br> <br>Danielle</p>"
