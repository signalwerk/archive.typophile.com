  html: "<p>I'm new to typophile so bear with me! Im in my final year of Graphic design at Duncan of Jordanstone Dundee. I am currently doing an investigation into expression and control within typography and would love to hear your thoughts on the following: Recently members of typographic institutions (such as the ISTD) have expressed concerns that there is 'evident erosion of typographic awareness knowledge and control' (John Macmillan, baseline issue 43). Do you agree that this is a worrying issue for the future of typography in the hands of new graduates?</p>"
