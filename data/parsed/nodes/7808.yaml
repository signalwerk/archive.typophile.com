    html: "<p>Yes, and it's all the fault of new technology driving up volume and driving down prices: first for printing, then later for typesetting. <br> <br>Of course, the first \"new technology\" I am thinking of is the introduction of the steam-powered printing press, which took over around 1830-1860. Then it was automated typesetting with the Linotype and Monotype typecasters at the turn of the (19th to 20th) century. And so on. <br> <br>It's quite funny to read old books and magazines, and see exactly the same kind of bemoaning of the decline of typography. <br> <br>Of course, there is an element of truth to all this, but the point is that it's been a problem for over 150 years. <br> <br>I actually believe that new tools and processes for automating higher-end typography are resulting in an increase in typographic quality right now. In the past this has happened as each technology has matured, and right now it seems to be happening with digital typesetting (at least at the high end). <br> <br>Regards, <br> <br>T</p>"
