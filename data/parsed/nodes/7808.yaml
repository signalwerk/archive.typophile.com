    html: <p>The world is awash in Comic Sans because it is on just about every computer, not because inexperienced designers love it. In short, everyone who isn't a "designer" seems to use it. <br> <br>I think that once a community says "no, don't use that, it is bad" that such attitudes become dogma, and design dogma is usually bad. I personally don't like Comic Sans, and think that it is so abused, but I think that it would be kind of cool, as a "real designer" to tackle a poster design where the brief set out clearly that I could only use Comic Sans and Clip Art <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
