    html: <p>Hi Danielle -- greetings from the other coast (Glasgow). <br> <br>I think everybody would agree that the speed at which design technology has moved over the past 25 years or so has caused some problems. The entire design industry has changed, from top to bottom -- there is not really any such thing as a type-specifier or compositor in the mainstream of the industry anymore. These very specialised jobs are now left to the (probably -- like myself -- untrained) graphic designer, at best, or at worst the company secretary. Likewise the designer is generally expected to know a fair bit about prepress (find me a printer that will give you an honest answer about densities and dot gain and I'll move to your city). So, yes, a skill base has disappeared, and print/type production is going through an era of transition. <br> <br>However, I wholeheartedly agree with Thomas, from the simple point of view that a new (digital) font from a respectable foundry today tends to be in many ways 'better' than what you could expect ten or fifteen years ago. 'Better' in the sense that more designers these days seem to want to create useful pieces of 'type engineering' which innovate whilst paying attention to the history of the craft (as opposed to all the spacey crap that came out in the 80s and 90s as people went crazy with the new technology). <br> <br>Viz. <a href="http://www.fontbureau.com" target="_blank">Fontbureau</a> with <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=11012879891016191&amp;fontname=Prensa" target="_blank">Prensa</a>, <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=11012879891016191&amp;fontname=Farnham" target="_blank">Farnham</a>, <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=11012879891016191&amp;fontname=Amira" target="_blank">Amira</a>, <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=11012879891016191&amp;fontname=Amplitude" target="_blank">Amplitude</a> etc., pretty much anything by <a href="http://www.stormtype.com/" target="_blank">Storm</a>, <a href="http://www.adobe.com" target="_blank">Adobe</a>'s Opentype Pro fonts, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11433.0.0" target="_blank">Legato</a> ...  <br> <br>Plus, as Thomas hints, we have tools like InDesign which actively encourage excellent use of type (whereas Quark, e.g., seems to have always gone out of its way to make typesetting even more abstruse). <br> <br>I also think that the fact that we're here talking about this is evidence of A Good Thing happening. I'd guess that most of the people who read and post to this list are in fact not type designers but enthusiastic <i>graphic</i> designers who actually care about how they use type and about what type they use. This isn't new, but owing to the Internet it's becoming much more widespread. There isn't really an excuse now for a self-respecting designer to not know what they're doing vis a vis type. <br> <br>The crux of this is going to be whether there are people in schools like DoJ who can and will teach good typographic practice to their students. I'd be interested to know what your experience is in this respect, Danielle. <br> <br>R</p>
