    html: "<p><i>&gt;'evident erosion of typographic awareness knowledge and control' (John Macmillan, baseline issue 43). </i> <br> <br>Yes, there certainly is an erosion of typographic knowledge and quality. But before the changes that Thomas mentioned, almost everything printed was created by a relatively small, closed group of people. Now, more people make things, and they also make MORE things. But still, there are many people who do manage to make wonderful things, with good awareness. <br> <br>Another interesting point with technology: when technology first comes on the scene, it decreases the level of overall quality. But then, technologies have always improved, and have begun to care more about things like typography.* Think about the first typesetting machines from the 1880s. Dreadful. But by the 1930s, English Monotype was making fabulous typefaces and very fine typography.  <br> <br>Much of the first digital typesetting was wretched, in part because of the low-resolution bitmap type. But then came PostScript, and desktop publishing software. Granted, every granny can make a bad flyer now, but you and I can also use InDesign to set well designed books ourselves. <br> <br><i>&gt;Do you agree that this is a worrying issue for the future of typography in the hands of new graduates?</i> <br> <br>No, I don't worry about the fate of typography at all! I see opportunity, and a challenge for me and all other young designers. <br> <br> <br>* OK, this might not be true in the case of Photo-typesetting�</p>"
