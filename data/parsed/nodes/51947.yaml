    <p>I’m building a new identity for our customer, and I’m looking at using FS Me from Fontsmith as their main typeface. However I’m in need of a We are building a new identity for our customer, and we are looking at using FS Me from Fontsmith as their main typeface. However we are in need of a serif typeface to use in longer body texts. FS Clerkenwell would fit nicely with FS Me, but it probably wouldn’t work in body text. </p>
    <p>Any ideas? Thanks.</p>
    <p>(I know Fontsmith will be rolling out some new serif faces next year, we are also looking in to those, just mapping out other possibilities.)</p>
