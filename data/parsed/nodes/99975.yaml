    <p></p><div class="imageWrap"><img src="http://typophile.com/files/T0000_01_5897.jpg"></div><p></p>
    <p>This font has been developed based on the engraving by the German artist Daniel Hopfer (1470-1536) listing the Latin ABC. While creating the font I tried to preserve the archaism and certain imperfection characteristic for the prototype to accentuate its charm. Fanciful convolution on the serif make it a bit fairy-tale like and cheerful. The font is also available with decorated dots as in the original version. All the letters in the font are capital.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/T0000_02_5189.jpg"></div><p></p>
