      <p>I don't think, Boruch, the encoding in Unicode was mistake.</p>
      <p>I advocate that it should be done also for the shva-na, and the shva-nach, just like the vav is encoded twice.</p>
      <p>The shva should remain, when not differentiated.</p>
      <p>Similarly, there should be an encoding also made for dagesh kal and dagesh chazak, with a special symbol for either, in addition to an ordinary dagesh.</p>
      <p>Similarly, there should be an encoding also made for the vowels which are kal and chazak, with a special symbol for either, in addition to an ordinary vowel.</p>
      <p>If this occurs, and its supported by font makers, with 5 years Jewish teachers and students will learn these rules.</p>
