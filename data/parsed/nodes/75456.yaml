      <p>Raphael, I am not sure whom you are addressing with the "mistake" question.</p>
      <p>But let me pose the following hypothetical question: How would you people feel if someone proposed (nay, implemented out of whole cloth) a change into the Latin alphabet structure by adding two versions for, say a vowel "a" (one for short vowel, one for long vowel)? The reasoning would be to help immigrants learn how to pronounce English better...</p>
      <p>I bet all of you would agree this would be insane. Well, the same applies to these new typographic aberrations with variant qomatzim, shevaim, and daggeshim! I know some people WANT them, and I understand the commercial realities, but I think it would be FAR better to promote learning of grammar over this wanton destruction of such a beautiful system.</p>
