      <p>Scott-Martin, I did not mean to imply that Israeli pronunciation is somehow more pure or holy. I was just tweaking Israel's obsession of getting all the pronunciation "right" when there is no clear single standard for "right"—and, as I read, there was a ruling that the Torah scroll should not have nikud as nikud are not mi-Sinai. </p>
      <p>I am imagining that Hebrew would sound better with the daled with out dagesh as "th" in "the", tav without dagesh as "th" in "thin" and gimmel without dagesh as "g" in "George," and ayin as "ng". But this is not a well-informed opinion!</p>
