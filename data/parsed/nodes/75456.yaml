      <p>I face the issue of the kamatz katan both as a typographer and as a type designer. I agree with Baruch in that the patach with a dot underneath is, indeed, the way the kamatz was written in the Aleppo and Leningrad codices, thereby putting it off-limits for sue as a kamatz katan. I have seen it done, but I believe it’s plain wrong. We’re not free to do what we wish, we have to explore precedents; otherwise, we simply add confusion. But I disagree with Baruch’s remark about the inclusion in the Unicode of kamatz katan (and hataf kamatz katan) being a mistake, for the reasons stated by Raphael. Both appear with sufficient regularity in siddur texts alone to justify their presence in fonts. </p>
      <p>I think we came up with a perfectly tradition-based, workable kamatz katan in the Milon font. It is a kamatz with an extended center bar, sufficient to be recognized immediately for what it is, without resorting to a bold character or other typographically obnoxious solutions. When the book was in progress, I shared it with Raphael, who thought the difference wouldn’t be noticeable, but we now have the evidence of over 150,000 satisfied users, including a large number of rabbis and other learned types. Feel free to judge for yourself: <a href="http://www.rabbinicalassembly.org/Mahzor.KolNidrei.pdf" title="http://www.rabbinicalassembly.org/Mahzor.KolNidrei.pdf">http://www.rabbinicalassembly.org/Mahzor.KolNidrei.pdf</a></p>
      <p>In the book linked above, we did not include the sh’va na, nor did we differentiate dagesh kal from dagesh hazak. We did use the patach g’nuvah, which is simply a typesetting issue, though I question its sense when used with ayin—what does it mean? I realize, as most of you do, that one can descend into a perilous realm of hair splitting, adding symbols that are outside the Tiberian sources, but are, rather, the product of latter-day khokhma. (“Rabbi Hutzpis on one foot? Big deal, I can recite the entire Torah on just three toes!”) The question in litugical Hebrew is which paytanim used which nikkudot—if any, and how early they were applied. Without some sense of historical application, one might come to the conclusion that everything should be typeset in the International Phonetic Alphabet. There’s great virtue in simplicity—you either know, or you don’t know—and if you don’t know, you can learn.</p>
      <p>However, I recognize that for some, especially Jews who are from Persia or some Arabic-speaking lands, nikkud such as the dagesh hazak is clearly vocalized, whereas among Ashkenazic Jews no discernible sound is made. Therefore, it may be a worthwhile thing to differentiate, at least in material intended for certain communities. But again, we should look for typographical (or even calligraphic) precedents that appeared more than just once. We shouldn’t try to reinvent the wheel, as Ezra has done. I’m told that there’s a special place in gehinnom for people who do that kind of thing! (Sorry, I’m not at liberty to divulge my source.)</p>
      <p>Bill, the Yiddish linguistics scholar Dovid Katz has proposed that the Asheknazic pronunciation of Hebrew may have been influenced by late Aramaic style more than by Yiddish—and that Yiddish pronunciation, itself, as well as some of its syntax, were heavily influenced by Aramaic. There’s no reason to think that the melding of Sephardic and Mizrahi phonemes one finds in Modern Hebrew have any greater claim on authenticity than do the phonemes of Ashkenaz. Why is Spanish or, say Persian, closer to “proper” Hebrew than Middle High German? Linguistic influence is not measured in miles or kilometers. It was simply the case that, at a certain time in the 20th century, the desire to leave behind anything European was overwhelming. Yet, somehow, Judeo-Spanish was seen as “cleaner” than Judeo-German. Don’t believe the popular press. It puzzles me as to how American Jews got sucked into this agenda, though I do understand how and why it was sold. As for me, I continue to pronounce Hebrew as my father did, and his father before him, even if it means turned heads every time I say “yisgadal v’yiskadash, sh’meih raboh.” And I am not a Hasid.</p>
