      <p>I think the hollow circle is going to be hard to harmonize with the other nikkud. </p>
      <p>For the kamatz katan, that is sometimes done with a line with a dot under it (like a patach with a hirik below). You could use the "T" form for the regular kamatz and the line with a dot below for the kamatz katan. This would keep the same design elements, so it would not stick out so much. I think some siddurim already do this, but I think they make the kamatz katan symbol also bigger, which I wouldn't do. The kamatz katan is relatively rare, and I don't think the difference has to be so prominent.</p>
      <p>How about for the shva na, having a dot above and a short horizontal line below, indicating some pronunciation? I haven't tried this, but it might work, and would be more harmonious with the current design elements in the nikkud. </p>
      <p>Another possibility is a dot above and a short vertical line below, or two short vertical lines, one over the other. There is a danger of mixing it up with the dreaded meteg, though :) Also you might have a space problem. I think the horizontal line below is a more promising direction.</p>
