      <p><cite>For the kamatz katan, that is sometimes done with a line with a dot under it...</cite></p>
      <p>William, this a nice graphic idea, but it is conceptually wrong, since the "pattach-hirik" combination you speak of is actually the original Tiberian way of writing a kamatz. The combined shape (a line with with "droplet", or a "T") we know as kamatz today seems to be a later evolution (by the early printers perhaps). </p>
      <p>As I said before, there is really no allowance under the Tiberian nikkud for these differentiations and, although I know some people want to see these differences represented graphically, it is an unfortunate development form the purely typographic point of view. Making up for the lack of grammar knowledge by screwing with this venerable and very laconic system is just sad.</p>
      <p>I also think that including a kamatz koton in Unicode was a mistake.</p>
