      <p>William &amp; gohebrew:</p>
      <p>You might have missed my point, I did not even for a second suggest that such a system should actually be implemented in a regular-purpose text with <cite>taamim</cite> and <cite>nikkud</cite>. I was simply answering Raphael's point about a hypothetical specialized phonetic text. My illustration was intended to show the KIND of approach that would be needed EVEN for such a purpose – that a NEW system with clear differentiation between the marks would have to be invented. For the general audience (and certainly for people that are having trouble with the language) there is really no need for any of these grammatical nuances to be graphically represented. </p>
      <p>gohebrew: <cite>"Why not keep everything as it was for centuries?"</cite><br>
      My point exactly – leave the damn thing alone :) All the "time-tested" stuff you site is pure nonsense – these are all very recent inventions. (The Kehoth siddur type approach is not really the subject of my derision, since it doesn't feature the stupid new komatz koton and dagesh hozok).</p>
      <p>William:<br>
      <cite>"Text with nikkud look pretty ugly in any case, if you ask me, compared to straight text with Hebrew letters."</cite></p>
      <p>I guess if you feel this way, you would not be troubled if this system was further eroded by featuring two kinds of dots of slightly different shape (a typographic horror). I, needless to say, strongly disagree. I truly believe the Tiberian system of <cite>nikkud</cite> to be absolutely stunningly beautiful, and I hate seeing it messed with.</p>
