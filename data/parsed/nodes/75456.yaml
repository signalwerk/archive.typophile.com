      <p>Baruch, I think your implementation of the kamatz katan as I mentioned—perhaps others have already done it—doesn't look half bad. Your sheva na looks too weird, as does your dagesh kal. My concept, which is different than the philosophy now, is that the difference between the sheva na and nach should be slight, you can mistake one for the other, and have to look closely to differentiate. You could just discretely make the sheva na with square dots, but NOT big and ugly. By the way, you could also use the patach-hirik look as the normal kamatz and the "T" one for the kamatz katan...</p>
      <p>The point is, that in a siddur, if a person wants to learn the pronunciation, they are going to have many times going over the same text, and these "instructional" variations don't have to shout at the reader, so long as they are noticeable when he or she looks closely.   </p>
      <p>Raphael, that's my point about the kamatz katan also. It's true that kol and chochma are very common words, but there really aren't that many which are common, so flagging them very discretely will be a way for people to learn them, without messing up the look of the nikkud, as Baruch says. </p>
      <p>Baruch, the problem with your argument is that you can also say to people like me, who struggle without nikkud, or those who are totally unable to sound out words without them: go learn your Hebrew! Text with nikkud look pretty ugly in any case, if you ask me, compared to straight text with Hebrew letters.  </p>
      <p>An injunction to learn Hebrew would be good advice, but would not address what is likely to remain a problem in the diaspora for a long time.</p>
