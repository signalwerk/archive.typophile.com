    <p>I have seen different aproaches for sheva na and qamats qatan indictions.<br>
    1. A mark above (a circle, MAGEN DAVID or a Rafe) the letter<br>
    2. A bolder (somtimes squer) Sheva than the useal.</p>
    <p>As a type designer a don't like the aproach of using uncommon symbols.<br>
    and more so misusing a symbol that indicates RAFE for indicating Sheva Na</p>
    <p>As a designer i don't like the bolder or squer sheva that makes the text look not good.</p>
    <p>in this discotion I would like to hear your opinions about this matter with tour reasoning.</p>
    <p>Or in simple words<br>
    What in your opinion is the best way of indicating Sheva na, Qamats Qatan &amp; dagesh Hazaq.</p>
