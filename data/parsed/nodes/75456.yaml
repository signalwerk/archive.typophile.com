      <p>I am a Jew from the diaspora, and most of my Hebrew knowledge is from religious school and the siddur. I would not normally comment on Hebrew typography, but because I have a need for phonetic marks, my perspective might be useful. </p>
      <p>The qamats qatan is a very useful mark for those who do not speak Hebrew fluently. A special mark for the sh'va na is not so important because the rules for pronouncing it are very predictable (elementary students learn these rules in their first year of Hebrew school).</p>
      <p>I have seen styles 1 and 2 used together in a text, one indicating the qamats gadol the other indicating the qamats qatan. I have also seen a curved version for the qamats qatan like style 4. Style 3 will definitely confuse non-Israelis and students.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/qamats_3992.png"></div><p></p>
