    <p>Hi</p>
    <p>i have a project about the Index Librorum Prohibitorum, which is a list of prohibited books that the Vatican used to publish. It started in 1559, my project is about the authors that were on this list. Does anyone know any Italian typefaces that were off that period or maybe a new typeface that was based on an older one?...i was thinking Bembo</p>
    <p>thank you</p>
