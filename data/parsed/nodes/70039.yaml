    votes: null
    html: "<p>1559 is late for the actual incunabula types on which Bembo is based, although type in this style continued in use in Italy for a long time. You should note however that publishing of the Index was not limited to Italy: editions were printed across Europe within a few years of the 1559 promulgation. I would consider using something in the Garamond style, which is contemporary with the first editions of the Index and evokes the counter-reformation period better than the earlier Italian types.</p>"
