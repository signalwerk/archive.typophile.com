      <p>Re the conversation: Professional organizations are contemptible things. Breeding grounds for egos and back pats. But there's a lot to be learned if you look in the right places. And listen.</p>
      <p>Re "a good place to discuss Retina displays": I started that thread because I had some legit questions re the impact of technology on type design and anticipated adjustments by foundries. The thread changed organically, eventually becoming a different discussion all together. Which was beautiful, I think.</p>
      <p>And Ryan, I thought your attempt to be humorous was very funny. Got a kick out of it.</p>
