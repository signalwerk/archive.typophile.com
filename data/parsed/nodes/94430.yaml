  date_raw: 3 Jul 2012 — 11:42am
  date: 2012-07-03T11:42:00
  votes: null
  html: <p>Does anybody know of a good type design forum where someone can post their work for critique, or bring up some new and interesting type deign ideas and actually get a few meaningful responses?  I thought this might be the place. Perhaps it was years ago.  Now however this place seems to be made up of mostly old grumpy people who are stuck in their ways and look down their noses at anything new or radical. But hey, I guess it's a good place to discuss Retina displays and politics.</p>
