      <p>Ryan<br>
      I looked in earnest at your letters. I think the old grumpy people (with lots of time and experience behind them) may look at your "new and radical" with tempered eyes and see it as naive and flawed. There are some interesting qualities in some of the individual letters but there are also some "mishaps" in your forms. I would look to some other ancient forms to resolve some of the forms. I thought of three instantly when I was looking at your work. "Forms can be adapted across time."</p>
      <p>I have found, when you challenge on this forum, members tend to take up the shield and sword. So approach it with dignity and humility instead of throwing a "hot bowl of soup" in their face.</p>
