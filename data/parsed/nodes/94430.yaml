      <p>Not sure which forum you all have been reading but I have been nothing if not humble and dignified in my posts till now.  Oh, and also utterly ignored.  Someone posted that recently all I did was was post a jpg and nothing else of my work, obviously they didn't even bother to scroll down through the thread to see the extensive 'brief' I posted there.  But it's cool. I can understand that a lot of you don't give a shit. Why should you? It's not like I'm some famous type designer or something.  I'm just asking, are there any real forums out there where people are really trying to help each other design type?  Cuz Typophile sure isnt one.</p>
      <p>Nick, you and Hrant are like the 2 people that I didn't want to piss off, so, my bad.</p>
      <p>Typerror, would love to continue this conversation viz email if you are willing.</p>
      <p>Dunwich, Typedrawers sounds good, I'll have to check it out.</p>
