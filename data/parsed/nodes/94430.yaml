    votes: null
    html: <p>Typedrawers.com is growing. It was created to provide an alternative to Typophile. Typeboard sources server hosting from a vendor known for reliability rather than using home baked solutions. And problem Typophile members have been blocked from creating accounts at Typedrawers.com.</p>
