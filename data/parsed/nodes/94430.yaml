    html: |-
      <p>There are limits to anything - don't expect miracles, and be patient.</p>
      <p>Typophile has its flaws, and its ups &amp; down, just like anything else. And it's no substitute for going to conferences. And certainly no substitute for quiet observation and deep introspection. But it's still a very good place (and by far the best online place) to do what you're trying to do, and in my experience a superb place to start and build relationships. Not everybody can handle everything about it, and you should try to change it into something you prefer, but most of all just see how you can grow with it.</p>
      <p>hhp</p>
