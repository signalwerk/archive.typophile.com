    html: |-
      <p>Our first foundry was just a hole in the ground by the side of the road. We used an old dry-cleaning bag to cover the paper when it rained, stole pencils from the blind and scraped up dried squid guts for ink. There were three kinds of questions: good questions, (like "What's the x-height?") they’d strangle ya for, bad questions  (like "What's an olde style?") they’d chop off your feet, and really bad questions  (like "Can I get 1¢ a year more please?") they killed ya. </p>
      <p>Many died screaming in the pencil sharpener, and yet you come before us after a mere 32 weeks, one font, and an overly compressed avatar seeking another forum!? Well I never...</p>
