      <p>RAVIOLI: looks like a custom job to me. <a class="freelinking external" href="http://www.myfonts.com/fonts/facetype/ivory/" rel="nofollow">Ivory</a> is in the same vein.<br>
      "An Evening of Extraordinary Things": <a class="freelinking external" href="http://pinterest.com/pin/112308584427251156/" rel="nofollow">custom job by Jessica Hische</a>, you may like her <a class="freelinking external" href="http://www.myfonts.com/fonts/jhische/buttermilk/" rel="nofollow">Buttermilk</a> typeface.<br>
      the black tulip: according to <a class="freelinking external" href="http://typophile.com/node/40560" rel="nofollow">this previous discussion</a>, most probably a custom job by <a class="freelinking external" href="http://michaweidmannstudio.com/" rel="nofollow">Micha Weidmann</a>. Some alternatives: Buttermilk, <a class="freelinking external" href="http://www.myfonts.com/fonts/letraset/fling/" rel="nofollow">Fling</a>, <a class="freelinking external" href="http://www.fontshop.com/search/?q=itc+bodoni+seventy+two+swash+book+italic" rel="nofollow">Bodoni Sventy Two Swash Italic</a></p>
