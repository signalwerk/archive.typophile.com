    <p>I've found that using something like What The Font?! is pretty much fruitless when trying to identify fonts that are too decorative or scripty, so I'm hoping the good folks here can help me out. </p>
    <p>I'm uploading a few images of some fonts I'm interested in identifying for some projects. Any help would be greatly appreciated. </p>
