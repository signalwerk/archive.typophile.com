    <p>Hi everyone my name is Neil, Graphic designer in Australia. I have been reading the forum for a while and it is nice to meet you all</p>
    <p>I am doing some research for a design blog. “Oh not another one!” you say. Well it won’t be, it will not be covering the same rehashed crap that is on a lot of design blogs at the moment. I can’t stress this enough.</p>
    <p>I would like to find out what YOU would like to read on a design blog. What would benefit you?</p>
    <p>Here are some of my ideas so far . . .</p>
    <p>    * Interviews with real world designers<br>
        * Reviews on hardware from a designer’s perspective<br>
        * Reviews on games/software from a designer’s perspective<br>
        * Design Process of my work and others<br>
        * In-depth articles with good examples<br>
        * A source for upcoming design events/conferences around the world<br>
        * Humour added into articles, e.g. funny captions, comics<br>
        * Design related tutorials e.g. getting a design job to software (video, audio, article)<br>
        * Writing about a topic from a different angle (if beneficial)</p>
    <p>I want quality over quantity, articles that will truly benefit the design community.<br>
    Let me know what you like, what you don’t like and any other ideas you were hoping to read.</p>
    <p>Thank you.</p>
