      <p>"many grotesques don’t have old style figures (anyone care to explain why?)"</p>
      <p>Most grotesques did not have them in metal, either. Modern typefaces (the "moderns" of the 19th century) were created with lining figures, not oldstyle figures. Maybe because they were primarily used for large, display settings. Or maybe because of some style grounds. Anyway, since grotesques are also children of that time, they follow that fashion.</p>
