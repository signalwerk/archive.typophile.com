      <p>I have one other question. The fonts from Linotype may look funny on the screen. But a post in this thread noted that the same font would line up properly if more advanced screen display software, which cost money, was installed. But the same font. If I understood the post correctly.</p>
      <p>Now, if those fonts don't produce bad spacing when one uses them to produce printed output on a laser printer, or a .PDF file - the "end product" where quality is critical - then the fact that things look funny in on-screen previews is something else that might be deemed inconsequential.</p>
      <p>On top of the previous point that I raised, which is that the typeface Helvetica is so popular that many people will have the cheaper imitations instead of having purchased the original face. (Also, a lot of Helvetica-based typography just doesn't use italics, with bolding preferred for emphasis, if I remember correctly.)</p>
      <p>So there may be other explanations besides people not caring.</p>
