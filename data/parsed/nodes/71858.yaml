      <p>/Erode{ 11.5 dup ... dtransform ...)</p>
      <p>Sorry, not correct. I have checked again:</p>
      <p>Helvetica Oblique used this font matrix equivalent to 12 degree slant:</p>
      <p>/FontMatrix [0.001000 0 0.212557E-3 0.001 0 0] readonly def</p>
      <p>The oblique font embedded the normal font with this matrix:</p>
      <p>/FontMatrix [0.001 0 0 0.001 0 0] readonly def</p>
      <p>And Helvetica Narrow Oblique used this distorted matrix:</p>
      <p>/FontMatrix [0.00082 0 0.000174297 0.001 0 0]  def</p>
      <p>Helvetica Narrow Oblique was generated internally by the normal font, i.e. by Helvetica Roman as the upright font. The distorted font matrix slanted and squeezed the normal Helvetica font.</p>
