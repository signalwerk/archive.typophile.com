      <p>Typodermic:</p>
      <p>I think you could fix the bug <strong>in less than one minute</strong> by copying the correct font metrics values from the correct PostScript font to the defective OpenType font.</p>
      <p>Correct PS T1 font: LT_51251.pfb, LT_51251.pfm, LT_51251.afm<br>
      Defective OTF font: HelveticaLTStd-Obl.otf</p>
