      <p>Not wanting to rake over old coals, but it seems like this might be the best place to put the following question: are Helvetica Neue's numerals too short?<br>
      Our typesetters have just put a zero into a postcode; it looked too small at certain zoom levels, but I know Acrobat can deceive, so I zoomed in as far as possible and used a dialog box as a ruler (also printed it out and measured that): the zero and the four are definitely <em>just slightly shorter</em> than cap height - the zero should at least be taller than the four, surely. Seems a bit odd to me.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/helvzero_6294.JPG"></div><p></p>
