      <p><cite>Although Helvetica oblique has been available in all PostScript printers for more than 25 years and therefore is one of the most often used fonts ...</cite></p>
      <p>No need to get all upset about this ... Originally (as in "25 years ago", though I have a feel that's a bit exaggerated), PostScript printers such as the lauded LaserWriter had precious little memory. And a very large part of it was desperately needed for full-page rasterizing, so its programmers came up with a couple of shortcuts. One of them was the "Helvetica Narrow" trick, which has haunted software writers ever since -- only recently, even Adobe's own InDesign. The other one was obliqueing Helvetica and Courier (which was even further humiliated by having its strokes thickened for a faux-bold version, and then double that for faux bold italics).<br>
      Since then, available memory has increased and computers became much faster. No need anymore to distort a perfectly good Helvetica.</p>
