    <p>One of the most striking peculiarities of font users is the fact that most font users do not care about the most elementary quality requirements of fonts.</p>
    <p>Have a look at this picture:</p>
    <p><a href="http://www.sanskritweb.net/temporary/Helvetica-oblique.gif" title="www.sanskritweb.net/temporary/Helvetica-oblique.gif">www.sanskritweb.net/temporary/Helvetica-oblique.gif</a></p>
    <p>Although Helvetica oblique has been available in all PostScript printers for more than 25 years and therefore is one of the most often used fonts, no font user ever noticed nor cared that the accented and non-accented letters have different side bearings with the consequence that Helvetica oblique is unusable for quality composition in languages with accented letters, e.g. French, German, etc.</p>
    <p>A font user may be compared with a person who does not notice nor care that the black string on his left shoe differs from the white string on his right shoe.</p>
