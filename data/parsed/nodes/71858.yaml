    html: |-
      <p>Dave,</p>
      <p>Remember the bad old days of 256k limit? Remember that the early digital type was taken from the original drawing for metal type?</p>
      <p>There were reasons like:</p>
      <p>• You didn't have enough slots for multiple sets of figures and Expert sets were but a small portion of the pie;<br>
      • Better to then have one figure size as a compromise than no boat in the water;<br>
      • Legacy drawings were ready to go compared with all the corporate decisions needed to add more;<br>
      • The first one to jump the pond wins! Meaning LinoType/Adobe were quick-off-the-mark with ready to roll accepted and proven favorite types, which would maintain continuity with what users already were accustomed to;<br>
      • "Do it now" was better than "Should have done it and missed the gravy-train years" of selling type. Business decisions drive business, not best practices.</p>
