      <p>dtw:</p>
      <p>If you use Arial, "4" and "T" will have the same caps height, but "0" (= zero) is higher than "4" and "T", due to overshoot (the top of "0" is rounded).</p>
      <p>If you use Neue Helvetica, "T" is higher then "4", and "0" (= zero) is a high as "4".</p>
