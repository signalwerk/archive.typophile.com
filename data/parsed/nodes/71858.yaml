      <p>What do people do, when they find out that when they use Helvetica to print something in italics, that the accented letters aren't spaced properly on both sides?</p>
      <p>I would have thought, like Uli, that at least some licensors of that font would have complained to Linotype by now, and Linotype would have fixed the problem. After all, Helvetica is a very popular typeface. So, whatever one may think of Uli's posting history in general, it seems like he has a very valid observation this time: either Linotype doesn't fix bugs, even when its users are screaming bloody murder... or nobody seems to care. This is pretty fishy.</p>
      <p>However, there is one possibility. Let's imagine that, instead of Helvetica from Linotype, it was Dutch 801 from Bitstream that had this bug. Dutch 801 happens to look just like Times Roman. Times Roman is a really popular typeface.</p>
      <p>What would happen, then, if someone bought Dutch 801 from Bitstream (or got it included with WordPerfect or Corel Draw), and experienced this shocking bug? Why, he would just use Times Roman as included with both the Windows operating system and OS X for italics in future!</p>
      <p>Hello, Arial Italic. Hello, Swiss 721 Medium. Hello, Nimbus Sans.</p>
      <p>Maybe Linotype hasn't been selling too many copies of that particular font, even if other fonts for very similar typefaces are selling like hotcakes.</p>
