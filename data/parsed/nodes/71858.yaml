      <p>Muckraking is an honorable profession, though widely reviled. It's worth noting that although as the saying goes "You attract more flies with honey than vinegar," many muckrakers eschew honey because they are too angry about the subjects they're writing about. Uli falls into this pattern. This approach loses him a certain percentage of his potential audience, who are put off by his tone and manners.</p>
      <p>Nevertheless, the issue he is highlighting certainly does merit some public discourse, especially on a site dedicated to typographic quality. If there were even one remarkable thing about this topic, it would be worth discussing, but there are a handful: (1) that the sidebearings of the accented characters are off, (2) that the slopes are off, (3) that the unaccented characters, if their slope is adjusted, still does not match the distorted characters, which suggests (4) that the accented characters were inserted from a different font rather than created directly from the unaccented characters, (5) that these defects in this most popular and most publicly discussed typeface have nevertheless not been part of that discussion, and (6) that Linotype did not repair these embarrassing problems the moment they learned about them.</p>
      <p>Uli mainly goes wrong in overgeneralizing his conclusions.</p>
      <p>Certainly, it is disappointing that vendor response to these revelations has been inconsistent, but Uli's argument would be strengthened if he were gracious enough to acknowledge and praise Adobe for their progress. Even if he wishes the main page were also adjusted, even if he wished they'd dealt with it sooner, even if he wished they'd never offered a defective  font in the first place, the fact remains that the improvement they've made is a step in the right direction, and it is basic good manners for anyone, let alone muckrakers, to praise the good as well as condemn the bad, lest they come off as merely bitter and aggressive. Still, his reaction doesn't change the validity of his initial observations. Had Uli expressed his reaction to the vendors as disappointment rather than calling them dimwitted, we would be hard pressed to disagree.</p>
      <p>Likewise, it is disappointing that after so much has been publicly said about Helvetica, these clumsy flaws would nevertheless have remained largely undiscussed. For example, compare how much more attention has been paid to the degree to which Arial's design is copied directly from Helvetica; that has been a widespread Internet meme, a topic for countless articles and blogs, yet these errors in Helvetica Oblique are more problematic since they actually damage the font user's ability to properly set text. Further, even Anglophones have had plenty of opportunity to observe these flaws, since we live in a multilingual world and often need to set words (including names) from languages that require those accents, yet we've missed it. We must set aside the idea that these are obscure problems that it would be unreasonable to expect educated font users to notice. Only those with no typographic pretensions at all would find these problems to be obscure, especially since in English grammar we set words and expressions from other languages in italic, which increases our odds of running into these problems.</p>
      <p>As much as I appreciate the loyalty of font designers toward their customers (actual and potential), I think we can all agree that the vast majority of font users are genuinely ignorant not only of the niceties of typography but of the basics as well. Had Uli expressed his criticism of font users in terms of widespread ignorance about typography rather than being "dimwitted," here too we would have found it difficult to argue.</p>
      <p>The challenge for us upon encountering Uli's observations expressed the way he did is to sift past his anger and our own reactions to it so we can focus on the real typographical value he's adding to this discussion. Aside from the namecalling, he's right. It is a typographically disappointing state of affairs that such clumsy errors could be found in perhaps the most famous typeface of the twentieth century, that so few people would notices, and that the errors would not be immediately acknowledged and removed by the foundry. If Uli feels outraged about this and wishes to express that emotion publicly, he's certainly welcome to.</p>
      <p>For my part, I feel more hopeful.</p>
      <p>First, Typophile is part of a typographic renaissance, a renewal of interest in good typography. Uli's muckraking on this and other issues is also a part of that renaissance, in which many of us are in our various ways breaking with some unfortunate practices of our recent past to try once again to achieve a high standard of typography. The disagreements, defensiveness, and taking offense occurring around these discussions are par for the course within any passionate community that sets itself at odds with common practice, and are ultimately not as important as our common goals and our progress toward them.</p>
      <p>Second, I see much improvement in recent years from foundries. The number of foundries dedicated above all to great typography is higher than in recent decades. Even the foundries who justly deserve criticism for their handling of the specific issues under discussion, such as Linotype's handling of Helvetica Oblique, have shown marked improvement. Consider how much more carefully designed and executed Optima nova is. One is unlikely to find any of Helvetica Oblique's defects in Linotype's Platinum series faces. Good, conscientious typography is no longer to be found only in a handful of superstar designers or isolated foundries.</p>
      <p>Certainly there remains more room for improvement.</p>
      <p>I'm sure we'd also like to see Linotype repair Helvetica Oblique, not just lavish their improvements on new font lines. But most of all, if we want to see the state of typography in the world improve we need to do something about the nearly complete lack of typographic education for font users. More than anything else Uli wrote about this issue, the complete absence of public notice of these defects in such a famous typeface is a sign of the times. We still have a long, long way to go.</p>
