      <p><em>But nobody does.</em></p>
      <p>If you are in business, it's not a good idea to criticize your competitors' products in a public forum.<br>
      You will probably have to rub shoulders with them at industry events.</p>
      <p>And then there is the "glass houses" thing -- nobody puts out 100% perfect products all the time, and criticism is likely to come full circle.</p>
      <p>As a font producer, the best thing is to set a high standard.</p>
      <p>So the "Ban Comic Sans" initiatives will have to come from Typophile font users, rather than Typophile font makers.</p>
      <p>But what can they do to remedy such snafus?<br>
      ("Snafu" is a WWII-era acronym meaning "situation normal all f*cked up")<br>
      I suspect they realize that there is little they can do to change the system, certainly not be merely complaining individually about what everyone knows is not a "quality" font in the first place, so why bother?</p>
      <p>If you want to change things, you have to organize and campaign, it's not enough just to bitch and whine, which will merely create a bad vibe and alienate potential allies.<br>
      If you don't want to change things, but just want to grandstand beating up on easy targets, because it makes you feel superior, well, that's the impression you give, and it's counterproductive to what you perhaps think you care about, because people will just dismiss you as a crazy hothead, and your cause along with you.</p>
