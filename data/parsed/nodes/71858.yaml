      <p>The "bug history" of Helvetica oblique and Helvetica bold oblique is hard to trace. In the PostScript language beginnings in the 1980s, the oblique versions did not exist at all as real fonts, but were generated by slanting the upright version to the right by 11.5 degree with this internal command:</p>
      <p>/Erode{ 11.5 dup ... dtransform ...)</p>
      <p>The bug-ridden OT versions of Helvetica oblique and Helvetica bold oblique are not these artificially slanted old PostScript versions, but someone tampered with the upright versions in a horrible way affecting the side bearings and the slanting angle as well, as correctly noted by Micha Mirck.</p>
    html_clean: |-
