      <p><cite>If Typophile users cared about the most elementary quality requirements of fonts, at least some of them would disapprove of what is depicted above.</cite></p>
      <p>It’s untrue, that nobody cares about those bugs. But Linotype generally does not care as much about the technical quality of the fonts as many much smaller foundries, especially not about the technical quality of the old fonts.</p>
      <p>If they are also available from Adobe and if they are really the same with regard to the number of glyphs (for example), which is not taken for granted, you should buy the Adobe versions. In case of Helvetica Oblique, available from Adobe, the side bearings are more consistent. The same is true for the hinting (in case of other fonts).</p>
      <p>Adobe even provides bug histories of some (if not all) of their fonts. Every foundry should do that. A simple list with the status of bugs and the version of the font, in which a bug was fixed. This requires correct version numbers. Many foundries don’t seem to care much about correct version numbers.</p>
      <p>Additionally I would expect to be informed per mail, when I licensed a font, for which an update is available. I think, this is also not a common practice.</p>
