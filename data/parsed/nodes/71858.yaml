      <p>Nick:</p>
      <p>There are numerous technically flawed fonts. Therefore it would not be worth the trouble to mention the technical flaws, e.g. the wrong side bearings, of any technically flawed font.</p>
      <p>But Helvetica is not ANY technically flawed font. Helvetica is the most widely used, the most widely bought and the most widely advertised sans serif font of the world.</p>
      <p>Therefore, it should be expected that, among those innumerable Helvetica font buyers, there is at least ONE font buyer who noticed that Helvetica accent letters have wrong side bearings. But nobody of these dimwitted font buyers ever noticed this technical flaw of Helvetica.</p>
      <p>Helvetica is also featured by special exhibitions. Therefore, it should be expected that at least ONE of these "font experts" who run Helvetica exhibitions, e.g.</p>
      <p><a href="http://www.helveticaforever.com/en/index.html" title="www.helveticaforever.com/en/index.html">www.helveticaforever.com/en/index.html</a></p>
      <p>should have noticed that Helvetica accent letters have wrong side bearings. But nobody of these dimwitted "font experts" who run Helvetica exhibitions ever noticed this technical flaw of Helvetica.</p>
