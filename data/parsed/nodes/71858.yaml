      <p>&gt; If you agree in what I wrote above, you admit, that fonts are software.</p>
      <p>Even if fonts were "software" (I will not embark on this preposterous discussion here), it should be remembered that Helvetica oblique was identical with Helvetica Roman in 1985, when Adobe claimed to have "created" Helvetica oblique.</p>
      <p>The slant was made by the word processor:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/Helvetica-oblique2.gif" title="www.sanskritweb.net/temporary/Helvetica-oblique2.gif">www.sanskritweb.net/temporary/Helvetica-oblique2.gif</a></p>
      <p>or by the printer driver or the distiller:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/Helvetica-oblique3.gif" title="www.sanskritweb.net/temporary/Helvetica-oblique3.gif">www.sanskritweb.net/temporary/Helvetica-oblique3.gif</a></p>
      <p>The "Side Bearing Feature" (SBF) was added later, when Linotype and Adobe "created" a "new" oblique version of Helvetica Roman thereby adding the SBF as a "Unique Selling Proposition" (UPS).</p>
