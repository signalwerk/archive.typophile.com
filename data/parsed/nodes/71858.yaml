    html: |-
      <p><cite>"many grotesques don’t have old style figures (anyone care to explain why?)"</cite></p>
      <p>Grotesques don’t have old style figures because old style figures don’t work well when drawn to the proportions of grotesques. Old style figures need more space below the baseline than the short descenders of grots commonly allow. And because grots have always been common in advertising it’s been more important that they have figures appropriate for all caps settings than for book typography.</p>
    html_clean: |-
