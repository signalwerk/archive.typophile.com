    <p>Hi,</p>
    <p>I am designing a logo and would like to test it with a couple of fonts I don’t own yet.<br>
    I was wondering if it is legal to use font previews (for example PNGs from fontshop) for testing purposes, and buy the font after deciding which one is more suitable.</p>
    <p>I would like to be able to show a Photoshop draft here for some critique, for example, to decide which font is more suitable.</p>
    <p>Thanks.</p>
