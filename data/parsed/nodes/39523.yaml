      <p>I think there are people that abuse the feature (I’m thinking people who make web graphics for their ebay store) and that’s probably why the public re-use of the bitmaps is not technically allowed. But if the images are being used by someone who intends to license the font then the vendor shouldn’t really object. Putting that into the terms of use of a Web site would be tricky - so I’m guessing this is another case of “turn a blind eye from the font guy”.</p>
      <p>Note that some sites (or foundries on distributors sites) use watermarks, stripes of give their previews a background color in order to prevent misuse.</p>
