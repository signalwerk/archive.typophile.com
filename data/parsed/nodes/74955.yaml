    html: |-
      <p>@Jos: Don’t know why, but Calluna Sans reminds me of Scala Sans, which I don’t like so much.</p>
      <p>I add also a comment on Calluna, which I am using at work. The typeface seems to be more comfortable when used in bigger sizes (18 points and more). At text sizes, I think it would need specific-designed version, accordingly spaced, and some of its details revised.</p>
      <p>As a display face the Light weight is among the more useful, so I think it should have a corresponding Italic, useful to set headlines with emphasis on certain words.</p>
      <p>As a final note: I am entirely in disagreement with Igino’s idea about "automatic kerning" (maybe it’s because we are both italian? :-) ). In fact, most of the problems I have found with Calluna (and some of the previous Open Source faces like Fertigo) is with spacing and kerning. To me, spacing is at times even more important than the forms itself, it’s part of the life of an alphabet.</p>
    html_clean: |-
