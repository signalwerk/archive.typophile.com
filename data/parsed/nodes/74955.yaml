      <p>"I feel sorry for you that you have to use Calluna at work."</p>
      <p>Why? It’s been me that used it for a comp and made my boss buy the license.<br>
      I made these observations since I have been using it (so far) mostly for pints sizes in the range 14-24, on pakaging graphics, but not in text sizes.</p>
      <p>Also, my reference to Scala was just incidental. I did not imply you were making references to it. I just meant that I don’t like Scala Sans, and so I’m not so crazy about Calluna Sans either.</p>
      <p>What I meant, mostly, about the design features of the Serif, is that to me they seem to become redundant or strange in smaller text sizes. But as you said, you should have a full book set with it to look at.<br>
      In general, if it was intended for book usage, I think it is too tightly spaced.</p>
      <p>And my comments on iKern are about how you consider spacing, not specifically addressing your use of it. I would never space or kern automatically. Space is a basic part of the design process, as I imply by observing that most of today "text types" are so tightly set that are "suffocating" in some way… :-)</p>
