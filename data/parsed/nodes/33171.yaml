    <p>So, I basically threw this together in an evening. It sort of reminds me of the very narrow type used in movie credits on posters, except a little wider.<br>
    I need to work on metrics a little (for example, L has too much space on the right).<br>
    I'm also still working on implementing diacritics, but before I do, I need some advice for Æ and Œ, which you can see at the bottom of my PDF. I created the first set by basically just sticking the letters together and adjusting where they connect. The second is opened up a little to help balance the counter. I think I like the second set better (certainly for Æ), but what do you think?<br>
    I haven't settled on a name yet--I always seem to come up with those at the very last.</p>
