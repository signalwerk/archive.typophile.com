    html: |-
      <p>I too thought the M might be too wide. Let's try something more narrow.<br>
      <a href="http://img.photobucket.com/albums/v629/WurdBendur/m_height.png" rel="nofollow">Here</a> I've made a series of Ms, starting with the original on the left. I narrowed so it's a bit more comfortable (It's still wider than the E, though, and I might try to narrow it a little more) and brought up the middle. I'm not sure how far to go, but I think you're right to suggest that it should go about 1/3 of the way down.</p>
      <p><cite>Maybe try the same thing with the W (I’m assuming it’s similar width to the M).</cite></p>
      <p>It's actually the same width (with a little less space), but the angles make it look narrower. It's a lot less obtrusive. It may be okay, but I'll <a href="http://img.photobucket.com/albums/v629/WurdBendur/w_height.png" rel="nofollow">experiment</a> with it anyway. I've done the same thing here as with the M, but also widened the base a bit because it started to look odd as I lowered the middle.</p>
      <p>As for Cyrillic, <a href="http://img.photobucket.com/albums/v629/WurdBendur/basic_cyrillic.png" rel="nofollow">here</a> is the full basic alphabet.<br>
      I usually like to distinguish the Cyrillic К from the Latin K, usually just by turning or hooking the arm, but this time I just let it be the same since I'm simplifying everything so much anyway. The Ж is just built from two of these back-to-back, but it looks a little wide this way.<br>
      I also considered making the Ф wider, but I'm afraid it'll become too big.</p>
      <p><cite>The spine of the S seems a bit too geometric. It could be more smooth.</cite></p>
      <p>Good point. I think there's <a href="http://img.photobucket.com/albums/v629/WurdBendur/geometrics.png" rel="nofollow">more than one solution</a> to this. I can keep it geometric and make it less horizontal, or I could really smooth it out. Either way, I think I need to adjust my proportions.</p>
      <p><cite>although that one has a little bump in it. :)</cite></p>
      <p>Oops. <a href="http://img.photobucket.com/albums/v629/WurdBendur/fixedg.png" rel="nofollow">Bump fixed</a> (on the left).</p>
    html_clean: |-
