      <p>I like the 6th and 7th Ms, and the last W, best. Have you tried sloping verticals on the M, so that it's basically an upside-down W? That sometimes looks good. </p>
      <p>I'd forgotten about the Ш and Щ, which are equally wide in Cyrillic. Perhaps you don't need to take them, and the Ж, down to as narrow as the rest of the characters, but I still think they will stand out somewhat in a line of text at their current almost double-width.</p>
      <p>I agree that the spine of the S is too horizontal -- I think it should be diagonal. </p>
      <p>Anyway, this is great work and I'm glad that my comments were helpful. </p>
      <p>-matt</p>
