      <p>This looks really nice.  I especially like the curve in the lower right of the G.  The second set of Æ / Œ look much better than the first.  </p>
      <p>I think the M is too wide. It stands out because it's about twice as wide as all the other characters. I'd make it close to the same width as the E, with diagonals at about 45 degrees which only reach down about 1/3 of the way from the top. Maybe try the same thing with the W (I'm assuming it's similar width to the M). I don't see the Cyrillic Ж, but that's also a wide character with the potential to stand out too much.</p>
