    html: |-
      <p>It’s easy. The source code on similicio.us references a css style sheet in this line:</p>
      <p><em> link href=”sim.css” rel=”stylesheet” type=”text/css”  </em></p>
      <p>So, simply add sim.css to the end of the url, like this:</p>
      <p><em>http://similicio.us/sim.css</em></p>
      <p>Then, find the “h1” style attributed to the font you’re looking for. </p>
      <p>Viola! </p>
      <p><a href="http://www.eileenburke.org">Eileen Burke Graphic Design</a></p>
