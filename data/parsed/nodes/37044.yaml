    <p>Hi there - im new to the ’font’ world, but am starting to gain interest.<br>
    I build websites on the side - and I was wondering if anyone could tell me the font <a href="http://similicio.us" title="http://similicio.us">http://similicio.us</a> uses as there logo font. I love the clean simple look - love the ’u’.</p>
    <p>Thanks in advance<br>
    ~Andy</p>
