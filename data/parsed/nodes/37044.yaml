      <p>True - and if no Trebuchet, then Arial Narrow and so on down the code: </p>
      <p><em>font-family:”Century Gothic”, “Trebuchet MS”, “Arial Narrow”, Arial, sans-serif;</em></p>
      <p>It’s also not a logo, by the way, but that’s a whole different discussion. </p>
      <p>Eileen</p>
