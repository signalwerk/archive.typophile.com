      <p>As for the point above by James: The audience varies for your first two posters, but I'm sure that the gaps will be filled while you continue the project, so that's not a big issue I think.</p>
      <p>I think an issue is still the quality difference. Your pictures are really crisp, shiny, studio shots. You need to come with something to offset this since the type falls flat. </p>
      <p>Go for the overkill (a waste of the good pictures), or underplay it. I think having a recurring layout theme instead of creating different ones for each poster will help. In the end, I suspect most people will buy the poster for the image and concept anyway. Perhaps have a small white tag in one of the corners with the title and 'perk', maybe even something logotype-ish.</p>
      <p>This will tie all posters together in the end, and at the same time make it a bit of a campaign for the merits of print, which is also what you want to achieve.</p>
      <p>My previous comment about the techniques is probably still valid, but I think your current approach will be the better solution the more posters you make, since then the classic techniques don't become quirky any more but boring due to repetition.</p>
