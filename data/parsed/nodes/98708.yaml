      <p>All right, let me address some of the comments.</p>
      <p>Firstly, yes, this is a project with a high degree of irony, and that's completely intentional. It is also a project with a sense of humor, and I hope that comes across, though it may be clearer in some of the zanier posters I have planned.</p>
      <p>5star — thanks for your critique. You're right about the second image needing rotation, and you're not the first to provide feedback about the lack of clarity in the first.</p>
      <p>The question of finish, as touched on by Arthus, is one that I've been debating from the start, and I'm not sure if I've made the right decision. This question has a lot to do with whether I see myself as making fine art prints or more commercial posters, and who the potential audience is — something I'm still working through. Certainly, the fact that the posters have a blatant point of view and a corresponding caption really put them more in the realm of pop art or even propaganda, which I don't necessarily mind, though I hope the absurdity of the whole endeavor softens the bluntness a little. I've thought about shooting some more lyrical photos just focused on the qualities of the electronic devices as objects, preferably on film. This is probably worth pursuing, and would lead to a series of images with a similar theme but very different tone.</p>
      <p>More thoughts are always welcome.</p>
