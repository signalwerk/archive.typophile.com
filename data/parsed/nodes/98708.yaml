      <p>Since cars get driven over cliffs for TV commercials, I'm not going to get too concerned about wastefulness here. </p>
      <p>Print has one obvious perk: physical books have value on the second-hand market; today's DRM technology doesn't offer the equivalent.</p>
      <p>And e-books have the advantage that you can fit a library in a pocket.</p>
      <p>People can make their own choices based on their rational self-interest; I'm not fond of the emotional manipulation techniques used in advertising <em>wherever</em> they are used, but their use in opposition to previous use by conventional commercial interests at least has the virtue of provoking thought and comment.</p>
      <p>So my response is guarded but positive.</p>
