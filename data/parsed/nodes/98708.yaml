    <p><strong>You can't die-cut a Kindle. Or can you?</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/die-cuts-typophile_4432.png"></div><p></p>
    <p>Inspired by, among other things, a recent Typophile thread about e-books, I've decided to show exactly what I have against them, by demonstrating all the tools that are available to a designer of printed, but not electronic, books.</p>
    <p><em>The Perks of Print</em> is a sardonic celebration of the printed word. In this poster series, I subject e-readers and other electronics to the same processes that produce beautiful printed books, and thereby destroy them in the process.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/maps-typophile_6285.png"></div><p></p>
    <p>See more at <a href="http://www.perksofprint.com" title="www.perksofprint.com">www.perksofprint.com</a>.</p>
    <p>As I will shortly be starting a production run of these prints, as well as a Kickstarter project to fund the creation of more of them, I'd like to hear some responses. Would you want a print? What would you pay for one? Do you have any perks of your own to suggest?</p>
