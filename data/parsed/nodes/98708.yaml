      <p>Quite interesting idea, but the finish...</p>
      <p>I really like the effort and tricks put into it, but your typography looks placed randomly. It's large, blunt, there is no tension between the picture and the type which makes it interesting.</p>
      <p>I don't want to be too negative, but your ideas could be worked out amazingly with a better finish. The Kindle composition is floating (even without the drop shadow!), sags downwards. The tea one looks like a tea commercial instead of a stand for the merits of print.</p>
      <p>Also, you overshoot your point, you make digitally what you dislike, isn't that a contradiction? I think these ideas could be so much better in real cliches, gravures or even better, cyanotype or other vintage photography mediums (no crappy, overdone instagram filters, but go back 100 years!). The pictures are just too 'finished' which makes it hard for the type to compete with it.</p>
      <p>I do want to see your other ideas and results though! Good Luck!</p>
