  html: <p>The new dingbat system 'Psychophante' will be available at <a href="http://www.kennmunk.com" target="_blank">www.kennmunk.com</a> from November 1st, costing 15 $, but mailing-list subscribers will be able to download it for free from October 23rd through to October 29th. Psychophante is a sequel to the bitmapped-crest dingbat 'Wappenbee'.</p>
  html_clean: <p>The new dingbat system 'Psychophante' will be available at <a href="http://www.kennmunk.com" target="_blank" class="link-external">www.kennmunk.com</a> from November 1st, costing 15 $, but mailing-list subscribers will be able to download it for free from October 23rd through to October 29th. Psychophante is a sequel to the bitmapped-crest dingbat 'Wappenbee'.</p>
