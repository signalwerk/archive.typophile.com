  html: "<p>A few months ago, I asked if anyone knew what font was used in Emriate's logo, but the only information seemed to be that it was a custom.  (If anyone knows, I would still love to know the font.) <br> <br>This time around, I am wondering if anyone knows the font used for their main type that can be found on this page: <br><a href=\"http://www.emirates.com/usa/index.asp\" target=\"_blank\">http://www.emirates.com/usa/index.asp</a> <br>(The \"About Emirates, Traveling With Us, Dubai\" etc.) <br>The most distinct letters are A, E, and Y. <br> <br>Thanks. <br>-Will</p>"
