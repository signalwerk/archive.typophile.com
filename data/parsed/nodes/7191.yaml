    html: <p>I believe this is a customed designed family of fonts simply called EK (the E likely stand for Emirates) as EK-Bold, etc. The lettering you're asking about is the same custom typeface but a lighter weight. Below is a larger version of the typeface. It was designed in house by their corporate communications design team. See <a href="http://www.sheikhmohammed.co.ae/Spanish/news/newsdetails.asp?NType=S&amp;NewsID=117" target="_blank">here</a> <br> <br> <img src="http://www.typophile.com/forums/messages/83/51409.jpg" alt=""></p>
