      <p>In Portfolio #1 from 1950 (you can see the scan of a facsimile in ALJ's post), it is referred to als <em>Albro,</em> short for Alexey Brodovitch. In the Brodovitch book by Kerry William Purcell (from which ALJ scanned the facsimile, I suppose), it is called <em>Al-bro.</em> Nico Schweizer's 1992 revival <em>Albroni</em> (released by Lineto) can be found here: <a href="https://web.archive.org/web/20191002022154/http://www.lineto.com/1.0/content_36.html">http://www.lineto.com/1.0/content_36.html</a></p>
      <p>Sorry for the late response. :-)</p>
