      <p>The caps are actually pretty original (if in a -necessarily- subtle way). Like your intuitive-but-unorthodox stroke weight distribution in the "M" is actually very refreshing, to me at least.</p>
      <p>A: too wide.<br>
      K: make lower arm darker than upper, not the other way around.<br>
      L: slightly too narrow.<br>
      R: join of bottom of bowl and leg unpleasant.<br>
      S: too top-heavy.<br>
      T: slightly too narrow.<br>
      U: bottom malformed.<br>
      Z: maybe too sharp.</p>
      <p>Nums:<br>
      2: spine too thick and maybe too stiff.<br>
      3: a charmer!<br>
      4: too dark.</p>
      <p>hhp</p>
