    html: |-
      <p>I actually think it's sufficiently distant from Frutiger,<br>
      certainly more distant than some other fonts out there.<br>
      For one thing, it has a nice warmth, due probably to the<br>
      soft finish, but also the variances in the terminals, etc.</p>
      <p>In fact the main "problem" that jumps out -the pervasive<br>
      wobbly outlines*- might actually be something to keep in<br>
      the end! It might add just the fauve feeling that a sans<br>
      like this needs so badly to be: attractive; and different.</p>
      <p>* Like see the right side of the counter of the "b".<br>
      But really almost everywhere.  :-/</p>
      <p>A macro thing: I would make the descenders a bit shorter.</p>
      <p>And lc micro stuff:<br>
      - "c": a bit too narrow.<br>
      - The eye of the "e" is a hair too big.<br>
      - The "f" and "t" are imbalanced - but again here this might be a good thing!<br>
      - "k": maybe a bit too conservative.<br>
      - "r": beak terminal a bit too out-of-character; try it like in the "s".<br>
      - "v": too wide.<br>
      - "z": too sharp.</p>
      <p>I might look at the UC and nums later.</p>
      <p>--</p>
      <p>I think you should think about what this needs to be, and I<br>
      have a feeling you'll actually uncover something very useful.</p>
      <p>hhp</p>
