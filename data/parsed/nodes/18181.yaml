    html: |-
      <p>The shape of the B is broken. The top bowl is unshaped.</p>
      <p>The lower half of the x is the same size as its upper half, what makes it look smaller, hence unstable. You should make the lower half bigger, and also make sure it’s at least as wide as the upper half.</p>
      <p>I think the form of the a doesn't match to the other characters. I think it is a bit too round at the belly.</p>
      <p>The e is too sharp at the right side. Nowhere else you got these sharp edges.</p>
      <p>U is too wide. You have to make it narrower than the H</p>
      <p>Here aresome advices for Form and Proportion in a Text Typeface<br>
      <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_7.pdf" title="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_7.pdf">http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_art...</a></p>
      <p>Greetings: Steven</p>
