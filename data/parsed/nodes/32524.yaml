      <p>The only actual fonts that come close to Missionary are by Lee Schulz:<br>
      <a href="http://www.themicrofoundry.com/other/schulz_1.gif" title="http://www.themicrofoundry.com/other/schulz_1.gif">http://www.themicrofoundry.com/other/schulz_1.gif</a> _<br>
      He used to have a site, but it seems to have been taken over by some leech.</p>
      <p>One of the few places you can see those fonts in action is in<br>
      “Alphabook: Typeface Design &amp; Application” by R Walton (1999).</p>
      <p>BTW, Simone, pardon the intrusion, but since you’re in LA:<br>
      <a href="http://typophile.com/node/30444" title="http://typophile.com/node/30444">http://typophile.com/node/30444</a> _<br>
      In case you or somebody you know might be<br>
      interested, the class will run again in the Fall.</p>
      <p>hhp</p>
