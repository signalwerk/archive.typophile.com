    <p>I’m looking for a font like Emigre’s Missionary:<br>
    <a href="http://www.typophile.com/forums/messages/83/Picture_1-34436.pdf" title="http://www.typophile.com/forums/messages/83/Picture_1-34436.pdf">http://www.typophile.com/forums/messages/83/Picture_1-34436.pdf</a></p>
    <p>Ideally, a little more readable. Light with flourishes. Any suggestions?</p>
    <p>thanks!</p>
