    votes: null
    html: <p>There is really nothing like Missionary, but it’s true that it demands to be used <a href="http://www.flickr.com/photos/stewf/162759231/">very large</a>. You might like some of the ornamented caps like <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=gill%20floriated">Gill Floriated</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=Scala%20Jewel">Scala Jewel</a>, or Wiescher’s <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=bodoni%20classic">Bodoni Classic</a>. And for unabashed embellishment, there are few more delightfully frilly than <a href="http://www.myfonts.com/fonts/canadatype/treasury/?refby=typographica">Treasury</a>.</p>
    html_clean: <p>There is really nothing like Missionary, but it’s true that it demands to be used <a href="http://www.flickr.com/photos/stewf/162759231/" class="link-external">very large</a>. You might like some of the ornamented caps like <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=gill%20floriated" class="link-external">Gill Floriated</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=Scala%20Jewel" class="link-external">Scala Jewel</a>, or Wiescher’s <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=bodoni%20classic" class="link-external">Bodoni Classic</a>. And for unabashed embellishment, there are few more delightfully frilly than <a href="http://www.myfonts.com/fonts/canadatype/treasury/?refby=typographica" class="link-external">Treasury</a>.</p>
