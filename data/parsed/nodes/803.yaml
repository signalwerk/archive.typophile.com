    html: <p>kris sowersby wrote <br> <br>&gt;an anyone recommend a decent typeface to portray a book about our local river? <br> <br> <br>Actually, my TF Bryn Mawr and Italic (8 weights) would seem to be a good choice. Fluid looking for display, it's also excellent for text. Including longish text. <br> <br>It can be seen at our online interactive typesampler, at <br> <br><a href="http://www.treacyfaces.com/sample.html" target="_blank">http://www.treacyfaces.com/sample.html</a> <br> <br> <br>and of course, purchased online here immediately and delivered to you by e-mail today. <br> <br>Depending on what you're trying to do with approachability versus austerity, my TF Simper might be good for the display material. <br> <br>My TF Overfield Bold Script might also suit the display matter well. <br> <br>Good luck! <br> <br>Joe <br> <br></p>
