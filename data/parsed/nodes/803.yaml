  html: <p>can anyone recommend a decent typeface to portray a book about our local river? (the Whanganui River, Wanganui, New Zealand,) The book will focus on both scientific and artistic issues, so I was thinking of a matching sans + serif to represent science + art respectively. At the moment I can only think of Scala and Thesis, but I know that there must be some Beautiful (unrelated) sans + serifs waiting to be married. Thanks a bunch.</p>
