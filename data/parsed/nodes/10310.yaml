    html: <p>Hmm... <br>To read the text I had to transfer it from MacOS X to MacOS 9. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Shortly, you just need a font supporting Cyrillic to read the text in Notepad. <br>Choose e.g. Times New Roman in Format/Font in Notepad. There is the Script combo box in the Font dialog. Choose Cyirillic. If there is no Cyrillic for Times New Roman then try other fonts or ask your client to send you a font. <br>Perhaps you will need to switch on Cyrillic support in Control Panels, I don't know. Cannot add anything more since I use Win XP which is more language-friendly than 2k. <br> <br>By the way, all that Cyrillic text above is readable in IE under XP with proper language settings except letter "ü" in 1 - </p>
