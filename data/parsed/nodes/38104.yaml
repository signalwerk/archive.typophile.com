    html: <p>Yes, Comic Pro is actually what it claims to be, a comic book style lettering font. Comic Sans is horrendous for many reasons, including that people think it is a "handwriting" font when it isn't, and that some people think it looks like a comic book lettering font, which it doesn't. There's basically no place where Comic Sans actually makes sense to use.</p>
