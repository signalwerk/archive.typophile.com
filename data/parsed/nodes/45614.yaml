      <p>I totally disagree. It has nothing to do with an easy pairing. You aren’t giving type designers any credit if you think that.</p>
      <p>I tend to use only a handful of foundries because I really trust their abilities. Does that make me lazy as a designer? I trust their designers to make the right choices about serif structure, encoding, kerning, etc. It is then up to me to choose. Sometimes I do choose a sans and a serif <em>because</em> they were designed to be used together and sometimes I don’t. I think it makes a lot of sense to design these so-called super families and they fulfill an important niche.</p>
