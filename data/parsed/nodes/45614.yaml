      <p>I have not taken a very close look at the new ’Frutiger Serif’ but I’ve been a fan of Meridien for a long time. There was a brief period abut ten years ago when, by chance, several books that I read in succession were all set in Meridien. I think its unfortunate that Linotype felt the way to market the new weights and styles was to rename the type to exploit the better known Frutiger ’brand’, since Meridien is a nice name, but if it gets the types more widely used, I won’t complain.</p>
      <p>I read many years ago about a custom newspaper face based on Meridien, but I never saw it and I don’t know if it was legitimate. Maybe we can look forward to ’Frutiger News’ from Linotype in future?</p>
