      <p>The job is always about the content, not about the type designer or graphic designer. When looking for pairings, let the text be your teacher and your eyes be your judge. It is hard for a type designer to anticipate all needs of all text. Type designers do their best either on purpose as in a superfamily or by accident when 2 different families happen to suit the job together perfectly. The graphic designer is the vigilant watchmen who does his best to represent the text or content in a suitable way. At least now choices are not limited by the library of the compositor you were forced to choose.</p>
      <p>ChrisL</p>
