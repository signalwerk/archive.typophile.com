      <p>My gut response was very similar to James’s. For the four years that I’ve been designing seriously and have had Meridien, I have been a huge fan of it. I have certainly enjoyed pairing it with Frutiger, and admittedly hold some pride in the fact that I know it makes a good pairing even though they aren’t branded as a Serif/Sans combo. So, it saddens me to see Meridien updated and renamed to follow the current trend for Serif/Sans super-families.</p>
      <p>But, the logic of people like Miss Tiffany seems to prevail in the end. I’m sure many people in the industry had similar gut responses when italics were added to fonts like Centaur, which were not originally designed with italics but had well known italic counterparts. Now we don’t hesitate to use Centaur Italic instead of Arrighi.</p>
      <p>Personally, I would have been more fond of carrying on the Meridien name, but as long as good type is proliferated and proper credit (and payment) is given where it belongs I have no problem with what the name is.</p>
