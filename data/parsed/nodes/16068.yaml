      <p>Eben, Tim you should like this song</p>
      <p>Song: Everyone Wants to Be An Art Director</p>
      <p>Sung by: Betsy Ross and George Washington</p>
      <p>Look at the colors you chose!<br>
      The best you could do, I suppose--<br>
      A peppermint stripe on royal blue,<br>
      The same as the British colors, too,<br>
      Now how will we tell whose side is who?<br>
      Look at the colors you chose!</p>
      <p>Why couldn't it have been puce?<br>
      Lavender over chartreuse?<br>
      Or possibly some exotic shade--<br>
      Delicate orange, mauve or jade<br>
      Instead of the choice that has been made?<br>
      Why couldn't it have been possibly cinnamon?</p>
      <p>Everybody wants to be an art director,<br>
      Everybody wants to call the shots.<br>
      Everybody wants to be a flag dissector,<br>
      Changing all my stars to polka-dots.<br>
      Everybody thinks that they're the final word on<br>
      What is strictly "out" and what is "in!"<br>
      How would you like a flag that features<br>
      ”Fleur-de-lys” on ochre corregated TIN?</p>
      <p>George Washington: I’d like it. How soon can you make one up?</p>
      <p>Betsy Ross: Come on, there’s your flag. Take it or leave it.</p>
      <p>George Washington: Alright. Say, what’s this little ticket here that just fell out, “Inspected by Number 28?”</p>
      <p>Betsy Ross: That’s me.</p>
      <p>George Washington: Oh, yeah.</p>
      <p>Betsy Ross: You want it on a hanger?</p>
      <p>George Washington: No, I’ll just run it up the flagpole, see if anybody salutes.</p>
      <p>Betsy Ross: Okay.</p>
      <p>George Washington: I guess it’s better than “Don’t Tread on Me.”</p>
      <p>Betsy Ross: Certainly. Besides, a hundred years from now, what the heck difference will it make?</p>
      <p>George Washington: I guess you’re right. (goes out the door) Come on, men!</p>
