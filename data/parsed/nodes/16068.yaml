    <p>Hello,<br>
    I've been a reader for quite some time, first time poster, however.<br>
    Anyway, I'm seeking feedback/critique/suggestions on this logo I'm creating for an industrial machine company in New England.<br>
    They are looking for something that says "patriotic" and "old New England".<br>
    I'm pretty happy with my work-in-progress, although I'm not quite sold on the font yet.<br>
    I've been a working designer for about 5 years, but I'm the first to admit typography is not my forte, although I am facinated with it, hense my interest in the Typophile site.<br>
    I guess what I'm looking for is "that perfect font" (hey, who isn't?!) to fit this situation. As I mentioned, it needs to say "old New England". Yet it also needs to be condensed, or at least very narrow, as  I'm happy with the proportions of the flag to the type as it is now.<br>
    Maybe my chosen font is okay? If so, feel free to say that as well!<br>
    As a point of interest, the flag I've created is basically a combination of the "unofficial" New England flags of the revolutionary period and our current US flag.<br>
    Please feel free to comment on the logo in general as well.<br>
    Thanks alot for your help!<br>
    Greg</p>
