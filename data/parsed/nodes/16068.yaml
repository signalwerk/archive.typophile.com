      <p>What about some wood type? <a href="http://www.myfonts.com/search?search%5Btext%5D=wood+type" rel="nofollow">A myfonts.com search</a> yields some interesting results. It has a slab serify, old world commerce, condensed look with lots of character but not too much. There will be a lot of Wild West-ish fonts, but you'll probably find something with enough strength and character to stand up and stand out.</p>
      <p>Also, another tack is going for the more American revolution, late 18th century historical look, but that might not give you the muscle and condensed look you need.</p>
