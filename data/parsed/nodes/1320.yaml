  date_raw: 18 Sep 2003 — 8:49am
  votes: null
  html: "<p>Recently a generous friend gave me a PowerMac 6500, with a 17 inch Sony Monitor, and an Apple Personal Laserwriter 320 (PostScript, 2 baby!). <br> <br>The system is in excellent condition, with: <br>- a clean install of Mac OS 9.1 <br>- 48mb of ram <br>- 5gig hard disk <br>- CD rom <br>- internal zip 100 drive <br> <br>it all works, too. very reliable! Even the laserwriter. Great output. It's all been underused. <br> <br>To me, this system just seems like a prime canidate for dedicating to font development. I'm a college student with very little money, and my G3 is overcrowded with junk as it is, so this thing is a godsend. <br> <br>Obviously, I can't run FontLab or even TypeTool on it, so i guess I'm on the look out for an older version of fontographer. (or FL?) <br> <br>What do you all think? Is this feasable? <br> <br>I'm a complete newbie to the type design world, so I'm staring from square one. I know Illustrator well, but that's it. Any suggestions, advice, or help on getting started would be great. I know very little about the mechanics of all this. Once I get things up and running I'll post some stuff over in the Crit. forum. <br> <br>Thanks! <br> <br>r.</p>"
  html_clean: "<p>Recently a generous friend gave me a PowerMac 6500, with a 17 inch Sony Monitor, and an Apple Personal Laserwriter 320 (PostScript, 2 baby!). <br> <br>The system is in excellent condition, with: <br>- a clean install of Mac OS 9.1 <br>- 48mb of ram <br>- 5gig hard disk <br>- CD rom <br>- internal zip 100 drive <br> <br>it all works, too. very reliable! Even the laserwriter. Great output. It's all been underused. <br> <br>To me, this system just seems like a prime canidate for dedicating to font development. I'm a college student with very little money, and my G3 is overcrowded with junk as it is, so this thing is a godsend. <br> <br>Obviously, I can't run FontLab or even TypeTool on it, so i guess I'm on the look out for an older version of fontographer. (or FL?) <br> <br>What do you all think? Is this feasable? <br> <br>I'm a complete newbie to the type design world, so I'm staring from square one. I know Illustrator well, but that's it. Any suggestions, advice, or help on getting started would be great. I know very little about the mechanics of all this. Once I get things up and running I'll post some stuff over in the Crit. forum. <br> <br>Thanks! <br> <br>r.</p>"
