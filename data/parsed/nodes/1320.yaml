    html: "<p>For and old tech/low cost solution you could downgrade to System 7.x and load RoyalT Apple's TrueType editor. I don't know anything other than it's free. I was thinking about doing this to an old PowerBook 1400 of mine as a lark/experiment, but haven't gotten around to it yet. <br> <br>RoyalT is here: <br><a href=\"http://developer.apple.com/fonts/Tools/index.html#Editors\" target=\"_blank\">http://developer.apple.com/fonts/Tools/index.html#Editors</a> (you'll need to scroll to the top of the page and accpet the license in the first paragraph to download it) <br> <br>If you don't have System 7.x disks or CD then System 7.5.3 is here: <a href=\"http://www.info.apple.com/support/oldersoftwarelist.html#system\" target=\"_blank\">http://www.info.apple.com/support/oldersoftwarelist.html#system</a> (you'll need to scroll down a little from the place on the page that this link lands you). <br> <br>Let me know how it goes if you decide to (go insane and) do this. <br> <br>Jon</p>"
