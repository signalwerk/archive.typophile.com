    html: |-
      <p>If you are just looking for a font that can reproduce this lettering that's a different problem than if you are trying to identify this type from 1969. With no lower case and a limited sample of upper case, it's perhaps easier to find something just to match these letters. My candidate from a quick search would be <a href="http://new.myfonts.com/fonts/okay-type/alright-sans/" rel="nofollow">Alright Sans</a> from Okay Type. It seems to have a good 'generic' sans feel and it comes in a wide range of weights.</p>
      <p>- Mike Yanega</p>
