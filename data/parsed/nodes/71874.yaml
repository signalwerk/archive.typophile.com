    html: <p>Gothic 720 is what Bitsream calls the <a href="http://new.myfonts.com/fonts/adobe/monotype-grotesque/?testdrive=seed%3D0.502695674309507%26dock%3Dfalse%26size%3D72%26w%3D720%26src%3Dcustom%26text%3DDALSRBTENGL%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga" rel="nofollow">Monotype Grotesque</a> series, and I would say that's what it is (Bold, specifically). It was very common in England back then. The difference in appearance is probably due to the way it was reproduced (molded in relief and painted), so it seems to have lost a bit of weight.</p>
