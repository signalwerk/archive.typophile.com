  html: |-
    <p>The best I can come up with is ordinals, but I can't find an common unicode naming convention for these particular chracters. Let's see, they're four glyphs comprised of two superior capital characters with a large undescore... and I still don't know how to name them. </p>
    <p>Can someone help me include them into my typeface properly?</p>
    <p>-numan</p>
    <p>(I am refering to the black segments of the image--the gray is to show intended usage)</p>
