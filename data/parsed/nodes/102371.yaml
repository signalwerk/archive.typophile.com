  html: |-
    <p>I'm happy to announce that MyFonts released my font family <em>Gryffensee</em> today. It features extensive language support including Cyrillic, and comes with a 25% introductory sale.</p>
    <p><a href="http://www.myfonts.com/fonts/catharsis-fonts/gryffensee/" title="http://www.myfonts.com/fonts/catharsis-fonts/gryffensee/">http://www.myfonts.com/fonts/catharsis-fonts/gryffensee/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/G_promo_small_6665.png"></div><p></p>
    <p>Thanks to everyone who gave me feedback here on Typophile!</p>
    <p>Enjoy!</p>
