  html: <p>I seem to have gotten myself into a bind on a popular Mac forum. <br> <br>I posted the "Chalkboard vs Comic Sans" argument. The consensus was that Chalkboard is better than Comic Sans. However, I proposed that Apple could have bundled a better handwriting font that would do the same job as Comic Sans/Chalkboard. <br> <br>What would such a font be?</p>
