      <p>There are many ways to make a font, and your approach seems just fine. It is not uncommon to have several iterations, but better focus on design first.</p>
      <p>Some people start with sketches which they convert to a font and then refine it with a professional font editor. It seems you've already made a pretty basic set of glyphs in AI so, you can immediately import them into your font editor. If you need changes to your glyphs, either do it in your font editor or copy-and-paste them back into AI.</p>
      <p>Let your font editor generate the accented characters. Adjusting metrics is one of them most important things, but don't spent to much time on it until you are satisfied with your basic character set. <a href="http://www.high-logic.com/font-editor/fontcreator.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FontCreator</a> has optical metrics which generates excellent metrics.</p>
      <p>When you are satisfied with your character set, and with the metrics, then kerning is next. Also decide what OpenType layout features you want to include.</p>
