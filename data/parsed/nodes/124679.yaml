    <p>So I've been working on typeface design beside my design studies. But I always had the question "what is the real process of type design from the beginning to the end" </p>
    <p>Can someone explain the order of all these to do list .</p>
    <p>• A-Z a-z characters (I always use Adobe Illustrator to draw these forms but I don't even know what professionals do. Should I start in Illustrator or directly work in Fontlab to draw first characters? Why?)<br>
    • Numbers and then punctuation glyphs<br>
    • Accent characters<br>
    • Adjusting Metrics<br>
    • Creating kerning groups (I have some knowledge about it)<br>
    • Kerning (I have some knowledge about it)<br>
    • Hinting (I actually have no idea)</p>
    <p>Second question:<br>
    Are there some nicely explained tutorials about the understanding kerning and hinting process?<br>
    Or extract the optical kerning data from illustrator which looks alright to me for now.</p>
    <p>Typefaces i'm working on</p>
