    <p>I'm not used to "prismatic engraved" fonts, fonts like that Goudy Handtooled (that the one that just poped to my mind) with some curves "removed" frome the plain body of glyph. I hope you understand what I'm trying to explain.<br>
    I'm looking for some fonts like that for a project and will really appreciate if you could help me starting out giving me well known (and maybe less) fonts of that kind so I can try searching around. I'm missing some vocabulary too, is prismatic engraved really apropriate words to usually describe those fonts ?<br>
    Thanks.</p>
