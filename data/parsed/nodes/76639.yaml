    user_path: null
    date_raw: 25 Nov 2010 — 1:06pm
    date: 2010-11-25T13:06:00
    votes: null
    html: |-
      <p>I usually run Font Validator iteratively, so that I can step back and fix any errors resulting from one tool before proceeding to the next, so:</p>
      <p>1. FontLat to .otf or ..ttf<br>
      2. Font Validator<br>
      3. Microsoft's Volt<br>
      4. Microsoft's Font Validator<br>
      [...possible other tools e.g. VTT for hinting...]<br>
      5. OTMaster</p>
      <p>VOLT doesn't update the OS/2 table macContext field when it compiles the GSUB and GPOS tables. Font Validator will report this as an error and will also calculate the correct value; then you can use OTMaster to update the OS/2 table.</p>
      <p>OTMaster can also be used to do things like add a format 14 cmap table if you have a font with Unicode variant selector codepoints. You can also copy and paste tables between fonts using OTMaster; I find this particularly useful if I have added glyphs to a font directly in VTT and then need to replace the post table with an updated one.</p>
      <p>The more tools there are in your workflow, the more useful a tool like OTMaster becomes.</p>
