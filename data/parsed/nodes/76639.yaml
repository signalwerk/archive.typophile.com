      <p>John Hudson.</p>
      <p>Is OTL Master 2.3 useful as a tool with MS Volt?</p>
  - id: 441209
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 24 Nov 2010 — 9:35pm
    date: 2010-11-24T21:35:00
    votes: null
    html: |-
      <p>Yes. OTMaster provides direct access to individual TrueType/OpenType tables, so it is especially useful for editing aspects of a font once one has progressed from a tool like FontLab to the .ttf or .otf as the source format, e.g. when using VOLT or VTT.</p>
      <p>If you run Microsoft's Font Validator test tool on a font after VOLT work, you may find some errors reported, including the maxContext field of the OS/2 table. These can be corrected using OTMaster.</p>
