      <p>You're welcome.<br>
      Can't get quite as close for "les allums du père Castor."<br>
      Don't know the date of your book, but if it was after 1948 the artist might have been familiar with Alessandro Butti's _Rondine_ for Nebiolo. Digitized by Rebecca Alaccari for Canada Type as _Bella Donna_<br>
      <a href="http://www.myfonts.com/fonts/canadatype/bella-donna/" title="http://www.myfonts.com/fonts/canadatype/bella-donna/">http://www.myfonts.com/fonts/canadatype/bella-donna/</a><br>
      Don</p>
