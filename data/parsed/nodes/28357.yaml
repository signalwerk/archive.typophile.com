    date_raw: 11 Oct 2006 — 11:09am
    votes: null
    html: |-
      <p>Highlights (no pun intended) were a flaming orange sunset we saw reflected like beacons off windows all over the East Bay, followed by a gigantic, near-full moonrise and the appearance of lights all over SF and East Bay hills. During the day, someone must have enjoyed watching Blue Angels scream around over the various boats in the bay; I don't care for the Blue Angels myself. </p>
      <p>Two of my sisters, several co-workers from Monotype, and several Bay Area typophiles came (among others), and there was a nice mix of literary, garden, swimming, foodie and type people in attendance. Turns out there were 4 new babies there, and I realized they were all my friend's babies (Delve and Jennifer brought flame-haired Donovan). We're getting them started early. ;)</p>
      <p>I don't have a lot of my own photos as my camera is useless in any light but full daylight, but if I get some from others I'll post them. I think Zara took some good moonrise shots. </p>
      <p>Maybe there will be more Bay Area type events....</p>
