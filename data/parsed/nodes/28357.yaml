    <p>Hi SF Typophiles,</p>
    <p>I'm at the end of the development process for Beorcana, my calligraphic sans text and display family (see <a href="http://www.beorcana.com">www.beorcana.com</a>). The fonts, in OpenType, PostScript and TrueType, should be available at <a href="http://www.fonts.com">www.fonts.com</a> sometime near the end of October. Meanwhile I'm preparing to celebrate. Won't you join me? </p>
    <p>Sunday October 8 I've got a beautiful space reserved for the afternoon/evening, and will have a keepsake type specimen poster available to guests, as well as refreshments and music. This event is co-hosted by Richard Schwarzenberger, who will be celebrating the publication of his first book of fiction, which is also typeset in Beorcana. Copies of the book will also be available.</p>
    <p>If you're interested in joining us, or if you're just interested in a small showing of the typeface, please contact me through the typophile contact form, give me your mailing address, and I'll send you an invitation/announcement. </p>
    <p>I'm very excited to finish this project and present it to you; It's been 14 years in the making. I hope you can attend. </p>
    <p>Carl</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/beorctease.jpg" width="550" height="551" alt="">
