    <p>Hi there folks, looking for some suggestions on a typeface. </p>
    <p>I'm mainly a web developer, but trying to up my design skills, especially in the typography department.</p>
    <p>Anyway, i'm going to brand a friends horse training company (no pun intended) and i'm struggling to find a suitable typeface.</p>
    <p>I'm not necessarily looking for definite answers (although suggestions are more than welcome), but some guidance on the process of choosing a typeface. </p>
    <p>Here are some words that fit with the identity we are aiming to achieve:<br>
    Established<br>
    Confident<br>
    World Class<br>
    Professional<br>
    Powerful<br>
    Experienced<br>
    Winners<br>
    Modern<br>
    Personal<br>
    Approachable<br>
    Trustworthy</p>
    <p>There is quite a mixture of feelings there, the reason i'm struggling to choose something is because Powerful and Modern suggest to me sans serif whereas Approachable and Personal suggest serif.<br>
    Apologies if my initial thoughts have offended any typogurus, like i said — i'm pretty new to thinking about typography.</p>
    <p>Thanks in advance for any help, appreciated.</p>
