    html: |-
      <p>I don't know that I'd stay away from the serifs.  Horse breeding, after all, is great and venerated tradition.  I think the history of the thing is much more difficult to conjure in a sans serif face. </p>
      <p>Take your cues from the animal itself.  Have you ever really LOOKED at a racehorse?  Beautifully arched neck, long delicate legs, aquiline, expressive head and face... serif, in other words. </p>
      <p>Some of the newly designed serifs are indeed strong and Modern.  Go to fonthouse.com. They let you test set type up to 288 points.  You can then print screen and paste up in Photoshop to get a better  idea of what you're looking at before you commit to purchasing a slew of fonts. </p>
      <p>Also, Google old horse racing ads to get an idea of the type styles used during the past century - that should give you an idea of how to start "seeing" them.</p>
      <p>Good Luck!</p>
