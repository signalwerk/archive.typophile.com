      <p>I take it that your client wishes to avoid using a traditional display font with Western/Cowboy associations like Broadgauge or French Clarendon.</p>
      <p>Helvetica (or Futura, or Univers) in bold italic comes to mind.</p>
      <p>There's also a heavy wide sans-serif I'm thinking of, but I can't recall the name off the top of my head, although Annonce resembles it.</p>
