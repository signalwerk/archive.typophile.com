  html: |-
    <p>Does anyone have ideas about fonts that are reminiscent/evocative of Wiener Werkstatte,  Josef Hoffman designs, early 20th-century Vienna, etc?</p>
    <p>This is for a jewelry designer who does pieces in that style. I looked at P22's "Vienna" fonts, which are very cool, but don't seem as "elegant" as this needs to be, or at least elegant as perceived by contemporary rich women buying jewelry...  ;-)</p>
    <p>What I'm hoping for is something between Art Nouveau and Deco -- early-modern, feminine, refined, sophisticated, "luxurious," etc.</p>
    <p>Thanks for any ideas you have...</p>
