    <div class="info">Submitted by <a href="/user/1085" title="View user profile.">dan_reynolds</a> : 12.Jan.2006 1.21am </div>
      <p><strong>Linotype’s LinoLetter for January 2006 – A Look Back at 2005’s Top Fonts </strong></p>
    <p>Check out the full version of this month’s newsletter at the Linotype website: <a href="http://www.linotype.com/8-38-8-19227/issue200601.html" title="http://www.linotype.com/8-38-8-19227/issue200601.html">http://www.linotype.com/8-38-8-19227/issue200601.html</a></p>
    <p><em>Content Preview:</em> Fresh fonts for the design year 2006 and an inspiring look back at the most-wanted fonts of 2005 await you inside this month’s LinoLetter. With Frutiger Capitalis, the newest decorative family from Adrian Frutiger, and Bickley Script, a smoothly elegant script face designed by Alan Meeks, we have two atypical fonts on display that are sure to enlighten the new year. Our brand-new High Noon Value Pack, a collection of first-class Wild West fonts, also leaves little to be denied. This edition also includes a glance at the chart-topping fonts from the past year – can you guess which typefaces our customers loved the most? Rounding out this month’s news is a peek into photos from the most recent birthday party of type legend Hermann Zapf.</p>
    <p><em>Announcing:</em> <a href="http://www.kitabat.org/">Registration has opened for the first major conference on Arabic Calligraphy and Typography in the Middle East.</a></p>
    <p><a href="http://www.linotype.com/8-38-8-19227/issue200601.htmll">Read the rest of the Linoletter at Linotype.com!</a> </p>
    <p>Or, <a href="http://www.linotype.com/webshop/newsletter.php">subscribe to the Linoletter</a>, and get the information delivered every month directly to your mailbox.</p>
