      <p>You could start with what <em>kind</em> of typeface you’d like to design, what kind of use would it have? For example one for display use? Or one for text? </p>
      <p>If for display; what kind of display, e.g. for example a signage face for use at airports? Or for roadsigns? Or maybe just for really large sizes in newspapers?<br>
      If for text; what kind of texts, for in a magazine, newspaper, book?</p>
      <p>You could give yourself a fictitious assignment to define these parameters. Maybe you have a favorite magazine or newspaper, imagine they have asked you to design a custom typeface for them.</p>
      <p>Another way is to just start sketching characters, see if something comes out of it, and go from there. The downside of this method is that you don’t have clear boundaries or a direction you can follow.</p>
