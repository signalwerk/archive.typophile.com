      <p>Thanks to FontLab to solved the problem. I really had two Q. They suggested to look at my vbf file in the Index mode and the second Q was there. How this happened I have no idea, but when I've delete it, I was able to work with the OTF preview menu. The second Q was'nt visible in the Name mode neither in the Unicode one.</p>
      <p>Thanks again  :^)</p>
      <p>André</p>
