      <p>Thanks Hrant.</p>
      <p>Results depending on many things, but I'll say only that we started selling fonts via MyFonts at the beginning, so they were the first and only place where you could bought our fonts. Later, we joined the other vendors and I'm pretty satisfied with everyone of them (except the one that's not on this list above, which turns out to be totally unsatisfying for us). New vendors needs time to get the audience, same as with new foundries. So, I wouldn't exclude any of those from the list as not satisfying or bad or anything... all of them are good for us in some points!</p>
      <p>(it is diplomatic answer, but it is really like I wrote, from our point of view)</p>
