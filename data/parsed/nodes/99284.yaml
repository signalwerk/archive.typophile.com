      <p>@Nick Shinn:<br>
      <cite>That was a tradition that ceased a long time ago!</cite><br>
      <cite>(Was Monotype/Linotype responsible?)</cite><br>
      <cite>Surely slanted brackets etc. in italic fonts should be considered traditional, and upright brackets historical.</cite></p>
      <p>I'm in favor of parentheses being sloped in italic fonts, and would find upright ones distracting under most circumstances. Linotype's duplexing might have not left enough room for parentheses to lean... but I would suspect that Linotype and Monotype are the ones that were responsible for the tradition of upright parentheses ceasing.</p>
      <p>It used to be that a font consisted of</p>
      <p>abcdefghijklmnopqrstuvwxyz<br>
      ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>
      0123456789<br>
      .,:;-/!?&amp;$</p>
      <p>and the opening and closing quotes</p>
      <p>and everything else was a sort, including parentheses. So upright parentheses were a foundry thing.</p>
