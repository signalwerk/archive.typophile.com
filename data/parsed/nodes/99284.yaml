      <blockquote><p>At Monotype for example there was the duplexing of Italic widths.</p></blockquote>
      <p>I think you mean Linotype?</p>
      <p>In the age of multiple typefaces from foundries/printers, parentheses etc. were generic sorts, right? So in that era upright parentheses etc. matched (or didn't match!) every italic in the same way, whereas leaning parentheses etc. would only coincidentally match the slope of a given italic since it would presumably vary from other italic typefaces. The almost-but-not-quite slope differentials might have been judged more distracting than pairing upright ones with the leaning letters.</p>
  - id: 536334
    user: 1250
    date: 2013-01-03T20:14:00
