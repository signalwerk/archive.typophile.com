      <p>As a side note -- I don't see a "book" or slightly heavier weight for Monotype Baskerville.</p>
      <p>Try this: Find a book printed with MT Baskerville from before 1950. That's what the type should look like, at least, if you think the folk in the drawing room at Monotype had any skill at all.</p>
      <p>Now find a current book printed (offset, direct to plate) set in MT Baskerville. </p>
      <p>Compare. Even better, scan in a few words from each, and do a side-by-side comparison on the screen at a large size. (Apparently how we evaluate type these days.)</p>
      <p>If I were King, everyone who selects typefaces would have to read Fred Smeijers' <cite>Counterpunch</cite> and study how the type designers evaluated their type by how it put ink on paper. That was how the letterforms weight and proportions were evaluated and adjusted.</p>
      <p>&amp; still on that King model, there would be both an oral and written exam...</p>
