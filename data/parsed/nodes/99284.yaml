      <p><em>traditionally correct to use roman brackets</em></p>
      <p>I would phrase this differently, and say simply that traditionally there is no such thing as italic parentheses, brackets or braces. These punctuation signs were always upright, and I doubt if one encounters slanted versions of them prior to the typewriter.</p>
      <p>When I was making the new types for the academic publisher Brill, I asked them specifically what their editorial style for these signs is in italic text. As a result, the Brill italic fonts contain upright ( ) [ ] { } appropriately spaced and kerned to the italic letters.</p>
      <p>There are instances -- particularly in the context of display typography -- in which I can see a graphical use for slanted parentheses etc., just as in such situations slanted arithmetic symbols can be useful. But the norms of these signs should be upright, regardless of the style of the alphabetics.</p>
