      <p>George, great find!</p>
      <p>To me it's pretty clear that upright glyphs in an Italic font were simply a result of not having slanted ones to use (for reasons of cost). We shouldn't turn that bug into a feature, especially since discriminating typographers in any era have gone to the trouble of doing it right.</p>
      <blockquote><p>That's what the type should look like, at least, if you think the folk in the drawing room at Monotype had any skill at all.</p></blockquote>
      <p>Well, I certainly agree they were skilled, but there are other factors (like cost and fashion) that can result in design decisions that we should no longer take. At Monotype for example there was the duplexing of Italic widths.</p>
      <p>hhp</p>
