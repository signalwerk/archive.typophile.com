    html: |-
      <blockquote><p>Doesn't the reader need to be pulled out it to realize that?</p></blockquote>
      <p>That's a good question/point. I guess we'd have to nail down what "pull out" means. To me it's a pretty dramatic thing - it means the reader stopping the reading process, even if only momentarily. This can happen when a shape (or more generally a pattern) jumps out because it's unexpected, and I think an upright glyph in a stream of slanted glyphs is such a case. What you describe ("indication that something is missing from the text") I think can be "read" without such a disruption in the reading process.</p>
      <blockquote><p>I think you mean Linotype?</p></blockquote>
      <p>Sorry, I've historically mixed up the limitations of each system... Please correct me if I'm wrong: Linotype was limited in terms of kerning (meaning overshooting sorts) and duplexing, while Monotype was limited in terms of width unitization?</p>
      <blockquote><p>leaning parentheses etc. would only coincidentally match the slope of a given italic</p></blockquote>
      <p>That's a good point, and I think you're right.</p>
      <p>However, parentheses being entirely curvy, might escape the sort of rejection you posit. Square brackets on the other hand would indeed pretty jarring if the slopes didn't match. But: more jarring than totally upright forms? Dunno. Consider the resultant looseness for one thing*. And I still suspect things like parentheses mostly only came in upright anyway.</p>
      <p>* John, you mentioned "spacing problems"?...</p>
      <p>hhp</p>
