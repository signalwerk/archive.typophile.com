      <p>Please ignore this post if you do not want to be dragged back in time into the previous century.</p>
      <p>The different version of logos in the past (IBM was mentioned above) had a lot to do with different scales of use, not just printing at different sizes. A (1) top-of-the-building sign visible from miles away, through (2) car/truck/plane decals down to a (3) business card or a post stamp. Then different considerations again: (1) not black, because it needs to be illuminated at night, but a black &amp; white line (no tone) version was needed for newspaper ads in letterpress. (2) not too much detail so it can be cut from vinyl or sprayed on with a stencil on 1000 trucks reasonably cheaply, (3) business cards and stationery were mostly printed in 1–2 colours, not full colour as often happens today.</p>
    html_clean: |-
