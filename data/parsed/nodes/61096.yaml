      <p>Initially is the key word here. I don't know how the company you are designing for works, but usually the logos/style sheets I get are requested by a marketer and sent to them from another marketer. Have you ever dealt with marketers? A lot of times they cannot understand the difference between vector and "grab it off the web", especially now that the internet is such a focus. Yesterday I was sent a .png at 6.2K to "pop" in an InDesign presentation.</p>
