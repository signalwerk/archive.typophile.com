      <p>Yes, No - depends on the logo. If the logo has lot of details in it, one must optimize it for the small sizes. But then one should always avoid too many elements (details) in a logo, and have only one version so that it reduces the chances of its misuse in the future.</p>
      <p>We (at Dalton Maag) made two versions for this logo* to make sure it works well also in the small sizes. You can see that all the thin strokes has been expanded a little in the second version so that they look same (optically) even at the different sizes.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GS_6594.jpg"></div><p></p>
      <p>*This is just for the example purpose - not the final artwork.</p>
