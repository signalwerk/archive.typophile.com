    <p>Strange question maybe but has been bugging me for a while: Does anyone ever make different optical sizes of logos – not necessarily the type, but the mark itself? And if not, why not?</p>
    <p>Background: I'm currently working on a logo (and I don't think I can post it at the moment, so I'd appreciate a discussion on the "theoretical" level) that needs some detail that makes it vivid at large sizes (think company car decal) but gets lost at business-card sizes (at least on my printer).</p>
    <p>So do you think there are any cogent reasons against making a "HD" and a "lo-fi" version of the same mark, one finer, the other more sturdy?</p>
