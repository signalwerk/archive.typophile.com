      <p>Cool! Thanks all. Just out of curiosity (and for my client), does anyone have any good examples? I must admit I've never seen this done and/or discussed – maybe just been living under a rock…</p>
      <p>CreativeNRG: Of course I'd agree, in principle, that logos are supposed to be scalable. BTW I would say that the logo in question works when scaled – no *crucial* detail is lost –, it just doesn't look its best at all sizes equally; and that got me wondering – if we're talking about the importance of optical scaling in type, shouldn't we accept its merits for logos as well – in terms of making the "HD" and the "lo-fi" version *optically* consistent/optimized instead of just mathematically scaled?</p>
      <p>Kent, in this case it looks like I'll be in charge of most (if not all) of their printed materials myself, and will also be advising them on use of the logo in other media, so I can luckily have an eye on proper usage.</p>
