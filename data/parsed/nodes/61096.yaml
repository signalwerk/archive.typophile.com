      <p>Hi Altaira,</p>
      <p>An obvious example seems to me the current trend of 3D-ifying logos and adding subtle beveling and gradient to imply a slightly rounded look.</p>
      <p>When used small, however, the '2D' or simply two-colour version can be used. For example, Apple's logo is this glassy blob thing writ large, but they can fall back on the simple silhouette Apple when using it small. Other examples include most car manufacturers (e.g. Ford, GM) and UPS have '3D' updated versions of their logos as well as the original '2D' versions. The extra detail does add some extra interest at large sizes. A Google images search will demonstrate any of the above examples.</p>
      <p>Whether you agree with the trend is another matter. I heard a (possibly made-up) story that UPS commissioned Pentagram to explore possibilities for an update on their classic logo by Paul Rand. They racked up the allocated number of billable hours but eventually came back to UPS and presented them with all the reasons that their existing logo was a classic and shouldn't be fiddled with. UPS paid them but then went to FutureBrand to get their current 3D-effect shield with cliched swoosh and rounded-ish sans.</p>
      <p>On a somewhat related note: 'How long should a logo last?' - Johnson Banks: <a href="http://www.johnsonbanks.co.uk/thoughtfortheweek/index.php?thoughtid=310" title="http://www.johnsonbanks.co.uk/thoughtfortheweek/index.php?thoughtid=310">http://www.johnsonbanks.co.uk/thoughtfortheweek/index.php?thoughtid=310</a><br>
      "Yellow Pages have cut the umbilical chord that held them to Futura and opted for one of those ubiquitous humanist soft sans serif solutions. Paradoxically, by opting to hit the more modern button they’ve traded long term stability for short-term refresh, but if that notches up a few better points in tracking, that may be deemed a success. There’s also a wry typographic twist there, as the typeface named after the future (Futura) is dumped for something of the present."</p>
      <p>H</p>
      <p>--<br>
      Henry Hadlow - <a href="http://work.dlow.org" rel="nofollow">Graphic Design / Art Direction</a></p>
