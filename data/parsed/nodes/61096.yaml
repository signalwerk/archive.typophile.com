      <p>The only aspect I've ever adjusted in a logo has been the size of the ™ or ® at a large or small size. One test I use during the design process is to make the logo an avatar size to see how it holds up. If you are losing important aspects something is wrong IMHO. A logo, by design, is suppose to be consistent and extremely flexible.</p>
      <p>Note: I will sharpen low-res bitmap versions intended for use on a website and will completely recreate 16px x 16px 'fav icon' sizes.</p>
      <p>Best of luck on your project.</p>
