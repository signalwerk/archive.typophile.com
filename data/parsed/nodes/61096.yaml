    html: <p>There is no way the same artwork can do for a 5-metre-high sign perched on top of a building, silk-screened on fabric, posted on a Web site, used as a favicon on the browser navigation bar, or printed on a business card. It’s obvious that you have to optimize the design—among other things, for size.<a href="http://clatikrsk.ru/" rel="nofollow"></a></p>
