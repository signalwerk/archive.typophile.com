    date_raw: 22 Jul 2014 — 9:14am
    votes: null
    html: |-
      <p>Most corporations I've done design work for don't have different versions for different sizes. </p>
      <p>Multiple versions sounds good in theory, but it complicates things and creates the possibility that vendors or employees will use the wrong version. </p>
      <p>Most employees can't even select the right fonts or colors, let alone pick the right logo version. And when working with an outside vendor they may send them the wrong logo version.</p>
      <p>I'd agree there are occasional instances where it makes sense, but most professional logos are designed to look good large or small, and are scalable vector files.</p>
