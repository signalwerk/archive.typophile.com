      <p>Thanks 'TerminalDesign' for proving that example. However, I'd expect most of the optical adjustments were made in the tiny versions in the third row.</p>
      <p>I'd like to clarify my previous point... Absolutely, you need to make those optical adjustments when you convert a vector logo (for print) into a very small bitmap logo (for web). To allow Photoshop to make your bicubic downsampling decisions for you would be insane.</p>
      <p>If the logo stays in a vector format with a minimum size I don't see the need for another version. The version used on a business card can be scaled to go on the side of a semi trailer.</p>
