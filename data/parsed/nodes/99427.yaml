      <p><a href="http://www.amazon.com/The-modification-letterforms-Stanley-Hess/dp/0910158037" title="http://www.amazon.com/The-modification-letterforms-Stanley-Hess/dp/0910158037">http://www.amazon.com/The-modification-letterforms-Stanley-Hess/dp/09101...</a></p>
      <p>In practice, I design the Regular weight ﬁrst, then <strong>draw</strong> Extra Bold by fattening up the Regular with various FontLab tools (some global actions, some cut and paste, <strong>whatever it takes</strong>). Then I draw the Thin as a stroked monoline (over the Regular in the mask layer). Then I interpolate the other weights between these three instances, with a ﬁnal manual clean up. Some people use the Superpolator app for interpolating, rather than Blend in FontLab.</p>
