      <p>Here’s a great <a href="http://typophile.com/node/38978" rel="nofollow">thread on the subject</a>, but sadly the images are gone. This place is falling apart.</p>
      <p>I like using a tool called Interpolation Nudge: For the x-direction I lock left edges and move right edges (uncheck “adjust sidebearings” and move everything to the left half the distance you added to the stems). The tool interpolates curves and points between what you lock and what you move. For the y-direction, I lock whatever points I want to keep in place, and move the what I want to move, often over several steps. This all ensures that I take as “much” from the white as I add to the black. In the end, the bold needs the same level of attention to design as the roman, but a method like this can help you see its relationship to the roman more clearly and function as a guideline for spacing and proportions.</p>
