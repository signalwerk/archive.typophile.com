    <p>Gross sales figures for Nick's Fonts from myfonts.com:</p>
    <p><code>Total downloads........103,999<br>
    Freeloaders.............69,482<br>
    Paid downloads..........34,517<br>
    OEM Sales..............$21,258<br>
    Total Revenue.........$515,448</code></p>
    <p>Of course, that doesn't include ITC, Monotype, SignDNA or Bitstream sales, either. No wonder no one wanted to make me an offer on the whole shooting match, or get involved in my “let's cooperate-and-share-the-wealth” scheme.</p>
    <p>So, anyone interested in a cool domain name and a killer ad concepts?</p>
    <p>I didn't think so…</p>
