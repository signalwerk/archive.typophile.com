    html: <p>How about the white symbol in the red “News” circle being some sort of star? (Probably need to be at least seven-pointed, to avoid any specific cultural associations. ✳) Which would associate with the idea of a news-flash. I certainly think the News one is currently working the least well. For Sport it’s logical that you have a green background, so perhaps choose (or draw) a ! that has a <em>round</em> dot at the bottom instead of a square one – to associate with the balls/pucks etc. inherent in so many sports.</p>
