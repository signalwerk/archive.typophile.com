  html: |-
    <p>Hi all,</p>
    <p>Some of you <a class="freelinking external" href="http://typophile.com/node/86011" rel="nofollow">may</a> <a class="freelinking external" href="http://typophile.com/node/83713" rel="nofollow">remember</a> <a class="freelinking external" href="http://typophile.com/node/83817" rel="nofollow">that</a> I'm editing a student newspaper in Scotland this year. </p>
    <p>Well anyway, here's my biggest sticky problem: creating definition between the sections of the paper. </p>
    <p>Taking notes from Monocle (<a href="http://monocle.com/" title="http://monocle.com/">http://monocle.com/</a>) and the New York Subway, I did these to differentiate between our four sections:</p>
    <p><a class="freelinking external" href="http://photos.moniker42.com/photos/i-8d4rq53/0/M/i-8d4rq53-O.png" rel="nofollow"><img src="http://photos.moniker42.com/photos/i-8d4rq53/0/M/i-8d4rq53-M.png"></a></p>
    <p>I like the views one, certainly, and the culture one has a story behind it. Not sure about news and sport though... anyone have better ideas? How could I tweak this to make them fit more nicely with each other?</p>
    <p>(P.S. the glyphs are Gotham Bold, which we use for signposting/page numbers.)</p>
  html_clean: |-
    <p>Hi all,</p>
    <p>Some of you <a class="freelinking external link-kept" href="/node/86011/" rel="nofollow">may</a> <a class="freelinking external link-kept" href="/node/83713/" rel="nofollow">remember</a> <a class="freelinking external link-kept" href="/node/83817/" rel="nofollow">that</a> I'm editing a student newspaper in Scotland this year. </p>
    <p>Well anyway, here's my biggest sticky problem: creating definition between the sections of the paper. </p>
    <p>Taking notes from Monocle (<a href="http://monocle.com/" title="http://monocle.com/" class="link-external">http://monocle.com/</a>) and the New York Subway, I did these to differentiate between our four sections:</p>
    <p><a class="freelinking external link-external" href="http://photos.moniker42.com/photos/i-8d4rq53/0/M/i-8d4rq53-O.png" rel="nofollow"><img src="http://photos.moniker42.com/photos/i-8d4rq53/0/M/i-8d4rq53-M.png"></a></p>
    <p>I like the views one, certainly, and the culture one has a story behind it. Not sure about news and sport though... anyone have better ideas? How could I tweak this to make them fit more nicely with each other?</p>
    <p>(P.S. the glyphs are Gotham Bold, which we use for signposting/page numbers.)</p>
