      <p>On my web site, I give a description of an imaginary programming language in which X ! was gamma(X + 1) but ! X was X * i, i being the principal value of the square root of -1.</p>
      <p>But I also included a quaternion data type in the language. So, if the character set available included the opening exclamation mark and question mark of Spanish, I used them as unary operators to multiply numbers by j and k.</p>
