      <p>Indeed, they were appropriately cautious when they noted in the article at</p>
      <p><a href="http://www.nzetc.org/tm/scholarly/tei-Har08Typo-t1-g1-t1-body-d1.html" title="http://www.nzetc.org/tm/scholarly/tei-Har08Typo-t1-g1-t1-body-d1.html">http://www.nzetc.org/tm/scholarly/tei-Har08Typo-t1-g1-t1-body-d1.html</a></p>
      <p>that by the year 2000 foundry type might no longer be in use. On the other hand, they were over-optimistic about the march of progress when they speculated that English spelling would be reformed by then as well.</p>
      <p>And while printing houses may be without types, they are not without presses or ink - even though laser printers do make that sort of thing possible, it is not usually the most economical way to proceed.</p>
