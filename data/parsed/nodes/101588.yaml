    html: |-
      <p>Interesting.<br>
      Let's say you install a type 1 font in the indesign fonts folder.<br>
      What would happen if you were to make an indesign document with that particular font, package it and send it to the printer?</p>
      <p>The printer would then have<br>
      - an Indesign document<br>
      - a 'Links' folder<br>
      - a 'Document fonts' folder<br>
      That 'Document fonts' folder would then contain the same type 1 fonts as you put in your indesign fonts folder. </p>
      <p>Would the printer then have to dig out those fonts, find the right fonts folder within indesign and put them there in order to make things work on his mac system?</p>
