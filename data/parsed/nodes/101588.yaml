    votes: null
    html: |-
      <p><cite> why then do windows type1 fonts work in Adobe applications on Mac?</cite></p>
      <p>Mac OS (X) can’t understand it, but Adobe of course knows its own font format and just continues to support it internally. If the fonts are placed in certain font folders, apps like InDesign will check those folders and then just make those fonts available as if they were installed. After all, Type1 was a rather simple font format. ;-)<br>
      Note this works only for PC Type1 on the Mac. I can't work the other way around, because of the way the Mac Type1 fonts were stored in the resource fork of the file.</p>
    html_clean: |-
      <p><cite> why then do windows type1 fonts work in Adobe applications on Mac?</cite></p>
