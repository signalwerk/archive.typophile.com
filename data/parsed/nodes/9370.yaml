    html: <p>I have been wondering the same thing; I used to have some links in my browser where I was studying, but we had a system changeover and five minutes before I asked for all my preferences and stuff back, they deleted it. I've been searching on and off ever since. <br> <br>Bastards! <br> <br>This thread, however, has just inspired my to create some of my own! My little brother wants some. <br> <br>So, I second your motion, David. <br> <br>Where can we find these?</p>
