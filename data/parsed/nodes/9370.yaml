  html: "<p>Hi, <br> <br>I am building a website, and I'm looking for a semi-transparent digital \"pattern\" to use as a background image. <br> <br>I have one example of such a pattern at the website listed below. Is there a specific name for these types of patterns? Is there a website or online resource that contains links to such patterns? <br> <br>Thanks in advance for your help, <br>David <br> <br>(The pattern is included at the bottom of the page, in a small strip: scroll all the way down and you'll see it. Thanks!) <br> <br><a href=\"http://www.bauhaussoftware.com/products_mirage_LP.php\" target=\"_blank\">http://www.bauhaussoftware.com/products_mirage_LP.php</a></p>"
