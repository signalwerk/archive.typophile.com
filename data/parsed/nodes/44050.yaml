      <p>Thanks Karsten and Thomas I learned a lot. After much trial and error and a generous dose of beginner's luck, I managed to name the four fonts so that they appear as four separate entries in both Word and in Adobe applications. Fake bolds are blocked in all cases.  I am happy with this result on my XP but doubtless there may be pitfalls in other situations so your feedback is welcome.  Refering to the letters in red in the figure (the one shown is for the bold) I compiled a table of the various entries and the result in Word and Adobe menus.</p>
      <p>In each case after filling items A B C L M I clicked "Build Style Name" then the rest of the names can be built automatically using the two diamonds shown. The numbers in (A) give the stem width of the font, and the ones in (L) reflect the weight increase, but I am not sure of their significance or   how they must be derived. </p>
      <p>I found that an important step to avoid errors is to go to the page "Additional Open Type Names" (not shown here) click the red X to delete any previous entries, then click the "FI" button to import names, then Apply/OK</p>
      <p><img src="/sites/default/files/old-images/AlQuds-naming_4523.jpg"></p>
