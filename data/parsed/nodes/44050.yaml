    <p>Hi. I have designed four weights of a new font family that I would like to appear in font menus with easily recognizable names reflecting their weight. For example</p>
    <p>1-MyFont Light,<br>
    2-Myfont Regular,<br>
    3-MyFont Semibold<br>
    4-Myfont Bold.</p>
    <p>Where the listed numbers are to simplify the discussion here.</p>
    <p>Font #3 should be the bold for font #1 in applications such as Word<br>
    Font # 4 should be the bold for #2 in applications such as Word<br>
    All four weights should be accessible independently in the various font menus of different programs.</p>
    <p>I have tried various naming schemes as suggested in discussions here and in the Fontlab MSN forums with little success. The name MyFont Medium seems to be generated automatically instead of the 'Semibold' for #3. Medium is an ambiguous term and it will not be clear to the user that it is heavier than 'Regular'. I even tried installing extra differently-named versions of fonts #3 and #4 to appear as the independent bolds, but that conflicted with the already installed 'linked' bolds. This occurred even when I replaced the word 'bold' in the extra font with another word. I would really appreciate it if one of the kind type gurus here could help me solve this problem.</p>
