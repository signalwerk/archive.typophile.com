      <p>&gt;&gt;&gt;Having the fonts “lie” about their usWeightClass is a little disturbing&gt;&gt;&gt;</p>
      <p>Thomas's sentiment is understandable. I imagine it would be like a biology professor  having one his students invent their own taxonomy for the family, genus and species of some specimen brought to the lab.  On the other hand what could be more disturbing than the "lie" of having a user press the bold button in Word and seeing text appear with smudged ungainly outlines instead of the crisp ones painstakingly designed by the typographer?  </p>
      <p>&gt;&gt;&gt;&gt;I believe there’s no good reason to punish savvy applications because of the limitations of typical Windows apps...[with fonts appearing] as a separate family in apps like InDesign, Photoshop and Illustrator?&gt;&gt;&gt;</p>
      <p>Agreed. In the naming experiment above (using Karsten's useful workaround for the Mac name), when a Word file using the four separately-named fonts was placed in IndDesign the Adobe application refused to recognize the AlQuds 240 Bold. But it worked when I renamed it AlQuds 240 Black.  I am sure other problems might also occur in other situations.  </p>
      <p>Perhaps the best compromise is to have the fonts named as two families, Light and Normal, with a linked pair of fonts Regular/Bold in each family, named in the standard way. Pity, it was so nice seeing the four fonts listed by weight in the menus. </p>
      <p>I console myself by thinking that users of Windows apps are less likely to be as font-conscious as those using Adobe apps. I mean that following this latest suggestion, Word displays only two font weights; the other two will only appear as 'true' linked bolds.</p>
