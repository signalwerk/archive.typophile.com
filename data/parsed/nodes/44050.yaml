      <p>It would help if you told us what font format you're working with, and what platform(s) you care about.</p>
      <p>Assuming that you include Windows on the list of platforms you care about, "you can't have your cake and eat it too."</p>
      <p>If you want to have the fonts linked as bold versions 1&gt;3 and 2&gt;4, then fonts 3 and 4 can NOT show up as separate fonts in typical Windows applications such as Word. Sad, but there it is. That's just how fonts work on Windows (at least in most Windows apps).</p>
      <p>If you pick which you're willing to sacrifice, (A) style linking or (B) having four separate font menu entries on Windows, then we can give you more advice.</p>
      <p>Also indicate what font format you're generating.</p>
      <p>Cheers,</p>
      <p>T</p>
