      <p>Having the fonts "lie" about their usWeightClass is a little disturbing to me, but these wouldn't be the first fonts to do so, I guess. Not a choice I'd make, but I can understand why Vladimir wants to try it.</p>
      <p>I really don't like the suggestion of just ignoring the OpenType names. That will cause the Windows-style names where every font is a separate family to carry over into OpenType. I believe there's no good reason to punish savvy applications because of the limitations of typical Windows apps. Do you really want every font to show up as a separate family in apps like InDesign, Photoshop and Illustrator?</p>
      <p>Regards,</p>
      <p>T</p>
