      <p><cite>I forgot to add another preference- that Word be prevented from generating its own “fake bolds”.</cite><br><cite>These covered linking pairs of fonts so I now need more information on listing the four weights as individual entries,</cite></p>
      <p>If you want to avoid fake bold in Word, the style-linked method is your only option. This would be scheme A in the PDF (page 5, left column).<br>
      Then, Word will show only Light and Regular in the font menu, while Semibold and Bold can be accessed via the Bold button. But you will see all four weights/styles in Adobe applications if you fill in "OT Family Name" and "OT Style Name" on the FontInfo's "OpenType-specific font names" page -- the "OT Family Name" should be the same for all four weights.<br>
      Can you fill in the names and then post screenshots of the first two FontInfo pages, or send a link to a download of zip'ed screenshots? I think it'll be easier to spot what went wrong.</p>
