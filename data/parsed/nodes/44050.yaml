      <p>Hello Thomas, I did not and would not suggest to omit OT names (the "OpenType-specific names" page).<br>
      I suggested to ignore the "Additional OpenType names" page which shows the future name table's content. This because if one forgets to refresh it after adjusting other Font Info pages, and if "Export only OpenType name records - ..." is selected in preferences/options, then former name strings will go into the name table rather than latest adjustments done in other Font Info pages.</p>
