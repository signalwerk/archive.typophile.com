    html: <p>Since this kind of typeface emulates a pen stroke of some sort, it could be expected a modulation in thickness inside a single letter (here most visible in the uppercase). However, looking at your images, the strokes of |p| and |i| are overall darker than those of |a| and |n|, for example.</p>
