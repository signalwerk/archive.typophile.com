  html: |-
    <p>Hello there! This is my font called FUSION SANS. The idea behind it was to pair up with the font called Sharik Sans (which is the font I used to write out Fusion Sans). It's main purpose is to be in body copy on packaging for the Fusion brand. I wanted it to look simple, readable, but still pleasing to the eye. </p>
    <p>Do you think it pairs well with Sharik Sans? If not, do you have any suggestions?</p>
    <p>What do you think about the spacing on my test words and do my letters work well together?</p>
    <p>Thank you all! </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FusionFont1_6428.jpg"></div><p></p>
