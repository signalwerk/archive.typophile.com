  date_raw: 6 Nov 2003 — 5:20pm
  votes: null
  html: <p>I've had this idea of creating a book that celebrates the art of opening titles in world cinema for a while now. The project is too ambitious to do all by myself, so I'm opening it up here to give it a chance to come to life as a collaborative effort. <br> <br>My plan is to focus in paricular on the power of the written word and its potential to evoke emotion, just by the impact of how it looks. I have collected screenshots of opening sequences and other material for years, with an emphasis on the immediacy found in handwriting / brushwork /  letterwork. I envision devoted professionals with a keen eye for the written word taking on particular chapters, that they feel an affinity to. <br> <br>Other ideas on how to proceed are welcomed as well...<img src="http://www.typophile.com/forums/messages/4100/19964.gif" alt="expressive letterwork on celluloid"></p>
  html_clean: <p>I've had this idea of creating a book that celebrates the art of opening titles in world cinema for a while now. The project is too ambitious to do all by myself, so I'm opening it up here to give it a chance to come to life as a collaborative effort. <br> <br>My plan is to focus in paricular on the power of the written word and its potential to evoke emotion, just by the impact of how it looks. I have collected screenshots of opening sequences and other material for years, with an emphasis on the immediacy found in handwriting / brushwork /  letterwork. I envision devoted professionals with a keen eye for the written word taking on particular chapters, that they feel an affinity to. <br> <br>Other ideas on how to proceed are welcomed as well...<img src="http://www.typophile.com/forums/messages/4100/19964.gif" alt="expressive letterwork on celluloid"></p>
