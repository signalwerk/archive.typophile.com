      <p>Thank you for all of the replies and suggestions. I can only hope to get the combination right and do justice to Zaner. Knowing its designer is watching—the pressure is on!</p>
      <p>Kent, thanks for the heads up on Relay and Bliss. Relay seems to have a great range and personality. Wondering if there is room to work with Relay, without copying or appearing ignorant of its use in the industry. </p>
      <p>Even though Neutraface is a large family, many layouts I see seem to gravitate to 3 or 4 faces. Suddenly it seems to be everywhere. Rightfully so, it is also a great font. Just curious, was it the use in House and Garden that has pushed it to the tipping point?</p>
