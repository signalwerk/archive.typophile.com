      <p>I hesitate to mention, if you haven't already realized for yourself: If Neutraface is ruled out because it's being used by another publisher, then you should know that <cite>Brides</cite> magazine uses Relay extensively. I hate to make the case against Relay, since it's a great magazine sans. </p>
      <p>Incidentally, <cite>The Knot</cite> uses Jeremy Tankard's Bliss, which is another Gill-ish sans.</p>
      <p>If you haven't already, you might take a look at Verlag (from H&amp;FJ: <a href="http://www.typography.com" title="www.typography.com">www.typography.com</a>.) A similar character to Neutraface, it might be a sympathetic companion to Zaner because of the relatively small x-height and long extenders.</p>
      <p>-- Kent.</p>
