    <p>Updating the look of a Wedding magazine. After using a combination of Sloop and Garamond for years, I thought it was time for a change. Settled on P22 Zaner for the script for titles and headlines, great ligatures and extended character sets, this is what drew me to Sloop. </p>
    <p>I had hoped to find just the right Sans Serif font to complement Zaner. Trying to find a family with the strong character and versatility of Neutra. Neutra is being used quite a bit by another publisher in the same region, so that is out. </p>
    <p>In some other threads, there is mention of Seria and a few others, but none have really clicked.</p>
