      <p>If you're keen on using Relay, by all means don't let me discourage you. I think there are plenty of overlaps in the wedding magazines market. <cite>Brides</cite> uses Relay with a mix of other faces. If you use a different mix, Relay could feel quite different. </p>
      <p>I would suggest you pick up a copy and take a close look at what weights and styles they're using. My recollection is that they tend to favor the Condensed styles for headlines. You could try leveraging a different aspect of the family and thereby get a different look.</p>
      <p>-- K.</p>
