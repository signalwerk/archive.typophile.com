    <p>I thought this might be an interesting (and fun?) exercise for all you symbologists(?) out there.</p>
    <p>I doodled 6 geometric patterns almost by accident. They can't be original and are probably all in a dingbat, crochet pattern book or cave painting somewhere. But anyway, because there are 6 of them and because they look a bit oriental i thought about associating 1 of the 6 elements in chinese philosophy to each of them, which are (in no particular order)...</p>
    <p><strong> earth  -  air  -  fire  -  water  -  metal  -  wood </strong></p>
    <p>After spending way too long pondering it I've still not totally made my mind up. Patterns within patterns, associations and abstractions etc...</p>
    <p>I'm curious to see if there will be any kind of consensus of opinion, or if you will all tell me to sod off and join an occult or theology forum.</p>
    <p>If you are gonna bother posting your matches just don't look at other peoples answers first if you can help it.</p>
    <p>BTW each pattern is numbered, just in case you hadn't noticed.</p>
    <p>I find them very appealing for some reason and thought about making them available as 6 small canvases (6"x6" obviously) maybe screen printed. (hence the photoshop mockup) Anyones thoughts on the matter are most welcome.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GeometricElements_5255.jpg"></div><p></p>
