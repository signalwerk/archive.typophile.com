      <p>Geometric Elements - The Result</p>
      <p>Firstly, thank you Tom, James, Tiffany and Simon for posting your choices.</p>
      <p>After you guys posted i persuaded 5 of my friends to give their opinions, plus me makes 10.</p>
      <p>I had hoped for a greater response, so the larger the sample group the clearer the consensus would be. Anyway, the results were...</p>
      <p>1: earth 3 / air 1 / fire 1 / water 0 / metal 5 / wood 0 (majority = metal)<br>
      2: earth 5 / air 0 / fire 1 / water 1 / metal 0 / wood 3 (majority = earth)<br>
      3: earth 1 / air 2 / fire 2 / water 1 / metal 1 / wood 3 (majority = wood)<br>
      4: earth 1 / air 3 / fire 3 / water 0 / metal 1 / wood 2 (majority = air/fire)<br>
      5: earth 0 / air 4 / fire 3 / water 2 / metal 0 / wood 1 (majority = air)<br>
      6: earth 0 / air 0 / fire 0 / water 6 / metal 3 / wood 1 (majority = water)</p>
      <p>It's interesting to see, even with such a small sample group, how opinions still frequently corresponded on something (apparently) so abstract.</p>
      <p>Here is my choice...</p>
      <p>1: metal<br>
      2: earth<br>
      3: fire<br>
      4: wood<br>
      5: air<br>
      6: water</p>
      <p>...which i don't think i'm being too fascistic in sticking with, as it only breaks from the democratic consensus by switching 2 of the elements which were fairly closely drawn anyway :)</p>
      <p>And thank you James for the link to the "Magician's Companion". I don't think i can resist getting a copy now. I would like to know what symbol and element associations the master, Bill Whitcomb, would make.</p>
      <p>Look out for the symbols on a t-shirt in your neighbourhood sometime soon ;)</p>
