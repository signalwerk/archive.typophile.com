      <p>I liked a lot Palatino, but nowadays don't think it reads well as text typeface. Some suggestions on contemporary text fonts with good readability:<br>
      <a class="freelinking external" href="http://www.typotheque.com/fonts/greta_text" rel="nofollow">Greta Text</a><br>
      <a class="freelinking external" href="http://commercialtype.com/typefaces/guardian" rel="nofollow">Guardian Text</a><br>
      <a class="freelinking external" href="http://www.typeculture.com/foundry/font_collection/font.php?ID=FNT09" rel="nofollow">Expo Serif</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/nonpareille/stuart-pro" rel="nofollow">Stuart</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/ludwiguebele/marat/" rel="nofollow">Marat</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/type-together/skolar/" rel="nofollow">Skolar</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fontfont/ff_celeste_ot_regular" rel="nofollow">Celeste</a><br>
      <a class="freelinking external" href="http://www.type-together.com/Athelas" rel="nofollow">Athelas</a><br>
      <a class="freelinking external" href="http://www.type-together.com/Karmina" rel="nofollow">Karmina</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/typejockeys/premiera" rel="nofollow">Premiéra</a></p>
