    <p>Hi all,</p>
    <p>I'm completing my research regarding corporate typography - especially custom creations <a href="http://typophile.com/node/27315" title="http://typophile.com/node/27315">http://typophile.com/node/27315</a> - and I was amazed that the same fonts come up all the time as branding tools.</p>
    <p>You know them - Helvetica, Univers, Frutiger, Futura, Myriad and the classic gothics (Trade, News, Franklin, ...) - used in close to half the cases.</p>
    <p>I asked a few graphic designers who work in branding why these same choices for very different companies and markets. Here are the main reasons: “I don't know where to learn about new fonts” and “I don't have the time or the care to browse around the internet.”</p>
    <p>My suggestion is that a newsletter - an email one that is - be created to advertise these new fonts. People could subscribe for free and font distributors would only pay a few dollars to show these new fonts. Simple technology, a name, a visual, a price and a where to buy. Better yet if it could be multilingual.</p>
    <p>What's your opinion on this?</p>
  html_clean: |-
