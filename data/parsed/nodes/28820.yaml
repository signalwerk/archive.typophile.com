      <p>I think a newsletter of this sort would be difficult to put together, because it really has to be independent. But even the MyFonts.com newsletters, which try to represent the broadest possible sources, are edited selections of new fonts—not all new fonts are featured, and sales rank seems to have a lot to do with choice. Although Laurence does write great copy for it.</p>
      <p>Typeface selection, even for branding and corporate identity, is still a very subjective matter. How does one make an objective newsletter about it that treats all interested parties fairly? Who writes it, and what is the source that it comes from? A "Typophile Newsletter" would be brilliant, because this site has credibility.</p>
