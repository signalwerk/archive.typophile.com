      <p>I have been itching to re-launch TypeReview.com and was thinking about some of these very issues.</p>
      <p>What if one could go to a web site that had a database of fonts and view the data in a variety of ways including RSS feeds *and* email newsletters. For example, one could register on the site and specify what categories of fonts were of interest, then receive a daily or weekly email listing new releases in just those categories. The listings would include a link back to the site for more information (such as ratings/reviews) and a link directly to the foundry or other appropriate vendor for purchase.</p>
      <p>The real trick would be populating such a database and making the effort to include as many foundries/designers as possible.</p>
      <p>Any thoughts on this approach?</p>
      <p>Regards,<br>
      tim</p>
