      <p><cite>What about if the positions are sold? For example, let’s say about 10 new fonts per week - more if more, less if… - the first position at the top of the list costs more, than the second, and the rest is at the basic price.</cite></p>
      <p>What's the motivation for a designer to read a newsletter knowing that foundries can pay for top billing? We already see their ads in magazines, get their bulk mail, and their emails. </p>
      <p>If I'm going to subscribe to a font mailing list, it needs to feature great fonts that are slipping through all the noise generated by advertising. Otherwise it just isn't going to offer anything new.</p>
