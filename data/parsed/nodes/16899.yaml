      <p>I agree with Lex that this was probably hand-drawn. The Curious George logo is a registered trademark of Houghton Mifflin Company publishers now. That would lead me to believe if there is a typeface, it is custom (based off the original illustration) and proprietary. </p>
      <p>However, with the <a href="http://www.curiousgeorgemovie.com" rel="nofollow">new movie</a> coming out next year (and the <a href="http://www.houghtonmifflinbooks.com/features/cgsite/" rel="nofollow">number of books</a> over the years) there might be something floating around out there that is similar / a knock-off.</p>
