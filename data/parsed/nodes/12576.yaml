      <p>Is the second one supposed to be centered? With the slant of the A, it's hard to tell. I like in the second one how the gap between the block and  ROB is closed. What does it look like when left-aligned, with the block almost as far left as it is in the first one, but with the amount of space between the block and the R from the second one?  Unless some of the letters start lining up strangely, that might be the best way to go.</p>
      <p>I think the wider A and squared O match the rest of the letters better. The S looks like it could be wider. The curved Y is great, I think, and gives it extra personality. The O though looks a little small. Since it's not a flat top &amp; bottom, it should probably crest above/below the cap height &amp; baseline.</p>
      <p>Are the grey lines part of the logo? Also, what is the dot in the block? I almost don't want to suggest this, but the more I look at it, the more it seems like you might be able to get away with just the letters...the block is very dark compared to everything else, and the letters are working very well by themselves.</p>
      <p>But without a logo, you always feel bad about charging someone for just letters. :)</p>
