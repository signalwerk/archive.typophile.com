    <p>My client (Robert Ayres) freelances as a stylist and makeup artist.<br>
    He also does his own photography, with focus on weddings.<br>
    He has used the logo icon  (which I created a couple of years ago) as<br>
    Ayres Creative,<br>
    Recently he has decided that it would be better to push his name (which as<br>
    a great reputation in the field). Business was re-named Rob Ayres (the "creative" was dropped).<br>
    I am revamping the old type work which was done using Lineto's Normetica<br>
    font (which I will continue to use in associaterd text).  I am thinking that in<br>
    fashion, simple sans serif in a light to medium weight and wide seems to works well.<br>
    I like to openness of the design, with the large counters, and alternates.<br>
    I am having issues with balancing everything, as well as choosing the best characters.<br>
    I have done several Y's (unicase and standard caps), target-shaped geometric O's<br>
    and an alternate O with has larger counter. There was alternates A's designed<br>
    as well. I will post my a few designs.</p>
