      <p>I realize I didnt' answer all your questions, so...<br>
      Second design is supposed to be centered (and aligned) in a "regtangular" formation and not the trapezoid as shown, but AYRES is too wide at this stage.<br>
      Block / Icon will be printed in metallic foil, so it will look seperate from rest.<br>
      Client paid for Logo over a year ago, it is just being re-used. Type treatment is new.<br>
      I usually charge extra for guilty feelings, but in this case there are none.</p>
