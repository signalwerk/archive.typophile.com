    html: <p>the foil printing is a nice touch-The first one with the "fun"y is the type of letter that bugs you enough to make you remember it and brings unique personality and contrast within the font. I think the logo should form a justified rectangle with the spacing between the icon and R as in the first logo. I understand that you are set on using the icon but I do have to agree with the previous post and you could(in the future) use just the type and maybee print foil just for the y or a die cut...I just like the y...it's a logo within itself!</p>
