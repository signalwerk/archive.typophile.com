    html: <p>Grey lines are from a grid I used and not part of the design. As for the O, I realize in most cases that "O"'s often more extend above and below beyond the x-height by 3-5%, and I may explore this as well. In a closely stagered formation as this is I suspect it will not work , but that is what experimentation is for. I have the files on another computer so I will upload some changes in the afternoon when I am working on that system.</p>
