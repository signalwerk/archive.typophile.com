    html: "<p>Q bothers me, the neg/pos thing - I think there could be a better solution for it that is in keeping with the rest of your forms.  <br> <br>the anti-serif thing (what would you call it?) on the top left corners is fun but I figure it needs to be consistant in shape,size and depth throughout.  <br> <br>I also feel that your pill shape that makes most of the counters should be the same in width, and then you could play with the positioning to make up contrast. Looking at the neg space of U,V,W makes it confusing to see what kind of transition in going on there: <br> <br>i.e.  <br>U,O,D,T don't seem to have any. <br>H,R,X,V,K seem to have it.  <br> <br>why e? <br></p>"
