  html: <p>Hello, <br> <br>this is my first typeface and it's based on the idea of cutting one shape out of another. I thought it would be a fairly simple typeface to start-off with because of this simplicity and I'm fairly happy with the results so far. I wanted the typeface to have a futuristic funk (a la Parliament, George Clinton, P-Funk etc) vibe to it. Something that would be displayed on the side of their Interstellar Time-Travellin' Funkmobile in the year 3030 (hence the name). <br> <br>I've found the typeface starts lookin pretty •••••• once you have more than 4 letters in the word which kinda sucks. I may just be paranoid though <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><img src="http://www.typophile.com/forums/messages/29/11560.gif" alt="Mothership Connection 3030"></p>
