  html: |-
    <p>I am looking for a list of OpenType fonts that include the Cyrillic character set. I haven't had any luck searching with Google, within FontShop or within MyFonts. </p>
    <p>I know that Adobe Garamond Premier Pro, Baskerville 10 Pro, Minion Pro, and Fedra have them (because I tested them on my computer). </p>
    <p>Seems there should be a list out there somewhere . . . perhaps on this site?</p>
    <p>Bonus question: will the Cyrillic set serve for setting Macedonian? I am setting a book of poetry with Macedonian/English en face.</p>
    <p>Thank you for your help.</p>
