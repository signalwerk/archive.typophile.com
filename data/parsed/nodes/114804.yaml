    <p>I'd like to design my own Walt Disney logo font, I have seen what <a href="http://www.dafont.com/walt-disney.font" rel="nofollow">currently exists</a> but I don't really like these, for example:<br>
    <img src="http://cjuices.com/wp-content/uploads/2011/11/waltograph.jpg"></p>
    <p>I'm hoping to stay accurate to the logo with the drawing instruments; would anyone kindly be able to offer some insight into the method of drawing this logo may have used, i.e. kind of pen or brush?<br>
    <img src="http://www.jesus-is-savior.com/False%20Religions/Wicca%20&amp;%20Witchcraft/disney2.gif"></p>
