      <p>While I'm sure that graphology is able to draw some accurate conclusions about a person, the point is that it is trying to categorise people based on what should be their most fluid and raw method of expression. Writing and the ability to communicate with an element of complexity is at the very core of what makes us human, and to try and compute that by examining letterforms and the direction of someone's writing almost trivialises it.</p>
      <p>Such analysis by the world around us of our personalities has led to a behavioural block common to nearly everyone who lives in society whereby we screen many of our inner thoughts and desires so as not to be judged by people. Handwriting analysis and graphology can only at some point, as it becomes more widespread (which I'm sure it will as company executives become more and more rabidly greedy for numbers and scientific evaluation which support the path of most capital gain with minimum risk), cause similar aesthetic blocks to form in our handwriting. Would anyone write with their true, natural handwriting if they knew that it would immediately become open to analysis? Indeed not, most would modify their handwriting to make it more reserved, or to mirror the qualities that society holds to be more valuable. After some time (though perhaps this is mere hyperbole), we will live in a world where everyone writes in near-perfect Courier.</p>
      <p>Graphology is like trying to scientifically evaluate emotion, or even creativity. A camera does not understand creativity when it takes a photo of an artwork. And graphology as an entity does not understand the element of creativity or beautifully raw and basic expression that exists within a person's handwriting. It is merely like a digital camera's CCD trying to break every element of the image into smaller parts which fail to entirely reproduce the whole image. What is the point of that? Not to mention that the metaphorical resolution of a graphology study is far inferior to that of a camera.</p>
      <p>It perverts the very nature of handwriting.</p>
      <p>Though I would still be very interested to read your findings, however opposed to the propagation of graphology I may be (and no offense intended at all).</p>
      <p>-Rafe</p>
