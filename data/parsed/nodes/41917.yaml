      <p>Typefaces have physical qualities, but these only represent human qualities in the way that they are used.</p>
      <p>For instance, ubiquitous default faces such as Helvetica come to represent conformity.</p>
      <p>But what to make of blackletter fonts, which can represent Christmas, Church and Venerable Authority (newspaper nameplates) on the one hand, and Nazis, Metalheads and Gangstas on the other? Multiple personality disorder?</p>
