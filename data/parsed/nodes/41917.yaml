    <p>I've been looking at Graphology (handwriting analysis) and seeing how it relates/compares to type and typography. I've made some very interesting observations, such as where the "i"'s dot is placed and what that says about a person. </p>
    <p>As designers we are always trying to pick the best suited typeface for a project and I'm exploring aspects that could possibly make a typeface feel the way it does.</p>
    <p>As my project has progresses I've noted that handwriting and typefaces are both essentially generated by the hand, by a person. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/type-vs-hand_4367.jpg"></div><p></p>
    <p>In order to take my project further, I've decided to look at typographers in comparison to their handwriting and their type designs.</p>
    <p>In order to do this I need to get my hands on handwriting specimens. I suppose I'm asking where I might find some, or if typographers could provide me with a scan (preferably on a white, unruled sheet with the edges of the page showing). This is a self directed senior grad project and I am really excited about the possible outcomes.  </p>
    <p>Should you have any ideas, comments or suggestions on the project I'm curious to hear what people think (this is obviously a brief outline, but one should get the main idea.)</p>
