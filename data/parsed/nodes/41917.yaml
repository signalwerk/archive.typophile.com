      <p>John Butler definitely knows where he stands regarding graphology;<br>
      he also brings up a good point regarding the legitimacy of the study. </p>
      <p>My project focuses more on interesting observations, not on proving<br>
      behaviors and personality types using graphology. It's a playful project.</p>
      <p>ah, the "i" dot.<br>
      First of all I should note the references I've looked at make it clear that you<br>
      have to consider the whole along with various examples in order to analyze<br>
      an individual's handwriting. That being said I'm looking at typefaces... </p>
      <p>The i dots supposedly says quite a bit depending on: where it is placed,<br>
      the shape, pressure and consistency.</p>
      <p>Having the dot very close to the stem indicates attention to detail and facts;<br>
      whereas, the higher it floats, the more imaginative a person may be. When<br>
      the dot is missing there is a degree of carelessness. When the dot is to the<br>
      left: procrastination. To the right: impatient, eager to move on. Dots that are<br>
      drawn in a circle, or any other drawn shape, show immaturity, and a desire<br>
      for attention. Light sweep: enthusiasm. Jab-sweep: irritable. Vertical line:<br>
      critical mind.</p>
      <p>I could go on, the explanations are all much more complicated than this,<br>
      but I'm trying to keep it brief and am sure you get the idea.</p>
