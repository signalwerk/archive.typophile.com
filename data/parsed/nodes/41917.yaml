      <p>Undotted ‘i’s <em>could</em> simply mean that you once had learned to write following an all-letters-joined cursive model, where the completing act of <em>dotting the ‘i’s and crossing the ‘t’s</em> is done in the very end –&nbsp;and therefore often gets omitted.<br>
      It also <em>could</em> mean that you once decided that you want to do without tittles, ‘just because it looks nicer’ or whatever.<br>
      Or that you had delved into Carolingian manuscripts and discovered that the old guys didn’t have a need for that early diacritic, so why should you? … etc pp<br>
      Nothing to do with character traits.</p>
      <p>Concerning type design:<br>
      Have a look at these threads to see what aspects type designers have in mind when it comes to the placement or <a href="http://www.typophile.com/node/28078?page=1" rel="nofollow">size</a> of <a href="http://www.typophile.com/node/17484" rel="nofollow">‘i’ dots</a>, <a href="http://www.typophile.com/node/9671" rel="nofollow">diacritics</a>/<a href="http://typophile.com/node/31042" rel="nofollow">umlauts</a>; the <a href="http://www.google.com/search?q=site:typophile.com%20descender%20length" rel="nofollow">length of descenders</a> or the <a href="http://www.typophile.com/node/40439" rel="nofollow">length of the ‘f’ drop</a>.<br>
      Nothing to do with their personal handwriting nor their imagination/maturity.</p>
