    votes: null
    html: |-
      <p>Hi riley. I'm a student, too. Also working on my first typeface for some time now. ;)</p>
      <p>I really dig your typeface and it's grotesk feeling. Reminds me a of DIN Mittelschrift for it's nice rough impression. </p>
      <p>Looks like you you allready compensated optical illusions (thicker verticals, etc.) but some of them are still there. On 'v', 'w', 'x', 'X', 'y', 'Y', 'Z' and 'z' some diagonal strokes look thinner then others. Especially 'Z' and 'z' show this effect. If you want to keep the thinner lines you should maybe put more contrast into this. Plus horizontals of 'z' are usually thinner than the diagonal stroke, even if it's different when drawing the letters by hand. In your 'z' it is the other way round (optically).</p>
      <p>I'm not sure about the ending of your 'a' as this form is unique and does not appear anywhere else in your font. </p>
      <p>I agree with aric, the proportions of '3' needing more efford. '3' and '8' are build somehow similar so maybe you can build your '3' out of '8' for keeping your proportions. </p>
      <p>I assume you haven't done final metrics yet. In case you did, you need much more space between your vertical strokes (see 'lm' in belmont). Would be nice to see a pdf with body copy in this font.</p>
      <p>I hope you keep us updated about this! :)</p>
