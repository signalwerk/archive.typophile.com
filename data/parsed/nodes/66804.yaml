    <p>Hello All - </p>
    <p>I am a graphic design student at the Minneapolis College of Art &amp; Design. I'm taking some time to refine a typeface that I created a year or so ago. I know it's rough, but I'm looking for all the help I can get. I would be grateful to hear any and all criticisms. I have not yet had any formal training in type design. This is a learning experience for me. Thanks for looking.</p>
    <p><a href="http://s15.photobucket.com/albums/a386/reegs/?action=view&amp;current=4_belmont.jpg" target="_blank" rel="nofollow"><img src="http://i15.photobucket.com/albums/a386/reegs/4_belmont.jpg" border="0" alt="Photobucket"></a></p>
