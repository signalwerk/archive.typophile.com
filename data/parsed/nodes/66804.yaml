    html: |-
      <p>Sorry I don't have time to go over your font more thoroughly.  Let me give a disclaimer: I have no more experience than you (probably less).  But if this were my font, I'd pull in the top terminals on lower-case and capital 's' and lower-case 'a' a bit.  I'd also make 's' and 'S' a bit more narrow; it doesn't seem right to me for 's' to be wider than 'e', for example.  '3' and '5' strike me as top-heavy and the bottom stroke of the '7' extends too far to the left, giving the impression that it may fall over. Finally, it would be nice to see a PDF with some running text.</p>
      <p>On the whole, though, it looks like a very solid start to an interesting project.  Good luck with it!</p>
