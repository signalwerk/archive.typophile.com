      <p>The 1950s were an era when ad agencies used fonts prepared by Photo Lettering and similar firms. So they are  likely the source of the version of Futura used in "If your husband ever finds out."<br>
      By the way, if this ad were to run today it would lead to a massive anti Chase &amp; Sanborn campaign for the patriarchal abuse of women shown in it. Don Draper might have thought it was a great sales attention grabber.<br>
      Don</p>
