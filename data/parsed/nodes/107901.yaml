      <p>"Chase and Sanborn" = <a href="http://www.myfonts.com/fonts/adobe/futura/extra-bold/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Futura Extra Bold</a></p>
      <p>"If your husband ever finds out" - definitely in the Futura style. The oval-shaped tittle makes this look like <a href="http://www.myfonts.com/fonts/adobe/spartan-classified/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Spartan</a>, however other elements don't match. The /s/ is more of a Grotesk style, and then there is the tail on the /u/. There were unfortunately tens, possibly hundreds of Futura lookalikes in circulation about this time, many of which have never made it to digital form. Perhaps someone with some older type specimen books can help more with this.</p>
      <p>"you're not store-testing for fresher coffee" and "if he discovers" = <a href="http://www.myfonts.com/fonts/storm/baskerville-original-pro/10-pro-medium-italic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Baskerville Italic</a> (Medium?). Seems a little more condensed than most digital versions, but definitely Baskerville.</p>
      <p>"Here's how easy it is to be sure" = looks like <a href="http://www.myfonts.com/fonts/adobe/futura/bold-oblique/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Futura Bold Oblique</a></p>
      <p>"Pressure Packed" = Hard to tell, but looks more grotesk than Futura. Would need a larger specimen to be sure. Seems to be a slight curve on the leg of the /R/ ... <a href="http://www.myfonts.com/fonts/berthold/ag-schoolbook-bq/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">AG Schoolbook</a>?</p>
      <p>Rest of text = impossible to say, but likely Baskerville Semibold Italic again.</p>
