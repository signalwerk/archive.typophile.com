    html: <p>I'm following Nick's lead and going to ATypI rather than AIGA. (This will be my first ATypI since 1994 in San Francisco - I still recall being momentarily stunned after absent-mindedly wandering through a billowing plume of Neville Brody's cigarette smoke...) <br> <br>However, I do believe that <a href="http://www.veer.com/">Veer</a> will be sending at least of couple of our designer-types to the annual AIGA square-dance.</p>
