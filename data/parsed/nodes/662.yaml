    html: <p>I'm going to Vancouver for ATypI. <br>'fraid this year's AIGA theme of celebrity soul-searching turns me right off.</p>
    html_clean: <p>I'm going to Vancouver for ATypI. <br>'fraid this year's AIGA theme of celebrity soul-searching turns me right off.</p>
  - id: 4667
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>I've not been to an AIGA conference, but Matt Warburton of the GDC had this advice for people torn between ATypI and AIGA: <br> <br>If you are interested specifically in type and want to learn stuff, go to ATypI. <br> <br>If you are interested in general graphic design and want to look at stuff (designer show and tell, was the phrase Matt used), go to the AIGA. <br> <br>If you're not torn, come to both <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>ATypI is going to do it's best in future not to end up in the same city as the AIGA.</p>"
