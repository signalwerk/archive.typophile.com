      <p>&gt;What could I have done with the second line to de-emphasize it? (Other than shrinking it)</p>
      <p>When dealing with any kind of design you want to focus on breaking down the elements into their respective hierarchies.  In this case I would assume that the doctor's name is the most important element.  Assuming it is, I would have done three things differently.<br>
      1.  Make the doctor's name bigger.  His name is his brand so emphasis on that is important.  I would also have made that the colored element instead of regular ol' black.<br>
      2.  Drop the medical credentials down right underneath the doctor's name.  They are necessary only for validation that he is a medical professional.<br>
      3. Drop the rules to tighten up the whole package.  If you (or your client) feel that they are necessary, keep them in but take them down a point size or two and tighten them up.  Too much negative space in your composition will make it feel like it isn't cohesive.</p>
      <p>I always find it's fun to revisit a logo even when it's out the door.  It's a great way to learn from your mistakes and grow as a designer!</p>
