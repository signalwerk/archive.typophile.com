    <p>Hello all,</p>
    <p>It's been some time since I last posted a logo for critique, but you have all been so helpful <a href="http://typophile.com/node/10008" title="Critique of a law firm logo" rel="nofollow">in the past</a> that I thought I would throw another one your way.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo - Full Color (low resolution)_6151.png"></div><p></p>
    <p>&nbsp;<br>
    This was a full identity package that needed to work across multiple media: web, print, etc. It needed to be inviting but still professional. </p>
    <p>I really wanted to push myself on this one and get the identity to ride purely on the strength of the type, the color, and the layout. Too often I try to solve a logo problem by just finding the magic shape or illustration. The result is often that I don't spend enough time exploring type and color as a way of unifying and carrying the overall brand identity. So any thoughts along those lines would be much appreciated.</p>
    <p>Here's how it came out on the <a href="http://www.beukematherapy.com/" rel="nofollow">website</a>, the <a href="http://www.beukematherapy.com/marketing/Business%20Card%20-%20Vertical.pdf" rel="nofollow">business card (PDF)</a> , and <a href="http://www.beukematherapy.com/marketing/Letterhead.pdf" rel="nofollow">the letterhead (PDF)</a>.</p>
    <p>The design is done, so this is just a learning exercise for me.</p>
    <p>Peter</p>
