    <p>Hi All,</p>
    <p>Trying to sort out some graphics for my company, and no one seems to know what our own font is, let along have it on file anywhere, so I turn to you.</p>
    <p>This is from our standard company logo.</p>
    <p></p><div class="imageWrap"><img src="/files/font_6305.jpg"></div><p></p>
    <p>Its very similar to a font called Tachyon from Fonthead Design, but the middle bar in the “R” of Tacyhon is lower.</p>
    <p>Any help would be very very much appriacted.</p>
    <p>Best Regards</p>
    <p>Neil</p>
