      <p>Wikipedia's official guidelines discourage the creation of lists in article format within the main encyclopedia namespace. Regardless, Wikipedia contains a plethora of such lists.</p>
      <p>The established alternative to manually-created lists is <a href="http://en.wikipedia.org/wiki/Portal:Contents/Categorical_index" rel="nofollow">Categories</a>. Categories are self-building lists, built up automatically by placing Category tags in relevant articles.</p>
      <p><a href="http://en.wikipedia.org/wiki/Portal:Contents/Categorical_index" rel="nofollow">A category for Typography exists</a>. At the top are sub-categories. No category called Font or Typeface exists yet. I can look into creating that if typophiles are interested.</p>
      <p>j a m e s</p>
