    <p>Wikipedia has a "list of typefaces," and it is disappointingly thin. The idea of having a comprehensive "list of typefaces" is laughable in and of itself, but there are some very notable omissions. Some of the particularly notable omissions:</p>
    <p>Officina<br>
    Interstate<br>
    Thesis<br>
    Walbaum<br>
    Meta (and Meta Serif)<br>
    DIN<br>
    Arnhem<br>
    Scala<br>
    Gotham<br>
    Archer<br>
    Didot<br>
    Dax<br>
    Swift<br>
    Copperplate<br>
    Quadraat<br>
    Mrs. Eaves<br>
    Triplex<br>
    Arno<br>
    Chaparral</p>
    <p>It seems like a lot of the omitted typefaces are those that don't come bundled with Windows, OS X, Adobe CS, or Office. Really, this thread is just intended to encourage discussion. Is it at all feasible to create a "list of typefaces" for a resource like Wikipedia? If so, how do you decide the criteria for which typefaces make the cut? But then, wouldn't it just be a somewhat objective "best typefaces" list, not unlike FontShop's? Are there any other typefaces that you feel were given a rather significant slight in this list? Discuss.</p>
