    <p><a href="http://www.alfa60.com/PDT.html" title="http://www.alfa60.com/PDT.html">http://www.alfa60.com/PDT.html</a><br>
    --<br>
    Just wanted to let our Italian friends know: NEW translation and launch of the First Things First manifesto in Italian.</p>
    <p>Salve,<br>
    vogliamo invitarvi a partecipare e firmare l'appello PRIMA DI TUTTO 2010.</p>
    <p>Il manifesto e' una nuova traduzione italiana del famoso manifesto First Things First di Ken Garland.</p>
    <p>Nel 1964, 22 progettisti grafici hanno firmato l’appello originale che le nostre abilità fossero messe a disposizione di una causa più utile.<br>
    Nel 2000 altri 33 professionisti internazionali hanno rinnovato questo appello. Con l’espansione esplosiva della cultura commerciale globale, il loro messaggio è divenuto soltanto più urgente, specialmente in Italia dove la commercialità nel nostro lavoro e molto più diffuso.</p>
    <p>Oggi, per la prima volta in Italia, rinnoviamo il loro manifesto nell’aspettativa che non passerà un altro decennio prima che il suo messaggio sia preso veramente a cuore.</p>
    <p>FIRMATE!<br>
    <a class="freelinking external" href="http://www.alfa60.com/PDT.html" rel="nofollow">http://www.alfa60.com/PDT.html</a></p>
