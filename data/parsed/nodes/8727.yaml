    <p>I am thinking of using Caecilia for a pocket book (font size 8 pt, leading 11 pt). It's an anthology, no texts will be longer than 750 words. My customer has vaguely hinted that he likes sans serifs but I think this typeface would provide better readability without losing the modern feel he is looking for. Any input on all this? <br> <br>Also, what sans serifs go well with Caecila (for header, subheader, author's name)? Is Franklin Gothic out of question? (I thought so at first but now I guess I've been staring at my printouts too much, and I'm honestly quite confused). <br> <br>EDIT: First post, wrong board. I'm terribly sorry...</p>
