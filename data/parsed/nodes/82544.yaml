  html: "<p>The second release from astroluxtype, Dragon Fang, is a single weight headline display font. The style suggests Medieval font forms but in a contemporary sense. The font contains uppercase and lowercase letterforms which include a few alternate characters, look for the swash \"B\" and \"D\" to give your design project a special look. Influenced by everything from Rick Griffin and Linotext to tribal tattoo art this font will bring a contemporary edge to your design projects. Fantasy book cover art to that goth album cover you should find many uses for astroluxtype's Dragon Fang. Available Now at Myfonts.com Link: http://new.myfonts.com/fonts/astrolux/dragon-fang/</p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/fang_5475.poster1.png\"></div><p></p>"
