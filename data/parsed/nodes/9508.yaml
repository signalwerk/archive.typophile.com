    date: 2005-03-04T07:06:00
    date_raw: 4 Mar 2005 — 7:06am
    votes: null
    html: <p>I'm not sure I understand that. The 'authors' cannot be Melville or Hawthorne, so whose inscription are you trying to replicate? <br> <br>What is the age of the inscription?  <br> <br>Do the 'authors' know that not all type has been converted to digital form, and that finding metal type that matches might be almost impossible? <br> <br>I have looked at ALL the blackletter typefaces in Mac McGrew's book of 'American Metal Typefaces of the 20th Century' and nothing matches, even though many of the types originated back into the 19th century. So it suggests that this was not American type, or it was an antique type that was no longer used into the 20th century, or it was hand-lettered. (I know it looks very uniform, but can you see the original? ) There were people who made their living lettering things like that by hand. Today, maybe they would be font designers. <br> <br>To me, something that adds to the hand-lettered idea is that the little dangling bit on the 'h' is very similar to Engraver's Old English, but shows the pen's limitations on trying to imitate such a fine 'stroke'. The B in your sample also seems somehat simplified, or poorly copied from the original model the lettering artist may have been using, if we assume it looked like 'Harrowgate'.  <br> <br>I still feel (maybe because I am not trying to make your life hell) that you have come remarkably close, and that I would probably not notice the differences unless I were looking at the two samples side by side.</p>
