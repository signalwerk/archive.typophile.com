    html: <p>The company changed completely. The staff changed and the agreement with the last designer did not allow the office to keep using the visual id. The office is moving for another building and openning new branches of activities. They used not to work that hard on coomunication and design, for example... it is an expanding moment and their presence tends to be more solid in the country, as well as the logotype.</p>
