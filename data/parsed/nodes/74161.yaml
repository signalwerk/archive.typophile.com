    html: '<p>This office promotes cultural projects, mainly music concerts, offering support to the artists and providing the necessary structure for to event to happen, including media planning and graphic design. Target is visual educated: artists, promoters, students, liberal workers, 15-35y.o. The name refers to transpiration: "...we will be glad to sweat in order to make your event happen..." and the typography tries to suggest the sweat drop going down (see "a" ball) but it drops diagonally because of the speed the work is beeing done. Making cultural events oftenly become heavy hand made work... and always in a hurry! ...but anyway, the result must be art.</p>'
