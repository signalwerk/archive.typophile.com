      <p>I agree, there's something about the top one that just...works. (with a little tweaking). I don't think anyone will get the 'concept' behind it...but do they need to? I initially thought the word was more closely connected with the "something to occur/happen" definition rather than 'sweating'...but whatever you choose.</p>
      <p>The second one is difficult to read.</p>
      <p>They're two very different directions.</p>
      <p>I question why you've displayed them at such different scales.</p>
