      <p>Thanks guys... the point is that this project is a redesign. The first logo is the original design and its both typefaces already exisits. The second (big) one was drawn based on the concept I mentioned above (and its secondary type is Museo).</p>
      <p>Some people read "v" insteado of "t" on the new type. Could you point other problems?</p>
      <p>Thanks again...</p>
