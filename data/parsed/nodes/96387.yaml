  html: |-
    <p>I've made a font that works perfectly, but doesn't show up in a right way in Finder's quick preview and in FontXplorer's preview. The font has lot's of opentype features, one of them being a CALT feature that, when it's on, it replaces the first and the last glyph of the word with alternative shapes. In the previews, the font is shown with this feature on, when it should be off as a default state. Here's a screen grab of my features with the CALT selected.</p>
    <p>I'm guessing the features are in wrong order? How to get the previews to show the default state without OT feats?</p>
