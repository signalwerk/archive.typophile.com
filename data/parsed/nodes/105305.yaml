    html: |-
      <p>There is no way to correct tight spacing with hinting on modern Windows systems. The fonts needs to be drawn wider and spaced looser prior to hinting*. Check out the Reading Edge series from Webtype, Aften Screen (mine) from Monokrom or the eText fonts from Monotype for examples of this approach.</p>
      <p>FF Meta Serif is available for web use on <a href="http://www.fontshop.com/fonts/family/ff_meta_serif/All/All/Bestsellers/2" rel="nofollow">fontshop.com</a>. Click add, and select the web option. FF Meta Serif Web Pro is also one of the teaser families FontFont offer through <a href="https://typekit.com/fonts/ff-meta-serif-web-pro" rel="nofollow">Typekit</a>.</p>
      <p>* Low resolutions screens need looser spacing for text sizes than what is ideal for print. I think text on the Apple Retina screen also look better with some extra white.</p>
