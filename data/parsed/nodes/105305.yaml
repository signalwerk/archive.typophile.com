  html: |-
    <p>Hello </p>
    <p>We are currently using a mix of Stag, Stag Sans for our materials (large type brochures, letters and Keynote presentations), as well as 'whatever is at hand' for emails and web (e.g. MS Trebuchet)</p>
    <p>The recent availability of Stag as a 'direct' web font has opened the opportunity to unify our communications as well as look &amp; feel. We would like, in particular to unify letters, web and email using the same font set.</p>
    <p>I have tested Stag (headlines) + Stag Sans (body) for web and it looks quite good. However Stag Sans is still not ideal for everyday body text: punctuation a bit too tight and doesn't do numbers particularly well (e.g. for invoicing).</p>
    <p>We are going to keep the Stag family as our headline font (and license it for the web) but I would like some ideas on what other body font we could use. The constraints are fairly basic:</p>
    <p>- High legibility for both print and screen<br>
    - Native web fonts<br>
    - Either directly suitable for email or can easily be replaced by something not too shockingly different</p>
    <p>I had a look at FF Meta Serif for example and quite liked it, but it doesn't seem to exist as a native web font.</p>
    <p>PS: I am not worked up about serif v. sans. </p>
    <p>Thanks!</p>
