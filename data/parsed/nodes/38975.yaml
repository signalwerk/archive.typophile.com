      <p><cite>supposed neutrality of Switzerland</cite></p>
      <p>two words: Bergier Commission</p>
      <p>From a frontline article on the subject:<br>
      In December 1999 the Commission issued its conclusions. It stated that Swiss officials during World War II refused entry to thousands of Jewish refugees even after it was known that they faced almost certain death in Nazi Germany. The Commission's historians also said there was no evidence that accepting many more asylum seekers would have put neutral Switzerland in danger of Nazi invasion or "caused insurmountable economic difficulties." The Commission cited anti-Semitism and a deep-seated fear of foreigners in Switzerland as the reasons authorities refused asylum to more than 24,000 Jews.</p>
