      <p>1. Strong, Universal, &amp; Sexy</p>
      <p>2. Yes, I love it. I love seeing it. It feels high fashion and classic to me. Many high end european furniture houses use Helvetica for their identity: Edra, Cappelini, &amp; Knoll.</p>
      <p>3. Not absolutely. Univers is what I consider absolutely 100% neutral- cold- emotionless type. Helvetica does have some warmth, dare I say, quirkiness. Or perhaps instead of those qualities- attitude. She doesn't exactly wear her heart on her sleeve. If Helvetica was a woman she would certainly be one of Helmut Newton's amazons.</p>
      <p>Mikey :-)</p>
