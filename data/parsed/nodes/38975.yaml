    <p>Hi everyone,</p>
    <p>I am doing my dissertation on Helvetica and would be ever greatful if you could answer a few quetions, I only need a few words so it shouldn't take long! </p>
    <p>1. Which 3 words would you use to describe Helvetica?</p>
    <p>2. Do you have any emotional response to Helvetica and its uses?</p>
    <p>3. In your opinion, is Helvetica ‘neutral’?</p>
    <p>Mark</p>
