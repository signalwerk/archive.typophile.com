    html: <p>I like your insight here, Paul. I think there was, and maybe still is, something of an aesthetic snob appeal in the 'international style', both in type and in architecture. It wasn't sold just as an appealing  new style. It was that everything else had to be 'wrong' and inferior. Tom Wolfe satirized the movement in architecture in his <a class="freelinking external" href="http://www.amazon.com/Bauhaus-Our-House-Tom-Wolfe/dp/055338063X/ref=pd_bbs_7?ie=UTF8&amp;s=books&amp;qid=1194981965&amp;sr=8-7" rel="nofollow">From the Bauhaus to Our House</a>. One of his points was that people were able to sell buildings that people never liked, because the designers and sellers appealed to snobbery. By liking the designs showed you one of the elect, a superior being.</p>
