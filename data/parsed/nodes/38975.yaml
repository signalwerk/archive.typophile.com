      <p>1. It depends on the weight, but for the regular: sterile, serious, unemotional.</p>
      <p>2. It depends on the usage, when it's well used I'm usually bored, but most of the time I see Helvetica is use it has been mis-used in a situation for which is it not well suited (e.g. wayfinding signage, small print in packaging, in which cases I'm just mildly irritated. (I'd be more irked, but it's so ubiquitous that I'd get worn out if I had much reaction.)</p>
      <p>3. Heck no! Helvetica is not "neutral." Each of the adjectives I use to describe it are at one end of a spectrum, not in the middle. I'll bet that's true for most other folks' adjectives, too.</p>
      <p>(I carefully did all my answers before reading what anybody else wrote, btw.)</p>
      <p>Cheers,</p>
      <p>T</p>
