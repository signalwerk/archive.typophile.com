    html: |-
      <p>Even today, when used for display, captioning/titles, and tabular data, and if manually kerned with some tighter tracking--Helvetica/Helvetica Neue looks contemporary, dynamic and hip. Just because the masses overuse it because of Apple and Microsoft is no fault of the typeface.</p>
      <p>In fact, for most graphic designers, aren't Helvetica Neue and Franklin Gothic STILL the first two grotesk sans you turn to? Why not, they get the job done. Univers is too truly antiseptic, Folio is quirky, Akzidenz Grotesk is authentic but less mannered than the big two, News Gothic and Trade Gothic are thin and wimpy.</p>
      <p>So my words for Helvetica I guess are 1. dynamic, 2. flexible, and (unfortunately), 3. corporate.</p>
