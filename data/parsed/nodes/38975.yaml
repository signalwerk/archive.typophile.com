    html: <p>Serif faces are used all the time for display purposes. I don't think the concept of neutrality only applies to display fonts either. I guess it could be argued that sans fonts, being stripped down, convey more of a "neutral" air. But the point of typographic "neutrality", as I understand it, is that the font does not draw attention to itself, and there are plenty of serif fonts that this idea could apply to. Times Roman for one. Minion for another. Janson, Baskerville, even some Caslons are very understated.</p>
