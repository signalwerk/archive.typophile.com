    <p>Hi,<br>
    I wonder if there is a predictable way to build language specific features in OT.<br>
    I built an Arabic font with ligatures put in rlig for Arabic and in dlig for optional general use. Only Indesign behaves as expected and in MS Office and OpenOffice ligatures are activated no matter what language is set.</p>
