      <p>Hi again Peter,</p>
      <p>Found it.<br>
      In the same "import options" box you need to de-select "remove text and table formatting".</p>
      <p>The footnotes appeared immediately at the bottom of the text (no blank lines between) and with a header that said "(footnotes)".</p>
      <p>One other thing I noticed: Pay attention to the InDesign character settings before you import. If you import a document with size 12 font and 14 leading and your InDesign set up is 8/10, your imported text is going to be squished. It seems to preserve the font size of the original document but not the leading. So in my case, I ended up with 12/10. Auto leading might be a good choice pre-importing.</p>
      <p>Kristina</p>
