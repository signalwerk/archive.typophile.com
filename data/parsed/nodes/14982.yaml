      <p>Martin, Hebrew is written right to left. MS Word on PC can work with left-to-right texts. On the Mac you can use TextEdit, Mellel, and a few other apps, but these are word processors. The page layout programs that can deal with it are QuarkXpress with ArabicXT, but it has its own font set and needs to convert the system fonts, and it costs a fortune. the second program is InDesign CS ME. To check it out go <a href="http://www.adobeceea.com/products/ME/indesign/MEoptions.html" rel="nofollow">here</a>. You will need this to do any serious work in LTR languages.</p>
