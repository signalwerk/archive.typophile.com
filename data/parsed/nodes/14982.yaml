    html: |-
      <p>André,</p>
      <p>The file you download is an InDesign script, and should have the name 'Footnotes2Endnotes.jsx'. If you're using Safari, you'll probably get a file named 'Footnotes2Endnotes.jsx.txt'. If that's your case, just remove the '.txt' extension from the name. [To be sure that the file type really gets changed, do File &gt; Get Info (Command+I) and edit the Name &amp; Extension field]</p>
      <p>Once you're done with the above, you'll need to put the .JSX file inside a folder that InDesign will access. If you're using CS2, the location of that folder is <code>Adobe InDesign CS2/Presets/Scripts</code>. If you're using CS3, the location of that folder is <code>Adobe InDesign CS3/Scripts/Scripts Panel</code>.</p>
      <p>After you've "installed" the script, just go to InDesign and open the Scripts palette by doing Window &gt; Automation &gt; Scripts. You should now be able to see the 'Footnotes2Endnotes.jsx' script. To run it, just double-click on it.</p>
      <p>Now it should be pretty straight forward to use the script. Let me know if you have any problems.</p>
