      <p>Peter &amp; Kristina, setting up styles in Word can be very useful, even if all you do is short papers. For my graduate work I did 2-page papers regularly. I setup the styles and saved them as default (in Normal.dot). From then on I did not worry about setting up paragraph formats. It took me some time to get all the styles I need, but I still use them, years after graduating.</p>
