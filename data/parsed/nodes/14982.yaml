    html: |-
      <p><em>&gt; And forget about Word’s Grammar Check — it’s laughable.</em></p>
      <p>On the contrary. I think Word’s proofing tools are very useful, especially for a non-native English speaker such as myself.</p>
      <p>Adam, you may find Word’s proofing tools useful as a non-native speaker but, for native speakers who have degrees in English language and literature and are, ideally, more intimately acquainted with the rules, they are pathetic. Word's Grammar Check flags items which are perfectly grammatically correct, overlooks items that are patently grammatically incorrect, and often makes totally erroneous suggestions (<em>its</em> and <em>it's</em> being perhaps the most egregious one, <em>than</em> and <em>then</em> being a close second).</p>
      <p>Yes, Word is a much more capable <strong>word processing</strong> program than InDesign, as well it should be: I don't think that I suggested otherwise. Use its (proper usage) tools to write the words (or get a semi-accurate idea of how much space those words will occupy, although there does exist an arcane discipline, known to some of us old-time typesetters, called copyfitting, which would serve equally as well); but chuck Word's formatting (basically .rtf) when you export those words. Apply your styles in the page composition program, which is one of the areas in which that particular kind of program excels. In other words, do what each program does best in the program that does it best.</p>
    html_clean: |-
