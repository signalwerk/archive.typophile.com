      <p>I think these are different tools and (for various reasons) (e.g., footnotes, cross-references, automatic generation of tables of contents and so forth) I would generally stick to a word-processor for writing. You can still have something better than the typographic average if you use the tool properly. For instance, since you're not going to have ligatures, you choose a font that doesn't need them, and so on. Get the margins and leading right. Do everything using defined styles, set up in advance, using templates. What you get will not be perfect (it won't be what you would want if you were actually publishing a book), but it will  not only be acceptable, it will be significantly better than average thanks to a little typographical refinement.</p>
      <p>I would save InDesign for the very occasional piece that you want to make look even better. You then resign yourself to writing in Word (say), and then pasting it all into indesign and marking it up, which you do only when the "manuscript" is absolutely perfect in Word. For instance, if one were writing a PhD dissertation, one might do this as the last stage before submission. But not until then. For ordinary school papers it really is not worth the trouble.</p>
      <p>One alternative is LaTeX, which will give you typographic refinement to some degree. I'm quite a fan, and if you are doing anything involving mathematical or symbolic things, LaTeX is probably the way to go. The trouble is font installation and set-up, and there is a very steep learning curve.</p>
