      <p>Lots of questions in this thread...  I'll try to address some of them.  As Levon said, starting a new thread for a new topic can help keep things from getting lost.</p>
      <p>1) The response to the original question would be: InDesign CS didn't have a footnote feature, so the Word footnotes are imported as a block.  The latest versions do support footnotes and they import correctly.<br>
      2) Martin: Hebrew can be formatted very professionally using the ME version of InDesign, which was adapted by <a class="freelinking external" href="http://www.winsoft.eu/products_solutions/adobe-indesignCS3.php" rel="nofollow">WinSoft</a>.<br>
      3) InDesign doesn't ship with a thesaurus but InCopy does.<br>
      4) The pink boxes sounds like you are using Cyrillic text with a font that doesn't have Cyrillic support. Many more informal applications support a "font fallback" mechanism to use some font to draw missing characters. InDesign generally will use only the font specified to prevent unintentional use of other fonts.</p>
