      <p>&gt; Apply your styles in the page composition program, which<br>
      &gt; is one of the areas in which that particular kind of<br>
      &gt; program excels. </p>
      <p>No, I *design* my styles in the page layout application (InDesign) but I apply them when I devise the document sturcture during the work on the text (in Word). Of course RTF is only an imperfect replacement for a proper distinction between structure and formatting. To do it properly, one uses XML (to devise the structure) and CSS, XSL, or any other formatting language, to devise the formatting. </p>
      <p>Currently, the XML support in Word 2003 is only very basic but I hope it will improve in Word 12, so I can author my XML files in Word and move them to InDesign. Until then, I'll stick with RTF. </p>
      <p>For me, the whole point of spellchecking or grammar checking in word processing applications is not making suggestions but pointing my attention to *potential* errors. </p>
      <p>There is this feature in FontLab called FontAudit. Some users take it literally and instead of making an reasonable assessment, they try to  fix every single potential problem that FontAudit flags. I could never understand that "the computer tells me to" attitude. When it comes to assessing legitimate situations vs. errors, the human brain is still eons ahead of computers. Automatic spellchecking does not lift the necessity of proofreading the text. And yet, it can be useful for identifying possible deficiencies by simply highlighting portions of text that need double-checking. With grammar checking, it's the same thing. </p>
      <p>&gt; for native speakers who have degrees in English language<br>
      &gt; and literature</p>
      <p>Please forgive me (and some 700 million other people) for not having the "luxury" of being member of that "elite". </p>
      <p>Adam</p>
