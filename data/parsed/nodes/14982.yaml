      <p>Set up your document and create a text box and, with the cursor in the text box, use "place" from the "file" menu to import your word document. Choose "show import options" in the bottom left of the dialogue box that appears for selecting the file you want to place. You can choose to include the table of contents, index, and footnotes, and to preserve/import formatting like page breaks. </p>
      <p>I just did it with one of my essays and the essay looks the same as it did in word -- centred title, double spaced, bold where it's supposed to be, and so on. I'm using InDesign CS</p>
      <p>Kristina.</p>
