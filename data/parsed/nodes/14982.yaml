      <p>Nick, </p>
      <p>&gt; I would recommend writing WORDS ONLY<br>
      &gt; (no formatting) in Word, </p>
      <p>Sorry, not an option. Every document I work on has a *structure* I don't want to deal with structureless documents. I use the excellent Word 2003 to define the structure of my documents through styles. The actual formatting of the styles does matter as well: I usually set up Word so the proportions of the text column and the type parameters are equivalent to what I will use in the final typesetting. This way, I can estimate how much my text will occupy in the printed matter as I type (things like counting words are just a crude and primitive approximations.) </p>
      <p>I always use Word's native .doc format to move my files into InDesign, and of course I *only* work with styles (no manual formatting). What I  haven't tested out extensively yet is InDesign's support for footnotes (I don't mean "footnotes that appear at the end of the text" because that's not *footnotes*, that's endnotes). Apparently InDesign CS2 has some support for real footnotes. </p>
      <p>&gt; And forget about Word’s Grammar Check — it’s laughable.</p>
      <p>On the contrary. I think Word's proofing tools are very useful, especially for a non-native English speaker such as myself. I use them in all the languages I write: Polish, German, English, Russian. Of course, as with any automatic tool, I would rarely trust it blindly. </p>
      <p>Whenever Word's grammar check underlines my sentence (or the spelling check highlights a word), I take it as a good opportunity to review it. Sometimes, the sentence is just fine so I ignore the warning, and sometimes it can actually spot things like a verb that I omitted by mistake. </p>
      <p>From the usability point of view, InDesign doesn't even come close to Word when it comes to editing text. Half of the useful shortcuts are not there in InDesign, and everything is slow. But most importantly, the 4-5 dictionaries that I have installed on my Windows machines all have Word macros that integrate them in Word, so I can do things like English-Polish translations right from Word without any copy-pasting. </p>
      <p>Finally, for the languages other than English, Word's proofing tools also beat InDesign's by miles. You could call the German or Polish spellchecker in InDesign at best "experimental" while the ones in Word are quite solid. I don't blame InDesign for that -- for last-minute checkups the spellchecker is perhaps useful but the only thing that I really need to work well in InDesign is the hyphenation algorithm. </p>
      <p>Adam</p>
