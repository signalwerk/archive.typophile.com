  html: |-
    <p>i am in the process of designing a preparedness/survival manual intended to be a post-9/11, post-katrina guide for urbanites and suburbanites. the publisher would like this book to appeal to hipsters and families alike.</p>
    <p>each chapter contains numerous topic headings, which i have set in solex bold, 16pt.</p>
    <p>i really like the way this font looks in all caps, but when it is used for the sub-heads, it doesn’t quite work.<br>
    all caps is too overbearing and title case seems to be lacking something. perhaps there are ease-of-legibility problems with each.</p>
    <p>additionally, i am using solex in the body copy as my bold font (which happens numerous times) and for picture captions.</p>
    <p>i would like a similarly condensed looking font that i can use for headers and will also work nicely for the sub-headers set in a smaller point size.</p>
    <p>i have attached 3 spreads for reference. let me know if it would be helpful to see additional pages or pages containing illustrations.</p>
    <p>also, i am going to reduce the size of the bracket dingbats 10 pts or so.</p>
    <p>thanks very much for any insight you can provide.</p>
    <p>gregg</p>
