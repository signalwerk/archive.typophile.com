      <p>Man, this one got me to dig out really old Letraset sample books. I'm thumbing through the 1980 edition right now, examining faces like Camellia, Fino, Premiere Lightline and a few other "vintage" ultra light faces. Wow, there's actually quite a few faces in there I would like to see revived in digital form (such as Yagi Link Double, Oxford, Magnificat, Company and its later slotted "Transmission" variant).</p>
      <p>I'm stumped regarding the sample. But fascinated taking a look through yesteryear sample books. Ah, the days of rub on type. About the only thing I can use my burnishing tool for these days is digging ear wax out of my ears! Sorry for the disgusting image. Hehe.</p>
