    <p>Hi, Typophiles! I've recently released a new typeface, <strong><a class="freelinking external" href="http://bit.ly/GibbsFont" rel="nofollow">GIBBS</a></strong>, which is currently on an introductory offer for 50% off.</p>
    <p> <img src="http://typophile.com/files/gibbs_slide01.png" alt="GIBBS (Slide 1)" height="300" width="600"></p>
    <p><img src="http://typophile.com/files/gibbs_slide02.png" alt="GIBBS (Slide 2)" height="300" width="600"> </p>
    <p> <img src="http://typophile.com/files/gibbs_slide03.png" alt="GIBBS (Slide 3)" height="300" width="600"> </p>
    <p> <img src="http://typophile.com/files/gibbs_slide04.png" alt="GIBBS (Slide 4)" height="300" width="600"> </p>
    <p> <img src="http://typophile.com/files/gibbs_slide05.png" alt="GIBBS (Slide 5)" height="300" width="600"> </p>
    <p> <img src="http://typophile.com/files/gibbs_slide06.png" alt="GIBBS (Slide 6)" height="300" width="600"> </p>
    <p> <img src="http://typophile.com/files/gibbs_slide07.png" alt="GIBBS (Slide 7)" height="300" width="600"> </p>
    <p><strong><a class="freelinking external" href="http://bit.ly/GibbsFont" rel="nofollow">Gibbs</a></strong> is a tough, sophisticated sans, named for prolific maritime architect William Francis Gibbs and inspired by his greatest design, the record-breaking mid-century luxury liner SS <em>United States</em>. Taking various cues from the unique cast aluminum signs found on board, the result is truly transatlantic — somewhere in between industrial American vernacular lettering and the English humanist styles of Gill or Johnston. Both stylish and comfortable to read, and with an extensive list of OpenType features, Gibbs allows you to set quality type with ease at both text and display sizes.</p>
    <p>Built in 1952, the beautiful <em>United States</em> was the most revolutionary ship in the world when new. After a flawless 17-year career, she now sits unused and is in danger of scrapping. Her current owner, the non-profit SS United States Conservancy, wishes to restore the ship as a vibrant waterfront development and museum for future generations to enjoy for decades to come.</p>
    <p>You can purchase Gibbs at <a class="freelinking external" href="http://bit.ly/GibbsFont" rel="nofollow">MyFonts</a>. I've also attached a <a class="freelinking external" href="http://typophile.com/files/GibbsTypeSample_sm.pdf" rel="nofollow">PDF Specimen</a> with some more sample settings and some history about the ship and notes about the design.</p>
