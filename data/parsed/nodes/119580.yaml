    <p>Hi, Typophiles! I've recently released a new typeface, <strong><a href="http://bit.ly/GibbsFont" title="Click to visit an external URL." class="freelink freelink-external freelink-external">GIBBS</a></strong>, which is currently on an introductory offer for 50% off.</p>
    <p><strong><a href="http://bit.ly/GibbsFont" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gibbs</a></strong> is a tough, sophisticated sans, named for prolific maritime architect William Francis Gibbs and inspired by his greatest design, the record-breaking mid-century luxury liner SS <em>United States</em>. Taking various cues from the unique cast aluminum signs found on board, the result is truly transatlantic — somewhere in between industrial American vernacular lettering and the English humanist styles of Gill or Johnston. Both stylish and comfortable to read, and with an extensive list of OpenType features, Gibbs allows you to set quality type with ease at both text and display sizes.</p>
    <p>Built in 1952, the beautiful <em>United States</em> was the most revolutionary ship in the world when new. After a flawless 17-year career, she now sits unused and is in danger of scrapping. Her current owner, the non-profit SS United States Conservancy, wishes to restore the ship as a vibrant waterfront development and museum for future generations to enjoy for decades to come.</p>
    <p>You can purchase Gibbs at <a href="http://bit.ly/GibbsFont" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MyFonts</a>. I've also attached a <a href="http://typophile.com/files/GibbsTypeSample_sm.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">PDF Specimen</a> with some more sample settings and some history about the ship and notes about the design.</p>
