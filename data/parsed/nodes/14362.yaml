    <p>I'm looking for the font most often used in the 70’s style high fashion magazines (such as harpers bazaar) where numbers were a focal point and small text accompanied the numbers, underneath them, and below a rule. (It might be Herb Lubalin?) This is the closest I could find, and I'm having the worst trouble identifying it. Can you help? Thanks!</p>
