    html: |-
      <p>Sahara Bodoni is close but no cigar -- the upper loop on the ampersand doesn't match, and the dollar sign in the sample has no serifs but ball terminals. I think we're looking at Pistilli Roman, which matches the time frame.</p>
      <p>Don't know about that other ampersand. Cabernet Swash is a digitisation of Caslon Sawsh, which also matches the time frame. There are minor discrepancies, but do we really care? ;-)</p>
