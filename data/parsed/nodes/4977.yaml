  html: <p>Hey, you know I'm there.  <br> <br>But I can't decide between Sumner's workshop and the one on photopolymer plates. I'm really interested in learning more about letterpress. But I have a huge respect for Sumner's knowledge and would love to learn from him. (I was so bummed when, at the last minute, he couldn't make his presentation to ATypI Boston in 1999.) <br> <br>The perennial dilemma -- which workshops to choose? <br> <br>-- K. <br></p>
