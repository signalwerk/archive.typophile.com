    html: "<p>For all of those who are cheap and/or poor like myself and the price of the Hotel Nikko is keeping you away (even with the great reduced rate), in a quick bit of research I've found a few hostels in very close proximity to the Hotel Nikko from this site: <a href=\"http://www.hostels.com/us.ca.sf.html\" target=\"_blank\">http://www.hostels.com/us.ca.sf.html</a> <br> <br>The HI-San Francisco-Downtown (Union Square) is one block away from the conference and is $24/night for the very minimum of necessities and the Adelaide Hostel/Hotel isn't too much further.  I can't vouch for either of these, but I'm almost positive that this is how I'll be staying in the city. <br> <br>It'll be my first TypeCon, I know I'm not usually very vocal on the forums, but I read from them every day and I'm really looking forward to putting faces with all the names and meeting lots of people. <br> <br>Seeya there!</p>"
