    html: |-
      <p>Herb: It was a digital version of the transfer sheet catalogue that I was really after. I have a hard copy, but I thought it would also be beneficial to have a scanned version as well.</p>
      <p>It can be a very useful reference point. For instance, I discovered during one 'hunt', that a font named PALANA by Alan Withers, has never (to my knowledge) been digitised, plus there are some subtle differences in other cuts as well.... Typophile gold !!!</p>
      <p>Anyway, it needs to be done before I spill coffee all over it, or in my old age, involuntary dribbling starts occurring  ;-)</p>
      <p>Adrian</p>
