    html: |-
      <p>okay. thanks. i figured out, i just needed to change font-family in css. I can call it whatever i want, then associate that with the uploaded ttf file. </p>
      <p>example:<br>
      <code>@font-face<br>
      {<br>
      font-family: myFirstFont;<br>
      src: url(<a href="http://www.mysite.com/forum/fonts/OpenSans-Bold.ttf" title="http://www.mysite.com/forum/fonts/OpenSans-Bold.ttf">http://www.mysite.com/forum/fonts/OpenSans-Bold.ttf</a>);<br>
      }</code></p>
      <p>I thought I had to manually change the font name within the file, which I found out how to do with typograf, but turns out i didn't need to do that.</p>
      <p>Thanks again for the reply.</p>
