  html: |-
    <p>It's driving me absolutely crazy. I want to use Open Sans 400 for most everything and Open Sans 800 for forum subjects/topics/forum names. But the only browser to render it properly is Chrome. Every other browser gets completely mixed up and seems to default to Open Sans 800 even when Open Sans 400 is called. </p>
    <p>I've tried making Open Sans 400 weight 800 through CSS, but it's a totally different deal than true Open Sans 800 font type.</p>
    <p>Any ideas? Chrome is fine. All other browsers have no idea how to handle it. That includes Firefox, Opera, Explorer. I wish I had some samples to show what I mean, but this is an issue from a while back, and I just decided to settle on 'sans caption' for what I really want to be open sans 800.</p>
