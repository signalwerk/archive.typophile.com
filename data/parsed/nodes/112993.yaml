      <p>The following is largely an excerpt from what I have on my bedroom LAN server. Perhaps it'll help...</p>
      <pre>@font-face {
      	font-family: 'Open Sans';
      	font-weight: normal;
      	font-style: normal;
      	src: local('Open Sans'), local('OpenSans'),
      	     url('OpenSans-Regular.woff') format('woff'),
      	     url('OpenSans-Regular.ttf') format('truetype');
