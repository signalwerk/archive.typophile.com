    <p>Hi everybody. </p>
    <p>I'm brand new to these fora, although I have come across them in the past as I am - unsurprisingly - a typophile and love exploring and looking for 'interesting' fonts.</p>
    <p>The reason I've started this thread, however, is to enquire about the PF Champion Script Pro for Greek letters. I intend to get a tattoo incorporating different ideas, symbols, and representations of personal liberty and the journey to reaching a state of freedom (intellectually, spiritually, mentally and so on). I see this as an expressive art project on my natural body canvas - much in the way some of you, like I, may regard fonts as artistic - and I take it very seriously. I feel that the PF Champion Pro Script is the most fitting and beautiful script for the Ancient Greek quote 'γνῶθι σαυτόν' ['know thyself'] (all lower case).</p>
    <p>The problem is I lack the resources (and erudite knowledge, as it were) to purchase the font package and in general to know how to go about this. I'm afraid I (begrudgingly) feel the need to rely on the altruism of fellow typophiles here. Is anybody here have who has the font in Greek and is willing to send me a file via e-mail of the Ancient Greek quote above? I would be unspeakably grateful for the help (and I don't expect to be particularly successful!).</p>
    <p>Any help would be MUCH welcome. A thousand thanks in advance!</p>
    <p>(P.S. as the AG alphabet is polytonic and may not be supported by PF Champion Script Pro, even just 'γνωθι σαυτον' without any accents is equally fine.)</p>
