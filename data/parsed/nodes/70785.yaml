      <p>I'm coming to terms with the notion that someone with a classical education, informed about grammar if not OpenType, would settle for default in something as permanent as a tattoo. If the font was Helvetica, it wouldn't matter, but with a calligraphic style in an OpenType font, there are options (as you can see by looking at the Champion pro PDF), more so than for these:</p>
      <p><a href="http://hubpages.com/hub/Tattoo_Ideas_Greek_Words_Phrases" title="http://hubpages.com/hub/Tattoo_Ideas_Greek_Words_Phrases">http://hubpages.com/hub/Tattoo_Ideas_Greek_Words_Phrases</a></p>
      <p> I would think a swash on the theta would be very cool. And if you did that, then you may want to use the "ascender" tau, to balance the two words.</p>
