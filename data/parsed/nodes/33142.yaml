    <p>has anyone noticed a trend in organic this and that? nearly every instance i come in contact with on a day to day basis that utilizes type has some sort of rounded features softening the edges. i’m not saying the aesthetic is entirely off the mark, just seems weird that rounded types have come to mean organic. i guess childish/cute and soft means healthy and good for the enviornment…pure perhaps? has anyone else noticed this? does it bother anyone?</p>
    <p>_will</p>
