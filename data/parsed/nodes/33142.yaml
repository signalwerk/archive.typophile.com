      <p>joshua darden’s Omnes…we used it for awakeningorganics.com mostly in the thinner weights but a few areas of the fatter variety. it got me looking at rounded letter forms. i love the way that face shines in it’s fatest form. the contrast of sharp to soft. it started to make me feel as if the usual completely rounded forms were like squishy, plush toys; filled to the gills with foam and bloated for no better reason than because. </p>
