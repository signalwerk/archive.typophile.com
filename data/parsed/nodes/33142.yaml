      <p>&gt;childish/cute and soft</p>
      <p>That’s only one kind of curve, not that I’m prejudiced against cute. The sinuous curves of art Nouveau are not ‘cute’ nor are the curves of Caslon’s muscular italic. Curves can be dynamic, like the Concorde, or sexy, like—well choose your favorite lady or gentleman. </p>
      <p>Sharp corners and straight lines are mechanical, and can have their own  power, but the world of curves has a much greater variety, both of form and mood.</p>
