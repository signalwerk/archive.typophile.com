    html: |-
      <p>“childish/cute and soft means healthy and good for the enviornment”</p>
      <p>I don’t draw this parallel. Sounds like there are several ideas/trends that overlap. Maybe it’s worthwhile to identify the different trends. For instance, lots of polluting consumer items are styled to look soft and round (like cars). At the same time, lots of people concerned with sustainability and green materials don’t follow the “soft and cuddly” esthetic. Form, in a lot of cases, is not following function, it’s following trends. </p>
      <p>I think “organic” applied to type means there are human, natural elements, as opposed to mechanistic, geometric or modular. This could be anything from the proportions to the serif shapes to the curves to the edge quality. Not necessarily rounded or cute.</p>
