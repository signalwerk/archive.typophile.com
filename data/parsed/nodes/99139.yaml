    html: |-
      <p>Not "Typewriter" like, but like a Dymo Labelmaker. One possibility is <a class="freelinking external" href="http://www.fontspace.com/tension-type/impact-label" rel="nofollow">Impact Label</a>. Others include <a class="freelinking external" href="http://www.azfonts.net/load_font/c14-blacktape.html" rel="nofollow">Carbon 14</a>,  <a class="freelinking external" href="http://www.myfonts.com/fonts/typeart/dimeotype/" rel="nofollow">Dimeotype</a>, LabelGunTape, and Punch Label. There are others, such as DYMO (dafont.com) that don't have the distinctive serif'ed /I in your sample.</p>
      <p>- Herb</p>
