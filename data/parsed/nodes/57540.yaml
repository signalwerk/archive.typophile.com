    <p>Hello friends!<br>
    I'm writing an <strong>EULA</strong> to distribute my typefaces through <em>MyFonts.</em><br>
    I have a lot of doubts and I hope you can help me with some of these points:<br>
    Which points should I consider to start writing an EULA?<br>
    I know an <em>EULA</em> is the way the foundry conceive the permission to use its fonts and I just want to protect my work as much as possible from piracy.<br>
    Can I submit an EULA, for example, to distribute my typefaces via <em>MyFonts</em> and update it after a while?<br>
    What's the difference between selling fonts to 1-5 cpus or individually? I just want to know some advantages and disadvantages of these options.<br>
    Does it make any sense to prohibit copying font files to a store device or sending them by email?<br>
    Is it convenient to allow font embeding for websites?<br>
    How can I protect my typefaces from piracy if I allow font embeding for websites?<br>
    Thanks in advance and sorry for my english.</p>
