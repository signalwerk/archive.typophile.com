      <p>"I just want to protect my work as much as possible from piracy"</p>
      <p>A EULA has pretty much nothing to do with preventing 'piracy'. Those folks really don't care what's in the EULA.</p>
      <p>The EULA is an agreement between you and your paying customers.</p>
