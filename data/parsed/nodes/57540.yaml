      <p>I agree with both.</p>
      <p>- Most people who license your fonts, even single work-at-home freelancers have more than one computer. It really is more user-friendly to at least allow for 5 computers.<br>
      - Web embedding is the new frontier. I think foundries should allow for embedding in Flash (SIFR) but understand if they don't want to allow for @Font-Face because it is not protected.<br>
      - Consider allowing for PDF Print &amp; Preview embedding as well as, and at least, distribution to clients and press houses.</p>
      <p>Here is <a href="http://typophile.com/node/28852" rel="nofollow">another useful thread</a> about EULAs here on Typophile.</p>
