    html: |-
      <p>The EULA is a license agreement, you make the rules for this license. You can make it as complex or simple as you like, as long as it's fair for both parties.<br>
      Selling fonts for 1-5 cpus, is that you can install it on 5 cpus, so 5 people can use the font at ones. Individually; only one person can use it on one cpu. Fonts for 1 cpu (1 person) are mostly cheaper than for 1-5 cpus.</p>
      <p><cite>Does it make any sense to prohibit copying font files to a store device or sending them by email?</cite></p>
      <p>Transactions will go slower if you only prohibit sending the fonts by email.</p>
      <p>Preventing piracy is very difficult, you can better make a good EULA, after that you can always take legal steps if you find someone is abusing your work.</p>
      <p>Rudy</p>
