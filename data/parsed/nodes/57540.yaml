      <p>Just to throw out some things to think about if you're going the EULA route...</p>
      <p>As a designer, I'd love it if you licensed the font per users, rather than per CPU. I'm one user, but I own 2 computers and use them both. I'd love a license that allowed me to use the purchased font on computers I own.</p>
      <p>So, one way to think about it might be a user license vs. small studio license vs. corporate license.</p>
