      <p><em>I though the whole point of the “don’t mix sans with sans” rule was that fonts with a common lineage tend to clash. The small differences between them will subconsciously be seen as mistakes, while two very different fonts would establish contrast.</em></p>
      <p>So my advice is not to mix sans unless they are very obviously distinct.</p>
      <p>I disagree -- I often perform experiments against all those tried and true golden rules, and the "never mix sans unless they are very obviously distinct" doesn't hold up if you know what you're doing. I redesigned a large format magazine combining FF Meta with FF Info and it looked perfectly fine. Agreed, it takes some more effort and thinking through to pull it off, but that shouldn't stop you.</p>
