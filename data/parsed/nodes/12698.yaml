      <p>When I was young and daring, I used Interstate in conjunction with Agenda. Interstate did the heavy work while Agenda was strictly in the text. I'm not sure if I should be admitting such a combination but it still seems to work in an odd sort of way.</p>
      <p>Mixing sans is a difficult thing to do. I think either (A) they both have to be of the same lineage, i.e. Humanist, Grotesque, Geometric; or (B) the title face needs to be more geometric or grotesque and the text face needs to be very humanist. This is only a theory. I hope others respond to this as I'd be interested in others opinion.</p>
      <p>You are right. Magazines should not become stale.</p>
