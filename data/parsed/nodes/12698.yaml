      <p><em>"Mixing sans is a difficult thing to do. I think either (A) they both have to be of the same lineage, i.e. Humanist, Grotesque, Geometric"</em></p>
      <p>I though the whole point of the "don't mix sans with sans" rule was that fonts with a common lineage tend to clash. The small differences between them will subconsciously be seen as mistakes, while two very different fonts would establish contrast.</p>
      <p>So my advice is not to mix sans unless they are very obviously distinct.</p>
