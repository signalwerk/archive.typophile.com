      <p>How much text are you setting with a sans? Just out of curiosity? </p>
      <p>You might consider a grittier sans such as <a href="http://www.macrhino.com/" rel="nofollow">Sophisto or Stalemate</a> for the heads, captions, callouts and other things. </p>
      <p>I find that magazines which do use all sans tend to have difficulty setting forth a clear hierarchy. One important factor to consider is contrast. One obvious way to include contrast is sans versus serif. With using only sans you elimate that.</p>
