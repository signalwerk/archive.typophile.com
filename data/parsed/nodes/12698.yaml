      <p>The humanist sans is most certainly greatly over-rated. Which doesn't mean it's useless: compared to most any serif design for example it can express a distinct casualness; and compared to a geometric sans, it can express more humanity, and also be more readable. The fallacy of course is that a typeface has to be either humanist or constructed; "with us or against us".</p>
      <p>hhp</p>
