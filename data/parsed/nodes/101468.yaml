    <p>Hello everyone,<br>
    I have an issue with leading in the font I'm creating right now</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Clasing characters_5914.png"></div><p></p>
    <p>My metrics are as follows:</p>
    <p>Th highest point on the accents is 901(tops of accents and carons etc.) (my UPM is 1000)<br>
    The lowest point on descender is -250<br>
    x height: 480<br>
    cap height 675<br>
    Are my accents too big? Are they placed too far away from the base glyph?</p>
    <p>Thanks</p>
