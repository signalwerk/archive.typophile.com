    html: |-
      <p>If I read correctly, 901 is the maximum ascender value, i.e. WinAscent, not the TypoAscender (which the OP does not mention).  I've always understood that it's TypoAscender and TypoDescender that should fit within the UPM, not WinAscent/Descent.</p>
      <p>Typogruffer, what is your actual character ascender value, i.e. the highest point of any base (non-accented) character?  And do your OS/2 and hhea table metrics match it and the other values mentioned (as described in the referenced PDF)?</p>
