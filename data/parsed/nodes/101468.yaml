    html: |-
      <p>Your vertical metrics values exceed the UPM (901+250=1151) and this behaviour would indicate that you have not balanced the metrics accordingly. If you read through <a class="freelinking external" href="http://www.kltf.de/downloads/FontMetrics-kltf.pdf" rel="nofollow">Karsten Luecke's guide to font metrics</a> carefully and adjust your settings accordingly you should find that the vertical metrics start behaving as you would expect. At the very least you will have a greater understanding of what those settings change.</p>
      <p>Additionally, the Typophile threads listed below all deal with this issue in detail:</p>
      <p><a href="http://typophile.com/node/77906" title="http://typophile.com/node/77906">http://typophile.com/node/77906</a><br>
      <a href="http://typophile.com/node/13081" title="http://typophile.com/node/13081">http://typophile.com/node/13081</a></p>
