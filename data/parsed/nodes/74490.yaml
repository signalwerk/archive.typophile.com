  html: |-
    <p>Is there a sans serif typeface that is similar to Mantinia?</p>
    <p>I'm looking for a sans serif typeface with distinctive ligatures, raised small capitals, and tall capitals; but NOT like Mason Sans (by Emigre) which is too medieval.</p>
    <p>Although Sevigne by Reserves has lots of ligatures and it doesn't contain raised small capitals and it's too thin.</p>
    <p>Does anyone know?</p>
    <p>Links:<br>
    Mantinia: <a href="http://www.fontbureau.com/fonts/Mantinia" title="http://www.fontbureau.com/fonts/Mantinia">http://www.fontbureau.com/fonts/Mantinia</a><br>
    Mason: <a href="http://www.emigre.com/fontpage.php?PMasSaR.html" title="http://www.emigre.com/fontpage.php?PMasSaR.html">http://www.emigre.com/fontpage.php?PMasSaR.html</a><br>
    Sevigne: <a href="http://www.reservesca.com/index.php?act=viewProd&amp;productId=87" title="http://www.reservesca.com/index.php?act=viewProd&amp;productId=87">http://www.reservesca.com/index.php?act=viewProd&amp;productId=87</a></p>
