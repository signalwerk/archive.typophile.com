      <p>If you are willing to depart from the classical metal typefaces, you might look at some of Ted Staunton's designs for <a class="freelinking external" href="http://www.myfonts.com/search?search[text]=Sherwood+Type" rel="nofollow">Sherwood Type Foundry</a>. He bases a lot of his work on old type designs, or handwriting, and some of them would certainly give an antique air to poetry settings.</p>
      <p>- Mike Yanega</p>
