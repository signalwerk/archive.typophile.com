      <p>Both Requiem and Augustin are excellent suggestions. I think they could both work, especially Requiem (and it's cheap?!). I think we might have Requiem at work, so I can hopefully make a few test settings tomorrow.</p>
      <p>The Sherwood types look nice, but I think a bit too quirky for this book.</p>
      <p>If someone has more suggestions, they are certainly welcome.</p>
