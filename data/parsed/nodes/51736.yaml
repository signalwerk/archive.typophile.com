    <p>Hey people,</p>
    <p>I'm currently designing and typesetting a poetrybook. It's an anthology concerning the master piece or masterwork (which an apprentice had to make to be allowed in to a guild), and I want to give it a bit of a 1400's feel. I would like to have some suggestions for typefaces that breathe that era. I'm thinking Jenson / Aldus / Elzevir books here.</p>
    <p>There are some great typefaces in that style, like Jannon from StormType and also Dos Santos' new Capsa. But I would like to have a few alternatives. It's not really important that it is a true revival. Types that are inspired by them are also welcome.</p>
    <p>Thanks in advance!</p>
  html_clean: |-
