      <p>Maybe this is just a wild guess, but considering the fact that it is in all Cleartype fonts, and judging from the specifics of the glyph, my opinion is that the mysterious symbol posted by John has something to do with the font-hinting specifics in Cleartype collection. Maybe for testing exact delta-hinting details? It has all the prerequisites for this - adequate X-height, single bar in the middle and many bars outside, which would help locating discrepancies in hinting.</p>
