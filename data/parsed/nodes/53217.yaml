      <p></p><div class="imageWrap"><img src="http://typophile.com/files/circle_4772.jpg"></div><br>
      The handmark may be the most personal of symbols and to many the cross, or the crescent, the swastika etc etc, are the most meaningful. The circle is the most universal - the outline of the Sun and Moon, the eye's pupil, and the Earth itself (although it took some time to figure that out). It is also geometrically perfect and is the symbol for zero and the letter O. In its utilitarian manifestations it becomes the wheel, the dish, the wedding ring...it rules them all.<p></p>
