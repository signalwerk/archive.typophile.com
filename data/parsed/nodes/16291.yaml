    html: |-
      <p>Thierry,</p>
      <p>sorry for not responding earlier.</p>
      <p>- Migros. We worked on the logo development, commissioned by Wirz Identity in Zurich. Although there was once talk about designing a whole typeface it never came off. I am happy with the logo lettering in as far as the crafting is concerned. I believe though that Migros could have been a little braver and departed more radically from the old identity. But as you know, Migros is a cooperative society set up, so too many people and committees became involved.</p>
      <p>- Kiosk. No, we only refined the logo. We had nothing to do withthe typeface. </p>
      <p>Hope this helps. And sorry again for the delay in answering.<br>
      Bruno Maag<br>
      Dalton Maag Ltd</p>
