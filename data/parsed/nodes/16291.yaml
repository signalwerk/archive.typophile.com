    <p>Earlier this year Dalton Maag were invited by Enterprise IG to help define the typography for the updated Vodafone identity. The new typeface needed to be clean, multi-lingual, accessible and ownable.<br>
    A modified version of InterFace now carries the identity, not only in the UK, but all over Europe, including Greece and Russia.</p>
    <p>more at <a href="http://www.daltonmaag.com/">http://www.daltonmaag.com/</a></p>
