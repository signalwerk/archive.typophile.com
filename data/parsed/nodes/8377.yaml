    html: |-
      <p>If a font is <strong>so</strong> display-oriented that you're likely to set only one line in it, or be afforded the luxury of tweaking consecutive-line bumps manually, then I guess it's OK. But pretty much by definition a font is meant for setting text, text is rarely one line, and most users won't know/want to tweak stuff.</p>
      <p>And remember: everybody makes mistakes, and there's never a single Answer anyway.</p>
      <p>hhp</p>
