    votes: null
    html: <p>This has a nice feeling and promise, but to me there are real problems of consistency, and the crossbars of the a and e are main problems.  <br> <br>You have a general monoweight effect, and the joins of the branches and one part of the bowls are thick. But the crossbar on a and e are much thinner. You can go for more of a two weight sans like Franklin, or change those crossbars. Gill is generally monoweight with the two weight effect on the aeg, so you can get away with it, but not with it so extreme, I think. Also the descender on the g to me looks painfully cut off, and the bottom of the t weak.</p>
    html_clean: <p>This has a nice feeling and promise, but to me there are real problems of consistency, and the crossbars of the a and e are main problems.  <br> <br>You have a general monoweight effect, and the joins of the branches and one part of the bowls are thick. But the crossbar on a and e are much thinner. You can go for more of a two weight sans like Franklin, or change those crossbars. Gill is generally monoweight with the two weight effect on the aeg, so you can get away with it, but not with it so extreme, I think. Also the descender on the g to me looks painfully cut off, and the bottom of the t weak.</p>
  - id: 55649
    user: 1250
    date: 2004-12-29T22:33:00
    date_raw: 29 Dec 2004 — 10:33pm
    votes: null
    html: "<p>I think this is very nice - makes me think of Yellow and Fontana having a kid. <br>It's cohesive, original, legible. And some of the glyphs are very charming. <br> <br>William's point about the \"a\" and \"e\" crossbars is valid on a formal level, but I <br>happen to think your approach can be a valid solution sometimes, including here. <br> <br>The most obvious issues to me: <br>- The dots of the \"i\"/\"j\" extend too far up (especially in #2). <br>- The bar of the \"L\" is too heavy (although less in the #2). <br>- The \"4\" is too wide. <br>- The \"&amp;\" is too playful (and too dark in the #2). <br> <br>There are also some smaller things (like the \"E\" being maybe slightly too wide) but those are iffy. <br> <br>Spacing: a bit too loose. <br> <br>Great stuff overall! <br> <br>hhp</p>"
    html_clean: "<p>I think this is very nice - makes me think of Yellow and Fontana having a kid. <br>It's cohesive, original, legible. And some of the glyphs are very charming. <br> <br>William's point about the \"a\" and \"e\" crossbars is valid on a formal level, but I <br>happen to think your approach can be a valid solution sometimes, including here. <br> <br>The most obvious issues to me: <br>- The dots of the \"i\"/\"j\" extend too far up (especially in #2). <br>- The bar of the \"L\" is too heavy (although less in the #2). <br>- The \"4\" is too wide. <br>- The \"&amp;\" is too playful (and too dark in the #2). <br> <br>There are also some smaller things (like the \"E\" being maybe slightly too wide) but those are iffy. <br> <br>Spacing: a bit too loose. <br> <br>Great stuff overall! <br> <br>hhp</p>"
