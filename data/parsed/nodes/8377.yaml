    html: |-
      <p>Terry, I think you're starting to see everything as a signage face...  :-)</p>
      <p>I agree that simply <strong>lowering</strong> the dots of the "i"/"j" would make things worse. But that's not necessarily what I'd change: I might make the dots flatter; and/or I might actually reduce the height of the stems - the Grid should be a tool, not a straightjacket. And after all, what is raising the dots further if not breaking the grid too? The reason not to raise them further (or even keep them so high) is potential line-to-line bumping (on shorter measures).</p>
      <p>hhp</p>
