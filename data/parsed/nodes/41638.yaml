    <p>Dear Typophiles</p>
    <p>I’ve searched the archives and I’ve googled the Google. I’m looking for a digital version of Bradbury Thompson’s Alphabet 26. The archive pulls up discussion regarding dyslexia and another regarding unicase fonts. Not the topics I’m interested in.</p>
    <p>Any mention of Alphabet 26 links to: <a class="freelinking-external" href="http://www.pbtweb.com/alpha26/alpha.htm">http://www.pbtweb.com/alpha26/alpha.htm,</a> which states “Paul Baker, with feedback from the late Bradbury Thompson, has produced a new, digital version of Alphabet 26. It will soon be available here, and from Monotype Typography.” There’s no date on the article, nothing shows up elsewhere on the Baker website, and Monotype’s fonts.com doesn’t list it either.</p>
    <p>Though Peignot, Filosofia, Panoptica, and Hammer’s uncials are all fine, I’m not looking for an alternative unicase. Any hints, suggestions, options? Is there an Alphabet 26 out there by another name?  Or do clever folks just build one themselves?</p>
