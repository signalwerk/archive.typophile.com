      <p>Don't have a perfect match but...<br>
      <a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">United Sans Semi Condensed Heavy</a>: overall design is very close (if not matching) but needs to be slanted (to avoid corresponding italic spurred /R) and removed serifs on /I<br>
      <a class="freelinking external" href="http://www.losttype.com/font/?name=liberator" rel="nofollow">Liberator</a>: "only" needs to be slanted but a bit off to me<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/octin-college/" rel="nofollow">Octin College</a>: see Liberator<br>
      Different bowls: <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Headline+Fonts/Hoboken+High" rel="nofollow">Hoboken High Sans</a>, <a class="freelinking external" href="http://www.dafont.com/jersey-m54.font" rel="nofollow">Jersey M54</a>, <a class="freelinking external" href="http://www.dafont.com/pop-warner.font" rel="nofollow">Pop Warner</a>, <a class="freelinking external" href="http://fontfabric.com/rex-free-font/" rel="nofollow">Rex</a></p>
