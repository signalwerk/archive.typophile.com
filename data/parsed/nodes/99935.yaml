      <p>Don't have a perfect match but...<br><a href="http://www.houseind.com/fonts/unitedcollection" title="Click to visit an external URL." class="freelink freelink-external freelink-external">United Sans Semi Condensed Heavy</a>: overall design is very close (if not matching) but needs to be slanted (to avoid corresponding italic spurred /R) and removed serifs on /I<br><a href="http://Liberator" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Liberator</a>: "only" needs to be slanted but a bit off to me<br><a href="http://www.myfonts.com/fonts/typodermic/octin-college/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Octin College</a>: see Liberator<br>
      Different bowls: <a href="http://lineto.com/The+Fonts/Font+Categories/Headline+Fonts/Hoboken+High" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Hoboken High Sans</a>, <a href="http://www.dafont.com/jersey-m54.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Jersey M54</a>, <a href="http://www.dafont.com/pop-warner.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Pop Warner</a>, <a href="http://fontfabric.com/rex-free-font/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Rex</a></p>
