    <p>As seen <a class="freelinking external" href="http://typophile.com/node/89441" rel="nofollow">here</a>, I've been modifying the B from Erato Light in an attempt to recreate this exotic letterform. I would like now you to be constructively critic on it. I'll be grateful for any suggestions.</p>
    <p>The word Bruna is just a dummy. I've experimented a different R too, as a way of balancing the extra weight of the new B. Does that even make any sense? Opinions on it will be welcome.</p>
    <p>Below, Erato Light, the modified B and the modified B e R, respectively.</p>
    <p><a href="http://tinypic.com?ref=1zvtr3r" target="_blank" rel="nofollow"><img src="http://i41.tinypic.com/1zvtr3r.jpg" border="0" alt="Image and video hosting by TinyPic"></a></p>
