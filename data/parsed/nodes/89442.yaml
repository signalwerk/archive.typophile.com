      <p>It depends on the desired effect:<br>
      If you like/need the B to stand out and/or be used alone, you could even leave R unchanged (or modify it more subtly: the gap now is a bit too wide).<br>
      If you like/need that all letters appear to belong equally to the same font, I think you should modify R and probably A a bit more, adding serifs like the new ones in the new B.</p>
