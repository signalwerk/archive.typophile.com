    html: <p>One suggestion is to find an old typewriter font like Blake Haber's 'Love Letter'( see this <a href="http://www.typophile.com/forums/messages/83/11180.html?1054058415" target="_blank">old Typophile thread</a>). Most servicemen during the 40's were likey to see typewritten mail (if it wasn't handwritten). <br> <br>Blake told me it was from his grandparents' typewriter.</p>
