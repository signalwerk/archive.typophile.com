    html: <p>Can you do some research and post some samples? Google? <br> <br>Otherwise I suggest checking out <a href="http://www.myfonts.com/search?search%5Btext%5D=40s&amp;itemsperpage=53&amp;resultcount=53&amp;page=1" target="_blank">myfonts</a> for starters. <br> <br>Also check <a href="http://www.retroadart.com/" target="_blank">this</a> site out, and I recommend <a href="http://www.houseind.com/househome/housegothic/index.html?cart=309802246267793" target="_blank">House Industries</a> particularly Neutraface, Signpainter, Las Vegas. <br> <br>See also <a href="http://www.adflip.com/view_decade.php?" target="_blank">this</a> site which has an archive of 40s ads.</p>
