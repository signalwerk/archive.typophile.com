      <p>Watch you for Irma Slab from <a href="http://www.typotheque.com" rel="nofollow">Typotheque</a>!<br>
      This caps-only typeface looks like it could fit your bill of a ‘contemporary version of Lubalin Graph’. Irma Slab comes in 9 weights and is the companion to Irma (Sans). The fonts sport a number of fancy display ligatures. Additionally, each letter has inverse and half-inverse alternates that allow creating rhythmic patterns.<br>
      F</p>
