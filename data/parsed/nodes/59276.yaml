      <p>There is a very interesting, long discussion of different slabs and the development of Archer, in <a class="freelinking external" href="http://typography.com/ask/index.php" rel="nofollow">this talk</a> by Hoefler and Frere-Jones. The first half is Jonathan Hoefler arguing that revivals are dead, and then the second half has Frere-Jones talking about Archer and Escrow, their Wall Street Journal text face. </p>
      <p>Frere-Jones by the way really hates Lubalin Graph, and the strict geometric slabs in general, which he says "just die on the page."</p>
      <p><a class="freelinking external" href="http://designconference2007.aiga.org/resources/content/4/4/6/3/documents/aiga_next_affinity_typography.mp3" rel="nofollow">Here is a direct link to the audio.</a></p>
