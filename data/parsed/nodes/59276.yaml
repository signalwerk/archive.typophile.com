    <p>Looking for a more contemporary version of ITC Lubalin Graph...but not trendy. A wide range of weights, too.</p>
    <p>For example: I think of FF Kievit as a contemporary version of Helvetica...a bit more geometric than Helvetica but similar in functionality and feel.</p>
