      <p><em>...but not trendy...</em></p>
      <p>Who are you kidding--slab serifs are trendy right now, isn't that why you want one?<br>
      Just something a little more recherché than Archer!</p>
      <p>As Avant Garde is an update of Futura, so Lubalin Graph is an update of Memphis.<br>
      But are there other "pure" geometric slab serif styles that have the single storey "a" and "g"?--if indeed that's your criterion for mentioning Lubalin Graph, or are you looking to cast the net wider?</p>
      <p>My slab: <a href="http://www.shinntype.com/bodoni.html" rel="nofollow"> Bodoni Egyptian</a>.</p>
