      <p>In my eyes, Kievit is quite far from Helvetica. I wouldn't say it's more geometric neither. Kievit is a <em>humanist</em>, Helvetica a <em>neo grotesque</em>. </p>
      <p>If you're looking for another <em>geometric slab serif</em> (like Lubalin Graph), maybe you'll like Rockwell or Register Serif BTN.</p>
      <p>If you want a more humanist touch to your slab, take a look at Archer, Serifa and PNM Caecilia. Those are some of my favourites. Actually, Archer take cues from both geometric and humanist designs, and might be just what you're looking for.</p>
