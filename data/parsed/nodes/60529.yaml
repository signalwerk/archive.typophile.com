    <p>I've recently decided to get a small tattoo of the Latin phrase "plus ultra" in all lowercase italics (I haven't quite decided where yet) but I'm having trouble coming up with a typeface that is quite what I'm looking for. I know very little about typography, but I feel like I'll know it when I see it.</p>
    <p>I'm looking for something that is simple and clean, but will not be without visual interest on its own. I don't want something very bold nor something flowery but I'm hoping to find a balance between delicacy and strength. It's a motto I live by, and I want the font I display it in to reflect that. I want it to convey futurism and optimism without being gaudy or trendy. I've seen fonts capture an emotion brilliantly before and I'm hoping to find one that can do that for me too. </p>
    <p>I typically like serifs, but I'm flexible. My favorites so far are Cochin and Perpetua, but they're not quite interesting enough to me (although I love the italic lowercase "s" of Cochin). I also like Helvetical Neue Ultra Light, but it doesn't really have the gracefulness I'm looking for. Cursive seems too self-conscious, if that makes any sense. </p>
    <p>Sorry I can't be more specific than that. =/ Any thoughts? I'd be interested in having someone design it for me if the price is right and they know what I want, but I've never commissioned an artist before, so I wouldn't know what to expect of the process. I just figured typophiles would get what I'm looking for better than a tattoo artist. :)</p>
    <p>Thanks so much for any advice you might have!</p>
