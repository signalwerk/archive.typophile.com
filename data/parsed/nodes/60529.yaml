      <p>When you mention "futurism and optimism", do you mean it as a theme or a concept? As in do you want the font to have a modern feel to it as well, or you prefer a generally conventional looking typeface. And does it have to be Italic? Is it because of how it can relate to the meaning of the phrase "plus ultra"?</p>
      <p>I personally would choose Eplica because of its elegant and yet structured form.</p>
