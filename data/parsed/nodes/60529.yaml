      <p>Arno has a particularly fine italic. Chaparral's italic might also have some of the characteristics you're looking for.</p>
      <p>When I got my tattoo, I wanted it in a typeface that wasn't going to go out of style anytime soon, so I got it in Garamond Premier Pro Semibold, since Garamond's been around for 500 years and probably isn't going anywhere in my lifetime. Something to consider. Also, in retrospect I should have gotten the regular weight; I got semibold because I thought the characters in the regular weight would be too delicate to tattoo precisely. I should have realized that my artist was really skilled, and he wouldn't have had any trouble with it.</p>
