  html: <p>As I said in a <a class="freelinking external" href="http://typophile.com/node/78024" rel="nofollow">recent thread,</a> I am working with the OpenType LatPro encoding. I am curious about why longs_t is the only longs- ligature. It seems odd to me because it is certainly a not-so common glyph. I mean, if I were to include some ligature with longs, I’d go first for something like longs_i, longs_l or even longs_longs (i. e., the equivalents to f_i, f_l and f_f, the most common f- ligatures).</p>
