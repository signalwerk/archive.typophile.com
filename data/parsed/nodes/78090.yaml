    html: |-
      <p>The first seven slots of the Unicode Block "Alphabetic Presentation Forms" are Latin ligatures. As such they have become "Grandfathered In" and many ad hoc encodings simply take this pattern and run with it:</p>
      <p><code><br>
      f_f     ------- FB00  LATIN SMALL LIGATURE FF<br>
      fi      -------- FB01  LATIN SMALL LIGATURE FI<br>
      fl      -------- FB02  LATIN SMALL LIGATURE FL<br>
      f_f_i   ----- FB03  LATIN SMALL LIGATURE FFI<br>
      f_f_l   ----- FB04  LATIN SMALL LIGATURE FFL<br>
      longs_t --- FB05  LATIN SMALL LIGATURE LONG S T<br>
      s_t     ------- FB06  LATIN SMALL LIGATURE ST<br>
      </code></p>
