    <p>Hey all,</p>
    <p>I'm interested in setting some résumés for family and I was wondering what fonts you've set résumés in before, and what typefaces work best for that sort of thing. I did my sister's résumé recently in Garamond, at her request.</p>
    <p>Do you know of any great or outstandingly beautiful résumé designs that stuck with you?  I'm under the impression that a résumé should be a beautiful classical design, but I'm curious to see how more contemporary typefaces can be integrated.</p>
    <p>Thanks a million!</p>
