      <p>I always set my résumé in something like Caslon - even when applying for design-related jobs; and pay extra attention to the margins and general layout of the page.</p>
      <p>This isn’t the place for you to shine as a designer or typographer, this is the place to try and convey the information with as little distractions as possible. (If you're setting a designer’s résumé, you have the portfolio that can take care of that other bit.) Go for too much color, too much ornamental bits or too creative typefaces; and it looks like you're trying to take the attention off of the content.</p>
      <p>Make it instantly scannable and readable, and let it be up to the content to grab the attention, not the typeface.</p>
