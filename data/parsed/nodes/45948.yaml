      <p>I use to typeset resumés for many designers in New York City during the 1980s and 1990s. One thing that was always asked for was a simple, easy-to-read format. We'd use a display type or even logo for the person's name --and then a clean cut serif font. </p>
      <p>I was always asked to make the resumé fit on one side only. No matter how much experience the person had. There were many different theories but this made sense. The resumé would be the first thing looked at by someone who doesn't know you and is being bombarded with everyone's resumé for the same job. The designers I dealt with believed their portfolios would speak up and be different enough to make them stand out - but that first piece of paper to introduce them was extremely important. It was the ticket in.</p>
      <p>When it comes to creative resumés there are several great examples. Dewine's Bogart-look-a-like resume -- Would you hire this Art Director? Another well known one I think may have been a Chas. creation -- of a fold paper -- that when opened (all folds lead to the center - sort of looked like a camera lense) confetti popped out of it. Sure made an impression, but didn't want to be the person who cleaned up the confetti!</p>
      <p>I think there may be a thread already on typophile on this topic where many ideas were brought forth.</p>
