  html: |-
    <p>So who's headed to TypeCon? They've just posted their schedule for the 5-day typography extravaganza taking place in New Orleans, July 5-10. If you've never gone, TypeCon is a blast and very inspiring. Half the fun is meeting up with people you're interacting with daily on Typophile. You'll be glad you went! Full details here: <a href="http://www.typecon.com/program" title="http://www.typecon.com/program">http://www.typecon.com/program</a>.</p>
    <p>Which speaker/event are you most looking forward to?</p>
