  html: |-
    <p>For my typeface design class I'm planning on developing a font based around this photograph of a sign I found online. Before I begin, I was curious to see if it was an actual font, or personally designed for Kenmore Lanes.</p>
    <p>As I was doing some sketches I found it has a similarity to Futura, but the r, k, and e tell me it's not.</p>
    <p>Any help would be greatly appreciated!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/kenmoretwo_6384.jpg"></div><p></p>
