    html: |-
      <p>Because identical letters are not identical it points to a hand-drawn logo, or something hand-customized.</p>
      <p>Similar fonts could be <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories_search=font_name_search&amp;searchstr=Mason&amp;image.x=18&amp;image.y=8" rel="nofollow">Mason Serif (or Sans)</a> from Emigre.</p>
      <p>Another called <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.100732.0.0" rel="nofollow">'Blackfriar'</a> actually has horns on the 'g'.</p>
      <p>For some reason <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=C.100897.0.0" rel="nofollow">Percolator</a> seems to show up in a lot of devil-ish contexts, maybe because it 'perverts' normal letters?</p>
      <p>Another font with somewhat arcane letterforms is Font Bureau's <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FB.111998.0.0" rel="nofollow">Saber</a>.</p>
      <p>There are many others that just need some imagination and creepy shading to look sinister.</p>
      <p>- Mike Yanega</p>
