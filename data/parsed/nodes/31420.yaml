    <p>Hi there :)</p>
    <p>I was hoping anyone here could help me identify a font my client wants to use for a horror show. The font looks sort of satanic. The capital letter "S" has a devilish tail attached at the bottom, the "t" looks like a tall catholic cross, and the "o" has a cross inside it. The lower case "i" appears in two different hights.</p>
    <p>Any help would be tremendously appreciated! Thanks, Tanya</p>
    <p>PS If anyone can recommend another satanic/devilish type font, that would be great too!</p><div class="imageWrap"><img src="http://typophile.com/files/SatanicFont_4675.jpeg"></div><p></p>
