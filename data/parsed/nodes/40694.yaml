    html: '<p>Nicola: <a href="http://www.tiro.nu/Articles/sylfaen_article.pdf" rel="nofollow">Sylfaen</a> is a serif typeface designed by <a href="http://www.typophile.com/user/1262" rel="nofollow">John Hudson</a> for Microsoft and is included with Windows XP by default. Color-wise, Gill Sans is still a bit darker, but using its light weight instead of the regular it might provide a somewhat harmonic companion to it. I would give it a shot, too.</p>'
