    html: |-
      <p>Ciao Nicola (Antonio from studio Bunker speaking): as a companion typeface for Gill Sans, I think David’s push for Joanna is rather appropriate. It’s a lovely typeface and it’s somewhat underused here in Italy. I’m not fond of Perpetua, either.</p>
      <p>Your other requirement that it be available by default on Windows machines is a bit of a problem, actually. As serif typefaces you have Times New Roman, Garamond, Bookman Old Style and Book Antiqua. All these are pretty shoddy renditions of other typefaces and they’re not very good as a complement to Gill Sans. You also have Georgia, which is a very good typeface, but whose proportions (x-height, ascenders and descenders) make it not a very good companion to Gill, either.</p>
      <p>From the list linked by David, Hightower Text might be good fit, I would run a test print and see how it looks paired with Gill Sans. Proportions seem to match, at least, although a Venetian plus a beginning of last century sans might be stretching it a bit.</p>
      <p>Maybe you could try using <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=CharisSILFont" rel="nofollow">Charis SIL</a>, which is a free typeface being derived from Charter, designed by Matthew Carter for office usage on mid-resolution devices. SIL also offers for free another fine typeface called <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" rel="nofollow">Gentium</a>, which you might try, but neither of these looks like a perfect fit color and proportions-wise, I’m afraid.</p>
