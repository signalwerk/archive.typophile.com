    html: <p>This is not unusual. Sometimes these are typefaces commissioned by the foundries, or in other cases they are sold to the type foundry after the fact, <br> <br>In our case, Adobe used to operate largely on a royalty basis, but for business and legal reasons has recently moved more towards a fully-paid-up-front model. <br> <br>Regards, <br> <br>T</p>
