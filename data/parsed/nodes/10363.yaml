    html: |-
      <p>I am unsure of the 'rules' for this forum.  If I'm breaking any, would someone please let me know---</p>
      <p>I own a digital art image, scrapbook, inspirations, consignment store. All of our artists and designers own all rights to their works. We offer a store front where these designers can place their products for sale under the Angel Policy. This policy allows customers to purchase our product, download it to their computer, print and create crafts and paper items in tangible format and sell the product in craft fairs, stores, online or off. (Our Angel Policy does not allow the customer to create a derivative work and sell or distribute it in digital or downloadable format. Only paper and tanbible handcrafted items can be made and sold (in tangible format only) by our customers).</p>
      <p>I am looking for font designers who are interested in selling their True Type Fonts subject to our angel policy at my site: <a href="http://daisiecompany.com" title="http://daisiecompany.com">http://daisiecompany.com</a></p>
      <p>I am also looking for AlphaBets (Graphic Alphabets and Numbers with a few punctuation marks: ! @ # ? ~ { }.<br>
      These alphabets are not true type fonts. They can be sold to our customers under the Angel Policy, for the purpose of making word art and background papers for personal use only.</p>
      <p>The Angel Policy for fonts means that your fonts could be used for personal items only. This means that the customer purchases the right to type words onto their craft projects, and scrapbook layouts. The Angel Policy would not allow them to distribute the font in any other format than printed onto their handmade item. No commercial use of fonts is allowed under this policy.</p>
      <p>Also, looking for a commercial use agreement with font designers, as I would like to incorporate fonts into my word art, overlays and papers. It would be a great way for font designers to make some real money, retain all rights, rather than selling the fonts or contracting a small percentage licensing arrangement.</p>
      <p>Payment is made biweekly and the percentages paid to the designers/artists/ font designers for products sold is better than 50%</p>
      <p>Font designers can offer a multiple font bundle and sell them as a set of scrapbook fonts. We are looking for everything from cute fonts, elegant script to grunge block lettering.</p>
      <p>To submit, type your alpha into a word doc, and include your name and email address. Send an email with your attached word doc to <a href="mailto:ginajane@daisiecompany.com">ginajane@daisiecompany.com</a>.</p>
      <p>I would love to hear from you.</p>
      <p>*** gina jane ***</p>
      <p><a href="http://www.daisiecompany.com" title="http://www.daisiecompany.com">http://www.daisiecompany.com</a></p>
      <p>'relationships are the greatest art'</p>
