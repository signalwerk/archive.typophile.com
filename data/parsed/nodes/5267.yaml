  html: "<p>Hi, <br>I am working on a student project and I'm looking to get that cramped up credit font at the bottom of movie posters. I.e. have a look at: <a href=\"http://www.imdb.com/gallery/ss/0364725/Ss/0364725/Onesheet_text.jpg?path=gallery&amp;path_key=0364725\" target=\"_blank\">http://www.imdb.com/gallery/ss/0364725/Ss/0364725/Onesheet_text.jpg?path=gallery&amp;path_key=0364725</a> <br> <br>the font displaying the \"20th century fox, written &amp; direct by\" etc. Anyone know how to do that?</p>"
