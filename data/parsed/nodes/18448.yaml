    <p>I love so many things. One of them being fat script typefaces. And one of these, some of you may have seen before, but some / most, like me, may not, is '<a href="http://www.veer.com/partner/link.aspx?i=1129&amp;p=products/typedetail.aspx?image=UMT0000173" target="_blank" rel="nofollow">Whomp</a>', by <a href="/wiki/Alejandro%20Paul" class="freelinking" rel="nofollow">Alejandro Paul</a> / <a href="http://www.sudtipos.com" target="_blank" rel="nofollow">SudTipos</a>, based on the lettering of Alf Becker. Released by Veer, this sure has instantly become my brandnew favourite 'fat script'. Lovely Lettering. Whomp, There it is.</p>
    <p><em><a href="http://www.veer.com/partner/link.aspx?i=1129&amp;p=products/typedetail.aspx?image=UMT0000173" target="_blank" rel="nofollow">www.veer.com/products/typedetail.aspx?image=UMT0000173</a></em></p>
    <p><em>Addendum: If anyone would like to buy me a license of 'Whomp', as a present / a gift, I sure as hell would accept and appreciate it. :)</em></p>
