      <p>(Thanks for your support Tomi! we agree.)</p>
      <p>cufflinks: The price start at 210 euros (not 250 euros) for 6 weights including very large glyph set, many OpenType features. Considering the fact that its quite a new family, it still not very widely used, its a valuable purchase for you and your client.</p>
      <p>Perhaps you can at least try the Dingbats font available here: <a href="http://allumi.typofonderie.com/free-dingbats-font" title="http://allumi.typofonderie.com/free-dingbats-font">http://allumi.typofonderie.com/free-dingbats-font</a></p>
      <p>In a distance future (probably before the summer), we will publish the Std version, starting at 140 euros. I can't confirm anything yet, but if you have time…</p>
      <p>ps. Perhaps we should suggest to don't paid you too, as you're "really too expensive," or propose an online free resources for very nice graphic jobs instead? ;)</p>
