      <p>JFP, if $210 is out of cufflink's budget, would he/she be able to purchase a single weight from you at a lower price? It may not be free, but could be a good compromise.</p>
      <p>Other than that, I can just repeat what the others have said. With fonts, if you want quality, you (generally) have to pay for it.</p>
      <p><a href="http://www.fontsquirrel.com/" title="http://www.fontsquirrel.com/">http://www.fontsquirrel.com/</a> seems to have free fonts that are higher quality than other free sites. Just make sure you check the licence on the font you're downloading to make sure it's free for your intended use.</p>
      <p> - Lex</p>
