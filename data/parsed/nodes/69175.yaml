    <p>Hi there</p>
    <p>I really like the font from Allumi PTF. Especially the curved "A" letter. It cost 250 euros to buy, so I'm hoping if I could find a similar font to Allumi PTF.</p>
    <p><a href="http://cdn.ilovetypography.com/img/2010/01/allumi-ptf.png" title="http://cdn.ilovetypography.com/img/2010/01/allumi-ptf.png">http://cdn.ilovetypography.com/img/2010/01/allumi-ptf.png</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/allumi-ptf_4326.png"></div><p></p>
    <p>Would be great to hear from anyone who has recommendation for a similar curved "A" font that's free for download. </p>
    <p>Thank you!</p>
