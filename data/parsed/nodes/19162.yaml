    <p>Hi, This may not be strictly a Type ID board question, but I was told this is a sample of PostSerif by Richard Lipton from 1998, for Font Bureau. Maybe associated with the National Post (newspaper?). I Googled these key words and was not able to find confirmation. Does anyone know if there is an italic face for this family? I found something that talked about versions of FB Miller being done for the National Post, and I wonder if this is another name for Miller Condensed.</p>
    <p>Does anyone know about this typeface?</p>
