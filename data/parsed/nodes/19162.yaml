    html: |-
      <p>I think I can close this one out with a reply I received from Harry Parker of Font Bureau. He said that they did indeed design Post Serif for the National Post newspaper in 1999, and that it was done in four weights: Light, Roman, Bold and Bold Condensed (notice no italics). He said that they also licensed several cuts of Miller to the Post, both before and after the work on Post Serif. The Miller versions were mostly for display type, he said.</p>
      <p>- Mike Yanega</p>
