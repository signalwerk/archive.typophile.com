      <p>I tried following the Lacava &amp; ’National Post’ leads and seemed to find reinforcement that the main serif font for that paper was Matthew Carter’s ’Miller’ for Font Bureau. Seems that Lacava has collaborated with Font Bureau a number of times, but I cannot link Richard Lipton with Lacava Design, or the National Post design.</p>
      <p>Thanks Marc, that was a good lead. I must admit I never heard of Lacava Design, but she’s been involved in many newspaper makeovers.</p>
      <p>- Mike Yanega</p>
