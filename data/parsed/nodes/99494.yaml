    html: |-
      <p>The lowercase gets some differences indeed.<br>
      My wood type may be a redesign or a copy from the same model (i.e. the Windsor designed by Elisa Pechey in 1905?)?</p>
      <p>It seems that the Xilografia Internazionale Legnago also collaborated from time to time with type designer Umberto Fenocchio, whose Linea typeface ( <a href="http://www.umbertofenocchio.it/linea.php" title="http://www.umbertofenocchio.it/linea.php">http://www.umbertofenocchio.it/linea.php</a> ) seems to me one of the hundred akzidenz/helvetica local redesigns (I've also found some digital rip-offs of this font).</p>
      <p>Still, since I was searching for original wood types to digitalize, I guess I'll just have to discard this font.</p>
      <p>Here are some pictures or the geometric grotesk font from the archives, do you have an ID for it too?</p>
