    <p>Hi, I'm working on my thesis project which consists in tracing the origin of a huge set of wooden type letters we've got in the fine art academy I study in.<br>
    The types seems to come from Xilografia Internazionale Legnago, a xylography industry from Northern Italy.<br>
    Among them there is a ultra-compressed grotesk, a geometric sans-serif, a display slab serif and an egyptian display font.</p>
    <p>Yesterday, after photographing all the type, I walked to my local supermarket and noticed the very same egyptian font on display on the streets. The uppercase E is almost unmistakeable.</p>
    <p>Do you have any idea what this font is?</p>
    <p>thanks!</p>
    <p>a.</p>
