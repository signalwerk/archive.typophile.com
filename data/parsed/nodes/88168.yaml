    <p>CoreHumanistSans Light and Bold are now available at Fontspring.<br>
    <a href="http://www.fontspring.com/fonts/fonts-by-alex/corehumanistsans" title="http://www.fontspring.com/fonts/fonts-by-alex/corehumanistsans">http://www.fontspring.com/fonts/fonts-by-alex/corehumanistsans</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CHS-1_5621.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/CHS-2_3587.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/CHS-3_5424.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/CHS-4_5613.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/CHS-5_3638.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/CHS-6_5018.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/CHS-7_5220.jpg"></div><p></p>
    <p>You can view a PDF specimen here <a href="http://www.fontsbyalex.com/images2/CoreHumanistSans_specimen.pdf" title="http://www.fontsbyalex.com/images2/CoreHumanistSans_specimen.pdf">http://www.fontsbyalex.com/images2/CoreHumanistSans_specimen.pdf</a></p>
    <p>The free Regular version is updated to version 1.1, with a number of small fixes and changes, mainly concerning accented characters and ligatures and harmonisation with the other styles. It can be downloaded from <a href="http://www.fontsbyalex.com/" title="http://www.fontsbyalex.com/">http://www.fontsbyalex.com/</a></p>
