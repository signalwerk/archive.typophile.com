  html: <p>APOLLO 26 to release DEFCON DESIGN KIT <br>------------------------------------------------ <br>Los Angeles-based design trio Apollo 26 has launched its site and is proud to announce its first retail release, DEFCON, an eclectic mix of digital elements for designers and hobbyists. The DEFCON Design Kit features original fonts, icons, digital illustrations, fotos, and sounds. Each Design Kit comes packaged in a Limited-Edition Collector's Tin with goodies such as a T-shirt and postcards. Only 199 of the Design Kits will be sold, ensuring their rarity and collectability. Reserve yours today before they are gone. The Design Kits are affordably priced for students and individuals. Please visit <a href="http://www.apollo26.com" target="_blank"> www.apollo26.com</a> for more information.</p>
