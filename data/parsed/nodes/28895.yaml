  html: "<p>I am sure that many of you with a different cultural background or better education than I are aware of <a href=\"/wiki/Iakov%20Chernikhov\" class=\"freelinking\" rel=\"nofollow\">Iakov Chernikhov</a>. I only just found out about him when a colleague forwarded me <a href=\"http://www.icif.ru/Engl/index.htm\" rel=\"nofollow\">Iakov Chernikhov International Foundation (ICIF)</a>. There's a nice <a href=\"http://www.icif.ru/Engl/about.htm\" rel=\"nofollow\">biography</a>, but the thing that really caught my eye was this: <a href=\"http://www.icif.ru/Engl/cyc/font/index.htm#1\" rel=\"nofollow\">Construction of the Classic Type</a>. That and the awesomely awesome architectural drawings and other graphics.</p>"
  html_clean: "<p>I am sure that many of you with a different cultural background or better education than I are aware of <a href=\"/wiki/Iakov%20Chernikhov\" class=\"freelinking link-lost\" rel=\"nofollow\">Iakov Chernikhov</a>. I only just found out about him when a colleague forwarded me <a href=\"http://www.icif.ru/Engl/index.htm\" rel=\"nofollow\" class=\"link-external\">Iakov Chernikhov International Foundation (ICIF)</a>. There's a nice <a href=\"http://www.icif.ru/Engl/about.htm\" rel=\"nofollow\" class=\"link-external\">biography</a>, but the thing that really caught my eye was this: <a href=\"http://www.icif.ru/Engl/cyc/font/index.htm#1\" rel=\"nofollow\" class=\"link-external\">Construction of the Classic Type</a>. That and the awesomely awesome architectural drawings and other graphics.</p>"
