    html: <p>You don't say what form you saw the font in -- printed, or an actual font. There is a Ballardvale series used by Balfour-Taylor, the giant yearbook publisher in the US, although the PDF I found doesn't show a condensed version. There is a trainer for Balfour, Hal Schmidt, located in Houston, TX who might shed some light on the origin of the font. His email is hal -at- halschmidt dot com</p>
