    html: |-
      <p>The original typeface is <a class="freelinking external" href="http://www.linotype.com/1222/Melior-family.html" rel="nofollow">Melior</a>, designed by Hermann Zapf for the typefoundry D. Stempel AG in Frankfurt in 1952. That is way before Compugraphic came up with ‘Ballardvale’ for <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/melior/" rel="nofollow">obvious reasons</a>. The typeface collections of Stempel, Compugraphic and Bitstream all went to Monotype. In many cases the Compugraphic and Bitstream knock-offs were withdrawn from the market. For obvious reasons, I guess …<br>
      On Luc Devroye’s website you’ll find an <a class="freelinking external" href="http://luc.devroye.org/fonts-38347.html" rel="nofollow">extensive list</a> of original names followed by the names of the knock-offs (not only Bitstream, but also Compugraphic, Scangraphic and many others).</p>
      <p>Or what do you mean by ‘final name’?</p>
