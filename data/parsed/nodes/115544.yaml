    html: <p>Compugraphic was a US manufacturer of typesetting machines, and in the 1980s they copied popular typefaces and sold them as proprietary fonts to use with their machines. To avoid lawsuits from the foundries that issued the original fonts, Compugraphic gave their copies new names. Palatino became "Palomino," Optima became "Oracle," and Frutiger became "Frontiera." Compugraphic's Melior knockoff went by several names, one of which was "Ballardvale," named after the street in Wilmington, Massachusetts where their headquarters was.</p>
    html_clean: <p>Compugraphic was a US manufacturer of typesetting machines, and in the 1980s they copied popular typefaces and sold them as proprietary fonts to use with their machines. To avoid lawsuits from the foundries that issued the original fonts, Compugraphic gave their copies new names. Palatino became "Palomino," Optima became "Oracle," and Frutiger became "Frontiera." Compugraphic's Melior knockoff went by several names, one of which was "Ballardvale," named after the street in Wilmington, Massachusetts where their headquarters was.</p>
