  html: <p>I came about a font called Ballardvale, which somewhat looks like Melior or Renault. But the font I saw is called Ballardvale medium-condensed, and having searched for Google, I saw no results. Could someone give me some information, or hopefully, any links to buy the font? Thank you.</p>
