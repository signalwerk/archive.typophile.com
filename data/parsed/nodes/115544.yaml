      <p>Font forgery. This has been around since the invention of electrotyping in the 19th century. As for digital forgers check out <a href="http://www.sanskritweb.net/forgers/" title="http://www.sanskritweb.net/forgers/">http://www.sanskritweb.net/forgers/</a><br>
      Not everything on the site is accurate, but it's educational to go though the material.<br>
      At least try and purchase fonts from sources that give something back to the designer, if they are still with us, and to the legitimate successors if this is not possible.<br>
      Don</p>
