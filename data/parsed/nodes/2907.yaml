    html: <p>Looking at that web site, the lettering of "MARSTRAND" added an M and and S. I think <a href="http://www.myfonts.com/fonts/bitstream/della-robbia/bold/testdrive.html?s=GRAND%2BHOTELL%2BMARSTRAND&amp;p=36" target="_blank">Della Robbia</a> is a closer starting point, and it comes from a closer time period (designed in 1902). Note the crotch of the M is higher and the serifs on it have a closer look to the lettering on the site. Thomas Cleland made Della Robbia based on rubbings of stonecut letters he saw in Rome, so the letterforms are certainly old enough to perhaps have influenced the designer of this typeface too. (Of course, when the hotel was built does not prove when the typeface was designed, but I am assuming this typeface has been used by them for a long time.)</p>
