    html: <p>We still haven't heard that this comes from something new enough to have been done digitally. I agree Cantoria (or Della Robbia),or Flange, or Newtext, or other current fonts could be manhandled to look like this, but it may be that an old European metal type was exactly this face. I wish the poster Kari would give us a clue about the origin of this sample. The spelling of Hotell already suggest a continental European origin, and I for one have a very weak knowledge of Continental typefaces.</p>
