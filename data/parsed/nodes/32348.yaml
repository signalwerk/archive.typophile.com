      <p>Are you trying to create a logo or a book title design?</p>
      <p>1. Use true small caps. Notice how the strokes in “P” and “L” are thicker than in the rest of the letters. A true small caps typeface will offer proportionate strokes. </p>
      <p>2. The “f” is impeding the readability of “Photography” and “Latvia.” The words are <cite>legible</cite>, but less readable because the ascender and descender in that “f” interrupt the words.</p>
      <p>3. I’m not sure what the red marks are. They look like brush strokes which is confusing.</p>
