    <p>Hi im new to this forum, i was hoping someone could help me out with a logo i am working on for a book series project in my GD class.   It’s gonna be for a series of books on photography in the baltics (latvia, lithuania, and estonia).  I’m going with a typographic solution because the cover will feature photographs. I want the books to feel very contemporary and elegant.  However i have been struggling with finding an appropriate font and also with placement.  Here’s what i have so far, note that the logo will be placed on semi-transparent vellum, revealing the photography below.</p>
