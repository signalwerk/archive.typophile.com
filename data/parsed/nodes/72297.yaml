    <p></p><div class="imageWrap"><img src="http://typophile.com/files/zebramatic-poster-07_4408.jpg"></div><br>
    <strong>Zebramatic - A Lettering Safari</strong><p></p>
    <p>Zebramatic is a font for editorial design use, to create headlines and titles in eye-catching stripes. Constructed to offer flexible and a variety of graphical possibilities, Zebramatic type is easy to use. The font is offered in three styles: <strong>POW, SLAM</strong> and <strong>WHAM</strong>. These styles work both as ready-made fonts and as patterns to create unique, individualized type. The font design’s full potential is unleashed by layering glyphs from two or all three styles in different colors or shades.</p>
    <p>Working with the different styles I was reminded of the late Jackson Pollock poured paintings—in particular the documentation of his painting process by Hanz Namuth and Paul Falkernburg in the film Jackson Pollock 51. In Pollock’s pictures the complex allure arises from how he layered the poured and dripped paint onto the canvas. Similar joyful experience and exciting results emerge by layering the different styles of Zebramatic type.</p>
    <p><code><br>
    <strong>For more detailed information please read here on typophile: </strong><br>
    <a href="http://www.typophile.com/node/72295" rel="nofollow">http://typophile.com/node/72295</a></code></p>
