      <p>Here's what I think: it's almost impossible to read, but that's OK for a tattoo, and as a tattoo it's alright (I'm not really a connoisseur of tattoos but to me it looks good). I'm otherwise a proponent of readability in a big way. But in a tattoo, does it really matter if nobody but the owner can see exactly what it says?</p>
      <p>Of course if you're having doubts (and since you're asking you probably do) you should give it more time, look at some alternative designs maybe. Once it's there it's hard to get rid of. And it's a fact that most people regret their tattoos.</p>
