      <p>I only have a second to respond now; I'll hopefully have time to look harder sometime soon. Regarding the capitals, I'm not so sure how well they fit. They seem handwritten (although maybe you just haven't refined them yet), which doesn't jibe with the soft but precise feel of the lowercase.</p>
      <p>While I like some of your lowercase tweaks on a character-by-character basis (like the g), overall it's quite a different typeface now. I'll have to think if I like that you removed a number of the curved stroke endings, as I quite enjoyed them popping up everywhere. Weight-wise, the t, q, w, and x seem too heavy.</p>
