    html: <p>Also, keep weight consistent. For example, it looks like the thin in your K is about the same thickness as the thicks in your B and P. A lot of your stroke endings are pretty bland, like the middle bar of the E. I might suggest either adding a little bit of a serif or tapering it out a little like in Palatino Italic. Many of the bottom strokes are bland too, and to some extent this is good because it keeps it from being too dazzling, but I think you should spice it up a little bit, like on the descenders of p and q maybe. Some of your curves seem a bit deformed, too--most evident in the O. Something odd is going on on its left, especially at the SW area but also in NW. Make the curves flow smoother and maybe move your bottom control node a little to the right. I enjoy the flavor--like soft serve. I second Auricfuzz in missing the cursive stroke endings. Right now the design seems kind of static. I think you could make it more dynamic by curving some things that are straight, like for example the leg of the k. Overall very smooth and friendly and creamy and I want to use it as a bed and sleep on it. Maybe have some hot chocolate.</p>
