      <p>Much, much better, I think. It seems more like a cohesive unit now.</p>
      <p>In my very non-expert eyes, my main issue is with the "ball" ending of some of your letters (the top of the a, the loop of the g, the s, etc.). It seems like most of your letters make use of the angled ending, so the ball ending seems a bit jarring in some cases. It's not too distracting in the a, f, and r, but the g and s feel somewhat different from the other letters. I think, again, you have to choose whether to add more ball endings to make these less out of place or to remove the ball endings altogether.</p>
      <p>Also, I'm not crazy about the curved attachment between the crossbar of the f and the body; it makes the area where they meet too heavy. And finally, the bottom of the v and the shape of the e (especially the bottom-right corner of the counter) seem a bit off. Maybe sharpening them in line with the other stroke endings could help, but I'm not sure.</p>
      <p>Anyhow, I really like your effort. As I said previously, it reminds me of Sauna, which I'm a fan of. Do you have any other letters to show off yet?</p>
