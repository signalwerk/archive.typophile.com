    <p>I am reproducing a 1938 Elto Cub outboard motor gas tank top decal.  A couple years ago I had some great help here finding the main font named Stymie.  It is perfect.  </p>
    <p>Now I am down to some final BOLD lettering that is different.  I ran these (attached) files against WhatTheFont engine and came close.  It recommended Chocolat BOLD.  But the lower case “e” and “k” are clearly different.  And I think Chocolat BOLD is much more recent than 1938 ..</p>
    <p>I have attached pictures of the only two areas of the tank that have this different looking bold smooth font.  These are pictures from an original 1938 gas tank (a small section of it), so they are a bit blurry. The lettering has blended over the years.</p>
    <p>I am hoping there were not that many rounded type fonts in the 1930s .. so maybe some good eyeballs here could help.  I will attach two files for review.</p>
    <p>Thanks !</p>
    <p>Denny Cole</p>
