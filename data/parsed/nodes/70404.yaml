      <p>@sii, Yeah, totally a legitimate concern. I've asked a friend who works on the Chrome team that developed OTS (arguably the most aggressive in-browser font security software) to look this over. My expectation is he'll give the thumbs up, but like you, I want to feel confident about it.</p>
      <p>Since OTS was started, it has had <a href="http://code.google.com/p/ots/source/browse/trunk/src/name.cc#23" rel="nofollow">this comment in the source</a>, which puts me at ease:<br>
      <code>  // NAME is a required table, but we don't want anything to do with it. Thus,<br>
        // we don't bother parsing it and we just serialise an empty name table.</code></p>
      <p>I'll also try to bounce this off John Daggett and Jonathan Kew of Mozilla. If you have contact with any webfonts engineers with IE, I'd love their input</p>
