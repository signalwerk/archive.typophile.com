      <p>&gt; I don't see any grounds for either presuming that this difference will be maintained in its present state or that such a difference can be formalised.</p>
      <p>Why not? </p>
      <p>Here's a slice of the browsers in use and their marketshare:<br>
      EOT (IE 6-8): 52.7%<br>
      WOFF (FF3.5+, Chrome6): 20.8%<br>
      TTF/OTF (FF&lt;3.5, Chrome&lt;6, Opera): 25.4%<br>
      SVG or no support: 1.1%</p>
      <p>So there is still a good 25% of users completely unserved by a EOT/WOFF license like FontShop's.</p>
      <p>We still don't know for sure about Apple's plans to support WOFF. Last I heard, their lead engineer <a class="freelinking external" href="http://krijnhoetmer.nl/irc-logs/whatwg/20100303#l-194" rel="nofollow">said it's easier for them to make WOFF an installable format</a>, so that hardly solves the problem.</p>
      <p>But now we have a format, which has protection on the level of WOFF (and even better in some cases), and works in all browsers *today*. Simon, John, David: that doesn't interest you?</p>
