    votes: null
    html: |-
      <p>@ Christopher<br>
      From the OpenType spec – Name ID 2 (Font Subfamily name): <em>The Font Subfamily name distiguishes the font in a group with the same Font Family name (name ID 1). This is assumed to address style (italic, oblique) and weight (light, bold, black, etc.). A font with no particular differences in weight or style (e.g. medium weight, not italic and fsSelection bit 6 set) should have the string “Regular” stored in this position.</em></p>
      <p>From the TrueType spec 1.66 – Name ID 2 (Font Subfamily name): <em>for purposes of definition, this is assumed to address style (italic, oblique) and weight (light, bold, black, etc.) <strong>only</strong>. A font with no particular differences in weight or style (e.g. medium weight, not italic and fsSelection bit 6 set) should have the string “Regular” stored in this position.</em></p>
      <p>The difference is the word <em>only.</em></p>
      <p>If you follow the TT spec, you violate the specification. If you follow the OT spec, you violate the specification, because name ID 6 should be identically with the PS name in the CFF-table, if present.</p>
      <p>Except from that using empty strings is not in the intention of the specification.</p>
      <p>And with regard to name ID 6: <em>If no name ID 6 is present, then there is no defined method for invoking this font on a PostScript interpreter.</em></p>
      <p>So, what happens, if I want to print a web page on a PS printer, especially if all web fonts have the same name string there and if the fonts are in the printer cache, which probably could happen?</p>
      <p>Manipulating the name table smells like trouble. You cannot know, if it works with all programs for which web fonts are intended to be used – all programs, that can display CSS-formatted markup. Those programs are not necessarily web browsers. (Well, Firefox is a browser, but its skin can be formatted with the help of CSS embedded web fonts. What is with other programs, that base on XUL and other markup languages?)</p>
