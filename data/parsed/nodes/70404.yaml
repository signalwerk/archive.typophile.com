      <p>@jh</p>
      <p><em>This method of obfuscation is based on a current difference between the handling of web fonts and the installation of fonts on the system, and I don't see any grounds for either presuming that this difference will be maintained in its present state or that such a difference can be formalised.</em></p>
      <p>Yes, it exploits a "blind spot" in the way Windows and OSX currently recognize a font.<br>
      And there is no way to know if the blind spot will stay blind unless MSFT and Apple say it will.</p>
      <p>But going forward, how about a simple naming convention that signals to the OS that the font should not be installed?<br>
      Be aware that commercial font producers and web designers may soon have a very common interest here.<br>
      If I break my little tush re-hinting a font, playing with the outlines, converting it,  and subsetting it a certain way, I might very well want to sell the thing and not want it easily installable either.</p>
      <p>With the acquiescence of only two parties: MSFT and Apple, things can be made simple. And I can't see what beef anybody would or could have. Forget embedding bits and EPAR tables and all that sh-t. Why couldn't a simple naming convention be adopted that asks the OS not to install the font? Making it Browser Cache-Only.<br>
      I mean, why not? Too simple?<br>
      Not much of a garden fence, but about as good as WOFF. And the two together would be about all you could hope for.</p>
      <p>And since the internal name of the font is really irrelevant to @font-face, why not just decide on an internal keyword name that requests this non-installable treatment?<br>
      There is precedence for it with the keyword font names in the CSS 2.1 draft, too.<br>
      (cursive, serif, sans-serif, monospace - how about adding 'cache' to the list and asking user-agents to check for a match in the font's internal data and ask the platform providers to respect it?</p>
      <p>Sii, is this nuts?</p>
      <p>Just thinking out loud...</p>
      <p>(Have to figure out how to get backward-compatibility, though. Can Ethan's hack be merged with such a thing? Probably.)</p>
      <p>Rich</p>
