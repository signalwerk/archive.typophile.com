    html: |-
      <p>@paul and all:</p>
      <p>As you probably know, Ethan and I have discussed this a bit.<br>
      And as TP will attest, I was on a quest for the "uninstallable font name" months ago (because of the local() problem) but you and Ethan beat me to it and I appreciate and salute the hack.</p>
      <p>My initial reaction was like Sii's - a general nervousness. There's something about it that seems frail, easily broken.</p>
      <p>However, after mulling, the bottom line is: if the naming scheme is legit as far as the OT spec is concerned, there is no reason that I can see that it is any more vulnerable - security wise - than any other combination of entries in the name table.</p>
      <p>(And remember, no security guy is ever, ever going to tell you that something is 100% rock solid safe. If we could predict what an attacker might come up with, there would be no ongoing need for security guys. The question is: is this less safe than any other set of naming entries? Not that I can see.)</p>
      <p>Which leads me to a whole other line of inquiry...</p>
      <p>All along, it has been assumed that the font delivered to the browser is easily installable in the OS. It's fair to say that this is what bothered commercial font vendors the most.<br>
      However, you've shown that's not true. The uninstallable font already exists, de facto, you've found it. And all it requires is some particular comination of entries in the name table.</p>
      <p>All along, the focus has been on what browsers are going to to do with a font that was assumed to be installable when the real problem has always been what the OS was going to do if the user, let's say, extracted it out of the cache and tried to install it.<br>
      Success at that has always been assumed.</p>
      <p>With all the brouhaha going on at the W3C working group over embedding bits and mandates about what browsers and WOFF conversion tools SHALL or MUST do, my question is, why not codify something like this? It already exists.</p>
      <p>What would be objectionable about a naming scheme that makes the font uninstallable by asking that the underlying OS should, pretty please, not install a font so named?</p>
      <p>I can't see the major players like MSFT or Apple objecting to this.</p>
      <p>I mean, this issue was the prime impetus behind EOT and, ultimately, WOFF so why not tackle it from this angle, as well?</p>
      <p>I dunno, just tossing out the idea. Worth thinking through, I think.</p>
      <p>Rich</p>
