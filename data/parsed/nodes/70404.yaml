      <p>I think Christopher's point is that since Safari and Firefox support raw font linking, they offer no hurdles whatsoever. His point is that EOT files at least aren't installable and therefore less likely to be stolen. I agree with you that these hurdles are insignificant for anyone actively looking to steal fonts. But these people are not the ones we are protecting our fonts from.</p>
      <p>Permit me to classify end users in three categories.</p>
      <p>1. Honest end users who try hard to honor EULAs. They may *perhaps* download something to learn about it, but would never just steal and install. My experience tells me this is 70%-80%+ of the people out there.</p>
      <p>2. Casual thieves, who would take if the opportunity presented itself and there wasn't much work involved. 20%? (that seems too high)</p>
      <p>3. Dedicated hackers, who could run circles around you, laughing at your silly attempts to stop them. &lt;1%</p>
      <p>Obviously foundries would love to control all theft, but realize that the digital nature of fonts makes that impossible. Therefore, move on to the next best thing and raise the difficulty in stealing them. I honestly think that this scheme covers 99%+ of end users.</p>
      <p>From what I understand, Mr. Berlow would also like to add detailed permissions to the font, so that he would have legal protection as well... (think of a Font Bureau font-sniffing bot, scouring the internet to see if you are honoring your EULA.) :-)</p>
