    <p>While we are waiting for WOFF support broadly, there are some protective measures available for webfonts to prevent them from being installed locally.</p>
    <p>There is a technique of obfuscating the <code>name</code> table, rendering it <strong>unusable as a system font, but fully functional as a webfont</strong>. Ethan Dunham of Font Squirrel and Fontspring has led much of the research below, based on some prior work from Peter Bilak of Typotheque and Philip Taylor with his Font Optimizer [0]</p>
    <p>Specifically, these are the modifications for a TrueType font:</p>
    <ul>
    <li>Delete all name entries except for platformID 3, platEncID 1, LangID 0x0409</li></ul>
    <ul>
    <li>Set entry 1 (Font Family) to  '' (empty string)
    </li><li>Set entry 2 (Font Subfamily) to a unicode smiley:☺ [1]
    </li><li>Set entry 3 (Unique ID) to '' (empty string)
    </li><li>Set entry 4 (Full name) to smiley:☺
    </li><li>Entry 5 (Version) may optionally be changed. Ethan recommends inserting some verbage about the font being protected. It shows up in the get info window on Mac
    </li><li>Set entry 6 (Postscript name) to smiley:☺
    </li><li>Entries 7-14 can remain as is
    </li><li>Delete entries 15+</li></ul>
    <p>Create two Mac entries: platformID 1, platEncID 0, LangID 0x0</p>
    <ul>
    <li>Set entry 1 to blank (basically have an entry but no value)
    </li><li>Set entry 4 to the Font Name (optional but will show up in Get Info)</li></ul>
    <p>When the Font Family name is an empty string, it is uninstallable in Windows. Meanwhile, the OpenType spec indicates that two-byte unicode characters (like the smiley) won't work in a font name on Mac at all. [2] As a result, it's rejected by OS X and not possible to install. Linux isn't able to cope with these modifications either. [3]</p>
    <p>These changes are done not only to the TrueType "naked" font, but can also be applied to the underlying TTF embedded in the EOT and WOFF files as well. It's also worth noting that Chrome's font sanitizing library OTS completely avoids the <code>name</code> table. [4]   </p>
    <p><strong>I believe all non-free fonts should employ these changes as they are distributed for web use</strong>, essentially providing them with a similar "garden fence"-level of protection [5] as WOFF. Fontspring is already employing this technique, and you can test it out with the WebOnly option at the Font Squirrel generator [6].</p>
    <p>If you guys think this is worthwhile, I'd love to help draft this up into something more official so it's a documented standard that all foundries can use when preparing their work for sale as a webfont.</p>
    <p>[0] <a class="freelinking external" href="http://bitbucket.org/philip/font-optimizer/src/tip/obfuscate-font.pl" rel="nofollow">http://bitbucket.org/philip/font-optimizer/src/tip/obfuscate-font.pl</a><br>
    [1] <a class="freelinking external" href="http://www.fileformat.info/info/unicode/char/263a/index.htm" rel="nofollow">http://www.fileformat.info/info/unicode/char/263a/index.htm</a><br>
    [2] <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#9.e" rel="nofollow">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#9.e</a><br>
    [3] <a class="freelinking external" href="http://paulirish.com/i/LinuxWebfont.png" rel="nofollow">http://paulirish.com/i/LinuxWebfont.png</a><br>
    [4] <a class="freelinking external" href="http://code.google.com/p/ots/source/browse/trunk/src/name.cc#23" rel="nofollow">http://code.google.com/p/ots/source/browse/trunk/src/name.cc#23</a><br>
    [5] <a class="freelinking external" href="http://lists.w3.org/Archives/Public/www-font/2010AprJun/0061.html" rel="nofollow">http://lists.w3.org/Archives/Public/www-font/2010AprJun/0061.html</a><br>
    [6] <a class="freelinking external" href="http://www.fontsquirrel.com/fontface/generator" rel="nofollow">http://www.fontsquirrel.com/fontface/generator</a></p>
    <p>Edit: Clarified the Windows installability reason. Worth noting: when the full name doesn't match Font Family + subfamily, it is uninstallable in Windows, however they match with this above technique, which is why the EOTs with this modification still work. (thx Ethan)</p>
