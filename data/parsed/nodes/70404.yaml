      <p>As I am hoping to apply the @font-face feature to my own web site - using an open-source font, so that there shouldn't be a licensing issue involved; my intention is to avoid requiring viewers of my web site to install a special font for mathematics - I did some web searching.</p>
      <p>I found a nice tutorial at</p>
      <p><a class="freelinking external" href="http://www.miltonbayer.com/font-face/" rel="nofollow">http://www.miltonbayer.com/font-face/</a></p>
      <p>And I also see why there is a problem now.</p>
      <p>Internet Explorer supports only one font format - .eot - which is locked to a given web site, and thus which allows licensing. Fortunately for my purpose, I can download WEFT from Microsoft - and I will have to check the license terms of the open-source licenses, just in case I run afoul of a religious war.</p>
      <p>Firefox supports .woff which also has some sort embedding site lock feature, so IE and Firefox do both have safe solutions for licensed fonts. This being like 90%, I would think the problem almost is solved.</p>
      <p>Most browsers support .ttf and .otf fonts except for IE, which is good for my application.</p>
      <p>Chrome used to only support .svg fonts. I knew that .svg was a vector image format, but I had never even <em>heard</em> of .svg fonts. There's obfuscation for you! But that's been fixed, so one only needs .svg fonts to look good on an iPhone these days.</p>
