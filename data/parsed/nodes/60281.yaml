      <p>&gt;Maybe I’m hysterical because of the heat, but I found this very, very funny.</p>
      <p>I bet not nearly as funny, to me, as sitting at 144 dpi with a yellow background waiting for a new aesthetic. ;) Does that help cool ya down? I just heard yesterday that the NW is baking, and I hope it passes soon, in the meantime, it's funky, raw, and naked time.</p>
      <p>&gt;Does the emUnits/pixel ratio change across the different sizes of Franky, or is it constant?</p>
      <p>It changes, because the units per em was kept constant. This is not important unless something does want to react to pixels per units, as the Perm table, and my proposed Size table are designed to slightly enable.</p>
      <p>&gt;David, following your PERM proposal, how would you set the “Scaling” recommendations for a design built on a 13ppem grid, but delivered as a CFF font with 1000 upm, to be used at 8px size and its multiples? :-/</p>
      <p>The first half if easy, but why exactly would one want to deliver for the wrong size? I.E. if it's for 13 ppm, it should not be used at 8, 16 or 24?</p>
      <p>Tomorrow, I'll try to republish the expanding list of requirements to make Franky Quality happen, hopefully without Franky Quantity ;)</p>
      <p>Cheers!</p>
