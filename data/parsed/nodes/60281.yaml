      <p>@tim and all:<br>
      In light of the ins and outs of creating a screen-readable cross-platform, cross-browser font (thanks for the mini-lesson, Nick, John, etc...), your page looks very good, Tim.</p>
      <p>I know I've commented on this before, to no avail, but it would be great if you would take the time to create EOT's for these examples. Ascender has just released a tool for creating these "DRM-Free" EOT Lite files. (Haven't gotten my hands on it yet. But I'll have it shortly.)</p>
      <p>To be pesty about it: your answer to me, on this site, was that you'd prefer to let Typekit handle IE. Well, Typekit is now in Beta preview, I will look to see if these fonts are available. But what if they aren't?<br>
      Your examples would be more <strong>effective</strong> if they were more inclusive. If your intention is to advocate, and that seems to be your intention, I don't think there's a single site among the Alexa top 1 million that would even dream of excluding IE in this manner.<br>
      Just me 2 cents... </p>
      <p>Cheers, </p>
      <p>Rich</p>
