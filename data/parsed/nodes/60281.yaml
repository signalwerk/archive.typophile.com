      <p>Thanks, gferreira and Yes, there is a serif, but it is not to be so small. I'll tell everybody when and where one can start licensing the serif font in the raw naked undressed OT format soon. ;) Our plan is to give away all sans fonts, because they are so simple, but (I'm) to charge a vast fortune for licenses to (just) serif faces (kidding;) </p>
      <p>This demo is 'even better than bitmaps' down to the bottom sizes, perhaps? and this is what elephant-aware type designers assumed (1994-98), then hoped (1999-2007), but now can only wish user's type looked like down to small sizes. Momma Apple and Daddy MS didn't get along on the TT/scaler/rasterizing-thingy, with each other, or with type's more industrious developers, and uncle Adobe didn't care then — so now, they get most of you design types, ISO, W3C and the biggest text-composing user-community, quality-puzzled. I get the rich who need solutions ahead of most other users, which might sound vile to you, but it makes this time possible. Speaking of which...</p>
      <p>Franky and the type it produces, was a 2007, 31-day, 45-style, font lab beating on a demo agate for screens to counter the contention that there is no alternative to the 'well-studied' OS-default scaling techniques when deployed via default web font-sizing and then applied to small font sizes on computer screens. If type developers (e.g. me), can't control completely enough, the size-specific x dimension variation via hinting because of MS' scaler, e.g., and can't give users size-specific x dimension variation via any other means besides changing the contour, font name and forcing its use at only one ppm size, then that's what I had/have to do. It allows me, as I explained to Greg Hitchcock at Sota Seattle, to avoid all the format, scaler, rendering and web composition barriers to type quality — all I need is a baseline, a pixel-per-em, (a tiny user interface, @font-face and repeated warnings to set your browser to the medium fonts size, which I didn't have then, but I have now), and I can undress CT and Quartz quality for this purpose.</p>
      <p>One sub-thing I also had to deal with, as your exploration of Franky benefits from, was people saying 'it's too light' or 'it's too heavy'. This has nothing to do with the detailed problem at hand, while having everything to do with the general problem at hand. Thus one can play with the text weight in this demo, but with a severe limit on the expansion of the text as the goal. Smaller sizes could get heavier, but as each pixel becomes proportionally larger at small sizes they would get really wide, so the smaller sizes don't get really wide in this demo, and some sizes get too tight.</p>
      <p>If a lot of people agree on this realm of quality for small sizes (8-12 ppm), then we can move on to the middle sizes (13-26), where less of the same thing is required but variation for size is still required. And if everybody agrees then that text and agate is better this way, then much less of this kind of work and much more kerning, is required for display types. So, don't get me wrong, it's not all the scaling OS' fault, that browsers are just not OT-table-aware enough yet is clearly an up-n-coming issue. </p>
      <p>I'm reminded always to remind you, with the PERM table, (unless it's called EPAR), part of this elephantine issue can be addressed. Without EPAR, there is little chance, in my humble opinion, of anything but a typographic idiocracy followed by more generalized idiocracy, far more idiotic than we now have. I don't think a few billion computers not knowing what year it was, was a problem compared to this. Back then, we all knew what year it was, and if not we could pick up a newspaper and (delighting subliminally in the quality of the text), read all about it. :-)</p>
      <p>Cheers!</p>
