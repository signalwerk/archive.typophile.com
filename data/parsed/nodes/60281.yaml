      <p>Nick, Fontographer did not have the necessary hinting tools for TrueType. It performed a pretty crude PS to TT conversion, and the results were never very good. Also, bear in mind that the kind of semi-automatic approach I described above -- which is very short of what one can achieve with manual TT hinting in FontLab, and very, very short of what one can do in VTT -- depends on the latest anti-aliasing models. With b/w and greyscale rasterisation, the results are not nearly so good.</p>
      <p>FontLab's auto hinting for TT is pretty smart, and the nice thing is that it makes use of whatever level of information you put into a font, as I explained above. You can go further, and convert the PS stem hints to TT instructions and manually edit them, and you can do this for individual glyphs, letting the autohinting look after the others.</p>
      <p>However, there are things you need to look out for. If your font contains zero-width glyphs with outlines, such as combining marks, FontLab will round these off the origin point at some sizes, causing the width to explode. In that case, you need to convert the PS hints to instructions and manually remove the links to the origin point.</p>
