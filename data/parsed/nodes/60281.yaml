      <p>Wrong way, James.<br>
      Apple gave proof of concept that type can be rasterized in readable way ("Proxima Nova makes one hell of a good web text face."), and it does not matter if your font is TTF, CFF-OTF, hinted or not. I am particularly unfair now, but compare an unhinted TTF rasterized in Windows and in OSX. In Windows, with standard greyscaling you get a washed-out grey at text sizes (the thing Windows users blame OSX rasterization of) and with ClearType rasterization your horizontals cause problems at text sizes. Not so in OSX -- there you can even recognize the original design.<br>
      There's nothing wrong with fonts. Something's wrong with some rasterizers.</p>
      <p>With @font-face and arbitrary fonts rather than a handful of especially adjusted fonts, perhaps Windows users will come to appreciate Safari's own rasterizer?</p>
