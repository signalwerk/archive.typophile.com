      <p><em>Amazing. All that, just to have a vector outline look less horrible when forced onto a grid of pixels.</em></p>
      <p>Actually, alignment zones and standard stem widths are a pretty good infrastructure for designing and building a typeface.<br>
      When teaching type design to students in a graphic design course, I've found that explaining the principle of alignment zones prioritizes the importance of x-height and extender length, as well as the function of overshoots.<br>
      This does tend to homogenize letterforms, however.</p>
      <p>Also, I wonder if desktop publishing and the ensuing emergence of the Internet would have played out quite as broadly, had it not been for adequate screen representation of type through global hinting. And that began with TrueType, with ATM being developed and released in a rush by Adobe, which saved Apple. So you could say that alignment zones and stem hints are fundamental to the digital graphic culture we now have.</p>
      <p>Nonetheless, a lot of the new typography of the digital era, that got the indie font scene started with grunge and deconstructed type designs, studiously avoided this kind of thing, despite the fact that Fontographer had the necessary hinting tools.</p>
