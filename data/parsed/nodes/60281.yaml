      <p><em>Using Fontlab to hint TrueType fonts for use on Windows for Dummies</em></p>
      <p>1. Set up PS style blue zones to control vertical alignment and overshoots; be sure to provide blue zones for anything that you want to align.</p>
      <p>2. Apply FL auto PS stem hints, Adobe FDK auto PS stem hints, or FL manual PS stem hints to glyphs.</p>
      <p>3. Set PS standard stem values to average stem values; typically, you want just a couple of values for x and y stems capturing the main vertical stems for I/i and the top or bottom section of the O/o.</p>
      <p>4. Make sure that TT generation exports are set to autohint unhinted glyphs; this autohint function will make use of the blue zones, stem hints and stem values that you have set up in the font.</p>
      <p>5. Generate font and install.</p>
      <p>ClearType handles this kind of hinting pretty well for most Latin font styles. Greyscale antialiasing in Windows will not look as good, although the alignments should be fine. Black and white rendering will not be good, but still the alignments will be fine.</p>
