      <p>The headline type looks good. The rendering of the Proxima Nova text is terrible (Windows, Firefox). This is, as Si Daniels put it, the 'elephant in the room' that no one is talking about: fonts look different in different browsers and on different platforms, and once one strays beyond well-hinted TrueType the quality can vary immensely. A font that looks good in one browser on one platform may be almost unreadable elsewhere. This is something that would-be web typographers are going to need to anticipate and test.</p>
      <p>The so-called 'web safe' fonts like Verdana are safe not only in being installed on almost all computers, but also safe in the sense of being readable under a wide variety of different rendering systems and browsers, i.e. they are safe in a way analogous to web safe colours.</p>
