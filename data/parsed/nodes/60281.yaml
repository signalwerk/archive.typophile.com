      <p>&gt;I’ve seen that as well on some machines running the latest FF 3.5 (not a beta). No idea!</p>
      <p>Search previous threads on ’vertical metrics’ or “chopped off”.</p>
      <p>&gt; you could say that alignment zones and stem hints are fundamental to the digital graphic culture we now have...<br>
      Nick... I and other designers want to add the intra and inter glyph white-space to that fundamental list to make possible an end to typographic “x abuse” (we see a lot in this site). But the two main owners of TT/OT think the list is long enough at 2 things, alignment zones and ’page color’. And though ISO, the web’s users, and I ’want it’ otherwise, “type scaling” is set up that way by MS and Apple. Though all of the technology to handle readable web type exists, basically “it’s resolution’s fault” that you can barely ever have optimal quality for your needs.</p>
      <p>Then, One could say that this web site’s apparent use of @font-face suffers from low resolution typographic x abuse the site developer has absolutely no control over with these or most outline fonts, now or ever.* And the site suffers @font-face abuse from the user’s perspective. I.E. the definition of the top 3/4 of the page as 2 assets, for the foreseeable future, does the user absolutely no good in transmission speed, and may in fact end up with that lovely script text appearing as Verdana, likely doing the publisher of the website nearly no good. Render unto pixels, that which is their due.</p>
      <p>That covers text and display type on this type. But the sub heads, they are very nice and I like the color scheme.</p>
      <p>@Hudson&gt; This is, as Si Daniels put it, the ’elephant in the room’ that no one is talking about.</p>
      <p>Thanks John for repeating a not entirely completely untrue statement. Since 2004 when the final hinting/fontformat/OS environment was being described for its eventual 2007 release from Longhorn into Vista, I and quite a few others have never called this issue an elephant in the room. ;)</p>
      <p>Otherwise, “web text readability” has been a rather huge topic here and elsewhere. Search on that instead of ’elephant’ if anyone is interested. The fact that learned type people are supposing an emergency availability situation, and are supporting a new font format to utterly exacerbate the beast raw into a naked and raging elephant, is what surprises me.</p>
      <p>&gt;The so-called ’web safe’ fonts like Verdana,</p>
      <p>...are, as John correctly points out, safe by availability and by contour design, and at 13ppx Verdana is particularly safe because it was drawn to fit that size, (delete the hints and it works about the same at 13, when anti-aliased). But mostly, web safe fonts are safe simply from their original selection as part of a class of published digital outlines to accompany everything; as Courier, Times and Helvetica (et al), are familiar enough for users to “fill in the blur” of the bad sizes, they just barely work. While Verdana et al are by contour design, made to minimize the blur by maximizing critical font-wide type design features, also in familiar forms people are used to.</p>
      <p>&gt;...I’m cooking something up to help web typographers with that....</p>
      <p>I call help, ’recommendations’. When taken from groups of fonts, a data-base of recommendations will provide a web typographer with a ’ball park’ to start testing, or just go with the recommndation, for any particular use. I’d love to see what you cook up but people think adding this meta data to the OT font specification is the quickest and only way to begin addressing web text readability education on the scale required.</p>
      <p>&gt;...Microsoft needs to rethink how it helps type designers with designing fonts</p>
      <p>See what happened on this forum when I quested for a clear cleartype specification in ’05? Search on “giant pile of excrement”, as far as I recall.</p>
      <p>&gt;I realize that there are some strong arguments in favor of manually-hinted TrueType fonts with deltas for different sizes...</p>
      <p>You must mean Variations for different sizes. :) Deltas, they may be, that term has been demonized to an evil size-specific blot. Search on “Superpolator”</p>
      <p>Cheers!</p>
      <p>*Unless e.g. you set your OT/@FF-friendly browser’s text size to medium, then go to:<br>
      <a href="http://www.fontbureau.com/test/franky/" title="http://www.fontbureau.com/test/franky/">http://www.fontbureau.com/test/franky/</a><br>
      ...there you can futz with the site’s typographic size and weight controls outside of the evil grip of everyone but me and some of my crazy ideas for “elephant training.”</p>
      <p>Remember, set your OT/@FF-friendly browser’s text size to medium, set your OT/@FF-friendly browser’s text size to medium. Don’t forget, set your OT/@FF-friendly browser’s text size to medium.</p>
      <p>Also: You can steal these fonts now if it suits you. Or you can wait, and steal better ones later. Or you can wait until the new font wrapper everyone is so hot for, is thoroughly undressed by time as it surely must be to be accepted, and then you can steal these fonts from that format. See!? Lots of choices! Sorry for the L.P.</p>
