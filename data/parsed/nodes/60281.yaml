      <p>To just build on what Nick wrote... Yes, the age-old PostScript font hinting model is really one of the miracles of the desktop publishing age. John Warnock had to think up a way to get letters to look good at low resolution, because Adobe would have crashed and burned without it. So he came up with the appropriately-named font "hints". They just provide general information about font and glyph features which can be interpreted by any rasterizer. It's a very practical approach -- even today, when we're coming back around to "medium resolution" environments (high-res LCD screens and such) which became largely irrelevant in printers years ago, but were the primary concern in 1984.</p>
      <p>One can look at all this and say, "So much technological complexity for something as simple as type!" or one can acknowledge that building digital fonts has always been a task for knowledgeable and skilled professionals -- for whom good ol' Type 1 hints are fairly straightforward, and an easy way to ensure a digital font is something better than a plain rasterized PostScript path.</p>
      <p>I did some extensive TrueType hinting back in the day, and it was brain-numbing but very cool in its way. I don't mean to disparage that approach -- but I think everyone knows it's a lot of work, and difficult to apply to every font that comes down the pike.</p>
      <p>By the way, I am on OS X/Safari, and Proxima Nova looks very nice!</p>
