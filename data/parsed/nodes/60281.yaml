      <p>Something that’s been on my mind lately is that Microsoft needs to rethink how it helps type designers with designing fonts that will render well on Windows. I realize that there’s already a great deal of information, and VTT, available to us at Microsoft.com. And I realize that there are some strong arguments in favor of manually-hinted TrueType fonts with deltas for different sizes. But wading through the documentation and the software is not easy and takes a <em>lot</em> of time, especially compared to Adobe’s autohint-it-and-forget-it approach. Something along the lines of <em>Using Fontlab to hint TrueType fonts for use on Windows for Dummies</em> would be a really big help right now.</p>
