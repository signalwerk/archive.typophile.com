    <p>Can the word rockwell be used as a name of a new space in conjunction with the use of the font?</p>
    <p>I am setting up a new building that provides rented studio space to small creative businesses in London.  We decided we wanted to call it Rockwell House.  We've have used the Rockwell font for the logo and website.</p>
    <p>Is there an issue with us using this?  What are the parameters we should be aware of?  Please can someone give me some advice on using this.</p>
    <p>Thanks<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/RW3_4167.jpg"></div><p></p>
