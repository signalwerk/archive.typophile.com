    html: |-
      <p>Your current representation of the flame could be stronger. Also, if you’re not going to use it as the “i” you don’t need the dot above it. Have you tried making just the dot above the “i” a flame, instead of the whole figure? I’d just play around with other flame figures. The one you currently have is too squiggly for me.</p>
      <p>I think my favorite orientation of the text is your last one. It seems to flow the best. If you want to experiment with other fonts, you might try Helvetica Black. Although I don’t think the font you currently have needs to change. The only thing I think <em>has</em> to go is the “1” (one). Its top extends too far to the left. </p>
      <p>penn</p>
