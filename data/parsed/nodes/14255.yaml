    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/How-To" class="freelinking" rel="nofollow">How-To</a> : Deriving Small Capitals from Capitals</strong></p>
    <p>Well-designed <a href="/wiki/Small%20Capitals" class="freelinking" rel="nofollow">Small Caps</a> are more than just scaled-down versions of the <a href="/wiki/Capital" class="freelinking" rel="nofollow">Capital Letters</a>. <a href="/wiki/John%20Hudson" class="freelinking" rel="nofollow">John Hudson</a> gave some tips on how to make smallcaps efficiently in <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a> by starting with the capital letters as a foundation.</p>
    <p>1. Scale the <a href="/wiki/uppercase" class="freelinking" rel="nofollow">uppercase</a> letter uniformly to the desired height and put into the background <a href="/wiki/mask%20layer" class="freelinking" rel="nofollow">mask layer</a>. This will be the guide not only for height, but also for internal space. So, for example, the distance between the <a href="/wiki/uprights" class="freelinking" rel="nofollow">uprights</a> of the scaled H will be the distance, inner edge to inner edge, of the uprights in the smallcap. This will produce smallcaps that are nicely proportioned relative to each other (presuming that your caps are nicely proportioned). [See Fig.1]<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fig1_5825.gif"></div><p></p>
    <p>2. Paste in another copy of the cap <a href="/wiki/outlines" class="freelinking" rel="nofollow">outlines</a>, and scale these uniformly for weight. I usually match the vertical <a href="/wiki/stem%20weight" class="freelinking" rel="nofollow">stem weight</a> of my smallcaps to my <a href="/wiki/lowercase" class="freelinking" rel="nofollow">lowercase</a>, even though the smallcaps will be taller. [See Fig.2]<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fig2_4926.gif"></div><p></p>
    <p>3. Use the FontLab ‘<a href="/wiki/Interpolate" class="freelinking" rel="nofollow">Interpolate</a>’ function to reduce the height and width of the weight-adjusted caps to match the height and internal space of the mask. This should be done in two passes: one for the y-direction and one for the x-direction. Be careful to maintain weights. [See Figs.3-6]<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fig3_5498.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Fig4_5646.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Fig5_6467.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Fig6_6622.gif"></div><p></p>
    <p>4. Test and fiddle. [See Fig.7]<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fig7_5090.gif"></div><p></p>
    <p><a href="http://typophile.com/node/14228" rel="nofollow">Read the full Typophile thread »</a></p>
    <p>See also: <a href="/wiki/Small%20Capitals" class="freelinking" rel="nofollow">Small Capitals</a>, <a href="/wiki/Mid%20Caps" class="freelinking" rel="nofollow">Mid Caps</a></p>
