    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12369" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">How-To</a>&nbsp;: Deriving Small Capitals from&nbsp;Capitals</strong></p>
    <p>Well-designed <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Small Caps</a> are more than just scaled-down versions of the <a href="/node/13762" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Capital Letters</a>. <a href="/node/12151" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Hudson</a> gave some tips on how to make smallcaps efficiently in <a href="/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a> by starting with the capital letters as a&nbsp;foundation.</p>
    <p>1. Scale the <a href="/node/14510" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uppercase</a> letter uniformly to the desired height and put into the background <a href="/node/add/wiki?edit%5Btitle%5D=mask%20layer" title="Create node &quot;mask layer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">mask layer</a>. This will be the guide not only for height, but also for internal space. So, for example, the distance between the <a href="/node/add/wiki?edit%5Btitle%5D=uprights" title="Create node &quot;uprights&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">uprights</a> of the scaled H will be the distance, inner edge to inner edge, of the uprights in the smallcap. This will produce smallcaps that are nicely proportioned relative to each other (presuming that your caps are nicely proportioned). [See Fig.1]<br><img src="/sites/default/files/old-images/Fig1_5825.gif"></p>
    <p>2. Paste in another copy of the cap <a href="/node/add/wiki?edit%5Btitle%5D=outlines" title="Create node &quot;outlines&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">outlines</a>, and scale these uniformly for weight. I usually match the vertical <a href="/node/add/wiki?edit%5Btitle%5D=stem%20weight" title="Create node &quot;stem weight&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stem weight</a> of my smallcaps to my <a href="/node/13807" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lowercase</a>, even though the smallcaps will be taller. [See Fig.2]<br><img src="/sites/default/files/old-images/Fig2_4926.gif"></p>
    <p>3. Use the FontLab ‘<a href="/node/add/wiki?edit%5Btitle%5D=Interpolate" title="Create node &quot;Interpolate&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Interpolate</a>’ function to reduce the height and width of the weight-adjusted caps to match the height and internal space of the mask. This should be done in two passes: one for the y-direction and one for the x-direction. Be careful to maintain weights. [See Figs.3-6]<br><img src="/sites/default/files/old-images/Fig3_5498.gif"><br><img src="/sites/default/files/old-images/Fig4_5646.gif"><br><img src="/sites/default/files/old-images/Fig5_6467.gif"><br><img src="/sites/default/files/old-images/Fig6_6622.gif"></p>
    <p>4. Test and fiddle. [See Fig.7]<br><img src="/sites/default/files/old-images/Fig7_5090.gif"></p>
    <p><a href="http://typophile.com/node/14228">Read the full Typophile thread&nbsp;»</a></p>
    <p>See also: <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Small Capitals</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Mid%20Caps" title="Create node &quot;Mid Caps&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Mid&nbsp;Caps</a></p>
