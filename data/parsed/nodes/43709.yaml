    html: <p>While I agree with Ralf, I believe there was even an option to export fontfiles (.ttf) directly from CorelDraw. I have done it once, many years ago. I'm not sure how it worked again, but you'd place a character on a page of certain size (which would work as sidebearings) and export/save it constantly to the same file untill the charmap was full.</p>
