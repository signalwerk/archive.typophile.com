  html: <p>Apparently there still exists the ability to create .pfb files from Corel Draw directly. (Yes, I use Corel. Their academic licensing allowed me to purchase their X3 suite for $95. Find me a similar deal for Adobe and I'll change my allegiance.) Now, I'll be the first to admit I know nothing about PS fonts, but would it be worth my while to fiddle around with this?</p>
