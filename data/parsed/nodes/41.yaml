    html: <p>Jens, finally somebody did it! <br>You're using some of the x-height for the descenders, thus making the font's apparent size bigger. And although it's been done before*, this is the first bitmap font I've seen that does it very well. For example, the curve at the bottom of the bowl in the "p" effectively hides the misalignment (even though it makes the form smaller). And such curves are also present aesthetically, like in the "e". <br> <br>* <a href="http://www.myfonts.com/FontFamily4.html" target="_top">http://www.myfonts.com/FontFamily4.html</a> <br> <br>Why not also give the ascenders some extra room? At least you can lower the bars of the "f" and "t" by a pixel. <br> <br>Furthermore, your widths have a nice humanism, as do many of the forms (like the "a"). And the caps too - I'd love to see more of those, in fact the whole character set, please! <br> <br>The only important thing I'm unsure about is the semi-serifs. I think they do add a nice flavor to the design (and might even improve bouma formation - although your spacing is loose for that, in fact the spacing looks off in places too), but one bad thing they are doing is reducing the apparent height of the ascenders. <br> <br>Overall, this is a groundbreaking design, which just needs a little bit of refinement to become highly usable. Congrats, and *please* keep it up! <br> <br>(BTW, I'm not sure your site is working right.) <br> <br>hhp</p>
