    html: <p> &gt; I think the big x-height is better for reading. <br> <br>Upto a point - the extenders do play a vital role in reading because they define the shapes of *words*, which is what we generally read, at least when reading immersively. On the other hand, the screen is a lot less immersive than paper, so I would say that screen fonts do actually need larger x-heights than fonts for print - and your x-height is great! You're leaning more towards *legbility* as opposed to readability (and the same with respect to your loose spacing), but it's a good decision. However, I think the ascenders are on the border of being adequately long, and their serifs might be increasing the problem. <br> <br>&gt; The Semi-Serif was made because a serif font is better for reading but not at screen. <br> <br>Great logic! <br> <br>I feel the semi-serif is generally under-rated, and it can play a great role in print as well. <br> <br>&gt; hinting for all small sizes <br> <br>You might consider embedding bitmaps instead. <br> <br>hhp </p>
