    html: "<p> I hope i can translate the theoretical part of the \"Diplom\" in english soon. <br>But until that I would say a little about the philosophy. <br>The x-height was chosen by designing the font. First of all I want to make a Screenfont for a better reading and also a aesthetic look. So took a more classical style. I think the big x-height is better for reading. The Semi-Serif was made because a serif font is better for reading but not at screen. So I took semi-serif. So it improves the \"readability\". <br> <br>Some words to the Spacing: That was the most difficult item for me. My pretense was to improve the \"readability\" and for this I deside to improve the spacing. Small spacing is hard for reading long articles. The wide spacing maid many difficults. Maybe because I don't knew anything about fonttechnologie at this time. But at some letters it needs realy a refinement. <br> <br>Im curently develop a SansSerif called Standup (you will see soon a sample). Afters this i will improve NNF to a scalable Font whith hinting for all small sizes. BTW: Does any have a tutorial about hinting? <br> <br>The site screentypo.org is beta. Maybe it takes some sec for loading. You will see soon the whole font and all \"schnitte\" (maybe cuttings?). <br> <br>(dont understand? me neither *g*) </p>"
    html_clean: "<p> I hope i can translate the theoretical part of the \"Diplom\" in english soon. <br>But until that I would say a little about the philosophy. <br>The x-height was chosen by designing the font. First of all I want to make a Screenfont for a better reading and also a aesthetic look. So took a more classical style. I think the big x-height is better for reading. The Semi-Serif was made because a serif font is better for reading but not at screen. So I took semi-serif. So it improves the \"readability\". <br> <br>Some words to the Spacing: That was the most difficult item for me. My pretense was to improve the \"readability\" and for this I deside to improve the spacing. Small spacing is hard for reading long articles. The wide spacing maid many difficults. Maybe because I don't knew anything about fonttechnologie at this time. But at some letters it needs realy a refinement. <br> <br>Im curently develop a SansSerif called Standup (you will see soon a sample). Afters this i will improve NNF to a scalable Font whith hinting for all small sizes. BTW: Does any have a tutorial about hinting? <br> <br>The site screentypo.org is beta. Maybe it takes some sec for loading. You will see soon the whole font and all \"schnitte\" (maybe cuttings?). <br> <br>(dont understand? me neither *g*) </p>"
