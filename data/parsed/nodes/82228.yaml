    html: "<p>I wouldn't try something like scaling. I would substitute the sign(s) with ones from a specialized math/scientific font or, in any case, with one that offer a non-contrast monoline version of the non-diacritical tilde (a \"generic sorts\" version, so to speak). See, just for example, Garamond Premier: <a href=\"http://myfonts.us/td-QpS08i\" title=\"http://myfonts.us/td-QpS08i\">http://myfonts.us/td-QpS08i</a></p>"
