    <p>Hello,</p>
    <p>I'm using Fontlab 5.0.4 on mac os 10.6.4 and I have problems with resize shapes.<br>
    When I resize the shapes they are getting damaged and I don't know what to do.</p>
    <p>Anyone can help me here??</p>
    <p>Thanks,</p>
    <p>Moshik</p>
