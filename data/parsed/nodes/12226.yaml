      <p>hrant: Ok, I get what you're saying now, but your definition of "master" doesn't quite fit either. In Adobe's Multiple Master technology, there are a small number of (often four) master outlines present in the font, and then you can derive a vast number of instances from them by interpolation.</p>
      <p>In ATF lingo, your "pattern master" would be called a "pattern plate," largely because it was actually a 4" plate made of brass or tin. I'm inclined to keep using the term, because in the virtual world you need lots of metaphors.<br><cite>Reduced relative to what? The original, the “n”, the “h”, or?</cite></p>
      <p>I meant the original, but the b is also about 10 units less than the h, or six less than the n, by the numbers.</p>
      <p>And yeah, there are at least a few kerning pairs that would add to the spacing evenness of the font (although your "ra" example doesn't need <em>much</em> - that top terminal of the "a" needs air to breathe). I am just sticking to my usual methodology of trying to get all the side bearings right before starting in with the fine-tuning of the kern pairs.</p>
      <p>George: you're quite welcome. I am usually happy to scan pages like this - I have a kick-ass type library and a pretty decent scanner.</p>
