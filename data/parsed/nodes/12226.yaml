      <p>John: ah, I did not know there were still Mardersteigs carrying on the tradition. Thanks for enlightening me.</p>
      <p>I am going to err on the side of caution, as I definitely don't want to become known as the guy who rips off work belonging to others, but to me this still brings up some ethical questions. According to Jaspert, Zeno was made in 1937. So the design would be 70 years old, and the original creator would have been dead for 30 years. How long does a family get to claim exclusive use of a typeface?</p>
      <p>George: I'll be happy to send you a scan of the Griffo sample. Mardersteig was a true master, and his distinctive work is well worth studying completely aside from the question of doing literal digitizations.</p>
