      <p>One thing is certain, it's way easier to end up with too much ink than too little; besides the latter being more obviously faulty to most people*, when you end up with too much ink fixing it is a pain: you have to start over. And then there's Pascal's old paradox: "Things are at their best in their beginning." So I would venture that the more time passes, the more users lose respect for the quality of something, and the more ink will hit the pulp.</p>
      <p>* Except to type designers, who -hopefully- care more about the outlines<br>
      than the bodies. Like when I print, my inking borders on the translucent.</p>
      <p>hhp</p>
