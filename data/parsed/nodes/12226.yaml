      <p><em>I’ve ordered my very own copy of the book, and will more likely than not trace a digital version of the font. It will be interesting to see how much other interest there is in the release of such a beast.</em></p>
      <p>There is almost certainly already a digital version of Zeno, but this is a private typeface of the Stamperia Valdonega, just as the original Zeno was a private typeface. Martino Mardersteig continues his father's work, printing and publishing both handset and machine (and now computer) typeset works under the imprints of the Officina Bodoni and Stamperia Valdonega. If you want a book typeset in one of Mardersteig's private typefaces, then you go to the Mardersteigs. The digital versions of their types are reportedly extremely good: much better than e.g. Monotype Dante. I believe they are also size-specific.</p>
      <p>I'm pretty sure that the Mardersteigs would not take kindly to someone making an unlicensed copy of any of their private typefaces for general release.</p>
