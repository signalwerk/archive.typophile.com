      <p>I think we need a expert to help out...</p>
      <p>I can only take guesses, based on the fact that later hands often added new sorts to a font, and not always very capably. In the top one, it seems under-inked, and not sharper, so it's possible that the sort was cast (or filed down) slightly too short. In the second one, it seems like a combination of a "valid" long-s and a hacked "p"; maybe the matrix for this ligature was struck inexpertly, with the "p" not hard/deep enough; or maybe they used a "p" punch from another font? What do the other "p"s look like? In any case, wear can't explain the second one, since half of it is "fine".</p>
