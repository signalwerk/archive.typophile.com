    <p>I'm looking critically at the various Jenson revivals (Centaur, Cloister, and friends), and the showing of <a href="/node/12227" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Johnny Mardersteig</a>'s Zeno in Jaspert is catching my eye. What's my best bet for getting a better quality sample? I checked on abebooks, and you do <em>not</em> want to know how much actual Officina Bodoni titles go for. That said, there are a whole bunch of museum catalogs and suchlike available at affordable prices. Does anyone know if any of these have good examples of Zeno? How good / complete is the specimen in Bringhurst?</p>
    <p>P.S. I like the new digs.</p>
