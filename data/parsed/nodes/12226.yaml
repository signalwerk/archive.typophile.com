      <p>I could not resist the temptation to digitize enough of the font to make a test page. Here's the partial alphabet, and here's a <a href="http://levien.com/type/zeno.pdf">PDF of the page</a>: the sample of Sanctum Evangelium posted by hrant above as Zeno2.</p>
      <p><img src="/sites/default/files/old-images/zeno-specimen_6341.png"></p>
      <p>I did not use a single kern pair. It's amazing how well the font spaces in spite of that. I did not copy Malin's side bearings slavishly. For example, I slightly reduced the left side bearing of the 'b', a technique I gleaned from Paolo Giovio's 1550 Historarium, as reproduced in Updike v. 1, p. 160, in my opinion one of the finest examples of well-spaced metal text.</p>
      <p>John: thanks for the information about Martino Mardersteig. I did not know he was carrying on his father's tradition. I'd love to get in touch with him to see if there's interest in releasing (or maybe just using) my digitization. I tried asking Nigel Roche at the St Bride Library, but haven't gotten any response. Does anyone else have contact info for Stamperia Valdonega?</p>
      <p>George: your scans are <a href="http://levien.com/type/mardersteig214.jpg">here</a> and <a href="http://levien.com/type/mardersteig215.jpg">here</a>. These are 2400 dpi high-quality scans, so they're 30 megabytes between the two of them.</p>
      <p>hrant: what impresses me about optical scaling isn't the sheer <em>number</em> of masters, it's how well it's done. The ATF Bodonis used one master and I consider those to be very fine examples. In any case, the optical scaling of metal Zeno is spectacular, as is clearly evidenced by the initial "E" in the page above.</p>
