      <p>I'm no punchcutter or typecaster, but I do know that:<br>
      1) The punch is way harder than the matrix it's struck into.<br>
      2) You only strike a punch once in a blue moon; once you have a matrix, that's what you re-use to cast sorts.</p>
      <p>In fact AFAIK the only real wear is at the sort level (although discrete<br><cite>damage</cite> to the punches and especially matrices is not uncommon).</p>
      <p>hhp</p>
