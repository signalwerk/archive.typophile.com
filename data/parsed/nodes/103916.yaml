    <p>Hi,</p>
    <p>I noticed a lot of posters to do with typography, or made by typographic folks, are 'silkscreens'. The silkscreens seem rather expensive to me, which I assume is due to the printing process. So, are they really more expensive, and if so, are they really worth it? What makes a silkscreen better than an offset print or a high-quality laserprint?</p>
    <p>Cheers,<br>
    Jasper</p>
