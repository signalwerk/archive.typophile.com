      <p>Speaking of screen printing, we watched <a href="documentary about gig posters" rel="nofollow">this documentary a few days ago.</a></p>
      <p>It's had me thinking, maybe I'll make a frame or two, buy some hinges  and squeegees, some cuttable emulsion and pull a few prints.</p>
      <p>... But not with the highly toxic solvent, laquer, vinyl and polyester based inks mentioned earlier. I once worked on a job printing 2000 18" x 36" window decals - four colours on double sided on clear vinyl which meant that with both sides, a white background layer and an opaque block-out layer each piece went through the press 11 times, leaving 9000 square feet of wet vinyl ink gassing off into the shop for two hours beween colours.</p>
