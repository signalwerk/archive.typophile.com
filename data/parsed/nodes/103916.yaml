      <p>They aren't necessarily better, but the ink deposit is thicker &amp; colours can be more intense. A screen print can be a tactile experience as well as a visual one. </p>
      <p>The cost is in part, related to the size of the run, like any other print job. But screen printing is not a high volume, high speed media. When I was a screen printer a run of a few thousand was a lot for the company I worked for. </p>
      <p> like letterpress printing,  many of the screen printers still in business are in it for the love of it (aside from those cheapo T-shirt printers) and the quality of the print is down to the skill of the printer. You also pay for that.</p>
