      <p>Yea, pretty much what Russell said. It's like asking which is better: Woodblock printing or Intaglio? It's really just two different ways to make an art print. </p>
      <p>There's probably still a bit of an assumption that screenprinting, being at least partially hand-created has a bit more of a cache when it comes to 'art' but these days digital/ink-jet (or 'giclee' if you prefer the marketing term) printing is of such a quality that one can certainly find respected (and expensive) prints in that medium.</p>
