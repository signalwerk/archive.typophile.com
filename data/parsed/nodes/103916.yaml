    html: |-
      <p>Some 45 years ago, a college freshman who knew nothing about printing got talked into helping silkscreen some posters for a play that was being presented on campus. The inks and solvents he inhaled so corroded his brain as to leave him unfit for proper employment, and he was left to support himself (and later his family) by designing textbooks.</p>
      <p>But enough about me. Silkscreen printing is the medium of choice when you want densely opaque, flat, solid colors--something that offset lithography just can't do. It's also ideal when you're printing on something that has an irregular shape or texture, so you can't run it through an offset press--a coffee mug, a T-shirt, the front of a vending machine.</p>
      <p>Silkscreen printing doesn't print halftones with the high resolution you get from offset. It's a better choice for bold, hard-edged, high-contrast shapes, which can include letterforms. </p>
      <p>There are companies that do silkscreen printing on a massive, industrial scale (all those "Life Is Good" T-shirts and "Keep Calm and Carry On" coffee mugs didn't come from some hippie in his garage). But unlike offset lithography, silkscreen printing doesn't require costly, industrial-size presses. It can be done as a craft, by someone with talent, effort, imagination, and a few hundred dollars' worth of gear. And of course, hand craft work will always cost more than manufactured goods that reflect the economies of scale.</p>
    html_clean: |-
