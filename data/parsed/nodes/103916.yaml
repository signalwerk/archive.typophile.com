      <p>It's been a few years since I've used silkscreening, but one advantage is durability. Conventional printing can be more fragile and will fade faster when exposed to bright light / sunlight. </p>
      <p>&gt; or a high-quality laserprint</p>
      <p>A laser print is fine for a business report or a poster that'll hang on the bulletin board a few weeks, but not for something more permanent.</p>
