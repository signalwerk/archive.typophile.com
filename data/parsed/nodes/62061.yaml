    <p>Hi. I just started using Fontlab Studio 5. I have two questions:</p>
    <p>1. How do you delete anchor points? I select the anchor point and hit delete and it only deletes the point, not the accompanying line(s). In other words, it keeps the shape closed, just gets rid of the point.</p>
    <p>2. Where is the help section? It's not on the top right like other programs. And when I go to find the manual in the applications folder, all that is there is the icon for FS5. I did purchase the software. Maybe it's on their site?</p>
    <p>Thanks in advance,<br>
    Pablo</p>
  html_clean: |-
