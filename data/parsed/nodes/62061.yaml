    html: |-
      <p>There are two operations: </p>
      <p>1. Removing a node while keeping a contour as close as possible to the previous shape.<br>
      2. Breaking a contour. </p>
      <p>You can use the Eraser tool to remove a node keeping a contour as close as possible to the previous shape, and you can use the Knife tool to break a contour. You can also right-click on a node and choose Break contour. </p>
      <p>And then, there is the operation of deleting a node. Depending on the settings in the preferences, it behaves like the Eraser tool or like the Knife tool (plus actually deleting the node). </p>
      <p>I think it might be useful in <strong>FontLab Studio 6</strong> if hitting Delete behaved the way it does right now (according to the Preferences setting), but that there would be two modifier keys, e.g. Alt+Delete always deletes the node while keeping the contour, while Shift+Delete always deletes the node and breaks the contour. Do you think it would be useful? </p>
      <p>Cheers,<br>
      Adam</p>
