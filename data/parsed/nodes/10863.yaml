    html: "<p>Ok, let me work it out and put it the right way: <br>\"binding 6000 books an hour\" - after the hour: binding gone. <br> <br>But it's worse:  <br>I worked for months in a bindery -  <br>good and even expensive books bound by hotmelt, they will break if you use them.  <br>Catalogs for fairs and business expositions were bound using PUR.  <br>undestroyable, flexible spine - you could train your bizeps opening the book  <br>over and over (we did!), it won't suffer.  <br> <br>Bad world: good books falling to ashes like mummies  <br>and dumb catalogs, worth only for days, lasting forever. <br>And this because some cents, I would certainly add for a good book. <br> <br>Michael</p>"
