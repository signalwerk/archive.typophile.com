      <p>@ russellm</p>
      <p>In my opinion those restrictions are more useful than strictly forbidding embedding. Well, design is not the same as art, but in case of art the artist should have the right to forbid the misuse of his pieces of art, because it is not necessarily recognizable for the public anymore, if the piece of art is shown in a context, that is in contradiction to the intention of the piece of art.</p>
      <p>I assume, that, when the idea of EULA for digital products was born, the primary intention was money, but I can say for material pieces of art, sculptures for example, that the artist also can declare a license restriction with regard to the context, in which the piece of art is exhibited. In other words the artist could say: When you “buy” this sculpture, you are allowed to permanently possess it (if I don’t need it for an exhibition), but I remain the owner. In this case the fact, that sculptures (those ones, that are founded [in bronze for example]) are limited to a certain number of pieces, becomes a special meaning.</p>
      <p>As more the typeface is a piece of art, as more such a license restriction can become useful. In case of a body text typeface it would be absurd, because the function “content transporter” dominates the meaning of the typeface (Otherwise it would be not a good body text typeface.).</p>
      <p>Lol, in case of DTL I think they try to materialize their digital typefaces with the help of the price. The price makes the fonts to unicums.</p>
