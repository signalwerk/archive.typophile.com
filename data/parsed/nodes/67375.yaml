      <p>I suppose it depends on how subjective the terms are and if they could hold up under a legal microscope. Theoretically the licensor can put whatever restrictions they want in the EULA and, if it's written well, can hold the licensee accountable once they've agreed to those terms. Whether or not that is a practical reality is another story.</p>
      <p>I once had a conversation with the cartoonist <a href="http://www.fantagraphics.com/index.php?page=shop.browse&amp;category_id=211&amp;option=com_virtuemart&amp;Itemid=62&amp;vmcchk=1&amp;Itemid=62">Chris Ware</a> and I asked if he had ever considered translating any of his wonderful lettering styles in to typefaces. He said he came very close to doing so once, but ultimately decided against it because he didn't want to see his work used for cigarette ads or other things that he didn't agree with. He certainly could have attempted to thwart such usage in the license, but I'm sure he realized, from a practical standpoint, it can be tricky to enforce restrictions beyond a certain point.</p>
      <p>I've always been curious if there have ever been any licenses which attempted to restrict how the type was set to ensure it was used as intended – restrictions of size, spacing, capitalization, media, colorization, etc… like a legally instituted style guide.</p>
