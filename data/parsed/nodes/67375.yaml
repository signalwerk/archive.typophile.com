      <p>The idea of ‘moral’ clauses in EULAs is an interesting one, although it seems to me that what we're really talking about is exclusionary clauses targeting people or groups of people with particular ideas or involved in particular activities, and such clauses may or may not be defined in terms of morality. I might decide that my fonts are not to be used to promote scrapbooking, but not because I consider scrapbooking immoral. People find it easy to dress their prejudices up as morality, but I figure its easiest to simply avoid the moral debate in intellectual property licensing and simply be as bloody-minded as one is willing to be seen to be (and is willing to enforce). Alternatively, just put the stuff out there and if it ends up being used in a way of which you disapprove, use that occasion as an opportunity to speak out.</p>
      <p>My moral code is summarised by the statement ‘Don’t be an arsehole’ -- or as Christ more politely put it, ‘Do unto others as you would have them do unto you’ --, but I'm not sure how to frame that in terms of a EULA.</p>
      <p>James: <em>Mostly I just want to keep my fonts away from hate groups and cults like Focus on the Family, LDS, the moonies, and the Knights of Columbus. I specifically wrote that clause because of the bigotry coming out of LDS in recent years. The way I see it, when even the normally warm-and-fuzzy Mormons start acting like shits it’s time for sensible people to start building walls around them.</em></p>
      <p>This is sad, and also ironic, because if you talk to e.g. many Christians about how they view secular culture, you'll get a similar response: they are frightened and feel that walls need to be built to protect the values that they see under threat. The result is an acutely bitter divide based on mutual fear and distrust, which finds expression in both political and cultural terms. I am reminded of the frequent exhortation of John Paul II, ‘Be not afraid!’ -- not because there is nothing to be frightened of but because he knew, having lived through the Nazi occupation and communist repression in Poland, that people often do terrible things when they feel threatened.</p>
      <p>One of the things that I love most about type and typography -- at least text typography -- is its intrinsic connection with dialogue, with the exchange of ideas. One of the reasons I am less interested in display typography is that it seems more like shouting than conversation. The trouble with building walls, defensive though they may be, is that you end up with either the silence of separate solitudes or people shouting at each other over the ramparts. The opportunities for conversation are greatly diminished and, hence, so are the opportunities for typography to do what it does, i.e. articulate that conversation in written form.</p>
      <p>There are certainly things I hope not to see my typefaces used to promote -- things ranging from tacky and tasteless to moral evil --, but I don't seek to prevent such use.</p>
    html_clean: |-
