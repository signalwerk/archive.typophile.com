  html: <p>I recently read the EULA for a font  where the designer "absolutoely" forbade it's  use in a number of things we'd all tend to agree are bad. It seems like a well intentioned, but pointless inclusion, and well, a little beyond the scope of a type designer's job.  could a designer seriously contemplate taking any kind of action against some one who used his or her fonts to express thoughts, he or she disagrees with?</p>
