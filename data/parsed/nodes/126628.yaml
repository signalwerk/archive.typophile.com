  html: |-
    <p>Sharing some sad news from Vladimir Tamari's family:</p>
    <p>Dear friends,</p>
    <p>"With much sadness we share the news of Vladimir's death. He passed away peacefully on August 6th, at home surrounded by the love and care of friends and family from near and far. He used his final energy to express his love and to complete his last painting: a large, magnificent canvas of a cherry tree in full bloom. We know how much his friendships meant to him. Thank you so much for enriching his life and bringing him joy!</p>
    <p>With love and gratitude,<br>
    Kyoko, Mariam, and Mona"</p>
    <p>Our dear friend Vladimir was an active participant in (and a founder of) this Arabic forum on TPHL! We shall miss his wonderful friendship and talented insights.  Please celebrate his life by visiting Vlad's website and exploding his incredible work and accomplishments in many fields:<br><a href="http://vladimirtamari.com/index.html">http://vladimirtamari.com/index.html</a></p>
    <p>Also, appreciate his wonderful font addition, designed in the early 1960s and released few years ago!<br><a href="https://www.fonts.com/font/alquds-fonts/alquds">https://www.fonts.com/font/alquds-fonts/alquds</a></p>
