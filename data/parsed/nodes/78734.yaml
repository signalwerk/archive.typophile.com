    html: |-
      <p>I woke up a couple of nights ago after finding a beautiful, leather-bound, century-old tome, only to open it and find that it was printed in ITC Garamond. I clearly remember examining the letters in disbelief.</p>
      <p>What's interesting: how-tos on lucid dreaming often advise you to use reality checks to find out whether or not you're asleep. Books in dreams supposedly don't have any meaningful content, or randomly changing text if anything. That obviously doesn't seem to work for us :)</p>
