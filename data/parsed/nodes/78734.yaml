    <p>Just before I woke up this morning, a MyFonts page flickered past my mind's eye. It showed a face named Universium. More info filtered in - it was a hybrid of Univers and Gentium.</p>
    <p>There you have it. It's now all up to you if you want to wail and gnash teeth or go ahead and hybridise them.</p>
