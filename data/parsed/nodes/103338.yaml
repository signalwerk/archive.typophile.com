      <p>I think Gando Ronde might be seen as the Linotype-version of <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/typo-upright/" rel="nofollow">ATF’s Typo Upright</a> It has to be noticed though that the upright French Ronde has been rather popular in Germany in the 2nd half of the 19th century. Seemann’s ‘Handbuch der Schriftarten’ from 1926 lists eight German foundries such as Berthold, Stempel and Bauersche Gießerei that sell a ‘Rundschrift’ (round script). The design is credited with W. Woellmer (a typefounder/typefoundry in Berlin), 1860.</p>
      <p>Note that, unlike in Gando or Typo Upright, the ‘i’ in ‘Die’ tilts to the left … not very Germanic I’d say!</p>
