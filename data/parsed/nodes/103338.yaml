    <p>Used by Decca Music Group in cover and booklet for DVD set released in 2012.<br>
    No luck at Bowfin, where I flipped through "formal connected scripts," Identifont, or MyFonts search--which produced over 900 non-matching fonts for the tags "script-calligraphic."<br>
    The Z is very Germanic -- appropriate for Mozart's Die Zauberflöte.<br>
    So any idea as to the ID of the font?<br>
    Don<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/DieZauberflöte_5626.jpg"></div><p></p>
