    html: |-
      <p>Thanks for the book reference -- I'll see if I can find a copy -- and the designer credit.<br>
      As for the tilt to the left of "i" in the sample, you are correct that it does not tilt left in the BT digital Gando. Indeed, the BT version clearly tilts to the right.<br>
      Here is Gando's "i" as displayed in Jaspert's Encylopedia of 1970, presumably the metal font:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hij@GandoRondeLC@Jaspert1970__3647.jpg"></div><br>
      And here is the photocomposition version prepared for Mergenthaler by Hans Jurg Hunzicker and Matthew Carter in 1970, as displayed in Rookledge's Interational Typefinder:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/hij@GandoRonde@Rookledge1983__4013.jpg"></div><br>
      I don't see a tilt to the right of either the metal and photocomposition versions to quite the same degree as the BT version.  Nor do they tilt to the left as shown in the  Zauberflöte sample.<br>
      This almost suggests that despite the 2012 release date of the DVD the sample was made in the old way, from a set of photocomposition transfer letters and there was a lack of attention in pasting the "i". This may also explain the source of the Germanic Z as a Germanized set of transfer sheets. But I have no way of knowing any of this.<p></p>
      <p>Don</p>
