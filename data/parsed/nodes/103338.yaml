    html: |-
      <p>Thanks.<br>
      This is indeed a version of the same font . My copy of French111 is an old t1 with the notice "Copyright 1990-1998 as an unpublished work by Bitstream Inc." I checked the character set at Myfonts and note that BT has not updated the font to include the German Z as an alternate.<br>
      Anyway, it seems that the design predates the digital era.<br>
      Myfonts says about Linotype Gando that it is "The classical French Ronde, as it appears in the work of Nicholas Gando in the middle of the eighteenth century, adapted for photocomposition at Mergenthaler in 1970 by Hans Jurg Hunzicker and Matthew Carter. Typo Upright is similar."<br>
      As far as I can determine Linotype did not digitize it. A search at the Linotype website produces an offer of the BT font. Similarly Myfonts does not sell Gando and a search leads only back to French 111.<br>
      As for the Decca image, I can only guess at the source of the Z. Presumably it is  from a digital source.<br>
      Bowfin &amp; Identifont did not add anything.<br>
      Don</p>
