    <p>So i have to do some kind of logo guidelines for this, but I dunno what fonts were used for:<br>
    1 - the white text (the capitals and the small letters)<br>
    2 - the diagonal one<br>
    3 - the Chinese looking ones</p>
    <p>Anyone know of them?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/391795_10152348378695647_1453127551_a_4605.jpg"></div><p></p>
    <p>That's the biggest image I have seen so I am sorry if it may look unclear. Even the most similar fonts would be really helpful.</p>
    <p>What I perceive about this:</p>
    <p>white bold (or more) center text<br>
    - curved vertices<br>
    - capital C is a portion cut straight (but not exactly from the center) from capital O<br>
    - really thick (or plump even)<br>
    - looks like there was kerning involved here</p>
    <p>the RBX (diagonal)<br>
    - curve font<br>
    - direction of type seems to be sweeping upwards<br>
    - looks like handwritten type in some sort of way<br>
    - the capital letters seem to be different from the small letters - as if they come from different families (unsure)</p>
    <p>the Chinese characters<br>
    - sans serif<br>
    - looks the same as what I remember with other fonts</p>
    <p>Links to the websites <a href="www.rbx.com.ph/" rel="nofollow">here</a> and<br>
    here: <a href="https://www.facebook.com/pages/RBX-Rice-in-a-Box/239394555646" title="https://www.facebook.com/pages/RBX-Rice-in-a-Box/239394555646">https://www.facebook.com/pages/RBX-Rice-in-a-Box/239394555646</a> (Facebook ._.)</p>
    <p>UPDATE: I did notice or am just experimenting that the typefaces may have been altered by doing a bold stroke (using the bold tool in a word processing program such as MS Word) to attain that rounded vertices sans serif look. Just a heads up. (So much bad practice for this business, but that's what was assigned to me.)</p>
    <p>FONTFACE 1: Dokyo by Ben Balvanz (RICE &amp; BOX) and Interstate Bold by Tobias Frere-Jones (in a) - as commented by "fvilanakis" [FINAL]<br>
    FONTFACE 2: Komika Axis by Vigilante TC - as commented by "Renko" [FINAL]<br>
    FONTFACE 3: Apple SD Gothic Neo - as commented by "osamu" [TENTATIVE; FINAL] - substituted Nanum Gothic</p>
