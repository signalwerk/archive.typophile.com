      <div class="comment-spam-body"><p>I've just realized that the third character is the traditional form and so not really used any more in China. It has been replaced by the simplified form as is now the standard.</p>
      <p>The word(s) 盒之飯 would be read as "He zhi fan". First character (盒) = 'a lidded box', Second character (之) is a genitive/modifer, Third character (飯) as you're aware means rice, specifically cooked rice. So 盒之飯 literally means "box of rice".</p>
      </div>
