      <p>Not able to help with the latin text, but I did look at the Kanji. Unfortunately I don't have a huge store of Kanji types to play with so I thought I'd offer some assistance in helping you or others track it down.</p>
      <p>The image is too small to tell if the strokes are rounded slightly like the latin "Rice in a Box" or not, but in any case you are looking for a bold sans serif (as you said) with minimal stroke contrast. One feature that stands out is the stroke alignment. The 'dot strokes' are either perfectly vertical (as with the top of the second character), or all horizontal (as with the left-side radical on the third character). Though not unheard of it is unusual and may help you to narrow down the field. The other features are an elbow-join rather than a t-join on the foot of the second character, and an upwards curve on the 'lid' of the right-side of the third character. See below.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/chinese_5239.png"></div><br>
      Here I've used two system fonts to illustrate the features. No font I had included all these features, but the first shown here comes closest in colour.<p></p>
      <p>Not all the Chinese fonts I had included the third character (Han/meshi - "cooked rice" or "meal") which leads me to believe it may not be a character in standard use in written Chinese. It is very much in everyday use in Japanese, however.</p>
