    html: <p>Rick Mueller digitized Bravo over a decade ago. Click on <br>The 2005 Update on the left <a href="http://www.moorstation.org/typoasis/designers/mueller/index.htm" target="_blank"> here</a>. Almost all of Mueller's <br>fonts were the first digital versions of old typefaces which <br>may be found in the Solotype Catalog.</p>
