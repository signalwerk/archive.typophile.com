    date: null
    date_raw: null
    votes: null
    html: <p>I forgot you said 'Rubber Stamp' -- so this is the entire stamp?  If so, I don't think we will be able to tell you much. It could have been made from hand lettering, and we'd never know. The fact that it doesn't match anything I can find anywhere, in my library (so far), makes me lean that way. <br> <br>I'll keep looking for a while, and see if anyone else has any ideas.</p>
