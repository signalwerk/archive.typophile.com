      <p>&gt; a single horizontal line of moving text deprives the<br>
      &gt; reader of a sense of the lexical structure of the text</p>
      <p>But a helix (or really any such shape) is irrelevant there.</p>
      <p>If you want to convey macro structure (which I agree is useful sometimes, although not always) what you might do is have large -perhaps colored- shapes sitting above and below the reading like, passively telling the reader what chapter etc. he's on - they do this in the mental background, where it belongs. The actual text should still be a single uncluttered line (two max).</p>
      <p>The structure of a book for example is not really highly optimal - it arises not least from the needs of our arms and hands, which are irrelevant for reading per se.</p>
      <p>hhp</p>
