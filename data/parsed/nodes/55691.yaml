      <p>Altaira, you're extremely serious (I'm adapting myself :-)<br>
      So first, Thanks for the previous feedback!</p>
      <p>&gt;I’m thinking if you want to reap meaningful and fruitful feed-back, it is<br>
      &gt;still crucial for you to define exactly what it is you want this, primarily,<br>
      &gt;to be/become. An art installation? A toy? Or a tool?</p>
      <p>It started as a <a class="freelinking external" href="http://chronotext.org/bits/029" rel="nofollow">processing experiment in the wild</a> more than 5 years ago. Then it was featured in a <a class="freelinking external" href="http://chronotext.org/scriptorium" rel="nofollow">commissioned work of art</a> which is permanently exhibited side-by-side with the Dead Sea Scrolls in Jerusalem. Then it was reincarnated as a sketch for creating buzz around potential <a class="freelinking external" href="http://vimeo.com/3350149" rel="nofollow">iPhone toys</a>.</p>
      <p>&gt;but I think at the very least, you need to prioritize your goals.</p>
      <p>In parallel, I always dream of finding some more practical applications for the principle of "helicoidal text".</p>
      <p>&gt;If it’s your goal to make funky art, that’s fine, have fun, go wild. But<br>
      &gt;then don’t call it “design” and “information visualization” if you’re not<br>
      &gt;prepared to get involved in what it takes to make “design” and “information &gt;visualization” successful</p>
      <p>For the purpose of reaching *usability*, I'm aware that I need to initiate a dialogue with actors from the various fields of design (interaction design, information visualization...)</p>
      <p>If most of the feedback will be negative, if no one finds any seed of interest, nothing worth working on "another round" (we're talking about "iterative design"): then it's just fine with me.</p>
      <p>As for the feedback received here up to this point:</p>
      <p>- I agree that the "where to start reading" point needs care.</p>
      <p>- Distraction / visual interference: right again, could be enhanced.</p>
      <p>- Dizziness: definitely, but that's a side-effect inherent to spirals (the principle of hypnotism...) Actually, I can see it as an advantage for reading metaphysical content. Maybe not a coincidence if Buddhist sacred texts are placed on spinable cylinders.</p>
      <p>- Controls need work: right (quick and dirty work as for now...)</p>
      <p>The verdict is not that bad actually (room for another work iteration sometimes...)</p>
