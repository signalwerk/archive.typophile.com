      <p>This may not be quite so special, despite its brilliance.</p>
      <p>Isn't it like every project where a designer decides to insert a little <em>difficultas</em> into the layout, departing from the comfort of convention, in order to challenge the reader, with the promise of reward that comes from successfully negotiating the puzzle?</p>
      <p>It's best if there is some payback other than mere decipherment of text, and this is the sense of purpose, the recognition of meaning that comes from deciphering the designer's graphic metaphor. I say deciphering, but it's unlikely to be laborious, more like a flash of insight--you get it, or you don't.</p>
      <p>Also there is a sense of participation, of belonging, that comes from immersing oneself in the style of a cultural artefact.</p>
      <p>So, an example in a magazine may be the deck that's set with negative leading throughout. A little harder to read, but providing a frisson to the publication.</p>
      <p>Such creativity has a low percentage of success in the wrong hands--and with copy (content) that is less than riveting. I've done challenging designs in the past which I thought were really cool, and perhaps other graphic designers thought so too. But we weren't the target audience, and I can look back at that stuff now and be sure nobody got past the first word. Nonetheless, designers have to take chances, to find the sweet spot that is different enough to be interesting, but not too difficult to negotiate, or else their work will suffer the opposite fate of being too dull to register with potential readers.</p>
