      <p>Ariel, I'm very interested in this from an information visualization, microscreen and readability point of view. </p>
      <p>As a reading science sleuth I found the babel experiment very interesting. By fixating steadily at a point in the text the text moves easily through the foveal field and the foveal field is drawn slowly through the helix. Parafoveal vision is kept intact; that is, it isn't disabled as in RSVP presented text. So I think this engages and plays with the perceptual mechanics of reading quite effectively. I don't think this is like scrolling credits at all. I found sense-following to be effortless and enhanced by the underlying text presentational metaphor. </p>
      <p>I did find the show-through from the intersecting text from the back of the helix distracting and felt it needs to be knocked back at the point where the eye is fixating. This might require a device to monitor eye position. Also monitored could be eye movements so the speed of the rotation can be adjusted to the individual's reading speed. This could prevent saccading forward. </p>
      <p>On microscreens your paradigm could be prove functional I think, and in terms of interpretive typography, your experiments are historically interesting and very smart. Think of Apollinaire's Calligrammes for instance.</p>
      <p>Who said this: "Typography is not a police state." And doesn't John Hudson say "readerability" is quite elastic? I for one embrace what you are doing. But then I think the experiments of David Carson have a place in the historical pantheon as well. It's not just shrapnel. I say Bravo!</p>
