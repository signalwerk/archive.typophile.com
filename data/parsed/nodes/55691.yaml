      <p>"So the question is, how useful is it really to sacrifice so much performance, for what gain?"<br>
      Well, I don't think reading lots of moving text is a good idea either. But since I first saw Muriel Cooper's work, I thought that type in space would be a much sweeter interface than windows are. And getting from one place to another among of type elements in space, whereby the type moves you from one place to another, perhaps reading as you go, that I think is cool. In addition, I think it has more application for touch screen interfaces than mouse driven ones. </p>
      <p>Cheers!</p>
