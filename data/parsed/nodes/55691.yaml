      <p><em>"art, design and information visualization"</em></p>
      <p>I'm thinking if you want to reap meaningful and fruitful feed-back, it is still crucial for you to define exactly what it is you want this, primarily, to be/become. An art installation? A toy? Or a <em>tool</em>?<br>
      Making this decision will influence how successful your "experiment" is / will be seen to be – what it will be judged as, and against. You say the lines between these fields are blurred; but I think at the very least, you need to prioritize your goals.</p>
      <p>The following remarks are coming from a design/usability perspective.</p>
      <p><em>"If you start to read from the top, your eye will follow the text and without paying attention, you will reach the bottom of the helix."</em></p>
      <p>1) It does look cool to me from an abstract, graphic design perspective. But this being text, my eyes want to read it.</p>
      <p>2) Immediately knowing where to start reading is not super-intuitive. That might seem stupid, but yes my eyes were confused for a moment.</p>
      <p>3) My eye must work differently from yours because (a) I get dizzy real quick when trying to focus on the text, which is not very pleasant, and (b) there is a hell of a lot of distraction / visual interference going on, which is annoying for the process of reading. I don't like having stuff move around in my field of vision when I'm trying to read, especially not high contrast stuff, and especially not other text.</p>
      <p>4) I think the controls need work. I got frustrated after exactly 6 seconds. How can I revert back after having double-clicked? I ended up restarting the application. Having no visible UI makes it even more of an "experiment", and definitely not a tool.</p>
      <p>I maintain my previous impression that it's fun in terms of being an artsy experiment, rather than something primarily meant to be *usable*.<br>
      If it's your goal to make funky art, that's fine, have fun, go wild. But then don't call it "design" and "information visualization" if you're not prepared to get involved in what it takes to make "design" and "information visualization" <em>successful</em> (which isn't the same as "pretty"). When you start arguing in these terms, do not be surprised when your work is measured by them; and at least in my view, in the <em>design</em> game, you can't escape the usability/usefulness/readability discussion by calling up your grand artistic vision, or generally discarding the judiciousness of those who put up well-grounded arguments against the same.</p>
