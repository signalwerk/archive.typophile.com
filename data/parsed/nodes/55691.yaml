      <p>&gt; By fixating steadily at a point in the text the text moves easily through<br>
      &gt; the foveal field and the foveal field is drawn slowly through the helix.</p>
      <p>1) You're wasting the parafovea.<br>
      2) The reader needs to control the [non-smooth] motion.<br>
      3) It doesn't need to be a helix (except to please the creator).</p>
      <p>&gt; This might require a device to monitor eye position.</p>
      <p>Yup. And if you follow this train of thought to its terminus you arrive at what I describe above.</p>
      <p>&gt; I noticed my eyes were still having to make regressions</p>
      <p>Yup. It's a natural part of reading. Without regressions reading cannot be efficient, because you're blocking the brain's powerful intelligent guessing ability. Of course regressions are not efficient per se, but they are evidence that something quite efficient is happening deep down. Basically, you're not going fast enough if you don't bump the curb sometimes.</p>
      <p>&gt; Is there really such a thing as fixed-speed, continuous reading without saccades?</p>
      <p>Nobody has ever seen that happen.</p>
      <p>The eye can only smoothly follow a moving object, and if you have to perform a saccade from one part of a moving object to another (noting that a text is really one thing) you're much more likely to miss.</p>
      <p>&gt; I could also plug-in a keyboard</p>
      <p>Using the mouse (just the left-right axis) would be better; you might also use the left button for a regression. The problem is that no matter what you use you're moving a function from the subconscious realm to the conscious - that will not be pretty. It's like when a doctor asks a patient to "breathe normally" - the result is never normal!</p>
      <p>On top of that, speed isn't even really what's at play. :-/ Saccade distance is highly variable (and sometimes backwards!), both between individuals and with one individual depending on so many variables. If the line must move, it must do so in tune with the jerky needs of the reader's visual cognition. This is very difficult to pull off.</p>
      <p>--</p>
      <p>Frankly, in the design field this is called a solution looking for a problem. Experimental art can be quite useful to society, but you need to gauge your dedication to moving into the functional realm. If you try to sort of make it more functional I fear it will still not be functional enough, and all you will do is detract from the art.</p>
      <p>hhp</p>
