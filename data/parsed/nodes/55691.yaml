    <p>This experiment shows some text placed on a rotating helix. If you start to read from the top, your eye will follow the text and without paying attention, you will reach the bottom of the helix.</p>
    <p><a class="freelinking external" href="http://chronotext.org/lab/Babel.jnlp" rel="nofollow">http://chronotext.org/lab/Babel.jnlp</a></p>
    <p>Requirements: Java (and the Georgia font) installed. The first time will be longer to load and at some point you'll have to "trust" Sun MicroSystems...</p>
    <p>Intructions: either watch and do nothing or drag your mouse horizontally to control spin. (You can try to double-click while saying amen as well...)</p>
    <p>This is a follow-up to <a class="freelinking external" href="http://typophile.com/node/55496" rel="nofollow">this thread</a> where some very categorical statement have been made regarding text in motion.</p>
    <p>Yes, I think that this experiment is raising some interesting questions in the domains of art, design and information visualization. No, I don't think that some clear lines exist between the 3 mentioned domains.</p>
    <p>Is it possible to have a constructive discussion here, with mutual respect and doors left open?</p>
    <p>Ariel<br>
    <a class="freelinking external" href="http://chronotext.org" rel="nofollow">http://chronotext.org</a></p>
