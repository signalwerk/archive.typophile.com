      <p>&gt; without paying attention, you will reach the bottom of the helix.</p>
      <p>Indeed. But if you try to pay attention, you won't.  :-/</p>
      <p>It's fun for a few seconds, but that can't be enough reason. Don't you realize when you're reading it how slow -and hence annoying and uncomfrotable- it is? If you're not annoyed it's probably only because you made it yourself... People don't like going slow for no reason - they want the <em>content</em>, pronto. It's tedious because reading is very dynamic and "interactive" - for one thing it's not a smooth motion; plus it varies among people, especially with respect to age. Please check out this page for just a faint idea of strange reading is: <a href="http://themicrofoundry.com/ss_read1.html" title="http://themicrofoundry.com/ss_read1.html">http://themicrofoundry.com/ss_read1.html</a></p>
      <p>I'm really trying to be serious and constructive when I say that you can't subvert human nature to your artistic desires. Categorical? Saying humans can't digest tree bark is categorical too but if it prevents a restaurant from serving it that's a good thing.</p>
      <p>Make all the art you want, but it's not healthy to pretend it's highly <em>useful</em> to many people. Now, if it turns you on, you should definitely keep doing stuff like this (and even showing it on Typophile if you like) but you should leave it to others to analyze/compliment the results, and don't expect everybody to cheer. Otherwise you won't get any useful feedback, and thus will not improve yourself and your work.</p>
      <p>--</p>
      <p>You want to improve reading by using a dynamic interface? Try this, which I thought up many years ago: track the reader's focus, and make the word he's looking directly at sans serif with a large x-height, and the words to the right increasingly larger and with longer serifs and smaller x-height. And every time the reader saccades, the display changes. At first a reader will have trouble, but my guess is that the brain will quickly learn the trick, and you'll double reading speed, by doubling the average saccade distance. Sort of like using an atlatl.</p>
      <p>hhp</p>
