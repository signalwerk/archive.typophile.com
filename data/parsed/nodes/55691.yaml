      <p>Ariel, the new iteration is a big improvement. Could you try a mouse-controlled one, and with a finer stepping of speed?</p>
      <p>Reading speed/comfort is much improved, surely because the reader controls the rotation speed. However I found myself exerting a lot of conscious effort to keep going, detracting from real understanding of the text; even though I was reading the words without too much trouble, when I asked myself to repeat what I had read, I couldn't. Having to use an input device is a big part of that I think (see below). Now, if it's a text that people already know the essence of, that's not so bad. Just like when you go to the opera, you know what's going to happen, but you still enjoy it, and it means something different (and possibly better) than reading a print version of an opera you don't know.</p>
      <p>So you could say there needs to be a balance between conscious control and immersion. I think if you could figure out a way to have a single button control the motion effectively, that would be the most immersive (other than stopping the motion entirely :-). Maybe make the space bar* like a gas pedal, so holding it down speeds things up** and letting it go slows things down. So if you feel like you're having trouble keeping up, you let go, wait a second, and saccade backwards*** to catch up.</p>
      <p>* Or actually a smaller key to reduce resistance.</p>
      <p>** Ideally up to a maximum pre-determined speed according to the reader's expertise. Or you might even intelligently guess at a good maximum dynamically based on the "gas-down" percentage! That would be great.</p>
      <p>*** Not the same as a regression here however.</p>
      <p>And something minor: when I get to "Shimar" my eyes involuntarily jump back to the beginning, then I have to scramble back down-left, hitting the brakes. This must be because vision is attracted to moving things, and the beginning of the text stands out when it suddenly comes back in from the right. And this should be the case with virtually everybody (although at slower speeds it might be OK). I can't think of how best to solve this, because the display doesn't [need to] know where you you are in the text.</p>
      <p>hhp</p>
