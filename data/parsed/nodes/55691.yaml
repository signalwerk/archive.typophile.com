      <p>That may give the wrong impression. It may be elastic, in the sense of accomodating new things by stretching, or it may simply be massive and we have yet to identify the limits of what it can accomodate. I'm not sure which, but instinctively I lean toward the view that it is massive.</p>
      <p>I do think horizontally scrolling text can be comfortably readable because, as you note, it provides for a constant fixation through which all the text moves, removing the need for saccades and hence for regressions. The application to microscreens is an interesting idea. What I found uncomfortable in the Babel spiral were the amount of stuff around the fixation and in the background and the top to bottom movement. The spiral is a nice piece of art, but from a 'reading moving text' perspective, a simple horizontal scroll through a limited field would be more interesting and revealing.</p>
