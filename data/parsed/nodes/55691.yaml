      <p>I wonder which would be more comfortable to read:</p>
      <p>1)  a text moving at constant speed (alterable by reader control) as you have; or</p>
      <p>2)  a text moving at speeds that vary based on changing content (also overall alterable by reader control). I'm thinking of changes (based on theory or experiment) like:<br>
      - speed set per syllable rather than horizontal width (so "through" and "so" would pass by at the same rate; and "amy" would pass more slowly than "yam")<br>
      - slower at spaces ("nevermore" would be faster than "never ore")<br>
      - slower at punctuation like commas, periods, colons.<br>
      - slower with more complex syntax or vocabulary.</p>
      <p>(Many of these ideas are based on cadence of reading aloud - I recognize they may not translate to considerations of silent reading unproblematically.)</p>
      <p>In other words, would the reader find a changing speed based on educated guesses of their own needs more, or less, annoying?</p>
