      <p><em>"horizontally scrolling text … provides for a constant fixation…, removing the need for saccades and hence for regressions"</em></p>
      <p>Not knowing enough about the science of this, I wonder about it from a "user perspective": I noticed my eyes were still having to make regressions, and sometimes wanted to jump ahead faster than the text was scrolling, too. Also when reading static text, I <em>can</em> try to make my eyes move continuously, but it seems to hinder optimal retaining of content.<br>
