      <p>This resembles the mechanical lettering of devices like the Leroy Automatic Lettering Machine. Nick Curtis has a 3-weight font called <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/planscribe-nf/?refby=bowfin" rel="nofollow">Planscribe</a> that is based on the output using the Leroy device. It is not an identical match, but its feeling is similar.</p>
      <p>I could not find a more similar font.</p>
      <p>- Mike Yanega</p>
