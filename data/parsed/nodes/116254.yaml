    html: |-
      <p>Good find Dick! Always a good idea to check the boutique publishers like Milieugrotesque that are not at Myfonts.<br>
      BTW this is a most peculiar font, sans for the upper case, serif for the lower case, both monoline. Does the "Senza" in the name stand for the hybrid nature of the font?<br>
      I gather that it is based on the typewriter font in an IBM Selectric typeball or element [what Milieugrotesque  calls a golfball]  designed in the years when IBM was a real design powerhouse. These designs are a goldmine for digital font makers.<br>
      On refection, a hybrid font is an elegant solution for the problems of a monospaced/typewriter font. The serifs on the lower case help to fill the fixed space. The absence of serifs on the uppercase means that the there is less of a horizontal squeeze on the letters to make them fit the fixed space. But this is speculative, as it seems that the original IBM font was only provided as an serifed italic.<br>
      Don</p>
