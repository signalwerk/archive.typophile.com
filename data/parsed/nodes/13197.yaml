      <p>I like the shadow created on the Evian logo but the mountain is too jagged in my opinion (<a href="http://www.ferraud.com/france/pro/TISTRA/Tistra%207438.html" title="http://www.ferraud.com/france/pro/TISTRA/Tistra%207438.html">http://www.ferraud.com/france/pro/TISTRA/Tistra%207438.html</a>), I'm not suggesting that you follow the style entirely but using your pallette of light and dark blue you should be able to avoid the outline aspect of it – possibly light blue as sky, dark blue as deep shadow/rocky outcrop everything else is snowy mountain or light blue shadow, dark blue rock snowy mountain. Also the shear on the type doesn't look equal to me.<br>
      Tim</p>
