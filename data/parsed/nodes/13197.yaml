      <p>I would say that the apple logo makes a lot of sense. It's an apple. However, the type you've chosen just seems too hokie. Try something tighter cleaner. Maybe use a blur effect on part of it to make it look like you're looking through ice at the logo. Get creative and really think differently. Think about what the company does. They don't freeze things, they provide longevity. They provide extended life. Get extremely abstract. Get so abstract to the point where the next day you look at your work and don't even remember what you were thinking or what it's supposed to represent. When you get to that point, bring back a to the literal a little bit more and you'll find yourself in the perfect situation for an outstanding trademark.</p>
      <p>P.S. If you have't thrown your tablet across the room in a fit of frustration, you're not done yet. If you're not using a tablet, I'm going to cry.</p>
      <p>Joseph Szala<br>
      Prestidigitator Extraordinaire</p>
