    html: |-
      <p>Hmm - that makes this deeper to be sure. I think you have done admirable work so far given your background then. To be honest I don't LOVE any of the examples posted so far. I wouldn't use any of them so far -  given a choice. I would want something simpler. For 100 reasons. Longevity is certaily one of them.</p>
      <p>I did want to encourage you. It is a process. I love logo &amp; identity design. But it's like writing a haiku. A good final solution needs to be short &amp; evocative. </p>
      <p>How long a time period did you negotiate? If they want something that will last then they need to give you enough time to work something out that is a quality logo.  </p>
      <p>If you are in a hurry though I would look for a Snowflake that reads well - maybe a fat version of the universal snowflake the site uses before it shows us the actual designs. A snowfalke says frozen which is good. It mean that you just have to deal with the type - one problem down and all of that...</p>
      <p>If you have some time I would take a little of what vigorgraphics said seriously. I would sketch ideas &amp; do research. Let your mind wander &amp; see what pops in for a visit. See what other folks have done in the past &amp; see if you can think of an inventive way of riffing off of what you like.</p>
      <p>In the meantime I have yet another idea - okay several. What if you had a snowman character? Old fashioned I know but there are ways of making old good too. What if you used icecubes &amp; cut W &amp; F into them? Minimal. Modern. What if There was one cube &amp; the w was written in water &amp; the F was the cube? Also mordern. Maybe too cute. What if you built W &amp; F out of brioken icicles? Sort like andy goldsworthy. Know his stuff? Could be quite strong. What if you have a hole cut in ice &amp; there was an F fishing with a W? Maybe too cute again. Maybe not. What if the logo was Windsor freezer written by hand on Frosty glass? Very modern - hard to reproduce well in all media. </p>
      <p>So maybe you had better say how the logo would be used. On trucks? Or just letterhead?</p>
      <p>Also Windsor Freezer is so 20th century. That's half of the problem. You are are working with iffy materials in some ways. Espcially if the new direction is meant to be modern. Maybe you should pitch to change the name of the company too. Two word names &amp; especially two words with locality in them are not really part of the global progresive business branding mindset. And a name change with a logo change could be just the ticket. </p>
      <p>On the other hand a solid retro treatment would match the retro name.</p>
      <p>If you want - contact me &amp; I will talk to you about it.</p>
