    html: <p>Well, thanks for your input everyone.  I decided to drop the flowers altogether and the client had me do a bunch of mountain ones.  I didn't send them here though, but I put up the final logo he selected.  I was wondering if there was anything else I could do to improve this one but to keep it more or less the same.  I kind of like it too and it's probably the best of the bunch that I showed here.</p>
