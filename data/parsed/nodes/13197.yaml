      <p>Hey guys.  Thanks for the comments so far.  I've been working a few more logos so I posted those up here.  I actually really like the Trademarker Fat font that I used.  I've tried several others that I own but Trademarker speaks "cold" and "speed" the best.  It looks fairly unique too since I haven't seen it used in logos before.</p>
      <p>I tried to incorporate the rotated W's to make a snowflake but everything I came up with looked complicated or you couldn't see the "W" anymore in it.</p>
      <p>I like the leaf because it's simple, although I don't like the leaf itself.  If there was another small, simple shape like that, I think it would look great.  Anyway, you can see that in the 4th gif file.</p>
      <p>I put up another logo that uses the infinity symbol to represent longevity.  It looks okay, but it's too big.  I tried using a serif font with small caps to give the same effects as the bolder types, but I'm not very impressed with that one.  It does kind of look like mountains or hills and has the shape of the W in it too though.</p>
      <p>The company is pretty concerned with getting something that's corporate looking, because they have a lot of major clients (mcdonalds, costco, outback stakehouse, maple leaf foods, etc.)  They want to look credible and large to those clients and not like a smaller owned business.  So finding something that's clean and simple that conveys this is really important.  That's why I want to avoid blurs and other overly "creative" effects.  Also, their refrigerated systems are very clean and they keep food fresh, so the logo should have this built in indirectly.</p>
      <p>Anyway, I remember there was this Canada Bread logo that was fantastic, so I'm going to try and do something similar to represent storing food/longevity with the letters 'W' and 'F' instead of 'C' and 'B' and see how that goes.</p>
      <p>Thanks again for your comments.  I'll keep the logos coming.</p>
