    <p>This is some logos I've been putting together this morning for a company that offers refridgerated storage.  They mainly do food, like fish, meat, produce, etc. and specialize in making quick transactions (i.e. getting the good in and out of the warehouse as quickly as possible.  They wanted a clean logo (to symbolize clean place with and fresh food) that was blocky, cold/frozen as well as quick.  Here are some things I came up with.  I'm having trouble coming up with a mark or an actual logo for them.  I think the type I use (FF Trademarker, suggested by eben_sorkin) was the best fit, although I tried 20 or so others that were okay.  I'd appreciate any advice you could provide.  Thanks!</p>
