      <p>Ria, your effort has a lot of merit, but there’s a big problem: virtually all expressions of form-counterform (better called notan) in type design are nothing but lip-service. This is especially true of those who believe that chirography (loosely meaning calligraphy) should be a central force in type design; they tend to say nice things about notan, but in practice work to demote it. As my father is fond of saying: You can call you daughter George, but that won’t make her a boy.</p>
      <p>Really the only type designer who’s said anything worthwhile about notan is Bloemsma: study his work and thoughts - you will derive a singular benefit.</p>
      <p>hhp</p>
