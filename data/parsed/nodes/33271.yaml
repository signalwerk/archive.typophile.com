      <p>If you can find a copy, I think either edition of Hermann Zapf’s <em>Manuale Typographicum</em> would be an ideal source for you. </p>
      <p>My edition (1968, MIT Press) has 100 pages. Each page contains one or more important thoughts about typography, type design, printing, books, culture, language. Some pages have three or four quotes. There are quotes comparing the form of typography to that of architecture, or music, in addition to the expected things such as, “With 26 soldiers of lead I shall conquer the world.”</p>
      <p>What is most impressive is that Zapf has printed the quotations in the original language of the author (!) and provides a translation into English in the back of the book. I assume the other edition (late 1950s?) is the same general idea, although I have not seen it in person. </p>
      <p>I do not know if either of these was ever reprinted in a subsequent (offset, thus cheaper) edition. The original editions were very carefully made in multiple colors, printed letterpress, so they are rare at this point and you would be likely to find them only in the special-collections section of a university library, or in a private collection.</p>
