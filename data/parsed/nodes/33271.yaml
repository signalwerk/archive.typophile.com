    <p>Hi, I am looking for some quotes about typography, especially about form and counterform.<br>
    If anyone can help me to find some quotes about typography stractures, that will be really nice.<br>
    I was looking for some but they did not talk about negative spaces.</p>
    <p>And also does anyone know whos quote this is?</p>
    <p>“Space is an equal and integral partner in both typeface design and page layout of typography. The two forces of positive and negative require each-other to exist”</p>
    <p>Cheers</p>
