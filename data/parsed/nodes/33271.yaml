      <p>I don’t know the source of your quotes, but the best bets are either<br>
      <a href="http://www.linotype.com/793-12657/black-and-white.html">Adrian Frutiger</a> or <a href="http://www.letterror.com/noordzij/index.html">Gerrit Noordzij</a>.  If you look into their works you will find interesting discussions of the the balance of black and white, form and counterform. The discussions go back to end of the 19th century, with the introduction of East Asian ideas about the balance of dark and light, known as ‘nóng dàn’ in Chinese or <a href="/wiki/notan" class="wiki">notan</a> in Japanese.</p>
