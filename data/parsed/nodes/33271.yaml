      <p>Chris-</p>
      <p>Henry Ford once said, “history is bunk.” Some people may read that to mean that it’s meaningless— I don’t. i prefer to think it refers to the vast oceans of experience that exist beyond what we normally consider as “historical.”  Each person in the crowd — every unrecorded, unremembered utterance added, in it’s way, meaning and relevence to even the most important events. As Ken Nordine put it[i’m paraphrasing]: the face in the mob crying, “yes! yes!’ as ’history’ unfolded helped condition the truth.</p>
      <p>Whenever someone can give voice (eloquence? understanding?) to our achievements and fumblings, it’s important.</p>
