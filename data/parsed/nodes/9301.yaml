    <p>...is alive and still kicking. <br> <br>Some of us here are old enough to remember the days before The Internet was a household word, when private online networks were all the rage. Back when David Lynch was making tv shows. In those prehistoric times, I used to spend a substantial part of my free time on CompuServe's Desktop Publishing Forum. Somewhere in the mid-nineties, I was lured away by the internet and never looked back. <br> <br>The forum continued on without me. Yesterday, I received a note from Kathleen Tinkle saying that it has recently detached itself from the mothership and set down on the vast (and hopefully more favorable) frontier of the World Wide Web (<a href="http://desktoppublishingforum.com/" target="_blank">http://desktoppublishingforum.com/</a>). <br> <br>Congratulations an good luck to Kathleen and her cohorts. I'm not really "doing DTP" anymore, but I'm going to check it out and encourage others to do so as well. I hear some of them like to talk about type.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/8432" class="topic-previous" title="Go to previous forum topic">‹ The fonts of 2004</a> <a href="/node/9214" class="topic-next" title="Go to next forum topic">Steven Heller lecture on totalitarian design, CCA[C] 2005/02/10 ›</a></div>
