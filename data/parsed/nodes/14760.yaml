    html: |-
      <p>The full press release info:</p>
      <p>The question to be asked:<br>
      What does a downtempo electronic music duo have to do with a semi-famous 18th Century type designer?</p>
      <p>Nothing &amp; Everything would be the answer.</p>
      <p>P22 type foundry has digitized new versions of the famous William Caslon fonts. The William Caslon Experience took their name from the same person that these fonts are associated with.</p>
      <p>The William Caslon Experience is an accomplished musical duo who create unique, lush electronic downtempo landscapes. The William Caslon Experience have released 4 full length CDs and have had tracks remixed by DJ luminaries- The Herbaliser &amp; Fila Brazillia. The Thievery Corporation has called their sound “some kind of cross between Medeski, Martin and Wood, Stereolab and Tortoise.”</p>
      <p>The P22 record label teamed up with FLT5 records to compile some of The William Caslon Experience’s best tracks onto a new CD. This CD contains a brand new remix by Odiorne in addition to a brand new “remixed” Caslon font. This exclusive font can be loaded onto any computer and can only be purchased with this CD.</p>
      <p>The CD “discfolio” packaging has been hand-printed in three colors by letterpress designer Bruce Licher of the Independent Project Press in Sedona, Arizona. Mr. Licher’s work has been featured in countless design magazines with his distinctive style.</p>
      <p>Each CD is numbered and comes with a foldout broadside liner notes sheet/ poster.</p>
      <p>The CD is available through independent music distributors and directly from P22 as a separate purchase or as a premium with the purchase of the new LTC Caslon Family font set.</p>
