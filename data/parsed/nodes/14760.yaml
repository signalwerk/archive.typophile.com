    <p>—<br>
    From P22 Records and Lanston Type Co.</p>
    <p>——————————————————————-<br>
    The William Caslon Experience<br>
    William Caslon was an 18th century type designer. The William Caslon Experience is an accomplished musical duo who create unique, lush electronic downtempo landscapes. The P22 record label has teamed up with FLT5 records to compile some of our favorite tracks of The William Caslon Experience onto a new CD. This CD contains a brand new remix by Odiorne in addition to a brand new “remixed” Caslon font. The exclusive font can ONLY be purchased by getting this CD.</p>
    <p>The special CD “discfolio” packaging has been hand printed in three colors by letterpress designer Bruce Licher of Independent Project Press. Each CD is numbered and comes with a fold out broadside liner notes sheet/ poster.</p>
    <p>Get the CD free with the purchase of the LTC Caslon family<br>
    <a href="http://www.p22.com/lanston/products/caslon.html">http://www.p22.com/lanston/products/caslon.html</a><br>
    or buy it separately for only $15.95<br>
    For more information see: <a href="http://www.p22.com/records/">http://www.p22.com/records/</a></p>
    <p>——————————————————————-<br>
    Odiorne is the musical brainchild of P22s very own Jimy Chambers. The new Odiorne CD released on file 13 records can also be bought via iTunes, but the first Odiorne EP cannot.<br>
    It can however be purchased at a special reduced price from P22. http://www.p22.com/records/<br>
    Get “Want them leaving more” for only $5.95 – and if you order at the same time as the William Caslon Experience, save on combined shipping!</p>
    <p>That’s all for now.<br>
    ——————————————-<br>
