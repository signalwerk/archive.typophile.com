    html: |-
      <p>Elsner+Flake’s version has <a href="http://new.myfonts.com/fonts/ef/microgramma/ef-medium-extended/characters.html" rel="nofollow">258 glyphs</a> and comes in 2 styles for $35 each, URW++ has a version with <a href="http://new.myfonts.com/fonts/urw/microgramma/d-medium-extended/characters.html" rel="nofollow">432 glyphs</a> for $19.95 per style and offers an additional ‘Only Shadow’ style. It has a wider language support and also a couple of OpenType features (e.g. fraction figures).<br>
      Also, the design is slightly different, most notably in glyphs like the € or the @.<br>
      Note that there is also a <a href="http://new.myfonts.com/fonts/linotype/microgramma/" rel="nofollow">version by Linotype</a>. Plus, see the extended style of the various <a href="http://new.myfonts.com/fonts/linotype/eurostile/alternate_cuts.html" rel="nofollow">Eurostiles</a>.</p>
