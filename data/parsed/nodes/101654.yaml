  html: |-
    <p>Hi to everybody, from Greece!<br>
    I would appreciate if someone would give me an answer to the following problem:<br>
    I can not see any of the 1100 ligatures of an OpenType font in MS Word 2010 (PC).<br>
    Has it to do with the OS or with the otf font itself? I think there wasn't such a problem in the previous version.<br>
    Konstantinos Siskakis</p>
