    html: <p>As I read the TypeDrawer thread, the digital signature is only required for OS/TTF fonts (in MS Word 2010). The OP could make up his fonts as a CFF  font, and if the ligatures now work, it is a digital signature issue. If they still don't work, it is something else...</p>
