    html: "<p>Hrant: It's a problem common to many digital cameras, right up to the semi-pro devices. I get frustrated with my own Fuji S602 for the very same reason. (Why don't camera reviews make a bigger deal of this? Sigh...) Even when set to manual everything I feel I'm making a request for a picture to be taken, not taking the picture myself. It turns photography into something akin to video: you press the button with the hope that the desired shot is imminent, and shooting tons of footage you use your \"creativity\" in the editing process. The difference between film &amp; digital stills may only be 0.2s or so (~0.1s vs. ~0.25s), but psychologically that's huge. To capture moments, stick with SLR.</p>"
    html_clean: "<p>Hrant: It's a problem common to many digital cameras, right up to the semi-pro devices. I get frustrated with my own Fuji S602 for the very same reason. (Why don't camera reviews make a bigger deal of this? Sigh...) Even when set to manual everything I feel I'm making a request for a picture to be taken, not taking the picture myself. It turns photography into something akin to video: you press the button with the hope that the desired shot is imminent, and shooting tons of footage you use your \"creativity\" in the editing process. The difference between film &amp; digital stills may only be 0.2s or so (~0.1s vs. ~0.25s), but psychologically that's huge. To capture moments, stick with SLR.</p>"
