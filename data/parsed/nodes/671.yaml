    html: <p>Interesting. In fact 0.1 seconds is the approximate fastest human finger reaction time. <br> <br>&gt; To capture moments, stick with SLR. <br> <br>Or full-motion (hi-res) video and then select a frame?  :-/ <br> <br>hhp <br></p>
