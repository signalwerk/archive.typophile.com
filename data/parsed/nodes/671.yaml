    votes: null
    html: "<p>&gt; In fact 0.1 seconds is the approximate fastest human finger reaction time. <br> <br>The relevant physiological constraint is not reaction time, but with what precision can one operate a trusted piece of machinery. From experiments (aged 11) I know I can stop a stopwatch within 0.02s of the full second quite reliably. A photographer sees moments coming, and can adjust for a 0.1s delay in a mechanism to an accuracy better than 0.1s. But with longer delays, there will be a rapid fall-off of such accuracy. The probability that you can predict what's going to happen 0.1s from now in a complex environment, is much higher than for 0.3s hence. This is armchair musing, of course. We should both ask good photographers whether they agree... But I liked a story I heard from a friend who once found himself at a party with Henri Cartier-Bresson. The great man would stand in a corner on his own, chain-smoking Gauloises and looking depressed. Every few minutes though, he would whip out his camera, click!, then hide it away again. Hardly anyone had noticed a thing. This seems to me to be the human equivalent of a frog catching a fly: a neuronally complex, supremely precise action, the perfect result of those minutes of observation. Any error in its timing - just by a tenth - would mean the prey would escape both frog and Frog. <br> <br>&gt; Or full-motion (hi-res) video and then select a frame?  :-/ <br> <br>A smaller version of <a href=\"http://bssc.sel.sony.com/Professional/webapp/ModelInfo?m=0&amp;sm=0&amp;p=2&amp;sp=19&amp;id=62139\">this camera</a> might be ok.</p>"
