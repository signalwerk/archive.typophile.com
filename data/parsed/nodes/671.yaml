    html: "<p>Best TypeCon ever. <br> <br>I know I'm getting in a bit late on this thread but I just wanted to say it was great getting meet all of you. Tamye Riggs and her crew really did a great job.  <br> <br>Stealing Joe's format: <br>The funniest thing at TypeCon:  <br>John Downer's strip tease at the auction. <br> <br>The most frustrating moments:  <br>Not being able to go to all the really great workshops offered. <br> <br>The most unbelievable moments:  <br>Every once in awhile I would step back and realise that Ken Barber of House was teaching me how to draw letters, or that I was having dinner with Akira Kobayashi of Linotype and it was hard to believe. I thank TypeCon/SoTA for bringing together people who may not have otherwise meet. <br> <br>The second worst moment:  <br>Finding out Josh Darden couldn't make it. <br> <br>The worst moment:  <br>Joe--I had the same problem with the business center. I tried to go across the skyway and poach a computer at the Marriot, but theirs were heavily guarded. <br> <br>Biggest regret:  <br>No regrets. <br> <br>The simplest pleasure:  <br>Those beds. <br> <br>Funnest time:  <br>All the planed and unplanned evening events. It's really great to get to talk (in person) to like minded typo folk. <br> <br>I'm already looking forward to the Bay Area. The west coast crew really has their work cut out for them.  <br> <br>Sustain SoTA: Join SoTA as a member now!</p>"
