    html: <p> Nice! <br> <br>The most pressing suggestion I would make is to flip the uc "A" horizontally. The conventional stress for an "A" is with the thin stroke on the left, and the thick stroke on the right. <br> <br>I would also reverse the stress of the uc "N", making the vertical stems thin and the diagonal thick. (That may help the uc "M" look more natural in this setting, too.) <br> <br>David </p>
