    <p>When I was in college, I remember using a shop in Atlanta that would take Illustrator files and, for around twelve bucks, would make a perfect 9x12" letterpress printing block of your design.</p>
    <p>Does anyone know of a similar service that might still be around anywhere?</p>
    <p>Thanks.</p>
