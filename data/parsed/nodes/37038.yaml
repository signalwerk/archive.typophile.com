    html: <p>Photopolymer plates are pretty standard for commercial letterpress. Here in Portland, it's the standard technique for things like wedding invitations. Like any kind of printing, I think good results often depends upon developing a relationship with the service provider. For example, if you're careful, you can fit several jobs onto one plate and then separate them for printing.</p>
