    <p>Hi,</p>
    <p>I'm a big fan of Emigre's Vendetta, its ciselled look and calligraphic/venitian touch. I'm working on a project where I might get to used it and I would like to get a nice compagnon/s for it to be used for display, graphics, but eventually also captions and short text... maybe a geometric sans to contrast Vendetta but I'm very open</p>
    <p>I came across two examples that i thought were interesting (slabs in this case) but once I've put them next to each other it didn't really drive me crazy. Moreover I haven't found available fonts close to them. I'm attaching previews if you don't feel like navigating away:</p>
    <p>1) Mark Bally's Oberland <a href="http://www.marcbally.ch/oberland-slab-light/" title="http://www.marcbally.ch/oberland-slab-light/">http://www.marcbally.ch/oberland-slab-light/</a><br>
    2) and an exercise i found here http://friendsoftype.com/2010/12/yachts/</p><div class="imageWrap"><img src="http://typophile.com/files/ce2412fa3e6435775a36e347cbe14dff_6532.jpeg"></div><p></p>
    <p>Aside from Vendetta matching issues,  I would be happy to know about available fonts similar to Oberland Slab and On the Rag</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ce2412fa3e6435775a36e347cbe14dff_3877.jpeg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/on-the-reg-1250x1250_3961.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Combination_5122.jpg"></div><p></p>
    <p>Thanks for the help!</p>
