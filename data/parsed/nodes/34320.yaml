    <p>Just a friendly reminder that we are looking for YOUR amazing typographic films to showcase at the 4th annual Typophile Film Fest, premiering this year in Seattle during TypeCon.</p>
    <p>All the detailed information for submissions is located here: <a href="http://www.typophile.com/filmfest4" title="http://www.typophile.com/filmfest4">http://www.typophile.com/filmfest4</a></p>
    <p>The deadline is approaching fast — Tell your friends! Write about it on your blog! Program a reminder into your mobile device!</p>
