    html: |-
      <p>Fortunately it is inadmissible (in the majority of cases) to conclude from a character trait in togetherness to the quality of the creative work of a person. Unfortunately most people don’t know that. Fortunately most people here seem to know that. Unfortunately potential customers don’t necessarily know that.</p>
      <p>The friendliness of a typeface <em>for body copy</em> is in its readability. And a certain neutrality is one of the requirements for the readability. A typeface for body copy tendentially is friendly, if it <em>is</em> neutral, but not cold. But if it <em>looks</em> neutral or friendly or whatever, it already may drag attention to itself. So a typeface is a counterpart (face). It is neutral, if the reader is able to receive the content of the text. If you compare a typeface with the face of a beautiful woman and if faces primary had the function, just to communicate thoughts, than the face of the woman can be dysfunctional. But letters are not extensively in contradiction to the faces of living beings. The human skin is not white space. So the spaces in and between letters ease the look through them into the content that the text transports with the help of the letters.</p>
    html_clean: |-
      <p>Fortunately it is inadmissible (in the majority of cases) to conclude from a character trait in togetherness to the quality of the creative work of a person. Unfortunately most people don’t know that. Fortunately most people here seem to know that. Unfortunately potential customers don’t necessarily know that.</p>
