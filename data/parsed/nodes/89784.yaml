    <p>I took the liberty of making one massive collage of most of the titles shown with the font I'm looking to figure out.</p>
    <p><a href="http://i48.photobucket.com/albums/f219/Jinjo402/SSXFont.jpg" title="http://i48.photobucket.com/albums/f219/Jinjo402/SSXFont.jpg">http://i48.photobucket.com/albums/f219/Jinjo402/SSXFont.jpg</a><br>
    <a href="http://i48.photobucket.com/albums/f219/Jinjo402/Untitled-5.jpg" title="http://i48.photobucket.com/albums/f219/Jinjo402/Untitled-5.jpg">http://i48.photobucket.com/albums/f219/Jinjo402/Untitled-5.jpg</a></p>
    <p>I assume the "Online Features, Part 1, Part 2" are the best representations cause they aren't skewed in perspective.</p>
    <p>I also believe the "Uber Mondays" in the second image link is the same font in lowercase. (that font is from this video: <a href="http://www.youtube.com/watch?v=3JyNWlGbsoo" title="http://www.youtube.com/watch?v=3JyNWlGbsoo">http://www.youtube.com/watch?v=3JyNWlGbsoo</a> )</p>
    <p>I'm gonna fool around with other font identifying sites in the meantime, but I thought I'd post this here to help out.</p>
    <p>Hopefully my images help out.  Going down one by one in Photoshop's default list didn't. :P</p>
