    user_name: Ray Larabie
    user_path: null
    user_image: /files/pictures/picture-14133.jpg
    date_raw: 27 Aug 2007 — 10:25am
    date: 2007-08-27T10:25:00
    votes: null
    html: "<p>Fontsugar and Larabie Fonts have Google ads but they don't even cover the bandwidth. Fontlover is Jess Latham's site. The Larabie Fonts site is mainly about directing people to Typodermic and introducing people to MyFonts. Even though they're free fonts, it's all about gettign people to use the MyFonts shopping cart. Let's say someone who has never considered buying fonts before is looking for some freebies for a project. If they end up at Larabie fonts, tossing freebies in the shopping cart, they may end up getting hooked on a pay font that's too good to pass up. The perfect font for their project. So, the freebie customer is now a first time font buyer. Perhaps they'll discover the advantages of pay fonts (no weird license restrictions, better quality and support). A lot of freeware sites I've seen attempt to trick people into visiting pay sites. I didn't want to do that so I put all free fonts on MyFonts. That way customers get version updates too and I can sell OpenType/PS versions. Font Sugar is even more straightforward: here are free fonts, here are pay fonts.</p>"
