    <p>Hello everyone!</p>
    <p>First post here at this forum filled with talent! Since this is the "release" forum, please list some of your portfolios, or fonts you've made. I only ask this because I'm launching a new site called Fawnt.com and I want to find the BEST fonts. I've been searching the web for days looking for the best fonts for designers, developers, and people that like pretty fonts. The site doesn't have a ton of fonts right now because I only added a few dozen. I've collected a lot of fonts, but I'm looking for more!</p>
    <p>I'm only looking for free fonts really, and if yours gets on the site, it will be nothing but a ton of exposure!</p>
    <p>Feel free to post fonts you've made, and any thoughts!</p>
    <p>P.S. The site hasn't officially launched yet :P</p>
