    date: 2007-08-26T17:02:00
    votes: null
    html: |-
      <p>When many free fonts are released, the license agreement allows for distribution on free font web sites. So you're not doing anything wrong if you abide by the rules. When I made my freeware fonts, I did so with full knowledge that they would be used for commercial purposes and would be distributed on free font websites. I don't know why anyone would have a problem with that. Free fonts are released. Free font sites are a legitimate method of distribution. It's nice when font site owners give back to the designers. In over a decade at this, Jason Nolan at 1001freefonts.com is the only free font website owner who actually gives something back. Payment for distribution on a free font site is not required for any free fonts as far as I know.</p>
      <p>Here's a freeware site with a similar aim which I made a couple of months ago.<br>
      <a href="http://www.fontsugar.com/" title="http://www.fontsugar.com/">http://www.fontsugar.com/</a></p>
      <p>Researching the origins of free fonts and sending a few hundred email for fonts which require permission is the hardest part. I had some help and it took a solid month to put together. Most freeware font designers are hard/impossible to track down. There are very few actual free fonts, most are shareware or have complex licensing restrictions.</p>
      <p>Feel free to use any freeware fonts from Larabie Fonts. If you get rich, send me a free t-shirt. If you download them using the shopping cart feature on MyFonts, you'll be informed of updates . . . so you can keep the versions on your site fresh. I hate getting tech support email about buggy versions of fonts I made in 1996.</p>
      <p>There are a few free fonts on Typodermic.com - you can use those as well.</p>
