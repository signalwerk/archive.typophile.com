      <p>Hi, </p>
      <p>Please don't burn your poster- if that was exactly what your lecturer asked you to do, or his/her response just made you wanted to do that. (ask him to go and burn himself in hell instead if he said so... :P )</p>
      <p>Here are some quick comments and suggestions- hope they are helpful to you:</p>
      <p>The entire poster does communicate the message pretty clear. You may want to work on the "crafting" to improve the aesthetic.</p>
      <p>Your attempt of using hand drawn letters is a good solution to such a topic- you may like to try "hand-cut" instead. In that way you can achieve the effect of "natural" and the font would appear to be more confident and less "wobbly". (again, hand cut can be wobbly too- so it depends on your skill of creating a font ). </p>
      <p>Please work on the structural/ anatomical design of the display type:</p>
      <p>Example- the upper part of "R" in "RUIMTE" seems to be longer and bigger than the lower part. A healthy "R" has the upper part slightly shorter than the lower part so that the "head" doesn't appear to be heavy. The "M" also seems to be too big/ wide... On the forth line of the headline, the "N" of "Natherland" is too big comparing to the rest of the letters and the rest seem to get "squeezed" towards the end...</p>
      <p>Green is the right colour to used for the topic of environmental (some might considered it too "safe"- but better save than wrong.) The gradient effect also adds flavour to the green- better than flat background of green. So, that's good move...</p>
      <p>Please work on the details, especially with your typography:</p>
      <p>1. Apply some basic typographic rules on your text, such as reducing the diversity of fonts- keep to one or two fonts, preferably from the same family. That would bring some "quietness" to balance of the already busy looking design.</p>
      <p>2. Perfecting your spacing. (remember, great graphic designer always pay attention to details and is prefectionist in this area )</p>
      <p>3. Introducing "grid" to organize your text.</p>
      <p>4. Intensify the angles and increse the contrast of each headlines "zigzaging" into each others, to create a greater sense of visual dynamic and playfulness. </p>
      <p>Right now the zigzag effect is "neither here nor there"- which make the headlines less confident and wobbly... </p>
      <p>The second line of "RUIMTELIJKE" seems to suffer from "optical illusion" caused by the top and bottom lines, which made it appears not to be horizontally straight. Either give some space in between the lines or you might as well make the second line slant more obviously.</p>
      <p>(please view my attachments for a visual suggestions).</p>
      <p>These are basic design fundamentals- your school should have taught you these. Start applying them. School is a good, safty ground for learning (and failing) Your client/ boss in future is not always that forgiving.</p>
      <p>Welcome to the real world and happy designing...</p>
      <p>(BTW- despite of being a practioner, I am also a lecturer...)</p>
      <p>weng</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample1_5864.jpg"></div><p></p>
