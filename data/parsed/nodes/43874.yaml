    html: |-
      <p>Thank you for your reply, Nick. No, I don’t think it’s harsh, what I needed was an honest opinion and this is what I got. </p>
      <p>I’ve now used Helvetica at 12 pt for the tagline. Because the <em>first-choice</em> font in the blog is Helvetica, this will create a more cohesive page. I see now that it was a terrible mistake to use so many different fonts and the header now looks stronger on the page. </p>
      <p>The identity I want my blog to express is that of one (a person) who doesn’t want to be seen to ’blow his own trumpet’ (’Bashful’ in the ’Seven Dwarfs’). Hence the quasi derogatory title ’tepid air’ and tagline.</p>
      <p><em>As a rank amateur</em>, I feel the fonts ’Typesource Extol’ and ’Amerika Sans’ express this concept well and, hopefully, wittily.</p>
      <p>I’d appreciate further thoughts on how well, if at all, this logotype now works. This is a link to the blog, <a class="freelinking-external" href="http://tepidair.blogspot.com/">http://tepidair.blogspot.com/</a></p>
      <p>While doing this ’design project’ myself, I’m not trying to do it ’on the cheap’ and I have no objection to buying fonts. If specific fonts are suggested, I certainly will consider using them.</p>
