      <p>This will be harsh: this is a terrible mixture of three fonts.  I count logotype and tagline; you have one too many fonts.  Also, I don’t have anything against free fonts (I used Coolvetica by Ray Larabie recently with a satisfactory result), but I’m getting the impression that you found three free fonts that you thought were cool and then gave them a role in your blog’s header.</p>
      <p>Find a font that strongly expresses the content of your blog and then design a logotype using that.  If you have to pay for a font, then bite the bullet and shell out the cash.  This is your brand you’re developing here.  Actually, if you’re investing the money, you may consider hiring a professional...</p>
      <p>—-<br>
      Nick Hladek</p>
