    <p>This image is for my personal blog’s header.</p>
    <p>The left font is ’Typesource Extol’ and the right is ’Amerika Sans’ (both 36 pt). The tagline script is ’Angelina’ (20 pt).</p>
    <p>I did several alternatives, all differing only with the tagline text and script font. I have tried to keep the logo simple and uncluttered but the outline ’Typesource Extol’  may have destroyed this. </p>
    <p>Any thoughts on the mixture of the three fonts will be appreciated very much.</p>
    <p><a class="freelinking-external" href="http://i126.photobucket.com/albums/p116/readred_2007/tepidair.gif">http://i126.photobucket.com/albums/p116/readred_2007/tepidair.gif</a></p>
