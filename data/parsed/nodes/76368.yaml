    html: <p>Looks like one of those jobs where an ad agency takes on the task of custom typeface design themselves without seeking a professional. It usually starts with modifying a font (in this case, Trebuchet) because that's the easiest route for someone without the skill required to make something truly new. If you want a proper font in this genre, check out <a href="http://www.fontshop.com/fontlist/families/ff_strada/?affid=99346" rel="nofollow">FF Strada</a> or <a href="http://www.fontshop.com/fontlist/families/foco/?affid=99346" rel="nofollow">Foco</a>.</p>
