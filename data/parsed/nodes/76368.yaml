  html: |-
    <p>Union Bank re-branded last year with a new logo. In addition, they seem to have introduced a new typeface that they use in their billboard text, but I haven't found anyone remarking upon it.</p>
    <p>After a close encounter with it on a bus ad I've become quite fascinated with it.</p>
    <p>Identifont and WhatTheFont were no help. It seems to be somewhere between Trebuchet and FF Info Display.</p>
    <p>Attached is a cut down version of the text from a billboard. I haven't been able to find any more photos of their advertising using this typeface online. I'll try and take a photo of the bus or other advertising if I chance upon it again.</p>
    <p>Any help is appreciated! Thanks!</p>
