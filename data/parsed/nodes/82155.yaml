      <p>My view as a multi-script designer (if not an expert in either Greek or Cyrillic) is that as a rule one should try to make so-called "cognate" characters somehow different, irrespective of whether there's any historic reason for a given glyph to diverge. This is because: information (in this case concerning what language/script one is reading) comes from contrast; and it gives a given script a stronger identity.</p>
      <p>One of my favorite examples is the "Y" in Adobe Sava.</p>
      <p>BTW, Armenian has a similar glyph, the Piwr Փ.</p>
      <p>hhp</p>
