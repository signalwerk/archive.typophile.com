      Go figure.<p></p>
      <p>One thing is clear, though: those glyphs are—most often—different in either shape, or size, or both.  It is customary in Cyrillic type design to let the stem of the Ф project above the cap-line. And yes, in some Cyrillic faces it also drops below the baseline—sometimes quite considerably, like in <a href="http://www.paratype.com/scripts/usamplea.exe?font=Telingater+DisplayTT&amp;bi=0&amp;fg=0&amp;bg=ffffff&amp;cs=0&amp;align=center&amp;th=24&amp;enc=1&amp;re=1&amp;lang=eng&amp;text=%26%231040%3B%26%231041%3B%26%231042%3B%26%231043%3B%26%231044%3B%26%231045%3B%26%231025%3B%26%231046%3B%26%231047%3B%26%231048%3B%26%231049%3B%26%231050%3B%26%231051%3B%26%231052%3B%26%231053%3B%26%231054%3B%26%231055%3B%26%231056%3B%26%231057%3B%26%231058%3B%26%231059%3B%26%231060%3B%26%231061%3B%26%231062%3B%26%231063%3B%26%231064%3B%26%231065%3B%26%231066%3B%26%231067%3B%26%231068%3B%26%231069%3B%26%231070%3B%26%231071%3B" rel="nofollow">Telingater Display</a>.</p>
