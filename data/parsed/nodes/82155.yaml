    <p>Hi everyone,</p>
    <p>I'm making Greek capital Phi Φ and Cyrillic capital Ef Ф.<br>
    While comparing several typefaces, I noticed that many of them include Phi and Ef designed separately.</p>
    <p>Basically it seems that you can extend the stem beyond the baseline and Cap line for the sake of visual adjustment, and you can do it further with Phi (I've seen some inscriptions that have O part  of Φ aligned to the baseline and Cap line).</p>
    <p>But even with those which do not include extended Phi Φ and Ef Ф, they are still designed differently.<br>
    For example, Lucida Grande's Greek Phi is made slightly bolder and wider than Cyrillic Ef.</p>
    <p>If you are aware of this issue, please tell me why they are treated that way (historical or practical reasons behind it), and the problem of using identical outline.</p>
