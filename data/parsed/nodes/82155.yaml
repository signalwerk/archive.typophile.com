      <p>&gt; I ended up making Ef wider than Phi</p>
      <p>Width is actually a very relevant factor here. Some scripts* need looser setting - and naturally this affects the "inside whites", and potentially the black bodies as well. Admittedly there <em>is</em> relevance to uniformity, but really only in display setting (and not even always) and pretty much none in text (except in very broad stylistic terms). Blindly making so-called "cognate" characters the same is just bad design in my book.</p>
      <p>* Like Armenian. And really any two scripts (in fact any<br>
      two <em>languages</em>!) necessarily have different spacing needs.</p>
      <p>hhp</p>
