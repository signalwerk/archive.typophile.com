      <p>Why?<br>
      Because you don't have to make them the same.<br>
      If your design process includes assessing a glyph shape by setting it in text in the Metrics window, then the different scripts might lead you to optimize Ef and Phi differently. I ended up making Ef wider than Phi, in one of my typefaces, because it looked better that way in words.</p>
      <p>Consider capital Lamda and El, for a drastic example of differentiation.<br>
      In Greek, Lambda is always triangular, but in Cyrillic it may be either triangular (in "old style" and certain geometric styles) or rectangular (the "modern" style), depending on the genre of type.</p>
      <p>The Ef with extenders beyond cap boundaries is somewhat mannered, as evidenced by its adoption at the HermesSoft foundry as the pointedly different Bulgarian Cyrillic style.</p>
      <p>As with Latin (think of Q's tail), there is room to maneuver if you are designing an original typeface. There are all sorts of variants of Ef, two-bowl, one-bowl, with and without prominent "extenders". </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Unknown_5600.jpeg"></div><p></p>
