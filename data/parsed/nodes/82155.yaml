      <p>&gt; I'm wondering how Armenian Piwr should be made differently.</p>
      <p>The Piwr is indeed difficult to diverge. I frankly don't know how to make it structurally different without also making it too peculiar (at least in a contemporary context; I could use a strange historical form as a pretext, but I'm not into that sort of thing). However there's always the factor of width, which is almost guaranteed to have different needs between scripts, due to:</p>
      <p>1) The ideal overall letterspacing, which affects not just the sidebearings but the inside whites as well.<br>
      2) The typical/average width that the letters want to be. For example Armenian capitals (in the contemporary context*) are narrower than Latin overall because there are many arches and virtually no diagonals.<br>
      3) In the case of capital letters, the necessity to stand out from its lowercase (assuming the cap height is nicely lower than the ascenders). For example when the lowercase is particularly tall (many Armenian letters span the entire height) its capital needs to be extra wide. For example ֆ vs Ֆ. The փ is also pretty hefty, so I make the Փ wider than I otherwise would.</p>
      <p>* Armenian caps also have the archaic option of diverging greatly in width.<br>
      See: <a href="http://typophile.com/node/66620" title="http://typophile.com/node/66620">http://typophile.com/node/66620</a></p>
      <p>hhp</p>
