    <p>Today, the majority of old <a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a> foundry paraphenailia, including type specimens and books printed in Klingspor faces, as well as many handwritten pieces by <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a> and other designers, are housed in the Klingspor Museum in Offenbach, Germany. Their website is <a href="http://www.klingspor-museum.de">http://www.klingspor-museum.de</a>.</p>
