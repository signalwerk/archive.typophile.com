    <p><strong> <a href="/web/20140901142559/http://typophile.com/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/web/20140901142559/http://typophile.com/wiki/Museums" class="freelinking" rel="nofollow">Museums</a> : Klingspor Museum</strong></p>
    <p>Today, the majority of old <a href="/web/20140901142559/http://typophile.com/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry paraphenailia, including type specimens and books printed in Klingspor faces, as well as many handwritten pieces by <a href="/web/20140901142559/http://typophile.com/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a> and other designers, are housed in the Klingspor Museum in Offenbach, Germany. Their website is <a href="https://web.archive.org/web/20140901142559/http://www.klingspor-museum.de/" title="http://www.klingspor-museum.de">http://www.klingspor-museum.de</a>.</p>
