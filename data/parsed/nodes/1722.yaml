  html: <p>Good day. <br> <br>I have attached my two new fonts, each with a variation. The first is Intimacy, based off of handwriting samples &amp; writing to another slowly &amp; creating a closness between reader &amp; writer. The second is Urgency, based off fast paced daily life &amp; the need to get information across quickly. Please let me know which characters are working &amp; which are not. Thank you. <br> <br>Jessica<img src="http://www.typophile.com/forums/messages/29/18891.jpg" alt=""></p>
