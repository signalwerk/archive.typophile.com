    html: "<p>Hrant, Tiffany: urgency doesn't imply hurried. I think think what Jessica is getting at with 'Urgency' is the need to clearly and carefully letter important information. These designs reminded me of the notes my mother used to leave for me: not in their style, but because Very Important Information was always written very carefully in neatly formed, generously proportioned 'printing', while the stuff around it was in her normal writing.</p>"
  - id: 138666
    user_id: 108
    user_name: Miss Tiffany
    user_path: null
    date_raw: 20 Oct 2003 — 4:03pm
    date: 2003-10-20T16:03:00
    votes: null
    html: <p>For me, "intimacy" seems more urgent, and the "urgency" seems more intimate. Why? Because if you are in a hurry, you probably won't take the time to draw out the details. And I also think that "urgency" should be slanted. Very fun however.</p>
