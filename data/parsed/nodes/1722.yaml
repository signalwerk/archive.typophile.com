    html: <p>I think the Urgency cut is a lacking some intimacy.  :-) <br> <br>For example if the Intimacy cut has a monocular "a", probably the Urgency shouldn't have a binocular one. And generally, quicker writing is <i>more</i> fluid, not less. <br> <br>You might consider just swapping their "slantedness". <br> <br>hhp <br></p>
