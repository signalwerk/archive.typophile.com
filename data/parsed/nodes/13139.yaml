    html: |-
      <p>I agree with both of you on the "incorporated" it was a bit of an afterthought. I hate that you have to put "inc" or "incorporated" due to "piercing the corporate vail." Oh well, we're still pushing through that. </p>
      <p>The "i" divid is on purpose. I agree on the "h" and "l" issue with the height. I didn't notice that to be honest. I was too concerned with maintaining the white space between the paper and rollers.</p>
      <p>I think some of the readability issues you both mentioned may be due to the color treatment. What do you think?</p>
      <p>To be honest everyone else this was shown to didn't have any problem seeing it as "Colorgraphics." This was the first someone said it didn't look like it. Again, maybe color treatment?</p>
      <p>The small "o" is actually was put there to further the formation of the "g."</p>
      <p>I'm going to work with the "l" a bit more and see what develops. I think that may be the basis for some of these issues. I'll also work on the color treatment. I'm not satisfied with it to begin with.</p>
      <p>Thank you so much for your comments.</p>
      <p>Joseph Szala<br>
      Prestidigitator Extraordinaire</p>
