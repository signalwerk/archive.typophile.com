    html: |-
      <p>I can see what you're trying to convey... I echo Will's post, I think that the 'incorporated' is too small and will get lost at small sizes.</p>
      <p>I like your choice of typeface - clean edges and neat - the kind of attributes you expect from a print company!</p>
      <p>I'm not convinced about the 'l' being dropped down - I like the idea of the print rollers and paper, but I feel it's a bit forced; really you should be able to read the wording first and then the reference to the print rollers should hit you separately as you 'get it'. For me it's not working properly either way, not as a word, or as a clever graphic of print rollers.</p>
      <p>I think that part of  why it's not working properly is the small out-of-place 'o' - I didn't read it as a part of the word - I saw it as a symbol, because it's so small in comparison with the rest of the glyphs. To be honest, I see it as either 'coloraphics' or 'colgraphics'</p>
      <p>I'd perservere with the idea, try wrapping the paper 'l' a different way maybe. I'd like to see it work, I think the concept behind it is great.</p>
