      <p>I agree with other commenters the logo looks a bit forced. I don't perceive it as a unity; I think a logo that makes you think it is constructed isn't finished yet.</p>
      <p>Apart from that - the print roller idea isn't quite original. It is like the use of cmyk colors in logo's for printing companies; a bit overused. What would be important for this company's clients? I would guess that print rollers don't tell them anything about what makes this company stand out.</p>
      <p>Keep up the good work.</p>
