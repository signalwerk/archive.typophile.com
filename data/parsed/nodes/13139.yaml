      <p>i see a face in the two o's with the bent 'l' in between. i understand the idea, i just feel the application is a little choppy and too broken up between the circles. it starts to feel very seperated and not as one whole idea. </p>
      <p>the larger circle seems to be lighter weight than the smaller ones...this might be an illusion? maybe try filling the smallest circle as red and turning the 'l' red as well? either that, or bring the small circle closer to the two large circles and even out the space between the two 'o's and the 'l'?</p>
      <p>i'd also try losing the bend of the 'l' at the top and giving it it's height back to match the 'h' in graphics?</p>
      <p>incorporated seems like an afterthought. might be too small. application wise, i think it is. if this is going on a business card small or some sort of letterhead, i think it will just end up as something unreadable. </p>
      <p>is the little divet in the 'i' something you did of is that how the typeface is?</p>
      <p>w|m</p>
