    <p>Saw this while looking at "This Month at Cooper."</p>
    <p><strong>Alphabet: An Exhibition of Hand-Drawn Lettering and Experimental Typography<br>
    Exhibition,</strong><br>
    Thursday, October 11, 6-8 p.m. (Opening reception)<br>
    The Herb Lubalin Center, Houghton Gallery<br>
    7 East 7th Street b/w 3rd and 4th Aves<br>
    Free</p>
    <p>Focusing on an ordinary subject that we see each day, Alphabet presents 26 letters as more than just shapes for conveying information. Hosted by The Herb Lubalin Center of Design and Typography at The Cooper Union (October 11-27), the traveling exhibition features the work of 51 artists and designers and their inventive ways of interpreting the alphabet, ranging from graceful and polished to witty and subversive. The 63 alphabets featured in Alphabet were created by artists in North America, Europe and Asia, representing works from well-known typographers such as Ed Fella and Ken Barber to rising artists such as Sweden's Hjärta Smärta and Andrew Jeffrey Wright of Philadelphia's Space 1026.</p>
    <p>October 11-27, 2007. Weekdays 11 a.m.- 7 p.m., Saturday, 12 p.m.-5 p.m., closed on Sundays.</p>
