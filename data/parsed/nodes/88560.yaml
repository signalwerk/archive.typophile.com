    html: |-
      <p>Time Machine is terribly unreliable. It just stops working with no explanation, requiring users to run through a series of possible fixes until it works again. This is exacerbated by Apple’s continued inability to produce a reliable automatic external disk mounting daemon, something every other UNIX vendor worked out in the 1990s. In worst case scenarios Time Machine stops recognizing the backups that it created, and will not back up anything else to the same disk partition until the old files are gone. </p>
      <p>On top of the reliability issues, Time Machine’s interface is an atrocity; breaking away from anything resembling Mac UI standards for some addled Star Trek themed nonsense, reliant on cheesy 3D effects that have never been optimized to run quickly. </p>
      <p>Every single person responsible for Time Machine should have been run out of Apple and the entire design and codebase should have been strangled in its crib.</p>
