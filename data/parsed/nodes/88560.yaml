    html: "<p>The corrupted file issue I ran into is just a misused autosaving mechanism of OS X Lion: You open a UFO package, the app internally converts it to its native Glyphs document, you then edit the font, the autosave triggers off and saves the Glyphs document over the UFO. If you change the extension of such a corrupted file from .ufo to .glyphs it will read as nothing had really happened. Before this gets fixed, you can restore pre-Lion saving behavior in the app's preferences or just duplicate the opened UFO as a Glyphs file before making any edits to a font.</p>"
