    html: <p>Upgrading probably won’t help, but a fresh install of Mac OS might. I had a lot of problems om Glyphs on my four-year-old laptop until I got a new computer this year. On the new computer Glyphs is very stable and responsive. I suspect that this is because Glyphs relies heavily on Apple’s Cocoa API and Cocoa gets mucked up over years of upgrades.</p>
