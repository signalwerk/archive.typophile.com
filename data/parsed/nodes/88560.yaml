  html: <p>I just bought Glyphs and have just been working with it for the most basic things (no contextual alternates, ligatures, masters, etc.) and have already run into a handful of different error messages and a file turn "corrupted" for whatever reason. And while the developer makes an admirable effort to address everyone's problems, it's just a confusing mess so far. Is anyone else having issues with Glyphs?</p>
