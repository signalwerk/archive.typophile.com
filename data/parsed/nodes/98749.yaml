  html: |-
    <p>Hi all you type experts,</p>
    <p>I am new to this forum and first  time posting.</p>
    <p>I am working on a manual and some advertisements. I would like to use Excelsior for both body text and headline. I need to find Excelsior a good partner to dance with (hopefully one that can do headlines and body text as well) and was wondering if anyone has any suggestions. </p>
    <p>Right now I have Franklin Gothic as its partner. I think the colors complement each other. But Franklin Gothic is narrower in width making it seem a bit condensed when set next to Excelsior.</p>
    <p>Any help is greatly appreciated!!</p>
    <p>newbie</p>
