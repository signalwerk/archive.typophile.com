    <p>One of the candidate ideas for next semester’s project was to develop an online musical notation tool which people could use to write compositions, and get an output. The catch is, I don’t want to part with my font (at least not till I’ve figured out the litigation involved in copyrighting and/or patenting a font (is that even allowed?)).</p>
    <p>Yesterday, I received a shock when it was announced that we have to submit a project THIS semester as well. So, this being the only worthwhile idea in my head, I’ve decided to expedite my grand design.</p>
    <p>As I understand it, font-embedding is possible in Silverlight. While Flex would probably be a better option (since more people have Adobe’s Flash player than Microsoft’s Silverlight plugin, about 50,000 times more people...), I’m faced with two issues:</p>
    <ol>
    <li>I don’t know scratch about Flex. I used to work with Macromedia’s good ol’ Flash, but was never a hard core UI scripter. And</li>
    <li>Silverlight development tools are free (like the VS 2008 Express editions). While I may build stuff on evaluation versions of Flex, I’m not sure whether it would be legal to publish the work on the web.</li>
    </ol>
    <p>There may be other options that I may be unaware of. Although I’m not sure myself, but I suspect that there would probably be a way of using AJAX and doing it, making it truly universal (jerks with no JS browsers do not belong to this universe...)</p>
    <p>So, having been patient enough to hear all of my rambling reasons and quibbles, I now present to you with my problem: the output. Lets assume that I have built an application using whatever technology that allows people to type out musical compositions using my font without having actually downloaded the font file (or at least not that they know of), what can I do to provide them with proper output? Like a printout, say?</p>
    <p>The obvious answer is to somehow generate a PDF dynamically (with the site logo and copyright notice, of course), which has THEIR composition that THEY typed in MY font. Since PDF also supports glyph embedding, they should be able to view it, print it, email it and have a ball with it if that’s what they want. But there may be other ways as well. Maybe I ought to look into the new DeJaView format that’s making the rounds of the net these days.</p>
    <p>I’m not sure how to implement this last part. At the moment, all this is speculation. But I do not <!--
