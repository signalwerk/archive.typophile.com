    <p>Attached is a first stab at a display typeface I'm putting together called Estereo. A few notes:</p>
    <p>1) It's meant to be quirky, hence the odd pairing of mostly heavy strokes with the occasional light ones.</p>
    <p>2) There won't be a lowercase set. Lowercase glyph positions will be reserved for a number of uppercase alternates and ornaments.</p>
    <p>3) I'm looking for critiques in particular with respect to stroke weight across characters; for instance, it's pretty safe to say that the A and the X are not of the same weight and need to be fixed.</p>
    <p>4) I don't think the S is quite finished yet.</p>
    <p>Any additional feedback before I move forward would be excellent. Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/amv_estereo_preview_0_4884.png"></div><p></p>
