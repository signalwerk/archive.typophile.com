    html: |-
      <p>Looks great with the tight spacing in the title.</p>
      <p>The ink trap in the top of the N really stood out in a bad way, then I noticed all the other ink traps.<br>
      I don't think this face would be used in a small enough setting to need such big ones, and stylistically I would say they are not really adding to the face. At least fix the N.</p>
      <p>Maybe square up the W a bit. I say that because doing  would make tight setting easier, which I think is good for this face.<br>
      Though I would have to see the W in use now to really be sure.</p>
