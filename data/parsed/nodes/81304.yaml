    html: |-
      <p><a class="freelinking external" href="http://www.identifont.com/find?font=commercial+script&amp;q=Go" rel="nofollow">Commercial Script</a> is similar but it's not exact.</p>
      <p>Every tattoo is done by hand, and therefore is unique, which is the beauty of tattoos.</p>
      <p>Now for the grumpy pedantic part: The way I understand the meaning of "font," it's a set of letters created for mechanical, optical, or electronic reproduction. The lettering in a tattoo can be a hand-drawn <em>copy</em> of a font, but it won't be a <em>font</em> until they invent a tattoo robot.</p>
