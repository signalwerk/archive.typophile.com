      <p>&gt;How do people keep up with all these, even with RSS feeds I get overburdened.</p>
      <p>I literally devote at least 30-45 min each day to look at sites. It is part of my daily work flow, mostly for trend monitoring, but when I see relevant articles, I will read them. After a while, you can scan sites quite quickly and pass on the stuff that doesn't interest/apply to what you are after.</p>
