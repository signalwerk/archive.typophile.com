    html: |-
      <p>I mainly use Twitter for all of my information gathering and feeds. Many sites now send their updates through it, and many individual designers that I follow also share links to really awesome stuff. I usually take 30 minutes to an hour a day just following links from my Twitter feed.</p>
      <p>But besides that, I usually just check out <a href="http://www.formfiftyfive.com" title="http://www.formfiftyfive.com">http://www.formfiftyfive.com</a> and... that's the only one I regularly check manually. Hm. Twitter has really spoiled me.</p>
      <p>I also highly recommend checking out the Featured Websites on Cargo Collective <a href="http://cargocollective.com/#/featured" title="http://cargocollective.com/#/featured">http://cargocollective.com/#/featured</a> — amazing source of inspiration, all of the featured sites are the portfolios of designers, illustrators, photographers (et cetera) that are updated frequently when they finish new projects. There's also real nice finds like <a href="http://unurth.com/" title="http://unurth.com/">http://unurth.com/</a> and <a href="http://elasticnovice.com/" title="http://elasticnovice.com/">http://elasticnovice.com/</a> in there, which are more or less art blogs.</p>
