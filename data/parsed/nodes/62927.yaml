      <p>I apologize for all the sites, but I just couldn't help myself. It's a serious problem that I'm really trying to come to terms with. I'm currently a product designer but formally trained as a graphic designer.</p>
      <p>Product Design:<br>
      <a class="freelinking external" href="http://www.yankodesign.com" rel="nofollow">http://www.yankodesign.com</a><br>
      <a class="freelinking external" href="http://www.designaddict.com" rel="nofollow">http://www.designaddict.com</a> Check out the links section<br>
      <a class="freelinking external" href="http://www.core77.com" rel="nofollow">http://www.core77.com</a> The forums are where I spend a lot of time<br>
      <a class="freelinking external" href="http://www.idsketching.com" rel="nofollow">http://www.idsketching.com</a><br>
      <a class="freelinking external" href="http://web.mit.edu/2.744/www/resourceMaterials/otherResources.html" rel="nofollow">http://web.mit.edu/2.744/www/resourceMaterials/otherResources.html</a> </p>
      <p>Logos:<br>
      <a class="freelinking external" href="http://www.logolounge.com" rel="nofollow">http://www.logolounge.com</a><br>
      <a class="freelinking external" href="http://www.www.underconsideration.com/brandnew" rel="nofollow">http://www.www.underconsideration.com/brandnew</a><br>
      <a class="freelinking external" href="http://logopond.com" rel="nofollow">http://logopond.com</a></p>
      <p>Packaging Design:<br>
      <a class="freelinking external" href="http://www.thedieline.com" rel="nofollow">http://www.thedieline.com</a><br>
      <a class="freelinking external" href="http://www.lovelypackage.com" rel="nofollow">http://www.lovelypackage.com</a></p>
      <p>General Design Interests:<br>
      <a class="freelinking external" href="http://www.notcot.org" rel="nofollow">http://www.notcot.org</a></p>
      <p>I have 25 illustration sites, too. They range from Michael Schwab, Jon Lund, Jeff Foster, Laura Smith, Mark Simonson, Gerard Huerta, Michael Doret etc. etc. etc. These folks can flat out illustrate. </p>
      <p>Like I said, it is a sickness.</p>
