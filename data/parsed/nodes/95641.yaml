    <p>Hi,</p>
    <p>I am trying to find an similar (as close as possible) web font alternative to Stag Sans. Is there any one who can suggest a good and more common alternative? Your suggestions are very much appreciated.</p>
    <p>Thanks in advance and regards,</p>
    <p>Christoffer</p>
