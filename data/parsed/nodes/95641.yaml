    html: <p>Christoffer, I'm not aware of a similar webfont. Stag Sans has some very unique characteristics. If you remove those, you might arrive at something that resembles a Franklin Gothic or Trade Gothic (maybe). But, I'm not sure you'll find anything very close. I would contact Commercial Type and see if you can license it as a webfont.</p>
