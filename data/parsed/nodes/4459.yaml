    <p>Hi all, <br> <br>There was a previous thread posted on this forum in February (<a href="http://www.typophile.com/forums/messages/83/27380.html?1078774045" target="_blank">http://www.typophile.com/forums/messages/83/27380.html?1078774045</a>) <br> regarding the typefaces used in Kill Bill. <br> <br>What I am particularly interested in is the typeface used for the end credits of the *second* movie. <br> <br>Justin Callaghan identified the type "Busorama" as one used in the film, and indeed it is very similar to the one I am looking for. However, there are distinct differences between Busorama and the actual type used in the film - note for example the serifs at the top of the "A" characters! <br> <br>Can anyone shed some light on this for me? <br> <br>Much appreciated, <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> Adam</p>
