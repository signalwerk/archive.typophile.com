    html: <p>Very nice. I imagine you've submitted now, but it might be good to put the specification numbers (lumens, watts etc.) into lining figures as this is normal on technical specifications for headings. Also, I would reset the shadow effect for "MM" so that the 'shadows' aren't separated from the letters that are supposed to be casting them.</p>
