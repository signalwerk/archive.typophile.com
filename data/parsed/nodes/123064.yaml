    <p>Hey there! I´m in a conflict with the selection of the typeface for a project that I need to do. The project is to design a light bulb pack. We already have the design of the pack me and my colleague. I can attach you some samples that I did but I´m not totally convinced though of the result. The style is a bit minimalistic I could say.<br>
    Feel free to make any suggestions.</p>
    <p>Thanks,Orestis</p>
