    html: |-
      <p>From Bart De Ruycke, again the most complete answer:</p>
      <p><a href="http://www.psyops.com/html/spec_hydrous.html">Hydrous</a> is a typeface created in 2001 by Thai designer <a href="http://www.psyops.com/html/info.html">Anuthin ‘Newt’ Wongsunkakon</a> in collaboration with <a>Rodrigo Cavazos</a> and published by <a href="http://www.psyops.com/html/info.html">PSY/OPS</a>. Wongsunkakon teaches graphic design at Chulalongkorn Bangkok University and is a prolific designer of Thai typefaces. The industrial sans serif’s most striking feature, is the raindrop-like terminal, which re-enforces the typeface’s subtle “hydrous” character.</p>
      <p>Nice going guys! Next challenge coming up.</p>
