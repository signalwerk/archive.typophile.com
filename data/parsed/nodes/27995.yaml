    html: |-
      <p>The more I think about it, the more I think that 1996 makes more sense than 1993.  Georgia was designed for on-screen and web use.  NCSA Mosaic, the first graphical browser that I know of, was released in 1993 and didn’t really begin to catch on until early 1994.  The Netscape browser didn’t exist until late 1994.  </p>
      <p>Perhaps we should verify it and possibly correct the entry in Wikipedia?</p>
