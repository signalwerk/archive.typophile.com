      <p>I would love guides to finding similar information, i.e., pre-digital specimens of high-quality printing, examples of excellent calligraphy and penmanship, not just for Thai but other writing systems. I say this because I just had this thought looking at Xavier Dupré's Khmer typefaces the other day, and wondered if I should just go find well-printed Khmer books in the library and look at them, even though I don't read Khmer.</p>
      <p>I don't imagine I would ever be able to design Khmer letters (I need only to think of all the things non-natives would get wrong trying to design letters in the Korean alphabet), and would be sceptical about the attempts of non-natives, but your averaging trick sounds promising. If one is to design a successful typeface in a writing system one doesn't read natively, your approach is the way to go about it, I think: fresh and well-thought-out revivals of pre-digital quality type.</p>
      <p>Some sort of convenient repository of "quality type and lettering samples" for different writing systems would be nice. Maybe a job for the TypoWiki?</p>
