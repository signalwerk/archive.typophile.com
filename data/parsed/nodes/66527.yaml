    <p>I'm getting interested in Thai fonts now, and would like to look at some specimen books. I've already found แบบตัวพิมพ์ไทย (Thai Fonts) in digital form (<a href="http://ftp.opentle.org/pub/national-fonts/FONTBOOK.PDF" rel="nofollow">PDF</a>) and am wondering if there's any place I can get it in paper form before printing it out myself. I'm also aware of <a href="http://linux.thai.net/~thep/" rel="nofollow">Theppitak Karoonboonyanan</a>'s work maintaining the NECTEC fonts for Linux.</p>
    <p>But what I'm <em>really</em> interested in is older, pre-digital specimens of high-quality Thai printing.</p>
    <p>I have one gem already in my collection, <a href="http://books.google.com/books?id=KoZB2IN96ccC" rel="nofollow">Débuts de l'imprimerie en France: L'Imprimerie nationale. L'Hôtel de Rohan</a> (see p. 160 for the "Siamois"). I have some other lower quality samples, like a book on printing "Foreign Languages" from the US Government Printing Office, but what I'm looking for is the good stuff, quality metal from the pre-digital era. Specimen books or just well-printed books are all welcome -- I want to do my <a href="http://typophile.com/node/31349" rel="nofollow">averaging trick</a> on the smaller sizes of text, and I am in particular interested in optical sizes for Thai, as I think those small loops and curlicues could be more robust in smaller sizes and smaller and more refined in larger.</p>
    <p>Examples of excellent calligraphy and penmanship are also most welcome.</p>
    <p>Any help would be greatly appreciated!</p>
