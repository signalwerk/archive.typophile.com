      <p>Ignore if not relevant ;)</p>
      <p>Not predigital but check out <a class="freelinking external" href="http://www.behaviourgroup.com/CadsonDemak/Cadson_Demak.html" rel="nofollow">Behaviour Group</a> based in Sukhumvit, Bkk or <a class="freelinking external" href="http://www.anuthin.com/" rel="nofollow">Anuthin Wongsunkakon</a>'s work. These are possibly far too modern for your needs but interesting to me. There used to be a pdf booklet of all their designs but I'm getting a 404 for that now.</p>
      <p>For a really interesting general background on Thai letter styles see <a class="freelinking external" href="http://sealang.net/sala/archives/pdf4/cooper1996how.pdf" rel="nofollow">How Do Thais Tell Letters Apart</a> by Doug Cooper at the Center for Research in Computational Linguistics at Chula University in Bkk.</p>
