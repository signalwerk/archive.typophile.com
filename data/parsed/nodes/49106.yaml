    <p>I once read a quote that went something like this:</p>
    <p><strong>Good design is the balance between monotony and overindulgence.</strong></p>
    <p>I don’t know who said it, but I love the simplicity of it. It really gets to the heart of where design starts and ends. </p>
    <p>Following in the foot steps from this thread (<a href="http://typophile.com/node/13406" title="http://typophile.com/node/13406">http://typophile.com/node/13406</a>) are there any design specific quotes that are inspiring, you’d like to share?</p>
