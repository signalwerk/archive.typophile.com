      <p><cite>'You should place languagesystem statements before any feature definition' never appeared before I updated to 5.1 and from Leopard to Snow Leopard. </cite></p>
      <p>This has to do with the fact that FLS 5.1 uses a more recent version of FDK than previous versions did. Snow Leopard isn't relevant here. However, this particular warning shouldn't prevent a font from being generated, so I'd focus your debugging efforts elsewhere.</p>
      <p>André</p>
