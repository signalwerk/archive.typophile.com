    html: |-
      <p>The only useful clue in these kinds of messages is the line number following the path to <code>fontlab.fea</code>. Exporting the features and looking at that line in a text editor can sometimes help debugging, but in this case it seems to be in reference to the missing languagesystem warning rather than the fatal error. (Adding the statement <code>languagesystem latn dflt;</code> at the top of the global code area in the OpenType panel will placate the new compiler.)</p>
      <p>See <a class="freelinking external" href="http://www.google.com/search?q=Please%2C+check+OpenType+features+definition+for+errors" rel="nofollow">previous threads</a> for more debugging ideas.</p>
