    <p>I'm generating an otf. I do the usual; update kerning  and compile. Everything is OK. When I come to generate I specify the folder then save. The progress bar goes all the way, yet the folder is empty. I do a search and it doesn't exist.</p>
    <p>Does anybody have any ideas?</p>
    <p>Thanks.</p>
