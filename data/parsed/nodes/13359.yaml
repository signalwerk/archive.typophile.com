    html: |-
      <p>In font lab you have 3 types of points. I don't know the terminology. What I do know is this. Select an outline, right-click on the outline, in the context menu there is a section with two entries "convert" and "connection" the sub-menu for convert has 3 options:<br>
      <code>Convert&nbsp;-&gt;&nbsp;To&nbsp;Curves<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;To&nbsp;Lines<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;To&nbsp;Off-Curve&nbsp;Points</code><br>
      Thing is, it appears you can only access these options on a per-glyph basis. That's what I mean.</p>
