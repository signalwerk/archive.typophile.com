  html: |-
    <p>Hi, I'm re-designing a print job (monthly mag) with a large trim size and I'm looking for some good ultra-lite serif faces to use at very large display sizes without looking like medieval cudgels. Would like it to (more or less) to not look too different from Adobe Arno, which is what the body text will be. . . clean and reserved.<br>
    Would appreciate some suggestions. Sorry to be so lazy, but very busy presently. Thanks in advace.<br>
    Velo</p>
