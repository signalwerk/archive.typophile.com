    html: |-
      <p>Forgot to mention ...</p>
      <p>I do think the "Triumph" and "TR5 PI" bits are <em>meant to be</em> the same typeface. They're just smooshed/stretched a bit to fit their respective spaces, I think. Or it was distortion created in production. "Overdrive" is certainly different, though.</p>
