      <p>On a quick search, I found another image of the same badge that's more direct (though with annoying reflections):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1968_triumph_tr5_pi_cabriolet_08_m.jpg"></div><p></p>
      <p>(From <a href="http://www.allsportauto.com/photoautre4/triumph/tr5/1968_triumph_tr5_pi_cabriolet_08_m.jpg" rel="nofollow">www.allsportsauto.com</a>)</p>
      <p>Seeing this, I'm certain "Overdrive" is Bank Gothic. The 'E' actually does have the shorter stroke in the middle. </p>
      <p>I'm pretty confident on Eurostile for the rest, also.</p>
