      <p>I disagree with the change of direction, to me the poem does not call for a scary feel, you have given it a look which will cause the reader to prejudge the poem. I much preferred the innocent look of the first pdf, although the division into a dialogue isn't entirely working so I would drop the names from the top, the use of tracking doesn't work for me maybe it is just too emphasised and I suspect the Garamond, Baskerville contrast isn't enough for the casual reader to identify. You could experiment with the blackletter idea, but it would be more of a challenge and I suspect ultimately more effective to restrict your typefaces and work with alignment and colour.<br>
      Tim</p>
