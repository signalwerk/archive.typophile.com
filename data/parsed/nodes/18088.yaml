    <p>Hi all,</p>
    <p>I'm new at this forum and couldn't find any forum rules about uploads, so I just uploaded a 4 page pdf, hope that's ok.</p>
    <p>I'm doing an assignment for my typo class where I choose to make a book with the poem of Tim Burton called "Vincent".</p>
    <p>Now I'm just trying out some colours and trying to find ways of positioning the type but I'm getting a bit stuck at the moment and could do with some feedback just to see if I'm going in the right direction or that perhaps it's pretty crappy what I'm working on.</p>
    <p>I decided the book to be A5 landscape (small easy to carry around and because it's a very entertaining poem I'd like it to be small to have my friends read it).</p>
    <p>Anything is possible really and I think that what I made so far is a bit too boring for a typography assignment.</p>
    <p>Don't really know what more to say, so here it is.</p>
