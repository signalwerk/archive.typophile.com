      <p>Sorry I can't help you with your font problem, I use neither InDesign or FontAgent, try posting in the Build forum or searching there to see if anybody has had similar problems.</p>
      <p>You are right, it is a challenge to format poetry, however since you have the lines defined for you (in that you use the lines as written) you can print them out, cut them into strips and position them on a blank sheet till you come up with something that works (easier than trying to do it on computer since hard/software tends to inhibit the quick changes). The size and format of the book are all part of the challenge, unless you come up with an insurmountable problem it is probably best to work with in your established format, since that is what you will have to do in professional life. I think as regards colours you should probably avoid anything that makes you think obvious.<br>
      Best of luck.</p>
      <p>Tim</p>
