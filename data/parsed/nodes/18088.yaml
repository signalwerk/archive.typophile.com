      <p>You have made an interesting start, though I do have some small suggestions that I feel will help.</p>
      <p>Unity is often of the utmost importance for a successful composition.<br>
      - Consider this with your choice of typeface; presently you have used four very different face's which do not correlate well at present.<br>
      - Think about your grid; it feels slightly loose and un-unified.</p>
      <p>You would do well to introduce some more hierarchy; consider amplification, elaboration and proximity.</p>
      <p>Are your pages facing? Has this been considered?</p>
