      <p>I would agree with Chris, the colour system and border detail is probably too rigid in this circumstance to fairly depict the "scary" poetic detail.</p>
      <p>Your idea of separating the two voices by use of grid is an option worth exploring further - currently as I mentioned I do not feel that it works particularly well. Have you explored using one page for one voice and the other for the second? For example Price is always on the left page while Malloy the right?</p>
      <p>Another option for separating the two voices may be careful selection of typeface - a specific face for a specific voice - though remembering to restrict your palate of faces to ones that work well together for a specific reason.</p>
      <p>Keep exploring and experimenting. You have a "fun" poem to work with so let this show through in your exploration of its meaning.</p>
      <p>-nic</p>
