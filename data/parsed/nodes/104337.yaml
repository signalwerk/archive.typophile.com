      <p>You're welcome. It seems to me that the lettering for Untergang may have been intended to have an effect that was monumental &amp; architectural to suggest the importance of the subject and Spengler's very structured approach to it -- thus the use of Trajan as an inspiration, in a very similar way that important buildings were graced with neo-Trajanesque inscriptions -- plus a contemporary feel that suggested a measured and scientific approach to the subject. Best wishes for your redesign. Shango with a touch of Ehmke &amp; Weiss should do the trick.<br>
      Don</p>
