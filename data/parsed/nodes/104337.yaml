      <p>F.H. Ehmcke's Ehmcke Antiqua of 1909 helps give some idea of how an Untergang full font might work. A copycat by Stephenson Blake was digitized by Letraset as <a href="http://www.myfonts.com/fonts/linotype/carlton/" rel="nofollow">Carlton</a>.<br>
      Don</p>
