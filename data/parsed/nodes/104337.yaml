      <p>Here is another font that gives some further ideas on how an Untergang full font might work. It was designed few years later by F.H.E. Schneidler and released in 1936 with the name "Schneidler-Mediaeval mit Initialen." It is usually called Schneidler Initials.  I recommend the version by Castle Type, released as  <a href="http://www.myfonts.com/fonts/castletype/shango/" rel="nofollow">Shàngó</a>. Good selection of alternates. The monoline version <a href="http://www.myfonts.com/fonts/castletype/shango-gothic/" rel="nofollow">Shàngó Gothic</a> is also useful.<br>
      Don</p>
