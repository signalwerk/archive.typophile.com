    <p>Hello, typophiles,</p>
    <p>Can anyone help me find the closest match to this sample from 1922 (book cover for Oswald Spengler's Decline of the West - looks like gold leaf or perhaps embroidery?)</p>
    <p>It is a Trajan-style, however Trajan itself doesn't match the serifs, which are almost half-serifs. Once I have a typeface that's pretty darned close, I can make modifications like the swashes etc.</p>
    <p>Thanks for any assistance you can provide!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/200px-Decline_of_the_West_1922_5722.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/02082013-DSCF0758_5366.JPG"></div><p></p>
