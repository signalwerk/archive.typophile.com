      <p>Great book full of deep and somber thoughts.<br>
      The cover is an excellent example of German Antiqua lettering with micro serifs in early 20th century style. I clipped and pasted some of the letters that are repeated. Note the subtle differences in proportions [ignore the clipped swash tail on the last R]:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/UntergangCompareLetters_6582.jpg"></div><br>
      I looked at German fonts from the era but have not yet found one that is particularly close. You might have to do a pastiche of several fonts.<br>
      Don<p></p>
