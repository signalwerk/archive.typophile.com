      <p>Tiff: I finally figured why I did not have these fonts... I have the first version of iWork. the new version- '06- has more stuff. </p>
      <p>But this little collection isn't all that bad.<br>
      When I get my pizza place up and running I'll use Jenson Old Style or maybe if I'm feelin' really 'classy' I use Algerian.</p>
      <p>The monospaced avant guard and souvenir is scandalous!</p>
      <p>Ok for reals though... as mentioned Bodoni 72 Small Caps by sumner stone is great, Type Embellishments 1 is something we all should have in our libraries, Portago is very good, Academy is a fine classic, Braganza is nifty, and Mona Lisa now has old style figures- (it deserves some respect for having osf numerals right?</p>
      <p>Next on my list is extract the font in my ipod- oh wait- I don't have one.</p>
      <p>Mikey</p>
