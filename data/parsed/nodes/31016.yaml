      <p>James, see <a href="http://docs.info.apple.com/article.html?artnum=301332" rel="nofollow">this thread</a> over on Apple.com -- specifically you can manage the fonts. I use combination color-coding and Fontbook. My main font management tool is Font Explorer, but I don't activate or de-activate fonts system fonts with it. I'll quit Font Explorer, open Fontbook disable the system fonts I need disabled, re-open FontBook and voilá, Font Explorer see it. </p>
