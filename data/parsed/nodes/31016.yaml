    html: |-
      <p>I popped in my Mac OSX install cd and ran a program called Pacifist on it, and I was surprised by the results. Almost all of these typefaces are on it! Notable exceptions being the Braganza and Portago faces. I think there are even some extras not mentioned before. Some of them are hidden in the various installers on there, and of course there are the X11 fonts on there as well.</p>
      <p>Pacifist is donationware, so if you're interested, just pop your install disk in. Then after about 5 minutes and a few disk exchanges, you can search through every single file that you can install. Even hidden ones!<br>
      I typed in a few searches such as .ttf, .dfont, and MM and it worked pretty well.</p>
