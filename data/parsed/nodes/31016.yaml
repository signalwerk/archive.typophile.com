    html: |-
      <p>Good to see these are getting distributed. I wrote the Wikipedia page that Dan Gayle refers to: <a href="http://en.wikipedia.org/wiki/List_of_fonts_in_Mac_OS_X" title="http://en.wikipedia.org/wiki/List_of_fonts_in_Mac_OS_X">http://en.wikipedia.org/wiki/List_of_fonts_in_Mac_OS_X</a> which also mentions hidden fonts such as Apple Garamond and the ones at /Applications/iDVD.app/Contents/Resources/Fonts/</p>
      <p>My main aim in doing this is to get as large a variety of fonts installed on end user's systems so that they can be used on websites. Braganza Small Caps looks wonderful for headings in the right setting, we just need it to be installed on a significant enough percentage of systems.</p>
