    <p>Hi, I'm looking for great fonts for a health, organic foods and juicing blog. Could you recommend some great fonts to use for organic food type that has the organic handmade look to it?</p>
    <p>We will be doing different organic raw food recipes and juicing recipes and will be using different fonts to design on food photos. Some fonts I like to give direction are:</p>
    <p>Populaire<br>
    Bamboo Brisk Regular<br>
    Barmbrack<br>
    Hand-Slab Regular<br>
    Cafe Mimi<br>
    Cocktail Script<br>
    Lady Rene<br>
    Mishka<br>
    Petit Oiseau<br>
    Susa<br>
    Berimbau<br>
    Amarelinha<br>
    Happy Cloud<br>
    Rooney Pro<br>
    Love Potion<br>
    Grandma<br>
    Dulce<br>
    Blooming<br>
    Mija</p>
    <p>I'm open to any suggestions and I appreciate everyone's support.</p>
    <p>Thanks kindly,</p>
    <p>Chris</p>
