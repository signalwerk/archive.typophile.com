    <p>Oops, I posted this on the solved ID board by accident.</p>
    <p>I'm wondering if anyone knows with a quick glance what typeface(s) they are using on <a href="http://www.weylandindustries.com/investor" title="http://www.weylandindustries.com/investor">http://www.weylandindustries.com/investor</a>. Knowing you guys, I'm sure you do :)</p>
    <p>It looks like they're using some Gotham-like type, some Helvetica and some other typeface all on the same page. But I can't seem to find an exact match for example to the big '95 89 93' numbers and some of the others.</p>
    <p>Thanks in advance,<br>
    - someone who used to be on typophile all the time but hasn't been on here for quite some time.</p>
