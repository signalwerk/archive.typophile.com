    html: |-
      <p>I prefer the Minion choice, but a few points:<br>
      Your indent seems excessive especially when you have a line space I think you could bring it back to an em (the height of your leading).<br>
      I would try to make the body copy sit on a baseline grid, so that when you break it with a picture or pull quote the two columns still align because you have a narrow gutter it is more noticeable.<br>
      The pull quotes should probably be ranged left and ragged right with as few hyphens (if any) as you can get away with and should either really intrude into a column or not at all (your Minion pdf is really too small an intrusion) the space at top at bottom should ideally appear the same, try to keep at least three lines together when breaking a paragraph with either a column break or pull quote – you need to be flexible with your grid.<br>
      Depending on the number of pages you could steal some space from the centre of your grid to add to the outside margins.<br>
      Where you mention creep (the loss of up to a quarter of your margin during trimming) you should also note this will affect any sidebar section markers, although you could apply them to the top or bottom of the page.<br>
      Hope some of this helps.<br>
      Tim</p>
