      <p>Hi, Susana,</p>
      <p>I agree with some of the comments already posted here. I think that you are off to a good start by having used a grid to organize the page layout, but maybe it could use some adjusting.</p>
      <p>As <strong>juki</strong> says, at 1/8 of an inch your gutter is too narrow to keep the columns separated visually. The gutter should be at least 1 pica wide (12 points, or 0.166 inches), just to be on the safe side.</p>
      <p>If you modify the gutter width, you may also want to consider modifying the amount of columns within the page grid. May I suggest having an uneven number of columns rather than an even number? This might give you more flexibility to play around with different column widths (for example, you could have two wide columns for the main text and a thinner column reserved for photo captions, but otherwise kept blank -- this would give your pages some much-needed white space, as well).</p>
      <p>Last but not least, using a grid does not mean that you have to fill up every last space with text... Things might start to look "boxy." Try using a left-only justification (i.e., ragged right), as <strong>timd</strong> suggests, even for the main body copy, and compare that with the current justified spread.</p>
      <p>Hope this is helpful!</p>
