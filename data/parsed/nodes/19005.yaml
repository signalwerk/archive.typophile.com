      <p>A couple of initial thoughts for you. Your grid is going to be quite flexible for you and work to your advantage in allowing for creative and interesting compositions, however I do think this could be adjusted slightly. </p>
      <p>I think you could allow for slightly more room in the outside margins – don’t forget we have thumbs and a generous space for mine is always appreciated. </p>
      <p>Does the grid allow for or require space for page markers and general navigation indicators? For example have you developed a system for section marking, page numbering etc? If this is to be a requirement, now or in the future, perhaps either the top or bottom margin will benefit form extra space also.</p>
      <p>Looking at this grid it actually allows for 4 col not just 2? You do not always have to confine yourself to only two col. Experiment with combinations of wide and thin column where appropriate.</p>
      <p>Does your grid indicate a specified height at which article headings, sub heads, and intro paragraphs fall? Dictating this may allow for more consistency from article to article, issue to issue.</p>
      <p>Have you considered a method for pull quotes, and their usage? For example size, typeface choice, emphasis etc.</p>
      <p>What is your chosen serif for body copy at this stage?</p>
      <p>Hope these ideas help. Good luck.</p>
      <p>Best.<br>
      -nic</p>
