      <p>I see your point about the margins... however, the margins are already set at 1/2" and I lose 1/4 of that during trimming (the printer told me that). I don;t know if I can afford to lose more paper space, as the mag is tiny as it is. </p>
      <p>As for general navigation, I will place the page numbers at the bottom center of the page. I tried top right and it didn't work too well. ONce I place those in, I'll upload again. </p>
      <p>As for section markers, I'm still debating that. I was thinking of something running down the right side of the page, in three shades of green (one for each section of the mag) and in three locations (top, center, bottom) which would correspond to that section. It should be easy to navigate, I think, once I include these section markers. </p>
      <p>I will look into wide/thin columns, as well as a 4-column layout for the second section of the mag, which is the student work. I'll post that once ready. </p>
      <p>Finally, for articles the headline always falls either directly above or directly on the middle third of the grid, but always around that center area. That allows me to have some wiggle room for headlines that are too long (I can break them to two lines, like the example) or headlines that are too short (which can have a larger font size). </p>
      <p>The pull quotes are being dealt with in the same manner as the headlines: Trebuchet at a small point size. </p>
