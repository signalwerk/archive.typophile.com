    <p>This is the first article in my school's architecture magazine. I've posted here before regarding the cover, but this time I need some help with the layout - essentially I'd like it to be more interesting than it was before, and I'm having some issues regarding the font choice for the body. </p>
    <p>The budget is tight, so I'm deciding to stick to fonts I already have (Myriad, Trebuchet, Bell, etc). I used Trebuchet as the body font in the first issue and I didn't quite like the result, so I'm moving to a serif font. I still like Trebuchet for the headlines, so I'm pretty much sticking to that unless someone can offer a better replacement. </p>
    <p>Please look at this spread and let me know what you think. Any comment would be much appreciated. </p>
    <p>thanks,<br>
    macgirl</p>
    <p>P.S. I am not a graphic designer. Just an architecture student who is addicted to fonts.</p>
