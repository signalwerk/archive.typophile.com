  - id: 259462
    user: 1226
    date: 2008-02-16T18:04:00
    date_raw: 16.Feb.2008 6.04pm
    votes: null
    html: |-
      <p>I was going to respond last evening but my eyes were too tired . . .</p>
      <p>So with a mostly fresh brain on your questions Eben, I think I need to quality the type of type I’m developing with Bai which is strictly display work. It’s not as dogmatic and exacting as what is required for text work but still requires a good deal of attention to create nice letter combinations that feel correct and are visually balanced throughout.</p>
      <p>Now as to the Illustrator vs. Fontlab matter, I definitely prefer that Bai works in Illustrator because it’s still generally a more comfortable environment for me to draw my own glyphs in and even if nodes have to snap to a 1000em grid, who’s to say what ’correct’ is if the integrity of the form is still well intact . . .</p>
      <p>I have drawn faces in Fontlab and still find it cumbersome and slow but I suspect practice will improve both of those things . . .</p>
      <p>To your question about the pros and cons of the model Bai and I are working within, I’d say there are far more pros than cons.</p>
      <p>For starters, I’m betting like every font designer on this board, we have more type specimen references and sketches than we may ever turn into typeface in our natural lifetimes and while I may ’cherrypick’ my favorites to take from top to tail, there are still some really nice specimens that will otherwise never have a life digitally without enlisting the efforts of a competent vector tracing artist.</p>
      <p>And at worst, I can critique the work Bai provides me and in turn educate her to become a better lettering artist and typeface designer in her own right so I think it’s a win-win situation all around . . .</p>
      <p>I think I am a rare breed in the font world in that I have always embraced collaboration rather than tried to hold all my cards so close to the vest and try to maintain a solo effort. There are so many talented lettering artists, type technologists, software maketers, and licensing attorneys (OK one that I know :D) alike that working in a bubble can stunt professional growth and limit how far one can go in this field.</p>
      <p>Stuart :D</p>
