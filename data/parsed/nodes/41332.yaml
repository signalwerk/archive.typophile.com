    <p>Part of: <strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Rounded Typefaces</strong></p>
    <p><a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>, <a href="/wiki/Christian%20Schwartz" class="freelinking" rel="nofollow">Christian Schwartz</a>, <a href="/wiki/Erik%20van%20Blokland" class="freelinking" rel="nofollow">Erik van Blokland</a>, 2008</p>
    <p>Designer and FontShop founder Erik Spiekermann notes that “round typefaces keep going in and out of fashion, for many reasons. One of them always has been the media the face would be used for: type on screens and back-lit signs suffers from radiant light. Sharp type will look blunt, and the amount of bluntness that occurs is usually unpredictable. Then came Web 2.0 and rounded typefaces made a major comeback. I think they are here to stay, both as a fashion statement and for physical reasons, like in the old days. There will always be bad media which needs indestructible fonts.”</p>
    <p>To blunt the corners on his FF Unit, Spiekermann turned to Erik van Blokland, whose technical wizardry took care of a lot of the issues common to rounding letterforms. While it is soft, FF Unit Rounded isn’t a sausage face or one only suited for comic strips. It looks friendly without losing its precision. </p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/features/newsletters/feb08b/" rel="nofollow">FF Unit Rounded release announcement</a><br>
    <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_rounded_ot/" rel="nofollow">FF Unit Rounded at FontShop</a><br>
    <a href="http://www.spiekermann.com/mten/2008/01/unit_rounded.html" rel="nofollow">FF Unit Rounded on Spiekermann's blog</a></p>
