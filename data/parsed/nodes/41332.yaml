    <p>Part of: <strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Rounded&nbsp;Typefaces</strong></p>
    <p><a href="/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a>, <a href="/node/13636" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Christian Schwartz</a>, <a href="/node/65521" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik van Blokland</a>,&nbsp;2008</p>
    <p>Designer and FontShop founder Erik Spiekermann notes that “round typefaces keep going in and out of fashion, for many reasons. One of them always has been the media the face would be used for: type on screens and back-lit signs suffers from radiant light. Sharp type will look blunt, and the amount of bluntness that occurs is usually unpredictable. Then came Web 2.0 and rounded typefaces made a major comeback. I think they are here to stay, both as a fashion statement and for physical reasons, like in the old days. There will always be bad media which needs indestructible&nbsp;fonts.”</p>
    <p>To blunt the corners on his <span class="caps">FF</span> Unit, Spiekermann turned to Erik van Blokland, whose technical wizardry took care of a lot of the issues common to rounding letterforms. While it is soft, <span class="caps">FF</span> Unit Rounded isn’t a sausage face or one only suited for comic strips. It looks friendly without losing its&nbsp;precision. </p>
    <p><strong>External Links</strong><br><a href="http://www.fontshop.com/features/newsletters/feb08b/"><span class="caps">FF</span> Unit Rounded release announcement</a><br><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_unit_rounded_ot/"><span class="caps">FF</span> Unit Rounded at FontShop</a><br><a href="http://www.spiekermann.com/mten/2008/01/unit_rounded.html"><span class="caps">FF</span> Unit Rounded on Spiekermann’s&nbsp;blog</a></p>
