      <p>Caps usually do look better set looser, but fonts are not usually spaced that way for the reason you discovered.</p>
      <p>If you want to retain that feature, I can think of a couple of options.</p>
      <p>1. Shift all the caps to the right, or shift all the lowercase to the left, or a little of both. The downside of this is when you have a lowercase letter followed by an uppercase letter the spacing will be even looser. Fortunately, this doesn't come up in normal words, mainly just hi-tech brand names (iPod, FontLab, etc.). People who need to set stuff like that could simply do manual kerning in such cases.</p>
      <p>2. If you are building an OpenType font, you could space the caps tighter for use with the lowercase and use the 'cpsp' feature to specify looser spacing for all-caps settings. This would only work in OT-aware apps, but is probably the smarter way to do it.</p>
