      <p>"1. Shift all the caps to the right,"</p>
      <p>That is my solution as well.  Determine your sidebearings for cap to cap spacing, then shift the caps to the right using the same width (meaning the left sidebearing will increase and the right sidebearing will decrease) so that the right sidebearing of caps are now correct for positioning next to lower case.</p>
      <p>ChrisL</p>
