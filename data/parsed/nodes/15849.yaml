      <p>cpsp support doesn't need to be linear, that's just the easiest way of approaching it if all you want to do is loosen the spacing a bit (effectively, the same as applying tracking).</p>
      <p>The cpsp feature uses GPOS lookup type 1, which is a single glyph adjustments. The quick and easy way to implement the feature, as described above, is simply to define a glyph group (or class in FontLab parlance) and apply the same GPOS adjustment to the whole group. But there is no reason at all why you could not take the time to make individual and varied adjustments to each glyph, or to smaller groups of like glyphs.</p>
      <p>The relationship of the cpsp and kern features is an interesting question. Do you kern caps-to-caps base on their default spacing, or based on their cpsp spacing?</p>
    html_clean: |-
