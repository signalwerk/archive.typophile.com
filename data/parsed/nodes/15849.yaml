      <p>I just finished "Type Specific" as well.  Mostly, it is a show book and very little of a tell book.  The "show" part is in the sense of typical award annuals, you get a quick flash of something but not much meat. There is minimal description of the problem, solution and method.<br>
      The main thing that bothered me was the presentation.  The design/layout of the book overpowers the typefaces they are showing. This is one of those "it's all about me" designs.  The type designs themselves are nondescript and pretty uninventive--they look like off-the-shelf faces. I wonder why someone would pay for a custom font when it was not customized for them?</p>
      <p>ChrisL</p>
