      <p>Now I've had the time to read "letters of credit" and do some spacing-experiments on my font, and I've come to a problem where I need some advice:</p>
      <p>I have spaced uppercase (HOHOHO etc.) and lowercase letters (nonono etc.), respective to the inner room of H, O, n and o. When setting uppercase, everything is fine, same is when setting lowercase. </p>
      <p>The problem occurs when mixing them: The spacing of the uppercase obviously is wider, so words like "Terra Nova" look more like "T erra N ova". This happens with most uppercase letters, not only with T, V, W etc.<br>
      Is this an error by design (H too wide --&gt; spacing too loose)?<br>
      Is it an error of spacing (uppercase spacing chosen too loose)?<br>
