      <p>Capital spacing is something which troubles me since some time, and I am happy to find many of my nightmares reflected in this thread! Some thoughts on it.</p>
      <p>(a) I do not trust designers -- any typographers left? -- and so think that the job needs to be done by type designers. </p>
      <p>(b) cpsp indeed requires that the "All Caps" option is selected from the menu. Yet there are people who TYPE uppercase letters. (I do not want to discuss whether they should or should not do so. They do.) </p>
      <p>(c) cpsp, as used now, merely increases the overall spacing of capitals. (Whether you add more space to one side of glyphs, or distribute additional space equally to left and right sides of glyphs, is a matter of taste. Each with its own consequences.)<br>
      In my opinion, uppercase letters need to be spaced a bit differently for uppercase context and for lowercase context.* Compared to increasing sidebearings in a linear way merely (which is what the cpsp feature normally does), A L T V W Y may require less flesh leftside/rightside for UC context.<br>
      I still like David Kindersley's model for UC context. As a side effect, UCs spaced that way don't need much kerning at all.</p>
      <p>In Litteratra, I included a second set of uppercase letters which are spaced not only more openly but a bit differently. Normal UCs are spaced for lowercase context, a special set is spaced for uppercase context. A lookup in calt then replaces normal UCs by special UCs in uppercase context.<br>
      However, this blows up the character set unnecessarily, and requires kerning for even more glyphs -- with punctuation marks &amp;c at least. I will not repeat this.</p>
      <p>My hope is a bit in contextual positioning. Then one set of UCs would do, and it would be possible to add spaces INSIDE spaced words only. So, the effect which Mr Hudson illustrated would not occur.**<br>
      In a second step, the space character's advance width could be increased if UC-only or SC-only words precede and/or follow it.</p>
      <p>Karsten</p>
      <p>* Depends on typeface design. Rather narrow sanserif UCs do not require different spacing. Increasing spaces the linear way works fine.<br>
      ** InDesign's optical margin alignment may compensate for it. But this does not help poor Word users ...</p>
    html_clean: |-
