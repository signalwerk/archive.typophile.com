      <p>I thought some of it (like the opener: the killer Houston Chronicle face) was good, but most of it was just depressing: design firms resisting the common sense of hiring a type designer, ending up either with geometric constructed suicide pills or decon hooligan backwash (often not even a font but an illustrator file with a bunch of outlines), but not even seeing a problem, and on top of it getting published as real, good work. But I guess there's a silver lining on the cloud: the demand is there, and there's a <cite>lot</cite> of room for education, hence potential.</p>
      <p>So the book is totally worth <cite>looking</cite> at, as a reality check<br>
      for us; but the money could certainly be better spent.</p>
      <p>hhp</p>
