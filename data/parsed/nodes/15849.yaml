      <p>Tracey was talking about how to space letters, not how to space a font. What he has to say about the spacing of uppercase-to-uppercase is primarily of interest to typesetters, rather than font developers, because the latter have to space the uppercase letters primarily to work with lowercase.</p>
      <p>I strongly advise <em>against</em> the idea of spacing the caps relative to each other and then offsetting them to the right to space appropriately with the lowercase. The will produce  THIS sort of mess, where the space to the left of caps is larger than the space to the right.  Of course, this also results in giant gaps at the beginning of words.</p>
      <p>Proper cap-to-cap spacing is primarily the duty of the typesetter, hence the existence of tracking. Caps in fonts should be optically evenly spaced and fitted to the lowercase. The  feature can be used to increase the spacing between caps, but I generally find it best to use this only to uniformly loosen the setting slightly -- i.e. a kind of in-built tracking --: it is too blunt an instrument to produce optimal spacing of all-caps.</p>
