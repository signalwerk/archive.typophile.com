      <p>"cpsp support doesn’t need to be linear [...]"<br>
      "But there is no reason at all why you could not take the time to make individual and varied adjustments to each glyph, or to smaller groups of like glyphs."</p>
      <p>I know.  ;-)</p>
      <p>"The relationship of the cpsp and kern features is an interesting question. Do you kern caps-to-caps base on their default spacing, or based on their cpsp spacing?"</p>
      <p>I do not &amp; will not use cpsp because it requires manual activation of the All Caps option on the user's side.<br>
      Still it is open which feature is the best candidate, but it should be one which uses contextual positioning and is on by default, so users get a good result without thinking about the matter. I opt for calt. In this scenario -- contextual positioning, feature on by default --, kerning should be based on the spaced version.<br>
      It is a very tricky issue.<br>
      (However, as long as cpsp is an option which requires manual selection, kerning better be based on default spacing -- which gives acceptable results even if All Caps is not activated. In this context, using cpsp the linear way indeed makes sense!)</p>
      <p>Hello Mr Papazian. I use caps lock myself much too often. :) My point is: It is better not to expect that users activate All Caps. But then it's up to the type designer to make sure that in all-caps-setting spacing is right -- nevertheless.</p>
      <p>Karsten</p>
