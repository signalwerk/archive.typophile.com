    html: |-
      <p>I got a reply from Karen Cheng. She was kind enough to<br>
      send me a summary as well as a PDF of sample spreads.</p>
      <p>An excerpt from the summary:<br>
      "This book provides a detailed guide to developing a typeface and is suitable for readers at all levels, from the novice to the serious professional. Issues of structure, optical compensation and legibility are clearly illustrated with numerous diagrams and type specimens. The book describes the process for developing both serif and sans-serif typefaces with precise detail. Special emphasis is given to the systematic relationships between letters and shapes in a font."</p>
      <p>Just based on that paragraph, one might be tempted to think this book is the missing Holy Grail. But since Cheng is not an accomplished type designer* it can't be that. However, what she does seem to be doing is going quite deep into the time-honored practice of analysing and comparing existing fonts, and this is both rare and valuable**. The spreads reveal some very well thought out comparisons that discuss many things of concern, including: relative widths; vertical proportions; serif structures; the B/P/R relationships; modularity; spacing; and even diacritic placement. And at over 200 pages, that makes the whole pretty promising I think.</p>
      <p>* As far as I can tell. Unless she does it for the CIA or something.</p>
      <p>** The mention of Young's "Fonts &amp; Logos" in the summary is telling, since that book also enagages in a fair amount of comparison.</p>
      <p>Since looks can be decieving, I might regret saying the following, but: this book is a Strong Buy recommendation, especially for beginners (if also probably interesting to most of the more advanced designers). In fact -once I get my hands on a copy- I think I might recommend it as a textbook for my type design class at ArtCenter.</p>
      <p>hhp</p>
