      <p><em>Typophile is being clever and removing double spaces.</em></p>
      <p>This is normal web browser behavior, nothing to do with Typophile. (If you do "view source" on this page, you will see all the spaces you typed are still there.) In HTML, if one or more spaces are typed, only one is displayed; none if it's the beginning of a line.</p>
      <p>But, here's a little trick that works on Typophile: Type non-breaking spaces instead when you want multiple spaces or spaces at the beginning of a line to be displayed. On the Mac, use option-space. Control-shift-space on Windows (I think).</p>
