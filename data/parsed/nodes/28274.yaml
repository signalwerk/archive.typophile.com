      <p>Conservative, corporate, extended: Univers 53.<br>
      And it's complementary, not complimentary.</p>
      <p>I like your logo a lot, but question the type. The cyrillic R is too commie for your target market. The logo is subtle and classy, but the wordmark ain't.<br>
      I don't think you need a symbol AND a wordmark.<br>
      Why not have the company name in understated boldface of the main company typeface?</p>
