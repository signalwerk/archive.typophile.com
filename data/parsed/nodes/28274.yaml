    <p>Hi,</p>
    <p>complete newbie to the site - my first post in fact ;o) Stumbled across it while looking for a solution to a problem which you may be able to help me with - yes you!</p>
    <p>OK, I'm redesigning my company logo, after years of freelancing in my spare time I decided to take the plunge and start out working for myself full-time. The logo I'm currently using was knocked up just before I sent out my first ever invoice, to actually go on the invoice letterhead itself and as such was a bit of a rush job. I'm now looking to change the image and have created something i think is a bit more classier and, well "designed" (i hope)!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/infrared_4722.jpg"></div><p></p>
    <p>Anyway, this is what I'm going for - I target mainly large businesses who do alot of advertising and producing literature (brochures, catalogues etc) and therefore want to portray myself as a serious, professional in the design industry.</p>
    <p>"What has all this got to do with me", you may be asking yourself? Well - I need to find a complimentary typeface to go with this logo. I have tried so many that now I am utterly confused and fed up trying to decide so I thought I'd throw it out there to some other pro's and see what you guys come up with.</p>
    <p>This font will be used for the details on my stationery as well as the main body copy for any promotional literature in the future. I want something classy yet modern-ish (maybe?) that plays well with Bank Gothic and is easily legible. Open to serif/sans serif suggestions - have ruled nothing out yet.</p>
    <p>Any thoughts and comments on the logo also appreciated. Cant wait to hear some thoughts...</p>
