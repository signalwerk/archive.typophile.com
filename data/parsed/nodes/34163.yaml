    <p>For the past year I've created a 4 page report (front and back tabloid spread) in Illustrator CS2. I like Illustrator and have always felt more comfortable using it than InDesign. But more recently, I've come to appreciate some of the consistent features of InDesign, the ability to create specific styles for all the varying paragraphs in my reports. So, I'm converting my current template over to InDesign and have come across a feature snag.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Appearance_4889.gif"></div><p></p>
    <p>In the above image, you'll notice the Appearance Palette in Illustrator CS2. I've created a triple filled stroke and want to do the same in InDesign. Currently I'd have to import the image from Illustrator. Is there a way to recreate the same style (possibly with Frame Styles) in InDesign so I can just click and apply? Is there a way to transfer styles from Illustrator to InDesign?</p>
