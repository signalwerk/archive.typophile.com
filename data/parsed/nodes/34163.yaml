      <p>OK, I'll bite:</p>
      <p>- To my knowledge, there's no way to import styles from AI to InD (or vice versa)</p>
      <p>- It would be easy to set up a frame style to apply a rule, but InD doesn't support multiple-color rules, at least not like the ones you're showing. You can control the gap color between multi-line rules, but not set different colors for each line.</p>
