      <p><em>And I’ve been spoiled because I’ve been able to achieve a lot just using Illustrator for the longest time.</em></p>
      <p>And vice versa.  You can always create your own "line" style in InDesign -- look at the Help files -- and implement that.  The worst case scenario is that you create your line style in Illustrator, import it into InD as a library item, and call it up when you need to.</p>
      <p>Ain't no big thing....  ;-)</p>
      <p>FWIW, if the only thing that is the sticking point is the line style, that, IMHO, is a small price to pay for all the things you can do with the text in InD that you can't in Illustrator.</p>
