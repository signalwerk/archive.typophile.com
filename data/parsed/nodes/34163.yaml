      <p><em>You can always create your own “line” style in InDesign...</em></p>
      <p>Just to add to that, if you choose a double or triple stroke from the Stroke palette, InDesign lets you assign a separate color to the gap(s) in between... But nope, it won't let you assign a different color to each line in the double or triple stroke. Sorry. You should write to Adobe about that; so far they have been very accomodating to longtime QuarkXPress users... I'm sure they'll accept suggestions from a longtime Illustrator user. :-)</p>
      <p>Also, if you are familiar with QuarkXPress, I heartily recommend the book <a href="http://www.amazon.com/Moving-InDesign-About-QuarkXPress-PageMaker/dp/0321294114/ref=sr_1_3/104-1334615-7984767?ie=UTF8&amp;s=books&amp;qid=1180998672&amp;sr=1-3" rel="nofollow"><em>Moving to InDesign</em></a>. Very helpful.</p>
