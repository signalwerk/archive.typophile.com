      <p>Any character that readers encounter after they have learned to read has an awkward status.</p>
      <p>It’s related to the difficulty most people have in learning more than one language fluently, if the multiple languages are not all learned concurrently as a young child.</p>
      <p>So to make a character “natural’, it has to be part of the alphabet taught to (and learned by) children when they first read, when the most profound impressions and connections are made.</p>
      <p>In Britain during the 1960s, an experiment was carried out which compared 873 children taught with the traditional alphabet against 873 taught with Pitman’s ITA (initial teaching alphabet).</p>
      <p>The results showed that children in the ITA group learned faster and wrote better, but ultimately the least able of them had severe difficulties in adapting to real-world complexities and irrationalities, which children in the traditional group had been dealing with since day one.</p>
      <p>An awesome piece of social engineering, unfortunately to the detriment of some of the guinea-pigs.</p>
      <p><a href="http://www.spellingsociety.org/journals/j29/itaexpt.php" title="http://www.spellingsociety.org/journals/j29/itaexpt.php">http://www.spellingsociety.org/journals/j29/itaexpt.php</a></p>
      <p>On a smaller scale, the last characters to be added to the Western European alphabet were two of many improvements proposed by G.G. Trissino in 1529— the addition of V to disambiguate certain usages of U, and of j for like reason with i. These caught on slowly at first in Italy, and then elsewhere, but eventually came to be the norm.</p>
      <p> A more gradual, organic form of cultural evolution.</p>
      <p>(However, I don’t know to what extent Trissino’s reforms were actively promoted and/or enforced by various authorities of the day, or how much they spread infectiously throughout the medium of culture.)</p>
