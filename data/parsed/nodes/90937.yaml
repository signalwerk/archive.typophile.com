      <p><em>I don't get why a recurring argument against those is calling them "artificial characters"</em></p>
      <p>Can you provide an example? Who is calling new characters 'artificial'?</p>
      <p>I suppose such a term might be used in the sense of inorganic, as a parallel to how the word artificial is used relative to things like sweeteners. For the most part, the signs that we read every day are the product of a long 'organic' process. They have been filtered through the triple screens of writing, reading and culture, and this accounts for both their conventional forms and for the stylistic variety of those forms.</p>
      <p>I don't think it is the case that all new signs are inorganic; that is, I believe new signs can be devised, thoughtfully, to fit within the organically evolved systems of writing and reading and cultural expression. Or it can turn out that way mostly by chance, which I think was the case with the euro symbol: the speed with which type designers found ways to convincingly represent that new sign in virtually any style of type is evidence of its organic compatibility with existing typographic conventions and styles. On the other hand, I think the new Turkish lira sign has a problem that will be much more difficult to resolve in a way that fits organically with other letters, numerals and symbols.</p>
