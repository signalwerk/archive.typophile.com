      <p>I would think that while it certainly is true, for example, that the letters of the Latin alphabet came into being by the hand of Man, and thus they are artificial, one can still draw a distinction between symbols which gradually developed over time, arising spontaneously from the activities of many people - and characters which can be traced to the action of a single individual.</p>
      <p>This is true whether we are speaking of the "interrobang" punctuation mark, the new currency symbols for the Indian Rupee or the Turkish Lira, or the astrological glyps for the Uranian planets of the Hamburg School.</p>
      <p>"Artificial" may be the wrong word for the distinction which is intended to be made, but it is perhaps the closest word we have, and as I think the distinction is real and significant, I can't criticize people for using the best word for it that is handy - because to do so would simply have the result of preventing the distinction from being expressed.</p>
