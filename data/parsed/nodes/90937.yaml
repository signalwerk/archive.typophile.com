  html: <p>I've read a lot of complains every time a new character design emerges. I can stand those, but I don't get why a recurring argument against those is calling them "artificial characters". Is there such thing like a <em>natural</em> character? All characters we use are conventions that have to be taught and get used with; they were created by humans, evolved with the time and definitely aren't stored in the unconscious mind. It is true that people generally grow being a 'native' speaker of some alphabet, yet even with that logic new characters I don't think that the "artificial" word is property used.</p>
