      <p>Ah, thats looking nice.<br>
      I think the lc 'k' bottom could use a bit more subtlety. It somehow looks that the right shoulder of the 'm' is higher then the left one. The alternative 'j', 'f' and 'y' are fine in my opinion, although the serif on the normal 'y' does work. Maybe a similar treatment might work on the other two as well? I'm also not sure about the slanted crossbars on the 't' and 'f', but then again it might be a characteristic feature too. The difference in strokewidth on the 'e' and 'o' are indeed not very noticable.<br>
      The uppercase; Same prob with the 'J' as with the lc. The terminal of the 'K' is better then on the 'k'. The lower stroke of the 'L' might be a bit wide, that could cause a large gap when text is set with the typeface. The 'S' is a bit wide.<br>
      No serifs on the bottom of the 'V' and 'W'? (might not need it, but it does stand out). The shift of the strokes in the 'X' might be a bit exaggerated, at least on this size. Also on the top, the counter becomes a bit small. But I like the style of your uppercase, although I do think it does not exactly match the style of the lowercase. Lowercase is very geometric, your uppercase is not.</p>
      <p>All in all it's starting to take shape, keep it up.</p>
