    <p>Hello Everybody, my name is Alin and i'm new here...  and this is my first shot at a distinct serif &amp; text block typeface .. its by far not finnished with letters missing in lowercase and almost no uppercase yet. I intend to make it a full font with italics weights and swashes... </p>
    <p>One problem i have with it is that i wanted it to look distinctive to some very small extent from other fonts (its not top priority - i think its better to finnish it properly). My question is .. how do you find it ? if it would be finnished would it be ok as a font ? </p>
    <p>P.S. The reason i'm asking is because i've recently discovered it looks very much like Italia - which kinda made me sad :)) </p>
    <p>Thank you for your time .. much love to the typophile forums - itsa great place :D</p>
    <p><img src="/sites/default/files/old-images/test_4846.jpg"></p>
