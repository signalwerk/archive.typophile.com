      <p>I typed a lengthy reply, but got a server error. Can't be bothered with retyping it that long again, sorry.</p>
      <p>What I said in short:<br>
      Your serifs might be a bit too slanted. With the a, b, g, etc. it's fine, but on the f and j and similar characters, it looks awkward.<br>
      The u, h and n are too wide (m is better). Bottom serif on v is a bit heavy.<br>
      Since all your characters have differences in stroke width, your o, c and e should have that as well.</p>
