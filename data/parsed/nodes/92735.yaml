    html: |-
      <p>That's not the zero point. It starts off there by default, but it’s an assignable reference point. You can put it where you want.</p>
      <p>The second set of coordinates in the info area of the Glyph window show the relation to the reference point.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FLrefpt_3721.png"></div><p></p>
      <p>And several transformations have the option of performing in relation to the reference point.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FLtransform-refpt_4195.png"></div><p></p>
