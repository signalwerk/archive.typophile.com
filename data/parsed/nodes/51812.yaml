  html: |-
    <p>When exporting an InDesign file to PDF, I noticed on several occasions,<br>
    that text is shifting when I used the " Indent to Here special character".</p>
    <p>InDesign moves the first (few) words to the right by appr. one space.</p>
    <p>Did you ever encounter this problem and is there a way to solve it ?</p>
    <p>/// Jacques</p>
