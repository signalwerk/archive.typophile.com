      <p><cite>… use a custom typeface or modified font in addition to retail, off-the-shelf fonts.</cite></p>
      <p>Some examples:<br>
      <a href="http://www.christianschwartz.com/guardian.shtml">The Guardian family</a> by <a href="/wiki/Christian%252BSchwartz" class="wiki">Christian Schwartz</a><br>
      <a href="http://www.lucasfonts.com/fonts/floris/">Floris</a> and <a href="http://www.lucasfonts.com/fonts/taz/about/">Taz</a> by <a href="/wiki/Luc%252528as%252529%252Bde%252BGroot" class="wiki">Luc(as) de Groot</a><br>
      Le Monde by <a href="http://www.typofonderie.com/">Porchez Typofonderie</a></p>
      <p>Also, have a <a href="http://www.gerardunger.com/">look at the typefaces</a> of <a href="/wiki/Gerard%252BUnger" class="wiki">Gerard Unger</a>: several of them have been made specifically for the use in newspapers, like Swift, Coranto or Gulliver.</p>
