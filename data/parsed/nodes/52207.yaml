    html: '<p><a href="http://www.ascendercorp.com/pr/pr2004_11_09.html">Ascender’s study</a> found that the 10 most popular typeface families are: <a href="http://fontbureau.com/fonts/PoynterOSText">Poynter</a>, <a href="http://www.fontshop.com/fonts/downloads/itc/itc_franklin_gothic_std_complete_vp/">Franklin Gothic</a>, <a href="http://www.fontshop.com/fonts/downloads/linotype/neue_helvetica_std_complete_vp/">Helvetica</a>, <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/utopia_std_complete_vp/">Utopia</a>, <a href="http://www.fontshop.com/fonts/downloads/linotype/times_std_complete_vp/">Times</a>, <a href="http://www.fontshop.com/fonts/downloads/monotype/nimrod_std_vp/">Nimrod</a>, <a href="http://www.fontshop.com/fonts/downloads/monotype/monotype_century_old_style_pro_vp/">Century Old Style</a>, <a href="http://www.fontshop.com/search/?q=Interstate">Interstate</a>, <a href="http://www.fontshop.com/search/?q=Bureau%20Grot">Bureau Grotesque</a> and <a href="http://www.fontshop.com/search/?q=Miller">Miller</a>. Further, 35 of the top 100 daily newspapers use a custom typeface or modified font in addition to retail, off-the-shelf fonts.</p>'
