      <p>I myself was lucky to visit the Imprimerie Nationale some years ago, and get a tour by Christian Paput of its various marvels, such as 120 pt as well as 4 pt punches! Even more memorable was my 5-hour visit to Jim Rimmer's place in 2008*, where the highlight for me was cutting a punch and striking it into brass. Jim was so gracious.</p>
