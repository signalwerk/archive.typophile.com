    html: |-
      <p>@William: The high Didone contrast of Yo makes it well suited to doing an extreme range of weights and widths in straight FontLab MM space, without resort to Superpolator or other add-ons. Try the same dynamic range with a fairly low-contrast design and you'll start needing something else to help out.</p>
      <p>Cheers,</p>
      <p>T</p>
