  - id: 421479
    user: 1947
    date: 2010-07-21T13:10:00
    date_raw: 21 Jul 2010 — 1:10pm
    votes: null
    html: <p>While I have a licensed copy of ReMix tools, and find them very impressive, the Yo series was created in FontLab with no other tools. Only FontLab's MM interface with four drawn instances. On the website I talk about originally wanting to create 520 fonts organized in 26 widths, and I'm only half kidding. It's amazing to see how a slight difference in the width axis would yield a very different feeling design.</p>
    html_clean: <p>While I have a licensed copy of ReMix tools, and find them very impressive, the Yo series was created in FontLab with no other tools. Only FontLab's MM interface with four drawn instances. On the website I talk about originally wanting to create 520 fonts organized in 26 widths, and I'm only half kidding. It's amazing to see how a slight difference in the width axis would yield a very different feeling design.</p>
