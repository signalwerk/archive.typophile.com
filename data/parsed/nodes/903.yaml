    html: <p>Okay, I've tweaked the name a little bit here, so it doesn't look like a typo. It's really just a working title anyway. <br> <br>Jim, I began exploring some lighter weights. At first I tried to stick to the point size previously established by the original weight. Thus the top two versions. I tried to take some of the weight out of the vertical axis, but it didn't look so hot. The second version looks better, but is still a bit out of proportion. So I broke down and started downsizing vertically. Any opinions here? <br> <br><img src="http://www.typophile.com/forums/messages/29/14194.gif" alt=""> <br> <br>Andreas, I can't emphasize enough how cool it is to have your input. Your d b and e characters were too cool not to play around with! I love your work. Totally unique. I've been playing with the x (it's amazing how many variants are possible with pixel grids) and here are two that work a little better. I had to cheat it in there, as you can see. The baseline is super-elevated, and the descenders aren't as long as the rest of the set. What do you think? <br> <br><img src="http://www.typophile.com/forums/messages/29/14195.gif" alt=""> <br> <br>Hrant, thanks for your post. I'm glad to have borrowed your critical eye!</p>
