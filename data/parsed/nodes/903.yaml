    html: <p>i like some of the letters, but i can't really read the words in white.  not because they're low-contrast, but because all the letters look the same.  something like this, to me, is only good for a single word logotype, because if it were a title for something, and the title was many words, i'd be confused in reading it.  with a logotype, it's ok to be a little illegible.  one thing that confuses me in trying to decipher what those words say is the word-spacing.  maybe space out the words another pixel or two.  i've been glancing up at the font while writing this and i still can't tell what those words say. <br> <br>g looks like a b <br>e looks like a p <br>p looks like the r <br>in the top version, the L looks out of place <br> <br>will there be numbers?  because the q looks like a 9.</p>
