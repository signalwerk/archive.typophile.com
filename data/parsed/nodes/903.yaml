  html: <p>This is nuetron, a working title for a font inspired by Andreas Lindholm's industrial work. The lower specimen is perhaps a cleaner, more effective face, but offers fewer original elements. L through o, for example. <br> <br>The top variant is the direction I want to go in, really dive into the chaotic, you know? But I suspect there are too many sub-elements to keep everything looking like a family. Look at the rounded corners clashing with the angled ones. Then add the battling angles of the w, o, and x, and. That x is giving my fits. Character widths seem to be difficult here, for me too. <br> <br>I'll keep trying to make the upper version work, but in the meantime, does anyone have any help to offer? <br> <br>As with Atom, once I get everything in order with this face, I'll shrink it down 50% and produce a more traditional screen font. <br> <br><img src="http://www.typophile.com/forums/messages/29/14088.gif" alt=""></p>
  html_clean: <p>This is nuetron, a working title for a font inspired by Andreas Lindholm's industrial work. The lower specimen is perhaps a cleaner, more effective face, but offers fewer original elements. L through o, for example. <br> <br>The top variant is the direction I want to go in, really dive into the chaotic, you know? But I suspect there are too many sub-elements to keep everything looking like a family. Look at the rounded corners clashing with the angled ones. Then add the battling angles of the w, o, and x, and. That x is giving my fits. Character widths seem to be difficult here, for me too. <br> <br>I'll keep trying to make the upper version work, but in the meantime, does anyone have any help to offer? <br> <br>As with Atom, once I get everything in order with this face, I'll shrink it down 50% and produce a more traditional screen font. <br> <br><img src="http://www.typophile.com/forums/messages/29/14088.gif" alt=""></p>
