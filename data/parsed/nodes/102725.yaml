    html: |-
      <blockquote><p>How can that work? The points match exactly with my baseline, mm don't.</p></blockquote>
      <p>You are not limited to entering everything in mm, even if your default measurements are set to that. Enter "16pt" or "32pt" -- InDesign will automatically re-calculate it into your current measurement unit. (Correct me if I'm wrong, but from your images I infer you <em>are</em> using InDesign.)</p>
      <p>Is your plain text 12 pt high? Try building "up" from that, in steps of 2 pts: 3rd headline 14 pt, 2nd headline 16 pt, and (not shown) 1st headline 18 pt. You can also increase the steps towards larger headlines; something like 14, 16, 20 pts.</p>
      <p>Since your 3rd headlines are in another color and another weight, you can also try the same size as your body text – the hierarchical difference is already there.</p>
    html_clean: |-
