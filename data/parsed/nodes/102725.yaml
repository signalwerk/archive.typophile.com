    html: |-
      <p>The smaller your baseline grid is, the more (vertical) freedom you have. However, with such an extremely fine spaced grid you might as well not use one at all!</p>
      <p>I usually use a whole-leading grid; sometimes whole fractions, such as 1/2 or 1/3 of the body text leading.</p>
      <p>It Depends -- mainly on how large your headings, and its associated white space above and below, are when compared to body text and leading.</p>
      <p>(Your Headings leading seems to assert you only have one-line headings. I'd suggest using more tighter leading, and fill up the remaining space with Space Above and Space Below.)</p>
