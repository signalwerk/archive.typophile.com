    html: |-
      <p>Tim, what Bert was saying was that in InDesign you should use "space before" (or "space after") to control spacing between paragraphs. Or in this case, spacing between a headline (which is a very small paragraph) and the text. </p>
      <p>You can set "space before/after" settings in the paragraph palette or by creating a style sheet with those settings.</p>
      <p>Setting the H2 heads the way you did at 24/64 will produce weird results if a headline takes 2 or more lines, and in general it's bad technique. Never use leading or blank lines to add spacing between paragraphs, it's better to use "space before" or "space after".</p>
    html_clean: |-
