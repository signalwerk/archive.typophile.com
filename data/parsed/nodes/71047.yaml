    <p>This a new font: a study of sans serif with no spurs, and with suggested calligraphy with in-taken forms to replace nib-pen thin strokes.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Polyester_6604.png"></div><br>
    I also made an alternate a, w and g.<p></p>
    <p>What do you think?</p>
