      <p>Thanks for the comments-</p>
      <p>Indeed that name was just a working title. I've already changed into Spurless. And this is still work in progress: those alternate characters are just studies at the moment, and question mark is also not finished yet.</p>
      <p>And yes; this will have multiple weights with italics/obliques.</p>
