  html: <p>Aside from the obvious slight nuances...can anyone tell me the major differences between ADOBE and STANDARD versions of Futura? I have a client that wants to change from Futura STANDARD to ADOBE and they want to know what the impact would be. I have to say I don't really think it would be that noticeable having looked at and worked with both. Then looking at the typefaces side by side. Is one easier to work with from a production standpoint? Any thoughts? Thanks everyone!</p>
