      <p>There might be one big difference, depending on what<br>
      font house/foundry your "standard" Futura is from:<br>
      Adobe allows modifications to their fonts (with some<br>
      conditions). So for example if you ever need to add<br>
      or modify a character you won't be stuck.</p>
