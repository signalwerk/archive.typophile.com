    <p>I have a code that recognizes numbers with brackets around them ([1], [22] and [333]) and exchange the numbers and brackets with alternate forms that together form a sort of indexed number: a square around the numbers. I make use of a class called @figures to detect any kind of numeral. Singles and doubles are quadratic, the triples doesn’t need to be, so they use the same numbers as the doubles.</p>
    <p>Here’s the code (I have a similar one for inversed squares in ss02):<br>
    <code><br>
    feature ss01 {<br>
      lookup mono_1 {<br>
      	sub bracketleft @figures bracketright' by bracketright.square;<br>
    	} mono_1;<br>
    	lookup mono_2 {<br>
    		sub bracketleft zero' bracketright.square by zero.mono;<br>
    		sub bracketleft one' bracketright.square by one.mono;<br>
    		sub bracketleft two' bracketright.square by two.mono;<br>
    		sub bracketleft three' bracketright.square by three.mono;<br>
    		sub bracketleft four' bracketright.square by four.mono;<br>
    		sub bracketleft five' bracketright.square by five.mono;<br>
    		sub bracketleft six' bracketright.square by six.mono;<br>
    		sub bracketleft seven' bracketright.square by seven.mono;<br>
    		sub bracketleft eight' bracketright.square by eight.mono;<br>
    		sub bracketleft nine' bracketright.square by nine.mono;<br>
    	} mono_2;<br>
    	lookup mono_3 {<br>
    		sub bracketleft' @figures bracketright.square by bracketleft.square;<br>
    	} mono_3; </code></p>
    <p>	lookup duo_1 {<br>
    		sub bracketleft @figures @figures bracketright' by bracketright.square;<br>
    	} duo_1;<br>
    	lookup duo_2 {<br>
    		sub bracketleft @figures zero' bracketright.square by zero.multiple;<br>
    		sub bracketleft @figures one' bracketright.square by one.multiple;<br>
    		sub bracketleft @figures two' bracketright.square by two.multiple;<br>
    		sub bracketleft @figures three' bracketright.square by three.multiple;<br>
    		sub bracketleft @figures four' bracketright.square by four.multiple;<br>
    		sub bracketleft @figures five' bracketright.square by five.multiple;<br>
    		sub bracketleft @figures six' bracketright.square by six.multiple;<br>
    		sub bracketleft @figures seven' bracketright.square by seven.multiple;<br>
    		sub bracketleft @figures eight' bracketright.square by eight.multiple;<br>
    		sub bracketleft @figures nine' bracketright.square by nine.multiple;<br>
    	} duo_2; </p>
    <p>	lookup duo_3 {<br>
    		sub bracketleft zero' @figures bracketright.square by zero.multiple;<br>
    		sub bracketleft one' @figures bracketright.square by one.multiple;<br>
    		sub bracketleft two' @figures bracketright.square by two.multiple;<br>
