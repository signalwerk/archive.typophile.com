    html: |-
      <p><strong>Lookups: </strong> they are used to organize the code. Although you can use a unique sequence of substitutions, to group them into lookpus avoid mess.</p>
      <p><strong>Same order :</strong> when you replace a class with other, OT engine uses the order of the glyphs in the class to make substitutions. Example:<br>
      <code><br>
      class @this: a e i o u<br>
      class @that: ä ë ï ö ü<br>
      </code><br>
      When you do a command like  <code>sub @this by @that</code>,  if OT engine finds u in your text, it will replace this u by the glyph in the same position from the class @that. In this example, the 5th character, ü.</p>
      <p><strong>Commented code :</strong> here is the code I posted above with some comments. When inserting this in your font, you can remove the lines with #.<br>
      <code><br>
      feature ss01 {<br>
       lookup figthree {<br>
      </code><br>
      # We must always begins with the more long/complex situation.<br>
      # In your code, this is the [XXX] case, with three digits.<br>
      # The reason is the same to text substitution: in a text editor, if you first<br>
      # replace 'type' with 'font' and later tries to find 'typeface', you get<br>
      # a problem as 'typeface' became 'fontface' due to the first substitution.<br>
      <code><br>
        sub bracketleft @figures @figures @figures' by @figures_multiple;<br>
       } figthree;<br>
      </code><br>
      # This replaces the thrid digit when there is [XXX. This digit will be<br>
      # the equivalent one from your figures_multiple class.<br>
      <code><br>
      lookup figtwo {<br>
      sub bracketleft @figures @figures' by @figures_multiple;<br>
      } figtwo;<br>
      </code><br>
      # The same above, now with two digits after [.<br>
      # At this moment, we already replaced all occurrencies of [XX<strong>X</strong> and [X<strong>X</strong>.<br>
      # Every digit in these positions came from @figures_multiple at this<br>
      # point. We still have to substitute [X, the first digit. But in this case,<br>
      # there are two possibilities: cases where you want a figure_multiple in the<br>
      # place of X and cases where you want a figure_mono, the [X].<br>
      # So we need two commands to handle this.<br>
      <code><br>
      lookup figone {<br>
      sub bracketleft @figures' @figures_multiple by @figures_multiple;<br>
      } figtone;<br>
      </code><br>
      # This is the solution: as [XXX] and [XX] were already replaced<br>
      # with digits from the @figures_multiple class, every<br>
      # [X followed with a multiple is not a [X] case, but [XX] or [XXX].<br>
      # This simplifies the code and reduces the number of procedures.<br>
      <code><br>
      lookup figmono {<br>
      sub bracketleft @figures' backetright by @figures_mono;<br>
      } figmono;<br>
      </code><br>
      # Finally, we replace the remaining [X] with the mono figures.<br>
      <code><br>
      lookup left {<br>
      sub bracketleft' @figures_multiple by bracketleft.square;<br>
      sub bracketleft' @figures_mono by bracketleft.square;<br>
      } left;<br>
      </code><br>
      # This replaces the bracketleft. Note you have two situations: brackets<br>
      # followed by multiple and mono digits, so both of them are addressed.<br>
      <code><br>
      lookup right {<br>
      sub @figures_multiple bracketright' by bracketright.square;<br>
      sub @figures_mono bracketright' by bracketright.square;<br>
      } right;<br>
      </code><br>
      # Exactly the same we made with bracketlefts, now we did with bracketrigths.<br>
      <code><br>
      } ss01;<br>
      </code><br>
      # To close the Stylistic Set.</p>
      <p>Note this order lets you ignore the bracketright when doing digit replacement. This also lets your code smaller and more clean. Hope this helps.</p>
