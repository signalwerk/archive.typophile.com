    html: |-
      <p>@ Frode</p>
      <p><cite>What do you mean by “the order is the same in @figures and @figures_Multiple”?</cite></p>
      <p>Freiberger answered in the post above.</p>
      <p><cite>And, another question while I’m at it. If I kern a glyph to overlap another, is there some way to make sure the overlap will be knocked out? It’s easily done with multiple shapes inside a glyph (ex: the inner shape of O is knocked out of the outer).</cite></p>
      <p>Somehow I have misunderstood that question. You want to knockout paths of two <em>different</em> glyphs. This may work in some applications, but for sure not in all. I tried something similar <strong><a href="http://typophile.com/node/59648" rel="nofollow">here</a></strong> with a shape, that had the wrong path direction. I thought, that this shape would not be visible. So I assume, that you have to provide two sets of invers figures, mono_invers and multiple_invers.</p>
      <p>The other problem, that you had, are rounding inaccuracies. And I assume, that they are partly caused by the hinting. I think, that can be avoided only, if you let the glyphs overlap with the help of negative sidebearings or kerning with the intention, that the overlapping parts do <strong>not</strong> knockout. In other words you could close small vertical wholes with the help of overlapping the black shapes. This should work in almost all applications. And this behavior of the applications is good, because otherwise you had to shorten the serifs instead of a negative kerning for a letter combination like XA in E<strong>XA</strong>MPLE.</p>
