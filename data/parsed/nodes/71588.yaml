      <p>I don’t know, why, but the main reason, why it did not work, were the missing lookups, that I have added now. I have no explanation for that, but I am burning for an answer.<strong> Thanks for the opportunity to learn something new! I will improve the code probably tomorrow,</strong> but here it is. It works fine. Test it with the string "[1] [12] [123] [1234] [1 1] [12 12] [123 123]" in FontLab. (I did not change your classes, but I have added them to the feature file.) By the way, as far as I know, you should avoid names with two dots like seven.mono.inverse because of search and copy functions in PDF. I also will post code, that you can use for the calt feature instead of the two ss features.</p>
      <p><code>@figures=[zero one two three four five six seven eight nine];<br>
      @figures_mono=[zero.mono one.mono two.mono three.mono four.mono five.mono six.mono seven.mono eight.mono nine.mono];<br>
      @figures_mono_inverse=[zero.mono.inverse one.mono.inverse two.mono.inverse three.mono.inverse four.mono.inverse five.mono.inverse six.mono.inverse seven.mono.inverse eight.mono.inverse nine.mono.inverse];<br>
      @figures_multiple=[zero.multiple one.multiple two.multiple three.multiple four.multiple five.multiple six.multiple seven.multiple eight.multiple nine.multiple];<br>
      @figures_multiple_inverse=[zero.multiple.inverse one.multiple.inverse two.multiple.inverse three.multiple.inverse four.multiple.inverse five.multiple.inverse six.multiple.inverse seven.multiple.inverse eight.multiple.inverse nine.multiple.inverse];</code></p>
      <p><code>feature ss01 {<br>
      #featureNames {<br>
      #name "index";<br>
      #name 1 "index";<br>
      #} ; # because I love it so, but it can be build with OTMaster or Makeotf only. (That is AFDKO 2.5 syntax.)<br>
      lookup Index1 {</code></p>
      <p><code># [f] to [f.mono]<br>
      sub bracketleft @figures' bracketright by @figures_mono;</code></p>
      <p><code># [fff] to [f f.multiple f]<br>
      sub bracketleft @figures @figures' @figures bracketright by @figures_multiple;</code></p>
      <p><code># [ff] to [f.multiple f]<br>
      sub bracketleft @figures' @figures bracketright by @figures_multiple;</code></p>
      <p><code># [f.multiple f] to [f.multiple f.multiple] AND<br>
      # [f f.multiple f] to [f f.multiple f.multiple]<br>
      sub @figures_multiple @figures' by @figures_multiple;<br>
      } Index1;</code></p>
      <p><code>lookup Index2 {<br>
      # [f f.multiple f.multiple] to [f.multiple f.multiple f.multiple]<br>
      sub @figures' @figures_multiple by @figures_multiple;<br>
      } Index2;</code></p>
      <p><code>lookup Index3 {<br>
      sub bracketleft' [@figures_mono @figures_multiple] by bracketleft.square;<br>
      sub [@figures_mono @figures_multiple] bracketright' by bracketright.square;<br>
      } Index3;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      #featureNames {<br>
      #name "index invers";<br>
      #name 1 "index invers";<br>
      #} ; # because I love it so, but it can be build with OTMaster or Makeotf only. (That is AFDKO 2.5 syntax.)<br>
      lookup Index1;<br>
      lookup Index2;<br>
      lookup Index3;<br>
      sub [@figures_mono @figures_multiple bracketleft.square bracketright.square] by [@figures_mono_inverse @figures_multiple_inverse bracketleft.square.inverse bracketright.square.inverse];<br>
      } ss02;</code></p>
    html_clean: |-
      <p>I don’t know, why, but the main reason, why it did not work, were the missing lookups, that I have added now. I have no explanation for that, but I am burning for an answer.<strong> Thanks for the opportunity to learn something new! I will improve the code probably tomorrow,</strong> but here it is. It works fine. Test it with the string "[1] [12] [123] [1234] [1 1] [12 12] [123 123]" in FontLab. (I did not change your classes, but I have added them to the feature file.) By the way, as far as I know, you should avoid names with two dots like seven.mono.inverse because of search and copy functions in PDF. I also will post code, that you can use for the calt feature instead of the two ss features.</p>
      <p><code>@figures=[zero one two three four five six seven eight nine];<br>
      @figures_mono=[zero.mono one.mono two.mono three.mono four.mono five.mono six.mono seven.mono eight.mono nine.mono];<br>
      @figures_mono_inverse=[zero.mono.inverse one.mono.inverse two.mono.inverse three.mono.inverse four.mono.inverse five.mono.inverse six.mono.inverse seven.mono.inverse eight.mono.inverse nine.mono.inverse];<br>
      @figures_multiple=[zero.multiple one.multiple two.multiple three.multiple four.multiple five.multiple six.multiple seven.multiple eight.multiple nine.multiple];<br>
      @figures_multiple_inverse=[zero.multiple.inverse one.multiple.inverse two.multiple.inverse three.multiple.inverse four.multiple.inverse five.multiple.inverse six.multiple.inverse seven.multiple.inverse eight.multiple.inverse nine.multiple.inverse];</code></p>
      <p><code>feature ss01 {<br>
      #featureNames {<br>
      #name "index";<br>
      #name 1 "index";<br>
      #} ; # because I love it so, but it can be build with OTMaster or Makeotf only. (That is AFDKO 2.5 syntax.)<br>
      lookup Index1 {</code></p>
      <p><code># [f] to [f.mono]<br>
      sub bracketleft @figures' bracketright by @figures_mono;</code></p>
      <p><code># [fff] to [f f.multiple f]<br>
      sub bracketleft @figures @figures' @figures bracketright by @figures_multiple;</code></p>
      <p><code># [ff] to [f.multiple f]<br>
      sub bracketleft @figures' @figures bracketright by @figures_multiple;</code></p>
      <p><code># [f.multiple f] to [f.multiple f.multiple] AND<br>
      # [f f.multiple f] to [f f.multiple f.multiple]<br>
      sub @figures_multiple @figures' by @figures_multiple;<br>
      } Index1;</code></p>
      <p><code>lookup Index2 {<br>
      # [f f.multiple f.multiple] to [f.multiple f.multiple f.multiple]<br>
      sub @figures' @figures_multiple by @figures_multiple;<br>
      } Index2;</code></p>
      <p><code>lookup Index3 {<br>
      sub bracketleft' [@figures_mono @figures_multiple] by bracketleft.square;<br>
      sub [@figures_mono @figures_multiple] bracketright' by bracketright.square;<br>
      } Index3;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      #featureNames {<br>
      #name "index invers";<br>
      #name 1 "index invers";<br>
