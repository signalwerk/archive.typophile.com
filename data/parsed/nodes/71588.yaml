    		sub bracketleft one' @figures @figures bracketright.square by one.multiple;<br>
    		sub bracketleft two' @figures @figures bracketright.square by two.multiple;<br>
    		sub bracketleft three' @figures @figures bracketright.square by three.multiple;<br>
    		sub bracketleft four' @figures @figures bracketright.square by four.multiple;<br>
    		sub bracketleft five' @figures @figures bracketright.square by five.multiple;<br>
    		sub bracketleft six' @figures @figures bracketright.square by six.multiple;<br>
    		sub bracketleft seven' @figures @figures bracketright.square by seven.multiple;<br>
    		sub bracketleft eight' @figures @figures bracketright.square by eight.multiple;<br>
    		sub bracketleft nine' @figures @figures bracketright.square by nine.multiple;<br>
    	} trio_4;<br>
    	lookup trio_5 {<br>
    		sub bracketleft' @figures @figures @figures bracketright.square by bracketleft.square;<br>
    	} trio_5;<br>
    } ss01;<br>
    </p>
    <p>This works like a charm, I’m just wondering if I could simplify things somehow.</p>
