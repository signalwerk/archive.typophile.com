      <p>I have to check, if I can call a lookup more than one time in a feature or if I can simply repeat a substitution rule. Then I could improve the code (See bottom "Improved, but unchecked, if valid"). But for the moment this is the most elegant, I was able to code. The special cases for the rectangle-brackets are removed, because I don’t think, that it was a good idea. The problem can be solved better with hinting.</p>
      <p><code>feature ss01 {<br>
      featureNames {<br>
      name "index";<br>
      name 1 "index";<br>
      } ; # because I love it so, but it can be build with OTMaster or Makeotf only. (That is AFDKO 2.5 syntax.)<br>
      lookup Index {</code></p>
      <p><code># [f] to [f.mono]<br>
      sub bracketleft @figures' bracketright by @figures_mono;</code></p>
      <p><code># [fff] to [f f.multiple f]<br>
      sub bracketleft @figures @figures' @figures bracketright by @figures_multiple;</code></p>
      <p><code># [ff] to [f.multiple f]<br>
      sub bracketleft @figures' @figures bracketright by @figures_multiple;</code></p>
      <p><code># [f.multiple f] to [f.multiple f.multiple] AND<br>
      # [f f.multiple f] to [f f.multiple f.multiple]<br>
      sub @figures.multiple @figures' by @figures_multiple;</code></p>
      <p><code># [f f.multiple f.multiple] to [f.multiple f.multiple f.multiple]<br>
      sub @figures' figures_multiple by @figures_multiple;</code></p>
      <p><code>sub bracketleft' [@figures_mono @figures_multiple] by bracketleft.square;<br>
      sub [@figures_mono @figures_multiple] bracketright' by bracketright.square;<br>
      } Index;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      featureNames {<br>
      name "index invers";<br>
      name 1 "index invers";<br>
      } ; # because I love it so, but it can be build with OTMaster or Makeotf only. (That is AFDKO 2.5 syntax.)<br>
      lookup Index;<br>
      sub [@figures_mono @figures_multiple bracketleft.square bracketright.square] by [@figures_mono_invers @figures_multiple_invers bracketleft.squareInvers bracketright.squareInvers];<br>
      } ss02;</code></p>
      <p>-------------------------</p>
      <p>Improved, but unchecked, if valid:</p>
      <p><code># [f] to [f.mono]<br>
      sub bracketleft @figures' bracketright by @figures_mono;</code></p>
      <p><code># [fff] to [f f f.multiple]<br>
      sub bracketleft @figures @figures @figures' bracketright by @figures_multiple;</code></p>
      <p><code># [ff] to [f f.multiple]<br>
      sub bracketleft @figures @figures' bracketright by @figures_multiple;</code></p>
      <p><code># [f f.multiple] to [f.multiple f.multiple] AND<br>
      # [f f f.multiple] to [f f.multiple f.multiple]<br>
      sub @figures' figures_multiple by @figures_multiple;</code></p>
      <p><code># same rule as above<br>
      # [f f.multiple f.multiple] to [f.multiple f.multiple f.multiple]<br>
      sub @figures' figures_multiple by @figures_multiple;</code></p>
      <p>And I have to check, whether a lookup can contain another lookup.</p>
