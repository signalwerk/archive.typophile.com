      <p>Thanks for responding, Arno. It was just an uninstalled old version of the font that caused problems in Word. The image below shows what I’m doing: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Indexed-Numerals_5939.png"></div><p></p>
      <p>Everything is working now, but the code feels rather heavy.</p>
      <p>Also, the frames are built from parts and the rendering of each part sometimes differs (only on screen). That’s the reason I’m asking about overlapping shapes. It would be so much easier if I could just keep the rectangles as whole shapes and kern them in place instead of piecing them together.</p>
