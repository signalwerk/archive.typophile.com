    html: |-
      <p>Frode,</p>
      <p>you can simplify the code creating a class with all the alternate figures (I called this @figalts) and rearranging the lookups this way:</p>
      <p><code><br>
      feature ss01 {<br>
       lookup figthree {<br>
        sub bracketleft @figures @figures zero' by zero.multiple;<br>
        sub bracketleft @figures @figures one' by one.multiple;<br>
        sub bracketleft @figures @figures two' by two.multiple;<br>
        sub bracketleft @figures @figures three' by three.multiple;<br>
        sub bracketleft @figures @figures four' by four.multiple;<br>
        sub bracketleft @figures @figures five' by five.multiple;<br>
        sub bracketleft @figures @figures six' by six.multiple;<br>
        sub bracketleft @figures @figures seven' by seven.multiple;<br>
        sub bracketleft @figures @figures eight' by eight.multiple;<br>
        sub bracketleft @figures @figures nine' by nine.multiple;<br>
       } figthree;<br>
      </code><code><br>
       lookup figtwo {<br>
        sub bracketleft @figures zero' by zero.multiple;<br>
        sub bracketleft @figures one' by one.multiple;<br>
        sub bracketleft @figures two' by two.multiple;<br>
        sub bracketleft @figures three' by three.multiple;<br>
        sub bracketleft @figures four' by four.multiple;<br>
        sub bracketleft @figures five' by five.multiple;<br>
        sub bracketleft @figures six' by six.multiple;<br>
        sub bracketleft @figures seven' by seven.multiple;<br>
        sub bracketleft @figures eight' by eight.multiple;<br>
        sub bracketleft @figures nine' backetright by nine.multiple;<br>
       } figtwo;<br>
      </code><code><br>
       lookup figone {<br>
        sub bracketleft zero' @figalts by zero.multiple;<br>
        sub bracketleft one' @figalts by one.multiple;<br>
        sub bracketleft two' @figalts by two.multiple;<br>
        sub bracketleft three' @figalts by three.multiple;<br>
        sub bracketleft four' @figalts by four.multiple;<br>
        sub bracketleft five' @figalts by five.multiple;<br>
        sub bracketleft six' @figalts  by six.multiple;<br>
        sub bracketleft seven' @figalts by seven.multiple;<br>
        sub bracketleft eight' @figalts by eight.multiple;<br>
        sub bracketleft nine' @figalts by nine.multiple;<br>
       } figtone;<br>
      </code><code><br>
       lookup figmono {<br>
        sub bracketleft zero' backetright by zero.mono;<br>
        sub bracketleft one' backetright by one.mono;<br>
        sub bracketleft two' backetright by two.mono;<br>
        sub bracketleft three' backetright by three.mono;<br>
        sub bracketleft four' backetright by four.mono;<br>
        sub bracketleft five' backetright by five.mono;<br>
        sub bracketleft six' backetright by six.mono;<br>
        sub bracketleft seven' backetright by seven.mono;<br>
        sub bracketleft eight' backetright by eight.mono;<br>
        sub bracketleft nine' backetright by nine.mono;<br>
       } figmono;<br>
      </code><code><br>
       lookup left {<br>
        sub bracketleft' @figalts by bracketleft.square;<br>
       } left;<br>
      </code><code><br>
       lookup right {<br>
        sub @figalts bracketright' by bracketright.square;<br>
       } right;<br>
      } ss01;<br>
      </code></p>
      <p>As you can see, @figalts was created just to permit the replacement in an easier way.</p>
      <p>This code has a problem: it will change any text between brackets and beginning with two or three numbers, what may not be desired. Your original code also permits undesired substitution, although it restricts the field to [<em>1-3</em>x].</p>
      <p>As this is a stylistic set, the user probably will apply it throught a character style. So, he/she will hardly get undesired substitutions. If this is an issue, you can adopt another standard to indicate indexed numbers (as two brackets instead of one) and reduce to near zero the possibility to get wrong results.</p>
      <p>[I have no time to test this code now, but I plan to do this soon.]</p>
