    		sub bracketleft eight' @figures bracketright.square by eight.multiple;<br>
    		sub bracketleft nine' @figures bracketright.square by nine.multiple;<br>
    	} duo_3;<br>
    	lookup duo_4 {<br>
    		sub bracketleft' @figures @figures bracketright.square by bracketleft.square;<br>
    	} duo_4;</p>
    <p>	lookup trio_1 {<br>
    		sub bracketleft @figures @figures @figures bracketright' by bracketright.square;<br>
    	} trio_1;<br>
    	lookup trio_2 {<br>
    		sub bracketleft @figures @figures zero' bracketright.square by zero.multiple;<br>
