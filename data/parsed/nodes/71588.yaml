    html: |-
      <p>Frode, I don't know why Word acts in a different way. It may be doing a 'blind' substitution (this is a suppostion, I'm at my job now and cannot test this):</p>
      <p>After user types [X, OT engine already finds the third case from the code and do the replace action. User follow typing XX but the OT engine does not understands the text is [XXX now and remains with the substituion already made.</p>
      <p>I <strong>guess</strong> this is not an issue to InDesign because it handles GREP styles and paragraph composer, so the text is always under evaluation by the program. Word seems not to go so far.</p>
      <p>If this is the situation, the code needs to be changed to be Word-compatible. So, the solution is to write a longer code like yours first try. The schema is<br>
      <code><br>
      [XX<strong>X</strong>]<br>
      [X<strong>X</strong>X]<br>
      [<strong>X</strong>XX]<br>
      [X<strong>X</strong>]<br>
      [<strong>X</strong>X]<br>
      [<strong>X</strong>]<br>
      </code><br>
      To avoid Word to replace [X and mess up things, the code needs to find the whole situation, including the bracketright.</p>
      <p>I'll come back to this later, probably this night, and then post results here.</p>
