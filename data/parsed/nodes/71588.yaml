    html: |-
      <p><cite>Why you chose to ignore the bracketright until the end?</cite></p>
      <p>Because with bracketright you have more situations to replace and have to declare all of them:<br>
      <code><br>
      [XX<strong>X</strong>]<br>
      [X<strong>X</strong>X]<br>
      [<strong>X</strong>XX]<br>
      [X<strong>X</strong>]<br>
      [<strong>X</strong>X]<br>
      [<strong>X</strong>]<br>
      </code><br>
      While ignoring the bracketright you reduce the situations:<br>
      <code><br>
      [XX<strong>X</strong><br>
      [X<strong>X</strong><br>
      [<strong>X</strong><br>
      [<strong>X</strong>]<br>
      </code><br>
      And the code also becomes smaller (as you ommit bracketright from it).</p>
