      <p>Frode:<br>
      <em>From my client: “when I change the first number, the whole intelligence is lost and I have to start again with [….]. This does not happen in InDesign, obviously MS Word is acting different.” Any idea why this happens?</em></p>
      <p>The Microsoftian logic: "We are one of the creators of the OpenType format, therefore we will not support it. Ok, ok, we are pulling your leg, we *will*, but we shall make it weird and unpredictable".</p>
      <p><em>my font only contain figures</em></p>
      <p>So why complicate things so much? Especially as you use a stylistic set. I've created  a very simple code and it works in Worn 2010. Here it is:<br>
      ___</p>
      <p>@cyfry = [ zero one two three four five six seven eight nine ];</p>
      <p>@cyfry.mono = [ zero.mono one.mono two.mono three.mono four.mono five.mono six.mono seven.mono eight.mono nine.mono ];</p>
      <p>@cyfry.multi = [ zero.multi one.multi two.multi three.multi four.multi five.multi six.multi seven.multi eight.multi nine.multi ];</p>
      <p>feature ss05 {<br>
      ### hacks for MS Worn 2010</p>
      <p>lookup cyfry.kwad1 {<br>
      sub @cyfry by @cyfry.mono;<br>
      } cyfry.kwad1;</p>
      <p>lookup cyfry.kwad2 {<br>
      sub bracketleft by bracketleft.simple;<br>
      sub bracketright by bracketright.simple;<br>
      } cyfry.kwad2;</p>
      <p>lookup cyfry.kwad3 {<br>
      sub @cyfry.mono' @cyfry.mono by @cyfry.multi;<br>
      } cyfry.kwad3;</p>
      <p>lookup cyfry.kwad4 {<br>
      sub @cyfry.multi @cyfry.mono' by @cyfry.multi;<br>
      } cyfry.kwad4;</p>
      <p>} ss05;<br>
      ___</p>
      <p>and <a class="freelinking external" href="http://www.avenned.org/litterae/indexednumerals.avi" rel="nofollow">a short presentation</a>.</p>
      <p>.</p>
