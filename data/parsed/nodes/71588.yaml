      <p>This seems to require, that you select the strings, that you want to change, but not the whole text, because otherwise all figures would be substituted. As an additional feature it may be senseful, if Word 2010 has no problems with that. But the class @cyfry (or @figures) is needed only, if the figures from that class are intended to be used. So one could ask, why the font contains standard figures, but not only the mono and the multi figures and their inverse counterparts or two fonts, one with the mono and the multi figures and one with their counterparts or four fonts, in which all figure types are split.</p>
      <p>And if your code works in Word 10 as an addition, this also should work, shouldn’t it?:</p>
      <p>feature ss06 {<br>
      ### hacks for MS Worn 2010?</p>
      <p>lookup cyfry.kwad1 {<br>
      sub bracketleft @cyfry' bracketright by @cyfry.mono;<br>
      } cyfry.kwad1;</p>
      <p>lookup cyfry.kwad2 {<br>
      sub @cyfry by @cyfry.multi;<br>
      } cyfry.kwad2;</p>
      <p>lookup cyfry.kwad3 {<br>
      sub [bracketleft bracketright] by [bracketleft.simple bracketright.simple];<br>
      } cyfry.kwad3;</p>
      <p>} ss06;</p>
      <p>For the case, that Frode’s client wants to use the ss features, he also could select the text after reediting it and turn the features of and on. Maybe there is a keyboard shortcut in Word.</p>
      <p>My Media Player does not show your presentation, although it normally supports the format "avi". But there can be dozens of explanations for that.</p>
