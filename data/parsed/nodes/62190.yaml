    html: <p>I know a design studio that is doing just fine running 10.5 on <a href="http://www.psystar.com/">Psystar Mac clones</a> and saving a bundle by not buying Apple’s overpriced, overdesigned hardware. I will give Apple some credit—the iMacs are pretty solid and generally much more reliable than the Apple pro laptops, but they aren’t worth what they cost unless you really care about the aesthetics.</p>
