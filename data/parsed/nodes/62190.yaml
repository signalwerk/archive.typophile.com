      <p>I know this is [still] off-topic, but a heads-up for people wanting to buy an iMac now, know that there are some problems with the new 27" model. I just had my 2-day-old machine exchanged (a failing graphics adapter, and more), and the new one just went black and doesn't boot anymore. :-(<br>
      I'm not saying don't buy an iMac, but do read up on experiences before you buy, unlike me. Google finds many things. Bah.</p>
