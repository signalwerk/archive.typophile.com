      <p>I think you'd be fine with an iMac. They're super powerful these days and can handle pretty much anything.</p>
      <p>I wouldn't recommend the Psystars at all. They're currently in the middle of lawsuit with Apple, and I believe they recently filed chapter 11. Aside from the fact that the company might not be around for long, there's no guarantee that a future software update from Apple couldn't render the machine useless.  (plus, as a designer, I'd hope you really care about aesthetics.)</p>
