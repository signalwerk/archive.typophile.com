      <p>Just recently, <a href="/wiki/Chester%20Jenkins" class="freelinking" rel="nofollow">Chester Jenkins</a> of <a href="/wiki/Village" class="freelinking" rel="nofollow">Village</a> released a typeface <em>inspired by</em> Caslon Italian called <a class="freelinking external" href="http://vllg.com/Village/Arbor#panel=poster" rel="nofollow">Arbor</a>. </p>
