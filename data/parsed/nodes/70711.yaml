      <p>Graphic designer/type designer <a href="/wiki/Paul%20Barnes" class="freelinking" rel="nofollow">Paul Barnes</a> of <a href="/wiki/Commercial%20Type" class="freelinking" rel="nofollow">Commercial Type</a> also have a revival named, after the original: <a class="freelinking external" href="http://moderntypography.com/Typedesign/Classics/CaslonItalian/index.html" rel="nofollow">Caslon Italian</a>. It was originally drawn by William Caslon, but didn’t get as much attention as his other more famous designs.</p>
      <p><a class="freelinking external" href="http://paulshawletterdesign.blogspot.com/2010/01/caslons-italian-by-james-clough.html" rel="nofollow">This</a> blog post by Paul Shaw mentions the two and also a third by <a href="/wiki/Justin%20Howes" class="freelinking" rel="nofollow">Justin Howes</a> that wasn’t released before he passed away. Last time I checked, Caslon Italian, wasn’t available commercially so I think your only option is Slab Sheriff. The original smokeproofs/punches (I’m not sure what he refers to by <em>smokeproofs</em>) are available at the <a class="freelinking external" href="http://stbride.org/library" rel="nofollow">St. Bride Library</a> and I believe there is some connection to <a class="freelinking external" href="http://www.stbridetype.com/" rel="nofollow">St. Bride Type</a> (edit: yes, it’s run by Paul Barnes). I’ve also seen some digital samples of the original proofs online, but I couldn’t find the link now.</p>
      <p>Here’s the short blurb Barnes wrote on his website about Caslon Italian:<br>
      <em>The Italian marks one of the stranger episodes in the typefounders experimentation in the early 19th century. Reversing the fatface’s stress, so thins become thicks, and thicks become thins, creates a unusual effect. Caslon introduced them in 1821 and the punches remain in St Bride library. Unlike the other styles, Italian, did not attain widescale success, and most foundries did not copy Caslon’s lead. </em></p>
    html_clean: |-
