      <p>Very cool!</p>
      <p>This reminds me of the philosophy behind the Computer Modern family of TeX fame (or infamy, if you've read a few too many research papers set in it!), where the METAFONT source files are governed by 62 parameters controlling various widths and heights and so forth. I seem to recall reading that Knuth et al. even made the serif, sans and monospace all derived from the same basic structure, simply by changing around the parameters to delete serifs and make all widths equal.</p>
      <p>Awesome to see such a concept presented in an interactive, real-time manner.</p>
    html_clean: |-
