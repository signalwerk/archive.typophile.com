      <p>"about time"?</p>
      <p>I think it is a safe bet you are unfamiliar with Ares FontChameleon. Over 15 years old now, and was very much along these lines in its capabilities.</p>
      <p>(Adobe bought Ares because its compact "font descriptors" could be used to cram more fonts into limited printer ROM space, back in the day. FontChameleon-compressed ROM fonts were a standard feature of PostScript 3 when it first shipped, though I believe Adobe eventually abandoned the technology for new devices. I found it much more interesting for its original purposes, myself!)</p>
