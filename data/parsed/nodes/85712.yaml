    html: |-
      <p>Yes, that was a common assumption in the usual retail markets, but no, it was all about PostScript font compression. The type group was relatively uninvolved in the decision except in the aftermath of helping proof the new fonts and to some degree sorting out some of the end-to-end implementation issues.</p>
      <p>From a fonty perspective, PostScript 3 in 1997 was a bit of a “perfect storm.” Adobe changed a bunch of things relating to fonts all at the same time: ROM fonts having to be coordinated with TrueType fonts and not just Type 1, supporting CE encoded fonts (both TT and T1), and the Chameleon (Type 14) font compression format in ROM. All these things interacted, and even if some seemed fine by themselves, the implementations had to be compatible....</p>
      <p>Cheers,</p>
      <p>T</p>
