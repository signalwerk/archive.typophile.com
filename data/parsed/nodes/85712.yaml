    <p>Some time ago I found a website where a young folk from France was presenting his awesome (work in progress) software. This application could add serifs and manipulate them as well as font weight and x-height so easily it left me breathless. Just with a click.<br>
    The thing is, I absolutely cannot remember the website address. Or the name of the projecy. Or anything useful to try a search on google.<br>
    I hope someone here has heard of it!<br>
    Tx</p>
