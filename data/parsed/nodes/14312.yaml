    <p>Hi,</p>
    <p>I would like your opinion on what's "the best" lightning strike font around. By lightning strike I mean very angular, electrocuted letters, mimicking the movement of a lightning. Think 70's disco music or 00's "electro clash" record sleeves...they use this style a lot, but I was unable to find something as of yet.</p>
    <p>Thank you so much! BTW, this site rules.</p>
    <p>Have a nice day,<br>
    Geleon</p>
