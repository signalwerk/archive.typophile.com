  html: <p> Trying to ID the house fonts for the current design of US Esquire, as well as the Main Sans Serif of US GQ under Woodward. Sorry I dont have any scans. Im aware that both these are probably custom drawn, If anyone has any information on their origins, It would be most appreciated. <br> <br>Best, <br>Jeremy. </p>
