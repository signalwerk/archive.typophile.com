    html: <p> Yes, that's them. Esquire uses my "Mercury Display" typeface, as well as Tobias Frere-Jones' slab serif, formerly known as "Strada" (Albert Pinggera just released a design by the same name, so we're looking for a replacement.) <br> <br>The GQ face is indeed Gotham, also by Tobias. You can follow the link above. <br> <br> <br>Regards,  Jonathan </p>
