    date: 2002-09-02T06:11:00
    date_raw: 2 Sep 2002 — 6:11am
    votes: null
    html: <p>I haven't seen a copy of Esquire recently, but last I knew they were using Jonathan Hoefler's Mercury for their serif text face and some heads. For sans, I think they've been using a fair bit of Frutiger's <a href="http://www.myfonts.com/FontFamily4514.html" target="_blank"> Vectora</a>.  <br> <br>Neither have I seen GQ recently, so I may be mistaken, but I believe that they've been using a version of HTF's <a href="http://www.typography.com/catalog/gotham/index.html" target="_blank"> Gotham</a> for their main sans. <br> <br>Someone who has the magazines at hand (or Jonathan) can confirm. <br> <br>-- K.</p>
