      <p>You could simulate the lonely planet logo lettering with some editing of either <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.117457.0.1&amp;attributes.sampleSize=48&amp;sampleText=lonely+planet&amp;sampleSize=32" target="new">Blippo Black</a> or <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=5&amp;displayfontid=EF.6453.0.0&amp;fontRendererText=lonely+planet" target="new">Pump</a>, mostly to tweak the 'e', close up the 'a' &amp; 'p', and fix the tail of the 't'.</p>
      <p>- Mike Yanega</p>
