    html: <p>Jared,  <br> <br>I did indeed "typovangelize." It started with me earnestly insisting "No, no! Typo<i>phile</i> not typo<i>philia</i>!" Once that was cleared up we talked about the site briefly and I urged him to check it out. It turns out he used to run a print shop and now has the entire thing (three presses and who knows how many tons of type) in storage. He does AutoCad now. <br> <br>We discussed about the possibility of him starting up again or deciding to sell the equipment. A good friend of mine bought that press that was posted on typographi.ca earlier this year (I seem to be quite the hook-up artists), so we talked about that for a bit too. <br> <br>Of course, I don't go anywhere without a stack of self promo books, so I gave him one of those and wrote your URL on the inside front cover. (I feel it's only right that I split my commission on hos memebrship with Graham, since his shirt was the catalsyt for the whole interaction. <img src="http://www.typophile.com/forums/clipart/happy.gif" border="0">) <br> <br>Speaking of, congrats Mr. Hicks, on winning the contest. </p>
