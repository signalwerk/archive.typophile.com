  html: <p>So, I was wearing last year's Typophile Tee at a local coffee shop last night (Farley's for those of you in San Francisco) and a guy came up to me and said, "Why would are you wearing a California Job Case on your chest?" I was floored. It's the fist time since I've been wearing this shirt that someone actually knew what it was (my desiger friends of course recognize it in general, my students, sadly, do not). <br> <br>I've had many comments on the shirt, including "nice shirt, I love Mondrian," but that was the first time the design has been "outed." I thought I'd share, on the eve (I think) of the new shirt being announced.  <br> <br>Hopefully it gives Graham a little tickle...</p>
