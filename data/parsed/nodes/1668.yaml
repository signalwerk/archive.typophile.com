    votes: null
    html: <p>"Over the years printers have believed that the California case was devised to facilitate moving type fonts in single cases from East to the West during the California gold  rush. Prior to this time text faces were stored in a pair of cases - the upper and the lower. <br> <br>.....In an effort to find the true background of the California case, Lewis A. Pryor...began a long study..." <br> <br>Fred Williams, 1992, type &amp; press <br> <br>===== <br> <br>[do you want to hear the  story/study? <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">] <br> <br> <br> <br>David Hamuel <br> <br></p>
