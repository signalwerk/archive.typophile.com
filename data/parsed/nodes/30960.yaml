      <p>Gee Eben, I have been doing that sort of thing too--I guess now I know I didn't invent it :-).  I always use "nu" before and after all my kerning pair tests for the same reason James mentioned above [as an example: nuvonufonurinutynu...]. To me the "nu" combination gives you a rhythm in the color of the font in question. When you print out the strings, you can either see holes if the kern is too loose or dark spots if it is too tight.<br>
      Don't forget your open and close quotes with each glyph as well. </p>
      <p>ChrisL<br>
      PS: it figures that dogonne James would have been doing this sort of thing for 15 years :-)</p>
