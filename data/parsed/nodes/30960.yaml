      <p>Yquem is a wine-producing region in France. I've actually seen a label of it in<br>
      a catalog, set in Minion, which I could tell doesn't have a "Yq" kern, so it did<br>
      matter (well, as much as type ever can I guess). BTW, Ypres is a famous WWI battlefield (featured among other places in a Monty Python skit), but of course<br>
      as a rule "Yp" needs less kerning than "Yq".  :-)</p>
      <p><a href="http://en.wikipedia.org/wiki/DX" title="http://en.wikipedia.org/wiki/DX">http://en.wikipedia.org/wiki/DX</a></p>
      <p>That said, brute force is generally for pack animals. When I go crazy with kerning<br>
      (like I did with Mana, which has ~1500 pairs, a high amount considering it's just a<br>
      plain ASCII encoding) I prefer calling it "exceptionless" kerning. :-)  But it's still not<br>
      brute force, since it relies on lateral profile divergence, not merely being there.</p>
      <p>hhp</p>
