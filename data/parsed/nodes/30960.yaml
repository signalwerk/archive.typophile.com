      <p>I'm just programming a small PHP-Script, where you can enter the characters you want for lowercase, uppercase, smallcaps and figures, as well as "in between strings", so you don't have to do this with manual work or search and replace. They are combined against each other, with the in-betweens giving the spacing/kerning-context.</p>
      <p>So you can enter "a,b,c,d,..." + in-between "minimum", and get:<br>
      minimumaaminimumabminimumacminimumadminimumae...</p>
      <p>It will be ready for tomorrow or the day after, and it's not very sophisticated, but you can use it and configure it the way you want (which is specially useful for the smallcaps, as you may want to import the generated strings to fontlab, fitting your names for the SCs there).</p>
