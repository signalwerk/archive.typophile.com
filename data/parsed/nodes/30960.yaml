      <p>Eben: it would be a PHP-script, running on a (my) webserver, and giving you a generated textfile in your browser window. You can copy it where ever you want afterwards. Most of the time you want to copy it to fontlabs metrics window I guess, or to indesign, to get a print from it.</p>
      <p>At the moment I'm thinking about a problem with smallcaps:<br>
      In HTML, special characters need to be adressed with a number. For example, Hebrew letter Qof would be &amp;# 1511; (without the space in between).<br>
      But there are no HTML-entities for characters placed in the PUA, so I can not display them in the browser (or does anyone here know how I can access PUA characters or in general unicode values with HTML textencoding? That would be great for a preview in-browser.)</p>
      <p>For using with Fontlab, this is no problem: You would want them named in a FL-compatible way anyway (like "/A.sc,/B.sc,/C.sc, ...") and past this to fontlab.</p>
      <p>But if you want to get this to Indesign, you have a problem, because Indesign of course does not interpret "/A.sc" as "show the small caps A".<br>
      Anyway: If your font is as far as you already have opentype scripting for small caps implemented, you can just get the "aa" or "Aa"-combinations, take them to indesign and active small caps or all small caps, and you get what you want.</p>
