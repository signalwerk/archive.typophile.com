      <p>Thomas,<br>
      Here is the situation I am talking about. This has happened to me using both InD CS1 and InD CS2 (I have never owned the "way back" InD 2.0):<br>
      Using a .otf font where small caps are produced for extended Latin (CE), if I have text in lowercase CE diacritics text and apply the "Smallcaps" feature from InD CS, al is well and the glyphs convert to their proper smallcap form just as expected. If I now change the font to a new .otf font which still has the needed glyph set, all is fine and as expected. The problem comes if I begin by using the glyph pallette in the first place to select the smallcaps CE glyphs with diacritics directly from there, when I change the font, unless the glyphs are in the same order and number on the glyph pallette, the smallcaps glyphs change to whatever is in that location on the new font. For instance, an Omacron smallcaps might change to an Ecircumflex smallcap or whatever is in that location. This only occurs when the glyph is initially selected by using the glyph palette and changing fonts. The small caps don't have a standard unicode number so how is InD going to know what it is?</p>
      <p>ChrisL</p>
