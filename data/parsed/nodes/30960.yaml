      <p><cite>The small caps don’t have a standard unicode number so how is InD going to know what it is?</cite></p>
      <p>When you insert a glyph via the glyph palette, InDesign is *supposed* to be storing it as the base character plus OpenType formatting - it backtracks from the glyph to figure out how one gets there, assuming it can be done. If this is failing in some cases, there's a bug. I'd be curious to see the two fonts involved so we can figure out what's going wrong.</p>
      <p>Thanks,</p>
      <p>T</p>
