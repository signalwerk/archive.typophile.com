      <p><cite>The PUA is always difficult in InD because you have to use the glyph pallette. Onece you change fonts, anything selected from the glyph palette will change unless the 2 fonts glyphs are all named and ordered exactly the same.</cite></p>
      <p>I know of no circumstance whatsoever in which InDesign notices or cares what a glyph is named.</p>
      <p>Glyph ordering only matters when InDesign falls back to glyph IDs, and this only occurs with glyphs inserted from the glyph palette when the glyph is both unencoded and not accessible by means of OT layout features from an encoded character.</p>
      <p>Now, with regards to glyph IDs, things were different way back around InDesign 2.0, but that was two (soon to be three) versions ago.</p>
      <p>Regards,</p>
      <p>T</p>
