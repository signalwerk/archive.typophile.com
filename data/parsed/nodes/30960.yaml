      Hrant, even though the tool is 'dumb' I think it can still be used in smart ways. It is true that for may users there will be sections of dead wood. But on the other hand, I don't think that truncating the q &amp; Q section to include just a 'u' is a good idea. Not least because of Latinized Chinese ( Pin Yin ) and other non European uses of Latin glyphs. What do you think? Would you consider using a tool like this or do you already have a tool like this?</p>
