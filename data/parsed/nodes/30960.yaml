      <p>Yes JPad, I started with Kernking a couple of years ago but wanted more so I made my own. Mine uses the CE characters as well and has more text surounding the kern pairs to see how they fit in context.<br>
      It really wasn't that hard to make. I first set up an alphabet seperated by commas. I then copied the set and did various permutations of search-and-replace with the commas untill I had everything I wanted. My first experience for the concept wa from my caligraphy teacher in 1962 (Arnold Bank). He had us write "necklaces" useing the n and then the o to intersperse betweeneach letter of the alphabet. This was for training in spacing as well as writing the forms. I just carried on the concept many years later when I started designing type. I see that I am far from alone in such usage :-)</p>
      <p>ChrisL</p>
