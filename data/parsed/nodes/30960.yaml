    <p>I thought - Hey, what if I did that for letters? No doubt this is silly in comparison to using common kerning pairs informed by language frequency data. But I found it useful while working on my monospace. And it let's you look for a specific pair quite quickly, as well as letting problems 'announce themselves' to a certain extent. In any event if you find it useful - great! If you care to comment or suggest how to extend the idea for puctuation for instance, that would be interesting. I may make one for diacritics later if folk are keen. And as always if this is stupid feel free to explain why.</p>
