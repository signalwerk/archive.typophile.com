      <p>Eben,</p>
      <p>This sort of thing has been in use in our studio for at least 15 years. I know URW used this as well as ITC (where I first encountered it.)<br>
      The one thing you should change is your Initial Cap to lowercase set. Add a second lowercase letter to the string. Kerning a Pa is useless unless it is followed by another letter (Pal, or Pau for instance). There can be no incorrect spacing between two letters, it is only when you add the third letter that the spacing between the first two can be evaluated. </p>
      <p>As for punctuation:<br>
      ,a,b,c,d,e,f,g,h,i,j,k,l,m,n,o,p,q,r,s,t,u,v,w,x,y,z,<br>
      is as good a place to start as any.</p>
      <p>James</p>
    html_clean: |-
