      <p>This is similar to the approach I had to take to kerning Ethiopic characters in the Nyala font for MS. Usually, I kern using actual test words, so I can see the glyphs in real-world context, but I couldn't find any word lists for Ethiopic languages. So I resorted to this kind of table approach, using one of the more symetrically shaped Ethiopic syllables, ዘ, as a control glyph and kerning classes based on left- and right-side shape:</p>
      <p>ዘዘሀሀሀዘዘ<br>
      ዘዘሁሀሁዘዘ<br>
      ዘዘሂሀሂዘዘ<br>
      ዘዘሃሀሃዘዘ<br>
      ዘዘሄሀሄዘዘ<br>
      ዘዘህሀህዘዘ<br>
      ዘዘሆሀሆዘዘ<br>
      ዘዘለሀለዘዘ<br>
      etc.</p>
      <p>In the end, I had the equivalent of 63,105 kern pairs.</p>
    html_clean: |-
