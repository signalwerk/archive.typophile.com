      <p>So here is a first quick&amp;dirty-version of it:<br>
      <a href="http://www.gestaltungssache.at/buchstaben.php" title="http://www.gestaltungssache.at/buchstaben.php">http://www.gestaltungssache.at/buchstaben.php</a></p>
      <p>It takes the different strings entered, and intersects them, combining each with each. I only implented the comibinations that might be useful for type testing (AA, Aa, aa, A/A.sc, /A.sc/A.sc and figures).<br>
      You can change the strings to alter the defaults.</p>
      <p>To get an optical reference, you can enter "fills" in between, as Chris does with his "nu".</p>
      <p>You can also define a Font for display in browser, but this won't be too useful i guess, as browsers don't kern. But theoretically, you could enter your fontname in the field (be sure it is installed and to get the spelling exactly).</p>
      <p>You can see the source code here if you want to know what it does exactly, or if you want to chase for bugs.<br>
      <a href="http://www.gestaltungssache.at/buchstaben.txt" title="http://www.gestaltungssache.at/buchstaben.txt">http://www.gestaltungssache.at/buchstaben.txt</a></p>
      <p>Try it, tell me if it's useful or what could be improved, added, left out, ...  Are the default strings okay, or did I miss something basic?<br>
      Is the output format okay?</p>
      <p>Sebastian</p>
