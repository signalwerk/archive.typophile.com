    html: <p>and then there's always ito by <a href="https://web.archive.org/web/20141114112004/http://www.kinemamoon.com/" rel="nofollow">kinema moon</a>... in fact, there's some link between kinema moon and M/M paris that I want to get to the bottom of someday when i have more time. this is not the only bjork typeface that MM Paris and KM have that parallel each other. I mean, check the typeface on her <a href="https://web.archive.org/web/20141114112004/http://www.amazon.com/gp/product/B00006F852/ref=ase_mmparis/002-3726800-5910427?s=music&amp;v=glance&amp;n=5174&amp;tagActionCode=mmparis" rel="nofollow">Greatest Hits</a> and then check out Sakura by KM... hmmm... something fishy's goin on here...</p>
