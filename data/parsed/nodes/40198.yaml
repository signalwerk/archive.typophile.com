    <p>1) If you were going to buy "loads and loads" of great OpenType fonts tomorrow, what style of fonts would you "most-like" to buy?<br>
    <em>I don't mind as long as somebody else is paying.</em></p>
    <p>2) Shouldn't we be making fonts that have animated characters? I mean, it's the bleeding 21st century, where are the "fully animated" script fonts that scrawl beautiful handwriting from the late eighteenth century, complete with ink effects, before your very eyes? How long will it take to develop the technology? How long will it take type designers to make one "fully animated" font, most-like?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/melon_wrangling_4785.jpg"></div><p></p>
    <p><em>I don't mind as long as somebody else is paying the development cost. Yes that would be the coolest thing evarr, and I've been wondering if it can even be done. But also try---handing out fifty dollar notes to grateful strangers.</em></p>
    <p>3) If OpenType supports the animated font format of the future, at the product launch which witty and entertaining "household-name" type designers would you "most-like to have" trading goofballs at the opening ceremony?</p>
    <p><em>I don't mind as long as somebody else is paying, and David Berlow and Chris Lozos are there because I really want to meet them!</em></p>
    <p>4) What's with the "I don't mind as long as somebody else is paying" thing? What's up with that Jim?</p>
    <p><em>It was the basis for a radio spot I helped write.</em></p>
    <p>5) If you were going on a "fun and interesting" holiday tomorrow, what destination would you "most-like" to go to?</p>
    <p><em>I don't mind as long as somebody else is paying.</em></p>
    <p>6) If you won a free trip to the moon in a gleaming metal spaceship, which interesting and talkative typophile member would you "most-like" to go along with you?</p>
    <p>I don't mind as long as somebody else is paying. Haley, Linda, Sharon, Tiffany, Hrant, Ricardo. No pets.</p>
    <p>j a m e s</p>
