      <p>Imagine all the extra production staff and artists you'd need to hire to make a "fully animated feature font" that runs for 90 minutes! In the future there will be more than movies made about fonts --- "feature fonts" will rival movies for audience share. </p>
      <p>The task of developing an animated font format is comparable to the difficulty experienced by a small cat rolling a large watermelon ashore on the Ivory Coast.</p>
      <p>Typography will become a performance art and typographers will become more like actors. The really experienced type designers will have to be like film directors.</p>
      <p>"mew"</p>
      <p>j a m e s</p>
