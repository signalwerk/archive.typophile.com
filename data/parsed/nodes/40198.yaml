      <p><strong>Sample Motion Picture Font Quiz</strong></p>
      <p>1) What features would you most like to see in the animated font format of the future?</p>
      <p>2) Should motion picture fonts have sound? Maybe that will come later.</p>
      <p>3) In the early days of silent motion picture fonts, Ray Larabie had big hits with which font comedies?<br>
      (a) The Bold Rush<br>
      (b) A Funny Thing Happened on the Way to the Font Forum<br>
      (c) Take The Money Fonts and Run<br>
      (d) Eth Girls are Easy</p>
      <p>4) Which prodigiously talented female lettering artist of our time would you have make The Caron Carpenter Story into a feature length font?</p>
      <p>5) Which legendary type designers would you sign for The Caslons of War? My money is on Gerald Giampa to direct, with Sumner Stone on second unit and Brian J. Bonislawskyi directing special visual effects.</p>
      <p>6) The Caslons of War won oscars for which categories?<br>
      (a) Least Contrived Art Direction<br>
      (b) Best Supporting Serif<br>
      (c) Sturdiest Crossbar in a lead role<br>
      (d) Worst Ink Detail in a Historical Font</p>
      <p>7) Most of the money in motion picture font production wiil be in commercial lettering capable of block-buster style special effects and tranformations. Unlike feature length fonts, advertising lettering will only run a few minutes and be cheaply produced from stock libraries. The lucrative Adobe stock libraries are culled from which feature length fonts?<br>
      (a) Futura Cop<br>
      (b) The Ball Terminator<br>
      (c) Children of the Kern<br>
      (d) Hrant &amp; the Masters of the Univers</p>
      <p>8) When riots brought shooting of the first 3D feature font Dial M for Murga to a halt, the font's director Harold Lohner was heard to mutter which exasperated turn of phrase?<br>
      (a) Oh brother where art Downer?<br>
      (b) Die deresis die!<br>
      (c) Please don't eat the accents.<br>
      (d) Whatever happened to Baby J?</p>
      <p>9) Which gritty motion picture font about the big apple won the 2034 academy award for Best Inktraps?<br>
      (a) Manhatten(schweiler)<br>
      (b) The Side Bearings of New York<br>
      (c) Font Apache the Bronx<br>
      (d) The Purple Rows of Biro</p>
      <p>10) I've used up two fonty-flavoured film titles on one font already. The ill-fated Citizen Kern had to be rechristened Midnight Kernboy to avoid trademark conflict with Zuzana Licko's Citizen. Name one other font christened after a motion picture film that had to be remonikered because of trademark conflict with Berthold's City font.</p>
      <p>j a m e s</p>
