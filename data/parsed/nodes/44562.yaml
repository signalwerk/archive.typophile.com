  html: |-
    <p>This is the text on a monument ("Keisarinnan kivi")  commemorating the Russian Empress Alexandra's visit in 1833.<br>
    The hyphens in it are in an unusual place, never seen anything like this anywhere else.</p>
    <p>PÄÄ-KAUPUNGISSA (nowadays we write it together without hyphen)</p>
    <p>I suppose the months were treated like this to avoid repeating the word kuussa<br>
    Touko-kuussa<br>
    Kesä-kuussa</p>
    <p>Was this the way to deal with hyphens in 1830's, or is this an odd one out?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/alexandra_5628.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/keisarinnan_kivi_3712.jpg"></div><p></p>
