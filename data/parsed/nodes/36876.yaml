      <p>OT is the way forward, and as far as I am concerned it's TTF based. These fonts are reliable, perform well and when hinted look good on the screen. Although that also depends on OS and the way apps render the type. My other standard mantra is Unicode, Unicode, Unicode...</p>
      <p>Bruno Maag</p>
