      <p>If you're talking about resource forks you are still pre OSX. Only the old Mac OSs needed resources. On OSX there are a few apps, Quark 6/6.5 and Freehand notably that appear to have issues with flat font files as they expect some resources to float about. Other than that I am not aware of programs having problems with flat fonts.</p>
      <p>Under the old Mac OS you did need Mac and PC specific fonts as you rightly pointed out, Mikey. </p>
      <p>Unfortunately, Apple has decided to go it alone again, with the dfont format. This format supports Apple's own AAT system, their way of doing OT. But they also support OT, so no-one I know really cares about dfonts (they are, of course, not cross platform).</p>
      <p>OT is the way forward, and as far as I am concerned it's TTF based. These fonts are reliable, perform well and when hinted look good on the screen. Although that also depends on OS and the way apps render the type. My other standard mantra is Unicode, Unicode, Unicode...</p>
      <p>Bruno Maag</p>
