    html: |-
      <p>Hi there:</p>
      <p>And a side point: Don't buy opentype where the designer/foundry has not integrated/automated the small caps, old-style figures, quaint ligs, or other features. You have to pay more than Type 1 but it will behave just the same and do nothing to ease your work flow. From my point of view its way to extract your dollars. If you type waffle and ffl does not switch in automatically- you need ask for your money back. </p>
      <p>Here is an example:<br>
      <a href="http://www.fontshop.com/fonts/downloads/psyops/aquamarine_superset_ot/" title="http://www.fontshop.com/fonts/downloads/psyops/aquamarine_superset_ot/">http://www.fontshop.com/fonts/downloads/psyops/aquamarine_superset_ot/</a></p>
      <p>But don't be confused a list like this:<br>
      <a href="http://www.linotype.com/1313/pmncaecilia-family.html" title="http://www.linotype.com/1313/pmncaecilia-family.html">http://www.linotype.com/1313/pmncaecilia-family.html</a><br>
      This font has everything integrated into the font but you have to sort through a messy list and pay special attention to the feature key telling you what's inside the font.</p>
      <p>Most of the hinted opentype fonts use Truetype outlines so don't be against truetype flavored opentype if you see it. But this does not mean that all TrueType flavored opentype fonts are hinted either.</p>
      <p>My opinion: There are others too but Adobe and FontShop are excellent opentype programmers :-)</p>
      <p>Mike Diaz :-)</p>
