      <p><cite>I usually buy OpenType if I can.</cite><br>
      I do so, too.<br>
      However, sometimes I just don’t have a use for any of the advantages an OpenType version would bring; e.g. when licensing a one-weight font to meet a customer request and simply get the job done.<br>
      Concerning those situations—where I really have no need for cross-platform performance or single-file fonts, or where the font’s nature doesn’t demand neither 64K glyphs nor Unicode encoding<br>
      options for advanced typographic features—what format would you advice to license?</p>
      <p>I’m on Mac OSX, and I’ve noticed that a lot of its system fonts actually are TrueType.<br>
      Is that preferable over Type 1? Most often, foundries offer a pricey OT along with more economic TrueType and PS Type 1. What confuses me: the former typically are advertised as being made ‘for Windows’ and the latter ‘for Mac’. Does this (still) refer to Mac OS ≤9? Are there any drawbacks with TrueType?<br>
      Thanks, F.</p>
