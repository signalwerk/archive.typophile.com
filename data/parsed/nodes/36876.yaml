  - id: 225465
    user: 9913
    date: 2007-09-07T14:46:00
    date_raw: 7 Sep 2007 — 2:46pm
    votes: null
    html: |-
      <p><cite>Some printers I hear from, even really high-end shops, don’t want anything to do with Truetype fonts, and I still see production checklists from design firms that have “Make sure not Truetype fonts were used” as a step in preparing jobs for press.</cite></p>
      <p>I think this is a myth that has almost outlived it's usefulness. However, if you look at a lot of the "free font" websites and "10,000 font" CDs floating around, Windows TT is a dominant format. One reason for this is that low-end, junk font creation tools can often only output this format. Note that it's not the format itself that's flawed, it's the tools and those that work with them. Often, these greymarket fonts have substantial technical flaws, and if they are abandonware, there is no vendor to get them fixed. So, a prepress person may not dislike TT for the right reason, but they may still be getting the right results. </p>
      <p>Similarly Adobe, in my option, produces some of the highest quality fonts available. They favor Postscript-flavored OpenType, which means that there are a lot of wonderful, technically superb OpenType fonts floating around. To ship these fonts, one either needs to use Adobe's Font Development tools or FontLab, both of which are actively maintained and of high quality.</p>
      <p>A few vendors, such as Microsoft, do ship high quality, heavily tested Windows TrueType fonts. In those cases, I think there is no reason to fear them. The new Vista fonts starting with "c", Calibri, Cambria, Candara, etc. are all beautiful fonts created by top designers. </p>
      <p>You might want to read up a bit on OpenType, because as Berkson said, it's a long story.</p>
