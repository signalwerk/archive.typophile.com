    html: |-
      <p>OS X will ‘eat’ any fontformat…</p>
      <p>A major difference between TrueType and Type1 is that TT has (in principle) better hinting than T1. TT is a format that combines font-outlines, screenfont and font-data. T1 has separate files for fontoutline (aka printerfront) and screenfont. Some programs depend on an extra file (FontMetrics) for the correct use of T1.</p>
      <p>Note that there are (at least) two flavours of OpenType. The typeoutlines may be based upon PostScript (T1) or TrueType (TT). OpenType is a new kind of container for all of the data needed to put a font on paper, film or a screen.</p>
      <p>Apple‘s dfont format is a superset of TrueType with an extended characterset. </p>
      <p>(Please correct me if I’ve made mistakes here…)<br>
      ___<br>
      Bert Vanderveen BNO</p>
