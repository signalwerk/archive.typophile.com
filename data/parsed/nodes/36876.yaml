      <p>Miguel, it was Bruno Steinert who mentioned this once at some Linotype Typo Technica, if I am not very much mistaken. They did some tests using different high res output devices. I don't think that there is written information but Dan Reynolds from LT might be able to shed some light on this.</p>
      <p>I don't think my simple statement - TTF are OT - is oversimplistic. What you provided is an elaborate explanation, which, of course, is quite correct. But that does not change the fact that TTF, whatever their contents, are OT. That Microsoft decided to keep naming them TTF simply maintains their strategy to provide as much backward compatibility as possible. I am making this statement because I am fighting a daily support battle for designers and (pre)press houses to understand that OTF (CFF) is not the all and only regarding OT. That Adobe managed to make OTF synonimous with OT is a marketing ploy of pure genius!</p>
      <p>Again, my second statement is not necessarily simplistic. And again, you simply elaborate on the workings. However, it is as simple as that. CFF is PostScript by another name. It still lives in the world of glyph names as opposed to pure Unicode. IMO, that is not really great.</p>
      <p>Bruno Maag</p>
