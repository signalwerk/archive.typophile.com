      <p>I think it is still not quite clear that '.ttf' files *are* OpenType. The OT font format is based on the TTF file structure. As an earlier poster pointed out, TrueType Open, has been around for more than ten years supporting the Arabic and Indic markets with features that are now marketed under the name OpenType. </p>
      <p>Also note that you can label any TTF font as .otf and they will function fine under OSX and Win 2000 (with ATM support), XP and Vista. Microsoft decided to stick with TTF to provide legacy compatibility. A TTF font will also work in Win 95 and NT. This is important as many corporates still work with NT. Unicode support is maintained in all older versions of Windows, although typo feature support will get lost. </p>
      <p>Adobe's CFF fonts (otf) are still based on the old PS technology. It is in essence a PS font with a pretty TTF wrapper around it. It's also important to understand that whilt in a TTF glyphs are accessed directly via Unicode, in a OTF font, glyphs are accessed via Unicode - PS name conversion. This is why glyphs can go missing, particularly with typo features and languages, if you do not stick religiously to Adobes PS glyph name list. No such problem with TTF.</p>
      <p>I once heard that Linotype did some performance tests with TTF and PostScript fonts and found that TTF always won the race. TTF is good. All TTF *are* OpenType. What gives it the little 'O' icon is the digital signature.</p>
      <p>Bruno Maag</p>
