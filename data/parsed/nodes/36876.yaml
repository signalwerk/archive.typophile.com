      <p><cite>Just curious, have any non-Adobe apps for general use (like Wordpad) been written to use the Avalon type system? Is there a Windows equivalent of the Typography Panel to help?</cite></p>
      <p>Avalon is now referred to as the Windows Presentation Foundation. Adobe applications handle their own font rendering--they don't use WPF for layout currently and are unlikely to do so in the future. Similarly on the Macintosh, Adobe handles text layout themselves, rather than using the features provided by the Cocoa programming interface. I'm not sure how the advanced OpenType features will be accessed, but it will make it much easier for developers to add them.</p>
