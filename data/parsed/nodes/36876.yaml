      <p><cite> This is an OS problem. I hope they fix it in Leopard. I wish it was a panacea but its not</cite><br>
      No, this is working as expected.  If you export that document to a flat Unicode text file, there is no way* to store the alternate selections, or stylistic sets, or other such features.  For this reason, OS X simply points out that you can't expect any export to be able to handle the alternates properly.  OS X has a long way to go on fully supporting OpenType, but this isn't an area I can fault them at.   Exporting from InDesign using an alternate character you'll have the same problem.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
      <p>* Unicode codes include 16 alternate selectors, but as to how those are to be interpreted is undefinied afaik in the standard.</p>
