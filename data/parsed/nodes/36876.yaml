      <p>&gt; I thought open type was a passing thing. Is it here to stay? </p>
      <p>It's actually the opposite of what you thought. All other formats are a passing thing. OpenType is the future. If you want to buy new type, OT is the best investment. Nearly any printer can use OT fonts just fine. The era of PostScript-only RIPs has passed.</p>
      <p>Regarding the cost difference between OT and TT/PS: usually it is quite small or zero if no new features are added. You do get the benefit of cross-platformability, which is a nice bonus in the long term.</p>
      <p>When there is a larger difference in price, such as in <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFonts</a> it's because, as was mentioned, the OpenType version is more than a straight conversion. Features were added to help you save time and set better type. FontShop.com now let's you see exactly which OT features are included -- see any <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_nexus_serif_ot_italic/?acs=1" rel="nofollow">Font Detail page</a>.</p>
