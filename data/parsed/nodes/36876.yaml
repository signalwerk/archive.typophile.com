      <p>The basic level of OpenType, as defined by <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>, is called “Std”. OT Std fonts are not necessarily a straight conversion of fonts from TrueType or PostScript format. They can include some features not included in legacy formats, such as built-in small caps, alternate figure styles, swashes, case-sensitive punctuation and so on. </p>
      <p>An OpenType “Pro” font is <a href="http://www.adobe.com/type/opentype/index.html#lang" rel="nofollow">defined by Adobe as a font with additional language support</a>. It adds at least an Central European character set, but may also include Turkish, Baltic, Greek and Cyrillic. <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>, <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a>, <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> and others have adopted this definition of "OpenType Pro".</p>
      <p>Some smaller foundries, on the other hand, have declined this language support definition and instead label any OT font with extra <em>features</em> as a “Pro” font. This causes some confusion when shopping for OT fonts from various sources. It's always best to examine a <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_nexus_serif_ot_italic/?acs=1" rel="nofollow">detailed specimen</a> before making a purchase. Don't rely on the font name alone.</p>
      <p>Below is an illustration of the differences between OpenType Std and Pro fonts, as defined by those larger foundries I mentioned.</p>
      <p><a href="http://www.flickr.com/photos/stewf/1353564979/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.flickr.com/photos/stewf/1353564979/" rel="nofollow"><img src="http://typophile.com/files/1353564979_21a696f0af_3602.jpg"></a></div><p></p>
    html_clean: |-
