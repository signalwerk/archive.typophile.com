    html: <p>Is it still true that the extra math involved in rendering Truetype fonts at high resolutions causes major slowdowns in RIPs, or do newer RIPs handle Truetype at the same pace they handle Postscript fonts? Some printers I hear from, even really high-end shops, don’t want anything to do with Truetype fonts, and I still see production checklists from design firms that have “Make sure not Truetype fonts were used” as a step in preparing jobs for press.</p>
