      <p>&gt; <em>I think it is still not quite clear that ’.ttf’ files *are* OpenType. [...] All TTF *are* OpenType.</em></p>
      <p>Although there's some underlying truth to these statements, they are over-simplistic and generate confusion in non-savy users' minds — in the same way that, on Windows, font files with a .ttf extension may either be displayed with a 'TT' icon or a 'O' icon. None of this helps the user understand the OpenType format any better, IMO.</p>
      <p>Back to the point. Correct is to say that the OpenType format is an extension of the (TrueType) <a href="http://developer.apple.com/textfonts/Tools/tooldir/TrueEdit/Documentation/TE/TE1sfnt.html" rel="nofollow">SFNT format</a> (, which means the TrueType format is effectively a subset of the OpenType format). The SFNT file format is based on tables. Depending on the font format (e.g. TrueType, TrueType GX, OpenType TT, OpenType CFF), <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=IWS-AppendixC" rel="nofollow">some of these tables are required, and some are optional</a>.</p>
      <p>The Windows system switches the icon of a .ttf file (to 'O') if that file contains a '<a href="http://www.microsoft.com/typography/otspec/dsig.htm" rel="nofollow">DSIG</a>' table, but this table is actually optional in the OpenType format. This means, an OpenType will still work properly even if it doesn't contain a DSIG table. Conversely, just because a given font file is assigned an 'O' icon (or has a DSIG table) doesn't necessarily mean that it contains any OpenType functionality; OT functionality is better accessed if the font file contains GPOS and/or GSUB tables, for example.</p>
      <p>By the way, some type foundries even add custom tables to their fonts. This won't necessarily break the core functionality or usability of the font as the system accessing the font data simply ignores the tables that it doesn't understand.</p>
      <p>&gt; <em>It’s also important to understand that whilt in a TTF glyphs are accessed directly via Unicode, in a OTF font, glyphs are accessed via Unicode - PS name conversion. This is why glyphs can go missing, particularly with typo features and languages, if you do not stick religiously to Adobes PS glyph name list.</em></p>
      <p>Again, there's some underlying truth here, but this definitely deserves clarification. What happens is that some systems — namely Mac OS X — rely on the glyphs' names to get their encodings, instead of using the 'cmap' table. This happens to affect only OpenType CFF fonts.</p>
      <p>&gt; <em>I once heard that Linotype did some performance tests with TTF and PostScript fonts and found that TTF always won the race.</em></p>
      <p>Can you give any significance to this statement by providing examples or some kind of substantive information? Thanks.</p>
