    html: <p>At first sight the 6 and the 9 doesn't match together. Also the D seems too high compare to the B. Some letters looks condensed (UV) some other extended (SZ). That has to be fix before to continue the typeface. The bowl of the R and the P are not in the same way. Keep going.</p>
