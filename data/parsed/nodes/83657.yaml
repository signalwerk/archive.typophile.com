    <p>I know this question may have been asked before but its not the easiest to search for an answer an Typophile requires a 4 letter minimum for search queries.<br>
    What does a "Pro" font mean exactly? I realize there are multiple language support and something about over 1000 glyphs, but I didn't know if there were other standards the family had to meet.</p>
    <p>Thanks!</p>
