    <p>so I have a client that wants to update his logo<br>
    but is hung up on having a handshake in the logo. </p>
    <p>I included a couple of RAW ideas. I just busted<br>
    apart some clipart for most and quickly made the<br>
    hands that extend into arrows. Do any of these<br>
    ideas have merit?</p>
    <p>I have done nothing with the typography other than<br>
    trying to get a feel for what might look good when<br>
    I get to that point.</p>
    <p>The client is a MS certified consultantcy called<br>
    Mutually Beneficial. Colors in the logos will be<br>
    browns and blues.</p>
    <p>I wanted to do something less trite and more<br>
    progressive. Do you guys have any ideas on how to<br>
    suggest a handshake or give the strong feeling of<br>
    a handshake without seeing two hands gripped<br>
    together?</p>
    <p>Any advice is appreciated on this one. I've been<br>
    lurking on this board for months now too scared to<br>
    ask any advice. I'm just finishing my education and<br>
    could use the help. Thanks</p>
    <p>Justin</p>
