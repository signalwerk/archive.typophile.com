    html: |-
      <p>Note:</p>
      <p>The German word "linkskursiv" (literally "left italic") was presumably used first in conjunction with the Bauer foundry typeface "Venus linkskursiv". In old German-English typeface catalogs, it was translated as "Venus reclining". For modern samples see <a href="http://www.myfonts.com/fonts/linotype/venus/venuslinkskursiv" title="www.myfonts.com/fonts/linotype/venus/venuslinkskursiv">www.myfonts.com/fonts/linotype/venus/venuslinkskursiv</a></p>
