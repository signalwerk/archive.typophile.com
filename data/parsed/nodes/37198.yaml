      <p>This isn't a great option because it only works with InDesign CS3, but we started supporting the OpenType features <code>'init', 'fina', 'isol',</code> and <code>'medi'</code> which can be dynamically applied to characters. These correspond with "initial letter", "final letter", "isolated letter" and "medial letter". It is only semi-smart, but can handle punctuation around words for example.<br>
      A more universal approach involves some complex contextual processing which is why Thomas Phinney suggested adding support for the positional forms feature.</p>
