    html: |-
      <p>Create a class that contains all glyphs that are letters (or anything else you consider to be part of a word). Then, set up a contextual substitution in which if a glyph is not preceded by a member of that class, use the alternate. </p>
      <p>Here's one way to do it. In the following code, the classes are defined thus:</p>
      <p><code>@letter</code> = any glyphs you consider part of a word;<br>
      <code>@normal_letter</code> = any glyphs that have a different form for the beginning of a word<br>
      <code>@alternate_letter</code> = the alternate versions of the glyphs in <code>@normal_letter</code></p>
      <p>The contextual substitution (to be placed in the <code>calt</code> feature):</p>
      <p><code><br>
      &nbsp;&nbsp;&nbsp;lookup beginnings  {<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ignore sub @letter @normal_letter' ;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sub @normal_letter' by @alternate_letter;<br>
      &nbsp;&nbsp;&nbsp;} beginnings;<br>
      </code></p>
