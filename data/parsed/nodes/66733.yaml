    html: |-
      <p><code>&gt; body onload="check_bg();" </code></p>
      <p>That ain't just HTML, that's calling a JavaScript function. If you check the .js file that is referenced from that page, you'll see it's a sizeable bit of code.</p>
      <p>BTW, it looks pretty suboptimal on my 27". If you do do something like this, make sure your images are large enough… but also small enough (in terms of file size) to not annoy people on slow connections, or mobile devices.</p>
