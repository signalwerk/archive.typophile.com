    <p>I believe the term is called (background liquid image) the principles are that a image/photo is place as a background image in dreamweaver, but when viewed in any browser regardless of scaling up or down stays relative to its surroundings at all times. </p>
    <p>Please see example<br>
    <a href="http://www.growmedia.ca/" title="http://www.growmedia.ca/">http://www.growmedia.ca/</a></p>
    <p>I'm told it can be done in CSS script but cant find it anywhere! Would someone be able to help on this?<br>
    This has been bugging me for a while!</p>
    <p>Cheers<br>
    ---<br>
    Joe</p>
