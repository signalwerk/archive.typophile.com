  html: |-
    <p>I’m helping one of the local newspapers with their masthead (and maybe more). The files I’ve been given for the two newspaper names (a merger) are fuzzy eps files. I’d like to find the fonts for these (though it’s possible that one of them was hand lettered, I really doubt it) so that I can recreate them. These are old newspapers from before the dawn of digital typography...I’m anxious to find out if these fonts are available digitally. On behalf of Charley, the editor, and the rest of Crawford County (proudly the poorest county in Wisconsin!), I thank you for your help and expertise!</p>
