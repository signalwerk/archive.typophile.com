    html: <p>Petr van Blokland's <a href="http://www.fontbureau.com/fonts/font_frames.tpl?cart=11002063841284133&amp;fontname=Proforma" target="_blank"> Proforma</a>. <br> <br><i>In the mid-'80s, Petr van Blokland designed Proforma for  <br>Purup, a leading supplier of forms systems. Oldstyle structure  <br>provides essential copyfit and legibility, leading ATypI to award  <br>Petr the Charles Peignot prize for distinguished typographic  <br>achievement. In 1995, Proforma was the only typeface nominated  <br>for the Rotterdam Design Award.</i></p>
