      <p>Here's the first "typeface" I designed:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMG_0003_4080.jpg"></div><p></p>
      <p>It was done for an assignment when I was studying graphic design in college in 1975 or 1976. The concept was a geometric sans based on uncial forms. The letters are 2.5" tall (not counting ascenders and descenders), drawn with a technical pen (ink) on illustration board. Some serious compass action going on there. Some of it I like, but some of it, like the uncial-style "T", makes me wince.</p>
    html_clean: |-
