    date_raw: 9 Mar 2009 — 7:26pm
    votes: null
    html: |-
      <p>Fun thread! I decided to dig up some of my really old stuff and play too.</p>
      <p>Here's one of the first fonts I ever designed, for an old <a href="http://www.nefec.org/UPM/printers/mepf80.htm" rel="nofollow">Epson FX-80</a> dot matrix printer. The basic resolution was 72 dpi, but by taking multiple passes you could amp it up. I also, of course, wanted proportional width, which was a big deal back then. I don't have an exact date, but suspect it would have been around 1984, maybe 85. It wasn't my absolute first font (that would have been making new 8x16 bitmaps for the <a href="http://en.wikipedia.org/wiki/Tandy_1000" rel="nofollow">Tandy 1000</a>, which was programmable that way), but the first for print.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dotmatrix1_5891.png"></div><p></p>
      <p>I also did a Hebrew, and got started on a shadowed font too. Oooh, special effects!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dotmatrix2_4631.png"></div><p></p>
      <p>But the first scalable font I ever designed was Zaltbommel, intended to be an industrial design, but with very open apertures so it would work in small print. My dad and I called it "Shmuro," as a kind of riff off Eurostile, before he chose the final name. As you can see, it was designed on a grid. I wrote the font editor myself, but that's not so impressive, everything was based on bitmaps at 256 to the em, and then scaled entirely in bitmap space. It looked pretty bad in large sizes. Anyway, the date on this one is "Thanksgiving Day, 1986".</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/zaltbommel_4543.png"></div><p></p>
      <p>Thankfully, I've gotten better since then.</p>
    html_clean: |-
