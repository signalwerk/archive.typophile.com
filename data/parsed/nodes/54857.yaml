      <p>my first one (called "horus") was done solely for a magazine i designed in a college course.<br>
      it was done by scanning my calligraphy and has no corrections of vectors (and i'm not saying this as a good thing). it's inspired by my favorite type style (guess what). i barely had time to correct it,<br>
      but i remember i did not want to use an existing font, and it didn't matter to me if i would be wrong, or if the font would be bad. i just wanted my on font!<br>
      the kerning of this font is heinous and abominable, i had to do it manualy in the little time i had. to this day, i still don't know how to make fonts (or kerning in font lab).</p>
      <p>here is a sample and some spreads of the magazine:<br>
