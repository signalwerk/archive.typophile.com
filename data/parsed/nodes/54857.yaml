      <p>I don't know if they would be considered monsters, but these were my first "serious" attempts at digital fonts:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/font1_4296.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/font2_3560.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/font3_6210.jpg"></div><p></p>
      <p>These are from about 1990. The first two were drawn directly in Fontographer, referencing paper sketches I did throughout the eighties. The third was traced in Fontagrapher from scans of large drawings I made about 1980. I consider them naïve. They have a lot of design and spacing issues. I learned a lot from doing them. I sometimes entertain notions of resurrecting one or more of these, but my tastes and priorities have other ideas.</p>
