  html: |-
    <p>Oh man… I just had a major blast from the past. And I have to confess that I kind of lied on Typophile. :-(  It wasn't intentional, honestly – my memory failed me. I'm not sure that constitues lying, but I'm not particularly proud of it, and I apologize.</p>
    <p>I said Ernestine is my first font. Now, while I did vaguely remember that I dabbled around a bit in Fontographer a number of years ago but quickly realized I didn't know what I was doing… I just discovered that I actually completed wonky lc, UC, and numerals, and <a href="http://groups.google.com/group/alt.design.graphics/browse_thread/thread/c4fd1f9cdcad081" rel="nofollow">put "my first font" up for crits on alt.design.graphics</a> in 2001!</p>
    <p>Kids, don't do drugs or you won't remember what embarrassing things you did eight years ago. :-|</p>
    <p>Well it looks like there was reason enough to forget this, too. What better way to atone for past sins than to show this off in all its glorious ugliness? (Feel free to point your fingers and giggle.) Thanks to WayBackMachine I just managed to retrieve an archived copy of a .ttf off my long-defunct old web site. So this is what it looks like, complete with strange unintentional overlaps, mirrored bpdq, and an "A" that took too many blue pills.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/identb_alphabet_5888.gif"></div><p></p>
    <p>I guess from now on I'll call Ernestine my "first serious font"…</p>
