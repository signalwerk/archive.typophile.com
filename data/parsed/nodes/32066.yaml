    <p>OK, guys, I need some real quick feedback from someone who hasn't been spending a week looking at the same letters.  Some quick background: I'm making a pixel version of a derivitive of the Bitstream Charter font (with IPA letters) called Charis SIL.  My version is called "Chortle".  The goal of this font is to have a font that is very easy to read on a computer screen, without using kerning (this font is being designed for older *NIX systems withour kerning in screen fonts) and preserving, as much as possible, the metrics of the printing font.  </p>
    <p>This font is a free font , available here:</p>
    <p><a href="http://www.samiam.org/Chortle" title="http://www.samiam.org/Chortle">http://www.samiam.org/Chortle</a></p>
    <p>I have three basic ideas for the pixmap letters.  In the attached file, you will see one paragraph in the first style, one paragraph in the second style, and finally one paragraph in the third style.  This cycle is repeated for the next three paragraphs.</p>
    <p>The text is public domain text from the Voice of America.</p>
    <p>Which of the three styles is the most readable style?</p>
    <p>- Sam</p>
