      <p>OK, just making sure you guys agree with what I found in my testing.  My reading tests did find these typefaces hard on the eyes after half an hour of reading, so I made some improvments to them by removing most serifs (serifs just don't work at low resolutions)</p>
      <p>hrant and Cuttin Shapes:  Thank you for your comments.  The correct way to criticize something is to say <strong>why</strong> it doesn't work.  For example "none of them are good enough" doesn't help (and, yes, I agree with you, and have made improvments).  It's better to say "These fonts don't work because the letters have too many serifs that are hard on the eyes".  Oh well...ever since the days of Usenet, internet forums have had problems with having a low signal to noise ratio.  Please don't take this as a personal insult...that's the other problem with internet forums, when people take things too personally.</p>
      <p>Again, I'd like to thank everyone for their help and will continue testing these fonts by reading large amounts of text with them.  I'm right now reading books that you can download for free here with this font:</p>
      <p><a href="http://www.baen.com/" title="http://www.baen.com/">http://www.baen.com/</a></p>
      <p>The best way to test the readability is to read a lot of text with a given font.</p>
      <p>[Edit: Finished the last sentence]</p>
