  html: |-
    <p>Hey all,</p>
    <p>Anyway to "lock" the characters present in a text box so that erroneous keystrokes don't add extra characters? I find that I somehow manage to add 'h's all over the place when kerning.</p>
    <p>Thanks!</p>
    <p>EDIT: This would be different than just simply locking the object—one would still be able to interact with the type with regard to spacing and placement but additional letters and numbers cannot be added.</p>
