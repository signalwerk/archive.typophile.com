      <p>Design/approval by committee – words to strike dread into any designer’s heart:)</p>
      <p>I am guessing, by their original logo and the strapline, that each ring or circle should link with both others, rather than hazard symbol think venn diagram, avoiding an obvious Olympic look, although option 1 does to some degree represent that. It does look less than impactful next to the biohazard symbol and I think you will have to consider the weight, on a business card or at small scale it could disappear. The ERS kerning needs to be sorted out. It also appears you are doing this in Photoshop, in order to maximise its usefulness you will need to create it in a vector-based software.</p>
      <p>As for the protocol for disassociating yourself from the logo, I would never, in your position, turn down work, if you don’t like it you don’t need to include it in your portfolio but you will have to accept that there are some clients who like to have their mark on work.</p>
      <p>btw. I don’t think the <a href="http://www.askoxford.com/asktheexperts/faq/aboutother/oxfordcomma?view=uk">Oxford comma</a> is necessary after Education.</p>
      <p>Tim</p>
