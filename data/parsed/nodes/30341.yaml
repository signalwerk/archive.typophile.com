      <p>I like the way 3 is going. 3b is too busy. I think it still needs something, but I’m not sure what.</p>
      <p>In 3, the text is too close to the mark. Think of the mark as a word of its own, and kern accordingly.</p>
      <p>And when you bring it to committee, my suggestion is only to bring one logo, with a few typeface and colour variations, but don’t show them anything but your best work. In my experience, if you show a committee three different logos, their favourite will be your least favourite. If you only show them the one you like, and they don’t like it, they can always give suggestions on how to modify it, but they can’t pick the safe and easy (i.e. bland) logo.</p>
      <p> - Lex</p>
