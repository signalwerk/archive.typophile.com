    <p>Hi Everyone,<br>
    This is my first post so please excuse me if I post wrong.  I need help with a logo that a committe has asked me to do.<br>
    The problem is they gave me a sketch of what they want their logo to look like.  It is basically (3) on the attached.  Now i think it looks like the hazardous waste logo which I would hope nobody would want their logo to look like when trying to convey something positive.<br>
    They said they wanted blue and gold colors and three circles.  So i came up with (1) and (2a&amp;b) to try to get them to shy away from (3).  I would love critism and any suggestions you can give me on the logos.<br>
    Also at what point to I say that I don’t want my name attached to something they are basically making me create.  I am a new graduate and am not quite sure of the protocol in the design world.<br>
    Thanks everyone for your time!</p><div class="imageWrap"><img src="/files/partnership_logo_5874.jpg"></div><p></p>
