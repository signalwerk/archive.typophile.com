      <p>In the second the strapline would be more readable the other way up and there is a problem with the T of THE, ideally your title should be larger than your strap at the moment, with the colour difference, the blue is dominating.</p>
      <p>Look at the shapes that are created by the overlapping circles, kind of reminiscent of the old <a href="http://www.cbc.ca/canada/toronto/story/2006/06/23/to-trillium20060623.html">Ontario trillium</a> logo, a flower indicates growth/success. A more 3d approach could be a <a href="http://home.online.no/~t-o-k/POV-Ray/Trefoil_Knot.jpg">trefoil knot</a>, indicates an unbreakable link. Or for a more decorative Celtic approach, if appropriate, <a href="http://www.myfonts.com/fonts/dingbatcave/anns-speyerals/triskeli/charmap.html">triskeli</a>, a combination in which no side dominates, but each is balanced.</p>
      <p>Hope something here is inspiring, if not walk away from the project for a while, go for a walk or visit a museum or gallery and approach it fresh.</p>
      <p>Tim</p>
