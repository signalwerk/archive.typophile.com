      <p>I guess that the weight of the strokes contributes to the similarity to Olympic rings, using a much heavier stroke and reducing the proportion of rings to wordmark should help avoid that.<br>
      I think there is mileage in the overlapped rings and room to make sure that it resembles neither Olympic rings nor biohazard symbol, while still remaining true to the kernel of their original logo and their concept for change, if you feel they will be receptive Jarrod’s comment about developing your own concepts will show the board that you have considered their requirements and if you can include a short passage about your reasons, whether technical or aesthetic, on the presentation panels so much the better.<br>
      Ultimately the client will have to live with the logo longer than you will and as I said in my previous post many feel like they have to make a contribution or give directions and it is very hard to dissuade them without a compelling argument (printing/technical concerns are usually quite good).<br>
      Tim</p>
