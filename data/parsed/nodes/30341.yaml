      <p>You’re right, their idea is pretty hideous, and bears too much similarity to the biohazard symbol. I think that a side-by-side comparison or an overlay of the two would likely convince them.</p>
      <p>I would try keeping “Partnership Award” the same color instead of singling out “Partnership“ unless the word partnership is somehow significant to the client and not to the award. </p>
      <p>Try to find a way to work the linking rings from 1 in with the the intersecting axis and ragged left type in 2b and I think that you’ll have a winner.</p>
