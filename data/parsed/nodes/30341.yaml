      <p><cite>Also at what point to I say that I don’t want my name attached to something they are basically making me create. I am a new graduate and am not quite sure of the protocol in the design world.</cite></p>
      <p>Don’t sacrifice integrity for the sake of one client. Remember that they’re hiring you because of your expertise in design. If they feel that they know more about designing a logo than you do, then maybe they should save themselves some cash and design it themselves.</p>
      <p>That being said, logo design is always a collaborative process. I find that just telling the client that their ideas won’t work isn’t a very good solution. Try to come up with something that is similar to what they want, but doesn’t have the faults that their ideas have. This is why they’re paying you the big bucks.</p>
      <p> - Lex</p>
