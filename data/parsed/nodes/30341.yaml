      <p>hey erin,</p>
      <p>it can be frustrating when a client has such a predetermined idea of what they want. </p>
      <p>but i would encourage you to develop and present your own concepts as well. this is not a problem if you present your work to them in a professional manner. i.e., “This concept is based off the initial sketch you gave me, but as I continued to think about your organization and what the logo needs to communicate, I developed these other concepts as well, and here is why they are strong...”</p>
      <p>after that, it typically depends on your confidence and relationship with the client how far you want to push your own work. that will also come with experience.</p>
      <p>good luck!</p>
      <p>jarrod</p>
