    html: <p>I'm not much help, but believe Greco-Adornado from Lazy Dog Foundry has many similarities, but there are differences in most of the serifs compared to your sample. For instance, the /A has a left "arm" on the serif and a flat apex, whereas your sample has no serif and is pointed.</p>
