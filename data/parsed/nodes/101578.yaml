      <p>"Net Weight" &amp; "Bella Cucina..." must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=FontShop&amp;ffam=BodoniClassicChancery%20-%20Regular&amp;fid=659933172c2bd6f0936668035de4e68e&amp;fsize=60&amp;text=Net%20Weight%20Bella%20Cucina%20Artful%20Food&amp;wrap=2" rel="nofollow">Bodoni Classic Chancery</a></strong> by Gert Wiescher (1993)</p>
      <p>"SWEET BUTTER..." is too small to be sure but it could be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=Copperplate%20Gothic%20Std%20-%2032%20BC&amp;fid=11a601d89920b5e32fefdec8d90d228b&amp;fsize=60&amp;text=SWEET%20BUTTER%20PASTRY%20TARTS&amp;wrap=2" rel="nofollow">Copperplate Gothic</a></strong></p>
      <p>I can't find something close to "CROSTATA"</p>
