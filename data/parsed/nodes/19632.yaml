    <p>Devon DeLapp (1981-) studied type design under <a href="/wiki/Karen%20Cheng" class="freelinking" rel="nofollow">Karen Cheng</a> at the <a href="/wiki/University%20of%20Washington" class="freelinking" rel="nofollow">University of Washington</a>. His first publicly available typeface, <a href="http://www.devondelapp.com/design/type/" rel="nofollow">Gaq</a>, was released in 2006.</p>
