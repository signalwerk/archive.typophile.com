    <p>Hi again all.</p>
    <p>I have a customer who is using a typeface they found that, to me, looks like a cross between Helvetica Condensed and Franklin Gothic (with an enormous x-height, though they tend to use it in all-caps, so that may be moot). As such, it's a little bit like white rice. It needs a sauce-and-a-side that will bring out the brand they're trying to portray.</p>
    <p>And that brand would be old-americana and simultaneously high-end-and-classy. So I'm looking for a typeface, preferably high x-height, that plays well with what they're using and says that. I'm leaning toward things like this:</p>
    <ul>
    <li><a href="http://www.myfonts.com/fonts/adobe/fairfield/" title="http://www.myfonts.com/fonts/adobe/fairfield/">http://www.myfonts.com/fonts/adobe/fairfield/</a></li>
    <li><a href="http://www.myfonts.com/fonts/fontbureau/farnham/" title="http://www.myfonts.com/fonts/fontbureau/farnham/">http://www.myfonts.com/fonts/fontbureau/farnham/</a></li>
    <li><a href="http://www.typography.com/fonts/font_overview.php?productLineID=100034" title="http://www.typography.com/fonts/font_overview.php?productLineID=100034">http://www.typography.com/fonts/font_overview.php?productLineID=100034</a></li>
    <li><a href="http://www.google.com/webfonts/specimen/Kameron" title="http://www.google.com/webfonts/specimen/Kameron">http://www.google.com/webfonts/specimen/Kameron</a></li>
    <li><a href="http://www.google.com/webfonts/specimen/Cantata+One" title="http://www.google.com/webfonts/specimen/Cantata+One">http://www.google.com/webfonts/specimen/Cantata+One</a></li>
    </ul>
    <p>Some Moderns might work if they have a reduced contrast between the thicks and thins, and if the serifs are a bit chuncky and non-delicate/fragile. Or some egyptians/clarendons might work if they aren't too Century-Schoolbook-y. </p>
    <p>Or, what works for you? Please help.</p>
    <p>Font sample of their pet typeface is available here: <a href="http://typophile.com/node/94619" title="http://typophile.com/node/94619">http://typophile.com/node/94619</a></p>
