    html: |-
      <p>I wish I knew. Character Map displays differing sets of  characters for various fonts, and I've never figured out the pattern.</p>
      <p>But trust me: those glyphs are not in your font. If you don't believe me, just re-import the font into FontLab and see what it actually contains.</p>
