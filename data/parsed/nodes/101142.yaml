    votes: null
    html: <p>FontLab is not doing this. Windows Character Map makes use of default font fallback to display Unicode characters that are outside the scope of the individual font.</p>
    html_clean: <p>FontLab is not doing this. Windows Character Map makes use of default font fallback to display Unicode characters that are outside the scope of the individual font.</p>
  - id: 546082
    user: 7642
    date: 2013-03-06T19:06:00
    date_raw: 6 Mar 2013 — 7:06pm
    votes: null
    html: <p>Huh. So why doesn't it do it with some of my other fonts? It doesn't seem to have anything to do with otf vs. ttf. Verdana (otf) shows only characters in Verdana, but the Walleye otf that I generate is filled with default characters. What controls it?</p>
