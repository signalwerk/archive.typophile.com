  html: "<p>I've been generating some fonts lately and it finally occurred to me to wonder: When I generate, why does FontLab insist on making a font file that's complete with every character in Unicode? (That is, when I view it in Windows' Character Map, the font shows a character for every Unicode glyph, including everything in Chinese, Korean, and Japanese, plus lots of obscure Asian writing systems.) Is there some sort of option that I could tick so it would only generate the characters that actually exist in my font? Or do these characters somehow not really exist? When I run fontplot in AFDKO, it only plots the ones that I've actually designed.</p>"
