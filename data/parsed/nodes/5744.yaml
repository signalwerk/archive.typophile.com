  html: <p>MAILART <br> <br>Mailart Project by Keith Bates, 2004 <br><a href="http://www.keithbates.co.uk" target="_blank">www.keithbates.co.uk</a>  -  <a href="mailto:keith@k-type.com">keith@k-type.com</a> <br> <br>This font may be used and distributed freely. Download it from <br> <a href="http://www.keithbates.co.uk/font_1.html" target="_blank">http://www.keithbates.co.uk/font_1.html</a> <br> <br>Towards the end of 2003 and the beginning of 2004, I sent out 150 or so snailmail and email invitations to mailartists whose graphic design flair led me to hope that they would each be keen to contribute a single character to the enclosed typeface, MAILART.  In addition, I placed an invitation in the fonts section of my website (<a href="http://www.keithbates.co.uk" target="_blank">www.keithbates.co.uk</a>) and also asked fellow mailartists to recommend another participant if they wished. <br> <br>It didn</p>
