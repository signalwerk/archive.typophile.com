  html: |-
    <p>Hi Folks,</p>
    <p>After the success of last Fall's FontLab class, I am starting up another very soon. Most of you probably don't need it (it's super basic), but anyone who's interested is welcome.</p>
    <p>All that entry requires is enrolling at <a href="http://www.ccsf.edu/Offices/Matriculation/step1.htm" rel="nofollow">City College of San Francisco</a> and having some demonstrable command of Bézier curves (like in Illustrator).</p>
    <p>Everything else we can take care of on the first day of class.</p>
    <p>GRPH 152 Digital Font Creation<br>
    Mondays: 1:00–5:00pm, Visual Arts 143<br>
    CCSF Ocean Campus: 50 Phelan Ave.<br>
    8-week course: March 20–May 15, 2006<br>
    CRN 37865</p>
    <p>BTW, it's a one-unit class, making it a whopping $26!</p>
    <p>Feel free to email me with questions,</p>
    <p>Amy Conger<br>
    <a href="http://www.ccsf.edu/~aconger/" rel="nofollow"> http://www.ccsf.edu/~aconger/</a><br>
    <a href="http://www.abecedarienne.com" title="http://www.abecedarienne.com">http://www.abecedarienne.com</a></p>
