      <p>These numerals were <a class="freelinking external" href="http://www.erikmarinovich.com/work/cincinnati-magazine" rel="nofollow">created by Erik Marinovich for the opening feature of Cincinnati Magazine annual ‘Where to Eat’ issue</a>.<br>
      I can remember the <a class="freelinking external" href="http://www.losttype.com/font/?name=pompadour" rel="nofollow">Pompadour Numerals</a> by Andy Mangold (which have been turned into font since) and the <a class="freelinking external" href="http://www.behance.net/gallery/Christmas-Numerals-(Free-Font)/6278933" rel="nofollow">Christmas Numerals</a> by Stereotypes Sasha Timplan.</p>
