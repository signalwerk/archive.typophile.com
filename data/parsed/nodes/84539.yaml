      <p>Lower the crossbar of /4/ to give the counter more space.<br>
      Top counter of /a/ also looks a little cramped.<br>
      Did you consider connecting the crossbars on those ligatures?<br>
      I think the swashy cap alternates are out of character.<br>
      Bold still needs more cleaning up. Allow it to depart from monoline (for example at the joins) more.<br>
      Those "historical" ligatures strike me as a goofy inclusion in a typeface like this. But I like the "Ti" "Tj" treatment a lot.<br>
      /Z/ may be wide. /W/ could come up further in the middle. /S/ may be trying to hard to hit horizontal in the spine.<br>
      I like the crossbar on /7/.</p>
