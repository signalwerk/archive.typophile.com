    html: |-
      <p>great feedback so far guys!</p>
      <p>@cerulean: good point about the K, seeing it next to the M like in the bottommost image it's indeed a bit too curvy. I don't want to drop that curviness too much, i want it to stay a little loose. But it could definitely use some work, so thanks!</p>
      <p>@eliason: thanks for all those constructive points! the /a/ is definitely a character i've been struggling with. if i move the top part upwards it becomes too high (have tried that before) making it stand out way too much in regard to the other lower cases. I'll have to try out some more options there.</p>
      <p>"Did you consider connecting the crossbars on those ligatures?" &lt;&lt; which ones do you mean?</p>
      <p>I do realise that most of the ligatures might seem out of place since they are old fashioned, but i thought it would be fun. plus, most of them are discretionary ligatures, so people can leave them out. Same for the swash capitals. It's a bit of a tricky decision maybe, since I am in fact including them and then saying "hey if you don't like them you can leave them out". Not sure if that is a good call but as for now I think I'll leave them?</p>
      <p>What I currently have as standard ligatures: /ffi/ffj/ffl/fft/ff/fi/fj/fl/ft/tt/Tij/Tji/Th/Ti/Tj/<br>
      All the others are discretionary ligatures.<br>
      I did one odd thing: i made an alternative st ligature (where the top of the /s/ is connected to the crossbar of the /t/) and this ligature I added as a contextual alternate that supposedly only works at the start of words. Hence in the middle of a word the st is replaced by an old fashioned ligature, but at the start of a word (if users want that) it can be replaced by a different one. Does this make sense at all?</p>
      <p>Now that you mention it I see that /Z/ /W/ and /S/ could use some work.</p>
      <p>The bold variant is something i probably need to put some proper time in, to make it better. After getting fontlab to create a bolder version I did redo about 1/3 of the glyphs as they were messy. Some more contrast (that is what you suggest I think?) might be good indeed to strengthen the bold effect.</p>
      <p>Thanks so far for all the feedback!</p>
      <p>And thanks (bedankt!) as well Tim!</p>
