      <p>I've been struggling a bit with the tail of the Q, as I tried to follow the angle of the  original dash (it's not a crossbar is it?). Might be better to move it downwards a bit (so maybe in the next update?).</p>
      <p>Thanks for the feedback on the posters as well! Is there a way to set which one is the first? I bet there is. Might work very well to put the bird first. Most of the posters I did were just designed with "show the options" in mind, but in reality most people will probably use it more in the way as I did with the bird (so useful feedback there, thanks).</p>
