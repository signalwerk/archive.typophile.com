    html: <p>For what it's worth, I'd have the poster with the bird as the first one.  It looks really good and shows more how the font would be used.  I also see you've not made a flag yet.  I've seen a few foundries do a flag that doesn't actually show the font.  I think it's a clever way of getting people to click on the flag - just to see what it is, and I think your bird image could make an excellent flag.  Of course, the only time anyone sees the flag without the font by its side is when it's a Hot New Font on the homepage, so I guess it has to be successful first before this marketing trick pays off!</p>
