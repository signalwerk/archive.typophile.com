    html: |-
      <p>The reason the swash characters aren't working is because they break from the monoline-ness of the rest of the font.  Keep the swashes but don't have them tapering to a point as they are now, but keep the basic skeleton and have the ends of the swashes basically the same as the ends of all other stems.  Another thing that jumped out at me - you single curly quotes are like 6 and 9, so your double curly quotes should be like 66 and 99.  At the moment they are mirrored 99 and 99.<br>
      Overall it's looking like a nice alternative to Kristen and (dare I say it) Comic Sans.</p>
    html_clean: |-
      <p>The reason the swash characters aren't working is because they break from the monoline-ness of the rest of the font.  Keep the swashes but don't have them tapering to a point as they are now, but keep the basic skeleton and have the ends of the swashes basically the same as the ends of all other stems.  Another thing that jumped out at me - you single curly quotes are like 6 and 9, so your double curly quotes should be like 66 and 99.  At the moment they are mirrored 99 and 99.<br>
