    The Lipatti album is a box set containing an 8-page brochure printed photogravure on a thick, intense cream-coloured stock.<p></p>
    <p>There were several more Angel covers credited to “Atelier Cassandre”, all of remarkable quality.<br>
    Were these the work of Adolphe Jean-Marie Mouron, a.k.a. Cassandre, the famous poster artist and type designer?<br>
    If so, he would have been in his ﬁfties at the time.</p>
