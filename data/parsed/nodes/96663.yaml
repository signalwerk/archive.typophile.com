    html: |-
      <p>Saul Bass didn’t do the lettering (which contributes so much of the personality) for all his masterful graphics.</p>
      <p>I would certainly agree with Nick that the output of the “Atelier Cassandre” is not the sole work of the boss (just like a lot of typefaces that are more art directed than drawn by their designer).</p>
      <p>I just wondered whether he did these himself.</p>
      <p>I disagree that they are generic, they are exquisite examples of spot color process graphics (although the Oistrakh is a bit ﬂat, literally, in its imitation of a tipped-on photo).</p>
      <p>I didn’t get them in a garage sale, but have acquired them over time, many from vinyl record stores. These Angel covers really stand out from all the other stuff in the bins, particularly for the quality of printing, on thick uncoated stock. As well as “Atelier Cassandre”, there is an equal credit line for “Editions Mercure” — the famous French publishing house, and presumably printer. So I would assume the front covers were printed in France and shipped to the UK where they were assembled—and then exported to North America &amp;c.</p>
      <p>You’re right Chris, they are great recordings.<br>
      The Gilels G Minor Concerto is the best I’ve heard of it by a long shot.<br>
      I also have a slightly later (1961) Bernstein/Gould version, highly touted, but which just murders the Andante. It does have a great cover though, shot by Avedon, which really dates the Cassandre designs as being 1950s.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/leonard_bernstein_beeth_6055.jpg"></div><p></p>
