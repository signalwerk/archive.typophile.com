      <p><em>In that regard these lack the recognizable Adolphe Jean-Marie Mouron rich dramatic style ... Adolphe Jean-Marie Mouron took chances.</em></p>
      <p>It’s unlikely he kept the same style.<br>
      Look how Tschichold went classical post-war.<br>
      Chances?—these are pretty outrageous (especially for classical music covers), and so deft:</p>
      <p>The way the Brahms names are surprinted on top of each other, on top of the ruled background, with no knockouts.<br>
      The Lupatti design with the enormous type ornament border, reversed out of a mid-tone sage and grey.<br>
      The overlapping letters in the Gilels cover—presaging Cassandre’s YSL logo?<br>
      The ﬂatness of the tension between text and images playing against the faux perspective in the Suppé.<br>
      These are all masterful graphic ideas.</p>
