      <p>Garage sale pick-up?</p>
      <p>I don't readily see a similar design style of these jackets with that of the poster artist Adolphe Jean-Marie Mouron.  The first image of your second post, the Emile Gilels jacket, does seem to have the somewhat of the same sense of 'humor/drama' that could of come from Adolphe Jean-Marie Mouron tho.</p>
      <p>Dunno.</p>
      <p>All the jackets seem like they would of come from a garden variety in-house designer/illustrator because they all look systematic in their standardize pattern background typographic foreground. In that regard these lack the recognizable Adolphe Jean-Marie Mouron rich dramatic style ... Adolphe Jean-Marie Mouron took chances.</p>
      <p>If these were done by him, I'm guessing he would of had a battle with the creative director ...lol. </p>
      <p>That illustration of guy stompin' round the women is hilarious!</p>
      <p>For what it's worth I'm thinking those jackets were done by three separate in-house designers/illustrators...</p>
      <p>n.</p>
