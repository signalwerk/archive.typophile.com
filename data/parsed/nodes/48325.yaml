      <p>A sample of my day-to-day work for greeting cards. I typically work from a planning sheet which shows layout, finishes, colors, a sketch of art, and a small reference to the lettering style they want. We used to be able to override the reference based on our own judgement, but now we must follow it more exactly.</p>
      <p>The first sample is from one of our team members who has no training in lettering, but works kind of wild and loose. This is me copying his style. Its about double the actual printed size.</p>
