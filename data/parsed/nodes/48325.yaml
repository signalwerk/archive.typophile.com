      <p>This is a great-looking thread with lots of lovely visuals, and it looks good with Sloop!<br>
      But please, files no wider than 590 pixels, to avoid the scrolling bar.</p>
      <p>Another useful technique, to knock out the background:<br>
      1. Duplicate layer<br>
      2. Magic wand at zero tolerance, select and delete background of top layer.<br>
      3. Now delete background layer.<br>
      4. Save as .png</p>
