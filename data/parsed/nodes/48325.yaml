      <p>Lovely stuff!<br>
      I had the pleasure of attending the recent 2008 "Letters Mingle Souls" conference in Naperville (Chicago), with about 500 calligraphers. Nice to be around people who really love letters ;-)</p>
      <p>Here's one of mine, done on a watercolor postcard, more or less doodling while sitting in the gardens of Alhambra, Granada in the fall of 2004... A few more odd things here: <a href="http://fraterdeus.com/lettering">http://fraterdeus.com/lettering</a> -- not really representative, just what has managed to get posted.</p>
      <p>Pencil for the initial sketch, waterproof Rapidograph 3x0 and then watercolor.<br>
      The scan oversaturates the yellow at the top...</p>
      <p>PF</p>
