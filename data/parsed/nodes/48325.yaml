  html: |-
    <p>Several of us toil away with pens, brushes and other "wet" tools. We have varying associations with BCP's at different points in time.</p>
    <p>Whether it is slick or rough, type or titling all of us ply our trade with a firm background in having made letters by hand for many years. The computer is just another tool used in the process as opposed to the genesis. </p>
    <p>We just thought we would put up a WIDE variety of takes on the alphabet.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gerard_4528.jpg"></div><p></p>
    <p>This piece is by Gerard Huerta. He will throw in on this tomorrow. What is important is that the "script" began as a refined pencil that was illuminated later on the computer. I think I have one of his last inked pieces of lettering.</p>
    <p>I figured since Gerard went slick I would go abstract in the first round to give contrast. A clock conceived around the letter S (very loosely based on Versals from the 12th century.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/clock_4449.jpg"></div><p></p>
    <p>More to come from others and we hope you will join in if you see fit. Hopefully we can show the diversity of the hand writ form.</p>
    <p>Michael</p>
