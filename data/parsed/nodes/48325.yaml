      <p>Nice work from Michael and Stephen. This one was originally drawn many years ago in the mid 80's, with a biro on a restaurant napkin at lunch and then re-lettered with a pointed brush (Windsor &amp; Newton series 7 # 3) on 3 ply Bristol Board. I used it for my personal logo for a few years. A group of us were looking through a new calligraphy book at the time and this piece was inspired by the work of Jean Larcher, I think (poor memory).<br>
      Later when I turned to the dark side (computers) I redrew it in Freehand.</p>
      <p><img src="/sites/default/files/old-images/InkwellWP_3674.jpg"></p>
