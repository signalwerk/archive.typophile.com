    date: 2004-04-20T12:08:00
    date_raw: 20.Apr.2004 12.08pm
    votes: null
    html: "<p>There's some hilarious stuff in <a href=\"http://www.xs4all.nl/~maxb/eye32-schreuders.htm\" target=\"_blank\"> Piet Schreuders</a>' book  <br>\"Lay In - Lay Out\" (which should be mandatory literature  <br>for graphic design students BTW) about Crouwel's grid- <br>based experiments. He has a fair stab at the <a href=\"http://www.foundrytypes.co.uk/foundry_architype_3/archi_3_new_alpha1.html\" target=\"_blank\"> New Alphabet</a>,  <br>or 7/3/11/3/7 as it was originally called: (my translation) <br> <br><i>\"This text set in Crouwel's 7/3/11/3/7, a typeface  originally  <br>conceived to be read by optical text recognition, was  <br>submitted to such an OCR program in 1996, which resulted  <br>in the following: <br>Urn df ~ trut I ren Lno ~ L tc~r~L~n RAC) J ~ Er U ~ ~rtrn]  <br>dr. ~ trrnL: UCnrc~cEr~ ~rtr Lu~drn Irl~Jr ULB Lol ~r rlrr L  <br>~IXt~L L~ LLr~rn d~ NV dLnrm~ ~rCrLut nap h n q n L rrqF</i> <br>(and so and so on I'm getting a headache - ed.) <br><i>How intriguing it might be, the general sense of this text still  <br>is not very clear to me.\"</i> <br> <br><img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"></p>"
    html_clean: "<p>There's some hilarious stuff in <a href=\"http://www.xs4all.nl/~maxb/eye32-schreuders.htm\" target=\"_blank\" class=\"link-external\"> Piet Schreuders</a>' book  <br>\"Lay In - Lay Out\" (which should be mandatory literature  <br>for graphic design students BTW) about Crouwel's grid- <br>based experiments. He has a fair stab at the <a href=\"http://www.foundrytypes.co.uk/foundry_architype_3/archi_3_new_alpha1.html\" target=\"_blank\" class=\"link-external\"> New Alphabet</a>,  <br>or 7/3/11/3/7 as it was originally called: (my translation) <br> <br><i>\"This text set in Crouwel's 7/3/11/3/7, a typeface  originally  <br>conceived to be read by optical text recognition, was  <br>submitted to such an OCR program in 1996, which resulted  <br>in the following: <br>Urn df ~ trut I ren Lno ~ L tc~r~L~n RAC) J ~ Er U ~ ~rtrn]  <br>dr. ~ trrnL: UCnrc~cEr~ ~rtr Lu~drn Irl~Jr ULB Lol ~r rlrr L  <br>~IXt~L L~ LLr~rn d~ NV dLnrm~ ~rCrLut nap h n q n L rrqF</i> <br>(and so and so on I'm getting a headache - ed.) <br><i>How intriguing it might be, the general sense of this text still  <br>is not very clear to me.\"</i> <br> <br><img src=\"http://www.typophile.com/forums/clipart/bigsmile.gif\" border=\"0\"></p>"
