  html: <p>... represented in some very poorly compressed jpegs. I ran across this page by accident when googling Wim Crouwel. There's a fair bit of stuff I haven't seen before, presumably all scanned from books (the page looks like a resource from a lecture course in Communications Design). Original drawings by Tschichold for Sabon, type specimens from Nebiolo, some of Giovanni Pintorini's lovely ad designs for Olivetti ...  <br> <br><a href="http://www.mosne.lacab.it/art-design/dispense/scudero/B/dispensaB.html" target="_blank">http://www.mosne.lacab.it/art-design/dispense/scudero/B/dispensaB.html</a> <br> <br>Enjoy! <br> <br>Robert <br> <br></p>
