      <p>I tend to agree with “litera” the colors are off. I also agree with “epsilicon” the power symbol icon is over killed.</p>
      <p>My opinion: if you develop a symbol, similar to what you already have (without the “power” icon symbol), reduce its size, keep the text in AG, but set it in demi instead (a little heavier), adjust the kerning (a little open), and play with 2 different greens. Aqua or teal and warm green. So, you have a symbol w/ 2 color greens. For the text (use 2 same color greens): Powered (in Aqua/teal; Green (in warm green). “.org” could be med. grey. Then place the new symbol in front of the text (but don’t overpower it).</p>
      <p>sal</p>
