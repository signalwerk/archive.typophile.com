      <p>Agree with litera and Will...you definitely need to lower the text, leave about 1.5 times the size of the text itself in between the symbol and the text. Also, as litera said, make the symbol smaller. And nudge until it looks visually centered.</p>
      <p>As for body text, Gill sans will work good. Frutiger will also work. If its mostly web, go with the safe choices, Verdana and Georgia :)</p>
      <p>JonE.</p>
