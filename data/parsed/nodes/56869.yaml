      <p>The scale is still way off, IMO. Break out of the tunnel vision and REALLY shake up the relationship! In my experience, in order to find something that works, you must to completely let go of what doesn’t work. In other words: stop forcing it. </p>
      <p>If it were me, I’d search for a font with more weight — right now, it looks like the mark could lose steam, fall, pulverize the type and roll off without even noticing. The type actually looks scared of the mark, all clustered together and cowering below. They aren’t visual peers.</p>
      <p>The logotype needs the most work; as it is now, the kerning needs attention and the tracking is too tight. Have you considered capitalization (PoweredGreen.org) or using different tones/colors for each word?  With only one ascender and all those round letters, “poweredgreen.org” is kinda one, long muddy worm.</p>
