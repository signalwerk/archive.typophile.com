    <p>I have created this logo... which I don’t know that to do about the type.  It’s ITC Avant Garde... and my instructor and class critique agree it is good but... I don’t know.  I need help deciding what subtext and body copy to use in the design manual.  I decided on Verdana because the organization is an internet forum.  I’ve thought about using Rockwell Light for subheadings, possible for the body in the manual.  PLEASE HELPPP... so stuck.</p><div class="imageWrap"><img src="/files/cyan_4618.jpg"></div><p></p>
    <p>Oh, poweredgreen.org is a forum which is supposed to attract technically minded and creative individuals with ideas for improving life on this planet with new alternative energy sources and other products.   Wants to get government funding to make good ideas a reality and spread the technology at little cost if not free to individuals around the world who would benefit from it.</p>
