  html: |-
    <p>My brain is exposed.</p>
    <p>There is a limit to how patient talent should be.<br>
    Not that I ever had talent, or patience.</p>
    <p>I'm done with deniability.</p>
    <p>I hate justification - I don't have a better reason than I like that.</p>
    <p>I love the process<br>
    ALL THE REST OF IT CAN GO TO HELL</p>
    <p>xyz</p>
