    html: |-
      <p>From the book <a class="freelinking external" href="http://www.amazon.com/Type-Typography-Phil-Baines/dp/0823055248 " rel="nofollow"> Type and Typography</a> by Phil Baines.</p>
      <p><strong>Dashes</strong><br>
      'For parenthetical clauses use a dash not a hyphen. En dashes  with a space either side are the norm today in Britain and are nearly always better than em dashes with sans serif typefaces. Em dashes often look more bookish and tend to work better with older typefaces. They should be used without a space either side.'</p>
      <p>'Never use hyphens for this role. Hyphens simply indicate broken or compound words. An em dash is also used within contracted dates and page numbers, where it is employed without a space either side.'</p>
      <p><strong>Dates</strong><br>
      'British style is to use cardinal numbers (1, 2, 3, etc.) and in the following order: 8 December 1958. US style uses ordinal numbers (1st, 2nd, 3rd, etc.) as follows: December 8th, 1958.'</p>
      <p>SB</p>
