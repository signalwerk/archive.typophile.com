    html: |-
      <p>Those hyphens look to actually be en-dashes, and is the accepted form for indicating an inclusive range of numbers in text (though easily confused with a minus sign in a mathematical equation). Or maybe it's supposed to be an em-dash. So many things to remember in those style guides; the one I had I gave away many years ago.</p>
      <p>But yes, since the dates shown here are consecutive, the dashes seem overkill, unless it's meant to show the event runs overnight or something like that.</p>
