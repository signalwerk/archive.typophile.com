  - id: 446673
    user: 3254
    date: 2011-01-07T21:20:00
    date_raw: 7 Jan 2011 — 9:20pm
    votes: null
    html: |-
      <p>Thanks Jasper. You zoomed right in on an area that really is unresolved - the overlap on those swash /O/s - so thanks for prodding me to think more about it. Here are a few options for different approaches (each line has different treatment of the /O/ top; ROBOT is as before).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Os_6181.png"></div><br>
      Of these I think COCOA works best.<p></p>
      <p>Those monoline, thin parentheses etc. were a design decision with Ambicase Modern that I've kept here. Perhaps oddly, I kind of like the mismatch. Maybe it reminds me of old-school typesetting where those types of characters were furnished by generic sorts rather than designed and cast for each different font design. If there's a clamor for some with more weight and contrast, I suppose I'd consider furnishing some, at least as an alternate.</p>
    html_clean: |-
