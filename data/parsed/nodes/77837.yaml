      <p>Wow. This is just beautiful. (I hadn't seen Ambicase Modern before, so my awe applies to that as well). The ffi ligature and section mark especially are elegant details. (And kudos for including the Rupee mark).</p>
      <p><em>Those monoline, thin parentheses etc. were a design decision with Ambicase Modern that I've kept here. Perhaps oddly, I kind of like the mismatch.</em> | I was going to suggest that you do include the alternates, but after seeing them in context in the pdf, I'm sold 100%.</p>
      <p><em>I think there’s no escape for ij resembling ÿ. By the way, I like the RIJN version.</em> | I agree that that version is the best of the four, but what could you do if you gave both i and j a ball, facing each other? Is there some way they could interact that felt like a ligature without joining them? Or what if you had /i/'s swash connect with the ball on /j/ rather than its stem? I'm just spitballing here...</p>
      <p><em>Considering a spurlike structure for the lower left of all the /B/s.</em> | It seems to me to be more gothic that way (how the serifs all point down, you know?) Then again, I guess it's only in that "Beelzebub" sample that that feeling becomes dominant. In the poster test it looks natural.</p>
      <p><em>One of my recent changes was to cut that second thickening on T.fina's hook. That brings the center of gravity of the letter leftward. Does that fix the issue you are seeing? Or shall I still try bringing top out and/or bottom in?</em> | That does help a lot, but it still seems like the top should come out a bit too. I have a small problem with the other /t/s, too. The curve on the bottom starts a bit too low and in small sizes makes the transition look a bit angular.</p>
      <p>I have some beef with a few other glyphs as well...</p>
      <p>The Copyright, Registered Trademark and @ don't quite work, IMO. It looks like the circles around the first two have an uneven stroke, and are not geometric. To my eye, an even, circular line would look better. For the /@/, I would rather see Ambicase's take on the more common, single-story a inside. I think the problem might be that without the apex, it doesn't read as unicase, so it's just a two story /a/ with a sloped straight edge on the side, which seems like a completely different font.</p>
      <p>The initial swash versions of /M/ and /N/ have a strange negative space on the left side. I'm not sure what should be changed (if anything) because the swash makes sense, it's just its proximity to the straight edge of the, uh, what is that slanted line called in /M/ &amp; /N/?</p>
      <p>The alt /N/ (stylistic set 5, I guess) is a bit jarring for me (those points are so violent). It is nice to have a lowercase-style /N/, but I'm not sure it quite fits. I'd like to see more examples of it in context. I'd also like to see a swash coming from that up-turned serif on the inside, but going to the left (and possibly not with that scary xacto blade coming down)</p>
      <p>Lastly, I have to say I'm not sold on the standard, upside-down-question-mark /Q/. I think it's the line inside that is the main problem. It's just weird that it's the a thin, vertical line that ends without a ball or curve or anything. I guess the closest thing to it would be the terminal of the /T/, but I don't think they really come across as fraternal. The more I look at it, I'm not sure if that's the only problem with it, but it's probably the same in the Modern version, so...</p>
      <p>That's all I saw on my first glance through. Let me reiterate that this is an utterly fantastic typeface. I hope my comments help.</p>
    html_clean: |-
