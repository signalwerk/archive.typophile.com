  html: |-
    <p>As a follow-up to <a class="freelinking external" href="http://typophile.com/node/75182" rel="nofollow">Ambicase Modern</a> (the development of which was greatly assisted by its <a class="freelinking external" href="http://www.typophile.com/node/60316" rel="nofollow">Typophile critique thread</a>), I have created Ambicase Fatface. It is considerably bolder version of that single-case font which strove to combine upper- and lowercase forms for each letter.  </p>
    <p>Character set and OpenType features are much the same as Ambicase Modern, though I have added discretionary ligatures for FT, CT, and ST. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/AmbicaseFatface01_5059.png"></div><p></p>
    <p>PDF specimen below. I welcome any constructive feedback you have!</p>
