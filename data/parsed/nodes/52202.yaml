    <p>Hi,</p>
    <p>I'm George, new to typophile. I know little about typography and I find this site very useful.</p>
    <p>I don't generally make logos, I do one or two every year. This year a friend of mine asked for one and left me with a pretty open brief: the company's name is zoo station, they import hardware and sell it.</p>
    <p>I had a lot of ideas about, zoo, animals, africa, stations, technology, computers, etc.</p>
    <p>Of all my proposals they chosen this one:</p>
    <p><a class="freelinking external" href="http://flash.quietroot.org/zs/ZooStation_3a.jpg" rel="nofollow">http://flash.quietroot.org/zs/ZooStation_3a.jpg</a></p>
    <p>I don't know if I made the right choice when it comes to chosing the right type face.</p>
    <p>I made this choice:</p>
    <p><a class="freelinking external" href="http://flash.quietroot.org/zs/ZooStation_3_final.jpg" rel="nofollow">http://flash.quietroot.org/zs/ZooStation_3_final.jpg</a></p>
    <p>I don't know wether it helps the logo graphic or not.</p>
    <p>Any tips will do.</p>
