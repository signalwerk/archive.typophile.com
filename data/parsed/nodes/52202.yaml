      <p>You used a soft, humanistic typeface with a sharp, angled and blocky mark. The type contradicts or contrasts with the mark, which ever way you want to look at it. If you want to use Myriad try different layouts (bolder, lighter...) also tighten up the letter spacing a little. Conventional wisdom dictates that the two elements either contrasts or compliments each other.</p>
      <p>Of course their are many humanistic sans that could replace Myriad...Or you can try to match the style of the mark with a sharp, rugged and utilitarian typeface. Either way I like that you gave the mark and type the same importance.</p>
      <p>JonE.</p>
