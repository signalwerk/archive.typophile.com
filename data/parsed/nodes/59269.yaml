  html: |-
    <p>TypeTogether is proud to present it's new release. <a href="http://www.type-together.com/Adelle" rel="nofollow">Adelle</a> is a 12-weight slab serif typeface conceived specifically for intensive editorial use, mainly in newspapers and magazines. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/adelle_4913.gif"></div><p></p>
    <p>It's personality and flexibility make it a real multiple-purpose typeface. The unobstrusive appearance, excellent texture and slightly dark color allow it to behave flawlesly in continuous text setting. As it becomes larger in print, Adelle shows its personality through a series of meassured particularities that make it easy to remember and identify.</p>
    <p>Available exclusively at our online store at <a href="http://www.type-together.com" title="www.type-together.com">www.type-together.com</a></p>
