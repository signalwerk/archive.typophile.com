    html: |-
      <p>Just put the ' mark after whichever glyph(s) should be substituted:</p>
      <pre>sub [V Y] i' by dotlessi;</pre><p>For the <code>calt</code> feature, it might be better to make a copy of the dotlessi glyph and leave it without a Unicode value:</p>
      <pre>sub [V Y] i' by i.calt;</pre>
