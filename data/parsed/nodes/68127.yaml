      <p>Rob, this looks like it's going to be a wonderful typeface. I am very much impressed.<br>
      But you ask for suggestions, not for praise. Ok:<br>
      * You have a great Th ligature. Let's have a Wh as well ("Who").<br>
      * I think the regular a is not yet quite convincing, the little "ascender" irritates me.<br>
      * Similar: g and y. I'd prefer these as alternative forms not standard ones. (see "onyx", "jaunty")<br>
      * pp: I love the zippers, not the zappers.<br>
      * I suggest a rt ligature (see "advertiser", "smart", "quartz").<br>
      * The decorative Z crossing the following vowels in "Zebras" and "Zoomed". Purpose?<br>
      * The figures are still uneven: 1, 2 too small, 3 4 5 6 9 too big.<br>
      * alternative forms that do not connect lazy flowers and strawberry jam<br>
      * what about a qu ligature? the q appears in most languages mostly in that combination.<br>
      * t crossbar and y get a bit close in "jaunty".</p>
      <p>I'm looking forward to seeing what becomes of this project.<br>
      Andreas</p>
