    <p>I posted this at the end of the thread that discusse naming a font after Villu Toots. Here are the same images. I'd appreciate any suggestions that would improve on my goals:</p>
    <p>1) A calligraphic font that looks hand-lettered</p>
    <p>2) Rough imperfect edges</p>
    <p>3) Combining elaborate script upper case forms with more traditional lowercase calligraphy.</p>
    <p>4) Give alternate character options to optimize the hand lettered look.</p>
    <p><img src="/sites/default/files/old-images/Calligcloseup_6065.jpg"></p>
    <p><img src="/sites/default/files/old-images/CalligSample_5507.jpg"></p>
