      <p>I like your work very much, and, yes, it's going to be a wonderful typeface.<br>
      Some letters still bother me:<br>
      - ligature Wh [narrower loop connecting W - h helps?]<br>
      - I like your previous lc q, narrower<br>
      - 5 is too wide<br>
      - lc f (amplfied), I would prefer with descender, like (fawn)<br>
      - UC F (Five) F without upper bar looks oddly\hard to read<br>
      - lc t (jaunty) is still to short<br>
      - UC B (Back) could be more inclined to the right<br>
      - UC U looks a bit like Y<br>
      The rest is OK for me.<br>
      I have a supplication: Can you make UC Z with stroke? It is the calligraphic version of [Zdotabove]. My surname starts with stroked Z...</p>
      <p>Best wishes Rob</p>
