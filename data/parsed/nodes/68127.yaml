    html: |-
      <p>Andreas,</p>
      <p>Thank you so much.... your comments are EXACTLY what I was looking for... suggestions, not praise. </p>
      <p>I'll do the ligatures you suggested (fantastic idea),  "Wh"  "qu"  "rt"  </p>
      <p>zippers is a pp ligature in the font... zappers shows two alternate p's</p>
      <p>The "lazy flowered" and strawberry jam combinations were typographic decisions in the text on my part. I could have chosen alternates that didn't touch, but in my actual hand lettering and calligraphy, I'ill often make the decision to let words and characters overlap for design purposes-- it often prevents rivers from appearing in the overall texture.  </p>
      <p>The uppercase Z is a different issue. I may need to create an alternate that doesn't overlap  the next character. Right now, if they don't overlap, there appears to be a kerning/spacing issue, so that's why I chose to kern them to overlap.</p>
      <p>I'll modify the crossbar on the "t" alternate.  I can't say I like it either.</p>
      <p>The Oldstyle Numerals--- a weakness for me. I'm not used to making them, and not sure how. I'll play with it and let you know. I'm not thrilled with their overall design appearance anyway, so maybe this will be the largest of the revisions.</p>
      <p>Thanks again, if there are things anyone else sees, please chime in.</p>
      <p>Rob</p>
