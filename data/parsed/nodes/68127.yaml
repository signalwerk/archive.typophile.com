      <p>Andreas and Janek,</p>
      <p>I think this is finished. I have take your all your suggestions to heart and I have tweaked this to death. I ended up completely replacing all the Roman Caps (including inferior, superior and smart caps). I created some new uppercase flourished characters, and added several more lowercase starting and ending characters.<br><img src="/sites/default/files/old-images/EstoniaSet_5172.jpg"><br>
      In all there are approximately 670 glyphs in the font, including the Z with stroke.  :)</p>
      <p>I even added a ROB face. Let's see if the pirates include that in their rip off.</p>
      <p>If you see anything else, let me know, but I think I'm ready to stick a fork in this, because it's done.<br>
      Thanks again,</p>
      <p>Rob<br><img src="/sites/default/files/old-images/EstoniaSample_6408.jpg"></p>
      <p>Where you see ascenders and descenders crashing... those can be substituted with alternates... I was just too tired to go on.</p>
