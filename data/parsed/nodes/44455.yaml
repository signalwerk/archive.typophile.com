      <p>Usually when you design a logotype you would design different version for different conditions. These conditions are defined by all the uses you can imagine the logotype would be used in - these works as limitations on the complexity of the design. For instance, if the logo is to be printed in flexography in one inch width that sets some harsh limitations colours and details. So you take the worst case uses and work your way up from there. Usually a simple black version of the ’mother’ logo is created to be used in these worst case situations, and proper colour logotypes are then used in normal usage.</p>
