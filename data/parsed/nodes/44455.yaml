    <p>Hi guys, hope you can help. I am slightly new to the technical side of typography and in the current process of creating my own typographic identity. I know it has to work at all sizes, for posters, packaging, billboards, letterheads and business cards.</p>
    <p>When I design the typeface do i create one identity, one image, one file and then scale it down for stuff like my letterhead? or do I create various sizes which then can be applied to various mediums?</p>
    <p>What is the professional way to do this?</p>
    <p>hope you typoheads can help me here!!</p>
