      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ultra_Extended_6371.png"></div><p></p>
      <p>Stretcheeeeee it till it breaks...</p>
      <p>I realize that it seems absurd to expand 'SCION', but I was thinking of going about this in a slightly different way.</p>
      <p>Instead of just proportionally expanding each and every glyph in font as in line 2 above.</p>
      <p>I think that I will adjust selective aspects of each glyph in a way that will create yet another interesting visual variance, like in line 3 above.</p>
      <p>What do you think?</p>
