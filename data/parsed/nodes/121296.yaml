    <p>Hi community !</p>
    <p>I use to work on Fontlab but I need to try an Open Source font editor software, or at least a free one, for my students.<br>
    Which one would you recommend?<br>
    I must confess that I tried FontForge but find it very slow and confusing (maybe because it runs on a mac…?).<br>
    Something more simple, for newbies type designers, would be perfect! I just want them to experimented type design: it doesn't need to be extensive.</p>
    <p>Thank you in advance for your help!</p>
