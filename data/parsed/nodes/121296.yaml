      <p><strong>Type light</strong> might be what you are looking for. It is freeware for Windows and Mac (and an older version is also available for Linux), and is generally considered 'easy-to-use' (as far as font editors go). The freeware version has only basic drawing tools though.</p>
      <p><a class="freelinking external" href="https://web.archive.org/web/20150419210404/http://cr8software.net/typelight.html" rel="nofollow">http://cr8software.net/typelight.html</a> (Windows)<br>
      <a class="freelinking external" href="https://web.archive.org/web/20150419210404/http://cr8software.net/typex.html" rel="nofollow">http://cr8software.net/typex.html</a> (Mac &amp; Linux)</p>
