      <p>You could want to investigate online browser-based tools. I know there are a few,* but personally haven’t had time to determine their quality.</p>
      <p>* There also is fontstruct.com, but, while it could be a fun and instructive tool, I don’t think it would be a real first step into font editors.</p>
