    html: |-
      <p>FontForge is acutally as mighty as FontLab, but certain builds of it are very crashy. I work in it on both Mac and Windows, works good. If you have X11 or XQuartz installed, you can get a premade build here :<br>
      <a class="freelinking external" href="https://web.archive.org/web/20150419210404/http://fuuko.libferris.com/osx/packages/" rel="nofollow">http://fuuko.libferris.com/osx/packages/</a>.<br>
      Then just open X11, then open FontForge, should work nice (but not like a native app).</p>
      <p>On Windows you can find a build here:<br>
      <a class="freelinking external" href="https://web.archive.org/web/20150419210404/http://fontforgebuilds.sourceforge.net/" rel="nofollow">http://fontforgebuilds.sourceforge.net/</a></p>
