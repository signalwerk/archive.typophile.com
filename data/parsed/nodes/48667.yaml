      <p>Hi Chemical,</p>
      <p>graphic designers can make money, depends on what direction you go into. I’m a freelancer and there is tons of potential in my city, although I’m not where I want to be financially, I’m still pretty new at the game.</p>
      <p>Graphic Design may not be as ’fun’ as being a fine-artist, or an illustrator, but it definitely pays the bills better in most cases. </p>
      <p>Overall, theres tons of opportunities in different graphic fields (animation, branding, website design, publication design). Do some more research. Your portfolio is nice.</p>
      <p>Oh and punctuation is your friend in message boards, especially this one.</p>
