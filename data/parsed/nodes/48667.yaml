    <p>I am a senior in high school planning to go for an art major and, I’ve been wanting to become a graphic designer but, lately I’ve been having doubts about having that as my major. Not because it doesn’t seem fun but when I look online I see that they get paid very poorly that may or may not be true but, I was wondering what I should I move towards.</p>
    <p> here is my gallery (portfolio is under construction right now)<br>
    <a href="http://izacchemical.deviantart.com/gallery/" title="http://izacchemical.deviantart.com/gallery/">http://izacchemical.deviantart.com/gallery/</a></p>
    <p>I do those painting for fun and for friends I don’t really plan to take those much farther so i am shooting towards my photoshop and illustrator capabilities please tell me your input on this situation.</p>
    <p>Thanks to all who reply.</p>
