      <p>What I'm looking for specifically is (commercial) digital typefaces that are interpretations of, or were inspired by letters and numbers on license plates. So only fonts that are available for use on Mac and Windows computers apply.</p>
      <p>For example I don't know if I want to include <a href="/wiki/Eduardo%20Recife" class="freelinking" rel="nofollow">Eduardo Recife</a>'s <a href="http://misprintedtype.com/v3/fonts.php" rel="nofollow">Misproject</a>. Though it is a very nice grunge font, it's merely scans of actual plates and not an interpretation as such. Penitentiary Gothic on the other hand could indeed be included.</p>
      <p>I don't want to go the other way around and include "regular" digital fonts that happen to appear on license plates, like the aforementioned Trajan and Papyrus.</p>
