      <p>The previous norwegian license plates used the same alphabet that are used on the norwegian road signs. This have recently been digitized:<br>
      <a href="http://www.luth.no/default.asp?Searchstring=TrafikkAlfabet&amp;side=fontprisliste" title="http://www.luth.no/default.asp?Searchstring=TrafikkAlfabet&amp;side=fontprisliste">http://www.luth.no/default.asp?Searchstring=TrafikkAlfabet&amp;side=fontpris...</a></p>
      <p>The current norwegian license plates use a monstrosity of an alphabet - it's ugly and unusable (difficult to read and differenciate characters if blurry).<br>
      Here's a link to an article about them - in norwegian:<br>
      <a href="http://home.no.net/toeng/bilskilt/bilskilt.html" title="http://home.no.net/toeng/bilskilt/bilskilt.html">http://home.no.net/toeng/bilskilt/bilskilt.html</a></p>
      <p>A third alphabet (some version of Myriad?) will apparently be used as of late 2006.</p>
      <p>Jacob</p>
