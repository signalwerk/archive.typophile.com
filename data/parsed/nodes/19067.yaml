      <p>I tried to take a night class in Mandarin last year.<br>
      About halfway through the first class I realized that<br>
      the teacher had a lisp. You should've seen me sneak out<br>
      of the classroom, like a ninja. Oh wait, that's Japanese.</p>
      <p>&gt; Where was everyone?</p>
      <p>Trying to regroup after the Genocide?...</p>
      <p>&gt; it’s hard to keep track of these things when<br>
      &gt; more than one typeface is called Ararat, Erevan ...</p>
      <p>You should hear what happened to Garamont.  :-)</p>
      <p>&gt; Arasan and Nork are also the “same” thing, right?</p>
      <p>You could say that Arasan is a sans version of Nork.<br>
      Or you could say that they both derive from Clarendon.<br>
      But Arasan's more relevant attributes are that: it looks<br>
      crystal onscreen; and it's free.</p>
      <p>BTW, Hanragitaran is inspired quite strongly<br>
      from Cheltenham - at least I tend to think so.<br>
      And Cheltenham has been one of my earliest, and<br>
      continues to be one of my strongest, inspirations.<br>
      Some people say Patria's caps remind them of the<br>
      ones in Cheltenham, even though I actually made<br>
      no conscious effort in that direction. And quite<br>
      interestingly, Hanragitaran's caps I find really<br>
      very beautiful, if cold in their Latinized tameness,<br>
      although really, fully authentic Armenian caps<br>
      are too extravagant for typesetting.</p>
      <p>&gt; “People read best what they read most”?</p>
      <p>There is of course a truth in that, but there are also<br>
      severe limits to it. In fact my opinion is that it's a<br>
      simplification to the point of being false. There are<br>
      realities to the human reading "firmware" that<br>
      clearly cause some fonts to be more readable than<br>
      others, almost no matter how familiar you are with<br>
      which one(s). But yes, almost.</p>
      <p>In this case for example, people didn't notice/voice their<br>
      difficulty in reading Maral in long passages until issue #3.<br>
      You'd think that by that time they would've gained enough<br>
      familiarity with it, no? I think they did to an extent, just<br>
      not enough to overcome an inherent readability flaw, the<br>
      lop-sided vertical proportions. It's really a display face.</p>
      <p>In contrast, Aramian's "keh", no matter how misguided it is,<br>
      can be learned, gotten familiar with as a structure - and since<br>
      it doesn't look like any other letter it can become a harmonious<br>
      part of the family (even if it's not really authentic). But some-<br>
      thing like Aramian's "ho" is both inauthentic and dysfunctional<br>
      in its severe similitude to other letters.</p>
      <p>&gt; You don’t need to be so hard on yourself.</p>
      <p>But somehow I need to repay my debt to Mnatsakanyan<br>
      (even if others look the other way). I was getting ready<br>
      to do so at the ATypI conference in Rome - then he died.<br>
      Then I got marginally involved in the publication of his<br>
      comprehensive posthumous specimen book, and pledged<br>
      to donate $1000 to the effort - but that didn't fly either.<br>
      And now in my current position giving a lot of money to<br>
      something like that is decidedly reckless... But maybe I<br>
      can do something else.</p>
      <p>hhp</p>
