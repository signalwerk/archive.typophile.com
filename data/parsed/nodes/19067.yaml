      <p>&gt; But doesn’t that happen with a lot of other non-Latin scripts?</p>
      <p>Sadly, it most certainly does. And it's very hard<br>
      to recover from. Greek is doing better than most.<br>
      In spite of the chauvinists, style-mongers, agents<br>
      of the status-quo, and/or draconian Modernists.</p>
      <p>But Miguel, I didn't say that wasn't the <cite>standard</cite>,<br>
      what I said was that the standard is no good.  :-)</p>
      <p>&gt; Latin typeface design has always been ahead of the rest</p>
      <p>Wait: And we want to keep it that way?!</p>
      <p>&gt; Granjon, van Dijk</p>
      <p>Two of my Armenian type heroes. The latter in fact I consider to<br>
      have made the best Armenian type in history (so far). But the key<br>
      to their success (and the key to Mnatsakanyan's... incompleteness,<br>
      I'm sorry to say) was that their work was NOT Latinized. You don't<br>
      have to be a "native" to make great type, even for text (but you do<br>
      need to be -or become- native if you're going to <cite>push</cite>).</p>
      <p>&gt; FMBF Aramian is essentially based on ...</p>
      <p>When did I say it was original? I said it was readable.<br>
      I've made an "Aramian" too (it's called "Ardahan"), and<br>
      for the longest time it was my most readable Armenian font.</p>
      <p>&gt; FMBF Hanragitaran seems to be the best choice for book typesetting.</p>
      <p>So I guess you would use ITC Garamond to set a book? Come on.<br>
      The x-height is too big for good readability (for Armenian).<br>
      And I actually have proof, or at least very good evidence.<br>
      Are you sitting down?... Hanragitaran and Maral are essentially<br>
      the same thing! And Maral was used for the lauch of AIM magazine<br>
      back when; but after a few issues we got enough explicit complaints<br>
      about readability from laymen (this, after people were salivating<br>
      over the look of the new type at the debut) that we had to dump it<br>
      (for text) and make an Aramian instead! It took me YEARS to figure<br>
      out why: the vertical proportions. So Maral/Hanragitaran failed in<br>
      magazine setting, not even a book!</p>
      <p>Also, an obese x-height is much worse than an errant "keh".</p>
      <p>Arial Unicode:<br>
      Its Armenian is beyond "no good" - it contains serious structural mistakes.</p>
      <p>Mshtakan:<br>
      Everson tried his best (and I helped him a little bit), and it really could have been worse, but Apple should really have found a designer more qualified in Armenian. But first, they have to care about type...</p>
      <p>&gt; Maral ... just giving you a bad time</p>
      <p>I deserve it (and in more ways than one).</p>
      <p>hhp</p>
