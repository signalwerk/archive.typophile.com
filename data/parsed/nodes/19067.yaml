    html: |-
      <p>Okay, I understand now. </p>
      <p>I thought Hrant's comment re. Minion Greek was naïve -- I don't think modifying that type would be a good design solution for the project as described -- but I think you are taking the suggestion a bit beyond its context, and beyond its intent. I have done a couple of customisations of Adobe typefaces over the years, although these generally involved extension of existing designs rather than revisions. I've always asked for Adobe's permission, and they have always given it. Even when such projects do involve revision of the existing design, I wouldn't view them as vandalism unless they were poorly done. There are times when an existing typeface doesn't seem quite right for a project, but may be better than other available designs, and in that context I think modifying the design is a legitimate option. Ordinarily, I like to see such work offered first to the original designer, but Adobe is not in the business of making custom versions of its fonts for people, so they permit other people to do so. Is this really presenting 'a distorted idea of what typeface design is all about'? Type design is a varied activity and, so long as it is done with appropriate permissions, customisation of existing designs is a legitimate undertaking. At the end of the day, the typography is more important than the typeface, something we may forget as type designers, looking on our own work as an end product. Sometimes the typography calls out for something other than an out-of-the-box font, and then the question should be how can we best serve the text?</p>
