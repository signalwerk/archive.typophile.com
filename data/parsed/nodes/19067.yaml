      <p>&gt; <strong><em>Miguel is too modest to toot his own horn.</em></strong></p>
      <p>The only reason why I didn't mentioned Calouste was because it still isn't available. And that image on the TDC site does not do it any justice. Check these 2 PDFs instead: <strong><a href="http://adhesiontext.com/pdf/Calouste.pdf" rel="nofollow">Specimen</a></strong> &amp; <strong><a href="http://adhesiontext.com/pdf/Calouste_TDC2.pdf" rel="nofollow">TDC poster</a></strong></p>
      <p>&gt; <strong><em>But Miguel, those “current type design standards”, at least when it comes to Armenian, are seriously flawed: Latinized, low-readability, uninspired (or rather, inspired from the wrong sources).</em></strong></p>
      <p>You're right, to some extent. But doesn't that happen with a lot of other non-Latin scripts? Latin typeface design has always been ahead of the rest since the dawn of printing*, and it's not uncommon to see non-native type designers setting milestones for non-Latins. With respect to Armenian, <a href="http://www.myfonts.com/person/granjon/robert/" rel="nofollow">Robert Granjon</a> (Rome 1579) and <a href="http://www.myfonts.com/person/van-dijck/christoffel/" rel="nofollow">Christopher van Dyck</a> (Amesterdam 1661) have definitely brought up the "standards". Even the highly regarded work of <a href="http://www.tdc.org/news/mnatsakanyan.html" rel="nofollow">Henrik Mnatsakanyan</a> (which I truly respect, and that served as one of my references) can be considered quite Latinised.<br>
      And when I said “current type design standards” I was thinking of how old Monotype's Armenians are: Monotype Armenian Upright and Inclined (formerly Armenian Series 638) were released in March 1962; Aramian, Barz and Nork can be found in a Compugraphic catalogue dated 1987.</p>
      <p>* Regarding Armenian, compare, for example, the first Armenian printed book, by Yakob Mełapart (Venice 1512), with the works of <a href="http://www.myfonts.com/person/jenson/nicolas/" rel="nofollow">Nicolas Jenson</a> and <a href="http://www.myfonts.com/person/griffo/francesco/" rel="nofollow">Francesco Griffo</a> a handful of decades before.</p>
      <p>&gt; <strong><em>Of the Matenadaran fonts, only Aramian is useful for setting a dignified Armenian book.</em></strong></p>
      <p>How can you possibly say this?!?! <em>FMBF Aramian</em> is essentially based on Monotype's Armenian Series 638 and Mergenthaler-Linotype's Armenisch (circa 1964). In addition, it contains "wrong" characters: <strong>f</strong> (U+0066) is used instead of <strong>ք</strong> (U+0584 ARMENIAN SMALL LETTER KEH).<br>
      From the fonts already available, <em>FMBF Hanragitaran</em> seems to be the best choice for book typesetting. It was created in 2004, by Ruben Tarumian, based on a design by Henrik Mnatsakanyan (circa 1969), and is the font used by the Armenian Soviet Encyclopedia.</p>
      <p>On a similar note, I'd like to say that (the Amenian block of) <em>Arial Unicode</em> (available on WindowsXP) is no good option, since the characters were taken from <em>Monotype Armenian Upright</em>. And <em>Mshtakan</em>, MacOSX's Armenian font family, is simply dreadful (sorry Mr. Everson).</p>
      <p>&gt; <strong><em>I used to make stuff like that.</em></strong></p>
      <p>How painful is it to see Maral still around? Sorry, just giving you a bad time ;^)</p>
