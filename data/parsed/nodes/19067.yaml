      <p>&gt; <strong><em>Greek is doing better than most.</em></strong></p>
      <p>Alleluia! Thank Ζεύς  :^D<br>
      Who knows, perhaps by the year 2027 we'll have Adobe's Mega Pro fonts that'll include Armenian.</p>
      <p>&gt; <strong><em>And we want to keep it that way?!</em></strong></p>
      <p>Certainly not. That's why some people work on things other than Latin. But these are probably less than 1% of the total, so we can't expect much. And then there's the argument of number of users, piracy, and so on. I'm telling you, once the Chinese rule the world, everything will be different. Just wait! (Or should I say, "Don't wait, start learning Chinese NOW!") ;^)</p>
      <p>&gt; <strong><em>The latter in fact I consider to have made the best Armenian type in history</em></strong></p>
      <p>I second that. Up until the mid-20th century, Armenian type designs were essentially based on his work, no major breakthroughs. (Where was everyone? Fighting invaders and infidels? And where's <em>Matthew Carter Armenian</em>?)</p>
      <p>&gt; <strong><em>So I guess you would use ITC Garamond to set a book?</em></strong></p>
      <p>I said, <em>From the fonts already available, ...</em></p>
      <p>&gt; <strong><em>Hanragitaran and Maral are essentially the same thing!</em></strong></p>
