      <p>You're welcome. Thanks! Yes, I think it'd work well with Minion. Sorry about that.</p>
      <p>&gt; <strong><em>I’m still interested to hear how typesetting conventions might apply in Armenian</em></strong></p>
      <p>I asked myself that question when I was designing the specimen booklet. As far as I can tell from the samples I have available (newspapers, magazines, pictures of old books' pages, paragraphs of text in catalogues), seems like the conventions are pretty much the same. One thing peculiar about Armenian is that guillemets ( <strong>« »</strong> ) are used instead of quotes ( <strong>“ ”</strong> ). Some of the samples use the oblique variant for the main body and upright for the rest (e.g. captions), but I don't know if that style still prevails nowadays. Hrant will know better.</p>
      <p>One problem you might come across is hyphenation. The popular layout applications won't know where to breakup the words, so you either end up with an extreme ragged paragraph or a paragraph full of huge rivers, unless you break the words yourself. InDesign can't do it, and I can't read Armenian, so some of the typesetting in Calouste's specimen is not as good as it could be.</p>
