    <p>Hi - This is the first time I've posted to this site. I have noticed some some discussions about Armenian, though, and some Armenian names, so I think this might be a good place to ask my question. I've been asked to typeset three versions of a short book, in English, Greek and Armenian (about Armenians in medieval Cyprus). The first two languages I can do, but Armenian is new to me.</p>
    <p>The book wil be quite simple - mainly straight text, with maybe a couple of levels of heading, and some quotations.</p>
    <p>I could do with some pointers to get started. I had a look at these fonts:</p>
    <p><a href="http://www.monotypeimaging.com/ProductsServices/wt_fontsample.aspx?type=armenian" title="http://www.monotypeimaging.com/ProductsServices/wt_fontsample.aspx?type=armenian">http://www.monotypeimaging.com/ProductsServices/wt_fontsample.aspx?type=...</a></p>
    <p>First of all, are they any good? Would you recommend others? (For what it's worth I'll probably set the the other language versions in Garamond premier pro). I showed this page to an Armenian friend who thought Monotype Inclined looked good for a book text.</p>
    <p>What's the relationship between upright and inclined? I had a look at some Armenian books and it seems you can set 'ordinary' text with the inclined. Is that right? And are there some basic conventions for setting, for example, the title of a book or something else that in an English text would go in italic?</p>
    <p>That's probably enough for now...</p>
    <p>Thanks very much</p>
    <p>Toby</p>
