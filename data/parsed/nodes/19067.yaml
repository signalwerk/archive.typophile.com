      <p>Of the "classic" Monotype fonts:<br>
      Aramian and Barz have good readability, but the former is ugly while the latter is very old-fashioned (and has letterwise legibility issues). Nork is the most Latinized, and the least readable. The other two seem pretty bad.</p>
      <p>In contrast, check out this beauty:<br>
      <a href="http://www.tdc.org/news/2006Results/Calouste.html" title="http://www.tdc.org/news/2006Results/Calouste.html">http://www.tdc.org/news/2006Results/Calouste.html</a> _<br>
      Miguel is too modest to toot his own horn. Quite unlike me:<br>
      <a href="http://www.themicrofoundry.com/ad/CR.pdf" title="http://www.themicrofoundry.com/ad/CR.pdf">http://www.themicrofoundry.com/ad/CR.pdf</a> _<br>
      <a href="http://www.themicrofoundry.com/ss_rome1.html" title="http://www.themicrofoundry.com/ss_rome1.html">http://www.themicrofoundry.com/ss_rome1.html</a></p>
      <p>&gt; Nope, not at all, according to the current type design standards.</p>
      <p>But Miguel, those "current type design standards", at least when it comes to Armenian, are seriously flawed: Latinized, low-readability, uninspired (or rather, inspired from the wrong sources).</p>
      <p>Of the Matenadaran fonts, only Aramian is useful for setting<br>
      a dignified Armenian book. As for the Paratype fonts: I used<br>
      to make stuff like that. Then I woke up. I had my personal<br>
      little "zartonk" as we say.</p>
      <p>&gt; Garamond</p>
      <p>Interestingly, this was also the initial choice of Emily Artinian for her project (the "From Ararat to Angeltown" mentioned in that PDF). It's not a bad choice, especially considering its small x-height, which matches [good] Armenian type. But once she saw Nour&amp;Patria, it was Game Over. But in this case finding a matching Greek might be tricky... Let me know if I can help: hpapazian_thatsymbol_gmail_dot_com</p>
      <p>hhp</p>
