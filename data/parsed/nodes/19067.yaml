      <p>Miguel, I think involving the Gulbenkian Foundation in the ATypI conference is a great idea of itself! Re-issuing the most-recent Mnatsakanyan specimen book might be interesting (was there ever a copyright agreement between the Soviet Block and Portugal?) but if I were them I'd actually focus on you instead! :-)  Anyway, I was lucky to find a copy of that book during my trip to Armenia in 2000, and I'll take a closer look at it today.</p>
      <p>&gt; Minion Greek would be a good companion.</p>
      <p>I think it would be a <cite>decent</cite> companion. But I would take the time to look around, like among the fonts of Haratzopoulos. Or you could get Miguel to customize Minion Greek (maybe as simple as changing the serifs/terminals) for you!</p>
      <p>&gt; the relationship between upright and oblique</p>
      <p>There are a few things at play there. One is that, because of the classic manuscript hand and the ensuing crushing, centuries-long dominance of Barz, slanted text is naturally more culturally authentic for Armenian. This leaves less room for an "italic" (especially with the pronounced slant of Barz). Another factor is that Armenian letters look much better with semi-serifs rather than full serifs; the reason being that there are very many stems in Armenian (especially in the x-height) and full serifs everywhere (as much Latinizers love that...) ruin everything. And when you put semi-serifs (where people can be said to expect them) on upright forms, they look like they're falling backwards... And another thing is that Armenian needs italic far less than (almost all) Latin-based languages do, because we have a floating emphasis mark that can be placed on any vowel (even more than one in a word). Italics in Armenian is a bit like smallcaps in Latin: nice, but a luxury of sorts.</p>
      <p>So I think the best approach is to: make the "roman" cut <cite>slightly</cite> slanted (sadly, any slant has been extremely rare for decades now - although Miguel has done it! :-) to leave room for an Italic; but not insist on having an Italic in every font. Actually, even in Latin I personally prefer a (good) demi weight for emphasis anyway!</p>
      <p>* For example see how cluttered the Armenian subordinate of Patria is.</p>
      <p>&gt; a Papazian’s music shop in Cairo</p>
      <p>Papazian is not an uncommon surname. I remember walking into a souvenir shop in Delphi, where -as usual- the salesman tried to soften me up: this one ferreted out a connection with me in the fact that his mother was Armenian. But when it turned out that her surname was Papazian, and I whipped out my passport to <cite>prove</cite> that mine was too, <cite>I</cite> was the one to get the upper hand in the de rigeur haggling.  :-)</p>
      <p>&gt; Some of the samples use the oblique variant<br>
      &gt; for the main body and upright for the rest</p>
      <p>Which of course makes the upright parts look like they're falling backwards!<br>
      The English insert of tipoGrafica magazine has this problem too.</p>
      <p>The Armenian typesetters of the past who did that were simply being expedient: they wanted to use a slanted face for body (because that was both stylistically and functionally desirable) but had no italic or bold available (and never letterspaced, like the Germans did, and rarely all-capsed). So the only good way left to mark contrast was using an upright font. These days though I think it's far less bad to use a mechanically bolder or even a further-slanted style for emphasis if you get stuck.</p>
      <p>&gt; hyphenation</p>
      <p>There's actually a standing conundrum in Armenian hyphenation: when you break the line across a syllable that has an unmarked "eh" sound in it, you add an explicit "et" letter at the end of the syllable (before you break it).* On top of that if you end up removing the break, when you collapse the word back together it's extremely hard for a dumb computer to know if the "et" gets removed or left in place! :-/  There was a movement to do away with this particular hyphenation rule, but I for one am no fan of changing language simply to avoid writing smarter algorithms.</p>
      <p>* As far as I know this rule was put in place because if the break were to happen at the first syllable, and that syllable had that issue, you'd end up with a single letter followed by a hyphen, which is quite ungainly.</p>
      <p>hhp</p>
