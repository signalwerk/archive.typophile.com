      <p>I wish I could say that helped, and I guess it did in a way, but it hasn't pointed to an answer yet. That 'k' is quite unusual. The 'a' does look like Janson to me, but nothing else matches very well. The M looks more like Romana than anything else, but the rest of the lower case isn't Romana. </p>
      <p>Can you tell that I'm stumped? I would really like to know what this is now.</p>
      <p>- Mike Yanega</p>
