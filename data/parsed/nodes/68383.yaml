    <p>Can anyone help with these fonts used on Haruki Murakami's first edition book:</p>
    <p>the cover has two faces - a sans and a serif</p>
    <p>and the inside title pages uses a(or a couple of)  sans serif(s) in several weights, does anyone know what they are?</p>
