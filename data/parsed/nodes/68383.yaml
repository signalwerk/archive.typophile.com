    html: |-
      <p>The Sans on the cover seems to have a short middle arm on the E, so I suggest something like <a class="freelinking external" href="http://new.myfonts.com/fonts/paratype/engravers-gothic/" rel="nofollow">Engravers Gothic</a> or maybe Interstate widened.</p>
      <p>The Sans inside the book is not the same, and might be Helvetica, as Ryuk suggested.</p>
      <p>- Mike Yanega</p>
