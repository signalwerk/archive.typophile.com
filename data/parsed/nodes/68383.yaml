    html: |-
      <p>The closest I can seem to manage is a customization/distortion of De Vinne. This image (below) is admittedly crude because it was made by distorting a test drive image, but I think it shows the possibility that a typeface like this could have been artificially condensed/manipulated to produce something similar. This De Vinne was the <a class="freelinking external" href="http://new.myfonts.com/fonts/woodentypefonts/de-vinne/" rel="nofollow">one from Wooden Type Fonts</a>.</p>
      <p>Perhaps the initials were not distorted as much, but if you look at the basic font, I see a strong resemblance to the typeface used for the book cover. Am I imagining things?</p>
      <p>- Mike Yanega</p><div class="imageWrap"><img src="http://typophile.com/files/HarukiMurakamiDeVinneSim_5904.gif"></div><p></p>
