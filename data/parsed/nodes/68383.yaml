      <p>I'm also not convinced that Garamond is the right serif for the cover, although it's hard to see the detail well enough. The M seems more splayed looking, and I thought <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/janson-text/" rel="nofollow">Janson</a> might be closer. Also because the 'k' upper arm seems so much lighter in your sample.</p>
      <p>If you can get a closer view that would help a lot.</p>
      <p>- Mike Yanega</p>
