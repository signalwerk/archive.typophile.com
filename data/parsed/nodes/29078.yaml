    <p>Hi everyone !</p>
    <p>This time, I've got 2 (super interesting, of course) questions for you guys :</p>
    <p>1rst &gt; Is the "Graphic Artists Guild Handbook" really good? And do u think it applies to all designers in the world or is it just for freelancers in the US only?</p>
    <p>2nd &gt; How much would you price for this ; logotype + stationery + brochure + website interface design<br>
    I know what I'm going to price for this but I'm really interested in what YOU would price according to where you're from (so if you could also specify which country you work from, that'd be great).</p>
    <p>Thanks a lot ! Hope to get lots of answers !</p>
    <p>Virginie (from France)</p>
