      <p>Virginie you won't get a straight $ answer to your question #2 in this forum for the reasons cited above. </p>
      <p>Years ago (in New Zealand) I quoted on a job similar to yours; logo + stationery + brochure + website (the only difference being that it also included signwritten livery for a helicopter fleet – there's some type application for you, Hrant). The guy handling the commission told me I overpriced the bid by a factor of two. So they went with someone else who promptly blew the 'budget' out of the water and (naturally) delivered an inferior design...</p>
      <p>My simplistic take on what Chris is quoting James as saying is "will work for work..." The popularity of graphic design as an activity turns it into a buyers market, usually to the detriment of the quality of work produced. </p>
      <p>A telling illustration of this was the free ads I noticed one night in my local supermarket lobby; on the pre-printed cards under the strip lighting were a couple of hand-written ads proclaiming 'Web designer' and 'Graphic designer' for hire – both with several years' experience and accompanying software skills and mobile numbers. Well it's one way to pay back the student loan I suppose.</p>
