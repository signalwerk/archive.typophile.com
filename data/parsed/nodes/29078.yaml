    html: |-
      <p>Pricing has always been a frail issue for designers. Everyone wants to know what others charge so they can guage their own price in the market place. You can find the "Logo for $50 guy" who spends 15 minutes slapping some clip art together.  You can also go to a major marketing and adverting firm and pay $1,000,000 for a rebrand. Both prices are out of line. My advice would be to figure out how many hours you would spend doing a particular job and figure a fair hourly rate in your country to do the work.  Add in materials and overhead costs. then add a reasonable profit margin. If you are new and inexperienced, you may need to charge less than whatever the going rate is in your area. As Tiffany says, the Guild book is based on survey responses in the USA. Whether the people who responded to the survey were either honest or accurate is your guess but it is a least a starting point. I have noticed that prices have seemed to go down recently. Perhaps there are plenty of hungry good designers who need work and perhaps there are now a bounty of wanna-be designers who charge minumum wage to do some almost design work. To quote our own James Montalbano, "Graphic design is the new acting."</p>
      <p>ChrisL</p>
