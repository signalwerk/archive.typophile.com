    html: <p>Greetings from Brazil. In 1998 ADG (the national association of graphic designers) developed (or at least made an attempt to develop) some sort of rice table. The table has been then reviewed and updated in 2002 and published in a book. In this book there's an explanation of how they came up with the prices.The reference table has been developed as a tool to give a notion for graphic design projects and was based on prices asked by members of ADG in Sao Paulo, which is the most developed part of Brazil in terms of graphic design market. However, socio-economic characteristics do change a lot within the country so even considering inflation etc. I think it's a very difficult job for them to keep this table up-to-date and consistent with the reality of the market. Plus the profession is not officially recognised here, which is crazy I know. I don't know if graphic design associations in other countries do publish this kind of tables of reference, maybe you should contact them. Hope this helps.</p>
