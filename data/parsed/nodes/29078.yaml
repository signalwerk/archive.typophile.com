      <p>The cost of a design project rather depends on the general price level in your country, the size of the company you're designing for, on how famous and/or experienced the designer is, the size of the job etc, etc</p>
      <p>I just had an offer turned down, and I don't know for sure, if I was more expensive or a lot cheaper than the others in the race, but I suppose a bigger company with more name got it. I guess it's just one of those things you have to figure out yourself. In Finland cartels are illegal, so the local graphic designers' association has stopped giving any guidance on pricing. They had a kind of a price list after a query amongst the members in 1996, and it gives you some idea of the variation of the fees, when the price range for designing stationary for a local company was from 250 € to 2000 € then.</p>
