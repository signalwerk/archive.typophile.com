  html: "<p> Hi, <br> <br>I was wondering if anyone could make things clearer for me concerning digital typeface production. I'm currently working on my first typeface (Typophile Forums: Critique: Sans Serif: Iris) The face still needs some work!  <br> <br>I began the type face on paper, scanning in the characters and then re-drawing them in illustrator. I then imported them into FontLab to begin creating the type face. Being entirely new to font design, I've spent a few days reading / working through the FontLab manual to try and get an understanding of how to use the application, and now my head hurts! <br> <br>The main problem is the file type - Truetype, Type 1, font encoding, codepages etc - what's the deal with these - which should I use and why? The manual has confused me a little so I thought I'd ask you boys. I currently work on a Mac, but want the type face to be 'cross-platform' so do I need to take this into account at any early stage during the design process? <br> <br>Cheers for any advise that you can give me <br> <br>Darren </p>"
  html_clean: "<p> Hi, <br> <br>I was wondering if anyone could make things clearer for me concerning digital typeface production. I'm currently working on my first typeface (Typophile Forums: Critique: Sans Serif: Iris) The face still needs some work!  <br> <br>I began the type face on paper, scanning in the characters and then re-drawing them in illustrator. I then imported them into FontLab to begin creating the type face. Being entirely new to font design, I've spent a few days reading / working through the FontLab manual to try and get an understanding of how to use the application, and now my head hurts! <br> <br>The main problem is the file type - Truetype, Type 1, font encoding, codepages etc - what's the deal with these - which should I use and why? The manual has confused me a little so I thought I'd ask you boys. I currently work on a Mac, but want the type face to be 'cross-platform' so do I need to take this into account at any early stage during the design process? <br> <br>Cheers for any advise that you can give me <br> <br>Darren </p>"
