      <p>Throwing a way a typeface because of one letter is like trashing your kitchen because you don’t like the drawer pulls. ;o)</p>
      <p>I will say DSType definitely has strong personalities, so you either get along with them or you don’t. That said, if it’s just the g that’s not doing it for you, modify it (provided the EULA allows it, of course).</p>
