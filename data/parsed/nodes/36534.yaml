    <p>Please excuse any ignorance on my part, cause I’m fairly new to the study of typography and new to Typophile. </p>
    <p>Only a year ago I started purchasing commercial fonts - to augment the usual collection available bundled with programs or shareware/freeware. Now I’m hooked...but I don’t have much $$ to invest in fonts and don’t have many clients yet, so I have to restrain myself!</p>
    <p>I was recently seeking a heavy, clean-looking, modern italic sans, and found Leitura Sans <a class="freelinking-external" href="http://www.myfonts.com/fonts/dstype/leitura-sans/italic-4/">http://www.myfonts.com/fonts/dstype/leitura-sans/italic-4/</a> on MyFonts - that worked well for my purpose. All the DS fonts were half-price that month, so I helped myself to some of the Leitura Roman text fonts too. </p>
    <p>Now I don’t like Leitura Roman text font at all, and asked myself why I bought it!<a class="freelinking-external" href="http://www.myfonts.com/fonts/dstype/leitura/">http://www.myfonts.com/fonts/dstype/leitura/</a> The PDF advert was so beautifully designed it deceived me... </p>
    <p>Mostly, I detest the lower case “g” - it has little flag sticking up on the upper right like a cowlick. Rather than gracefully leading the eye to the next letter, it sticks out most unpleasantly. I can’t seem to get past that. Did you ever decide not to use a font because of a single letter? </p>
    <p>Last week a page on this site pointed me to a modern text font bundled with Powerpoint that I like better - Cambria.</p>
    <p>I know that someone is likely to tell me that Cambria sucks or is already becoming overused, but my question is this:<br>
    Have you ever made a misjudgement choosing type? and why?</p>
