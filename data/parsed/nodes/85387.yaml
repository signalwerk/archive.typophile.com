    <p>Hello all! </p>
    <p>This is my first time posting here, but it is also my first typeface so I find it fitting. </p>
    <p>Any critique would be great.</p>
    <p>My intentions on this piece were to keep it modern and neutral<br>
    but designed and stylized by logic and reason.</p>
    <p>There are many common negative and positive shapes throughout that keep it all together.<br>
    But I know it's not perfect yet and I'm still willing to alter it if need be.</p>
    <p>It was a style choice to have a low x-height. I know for legibility purposes it's usually a little higher (not at 50% like it is here) , and at small sizes, it feels handwritten.</p>
    <p>Also, I've had trouble with the / V/. I want it to be consistent but if anyone agrees, I might go back and look at it again? What do you say?</p>
    <p>I've also heard an illustrator friend say he wasn't feeling the /B/ ?</p>
    <p>That being said...<br>
    Any agreements, glaring mistakes or particular changes that you feel should be made?</p>
    <p>Thank you!</p>
    <p>WIlling to hear from all!</p>
