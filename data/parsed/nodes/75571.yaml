    <p>Hello my fellow Typophilians.</p>
    <p>I posted earlier about what Eric Gill's 'Perpetua' springs into mind<br>
    Ive come up with the following general descriptions: classic, light, elegant and somewhat non-specific. If there are any other words that spring to mind please share.</p>
    <p>I'm having a little trouble thinking of possible songs, instrumental versions or music in general that encapsulates these attributes. It's for a 30sec animation on After Effects I'm creating.</p>
    <p>Any help at all would be greatly appreciated.<br>
    Thanks</p>
