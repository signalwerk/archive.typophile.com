    date_raw: 23 Oct 2010 — 10:21pm
    votes: null
    html: <p>Maxim is heading in the right direction in that it needs to be immediately recognisable as distinctly British, but the Pomp and Circumstance March (often known as Land of Hope and Glory, although Elgar didn't write or approve the lyrics) is too martial for Gill. You want something pastoral. I recommend either part of the opening movement of <a href="http://www.youtube.com/watch?v=L5C99JyP2ns" rel="nofollow">Elgar's Cello Concerto</a>, or the lyrical middle passage of <a>Jupiter from Holst's Planets</a> (the passage I'm thinking of begins about 3:00 minutes into that clip). Another possibility in the same vein would be Nimrod from Elgar's Enigma Variations, although for many Brits the immediate association of that piece is Remembrance Day.</p>
    html_clean: <p>Maxim is heading in the right direction in that it needs to be immediately recognisable as distinctly British, but the Pomp and Circumstance March (often known as Land of Hope and Glory, although Elgar didn't write or approve the lyrics) is too martial for Gill. You want something pastoral. I recommend either part of the opening movement of <a href="http://www.youtube.com/watch?v=L5C99JyP2ns" rel="nofollow" class="link-external">Elgar's Cello Concerto</a>, or the lyrical middle passage of <a>Jupiter from Holst's Planets</a> (the passage I'm thinking of begins about 3:00 minutes into that clip). Another possibility in the same vein would be Nimrod from Elgar's Enigma Variations, although for many Brits the immediate association of that piece is Remembrance Day.</p>
