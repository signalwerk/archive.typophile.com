      <p>Well i've decided to go with 'Perpetuum Mobile' about 20sec into the vid. Although it isn't recognizably British, the piece has a beautiful rhythm to it.<br>
      It's light, elegant, classic and versatile- has great ring to it and I believe perfect for my animatic.<br>
      I also like the meaning behind the name 'perpetual motion...' it's very beautiful and only compliments Perpetua's place in the history of typography.<br>
      I'd like to thank everyone who offered suggestions.<br>
      I hope the animatic turns out well.<br>
      Thanks again :)</p>
