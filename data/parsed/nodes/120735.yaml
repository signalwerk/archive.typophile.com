  html: <p>At first this typeface looks like American Typewriter Bold or Typewriter Serial Heavy, but the ball at the upper tip of the 3 is more pronounced. Someone probably just customized it but I would still like to know if anybody knows of any other fonts that have this kind of typewriter-meets-Cooper-Black sort of look?<br><img src="/sites/default/files/old-images/23-trace_6653.jpg"></p>
