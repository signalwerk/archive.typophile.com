    html: |-
      <p>Can't find something like that.<br>
      It makes me think of American Typewriter + a bad quality raster-to-vector processing which made the upper tip of 3 pronounced and also destroyed all fine corners points.<br>
      (it's a common kind of deformation if you do a raster-to-vector conversion on a low quality image)</p>
