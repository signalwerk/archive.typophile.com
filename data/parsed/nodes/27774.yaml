    html: |-
      <p>Those fonts are great Mike!  ...and thanks for the lead Stephen. I can now sleep at night.  Of course those eerie letterforms will still be dancing around in my dreams. After doing a little more searching for Jonathan Gray and the ad campaign I came across <a href="https://web.archive.org/web/20150124153848/http://www.canada.com/nationalpost/news/artslife/story.html?id=e24a508b-ba93-47b5-bc2b-d2ed673e7d46" rel="nofollow">a post about the new ad campaign</a> at canada.com.<br>
      From the post:</p>
      <dd>"Noticed by at least a couple of bloggers, the similarities between the ads and the book covers are no coincidence -- well, almost.
      <p>The designer behind the font and the original hand happens to be another Jonathan -- Jonathan Gray, or Gray318, as is his moniker -- who, after being commissioned for both of the New York author's best-selling novels, was asked to do something similar for HP.</p>
      <p>"We saw the books Jonathan designed and loved the typography for that," said Nancy Reyes of Goodby Silverstein &amp; Partners, a San Francisco advertising agency contracted by HP.</p>
      <p>"We weren't too concerned in terms of it looking similar to the book cover," she added. "We were just happy it helped to inspire the campaign."</p>
      <p>David Roman, HP's marketing guru, says the design impressed him right away.</p>
      <p>"It clicked immediately -- the style of design goes right back to that mid-20th century look that Saul Bass and Paul Rand popularized and I just liked that," he said. "It was a little whimsical, definitely felt personal and we got a lot of positive feedback."</p></dd>
    html_clean: |-
