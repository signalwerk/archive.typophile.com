    <p>This font has been bugging me since I first saw the new HP ads.  It feels very Tim Burtonesque, but after looking at the cover of "The Nightmare Before Christmas" that definitely isn't the font.  It may have been specially created for the campaign, but I really doubt it.  Identifont gave a few comparable fonts, but nothing really close and What the Font didn't really help either.  Any ideas?<br>
    I zoomed in on the flash to grab this screenshot from:<br>
    http://www.hp.com/personalagain/us/en/index.html</p><div class="imageWrap"><img src="https://web.archive.org/web/20150124153848im_/http://typophile.com/files/hp-personalagain_4968.gif"></div><p></p>
