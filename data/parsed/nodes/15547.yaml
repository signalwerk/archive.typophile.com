    <p>I am trying to create some alternate ampersand glyphs in fontlab but I can’t figure out how to get them to actually work.<br>
    Also (and I am sure that it is an obvious question) I can’t get the ’smart quotes’ to work in the typeface either.<br>
    Nobody wants to see inch marks in place of proper quotes do they?</p>
    <p>I would appreciate any help that anyone has.</p>
