    html: |-
      <p>There was a discussion here a while back about the idea of using OpenType to do smart quotes. The consensus was that it would be a bad idea; that it should be left to the application to do. There was a good reason, but I can’t quite remember what it was.</p>
      <p>Doing alternate ampersands is easy. Create your normal ampersand in the normal ampersand slot. Then create your alternate ampersands, naming them ampersand.alt1, ampersand.alt2, etc. (The alternates do not need Unicode values assigned, but you may use PUA codes if you want programs like MS Word for Windows that don’t yet support alternates to be able to access them.)</p>
      <p>Create a “salt” feature defined thusly:</p>
      <p>feature salt {<br>
        sub ampersand by ampersand.alt1 ;<br>
      } salt;</p>
      <p>Then create stylistic sets like this:</p>
      <p>feature ss01 {<br>
        sub ampersand by ampersand.alt1 ;<br>
      } ss01;</p>
      <p>feature ss02 {<br>
        sub ampersand by ampersand.alt2 ;<br>
      } ss02;</p>
      <p>etc., for however many alternate ampersands you have. </p>
      <p>The “salt” feature is the default alternate for programs that don’t support more than one alternate. The “ss0x” features are for programs that support “stylistic sets”. You will see all of them in programs with glyph or character palettes. In Adobe apps, they will also show up together in a pop-up under the ampersand in the Glyph Palette.</p>
