      <p>Don't most printers have an 'economy' mode which in effect, turns every printed piece into a low-ink solution?</p>
      <p>As far as I understand, couldn't just using environmentally friendly inks be a better solution than trying to reduce them at severe cost to anything we actually bother to print?</p>
      <p>I mean, it's one thing to be conscious about the ink you're using - I can't possibly forget and I can't allow myself to be wasteful of it, but to sacrifice <em>everything</em> in a vain attempt to minimize the ink used to me seems like <em>tokenism</em></p>
      <p>Is this the Yellow Ribbon on te back of my car, for eco-minded people who don't really want to make a difference, just look like they do?</p>
      <p>Could these people be pushing for adoption of newspapers and Magazines in PDF and advocacting a trend away from print for people who don't need print instead and reduce the mount of ink that way?</p>
