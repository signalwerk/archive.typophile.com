    html: |-
      <p>Ooh, Cyrillics. I think a lot of it looks pretty nice; I enjoy the /che/, and the /be/ is nicely executed. However, I must critique, since this is the critique section. Let's see...</p>
      <p>I think the left leg of your Russian /el/ is too big; ideally it shouldn't stray all that far outside of the box made by the rest of the character. Sometimes it has to, but in this case I think the very long style doesn't really fit with the rest of your font. (Especially look at it side-by-side with the ball on the bottom of /ze/, which I think is actually pretty nice, though maybe, <em>maybe</em> it could afford to be a bit bigger.) I feel like it shouldn't recurve upward, and the ball should just point to the left; at least, that's what I would do, but go with your heart. This goes as well for /Ka/ and /Zhe/. Also for those two, the bottom legs are distractingly Bodoniesque, by which I guess I mean vertical. I think they'd fit your style better if they were more diagonal. I second what Freiberger said about the too-wide characters, and I would also probably add /te/. I wonder whether the serifs on /te/ (and /ghe/) are big enough, too. Speaking of serifs, the spike on the bottom of /dzhe/ seems to me more characteristic of the rest of your font than the ones on /shcha/tse/Dzhe/. The stress is a bit weird on /eh/ from being made out of a mirrored /c/ shape, and lastly I think the left serif of /Tviordiyznak/ should match the left serif of /T/.</p>
      <p>(By the way, there's a typo in италяьянского in the fourth stanza, my very elementary Russian proofreading skills tell me.)</p>
      <p>Cool stuff!</p>
