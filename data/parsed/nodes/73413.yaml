      <p>Yanek,</p>
      <p>Some more feedback on your latest Cyrillic attempt from a native speaker (<a href="http://typophile.com/files/hercowicz3.png" title="http://typophile.com/files/hercowicz3.png">http://typophile.com/files/hercowicz3.png</a>):</p>
      <p>/ш/ is too definitely wide, consider compensating width<br>
      /б/ doesn't look "right" —&nbsp;should be bent more<br>
