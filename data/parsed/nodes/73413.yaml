    date: 2011-05-09T03:46:00
    date_raw: 9 May 2011 — 3:46am
    votes: null
    html: |-
      <p>15 minutes bold: <a href="http://typophile.com/node/72791#comment-423128" title="http://typophile.com/node/72791#comment-423128">http://typophile.com/node/72791#comment-423128</a><br>
      In FontForge: 1) scale vertically 1000% 2) style, change weight 3) scale vertically 10%. When verticals gain weight by 12 em, horizontals by only 1 em.<br>
      Of course this way is good for quick evaluating and require subsequent editing/grinding and adjusting sidebearings.<br>
      BTW vertical size of glyphs changes a bit, so you need to a) pinpoint the desired height b) evaluate needed scaling factor (e.g. 9.8% or 9.9%, Nota bene: I want  bold to be a bit [e.g. 5 em] bigger).<br>
      Edit: everything is in "Fontographer: Type by Design" by Stephen Moye <a href="http://www.amazon.com/s?ie=UTF8&amp;keywords=Fontographer&amp;rh=n%3A5%2Ck%3AFontographer&amp;page=1" title="http://www.amazon.com/s?ie=UTF8&amp;keywords=Fontographer&amp;rh=n%3A5%2Ck%3AFontographer&amp;page=1">http://www.amazon.com/s?ie=UTF8&amp;keywords=Fontographer&amp;rh=n%3A5%2Ck%3AFon...</a></p>
