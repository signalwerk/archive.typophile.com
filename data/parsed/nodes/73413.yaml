    date: 2010-10-17T12:00:00
    date_raw: 17 Oct 2010 — 12:00pm
    votes: null
    html: |-
      <p>Hi Janek. A great work so far.</p>
      <p>As long as I understood, your goal is to keep some degree of inconsistencies and imperfections one finds in original print which inspired this revival. So differences in stems or curves are intentional and you will not do a normalization (as one finds in Elsevier Book or other "cleaned" fonts).</p>
      <p>Anyway, I think your |f| could benefit with bigger contrast –I mean, to make the curve thinner. Serif in upper leg of |k| also must be heavier to be compatible with serifs at top of |v|w|y|. Terminals of |s| could also be a bit bolder to keep overall design, marked by a kind of dot gain in old printing.</p>
      <p>About OSF, I prefer the first set. Surely, |5| needs to be narrower, as Brian pointed, but the new design conflits with |3| in the bottom leg –it may have the same kind of opening ratio. I also think this style of |5| is very much calligraphic and hard to read. I may be wrong, but I believe in 17th Century Dutch school already established a nice trend to be more and more legible instead of the ornated and artistic approach one finds in French and Italian typography during much more time. So a less "stylish" approach seems more coherent with the remainning glyphs, IMHO.</p>
      <p>I also prefer the first OSF |0|. This is a very personal question, but I always disliked OSF 0 with inverted flow/contrast. I undestand this was made to differentiate |0| from |o|, but the |0| becomes strange for me. Your first |o| is perfect.</p>
      <p>I got impressed how good the font print and reads. Keep the great work.</p>
      <p>(I sent you a PM about Roman numerals.)</p>
    html_clean: |-
