    <p>Hi Typophiles,<br>
    In july I bought the book printed by Elzeviers in 1661. (<a class="freelinking external" href="http://typophile.com/node/72762" rel="nofollow">here</a> you can find some details). After a short research I realised there is no any fonts based strictly on types used by Elzeviers[8 pt] available now. [edit: except DTL Elzevir, but based on 14 pt /Augustijn Romeyn/ not text]<br>
    So... I decided to make a font (first in my life :D<br>
    Font under working name VanDyckBoek is intented as typeface for books. The shapes look up to printed letters set at about 8 pt.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/vandyck_5470.png"></div><br>
    I have attached my first attempt here. I'm particularly concerned about inconsistencies in stroke widths/contrast, overshoots etc and overall look of these letters. At this moment there is no numerals; italic and titling version are in future plans. <p></p>
    <p>Every your opinion is highly appreciated.</p>
    <p>Jan Żurawski</p>
    <p>Update: Greek script. See this file: <a href="http://dl.dropbox.com/u/19437300/kor13.png" title="http://dl.dropbox.com/u/19437300/kor13.png">http://dl.dropbox.com/u/19437300/kor13.png</a></p>
    <p>[10.09] Very rough version in text:<br>
    [Dec 25, 2010] Four fonts: Zero, One, Two and Three in new png files:<br>
    [Dec 27, 2010] Sidebearings set the same in all fonts, so now it almost fits<br>
    [Dec 31, 2010] Cyrillic added - see hercowicz3.png. As a bonus this beautiful song by Ewa Demarczyk <a href="http://www.youtube.com/watch?v=dzV9Fa9v8Bc&amp;feature=related" title="http://www.youtube.com/watch?v=dzV9Fa9v8Bc&amp;feature=related">http://www.youtube.com/watch?v=dzV9Fa9v8Bc&amp;feature=related</a> text Osip Mandelsztam, translated by Wiktor Woroszylski<br>
    [JAN 21, 2011] Some amendments, 6th line: old...new. file 21_01.png<br>
    [MAR 26, 2011] 36.png italic, Polish text<br>
    [APR 15, 2011] curiosity - VanDyck on screen 09.png and 42.png (Nightly 6.0a1, Win XP)<br>
    [JUL 22, 2011] Biblia Sacra<br>
    [DEC 07, 2011] Mongolian</p>
