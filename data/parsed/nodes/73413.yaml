      <p>Hello Angus!<br>
      I am very glad you like my effort. I tried to reproduce the shapes of the printed letters made by Van Dijck; &gt;good character&lt; acknowledgement to Van Dijck and Elzeviers! It's important to me that I should avoid the sameness of the glyphs, though I want them to be consistent in the spirit.<br>
      [Letter-spacing is in a very preliminary stage. I will increase tracking by 5% or more.]<br>
      The fourth "a" is the basic now (see the last pdf in the first topic).<br>
      BTW I think the glyph "a" 'makes' the font, like (beautiful IMO) Stempel Garamond vs. (ugly, again IMO) Apple Garamond.<br>
      best wishes<br>
      Jan Żurawski</p>
