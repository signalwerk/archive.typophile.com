    html: |-
      <p>Okay, I see now that they don't mandate the exact typeface, just certain parameters:</p>
      <p><a href="http://www.fda.gov/ora/inspect_ref/igs/nleatxt.html#General/Formal%20&amp;%20Print%20Size" title="http://www.fda.gov/ora/inspect_ref/igs/nleatxt.html#General/Formal%20&amp;%20Print%20Size">http://www.fda.gov/ora/inspect_ref/igs/nleatxt.html#General/Formal%20&amp;%2...</a></p>
      <p>But Helvetica and Franklin Gothic are specifically used in the government example, so everybody probably uses these so as to guarantee that the label won't be found in violation of the requirements.</p>
      <p><a href="http://www.fda.gov/ora/inspect_ref/igs/nutri18.gif" title="http://www.fda.gov/ora/inspect_ref/igs/nutri18.gif">http://www.fda.gov/ora/inspect_ref/igs/nutri18.gif</a></p>
      <p>I applaud your interest in making your label nicer, but just be careful that you don't end up causing your company a lot of headache with fines and reprinting costs.</p>
      <p>-- K.</p>
