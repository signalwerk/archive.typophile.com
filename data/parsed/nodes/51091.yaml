    <p>Hi everyone!</p>
    <p>Im a bit stuck on what typeface to use for the Nutrition Tables/Food tables on my food packaging design...at the moment i have got<br>
    helvetica as place holder on my design...</p>
    <p>From what i have seen and read..the typeface for Nutrition Tables/Food tables its generally<br>
    Helvetica,Franklin Gothic or trade gothic ( i think in the states they recommend to use in on the food label?)</p>
    <p>I like the look of FF Milo (ias it has a nice large xheight and looks<br>
    awesome small print - first saw it on fontfeed) and Galaxie Polaris a new typeface designed by<br>
    Chester Jenkins.</p>
    <p>Can anyone suggest a good alternative to helvetica that prints good very small and perhaps has a larger x-height?<br>
    or you think i should just stick with helvetica for the Nutrition information?</p>
    <p>Thanks for your time, appreciate it!</p>
