      <p>Awesome thanks for some of your guys Suggestions... I don't have to worry about a company as this is a student project however i am trying to get the finish product/package looking like industry (supermarket) level obviously.</p>
      <p>kentlew - cheers for the links, however in New Zealand hey don't really specify i recommend typeface for Nutrition information like that did on that site. </p>
      <p><a href="http://www.nzfsa.govt.nz/consumers/food-labelling/understanding-food-labels/" title="http://www.nzfsa.govt.nz/consumers/food-labelling/understanding-food-labels/">http://www.nzfsa.govt.nz/consumers/food-labelling/understanding-food-lab...</a></p>
      <p>Overall i guess im a little subjective to use Helvetica as i feel it is overused and i tend not to use it in my work.<br>
      However since its so familiar i think consumers will wonder whats different if i was to change it dramatically?</p>
      <p>thats why i guess many people do use helvetica as its a pretty safe typeface, and you can't go wrong with it.</p>
      <p>the food labeling is for a children's snack...but the parents would no doubt be reading that information/buying the product.</p>
      <p>But if anyone else has more alternatives, that would be much appreciated... i will have a go to see what the suggestions look like<br>
      Cheers</p>
