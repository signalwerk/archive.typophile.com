    html: |-
      <p>William's perception may be an example of what James Mosley identified in his ATypI talk about English Vernacular: The more attention we pay to the "Classic" model of the Renaissance, the less likely we are to appreciate the strengths of other styles, and Kris' typeface looks to me to be a really beautiful example of this other classic, the 18th-century vernacular style: wide, stout letters, squarish shapes, baroque finish, derived less from broad pen and more from pointed pen.</p>
      <p>I really like this design and think it carries a wonderful amount of elegance and luxury without being fussy. Nice work, Kris!</p>
