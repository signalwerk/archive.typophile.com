      <p>&gt;Is 100% “even” the most desirable thing to have? I think that ’evening’ out the widths would kill the spirit.</p>
      <p>Well, I admit this is my pet theory, but I think that in order to look even you have to make the letters more different, not less different--but in specific ways. So it's not a matter of evening widths; it is a matter of their relationships. </p>
      <p>I'm can't tell you physically what it is, but I think I can see it when I put a letter between others, and play with its width and weights of strokes. I think it has to do with the overall density of the black (or white) within the advance width, but also it is affected by the distribution of weight in the letter.  </p>
      <p>It ends up with there being a relationship among widths within a design, where making some too narrow or wide in relation to the other disturbs the rhythm of the way they set, and makes words look not as good, even though the individual letters may look good. </p>
      <p>It is related all the readability stuff I've been blathering about on typophile. Hopefully I'll very soon be able to give you a detailed illustration of how I've carried it out, but I think there are a lot of typefaces that do this quite well--including some of your own. </p>
      <p>Kent, might you put up a scan of those you were referencing?</p>
