      <p>Stefan, </p>
      <p>Thanks. There's another important factor here, which is not my theory but that of David Kindersley. He wrote that there is a 'visual center' to a character, and that visual center needs to be equidistant from the side bearings to look balanced within words. The visual center is something like if the letter were solid, and you put it on a board, the visual center would be near where a fulcrum would have it balance. Except that the left and right extremes of the letter have more weight--Kindersley used the square of the area in a column slice of the letter (square of its weight, if solid), rather than just its area (weight).</p>
      <p>There is another factor noted by others, which is that the spaces between letters need to look visually even. But the need for visual centering and for visually even spacing between different letters don't necessarily work together, so not every design will space well as far as even color. </p>
      <p>Kindersley gives the interesting example of the L, and the often heavy serif at the end of the leg. What this heavy serif does is to shift the visual center of the L to the right. And that means that if you space the left side bearing of the L similar to the I, the L will look visually less unbalanced than it would without the serif. It still leaves a hole, unless you have an all caps setting very widely spaced, but it helps.</p>
      <p>Kindersley's theory doesn't capture all that is going on visually, but it is a very interesting insight, I think. It shows that how you distribute the weight in the glyph affects how even the color will be, and how you should space it.</p>
