      <p>&gt;not be so much their relative width as choices in how the weight is handled.</p>
      <p>Yes, both weights and widths are involved. I just first noticed the a, that it pushed itself to my attention a little more, which is not so good. My first guess was that it is too wide. In general to improve color and rhythm, is a matter of playing with both weights and widths, and hopefully combination of them ends up working.  </p>
      <p>Kris, I wish I had a comprehensive theory, but I don't. I just have ideas, which I apply by trial and error. Some of the ideas are: </p>
      <p>1. Even color is paramount in the lower case of a text face, because uneven color constitutes 'noise' that interferes with readability. The idea is that the only thing that should be different are the shapes, and not the *apparent* darkness or lightness of any parts. This goal can't always be realized, as with the L an r, but closer is better. </p>
      <p>Caps, however, don't have to be even color with the lower case, since the caps are supposed to stick out as markers. Maybe for German even color between caps and lower case is more important--I don't know. </p>
      <p>2. Even color does involve the same black/white density within the advance width, in the x-height region, I suspect. The counters need some kind of harmony, but it's not a matter of strict equality, either in width or area. I can't characterize it more precisely, at least not yet. </p>
      <p>2. Often achieving even color often means more variation in among characters--a design that is less 'modular.' I have ideas on how to do this for the design I have been working on, and will put up an illustration after I finish the text size--I hope very soon!</p>
      <p>3. As a practical matter, as I work I compare on the screen the same words in my design and another typeface I think is very even. My main standard has been Adobe Garamond, but I have used others, including recently Kent's Whitman, which I think is admirable in that respect. It probably helps to have a design that is in the same general category, but the idea is *not* to match the design, but the evenness of the look. </p>
      <p>Some tricky stuff is going on with vertically divided letters, like a e s A E S. Generally, when you divide a space, the top half is going to be vertically smaller, and often narrower as well. That is often going to affect the counter, or how wide it will be. Generally, the whole thing seems to get narrower to look right; a's are usually narrower than n's or o's, I believe.</p>
