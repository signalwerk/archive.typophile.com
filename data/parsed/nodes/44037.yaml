      <p>As I said, even color is a product not only of "spacing", but also of width and weight distribution of the glyphs--aspects of glyph design. I usually have several different styles open to compare mine to, not just Adobe Garamond. And I've not just re-spaced, but re-drawn in response to this comparative process. </p>
      <p>Also, I don't think only old styles can have good color. Chronicle is an example of a recent 'Scotch' that I find strikingly well done as far as even color. And as I have said, I find Whitman also very good in that respect, and it also is not an old style. Moderno, now in our headings, is a display face, but it also is very even--even without kerning, which is pretty impressive.</p>
