      <p>&gt;I had to fight the urge to ’smooth’ everything out, as that would make it a bit too bland &amp; average. </p>
      <p>Kris, I don't know if this is what you mean, but I do think it is possible to have extremely even color but still have a lot of 'flavor' in the shapes. The 'Moderno' that is now the Typophile display font achieves this. In other words, it is possible to be 'smooth' in a certain sense, but not bland and average. My concern on this font of yours--and not others  of yours like National or Meta Serif Black--is with uneven color. While I greatly respect the 'eyes' of others commenting in this thread, the fact is that Tiffany noticed something, too. I think that means my reaction is not just a result of my looking too much at other styles.</p>
