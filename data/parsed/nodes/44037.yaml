      <p>Bill --</p>
      <p>I think some of what you're talking about is also a function of different environments -- essentially display vs. text. I'm guessing that the Hardy's commission was a one-size-fits-all and was probably skewed toward display, since I imagine packaging will be a primary use. </p>
      <p>I think the even color you're looking for can also be a matter of distribution of weight as much as relative proportion. In a "transitional" style like Hardys there are some real challenges when trying to get good display qualities. The way that weight is carried on the shoulder of the arch letters (which tend to retain more oldstyle characteristics) vs. the weight around the "corners" of round letters (which are more upright in angle) can be a tricky balance to achieve while still retaining the style's essential qualities. Keeping contrast crisp for display exacerbates the problem, while reducing contrast for more sturdy text performance tends to ameliorate the issue.</p>
      <p>If I get a chance later, perhaps I can get up a scan of some English Latins. But don't hold your breath. I don't know that they're that germane.</p>
      <p>-- K.</p>
