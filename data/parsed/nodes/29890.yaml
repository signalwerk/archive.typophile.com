      <p>Sandro it’s better than the first ones – I can actually read it, although that plant stem going into the second word compromises the ‘i’ and the ‘j’ of ‘Svijet’, and because it’s essentially an arbitrary element, why leave it (the plant stem) there?</p>
      <p>Ravens huh? Are they ghost ravens? Is that why they’re outlined in white?</p>
      <p>Clichés exist for a reason… including the cliché of so-called design educator suggesting that the essential communication issue in the composition is not being addressed, and that the design should be redrawn experimentally <em>by hand</em> starting with a choice of coherent ideas as a basis. (So I think Kevin’s right about where you’re starting from – but then I do this sort of thing in my day job).</p>
