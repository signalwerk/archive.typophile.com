      <p>Hi Sandro. I guess this is much easier for native Croatian speakers to get their heads around. Please take what I say in the spirit of objective critique only:</p>
      <p>Personally I have a problem with the loop of the ‘g’ doubling for the bowl of the ‘e’ on the lower line. In order to read the ‘g’ the ‘e’ has to become something else - so the arrangement compromises the readability of the second line anyway.</p>
      <p>Why a lowercase ‘d’ to start the logo and an uppercase ‘S’ halfway through it? Does Croatian capitalise proper nouns?</p>
      <p>Why the extended stroke of the finishing ‘t’? It doesn’t balance the ‘S’. The negative shape below the second line is awkward (it would be anyway with this letter combination, but…)</p>
      <p>The dotless ‘i’ and ‘j’ in the second line appear to be dotless only because their baseline is with the ‘e’ (not enough vertical space). And the ‘e’ is only that high because you want it to be part of the ‘g’ above… this is maybe not a strong enough reason for compromising the ‘i’ and ‘j’ by removing their dots. </p>
      <p>Are they a ‘classical’ band? Why use a ‘classical’ type style? </p>
      <p>What aspect of the idea of ‘another world’ is being incorporated into the arrangement? Where is the design actually crossing boundaries?</p>
      <p>Contrary to what Lore says above, I think it <em>should</em> look like a rock band, in a conventional sense. There are many other ways to start exploring this name visually, so I advise you to return to the drawing board.</p>
