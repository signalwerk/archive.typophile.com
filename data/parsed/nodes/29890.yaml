      <p>garden-</p>
      <p>i don’t know how many variations you have tried, however, it looks like you’ve tried maybe 10 and are just stuck. don’t get caught up in the typeface selection.</p>
      <p>like everyone’s said, try sketching a bunch of versions. sure, the computer is easier to manipulate but without a strong concept, your execution will fail.</p>
      <p>there are lots of great typefaces out there. one of my new favorite foundries is <a href="http://www.typetrust.com">www.typetrust.com</a> you can find some great typefaces there that might fit what you are looking for. </p>
      <p>i would scratch your initial concepts due to the awkwardness and legibility issues. i am not opposed to the manipulation of the type, but if you’re going to do it, have purpose behind it and make it appear logical, even though it’s not. that’s the beauty of ligatures.</p>
      <p>best of luck.</p>
