    html: <p>Ren� -- <br> <br>It looks like Indy is determining the location of the baseline based on some characteristic in the font which varies in each of your versions -- for instance, the highest point of your ascender.  <br> <br>Try setting the First Baseline Offset for each text frame to a consistent Fixed measure in the Text Frame Options dialog. <br> <br>-- K. <br></p>
