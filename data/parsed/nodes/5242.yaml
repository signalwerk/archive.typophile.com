  html: "<p>Hi guys,  <br> <br>I incountered a very annoying error in InDesign. I created a layered font called Kryptonite. It exists out of 3 layers that on top of eachother form a font that resembles the logo I ones created for a client.  <br>The correct order in which the have to be stapled is: A (Blue), B (Green) and C (White). <br> <br>In QuarkXpress (yak) the fonts are perfect, but in InDesign (jummy) it seems like the baselines are shift. The font doesn't fit anymore.  <br>I checked in FOG but everything is consistent. Has anyone had this error too? I know it's a problem that you don't encounter unless you use a font like this, but perhaps someone knows. <br> <br>In this image you can see what happens. The upper one is Quark and the lower one InDesign. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/38482.jpg\" alt=\"Kryptonite error\"> <br> <br>Please help, because I spent a whole lot of time getting this font to fit properly. <br> <br>Thanks, <br>Ren�</p>"
  html_clean: "<p>Hi guys,  <br> <br>I incountered a very annoying error in InDesign. I created a layered font called Kryptonite. It exists out of 3 layers that on top of eachother form a font that resembles the logo I ones created for a client.  <br>The correct order in which the have to be stapled is: A (Blue), B (Green) and C (White). <br> <br>In QuarkXpress (yak) the fonts are perfect, but in InDesign (jummy) it seems like the baselines are shift. The font doesn't fit anymore.  <br>I checked in FOG but everything is consistent. Has anyone had this error too? I know it's a problem that you don't encounter unless you use a font like this, but perhaps someone knows. <br> <br>In this image you can see what happens. The upper one is Quark and the lower one InDesign. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/38482.jpg\" alt=\"Kryptonite error\"> <br> <br>Please help, because I spent a whole lot of time getting this font to fit properly. <br> <br>Thanks, <br>Ren�</p>"
