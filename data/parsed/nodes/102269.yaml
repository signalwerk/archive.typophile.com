    html: <p>It was quite common for woodtype faces not to have names, but simply numbers. Rob Roy Kelly's book shows a number of examples where this is the case. This was also true in the instance of the inspiration for my font Matamoros NF, which is similar to the typeface shown, with a few exceptions, most notable the Os…</p>
