      <p>Thanks Nick. I like your variation on Binner with its flavor of Inland's Inland in the serpentine O and elsewhere. I read Rob Roy Kelly's book several years ago and noted that named woodtype fonts were the exception. I take it from your post that the book does not include a face that is a close match to this one.  Someday I should visit the Hamilton Wood Type &amp; Printing Museum to see what they have that is not available as specimen images online or published by Kelly or otherwise.<br>
      Don</p>
