    <p>This image purports to be "A case of wood type from the Hamilton Wood Type &amp; Printing Museum." I found it at <a href="http://smumn-cn.blogspot.ca/2010/08/case-of-wood-type-from-hamilton-wood.html" title="http://smumn-cn.blogspot.ca/2010/08/case-of-wood-type-from-hamilton-wood.html">http://smumn-cn.blogspot.ca/2010/08/case-of-wood-type-from-hamilton-wood...</a>.<br>
    It looks like a variation on ATF's  Binner [Cumming 1898, patented by Phinney D30253 in 1899]. But the leg of R terminates with a swoop to a big vertical wedge instead of a tapering brush style stroke. ATF's Binner is sans serif while this has tiny serifs like Inland's Corbitt [1900]. The Beak on G and the tail on Q ares flared. Other letters probably also differ in detail, but they are not shown in the image.<br>
    I do not have ready access to Rob Roy Kelly's American Woodtype but could consult a copy at major galley library if this design is included in his collection  of specimens.<br>
    I would very much appreciate your help in identifying the font [perhaps it is unnamed but has a Hamilton font number?] and finding a more complete character set, whether in Kelly or elsewhere.<br>
    Thank you.<br>
    Don<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/WoodtypeSimilarBinner_5429.jpg"></div><p></p>
