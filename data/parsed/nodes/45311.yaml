      <p>Need a something more interesting than your standard ultra condensed sans? Check out <a href="http://www.typetrust.com/font/heroiccondensed" rel="nofollow">Heroic Condensed</a> new from TypeTrust by Silas Dilworth! It is being billed as "the quintessential geometric sans" and is available in a range of 8 weights including obliques. It is on sale now for $160 or 50% off the individual weights. </p>
