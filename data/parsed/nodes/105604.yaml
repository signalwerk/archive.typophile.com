    html: |-
      <p>Firstly thought it could have been harder, a big customization of some obscure techy freebie but I found <a class="freelinking external" href="http://www.dafont.com/miniskip.font" rel="nofollow">Miniskip</a>. Just need to start with Miniskap (middle weight of Miniskip), tweak it a bit (/E crossbar terminal, /i dot) and job should be done.<br>
      Alternative: <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/aura" rel="nofollow">Aura T-26</a></p>
