      <p>Yes, it appears to put the workspace preferences in your user library (MacOS that is).</p>
      <p>[User]/Library/Preferences/Adobe Illustrator CS3 Settings/</p>
      <p>edit: (doh, just noticed you're using CS1 so maybe/maybe not)</p>
