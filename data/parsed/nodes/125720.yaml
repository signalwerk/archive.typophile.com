  html: |-
    <p>Hi there, I am tasked with resurrecting a font from an old strip club sign in LA, which was put up in the 70s, and restoring it to it's "glory" for the new property owners, who are revitalizing the property while keeping the historical look of the old sign font for the new space.  People say the late club owner wasn't design savvy and likely just had the sign created from fonts the sign maker had on hand... (rather than customized...) However, after much research, I believe several of the letters were crafted using different fonts, or derivatives of fonts, that may not exist anymore... I believe I see glimpses of DeVinne Ornamented in there, or maybe fonts like Imperial Granum, or Introspect... But nothing with all letters in one... Will I need to create a new font alphabet using a variety of tweaked fonts? Is it OK to combine bits of several fonts to make one new font?  I don't know what the other letters of the alphabet would have looked like -- so I would also need to "fudge" what the rest of the alphabet looks like... OR, have I missed some historic font that this sign is made from? I would hate to bastardize an historic font and make a new one, if one already exists... Any advice / help would be much appreciated! Thank you!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/gd%20name.jpg" width="736" height="144" alt="" title="Gold Diggers sign for LA strip club, made in the 70s">
