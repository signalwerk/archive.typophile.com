    html: "<p>Three very talented type designers come immediately to mind: Freda Sack (The Foundry, UK), Shelley Winter (UK) and Jane Patterson (Design Lab, Italy). But I don't think any of them are likely to be looking for representation, either because they have their own sucessful companies or, in Shelley's case, focus on custom work not retail fonts.</p>"
