    html: |-
      <p>An almost identical A -- with the angled cross stroke -- is found in F. W. Goudy's National Old Style and Nabisco fonts of 1916 and 1921.<br>
      National:<br><img src="/sites/default/files/old-images/GoudyHalfCentOfTypeV1p99NationalOSCharset_6105.jpg"><br>
      Nabisco:<br><img src="/sites/default/files/old-images/GoudyHalfCentOfTypeV1p119Nabisco_5013.jpg"><br>
      National Old Style is available as a "prop font," i.e. an unedited  autotrace from HPLHS [A Lovecraft fan and gaming  group]<br><a href="http://www.cthulhulives.org/toybox/propdocs/propfonts.html">http://www.cthulhulives.org/toybox/propdocs/propfonts.html</a><br>
      National is shown in detail at pages 300 to 305 of the ATF Catalog for 1923. Luc Devroye has an informative page<br><a href="http://luc.devroye.org/fonts-26299.html">http://luc.devroye.org/fonts-26299.html</a><br>
      The distinctive leg on the R is very similar to the one on Nicolas Jenson’s Roman. See<br><a href="http://www.myfonts.com/fonts/adobe/jenson/">http://www.myfonts.com/fonts/adobe/jenson/</a><br><a href="http://www.myfonts.com/fonts/spiecegraphics/nicolas-jenson-sg/">http://www.myfonts.com/fonts/spiecegraphics/nicolas-jenson-sg/</a><br><a href="http://www.myfonts.com/fonts/linotype/jenson-classico/">http://www.myfonts.com/fonts/linotype/jenson-classico/</a><br><a href="http://www.myfonts.com/fonts/linotype/jenson-classico/">http://www.myfonts.com/fonts/linotype/jenson-classico/</a><br>
      Don</p>
