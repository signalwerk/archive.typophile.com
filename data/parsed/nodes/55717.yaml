    html: |-
      <p>Here is example cycling code based on CALT, originally cooked up by Tom Phinney:</p>
      <p>feature calt {<br>
      lookup rotate {<br>
        sub @default @default' by @alt1;<br>
        sub @alt1 @default' by @alt2;<br>
      } rotate;<br>
      lookup rotate;<br>
      } calt;</p>
      <p><a href="http://silasdilworth.com/">Silas Dilworth</a> and I recently released <a href="http://www.typetrust.com/font/blackmonday">Black Monday, a font that cycles through three glyph sets.</a> It turned out that while CALT is nice, it is not widely implemented. Making matters worse, it’s not always on by default. And it’s flaky—for example, in Indesign long strings of nonstop CALTs occasionally result in CALT turning off (although for display faces this won’t usually be an issue). Silas dealt with this by writing a program that generates a massive list of LIGA ligatures to handle the cycling; it works very well. </p>
      <p>Would the mods please make a sticky out of one of the older, in-depth posts?</p>
