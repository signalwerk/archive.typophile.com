    <p>Hello,</p>
    <p>New to the forum here (and to OT)(and have a decent working knowledge of fontlab), forgive if this has been covered. </p>
    <p>I am looking to add an opentype substitute feature into a font i have begun building. My intent is to have three versions of each character that will cycle as to appear randomly. That being said, my question is threefold.</p>
    <p>1- In fontlab's glyph window, where do i create the alternate characters, and what would be a typical naming convention?</p>
    <p>2- Would it be easier, code-wise, to randomize each character? or to create alt_set1, alt_set2, and alt_set3?</p>
    <p>3- what would be the best way to set up the glyph classes to achieve this result?</p>
    <p>I hope this makes sense..<br>
    Thank you for any and all input!<br>
    Johio</p>
