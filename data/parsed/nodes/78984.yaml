    html: |-
      <p>Yes, it's the FontLab-internal glyph input method, which was present in FontLab and FontLab Studio for a long time, and was also added to Fontographer 5. </p>
      <p>The slash acts as an escapement character, as does the backslash. The slash followed by a glyph name (until the next slash or a space) produces the desired glyph, a backslash needs to be followed as the hexadecimally written Unicode codepoint (with an optional "<code>u</code>" prefix). So to get the Euro glyph, you can type it directly as a character from your keyboard (<code>€</code>), but this is not always practical (especially for characters that are not mapped to the keyboard layout you are using). Therefore, you can alternatively type slash+glyphname (<code>/Euro</code>) or backslash+Unicode codepoint (<code>\20AC</code> or <code>\u20AC</code>). </p>
      <p>The slash method is particularly useful if you want to kern or space *unencoded* glyphs (a.k.a. OpenType alternates) such as the small cap A. They do not have a Unicode codepoint, so they cannot be typed in directly as a character. In FontLab Studio and in Fontographer 5 you can enter its glyph name using "<code>/A.c2sc</code>" or "<code>/A.sc</code>" (or whatever the glyph is called in your font). In Fontographer 4, there was no way to type in such glyphs. </p>
      <p>Therefore, to "unescape" slash or backslash, i.e. to actually type in the character, you need to type it twice in FOG5 and FLS5: <code>//</code> or <code>\\</code>. Of course, you can also apply the escapement methods to those, i.e. type in <code>/slash</code> or <code>/backslash</code> or <code>\002F</code> or <code>\005C</code>. But <code>//</code> and <code>\\</code> are the quickest. </p>
      <p>The Fontographer 5 user's manual is included with the installer, and is also available for download from fontlab.com in PDF format. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
