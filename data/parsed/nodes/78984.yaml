  html: <p>I have the oddest quirk showing up in Fontographer. In the metrics window the slash does not show up until it is typed the second time. Any suggestions?</p>
  html_clean: <p>I have the oddest quirk showing up in Fontographer. In the metrics window the slash does not show up until it is typed the second time. Any suggestions?</p>
