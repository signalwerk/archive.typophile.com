    html: |-
      <p>I don't use FOG, but this behaviour sounds identical to what you get in FontLab -- when typing a character in the preview pane slash is used as an escape character to indicate that what follows is the glyph name (e.g. typing 'Aacute' will produce the string 'Aacute' whereas typing '/Aacute' will produce the string 'Á'). This means, though, that to enter the slash character you need to type it twice as is normal for escape characters. This behaviour is internal to FontLab and doesn't mean that the generated font will require the user to type it twice.</p>
      <p>André</p>
