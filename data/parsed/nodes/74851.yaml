      <p>This is called attribution. Some fonts use the <a href="/wiki/Attribution%202.0%20Generic" class="freelinking" rel="nofollow">Creative Commons Attribution 2.0 Generic License</a>, which allows any use, under the condition the fonts are attributed in the specified by the author or licensor. There is are fonts that use it listed on <a class="freelinking external" href="http://webfonts.info/wiki/index.php?title=Fonts_available_for_@font-face_embedding" rel="nofollow">this page</a> The IM Fell Types also used a similar license, but have since switched to the SIL Open Font License.</p>
      <p>Hope that helps.</p>
