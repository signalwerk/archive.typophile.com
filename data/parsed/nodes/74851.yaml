    html: |-
      <p>You can not ‘purchase’ fonts (like most software) — you pay for a license to use them, the cost of which depends on the way the font is deployed and the number of computers it will installed on.</p>
      <p>The so called free fonts mostly use a licensing scheme where personal use is free, but commercial usage is subject to a fee. </p>
      <p>The whole attribution issue is debatable — I have never seen a EULA for a free font where this was a requirement. Distribution is a different aspect: you are required to keep font and EULA together when redistributing.</p>
