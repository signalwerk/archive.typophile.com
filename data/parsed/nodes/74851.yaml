      <p>The license of the font <a href="http://iris.math.aegean.gr/kerkis/" rel="nofollow">Kerkis</a> (a nice Greek accompaniment to Bookman) states that<br>
      <cite><br>
      If you want to use this font family in commercial work (like in books) you *must* include in the Copyright section the fact that you are using "Kerkis (C) Department of Mathematics, University of the Aegean".<br>
      </cite><br>
      The font is otherwise free to use.  However, I think Kerkis is now also licensed under the LaTeX Project Public License, and that license does not have such a restriction.</p>
