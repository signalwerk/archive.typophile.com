      <p>This is wrong from the standpoint of convention. But that doesn't make it wrong from the standpoint of effectiveness (which I think is the point you want us to get, Nick). </p>
      <p>However, I don't think these modifications add anything positive to this particular design. Average Joe probably wouldn't notice anything unusual. It's like trying to be rebellious by putting a temporary tattoo on your shoulder and wearing long sleeves. There's no meaning or point to it.</p>
      <p>For an example of unconventional glyphs that do add meaning see Chester's modification to Galaxie Polaris for the Alliance for Climate Protection (<a href="http://www.wecansolveit.org/" title="http://www.wecansolveit.org/">http://www.wecansolveit.org/</a>). That is certainly an unconventional w, but it is, in a nutshell, the brand and the message. Which makes it effective. [edited last sentence because it made no sense!]</p>
