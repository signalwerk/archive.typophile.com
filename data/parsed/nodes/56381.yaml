      <p>It is not the anti-penlogic that bothers me. It is the awkward angles of the legs which leaves a huge space at bottom center and probably makes the A to W fit very clumsy looking. If you are going to go that way, go further and make the outer strokes much more to wards the upright and make the rest of the glyphs a system to fit. I know the M is often done in this way. It appears to work for the M for some because we are used to it but I think there may be more to it. The weight moves more to bottom both with the traditional M and W--is this visual gravitation? I don't know but the Romans did something that way for a reason. Perhaps using the V as center, who knows? My guess is that there is some basis beyond traditional habit. Flipping an M for a W can also possibly cause confusion between the two letters. With one with straighter sides, the confusion is minimized.</p>
      <p>I can only say that it looks awkward to me beyond the tradition. I think it makes itself look far too different than the rest of the glyphs to make sense as a family or even as a system. It make be more believable as a sans than a roman since roman faces evoke more a traditional expectation. I might like to see all the stroke weight and contrasts flipped to match to see if that helps.</p>
      <p>I might add that I don't mind someone trying this kind of solution in the least but I don't think this begins to work yet and could use more time and effort to push it closer to something that works without me having to say, "WTF is that?"</p>
      <p>ChrisL</p>
