      <p>I find that letters must show some inclination. They must tell you, in some way, in what direction your eye should go. When we “revert the contrast”, as we say, thus going against convention, letters seem to tilt to the left, which “sounds” wrong; we know we read from left to right, but the letters are telling us otherwise. I've thought about things this way, too, and that's where I got. I now use this piece of information whenever I look at or draw any letter.</p>
      <p>I think that's the main thing that really seems wrong. The rest – different stroke widths, no serifs on top of the lc i or the bottom of the middle lc m leg, the lc e, the lc t, etc. – isn't what we'd consider a great, homogenous, coherent and (classicly or not) beautiful design, but it's not throwing the average reader off. The Uc “W”, though, I think might. The lc one, probably not so much.</p>
