      <p>Hi Nick,</p>
      <p>it looks<br>
      a) like an upside-down ‘M’, because the outer diagonals usually are more inclined, in a ‘W’<br>
      and<br>
      b) mirrored, because the contrast axis is in opposition to the tradition of translation-based (broad nib pen) contrast, and also what other letters like the ‘s’ suggest.<br>
      F</p>
