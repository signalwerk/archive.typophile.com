    html: <p>Hmm allot of interesting points that I think are inter-related. I'm a newbie to type design, I usually listen rather than talk here but it strikes me that what is wrong with this font and indeed is the basis of convention in large areas of design/aesthetics and from what i can see also relates to type, that being nature. Golden ratio, colour theory etc (you all know the list)  breaks down to either biological or instinctive values (such as blue being used for medicine bottles because there is nothing naturally blue that can be consumed without harm, it signifies a warning even to those who have no idea). This font fights how we read (as previously mentioned above), it fights how we write (again previously mentioned above) and the way we do those things derives from our physical nature. Without being able to strongly link terminology most of the conventions it goes against can be clearly drawn back to natural movements, natural rhythms, forms, relationships... not just in human beings but in everything that grows around us. I think this font strikes us as wrong because it goes against not only how we do things but the natural order around us, but it is still readable, so to the untrained eye it just sits uneasily in the back of the mind, something they might more easily recognize later. Indeed likely successful in some of its aims but not through beauty or grace which would have to contain natural harmony (in itself and the world around) or clear decisive moves that are discordant to make a obvious point (that would have to be highlighted at very least via consistency).</p>
