    html: |-
      <p>David</p>
      <p>My dictionary says of logo, <em>“a trademark, company emblem or similar device”</em></p>
      <p>So it’s an heraldic shield (technically an escutcheon). I knew what artslons meant and this place is all about efficient communication. Sometimes that’s offensive.</p>
      <p>Not everyone’s first language is English. Should we ignore posts for bad definitions/nomenclature/grammar/syntax? I don’t think so.</p>
      <p>Yes ’SPQR’ is pretty ’efficient branding’ isn’t it. ’Gladiator’ had it tattooed on his arm and I thought, rightly or wrongly, “that is great branding”.</p>
      <p>Come back if you find out where the logo/escutcheon is from. I’d quite like to know.</p>
