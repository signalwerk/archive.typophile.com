    html: |-
      <p>Of course, Mr. Hrant is perfectly correct.<br>
      Due to the geometrically increasing mass of each square mm of paper, the gravitrons of the stock affect the Heidelberg Windmill press in the w-y dimension, causing time dilation and a subtle but noticeable warping of space. The primary problem has to do with shortening of serifs as the press approaches Warp One.</p>
      <p>However, we have developed certain techniques to help overcome this.<br>
      San serifs are nonetheless subject to the poorly understood ghost serif problem.</p>
      <p>The most successful types used, of course, are those which have stood the test of time-and-space, typically those which evolved through natural hand-eye-brain interaction, rather than those typically ugly letters created at the drawing board or computer which have nothing whatsoever to do with the human experience of touch or love. Much the same as mid-20th C Architecture...</p>
      <p>PF</p>
      <p><a href="http://slowprint.com/">http://slowprint.com/</a> Letterpress for Typographers!<br><a href="http://alphabets.com/">http://alphabets.com/</a></p>
      <p>PS Of course, it's really a reference to slow food. The best ingredients, prepared with care, enjoyed with pleasure...</p>
