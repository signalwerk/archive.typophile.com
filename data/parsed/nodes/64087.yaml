    html: <p>White-on-dark isn’t impossible as some people would have you believe. With the right inks, the right stock, and multiple hits of white it can work out pretty well, especially if the stock isn’t black or something close to black. You just need to work with a printer who’s actually interested in tough jobs and be willing to pay extra for the effort.</p>
