      <p>Hi, and thanks so much for the link!</p>
      <p>It's SlowPrint, like slow food ;-)</p>
      <p>Yes, in fact I've just been doing some work with an excellent silver ink. The metallic content (probably aluminum) is far more opaque than any pigment ink, including opaque white. I expect that adding white to the silver would produce an effect like the cards shown above.</p>
      <p>These are definitely letterpress with ink on blue stock. While hot-stamping with foil or film (any Pantone color, in fact) is absolutely opaque (and can be holographic as well!) it's also really plastic looking, at least IMHO. Hot stamping with gold-leaf has a very honorable history, of course, but that's really a different ballpark altogether.</p>
      <p>I'll try to get some of my trials up on our flickr page in the next few days...<br>
      meanwhile, there's plenty there to browse through!</p>
      <p><a href="http://www.flickr.com/photos/pfraterdeus/sets/">http://www.flickr.com/photos/pfraterdeus/sets/</a></p>
      <p>Cheers!<br>
      peter</p>
      <p>slowprint blog: <a href="http://typophile.com/blog/15244">http://typophile.com/blog/15244</a></p>
      <p><a href="http://slowprint.com/">http://slowprint.com/</a> Letterpress for Typographers!<br><a href="http://alphabets.com/">http://alphabets.com/</a></p>
