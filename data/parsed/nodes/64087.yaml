      <p>Peter, that <em>is</em> funny, but if you're having fun at my expense: I was talking about the cylinder press (which AFAIK is the most common letterprinting mechanism today), and I assume you agree with the obvious observation that the bigger the piece the fewer you can fit on a given size paper. Most of the time printing (unless it's a small run) is taken up with "rolling"* so that has a huge impact on the number of pieces you output per time period.</p>
      <p>* Is there a more correct term?</p>
      <p>hhp</p>
