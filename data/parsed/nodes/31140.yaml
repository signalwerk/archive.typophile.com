      <p>Charles, </p>
      <p>it is the applications that decide which features are on or off by default, not the fonts. </p>
      <p>For standard scripts (Latin, Cyrillic, Greek etc.), the features that typically are on by default and cannot be switched off are: "ccmp", "kern", "mark", "mkmk", "rlig", as well as, for non-default languagesystems, "locl". The features that typically are on by default but can be turned off are: "calt", "clig", "liga". </p>
      <p>Adam</p>
