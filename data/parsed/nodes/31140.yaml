  html: |-
    <p>When making a font in FonLab SF5 (i.e., writing the features), is there some way to preset what features are on by default, or is this strictly a matter of the application program (such as InDesign)?</p>
    <p>For example, I made up a set of fonts for a book designer, who complained that the ligatures didn't work. We never did trace this down, he just changed fonts. He does use InDesign on a Mac and I use Windows XP; they worked fine on my machine. For all I know, he simply forgot to check the features list in InDesign. But If I could cause certain features to be on when the typeface is selected, that might solve a few problems. I did look in the FL5 index, nothing under "default . . ."</p>
    <p>The OT tag registry indicates certain features should be on or off,</p>
    <p>&gt;&gt;UI suggestion: This feature serves a critical function in some contexts, and should be active by default.&gt;&gt;</p>
    <p>. . . I always assumed that was up to a particular applications program.</p>
    <p>TIA</p>
    <p>Charles</p>
