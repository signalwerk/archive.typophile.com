      <p>AFAIK, these are only guidelines from the OT Specifiers. They are for both type Devs and app devs.</p>
      <p>They help the developer of the OT feature set anticipate what an application <em>may</em> do, and application developers understand what might be best for them to choose. Whether or not an OT feature is available and how it is implemented (like defaulting to "on") is up to the application developer.</p>
