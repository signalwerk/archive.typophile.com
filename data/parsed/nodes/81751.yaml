      <p>Firstly, I think that this is an interesting idea in itself. I am not sure how it would work, or how weel. Most people just buy them and download them, also creating a backup. The one thing that I find annoying is using multiple fonts. I have enough trouble with USB ports. Somehow, putting multiple font sticks into my computer would not make things easier on me.</p>
      <p>That stated, there is another here that you are overlooking, I think. What about selling USB sticks in the shape of fonts, like you have posted? Personally, I'm always looking for new sticks myself. I'm in the market right now, because I want something bigger than my old 8gb. But, my trouble has always been that they are not very exciting. Oh, I've found a few that aren't plain, but they cost an arm and a leg. </p>
      <p>Just another way to work this, in my opinion. ;)</p>
