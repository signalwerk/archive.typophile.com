      <p>Thank you Cuttlefish &amp; Typodermic, for those great insights.</p>
      <p>Cuttlefish: I know I couldn't store the physical font or typeface on the USB due to the 'EULA' - However I could have a code that allows the buyer to download the font or typeface from the type foundries.</p>
      <p>Typodermic: I did come up the CD packaging for fonts, which the packging for CD covers would look like the food packets you get in a vending machine(see attached 'Mock-Up.jpg') That idea changed with one to one crits with my lecturer. The reason I went for USB sticks is, they can have this use of being re-used over and over again by the buyer. My idea of selling them could be done limited edition at a typography exhibition. That way its being sold to my market who are at that respectable age, of not going into the shop to five finger discount.</p>
