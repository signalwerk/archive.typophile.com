    html: |-
      <p>All attempts at copy protection or other digital rights management with fonts have met not only with customer resistance, but with technical hurdles sufficient to make the product unusable. </p>
      <p>A market exists for font sales in stores on physical media, but those tend to be home and general office users, not designers.</p>
      <p>I do believe there is a market for designer novelty USB memory units. Memory devices in the shape of cartoon characters are already widespread, so I see no reason why other designs wouldn't be accepted as well. </p>
      <p>Demand for your product may not be sufficient for a dedicated single-product vending machine, but they may fit well along side other high-end devices in machines such as those in airports and hotels that sell iPods and such. </p>
      <p>The above are all anecdotal assertions. The experience of others may vary and objective data may not bear them out.</p>
