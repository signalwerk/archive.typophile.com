      <p>The download codes could be unique and a limited run. Even if it's on a USB stick, someone can backup the font and ditch the stick.</p>
      <p>Check out the old Letraset, Deca-Dry packages or some of other 1/4 page dry transfer lettering. The kind that hangs on a display peg instead of lays flat in a drawer. The alphabet was always visible through the cellophane. I used to look at my collection of dry transfer lettering sheets and think, "what can I put these on?". Those weren't fonts that I bought, they were packages of letters.</p>
