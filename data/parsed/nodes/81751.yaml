    <p>Hello (Your name here)</p>
    <p>General scope of project;<br>
    The project I’m working on is selling. Which is done through the notion of a vending machine.<br>
    There are two products being sold 1. The font/typeface 2. Product packaging</p>
    <p>My first solution to approach this concept, is to have a vending machine that stores Discs, where fonts/typefaces were sold on “floppy disks” by such foundries as FontShop during the late 80s to early 90s.  However with previous talks with my lecturer Discs have become very obsolete in this day of age.</p>
    <p>The approach is finding another way of storing theses fonts, is to make a Font USB stick. Allowing you to store the font and still have future use by the consumer. </p>
    <p>The vending machine which stores theses fonts will be sold in shops such as Magma bookstore where people with good income would buy fonts as Magma being a store to sell design books.  </p>
    <p>Fonts and Typefaces are sold today online by via payable methods.<br>
    Through some research on Typohile.com font foundries that are selling fonts are have new ways of giving customers fonts without files like OTF TTF due to illegal font sharing… This has put some designers off from buying fonts online. This is were the idea of selling fonts in shops can allow more designers purchase fonts over the counter by cash or card.  </p>
    <p>*Please note;<br>
    The vending machine is more of an installation to create its awareness and done at a gallery on limited days of the year or at typography exhibitions.    </p>
    <p>--------------------------------------------------------------------</p>
    <p>1) Do you think more people would interested in buying a font in the shops? rather then online?</p>
    <p>2) Who are your target audience? And the age group of people buying fonts on your website?</p>
    <p>3) If there was a product that stored your fonts like ‘Type USB stick’ and can sold by your website and online - would you be interested in investing in that product?(example a fontfoundry USB)</p>
    <p>4) What illegal ways do have on cracking down on font sharing? As I know most font foundries are programming fonts to certain amount of computers and some needing licensing.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/type-usb-layout2web_4799.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/woodtype-usb-layout-web_4686.jpg"></div><p></p>
