      <p>I've always liked the idea of one-shot retail fonts. As a kid, I'd drool over the Letraset/DecaDry/Mecanorma dry transfer sheets. I'd occaisonally buy one even tho I had no real use for it. Rather than delivering the fonts on physical media, the font could be delivered thru a unique URL inside the package. Nothing fancy, just a folded card glued shut. The outside of the package could be a sort of album cover, like the square flags on MyFonts perhaps with a specimen on the flip side. That way the buyer isn't saddled with another undersized USB stick in the back of a desk drawer.</p>
      <p>A great advantage of selling fonts this way is that it opens the doors to a whole new group of font users. Font enjoyers who lack the knowhow to pirate fonts othe web can simply shoplift them the old-fashioned way. Everybody wins!</p>
