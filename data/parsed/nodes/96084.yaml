    html: <p>I think you might do well to explore something a bit more subtle. The treatments and fonts feel a bit too stereotypical to me. The basis for my branding work is always a thorough briefing, digging deeper into the business, what makes them tick, etc. It also includes a demographic study of the target audience. From that point I narrow down the central essential messages the brand should communicate and begin word association and sketching. Usually this leads to dozens of ideas, which can be evaluated and iterated. Without seeing that process it is hard to say if this is successful. However, I would not be too interested to eat at a place with this logo, as I would expect medium quality food prepared quickly.</p>
