      <p>Welcome to Typophile.</p>
      <p>From your comments ("my very poor design") I assume you're not a graphic designer, so I'm going to suggest that you consider hiring one. Establishing a visual identity for a restaurant is more than just coming up with a logo (although that's important, of course), it's also developing an attractive menu, a web site, advertising, signage, etc. All these things should be professional, work well together, and should reinforce the image you're trying to project. It will be money well spent to get some professional assistance.</p>
