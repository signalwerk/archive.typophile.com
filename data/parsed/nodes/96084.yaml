      <p>MediMexi, I'd suggest looking for someone local (or within driving distance), if possible. It's much easier to get a sense of "is this the right guy?" when you meet them in person. And if they're helping with signage, you want someone who can visit your restaurant, tape mockups in place to see how they look, meet with your local sign contractor, etc.</p>
      <p>You can find designers by doing a google for "graphic designers [city name]" or similar phrases,. If you have friends in the local business community ask if they have recommendations. </p>
      <p>Meet with several candidates, look at their portfolios, discuss what you need, and ask them to prepare estimates. When looking at their work, look for projects that are similar to yours and ask if you can contact those clients to see how the projects went.</p>
      <p>On low-budget projects, college design students are a possibility, but remember that they may have limited real-world experience, especially when it comes to dealing with vendors (printers, sign fabricators, etc.)</p>
      <p>Another possibility is to work with an out-of-town designer you found via the internet, which is increasingly common these days. Once again you should check out their portfolio, references, speak to some of their clients, get a written estimate, etc. </p>
      <p>And remember that you get what you pay for. Hourly rates can vary but their bid is a reflection of how much time they'll spend on your project. The low bidder isn't always the best deal. :)</p>
