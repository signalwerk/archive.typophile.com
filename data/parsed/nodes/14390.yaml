    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Vyaz'</strong></p>
    <p><em>Vyaz'</em> is a decorative style of <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphy</a> characterised by tall, condensed and interlocking letters forming a dense and continous band of text. The style originated in Byzantine (Greek) books in the 11th century, and is related to the style of Greek <a href="/wiki/uncial" class="freelinking" rel="nofollow">uncial</a> lettering employed in Orthodox icons. It spread in Russia and flourished particularly in the 16th century. Three kinds of interlocking are typically found in <em>vyaz'</em> lettering: stem ligation in which adjacent letters share a common stem, letters or parts of letters stacked vertically, and enclosure of smaller letters within larger ones.</p>
    <p>Maxim Zhukov provides the fine attached example.<br>
