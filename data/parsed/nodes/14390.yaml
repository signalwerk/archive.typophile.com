    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;:&nbsp;Vyaz’</strong></p>
    <p><em>Vyaz’</em> is a decorative style of <a href="/node/14164" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic</a> <a href="/node/13722" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Calligraphy</a> characterised by tall, condensed and interlocking letters forming a dense and continous band of text. The style originated in Byzantine (Greek) books in the 11th century, and is related to the style of Greek <a href="/node/13703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uncial</a> lettering employed in Orthodox icons. It spread in Russia and flourished particularly in the 16th century. Three kinds of interlocking are typically found in <em>vyaz’</em> lettering: stem ligation in which adjacent letters share a common stem, letters or parts of letters stacked vertically, and enclosure of smaller letters within larger&nbsp;ones.</p>
    <p>Maxim Zhukov provides the fine attached example.<br><img src="/sites/default/files/old-images/vyaz.gif"></p>
    <p>Thread: <a href="http://typophile.com/node/14377">http://typophile.com/node/14377</a></p>
