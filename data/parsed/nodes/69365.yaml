    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Uhland_6700.jpg"></div><br>
    I recently came across this delightful 1817 silhouette of Ludwig Uhland by Luise Duttenhofer. At the time, Dr. Uhland was 30. He was a well-known Romantic poet, and there are many portraits of him on the Internet, several in old age; in none of them is he wearing eyeglasses. Was this the style for immersing oneself in romantic poetry? <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Friedrich_4690.jpg"></div><p></p>
    <p>In this painting by Friedrich (detail) from the same era, the lady is also holding her book quite close. This is anecdotal, so I wonder if any studies have been done on what normal reading distance is for various kinds of documents. And what does type size have to do with this? And offset vs. letterpress?</p>
  html_clean: |-
