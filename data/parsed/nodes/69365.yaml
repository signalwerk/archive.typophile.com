      <p>I spent a very pleasant afternoon going around the Sainsbury Wing of the National Galley in London, where the mediaeval and early renaissance works are shown, looking for depictions of people reading (or in the case of so many depictions of the Annuniciation, interrupted while reading). There are an extraordinary number, many more proportionally, I recall, than in the collection of later works.</p>
      <p>I hadn't thought about it much before, but realise that I tend to hold books quite close. On the other hand, I hold newspapers at arms' length, and have my computer monitor even further away.</p>
