    html: |-
      <p>After a quick search: Old, but of potential interest.</p>
      <p>Menozzi, M., Rehor, M. &amp; Studeli, T. (2003). Font size and reading comfort (Proceedings paper, Annual Spring Conference of the GfA/17th Annual Conference of the International Society for Occupational Ergonomics and Safety) Munich, Germany. 135–138.</p>
      <p><strong>Abstract</strong><br>
      An experiment was run, in which 23 subjects rated six text of different font size. Ratings were carried out using a presentation on paper as well as a presentation on a cathode ray tube display at a viewing distance of 50 cm. Most preferred font size was 14 pt in the paper presentation and 13 pt in the presentation on display. Preferred size convert to about a letter size of 23.9' and 22.6'.</p>
