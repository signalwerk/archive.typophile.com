      <p>Nice collection of images, Craig.</p>
      <p><em>Perhaps it was just a question of vision impairment? </em></p>
      <p>That would only apply to the 20% of the population who are sufficiently impacted by short sightedness and stigmatism to warrant reading closely, and many of those would use glasses. The lenses to fix simple short/long sightedness are quite simple, e.g. they can be bought off the rack at chemists/drug stores today. So AFAIK they were readily available in the 19th century and earlier.</p>
      <p>It would seem that reading distance is multivalent, related to individual physiology, reading position (chair/desk/standing), document scale (page/type size), text genre (difficulty of language), document genre (balance of text/image) and lighting conditions.</p>
      <p>I always liked the way Schubert rocked the wire-frame look.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/franz-schubert-and-music_6700.jpg"></div><p></p>
