      <p>Hi Michael,</p>
      <p>It's tricky to tell how effective this will be without knowing something about the company. What are the values and unique propositions of this company? That should inform the choice of type and design concept. </p>
      <p>At first glance, this doesn't on its own grab my attention. The best logos have the power to attract further interest about the organisation. I'm not sure what your logo is telling me.</p>
      <p>If you're going to stick with this type rather than find the perfect font, there are a couple of potential improvements I'd suggest. The tracking is tight, which means at small sizes especially on screen the letters will join together. Then, to do with letter widths and white space, the F and M need attention. The F, having all that white space underneath, needs narrowing to counterbalance that. I'd also do something to the M to increase the white space under the armpits and decrease the upper counter, it looks unbalanced to me. The T could be narrowed in the same way as F. N looks narrow. The A looks similar to the R, and the eye has to work to resolve that distinction I feel.</p>
      <p>Is this logotype to be used alone or will there be a graphic element too?</p>
