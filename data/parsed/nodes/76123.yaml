    html: |-
      <p>It doesn't look really bad, but making a custom font might turn out harder than you think. There are many fonts in this style available out there, so I'd just by one of them. If you can't find them. Post a new topic about it here on typophile.</p>
      <p>If you insist on making a custom font:</p>
      <p>Make your curves smoother<br>
      Make the horizontall thinner<br>
      F narrower<br>
      O wider<br>
      U smaller<br>
      T smaller<br>
      An I with horizontal strokes on the top and bottom might look good.<br>
      Spacing needs some work too, but that's for later.</p>
