    html: '<p>I ﬁnally decided to go and look for that book through boxes and dust (hard decision, believe me) but I think it’s been worth it, didn’t remember some interesting details. <br><br><a href="https://web.archive.org/web/20171116132442/http://www.marionboyars.co.uk/Specific%20title%20pages/hitch.html" target="_top">Alfred Hitchcock and the making of Psycho</a> by Stephen Rebello, Marion Boyars Publishers. <br><br>From the chapter 2 — <i>The Novel <br><br>… At Simon <span class="amp">&amp;</span> Schuster, the corridor talk pegged Psycho as a sensational read and a highly exploitable commodity. Art director Jeﬀery Metzner hired graphic artist Tony Palladino to design a title concept that would convey the shock aspect of the storyline. …. The illustrator recalled: “The book and tittle were on the tongues of a lot of people at Simon <span class="amp">&amp;</span> Schuster at the time. That title was so descriptive, I let the tittle become the graphic. It was much stronger than any illustration one could do. The guy [in the novel] was quite cracked up, so, in the graphic, I cracked up the lettering to reinforce the tittle.”</i> <br><br>From the chapter 9 — <i>Publicity <br><br>… First, Hitchcock concentrated not on the stars of the picture but on the title itself. Having taken a particular fancy to the title design for the book jacket by artist Tony Palladino, Hitchcock contacted the advertising agency, McCann-Erickson, to arrange a deal. “[Hitchcock] called me one day,” artist Palladino said, “telling me it was a smashing design and that he thought it would be perfect for the ads for this ﬁlm. He wanted the lettering to dominate the newspaper and poster advertising, with just a few photographs of the main actors. I found it exciting learning how absolutely pragmatic he was. He preplanned so carefully, he could skim oﬀ the fat. I really got the sense he respected creative accomplishment in others.” Palladino received $5.000 for a complete buy-out of his concept, hardly a paltry sum when one considers that novelist Robert Bloch had received little more for the rights to the original book!</i> <br><br>And not directly related with the Psycho logo but from the chapter 6 —  <i>Postproduction <br><br>… Observed Adler* of his experiences with Hitchcock on Psycho: “We made it work. Oh, god, I would have hated it to work in the Hitchcock oﬃce. It was so strait-lace and formal when he was present. Mr. Hitchcock was the most articulate person I ever met. And he always had speciﬁc ideas of what he wanted. I was amazed to see that his library in his large oﬃce contained more art books and current magazines on graphics than I owned. He would specify speciﬁc new type styles that he had seen advertised in Graphis, a magazine mostly graphic artists would get.</i> <br><br><i>*… It was the task of Harold Adler, a movie advertising artist and title design letterer, to make the Bass concepts work on ﬁlm.</i> (For the movie titles). <br><br><img src="https://web.archive.org/web/20171116132442im_/http://www.typophile.com/forums/messages/83/52866.gif" alt="Psychos"></p>'
