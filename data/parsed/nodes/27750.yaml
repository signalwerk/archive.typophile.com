    <p>While in Boston at <a href="/wiki/TypeCon" class="freelinking" rel="nofollow">TypeCon</a> last week I came across a window display that caught my eye. Turns out it's the work of <a href="http://www.siscottdesign.com/" rel="nofollow">UK designer Si Scott</a>. Its beautiful, hand-drawn type with all the nuance of great lettering.</p>
    <p>My pic on Flickr:<br>
    <a href="http://www.flickr.com/photos/joepemberton/216624208/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.flickr.com/photos/joepemberton/216624208/" rel="nofollow"><img src="http://typophile.com/files/216624208_cbb9f4e465_4840.jpg"></a></div><p></p>
    <p>From Si Scott's site:<br>
    <a href="http://www.siscottdesign.com/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.siscottdesign.com/" rel="nofollow"><img src="http://typophile.com/files/siscott_6085.gif"></a></div><p></p>
