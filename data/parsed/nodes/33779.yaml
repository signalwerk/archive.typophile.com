      <p>I transcribed medical reports for many years. Unfortunately there are too many drugs with soundalike names, and at least in the U.S. the drug makers don't try very hard to choose names that don't sound like anything else. One reason I got out of medical transcription is that I was expected to be able to read the doctor's mind &amp; tell whether s/he meant Avelox, which is moxifloxacin HCl, a quinolone antibiotic, OR Aveloz, an unproven cancer drug. Or Murelax, a tranquilizer, OR MiraLax, a laxative.</p>
      <p>Just out of curiosity, in what country is this powerful non-prescription antidepressant to be available?</p>
