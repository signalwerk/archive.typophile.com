      <p>Eben, I agree. This product of mine is, sadly, quite safe. There are about a dozen naturals with extremely promising results in rats, making them potentially much more efficacious than St John's Wort, say, but with no safety record in humans. I've not considered using them. </p>
      <p>Thomas, the UK is slightly stricter than the US, and bans nutraceuticals common there which are known to be potentially unsafe, like Kava Kava. More efficacy and safety studies would be lovely, but the cost for naturals is exorbitant. No little company can afford the literally hundreds of millions of dollars spent on trials that the FDA requires for new prescription antidepressants, no pharmaceutical company is going to do the work, and, in the UK, NHS research on naturals accounts for only 0.1% of their total medication research budget. Nonetheless, there are small trials in the West and trials from Russia, substantial data from real-life use, investigation in hospitals of the sources of any med-induced problems, and impressively thorough academic investigation in China where 'alternative' medicine is of course mainstream. We know, for instance, exactly how many cases of liver toxicity have been attributed to Baikal Skullcap there over the last thirty years (4, out of hundreds of millions of patients), and whether there is any inherently liver-toxic compound in the herb (no; problems are due to exceptionally rare genetic abnormalities). </p>
      <p>On the other hand, almost all nutraceutical formulae for the treatment of specific medical conditions are either fraudulent (especially with standardization claims), incompetent (bunging in everything with any far-Eastern reputation, randomly dosed) or only minimally effective (if only through inadequate dosing).</p>
