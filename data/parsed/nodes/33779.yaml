      <p>Hi George,</p>
      <p>I made comment in the "type for a chocolate company" thread that I think is relevant in any "type for a _ _ _ _ _ _ " thread:</p>
      <p>In essence my point was this: </p>
      <p>There is so much that contributes to successful graphic design. Type choices are an integral component to be sure (and much beloved by us all). However, I think it is a mistake to say, "I'm designing for a children's clothing line... let's start by selecting a font." I realize you're giving us additional info here, but what would be most helpful is to see your design direction. We need to know what your idea is. Show us your bottle, is it tall and skinny, is it short and stubby. Tell us about the illustration you're going to use. Is the emphasis NATURAL anti-depressant or is it natural ANIT DEPRESSANT? These will decide what the type choice should be.</p>
      <p>For example: You can sell tea using Priori ala Tazo, or you can sell tea using Helvetica ala Stash, or Windsor Bold ala Celestial Seasonings. These packaging solution accomplish a design goal and carve out a niche on the shelf. I doubt Sandstrom design started with Priori. Maybe, but more likely they started with a direction: the language of alchemy applied to brewing tea. And the results are much stronger for it I think.</p>
      <p>In other words:<br>
      Bembo could work.<br>
      Sauna could work.<br>
      Beorcana could work.<br>
      Or they could all flop.</p>
      <p>The more you give us, the more we can help.</p>
      <p>Good luck!<br>
      Randy</p>
