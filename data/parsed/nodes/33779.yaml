      <p>Randy, you're absolutely right, and can probably tell I'm not a graphic designer. </p>
      <p>In truth this will be a natural ANTIDEPRESSANT, but would a large proportion of people, given the fear of side-effects or mind-distorting euphoria, and especially among those going "alternative", prefer something that didn't say "THIS IS HARDCORE"? The commonest requests among patients coming to a doctor about their depression for the first time is for a "potent" or "mild" antidepressant - which it more often I don't know - even though there's no such distinction among first-line antidepressants (and no possibility, unless they're bipolar, of euphoria).<br>
      It seems that it's products about which customers have no fear of side-effects or overkill, like (ridiculous) branded ibuprofen, that are most likely to be packaged as hardcore.</p>
      <p>Here's a pic of the kind of thing the image could be like.</p><div class="imageWrap"><img src="http://typophile.com/files/Wheat 5 small edited_4985.jpg"></div><p></p>
      <p>Text will be in the sky, of which there should be more, covering the top half and a bit of a large 3x2x2 card pack about the width and height of a small paperback. The whole package should look high-end, aptly expensive, since the product will have to be more expensive than competitors. Inside will be smaller card packs, labelled just MH for discretion's sake, to fit in a handbag, each containing a week's supply of tablets. Tablets will be dark, shiny, rounded, not the gel-caps usual for natural stuff. </p>
      <p>Here is a potted history of antidepressant branding. It's pretty funny in the early stages. The progress is obviously from illustrating depression to illustration happy-happy joy-joy.</p>
      <p>Nardil, the original (1950s) and still the best:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Nardil 1_4412.jpg"></div><p></p>
      <p>Tofranil, just after:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tofranil_5820.jpg"></div><p></p>
      <p>Anafranil, a 70s (?) competitor to Tofranil:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Anafranil_4393.JPG"></div><p></p>
      <p>The modern rubbish: the latest SSRI and the best branded natural antidepressant, Amoryn. Stylised suns or actual sunlight are the commonest images for natural antidepressant branding.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Modern antidepressants_4689.JPG"></div><p></p>
