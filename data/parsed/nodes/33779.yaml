      <p>I agree that perkiness, which is common in the work of the last fifteen years, is no good for this. Kaatskill is perkier than is ideal, but I haven't found anything better yet. Bembo book, my default choice - just because it's so much better (I do believe in better and worse) than all but three or four text faces - is too distant; perhaps JY Aetna could work? With Haarlemmer Sans? For the name, "Soul Healer" is probably a bit much, too: "Mood Healer" is perhaps better: it at least cuts straight to the point. Other ideas are very welcome. </p>
      <p>Actually this is my own product: I'm aiming to start a little company to produce it, having come to learn far too much about the psychopharmacology and biological psychiatry of mood disorders following my own rather in-depth experience of one of them. Trying many medications without success may have biased me; perhaps the suffering is less, and the expectation of reasonable but not total efficacy greater, for most people considering a non-prescription antidepressant. In reality, it's more common for antidepressants to work brilliantly or not at all.</p>
