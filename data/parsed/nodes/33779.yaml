      <p>Yup, Palatino Sans is really impressive: creamy and expressive, and thanks for the idea.</p>
      <p>Mind reading is rarely infallible, even for computer <em>geniuses</em>. I've been advised to market the antidepressant to professional, web-forum depressives first, over the internet - so anywhere. Based on studies of a combination with the same mechanism of action as two of my components have, it should be effective for at least 60-70% of even clomipramine- or phenelzine-resistant people, and it's getting that mechanism from a herbal extract plus an amino acid that's my hopefully patentable big idea. With good reports from the chronically ill, I'll aim for UK shops. Selling things to the big chains of chemists is a nightmare in the UK, and I imagine in the US too, but to do a substantial amount of good for both humanity and my finances it'll have to be done.</p>
