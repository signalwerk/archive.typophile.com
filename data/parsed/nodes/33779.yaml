    <p>This is a natural antidepressant designed for effectiveness rather than minimal side-effects, to be sold in shops. I'm looking for a sans for packaging and a serif for an unusually full and friendly guide to usage, accompanying a titling sans that would ideally be the same as that for packaging, so the two need to pair well. The guide will include a course of boiled down cognitive/behavioural therapy and be more of a little book than an ordinary medication insert.</p>
    <p>The packaging sans must be readable and recognisable from a distance, and of suitable character - whatever you think that should be: I'm interested in what you would want if you needed such a product. The serif should be inviting but authoritatively non-contemporary - certainly not in the least po-mo or cute - and surprisingly beautiful. Though it shouldn't be as rootedly and obviously historical as a Caslon, actual great age isn't a problem.</p>
    <p>I'd be really grateful for ideas; I haven't, after much searching, found a good solution yet.</p>
