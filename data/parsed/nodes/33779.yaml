      <p>I think the actual purpose of this thing is more important than the fact it's a medication. Imagine you're a genuinely depressed non-designer: for weeks or months things your chest has ached with psychosomatic misery; you can no longer remember or imagine feeling pleasure, but can still feel relief; you'd rather not see your doctor to get a prescription antidepressant, and you drag yourself to the chemist perhaps to get some of that St John's Wort you've heard about, but quite likely for some other reason. What would you go for: a box labelled Zibexoline set in Daxline, or another called Soul Healer set in, at an extreme, Storm Sebastian? It's a genuine question, and the answer might lie between the two. </p>
      <p>Gerard Unger is interested in people's attitudes to medication, and they're usually terrified of them, finding their inserts - set in Times, Helvetica or Frutiger - particularly inhuman (too authoritarian, too distant, too ignoble?). This must go double for any psychiatric medication, which is one reason for the popularity of "natural" treatments. </p>
      <p>I reckon inserts also fail to answer most of the questions people want to ask: what exactly is this doing to me, and why? What might I feel like, in all respects, at first, and for how long? Does this fade out gradually or suddenly, and does it coincide with a similar transition to wellness? How will I feel in the long term? What's the likelihood of each side-effect? What's the likelihood of the medication's working, wholly or partially, and when will I know? What should I do if it doesn't work at all or in part, or if it feels too strong, or if I do suffer from common or rare side-effects? </p>
      <p>So the guide will be detailed, authoritative but not authoritarian, kindly and concerned but not presumptively and joshingly intimate, and noble-spirited; it will be immaculately set in some suitable and, as I've said and in particular, <em>surprisingly</em> beautiful serif with sans titling. But which? To give an indicator, even Deepdene might not be too much for the serif.</p>
