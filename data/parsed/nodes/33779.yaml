      <p>(Somewhat tangential)</p>
      <p>If it's in the USA, and it's a "natural" or "herbal" product, it is not regulated by the FDA, nor is any sort of testing required, for either safety or efficacy. If people taking them have negative reactions or health problems due to the product, the makers aren't even required to report it to the FDA.</p>
      <p>About the only time that regulatory agencies come into it is if the claims being made are so blatantly false that they amount to false advertising. Sometimes the FTC will step in and halt ads in these cases. There's actually been a *lot* of this with weight loss products making blatantly false claims and getting fined for it. (e.g. <a href="http://en.wikipedia.org/wiki/CortiSlim" title="http://en.wikipedia.org/wiki/CortiSlim">http://en.wikipedia.org/wiki/CortiSlim</a>).</p>
      <p>I'm not opposed to "natural remedies." I just wish they were tested for safety (and preferably efficacy as well) to the same degree as "drugs."</p>
      <p>Cheers,</p>
      <p>T</p>
