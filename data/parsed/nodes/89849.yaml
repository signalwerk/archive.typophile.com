  html: |-
    <p>some joins are a bit rough...</p>
    <p>just getting my head around the shift to illustrator from freehand MX but i'll get there - in at the deep end</p>
    <p>i consider myself a branding / logo expert - this is what i do best...</p>
    <p>my customer imports high end large format printers and supplies for signwriting and billboards.</p>
    <p>i have thrown together 2 A4 pages to show the job progression... </p>
    <p>first page is overview of my initial presentation to the client... included for the younger designers here to see the "concepts"... there were equal number of concepts not presented to the client. as you can see i was hung up in the "bubble jet" dot concept for a while... then i moved on to "slicker" concepts...</p>
    <p>[img]http://farm8.staticflickr.com/7148/6838521963_1bb318b3b3.jpg[/img]</p>
    <p>customer saw the white one reversed out of black and said it was good but needed further refinement... </p>
    <p>feedback included<br>
    -maybe it needed more blue<br>
    -stencil font was ok to boss but 2ic hated it!<br>
    -make more of a feature out of the EP cross bar thingy</p>
    <p>so here i am looking for external feedback...</p>
    <p>some of the more experienced designers will pick up on what i have done with letter spacing, width etc...</p>
    <p>[img]http://farm8.staticflickr.com/7154/6838520973_5e8b9fd66c.jpg[/img][/url]</p>
    <p>enjoy - go hard...</p>
    <p>thanks, B</p>
