    date_raw: 10 Feb 2012 — 6:22pm
    votes: null
    html: <p>As an identity, it is almost impossible to evaluate without knowing more about the brief.  Who is the audience?  What are the kewords, messages, feelings, etc that need to be communicated?  It sounds like the feedback you got was about visual impact and not about concept and message.  Both are important, so don't get sucked into just trying to make the name pretty.  The dot matrix concept says something more specific than the others, but to me it suggests an outdated and low resolution printing process.  You said 'high end' so it seems that is a miss.  What 'high end' means in this context could be 'hi tech' or 'high fashion' depending on the details of the audience and company, and each would yield very different results in the target message.</p>
