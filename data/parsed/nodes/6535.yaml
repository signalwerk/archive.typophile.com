  html: "<p>Today is John Baskerville's birthday, and to celebrate, we've updated the Typophile calendar with a slew of new birthdates. Now you won't miss the chance to celebrate with some of our closest friends in the typography community, including: <br> <br>Josef Albers - John Baskerville - Saul Bass - Herbert Bayer - Ed Benguiat - David Berlow - Lucian Bernhard - Roger Black - Erik van Blokland - Giambattista Bodoni - Josef Müller Brockmann - Neville Brody - David Carson - Matthew Carter - Stephen Coles - Wim Crouwel - Jakob Erbar - Pierre Simon Fournier - Adrian Frutiger - Eric Gill - Milton Glaser - Frederic Goudy - Luc(as) de Groot - Jonathan Hoefler - Anton Janson - Edward Johnston - Tibor Kalman - Mr. Keedy - Rudolf Koch - Zuzana Licko - El Lissitzky - Ottmar Mergenthaler - L</p>"
