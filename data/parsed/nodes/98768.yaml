    <p>Hi all,</p>
    <p>I was wondering whether the terms 'Schwabacher' and 'Bâtarde' are synonymous, or whether there are differences between the two, and if so what would those differences be?</p>
    <p>Also, in mathematical typesetting where fraktur letters are called for, would it be acceptable to substitute a bâtarde (specifically, Duc de Berry)?</p>
    <p>TIA,<br>
    André</p>
