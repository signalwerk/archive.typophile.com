    html: <p>How much larger is "much larger"? <br> <br>1" 2" 3" 4" 5" 6" 10" ? <br> <br>The only real way to discover how they will perform at much larger sizes, is to make them at the target size and view them under target conditions.  <br> <br>Depending on the viewing distance of the target size, you may have to open up the letterspace. <br> <br>Also if we are talking about real distance viewing the C in both designs closes in on itself and is too close in shape to the O.</p>
