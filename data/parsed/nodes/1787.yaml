    html: <p>One thought is to run the words together and change the middle words color or tint of solid color or change the weight of the middle word. Might also experiment with a condensed face if in all caps. You might also propose using the Initials of the Company as the logo and use the name small under them. Your example would be BCC large and Bike Cruiser Company small.</p>
