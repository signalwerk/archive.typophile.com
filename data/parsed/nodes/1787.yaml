    date: 2003-10-25T12:39:00
    date_raw: 25 Oct 2003 — 12:39pm
    votes: null
    html: <p>You could test your photoshop skills by snapping some photos of signs &amp; vans &amp; dropping in your logo. Not as accurate as James' method, but it's cheaper &amp; quicker &amp; it'll get you in the ballpark. A really long logo like that is difficult to work with; if nothing else, a photoshop demo will show your client what challenges you are up against if your logo has a 14:1 width-to-height ratio. <br> <br>You could also present your logo in 3 versions, printed matter, "outdoor" &amp; web. All 3 media have different issues, so it's appropriate to have 3 solutions, i.e., one line for printed matter, 3 lines for "outdoor", &amp; a less-bold version for web. <br></p>
    html_clean: <p>You could test your photoshop skills by snapping some photos of signs &amp; vans &amp; dropping in your logo. Not as accurate as James' method, but it's cheaper &amp; quicker &amp; it'll get you in the ballpark. A really long logo like that is difficult to work with; if nothing else, a photoshop demo will show your client what challenges you are up against if your logo has a 14:1 width-to-height ratio. <br> <br>You could also present your logo in 3 versions, printed matter, "outdoor" &amp; web. All 3 media have different issues, so it's appropriate to have 3 solutions, i.e., one line for printed matter, 3 lines for "outdoor", &amp; a less-bold version for web. <br></p>
