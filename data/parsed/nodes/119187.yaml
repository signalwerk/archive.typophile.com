    html: |-
      <p>edited:<br>
      You can get a lot closer by taking a bold weight of a font with similar letterforms and compressing the width to perhaps 85%<br>
      This one is News 706 Bold <img src="/sites/default/files/old-images/News706BoldInUseWidth85pct_4479.jpg"><a href="http://www.myfonts.com/fonts/bitstream/news-706/">http://www.myfonts.com/fonts/bitstream/news-706/</a><br>
      If you want to get a pretty good match you could edit the tail on Q and anything else that you think is out of place.<br>
      A runner up is Harriet Text Bold<br><img src="/sites/default/files/old-images/HarrietTextBoldInUseWidth85pct_4342.jpg"><br><a href="http://www.myfonts.com/fonts/okay-type/harriet/">http://www.myfonts.com/fonts/okay-type/harriet/</a> Same comments on editing.<br>
      Some fonts have a weight heavier than bold, which might give a better match for weight when the width is compressed to perhaps 85%<br>
      This one is Ingeborg Heavy.<img src="/sites/default/files/old-images/IngeborgHeavyInUseWidth85pct_3698.jpg"><br><a href="http://www.myfonts.com/fonts/typejockeys/ingeborg/">http://www.myfonts.com/fonts/typejockeys/ingeborg/</a> Same comments on editing.<br>
      Don</p>
