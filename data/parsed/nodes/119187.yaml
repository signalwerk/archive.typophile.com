    html: |-
      <p>VHS tape boxes. I used to have a huge number of these, including this brand. Looks like a photo compressed font. There are normal width substitutes that might pass for _HQ_, such as Century Oldstyle <a href="http://www.myfonts.com/fonts/mti/century-os-mt/" title="http://www.myfonts.com/fonts/mti/century-os-mt/">http://www.myfonts.com/fonts/mti/century-os-mt/</a> but I didn't spot anything that world work perfectly as a digital substitute for the compressed text _HQ HIGH QUALITY TAPE_. The closest I was able to find out of the box is Georg Trump's Mauritius Medium Condensed as digitized by Canada Type<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MauritiusMediumCondensedInUse_3834.gif"></div> <a href="http://www.myfonts.com/fonts/canadatype/mauritius/" title="http://www.myfonts.com/fonts/canadatype/mauritius/">http://www.myfonts.com/fonts/canadatype/mauritius/</a><br>
      An alternative, Monotype Clarendon® Condensed<br>
      <div class="imageWrap"><img src="http://typophile.com/files/MonotypeClarendonCondensedInUse_5727.jpg"></div><br>
      <a href="http://www.fonts.com/font/monotype/monotype-clarendon/condensed" title="http://www.fonts.com/font/monotype/monotype-clarendon/condensed">http://www.fonts.com/font/monotype/monotype-clarendon/condensed</a><br>
      Don<p></p>
