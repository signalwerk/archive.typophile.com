    html: <p>Once you actually start making font outlines, it is a good idea to start with letters that define basic proportions and spacing, e.g. the lowercase n and o. But when working out initial design ideas, it is best to start with the letters that will give the design most of its character. This will vary depending on the design, but often it will be the lowercase a, e, and g.</p>
