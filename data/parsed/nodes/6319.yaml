    html: "<p>Ivan, there can be no strict rules, but good guidelines there can. <br> <br>In terms of character sequence, it's true that personal preference is a huge factor, but it also seems that text fonts benefit from starting with the \"bland\" characters (like \"n\") while display fonts benefit from starting with the more \"flavorful\" characters (like the \"a\"). Also, it might be smart to favor the more frequent letters (like \"e\"). <br> <br>And in terms of width, I think these things are useful to consider: <br>1) Generally, wide fonts seem more friendly and warm but also provincial, while narrow fonts appear more strict, cold and elegant. <br>2) Narrow fonts fit more text in the visual span of the eyes, helping reading. <br>3) Fonts that are too narrow however converge the widths of boumas too much, slowing reading. <br>4) For setting single lines (like headlines, or phone book listings), or where you'd like to reduce hyphens (especially in narrow columns) narrow fonts have an obvious advantage. <br>5) However, narrowness isn't necessarily more economical in running setting, because you can just as well save space (in the vertical instead of the horizontal dimension) by using a wider font at a smaller point size (maintaining apparent size) - it depends on a few things, including the proportion of paragraph breaks you have in the text. <br>6) At smaller point sizes (like below 9), width (and looseness) help readability. <br> <br>hhp</p>"
    html_clean: "<p>Ivan, there can be no strict rules, but good guidelines there can. <br> <br>In terms of character sequence, it's true that personal preference is a huge factor, but it also seems that text fonts benefit from starting with the \"bland\" characters (like \"n\") while display fonts benefit from starting with the more \"flavorful\" characters (like the \"a\"). Also, it might be smart to favor the more frequent letters (like \"e\"). <br> <br>And in terms of width, I think these things are useful to consider: <br>1) Generally, wide fonts seem more friendly and warm but also provincial, while narrow fonts appear more strict, cold and elegant. <br>2) Narrow fonts fit more text in the visual span of the eyes, helping reading. <br>3) Fonts that are too narrow however converge the widths of boumas too much, slowing reading. <br>4) For setting single lines (like headlines, or phone book listings), or where you'd like to reduce hyphens (especially in narrow columns) narrow fonts have an obvious advantage. <br>5) However, narrowness isn't necessarily more economical in running setting, because you can just as well save space (in the vertical instead of the horizontal dimension) by using a wider font at a smaller point size (maintaining apparent size) - it depends on a few things, including the proportion of paragraph breaks you have in the text. <br>6) At smaller point sizes (like below 9), width (and looseness) help readability. <br> <br>hhp</p>"
