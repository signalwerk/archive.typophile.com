    html: <p>I'd like to say that lc 'a' is the ideal starting point for a face (in my opinion--and that's all it is--this letter sets a lot of the character of a typeface).  However, for reasons reasonably touched on by Hrant, it doesn't work for all kinds of faces. <br> <br>For a face that emphasizes the "look", lc 'a' seems right on.  But where text is concerned, and more rules mean a lot more in terms of functionality, 'a' seems too much a loner.</p>
