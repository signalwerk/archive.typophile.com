    <p>Hello fellow typophiles!</p>
    <p>I have a project I'm working on for a class.</p>
    <p>Basically we have to make a movie poster. But a we have to make up the movie(preferably). I've decided to use a book as a base for mine.</p>
    <p>Basically it's a dinosaur movie. I need to find font that fits that theme. I've look quite abit for one but I'm not satisfied with what I've found. I'm looking for some similar to the Jurassic park font and the Indiana Jones font. A adventure, nature, organic kinda of font. Primitive but not so primitive that it looks like it caved out of rock. Something with a prehistoric feel, but not so prehistoric it's cartoony/tacky.</p>
    <p>I hope that gives to a clear idea of what I'm going for.</p>
    <p>Any recommendations? Any ideas? Any clue on where might look besides the obvious font sites like dafontdotcom? Remember this is for a movie that is set in a prehistoric setting with dinosaur, but with the influence of humans.</p>
    <p>Thanks </p>
    <p>-JXZ</p>
