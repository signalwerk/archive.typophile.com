      <blockquote><p>Well, there are still a few people in the U.S. setting Linotype, and if they have the Georgian mats, could set copy. </p></blockquote>
      <p>Purely academic at this point, but . . . I doubt there is anyone in the U.S. with mats. Jones designed Georgian for British Linotype, and as far as I recall it was never big in the U.S. — in fact may not have even been distributed here (certainly no promotion or inclusion in any American specimens that I’ve seen).</p>
      <p>Like I said, a rare bird.</p>
