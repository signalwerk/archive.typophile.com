    html: |-
      <p>@Kent &amp; Ingrid...</p>
      <p>Well, there are still a few people in the U.S. setting Linotype, and if they have the Georgian mats, could set copy. If this is an art book, there might not be that much copy. With "modern" technology, repro could be pulled from the metal type, so the printing could be offset, whatever. </p>
      <p>The type "size" could be changed slightly in camera -- no different than with a digital setting. You have to pay attention to the measure and word space values with this trick...</p>
      <p>You could certainly wind up with a different look from the slick architectural productions common today, which may or may not be what you're after....</p>
      <p>If you want to go with PostScript/OpenType fonts, Carter's digital version of Monticello might also  fit the need.</p>
      <p>Edit:</p>
      <p>You might get up with some of the designers at the University of Georgia press -- Athens isn't too far from Atlanta. There is a guy who just retired who is pretty knowledgeable about type &amp; typesetting. He set many of the Press' books that were done in house, and this during the days of transition of photocomp-PostScript-OpenType. He's on the young side for retirement, &amp; might just be looking for a project.</p>
