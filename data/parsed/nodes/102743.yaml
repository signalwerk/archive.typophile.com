    html: <p>There was a graphic quality to the Adam style (e.g. walls decorated with panels of low-relief molded frames) which informed a lot of early twentieth century typography, in particular involving layouts structured with decorative borders and type ornaments. The 1923 Linotype manual shows fine distinctions between different historical typefaces and the kind of ornaments, borders and decorations appropriate to each. That manual is online.</p>
