    <p>i have a litl question regarding adobe indesign,and i can't figure it out for myself, been looking in the manual but don't really know what to look for.</p>
    <p>i have say 40 lines of text, what i want to do is place some lines of the text in a black box, i don't want the entire text frame in a black solid collor...just some lines of text so that there is still a thin line of white space between every line...</p>
    <p>i not really good in excplaining myself here since i don't know anny specific name for this but i hope you guys know what i mean.</p>
