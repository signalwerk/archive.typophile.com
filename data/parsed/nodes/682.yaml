    html: <p>This is a beautiful design, and it has <br>quite a bit of potential. <br> <br>I don't think it needs a companion roman, <br>necessarily. Aldine italics were meant <br>to function independently. It's only relatively <br>recently that we have begun to pair them <br>with roman fonts. <br> <br>I also think that a bold version would go <br>against the spirit of the face. This design <br>could easily stand alone as either a text <br>or a display face. <br> <br>I agree with you that the caps should probably <br>take either a roman or sloped roman form. I'd <br>encourage you to try an upright roman first <br>for the caps to see how it works. <br> <br>I also agree that you should design a short "s" <br>for beginning and ending letters of words. <br> <br>As for ligatures, I say design as many as seem <br>to suggest themselves. You should definitely <br>include a full range of "f" ligatures ("fb", "ff", <br>"ffi", "ffj", "ffl", "fft", "fh", "fi", "fj", "fk", "fl", and "ft"), <br>as well as "c" ligatures ("ch", "ck", "ct", etc.) <br>and "s" ligatures with long and short "s". <br>You might also consider a "Th" ligature, <br>as well as ligatures for the article adjectives, <br>common prepositions and conjunctions <br>(The, "the", "An", "an", "Le", "le", "La", "la", <br>"El", "el", "From", "from", "And", "and", <br>"&amp;c", "etc.", etc.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  ) <br> <br>I also wouldn't change the "a" very much, <br>as it looks nice to my eye, and seems to fit <br>the spirit of the Aldine italic. <br> <br>Best of luck. This could be a great font. <br> <br>David</p>
    html_clean: <p>This is a beautiful design, and it has <br>quite a bit of potential. <br> <br>I don't think it needs a companion roman, <br>necessarily. Aldine italics were meant <br>to function independently. It's only relatively <br>recently that we have begun to pair them <br>with roman fonts. <br> <br>I also think that a bold version would go <br>against the spirit of the face. This design <br>could easily stand alone as either a text <br>or a display face. <br> <br>I agree with you that the caps should probably <br>take either a roman or sloped roman form. I'd <br>encourage you to try an upright roman first <br>for the caps to see how it works. <br> <br>I also agree that you should design a short "s" <br>for beginning and ending letters of words. <br> <br>As for ligatures, I say design as many as seem <br>to suggest themselves. You should definitely <br>include a full range of "f" ligatures ("fb", "ff", <br>"ffi", "ffj", "ffl", "fft", "fh", "fi", "fj", "fk", "fl", and "ft"), <br>as well as "c" ligatures ("ch", "ck", "ct", etc.) <br>and "s" ligatures with long and short "s". <br>You might also consider a "Th" ligature, <br>as well as ligatures for the article adjectives, <br>common prepositions and conjunctions <br>(The, "the", "An", "an", "Le", "le", "La", "la", <br>"El", "el", "From", "from", "And", "and", <br>"&amp;c", "etc.", etc.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  ) <br> <br>I also wouldn't change the "a" very much, <br>as it looks nice to my eye, and seems to fit <br>the spirit of the Aldine italic. <br> <br>Best of luck. This could be a great font. <br> <br>David</p>
