    html: <p>Yes, you should go on. But i think you'd have to have an roman to go with it.  <br> <br>I like the fatness of the type. And the way you digitized it. Although you'll hve to do a little about spacing and kerning. (you could try to base those on leadtype, no kerning?) If you want to claen the forms up, beware of not loosing of loosing the vitality it has now. <br> <br>For modern use, you might want to have a small 's' (or not!) <br> <br>--Jacques <br> <br></p>
