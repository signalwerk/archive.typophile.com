      <p>Although the OT 'size' feature is implemented in an odd way in terms of where the data goes in the font, this does not bother me so much.</p>
      <p>What *does* bother me is that the 'size' feature deals strictly with point size, and not pixel resolution. In a world where the most important use of optical size is on screen, this is problematic. If one wants something for use at text sizes on an unspecified "average" screen of today, a design optimized for perhaps 6-8 points in print is likely to be a better choice than one optimized for 10-12 points in print, even if the screen size nominally matches 10 or 12 points.</p>
      <p>Ideally one would be able to express in the font family some sort of function using a combination of ppem size (number of pixels high the font is at the current sizing) and resolution of the user's screen to determine which distinct optical-size font to use.</p>
      <p>For so-called pixel fonts, a type designer would want to be able to express things purely in terms of ppem size.</p>
      <p>Failing all that, for a web browser to have an automatic function like "take the current ppem x2/3 and look for a font optimized for that point size" would be better than nothing.</p>
      <p>Regards,</p>
      <p>T</p>
