      <p>I am not very enthusiastic about a GX or GSUB approach with all size/ppem-specific glyph variants inside the same font. I think it would make things more complicated and create problems, for example: How to handle vertical metrics? What about backwards-compatibility? File size? etc.</p>
      <p>It might be useful to make a parallel with interpolation technology. I find the Superpolator approach more powerful than MultipleMaster because it gives me more control on the topography of the variation space. I wish size/ppem-specific variations could follow a similar pattern.</p>
      <p>I like Karsten's ab123 procedure, but on b I would like to be able to specify a ppem-size instead of points. It should be possible to forget about points and paper altogether and deal only with serving ppem-specific designs for screen (step 1).</p>
      <p>Ideally, the infra-structure to package variations should be more generic than just a ppem axis and host other kinds of variations (there are many possibilities, specially if we finally embrace movement and color). The ppem axis should not expect proportional scaling of the design: higher ppem means only that glyphs get taller, not necessarily wider. And however sophisticated this system becomes, it should work with the lowest resolutions and plain b&amp;w rasterization – screen resolution is increasing, but access to the web is not restricted to desktop computers.</p>
      <p>To put my ideas in context, here is an article about the <a href="http://www.hipertipo.org/pdfs/ElementarTYPO27.pdf" rel="nofollow">Elementar bitmap font system</a>, published in 2007 on TYPO magazine 27. Thanks to Pavel Zelenka for giving me permission to make it available on my website.</p>
