      <p>&gt;All these scenarios do not change resolved font while ppem changes, which means choice is ppem-independent.</p>
      <p>All 'page scaling scenarios' mean choice is ppem-independent, all 'font sizing scenarios' are another thing. Zoom scales pages. Print scales pages. Graphic designers size fonts. Web users size fonts. </p>
      <p>If one lumps them together as Serge does, and then says, "all sizes should be displayed as good as possible", well, that's where we've been. </p>
      <p>What I did was make what would it look like if  "each size would be displayed as well as possible?" Then, I made a list of how to get that to a user. Then, I made a list of who's stopping it. Now, I'm writing a blog on why I think this sad state exists. </p>
      <p>Cheers!</p>
