      <p>Carrying over something I wrote to the www-font list, with a little addition, this adds to Gustavo's comment rather than the original post:</p>
      <p>On the www-font list, Gustavo raised the issue of "size-specific" outline screen fonts -- with a specially designed font per each ppem-size -- which brought up the question how to tell UAs for which ppem-size a font is designed.</p>
      <p>I think that first of all one needs to make a fundamental distinction between two types of "specific-ness" that should not be mixed up:</p>
      <p>1. <em>size-specific design</em><br>
      The "one outline for all sizes" approach that outline fonts brought with them results in a compromise since one design needs to serve both very small and very large sizes.<br>
      Size-specific design refers to special versions of a typeface, each serving a specific <em>range</em> of type sizes -- which are measured in pt, mm, or other. Size-specific-ness belongs to the "higher-level" realm of esthetics/legibility and is agnostic of the "lower-level" realm of this or that rasterization technology, output device, resolution (if rasterized at all).</p>
      <p>2. <em>ppem-specific design</em><br>
      In brief, it means designing along the pixel grid. A font per ppem-size.<br>
      This approach addresses the "lower-level" realm of rasterization technology, output device, resolution.</p>
      <p>Thomas Phinney: <cite>"What <em>does</em> bother me is that the 'size' feature deals strictly with point size, and not pixel resolution."</cite></p>
      <p>Size-specific design and ppem-specific design serve different purposes and hooking in at different level: esthetics/legibility vs technology. They do not even overlap.<br>
      Therefore I think that the information for which ppem-size a font was designed does not belong into the current 'size' feature.<br>
      This single ppem-size value per font is still more than just an on/off, so cannot be a single bit in 'head' table's 'flags'.<br>
      Perhaps an update OS/2 version with a ppem value appended at the end.<br>
      Or a 'ppem' table with a single value in it? Presence of the table signals to the UA that this is a ppem-specific design, and for which ppem-size. Then activate specific behavior. But if, as John suggests, even the current size-specific 'size' feature should be a table rather than a feature, then this may indeed inform if the font is either size-specific or ppem-specific -- in my current understanding, options are none/either/or.<br>
      Or of course David Berlow's 'perm' table which has a section "Scaling" with both point- and pixel(=ppem)-related min/optimum/max size entries.</p>
      <p>I am sure I have missed something in my considerations.</p>
