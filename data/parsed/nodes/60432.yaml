      <p>CS&gt;The well-known, opposing camps — Windows crispness versus Mac smoothness — would quite possibly prefer different designs for those two styles...</p>
      <p>Absolutely. The OS have expressed their 'preferences' for how dark a given shape should render. Adobe is the darkest, MS is the lightest and Apple is in between leaning towards Adobe. Establishing this in 2007 was job 1, job 1101, was making Franky with "all weights possible." This weight choice takes care of whatever preferences clash in this area between user and web site developer, user and font vendor, or user and OS rendering. Good?</p>
      <p>I don't think users should have their text type color decided for them by anyone but themselves, especially when the 'opposing camps' are doing it for reasons divorced nearly entirely from user preferences. </p>
      <p>KL&gt;Question is how to package the “for size” and “for device” fonts (which I consider to be sub-categories of “for style”) — I mean: in terms of font naming.</p>
      <p>I worship variations so I don't have to name every possible style. I worship the web because it's a place where users can make choices based on appearance alone, and because I don't have to 'deliver' anything. </p>
      <p>JH&gt;But such an approach also means completely rebuilding all the size-specific fonts that various type designers have been making for the past twenty years, rather than just adding some size meta data that identifies at which sizes these existing fonts should be used...</p>
      <p>Why is it either or? If a font is made for one size, add a little data that indicates it. If a font is made for a lot of sizes, add a lot of data to indicate it. But everything beats the one-size-fits-all outline that can't do so in reality. We rebuilt all the per-size designs into outlines in the 70's and 80's, nobody seemed to mind then. ;)</p>
      <p>Cheers!</p>
