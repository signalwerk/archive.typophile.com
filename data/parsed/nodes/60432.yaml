      <p>DB -- <cite>[...] I don't consider the design of fonts for screen to be optical sizing. I divide font variation into; for style, for size and for device. [...] So, if one must prepare a web font, then pixels, or the concerns of the device [...], must lead the way, and the size and style issues should follow in a broad fan of choices suiting the size and style preferences [...] That is, if you’re making web fonts for the bottom end of resolution.</cite></p>
      <p>Despite "overlap" was the wrong term ... Do we disagree? Your "for size" is my "size-specific", your "for device" is my "ppem-specific". With fonts made "for the bottom end of resolution", the "for size" category evaporates -- it's hard to make serifs <em>a bit</em> fatter for smaller sizes if a pixel more would constitute another style, e.g. a bold. So effectively one ends up, "for style", with a bunch of fonts, some (or none) of them with "for size" flag and others (or none) with "for device" flag. If there is none for both categories, there is one "size"/"device"-independent "for style" font.</p>
      <p>So based on<br>
      <em>a)</em> screen resolution given as 144ppem (not as 1024*768 pixel count) and<br>
      <em>b)</em> desired type size (like 12pt, i.e. resolution-independent)<br>
      the rasterizer could determine which font ppem-size is required and then<br>
      <em>1)</em> check if the according "for device" font variation "for [requested] style" is present and if yes, use it,<br>
      <em>2)</em> else check if the according "for size" font variant "for [requested] style" is present and if yes, use it,<br>
      <em>3)</em> else use the present "size"/"device"-agnostic "for style" variant.</p>
      <p>(This is a summary of how I understand your description.)</p>
      <p>Question is how to package the "for size" and "for device" fonts (which I consider to be sub-categories of "for style") -- I mean: in terms of font naming.</p>
