      <p>Everything Thomas said, and then...</p>
      <p>The OT size feature is nominally a GPOS layout feature, despite the fact that is does not perform any glyph positioning function. It also does not conform to any of the normal characteristics of a GPOS feature. It also requires implementing software to process this feature outside of the normal chain of OT Layout processing.</p>
      <p>Given this, it is hard for me to see it as anything but a hack enshrined within the OTL feature descriptions. The fact that not even Adobe, who defined the feature and implement it in their optical master fonts, have implemented support for it in any of their applications suggests that it is not only a hack but even fails the typical justification of a hack: that it is useful.</p>
      <p>The normal processing order for OTL is cmap then GSUB then GPOS: first you get the default glyphs for the characters, then you substitute other glyphs as appropriate to GSUB features, then you apply positioning to those glyphs. The 'size' feature needs to be processed completely outside this chain, despite being nominally a GPOS feature. The 'size' feature actually needs to be applied prior to any glyph layout processing, since it affects font selection.</p>
      <p>I believe this is one of the reasons why the feature isn't supported in applications: many implementers struggle to get normal GSUB and GPOS layout right -- given the absence of a clear OTL implementation spec, as distinct from the font format spec --, and it is no wonder that they have simply ignored this eccentric 'size' feature.</p>
      <p>Also, in order to build 'size' feature data into a font, one needs to use an Adobe FDK-based tool for OpenType Layout tables. A tool such as VOLT, used by pretty much everyone making fonts for complex scripts, which is based around the normal structures of GPOS lookups, has no way to build a 'size' feature. Since it is not currently possible to mix-and-match tools for GSUB and GPOS development, this contributes to poor support for the 'size' feature on the font side as well as the application side.<br>
      _____</p>
      <p>A couple of ideas have been put forward for better methods of implementing size-specific font selection.</p>
      <p>One idea is a new SIZE table in the font. At its simplest, this could present the same information as the 'size' feature but in a more appropriate location and with better implementation guidelines. David Berlow drafted a description of a more complex SIZE table during the OT 1.6 discussions; this sought to address more complication font family relationships including ppem-specific designs. I'm not sure how this relates to his new permissions and recommendations table idea, or whether some of the concepts in the SIZE table proposal have now found their way into the new table.</p>
      <p>A second idea is to use the new composite font format (currently under development as an mpeg-OFF standard) to enable multiple size-specific fonts to be packaged as a single virtual font with the composite font XML wrapper including information to enable applications to select the appropriate component font for specific sizes or size ranges. In theory, this could be expressed in point size or ppem size, or some combination (allowing a single component font to be used for one size in print and wysiwyg situations but another for reading on screen).</p>
      <p>This last idea brings me back to the web font format discussion. On the W3C list, I suggested that size-specific fonts were orthoganal to the web font format question, which is why I suggested that we continue the discussion over here. My thinking is that this is a font data matter, and hence something that would be within a potential web font wrapper.</p>
      <p>The only situation in which I think it at all likely to be otherwise would be if indication of a ppem-specific font were to be included in the .webfont info.xml meta data. But presuming this information is also in the font data in some format, then one runs into the problems of duplication, redundancy and potentially differing data for the same font.</p>
      <p>Finally, there is the point that Karsten alluded to on the W3C list: as real resolutions of screens increase, text at pixel-specific sizes gets smaller. In order to be able to serve ppem-specific designs that are also of appropriate size for reading, you need to know the resolution of the reader's device. Ideally, you also want to know how far away from the screen the reader is sitting.</p>
      <p>Somewhere in here, heads start exploding. I'm still trying to figure out whether David Berlow is the only person who can hold all this stuff in his head, or if his head exploded a long time ago and he just hasn't noticed yet. :)</p>
