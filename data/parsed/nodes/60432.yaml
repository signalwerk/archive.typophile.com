    <p>On the www-font list, John Hudson stated:</p>
    <p><cite>If someone does want to start a Typophile thread on this topic, I'll be happy to explain why the OT 'size' feature is a lousy hack that breaks the OT layout model, is unlikely ever to be implemented in much software, and why a more robust and sensible approach is needed.</cite></p>
    <p>I'm interested in understanding this statement.</p>
