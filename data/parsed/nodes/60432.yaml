      <p>David: <em>And yet a first idea would be to use the existing var tables which are perfectly-suited for just exactly this problem, multiple size-specific fonts to be packaged as a single virtual font. Is the public asking for GX-like Variations yet or what, John? They never will, it’s up to ’us’ to figure it out and get it served so they never do.</em></p>
      <p>If size-specific glyph variants are all in the same font -- as I understand the case would be using GX-like variations --, then size could be handled as GSUB substitutions, which would the addded benefit that it would plug easily into existing OTL implementations and not require any parsing of any new table. Or is it the axes aspect of GX variations that you are thinking about?</p>
      <p>But such an approach also means completely rebuilding all the size-specific fonts that various type designers have been making for the past twenty years, rather than just adding some size meta data that identifies at which sizes these existing fonts should be used. With the composite font approach, intelligent users could create their own virtual fonts of size-specific designs, opt to follow foundry recommendations or not, and even make separate composite fonts using the same design for different sizes depending on purpose.</p>
