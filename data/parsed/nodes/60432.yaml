      <p>understand arguments towards having ppem-specific fonts. Goal is to choose font optimal for readability by automatically choosing font based on calculated ppem size. However, there are scenarios where you will have same variation to be displayed at different ppem sizes, even ones it is not intended for. </p>
      <p>For example, if you read PDF on various devices you have to display text using font chosen by document creator. Or you are just zooming in document in Word. For dynamic document scenario, many of you are using optical zoom in Safari on iPhone. All these scenarios do not change resolved font while ppem changes, which means choice is ppem-independent. For all these sizes font should be displayed as good as possible.</p>
      <p>For me as layout applications developer, it means that this may be better to have different ppem sizes in one physical font, using same glyph index and changing glyph proportions as less as possible. Of course, it places restrictions over how font can achieve this and hinting is the way it is done now. </p>
      <p>Of course, font variants can include ppem axis to choose from. But there should be a way to choose ppem-independent variant. This will be application’s choice to use ppem-independent variant if scenario is using fixed layout or optical zoom.</p>
      <p>Thanks,<br>
      Sergey</p>
