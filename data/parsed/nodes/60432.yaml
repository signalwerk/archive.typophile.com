      <p>TP&gt;What *does* bother me is that the ’size’ feature deals strictly with point size, and not pixel resolution. In a world where the most important use of optical size is on screen, this is problematic.</p>
      <p>What actually could bother you, if you were me, is that neither point or pixel is a true measure on screen, so that as things stand now, in a craft that was once concerned with the effects of one human breath on the type, type designers seeking remedy for readers must choose only what's <em>closest to useful</em>, point or pixel. </p>
      <p>Also, I hear what you are saying, but I don't consider the design of fonts for screen to be optical sizing. I divide font variation into; for style, for size and for device. So, though the style and size heavily influence the decisions (e.g. in the Franky designs), if the coarseness and multiplicity of pixel colors doesn't overwhelm my per-size decisions, (remembering that I'm only talking about the bottom 18-24 sizes or so for Latin, 67 or so for Chinese), the user's preferred choices (of style or weight) might overwhelm my per-size decisions. So, if one must prepare a web font, then pixels, or the concerns of the device (and how I perceive this effect on the user), must lead the way, and the size and style issues <em>should</em> follow in a broad fan of choices suiting the size and style preferences, satisfying all possible css and end-user choices. That is, if you're making web fonts for the bottom end of resolution. (Franky would stylistically represent a feather in the fan, but not the way I done drawd and engineared that particular feather, I'd hope.) </p>
      <p>JH&gt;I’m not sure how this relates to his new permissions and recommendations table idea, or whether some of the concepts in the SIZE table proposal have now found their way into the new table.</p>
      <p>The size table would be used to inform the recommendations after permissions define the possible uses. Remember that this is not just conceived for the web; permissions can query the size, or other tables to inform recommendations for print, sky-writing or film-making. It all depends on how cooperative composition agents and devices want to be, versus how cooperatively the incoming user market wants these same agents and devices to be. On the web, of course, it's harder because of the dynamic natures of the media and users, and made nearly impossible by the creeping and various description languages that live there. But it's not impossible if one considers all the things a type designer can do, and if doing those things impresses people enough, maybe they'll listen, and the web will move more considerately, and thus considerably on type and typography.  </p>
      <p>This reminds me, that some large number of people have told me that actual everyday web users do not want to do anything, not even change the font size, they just want the site to show up all nice so they they can read it, wherever, and whatever. If I was your average web designer, which means I have absolutely few typographic skills whatsoever, I'd be wondering where I am too. ;)</p>
      <p>CS&gt;David’s head has clearly exploded. :D</p>
      <p>You obviously didn't start Chinese web type sensitivity training in 2004, did you? Start thinking about Chinese ClearType web fonts for 2 seconds a day, and square those seconds each month. Then, after a few years, Latin web fonts, according to any scaler, won't make your head explode, clearly or otherwise, which is more likely, surely. :E</p>
      <p>JH&gt;A second idea is to use the new composite font format (currently under development as an mpeg-OFF standard) to enable multiple size-specific fonts to be packaged as a single virtual font</p>
      <p>And yet a first idea would be to use the existing var tables which are perfectly-suited for just exactly this problem, multiple size-specific fonts to be packaged as a single virtual font. Is the public asking for GX-like Variations yet or what, John? They never will, it's up to 'us' to figure it out and get it served so they never do.</p>
      <p>KL&gt;Size-specific design and ppem-specific design serve different purposes and hooking in at different level: esthetics/legibility vs technology. They do not even overlap.</p>
      <p>I guess I'm going to have to remove overlap surgically then. I hope not to turn you all into Spinal Tap drummers by September 1st, but I told you so. </p>
      <p>Cheers!</p>
