      <p>@johnhudson<br>
      "<em>as real resolutions of screens increase, text at pixel-specific sizes gets smaller. In order to be able to serve ppem-specific designs that are also of appropriate size for reading, you need to know the resolution of the reader’s device.</em>"</p>
      <p>I had a brief discussion with <a href="http://www.typophile.com/user/4431" rel="nofollow">kevlar</a> about this at TypeCon. It goes beyond "resolution" - which is used to refer to both the virtual grid imposed by software AND the "native" resolution of, say, LCD screens which exists physically.<br>
      As a developer, I never understood that I could query for the screen resolution and yet be left totally in the dark as to the physical dimensions of the display. Without this knowledge, I fail to see how optical resolution can be set. I also have reservations about Thomas Phinney's "right for a majority of circumstances" approach.<br>
      I mean, what the hell good is/was the Plug'n'Play spec if it doesn't supply this info?<br>
      My understanding is that display manufacturers are now beginning to supply such info to the OS starting with Win7 and that interest in optical resolution is on the rise.<br>
      We shall see.<br>
      [Some info for the novice as to the fuzzy mess resulting when these two resolutions are in conflict on LCD screens:<br>
      1) <a href="http://billhillsblog.blogspot.com/2009/05/confusion-over-screen-resolution-causes.html" rel="nofollow">Confusion Over Screen Resolution</a><br>
      2) <a href="http://readableweb.com/screen-resolution-and-me-clarity-begins-at-home/" rel="nofollow">Screen Resolution And Me</a>]<br>
      Kevlar tells me the problem I describe fixing in Screen Resolution And Me, goes unfixed among appr. 60% of users.<br>
      An incredibly big problem being swept under the rug. Supposedly Win7 addresses the issue.</p>
      <p>"<em>Ideally, you also want to know how far away from the screen the reader is sitting.</em>"<br>
      I believe there's a product that uses a display mounted cam to determine this distance. But the problem of optical size has to be solved before we can refine it in this way and add the additional variable of user-distance.<br>
      I would like to be able to specify 1 inch and have it be 1 inch no matter what display is being used.</p>
      <p>rich</p>
