      <p>Oh well, might as well provide the translation</p>
      <p>The Main title reads:<br>
      Pillowface Press<br>
      Letterpress shop of Ivan Gulkov</p>
      <p>Lead Vulgate</p>
      <p>The black title: Black Art<br>
      Setting lead fraktur, chase lockup, printing the first ink</p>
      <p>Caption1: Sorts are set in a composing stick<br>
      Caption2: Form is locked up in a metal chase<br>
      Caption3: Tacky printing ink spread on the disk<br>
      Caption4: The first color-run is always easier</p>
      <p>The red title: Cinnabar and gold<br>
      Printing the second color (rubrication)</p>
      <p>Caption1: The second color requires precise registration</p>
      <p>The end.</p>
