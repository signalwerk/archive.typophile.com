    <p>I was sketching around this morning and wondered if anyone had ever seen a font with a lowercase g that was two-story style but with a disconnected descender, like so:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/g_6273.png"></div><p></p>
    <p>The image up there is something I slapped together in Photoshop, since I can't think of or find any fonts that have a similarly styled g. </p>
    <p>Peace,<br>
    JT</p>
