      <p>I have to agree that this is first, pretty inspiring seeing type behave this way in a mobile device context. But to Hrant and James' points, it feels like a solution looking for a problem. </p>
      <p>Don't let that discourage you! There are plenty of instances where motion design and animated type can enhance meaning. We're just used to those happening on a different scale, that still has the utility of being readable. And in a mobile context it has to have utility beyond what you've shown. I think you've got some interesting concepts, especially as they relate to interacting with text in some new ways. </p>
      <p>I'd suggest starting with a problem.</p>
      <p>A mobile can be tiresome for reading long documents. The tilting document example you showed might be an interesting way to navigate a document and get a sense for its size and content (images, diagrams, callouts) but it's ineffective for actual reading in the way it's currently demoed.  </p>
      <p>What if a reader app (ebook or RSS reader) could enlarge the text above a touch point (long press) for easier zooming without having to pinch in and out?</p>
      <p>What if you could slowly move your finger to scroll through a document instead of repeated flicking. What if you could tilt the device to move to the next screen instead of flicking?</p>
      <p>What about an educational app for beginning readers where single words react to touch. Drag the word to the object, assemble letters into words, etc.</p>
