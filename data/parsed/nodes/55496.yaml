      <p>I think this is cool in terms of being artsy, being somewhat visually interesting, and  showing off the potential of the iPhone (and, hey, I heart the thing). But I'll have to agree that it looks like you haven't really considered text isn't only supposed to look cool: if this is supposed to be a new interface for a news <em>reader</em>, you'll likely get a bunch of initially fascinated and quickly frustrated users. (And btw, I think setting longish text in a 3D shape doesn't automatically qualify as "information visualization".)<br>
      As hard as that may be to accept in terms of wanting to exploit the possibilities the iPhone offers, I think it makes a lot of sense that text usually "looks boring" (set in 2D, in constant, parallel, left-to-right lines, and static). :-&gt;</p>
      <p>Though there seem to be some interesting experiments with moving type. I'm not exactly an expert on that. But you may want to look at some stuff like those interfaces that quickly flash words. Or type animations that are quite nice (and do actually read). Can someone help me out with links and terms? :-)</p>
