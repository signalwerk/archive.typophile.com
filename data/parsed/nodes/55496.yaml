      <p>In my opinion (for whatever that is worth) I think it's rather odd to pose a sweeping statement as a fact  "moving text cannot be read." hang on... film credits? Stock and news tickers? TV commercials? Animated billboards? (think Times Square.) How about even static highway billboards as you drive by, does that count as moving text? The list could go on and on. If moving text could not be read, a lot of motion designers wouldn't have jobs. </p>
