      <p><em>"Motion is a very relative concept as well."</em></p>
      <p>Is it?<br>
      Not at all, at least for a reading subject.<br>
      One must agree that movement is relative <em>from a physical point of view</em>, but with perception, it is absolutely different, the same way that ideas such upside, down, left and right are equally absolute for a given context.<br>
      There is an experiment that consists of extracting and rotating the eye of a frog*, let's say, 180 degrees: the frog is unable to deal with the environment because of the relative positions of things in its brain doesn't match theirs in the real world.<br>
      * Amphibious has the unusual capacity of self relinking broken neural threads.<br>
      In the matter we discuss on, it has to do with the movement recognition mechanism also, that is common for all mammals and other species.<br>
      When something moves before our eyes, it triggers a complex series of reactions to determine what kind of movement is happening, and act accordingly (it is unnecessary to say that most of these reactions are ancient reflexs).<br>
      But our perception doesn't work estrictly under the general principle of action and reaction: it is selective, some attenuations –that can reach even the cancellation of stimuli– and some boosts occur, in order to allow us to discern what matters and what doesn't; reactions have inherited distortions.<br>
      Beyond that reading is a cultural behavior, an ordinary reader is unavoidably determined for some basic questions such as position, angle, brightness, contrast, sequential sorting, pattern recognition, focus, distance, size, weight, and so on; worse: the eyes move in three different ways:</p>
      <ul>
      <li>Individual eye movement (duction)</li>
      <li>Same direction eyes movement (version)</li>
      <li>Opposite direction eyes movement (vergence)</li>
      </ul>
      <p>It's almost pointless to tell that when a text moves in any way, reading becomes a harder task for our visual short term memory processing system, mainly because parameters that are supposed to be constant become variable (you know how hard it can be to read the credits at the end of a film movie when scrolling), but also because we cannot keep focus on such a complex situation that requires all of our conscious.<br>
      Moving texts make us considerably more sensitive to failure phenomena like inattentional, choice, and change blindness, obscuration, noising; they are not only related to movement itself, but to the kind of movement.<br>
      In the end, it's all determined by our mind map, that is our way of knowing the world, in which position is almost everything (by the way, the Moon seems bigger on the horizon 'cause four our mind map the universe is an overwhelmed sphere).<br>
      I once learned –and it didn't change since then– that Relativity fits in its own field, the same way that Quantum Mechanics only works at atomic level; so I'm reluctant to such generalizations as saying <em>"I feel kind of shocked by the narrow-mindedness (lack of relativity if you prefer...)"</em>.<br>
      I agree that these experiments are <em>"cool in terms of being artsy, being somewhat visually interesting, and showing off the potential of the iPhone"</em>, in Nina's words. Nevertheless, speaking of a humane interface, in that case, is as far as the distance between the Myth of Oedipus (art) and the Oedipus Complex (science?).<br>
      Art is inspiring; then, it starts the modest-hard-slow-constrained work of design.<br>
      Design, in my humble opinion, is mainly a matter of modesty.</p>
