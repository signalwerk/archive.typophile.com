      <p><em>"Would “humility” be an even better term?"</em><br>
      Sorry for my poor English.</p>
      <p><em>"I will have to do some research"</em><br>
      I have written a lot on the matter; now I'm translating it to publish ASAP. I think it would be an interesting (modest? :-) ) complement to your work on <a class="freelinking external" href="http://themicrofoundry.com/ss_read1.html" rel="nofollow">how we read</a>, especially in what involves the vision dynamics.</p>
      <p>Back to the main subject: my guess is the experiments are truly amazing and attract my attention on the capabilities of the iPhone; there, I see they are not precisely matter of applied design –sorry for the redundance– in the current state, and that can be split in branches, let's say:</p>
      <ul>
      <li>Approaches to more natural interfaces, that behave similarly to the real world (though it's not necessarily more efficient from the point of view of user's work) –as in the 3D news reader.</li>
      <li>Developing of new ways of interaction in abstract environments (perhaps the opposite to the previous item) –as in the babel tower reader.</li>
      <li>Inspiring ideas for art and design, in the shape of pure concepts.</li>
      <li>Substantial contributions to the study of the aplicable, engineering scope of our mental abilities and limitations.</li>
      </ul>
      <p>Nevertheless, all that falls far away from typographic design as a discipline –hey: that's not a sin–, except as (proto) experimental tries. In that sense, I'm not being restrictive by compartmenting things analytically (analysis is a huge tool, but must be used carefully, and many times ruled out); I'm just attempting to use adjectivations more properly.</p>
      <p><strong>MarS</strong></p>
