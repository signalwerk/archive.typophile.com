    html: "<p>Stephen -- Text faces are very very difficult, as you probably know. Here is a good example of a poor text face (reznor).  It's a train wreck, full of inconsistencies in style, weight, etc. I don't know how to do it!<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> I've studied text faces but I haven't unlocked the 'secret' to actually doing one starting from scratch in Illustrator. I am already obsessed with type enough that i probably don't need to obsess over a text face for a year. But I love looking at them, especially the work of Storm. <br> <br>thanks for the advice. I'll stick to display. <br> <br>bj <br> <br><!---Attachment: reznor.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">reznor.swf<br><a href=\"http://www.typophile.com/forums/messages/29/reznor.swf\"><b>reznor.swf</b></a> (2 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
    html_clean: "<p>Stephen -- Text faces are very very difficult, as you probably know. Here is a good example of a poor text face (reznor).  It's a train wreck, full of inconsistencies in style, weight, etc. I don't know how to do it!<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> I've studied text faces but I haven't unlocked the 'secret' to actually doing one starting from scratch in Illustrator. I am already obsessed with type enough that i probably don't need to obsess over a text face for a year. But I love looking at them, especially the work of Storm. <br> <br>thanks for the advice. I'll stick to display. <br> <br>bj <br> <br><!---Attachment: reznor.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">reznor.swf<br><a href=\"http://www.typophile.com/forums/messages/29/reznor.swf\"><b>reznor.swf</b></a> (2 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
