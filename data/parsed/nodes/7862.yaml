    html: <p> bj, <br> <br>This and the Motorpsychos are your best designs.  <br>They have a consistency among the glyphs that  <br>the others lack. I really dig the shadow look on  <br>this, although I'd try it with a 3D block shadow  <br>(no break on the edges) and see what you think. <br> <br>While interesting, the thin lines on the 'O', 'Q',  <br>and 'E' distract me. Maybe alternates? If you  <br>haven't guessed, I'm in love with alternates. <br> <br>Quirky display fonts are your thing, bj. Stick with  <br>'em. Cool stuff. <br> <br>Stephen </p>
