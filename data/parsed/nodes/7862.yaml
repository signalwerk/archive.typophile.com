    html: "<p>-- That's the dichotomy and what separates 'fontlovers' from 'typophiles'. (i refer to the terms themselves, not the sites) <br> <br>As a person becomes more of a typophile and learns about tradition and fundamentals, text faces become more accessible and appreciated. Your numerals, for example, to the 'fontlover' would be considered boring, but to a typophile, they become an exquisite collection of numbers that need precious minutes to be fully digested. <br> <br>(Your numbers are indeed exquisite, I spent about five minutes looking at them, marveling @ how they were constructed. Not easy to do. Nice.) <br> <br>I design T-shirts for a living so I dirty my hands on a daily basis with display faces, but I'm heading toward someday becoming a Level 10 Typophile, like you and Stephen. Someday. <br> <br>As far as the best possible reaction: to have a fontlover say 'cool' AND to have a typophile say 'cool' <br> <br>bj <br> <br> <br>ps: Was the Craft comment an unintenional pun? (Kraft for dinner)?</p>"
    html_clean: "<p>-- That's the dichotomy and what separates 'fontlovers' from 'typophiles'. (i refer to the terms themselves, not the sites) <br> <br>As a person becomes more of a typophile and learns about tradition and fundamentals, text faces become more accessible and appreciated. Your numerals, for example, to the 'fontlover' would be considered boring, but to a typophile, they become an exquisite collection of numbers that need precious minutes to be fully digested. <br> <br>(Your numbers are indeed exquisite, I spent about five minutes looking at them, marveling @ how they were constructed. Not easy to do. Nice.) <br> <br>I design T-shirts for a living so I dirty my hands on a daily basis with display faces, but I'm heading toward someday becoming a Level 10 Typophile, like you and Stephen. Someday. <br> <br>As far as the best possible reaction: to have a fontlover say 'cool' AND to have a typophile say 'cool' <br> <br>bj <br> <br> <br>ps: Was the Craft comment an unintenional pun? (Kraft for dinner)?</p>"
