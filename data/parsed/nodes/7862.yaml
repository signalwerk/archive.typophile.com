    html: "<p> I'm no expert in text faces (or even display faces...), but that \"secret\" might be that you have to tame your artistic inclinations to a huge extent, and worry much more about the \"low-level\" stuff, stuff that only other type designers can put their finger on (and not even most of them). Some people find that boring, but to me personally it's the other way around: Art is great on a wall, but with Craft you can make a meal. <br> <br>If you show a font to a non-designer (which of course is the target audience) and he says \"Wow, this is cool\", or \"Man, that 'e' is killer\" then it's not working... The best possible reaction is: \"Huh?\" <br> <br>hhp </p>"
    html_clean: "<p> I'm no expert in text faces (or even display faces...), but that \"secret\" might be that you have to tame your artistic inclinations to a huge extent, and worry much more about the \"low-level\" stuff, stuff that only other type designers can put their finger on (and not even most of them). Some people find that boring, but to me personally it's the other way around: Art is great on a wall, but with Craft you can make a meal. <br> <br>If you show a font to a non-designer (which of course is the target audience) and he says \"Wow, this is cool\", or \"Man, that 'e' is killer\" then it's not working... The best possible reaction is: \"Huh?\" <br> <br>hhp </p>"
