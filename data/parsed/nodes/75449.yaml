      <p>mrgraphics: I was just saying your version just doesn't work. It's inexplicably forced, totally illegible unless it's huge, and your placement of the word "fourmation" awkwardly breaks the flow and boldness of the graphic. </p>
      <p>But, since you asked....it is considered by many here on Typophile to be bad form to post design revisions of somebody else's design-in-progress. If the re-design you post turns out to be a great idea, it puts the commissioned designer in an untenable position: either stealing your design work, or, being forced to abandon a great idea because they <em>don't want to steal</em> another designer's work. </p>
      <p>It's an ethics problem, if not a question of personal integrity. So, if you have a helpful idea, it's best, IMHO, just to write your idea rather than post a revised design. Plus, writing helps develop your ability to communicate graphics verbally, and that's something invaluable when dealing with clients.</p>
