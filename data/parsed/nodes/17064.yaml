      <p>For those with historical interest, this was a Bauer &amp; Co typeface from the Art Nouveau era called ’Schreibschrift Romana’, as shown in Ludwig Petzendorfer’s “Treasury of Authentic Art Nouveau Alphabets”, published by Dover Books.</p>
      <p>- Mike Yanega</p>
