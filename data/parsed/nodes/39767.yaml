    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Letter identification</strong></p>
    <p>Letter identification is believed to be one of the two probable ways that information is processed by the eye. Researchers are divided between <a href="/wiki/word%20shape" class="freelinking" rel="nofollow">word shape</a> recognition and letter identification as the process by which information is processed during reading.</p>
    <p>Letter identification theory posits that a reader identifies and recognizes a word through a part based pattern matching process. Perhaps identifying whole letters or parts of letters rapidly until the word is identified and comprehended.</p>
