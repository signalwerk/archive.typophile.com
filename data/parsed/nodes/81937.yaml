    <p>Official Site   ：http://www.franzaward.com/index.php<br>
    Face book page:：http://www.facebook.com/FranzAward</p>
    <p>A stage for international new design talents, “2011 FRANZ AWARD Porcelain Design Competition”, is taking off recently！ </p>
    <p>Since the launch in 2007, it has now become the largest and the most representative porcelain design competition in the Chinese world of Taiwan, China, Hong Kong and Macau. The gold award winner can receive an NT$500,000 prize, and an opportunity to participate in MAISON &amp; OBJET under the aid of FRANZ Collection Inc. By attending the international design affair, the winner may have a great chance to receive orders from expert buyers all over the world. The online application starts from today and will close on 7/1. Global design talents are all welcomed to team up for the challenge!</p>
    <p>The theme for the competition is “Horizon”, with the meaning of “The techniques within the limits, and the creativities beyond the borders”. We truly hope that the contestants can understand themselves and surpass themselves. Moreover, by realizing the contents of porcelain design, they can cross over the boundary to produce porcelain which is suitable for the modern lifestyle, and then open up the whole new world for china.</p>
    <p>Gold Award Winner (1)	NT$500,000, a cup, a certificate of merit, an opportunity to participate in M&amp;O<br>
    Silver Award Winner (1)	NT$250,000, a cup, a certificate of merit<br>
    Bronze Award Winner (1)	NT$100,000, a cup, a certificate of merit<br>
    Creative Design Award Winner (1)	NT$50,000, a certificate of merit<br>
    Creative Marketing Award Winner (1)	NT$50,000, a certificate of merit<br>
    Excellence Award Winners (several)	NT$10,000, a certificate of merit</p>
