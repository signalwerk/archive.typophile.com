    date: 2012-02-10T02:14:00
    date_raw: 10 Feb 2012 — 2:14am
    votes: null
    html: |-
      <p>Nick, I presume this error is given because the software used <em>inserts</em> a "0" somewhere in the barcode and then <em>relies on the font</em> not to show anything. In InDesign, for example, that would flag a "missing glyph" error.</p>
      <p>According to this</p>
      <p><cite>Placing an active glyph in location “0” of the font would cause a corrupt barcode to be created.</cite></p>
      <p>it should be possible to add a "0" with a zero width, non marking glyph. Then you can use them as much as you want and nothing will appear on paper, and the Esko software will stop complaining.</p>
  - id: 495601
    user: 44586
    date: 2012-02-18T06:01:00
    date_raw: 18 Feb 2012 — 6:01am
    votes: null
    html: <p>Thanks everyone - you printed me in the right direction. I downloaded a demo glyph editor and looked at their other fonts that do work. They had a nodes that are 0 in width and height on their other fonts for white space, so I drew a box that was 0 in width and height. Font works with no problems now!</p>
