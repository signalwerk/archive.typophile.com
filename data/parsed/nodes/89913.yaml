  html: |-
    <p>I'm embedding a PDF417 Barcode font in a PDF but when it comes time to output pdf thru my Esko print/prepress equipment, I get an error, "Glyph zero, Character code 48 is missing from the font". </p>
    <p>I contacted the author of the font, and this is the response I got: </p>
    <p>[It is true that the PDF417 font does not have an active glyph at location "0", because "0" is the place in this font for a white symbol. This is not normally an issue except in rare cases such as what you are experiencing. Placing an active glyph in location “0” of the font would cause a corrupt barcode to be created. I suggest working with the support department of the Esko device so that barcode fonts can be used on their device.]</p>
    <p>Any thoughts on what I can do to fix or repair the font or PDF? Is there a way to replace the "white symbol", so I dont have problems? I really have no experience with editing or building fonts. I did conversions with TransType Pro and ran Font doctor, tried subsetting the font, ect,, and still had the same problems. I really can't convert the fonts to paths or image, as I have 10,000+ pages and it makes the PDF huge.</p>
