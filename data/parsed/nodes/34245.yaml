    <p>Hi everyone, </p>
    <p>I'm looking for a way to imitate a letterpress effect in an advertisement for one of my clients. </p>
    <p>I'm not sure if it would be better to use a font that creates that effect, or to create the effect in Photoshop on an existing font. </p>
    <p>Thanks for your suggestions,<br>
    R.</p>
