    html: |-
      <p>What about the flourishes/ornaments?<br>
      If you want to emboss the entire page (as if printed the ol'fashioned way), just a typeface won't be enough.<br>
      Maybe use Photoshop after all...</p>
      <p>Suggestion: Design the page/ad using Illustrator or InDesign; Export to PDF and finaly Import to Photoshop again...(use transparent background and a reasonable resolution).<br>
      Create a new layer (filled white), Select the layer with text/image and 'clear' the selection layer from the white one.<br>
      Apply some kind of 'embossing effect on this white layer.<br>
      Perhaps you could bring the 'embossed layer' back into InDesign in order to maintain the quality of the type.</p>
