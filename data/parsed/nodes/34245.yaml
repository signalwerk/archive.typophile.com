    html: |-
      <p>You can create a look similar to this in Photoshop, but it'll look far less organic. It's pretty simple, though:</p>
      <p>1. Set your type in Photoshop<br>
      2. Set the layer effects to Bevel and Emboss, and select Emboss and choose down as the direction. Adjust the depth and everything until it looks right. Subtlety goes a long way here.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/faux_emboss_5886.png"></div><p></p>
    html_clean: |-
