    html: "<p>It's pretty easy to do a simple effect in illustrator. first change the transparency of your type to multiply at 100%. then select the type and go to effect: stylize: inner glow. set the opacity at 8-10%, change the mode to multiply and the color to black. it gives a subtle indented look without the hassle of photoshop.</p>"
