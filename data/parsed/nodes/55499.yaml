    <p>Just wondering your thoughts on this Klimax face and its usage. It is very intriguing at large sizes (and indeed it is meant for display) but anything close to what typophile is using it for and it turns to mush. </p>
    <p>Is there anyone who has used this font yet or can testify to its success in their own work? Appreciated.</p>
    <p>-Jesse</p>
