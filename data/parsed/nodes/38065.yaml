    <p>Hi everyone</p>
    <p>I've been given an assignment for my typography module to find a font from the 1970's. Its quite hard to find a site which lists fonts in chronological order of design so i was wondering if anyone on here could recommend some great fonts from that decade. Something iconic and perhaps away from the groovy psychadelic style fonts that immediately spring to mind.</p>
    <p>Thanks a lot!</p>
    <p>Jono</p>
