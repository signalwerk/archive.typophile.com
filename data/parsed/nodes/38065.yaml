    html: <p>To me, the 1970s are represented by Avant Garde. ITC was on the way, Carnarse, Lubalin, Benguiat were in top form, Photolettering was great. Avant Garde was new, had lots of alternatives so it didn't have to look like the same face being set over and over again -- and it has held up.</p>
