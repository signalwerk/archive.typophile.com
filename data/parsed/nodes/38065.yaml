    html: |-
      <p>I agree Patty - though Ehague, sometimes as a typographer, I found myself talking in grunts and one syllable words. No one around, there was no need to communicate - just make that type look good, and the equipment "sing."</p>
      <p>It has been a rough week and I'm glad I have any memory at all... which is more than I can say for my mac.<br>
      The drive crashed yesterday -- I took it to an Island Guru (funny, because so many Mac folks here count on me) he couldn't help, so he put me in touch with his IBM Guru - who couldn't get the drive to show a "signature" and therefore, it was a goner...</p>
      <p>I went to dinner, had a drink - came home, talked it over with my computer. I then realized, I'd been trying to reinstall the system folder from the original G5 disks - no no - I got out X-TIGER and went to work By 8:18pm (a whole 14 hours later) my computer is back up and running the best I've seen it run in ages.</p>
      <p>Meanwhile, the new drive has arrived - but I need to finish my workload before I'd consider swopping it out...</p>
      <p>Sorry for the hyphen instead of apostrophe - it really is tiredness, frustration, etc. etc.</p>
      <p>Meanwhile, congrats on being the most prolific poster on typophile today - with 88 -- wahoooo.</p>
