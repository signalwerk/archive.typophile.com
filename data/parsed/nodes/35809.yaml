    <p>Who's your daddy, I ask of you?</p>
    <p>Here's the transformation of joe schmo Dan Gayle into the Typecon2007 1980s party best male costume. Rather than the cocaine and New Order vibe, or the Flashdance vibe of the others, I instead opted for the 80s midwestern white trash vibe. (The hat says Happy Days, by the way...)</p>
    <p>It was awesome, because it added about 20 years to me, and no one recognized me at first glance. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMGP2635_3739.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/20070428_0011_5954.jpg"></div><p></p>
