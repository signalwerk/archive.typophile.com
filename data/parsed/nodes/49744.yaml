    html: <p>Yeah, I wouldn’t ask otherwise. They rebooted the voting because they suspected foul play. When it originally started a week ago the middle guy received a staggering 800+ votes within a few minutes, bringing him to 90% of the votes. I don’t know if you can devise a program that does that automatically (vote - erase cookies - vote - erase cookies and so on), but it was sufficient for the organisation to let us compete again. I think now at least we stand a fair chance. :^)</p>
