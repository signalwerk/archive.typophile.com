    <p>Hello,</p>
    <p>I've been looking for good steel brushes in various shapes, but have found these to be quite hard to find(outside of the quite common speedball ones).<br>
    So I was wondering if anyone would have a suggestion of where to find good ones, preferably shipping to Europe.</p>
    <p>Thanks for any suggestions,</p>
    <p>Paul-Kenji Cahier</p>
