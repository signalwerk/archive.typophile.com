      <p>If you are looking for steel pen nibs, you might want to try John Neal Bookseller (<a href="http://www.johnnealbooks.com" title="www.johnnealbooks.com">www.johnnealbooks.com</a>).<br>
      Besides books, they sell a wide variety of pens, brushes, nibs and other lettering and calligraphy tools. They are located in North Carolina and ship to Europe.</p>
