      <p>Josh, Lost Type's commercial license is rather broad:<br><a href="http://www.losttype.com/images/samples/License_Commercial_Sample.pdf">http://www.losttype.com/images/samples/License_Commercial_Sample.pdf</a><br><a href="https://www.losttype.com/contact/">https://www.losttype.com/contact/</a></p>
      <p>As for Cymbria, it is posted as a free font for both personal and commercial use (see the header text on the Font Forestry's Freebies page):<br><a href="https://www.fontforestry.com/freebies-1/">https://www.fontforestry.com/freebies-1/</a></p>
      <p>If you go to Font Forestry's commercial fonts page and click through the purchase links (to Creative Market), the license states that those fonts are may be used for "Commercial Use; Unlimited Number of Projects; Unlimited End Products For Sale". I suspect their freebie fonts share the same permissions. Contact them if you are unsure about how you intend to use them:<br><a href="https://www.fontforestry.com/contact-1/">https://www.fontforestry.com/contact-1/</a></p>
