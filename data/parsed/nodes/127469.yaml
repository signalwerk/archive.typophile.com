    <p>Hi,</p>
    <p>Can you please provide recommendations for similar typefaces to Cymbria and Blanch? We need to purchase a commercial license for these fonts, but they don't seem to be available. It appears that Blanch might have a license available through LostType, but I am not certain at this point that the EULA is sufficient for our needs.</p>
    <p>Cymbria:<br><a href="https://www.fontforestry.com/cymbria">https://www.fontforestry.com/cymbria</a></p>
    <p>Blanch:<br><a href="https://www.losttype.com/font/?name=blanch">https://www.losttype.com/font/?name=blanch</a></p>
    <p>Thanks for any assistance you can provide.</p>
    <p>Josh</p>
