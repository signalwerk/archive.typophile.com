    html: |-
      <p>Whoa! There is no one font that matches this, surely? It has two differing constructions for ’a’ for a start, and two differing widths for the last two words.</p>
      <p>You could start with something like <a href="http://www.linotype.com/616/itcclearface-family.html">Clearface</a> and mess about with it yourself. Another one that reflects the style of the period is <a href="http://www.linotype.com/90458/windsor-family.html">Windsor.</a></p>
      <p>And you could probably find something at <a href="http://www.letterheadfonts.com" title="http://www.letterheadfonts.com">http://www.letterheadfonts.com</a> that comes closer to this than either of them, but I don’t know what it would be called.</p>
