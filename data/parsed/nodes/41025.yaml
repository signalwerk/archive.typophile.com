    <p><strong>Instructions:</strong></p>
    <p>You will create an album cover for a fictitious band, using a<br>
    fictitious album name and an image from Flickr. Follow these<br>
    steps below. Design your album and post it to this Battle<br>
    thread by Friday, 5pm Pacific.</p>
    <p>1. The first article title on the Wikipedia Random Articles page<br>
    (<a href="http://en.wikipedia.org/wiki/Special:Random" title="http://en.wikipedia.org/wiki/Special:Random">http://en.wikipedia.org/wiki/Special:Random</a>) is the name of<br>
    your band.</p>
    <p>2. The last four words of the very last quotation on the Random<br>
    Quotations page (<a href="http://www.quotationspage.com/random.php3" title="http://www.quotationspage.com/random.php3">http://www.quotationspage.com/random.php3</a>)<br>
    is the title of your album.</p>
