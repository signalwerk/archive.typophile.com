    html: <p>John, <br>Thanks for that bit of info on the Tironian <i>et</i> sign. I never made the connection. Here's a little more info that you may or may not already know. <br> <br>The Tironian <i>et</i> sign was also used in Irish manuscripts as a shorthand form of 'et' and 'ead' when they constituted a whole syllable. (1) <br>If you tag on a 'c' you get 'etc.' (2) <br>It was also used for '</p>
