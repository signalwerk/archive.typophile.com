    html: '<p>The <a href="http://gymn-benedictinum.de/san_projekt/augustinus/ligatur_1.htm">list</a> is far from comprehensive, although it does contain the most frequenly encountered scribal contractions. The standard texts on scribal contractions are: <br> <br>Cappelli, Adriano. <i>Lexicon abbreviaturarum: dizionario di abbreviature latine ed italiane.</i> <br> <br>Chassant, Louis-Alphonse. <i>Dictionnaire des abr</i></p>'
