    html: <p>Here's an example of the Mother of All Ampersands.  <br><img src="http://www.typophile.com/forums/messages/30/8253.jpg" alt="Tironian et sign (agus)">  <br>This is the Tironian <i>et</i> sign, which is still used today in Gaelic text (it is known in Irish as <i>agus</i>). This sign derives from the Roman judicial shorthand system developed by Marcus Tullius Tiro, Cicero's scribe and namesake of a certain type foundry. The top of the Tironian ampersand is aligned to the x-height. Sometimes it descends below the baseline, looking like -- sometimes too much like -- an oldstyle number seven; in other examples it stops at the baseline. All Gaelic fonts should contain this characters. Note that it has its own Unicode codepoint, U+204A, to distinguish it from the usual ampersand, because it is sometimes found in texts used alongside the modern form.</p>
