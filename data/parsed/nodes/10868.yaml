    date: 2003-04-02T08:56:00
    votes: null
    html: <p>Him, hope I can translate it right. This site is a school project of a christian monk monastery. <br> <br>The letters and ligatures derived from historical hand written sources and help to read and decode the old latin scripts from the library. <br> <br>The project was inspired by same samples from a book restorage. In the upcoming time of letter print, most of the original scripts used or cuted to repair the "new" and "better" printed books. Nowadays some of such historical samples will be found in such early printed books if they will be restored again. <br> <br>Like yesterday or so, some new unknown samples of the "hildebrands lied" are found in an Austrian monastery. <br> <br>So, these samples are for historical research only and not samples for new fonts designs. :-) <br> <br>Back to the topic - It`s interesting to see such historical forms.</p>
