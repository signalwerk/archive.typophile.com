    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;:&nbsp;Underware</strong></p>
    <p>Underware is a (typo)graphic design-studio which is specialized in designing and producing typefaces. These are published for retail sale or are specially tailor-made. The company was founded in 1999 by <a href="/node/13510" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akiem Helmling</a>, <a href="/node/13511" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bas Jacobs</a> and <a href="/node/13512" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sami Kortemäki</a>. Underware is based in the corresponding studios of each of its three principals in <a href="/node/add/wiki?edit%5Btitle%5D=The%20Hague" title="Create node &quot;The Hague&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Den Haag</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Helsinki" title="Create node &quot;Helsinki&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Helsinki</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Amsterdam" title="Create node &quot;Amsterdam&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Amsterdam</a> respectively.</p>
    <p>Underware started <a href="/node/15245" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeRadio</a> and various type workshops. Underware designed the cover of <a href="/node/add/wiki?edit%5Btitle%5D=Font_Magazine" title="Create node &quot;Font_Magazine&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">font</a> issue&nbsp;004.</p>
    <p>Underware fonts: <a href="/node/add/wiki?edit%5Btitle%5D=Bello" title="Create node &quot;Bello&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bello</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Sauna" title="Create node &quot;Sauna&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Sauna</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Auto" title="Create node &quot;Auto&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Auto</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Dolly" title="Create node &quot;Dolly&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Dolly</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Fakir" title="Create node &quot;Fakir&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fakir</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Unibody" title="Create node &quot;Unibody&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Unibody</a>.</p>
    <p><span class="caps">URL</span>: <a href="http://www.underware.nl">http://www.underware.nl</a></p>
