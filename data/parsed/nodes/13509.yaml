    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Underware</strong></p>
    <p>Underware is a (typo)graphic design-studio which is specialized in designing and producing typefaces. These are published for retail sale or are specially tailor-made. The company was founded in 1999 by <a href="/wiki/Akiem%20Helmling" class="freelinking" rel="nofollow">Akiem Helmling</a>, <a href="/wiki/Bas%20Jacobs" class="freelinking" rel="nofollow">Bas Jacobs</a> and <a href="/wiki/Sami%20Kortemaki" class="freelinking" rel="nofollow">Sami Kortemäki</a>. Underware is based in the corresponding studios of each of its three principals in <a href="/wiki/The%20Hague" class="freelinking" rel="nofollow">Den Haag</a>, <a href="/wiki/Helsinki" class="freelinking" rel="nofollow">Helsinki</a> and <a href="/wiki/Amsterdam" class="freelinking" rel="nofollow">Amsterdam</a> respectively.</p>
    <p>Underware started <a href="/wiki/TypeRadio" class="freelinking" rel="nofollow">TypeRadio</a> and various type workshops. Underware designed the cover of <a href="/wiki/Font_Magazine" class="freelinking" rel="nofollow">font</a> issue 004.</p>
    <p>Underware fonts: <a href="/wiki/Bello" class="freelinking" rel="nofollow">Bello</a>, <a href="/wiki/Sauna" class="freelinking" rel="nofollow">Sauna</a>, <a href="/wiki/Auto" class="freelinking" rel="nofollow">Auto</a>, <a href="/wiki/Dolly" class="freelinking" rel="nofollow">Dolly</a>, <a href="/wiki/Fakir" class="freelinking" rel="nofollow">Fakir</a> and <a href="/wiki/Unibody" class="freelinking" rel="nofollow">Unibody</a>.</p>
    <p>URL: <a href="http://www.underware.nl" title="http://www.underware.nl">http://www.underware.nl</a></p>
