    html: |-
      <p><cite>… it has its merits</cite></p>
      <p>Yes it has. I respect the designers courage to explore something. But not every interesting outcome of an exploration is equally good as a typeface.</p>
      <p><cite>… think out of the boxes classically delimited by classification</cite></p>
      <p>I didn’t think along the lines of classification but rather about *the nature* of script. Aicher was obviously uncomfortable with the *traditional* opposition between Sans and Serif. It was HE who reasoned along the limits of classification and thought it would have merits to just violate these limits. Now, what did he embark on? He did NOT go back to the roots of both to see what new paths can possibly be found from THAT point. Instead he took his knife and cut one ear off from the two – very well. The frankensteinish result, if one likes to put it so, is something new, ok. But is it something worthy?</p>
      <p><cite>“no man’s land”</cite> – Aicher’s land ;-)</p>
