    html: |-
      <p><em>"But not every interesting outcome of an exploration is equally good as a typeface"</em><br>
      Like I said before, I personally can't get excited about the way Rotis looks – but I think it works (or at least can work) extremely well. Actually, the style I had this "epiphany" with was the Semi Sans, which I find the most hideous of the bunch, visually speaking. But the fact that it <em>works</em> makes me forgive it for being so ugly, and in my book, makes it a successful text face.</p>
      <p><em>"He did NOT go back to the roots of both to see what new paths can possibly be found from THAT point. Instead he took his knife and cut one ear off"</em><br>
      What makes you say that? Does he discuss his design process somewhere? (I admit I haven't finished reading "typographie" yet.)<br>
      And just for the record, of course he didn't just chop off the serifs and that was that; I think the way he rebalanced the shapes in each style is pretty successful:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/rotises_5505.gif"></div><br>
      But I'm curious, are there any fonts that you think actually do that: Go back to the "roots" and find new paths from there, off the beaten tracks of the "classic" genres? I'd be curious to learn what kind of results you think such an approach might yield – results relevant for today no less.<p></p>
      <p>BTW, I wonder if historicism (in the sense of basing one's designs on historical precedent and the way things developed to where they are today – your "roots") must really be the only permissible way to go about finding shapes that work. What's so despicable about "remixing" existent shapes? About cutting off ears? Are type designers that indebted to type history – more so than to the reader, who just wants/needs type that works?</p>
