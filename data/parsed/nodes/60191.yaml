      <p><em>"Bääähhhhhhrlckxx"</em><br>
      :-)<br>
      I don't think it's pretty, either. That "e" looks like it just ate something that went bad a week ago. But: It reads amazingly well when properly typeset – which seems very hard to do, as the optimal effect most often isn't achieved. I've seen it done well once (by Aicher himself), which sure convinced me that it has its merits, even though it's so often badly used.</p>
      <p><em>"Rotis Semi-Sans and a Rotis Semi-Serif which are Bastards"</em><br>
      Shouldn't it be time to think out of the boxes classically delimited by classification?<br>
      I suspect that especially semiserifs are massively underrated, and that there is a lot of uncharted territory for successful text fonts between the classic serif and sans genres. Essentially declaring that territory a "no man's land" is convenient, but not very fruitful.</p>
