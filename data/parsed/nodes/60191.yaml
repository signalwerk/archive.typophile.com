      <p><cite>… if historicism […] must really be the only permissible way …</cite></p>
      <p>Of course not. Referring to roots is not historicism but radicalism (“radix” ;-).<br>
      There are fonts which sometimes get referred to as “incised”. I think this is a far more interesting direction for the option “serif/sans”.</p>
      <p>I don’t want to be dogmatic on this, just wanted to express that Aicher’s thinking is too mechanistic for my taste, not only in terms of Rotis.<br>
      But that’s another thread …</p>
