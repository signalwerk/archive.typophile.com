    date_raw: 13 Jun 2008 — 12:46pm
    votes: null
    html: <p>I have been checking around and it turns out that you can get ( barring a substantial currency exchange shift ) a room for AtypI for as little as $150 without going the full on hostel route. Now, can they get you the right paperwork for a visa?... that's a different question. I hope AtypI comes out with partner hotel info soon.</p>
  - id: 283883
    user: 2969
    date: 2008-06-14T05:35:00
    date_raw: 14 Jun 2008 — 5:35am
    votes: null
    html: |-
      <p>I'm getting going to please Joe, but I'm never talking about tracking again, Ever.:)</p>
      <p>I've been wisely advised: don't take any hardware you cannot afford to loose completely. Don't take any software you can't afford to turn over to a complete stranger, with all ownership rights, for free. Don't buy anything that looks old and try to bring it home; the customs chaps have a vague rule about antiquities export protection in their holsters and if they or their wife or mom want what you got, they enforce. Don't ever use credit cards or give anyone any numbers. Make sure a witness is with you if you ever need to give up your passport to anyone for any reason. </p>
      <p>.gov has much more to say, much of which is so diplomatically phrased, you might miss it.;)</p>
      <p>Cheers!</p>
