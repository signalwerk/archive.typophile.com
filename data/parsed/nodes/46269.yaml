    <p>I am going to AtypI in St. Petersburg, Russia to give my talk on Contextual Alternatives in roman text face design. I am very happy about this! :-)</p>
    <p>In the meantime as I prepare, I wonder: do you have any advice for me about St. Petersburg? AtypI? Cusine? Pre-AtypI tourisim? Anything else? </p>
    <p>Feel free to reply here or to contact me privately. </p>
    <p>Thanks!</p>
