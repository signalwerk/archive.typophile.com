    html: '<p>I think this looks really nice. The dialogue bubbles are a good idea, but they look crooked. Could you rotate one or both a little more than they are to accentuate their different angles? Or make them square to the rest of the design? <br> <br>I like the saturated colours, but maybe it would work better with lighter tints or brighter colours. BTW maybe you could use transparency for where the bubbles meet, like this example: <br> <br><img src="http://www.typophile.com/forums/messages/29/23643.jpg" alt=""> <br> <br>I am NOT suggesting using curved bubbles necessarily (unless you want or feel that it could work). <br> <br>Jon</p>'
