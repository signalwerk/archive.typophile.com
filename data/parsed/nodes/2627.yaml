    html: <p>Okay, I tried other shapes but in my opinion they didn't work very well. So I basically kept the old bubbles, made them a tiny bit rounder, shrinked the darker one a little and corrected the stripes. <br> <br>Also we finally decided to go with more contrast and since the subject of this forum is the drug use of young people, vibrant colours fit pretty well. Maybe the contrast is a bit too stong? <br> <br>Remember that time is up and budget small, so no major changes will be made. <br> <br><img src="http://www.typophile.com/forums/messages/29/24224.jpg" alt=""></p>
