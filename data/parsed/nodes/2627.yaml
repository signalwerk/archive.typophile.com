    html: <p>Transparency at intersection could be a nice idea Jon, but there might be a meaning in those "waves". Youth Forum is probably about opinions. The opinions do not necessarily become a compromise (a color which is a mixture of orange and blue). Debates are rather battles where the opinions are waving side by side and against each other...  <br> <br>From a designer's point of view I find those waves a nice rhythmical part of the whole composition.</p>
