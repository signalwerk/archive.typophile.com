    html: "<p>One more typographic detail Magnus, before you send these files to print. I think that terminals of the \"arrows\" should be defined. In this case probably by a very tiny curve (see image below). Not only it makes the logo more compact it is more resistant to small sizes and on-screen display, as well. It works better with different sign-cutting machines. <br> <br>Excuse me if this is already done, I can't see it at this size. <br> <br>BTW: I like blue-orange color scheme more. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/24263.gif\" alt=\"Curved terminal\"></p>"
    html_clean: "<p>One more typographic detail Magnus, before you send these files to print. I think that terminals of the \"arrows\" should be defined. In this case probably by a very tiny curve (see image below). Not only it makes the logo more compact it is more resistant to small sizes and on-screen display, as well. It works better with different sign-cutting machines. <br> <br>Excuse me if this is already done, I can't see it at this size. <br> <br>BTW: I like blue-orange color scheme more. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/24263.gif\" alt=\"Curved terminal\"></p>"
