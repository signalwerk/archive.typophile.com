  html: <p>Hello again. <br> <br>Here is the first version of a logotype for a debating meeting. The overlay area of two dialogue bubbles represent the stripes of zebra, which is the symbol of Estonian Debating Society. <br> <br>This concept will definitely be used, but I have a few more days to make changes in the logo. Lighter colours are have been requested for instance. <br> <br>Anyway, I'm worried about the balance and the use of tilted bubble. What do you think? <br> <br><img src="http://www.typophile.com/forums/messages/29/23640.jpg" alt=""></p>
  html_clean: <p>Hello again. <br> <br>Here is the first version of a logotype for a debating meeting. The overlay area of two dialogue bubbles represent the stripes of zebra, which is the symbol of Estonian Debating Society. <br> <br>This concept will definitely be used, but I have a few more days to make changes in the logo. Lighter colours are have been requested for instance. <br> <br>Anyway, I'm worried about the balance and the use of tilted bubble. What do you think? <br> <br><img src="http://www.typophile.com/forums/messages/29/23640.jpg" alt=""></p>
