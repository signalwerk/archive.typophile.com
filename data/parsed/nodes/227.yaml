    html: "<p>Well, it's probably not really related to the main issue. But here's an explanation: if you draw a \"perfect\" circle (using the application's tool, or maybe a physical one and then trace it), and you measure the length of the BCP arms in each quadrant, they are about 0.552 of the whole length. This is the value required in cubic bezier math to get a \"perfect\" circle. BTW, \"perfect\" is in quotes because you really can't represent a true circle in beziers (of any order). <br> <br>The way this <i>might</i> be related to the main issue is this: if you were to convert a one-sided curve to a near-equivalent two-sided one, some sort of preset factor values might be the trick. <br> <br>hhp <br></p>"
    html_clean: "<p>Well, it's probably not really related to the main issue. But here's an explanation: if you draw a \"perfect\" circle (using the application's tool, or maybe a physical one and then trace it), and you measure the length of the BCP arms in each quadrant, they are about 0.552 of the whole length. This is the value required in cubic bezier math to get a \"perfect\" circle. BTW, \"perfect\" is in quotes because you really can't represent a true circle in beziers (of any order). <br> <br>The way this <i>might</i> be related to the main issue is this: if you were to convert a one-sided curve to a near-equivalent two-sided one, some sort of preset factor values might be the trick. <br> <br>hhp <br></p>"
