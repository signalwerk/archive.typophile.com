    html: <p>Peter -- <br> <br>I've been thinking about this and spending some time with the FontLab manual.  <br>I had an insight that I think might help. <br> <br>The FOG model is point-based. But the FontLab model is segment-based.  <br> <br>What I mean is that in FOG you are usually focused on what kind of point  <br>you're placing. Whereas in FL, the emphasis is on what kind of line segment  <br>is being operated on. FOG has three kinds of points -- corner, curve, and  <br>tangent. FL doesn't make these distinctions. <br> <br>FL distinguishes between two different kinds of line segment -- a straight line  <br>(which they also call a <i>vector</i>) and a curve (a bezier curve). A curve is described  <br>by four points -- two end points on the curve (<i>nodes</i>) and the two bezier  <br>control points on the handles. A straight line is controlled by only two nodes --  <br>one at either end, with no control handles. <br> <br>FL also distinguishes two different kinds of transitions between line segments --  <br>a node can either be a smooth connection or a sharp connection. <br> <br>So, if you have a curve meeting another curve, then the node will have two  <br>control handles, one contributing to each of the two curves. If the connection  <br>is smooth, then the two handles will be co-linear -- that is, they are linked  <br>and stay aligned with each other -- so this kind of node is what FOG would call  <br>a curve point.  <br> <br>If two curves meet and the connection is sharp, then the two control handles  <br>can be moved independent from one another. This node would then constitute  <br>a corner point in FOG. <br> <br>If two straight line segments meet, then the node does not have any control  <br>handles and is necessarily sharp. This would also be considered a corner point  <br>in FOG. <br> <br>If a straight line meets a curve, then the node will have one control handle on  <br>the curve side. If the connection is sharp, then this control handle can move  <br>any which way and the node would be considered a corner point in FOG.  <br> <br>But if the connection is smooth, then the control handle on the curve side  <br>will be co-linear with the vector segment meeting up with the curve and will  <br>only move in a line with this vector -- and this is what FOG would call  <br>a tangent point. <br> <br>Does this help? <br> <br>So, you need to notice whether the node between a straight line and a curve  <br>is smooth or sharp. When it is selected, you will see off to the side of the  <br>node either a circle (smooth connection) or an x (sharp connection). You can  <br>also turn on all connection types for every node, whether selected or not, by  <br>selecting the button from the View/Show Layers toolbar. <br> <br>So, for example, if you select the node on the top of the inside of your  <br>counter, you will see whether it is a smooth connection or not. If it isn't,  <br>then double click the node to toggle the connection style. When the connection  <br>is smooth, then you can change the "curve" on the right side to a straight line  <br>by selecting the right control handle of the node and deleting it. (Deleting  <br>either control handle of a segment will convert it to a straight line vector, since  <br>a curve needs to be defined by two control handles.) <br> <br>Once the right-hand segment is a straight line and the left-hand segment is a  <br>curve and the node is a smooth connection, then the handle on the left will  <br>only move in line with the straight segment and you will have, in effect, a  <br>tangent point. <br> <br>I hope this makes sense and is helpful. <br> <br>-- Kent. <br></p>
