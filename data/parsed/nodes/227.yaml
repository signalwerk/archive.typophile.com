    html: <p>Alan, Hrant --  <br> <br>I'm not a real Postscript jockey, but to the best of my <br> understanding I'm not so sure that the one-bcp-handled  <br>curve is necessarily "illegal." The thing is that the  <br>various Postscript <b>curveto</b> commands require a  <br>set number of arguments, based on the assumption of  <br>two handles and endpoints (actually, the first point is a  <br>given, so generally only six arguments are required.  <br>You can reference the T1 Font Format, Ch. 6, pg 52.) <br> <br>The thing about FL is that it constructs curves with the  <br>same assumption. But if you create a single-handled  <br>curve in FOG, all that means is that the generated PS  <br>instruction will contain a few arguments whose values  <br>are zero. There's no restriction or caution about these  <br>arguments being non-zero, as far as I can tell. <br> <br>I think that since these arguments only seem to be  <br>calculation values, this construction wouldn't constitute  <br>any point-on-point sort of violation. But who knows  <br>what happens when Hrant tries to convert to TT. <br> <br>But Hrant, you don't gain any worthwhile savings in  <br>terms of data points in the actual PS-generated font.  <br>Maybe a digit here or there, but who's counting? Again,  <br>I don't know about TT. <br> <br>-- K. <br></p>
