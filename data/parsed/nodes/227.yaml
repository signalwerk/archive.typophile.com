    html: "<p>&gt;But above that you wrote: \"FontLab will convert 'single-handed' cubic curve into correct TT curve\" so don't you have the algorithm already?  <br> <br>Well, you can convert single-handed curve to quadratic curve and back, but as a result you will get 2 cubic curves. I mean that I can imagine algorithm which will convert single-handed curve to one \"normal\" curve. Alan Dague-Greene provided good example of what I mean. <br> <br>&gt;I'm curious, where did you get the factor of 0.55197 when making a \"perfect\" circle?  <br> <br>Did we publish this number somewhere or you just draw a very big circle in FL? :-)  <br> <br>Actually I don't remember how it was calcualted in the early days of FL, but now I would do it this way (pardon my math): measure a distance (along x or y direction) from the point located at 45 degrees on a curve and a midlle point of the one-quarter curve. On a curve it is: R * (4 + 3 * X) / 8 [where X is a value we want to find], on a circle: R / sqrt(2). <br> <br>Finally our X is [in C math notation]: (8 / sqrt(2) - 4) / 3 <br> <br>Precise value is: 0.55228474983079339840225, which is quite close to the value we use in FL (and which history I don't remember).</p>"
    html_clean: "<p>&gt;But above that you wrote: \"FontLab will convert 'single-handed' cubic curve into correct TT curve\" so don't you have the algorithm already?  <br> <br>Well, you can convert single-handed curve to quadratic curve and back, but as a result you will get 2 cubic curves. I mean that I can imagine algorithm which will convert single-handed curve to one \"normal\" curve. Alan Dague-Greene provided good example of what I mean. <br> <br>&gt;I'm curious, where did you get the factor of 0.55197 when making a \"perfect\" circle?  <br> <br>Did we publish this number somewhere or you just draw a very big circle in FL? :-)  <br> <br>Actually I don't remember how it was calcualted in the early days of FL, but now I would do it this way (pardon my math): measure a distance (along x or y direction) from the point located at 45 degrees on a curve and a midlle point of the one-quarter curve. On a curve it is: R * (4 + 3 * X) / 8 [where X is a value we want to find], on a circle: R / sqrt(2). <br> <br>Finally our X is [in C math notation]: (8 / sqrt(2) - 4) / 3 <br> <br>Precise value is: 0.55228474983079339840225, which is quite close to the value we use in FL (and which history I don't remember).</p>"
