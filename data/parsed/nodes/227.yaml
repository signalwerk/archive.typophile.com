    html: "<p>Alan -- <br> <br>I've been noticing the exact same problem with font  <br>audit. I appreciate the feature, but I wish turning off  <br>the semi-horizontal and semi-vertical vector alert really  <br>worked. Very annoying. <br> <br>From your diagram above, the Postscript instruction for  <br>the first would end up something like <br> <br><b>0 0 -66 -81 -103 0 rrcurveto</b> * <br> <br>(Note: I'm assuming this is the bottom curve of a  <br>counter and thus the direction is clockwise. I don't  <br>know your actual coordinates, so this is just an  <br>approximation based on the pixel dimensions of your  <br>screenshot.) <br> <br>The instruction for the second would be more like <br> <br><b>-33 -37 -60 -44 -76 0 rrcurveto</b> <br> <br>I don't really follow the *math* for applying the Bezier  <br>equation, so I don't know if those initial zeros in the  <br>first instruction would pose any potential weirdness.  <br>I do know that trying to geometrically construct a  <br>single-handled bezier is a little odd. <br> <br>For whatever it's worth. <br> <br>-- K. <br> <br>* I suppose, technically, this first instruction could even  <br>be written as <b> 0 -66 -81 -103 vhcurveto</b>, but I bet  <br>that would really lead to interpretive weirdness. <br></p>"
