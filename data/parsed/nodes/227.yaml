  html: <p>I'm slowly trying to come to terms with <a href="http://www.font.to/cgibin/at.cgi?a=227536" target="_blank">Fontlab</a>, even though it's not a intinutive GUI. <br> <br>I still do most of my work in Fog and only use Fontlab for the last bits. However, <br>when opening my files in Fontlab, some of my tangent points <br>are gone and replaced. (see image below) <br> <br><img src="http://www.typophile.com/forums/messages/4101/11133.gif" alt="Tangent Points"> <br>Why is that? Is it just a preference that I missed? <br>Or doesn't Fontlab handle tangent points? How will I then be able to make smooth transitions? <br>Anyone out there with FL wisdom?</p>
  html_clean: <p>I'm slowly trying to come to terms with <a href="http://www.font.to/cgibin/at.cgi?a=227536" target="_blank" class="link-external">Fontlab</a>, even though it's not a intinutive GUI. <br> <br>I still do most of my work in Fog and only use Fontlab for the last bits. However, <br>when opening my files in Fontlab, some of my tangent points <br>are gone and replaced. (see image below) <br> <br><img src="http://www.typophile.com/forums/messages/4101/11133.gif" alt="Tangent Points"> <br>Why is that? Is it just a preference that I missed? <br>Or doesn't Fontlab handle tangent points? How will I then be able to make smooth transitions? <br>Anyone out there with FL wisdom?</p>
