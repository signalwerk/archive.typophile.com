    html: "<p>Even if it's actually legal, I guess it's still probably better to avoid \"empty\" curve-recieving points, at least in the final result. Hmmm, Python script, anyone? <br> <br>A similar thing (legal but ill-advised) is to leave off explicit inflection points (like in the spines of an \"s\"), although this is actually commonly done by some otherwise fine designers (if rarely in very obvious spots such as the \"s\" spines). One good reason to define all your inflection points explicitly is TT output/conversion - it consistently blows up, at least in Fog. But I think there are other reasons too. Fortunately, you can easily spot a missing inflection point: the BCPs will be on opposite sides of the curve. <br> <br>hhp <br></p>"
    html_clean: "<p>Even if it's actually legal, I guess it's still probably better to avoid \"empty\" curve-recieving points, at least in the final result. Hmmm, Python script, anyone? <br> <br>A similar thing (legal but ill-advised) is to leave off explicit inflection points (like in the spines of an \"s\"), although this is actually commonly done by some otherwise fine designers (if rarely in very obvious spots such as the \"s\" spines). One good reason to define all your inflection points explicitly is TT output/conversion - it consistently blows up, at least in Fog. But I think there are other reasons too. Fortunately, you can easily spot a missing inflection point: the BCPs will be on opposite sides of the curve. <br> <br>hhp <br></p>"
