  html: |-
    <p>I'm typesetting a history book and am tempted to use hoefler text for body text (maybe for headings also?), but I haven't found any example of such usage.<br>
    Can someone give me an example? They seem hard to find.</p>
    <p>I've already considered using Calluna, Maiola or something more traditional like Minion or Sabon (setting for Calluna for now), but would definitely consider Hoefler Text after seeing some examples.</p>
