      <p>Zara, you haven’t solved the problem. All you’ve done – yet again –&nbsp;is bury an incomplete explanation of the <em>ownership</em> and management of Typophile in a comment thread. Gosh, that’ll be easy to find later, or in a crisis.</p>
      <p>Seriously: Why isn’t there a nice big About link on every page that explains who owns and operates Typophile, who owns which content, where <em>exactly</em> to go with any concerns (including a generic address for any on-duty admin)?</p>
      <p>Why is that so hard?</p>
