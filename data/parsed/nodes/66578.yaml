      <p>It's weird, but Joe is kind of right (about the missing details). I have utter respect for the work that Punchcut does in maintaining this resource - and for the community it fosters. It's truly invaluable to me. But the inner workings are unnecessarily mysterious - how does Typophile get funded? Can we really become members? I'd be happy to get a heart (or blood drop) - but how? Can I send Typophile money to keep it rolling?</p>
      <p>For me, it's less about accountability than it is about ensuring continuity; see Zeldman's latest piece about the <a class="freelinking external" href="http://www.zeldman.com/2010/01/21/posthumous-hosting-and-digital-culture/ " rel="nofollow"> loss of content</a> upon the loss of life.</p>
      <p>Now, back to my ampersand.</p>
