      <p>Typophile is funded through the generosity of community donations and through sponsorships. These sponsorships come in the form of banner advertising (as seen on the right of every page), Featured Face sponsorships (showcasing typefaces from various foundries and designers), and Typophile Film Festival sponsorships.</p>
      <p>Once upon a time, Typophile had a membership model in which we offered various levels of memberships at set costs. During this time we offered goody bags and gifts to paying members and even restricted access to particular forums for our "Uppercase" users. As the Typophile community grew into the thousands (currently 50,000+), and as Punchcut grew as a company, we were no longer able to support the tasks necessary to keep this system running in the same manner. We eventually simplified the model and now offer "badges" that we hope the community will wear with pride if they have made donations.</p>
      <p>There is a link in the nav at the top of the screen labeled "Memberships" (admittedly this language is out of date) where one can make donations to Typophile.</p>
      <p><a href="http://www.typophile.com/membership" title="http://www.typophile.com/membership">http://www.typophile.com/membership</a></p>
      <p>It has never been a secret that Typophile is run by Punchcut, and if anyone would like to learn more about who we are, you can click the link to our site in the footer (mentioned above) or read any of our bios in the <a href="http://typophile.com/typowiki" rel="nofollow">TypoWiki</a> or individual user profiles, which have been public information since the conception of this site (which is turning 10 years old soon).</p>
      <p>And lastly, Joe, we have been through this before, on Typophile publicly and in private e-mails. If you would like to get to know us better, it might be helpful to show us your kinder side.</p>
      <p><a href="http://www.typophile.com/moderators" title="http://www.typophile.com/moderators">http://www.typophile.com/moderators</a><br>
      <a href="http://www.typophile.com/typowiki" title="http://www.typophile.com/typowiki">http://www.typophile.com/typowiki</a><br>
      <a href="http://www.punchcut.com" title="http://www.punchcut.com">http://www.punchcut.com</a></p>
