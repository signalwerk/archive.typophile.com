    <p>Small print tells us, in smarmy marketer’s vernacular, “Typophile is a Punchcut gig.” (You can just <em>feel</em> the backwards baseball cap and last year’s sneakers.)</p>
    <p>Who or what is a Punchcut? Why should we care who or what Punchcut is, or what its “gigs” are? Here is what we should care about: </p>
    <ol>
    <li>Who are the real owners of Typophile?</li>
    <li>What are their names?</li>
    <li>How do we contact them?</li>
    </ol>
    <p>Why are these facts not listed?</p>
