    html: |-
      <p>Hi Ryuk, as for Centrum, from FontSite, I too have questions. FontSite has 343 font families at Fontspring, nothing at Myfonts. I checked Centrum at Identifont and it does not exist there.<br>
      This is all the info that Itentifont has on FontSite:<br>
      ---start quote--<br>
      FontSite<br>
      Web: <a href="http://www.fontsite.com/" title="http://www.fontsite.com/">http://www.fontsite.com/</a><br>
      A Web site managed by Sean Cavanaugh and Joyce Lukaczer, it sells OpenType versions of several typefaces licensed from SoftMaker GmbH, as well as some original fonts.<br>
      Fonts published by FontSite:<br>
      Combi Numerals Ltd<br>
      Combi Numerals Pro<br>
      Combi Symbols<br>
      Combi Symbols CD<br>
      Combi Symbols DV<br>
      Combi Symbols PDA<br>
      ---end quote---<br>
      The mention of SoftMaker GmbH is suspicious to me, but I don't know.<br>
      Does anyone have any good info on the legal status of the FontSite fonts?<br>
      Don</p>
