    date_raw: 12 Apr 2012 — 9:42pm
    votes: null
    html: |-
      <p>All inquiries are welcomed guys, there is no attempt to be elitist or snobby about it, there are plenty of great fonts in the library and when you take a good long look at the entire project, we're not simply reviving the typefaces, there is a good bit of re-interpretation going on since even the highest quality filmstrips weren't done with perfectly smooth outlines . . .</p>
      <p>All the members of the project are very serious about what we're doing and we consider it as historical preservation and that means we have to maintain standards throughout the development process that assures we're respecting the original forms, spacing, kerning, and we must agree on acceptable alternate forms and forms that wouldn't have existed such as the Euro, etc . . . You'd be surprised how much of this is a group effort . . .</p>
      <p>I'll be the first to admit my initial idea was just as posted at the top of this thread, slap the Dan X Solo book on the scanner, trace away and call it a revival. That was tempered once I finally met Don Hase and the Friedman family and then it became painfully clear to me it wasn't a slapdash job. It initially required the talents of folks beyond my capabilities as a typeface designer to really bring the work to the level I had intended it be revived as.</p>
      <p>I'm very pleased with the result of our efforts thus far and there is plenty of work that remains. The open invitation stands and we welcome all inquiries for participation. I think the original 40 typefaces was more or less a filter as suggested and it is likely a dogmatic mechanism I'll agree to your point Hrant which doesn't truly represent the talents of a designer who's worked on perhaps 15 typefaces or less.</p>
      <p>These days, all candidates are discussed by the current members and we decide based on the work that they have published, regardless of volume if we feel they'll be a good fit. And every current member started out by making an inquiry to me which means it's something they shared the vision for the intent of the library which is really the most important aspect of the effort.</p>
