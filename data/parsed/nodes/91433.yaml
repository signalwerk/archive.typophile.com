    html: |-
      <p>Ryan</p>
      <p>The Solotype catalog is a catalog of images and does NOT represent fonts available from Dan Solo, although he DID digitize some of them, and they are of course listed in the Solopedia. If you're not familiar with it, the catalog was produced as list of services he offered at his printshop from the mid 1930's through the mid 90's, including special effects as well as font selection.</p>
      <p>In no way is the Solopedia an attempt to identify free clones, as you intimate. I haven't looked with that in mind, but I'd estimate that 90% of the identified digitizations are commercial fonts from such sources as Nicksfonts, Linotype, URW, etc.  Where free fonts are known, they are also listed; in some cases they are the only known digitization, while in others they may be equivalent or inferior to commercial equivalents, and yes, unfortunately, some are known to be clones from such sour ces as Opti/Castcraft, WSI, and SouthernSoftware.</p>
      <p>  - Herb.</p>
