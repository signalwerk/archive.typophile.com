      <p>I'm surprised this hasn't been pointed out yet, but the majority of the fonts contained within the Solotype library have already been identified as having been created by Filmotype, a company I acquired and have been in the process of redigitizing these original works for some time now with a junto of professional typefaces designers.</p>
      <p>I'll take this opportunity to remind folks that unlike the House Industries acquisition and redigitization of the Photo Lettering Inc librar which is a closed and private effort, any professional typeface designers with at least 40 professional quality faces under their belt can participate in the redigitization of the Filmotype library.</p>
