    html: |-
      <p>Has a similar feeling to Jos Buivenga's "Diavlo".</p>
      <p>Additional thoughts: The flattened bottoms of the letters look too artificial and constrained. Which for a font that's supposed to suggest the influence of the hand - it's jarring.I'm not sure what you can do to fix that as it seems to be a major structural design in your typeface. </p>
      <p>Hopefully others will be able to chime in with how you might solve this issue.</p>
