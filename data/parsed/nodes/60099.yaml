    <p>Hello all,</p>
    <p>I have been reading these forums for a while and have found the discussions invaluable as I develop my skills as a designer. I am creating my first typeface and would like some feedback.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OverEasy_4189.png"></div><p></p>
    <p>I am new to type design, and any suggestions would be greatly appreciated. Please, do not hold back on your criticism (it's the only way I'll learn).</p>
    <p>Thanks,<br>
    ~Ezra Katz</p>
