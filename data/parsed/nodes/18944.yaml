    <p>In a couple of months, Sony is launching a new “eBook” handheld called the Sony Reader. The idea is that people will buy books electronically and read them on this device, rather than buying a printed book. I’m sure we can debate the theoretical market for such a device and whether it will actually sell, but my main beef with it is the horrific typography.  </p>
    <p>I’ve attached a couple of Sony’s official media shots. The word spacing is sad, rivers galore, and why’d they try setting it all justified? And are we expected to read all our books in Times New Roman? (Particularly offensive are the undoubtedly faux italics.)</p>
    <p>How does one contact Sony to help them address their, uh, issues?</p>
    <p></p><div class="imageWrap"><img src="/files/SonyReader.jpg"></div><p></p>
  html_clean: |-
