      <p>Not to engage on overgeneralization, but the Japanese tend to have spectactularly good Kanji typography, and equally bad Roman. Kanji doesn’t have serious problems with hyphenation, justification, word spacing, and doesn’t have a true italic. Therefore, it seems, those problems weren’t solved in this product.</p>
      <p>If it’s easily hackable (I’ve heard rumors it runs some kind of Linux inside), I think I’ll get one. The physical device itself sounds pretty yummy, and I’m obviously interested in grayscale displays because FontFocus works in gray where ClearType does not.</p>
