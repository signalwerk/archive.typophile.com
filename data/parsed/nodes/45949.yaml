      <p>Pop music is mostly made for the wrong reasons, distributed by the wrong people, and is based on the wrong premise, that musicians should be elevated in status. In traditional communities musicians were no more important than bakers. Musical famillies served their function, as did the blacksmith.</p>
      <p>That being said, tremendous amounts of talent have been drawn to pop music and some wonderful music has been made, yet it <cite>mostly</cite> doesn't interest me and hasn't for many years.</p>
