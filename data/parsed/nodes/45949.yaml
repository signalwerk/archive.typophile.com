      <p>Here's a pretty representative 10 of my favorites, most of them older.</p>
      <p>Dave Douglas: "Tiny Bell Trio"<br>
      Charles Mingus: "Tijuana Moods"<br>
      Duke Ellington: the Newport concert 1956<br>
      Thelonious Monk &amp; Pee Wee Russell: the Newport concert 1963<br>
      Freddy Merkle: "Jazz Under the Dome"<br>
      Ray Charles: all the small-band instrumental Atlantic sessions<br>
      Ornette Coleman: "Tomorrow is the Question"<br>
      Gary Burton: "Genuine Tong Funeral"<br>
      Japanese accordion player Mie Miki's "French Baroque Music" CD, with works by Jean-Philippe Rameau, Franqois Couperin, Louis-Claude Daquin</p>
      <p>Except for some wordless singing on "Tijuana Moods," there's no vocal in this list, in sharp contrast to most folks' selections here.</p>
      <p>I found that once I began pushing words around every day (printer, designer, editor, proofreader, etc), I could no longer listen to vocal music. I have a handful of jazz recordings with singers (Annie Ross, Jimmy Rushing), but I still do not like music with words, unless the words are in a language I do not understand. Even in the most casual settings. </p>
      <p>I know that cuts me off from lotsa good music, but I just have too many words in my head between what I do at work and what I read and the talk I hear from people. I need/prefer the abstraction of music without words.</p>
      <p>powers</p>
