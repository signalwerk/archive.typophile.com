      <p><cite> I’m finding that as soon as I start thinking beyond pop music, which I listen to less and less often, this question becomes impossible. I wonder why that is? </cite></p>
      <p>I can think of a bunch. I think the idea of the "album" is a carry over from a 70's rock outlook on the world. That time has passed even if it did leave a mark. </p>
      <p>To ask my neighbor's kid this "10 Album" question would be to make ( probably ) a very wrong assumption about how she listens to music, what it means to her, and even about how she buys ( or doesn't buy ) music. </p>
      <p>A person who grew up with 78's or 45s might also have no real relationship to the question. </p>
      <p>My grandfather listened only to classical &amp; opera on his reel to reel player.</p>
      <p>Similarly if what you like is not rock or jazz but ethnic recordings, or classical or medieval or anything outside of this recent but dying phenomena the question probably also comes across as loaded, false, or both.</p>
