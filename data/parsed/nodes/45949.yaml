      <p>What a fun thread. Just a note on Paul’s mention of Anthology of American Folk Music (edited by Harry Smith). This is expensive but well worth it. Much of this music is of improvised form and truly amazing.</p>
      <p>Joni Mitchell, Blue. (Sigh) I remember wagging that home from Sound Warehouse and getting made fun of. Funny, it ended up at my girlfriend’s place. Twenty-two years later we still love it. Nina Simone’s Little Girl Blue has an interesting convergence with River in that they both weave Good King Wenceslas into the songs. Sad X-mas anyone?</p>
