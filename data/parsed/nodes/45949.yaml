      <p>Note on The Gun Club - The Fire of Love: I mixed the first live shows of this band in LA and was friends with them. When Slash Records gave them an accounting after several years they told them they had sold 1500 copies of this record. Between that and other bands that were screwed over by Slash a class action lawsuit was filed that included The Gun Club, The Dream Syndicate and Fear amongst others. I don't know the results of the suit.</p>
      <p>Like Van Morrisson said, "Music is spiritual, the music business is not."</p>
      <p>pbc</p>
      <p>All ideas, theories and statements are subject to change without notice.</p>
