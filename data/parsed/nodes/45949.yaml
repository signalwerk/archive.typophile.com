    <p>Similar to Joe's wildly popular "<a href="/wiki/%20http%3A/%252Ftypophile.com/node/123%20" class="freelinking" rel="nofollow"> what are you listening to</a> " thread, I ask: </p>
    <p><strong>What are your top 10 albums* of all time?</strong></p>
    <p>Here are mine.</p>
    <p>1. Brian Eno - Taking Tiger Mountain by Strategy<br>
    2. Bauhaus - Gotham<br>
    3. Daft Punk - Alive 2007<br>
    4. T Rex - Electric Warrior<br>
    5. Royksopp - Melody AM<br>
    6. Wire - Pink Flag<br>
    7. The Orb - Orbus Terrarum<br>
    8. Can - Soon over Babaluma<br>
    9. Japan - Assemblage<br>
    10. Sex Pistols - Never Mind the Bollocks, Here's the Sex Pistols</p>
    <p>* Feel free to substitute Downloaded music, 8 tracks, singles, CDs or wax cylinders as you think appropriate.  </p>
    <p>Also, I would have phrased this differently except that the whole idea is so tied to the notion of the "album" in the first place that it would have seemed silly to me to phrase it any other way.</p>
