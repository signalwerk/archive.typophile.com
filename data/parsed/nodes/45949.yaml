      <p>Excellent Ch - Terry Riley and Huun Huur Tuu. I saw the show from the Angelite and Huun Huur Tu album at UCLA. Really weird. The audience was full of loud college students making the ape sound. Very strange but great.</p>
      <p>I was going to post a Huun Huur Tu LP but I couldn't make up my mind which one.  I guess if I had to pick my favorite LP by them it would be "The Orphan's Lament".  If you are interested in Tuvan throat singing then may I suggest "Tuva Voices from the Center of Asia" on Smithsonian Folkways. These are field recordings of the folk music that their music derives from. Really great.</p>
      <p>If you are interested in harmonic singing in general then Corsican folk singing is very interesting. They have a tradition where the bass voice sings multiple notes.</p>
      <p>Overall I would say that my favorite music is by the Roma people around the world. The dispossessed always seem to have the best music, perhaps because that's all they have left.</p>
      <p>If you are interested in that then Romica Puceanu (kind of like the Amalia Rodrigues or Edith Piaf of Romania) is a great place to start.</p>
      <p>The film Latcho Drom (which I know is avaiable on video) is the story of the Roma told through music. It starts in India and then progresses through time ending up in the jazz clubs of Europe and America. Really beautiful and a great soundtrack. The film Vengo shows the lives of Roma in Southern Spain who are involved in flamenco. Great soundtrack.</p>
      <p>pbc</p>
      <p>All ideas, theories and statements are subject to change without notice.</p>
