      <p><cite>Interesting - perhaps you can “share” the recordings?</cite></p>
      <p>POLITICALLY CORRECT: the worship of form over content…</p>
      <p>You bring up an interesting point. There is a collector side to it all that makes a fetish of the gear etc, which is silly. Being in the middle of life, and somewhat over it all, I tend not to question things that bring enthusiasm to life however.</p>
      <p>Now there is also a legitimate lament over the loss of information and emotional engagement that goes hand-in-hand with increasingly lower quality playback, mastering, compression and all that. For example, I’ve been listening to the 4 Men with Beards remaster of Chairs Missing. Playback equipment aside, the level of clarity and separation in the recording on vinyl is much much better than any CD recording of the music I have ever heard. That applies to many CD recordings of music I dearly love. So my point is that it IS worship of content, and the form is secondary. I would be less interested in buying Scott Walker 3 on vinyl because the digital version is really good.</p>
      <p>To share? Well, we don’t share our fonts, and I tend to view the music the same way. Still, I’m usually working on some level to get a good process for transferring higher quality vinyl recordings to a digital format, and view a good mix CD as a love letter that demonstrates a level of care and desire for communication that I believe is worth the effort. What I really love is the traditional playing of sides, where people sit around and have a meal together and progressively choose a side of an LP to listen to. That is a good sort of sharing, secondary to actually playing music together.</p>
      <p>One last point. I find that the ability to sit down and become engaged with music is very important. In particular, if I am so stressed and put upon that I can’t make that connection there are probably other nuances of life I’m missing out on as well. Being a bit anti-consumer, I set out in 1997 to put together a mid-fi playback system that would be durable beyond the life expectancy of the average rack unit, not cost more than the average rack unit, and have the ability to engage me emotionally with the music in a way that would improve the day-to-day life of the house for everyone. Eleven years and 5 sets of tubes later, I have zero regrets.</p>
      <p>Note: The above mentioned records are part of a payment/gift given to me by some musician friends in return for designing packaging. There are 30 or so recordings in all—mostly Cluster and Roedelius. I like some of them but would gladly get rid of them before I move. Being rare and worthy of preservation, finding the right home for them is a mission.</p>
