  html: |-
    <p>Hi there,</p>
    <p>Does any one have clue on what the headline typefaces are on the 3 samples?</p>
    <p>Im working on a Western theme with a modern twist– looking for some really solid headline<br>
    typefaces with a modern twist (not overly western serif cliche). Thinking modern Wood Letterpress faces,<br>
    like the third sample, with that slightly bleed edge feel. Im wondering if ’Baltic’ has had post treatment.</p>
    <p>Any solid contenders out there for Wood Letterpress?</p>
    <p>Thanks for your help!</p>
    <p>Any suggestions most appreciated, cheers</p>
    <p>Jason</p>
    <p></p><div class="imageWrap"><img src="/files/X_fonts_5724.jpg"></div><p></p>
