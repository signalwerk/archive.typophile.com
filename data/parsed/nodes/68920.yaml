      <p>That Didone is probably pre-digital, but you can find some alts <a href="http://www.fontshop.com/fontlist/genres/didone_extra_bold/?&amp;sample_text=SB%26A&amp;sample_size=48&amp;update=0" rel="nofollow">here</a>.</p>
      <p>In Harm's Way: <a href="http://www.fontshop.com/fonts/singles/linotype/eurostile_std_bold/?&amp;sample_text=IN%20HARM%E2%80%99S%20WAY&amp;sample_size=48&amp;update=0" rel="nofollow">Eurostile</a><br>
      The Victors: probably film-based font, best approximation I know is <a>Titling Gothic</a></p>
      <p>The rest are lettered by hand.</p>
