    <p>Just to throw this question out there. At several levels:</p>
    <p>1. Logos/Wordmarks<br>
    Maybe I'm wrong but I'd say quite a few people would start off a logo/wordmark with an exisiting typeface and modify it. Any IP/copyright issues with this?</p>
    <p>2. Typeface creation<br>
    Whats the position on creating a new typeface off an existing typeface. I'm sure designers/typographers have been known to start off using a basic set to get things moving quickly. I assume there are infringements in this realm. or am I wrong.</p>
    <p>Are there typefaces that allow you to modify them without any issues?</p>
    <p>Obviously the ideal if you were a 'pure' type designer is to design from scratch. However at the end, how does anybody know whether a typeface is a modification of an existing one (unless its blatantly obvious and hasn't been modified much) or one from scratch - unless you keep and show original hand sketches..</p>
    <p>Would like to hear your opinions</p>
