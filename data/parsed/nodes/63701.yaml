    html: |-
      <p>It’s all in the EULA. Sorry if this an unsatisfying answer, but the restrictions for the use/adaptation of a typeface differ from foundry to foundry and from country to country. </p>
      <p>Generally the use of a typeface in a logotype is unrestricted (but a notable exeption is House Industries, who want an extra licensing fee for the commercial use of their fonts — other foundries may have their own restrictions).</p>
      <p>Creating a new typeface of an existing one? In the US it is kinda allowed if you do NOT use the code, but instead start with a print and work from there. In Europe it depends upon the degree of similarity. The end product must be a new creation.</p>
      <p>All this is in general terms. Be sure to read the EULA’s...</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
