  html: <p>I'm creating a graphic that will reside on my client's blog. The graphic has 4 components - each needs to graphically represent one of the  last 4 decades in 50 x 72 pixel space. I'm having a tough time with the 90's. I'm looking for suggestions on how to visually represent the 90's. Grunge perhaps If so, grunge what?</p>
