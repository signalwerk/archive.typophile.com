    html: "<p>I love the idea of making portions of the elephant out of the acronym. I respectfully disagree with Mr. Weaver, however, and I think that the \"a\" and \"e\" are necessary, and with a more effective integration would make this mark wonderfully unique. I do believe in KISS, but I think it can be applied here to the silhouette instead of removing a great layer of meaning.  <br> <br>I see the \"e\" in 1,2,3,5,6 as an ear, and see that with a different perspective, like a 3/4 view, that there may be potential to work the \"a\" in a similar way, on the other side of the elephant's head.  <br> <br>For that matter the logo could be a lot more about the head and less about the whole body, I would consider further exploration within this main concept area. <br> <br>I do like #4 for it's blend of contemporary and muted colors.  <br> <br>Aaron</p>"
    html_clean: "<p>I love the idea of making portions of the elephant out of the acronym. I respectfully disagree with Mr. Weaver, however, and I think that the \"a\" and \"e\" are necessary, and with a more effective integration would make this mark wonderfully unique. I do believe in KISS, but I think it can be applied here to the silhouette instead of removing a great layer of meaning.  <br> <br>I see the \"e\" in 1,2,3,5,6 as an ear, and see that with a different perspective, like a 3/4 view, that there may be potential to work the \"a\" in a similar way, on the other side of the elephant's head.  <br> <br>For that matter the logo could be a lot more about the head and less about the whole body, I would consider further exploration within this main concept area. <br> <br>I do like #4 for it's blend of contemporary and muted colors.  <br> <br>Aaron</p>"
