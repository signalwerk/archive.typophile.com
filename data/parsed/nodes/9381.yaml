    html: <p>Generally speaking, the Latin orthographies of southern and eastern African languages tend to be simpler than central and western orthographies, and use very few diacritics or special letters. See <a href="http://www.culturalorientation.net/somali/slang02.html" target="_blank">http://www.culturalorientation.net/somali/slang02.html</a> for an overview of the official, 1972 orthography.</p>
