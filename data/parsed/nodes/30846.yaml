      <p>(Gawd, I love questions like this!)</p>
      <p>Interestingly enough, <em>APA </em>(The American Psychological Association) <em>Manual </em>calls it a "slash, also called a virgule, solidus, or shill" but has some considerable differences in use from <em>Chicago</em>.</p>
      <p><em>APA</em> warns against use in <em>and/or</em> constructions (they want a phrase instead), simple comparisons (they want a hyphen), or "more than once to express compound units" (where they want centered dots and parens).</p>
      <p><em>The New York Public Library of Style</em> has even more names for "slash" -- virgule, cancel, shilling, diagonal, slant bar, stroke, solidus, and (my personal favourite) separatrix.</p>
      <p><em>Words Into Type</em> says that separatrix is used in bibliographical matter to indicate where one line ends and another begins (this is also a function in setting poetry continuously).</p>
      <p>And last, but not least, the second edition of <em>Editing Canadian English</em> lists it in the index as "solidus."</p>
      <p>Whew!  ;-)</p>
    html_clean: |-
