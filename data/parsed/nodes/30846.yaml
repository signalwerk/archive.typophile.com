    <p>After following the En-Em Dash debates (<a href="http://typophile.com/node/30372" title="http://typophile.com/node/30372">http://typophile.com/node/30372</a>) I have a question of my own. </p>
    <p><strong>When using the backslash in a sentence, what is the acceptable (English) usage?</strong></p>
    <p>This is a problem that has plagued me for sometime now, but never enough to illicit proper research. Hopefully you fine folks can help.</p>
    <p>1. No spacing:<br>
    The work around utilized by eRMS operators was to <strong>Reverse/Cancel</strong> Shipping Document…</p>
    <p>2. Spacing on both sides of the backslash:<br>
    The work around utilized by eRMS operators was to <strong>Reverse / Cancel</strong> Shipping Document…</p>
    <p>3. Spacing after the backslash:<br>
    The work around utilized by eRMS operators was to <strong>Reverse/ Cancel</strong> Shipping Document…</p>
    <p><em>I apologize for my boring example, it's from a document I'm currently working on.</em></p>
