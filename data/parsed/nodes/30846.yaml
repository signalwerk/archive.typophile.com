      <p>Andrew, I don't know if you have any editorial say in this, but Bryan Garner--a very condensed version of whose <em>Modern American Usage</em> appears in <em>CMS</em> 15/e--would say that if you really mean "or," write "or," or pick one or the other: "reverse" or "cancel." Hence, your virgule/separatrix/etc. problem goes away.</p>
      <p>Garner would probably also say that the verb for "to draw out" or "provoke" is <em>elicit</em>, but I recognize the gratuity of my pointing that out.</p>
      <p>Also--to make my post even more gratuitous--when people mean "use," why can't they <em>write</em> "use," and not "utilize," a three-syllable word than means nothing more or less than "use"?</p>
