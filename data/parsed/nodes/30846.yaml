      There do seem to be a lot of grammar-centric questions on Typophile.</cite></p>
      <p>Speaking as an editor, each of those sentences could be correct for a particular meaning: if the "lot" were an actual thing, like in the sense of "the items on sale in the auction were grouped into twenty lots", the singular verb would be correct, but if "a lot of" were used as a synonym for "many" without any implication of the existence of actual lots, then the plural verb would be preferable. I think the latter is what is meant here.</p>
