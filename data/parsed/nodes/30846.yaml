      <p><em>Chicago</em> refers to it as the solidus (also known as the slash, slant, or virgule) and suggests the same spacing rules apply to it as to the em- and en-dash, i.e., no spacing.</p>
      <p>I've been known to bend that one on rare occasions, depending on the font -- setting something in italic with a slash might want one (thin, actually, in retrospect) space after, but it's not usual.  Spacing on both sides cancels out the whole purpose of putting the slash there in the first place, because it indicates an alternative choice.  My copy of <em>Chicago</em> has several such examples, all set tight.</p>
      <p>At least here in North America: elsewhere, mileage/kilometrage varies....  ;-)</p>
      <p><em>seconds later: Ah, great minds think alike!</em></p>
