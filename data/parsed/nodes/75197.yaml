      <p>From the picture in the article Raphael Frank a"h appears to be a non-observant Jew. In the time period, non-observant Jew were anti-Torah. Today, all Jews seek to be pro-Torah, but have different backgrounds and educations.</p>
      <p>I had thought Frank was simply modern and less traditional. I am surprised the typeface is used extensively in traditional Jewish circles throughout the world. I would call it a treif design, perhaps even made on the Sabbath.</p>
      <p>FrankReuhl was a huge breakthrough in Hebrew printing, replacing the tremendous role that Romm Vilna enjoyed for 100 years. FR is less used today, as Itamar David's David, the fonts by Tzvi Narkiss, and Henri Friedlaeder's Hadasa, had eaten away at FR widespread use in Hebrew printing.</p>
