    html: |-
      <p>Prior to the 1800s Hebrew publishing was dominated by basically two Hebrew typefaces, which were crudely cut from poor original drawings. But no other designed existed, and no better originals could be used.</p>
      <p>The the Hebrew printing establishment belonging to the Romm family of Vilna, Lithuania was establed by the family head, Menachem Mann Romm, a very wealthy non-Chassidic Jew.</p>
      <p>He became the choice Hebrew printer in the world, due to his beautifully created Hebrew typefaces, based upon accurate ancient original drawings which he secured for a great sum of money. Every important Hebrew work was typeset and print by his large firm, including his loftiest project, the Talmud - a 15,000 page work, divided into 20 volumes.</p>
      <p>Romm bribed the Vatican to open its huge library and to allow many Hebrew manuscripts to be copied from inside the bound covers of rare Catholic books at the cost of a small fortune.</p>
      <p>The famous American type desinner Frederick Goudy reports that Romm commissioned the students of Giambattista Bodoni in Italy to create the hugely popular Romm Vilna typefaces from what appears to have been excellent ancient original drawings and manuscripts.</p>
      <p>This dominated the entire Hebrew printing industry until the advent of the FranReuhl typeface in Germany in the early 1900s.</p>
      <p>In the fifties, FrankRuhl's popularity began to be reduced by Henri Friedlaender's Hadasa, Itamar David's David, and the fonts of Tzvi Narkiss. Eliyahu Koren's Koren only was popular in his printing of the Talmud. It was even used anywhere else until Raphael Freeman used it in the Orthodox Union prayerbook. I think its a passing fad, propelled his company's hype.</p>
      <p>Scott-Martin Kesofsky's fonts will become the enduring Hebrew designs, only rivaled by my revival of Romm Vilna.</p>
    html_clean: |-
