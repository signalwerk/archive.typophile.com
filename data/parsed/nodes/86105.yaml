    <p>Hello everybody,</p>
    <p>I'm looking to identify the fonts used in the 2012 brochure of the Sydney Theatre Company<br>
    <a href="http://www.sydneytheatre.com.au/2012" title="http://www.sydneytheatre.com.au/2012">http://www.sydneytheatre.com.au/2012</a><br>
    I would love to know what is the font used for the text, and especially which one is used for titles and headings.<br>
    My connexion is very bad so I'm sorry but I cannot include an image. You can browse the brochure here :<br>
    <a href="http://issuu.com/sydneytheatrecompany/docs/stc2012" title="http://issuu.com/sydneytheatrecompany/docs/stc2012">http://issuu.com/sydneytheatrecompany/docs/stc2012</a></p>
    <p>Thanks a lot !</p>
