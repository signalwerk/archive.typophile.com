  html: <p>I stumbled over a <a href="http://link" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://link</a> to some specimens of this typeface called Apollo. I like the quirks that sets it apart from similar faces, the C in particular, with the top terminal cut horizontally and the bottom terminal cut at an angle. Has this typeface ever been digitized or revived under another name? I hadn’t heard of it before.</p>
  html_clean: <p>I stumbled over a <a href="http://link" title="Click to visit an external URL." class="freelink freelink-external freelink-external link-external">http://link</a> to some specimens of this typeface called Apollo. I like the quirks that sets it apart from similar faces, the C in particular, with the top terminal cut horizontally and the bottom terminal cut at an angle. Has this typeface ever been digitized or revived under another name? I hadn’t heard of it before.</p>
