  html: |-
    <p>I'm talking about Hunyad / Hunedoara Castle in Hundedoara, Romania. Information about the castle: <a class="freelinking external" href="http://en.wikipedia.org/wiki/Hunyad_Castle" rel="nofollow">in English</a>; <a class="freelinking external" href="http://de.wikipedia.org/wiki/Burg_Hunedoara" rel="nofollow">in German (more detailed)</a>.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/castelul_corvinilor_5499.jpg"></div><br>
    Please visit <a class="freelinking external" href="http://alexbeltechi.prosite.com/620/350958/portfolio/the-corvin-castle" rel="nofollow">this page for other photos of the place</a>.<p></p>
    <p>We're looking for appropriate typefaces to be used for display purposes in a branding project. "Appropriate" could mean inspired from that era / matches certain motifs from the buildings / etc.</p>
    <p>Here are two typefaces we're considering: <a class="freelinking external" href="http://justanotherfoundry.com/herb" rel="nofollow">JAF Herb</a> and <a class="freelinking external" href="http://marketplace.veer.com/font/Harbour-ALT0000108" rel="nofollow">Harbour</a>. Do you think these are appropriate for the period? Do you see any weaknesses in the way they are constructed? (I simply don't have the expertise to tell, so any help here would be very much appreciated.)</p>
    <p>Feel free to add your own type suggestions. Thanks in advance.</p>
    <p>PS: This isn't my project. I'm helping <a class="freelinking external" href="http://alexbeltechi.prosite.com/620/portfolio" rel="nofollow">my brother</a> with a bit of research for his final school project.</p>
