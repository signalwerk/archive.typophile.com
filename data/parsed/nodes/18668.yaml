      <p>Well see I had those same questions too but the past couple of weeks Ive been doing nothing but research and I fonud out that for people with vision impairement, SANS is a tremendously better than serifs. The idea is to make clean simple glyphs. NO fancy techinques or serifs here because when its blurred, none of it will matter.....only hurt the legibility.</p>
      <p>I see what you mean about the subtle strokes. Good point.</p>
