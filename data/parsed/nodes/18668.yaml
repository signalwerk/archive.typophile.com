    html: |-
      <p>Typography for people with vision impairement was one of the possible topics I was doing recherche for my diploma thesis, and I think if I hadn't found anything slightly more interesting, it would have made the run. I did this blurring tests as well, trying to find out whether there is potential in it.</p>
      <p>What I also found out: clearly distinguishable letterforms: none should be too similar to an other.</p>
      <p>Open counters and apertures, and large x-height will do the job well, I think they help in the same manner as they helped Adrian Frutiger when designing Frutiger for airport Charles de Gaulle.<br>
      I don't think though that short ascenders and descenders will help much, I rather have the impression that longer ones are more helpful, but this would have to be tested for single words as well as for larger amounts of texts (as this may change there).<br>
      What will also help you is to have a look on Typedesign for Screen. The solutions for low resolution displays may be useful for your task as well.</p>
      <p>On the design: should it be easy to the eye for non-impaired people as well? This would be a much harder job, except you make compromises.</p>
      <p>Lettershapes (if you need this already. based on the assumption that this should be for seeing people as well, I can't test the other one):<br>
      R: top is very geometric, descenter just a bit too weak<br>
      y: right upper side too bold. Do you want to have such tiny details like the hooked tail in it?<br>
      a: appears to be meager compared to the rest<br>
      general: The overshoot of round shapes is exaggerated --&gt; n and a look larger than y and u. u seems to hang below baseline.</p>
      <p>sebilar</p>
