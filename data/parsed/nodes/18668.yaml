    <p>Ok designing a typeface is a small part of my thesis "Designing for Vision Problems". I just started, so I need initial crits (i figure I'll need like 20 before its done). I will post the complete set soon.</p>
    <p>OBJECTIVES:<br>
    Open Counters and Apertures<br>
    Large X-height<br>
    Short ascenders + descenders</p>
    <p>The name is based on Marla Runyan: an olympic, blind runner whos nothing short of amazing.</p>
    <p>Thanks guys.</p>
