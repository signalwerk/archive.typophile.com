      <p>There's an assumption that I find says something about us when we find it so hard to accept the idea that lettering can be done without using a computer. Unless you can find other examples of using this 'font' for more than this logo, I think you have to consider that maybe this lettering was done freehand.</p>
      <p>- Mike Yanega</p>
