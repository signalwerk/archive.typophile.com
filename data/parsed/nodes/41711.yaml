      <p>You're absolutely right, Mike. I would have been equally pleased to find out that it was freehand, and if that were the case I was hoping that somebody in the community would know who was responsible.</p>
      <p>At any rate, it might inspire to take up arms and draw the rest of the alphabet as a learning experiment.</p>
