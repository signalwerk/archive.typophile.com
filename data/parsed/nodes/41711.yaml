    <p>I'm surprised this hasn't come up. The font that the Firefly logo is based on has been an ongoing mystery. Rick Yaeger has identified most of the Firefly-related fonts here: <a class="freelinking external" href="http://blogs.macmerc.com/rick/?p=232" rel="nofollow">http://blogs.macmerc.com/rick/?p=232</a>.</p>
    <p>I feel like I've seen those f's in some kind of OpenType ligature example.</p>
