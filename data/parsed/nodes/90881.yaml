    <p>Trying to identify the font used for the title, artist and catalogue information on this label. The font was pretty much used exclusively on EMI-related labels in Australia between 1930 and 1970.</p>
    <p><a href="http://www.beatlesaustralia.com/AU7027S3a.jpg" title="http://www.beatlesaustralia.com/AU7027S3a.jpg">http://www.beatlesaustralia.com/AU7027S3a.jpg</a></p>
