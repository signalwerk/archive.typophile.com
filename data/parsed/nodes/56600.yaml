    html: |-
      <p>hi KC,</p>
      <p>Some of your design should go in the bleed space - that's what bleed<br>
      space is for. </p>
      <p>PMS colors are spot colors - e.g. if you want some words in a certain<br>
      orange, you can specify a particular Pantone orange for those. </p>
      <p>With regard to how you should save the file (as well as color questions),<br>
      you should communicate with the printer who will print the panel.</p>
      <p>hope that helps a bit.</p>
