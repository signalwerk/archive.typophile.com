    <p>Hi I've been asked to create a large panel in Illustrator, 118" wide x 88" tall. I need to leave about an 8 - 10 inch bleed on the ends (sides).  </p>
    <p>(I've never done any sort of print design, so please forgive me for the questions)</p>
    <p>How do I set this up in Illustrator so that I don't design in the bleed space? Is this something I just measure out myself?  When I am finished with the design do I save it as a .eps file?  </p>
    <p>Lastly, how do I find out what the PMS colors are in my design? </p>
    <p>Thanks for the help, I appreciate it!!</p>
