    html: |-
      <p>Here is a paragraph from the link <a href="http://www.microsoft.com/typography/developers/opentype/detail.htm" title="http://www.microsoft.com/typography/developers/opentype/detail.htm">http://www.microsoft.com/typography/developers/opentype/detail.htm</a></p>
      <dl>
      <dd>At the beginning of this section, I referred to the DSIG table as a 'required' table. In fact, a digital signature is not required in the same sense that the CMAP and many other tables are required simply for the font to work. A font without a DSIG table will work, but it will not be recognized as an OpenType font by the Windows operating system. Because the OpenType format is an extension of the TrueType format, and most of the new tables are optional, Windows makes a distinction between the two formats based solely on the presence or absence of a DSIG table. A font with a DSIG table will be recorded in the Windows font folder as an OpenType font and presented with the OpenType icon.</dd>
      </dl>
      <p>Ok, it is old, 2001, but still there.</p>
