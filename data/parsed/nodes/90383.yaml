      <p>"I'm still a bit curious, though, about the underlying rationale for this requirement for TT-flavoured fonts."</p>
      <p>Well, when it was introduced at a MS / Adobe event in the mid-90s, it was postured as protection for font vendors. Through discussion, however, it was determined to actually be protection for users from dangerous fonts. At the time, MS expressed the desire for all documents, and all other content running on or through windows to have a digital signature, and fonts seemed like the perfect place to start.</p>
