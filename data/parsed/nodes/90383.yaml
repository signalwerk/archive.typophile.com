      <p>What spec? MSWindows has specs? *blink* *blink* Wot yeh ge' ter hear ere yer ears fall off.</p>
      <p>I saw this mentioned on the web. I <em>tested</em> it. On TT-flavoured fonts, the OT icon appeared only on fonts with a DSIG. To me, this indicated that what I stated above. If they didn't have a DSIG, WinXP showed them to be plain old TrueType.</p>
      <p>As it happens, the difference between a TrueType font and a TT-flavoured OpenType font is pretty damn small. The OT font has some OT tables and a different version setting, and that's about it. So why would WinXP latch onto the DSIG as an indicator? Beats all hell outta me.</p>
