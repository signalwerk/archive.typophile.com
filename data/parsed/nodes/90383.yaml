    <p>Hi all,</p>
    <p>I don't have access to a windows machine, and need some clarifications on the need for digital signatures for fonts to work correctly in some versions of windows.</p>
    <p>My understanding is that it is necessary for a DSIG table to be present for windows to recognise OpenType fonts. However, some sites have suggested that this is only necessary for .ttf files. If I am generating CFF-flavoured fonts with an .otf extension, can I safely dispense with this table and still have the font work in a windows environment?</p>
    <p>If the answer to the above question is 'no', will inserting a zero-length DSIG table using TTX suffice, or do I need to include some dummy data in the table?</p>
    <p>Also, does anyone know why microsoft imposes this weird restriction on opentype fonts?</p>
    <p>TIA,<br>
    André</p>
