      <p>So Windows (by Microsoft) does not check the sfnt header as described in the <a href="http://www.microsoft.com/typography/otspec/otff.htm" rel="nofollow">OTF specs</a> ... by Microsoft?</p>
      <p>(citing:)</p>
      <p>OpenType fonts that contain TrueType outlines should use the value of 1.0 for the sfnt version. OpenType fonts containing CFF data should use the tag 'OTTO' as the sfnt version number. ("This page was last updated 5 May 2008.")</p>
      <p>The 'required tables' listing does not contain DSIG for Truetype,  and its full description doesn't mention anything special either.</p>
