    html: |-
      <p>First off, a kind thanks to Marten for inquiring into the origins of the font whose very existence was unknown to me until last night. </p>
      <p>For the record, I was never contacted by Essen or Monotype England regarding Klavika in any capacity - for licensing, changes, alterations etc. Like most type designers I've made several changes to my typefaces for clients. It's something I actually enjoy quite a bit especially if it's for specific conditions so the font will perform better. So no, I never refused to change Klavika. As I said, I was never contacted in the first place. (to be fair, Stefan mentions this was a 'nasty rumor')</p>
      <p>I was however contacted by a distributor in Sweden in the summer of '06 inquiring into the possibility of a unlimited global license of Klavika for a financial client. To make a long story short, they didn't like our price and we never heard from them again. Swedbank to date has license for 8 CPUs of Klavika.</p>
      <p>So here we are.</p>
      <p>I can only speculate beyond this, so if I learn more, I'll chime in.</p>
      <p>thanks again</p>
    html_clean: |-
