    <p>Hello!</p>
    <p>I'm having a hard time deciding over the display typeface for a magazine... (a student magazine, mostly related to (classical) music).<br>
    Two images for two solutions... The first one uses Myriad Pro (+ Minion Pro for the body), and the second one uses Fertigo.<br>
    Which combination do you prefer?</p>
    <p>Thanks!</p>
