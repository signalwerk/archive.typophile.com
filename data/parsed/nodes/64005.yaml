    html: "<p>I agree with Christopher that Myriad looks a bit generic, it's nice, but generic. I think Minion is a fine choice for your body copy, and would stick to picking a display face that pairs well with it. I think Frutiger is so close to Myriad, that it may not get you away from that generic look. I wouldn't go with Fertigo, so if I had to pick one of these options, go with #1. Maybe use Myriad in all caps, or something to spice it up a bit?</p>"
