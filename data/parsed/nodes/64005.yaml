    html: |-
      <p>I think Scala Sans is great for this. It's fairly neutral, but still has some character and is not overused.</p>
      <p>Considering it will be mostly classical music, you could also try <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/poetica/" rel="nofollow">Poetica</a>, which works well with Minion, for pull quotes, and perhaps some display (like the name in your example, Mendam Paripse). The additional flavor might be good. Poetica has lots of alternate letters, and a nice set of small caps, with swash variants, if that's needed, though I usually like it without that.</p>
      <p>It all comes in one Opentype file, and at about 30 dollars it's a great price.</p>
      <p>Briän</p>
