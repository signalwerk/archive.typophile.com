    html: |-
      <p>1. On #1, I wouldn't go with Myriad simply due to the fact that it's a default fonr for Illustrator thus it has somewhat of a generic look.</p>
      <p>2. On #2, it is traditionally considered poor typographic practice to use two serif's (or two sans) on the same page. If you want to go with a serif headline, simply use Minion. It's a great family.</p>
      <p>3. If you like Myriad as a sans, <a class="freelinking external" href="http://www.linotype.com/610683/neuefrutiger-family.html" rel="nofollow">Frutiger</a> may be an alternate choice. Selecting "humanistic" looking sans' is somewhat tricky. Traditionally, <a class="freelinking external" href="http://www.linotype.com/1226/meridien-family.html" rel="nofollow">Meridiene</a> is considered a good pair for Frutiger. And while writing this, I just discovered that <a class="freelinking external" href="http://www.linotype.com/" rel="nofollow">Linotype</a> has a font called <a class="freelinking external" href="http://www.linotype.com/288768/frutigerserif-family.html" rel="nofollow">Frutiger Serif</a>. I have not inspected it, but seeing as they're both designed by <a class="freelinking external" href="http://en.wikipedia.org/wiki/Adrian_Frutiger" rel="nofollow">Adrian Frutiger</a> (designer of <a class="freelinking external" href="http://www.linotype.com/53226/linotypeunivers-family.html" rel="nofollow">Univers</a>) and have the same given name, I am confidant they are good (and compatible) typefaces.</p>
      <p>3. <a class="freelinking external" href="http://www.linotype.com/searchresult?q=gill%20sans" rel="nofollow">Gill</a> may also be another choice for a humanistic sans (I am not familiar with all thease versions). Traditionally <a class="freelinking external" href="http://www.linotype.com/1334/perpetua-family.html" rel="nofollow">Perpetua</a> is considered to be a good pair.</p>
      <p>4. Understanding that the text is still <a class="freelinking external" href="http://www.lipsum.com/" rel="nofollow">Lipsum</a> at this stage, you still want to be mindful of your hyphenation. Traditionally it is considered poor practice to have two hyphens in a row. You might also want to consider I prefer to hyphenate manually. Additionally, if possible, avoid hyphenating proper nouns. This can make for a pretty funky rag at shorter line lengths. Here's an example I use to illustrate hyphenation gone wrong:</p>
      <p><em>I grew up on 2536 Su-<br>
      sex drive</em>.</p>
      <p>5. With capital letters, it is considered good practice to letterspace (track) them to assist in character recognition.</p>
      <p>Overall, the work looks great. A strong hierarchy, subtle and sophisticated and I applaud the setting of flush left as opposed to justified. I'd say you're 99% of the way there.</p>
