    html: <p>I really like the logo, but the Bodoni isn't working for me. It just commands so much attention with all of its contrast and fanciness. I think Bodoni or Didot could work, but I'm not a fan of how you have set the type in relation to the mark. Right now, the type is competing with the logo. Perhaps the logotype is a sans face instead? Something to allow your logo more visual presence.</p>
