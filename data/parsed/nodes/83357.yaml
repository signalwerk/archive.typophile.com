    <p>Hello,<br>
    I'm trying to identify the attached typeface. It was used on the cover of '20/20', published by the Architectural Association, London. I've been scouring monospace fonts online but can't match it –&nbsp;I've a suspicion it might be from a non-Latin font, but who knows?</p>
    <p>Thanks,<br>
    Harry</p>
