      <p>Slow down, Tomi!</p>
      <p>- Tittle on i is too small and close<br>
      - t is very narrow<br>
      - Bicameral g is from a totally different font (reverse italic)<br>
      - 8 does not relate to construction of other characters<br>
      - % does not require ligature (Is that what this is called in this instance?) IMHO<br>
      - Inside of n too symmetrical<br>
      - w is black<br>
      - Helvetica comparison is undue (stronger influence of contemporary fonts)</p>
      <p>I think with a font like this you must spend many months as the originality of<br>
      the design is not the main concern and cannot deflect attention from the quality.<br>
      I have noticed you draw very quickly but… Hare and the tortoise with some things.</p>
      <p>Best wishes</p>
