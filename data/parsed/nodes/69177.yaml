      <p>Thanks, guys-</p>
      <p>Alternate g is way too narrow. Single-storey is too wide, and that terminal is too high as well. Lc s is wobbly in way too many directions. Needs a lot of work. If I remember correctly, Helvetica has pretty pointy quotation marks as well. I went with round punctuation.</p>
      <p>More to follow.</p>
