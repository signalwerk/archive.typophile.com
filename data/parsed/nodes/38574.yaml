    html: <p>This was hand inscripted so no typeface will match. You might like <a href="http://www.fontshop.com/fonts/singles/linotype/serlio_lt_std_ot/">Serlio</a>, <a href="http://www.fontshop.com/fonts/singles/creative_alliance/sackers_light_classic_roman/">Classic Roman</a>, <a href="http://www.fontshop.com/fonts/singles/mark_simonson/goldenbook_regular/">Goldenbook</a>, <a href="http://www.fontshop.com/fonts/singles/font_bureau/grand_central_light/">Grand Central</a>, or LetterPerfect’s <a href="http://www.fontshop.com/fonts/downloads/letterperfect/the_baroque_set/">Baroque Set</a>.</p>
