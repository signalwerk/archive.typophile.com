    <p><em>Reflection</em> is a creation influenced by a fashion photography story by Steven Meisel.<br>
    Here are some letters and thoughts about it.<br>
    I’am sorry that text is only in German language from my manuscript <em>“Frammenti della Bellezzza”</em>.</p>
    <p><a href="http://typophile.com/files/Reflection_Rs.gif" target="_blank" rel="nofollow">„<em>Reflection Small Caps</em>_Rs“</a></p>
    <p>[…] Es ist wohl unwahrscheinlich, anzunehmen, dass auch in der Kunst der Buchstaben, irgendeine Art von Behandlung einer Linie, des Raumes oder der Tiefe, bis hin zur nur scheinbar reduzierten Farbgebung auf das Schwarze und das Weisse, entstehen könne, die nicht bereits ihrer Charakteristik nach in den bildnerischen Werken der Renaissance, in der dort unterschiedlichen Behandlung dieser Elemente durch die verschiedenen Meister, auf eine besondere und sogar explizite Weise behandelt wurde.</p>
    <p>[Nello stesso modo come il contorno di una bocca giovanile* dal disegno acuto e quasi cisellato non potrebbe non apparire ispirato a quelle linee d’un maestro dell’oreficeria come lo era un Sandro Botticelli; o dall’altro canto la superficie che si amalga tra le tinte e le sue sfumature evolvendosi dallo scuro verso il chiaro d’una carnagione non derivasse d’un’invenzione del Tiziano, ecc. Questi che si potrebbe chiamare altresì «casi tipici» non sono che lati di un disegno più grande, elementi di un corpo solo al che l’uomo stesso sembri di potersi solo avvicinare in strati di concentrazione diversi, sicché ci erano necessarie tante di loro personalità – ognuno col suo «stile» (in quanto esso solo un frantume d’un intero) a farci dare l’idea di un qualche cosa più grande per cui poter vivere, in cui poter sperare.]</p>
    <p>*<em>[…] wobei die Augen auf ein in ihm liegendes, fast eigenartiges Zucken gelenkt wurden, dessen Ziel es schien diese Linien immer wieder neu zu formen, ihr scharfes (und doch zartes) Licht- und Schattenspiel in einen neuen Zusammenhang zu versetzen. Dort wo sich durch seine leichte Öffnung ab und zu das Relief ihrer Zähne zeigte, riefen sie ein Gefühl des unstetigen hervor, einer zugleich schüchternen Jugendlichkeit, um sich gleich wieder von neuem dem interessanten Bogenspiel hinzugeben.</em><br>
    [evtl. ‘sich selbst vergessenden Bogenspiel’]</p>
    <p>*</p>
    <p>[zu Botticelli: il «ritmo del particolare»]<br>
    <em>Tatsächlich, weniger was die Beschaffenheit einer Linie angeht, kann uns Botticelli Lehrmeister sein, als für deren Rhythmik untereinander.</em></p>
    <p>[…]<br>
    Inspiriert haben mich bei der weiteren Bearbeitung des ‘y’ (dessen wirkliche Beschaffenheit ich nicht wirklich auf den Grund zu kommen schien) die drei Grazien aus Botticellis „Primavera“, insbesondere was die dynamischen Diagonalen betraf, mit deren Hilfe der Renaissance-Meister in ihrem „Tanz“ die Bewegung von der einen zur anderen weitergeben lässt. [‘il movimento che si trasmette tra loro’] Man beachte zum Beispiel die fein gewinkelte Stellung der Füße der Grazie links, sowie ihre schräg in die Bildfläche eingeschmiegte Kopfhaltung (analog die Fluchtlinie der Augen zum Winkel des Fußes, die sich wiederum mit der horizontalen Blicklinie der mittleren Grazie zu verschränken scheint, – ganz wie es die beiden Hände vormachen), die dem Gemälde, ohne dem Mittel der räumlichen Modulation sozusagen, Bildtiefe verleihen. <a href="http://typophile.com/files/Image_Ro_Rhythmik.jpg" target="_blank" rel="nofollow">[„Image_Ro_Rhythmik“]</a> Eine Tiefe die mehr durch dynamische Linienführung suggeriert wird als durch die Modellierung [vergl. Kapitel „Modellierung“] etwa der Haut, des Fleisches usw. Besondere Beachtung schenkte ich also im weiteren Verlauf der Buchstabenbearbeitung den abgewinkelten Strichenden, die ich weiter als bisher (vor allem am linken Balken) in den „Kelch“ hineinzeigen ließ. Ich kam damit bereits zu einem wesentlich besseren Ergebnis.<br>
    <a href="http://typophile.com/files/Image_ya_Diagonalen_y_besser.jpg" target="_blank" rel="nofollow">[„Image_ya_Diagonalen_y_besser“]</a></p>
