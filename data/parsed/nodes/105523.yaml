    html: |-
      <p>SG &amp; RR digitizations both acceptable in my opinion. If you prefer a more hairline effect go for the RR. If you prefer less contrast go for SG.<br>
      To compare with original check the <a href="http://archive.org/details/LudlowTypefacesEditionD1140 " rel="nofollow"> Ludlow Typefaces </a> book at archive.org. Ultra Modern regular and bold is at pages 166 to 169. Note that Ludlow also produced an italic.<br>
      Don</p>
