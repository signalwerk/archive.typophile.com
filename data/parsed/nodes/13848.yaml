  html: |-
    <p>Hello! I need help typesetting chemical elements and equations. Should I always use small caps for chemical elements like oxygen (O), nytrogen (N), helium (He) and lithium (Li)? Or use small caps only when they appear inside paragraphs?</p>
    <p>For example, the paragraph below would use small caps for letters "l", "h" and "o":</p>
    <p>Lorem ipsum dolor sit amet, Li, O und He consectetuer adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat.</p>
    <p>But, when used in equations on separate lines of text no small caps would be used:</p>
    <p>O + O = O2</p>
    <p>Any ideas?</p>
