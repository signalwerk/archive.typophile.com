    html: |-
      <p>Since you appear to be working in Portuguese, I'm not sure the Chicago Manual of Style is relevant, but...</p>
      <p>(a) small caps are usualy reserved for acronyms, which chemical notations are NOT; and</p>
      <p>(b) when used within paragraphs, chemical and mathematical notations are treated in the same way as words from a foreign language, which means they appear in normal uppercase, but italicized.</p>
      <p>Method (b) seems to me to be a better approach, if for no other reason than a small caps O (oxygen) might easily be confused for a lowercase o or, if you use oldstyle numbers, a zero, whereas an italicized uppercase O would always be recognized as such.</p>
