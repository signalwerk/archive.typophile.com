    <p>Hey all,</p>
    <p>I seem to have lost my ability to preview Type 1 hints within FontLab 5.0.2 on the Mac with the Adobe rasterizer and I'm wondering if this has happened to anyone else.</p>
    <p>In the "Type 1 Preview" hinting panel (Tools -&gt; Hints &amp; Guides -&gt; Type 1 Hinting), there's a small dropdown menu at the top right of the preview area that lets you pick the rasterizer (choices are Apple B&amp;W, Adobe B&amp;W, Adobe Grayscale, FreeType B&amp;W and FreeType Grayscale), but both Adobe items give me a preview of "Sample font is not installed" instead of the waterfall. </p>
    <p>I can't seem to find any reference to this menu in the FL5 manual PDF (the screen captures of this dialog box do not even show this dropdown menu). Also, this feature is working properly on my colleagues machines who are using essentially the same software setup as I am.</p>
    <p>Trashing the preferences and Application Support folders as well as trying when logged in as a different user do not seem to bring this functionality back.</p>
    <p>Has anyone out there had this same problem?</p>
    <p>Many thanks,<br>
    Andy</p>
