    html: |-
      <p>Faeroese (føroyskt) uses æ but not œ. It uses ø instead, like Danish and Norwegian.</p>
      <p>French uses œ, but æ is supposedly restricted to rare words of Greek or Latin origin and I don't recall seeing it used in the wild (I live in France).</p>
      <p>The language that uses both æ and œ that you're looking for is of course traditional (19th century) English, with spellings like 'amœbæ'. This kind of spelling does persist with some rare words today, especially in British English, though I get the feeling that nowadays its use is mostly about æsthetic appeal and is likely to be the result of a manœuvre to give a mediæval touch to your œuvre.</p>
