      <p><cite>The worst movie I’ve seen recently - perhaps ever - is Art School Confidential.</cite></p>
      <p>This movie was horrible, but not for trying. This is a movie that suffers from lack of organization and too much experimentation. It's like watching 7 movies at once... The Cheesy Teen story, The romance, the slasher flick, the mystery thriller, The coming of age with plot twist, a low-standards comedy and the art house indie flick. And when you try to cram that much into a movie without any sort of control or organization you're going to get a mess of a movie. </p>
      <p>Another sucky movie that I watched recently was the remake of Wickerman... don't ever see this movie, ever! It's complete drivel and Nick Cage must have had a lobotomy right before he signed to do it. </p>
      <p>One movie I've seen that I really enjoyed though was Brick. This is a great pulp-noir style movie with a modern approach. Plus, Joseph Gordon Levitt is kicking ass in movies these days.</p>
