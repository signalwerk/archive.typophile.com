    <p>Newton is a dark, somewhat dutch-inspired serif font.</p>
    <p>I had been working on this, however about a week ago my hard drive failed. Anyway, I am trying to catch back up on it now. Here is the lower- and uppercase. Numerals, punctuation, and ligatures will be here extremely soon.</p>
    <p>I started a font earlier called <a href="http://typophile.com/node/63834" rel="nofollow">Recut</a>. It wasn't that great but I learned how to use Fontforge. I took a couple months break from font-making, and now I've got a new serif that's hopefully better.</p>
    <p>Tell me your thoughts and criticisms!</p>
