      <p>This is looking really nice. Looking forward to see what you do with it.</p>
      <p>G-The bottom right seems a little flat, maybe bring it up a bit.<br>
      X and x - I think the lower left arm should hit the thick stroke a little higher than the upper right arm.<br>
      Z and z - a little top heavy?<br>
      o-seems a little wide, but in the bold it looks closer.<br>
      s-a little narrow</p>
      <p>It’s a little difficult to judge the bold without seeing it at the same size as the regular weight, and perhaps in a text setting. However, I’d suggest nailing down this weight before working on the bold, even though I know how tempting that is. You might find yourself having to redraw things over and over as you find mistakes.</p>
      <p>Great work though.</p>
