      <p>Hey everyone, thanks for all the comments! It's been <em>really</em> helpful!</p>
      <p>I've made more progress since I last updated this thread, added extra weights and italics, ironing out some issues too. If anyone has any more critiques, I'd love to hear it! You can also download Neuton and follow along with the updates <a href="http://impallari.com/projects/overview/neuton-serif-family" rel="nofollow">here</a>.</p>
      <p>I've found that designing the weights seems to be especially tricky. Should the top of the 't' have a different shape in the light and extra light than the other versions? In some ways I think I've lost the feeling of the rest of the family in the extra bold as well. I'm a little worried about my numerals too.</p>
      <p>I'm posting some pictures below now so you can take a look and see what you think: (I'll post a PDF later.)</p>
