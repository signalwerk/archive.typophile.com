    html: |-
      <p>I think the serifs on all the lowercase diagonal letters (/w/x/v/etc.) are still too prominent. Actually I think the serifs on all the lowercase letters could be brought back just a hair. </p>
      <p>/c/ may be leaning backwards a bit, but I like the way it's drawn.</p>
      <p>/s/ is too narrow.</p>
      <p>The little bit at the northeast corner of /q/ is too indecisive - either forget that little flip, or make it more prominent.</p>
      <p>/z/ looks a little topheavy to me.</p>
      <p>The way the diagonal at the top of the left side of the /f/ crossbar goes much higher than where the crossbar comes out on the other side of the stem looks a little odd to me.</p>
      <p>The vertical of /G/ seems short; that is, the crossbar seems low. </p>
      <p>/4/'s "descender" vertical is too long; that is, its horizontal should be lower.</p>
      <p>Could /V/ and /v/ be a little wider?</p>
      <p>I like the drawing of the /r/ arm.</p>
      <p>I'm not sure what the breaks in /q/ and /p/ add. I definitely don't like them on the /8/ (looks stencil-y), though on the /6/ and /9/ they're less bothersome.</p>
      <p>Keep going!</p>
