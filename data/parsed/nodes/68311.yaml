      <p></p><div class="imageWrap"><img src="http://typophile.com/files/unixsystem_4900.png"></div><p></p>
      <p>Well, thanks everyone! I reworked A ton of things. I've been spending most of the day spacing the lc. I haven't figured out kerning in fontforge yet, or ligatures...... So, I'll have to figure those out.</p>
      <p>Diagonal outer serifs shortened more:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Vivacity_4258.png"></div><p></p>
      <p>And here's a few more samples:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/safehouse_4296.png"></div><br>
