    html: |-
      <p>Much better than your previous font.  Here are my amateur critiques, to be taken with a grain of salt:</p>
      <p>The bottom serifs of A and X make them look pigeontoed, and the same effect plagues the top serifs of W, X, and Y.  X also seems kind of wide.  I'm not crazy about the middle join on the K or the "shelf" of the G (what is that thing called, anyway?).  The right side of the bottom serif of F has a bracket; I see that rounded feature elsewhere in the font but not on any other serif (P, for example).  Speaking of which, I quite like your P.</p>
      <p>It would be nice to see some sample words.  On the whole, it looks really promising.  Keep it up.</p>
    html_clean: |-
