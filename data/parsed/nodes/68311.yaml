    html: |-
      <p>I added a PDF with corrections. I printed a test sheet and studied it a bit. (Please excuse the terribly misspelled test words, I wrote them very fast)</p>
      <p>Changes made include:</p>
      <p> * O was lighter at 1:30 than 7:30. Corrected.<br>
                            * The K joins less like cyrillic and more like it should<br>
                            * N tilted in with right side. Corrected.<br>
                            * Attempted to make C better. Terminal moved down.<br>
                              Shortened slightly to avoid appearing bigger than<br>
                              other characters. Very slightly thinner<br>
                            * A now stands on better feet (echo on VWXY)<br>
                            * Upper bowl on B darkened slightly<br>
                            * Bracketing on D slightly larger<br>
                            * E serifs slightly larger<br>
                            * Briacketing removed on F<br>
                            * G stem serif modified slightly<br>
                            * H widened<br>
                            * J descender normalized<br>
                            * Right serif of L enlarged slightly<br>
                            * M legs splayed a bit more<br>
                            * Q tail shortened as not to collide with ascending<br>
                              letters<br>
                            * S upper serif angled inward; enlarged slightly. Lower<br>
                              serif made horizontal on left<br>
                            * R leg lowered<br>
                            * T serifs enlarged<br>
                            * VWXY serifs cured from disease as A.<br>
                            * X no longer top-heavy<br>
                            * Y right arm a little better (moved leftward)<br>
                            * Z bottom bar thickened; upper and lower serifs<br>
                              enlarged<br>
                            * BDPR bowls moved up at top to correct small problem<br>
                              with appearing slightly shorter<br>
                            * l (lowercase) somewhat thinner than uppercase stems.<br>
                              foot serifs a bit smaller, wedge serif on top.</p>
