      <p>You’re probably right about it being hand lettered. While i agree Bookman has some similarities, this is more of a slab style, especially with the top serif on the A and the E serifs. I started scanning through the McGrew book on metal typefaces, hoping to find something that might have been a model. So far the closest I have seen is a type called Mastodon, although its A does not have the top serif. It was an early 1900’s typeface from the Hansen foundry. It survived into the era of film types, because it is also shown in the Phil’s Photo book “Homage to the Alphabet” from 1985.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
      <p>You’re probably right about it being hand lettered. While i agree Bookman has some similarities, this is more of a slab style, especially with the top serif on the A and the E serifs. I started scanning through the McGrew book on metal typefaces, hoping to find something that might have been a model. So far the closest I have seen is a type called Mastodon, although its A does not have the top serif. It was an early 1900’s typeface from the Hansen foundry. It survived into the era of film types, because it is also shown in the Phil’s Photo book “Homage to the Alphabet” from 1985.</p>
