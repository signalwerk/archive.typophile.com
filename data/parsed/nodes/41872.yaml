    html: <p>I’d like to suggest something I believe is even closer than Bookman or Mastodon. Years ago, the long-defunct Fontbank offered <a href="http://www.buyfonts.com/value_for_money/cache.htm" target="_blank">Cache Heavy</a>. It was, essentially, a heavier weight than existed of <a href="http://www.myfonts.com/fonts/linotype/itc-cushing/" target="_blank">Cushing</a>. It’s impossible to tell from the lousy Buyfonts.com image, but the L and T are near-perfect matches and the I-O-N-E are quite close. There are better matches for the A, R &amp; S, but not - especially in the case of the R - in a font that is otherwise similar.</p>
