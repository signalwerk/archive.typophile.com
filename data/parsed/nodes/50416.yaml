    <p>Hello everyone, I’ve just bumped into this great site today, and was carried away by lots of interesting stuff and cooments and subjects ppl discuss here. Plenty of creative, out-of-the-box fresh thinking and professional advice.</p>
    <p>My friend is opening a cafe soon here in Archangelsk city, Russia,so I have ordered a few designers a cafe logo, but still not satisfied with what they show me...</p>
    <p>The name if the cafe is КОФЕРУМ which (COFFEEROOM in english)...I sense that the Cyrillic font is not very familiar to ppl here...but maybe someone’s got an idea of what font can be used for the logo...or recomment some web site with good logos archive so i can look thru it to get some inspiration..:)</p>
    <p>thanx everyone in advance</p>
    <p>hi from Russia</p>
    <p>Anastasia</p>
