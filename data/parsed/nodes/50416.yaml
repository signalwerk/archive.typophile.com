      <p>thanks all for a feedback :)</p>
      <p>well, I will try to describe it in a few words : it’s planned to open a cafe chain, with three or four outlets in our town and if all is well, few other towns as well. The cafe will offer one of the best coffee in town, bakery and drinks. It won’t anything exclusive or arty, just a good coffee, nice lounge music and patisserie. can describe it as a good standard. as for target audience..middle class, students ...business people...</p>
      <p>It is not an up-market project, just a good local cafe chain, as i already mentioned above- no special exclusivity about it, but still good value.</p>
      <p>As for image...the owner really havent got any ideas so far, but i think it shouldnt be just trivial cup of steaming coffee or some simple coffeebean, although one can look really good if implemented creatively, so ....id like it also not to be very abstract, arty or quirky thing...maybe it can be icon image (pictogram) thing...it has to be smth simple at not banal at the same time...i will show down below the logos of the cafes i personally like...so maybe can bring u some ideas....</p>
      <p>thanks everyone in advance</p>
      <p>Anastasia</p>
