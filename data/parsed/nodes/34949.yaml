  html: |-
    <p><a href="http://www.outrasfontes.com/scrivano.htm" rel="nofollow">Scrivano</a> type family was designed by Ricardo Esteves Gomes, inspired by some handwritings from the Middle Ages and Renaissance period. There are four elegant organic font styles (Regular, Italic, Bold &amp; Bold Italic) that can be very useful to compose long or short texts in graphic standards that need some 'old style' feeling.</p>
    <p>Available at <a href="http://www.myfonts.com/fonts/outras/scrivano" rel="nofollow">MyFonts</a>.</p>
    <p>Critiques are welcome!</p>
