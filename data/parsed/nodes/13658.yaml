  html: |-
    <p>This is a logo I’m workin on for a campaign to promote tourism in the town I grew up in. I’m working on a couple other ideas but this is my favorite so far. I’m looking for a critique on the readability, how easily the shapes are recognized as hills and the relevance to the target audience.</p>
    <p>The target audience is (this is taken from the associations design brief):</p>
    <p>A. Baby boomers and retirees, ages 45-75+, Interested in the outdoors, gathering places, diversity, art &amp; culture, and education.<br>
    B.  Upwardly mobile, professional / creative class with disposable income, ages 30-45</p>
    <p>Thanks for your input.</p>
