    html: |-
      <p>Is that Fallbrook Mass per chance?</p>
      <p>This is an exceelent start. I don’t read the “F”s as “S”s and I do see the hills. I agree with Dan about making “Find” smaller and strengthening the “F“‘s crossbars.</p>
      <p>Additiionally, you have a pefect opportunity for an “fi” ligature in “Find” and the “dF” connector looks contrived/unatural and detracts from the hill metaphor. I would lose that all together and finish the “d” closer to the baseline.</p>
      <p>Keep it coming this has great potential.</p>
