    html: |-
      <p>This started out as Herman Ihlenburg's (1882) typeface, Bijou. Fontbank digitized it as <a href="http://www.buyfonts.com/value_for_money/bangle.htm" target="_blank" rel="nofollow">Bangle</a>. Then Swfte, one of those companies who put out several "1500 Fonts for a Pittance" CDs full of ripoff clones, modified it to create the goofy font, Mexacali (yes, that spelling is correct).</p>
      <p>I can't find Mexacali anywhere but websites full of commercial fonts and ripoffs of same, so I won't link to a copy.</p>
    html_clean: |-
