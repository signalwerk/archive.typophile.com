      <p>As far as I can remember these letters were custom designed by Glaser. He later developed a typeface called "Baby Teeth" based on this lettering. Check out Stephen Coles' post in <a href="http://www.typophile.com/node/37514" target="_blank" rel="nofollow">this thread</a> for a list of alternates.</p>
      <p> - Lex</p>
