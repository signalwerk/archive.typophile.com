      <p>For a similar/contrasting feel, maybe Slimbach (<a href="http://new.myfonts.com/fonts/itc/slimbach/alternate_cuts.html" title="http://new.myfonts.com/fonts/itc/slimbach/alternate_cuts.html">http://new.myfonts.com/fonts/itc/slimbach/alternate_cuts.html</a>) or the more playful Arbiter (<a href="http://new.myfonts.com/fonts/berthold/arbiter-bq/" title="http://new.myfonts.com/fonts/berthold/arbiter-bq/">http://new.myfonts.com/fonts/berthold/arbiter-bq/</a>).<br>
      Or, as Nick noted, something which can give a "press gain" feel, so no thin or sharp serifs, but something slabby and without too much contrast.</p>
      <p>By the way, I like the sample you posted :-) I asked about the type of cookbook just to better suggest something appropriate, given the peculiarity of Ultramagnetic in such context.</p>
