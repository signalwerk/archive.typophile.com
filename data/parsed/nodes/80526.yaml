      <p>I guess you're aware Ultramagnetic is a family member of Alternate Gothic (old Morris Benton Design).</p>
      <p>So News Gothic, Franklin Gothic, Trade Gothic, Benton Sans -- all those classic American Grots are stylisitcally harmonious.</p>
      <p>For a serif face, I'm thinking something with a "press gain" look, e.g. my <a href="http://new.myfonts.com/fonts/shinn/paradigm-pro/" rel="nofollow">Paradigm Pro Light</a>.</p>
      <p>There are a lot of "sturdy/dark" text face recently published.<br>
      Dolly was one of the first.</p>
      <p>**</p>
      <p>I used a demonstration with salt in my type design class for several years: pour salt in letter shape, photograph, make high contrast in Photoshop, import into FontLab, autotrace, et voilà, "Blur".</p>
