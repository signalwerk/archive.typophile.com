    html: |-
      <p>It's for a large international company. The cookbook is in conjunction with a diversity poster campaign in which employees submit recipes, and as I suggested, stories to accompany them. I chose ultramagnetic because it was friendly, but also because I am using stencils for the letters and pouring in spices. The ultra black, with its width and rounded corners made it a nice choice for this concept. I'm also using the ingredients of each persons recipe to illustrate their story by hand. I thought that the other weights would suffice for the book, but I need something more legible because these submissions could get lengthy.</p>
      <p>Here is an example of some of the work I've been doing by hand, which I didn't want to show because I'm not asking for a critique, but I guess if you all recoil at the thought of using this face for a cookbook maybe I should give it some context.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/diversity one line 72_6162.jpg"></div><p></p>
