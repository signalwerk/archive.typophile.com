    html: |-
      <p>“But we shouldn’t wait until EOT is someday supported in all major browsers.”<br>
      We HAVE to wait — Why wouldn’t we?</p>
      <p>”... we make the same mistakes as the music industry.”<br>
      We can’t make the same mistakes as the music industry — they provide a digital file (a rare parallel), but it requires no “composition”, and no “arrangement” is required... only volume control and this does not radically change the tune... So, when people say, “it’s just like music”, I laugh, musically.</p>
      <p>And, when people say the fonts are not installed in the system, I say they lie. But mostly, when people don’t understand that the reason I don’t like embedding, is because I don’t want my intellectual font property used in the seriously inferior world of the web until the typographic functionality accumulates to compose type well, (or of course, unless I’m paid up-front and in full). </p>
      <p>Just look around. GEEZE is <a href="http://billhillsite.com/ugly" title="http://billhillsite.com/ugly">http://billhillsite.com/ugly</a>, or /what!?<br>
      1. Underweight rules, feed ’em.<br>
      2. OS figures in an all cap headline, drop ’em.<br>
      3. Dark Grey type on a dark grey background.<br>
      4. 8 ½ x 11, comes out looking like 8©x11.<br>
      5. small caps in the first line that are light and narrow.<br>
      6. descenders cut off by graphics, ouch.<br>
      7. word space wider than leading is tall, kan u rede it?<br>
      8. Are some of these fonts obliqued?<br>
      9. Can an initial drop cap get uglier than if it’s aligned lower than the following text?<br>
      10. Enclosed, what is the crap obscuring the type?<br>
      </p><div class="imageWrap"><img src="/files/SadBlogType_3484.png"></div><br>
      11. I’m viewing this site on a 22 inch monitor, it barely fits and does no scaling to the window...<p></p>
      <p>I have yet to see a site with embedded fonts that is more than simple pour-’n-puke quality. You can see at Bill’s site, clearly what happens when you try to go farther.  Typography is not just having fonts. Fonts not having enough typography, (not to mention common ground in enabling software), is just not going to work for all users and uses, as a standard should.</p>
      <p>Cheers!</p>
