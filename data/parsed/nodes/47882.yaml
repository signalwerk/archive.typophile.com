    html: |-
      <p><cite>He suggests that embeddable fonts present a new licensing opportunity for font vendors. </cite></p>
      <p>That’s exactly the model I suggested in my <a href="http://opentype.info/blog/2008/04/19/font-face-survey-results">webfonts survey article</a>. Though the survey showed, that the web designers are not overly excited about it yet. </p>
      <p><cite>He may be right, and I believe EOT is the way to make it happen. </cite></p>
      <p>EOT is clearly the best solution from OUR point of view as type designers or font vendors. But we shouldn’t wait until EOT is someday supported in all major browsers. If we only think about the protection  and not about the wishes of the users, we make the same mistakes as the music industry.<br>
      It is foreseeable that in 2009 all major browsers will have webfonts support: Font linking for Safari, Firefox and Opera and EOT for Internet Explorer. This feature will be used, so we better have a license model ready by then.<br>
      EOT might be good in the long run, but a combination of font linking and EOT support might be necessary until then.</p>
