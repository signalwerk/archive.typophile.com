    html: |-
      <p><cite>The typeface one specifies with font-face must “be installed on the computer of the person viewing the web page”, which is not embedding.</cite></p>
      <p>And what’s the point of this sentence?<br>
      HTML websites are plain text files with linked resources. I don’t see any other way of doing this. You can’t (or shouln’t) actually embed a binary file in an HTML website. That’s not how the web works. </p>
      <p><cite>The browser picking whatever font(s) is/are available and supported, is not design. </cite></p>
      <p>Regarding webdesign this IS design. The web doesn’t work like a printed page and designing a website in a way that works for different browsers, screen sizes and user settings is actually a pretty hard design job. Webdesign always includes a lot of variables like font sizes, column widths or even font choices. As a webdesigner I would be very insulted if you don’t consider this job and such decisions “design”. </p>
      <p>Concerning the “browser picking whatever font(s) is/are available and supported”: I just meant that it is no big deal to have the same font linked two times, as TTF/OTF for browsers like Safari/Opera/Firefox and as EOT for Internet Explorer. So the visual result would be identical. @font-face is designed for this kind of use, in the same way as the VIDEO tag should support different video formats. </p>
      <p><cite>And, as one can see from the “ZEN GARDEN” examples, to Mr. Hill’s site, neither allows typography, just type.</cite></p>
      <p>Both of them are no real “web designers”, so I don’t see a point in picking on their webdesign skills.</p>
