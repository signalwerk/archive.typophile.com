      <p>Are major foundries researching solutions? If they come up with a free solution would the bragging rights and inherit clients from the bragging rights be enough recompense? Could foundries not research a solution and sell the solution to different companies to implement in their browsers?</p>
      <p>Who is more responsible to find a solution the browser company or font foundries? (not that i think anyone is inherently responsible to find an answer but we as designers are customers to both the foundries and the browser companies, and neither have provided a viable solution for a problem with their product). Maybe it is the web designers’ obligation?</p>
