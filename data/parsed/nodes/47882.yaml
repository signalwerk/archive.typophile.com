    html: |-
      <p>We don’t need that many new fonts to really help out.  For aging fonts, some foundries could gift two or three fonts from their collection to the web world for this type of embedding.  Surely every foundry has a few good fonts that just frankly don’t sell.   Or even some good ones that are actually fully usable as part of a collection.</p>
      <p>Most web browsers can make fake bold and italics/oblique, which is about the extent of font families the web has ever used (and I think iirc in CSS you can control the oblique angle too).  Just releasing, say, Univers at a regular weight would enable designers to use (fake) bold and italic on websites when needed for emphasis, but would also allow users to preview the font and then maybe investigate the full collection.  Any designer of course knows that you’ll want to buy the actual italic or bold font because obliquing only goes so far).</p>
      <p>Plus, you’ll always have OFL or CC licensed fonts which are often times of pretty decent quality.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
