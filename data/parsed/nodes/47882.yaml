    user: 2969
    date: 2008-08-03T08:05:00
    date_raw: 3.Aug.2008 8.05am
    votes: null
    html: |-
      <p>Ralph: “Both of them are no real “web designers”, so I don’t see a point in picking on their webdesign skills.”<br>
      Not “picking on their web design skills”, picking on their typography. You think they are not ’web designers’? You probably have an incorrectly narrow view of that definition in the context of this discussion.</p>
      <p>“Regarding webdesign this IS design...browsers, screen sizes and user settings is actually a pretty hard design job...variables like font sizes, column widths or even font choices...” are not enough...<br>
      Yes, there are a lot variables, and we agree that imbedded font formats, (and thus browsers (for the thinking thinker)), should not become a competitive field of typographic functionality —&nbsp;that that would be detrimental to the increasingly shrinking universality of the page description capabilities for the ’web designer’, is obvious... the rest of what I said, is obviously not.</p>
      <p>“The web doesn’t work like a printed page”<br>
      Never? ;ol. The web doesn’t <em>always</em> work like a printed page, you’re right about that. But we are talking, standards, so the web ought to at least be able to pretend to be a printed page, no?  Most of the web, in fact, behaves exactly like badly printed pages. And much of it behaves like badly printed and badly designed pages. Command Plus, does not change this, it just makes 5x possible results to test, (in paradise). </p>
      <p>j a m e s:<br>
      I start a new list based on your far superior screen grabs<br>
      1. is the headline really supposed to obscure the rule, sometimes?<br>
      2. Should the deck cross a color bound, only in Firefox, or should you fire Firefox?<br>
      3. Can someone please feed the serif text’s diagonals? y and v are about to drop in both browsers!<br>
      4. Is...  ’s  ....a kernable pair?<br>
      5. The spacing of the text serif face in Firefox and Explorer, though identical, is not what has worked for the last 35,000 years ;) Call me Flat Earthy, but Explorer’s “H u m ans” is the worst of an entire paragraph of <em>not human readability enabled</em> non-text-typography, <strong>(I bet it prints fine though;)</strong></p>
      <p>I’m as all-for-an-all-audio/video/graphics/hyperlinked/non-text-based-round-earthed future as the next guy or gal. But in the meanwhile, typography on the web has got to improve. Why Mr. Hill would try to fit his gigantic ideas into a standard browser at all, much less a super-sized browser, when he could be making his own “Reader” solving all these problems after a single simple download... that’s what I’d do.</p>
      <p>Cheers!</p>
