      <p><cite>Me: Browser-by-browser embedding implementations are not “a solution.”</cite></p>
      <p>Why not? This is exactly how @font-face is suppose to work. You specify local or external font sources and the browser will pick whatever is available and supported. </p>
      <p><code><br>
      @font-face {<br>
      src: local("Graublau Sans Web"),<br>
           url("graublauweb.otf") format("opentype"),<br>
           url("graublauweb.eot") format ("embedded-opentype");<br>
      }<br>
      </code></p>
