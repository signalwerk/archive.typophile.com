      <p>Ralf, you can embed things into the html if you want.  The only thing is it doesn’t prevent someone from copying it once it’s transfered, it just prevents direct linking by URL.</p>
      <p><code>&lt;img src="data:image/gif;base64,xxxxxxxxxx" alt="" /&gt;</code></p>
      <p><a href="http://danielmclaren.net/2008/03/embedding-base64-image-data-into-a-webpage" title="http://danielmclaren.net/2008/03/embedding-base64-image-data-into-a-webpage">http://danielmclaren.net/2008/03/embedding-base64-image-data-into-a-webp...</a></p>
      <p>Explains one potential use.  Also if you want to embed signatures in an e-mail without needing to send an image as an attachment.  Not a hugely useful thing but it’s available I’m sure there are niche applications for it.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
