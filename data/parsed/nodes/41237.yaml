  html: |-
    <p>I am the typographer who came in from the cold (forum member for almost six years).</p>
    <p>I work at a church where Giovanni is used for most communications, and so I'm tied to using it or something that complements it.</p>
    <p>I'm tempted just to go with Myriad – it was designed by the same typographer, and I have it installed. But it strikes me as too easy. In the past I've seen Myriad overused not because it's a fantastic face (it is) but because it's packaged with Adobe software.</p>
    <p>Should I just quit complaining and go with Myriad or go with something more interesting (like Cronos, also by Slimbach). It's quite touchy-feely, which I think works well for a church.</p>
    <p>Thanks in advance.</p>
