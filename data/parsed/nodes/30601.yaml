    <p>This is my first ever post on this forum, so I'm not exactly sure what to do or how to say it...but here goes:</p>
    <p>From my screen name, you can kind of tell I like icy things, and I've been searching for a font that would fit that somehow. However, I have not yet found one that was "sharp" and "cold" enough, reminiscient of ice and icicles and things like that, without looking evil. Any suggestions? Ideas?</p>
