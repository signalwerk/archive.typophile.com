      <p>When talking about ‘Fraktur’ one has to distinguish between Textura, which has an interrupted construction and Fraktur, which has a running construction. Dürers geometrical constructions rather refer to the Textura than to the Fraktur. I do not know what is written on this spanish website here, but the first illustration shows Neudörffers Fraktur and the second and the third show Dürers Textura. </p>
      <p>Dürer worked with Neudörffer on this remarkable piece of work here.<br>
      <a href="http://upload.wikimedia.org/wikipedia/commons/0/02/Ehrenpforte.jpg" title="http://upload.wikimedia.org/wikipedia/commons/0/02/Ehrenpforte.jpg">http://upload.wikimedia.org/wikipedia/commons/0/02/Ehrenpforte.jpg</a><br>
      For a couloured image which also gives an impression of the real size, check this link<br>
      <a href="http://www.dw.de/superstar-albrecht-d%C3%BCrer/a-17178335" title="http://www.dw.de/superstar-albrecht-d%C3%BCrer/a-17178335">http://www.dw.de/superstar-albrecht-d%C3%BCrer/a-17178335</a><br>
      and klick on the image next to ‘Ein comic für den Kaiser’<br>
      It is one of the largest objects that has been assembled from wood prints. The Fraktur on the lowest row of 5 panels has been written by Neudörffer on the wood blocks before it was cut. At least this is what thorough research by Werner Doede (20th century) and Oliver Linke (21st century) has proven. The meaning of Neudörffer for the development of the Fraktur as a writing style (Neudörffer published several writing manuals) and printing type (The typeface by Hyeronimus Andreä is based on Neudörffers handwriting) is both discussed in the literature by Oliver Linke and Gerrit Noordzij. Schematically speaking, the difference between Textura and Fraktur can be illustrated like this:<br>
      <a href="https://www.flickr.com/photos/albert-jan_pool/11468753126/in/set-72157629679838154" title="https://www.flickr.com/photos/albert-jan_pool/11468753126/in/set-72157629679838154">https://www.flickr.com/photos/albert-jan_pool/11468753126/in/set-7215762...</a><br>
      Please read my comments on the image at Flickr for more information on that subject.</p>
      <p>Rudolf Koch is an interesting source too, but his view on the subject is rather romantic and is closely connected with the attempts to re-establish what was called then ‘Deutsche Schrift’ (German letters) during the first half of the 20th century in Germany.</p>
