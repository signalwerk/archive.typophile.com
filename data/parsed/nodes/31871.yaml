    html: |-
      <p>…and I thought I was a hair-splitting pedant ; )</p>
      <p>Hiro he’s a <em>photographer;</em> photographers aren’t necessarily supposed to know that if they put letterforms into their ‘logo’ they get something called a logotype. Or that 14 tightly-spaced characters in Arial Black does not a logo make.</p>
      <p>Matt, by the same token – you’re not selling design, so if you like what you’ve done, go with it. Otherwise, maybe consider hiring a designer who actually specialises in these things; maybe you could trade them some photographic services in payment.</p>
