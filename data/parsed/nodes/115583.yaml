    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Burlingame_Image_5434.jpg"></div><p></p>
    <p>New to the Monotype® library, the 36-font <a class="freelinking external" href="http://bit.ly/1jocVoX " rel="nofollow"> Burlingame</a>® typeface family offers designers a square, sans-serif design that is suitable for a wide range of purposes, from branding, advertising and packaging to automotive displays, user interfaces, motion graphics, and mobile and broadcast environments.</p>
    <p>Designed by Carl Crossgrove, senior type designer at Monotype, the Burlingame typeface performs with strength and grace at any size. It’s a multifaceted, multipurpose typeface family. </p>
    <p>An introductory promotion is available through May 8, 2014 when licensing the entire Burlingame family of desktop fonts. Until then, customers are able to receive 50 percent off the regular price of $399.99 when licensing the Burlingame family from <a href="http://www.myfonts.com" title="www.myfonts.com">www.myfonts.com</a>, <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a> or <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>.</p>
    <p>View and download two free weights here – <a href="http://bit.ly/1jocVoX" title="http://bit.ly/1jocVoX">http://bit.ly/1jocVoX</a><br>
    View our blog post – <a href="http://bit.ly/1kjSKfp" title="http://bit.ly/1kjSKfp">http://bit.ly/1kjSKfp</a></p>
