    html: <p>Without having examined the font closely, my guess is that this version of Myriad is intended to come close to matching the ANSI CAD lettering standard. A few years ago, we were hired to make a stricter implementation of the ANSI standard for a CAD software company (and also fonts for the weirder ISO standard), it it looked not unlike this version of Myriad.</p>
