    html: |-
      <p>Here, top, is the implementation we made of the ANSI standard lettering for CAD. The Myriad CAD letters are pretty close to this, except for that lowercase <em>a.</em> We made this font in 2000, so perhaps the standard has changed since then. Below, is the weird ISO standard lettering.</p>
      <p>We made these fonts for a CAD software company called Microcadam. A few days after we delivered the fonts, the company was bought by IBM, and the Helix design program for which the fonts were intended was removed from the market. I've no idea what happened to the fonts, but presumably IBM owns them, whether they realise it or not.</p>
      <p><img src="/sites/default/files/old-images/cad_4975.gif"></p>
