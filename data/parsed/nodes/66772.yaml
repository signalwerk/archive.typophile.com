      <p>I think Chris is right, but there are a few similar fonts: I found <a class="freelinking external" href="http://new.myfonts.com/fonts/jnlevine/edessa/">Edessa</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/k-type/dalek/">Dalek</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/xerxes-tr/">Xerxes</a>. You may find others at gaming sites, or freebie sites like Dafont.</p>
      <p>The first of these seems closest in overall feel, and relatively simple changes, like using a C to make the E, should get you pretty close.</p>
      <p>- Mike Yanega</p>
