    html: "<p>I'll second what Adam has written: to date I have not found a single language that uses T/t with cedilla. The only likely candidate was Gagauzi, which is a Turkic language spoken in Romania, and which uses the S/s with cedilla following Turkish orthography, but the T/t with 'comma accent' following the Romanian orthography. <br> <br>Note, however, this important issue: the S/s and T/t with cedilla and comma accent were only disunified in Unicode and ISO 10646 after the need to distinguish in plain text for bilingual documents became clear. The older Windows codepage for Romanian (CP 1250) uses the Unicode codepoints for the cedilla diacritics, not the newer comma diacritics. This means that the vast majority of Romanian documents are encoded using the cedilla diacritics, not the preferred comma forms. This needs to be addressed at the glyph level in OpenType fonts, using the Romanian language system tag ROM and the Localised Forms &lt;locl&gt; feature to map the S/s cedilla diacritic character codes to the comma diacritic glyphs. <br> <br>I'm afraid I don't know how Gagauzi is typically encoded, so can't advise on what manner of OpenType gymnastics might be required.</p>"
