  html: |-
    <p>What is the status of the <a href="/wiki/tcommaaccent" class="freelinking" rel="nofollow">T and t comma</a> (021A &amp; 021B)<br>
    versus the T and t cedilla (0162 and 0163) for Romanian?</p>
    <p>In the Latin Extended A Unicode Doc it mentions the comma<br>
    being "preferred" over the cedilla. Adobe seems to be going<br>
    with the comma. Has the cedilla version fallen out of use and<br>
    or been replaced?</p>
    <p>Any help is greatly appreciated.</p>
