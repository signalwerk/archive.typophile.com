    html: <p>The form "t with comma" is strongly recommended in all cases.  <br> <br>You can include one lowercase glyph "tcommaaccent" with the Unicode codepoints U+0163 and U+021B, and one uppercase glyph "Tcommaaccent" with the Unicode codepoints U+016A and U+021A.  <br> <br>Alternatively, you might include one lowercase glyph "tcommaaccent" (U+0163), one identical glyph "uni021B" (U+021B), one uppercase glyph "Tcommaaccent" (U+0162) and one identical uppercase glyph "uni021A" (U+021A). The latter is practical if you don't principally want to include double-mappings of Unicode characters. Otherwise, the first described approach is the way to go.  <br> <br>For get about the variant "t with cedilla".  <br> <br>Regards,  <br>Adam <br></p>
    html_clean: <p>The form "t with comma" is strongly recommended in all cases.  <br> <br>You can include one lowercase glyph "tcommaaccent" with the Unicode codepoints U+0163 and U+021B, and one uppercase glyph "Tcommaaccent" with the Unicode codepoints U+016A and U+021A.  <br> <br>Alternatively, you might include one lowercase glyph "tcommaaccent" (U+0163), one identical glyph "uni021B" (U+021B), one uppercase glyph "Tcommaaccent" (U+0162) and one identical uppercase glyph "uni021A" (U+021A). The latter is practical if you don't principally want to include double-mappings of Unicode characters. Otherwise, the first described approach is the way to go.  <br> <br>For get about the variant "t with cedilla".  <br> <br>Regards,  <br>Adam <br></p>
