    html: "<p>This is something we worked on back in 2001 <br> <br>tender image: <br><img src=\"http://www.typophile.com/forums/messages/30/24274.jpg\" alt=\"Tender image\"> <br>final image <br><img src=\"http://www.typophile.com/forums/messages/30/24275.jpg\" alt=\"Final image\"> <br> <br>Gist is basically the road transport distribution part of BOC(a UK medical &amp; industrial gases business)expanded to offer services to third parties. I believe they carry Marks &amp; Spencer grocery products for instance. <br> <br>What intrigued me was that neither the word GIST or the broad style of the image we saw was associated with any business at the time, so even if we knew what it was going to be called, it still wouldn't have meant anything to anybody. <br> <br>PS: I never knew that \"gist\" was the centre of the word \"logistics\" until five minutes ago! <br> <br>Some linkage: <br> <br>GIST <a href=\"http://www.gistworld.com/index.html\" target=\"_blank\">http://www.gistworld.com/index.html</a> <br>BOC <a href=\"http://www.boc.com/index.cfm\" target=\"_blank\">http://www.boc.com/index.cfm</a> <br>Brand consultants <a href=\"http://www.corporateedge.com/search/article.asp?ArticleID=408&amp;ArtCat=12&amp;Search=gist&amp;Order=dd\" target=\"_blank\">http://www.corporateedge.com/search/article.asp?ArticleID=408&amp;ArtCat=12&amp;Search=gist&amp;Order=dd</a> <br>Flash animators <a href=\"http://www.two3rdswater.net/portfolio/web/boc_gist/\" target=\"_blank\">http://www.two3rdswater.net/portfolio/web/boc_gist/</a> <br></p>"
