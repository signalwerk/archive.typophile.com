    html: "<p>In this case the first image was supplied to companies who were actually going to manufacture product with this new branding, in our case, reflective badges for high-visibility jackets. <br> <br>I can only imagine(and hope, for the client's sake!) that the design and evaluation process had already been carried out. <br> <br>This sort of thing is very useful in a production environment. It isn't usually as good as this when our client is the end user's garment supplier, and we get all the right information from the start. <br> <br>A more common situation goes something like this: <br> <br>A freight company somewhere in England. <br>A decision is taken to obtain high-visibility jackets. <br>The guy who normally places orders(probably knows all there is to know about truck tyres) rings his contact in an industrial supply company(who happens to major in packing tape and warehouse supplies). <br>Tapeman speaks to somebody in our sales department(very keen, but can't always tell how many colours make up CMYK) and asks for a quote for , say it was the GIST  image above, a two colour badge. <br>If we're really lucky they'll fax us a photocopy of the logo as well. <br> <br>BTW the first image above was a scan of an old inkjet print I had hanging around, so there isn't much colour management going on here. <br> <br></p>"
    html_clean: "<p>In this case the first image was supplied to companies who were actually going to manufacture product with this new branding, in our case, reflective badges for high-visibility jackets. <br> <br>I can only imagine(and hope, for the client's sake!) that the design and evaluation process had already been carried out. <br> <br>This sort of thing is very useful in a production environment. It isn't usually as good as this when our client is the end user's garment supplier, and we get all the right information from the start. <br> <br>A more common situation goes something like this: <br> <br>A freight company somewhere in England. <br>A decision is taken to obtain high-visibility jackets. <br>The guy who normally places orders(probably knows all there is to know about truck tyres) rings his contact in an industrial supply company(who happens to major in packing tape and warehouse supplies). <br>Tapeman speaks to somebody in our sales department(very keen, but can't always tell how many colours make up CMYK) and asks for a quote for , say it was the GIST  image above, a two colour badge. <br>If we're really lucky they'll fax us a photocopy of the logo as well. <br> <br>BTW the first image above was a scan of an old inkjet print I had hanging around, so there isn't much colour management going on here. <br> <br></p>"
