    html: <p>Whoa - I've never heard of this. Is it some new British thing? <br> <br>How do they equate results from this research for a logo design <br>with no name, is the answer that blue is better and red didn't work for your <br>company called 'Company A Inc.'? <br> <br>Looks like Richard's client wasn't even testing type or colour on their market. Was the test only about a gradient? Was that research oriented or for printability? <br> <br>And finally why would any company do this? Sounds like a waste of money that could otherwise be spent on their product or service. Sounds like some clients don't trust our skill, <br>or a matter of watching over our shoulders while we work, plain ol disrespect <br>or is this the final answer that would hold all designers liable for our work. <br> <br> <br>-t <br></p>
