    html: |-
      <p>Well, <a class="freelinking external" href="http://www.hyphenpress.co.uk/books/978-0-907259-30-5" rel="nofollow">'The Stroke: Theory of Writing</a>' by Gerrit Noordzij is an interesting read (although there are some here on TP that don't like it). </p>
      <p>While it mostly deals with how tools affected letterforms historically and how this is still visible in contemporary type design (i.e. broad-nib pen, pointed pen, etc.) it also has parts about word-shapes and the relation between black and white (or shape and counter-shape; e.g. <a href="/wiki/bouma" class="freelinking" rel="nofollow">bouma</a>, <a href="/wiki/notan" class="freelinking" rel="nofollow">notan</a> and <a href="/wiki/word%20shape" class="freelinking" rel="nofollow">word shape</a>). Which is an important part of how we read (even more so than what individual letters look like). This is also something that Unger writes about in his book I mentioned earlier. It would probably be an important part of your research.</p>
    html_clean: |-
