      <p>&gt; What part did measuring play in the design process of the ClearType fonts?</p>
      <p>None. I didn’t conduct any studies on the ClearType font collection until after they were completed. We are working on a new font now where conducting legibility research is part of the design process. After a version of the font is created, measuring is done to see which letters are processed quickly and which are processed more slowly. The results are then used to create a new version of the font. I look forward to talking about this in detail after the font is published.</p>
