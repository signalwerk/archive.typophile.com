      <p>&gt;As a measurable quality, readability is a property of documents, not fonts.<br>
      &gt;It is art directors, graphic designers and typographers who determine readability, not scientists.</p>
      <p>Nick, I think this might be the core of why we always disagree. My assumption is that readability is a property of visual perception, and that readability is about optimizing text for the capabilities of the human eye and brain. Everyone’s visual perception is roughly the same: light goes through lenses, is focused on the back of the retina, photoreceptors absorb that light, ganglion cells look for edge boundaries, and so on. Readable text will allow the visual system to recognize letters and words quickly.</p>
      <p>I don’t think art directors, typographers, or scientists determine readability. Art directors and typographers can create different designs that may or may not be optimized for the human visual system. Scientists can measure the speed of processing a design in the human visual system. Creating and measuring aren’t in opposition to each other; they both should be part of the design process.</p>
      <p>&gt; An inconvenient truth for Kevin.</p>
      <p>Yes, there is no single measure for type size, and different layout variables may interact (e.g. leading and line length). It’s not actually a problem. It just means that design is complex.</p>
