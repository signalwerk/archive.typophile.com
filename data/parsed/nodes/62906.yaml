      <p><em>I don’t know how you can make this claim. Perhaps you also think we haven’t made it to the moon?</em></p>
      <p>I have argued my position on this forum repeatedly, so if you don't know by now, you haven't been paying attention!<br>
      Once more: I am not suggesting that science is bunk, merely that your claims to be able to determine the readability of fonts is bad science. It is quite possible to measure the readability of specific texts in laboratory situations, as you do, but to suppose that you are consequently measuring the readability of fonts in the wild is a non sequitur.</p>
