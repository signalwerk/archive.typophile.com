    html: |-
      <p>Rudi, W. et al (1993). Performance differences between Times and Helvetica in a reading task. <em>Electronic Publishing 6(3)</em> 241–248.</p>
      <p>Worth reading, but they failed to counterbalance the order in which participants were exposed to the typefaces.</p>
      <p>I'm in the process of reviewing a series of 12 Tinker papers, one of which is about fonts, and it showed that (surprizingly) many different fonts had no significant effect on reading time. I do not believe that comprehension was assessed. Also an interesting paper. Well written and an easy read. However, there was a failure to counterbalance the passages , fonts and orders in which they were received across participants.</p>
      <p>I'd still read both.</p>
