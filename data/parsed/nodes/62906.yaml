    <p>Hello everyone Im a graphic design student in need of some support with my thesis. I would like to write it on Legibility / Serif vs. Sans Serif/ In information design. However I am in need of a question/argument for a proposal and would be grateful for any suggestions.</p>
    <p>26/oct/09  I now have a clear understanding of readability and how it can inhibit or enhance how we read and have decided to focus my new research on the readability of partially sighted people. Do you think we have done all we can typographically to enhance readability for partially sighted people? Should guidelines be updated/reviewed/changed? Do guidelines differ in different parts of the world etc.. Any comments and suggestions are welcome</p>
    <p>Thank you<br>
    Belle</p>
  html_clean: |-
