    <p>Hi everyone,</p>
    <p>I've been working on my first san-serif typeface <a class="freelinking external" href="http://typophile.com/node/89023" rel="nofollow">http://typophile.com/node/89023</a> - and have included a handful of additional ligatures in typetool: f_i / f_f_i / f_l / f_f_l / f_j / f_f_j / f_b / f_h / f_k / s_t / c_t / t_t</p>
    <p>I've named them as above in the glyph properties, and left the unicode blank. When I set some sample text in illustrator in one weight, these glyphs are fine, but then if I change the weight of the same text some of these don't render. If the glyphs are named the same, and neither have an assigned unicode, is there any reason why they would be assigned differently?</p>
    <p>Also, if I open the glyph window in illustrator, I can manually put these glyphs in - so they're there, just not properly assigned.</p>
    <p>Is there a trick to getting these additional glyphs assigned correctly? I'm not looking for them to auto populate at this stage, i'm just trying to have them render correctly.</p>
    <p>I posted this in the critique thread for the font, but thought it might help to add it here.</p>
    <p>Thanks,</p>
    <p>Dale.</p>
