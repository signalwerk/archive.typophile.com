      <p>Thanks for the input, everyone. Your feedback is very helpful, that is for sure. I'm going to attach a few examples of potential starting points for the 3D effect that I touched upon earlier. I might be overthinking it but it feels like the star needs something.</p>
      <p>Thanks for the info on mirus's cognate, mirror. I did not know that. I should definitely stay away from the rectangular "wall".</p>
      <p>For the record, I am currently using DIN Bold and Regular for the secondary copy (TRADING CARDS, etc.).. Any comments on that? I like the edginess of this logo but don't want it to be too harsh for a younger audience. I totally agree with the serpentine comment about the S. I may alter this a little bit for this reason. Any comments on that would be appreciated. I'm also not too sure about the bottom stem of the R, it feels a bit weak. I'll explore this further soon.</p>
      <p>Thanks again. What great insight you all have!</p>
      <p>Josh</p>
