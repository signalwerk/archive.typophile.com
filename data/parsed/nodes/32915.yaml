    html: <p>I'd go for the middle one at the bottom. The "serif" on the n gives it a nice touch (especially with its repeat as the dot on the i). I'm not to sure about the 9 though. Maybe you could play around with it some more, it looks a little out of place now. I think a 9 with a straight diagonal descender would be better for the type. You definitely need a different font for the "established 2007" bit. Something scripty might be good &amp; give it a extra vintage sporty look.</p>
