      <p>Hey Josh,</p>
      <p>I like the 2D look for the logo. It is a departure from most logos today that try to be "hip" by adding 3D effects. It also harkens back to the old-school Starter jackets and team logos. Although, I do have to say that the 3D logos that you attached above are very nice.</p>
      <p>-Scott</p>
      <p>P.S.: Just to clarify what I meant by "cognate:" I should have said "false cognate for 'mirror'" because a cognate is a word in another language that looks like its translation in English. i.e. "Automobile" looks like the English translation "Automobile." So although mirus doesn't mean 'mirror,' it could easily be viewed that way if you don't know Latin. Just a point of information. :)</p>
