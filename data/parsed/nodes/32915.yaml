    <p>Hi,</p>
    <p>I am in the process of brainstorming for a company that will design and print trading cards for children involved in sports. The concept of the company name "9" was my high school soccer number. The company will actively encourage children to participate in sports while reflecting on the positive impact that sports have on one's character, self-esteem, etc. Sports have done so much for me and I'd like to do something like this to encourage children to participate and follow their dreams.</p>
    <p>So, I'm looking for something clean, hip and cutting edge. An identity that would appeal to youth (elementary, middle, high-school), on ball caps, t-shirts, hoodies, etc.. The attached logo is in its initial stages.</p>
    <p>I'm also looking for a sans serif font (for body text) that could work well with the text in this logo. Also, I'm looking for a nice font to go with the logo that reads "established 2007" or something along those lines. Maybe something scripty, historic but modern and hip.</p>
    <p>Thanks for much for any input that you can provide!</p>
    <p>Josh</p>
