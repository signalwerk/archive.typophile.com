      <p>Thanks for your feedback, Scott and my apologies for the delayed response. I'm still feeling that the logo needs a little "something" to make it feel complete. I'm still exploring if this is a 3d look or simple effect applied to the letters/logo to make it more visually interesting.</p>
      <p>For now, I put together a quick card to show the mirus logo in use with a secondary logo that could potentially be used for the first base set of cards for this series. The base set would be entitled "Authentic" or "JD Authentic". The example I am presenting here is a very quick, rough concept with little to no real type treatment for the player name, position, team and number. I'm working on fine tuning these logos (primary and secondary) to make them work well together. Again, some king of coloring, or simple effect (weathered, for example, for the authentic logo). As you all know, the "Authentic" font is Fenway Park from Veer. I'm impressed with it but am working on creating a "JD Authentic" logo.</p>
      <p>So, that's it for now. Any feedback is certainly welcome. Thanks so much again for all of you assistance.</p>
      <p>Josh</p>
