      <p>Josh,</p>
      <p>This is an excellent project and I wish you much success is finalizing it. More than ever, kids need to be active and self-motivated to build confidence and pride. </p>
      <p>I don't want to knock your work, because I think the first crop of ideas is well done. I would like to maybe suggest a title change to reflect your goals. I don't feel any connection to the word/number "nine". How about something that creates a connection between group sports and the individual like maybe... Team One. Just something to consider.</p>
      <p>Secondly I agree with Tom on the type choice for the number 9. I'd suggest a vertical descender as well, maybe an italicized sans.</p>
      <p>And you're looking for a script for the established 2007 text that's modern. Check out the script faces at <a href="http://www.sudtipos.com/home" title="www.sudtipos.com/home">www.sudtipos.com/home</a> like Amorinda or Malback (Veer also carries some nice modern scripts) or maybe even September from t26 (<a href="http://www.t26.com/fonts/September" title="http://www.t26.com/fonts/September">http://www.t26.com/fonts/September</a>)</p>
      <p>A sans serif body copy suggestions : check out FF Meta, FF Fago, or Whitney from HFJ</p>
