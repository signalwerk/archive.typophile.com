      <p>Here's an update. I have been working on other name possibilities for this company and did some testing with the latin word "mirus" which means "extraordinary". I thought this was a strong word with a hidden/subtle meaning that can communicate how extraordinary kids are while touching upon one of the business objectives of the business - designing and producing high-end, unique, compelling and extraordinary trading cards for youth athletes. Sports can be a means of building a child's self-esteem, confidence, etc. and these trading cards will help facilitate this.</p>
      <p>I am hoping to add some kind of dimensionality or effect to the star or some type of rectangular shapes (see logo 5) with dimension to make this logo more appealing. I like the symbolism of the star (achievement, special, etc.) but also wonder if there is a visual way to show an abstract image of trading, cards, etc. I'll pursue this further soon.</p>
      <p>In case you can't read the text. it reads: MIRUS.. trading cards.. Extraordinary Kids. Extraordinary cards.</p>
      <p>Thanks for any input that you can offer!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mirus_1_5104.jpg"></div><p></p>
