      <p>Thanks again for all of your input. I'm currently brainstorming on name possibilities for this company. In addition to the style presented above, I'm also drawn to the athletic-looking vintage baseball scripts. I think this might work well for this purpose.</p>
      <p>In thinking more about the name of the company, I became nostalgic and thought about my youth, playing sports with my father in the backyard. He certainly was a huge influence in the development of my passion for sports. His sports nickname was "Jimmy" and I'd love to use it as a name/logo but, I'm concerned about the alternate meanings associated with this expression. :)  Am I off track here? Vintage but somewhat modern, sporty. Jimmy. The best fonts of this style that I found are Fenway Park and Ballpark Script.</p>
      <p>I really like the style of the attached Peralta logo too.</p>
      <p>Research in progress. Any input would be appreciated but I realize that I haven't offered much here.</p>
      <p>Thanks again!!</p>
