  html: |-
    <p>I just posted a beta of a serif face I've been working on lately at <a class="freelinking external" href="http://betatype.com/node/35" rel="nofollow">http://betatype.com/node/35</a>.</p>
    <p>I wouldn't recommend using them for big projects, as they are definitely beta quality at this point. However, the design ideas are there, and in the hands of a skilled typographer could produce some interesting results, as the family is pretty complete.</p>
    <p>I'm mostly interested in hearing any feedback/feature requests anyone might have.</p>
    <p>Note: These beta cuts probably won't be up for long, as I take them down before the official release.</p>
