      <p>Ah. Looking at my post, with the specimen-book examples taken out of their context, they do not look so dated; but it is also clear that the sample from an Elston Press publication is, or seems to be, much bolder than they are, although not otherwise differing much in typeface.</p>
      <p>In any case, I found the specific book alleged to be set in Caslon Old Roman on the web page from which I learned that name, and it was digitized more clearly; here is a sample from it:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/elston_hesp_3811.jpg"></div><p></p>
      <p>and again, it seems as good as the products of those private presses that commissioned their own types rather than simply buying suitable types from standard suppliers.</p>
