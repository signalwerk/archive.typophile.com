    html: <p><a href="http://members.xoom.virgilio.it/dtp/papers.html" target="_blank">http://members.xoom.virgilio.it/dtp/papers.html</a> <br> <br>Here you can find the complete manual of Fontographer. <br>EPS documents you can't directly import. <br>The best way to 'import' a glyph is with copy/paste. Make sure the settings are set to copy in PICT format. I'm a Freehand user but I heard that it's possible in Illustrator to change the settings. <br> <br>Good luck <br>Ren</p>
