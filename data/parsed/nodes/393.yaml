    html: "<p>P.S. <br> <br>if you are doing : <br> <br>illustrator : Edit --&gt; copy <br>Fontographer : Edit --&gt; paste <br> <br>then you are going to see gray oulines or fills - template layer. <br> <br>or: <br> <br>illustrator: save the artwork  - version 6. <br> <br>if the image is excessively long  - divide the artwork into two or more character cells. <br> <br> <br>David Hamuel <br> <br></p>"
