    html: "<p>Matthew, <br> <br>I'm something of a Fontographer newbie, but I believe you should be using an older version of Illustrator, such as 5 or 6, to copy your logo (I use version 6 and it works just fine). I think the problem is that from version 7 onwards, they made changes to the way Illustrator works with the clipboard. Actually, there is even an older typophile thread about this very topic: <br> <br><a href=\"http://www.typophile.com/forums/messages/4101/1479.html?1024492172\" target=\"_blank\">http://www.typophile.com/forums/messages/4101/1479.html?1024492172</a> <br> <br>here's another tip: once you get an older version of Illustrator to work with, don't just press Command-C to copy your logo/glyphs, press Option and go to the Copy command in the Edit menu. Then go to Fontographer and use the Paste command in the Edit menu. This is advice given in the Fontographer manual and also in Chank's tutorial, which I recommend: <br> <br><a href=\"http://www.chank.com/howto/\" target=\"_blank\">http://www.chank.com/howto/</a> <br> <br>Good luck with everything! <br>Ricardo</p>"
    html_clean: "<p>Matthew, <br> <br>I'm something of a Fontographer newbie, but I believe you should be using an older version of Illustrator, such as 5 or 6, to copy your logo (I use version 6 and it works just fine). I think the problem is that from version 7 onwards, they made changes to the way Illustrator works with the clipboard. Actually, there is even an older typophile thread about this very topic: <br> <br><a href=\"http://www.typophile.com/forums/messages/4101/1479.html?1024492172\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/forums/messages/4101/1479.html?1024492172</a> <br> <br>here's another tip: once you get an older version of Illustrator to work with, don't just press Command-C to copy your logo/glyphs, press Option and go to the Copy command in the Edit menu. Then go to Fontographer and use the Paste command in the Edit menu. This is advice given in the Fontographer manual and also in Chank's tutorial, which I recommend: <br> <br><a href=\"http://www.chank.com/howto/\" target=\"_blank\" class=\"link-external\">http://www.chank.com/howto/</a> <br> <br>Good luck with everything! <br>Ricardo</p>"
