  html: <p>Hello everyone - iam new to the board. Can anyone help with the following query. <br> <br>I have picked up a version of Fontographer 4.1.2 and am trying to import illustrator eps files of a logotype I have just developed into fontographer. However the 'import eps' option appears not to work due to lack of memory, no matter how much i allocate to the programme, and a simple cut and paste of the ill. vectors just gives a greyed out guide in fontographer. <br> <br>Is there any way to use the ill. vector AW without having to redraw the characters in Fontographer.  <br> <br>Any help greatly appreciated. <br> <br>Matt</p>
  html_clean: <p>Hello everyone - iam new to the board. Can anyone help with the following query. <br> <br>I have picked up a version of Fontographer 4.1.2 and am trying to import illustrator eps files of a logotype I have just developed into fontographer. However the 'import eps' option appears not to work due to lack of memory, no matter how much i allocate to the programme, and a simple cut and paste of the ill. vectors just gives a greyed out guide in fontographer. <br> <br>Is there any way to use the ill. vector AW without having to redraw the characters in Fontographer.  <br> <br>Any help greatly appreciated. <br> <br>Matt</p>
