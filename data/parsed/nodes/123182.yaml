    html: |-
      <div class="comment-spam-body"><p>I'm not certain if _Smith_ is a single font.<br>
      The _S_ is a fair match with Cartel URW Bold<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CartelURWBoldAsSmith_4042.gif"></div> <a href="http://www.myfonts.com/fonts/urw/cartel/" title="http://www.myfonts.com/fonts/urw/cartel/">http://www.myfonts.com/fonts/urw/cartel/</a><br>
      As for the other letters in the logo, they remind me of Clarendon style serifs. URW Clarendon ExtraNarrow Bold<br>
      <div class="imageWrap"><img src="http://typophile.com/files/URWClarendonExtraNarrowBoldAsSmith_4472.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/urw/clarendon/" title="http://www.myfonts.com/fonts/urw/clarendon/">http://www.myfonts.com/fonts/urw/clarendon/</a><br>
      Also there is some similarity of _mith_ to Neue Aachen SemiBold<br>
      <div class="imageWrap"><img src="http://typophile.com/files/NeueAachenSemiBoldAsSmith_3552.gif"></div> <a href="http://www.myfonts.com/fonts/itc/neue-aachen/" title="http://www.myfonts.com/fonts/itc/neue-aachen/">http://www.myfonts.com/fonts/itc/neue-aachen/</a> but Neue Aachen's Clarendon style serifs are truncated and too thick. However, it could be edited to match _mith_.<br>
      Don<p></p>
      </div>
