    html: |-
      <p>Thank for the comments, Andrés and Eben-</p>
      <p>Tanner is a study of serif type for me. I'm also working on Caslon-style. But this design is one that is just natural to me. Basically I just started making glyphs, and see what they'd look like. I went back and forth a bit, and evenutually got the book weight.</p>
      <p>Andrés; with this amount of change in weight, I could keep the weights and widths closer together, but I don't want to make a condensed/extended family. Any suggestions how to do that?</p>
      <p>Eben: 'a' gets too dark as well. And I'm not happy with the colour of 'e' and 'o' either.</p>
      <p>With sans serif it's enough to draw three weights: the thinnest, book, and the heaviest. With serif this method no longer applies. I have to figure out how to work this out.</p>
    html_clean: |-
      <p>Thank for the comments, Andrés and Eben-</p>
      <p>Tanner is a study of serif type for me. I'm also working on Caslon-style. But this design is one that is just natural to me. Basically I just started making glyphs, and see what they'd look like. I went back and forth a bit, and evenutually got the book weight.</p>
      <p>Andrés; with this amount of change in weight, I could keep the weights and widths closer together, but I don't want to make a condensed/extended family. Any suggestions how to do that?</p>
      <p>Eben: 'a' gets too dark as well. And I'm not happy with the colour of 'e' and 'o' either.</p>
      <p>With sans serif it's enough to draw three weights: the thinnest, book, and the heaviest. With serif this method no longer applies. I have to figure out how to work this out.</p>
