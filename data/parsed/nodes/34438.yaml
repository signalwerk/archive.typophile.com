    <p>Hey, I’m looking for a couple of sans serif faces that are or have very black weights. I’m thinking as black as Underware’s recent (custom) Fat Ed, Fedra Sans Display 2, Amplitude Ultra weights, etc. They shouldn’t be too funky.</p>
    <p>I’m leaning towards Fedra Sans Display 2, but I would like to look at other typefaces before I decide anything. Thanks in advance. :)</p>
