    html: <p>Maybe it’s because I saw them paired together quite a bit in the ’80s, but I think of Baskerville when it comes to serif companions for Futura. Baskerville’s round shapes, low x-height (in the non-ITC versions) and long ascenders/descenders make it a decent match. Mrs. Eaves (a Baskerville derivative) might work, too.</p>
