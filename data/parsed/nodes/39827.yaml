      <p>Thanks everyone for the helpful suggestions. I’m glad to hear others thought of Baskerville and Bembo; I had actually thought about this too but thought I might be nuts since they come from such a different time and heritage. So it’s good to hear that it makes sense.</p>
      <p>I had actually looked up this question on typografie.info, where it had already been asked, and there the responses devolved into bickering with people insulting each others’ suggestions and good sense. Someone even said the question was totally naive and a designer who asked it shouldn’t be working for paying clients yet! They say Germans are more blunt and direct than Americans; maybe it’s true...</p>
      <p>I’m going to go ahead and try out some of these suggestions, but if anyone else stumbles on this thread and has other ideas or input, I’d welcome them as well.</p>
      <p>Thanks again!</p>
