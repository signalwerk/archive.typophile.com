    <p>Dear Typophiles, </p>
    <p>has anyone a suggestion for a roman that’d be a good text face companion for Futura? </p>
    <p>I’m designing a flyer / magazine ad and later a website for a music competition from a non-profit. </p>
    <p>The competition and the organisation are focused on an unusual Modern composer - active from the 30’s through the 70’s, who flouted the atonal trends of the time to compose music that was melodic and harmonic yet very fresh, clear and modern-sounding. When I heard the music I thought of Futura - modern yet (some think, Bringhurst does at least) humanist. So that’s what I’ve been using for this client for past couple years. </p>
    <p>But these days I’m not as into Futura as when I used to be able to print it in lead (my college print shop had some nice chunky sizes that looked really great) and I’d like to round it out with a text face. But I can’t figure out how to match or complement those round, wide shapes and long ascenders - help!</p>
    <p>Thanks,<br>
    Leslie</p>
