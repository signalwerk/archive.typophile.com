    html: |-
      <p>If you compare Esquire and Bitstream's <a href="http://www.myfonts.com/fonts/bitstream/century-731/" rel="nofollow">Century 731</a> you will see they are 'identical' (I put that in quotes because there are always some variations in digitizations of the same design). The signature of this typeface is the ear on the 'g'. Scangraphic has a history of changing names on their typefaces if they do not have the rights to use the 'correct' name. This is much like Bitstream's and URW's agreements with the foundries whose libraries they helped digitize. </p>
      <p>The original name of this typeface, I still believe, is 'Textype' and it was designed by C. H. Griffith for Mergenthaler Linotype in 1929, as a newspaper type (See McGrew pp306-7)<br>
      - Mike Yanega</p>
    html_clean: |-
