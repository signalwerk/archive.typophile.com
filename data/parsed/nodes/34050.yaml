    html: |-
      <p>I've done some more reading in McGrew and it seems that Griffith also designed a typeface called Excelsior for Linotype two years after Textype. Excelsior had a greater x-height, and in the metal version, came with either long or short descenders. Otherwise it's almost impossible (for me) to tell them apart. They both have the same ear on the 'g'. It makes sense to me that 'Esquire' is the digitization of 'Excelsior', since most of the time Scangraphic used the same initial letter as the original typeface name.</p>
      <p>Further, this one may have fooled the FontBook folks too, because they show 'Esquire' as based on the 1929 Griffith design (Textype), when Excelsior was designed in 1931. BTW, Linotype has its own digital version of <a href="http://www.myfonts.com/fonts/linotype/excelsior/" rel="nofollow">Excelsior</a>. Does that match any better?</p>
      <p>- Mike Yanega</p>
