      <p>Thanks all.</p>
      <p>I did get an email, then a phone all, from someone who had done extensive work, including work on a scholarly level, with Ixil Mayan. According to him, the preference is indeed for the straight up and down mark, typical of U+0027. He did indicate that if, for some reason, U+0027 is inclined in the font, then another mark should be used.</p>
      <p>I'm certainly no expert, but with this, I'm satisfied that the straight up &amp; down mark is acceptable for Ixil. There may be competing orthographies with other scholars, but that happens.</p>
