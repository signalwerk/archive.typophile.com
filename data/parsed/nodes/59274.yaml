      <p>As I see it, composition is where the rubber meets the road in publishing.  The customer is always right, though sometimes it is worth the effort to educate him or her about less-than-obvious details.  And as you say, any innovation needs to be cleared.   I like to know how things ought to be as well as what's practical now, hoping to keep the files I submit today from becoming out-dated too quickly.  Some publishers appreciate that, and I think it helps me retain customers in a competitive environment.  One can't charge for researching arcanities, they're just another "loss leader".  This week, for example, I get to make a few modern forms based on archaic Chinese "Stone Drum" inscriptions -- about as obscure as you can get (though I see there is a <a href="http://en.wikipedia.org/wiki/Stone_Drums_of_Qin">wikipedia</a> page).</p>
      <p>That is an indication of the small niche in which I operate: almost all my work involves Chinese, sometimes very old.  So I'm more a student (thanks to your contributions on these forums) than a serious competitor.  As for New Haven, well, like a lot of folks here I came for Yale and and stayed for the town.  In my case, it wasn't the design program but rather the anthropology department on the far side of the campus.  Back in the days when IBM compatibility meant something I bought a PC clone that couldn't print from a Chinese add-on to DOS, and had to learn all about interrupt 17h.  That proved more fun than finishing a dissertation on Chinese archaeology.</p>
