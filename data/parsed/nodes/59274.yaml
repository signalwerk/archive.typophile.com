      <p>I had a look at the <a href="http://www.almg.org.gt/portal/">ALMG</a> (Academia de Lenguas Mayas de Guatemala) site and, after selecting  "Publicaciones &gt; Alfabetos", I was redirected to a pdf document including the following alphabet for the Ixil language. </p>
      <p><img src="/sites/default/files/old-images/alfabeto_6674.jpg"></p>
      <p>The word "saltillo" (also used for all the other mayan alphabets in the document) caught my attention.  I first found the <a href="http://en.wikipedia.org/wiki/Saltillo_(linguistics)">Saltillo Wiki entry</a>, where I learned that "saltillo" (meaning little skip) refers to a glottal stop, that it is a straight apostrophe-like symbol that has often in the past been substituted for by letters such as U+02BC, MODIFIER LETTER APOSTROPHE and that the codepoints for the saltillo are U+A78B LATIN CAPITAL LETTER SALTILLO and U+A78C LATIN SMALL LETTER SALTILLO. The <a href="http://unicode.org/charts/PDF/UA720.pdf">corresponding unicode chart</a> gives the following example glyphs:<br><img src="/sites/default/files/old-images/saltillo_6555.jpg"><br>
      I also had a look at the <a href="http://www.sil.org/mexico/">Summer Institute of Linguistics (SIL) in Mexico</a> <a href="http://www.sil.org/mexico/ling/glosario/E005ai-Glossary.htm#Alpha-S">Electronic Glossary of Linguistic Terms</a> where I found <a href="http://www.sil.org/mexico/ling/glosario/iDefnSaltillo.htm#DefnSaltillo">this definition of <em>saltillo</em></a>:  <cite>A (usually enlarged) straight single quote or dotless exclamation point, often used in practical orthographies to represent a glottal stop. The name "saltillo" (possibly used only when this symbol is used for languages of Mexico) is borrowed from a Spanish word meaning 'a little skip', a description of what the voice does in pronouncing this sound.</cite></p>
      <p>Also on the SIL site, I found this <a href="http://www.sil.org/mexico/maya/chol-tumbala/S121d-DiccionarioCholEd3-ctu.pdf">ch'ol dictionary</a>  that uses a font called CharisSILAmArea, that encodes the "saltillo" by a private codepoint, U+F21D; here are two words from that pdf file with that "straight apostrophe" (I copied them from the pdf, pasted them side by side in textedit and selected CharisSIL, but they look just like in the pdf):<br><img src="/sites/default/files/old-images/cabaatsam_4941.jpg"><br>
      If I look at the CharisSIL fontfile with FontForge, I see that the character at position 0xF21D is nothing but uniA78C. Things seem to fit together.</p>
      <p>Michel</p>
