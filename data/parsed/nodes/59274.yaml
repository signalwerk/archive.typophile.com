      <p>Thanks, Charles. That's much clearer.</p>
      <p>It's always confusing when it comes to the typographic treatment of the apostrophe, the prime mark, and other characters that are superficially similar when written by hand.<br>
      Because of the ease of input, they are typically substituted by U+0027, especially on the web.</p>
      <p>For the apostrophe in English and other major languages, we can confidently say that U+2019 is the right character, and that the raised comma is the correct shape. If you received a manuscript in English that used the 'vertical apostrophe' throughout, you wouldn't think twice about changing it to the correct form.</p>
      <p>With something like the glottal stop in Ixil Mayan, it's more complicated, especially if there is no real established typographic tradition. However, I think that as the usual apostrophe glyph has been used in the past for Mayan languages, there is no reason to use a 'vertical apostrophe' glyph unless there is an explicit indication of a change in practice. I'd ask a Mayan linguist, but there's no guarantee that you'd find an expert on Mayan typography.</p>
