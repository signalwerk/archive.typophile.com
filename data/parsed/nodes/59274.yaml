      <p>The author is insisting on a straight up &amp; down mark. I'm taking this to mean U+0027. BTW, I'm not in contact with the author. The chain, typical for a compositor, is comp &gt; designer &gt; editor &gt; author.</p>
      <p>* * *</p>
      <p>I believe I put the original question poorly. At this point, what I'm asking is really a language question, a *glyph* question, rather than a purely type or phonetics question. I posted to this forum because there is a tremendous level of expertise on several levels. Originally, I though the question similar to "how to draw a proper ogonek in Polish" that Adam gave us a while back, but I see that is perhaps wrong.</p>
      <p>Wrong because the proper glyph to signal a glottal stop varies across languages. In Polynesian, U+2018 shows the proper glyph. In Apache, Navajo, etc., U+2019 is the character that shows the proper appearance (even if not the "proper character"). Occasionally, the "phonetic" glottal stop glyph is used in the language itself, not just in analysis of the language.</p>
      <p>But things are never simple, what I want to know is "what's the proper character (glyph) in Mayan if you have the whole typecase to choose from? Keep in mind that the character U+0027 is erroneously used for the glottal stop generally on several internet sites. For instance,</p>
      <p><a href="http://www.omniglot.com/writing/apache.htm">http://www.omniglot.com/writing/apache.htm</a></p>
      <p>Notice that the glottal stop seems to be the "vertical apostrophe" U+0027. But if you poke around on the site -- fairly valuable, generally -- you notice that U+0027 is all there is. It's used for "English" apostrophes; U+2019 never occurs. Same problem with Wikipedia.</p>
      <p>I have never seen a scholarly use of U+0027 for a glottal stop, and I've seen quite a few varying orthographies over the years. What I have seen is indigenous people pick up information from various places, and with the advent of PostScript, create their own fonts. For example, in the early days of Fontographer, the Navajo schools made up a Navajo font. Good for them. But somebody had described the "hook" (AKA ogonek) as a "reversed cedilla," so they took a cedilla &amp; reversed it.</p>
      <p>Who am I to tell the Navajo they're wrong about their own language? (But I did notice that they've now redone the font, and the ogonek is used instead of the reversed cedilla.)</p>
      <p>Or, Mayan writers may have decided that they want control over their language, disregarding what scholars have done. Their right. What I want to guard against is the use of a glyph because it was the only thing available to an author, or because an internet site such as Omniglot gave the wrong information.</p>
      <p>The book is to be set in an Adobe font, which I can modify. Since I'm the end user, there is essentially the whole typecase available. Anybody know what's the proper glyph in Mayan?</p>
