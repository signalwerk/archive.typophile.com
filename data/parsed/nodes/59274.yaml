      <p>I always saw U+0294 as for almost exclusive use in IPA encoding, and U+02BC as just that, a modifier letter (which means it forms an unbreakable semantic unit along with the letter(s) it modifies).</p>
      <p>U+0027 and U+2019 just seems to be taking glyphs instead of characters.  Of course I suppose if they REALLY want to encode it one way or another you can just take your prefered glottal stop character and (license permitting) place it in U+0027.</p>
