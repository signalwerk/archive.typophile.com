      <p>U+02BC is the correct character for the apostrophe-shaped letter used in many orthographies to indicate a glottal stop. Here is the description for 'modifier letter apostrophe' from the relevant <a href="http://unicode.org/charts/PDF/U02B0.pdf">Unicode Chart</a>:</p>
      <p>* glottal stop, glottalization, ejective<br>
      * many languages use this as a letter of their alphabets<br>
      * used as a tone marker in Dogri (swarbal chinha)<br>
      * used as a length marker in Bodo (gojocoma)<br>
      * U+2019 is the preferred character for a punctuation apostrophe</p>
      <p>Unicode including this as a 'modifier' letter is a bit unfortunate, but the above description makes it clear that this is the character required.</p>
      <p>U+0242 and U+0241 don't apply here as they are different letters altogether. They are letters that frequently represent the same sound as U+02BC, i.e. a glottal stop, but in different orthographies with different casing behaviour (U+02BC doesn't come in separate lowercase and uppercase versions). They are different letters in the same way that 'thorn' and 'theta' are different letters although they generally represent the same sound.</p>
      <p>Returning to the original post, Charles, could you clear up for us whether the author is insisting that the U+0027 glyph is used, or that the U+0027 code point is used?</p>
