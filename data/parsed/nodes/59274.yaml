      <p>What started this thread wasn't that I would have insisted the publisher or author was wrong, but that they might want to consider a "Note on Orthography" if there were varying opinions, or if scholars tended to use a different orthography than "indigenous people." And, if a usage were odd enough, and there was to be no note on orthography, I might want to remove our name from the "composed by" line on the CIP page.</p>
      <p>That's about as conscientious as I can get.</p>
      <p>By the way, I see you're a compositor working in the University press market. "New Haven" makes it sound like we might be competitors.</p>
