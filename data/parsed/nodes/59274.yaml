      <p>Let's hear it for Yogi Berra.</p>
      <p>I was worrying about whether I'd been handling the glottal stop in "Hawai‘i" correctly -- the U. of. H Press occurs frequently in bibliographies I set.  According to charles_e and Jeongsong, I'm probably safe using the single open quote char. (U+2018, a.k.a Alt-0145 in Windows).  Guifa's note sent me scurrying to the Unicode charts to confirm that the IPA U+02BC isn't in the fonts I tend to use, but its reverse U+2BB sometimes can be found; Unicode's description includes "used in Hawai`ian orthography as `okina (glottal stop)."  So maybe I should have been using that?</p>
      <p>Checking the UH Press <a href="http://www.uhpress.hawaii.edu/cart/shopcore/?db_name=uhpress&amp;page=shop/index&amp;PHPSESSID=b233d3c4f797c0e1c1f8e4e7f0b70de1">website</a>, I see that they use both U+2018 and U+0060 (grave) on a single page.  And to get really picayune, "Hawaiian" is an English word, so it doesn't get the glottal stop (apparently rendered in the Unicode description with a grave).</p>
      <p>David</p>
