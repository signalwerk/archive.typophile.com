    <p>We're setting a book where the author insists the glottal stop in (Ixil) Mayan be represented using Unicode 0027. This would be different from the little Mayan we've previously set, where the glottal stop was signaled by U+02BC (or U+2019).</p>
    <p>I don't follow the shifts in orthographies all that much, but that one is passing strange -- except for a few who only do a quick internet search. I have seen 0027 used for a glottal stop in some internet sites -- Omniglot comes to mind -- but in all such cases, through out the entire site, the English single quote (and apostrophe) is a also U+0027. There isn't a U+2019 in sight.</p>
    <p>Now of course, we'll set what the author &amp; publisher want, but for my own sake, I'd like to know if there has been a change.</p>
    <p>Actually, the proper *character* would, I suppose, be U+02BC . . .</p>
    <p>TIA</p>
