      <p>You can cut it seven ways from Sunday. If you wanted to search for all and only glottal stops in a work with Polynesian, using U+20BB would make that easy. The whole point of using the right character comes from future "electronic repurposing." The glyph for the Latin capital "A" is the same glyph as the Greek capital Alpha. For printing only, you could use either one. Syntactically they are quite different.</p>
      <p>Having said that, guess which character we use for  the raised or turned comma to signal glottal stops.</p>
      <p>Part of the reason is I can count on the thumbs of one foot the number of competent book fonts that have any of the spacing modifier characters. I guess I could put them in, kerning should be a bit different for an apostrophe than for a glottal stop. But (1) I'm lazy, and (2) all the manuscripts come in with either 0027 or 0218. Nobody's going to pay us for doing this search when the manuscript is labeled "editorially correct.</p>
