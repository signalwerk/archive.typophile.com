      <p>David,</p>
      <p>What you are doing is fine. Polynesian -- which of course, is the source of the word *Hawai‘i* -- uses the single open quote *glyph* to signal a glottal stop. Strictly, from a *character* point of view, it should be U+02BB, for "turned comma" rather than U+2018. Of course, the origin of what we now call "single open quote" (AKA U+2018) was -- you guessed it, a turned comma.</p>
      <p>Gufta (Matthew)'s comments apply more to the analysis of language, rather that what various languages use to signal things like a glottal stop.</p>
      <p>* * *</p>
      <p>We use to set books for the University of Hawai‘i Press when the text had Chinese before Unicode and OpenType CJK fonts became so common.</p>
