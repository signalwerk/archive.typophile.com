      <p>I, too, did several things for them back in the old days.  The one I have at hand is from 1996 and the title page shows it came after the press changed its name from the University Press of Hawaii; it also has the glottal stop mandated by the state legislature.</p>
      <p>One worry I have -- perhaps because I don't know any better -- is that if I use U+02BB ("turned comma") for jobs that end up being distributed electronically it could screw up searching and indexing on account of its relative rarity.  The U+2018 convention seems safer -- not to mention more in line with your Yogi Berra practicality.</p>
