      <p>Brian, you must have spotted the quotes in running titles. The chꞌol dictionary contains indeed 185 occurrences of U+0027 and 182 of them are in the word CH'OL in running titles; there is also one occurrence on page 67 in the word <em>ch'ol</em> and two on page 27 in 'asi debes decir'. There is no other "apostrophe" in the text.</p>
      <p>There are three occurrences of U+2019 (single quote) for a quote inside a quote in the bibliography.</p>
      <p>There are 12231 occurences of the minuscule saltillo uniA78C and 16 occurrences of uniA78B (capital saltillo), all of them in the word CHꞋOL.</p>
