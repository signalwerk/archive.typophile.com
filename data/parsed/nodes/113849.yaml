    <p>Hey typophiles</p>
    <p>Does anyone know the name of the font used here on this CD?<br>
    <a href="http://img444.imageshack.us/img444/7840/10048925pt5.jpg" title="http://img444.imageshack.us/img444/7840/10048925pt5.jpg">http://img444.imageshack.us/img444/7840/10048925pt5.jpg</a></p>
    <p>It is to my knowledge one of the first computerized Blackletter fonts, with a quite short lifespan due to being replaced by more "impressive" versions such as the regular Old English.</p>
    <p>Any help would be immensely appreciated!</p>
