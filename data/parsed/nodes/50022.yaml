  html: |-
    <p>Hi people with more typographic tact than me (meaning basically everyone here). What do you think about Rosewood and Chaparral used in conjunction?</p>
    <p><a href="http://vervesix.com/casa/bg_myspace.jpg" title="http://vervesix.com/casa/bg_myspace.jpg">http://vervesix.com/casa/bg_myspace.jpg</a></p>
    <p>Don’t mind the kerning.. had to do it in Photoshop. I’d like to work with the Rosewood serifs more, even make a few ligatures (e.g. the lower adjacent ligatures of the ’IS’ in DISCO). Also, do you find the leading I chose annoying at all? I feel like there are both good and bad things happening where the letters touch...</p>
    <p>Thanks for any constructive input!<br>
    Casey</p>
