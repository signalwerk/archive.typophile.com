    date: 2012-08-31T03:47:00
    date_raw: 31 Aug 2012 — 3:47am
    votes: null
    html: <p>I'm not sure which old font format preferred things that way, or whether wholly curved glyphs posed problems, but I think it's safe to conclude it's not an issue for applications these days. FontLab, however, does sometimes do funny things to start points between curves, so I try to put them at the end of straight sections when possible. I'd be interested to hear others' methods.</p>
    html_clean: <p>I'm not sure which old font format preferred things that way, or whether wholly curved glyphs posed problems, but I think it's safe to conclude it's not an issue for applications these days. FontLab, however, does sometimes do funny things to start points between curves, so I try to put them at the end of straight sections when possible. I'd be interested to hear others' methods.</p>
  - id: 520618
    user: 44740
    date: 2012-08-31T04:00:00
    date_raw: 31 Aug 2012 — 4:00am
    votes: null
    html: <p>Yeah, for some reason Fontlab seems to treat a start point on a curve as two points, which isn't a problem until you try interpolating between two glyphs where the start point is on a curve in one and not the other. Having said that, I'm struggling to get blend fonts to work very well at all, even when all points, start points and start point order are compatible.</p>
