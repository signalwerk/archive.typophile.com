    <p>I'm having a problem with the typeface: Filmotype Lasalle.<br>
    On the Font Bros. URL, they show TWO different versions of the lower case letter "r".<br>
    The SPECIMEN shows BOTH versions (See Pork Pie vs Caerphilly), while the CHARACTER SET show the "Caerphilly" version. Is there a way to access this alternate letter "r", or is this just a mistake?  Thank you.</p><div class="imageWrap"><img src="http://typophile.com/files/FILM-LASA-CS_3519.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/FILM-LASA-SP_6499.gif"></div><p></p>
