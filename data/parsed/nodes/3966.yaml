    html: <p>I think it would be far more readable if you didn't marry the left half  <br>of the <i>n</i> into the <i>a</i>. The ambigram/inversion thing can very definitely <br>work for this word. Try using the middle of the right stroke of the <i>n</i>  <br>as your centre of rotation, curving left at the top as normal, and  <br>curving into the <i>t</i> at the bottom, something like a cursive join. Then  <br>the left stroke of the <i>n</i> can invert to the <i>t</i>. A half serif on the end  <br>and a slightly descending stroke will give you your <i>t</i>.</p>
    html_clean: <p>I think it would be far more readable if you didn't marry the left half  <br>of the <i>n</i> into the <i>a</i>. The ambigram/inversion thing can very definitely <br>work for this word. Try using the middle of the right stroke of the <i>n</i>  <br>as your centre of rotation, curving left at the top as normal, and  <br>curving into the <i>t</i> at the bottom, something like a cursive join. Then  <br>the left stroke of the <i>n</i> can invert to the <i>t</i>. A half serif on the end  <br>and a slightly descending stroke will give you your <i>t</i>.</p>
