  html: <p>hey ho, im all new around here, and a friend of my sis directed me over to this uber-cool place of typeness. <br> <br>so just a little intro, im dante. ive worked in the field for awhile, doing freelance projects and stuff. and now im going to the artcenter college of design, dying but fufilling my masochistic urges. this project is for my form and letterform class, where we have to make a personal logotype. its supposed to read 'ante,' which is the root word of many of my nicknames.  <br> <br><img src="http://www.typophile.com/forums/messages/29/3210.jpg" alt="http://dantecom.future.easyspace.com/amerika/anteaite.jpg"> <br> <br>its still kinda unreadable, so if you guys have any suggestions, id be so greatful! thanks!</p>
