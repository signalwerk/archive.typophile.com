      <p>Agency wouldn't work for text though.</p>
      <p>To compliment Bank Gothic I might consider a particularly rounded font, such as Gotham, Avenir or Futura. I think to use a different squarish font - and Eurostile is another of course - might fight with the Bank Gothic and be difficult to read for running text. </p>
      <p>You could then use Bank Gothic or Agency for the headlines.</p>
