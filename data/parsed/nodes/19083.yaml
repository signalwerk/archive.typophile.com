    <p>Hi everyone,<br>
    I need some suggestions for a font to compliment Bank Gothic: <a href="http://www.myfonts.com/fonts/bitstream/bank-gothic/" rel="nofollow">Bank Gothic</a><br>
    The client has a logo in dark blue and orange set in Bank Gothic Medium with a Nikeish swash around it. They specialize in energy consulting. Now they want a different font to embed in documents to make their profile more distinct. When this is not possible they will use Arial.</p>
    <p>The new face has to work in both text and headlines. Bank Gothic is a square geometric font, and I'm looking for a flavor of this in the text font as well (without losing legibility). They need at least regular, medium and bold in italic as well. Small caps would be good as well, but it's not a requirement. Opentype would work best, otherwise PC postscript.</p>
    <p>Thanks,<br>
    Oystein</p>
