  html: |-
    <p>If your sample is available online, you can link to it via a hyperlink, though we prefer you upload an attachment in the thread itself. There are two options:</p>
    <p>To attach an image in your original post.</p>
    <ol>
    <li>Click <strong>edit</strong> in the black bar at the top (right under the thread title) if you're adding an image to a pre-existing thread.</li>
    <li>At the bottom of the page you'll see <strong>Attachments</strong> in red.</li>
    <li>Click <strong>Browse</strong> and select the image on your hard drive.</li>
    <li>Click <strong>Submit</strong>.</li>
    </ol>
    <p>To use the inline image upload feature you will need a current version of the  <a href="http://get.adobe.com/flashplayer/" rel="nofollow">Flash Player</a>. Once you have it installed you will see an “Insert image” link on the post form. After clicking that link, browse your hard drive and select the desired image.</p>
    <p>Make sure your sample image is compatible with this board:</p>
    <ul>
    <li><strong>RGB</strong> only, no CMYK</li>
    <li><strong>GIF</strong>, <strong>PNG</strong> or <strong>JPEG</strong> only, no TIFF or BMAP</li>
    <li>although <strong>PDF</strong>s are supported, we <em>really</em> don't like them (unless it's a vector file)</li>
    </ul>
    <p>If you do not comply to these specifications, there's a high probability your sample won't show up in certain browser versions.</p>
    <p>Mind the size – don't post unnecessary big images and do not exceed <strong>590 pixels</strong> in width.</p>
