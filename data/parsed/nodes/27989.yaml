      <p>Justice for Girls?<br>
      That appears to be an NGO, not a clothing line.<br>
      Sure, it has a brand, but Copperplate Gothic?!</p>
      <p>If you’re going for a hand-drawn looking wordmark, why not hand draw it?<br>
      You could start with a typeface as a model though, say Typing with Rudolf (from Font Bros) and draw over it, “girlifying” it with curves, tendrils, and general frou-frouishness.</p>
