    <p>Just a quick heads up for those who have pre-ordered the Making Faces DVD:<br>
    It will ship early this week!<br>
    <a href="http://makingfacesfilm.blogspot.com/" title="http://makingfacesfilm.blogspot.com/">http://makingfacesfilm.blogspot.com/</a></p>
    <p>There are 10 languages of translations for subtitles in the works and that version will be released later in the year. Thanks to everyone who supported this project. I hope you like the end result.</p>
    <p>RK</p><div class="imageWrap"><img src="http://typophile.com/files/Rimmertape5-11_6143.jpg"></div><p></p>
