    html: <p>&gt; it's their business, not mine. <br> <br>Wait, I thought The Customer Is Always Right?! <br>Damn this Capitalism business is confusing... <br><a href="http://news.bbc.co.uk/2/hi/technology/4347325.stm" target="_blank">http://news.bbc.co.uk/2/hi/technology/4347325.stm</a> <br> <br>-- <br> <br>Tiff, it sounds like you're looking for as literal a replacement for Stainless as possible. Don't be clingy <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> - it might be better to step back, and start over. What is the newsletter about? Who is it for now, and who should it be for in the future? How much text? Illustrations - what kind? What's the desired Readability/Style balance? Etc. <br> <br>hhp</p>
