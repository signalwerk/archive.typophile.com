    html: "<p>If you want another geometric sans, I highly recommend Eric Olson's Klavika. Just licensed and used it for a project, and it rocks. <br> <br><a href=\"http://www.processtypefoundry.com/typefaces/klavika/index.html\" target=\"_blank\">http://www.processtypefoundry.com/typefaces/klavika/index.html</a> <br> <br>The Process Type EULA allows embedding. One potential hitch: the basic license is just for one CPU, rather than the more common \"up to 5 CPUs.\"</p>"
