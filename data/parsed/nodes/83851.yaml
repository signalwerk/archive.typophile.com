  html: <p>In a script font, where all caps use is a massive no-no, would it make more sense for the AE glyph to be Ae, same with OE going to Oe?  I'm thinking of doing it, not even as alternates but as the main glyph, since nobody would ever use AE or OE in anything other than an all caps setting...  Or would they?</p>
