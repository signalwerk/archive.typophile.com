      <p>From my understanding, Æ is meant to be its own character just like /A/ or /E/ or any other letter. Hence the reason why it's common to find /AE/ and not /Ae/, since it is treated as a single letter and not two different letters (as in the case of /f_i/ or most other ligatures).</p>
      <p>But I may have the wrong understanding so don't quote me on this.</p>
