    date: 2011-07-19T00:54:00
    date_raw: 19 Jul 2011 — 12:54am
    votes: null
    html: "<p>Sure you can do Ae and Oe ligatures if you want. They would be contextual ligatures and you can name them A_e/O_e. Just don't put them in the slots named AE and OE. Those are distinct letters of certain alphabets and cannot be replaced by a non-ligature version, nor by an uppercase-lowercase mix like Ae/Oe. That's like writing “Water” in this way: Vvater.</p>"
    html_clean: "<p>Sure you can do Ae and Oe ligatures if you want. They would be contextual ligatures and you can name them A_e/O_e. Just don't put them in the slots named AE and OE. Those are distinct letters of certain alphabets and cannot be replaced by a non-ligature version, nor by an uppercase-lowercase mix like Ae/Oe. That's like writing “Water” in this way: Vvater.</p>"
