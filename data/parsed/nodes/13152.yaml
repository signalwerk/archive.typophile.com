    html: <p>If you rework the R to reflect the S I'd be more confortable with the look. Try sharpening up those curves on the bowl. As for the width, remember optically characters look different even if they are the same mechanical width. Thats why the T and E look wider than some of the other characters. Experiment with making them a tiny bit narrower. Good work!</p>
