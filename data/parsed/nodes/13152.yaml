    html: |-
      <p>Fredrik,</p>
      <p>Your new version is better, but the 'S' still feels to me like it's trying to free itself from 'KRET'. Try moving it closer by just a hair.</p>
      <p>Generally, I think you need to lessen the visual differentiation between the 'S' and the other letters. In addition to the sharp angles and the downward-sloping of the center of the 'S', the 'R' has a generous bowl that lowers the perceived x-height (to me), whereas the 'S' has more typical proportions. This is amplifying the differences that make the 'S' the odd man out. Also, the finishing strokes at the top and the bottom don't seat the 'S' as firmly as the rest of the characters, and put its visual center of balance to the lower right (perhaps trim down the top stroke of the 'S' to make it lean back and balance itself a bit?). Try eliminating/minimizing some of these differences, which might allow you to keep the sharp angles. Or maybe it's just easier to get rid of them...</p>
      <p>Overall, nice work! I look forward to seeing the results.</p>
