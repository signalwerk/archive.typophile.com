      <p>Guys,<br>
      sorry for not posting any progress, other things more urgent ...<br>
      I have been trying various approaches of making the 'R' and 'S' feel more similar, while also trying to balance the 'S'. Moving the 'S' closer by a hair helps somewhat, but I find that the highest point on the curve has to be shifted in order to slip the 'S' back up into the word. There are two versions in the link below, one with the re-worked 'S', and another with a re-styled 'R'. I came across Auto by Underware and saw something I liked in the 'R'.<br>
      Comments would be much appreciated.</p>
      <p><a href="http://www.ummocrono.com/krets_new_s.gif" rel="nofollow">new s, new r</a></p>
