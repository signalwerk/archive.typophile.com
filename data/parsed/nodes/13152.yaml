    <p>Hi,<br>
    For this logotype I am hand-drawing the name. Face inspired by the typography of Iñigo Jerez's work for Suite and I guess Eric Olson's work at Process type foundry. I'm trying to achieve a fairly 'warm' character, still with few curves. Perhaps 'design engineered' would be the word. Since I have no previous experience of this kind of work, I'd be happy for any critique. Shoot.</p>
