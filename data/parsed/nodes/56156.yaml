      <p>It's Pegasus by Matthew Carter. There is a sample of it in my <a class="freelinking external" href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a>. Just type "Pegasus" in the 'fuzzy search' space near the bottom of the page.</p>
      <p>I don't believe it is available in digital release.</p>
      <p>- Mike Yanega</p>
