    <p>Sorry for the somewhat low-res image from Amazon (and the scrolling), but can anyone help me out with this type family? It's been bugging me and I've been unable to divine its identity. It's a latin with a peculiar, sharply calligraphic feel. Thanks in advance. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/donne_4468.jpg"></div><p></p>
