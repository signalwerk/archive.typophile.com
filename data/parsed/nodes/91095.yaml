    html: |-
      <p>The formats seem to be as documented, except for the size limit; </p>
      <blockquote><p>
      Only files with the following extensions may be uploaded: <em>jpg jpeg gif png txt html doc xls pdf ppt swf pps</em>.
      </p></blockquote>
      <p>Nothing has changed. I could transfer a pdf that is less than 128K. I tried a larger one (192 K) and got this</p>
      <p><img src="/files/error_52397.jpg"> </p>
      <p>I inserted that image with</p>
      <pre>&lt;img src="../../files/error_52397.jpg"&gt;
      </pre><p>where the link is one of the attachments above.</p>
      <p>PS I changed for &nbsp;<code>&lt;img src="/files/error_52397.jpg"&gt;</code>, &nbsp; which is probably better.</p>
