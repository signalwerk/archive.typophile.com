    html: |-
      <p>When you are logged in, you click on "My blog" at the top right, then you click on "Post new blog entry" (at the top) and you just choose some file to attach (at the bottom) and save. The file is then on the typophile server. If you uploaded <code>filename.png</code>, then inserting <code>&lt;img src="/files/filename.png"&gt;</code> in some thread will display it.</p>
      <p>Note that you can edit your blog (there is a button for that at the top) and then make new attachments.</p>
