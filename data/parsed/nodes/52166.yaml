    html: |-
      <p>EEK! it looks so weird!  In canada every package is bilingual english/french.</p>
      <p>Y'know, our packages are cleaner than that too...</p>
      <p>Something I noticed walking through American grocery stores is that, even thought they only had 1 language to deal with, they english-only packaging was WAY more crowded and busy than our Canadian bilingual packagine (and I'm also not a fan of american typography, much more 'novelty' than 'style' for my taste.</p>
      <p>The <em>only</em> clean and legible packages in the US were multi-national copmanies, whose designers would have had to design multi-lingual packaging in other countries (canada, europe) like Kraft, Knorr and others like that.</p>
      <p>I wonder, is our bilingual packaging in Canada busier and more loaded down than European Multi-lingual packaging?  I know one of the impediments here are the 'equal representation laws' that require english and french to have (often times) equal point sizes, even though the french runs 20% longer on average.</p>
      <p>It might be nice to have predominantly english or predominantly french packaging, with some bilingual elements.</p>
      <p>Sorry about this whole thing, it's just so foreign *not* to see <em>le french</em></p>
