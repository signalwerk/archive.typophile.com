    <p>We just had our last SoTA board meeting before we all gather in Buffalo for TypeCon, and I tell you, it's shaping up to be another great week.</p>
    <p>Last year, I know there were a number of Typophiles in attendance whom I did not really get a chance to talk to or even meet. Once again, I'll be managing some of the logistics, wrangling buses, and overseeing front-end this year; and I realize that when I'm in that mode I can sometimes put out a "Don't bother me, I'm busy" vibe. But don't buy into it. Seriously, come up and introduce yourself. </p>
    <p>You might have to tell me your screen name or otherwise jog my memory. I always think about this too late to do anything, but wouldn't it be great if we could have figured out a way to cross-check the TypeCon registration database with the Typophile membership and get an image of every Typophile's avatar on the TypeCon badges. Sometimes it's tricky to match up a face &amp; name to an avatar &amp; screen name.</p>
    <p>Hope to see lots of fellow Typophiles in Buffalo.</p>
    <p>-- Kent.</p>
