      <p>So sorry I can't be there. This will be the only TypeCon I've missed since my first 'Con; TypeCon Minnesota. This year overlaps with a personal, family engagement (we're wishing my parents off on their upcoming humanitarian mission).</p>
      <p>I'll miss the late night dinners with all kinds of random and fascinating conversations including watching design rockstars explain the Helvetica R on a cocktail napkin. I'll miss exploring random cities with friends that I only see once a year at the 'Con. </p>
      <p>Enjoy Buffalo! I'm also bummed that I won't see <a href="/wiki/P22" class="freelinking" rel="nofollow">P22</a>'s home turf. =/</p>
      <p>Regarding the avatar/icon it's a great idea. I hope everybody will keep Twitter active with TypeCon action. Use the "hashtag" #TypeCon when you're there. Or you can post directly to Typophile from your smartphones.</p>
