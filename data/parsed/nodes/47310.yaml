      <p>Ricardo -- Not coming? Darn, I was looking forward to meeting you (again -- and maybe remembering this time ;-)</p>
      <p>Jason -- Sorry to hear about your travel woes. That reminds me of the recent hassle I had getting from Albany, NY, to Montreal for the AAUP conference -- 10 hours! (via Newark; don't ask). Same deal: It would have been faster to drive, if I'd only been able to forecast the delays. Come up to the mezzanine if you get a chance after RIT and say hello. (We'll be working here until about 5:00.)</p>
      <p>Jonathan -- Thanks for posting the directions to Paradise Press. I'm sure I'll be getting questions about where to go tomorrow and hadn't gotten around to figuring it out.</p>
      <p>One great thing about this year's location is that almost all of the workshops (except the letterpress ones) are just across the street from the hotel, so none of that nasty bus business (except for some of the evening off-site events).</p>
      <p>And the main presentation space, marketplace, and galleries are all pretty much right together, so no wandering around several floors trying to find things (or worse, for us organizers, schlepping boxes up and down and all around).</p>
      <p>Today: the goodie bag stuffing!</p>
      <p>-- K.</p>
