      <p>Arrived a few hours ago myself, after a nasty 12-hour trip from Toronto (yeesh: a canceled flight from Toronto to NY last night - where I was to have dinner with friends before flying to Buffalo this morning - and thus 3 hours of sleep to catch the make-up flight to Laguardia at 6am, shuttle to JFK, delayed flight to Buffalo, &amp;, etc., &amp;c.; as I said: yeesh), and so stumbled into the Hyatt around 4:30pm, got the computer hooked up, had a long shower, and now about to crash.</p>
      <p>BUT, looking forward to the coming days. I'm planning on the shuttle-trip to RIT tomorrow, and already snuck a peek at the Grosvenor exhibit (it looks to be delicous, although it's simply not right that the books are held captive under glass).</p>
