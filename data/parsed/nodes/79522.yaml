    html: "<p>It really depends on the size of the signatures which will be used to print the book: the more pages up, the greater the creep. Since the book will be perfect-bound, the inner margin should be measured on the innermost pages of the printed and folded signature. If your measurements work on these pages, you should be OK...</p>"
