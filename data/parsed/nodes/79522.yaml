    html: |-
      <p>Remember, with perfect binding, the signatures are trimmed on 4 sides. In the States, the gutter looses 1/8 of an inch. That's just gone. Then there is the "tightness" that perfect binding (or notch, for that matter) adds.</p>
      <p>Even with the creased spine, the glue itself will add some stiffness. I haven't had to worry about this for a while, and understand there are now better glues. Still . . .</p>
      <p>But perhaps I misunderstand -- usually, you can't perfect bind as few as 64 pages. I'd take 96 pages as the minimum. With that in mind, Kent's suggestion of having the printer do a dummy makes good sense to me.</p>
