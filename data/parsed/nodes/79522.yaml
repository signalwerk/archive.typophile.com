    html: |-
      <p>James (Dunwich) is on the right track. But in practice, <em>measuring</em> the loss is actually quite difficult.</p>
      <p>I suggest two possible approaches.</p>
      <p>1) Print out proofs of your design-in-progress and trim to size. Then set the page(s) into the dummy, snug up to the gutter. </p>
      <p>Measure the amount left hanging out over the fore-edge. Trim this amount from the inside margin, and set the page(s) back into the dummy. (I like to use a bit of double-sided tape to hold the page against a dummy page, aligned to the fore-edge.)</p>
      <p>Now you’ll really be able to tell how your design works, in three dimensions.</p>
      <p>2) Another approach is to take the dummy, open a center spread, and mark with a pencil where you think the inner margin should fall visually. Then measure in from the fore-edge and use that to determine the inner margin of your layouts.</p>
      <p>Then go through the exercise of #1 above to evaluate your design.</p>
      <p>A book printer can usually make up a dummy for you to the exact specs — trim, length, paper stock, and binding style. Might cost you a surcharge, depending on your account with the manufacturer, but worth it, imo.</p>
