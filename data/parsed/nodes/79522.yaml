  html: |-
    <p>I am laying out a perfect-bound booklet of 64pp + paperback covers, page size 210mm high x 130mm wide. The spine width will be about 5mm, and each cover will be pre-creased vertically 4mm from the spine. When a reader opens the booklet for the first time those 2 x 4mm will remain out of sight; ordinary handling and page-turning will disclose almost all of the gutter.</p>
    <p>My question is about margins. Because of this variable visible gutter I avoided making the two inner margins equal one outer one. I settled on margins of top 14mm, bottom 23mm and outer 20mm each. Will that work, given how much tolerance there will be in how the inner margins will appear to the reader? Do I need more white at the gutter to compensate?</p>
    <p>(It’s continuous prose, no illustrations.)</p>
