      <p>I don’t know if there’s an “official” litmus test. Trademarks are characterized as “strong” or “weak” based on a number of criteria. Generic marks are considered quite weak and must have other aspects going for them to qualify for protection.</p>
      <p>Some basic info here: <a href="http://www.nolo.com/legal-encyclopedia/qualifying-trademark-protection-faq-29129.html" title="http://www.nolo.com/legal-encyclopedia/qualifying-trademark-protection-faq-29129.html">http://www.nolo.com/legal-encyclopedia/qualifying-trademark-protection-f...</a></p>
      <p>But really, you’re asking questions that should be asked of an IP attorney.</p>
