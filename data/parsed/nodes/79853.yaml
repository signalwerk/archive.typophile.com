    <p>I put it to the forum. If there were a font called Serif as a registered trademark to a foundry, is it legal for another foundry to name a font Big Serif? I know you folks aren't lawyers. I know that, were the situation to come up, I'd fold like a bad poker hand and change the name. </p>
    <p>I just want to hear your thoughts.</p>
