    html: |-
      <p>You could register the trademark "Xxxx Serif" but your registration would have to make clear that you are disclaiming any rights to Serif on its own. I own the registered trademark "VF Sans" but certainly have no right to the word "Sans" on its own. However if something is too descriptive of what it is, you will not be able to trademark the name. I once attempted to trademark the name 5 X 7 for a typefont made up of dots on a 5 x 7 grid, and that application was rejected.</p>
      <p>That said, hire an attorney!</p>
