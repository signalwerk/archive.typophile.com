      <p>Far as I'm concerned, you're on the wrong track. You need to know the difference between SPACING MODIFIERS and COMBINING DIACRITICALS. These are different characters in Unicode, even if they are the same glyph. OpenType presupposes Unicode.</p>
      <p>Just remember that as far as Unicode was concerned, having a codepoint for any accented character was an unfortunate circumstance, done for legacy purposes only. Some people are beginning to prepare texts as Unicode intended, even when a legacy character is available in most fonts -- such as aacute.</p>
      <p>So your first job is to not muck up the proper spacing of the characters. Your second job is to make up whatever precomposed accented characters you want, without buggering up that proper spacing.</p>
