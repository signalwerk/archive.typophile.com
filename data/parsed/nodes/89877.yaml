    <p>Hello, I am in the middle of designing my first font and have a little stumbling block in terms of the metrics measurements.</p>
    <p>I have managed to insert the 'correct' values for most glyphs but I am unsure of what to do with accents such as circumflex, tilde, breve, cedilla, caron etc. I created these with their corresponding letterfoms initially and so Fontlab autofilled these spaces hence leaving the metrics values rather large. I am unsure of whether to leave them large as is the case with other fonts I have studied or manually assign some values to them? Hope I make sense?</p>
    <p>Thanks for any help offered...</p>
