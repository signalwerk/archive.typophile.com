      <p>A combining diacritical </p>
      <p><a href="http://unicode.org/charts/PDF/U0300.pdf" title="http://unicode.org/charts/PDF/U0300.pdf">http://unicode.org/charts/PDF/U0300.pdf</a> </p>
      <p>should have zero width. You can locate that accent anywhere (with a plus or minus sidebearing value), but the character needs to have zero width. </p>
      <p>Spacing modifier characters </p>
      <p><a href="http://unicode.org/charts/PDF/U02B0.pdf" title="http://unicode.org/charts/PDF/U02B0.pdf">http://unicode.org/charts/PDF/U02B0.pdf</a></p>
      <p>should have their natural width, so they appear right when used in a word -- an example, not from the list of "accents," is the "raised comma," as is sometimes used for a romanized hamza, which is properly U+02BD, not an "apostrophe," U+2019. The two different characters will likely need a slightly different width, and different kerning.</p>
      <p>Same with different uses of "accent" characters, such as the "acute." As I said, you will find the same glyph in several places, but they are different characters, and need to be spaced for that character's proper use.</p>
      <p>Or, maybe you are asking about "what's the best width so I don't have to do as much work?" But how much work you have to do to get the accent right on precomposed characters is your problem (i.e., the type designer's problem). Not a proper excuse for mucking up the character's widths.</p>
