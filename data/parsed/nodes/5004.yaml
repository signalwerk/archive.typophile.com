    html: "<p>Christian/James <br> <br>I'm in for a series on type design using Font Lab. Topics that would be of interest to me would include: <br>1. Drawing in Fontlab for Illustrator Junkies <br>2. Encoding/Unicode explained <br>3. Using mulitple master in FontLab <br>4. Tips &amp; tricks for spacing/kerning a font (general/class-based) <br>5. Creating opentype features <br>6. The font header (what do all these dialogue boxes mean!!!  <br>How do they effect the way the font functions?? on macs, pcs?) <br>7. Exporting tips/tricks <br>8. Hinting done right <br> <br>What would be really cool is a several month series where the group starts in the design process, then moves into the technical side addressing the issues above. <br> <br>Probably ambitious maybe, but I don't know of a class in New York that addresses the technical side of things. Most are learn to draw and alphabet, not turn your alphabet into a font. Thanks for starting the dialogue. <br> <br>R</p>"
