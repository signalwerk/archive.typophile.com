    html: <p>"And once you've done the fonts, what apps actually still utilise MM. Adobe has dropped support for MM fonts some while ago. In fact a similar result can be achieved by extrapolating technology, as was used in Skia in the good old QuickDraw GX days. Easier too." <br> <br>Yes, QuickDraw GX used extrapolating technology. But that never caught on did it? as it was supported by only one (minor) third party software maker and market sales of the fonts themselves was virtually non-existant. Adobe actually was working on releases for the GX format but they were never released. Guess I find the example/argument a bit odd when comparing it to MM and its demise (after a near decade run, whether or not it received the support that was hoped for). I still use MM. And from what I understand it is supported by the latest Mac OS system version. Extrapolation technology would be great, yeah, yeah, yeah. Where is it? <br> <br></p>
