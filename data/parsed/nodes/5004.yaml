    html: <p>James, <br> <br>Thats really exciting. Forgive me if TDC already serves this in some capacity. to be honest I have been a rather negligent TDC member for the last year or so. I was kicking myself for having missed your Opentype lecture. <br> <br>I would find great value in a small group/class that focused on the design of type, particulary the technical side, although having a group to critique a work in progress is always helpful as well. I actually had tried this a couple of times with a small group of fellow designers, but I think it would benefit from having a structure. <br> <br>Having developed a number of font families now, while I've simultaneously been  figuring out Fontographer and now FontLab, I'm looking for help before I continue to set my uninformed or bad work habits in stone.</p>
