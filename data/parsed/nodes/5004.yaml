  html: "<p>We frequently get inquiries like this: <br>    <br>&gt;&gt; I was wondering if you know of any training for creating fonts. Either online courses or Instructor-Led. The only thing I have found  <br>is books. I was just wondering if there is anything else that is a little more hands-on.&lt;&lt; <br> <br>  Other than the workshops given at AtypI and TypeCon does anyone know of other places that are giving typography/typographic design courses that  <br>are not part of a bigger curriculum? Summer school courses? Adult Ed classes? <br>How about on-line courses - do any exist? <br> <br>Ted H <br>Fontlab</p>"
  html_clean: "<p>We frequently get inquiries like this: <br>    <br>&gt;&gt; I was wondering if you know of any training for creating fonts. Either online courses or Instructor-Led. The only thing I have found  <br>is books. I was just wondering if there is anything else that is a little more hands-on.&lt;&lt; <br> <br>  Other than the workshops given at AtypI and TypeCon does anyone know of other places that are giving typography/typographic design courses that  <br>are not part of a bigger curriculum? Summer school courses? Adult Ed classes? <br>How about on-line courses - do any exist? <br> <br>Ted H <br>Fontlab</p>"
