    html: <p>Wow, <br> <br>do you still want to do MultipleMasters???? I gave that up in 1996 after having done a 1-Axis and a 2-Axis using the then avant-garde FOG 3.5. Whilst MM ist a great idea, it is also a particular pain in the a*** to do. Trust me, I've been there. And once you've done the fonts, what apps actually still utilise MM. Adobe has dropped support for MM fonts some while ago. In fact a similar result can be achieved by extrapolating technology, as was used in Skia in the good old QuickDraw GX days. Easier too. <br> <br>Bruno Maag <br>Dalton Maag Ltd</p>
