    html: <p>Ted,  <br> <br>Not sure about where you or your customers are asking about. But in NYC there is a series of classes organized by the Type Directors Club, called the Masters Classes. Every 4th Thurs of the month, $25 for TDC members, $40 for non members. <br> <br><a href="http://www.tdc.org/events/tdcmasterclass.html" target="_blank">http://www.tdc.org/events/tdcmasterclass.html</a> <br> <br>Currently they are taught by Ilene Strivzer of The Type Studio. <br> <br>I have not taken the classes myself, as I understand they are more focused on the use of type than on the design of type. I am  a user of FontLab, teaching myself with the manual, and I also would be interested in a class that focused a bit on the philosophy of type design but more on the practical aspects of using yours and others software. <br> <br>Perhaps I could urge you to contact the TDC or other like organizations to perhaps sponsor classes or workshops, dealing with FL.</p>
