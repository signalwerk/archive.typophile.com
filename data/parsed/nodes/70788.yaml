      <p>I know the <a href="http://www.getty.edu/art/exhibitions/tango_with_cows/" rel="nofollow">Getty facsimile</a>, and I find it inferior to <em>ImWerden</em>’s. Anyway, there exists one monograph, <em>Русский типографский шрифт. Вопросы истории и практика применения</em>, by Abram Shitsgal, devoted to the history of Russian printing type. Its second edition was issued in 1985.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/1985_Shitsgal-Russkii_Tipografskii_Shrift_4940.jpg"></div><br>
      Russian types of late 19th–early 20th centuries are discussed, rather briefly, in Chapter 9 (pp. 163–176). The good news is, it has a decent ‘further reading’ list at the end (pp. 245–252).<p></p>
