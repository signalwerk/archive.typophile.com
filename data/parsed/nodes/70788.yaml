    <p>Hello, I'm working on a visual translation of a Russian Futurist book—Tango with Cows—and so I need roman equivalents of the cyrillic used in the book. For one of the cyrillic faces I have a specimen of a matching roman face printed on coated paper. I'm seeking advice on how best to digitize it. I'm pretty sure the face hasn't been digitized but if it has been, this is somewhat of a moot point.</p>
    <p>Here are some factors:</p>
    <p>1. I'm mostly interested in this as part of my larger project, so I am not that concerned with making a font good enough to license.<br>
    2. I'll probably only need upper/lower case, a few numerals and a question mark.<br>
    3. I'm planning on making photopolymer plates to print the final piece, so ideally I'd like a digitization of the shape of the metal type, not the ink on paper. The coated paper helps in this regard to lessen ink spread, and I'm planning on doing some tests to understand more precisely what happens in the bezier curve—&gt;plate—&gt;ink on paper process.<br>
    4. The specimen I have was printed by me from metal type not issued by the manufacturer, so the type is actually somewhat worn. This isn't necessarily an issue because the type used in the original was also somewhat worn (I think) and definitely not printed so carefully, but I'd like to avoid the cliché of multiple identical instances of broken type. I'd also like to avoid things looking too obviously digital.<br>
    5. I'd be willing to spend some money to save time and/or for a better job, but I wouldn't have a huge budget, I have some bezier curve drawing experience but not a huge amount, I do have access to fontlab, but I haven't used it.<br>
    6. I have a 3200 dpi scan of the specimen, it's 30 point Antique Extra Condensed</p>
    <p>and options I've been thinking about:</p>
    <p>1. Just plugging away myself, using either Illustrator, Fontlab, Inkscape with Spiro.<br>
    2. Hiring some fly-by-night masking service to get the outlines mostly done, then tweaking it myself.<br>
    3. Hiring an actual type designer, what would be a reasonable price to pay? I could also trade services, in case someone wants any letterpress printing done.</p>
