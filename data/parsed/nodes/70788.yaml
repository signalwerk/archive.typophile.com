    html: |-
      <p>There is also a good facsimile on the Getty's website:<br>
      <a href="http://archives.getty.edu:30008/getty_images/digitalresources/russian_ag/pdfs/gri_2567-605.pdf" title="http://archives.getty.edu:30008/getty_images/digitalresources/russian_ag/pdfs/gri_2567-605.pdf">http://archives.getty.edu:30008/getty_images/digitalresources/russian_ag...</a></p>
      <p>There are actually fewer than it might appear at first glance, I've actually made a concordance of all the glyphs in the book, and sorted them all into typeface families and then individual fonts. There are about 10 families most (if not all) of them are Cyrillic equivalents of Berthold faces. There are a lot of sizes and weights of Akzidenz, and of Berthold Latinskaya derived from Berthold Lateinisch. The rest are all display faces, and most are only in a couple sizes except for the cyrillic of Herold Schmal. It was a lot of fun deconstructing all the type as it was as though I was looking into a small print shop in Moscow, a hundred years ago.</p>
      <p>Do you know of any good book for information about Cyrillic types, typography, or the printing industry at that time, 1914? Even if they are in Russian, any information would be helpful.</p>
