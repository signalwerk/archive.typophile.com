  html: <p>I applied to the Type Media program for this fall, but haven't heard anything back yet after I sent my portfolio a few months back. Hopefully I'm not getting sent anything by USPS, because the last letter I got from Germany sent through the post office took about 5 months to reach me. I know when I've posted on Typophile before, some students and faculty from TypeMedia have replied, so I was wondering if anyone there could tell me where they're at in the process of choosing students for the 09/010 course, and if anyone that applied for the 09/010 TypeMedia course has gotten a yes or no regarding their acceptance. I'm in the U.S., so it would be be very helpful to know soon. Thanks!</p>
