      <p>I just make classification folders inside my Windows' Explorer (using standard classifications, plus some of my own). Then I try to fit in my fonts according to the category I think is appropriate. At least I get to find my desired fonts in a very quick fashion. As you have already read, font classification is quite elusive and definitely not exact; just as with music.</p>
