      <p>There sre so many fonts being made by so many different<br>
      kinds of people that large groupings are hopeless. So I'm<br>
      with Nick on this - break things down to specific formal<br>
      characteristics and you can sink your taxonomic teeth<br>
      into any font. It does mean however that: you have to do<br>
      a lot more work; and you need to try to assign meanings<br>
      to each characteristic - for example: narrow ~= elegant<br>
      and wide ~= friendly.</p>
      <p>hhp</p>
