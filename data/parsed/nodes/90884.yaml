    <p>My first post here, but I could use some community and insight.<br>
    I've run into a sticky problem.</p>
    <p>I do a lot of thinking and writing about web fonts and web typography.<br>
    My audience is primarily people who are interested in learning how to use type on their website/blog, and are not type experts (even if they took some typography classes in college, they may be feeling rusty and in need of help).</p>
    <p>I find classifying fonts for non-experts is really hard. (Duh.)</p>
    <p>When it comes to serif fonts, I can show them Venetian, Old Style, Transitional, Modern, Slab. I can talk about how changes in materials, techniques, and social/cultural thinking lead to shifts in the forms of letters.</p>
    <p>Great.</p>
    <p>Then we get to "contemporary" fonts (which is a crappy classification, because next year it's not contemporary anymore. grrrr. I already have to explain that Modern fonts are not Modern and Egyptian fonts are not from Egypt. Let's not make that mistake again, please.)</p>
    <p>Most fonts designed since the advent of the mac -- even the ones that are NOT display fonts, but legible, lively text fonts -- do NOT fall neatly into one of the above categories. Even Georgia, which we classify as a Transitional font is, well, quite different from the earlier transitional typefaces. </p>
    <p>This is causing a problem (I think it can't just be me) for those of us thinking about, talking about, using web fonts. Why? Because there are a lot of non-type people suddenly looking for fonts and using type! For example, if you go to TypeKit, they categorize their serif fonts by "serif" and "slab serif" -- which makes it really hard to find a serif font because there is so much to wade through.</p>
    <p>I want to teach people they can use font classifications to help them "picture" a general "kind" of font they are looking for. (For example, if they were looking for a car, they wouldn't just look for a car. They'd look for a sedan, hatchback, station wagon, convertible, and so on.) </p>
    <p>Classification systems can help a designer narrow her search, give voice to what she needs, what she is looking for.</p>
    <p>But I've done a pretty exhaustive search, and can not come up with another category already in use that means something like: mixes and matches aspects of earlier periods in font design, doing so in a beautiful, legible, useful new way.</p>
    <p>I considered using Elegiac for a while, since Bringhurst uses that as a subclass for postmodern fonts. But Elegiac means "resembling an elegy; expressing sorrow or lamentation" and I think most type designers are not expressing sorrow for earlier periods when designing their fonts/typefaces... I think they are creating new compositions, piecing together approaches (parts, shapes, transitions) in new and beautiful ways.</p>
    <p>So I've been kicking around adding a new classification to my vocabulary.</p>
    <p>Thinking maybe something like "compositional serif" or "composed serif" (something that could also be applied to sans serif if needed) but neither of these feel right.</p>
    <p>I've also thought of sort of cramming these fonts into "Transitional" since Transitional fonts are more about the "idea" of a letter, not as tied to calligraphic forms as Old Style and not as specifically defined as Modern fonts. But frankly, this just feels *wrong.* </p>
    <p>Though maybe that's because I see Transitional as a point between two other styles, and I should let that thinking go and instead embrace it as an approach to type design that is valid as a separate entity from Old Style and Modern?</p>
    <p>So I'm wondering. Is anybody out there already thinking about this? </p>
    <p>Have you created your own language for classifying these "don't quite fit the five families of type" serif fonts... but NOT in a minute detail kind of way? As a type geek, I can totally wrap my mind around a classification system with 50+ ways to subdivide serif fonts alone. But I'm looking more for a general classification. Something that would help a blogger or an in-house web designer think about general categories of kinds of fonts.</p>
    <p>Any ideas?</p>
