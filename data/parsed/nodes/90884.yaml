      <p>Laura,</p>
      <p>As a writer with the same problem, my advice is to give up.<br>
      Conceptually, any descriptions you offer will, to the average joe or jane putting together a web site, last about a nanosecond, if that long.<br>
      Just put together a cheat sheet with a sample of the basic classifications and leave it at that. Over time, using the cheat sheet, some differences bewtween the main classifications will begin to sink in.<br>
      The selection today is so large, finding just the right font is and will remain largely a matter of persistence and serendipity. Unless you want to imitate an existing design, it's mostly a matter of trial and error. Classifications won't help with a darned thing.</p>
      <p>My 2 cents.</p>
      <p>Rich</p>
