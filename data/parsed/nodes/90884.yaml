      <p>Historical (“phylogenetic”) designations are not much use, given the sheer number of hybrids, coupled with the vagueness and multiplicity of meanings that has emerged for foundry-generated keywords. Foundries will come up with a dozen keywords for their types (to help potential shoppers gravitate in their direction) and throw in popular terms such as “modern” indiscriminately.</p>
      <p>More precise is a taxonomy that is strictly based on physical features such as:</p>
      <p>x-height<br>
      stroke contrast<br>
      curve-shape<br>
      serif kind</p>
      <p>And so on.<br>
      <a href="http://en.wikipedia.org/wiki/PANOSE" title="http://en.wikipedia.org/wiki/PANOSE">http://en.wikipedia.org/wiki/PANOSE</a></p>
