    <p>Recently, Andi Emery started a topic asking if teaching <a href="http://typophile.com/node/14469" rel="nofollow">traditional copyfitting</a> methods to graphic designers had value anymore. This is a question of particual interest to educators who want to improve typographic awareness in students.</p>
    <p>Given the fact that typography is a minor sub-set in most general graphic design programs, it sparked an interest in exploring types of exercises that might stimulate creative and cognitive abilities useful to budding typographers and type designers. </p>
    <p>The topic of type education already exists under the heading of <a href="http://typophile.com/node/694" rel="nofollow"><strong>Typographic Edumacators</strong></a> within the <em>Special Interest Groups</em> area of Typophile. This topic area is sadly malnurished having only two replies to an important topic started by Nathan Matteson over two years ago! All of the real dialogs related to education are actually peppered throughout the entire Typophile forum.</p>
    <p>'Nuf said.</p>
    <p><strong>If Typography was a Video Game</strong><br>
    This is a thought that came to my mind after participating in Andi's topic. No, I'm not advocating a game blasting Comic Sans with laser guns, or a Sim game trying to pickup type hotties at a party. I'm not even suggesting an "educational" game a la Sesame Street or Nick Jr. (though they're wonderfully useful).</p>
    <p>I'm thinking more in the line of simple, engaging and hopefully stimulating exercises that might trigger higher cognitive and creative activities in the mind of students. Obviously this doesn't need to take the form of a video game, but the only reason it came to mind is that all designers are now trained in front of a screen.</p>
    <p>Here goes my first shot:</p>
    <p><a href="http://enchantedmind.com/puzzles/tangram/tangram.html" target="new" rel="nofollow"><strong>Tangram</strong></a><br>
    Is this ancient Chinese game (or variant) useful in developing a heightened sense of notan?<br>
    Can it help designers to create a plethora of recognizable shapes using only a fixed set of elements?</p>
    <p>Description (From Answers.com)<br>
    Tangram (Hanyu Pinyin: Cantonese: ch'i ch'ae pan; literally Seven-Board of Cunning) is an ancient Chinese puzzle.<br>
    It consists of 7 pieces, called Tans, which fit together to form a square:<br>
    5 triangles of various sizes,<br>
    1 square<br>
    1 parallelogram<br>
    The objective is to form a given shape with seven pieces.<br>
    The shape has to contain all the pieces, which must not overlap.</p>
    <p>---------------------------------------------------------------</p>
    <p>I can already see that exploring helpful tools and methods of developing typographic sensibilities will be a slow and laborous mission, as it has taken me a considerable amount of time just to get this post up. Hopefully a few of us can collectively hatch up some worthwhile exercises. I've got a few more simple activities to share, but it takes time to really think them through.</p>
    <p>Look for the "Typography Edumacators" topic area to come alive again.</p>
