      <p>Excellent suggestion, Norbert. The real strength of tangrams, I believe, is in its making people aware of <strong>possibilities</strong>. I have great admiration for the more skilled practitioners of the art, who seem able to coax an immense range of images out of what is really a rather limited tool set.</p>
      <p>Another exercise which might prove helpful in developing typesense would be a game which has rules, but they are not spelled out at the beginning of the game: the purpose of the game is, in fact, to discover the rules. Ideally, these rules could be expressed graphically. Just a thought...</p>
      <p>==============</p>
      <p>Yes, I'm old. So what?</p>
