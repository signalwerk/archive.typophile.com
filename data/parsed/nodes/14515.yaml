      <p>Hmmm. I guess I should apologize to those whom my 'Edumacators' offended. 'Twas meant to be light-hearted and such, but those things are wont to back-fire on occassion. Feel free to change the name of the Special Interest Group and I promise I won't be offended.</p>
      <p>In any case, it's heartening that the whole dialogue among teacher-types is thriving on Typophile these days. More so that the days of yore anyway. I haven't been as active of a participant as I used to be -- teaching's been taking up more and more of my time -- but I hope to make some more time to participate in this sort of discussion. </p>
      <p>Although, quite frankly, I'm conflicted as to the idea of turning typography too much into a 'game'. Students today seem completely different than when I was in college (a mere 10 years ago), but I buck at the thought of 'coddling' them. I'm sure it's not coddling, it's just change, but so much of what I hear about typography classes (not on this board, mind you) sounds like either (1) teachers obsfucate things to make their practice seem overly esoteric/important, or (2) the classroom becomes a playpen that panders to students' lack of attention.</p>
      <p>Unfortunately, in the meantime I have to prepare for class :-P so ta-ta-for-now.</p>
