      <p>&gt;<em> If typography "were" a video game.</em></p>
      <p>John, I kept repeating "were" in my mind and did not have a full understanding of why. Thanks.</p>
      <p>matteson,<br>
      my take on exploring this area is slightly different than many of the design curriculums I am aware of. My personal intent is to find methods, tools, or exercises that MIGHT aid students of general graphic design programs to step through the portal of typographic awareness.</p>
      <p>In other words, my own personal interest is to help "wake up" and heighten those mysterious powers of super type awareness which lay dormant in only a handful of students. </p>
      <p>I have asked myself many times, why can some people look at a full page of straight text and see the continuity or irregularities of type color, the <em>dazzle</em> or <em>spikeyness</em>, the need for an addition point of line spacing, or understand why the column should be extended by 4 picas, and finally decide that one vendor's version of Cheltenham should be replaced by a slightly different version to feel right.</p>
      <p>These are abilities I have seen in very few graphic designers. If playing Tangram or Tetris during lunch helps to build these awarenesses, then I'm all for them.</p>
      <p>Again, I don't want to build "games." I want to find out if there is any sort of activity, on screen or off, which can help raise that awareness. It seems a dumb analogy, but I keep remembering the scenes in <em>Karate Kid</em> where the student develops exceptional blocking abilities by waxing cars using only two specific movements of <em>Wax on</em> and <em>Wax off</em>.</p>
      <p>I immensely respect the expertise and efforts of the many qualified and fully trained educators who build knowledge and train their students in design and typography.</p>
