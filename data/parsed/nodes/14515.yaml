      <p>William,</p>
      <p>The "building a character" exercise would be a much better approach than the old obligatory "comping headlines" that many primers have. My students (and I) found no value other than becoming familiar with the character forms.</p>
      <p>Developing additional characters from existing ones is much more engaging, challenging and in the long run can add to the student's understanding of letterform structure.</p>
      <p>Andi,<br>
