    <p>I'm making a logo for a Mexican food delivery service that caters to tourists.</p>
    <p>I attached some W.I.P's.</p>
    <p>She actually already approved the 2nd attachment. However, I didn't try many variations since it was a rushed logo but I decided to make some today.</p>
    <p>I definitely like the 'V' more in the 2nd attachment but I like how more of the letters touch the baseline, especially the 'R', in the 1st attachment.</p>
    <p>What do you'll think?</p>
    <p>-btw, right now I'm leaning towards #2 in attachment 1</p>
