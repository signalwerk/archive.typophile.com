    html: |-
      <p>You'll probably need to provide more information on what sort of reordering you are trying to achieve. Are the relevant glyphs adjacent or nonadjacent? How long are the glyph strings involved? That sort of thing.</p>
      <p>Note also that AFAIK InDesign doesn't actually implement all of the GSUB types supported by AFDKO 2.5.</p>
      <p>André</p>
