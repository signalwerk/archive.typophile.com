  html: |-
    <p>I've tried several different approaches to effectively reorder glyphs, mostly by using chaining contextual substitutions but I've had only partial success.</p>
    <p>Rather than explain the different methods I've tried, is there someone who has done this successfully and can give me an example of how to do this?<br>
    I'm using the latest version of AFDKO (with full support for all GSUB types) under OS X 10.4.11 and testing in InDesign CS3.</p>
