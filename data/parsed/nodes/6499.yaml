    html: <p>In fact, it was the very first Sutnar's retrospective exhibition in Czech Republic. And yes, it was quite successful with a great media support - every newspapers and weekly magazine reviewed it. The curator, Iva Knobloch, had been preparing it for five years. I hope that ATypI Prague Conference attendees won't miss an opportunity to watch her talk on Sutnar! She is really an expert in Sutnar's life and work. <br> <br>Pavel</p>
