    html: <p>The catalogue is in English and published by the Argo publishing house in Prague. The ISBN is 80-7203-515-0, I guess it should be available internationally. <br> <br>I visited the exhibition in the <a href="http://www.nmn.de/">Neues Museum Nürnberg</a>. The exhibition there is very nicely done and I enjoyed it very much. I�d say about half of the exhibition deals with the graphic work of Sutnar and the other half displays products designed by him. The only complaint I have about the exhibition in Nürnberg is the guided tour I took -- the guide obviously had not much interest in typography and sometimes even referred to it as "typology".</p>
    html_clean: <p>The catalogue is in English and published by the Argo publishing house in Prague. The ISBN is 80-7203-515-0, I guess it should be available internationally. <br> <br>I visited the exhibition in the <a href="http://www.nmn.de/" class="link-external">Neues Museum Nürnberg</a>. The exhibition there is very nicely done and I enjoyed it very much. I�d say about half of the exhibition deals with the graphic work of Sutnar and the other half displays products designed by him. The only complaint I have about the exhibition in Nürnberg is the guided tour I took -- the guide obviously had not much interest in typography and sometimes even referred to it as "typology".</p>
