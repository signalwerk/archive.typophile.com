    html: <p>This seems to be a script style I haven't collected yet. The closest I can find is Letraset's <a href="http://www.myfonts.com/fonts/letraset/hand-drawn/hand-drawn/testdrive.html?s=THE+GINGERBREAD+MAN&amp;p=36" target="_blank">'Hand Drawn'</a>. Flattening/widening would make it look closer, I think. <br> <br>This leads me to think this is either custom lettering (easy &amp; cheap to do for handprinted styles) or a freeware font that could come from anywhere.</p>
