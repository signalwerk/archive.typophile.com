    html: |-
      <p>I also use {calt} for ligature like situations.  I set up classes that contain each category of glyph for substitution purposes and replace the regular f with one of the alternates.</p>
      <p>	sub f' @idicrt by f.alt.d;<br>
      	sub f' @i_stem by f.alt.i;<br>
      	sub f' @L_stem by f.alt.L;<br>
      	sub f' @f_stem by f.alt.f;</p>
