    <p>Hi everyone, I'm currently making a font with as many ligatures as possible, the combinations are endless, but I still want them to be usable. </p>
    <p>So I was reading a very old topic about the 'ffj' ligature. And thought: That is completely useless. </p>
    <p>Or is it? </p>
    <p>Now I am really doubting to put in the 'ffj' ffb' 'ffk' 'ffh' in. They look nice, but:</p>
    <p> - in what language are they actually used?<br>
     - in what fonts are these ligatures included? (and why)</p>
