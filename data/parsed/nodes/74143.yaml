    html: |-
      <p>I do it along these lines (though I'm doing Arabic fonts):<br>
      * make an alternate f and i glyphs (or any other ligature components) that to be combined together<br>
      * have single substitution table (not attached to any feature) that substitutes each component by its alternate glyph<br>
      * a calt lookup would then use the context [first group][second group] and apply the defined substitution lookup to each context position.<br>
      * if special glyph positioning is needed (moving glyphs closer, up or down) I use anchor positioning</p>
