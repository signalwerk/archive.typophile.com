    html: |-
      <p>In some fonts, pandering to discriminating typographers, I include the "extra" ligatures ff, ffi, ffl, fj, and ffj. However, I don't include ligatures for fb, ffb, fh, ffh, fk and ffk, because these lack typographic cachet. </p>
      <p>Nonetheless, I do consider the possible collision of "f" with a following ascender, and design it, and the ascender, with that in mind.<br>
      Often, some positive kerning is required -- but that's not too heinous, because it occurs between syllables (as can be seen from the instances cited above).</p>
      <p>In other fonts, rather than ligatures, I have made an alternate, overlapping form of "f" specifically to precede ascenders, this activated by a contextual OpenType substitution.</p>
    html_clean: |-
