    html: |-
      <p>There seems to be a very interesting difference between the English and the German language regarding the use of ligatures.</p>
      <p>The German language is (in)famous for allowing the merging of any number of nouns (and other grammatical units) into compounds of theoretically infinite length like <em>Rindfleischetikettierungsüberwachungsaufgabenübertragungsgesetz</em> (beef labeling supervision duties delegation law). Hence many combinations of consonants are conceivable.</p>
      <p>The English language, too, knows compounds (like the above mentioned cliffhanger), but they're neither arbitrarily combinable nor (usually?) made of more than two words.</p>
      <p>Now, while in English, you would seemingly use the ffh ligature for the word cliffhanger, in German, you would not. Were cliffhanger a German word, we'd use the ff ligature for cliff, but we wouldn't ligate the cliff and the hanger. We'd use the st ligature in <em>Muster</em> (sample), but not in <em>Mustopf</em> (which could be written as <em>Mus-Topf</em>; a <em>Topf</em> for <em>Mus</em> = a jar for pulp or puree). It's not a <em>Mu-Stopf</em> or a <em>Must-Opf</em>, but a <em>Mus-Topf</em>. Not a clif fhanger or a cliffhan ger, but a cliff hanger. The omission of the ligature is supposed to mark the word joint.</p>
      <p>Another example: the fl in <em>Kaufläche</em> (<em>Kau-Fläche</em> = chewing surface) can be ligated, the fl in <em>Kaufleute</em> (<em>Kauf-Leute</em> = merchants) can't.</p>
      <p>The practise to ligate only within morphemes and not over grammatical joints is clearly of linguistic, not of aesthetic nature. Not ligating the ff and k in <em>Suffkopp</em> (bingehead) may make the compound of <em>Suff</em> and <em>Kopp</em> more easily recognizable as such (for what it's worth), but the resolution of the aesthetic problem of the f and k meeting by using a ligature is made impossible. I'm undecided about whether this rule is a good one or not, it's both beneficial and disadvantageous. I think it depends on whether you see the benefit of ligatures in making text more readable, more pleasurable to look at or more linguistically concise (although, of course, these aspects are intertwined).</p>
      <p>An exeption from the rule are suffixes beginning with an i: we'd use the ffi ligature in <em>fluffig</em> (<em>fluff-ig</em>, fluff-y), whereas suffixes beginning with an l (like in <em>stofflich</em>, <em>stoff-lich</em> = materi-al) do not depart from the rule (i.e. no ffl ligature in <em>stofflich</em>). Don't ask me why; it doesn't seem to make sense to me. Nota bene: the ffl within a morpheme would be fully ligated.</p>
      <p>This is also the reason why we don't need triple ligatures like fff or ppp or sss, although words (only compounds) with three following identical consonants exist (after the 1996 spelling reform). An example is <em>Schifffahrt</em> (<em>Schiff-Fahrt</em>, meaning shipping or boat cruise; formerly spelled with only two f, but hyphenated to <em>Schiff-fahrt</em> at linebreaks): the <em>Schiff</em> and the <em>Fahrt</em> aren't ligated, hence ff-f.</p>
      <p>These rules are not absolutely binding; at least I don't know of any official reglement. They're what's considered good typesetting practise.</p>
      <p>BTW, I have a very hard time thinking of a German word that contains ffj <em>and is not</em> a compound of two morphemes.</p>
      <p>There are no such rules in the English language, right? Do similar rules exist in other languages?</p>
      <p>Jens</p>
