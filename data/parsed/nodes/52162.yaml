      <p>I believe the saying comes from Frederic Goudy who once said "Anyone who would letterspace blackletter would steal sheep." Although it is commonly misquoted as "Anyone who would letterspace lower case would steal sheep."</p>
      <p>I can't remember why, I think someone gave him an award with letterspaced blackletter that he did not like.</p>
