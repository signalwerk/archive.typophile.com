      <p>From what I understand Goudy said that anyone letterspacing blackletter would be the kind of person who'd pull a Gill on the poor sheep.<br>
      As we don't use blackletter much these days and the reference to zoophilia would steal the focus from the typographic lesson to be learned, a cleaned up version is now the common one.</p>
