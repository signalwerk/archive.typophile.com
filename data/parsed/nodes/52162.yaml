    <p>Hi everyone,</p>
    <p>I have a question concerning the proverb "Stealing sheep".<br>
    English is not my mothertongue and this could be the reason for my ignorance.<br>
    I have tried to pick up the meaning of this proverb, that I have seen used a few times now. i.e. in the title of Erik Spiekermanns book 'Stop stealing sheeps and find out how type works'. And in Robert Bringhursts book 'Elements of typographic style' -(letterspacing is like stealing sheeps). In my confusion I have searched on Google to find an explanation, but without luck. That's why I have come to you guys!</p>
    <p>Can anyone help me explain this apparently well-known (typographic?) proverb? </p>
    <p>Thanks in advance!<br>
    Jacob</p>
