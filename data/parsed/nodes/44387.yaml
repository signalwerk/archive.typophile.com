      <p>Thank you all for trying to help. I have seen the files and found that the company that does the printing does not rip the files for trapping. They have left it up to my client to do. Strange how the industry has changed so much. I guess all the professionals have retired.</p>
      <p>The problem was that the photoshop document had display/logo type in it and needed a Trap of 2. (It only was at 1) That appears to remove the halo. </p>
      <p>If you'd like, when we get the proof back, I'll gladly update you.</p>
