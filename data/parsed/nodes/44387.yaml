      <p>You can't generate overprinting from a PS file to my knowledge (although multiply is pretty close). Maybe that is what they are complaining about. But the only reason they would complain is if they couldn't hold register on their plates. It's on them Jackie no doubt, but that still doesn't solve the problem.</p>
      <p>Could you get the same effect by placing the title in ID? Then you could set it to overprint. Of course if the title was white that would be a HUGE mistake… -:)</p>
      <p>Is the title a spot color by any chance?</p>
      <p>I also don't quite understand that the printer gets to tell you what program to generate a PDF with. It really shouldn't matter. Are they in love with CID encoded fonts or something?</p>
      <p>pbc</p>
