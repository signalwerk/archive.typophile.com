      <p>Hi jackie<br>
      usually its the printers job to get the trapping sorted. which means<br>
      you just export as a pdf from indesign or you print to postscript and<br>
      use distiller to do the conversion to pdf.<br>
      The printer should have the ability to trap your pdf file with special<br>
      trapping software (heidelberg's supertrap).<br>
      If your printer is not able to provide this service, well change printer.<br>
      or to get around it set the trapping yourself in indesign.</p>
      <p>indesign, under window, output, trap presets</p>
      <p>double click the default settings<br>
      tick trap images internally, click ok.</p>
      <p>Print to postscript as usual. But under output change the setting<br>
      from CMYK to in-rip separation.<br>
      Also under output change trapping to application built-in</p>
      <p>now hit print and distill the ps file with pdf-x3 settings.</p>
      <p>voila...a trapped file.</p>
      <p>the standard trap setting in indesign will trap indesign<br>
      text and elements. indesign text and elements to<br>
      placed image files. It won't trap illustrator files internally<br>
      or to indesign text and elements.</p>
      <p>hope this helps (or better makes sense)</p>
