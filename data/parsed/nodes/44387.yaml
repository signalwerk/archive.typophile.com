      <p>The days when designers needed to know how to trap should theoretically be gone.  It's the printer Jackie, if you have no choice there are options here but ultimately you should either change printers or have a dialogue with them as to what exactly the problem is. Probably the former, not the latter…</p>
      <p>For newsprint sometimes I will place a small 100k stroke on a white object printing on a rich black background just in case - that's about as far as I take it.</p>
      <p>A printer who is doing their job will trap your files accurately for their press and the media they are printing on.</p>
      <p>Best of Luck!</p>
      <p>pbc</p>
