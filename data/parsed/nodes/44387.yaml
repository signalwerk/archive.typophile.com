      <p>Any RIP will trap any file (eps, pdf, ps, etc), and it will trap all the vector. Generally when you rip a composite file (eps or ps) trapping doesn't apply: The rip will make the decision for you in a pre-setted system; some others you can actually edit the trap.</p>
      <p>Basically it is like this: vector will be trapped by the rip; Images are not trapped, unless you want it to be trapped (psd does that).</p>
      <p>Jackie T, the important thing here is realizing the limitations some systems have and, you as a designer should consider such problems with files you produce. The more complex your artwork is, the higher possibilities for problems.</p>
      <p>When working with pdfs, pick the PDF-X1a - trapped or untrapped. Ah, Quarkxpress delivers excellent eps, ps files. The trick is distilling them to your needs: If the printer says "files has to be in cs3":</p>
      <p>RUN f-a-s-t!</p>
      <p>André</p>
