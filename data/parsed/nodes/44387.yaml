      <p>The printer should be able to trap pdfs. I think for me that there maybe some problem printing the indesign file. Some printers don't have a top notch prepress systems and, keeping up with the technology curve demands a lot of upgrading...<br>
      The pdf-x3 is a is a good option. But if you consider that there maybe a problem with the printer's workflow, you could try making a PDF-X1a which is a pdf level 1.2 for Acrobat 5, and it should work even with legacy systems. Print from indesign to a ps file and distill as a PDF-X1a. That may help.<br>
      As to apply trap in the pdf the supertrap application is great, question is, the printer has that?<br>
      Applying in-rip separations just work if the printers workflow has a top notch system.</p>
      <p>I am inclined to think the PDF is the best option (X1a).</p>
