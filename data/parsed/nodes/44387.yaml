    <p>I have been doing a western series for more than 10 years. The title type is placed on the graphic into photoshop. We never had any problems. A few months ago (you may remember my crying about the printer demanding the files be done in InDesign rather than Quark) the files were going out as requested by their printer. </p>
    <p>The title type in the last two month print jobs doesn't seem to be trapping - there is a white halo around the type. The printer says it's my file preparation - but outside of the fact the pdf is made in InDesign to their specs -- and not Quark) -- there is no other change. It is still front cover in photoshop. I think the printer is not trapping properly on press... the old catch-22.</p>
    <p>Can anyone help and shed some light on this?</p>
    <p>Thank you in advance,</p>
    <p>Jackie</p>
  html_clean: |-
