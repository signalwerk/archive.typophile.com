      <p>Thanks a lot for all the links.  You all have been very helpful indeed.</p>
      <p>I think I'm going to use FS Contemporary from Educational Fontware.  Despite Educational Fontware's less-than-ideal ligature situation (<a href="http://www.educationalfontware.com/FAQs.html" title="http://www.educationalfontware.com/FAQs.html">http://www.educationalfontware.com/FAQs.html</a> ... scroll down to "How do you get the cursive to link?"), the glyphs are exactly what I need.</p>
      <p>Thanks again.</p>
