  html: |-
    <p>I'm making an alphabet book for my son.  He attends Montessori school, where they introduce the alphabet using lowercase, cursive letters.  I'm looking for a typeface that is reminiscent of the lettering that used to be in the cursive workbooks I used as a kid.</p>
    <p>Here is a good example:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DK_6154.png"></div><p></p>
    <p>The "practice strokes" that start letters such as a, o, and q are important.  My son's school will use lettering that has those strokes.</p>
    <p>Thanks for your help.</p>
    <p>Nick</p>
    <p>P.S. I plan to self-publish the book, too, so I can't use typefaces with personal-use-only licenses.  Thanks again.</p>
