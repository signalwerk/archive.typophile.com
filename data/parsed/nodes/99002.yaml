      <p>I have to say, even if I know it is hybrid, that when I'm looking at this font I'm confused. I can see some concepts in it, but no one is actually the main one. Some quick ideas:</p>
      <p>- /a and /s with large aperture - /c and /e with small aperture , why not the same?<br>
      - /t without tail is not gonna work in small, can be confused with /lslash<br>
      - /h, /n, /m, /u and /b, /d, /p, /q are usually with same idea<br>
      - /s seems the upper part bigger, usually it's reversed<br>
      - /S weird middle part</p>
      <p>- These small serifs are there why? Do you have any system for putting them on the letters? Why is on the stem of /k present and on the tail not?</p>
      <p>Can you put some texts here?<br>
      Jan</p>
