    <p>This is the first real font I've ever designed and this is my project for my diploma. It's planned as a font for headlines and sub-headlines in a culture magazine (It doesn't necessarily have to work under 14p). I know that it has small serifs, but I decided to post it into the sans-serif forum nonetheless since I don't really know where to post it otherwise. It's not a serif font because there are only serifs at the bottom and not on every glyph.</p>
    <p>I can't present much, I've just done the lower cases, but I hope that I'm going to get some useful feedback here in what I'm doing right and what I'm doing wrong.</p>
    <p>I just probably also mention that these took me quite a while, so it's definitely something I scrapped together in one session. I also just noticed, as I was typing with it, that f, t and i and so on, appear to be a little too thin compared to the rest... But I'll leave it here for now.</p>
    <p><img src="http://img90.imageshack.us/img90/4271/font01500.png"><br>
    <img src="http://img825.imageshack.us/img825/4943/font02500.png"></p>
