    html: |-
      <p>Your /R and /P have very small bowls - they look the same as the top part of /B, where normally they're larger.  In the /R especially this results in an unusually long leg that looks awkward to my eyes.</p>
      <p>The upper counter in /A is also a bit cramped IMO.  </p>
      <p>The spines of /s and /S look a bit pinched in the centre; in most fonts this is optically the fattest part.</p>
