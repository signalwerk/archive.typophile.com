      <p>Thanks to those who have offer suggestions and help so far. The biggest issue I am running into is that these were either wood, metal, or hot-metal typefaces that were then printed on cheap newsprint. Some of them have been digitised, but not 100% EXACTLY like the original versions. </p>
      <p>So far, this is what I have found:</p>
      <p>SARONNI FAVOLOSO<br>
      Actual Typeface: Metropol designed by Aldo Novarese, released by Nebiolo in 1967<br>
      Best Digital Equivalent: Press Gothic Pro - <a href="http://www.myfonts.com/fonts/canadatype/press-gothic/pro/" title="http://www.myfonts.com/fonts/canadatype/press-gothic/pro/">http://www.myfonts.com/fonts/canadatype/press-gothic/pro/</a></p>
      <p>MOSER<br>
      Actual Typeface: Metal Helvetica Black?<br>
      Best Digital Equivalent: Neue Haas Grotesk Pro Display 95 Black - <a href="http://www.myfonts.com/fonts/linotype/neue-haas-grotesk/pro-display-95-black/" title="http://www.myfonts.com/fonts/linotype/neue-haas-grotesk/pro-display-95-black/">http://www.myfonts.com/fonts/linotype/neue-haas-grotesk/pro-display-95-b...</a></p>
      <p>FANTASICO<br>
      Actual Typeface: Condensed metal Helvetica? (this was the most difficult to match digitally)<br>
      Best Digital Equivalent: Helvetica Neue 87 Cond Heavy - <a href="http://www.myfonts.com/fonts/linotype/neue-helvetica/helvetica-87-heavy-condensed/" title="http://www.myfonts.com/fonts/linotype/neue-helvetica/helvetica-87-heavy-condensed/">http://www.myfonts.com/fonts/linotype/neue-helvetica/helvetica-87-heavy-...</a></p>
      <p>HA BATTUTO DI 343 METRI<br>
      Actual Typeface: Hot-metal Helvetica Condensed Bold Italic?<br>
      Best Digital Equivalent: Helvetica Pro Bold Condensed Oblique - <a href="http://www.myfonts.com/fonts/linotype/helvetica/pro-bold-condensed-oblique/" title="http://www.myfonts.com/fonts/linotype/helvetica/pro-bold-condensed-oblique/">http://www.myfonts.com/fonts/linotype/helvetica/pro-bold-condensed-oblique/</a></p>
      <p>Any additional suggestions or help is greatly appreciated.</p>
