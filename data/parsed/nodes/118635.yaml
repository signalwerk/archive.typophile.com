    html: |-
      <p>Thank you all! Custom, that's nothing to be sorry about Ryuk. It's proof that the better things don't come off-the-shelf.</p>
      <p>I absolutely love their design and brand ID. It's understated (except the size), but there's a warmth in the colours, in the shape of the letters, etc. </p>
      <p>Though it's all a bit more marketing than actual watchmaking genius, it works. Bill Clinton used to wear one back in the days, and maybe still does, and it seems the choice for young investment bankers. Since the case diameters are so large, the watches are highly visible, which makes them first choice for the nouveaux riches who like to show off. Today, even my barber uses one!</p>
      <p>Definitely not for me, except that beautiful table clock. But then, who needs tables clocks?</p>
