      <p>Thanks Ryuk for the explanation of Officine Panerai dial technology. My only remaining question is about what year did they introduce the design for these particular numbers.</p>
      <p>Many interesting font suggestions, but I now believe that none of them, including the Gotham Rounded numbers -- which are too narrow and have mid height waist lines -- capture the flavor of the numbers in the  Officine Panerai dial. Rather than picking and choosing number sets that are poor approximations, its probably easier just to make the numbers from scratch. For example:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/DHTPaneraiNumbersBetaSM_5998.jpg"></div><br>
      The numbers not shown on the dial, i.e. _0_, _4_, _5_, and _7_, are guesses based on the known numbers.<br>
      Don<p></p>
