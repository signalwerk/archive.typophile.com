    html: <p>Sorry Jean-Louis but I'm pretty convinced this one should be custom. Officine Panerai was an official supplier to the Regia Marina, the Royal Italian Navy, supplying watches and precision instruments. In the first decades of the 20th century Officine Panerai began experimenting intensively with luminous materials in an effort to make instrument dials, sights, and telescopic devices that could be employed reliably in the dark. The main specificity of their first model Radiomir is a 2 layer dial. Bottom disk is plainly coated with a zinc sulphide and radium bromide luminescent combination. Top one is a completely black stencil, cut out with the digits thus needing a specific stencil design.</p>
    html_clean: <p>Sorry Jean-Louis but I'm pretty convinced this one should be custom. Officine Panerai was an official supplier to the Regia Marina, the Royal Italian Navy, supplying watches and precision instruments. In the first decades of the 20th century Officine Panerai began experimenting intensively with luminous materials in an effort to make instrument dials, sights, and telescopic devices that could be employed reliably in the dark. The main specificity of their first model Radiomir is a 2 layer dial. Bottom disk is plainly coated with a zinc sulphide and radium bromide luminescent combination. Top one is a completely black stencil, cut out with the digits thus needing a specific stencil design.</p>
