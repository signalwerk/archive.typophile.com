      <p>Ryuk, I believe you, they look great! A bit oversized in my opinion, but you can always wear them on top of a shirt, like Gianni Agnelli used to do. My choice is a PP Nautilus, you can wear it with a wet suit or a tux, and more ergonomic on the wrist. What more does a man need? :)</p>
      <p>Thanks for all suggestions, including the aircraft clock post! </p>
      <p>It also reminded me of Engravers and the likes. I've been trying to use them, but with certain letter combinations they look very rigid and "dated". As is the case with my sketch on the right. Some of your suggestions might work better.</p>
