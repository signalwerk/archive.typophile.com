      <p>The lettering might have been based in part on Buffalo, a popular typeface in the early 20th century by the H.C.Hansen foundry:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/HansenCharsetSM_6718.jpg"></div><br>
      Virtually identical typeface sold in Europe as Kolonial. No digital.<br>
      Don<p></p>
