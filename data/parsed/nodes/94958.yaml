      <p>You'd probably already know it but <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/kozuka-mincho-pr6n/" rel="nofollow">Kozuka Mincho</a> and <a class="freelinking external" href="http://www.myfonts.com/search/ryo/" rel="nofollow">Ryo</a> (Text and Display) share also the same design for their latin parts. <a class="freelinking external" href="http://en.wikipedia.org/wiki/Myriad_(typeface)#Kozuka_Gothic" rel="nofollow">I've also discovered</a> the latin part of <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/kozuka-gothic-pr6n/" rel="nofollow">Kozuka Gothic</a> (sans-serif compagnion of Kozuka Mincho) was adapted from Myriad. Unfortunately, I don't know any serif compagnion for Myriad.<br>
      For what it's worth, the only one that comes to my mind when looking at this sample is <a class="freelinking external" href="http://www.myfonts.com/search/bookman" rel="nofollow">Bookman</a> (Light) or its recent revival by Mark Simonson called <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/bookmania/" rel="nofollow">Bookmania</a>.</p>
