    <p>Altered Ego Fonts announces the release of AE Prosperity, the first original script typeface released by Altered Ego®.</p>
    <p><img src="http://typophile.com/files/altered-ego-prosperity-preview.jpg"></p>
    <p>Originally commissioned in 2003, AE Prosperity (the typeface) is named after the schooner Prosperity, that sailed the high seas in 1779. The ship was granted a Letter of Marque to become an auxiliary of the navy by a young continental congress. Wıth 6 guns &amp; at twenty tons, she sailed for patriotism and profit. The schooner Prosperity was captained by Joseph Sooy, an ancestor of Brian Sooy, the principal designer of Altered Ego Fonts.</p>
    <p>Well suited for headlines, packaging and display applications, AE Prosperity will be a robust and versatile addition to your script library.  It’s purposefully design to infer the visual connections of letters for a hand-lettered feel. Some characters will connect, and others will guide your eye to the next letter form, making it highly legible.</p>
    <p>The contextual glyphs, alternate lower case glyphs and an extended set of alternate capitals makes this typeface as robust and as inspiring as her namesake and adapts to whatever winds may blow.  Prosperity is designed as a free-flowing calligraphic script, with a distinct and original hand-lettered feel for a spontaneous and historic aesthetic.</p>
    <p>Variations on this typeface have been used as small as private-label packaging, in books, on web sites and large-scale in trade show display applications.  It’s magnificent when enlarged!</p>
    <p>Contextual glyphs include variations on tt (short and longbar), t longbar, ll, cc and other characters.  Contextual features change ascender heights and descender styles.</p>
    <p>Alternate glyphs (set 1) include variations on b,d,f,g,h,l,o,p,r,s,t,y.  Alternate capitals (set 2) include a complete set of alternate upper case letters.</p>
    <p>In OpenType-aware applications, multiple variations of letter combinations can be achieved by selecting Contextual glyphs, and/or set 1 and set 2 from the Character Palette: OpenType: Stylistic Sets menu. Alternate glyphs and contextual characters will be available based on the OpenType support of your application.</p>
    <p>AE Prosperity™ is available exclusively in OpenType format.  It is the latest addition to the Altered Ego family of OpenType fonts, which include Veritas™, Verve™ and the Eclectic Series of icon fonts.</p>
    <p>For more information and to license AE Prosperity, visit <a class="freelinking external" href="http://www.alteredegofonts.com/prosperity" rel="nofollow">Alteredegofonts.com/Prosperity</a></p>
    <p>Altered Ego® is a registered trademark.  Altered Ego Fonts is a division of <a class="freelinking external" href="http://www.sooyco.com" rel="nofollow">Sooy+Co</a>, and all fonts are designed exclusively by Brian Sooy.</p>
