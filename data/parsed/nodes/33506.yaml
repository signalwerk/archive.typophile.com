      <p>I should have slapped myself into more wakefulness before I made my first response this morning and gotten down another source of info about Tempo: Mac McGrew’s book “American Metal Typefaces of the Twentieth Century.”</p>
      <p>There he shows several other styles of Tempo, and credits R H Middleton with the entire series design. McGrew also alerts me to the fact that I was “reading” my Umbra specimen wrong; it is not weighted as heavily as Tempo Heavy, being in fact closer to Tempo Light.</p>
      <p>I’ve always considered Umbra a far more successful attempt at shadow than Gill Sans Shadow. The relation of positive to negative is much better realized in Umbra.</p>
      <p>Good luck with that project.</p>
      <p>powers</p>
