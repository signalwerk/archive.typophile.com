    <p>I’ve read on the linotype website that Umbra was originally devised<br>
    as a “second-color drop-shadow for the typeface Tempo”. However,<br>
    the only Tempo I can find is a condensed version.</p>
    <p>Is there a link between Tempo and Futura? And which other faces<br>
    could I use to “fill in the gaps”?</p>
