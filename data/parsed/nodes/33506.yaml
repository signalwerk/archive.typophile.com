      <p>Miss C:</p>
      <p>Tempo has been overlooked as metal faces have ben revived. The Tempo family was devised by the Ludlow Typograph Company as their answer to European sans, including Futura. It was pretty extensive:</p>
      <p>Tempo Light &amp; ital<br>
      Tempo Medium &amp; ital<br>
      Tempo Medium Condensed<br>
      Tempo Bold &amp; ital<br>
      Tempo bold condensed<br>
      Tempo Heavy Condensed<br>
      Tempo Heavy Inline<br>
      Light &amp; Bold ad figures, up to 144 point<br>
      Tempo Black</p>
      <p>&amp; in my undated Ludlow specimen book [the marrooon one with the silver panel on the top board] Ludow Umbra comes right after the Tempo family. It is weighted about the same as Tempo Bold.</p>
      <p>As an apprentice I set a lot of Umbra, but never set it as part of a 2-color setting with Tempo. It was always used alone. I suppose a careful compositor and then a careful press operator could have made that effect work, though.</p>
      <p>Head to a library and take a look at the Ludlow specimen books; you’ll see Tempo in all its glory. Take note of the differences among the itals in different weights. </p>
      <p>Compare Umbra to Gill Sans Shadow.</p>
      <p>This morning I cannot get to my other books about Ludlow to offer you other details; sorry. There’s a book about Ludlow’s guiding typographic light, R. Hunter Middleton; maybe it offers more info. &amp; RHM wrote a small book about designing types; maybe there’s something about Tempo in that.</p>
      <p>I hope this helps.</p>
      <p>powers</p>
