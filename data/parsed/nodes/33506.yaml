      <p><a href="http://en.wikipedia.org/wiki/Umbra_(typeface)"></a><br>
      Tempo light?</p>
      <p>Also:</p>
      <p>The Ludlow Typograph Co., Chicago. Washington Luddlow of Chicago began making typecasting machinery in 1906, but the Ludlow caster which his company sold throughout the early twentieth century was a later device, designed and built by William Reade in 1909. The machine casts slugs from handset proprietary matrices and was therefore used for little except display type, but several Ludlow faces have been successfully adapted for digital text composition. The comapny issued both historical revivals and original designs, chiefly by its director of typography, R. H. Middleton. It ceased operation in North America in 1986. The English arm, founded in the early 1970s, closed in 1990.</p>
      <p>-Bringhurst, <cite>The Elements of Typographic Style</cite>, pp 315-316</p>
