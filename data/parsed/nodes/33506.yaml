    html: <p>As it turns out Umbra is very similar to Plastica, a three-dimensional version of Berthold Grotesque. So if you wanted a “positive” version of the type you could start with Berthold Grotesque. This info from the 1983 edition of Encyclopaedia of Type Faces by Jaspert, Berry &amp; Johnson, my bible of type, or one of them.</p>
