      <p>Thanks for these comments. </p>
      <p>I started wondering about it because I’m doing a logo for a new building. We’re suggesting setting the name of the building onto a large expanse of white wall, and as the sun passed over during the day it would throw different shadows (inspiation is mainly drawn from modernist architecture and how they applied signage to their buildings –&nbsp;see pic). In order to do the visualisation in photoshop, I wanted the “positive” version to work with.</p>
      <p></p><div class="imageWrap"><img src="/files/coal_3671.jpg"></div><p></p>
