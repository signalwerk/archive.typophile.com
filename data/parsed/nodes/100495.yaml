      <p>The trick is to first come up with spacing for key letters that will never require kerning to each other. Typically, in Latin fonts these will be the straight sided letters H and i. Then you assign sidebearings to all other glyphs based on spacing relative to these key letters, such that none of the glyphs require kerning to the key letters:</p>
      <p>HHAHH<br>
      HHBHH<br>
      HHCHH<br>
      ...<br>
      iiaii<br>
      iibii<br>
      iicii<br>
      ...<br>
      etc.</p>
      <p>That way you know that your basic spacing is sound, and after that anything that looks wrong is a situation for kerning.</p>
