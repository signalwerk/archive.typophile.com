      <p>I know of no way to be sure one has done enough spacing before resorting to kerning. What I would tell you is that with experience: you will -in advance- make the <em>black bodies themselves</em> in a way to reduce spacing and kerning issues, and you will -in advance- make the sidebearings in a way to reduce the need for kerning <em>irrespective of specific pairs</em> - meaning that you will come very close to what the sidebearings need to be even before you try out specific problem pairs for reasons of tweaking. So: you cannot Know, but the more and the earlier you <em>think</em> the better.</p>
      <p>Also useful is to determine a "granularity" to work with: the finest tweak you will make. In an Em of 1000 many accomplished designers don't go finer than 5 units (and often as coarse as 10 units for kerning). Having this parameter not only saves time/stress but puts you more in control, able to robustly increase the quality -by reducing the granularity- across the board if needed.</p>
      <p>hhp</p>
