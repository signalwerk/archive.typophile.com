      <blockquote><p>Is there such a thing as a perfect letter spacing without kerning</p></blockquote>
      <p>Yes, if your font is monospaced or the design lends itself naturally to harmonious spacing (and even then it is a matter of perspective based on your perception vs. that of the people that use your font). It sounds like you are ready for the kerning phase.</p>
