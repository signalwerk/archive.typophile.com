      <p>From sharing experiences with other designers, my conclusion is that letterfit is always a matter of compromise. Letters will space too tightly in certain combinations, and too loose with others. Letterfitting is a matter of balancing out the tight combinations with the loose ones so that the overall texture is as even as possible. </p>
      <p>As Karl says, spacing is very subjective, but it's advisable to give letters sidebearings that work in the largest number of combinations and use kerning to fix difficult pairs. Most designers would not for example kern rounds positively/oo/, some will kern /fo/ and /ro/ and most (?) would kern /vo/ and similar shapes.</p>
