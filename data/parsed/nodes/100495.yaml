    <p>Hello everybody, it's been a while since my last post.</p>
    <p>I've got a quick question that has been bugging me for a while and is very simple: when does the letter-spacing process ends and begins the kerning one??</p>
    <p>I will try to explain myself.<br>
    I been letter spacing the glyphs in a font following both the Walter Tracy's and Miguel Sousa's method for comparison purposes, but no matter how much I tweak the glyphs, there always seem to be pairs that look a little bit off, irregular, no matter what I do when setting the "abcde..." text string. I know that those "problem" pairs can be easily fixed with kerning modification, but I'm not sure whether it's really a kerning problem or just that my letter spacing sucked in the first place.</p>
    <p>So, how perfect can I expect my letter spacing to be without kerning? Is there such a thing as a perfect letter spacing without kerning or should I expect some little deviations and off spacing witch certain letter combinations??</p>
    <p>Thanks for the insight!</p>
