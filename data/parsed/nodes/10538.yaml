  html: <p>Hi all, I've just started making fonts for the first time and am having a few problems... <br> <br>I've been importing designs from Illustrator as EPS's. All was going well, until I hit the letter 'f'. <br> <br>I've done a-e and when I tried f and other letters, it doesn't show them in the table view.  <br> <br>When I re-open the glyph, it's not there, but its about half way to the edge of the page, moving left. So they are going in, but Fontlab is moving them around miles to the left, and not showing them in the matrix/table window... its moving the verticle guidelines too, but I can still see the horizontal ones, hence why I scrolled around to see if I could find it... <br> <br>Hope you can help me out, looks like it could be good for my project, but a-e isn't soo impressive. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br>Thanks loads, Rob.</p>
