      <p>The "Made in Japan" should be a clue that you may not find a perfect match with an extant typeface from a Western foundry. Nonetheless, this is close to the SER. NO. face...</p>
      <p><a href="http://www.myfonts.com/fonts/adobe/trade-gothic/extended/" title="http://www.myfonts.com/fonts/adobe/trade-gothic/extended/">http://www.myfonts.com/fonts/adobe/trade-gothic/extended/</a></p>
      <p>And the stamped numbers are almost certainly not foundry type; however, something like Letter Gothic would probably approximate it pretty well.</p>
