  html: |-
    <p>I have a project where I'd like to show this concept to a client (they use a lot of translucency in their brand, so this would be a great way to show it off, and make a cool piece). The piece itself is a pocket folder, but the transparent layer, with its white underprinter to create areas of solid color could just be the outside of the folder and bound to it, or act as a slip cover.</p>
    <p>Can anyone point me to good online examples of this technique? I really don't want to have to go drop $300 at the Japanese book store to show the client what this looks like, I only have a couple books at home that use it, but nothing like the fantastic ones I've seen from Japan.</p>
    <p>I'm not even sure its actually mylar plastic being used, so I'm having trouble even getting anywhere with good. The word transparent plastic is too common to make for good searching.</p>
    <p>Thanks!</p>
    <p>This is a reasonable example of what I am looking for more examples of.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/136_3543.jpg"></div><p></p>
