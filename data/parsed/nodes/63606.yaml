    html: <p>I can't help you with examples, but the plastic is probably not mylar. It's most likely polycarbonate, or polyester, both of which come in grades made for screen or offset printing (I work for a company that has a division that distributes the stuff). Makrofol is the brand of polycarbonate we sell. I'm not sure what the polyester is.</p>
