      <p>The origin of Times New Roman is something of a typographic mystery. What I remember reading: </p>
      <p>Version 1. Morrison sketched out key characters and Victor Lardent carried out his instructions (Morrison version).</p>
      <p>Version 2. Morrison had the general idea of putting Perpetua style serifs on Monotype Plantin (designed before Morrison's arrival at Monotype.) But the whole execution of the concept was Lardent's. (Revisionist version by those who did new edition of Morrison's essays.) </p>
      <p>Version 3: It was originally drawn by an American, <a href="/wiki/Starling%20Burgess" class="freelinking" rel="nofollow">Starling Burgess</a>, and this fact was covered up. --Mike Parker's version in Printing History 31/32 (1994), pp. 52–108. Mike Parker was typography manager at Merganthaler Linotype and then founder of Bitstream. I believe he mentions the issue in his interview at <a href="http://www.typeradio.org/loudblog/" title="www.typeradio.org/loudblog/">www.typeradio.org/loudblog/</a>. I see he will be at TypeCon, so if you are attending you can ask him further yourself.</p>
    html_clean: |-
