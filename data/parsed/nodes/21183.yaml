    html: |-
      <p>I do not know much about the history of Times New Roman. There seems to be some dispute about how it was really designed, and how much of a design role Morison really played in it. There were certainly many other people in and out of Monotype who were involved on the periphery, at the very least.</p>
      <p>Times, from Linotype, is Times New Roman as it was actually used by the London Times newspaper, if I recall correctly. Monotype made the design, but the newspaper was set using Linotype machines. So Linotype had to adapt the design for its machinery. Since the 1930s, there has been some sort of agreement to its distribution. "Times New Roman" is a Monotype trademark, "Times" a Linotype one.</p>
      <p>Walter Tracy, at Linotype's English office, drew Times Europa later, in the 1960s. This was the typeface that replaced Times New Roman/Times at the Times of London then. But even this face is history by now. The Times of London uses yet another face today for its pages.</p>
      <p>The Monotype Times New Roman, in metal, was a superb book face. The Encyclopaedia Brittanica is a marvelous example of its possibilities.</p>
