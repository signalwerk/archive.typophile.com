      <p>In addition to the two-letter sorts that Charles has explained, I believe that “logotype” also referred to catchphrases and other complete words set as a single metal sort. (Hence the derivation of the term.) A printer’s glossary I have from 1924 gives the definition: “Logotype — Two or more letters, or a whole word, cast on one body.”</p>
      <p>In some cases, a company would have had it’s name specially cast up as a single sort, perhaps in a variety of sizes, to facilitate the setting of advertising material, especially once the practice of custom, identifying marks became a common part of business practice. This might have been more frequently a zinc etching rather than a proper type-metal sort, but I think the term was still applied. </p>
      <p>I believe that’s how we’ve inherited the usage that is pretty common today, where a company’s distinguishing wordmark is referred to as a logotype.</p>
      <p>— Kent.</p>
