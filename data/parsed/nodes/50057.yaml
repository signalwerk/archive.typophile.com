      <p>The term “glyph” came about in the late 1990s I believe. It means something like “sort,” but does not have quite the same connotations. In modern (Unicode) usage, a Greek capital “Alpha” can be the same “glyph” as Latin capital “A”, but they are different characters. It would be odd to use the term “sort” here; the notion of having both Greek and Latin in a single metal font would be unusual. Caslon Greek would be thought of as a different font in the old days (“old” meaning before the 1990s). In type cases, they would be thought of as different sorts only because they would be in different cases. But if you ran out of *A’s*, you could use an *Alpha* &amp; not loose meaning. </p>
      <p>And while all logotypes are sorts, not all sorts are logotypes. “Sort” doesn’t specify what is unique about logotypes (two letters on one body). It would be the same as saying we don’t need the term “ligature”, because “sort” or “glyph” is sufficient. (see note)</p>
      <p>By the way, there were logotypes in systems other than Linotype. With foundry type, a Q with a long tail required a “Qu” logotype.</p>
      <p>It may be that in the past few years “logotype” has come to mean a logo consisting only of type, I don’t know. While words can change meanings even in formal usage, that would seem to be a bit far. Sort of like expecting everybody to know what “dudine” means.</p>
      <p>(note): A “ligature” means tied letters; by extension, used where elements of the two letters touch, such as the glyphs *fb*, *fk*, etc. The individual characters in logotypes (old usage) were not tied; nothing touched, hence not “ligatures.”</p>
