      <p><cite>Your six pack has a six pack doesn’t it?</cite></p>
      <p>Hopefully I’ll get there one day. I ended up working out to train for a week of biking in Provence and found that the exercise nipped most of my health problems in the bud, and that adding in more resistance training gave me a sunnier outlook on...everything. The harder I work at the gym, the better I feel everywhere else, so now I’m starting to really push my workouts. </p>
      <p>Also, learning a lot about exercise has also taught me a lot about eating better. I have a pretty fast metabolism, so I have to make sure that I eat right to fuel every little bit of exercise. Cutting all that crap out of my diet compounds all the benefits of exercise. When I get really strict about it I feel almost as good as I do after a week in France, where even the junk food is healthy compared to the crap on the shelves here in the USA.</p>
