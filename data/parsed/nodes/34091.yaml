      <p>I hit the gym regularly, for long periods of time. For a while I was down to four days a week, but now I’ve pushed back up to six days a week  of intense bodybuilding workouts followed by time on the elliptical trainer, for a total of around 12-14 hours a week. If I don’t work out like this I get (more) misanthropic and my entire body starts to cramp, twitch, and be generally unfriendly toward my lifestyle of curling up in front of books and computers.</p>
      <p>On top of the gym time I also walk to and from work (and just about everywhere else that I go) and walk my dogs several times a day.</p>
