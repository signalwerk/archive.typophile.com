    <p>I’m curious, <strong>what do the rest of you do to stay in shape?</strong></p>
    <p>I currently live a pretty sedentary lifestyle, work several hours a day in front of a computer sitting on my posterior and getting little to no exercise. </p>
    <p>I’m wondering how many of you have shared my fate and were able to make modifications to successfully achieve a healthier more active lifestyle?</p>
    <p>I’m hoping to be inspired and possibly learn about some new activities. I’m not necessarily excited about going back to the gym. Please enlighten me. </p>
    <p><em>Sorry about the absence of type talk in this discussion.</em></p>
