      <p>I hate going from being inside behind my computer, to being inside at a gym, I get OUTside to clear my head and have more fun ( I also live in paradise; my own opinion of course). I get most of my work done in the early AM, but still take a break in between there to go on a steady sprint single track bike ride.</p>
      <p>Having a dog helps alot, because she lets me know that I better take her out two to three times a day. Start swimming, find a hobby, take up trail running, surfing, road or MTB biking, rock climbing, sky diving, anything. I just had to find another passion and stick with it. </p>
      <p> You can be real meaty like myself and crank out pushups and turn it into a game, who doesnt like pushups anyways. Working out is just as mental as design. Its EASY for us (to some extent) to sit behind a computer and work, and dread getting excercise, but if you do it enough, you long for the excercise, and more over NEED it. Stop thinking about it and go do it. GO. DO. BE. once you get into the routine its like figuring out your design process, it just works.</p>
