      <p>I tried disc golf once, and had a blast. We played in a nature reserve forest on an island somewhere near Vancouver on this privately owned property that a pal was overseeing as a forest ranger. He had developed the course himself, and it wove between the huge tree. I’m not sure any other kind of course would quite live up to that first experience. Also I can’t throw for sh*t.</p>
      <p>I love yoga. There are different kinds, so find out before you try it — or not. Jump in and see if you like it. Any good teacher will respect your level of flexibility. There will be others able to go way further into the posture, but you go at your own pace and to the point where you can without hurting yourself. The other thing with yoga that many people don’t realize is that it also builds strength. You can certainly build up a sweat in even a very mild class.</p>
      <p>Good luck!</p>
