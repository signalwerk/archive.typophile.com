      <p>I used to backpack in summer and ski in winter all the time, but a series of injuries has kind of curtailed most of that.  So I golf, and we’re taking up curling this fall.</p>
      <p>And we walk most places and use our bikes — not owning a car (by choice) means we also haul groceries and recycling by hand.  Like Mili said, lots of stairs as well (not hard when you live on the top floor of a walk-up building!).</p>
      <p>One of the biggest changes we’ve done in the last five years is eating better: fresh local meat and produce, as few processed foods as possible (but I won’t give up dark chocolate), and a vegetarian “day” at least once a month. We rarely do take-out and never McD’s: we could probably do more grains and less booze, but there’s no reason to get that keen.  ;-)</p>
