      <p><cite>Is Disc Golf fun and/or difficult? Do you need a lot of discs to play it and how are they chosen? </cite></p>
      <p>Well, I’ll try and give you a broad answer. Disc Golf is definitely  fun, and if you understand the concept of golf, it’s also pretty easy. </p>
      <p>You do not need a lot of discs. Your needs might differ, some people play with 1 or 2 discs, others with 30. It all depends on how much you get into the sport.</p>
      <p>There are 4 types of discs. Distance Drivers (Very Long Drives, but not always accurate. Most driver discs look very aerodynamic with a sharp edge), Fairway Drivers (Shorter Drives, but much more reliable accuracy wise), Approach Discs (These are the brute discs, good for mid to short ranges or out of dense forest/wooden areas. The edge of the disc isn’t as sharp) and finally Putting discs (Similar to the Approach Discs but made to fly very accurate only at short ranges, they look the most like a common Wamm-O Frisbee with a very blunt edge.) </p>
      <p>My advice, spend $10-20 bucks (they’re cheap) and pick up at least 2 discs. A Driver (Fairway preferably) that weights about 10-11 grams (this is a safe starters weight) and an Approach/Putter that weights about 10-13 grams with a soft/pliable feel, almost like rubber if you can find one.) The weight is marked on the underside of the discs usually.</p>
      <p>Here’s a PDF chart for selecting <a href="http://www.innovadiscs.com/downloads/2006_driverweb.pdf">Innova Driver discs</a> and <a href="http://www.innovadiscs.com/downloads/2006_midweb.pdf">Approach/Putter discs</a>.</p>
      <p>There’s also a few different ways to throw the discs (Cross Step, Side Arm, Hammer and Roller) but it’s hard to discribe them in words.</p>
      <p>(here’s a PDF of illustrations on how to throw : <a href="http://www.innovadiscs.com/downloads/ThrowingCharts.pdf">Innova Throwing Chart</a> and a list of <a href="http://www.youtube.com/results?search_query=Throwing+disc+golf&amp;search=Search">Youtube videos on Throwing</a>.</p>
      <p>I hope this gives you an idea of what’s involved with Disc Golf. If you’d like to find other courses/events in your area check this <a href="http://www.pdga.com/course/index.php">Course Directory</a>.</p>
