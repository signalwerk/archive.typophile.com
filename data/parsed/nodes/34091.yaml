      <p>I really appreciate all the responses. I’m actually surprised about how active everyone is, and I’m jealous (in a good way) of you all. I’m trying to get myself psyched up to get back in shape. </p>
      <p>I’ve been doing my homework, reading up about exercise and diets.<br>
      I’ve tried to alter my diet to include more protein and reduce unnecessary sugars and processed carbohydrates. However, I’m still lax about how much I eat and I definitely don’t get enough fruits and veggies. I also have a penchant for whole grains. </p>
      <p>Apparently, 30 minutes a day, 3 days a week would be plenty if I focus on building muscle mass (which would in turn burn calories faster.) and then getting plenty of rest (which is currently not a problem.)</p>
      <p>In the past, I would spend most of my time at the gym on an Elliptical machine, and after a few months, I’d dreaded going. I ended up stopping mid-Fall, mixed with my lack of enthusiasm and the crumby weather, I never returned. Now I’m easily 15lbs heavier and tired all the time. I’ve realized how much not exercising has affected me and I wish I would have been more diligent. It’s going to be a tough transition back into an active lifestyle, but I’ve done it before. I know after about 2 weeks, I’ll be re-energized and hopefully more motivated to continue. It would be nice to have someone to keep me in line though.</p>
