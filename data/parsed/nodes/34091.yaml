      <p>We don’t own a car, so I walk to and from work every day, about 15 minutes each way. Either walk or bike to the grocery store (2km each way) then carry it all back, usually in a backpack. Also have 2 sled dogs, so that ads about another 45min-1hr or walk/run/jog at night and 1km in the morning if I have to do it, otherwise my wife takes them out. </p>
      <p>Now that it’s nice our I’ll bike a few places, but never really for ’fun’ only as a means of transportation. Also soccer is starting up and I play midfield, so it increases how much I run by a lot. Speaking of which, I am walking like a peg-leg today because my calves are so sore from Sunday’s pick-up game.</p>
      <p>In the winter we’ll snowshoe,  ski and skijor with the dog, dogs now, but we just got the second one. We also hike all year round, and hopefully this summer we’ll get into doing some rock climbing. We love canoeing but don’t own a canoe or car.</p>
      <p>I don’t really do much with the intent of getting in shape or anything, especially with 2 wrecked knees, these are just activities I enjoy. I’ve never been to a gym and would be lost in one, I think.</p>
      <p>—</p>
      <p>@ Linda: I’ve recently started taking glucosamine tablets and it’s made a huge difference on my knees. The pain isn’t as sharp and I can get more done, I find, w/o them bothering me.</p>
