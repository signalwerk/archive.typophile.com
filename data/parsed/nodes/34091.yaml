      <p>I bike. And since I love speed, I go out and boot it for an hour or so. There is nothing, for me at least, like the high I get from going as fast as I can on my bike. Best is in the morning when there are fewer people on the bike paths and it’s usually cooler, too. I wish I could bike to work every day, but I drive my kids to and from school and daycare 3 or 4 days a week, so on the off days, I try to bike, or I walk to the metro station. Sometimes, if I’m wearing appropriate shoes, I’ll walk home at a brisk trot.</p>
      <p>In the summer I also try to go to the outdoor pool and do an hour of laps 2 or 3 times a week. Doesn’t always work out because of the schedule with the kids, tho. I’ve been trying to improve my breathing — doing consecutive laps without panicking is a challenge I’m working on.</p>
      <p>On my lunch hour twice a week, I go to a yoga class given by the university’s athletics and recreation dept. They offer a ton of classes and I’ve been thinking that next winter I will try the spinning class, tho I’m sure it won’t live up to cycling. Also the university’s gym and classes are WAY cheaper than regular gyms.</p>
      <p>And, once a week I have a 2 hour tango class with my guy and we also go dancing (tango) on Friday night every second weekend. Problem is, the alcohol consumed on those nights cancels out any of the calorie-burning potential, I’m sure. But as a side note, learning tango can be a great way to meet people — and I mean friends, too.</p>
      <p>Mmm and every once in a while my boyfriend drags me down to the dungeon to lift weights. I find it brutal, but it feels great afterwards. I don’t quite have the discipline or motivation for the 4 days a week at 6am routine, though. </p>
      <p>I live in central Montreal in one of the neighbourhoods that will be trendy ten or fifteen years from now, but for the moment is still exhibiting signs of welfare, social housing, and general poverty. Ain’t no green forests around here. </p>
      <p>K.</p>
