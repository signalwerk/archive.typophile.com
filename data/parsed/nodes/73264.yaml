    <p>Hi,</p>
    <p>I am creating an identity for a web-designer<br>
    which audience are digital agencies, in-house advertising<br>
    departments, small and big companies.</p>
    <p>For the logo I might use Proxima Nova. Which text<br>
    typeface would you pair it with, to use in resumes,<br>
    promotional material, etc.</p>
    <p>Thanks in advance,</p>
    <p>Patty</p>
