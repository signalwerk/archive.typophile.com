  html: |-
    <p>The March edition of the Metal Type newsletter is now out. Click this link to take a look at the video: <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>As well as the usual site news, there's footage of the Adana 8X5 Hot Foil platen that I have recently restored to working condition.</p>
    <p>If you don't already get newsletters from Metal Type, you can subscribe here: <a href="http://bit.ly/n3wkjc" title="http://bit.ly/n3wkjc">http://bit.ly/n3wkjc</a></p>
    <p>Don't forget that it's free to place an ad on Metal Type Classifieds. Anything print-related can be posted. For Sale or Wanted, even print-related services. It is now possible to post pictures, and links to your own page or Etsy shop: <a href="http://j.mp/UeZUyC" title="http://j.mp/UeZUyC">http://j.mp/UeZUyC</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
