      <p>First, my answer is #2.</p>
      <p>But at more length....</p>
      <p>&gt; I have read that best practices involve making stylistic components of a name as short as possible.</p>
      <p>Says who? Why on earth would you use cryptic abbreviations except when necessary?</p>
      <p>The rule of thumb at Adobe is to make stylistic components of a menu name as close to the way one would actually read/write it as possible, within the constraints of:</p>
      <p>A) Maximum name lengths of different fields in the font</p>
      <p>B) For a given field, across fonts within a family, we want to be consistent.</p>
      <p>So for an example of (B), if for the Mac Classic menu name we are forced to abbreviate “Italic” to “It” for Expialidocious Extended Bold Italic, then we’ll do it for the Mac Classic menu names for all the italic faces in the Expialidocious family.</p>
      <p>Cheers,</p>
      <p>T</p>
