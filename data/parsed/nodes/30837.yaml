      <p>The numeric one promoted by Linotype — page 85 of my second edition of <em>Stop Stealing Sheep</em> (where I’ve taken the quote below) has the matrix for figuring out the weights of Univers, especially when you consider the permutations and combinations now available (59 weights plus 4 monospaced typewriter fonts!), it’s a snap to figure out which one you’ve got.  </p>
      <p><em>The first digit stands for weight, i.e., 1 is ultralight, 2 thin, etc., and 9 is extra black. The second digit denotes width, i.e., 1 for compressed, 2 for condensed, 3 for basic, and 4 for extended. The third indicates upright roman (0) or italic (1). Not exactly intuitive, but effective once you get used to it.</em></p>
      <p>If you don’t want to go that route (I like the fact that it’s language-independent, personally), then I’d vote for your Option #2 — I’m big on keeping things as unambiguous as possible.</p>
