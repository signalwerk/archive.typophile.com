      <p>I use a different and totally inconsistent numbering system for !Square Engine, but that is specifically an homage to European motorsports. I prefer words, generally, but that is a good point about the internationalism of numbers. I might offer a Lino-numeric version of larger sets, if demand dictates in non-english markets.</p>
      <p>Near as I can tell, in non-OpenType compliant applications, at least until Vista comes out, one can’t group sub-types reliably, aside from the Bold, Bold-Italic and Italic stylings.</p>
      <p>However, in this case I am assuming that those who are using OT aware apps are “pickier” consumers, and they get the cleanest, most detailed, accurate names and nicest grouping (all tucked under basic face name). Similar to #2.</p>
      <p>The non-OT apps will then show a lengthy approximation, broken into several entries, like:</p>
      <p>[facename] [cutname]<br>
      [facename] [cutname] [width (if applicable)]<br>
      And then one would just use the “<strong>B</strong>” and “<em>I</em>” buttons in those sort of apps to access the bold and oblique faces.</p>
      <p>And when Vista comes out, they will display as something confusing and different. I’ll upgrade to Vista when I am convinced it is an upgrade.</p>
