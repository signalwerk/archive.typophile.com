      <p><em>Says who? Why on earth would you use cryptic abbreviations except when necessary?</em></p>
      <p>It’s a great site, that I can’t find my bookmark for, with a virtual course on type design. It says nothing about being cryptic, just short, and I think even those here who liked #2 could figure out the TLA’s. OT fields just don’t pigeonhole me into the Bold/Italic choice, and modern computers (that would implement OT) have resolutions of 1024*768 and up commonly.</p>
      <p>In the “classic” name fields, everything will look about the same, except that I substitute “Italic” for “Oblique”, as it rumored that people may have problems otherwise.</p>
      <p><strong>- Or -</strong></p>
      <p>I would! On !Square Engine, the cryptic abbreviations are totally gratuitous fun.</p>
      <p>—<br>
      They way adobe does fonts is really great to know. It isn’t simply the scale of them and their output, but things like you communicating the tech philosophies that makes them a standard-bearer. Free dev tools help too! ;)<br>
      —</p>
      <p>Without a mac in the house these days, I am not sure how they render font names outside adobe apps (which, I imagine are almost identical in this to their PC equivalents). I’m guessing something more advanced than 2K/XP. From what I’ve seen, however, everyone with a pre-OSX machine understands that it might not be 100% cool with modern software. Well, actually I don’t know anyone anymore with a pre-OSX machine. Does anyone have experience or a white paper about OSX default name display?</p>
