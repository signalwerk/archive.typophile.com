      <p>Apps getting “Classic” menu names will use Mac name ID 18 if present. (FontLab’s “Mac Name” under “OpenType-specific names.”)</p>
      <p>Adobe apps use Win name IDs 16 and 17 on both platforms. We consider those the typographically savvy names. (In FontLab: OT Family Name and OT Style Name.)</p>
      <p>Note that if name IDs 16 and 17 are not present, name IDs 1 and 2 get used instead. So if they’re the same, they can be omitted. (FontLab does this automatically.)</p>
      <p>Note that in Adobe fonts, Mac name IDs 1 and 2 usually correspond to Win name IDs 16 and 17. However, 16 and 17 have a slightly longer length limit than 1 and 2 (I think it’s 63 or 64 characters, instead of 31 or 32 characters). FontLab can set this up automatically if you check the option under “Generating OpenType &amp; TrueType” for “use the OpenType names as menu names on Macintosh.”</p>
      <p>Well, I hope that was involved enough!</p>
      <p>Cheers,</p>
      <p>T</p>
