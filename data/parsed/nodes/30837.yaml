    <p>I have read that best practices involve making stylistic components of a name as short as possible. </p>
    <p>But, off the top of your collective heads, what do you personally prefer? What about when there are multiple tags on the end? Is consistency important? Compare below, and offer other strategies, if you like:</p>
    <p>Option No. 1 (short/consistent)—<br>
    [Fontname] [Cutname]<br>
    [Fontname] [Cutname] Bld<br>
    [Fontname] [Cutname2] Cnd Bld Obl<br>
    [Fontname] [Cutname2] Obl</p>
    <p>Option No. 2 (long/unambigous)<br>
    [Fontname] [Cutname]<br>
    [Fontname] [Cutname] Bold<br>
    [Fontname] [Cutname2] Condensed Bold Oblique<br>
    [Fontname] [Cutname2] Oblique</p>
    <p>Option No.3 (mixed)<br>
    [Fontname] [Cutname]<br>
    [Fontname] [Cutname] Bold<br>
    [Fontname] [Cutname2] Condensed Bld Obl<br>
    [Fontname] [Cutname2] Oblique</p>
