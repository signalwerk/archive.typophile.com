      <p>Hrant, </p>
      <p>it's not the point. The point is that when ClearType renders fonts on fractional widths, then the glyph origin may fall on the R, the G or the B subpixel. So then, assuming (in a simplified way) that the left stem of a glyph will be only two subpixels thick, it will be then rendered on the RG, GB or BR subpixels. In other words, the same character in one line of text may be rendered differently if it occurs several times. </p>
      <p>There is no way that this can be done with bitmape, even if they have fixed colors. In theory, for a bitmap-only font, ClearType could be smart and render such font on integer widths only -- but the problem arises if, say, only 1/4 of the glyphs have bitmaps. This is a case the rasterizer would have to consider -- but mixing embedded bitmaps on integer widths and outline glyphs on fractional glyphs would be difficult to implement and I doubt it would yield any good results. </p>
      <p>The recent incarnations of ClearType do show great potential. The rendering is quite good and more legible than the Windows 2000/XP grayscaling (but then, the Windows 2000/XP grayscaling is horrible -- Mac OS X shows that pure grayscaling can still yield good results). </p>
      <p>However, I feel that the implementation of ClearType has gone in the wrong way when it comes to how a font can opt in or out to certain treatment. Microsoft should have extended the gasp table in a clear, readable way so that a font could choose what and when to use: embedded bitmaps, delta hinting, grayscaling, subpixel glyph rendering, fractional/integer widths. The ClearType rasterizer could still apply its defaults to fonts that don't have any of it specified, but for newer fonts for which the developer specifically tuned some settings, there should be a clear way to tell ClearType: "Here, I want pure black-and-white delta-hinted outlines for this one" or "I want embedded bitmaps". </p>
      <p>A.</p>
