      <p>My experiences show that embedded bitmaps work in Windows only when ClearType is OFF. If it is on, the embedded bitmaps are not shown. This is, of course, something we could expect because ClearType does not use full pixels but instead does subpixel rendering. Especially with subpixel (fractional) glyph positioning (where the origins of the glyphs are also positioned on subpixels, showing embedded bitmaps would be very odd). </p>
      <p>A.</p>
