      <p>After trying several things I can answer my original question. It seems is that embedded bitmaps in TTF font work ONLY when ClearType or Grayscale anti-aliasing is OFF. I couldn't make bitmaps show in situations when anti-aliasing was activated in Win 2000, XP or Vista. </p>
      <p>Peter</p>
