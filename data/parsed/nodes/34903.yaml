    <p>Hello. I am planning to embed bitmaps in one of our fonts to improve on screen appearance in very small sizes. However I am wondering how TTF fonts with embedded bitmaps behave now in Windows XP and Windows Vista. Does it depend on the Settings of Windows whether or not the applications honour the embedded bitmap table of the TTF font? </p>
    <p>Does anyone have experience in which circumstances the bitmaps will show in the specific ppem sizes, and when the Windows rasterizer show the rasterized outlined instead?  How can one make sure the bitmaps are used, when the outlines are present in the font as well? </p>
    <p>Thanks, Peter</p>
