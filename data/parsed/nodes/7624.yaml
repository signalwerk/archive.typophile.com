    html: "<p>I think that you are using too many colors on your logotype(4+) and I don't really like the typeface you are using. You should work on the illustrations. I hardly see the mountains and the house looks more like a doggy shack to me. <br>  Of the variations you gave the one with the circles have most appeal. <br>  You can also try to make the symbols a bit smaller. <br>If I am to compare the disigns : the ones that you made a month ago and the recent designs, I would surely choose the recent ones. <br> <br>Salute, Ivan <br>(i uspeh ;)</p>"
