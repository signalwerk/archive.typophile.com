    html: '<p>Hello Ivan  <br> <br>i have experience from a similar project in which the client  <br>needed to achive his corporate id in various fields  <br>and i can say that a succesfull marketing strategy might be  <br>that you can create a generic id which can be transformed  <br>easily to "brand-identities". What you need is a simple,  <br>flexible and distinctive form that will allow you to maintain  <br>the charaxter of the company applied in various mannrs. <br> <br>For examble you may use two blocks:  <br>�the right always with a monogram/symbol  <br>and the main corporate color <br>�the second accustomed with the schematic/color  <br>variation you need to describe the current field. <br> <br>christos</p>'
