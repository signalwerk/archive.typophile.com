    html: <p>Thanks everybody, for the feedback. My main concern about the second set of designs is that they may look a bit like and information signs, rather than a logo. I would love to design a wordmark only, and lose all the symbols. But hey - the company I'm working for is not Kioken and we can't afford to "fire clients", like they did with Sony.  <br>Galin is right for the colour usage...I should see how all these symbols would look in a single or 2 colour scheme. <br>  <br>Now I'm waiting for them to decide.</p>
