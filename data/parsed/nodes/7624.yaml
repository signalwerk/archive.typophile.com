  html: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;Finally, I got myself together and now I'm posting one of my designs for critique. The story so far: The company \"Paldin Holiday\" wanted a logo design. They operate a significant number of hotels and resorts. The task was described like this - \"we want something that would appeal to rich European customers. We like to show that we have hotels &amp; resorts not only on the Bulgarian Black Sea, but also in the Rhodopes Mountains, various ski resorts &amp; hotels\". PALDIN is an old Roman name for my city, Plovdiv - but wanted me to stay away of the Roman element. That was okay for me, so I did something rather expected: <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53262.gif\" alt=\"Logo 01\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53263.gif\" alt=\"Logo 2\"> <br> <br>Then, after a month of silence, they appeared and said: \"you know what - funny, but the real estate business exploded enormously, so now we're not only build and rent hotels, but also sell appartments. We love what we see so far, but could you incorporate some \"real estate\" element in the current suggestions. And they look like a travel agency\". I pollitely told them: what do you expect , with HOLIDAY in the company name? Okay I'll see what I can do <br> <br>As you all see, those designs wouldn't allow me to add some sort of building, house or similiar symbol. So I started all over again: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53264.gif\" alt=\"Logo BIG\"> <br> <br>or  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53265.gif\" alt=\"Logo 4\"> <br> <br>Now I'm wondering, would they understand the last one, the roof shape that's being formed by the 3 squares... <br> <br>I'm open for suggestions &amp; comments. Thanks in advance&lt;/font&gt;</p>"
  html_clean: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;Finally, I got myself together and now I'm posting one of my designs for critique. The story so far: The company \"Paldin Holiday\" wanted a logo design. They operate a significant number of hotels and resorts. The task was described like this - \"we want something that would appeal to rich European customers. We like to show that we have hotels &amp; resorts not only on the Bulgarian Black Sea, but also in the Rhodopes Mountains, various ski resorts &amp; hotels\". PALDIN is an old Roman name for my city, Plovdiv - but wanted me to stay away of the Roman element. That was okay for me, so I did something rather expected: <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53262.gif\" alt=\"Logo 01\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53263.gif\" alt=\"Logo 2\"> <br> <br>Then, after a month of silence, they appeared and said: \"you know what - funny, but the real estate business exploded enormously, so now we're not only build and rent hotels, but also sell appartments. We love what we see so far, but could you incorporate some \"real estate\" element in the current suggestions. And they look like a travel agency\". I pollitely told them: what do you expect , with HOLIDAY in the company name? Okay I'll see what I can do <br> <br>As you all see, those designs wouldn't allow me to add some sort of building, house or similiar symbol. So I started all over again: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53264.gif\" alt=\"Logo BIG\"> <br> <br>or  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/53265.gif\" alt=\"Logo 4\"> <br> <br>Now I'm wondering, would they understand the last one, the roof shape that's being formed by the 3 squares... <br> <br>I'm open for suggestions &amp; comments. Thanks in advance&lt;/font&gt;</p>"
