    html: <p>Ivan, this is where you need a marketing man to help you explain that you can't stick 10lbs of s_ _ _ _ in a five pound bag. If someone is looking for hotel properties or resort properties they probably aren't looking for real estate as well. I think either two logos will do it or they need to change the name to something that sounds like a holding company like Paldin Inc. The word Holiday looses its meaning.</p>
