      <p>Traditionally Hebrew does not use this kind of decorative approach.</p>
      <p>Have a look at <a href="http://www.typophile.com/node/35367" title="http://www.typophile.com/node/35367">http://www.typophile.com/node/35367</a> if you must!<br>
      Also at David, <a href="http://typophile.com/node/90718" title="http://typophile.com/node/90718">http://typophile.com/node/90718</a> especially the inclined forms.</p>
      <p>To compound your problems,  Hebrew does not naturally incline to the right.<br>
      Modern Hebrew fonts that do incline to the right are offering almost a strong<br>
      maybe  aggressive 'in your face' kind of emphasis quite unlike traditional italian italics.<br>
      Mike</p>
      <p>(Stay away from Gill.  He did not understand Hebrew.)</p>
