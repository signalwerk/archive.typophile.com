    <p>I'm looking for a Hebrew typeface to pair with Poetica. I know this may be hard since it's a chancery italic but I was hoping one of you guys may have an idea. Below is a sample for your reference. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/adobe-2_4820.gif"></div><p></p>
    <p>Side discussion: Did anything ever happen with Eric Gill's Hebrew typeface? Has it been digitized? I read on a blog it has been but was unable to find a version of it.</p>
