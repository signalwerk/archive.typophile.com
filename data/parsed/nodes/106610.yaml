      <p>Reminds me of <a href="http://luc.devroye.org/fonts-46521.html">Royal Grotesk</a> by Ferdinand Theinhardt, which was the antecessor of Akzidenz Grotesk. </p>
      <p><img src="/sites/default/files/old-images/FerdinandTheinhardt--AkzidenzGrotesk-1898_4360.jpg"><br><em>(Image provided by Luc Devroye)</em></p>
      <p>Look also for »Scheltersche Grotesk« or »Grotesk« by Schelter &amp; Giesecke. <a href="http://www.christianschwartz.com/bau.shtml">FF Bau</a> by Christian Schwartz is a digital interpretation of it. Hope that helps you for finding the exact one …</p>
