      <p>I think it could be Royal Grotesk as Renko suggests.<br>
      Perhaps from the age of photo setting. See the lack of kerning in the scan.</p>
      <p>The sample of Royal Grotesk that Renko provided is most likely of a digitized typeface and thus many details could have been altered when redrawing it.</p>
