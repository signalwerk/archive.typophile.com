      <p>Reminds me of <a href="http://luc.devroye.org/fonts-46521.html" rel="nofollow">Royal Grotesk</a> by Ferdinand Theinhardt, which was the antecessor of Akzidenz Grotesk. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FerdinandTheinhardt--AkzidenzGrotesk-1898_4360.jpg"></div><br>
      <em>(Image provided by Luc Devroye)</em><p></p>
      <p>Look also for »Scheltersche Grotesk« or »Grotesk« by Schelter &amp; Giesecke. <a href="http://www.christianschwartz.com/bau.shtml" rel="nofollow">FF Bau</a> by Christian Schwartz is a digital interpretation of it. Hope that helps you for finding the exact one …</p>
