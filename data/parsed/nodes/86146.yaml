      <p>sii&gt; "Would there really be no proportional, beautiful fonts on computers if Steve hadn't taken that class? I guess we'll never know."</p>
      <p>Just my opinion, but I think one'd never know without you, Paul Shaw<br>
      <a href="http://t.co/qSL5qBEq" rel="nofollow">(re: Arial</a>) or someone else baiting just the right person ;) </p>
      <p>John&gt; "I suspect John Warnock's hiring of Sumner Stone [...] in 1984 had a much greater impact on the direction of digital typography than a calligraphy class that Steve Jobs took once."</p>
      <p>Well, I guess I've done my own homework on that one;) IMHO Warnock brought the digital outline together with another Reed College calligrapher-turned-Autologic-type director Stone, and got a lot of great clones, revivals and interpretations of the standard fair. After the dream of an Adobe-dominated PS/Type1 font market dies, Warnock pretty much disappears until a font is named after him. Stone was pretty important to Adobe though, that's for sure. </p>
      <p>Jobs made of the standard fare, and then added a whole bunch of non-standard fare, the daring though sometimes hideous scripts and decorative faces of the "city fonts", all as optimized bitmaps, perfect for the screen he was targeting. Then, when he needed to, he got proper licenses to the closest designs, as outline fonts, keeping consistent designs and names across the technical and cultural gap between the first generation of pcs and printers, from Apple, Xerox, IBM and HP, (all too puny to deal with outline fonts + 300 dpi output), and the second generation, 1986 Mac, that was just barely able to use postscript fonts and talk to high res. output. </p>
      <p>And then, Jobs took the classy-font-thing to Apple's web presence, and then to mobile devices. All because of one class. ;)</p>
