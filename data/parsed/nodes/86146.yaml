      <p></p><div class="imageWrap"><img src="http://typophile.com/files/URW_photo_3483.jpg"></div><br>
      David: ‘<em>Cleo Huggins is my pick</em>’<br>
      &nbsp;<br>
      <strong>Bingo!</strong> The following piece of text is from Peter Rosenfeld’s (on the photo in question: front row, #4 from the left) presentation:<br>
      &nbsp;<br>
      <em>This photo was taken in 1985 or 1986. Prof. Hermann Zapf, living design Germany legend from Darmstadt near Frankfurt, the man in the blue suit in the center of the picture, designed a range of new typefaces for URW in those years. […] The two young people on the right-hand side, Cleo Huggins and Dan Mills, are from California, and were sent to URW to learn all about IKARUS and professional font production. At that time, Cleo and Dan worked for Bigelow &amp; Homes of Sans Francisco, later both were hired by … Adobe. Adobe’s early type director, well known designer Sumner Stone, worked for Autologic, a former IKARUS customer in the LA neighbourhood. […]<br>
      &nbsp;<br>
      The guy next to Cleo, right behind Peter Karow, is Mark Jamra, another US designer who spent a few years at URW designing and producing his ﬁrst major font family Jamille. Jamille was released by ITC, the former independent font design marketing company from New York, today owned by Monotype sharing the same destiny as Letraset and Linotype – and who is next? By the way, URW was commissioned to digitize and distribute ITC’s new typeface releases for about 10 years.</em><br>
      &nbsp;<br>
      FEB<p></p>
