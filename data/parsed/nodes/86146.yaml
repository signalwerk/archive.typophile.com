      <p>I myself don't believe in Artificial Intelligence in terms<br>
      of replicating actual intelligence, philosophically. But if<br>
      one defines AI as the ability of a machine to simply <em>appear</em><br>
      intelligent -which does have fundamental social implications-<br>
      then at least according to the Turing Test we're already there:<br>
      Elbot and Cleverbot -as primitive as they are compared to what<br>
      will be- can fool about 1/3 of people long enough to matter.<br>
      Now one might point to something like Siri, but the problem<br>
      is nothing controlled by a corporation can ever hope to be<br>
      allowed to make real social change for the better.</p>
      <p>&gt; But the computer as it is now is not really an echo of the human soul.</p>
      <p>I think that's actually a very good way to put what it could be!<br>
      However it is not given the necessary freedom anymore, a freedom<br>
      it did have before the average Joe realized there's money in it.</p>
      <p>hhp</p>
