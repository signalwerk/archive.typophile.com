      <p>"It's just sad to see Mankind's most incredible<br>
      invention be turned into yet another vapid<br>
      cash cow."</p>
      <p>Well, at this point, I'm not entirely sure what we're talking about, but let's assume it's the consumer devices Apple is known for.</p>
      <p>I agree that it can be seen as sad that we've invented computers that allow us to send robots to Mars, yet for the most part, they're used for porn and facebook. </p>
      <p>And the iPad, as an example, is certainly a device focused mainly on our modern mindless entertainment. Jobs changed the world of music, gaming, reading, etc. He certainly didn't invent world peace or anything of the sort.</p>
      <p>That said, what he did build is being used for some rather remarkable things that aren't necessarily great mass market ads. A specific example is children who don't have the ability to speak. Many of these children have had to rely on sound boards...large boards with pictures on them that they have to touch to have a computerized voice speak for them. The problems with these devices were their size, limited vocabulary, and incredible expense.</p>
      <p>Then came the iPad. That with a $100 app and this child now has the ability to communicate more than they ever could before. And there's even a good side to the "fashionware sh*t"...this child is no longer that weird kid with the wheelchair. He's now that kid with the iPad. </p>
      <p>So, it's all about perspective. What people do with the technologies is good and bad. Useful and pointless. But the technology is there now and accessible in ways that we may not have even imagined if it hadn't been for Steve Jobs.</p>
    html_clean: |-
