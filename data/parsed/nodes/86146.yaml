      <p>John: ‘<em>I don't think you can have an account of the development of typography in personal computers that doesn't include Adobe.</em>’<br>
      &nbsp;<br>
      And I don’t think that you can have an account on this development without mentioning URW, especially Dr. Peter Karow. At the DTL FontMaster conference of 2009 in The Hague, Peter Rosenfeld’s presentation titled <a href="http://www.fonttools.org/downloads/TD_2009/Re-Inventing_Technology_09.pdf" rel="nofollow">Re-inventing Technology</a> was about the early days of digital typography. On page 30 of the PDF you will see a photograph from the 1980’s, which shows quite some very important people from the font business, including some visitors from Adobe who came to learn the trade in Hamburg.<br>
      &nbsp;<br>
      Question of the day for this forum: can you name the VIP’s on the photo?<br>
      &nbsp;<br>
      FEB</p>
