      <p>Before you invest in any kerning make sure you get the balance and the curves right! Look how the horizontal parts of c are thicker than the round part (same goes for a which is only copied from the c –&nbsp;or vice versa, and e and f, and so on …<br>
      Examine how the stroke is leaving the stem of b: much too thick! There are also big breaks where a curve is ending into a horizontal. There is no smoothness. The endings of c and e will turn out to be much too long when preceding other characters.<br>
      Above all this is way too constructed. Study typefaces like Bauhaus, for instance, which have similar design principles and see how they work.</p>
