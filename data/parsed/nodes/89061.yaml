      <p>@J Weltin<br>
      I just threw in a couple kerning classes to test the look and feel of the font. Concerning the varying thickness of the curved and the horizontal parts you are completely right, i'll be working on it. The smoothness of the curves hitting the straights is meant to be this way, it's a part of the font's identity. I needed a second opinion on the c and e and thanks to you they'll be back on the chopping board. I don't get what you mean by too constructed, but sure i'll take a look at Bauhaus considering that i am still a newbie. Thank you very much for your time!</p>
      <p>@hrant<br>
      I actually thought of it and made ( س ) and a ( و ) inspired from the lowercase g you see above and i think it has a lot of potential. Do you have any experience with arabic type? i would really appreciate a little help.</p>
