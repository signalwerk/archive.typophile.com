    <p>Hello everyone,</p>
    <p>I'd love to delve into murky waters of calligraphy but I'm struggling to find a good book on the practical side of it. I'm reading The Stroke: Theory of writing but it is what it says on the cover - theory. I was wondering if there's some sort of a calligraphy bible that is field tested and approved by the community.</p>
    <p>Any guidance would greatly appreciated.</p>
