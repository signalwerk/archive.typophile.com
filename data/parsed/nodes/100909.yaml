      <p>Hermann Zapf: Creative Calligraphy. A great little primer on calligraphy</p>
      <p>Also Charles Pearce: The Anatomy of Letters.</p>
      <p>Both are wonderful little books on calligraphy with varying degrees of instruction.</p>
