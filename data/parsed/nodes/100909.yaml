    html: |-
      <p>Do you mean calligraphy, or calligraphic (better termed chirographic) type? If it's the former, Typophile isn't the best place to ask, since it's about type, which is essentially different than calligraphy. If it's the latter, Gerrit Noordzij is in fact the doyen of chirographic type (although you will actually find a great deal of discussion about such things on Typophile).</p>
      <p>That said, my favorite book on calligraphy is Claude Mediavilla's monumental "Calligraphy" (which I have in the French, but I believe has been made available in an English version as well).</p>
      <p>hhp</p>
