    <p>I'm an amateur typophile, and I was hoping to get some advice.</p>
    <p>In my spare time I typeset the papers for an online philosophy journal. We use Goudy Old Style for the text, and until now I've been using the Adobe version. I've been frustrated the lack of a full set of superscripts in that font, though, and so I decided to purchase the LTC version (with its much larger character set).</p>
    <p>Now that I've worked with it a bit, however, I'm very disappointed with the LTC take on Goudy Old Style. The spacing seems much too "open." (That is, there's too much white space between individual letters.) The words don't hold together as they should. This looks clear on screen, but is even more obvious when I see it on paper. In short, it seems to me like a very poorly designed font. I wonder, though, if my reaction is skewed by the fact that I've been working with the Adobe version for so long. That's why I'd like some feedback from the experts here.</p>
    <p>I've attached the first four pages of a paper in two different versions. The first uses the Adobe font; the second uses the LTC font. Am I right in thinking that the LTC font is too widely spaced? (Look particularly at pages 3 and 4.) Or is there something obvious I'm missing? Is one of these more true to Goudy's original?</p>
    <p>Thanks in advance for your comments and advice.</p>
    <p>Matty</p>
