    html: "<p>I'm coming to this a bit late, but it's an interesting comparison. For what it's worth, the Lanston version seems much easier to read. But then, the Adobe version of Goudy Old Style shares the problem of so many text faces that originated in metal and got adapted first to phototype and then to digital: they end up looking thin and spindly, not at all the way they would have appeared in print when they were set in metal and printed by letterpress. Goudy himself liked tight fitting – too tight, I think – but the letters he was fitting weren't as light and airy as these digital versions. In general, the lighter the weight of the typeface, the more room it needs between letters, to be comfortably readable.</p>"
    html_clean: "<p>I'm coming to this a bit late, but it's an interesting comparison. For what it's worth, the Lanston version seems much easier to read. But then, the Adobe version of Goudy Old Style shares the problem of so many text faces that originated in metal and got adapted first to phototype and then to digital: they end up looking thin and spindly, not at all the way they would have appeared in print when they were set in metal and printed by letterpress. Goudy himself liked tight fitting – too tight, I think – but the letters he was fitting weren't as light and airy as these digital versions. In general, the lighter the weight of the typeface, the more room it needs between letters, to be comfortably readable.</p>"
