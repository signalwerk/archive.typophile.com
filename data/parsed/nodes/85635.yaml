      <p>Your links above are broken. You’ll need to reattach the sample files without spaces in the file names.</p>
      <p>The spacing which would be “true to Goudy’s original” would vary by the size of the original — generally smaller sizes were spaced more openly than larger sizes. So, each of your two fonts could be potentially “true” to the original, while being completely different, if each was referencing a different size master. </p>
      <p>(Not saying they were, just that “true” is an variable target.)</p>
      <p>Without being able to see your samples, it’s hard to comment on specifics.</p>
