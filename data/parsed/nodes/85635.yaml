      <p>Sorry, my mistake. The links are working after all. </p>
      <p>Looking at the faces more closely in your examples, I can now say pretty confidently that these two fonts are based on different sized masters of Goudy Old Style. If I had to guess, I’d say that the Adobe (Monotype) is based on the 12-point original, while I think the Lanston was based on a 10-point master.</p>
      <p>The Lanston is not only spaced more loosely, it is overall a little wider in character shapes (as would be expected for a smaller size).</p>
      <p>So, neither is more “true” than the other. The Lanston is not necessarily a poorly designed font. It’s just not performing the way you want (or have become accustomed to) — and probably was intended originally for use at smaller sizes than you’re using.</p>
      <p>You can try adjusting your H&amp;J settings to compensate for the differences, but to some extent, it will always be different than what you’re used to. It’ll be up to you to decide whether to forge ahead and make it work in order to get the extra characters, or to go back.</p>
