      <p>If you like the way that Adobe looks tighter than the LTC why can't you just set your tracking to be -10 or so? I mean, is it not possible to do that in the program you are using?</p>
      <p>I don't think there is anything wrong with doing that, just as long as it doesn't get too close to read and then hinder the legibility of it.</p>
      <p>I personally like the way the LTC font appears more than the Adobe, and I do agree that it's spaced a little far out. That's why I just recommend tracking it in a bit and having to potentially kern certain letters for headlines.</p>
