  html: |-
    <p>We are publishing a collection of poems by Gendun Chopel next Spring, and I’m hoping this group might be able to recommend a typesetter who specializes in Tibetan. This is a bilingual edition, with the original texts to be composed in native Tibetan script, or Uchen. </p>
    <p>Also: does anyone have Tibetan font recommendations or general information about Tibetan fonts? </p>
    <p>Thanks!</p>
