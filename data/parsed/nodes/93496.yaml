      <p>"Dear ______,</p>
      <p>The maximum 72pt size on the MyFonts website is only the maximum preview size. The point of the preview is to give you an idea of what the font looks like, not to provide artwork for e.g. the kind of usage you describe. If you purchase the font through MyFonts, you will receive (downloadable from the site once your payment has been processed) a scaleable outline format font that you can install on your computer and then use to create as large a banner as you want, limited only by the output device (printer, vinyl cutter, etc.) or the software you use to create the banner.</p>
      <p>Sincerely..."</p>
