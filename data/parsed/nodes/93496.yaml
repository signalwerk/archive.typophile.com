      <p>&gt; I've come to value very highly my 'naïve tester'</p>
      <p>A few years ago I was designing some business forms for a large corporation. We tried to make them as clear and easy as possible. Before printing we  passed them out to a bunch of ordinary folks and ask them to fill them out. We were surprised when  stuff we thought was perfectly clear was sometimes misunderstood. The test ended up being very useful.</p>
