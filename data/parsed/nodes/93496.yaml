    html: <p>PS. You may find yourself having to field further questions about how to download and install the font once purchased, and then support queries about how to use it. This can be frustrating, but I've come to value very highly my 'naïve tester', a man manages to get himself into all sorts of problems trying to install and fonts. His troubles help me understand the myriad ways in which someone can get confused and break things that I didn't think could be broken. It is also salutary to reflect that within his area of expertise -- which clearly isn't fonts -- he is an obviously intelligent and respected scholar.</p>
