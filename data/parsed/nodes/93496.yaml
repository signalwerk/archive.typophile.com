      <p>&gt; I've come to value very highly my 'naïve tester'</p>
      <p>Everybody should have one! Mine is an otherwise very agreeable fellow, but when I hand him over some newly written test software and peek over his shoulder, he invariable makes me squirm uncomfortably from the word "go". Behind his back, I'm always feverishly jotting down notes.</p>
