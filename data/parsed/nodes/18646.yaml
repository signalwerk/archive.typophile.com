      <p>If you notice with the comedy central logo, it doesn’t look like it was done in photoshop. There are no gradients, Only strong illustration. If your design is strong enough you won’t need gradients. It will have more staying power. </p>
      <p>As for a font I suggest something like Trade Gothic Extended. Try the 2 color version of the icon and shrink it in relation to the type. Tighten the tracking because your icon is so spread out, you don’t want the text to be also.</p>
