      <p>First thing that caught my eye was the strange perspective on the plane where the “buildings” rise from. It’s kind of weird.</p>
      <p>The idea of the buildings rising forming an F is nice, but I’m a bit bothered by the strong perspective. I’d make a kind of isometric grid, and just have the buildings rise without the high perspective. I hope I’m making sense here... it’s hard to explain what I’m talking about. Tomorrow, I’ll post a jpeg explaining what I mean.</p>
      <p>As for the type treatment, it’s okay now, but it seems a tad cliché. Maybe have the “Fever City” line in a condensed font, and the “studio” line in a normal, or even extended font. Trade Gothic’s font styles would indeed be excellent for that.</p>
