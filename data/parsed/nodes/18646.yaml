      <p>The strong perspective would work for me if it were executed correctly. It seems like they were going for a wacky cartoon approximation of perspective, but it ended up looking more like they just botched half the lines. Strong concept though. I would make an actual 3D model and try different viewpoints. If the left side of the F-building shows, you could try putting the type on it. A simple flythrough would also make a nice logo animation for the screen.</p>
      <p>The type is kind of traditional in comparison to the logo. It seems to call for something a bit more constructed.</p>
