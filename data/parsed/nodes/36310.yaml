      <p>Martin Majoor’s article in eye magazine no 63 is undoubtedly fresh and interesting, but it definitely should not be used as the only resource for research. Some of his assumptions are just that – assumptions – and there are some actual flaws in it.</p>
      <p>In this article he writes:<br>
      &gt; As there was no other sans serif design available at that time, any model would have been a serif typeface, but which?<br>
      (and he is suggesting that Walbaum might have been a major influence on the design on Akzidenz Grotesk by showing the lowercase a of both typefaces in comparison)</p>
      <p>First:<br>
      His assumption that there weren't any other sans serif typefaces around when Royal Grotesque and Breite Grotesk (which later became part and/or predecessors of the Akzidenz Grotesk family) were designed is simply wrong. There were already some other sans serif typefaces available.<br>
      (And: why should the sans serif have been necessarily modelled after a serif typeface? Reading Nicolette Gray's 'Nineteenth Century Ornamented Types and Title Pages' one could also come to the conclusion that there was some connection between early sans serif typefaces and ornamented 19th century typefaces. I know that for us nowadays this may sound surprising, as we tend to see a sans serif typeface as something without any ornaments, but contemporary reactions to the first sans serif typefaces seem to indicate that people with taste and distinction saw both ornamented typefaces and early sans serif typefaces as something crude and quite uncivilized – and they said so. The connection between moderist thinking and sans serif is a phenomenon of the 20th century, not of the 19th century)</p>
      <p>Secondly:<br>
      The caption for the illustration of the lowercase a of both typefaces (Walbaum and Akzidenz Grotesk) in comparison says:<br>
      &gt; A comparison between the basic character shapes of Walbaum (1800) and Akzidenz Gotesk (1898)</p>
      <p>(Now you would have to pick up eye magazine no 63, p 32, because the online version doesn't show any illustrations)<br>
      The shape of the a is indeed quite similar in both typefaces, but the thing is that what we are seeing is not the original 'a' of the metal version of these two typefaces, but the digital versions (which were actually re-creations, done much later). In the design of both these versions, Guenter Gerhard Lange was quite involved (he was artistic director of the type design unit at Berthold at this time). So, what Majoor is actually comparing in this illustration is not (original) Walbaum and (original) Akzidenz Grotesk, but Lange's redesign of Walbaum with Lange's redesign of Akzidenz Grotesk – and suprise, surpise, there are similarities! </p>
      <p>The article in eye continues:<br>
      &gt; If Helvetica was regrettable, then there is a whole range of typefaces that were designed in the 1950s that deserve the same criticism. Again, as in the 1900s, all the type foundries followed one another, afraid as they were of losing market share. The result was a range of neutral typefaces such as Folio, Venus and Mercator</p>
      <p>Well, Venus was around about 4 decades earlier. Already the guys at the Bauhaus used it sometimes.</p>
      <p>Martin Majoor's article is a fresh polemic against Helvetica, but for serious histoical research you have to find some other resources as well and draw your own conclusions. (If you find anything new, please let us know.)</p>
