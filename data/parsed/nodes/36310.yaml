      <p>Akzidenz Grotesk originated from the  H. Berthold AG type foundry in the late 19th and early 20th century. Newer versions were produced for the phototypesetting industry and the computer age. The new Akzidenz Grotesk version were designed under the direction of Gunther Gerhard Lange. The type face was released in in America under the name of Standard. Mainly the features were copied for the Helvetica halbfett grotesk was pattern after Akzidenz Grotesk.</p>
      <p>I was fortunate enough to have worked with the Berthold Fotoype group in Berlin while all this was going on.</p>
