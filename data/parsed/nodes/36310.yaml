    html: <p>I did a paper on Akzidenz last year and came to the conclusion that unless one knows German, and feels like spending a lot of time in central Europe digging through old books, the Typophile threads on Akzidenz are really the only in-depth examination of the history of the face. Erik Spiekermann confirmed that for me. If you want to look over my paper <a href="mailto:james.puckett@gmail.com" rel="nofollow">email me</a>.</p>
