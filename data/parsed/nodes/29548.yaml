    html: |-
      <p>Loren, you said you wanted to find something in your own collection that was similar to Gulliver. Can you post a list of serif fonts you have, or tell us what libraries you are using? It seems pointless for us to try to name 'similar' fonts, if we have no idea what you might have. </p>
      <p>For example, I would say that DSType's <a href="http://www.myfonts.com/fonts/dstype/aquila/" rel="nofollow">'Aquila'</a> and <a href="http://www.myfonts.com/fonts/dstype/cultura/" rel="nofollow">'Cultura'</a> have basic letterforms that are similar to Gulliver; and <a href="http://bowfinprintworks.com/SerifGuide/serifsamples/serif_c/collis_roman_full.gif" rel="nofollow">'Collis'</a> from TEFF is also rather similar in weight and letter shapes; or <a href="http://www.bowfinprintworks.com/SerifGuide/serifsamples/serif_fg/fedra_serif_b_full.gif" rel="nofollow">'Fedra Serif B'</a> is visually similar looking on a page and has a wide range of weights. </p>
      <p>Do you have any of those?</p>
      <p>- Mike Yanega</p>
