  html: '<p>For those who still produce PostScript Type 1 fonts we made available as a free download a small utility that has been in use for many years now at the Dutch Type Library. DTL IconDropper is a drag &amp; drop program that makes it very easy to change the icons, filetype and creator of PS Type 1 fonts. This can be done in batch by simply dropping multiple fonts on the program. DTL IconDropper can be downloaded from: <br> <br><a href="http://www.dutchtypelibrary.com/users/fmbrowser1en/Support.html" target="_blank">http://www.dutchtypelibrary.com/users/fmbrowser1en/Support.html</a></p>'
  html_clean: '<p>For those who still produce PostScript Type 1 fonts we made available as a free download a small utility that has been in use for many years now at the Dutch Type Library. DTL IconDropper is a drag &amp; drop program that makes it very easy to change the icons, filetype and creator of PS Type 1 fonts. This can be done in batch by simply dropping multiple fonts on the program. DTL IconDropper can be downloaded from: <br> <br><a href="http://www.dutchtypelibrary.com/users/fmbrowser1en/Support.html" target="_blank">http://www.dutchtypelibrary.com/users/fmbrowser1en/Support.html</a></p>'
