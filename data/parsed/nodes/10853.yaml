  html: '<p>For those who still produce PostScript Type 1 fonts we made available as a free download a small utility that has been in use for many years now at the Dutch Type Library. <span class="caps">DTL</span> IconDropper is a drag <span class="amp">&amp;</span> drop program that makes it very easy to change the icons, ﬁletype and creator of <span class="caps">PS</span> Type 1 fonts. This can be done in batch by simply dropping multiple fonts on the program. <span class="caps">DTL</span> IconDropper can be downloaded from: <br><br><a href="http://www.dutchtypelibrary.com/users/fmbrowser1en/Support.html" target="_blank">http://www.dutchtypelibrary.com/users/fmbrowser1en/Support.html</a></p>'
  html_clean: '<p>For those who still produce PostScript Type 1 fonts we made available as a free download a small utility that has been in use for many years now at the Dutch Type Library. <span class="caps">DTL</span> IconDropper is a drag <span class="amp">&amp;</span> drop program that makes it very easy to change the icons, ﬁletype and creator of <span class="caps">PS</span> Type 1 fonts. This can be done in batch by simply dropping multiple fonts on the program. <span class="caps">DTL</span> IconDropper can be downloaded from: <br><br><a href="http://www.dutchtypelibrary.com/users/fmbrowser1en/Support.html" target="_blank" class="link-external">http://www.dutchtypelibrary.com/users/fmbrowser1en/Support.html</a></p>'
