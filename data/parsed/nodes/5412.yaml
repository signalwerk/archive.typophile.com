  html: "<p>I hope someone is still up and can help me on this.  <br> <br>I've always used PC and had several problems on some os the works I've done on Xpress regarding the fonts and mac transmigration. The last one was a CD where I've used Requiem, built the deisgn on Xpress and as the printing of the films would be made on Germany, so I've sent the files to them. The result was a disaster, the font output gave me type A LOT SMALLER. They never replied to my technical question, so now that I'm on the process of printing a new work on a mac I question: <br> <br>1. I've switched to InDesign. Just finished a new work and will develop the films tomorrow. Before outputing to films, I've printed the same page using a PDF output (font included) and the Indesign document with the font converted to paths. There is a hugeeeeee diference. The convert to path gives the text a more black text. The PDF print is much more soft. Would you print the FILMS from the Indesign with the fonts (would have to give them to the films company, install etc) or use the convert to paths? <br> <br>2. That Requiem example, where I got a so much smaller type, can anyone explain? I can place a PDF with the original PC output and a photo of the final artwork. <br> <br>Thanks!</p>"
  html_clean: "<p>I hope someone is still up and can help me on this.  <br> <br>I've always used PC and had several problems on some os the works I've done on Xpress regarding the fonts and mac transmigration. The last one was a CD where I've used Requiem, built the deisgn on Xpress and as the printing of the films would be made on Germany, so I've sent the files to them. The result was a disaster, the font output gave me type A LOT SMALLER. They never replied to my technical question, so now that I'm on the process of printing a new work on a mac I question: <br> <br>1. I've switched to InDesign. Just finished a new work and will develop the films tomorrow. Before outputing to films, I've printed the same page using a PDF output (font included) and the Indesign document with the font converted to paths. There is a hugeeeeee diference. The convert to path gives the text a more black text. The PDF print is much more soft. Would you print the FILMS from the Indesign with the fonts (would have to give them to the films company, install etc) or use the convert to paths? <br> <br>2. That Requiem example, where I got a so much smaller type, can anyone explain? I can place a PDF with the original PC output and a photo of the final artwork. <br> <br>Thanks!</p>"
