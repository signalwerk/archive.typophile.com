    html: "<p>Interestingly, neither of these issues really has anything to do with PC versus Mac. They're both general workflow issues. There are two things going on: <br> <br>- when outputting a PDF from Acrobat, in the print dialog there is an option (in English, in Acrobat 6) in the \"Paper handling\" section called \"Paper scaling\" with the setting \"shrink to paper.\" This is often ON and needs to be set instead to \"None.\" <br> <br>- Converting text to outlines always results in slightly heavier text, due to differences in the way PostScript fills text as opposed to graphics. <br> <br>I hope this is helpful. <br> <br>Regards, <br> <br>T</p>"
