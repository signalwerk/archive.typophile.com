    <p>I have tried both whatfontis and whatthefont and the closest I have come is Big Caslon or Patrician. Not too close. On another note, I cannot find any history on Patrician, does anyone know who designed it. I love the Ms and N's in the logo but am guessing they may have it customised. Any help is greatly appreciated.<br>
    <a href="http://saturday-london.com/clients/dominic-jones/dominic-jones-packaging/" title="http://saturday-london.com/clients/dominic-jones/dominic-jones-packaging/">http://saturday-london.com/clients/dominic-jones/dominic-jones-packaging/</a> </p><div class="imageWrap"><img src="http://typophile.com/files/Saturday_DominicJones_AW09-logo1_5187.jpg"></div><p></p>
