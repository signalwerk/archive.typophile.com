      <p>Looks like they've started from Saturday's own corporate typeface <a class="freelinking external" href="http://www.typophile.com/node/77367" rel="nofollow">Industria</a> and tweaked it. It looks to mix influences from <a class="freelinking external" href="http://www.fonts.com/font/carter-and-cone/big-caslon" rel="nofollow">Big Caslon</a> (former font on which <a class="freelinking external" href="http://www.typophile.com/node/77367#comment-444953" rel="nofollow">Industria is based</a>) and <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/tiffany" rel="nofollow">Tiffany</a> (mainly on /<a class="freelinking external" href="http://www.myfonts.com/fonts/itc/tiffany/std/glyphs.html#glyphs/538425/46" rel="nofollow">M</a> and /<a class="freelinking external" href="http://www.myfonts.com/fonts/itc/tiffany/std/glyphs.html#glyphs/538425/47" rel="nofollow">N</a>)/Big Caslon /A top.<br>
      Don't know too much about <a class="freelinking external" href="http://www.myfonts.com/fonts/scriptorium/patrician" rel="nofollow">Patrician</a> part of it looks very close to (Big) Caslon... There are also some <a class="freelinking external" href="http://typophile.com/node/51142?page=1#comment-310076" rel="nofollow">rip-off accusations on some Scriptorium David Nalle's fonts</a> so better avoid Patrician...</p>
