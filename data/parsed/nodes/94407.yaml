    <p><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>, a robust typefamily by Nicolien van der Keur, for complex text environments, now offers even more possibilities. The recent update includes a full set of phonetic symbols, designed upon request for the use in dictionaries, and the extension to polytonic Greek. Although the historical way of writing Latin and Greek is very different from each other, the Greek is designed to harmonize well when used together with the Latin. Irene Vlachou and Gerry Leonidas assisted the development of <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> polytonic Greek with their professional expertise.</p>
