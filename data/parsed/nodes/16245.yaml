      <p>okay, i’ll give you a little more history: </p>
      <p>i am working on a client who has requested that his book be set in a ’new’ typeface,  something made since 1980; for his last book, he used a face from a young dutch designer, and now is interested in working with an american typographer’s work. </p>
      <p>the ’best’ is, of course, a matter of taste, but i was thinking someone on the level on hoefler</p>
      <p>and, yes, it needs to be a type-designer, not a type-user</p>
    html_clean: |-
