    html: <p>If you want to avoid 'Interactive | DVDs' being read as 'Interactive DVDs', why not just transpose them? <br> <br>The latest logo is much better, but the curves feel a little awkward, or maybe just too wavy and not crisp, clean, and geometric enough. The silhouette of the disc feels more like propellers now. Perhaps the connection from the 'O' to the curves should be a straight rule (thinner than the type strokes)?</p>
