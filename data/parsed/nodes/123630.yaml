      <p>It is an actual typeface, according to Mr. Greenblat, but no name was forthcoming.</p>
      <p>I'll open it up to the rest of the forum; someone is bound to recognize it....</p>
      <p>EDIT: It's Filmotype Metro, seen here:<br>
      <a href="https://www.flickr.com/photos/28813954@N02/9142381025/in/album-72157634337086325/" title="https://www.flickr.com/photos/28813954@N02/9142381025/in/album-72157634337086325/">https://www.flickr.com/photos/28813954@N02/9142381025/in/album-721576343...</a></p>
      <p>It doesn’t appear to have been digitized yet....</p>
