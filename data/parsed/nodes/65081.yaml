    <p>Any guess what type of calligraphy these capital letters are? Just the capital letters and not the lower case ones. I’m guessing that the vines or loops that flow away from the capital letters were added separately for aesthetics and not part of the font. Any ideas? Thanks!</p>
    <p>JesseZ.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/font_6037.jpg"></div><p></p>
