    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Hoefler &amp; Frere-Jones</strong></p>
    <p>Since 1989, <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Jonathan Hoefler</a> and <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a> have helped some of the world's foremost publications, corporations, and institutions develop their unique voice through typography. Their body of work includes some of the world's most famous designs, typefaces marked by both high performance and high style.</p>
    <p>In 2004, the <a href="/wiki/Hoefler%20Type%20Foundry" class="freelinking" rel="nofollow">Hoefler Type Foundry</a> entered its sixteenth year as Hoefler &amp; Frere-Jones. H&amp;FJ continues to work with brand leaders in every sector, developing original typefaces and licensing fonts from its library of nearly 1,000 designs, and it publishes fonts exclusively through its New York sales office and its web site at <a href="http://www.typography.com/" rel="nofollow">www.typography.com</a>.</p>
    <p>Fonts in the H&amp;FJ retail library include <a href="/wiki/Acropolis" class="freelinking" rel="nofollow">Acropolis</a>, <a href="/wiki/Champion%20Gothic" class="freelinking" rel="nofollow">Champion Gothic</a>, <a href="/wiki/Cyclone" class="freelinking" rel="nofollow">Cyclone</a>, <a href="/wiki/HTF%20Didot" class="freelinking" rel="nofollow">HTF Didot</a>, <a href="/wiki/Fetish%20No.%20338" class="freelinking" rel="nofollow">Fetish No. 338</a>, <a href="/wiki/Gestalt" class="freelinking" rel="nofollow">Gestalt</a>, <a href="/wiki/Giant" class="freelinking" rel="nofollow">Giant</a>, <a href="/wiki/Gotham" class="freelinking" rel="nofollow">Gotham</a>, <a href="/wiki/Gotham%20Condensed" class="freelinking" rel="nofollow">Gotham Condensed</a>, <a href="/wiki/The%20Historical%20Allsorts" class="freelinking" rel="nofollow">The Historical Allsorts</a>, <a href="/wiki/Hoefler%20Text" class="freelinking" rel="nofollow">Hoefler Text</a>, <a href="/wiki/Hoefler%20Titling" class="freelinking" rel="nofollow">Hoefler Titling</a>, <a href="/wiki/Knockout" class="freelinking" rel="nofollow">Knockout</a>, <a href="/wiki/Knox" class="freelinking" rel="nofollow">Knox</a>, <a href="/wiki/Leviathan" class="freelinking" rel="nofollow">Leviathan</a>, <a href="/wiki/Mercury" class="freelinking" rel="nofollow">Mercury</a>, <a href="/wiki/The%20Proteus%20Project" class="freelinking" rel="nofollow">The Proteus Project</a>, <a href="/wiki/Requiem" class="freelinking" rel="nofollow">Requiem</a>, <a href="/wiki/Saracen" class="freelinking" rel="nofollow">Saracen</a>, <a href="/wiki/Topaz" class="freelinking" rel="nofollow">Topaz</a>, <a href="/wiki/Whitney" class="freelinking" rel="nofollow">Whitney</a>, <a href="/wiki/Whitney%20Condensed" class="freelinking" rel="nofollow">Whitney Condensed</a>, <a href="/wiki/Whitney%20Numeric" class="freelinking" rel="nofollow">Whitney Numeric</a>, <a href="/wiki/Ziggurat" class="freelinking" rel="nofollow">Ziggurat</a>.</p>
