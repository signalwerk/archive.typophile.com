    My latest acquisition ($1) at the local charity store.<br>
    Thought you might be interested in this lovely and meticulous (to my eyes at any rate!) piece of graphic design.<br>
    I would date it from the early 1950s.<br>
    The “Directions” panel is reminiscent of Lissitzky’s layout for <a href="http://typophile.com/node/19951" rel="nofollow"><em>The Isms of Art</em></a>.<br>
