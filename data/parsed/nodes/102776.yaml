    html: "<p>Don’t be such a snob, John!</p>

      <p>This is vernacular, ephemeral design, not the sort of thing that’s in design history books, although it could be compared to a Sutnar catalog layout done with similarly limited means.</p>

      <p>I haven\x1d’t tried the device yet, but my post is about the package.</p>

      <p>Sure, the reach of the design exceeds its grasp, hence the imperfections in execution, but it’s remarkable for how much layout and content complexity went into such a small package (and is nicely resolved), and that’s what I enjoy about it—and the bright, open, colorful interplay of figure and ground in a two-color job. Perhaps meticulous isn’t quite the right word, but I was attempting to describe the ﬁne level of detail which the layout addresses, more than the execution per se.</p>

      <p>No doubt the designer would have liked to have been able to say to the copywriter, “please write the four paragraphs of Directions to be the same length,” then he wouldn’t have had to struggle with the vertical justification of different leading. But that wouldn’t have been so readable…</p>

      <p>And of course the angle of the A in SPIRAL isn’t right, but that’s the kind of imperfection which one cherishes in such meat-and-potatoes design, as opposed to the dull consistency of high-end professional slickness.</p>"
