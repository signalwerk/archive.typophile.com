      <p>I first saw the apple parer being used at a place called <a class="freelinking external" href="http://www.momsapplepieco.com/" rel="nofollow">Mom's Apple Pie</a>, which is a bakery. It blew me away that a. it looked so cool, and b. a commercial outfit would still find a hand cranked piece of machinery the best thing to use today. Why this is perfect for pies is that it cuts your time in half getting the apple slices, and they come out all of uniform thickness, so everything in the pie is finished cooking to the right amount at the same time. You just take the spiral sliced apple, cut it in half vertically, and you have perfect slices that you can fan out in the pie crust. </p>
      <p>There have been 5 or 6 revolutions for more efficiency in the machinery for printing and font production since 1840, when I think the steam-engine driven presses started to be used widely. But this contraption is still the best. Awesome.</p>
