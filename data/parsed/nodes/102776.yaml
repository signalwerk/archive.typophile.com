      <p>I think neither the packaging nor the product are well designed, and certainly not meticulous. The typography is clumsy and weirdly inconsistent. Punctuation is used in some place and not in others. The dots between the list of vegetables are different weights, for no conceivable reason. The illustrations are labeled, 'FIG. No. 1' etc., without any reason, since they are not referenced anywhere.</p>
      <p>But all this seems minor compared to the notion that hard vegetables would be effectively or safely cut using a single finger to turn the blade and without any way to hold the vegetable in place other than with your other hand. I really don't recommend trying to use this device if you value your fingers. I've used spiral slicers with table top clamps, proper turning handles, etc. and even then they are seldom easy to operate. Carrots? Really?</p>
