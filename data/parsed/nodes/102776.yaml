      <p>I have this apple peeler, slicer, corer. It spiral peels and does a spiral slicing of the apple, leaving the core behind. It's a purely hand-driven, mechanical thing, a bit Rube Goldberg looking. It works like a dream if the apple is not too soft or misshapen. Kids go nuts over it, and I like it myself. </p>
      <p>Apple pie, apple sauce. You need this. I don't think Ron Popiel ever sold it though. Maybe because it's probably 19th century technology—and it works :) </p>
