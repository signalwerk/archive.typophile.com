      <p>Your date is just about perfect. According to the Popeil story, this about Ron Popeil:</p>
      <p>"He got an early education in the housewares market working weekends in his father's Chicago factory making kitchen products. At 16, Ron began selling Popeil Brothers' "Spiral Slicers" and "Slice-A-Way" gadgets in street markets. Within a year, the teenager had moved out on his own, hawking Popeil Brothers' products on a flat commission basis at the Woolworth's store in downtown Chicago.</p>
      <p>With his commercials, Popeil has become a pop icon. He created numerous catchphrases, such as "But wait, there's more," "operators are standing by," and "set it and forget it." He was named by Self magazine as one of the 25 people who have changed the way we eat. Popeil was even spoofed on the television show, Saturday Night Live, by actor Dan Aykroyd with an imaginary product called the "Bass-O-Matic," which was supposed to slice and dice fish."</p>
      <p>Age 16 would be 1951 since he was born in 1935.</p>
      <p>Another source says the original retail price of the slicer was fifty cents.</p>
