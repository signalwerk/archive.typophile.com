      <p>Well, yes, that's rather my point. I suppose I have a lingering utopian modernist outlook, inherited from my father, that design should be a functional aid to the user, including revealing truth rather than 'talking up' things that are, frankly, a bit rubbish. BTW, the fact that this is in the original packaging rather suggests that no one ever used the thing, or maybe used it once and found that it didn't work as advertised.</p>
      <p>The problem of a spiral vegetable cutter is an interesting one. Do you turn the blade, or do you turn the vegetable? How do you hold the vegetable in the correct position relative to the blade as it is cut? How do you deal with both soft vegetables such as zucchinis and hard ones such as carrots or yams? Do you rely on human strength or mechanical advantage? It's a significant engineering problem, albeit for a humble end (and seriously, how often does one need spiral cut vegetables?)</p>
