    html: "<p>Wow: a very interesting design, indeed, with a few unexpected twists—especially the Ad Lib kinda thing going on in the “Mars” specimen. The only thing that strikes me as odd is the MR ligature, which seems a bit clumsy to my old eyes. I understand <strong>why</strong> it’s constructed the way it is, but it is just not working for me, curmudgeon that I am…</p>"
