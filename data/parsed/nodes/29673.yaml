    html: |-
      <p>The Typophile.com wiki could be the best place for a full-featured reference of OpenType mechanics. In its current shape it is a whos who of type and a really great area for primers on many fields.</p>
      <p>The reasons why I think it might do well in its own space are  somewhat complicated, but I’ll try and explain.</p>
      <p>What I would like to see is a highly-interactive technical manual, meaning that the searching, categorizations and general feel is optimized for finding out what I want on a particular facet of OT. The Typowiki has a much rounder, more narrative feel, and is fully integrated as an accessory to the forums. The wiki results are returned with topic threads.</p>
      <p>I would like the OT wiki to be a neutral place. Building it inside the Typowiki would possibly force any contributors to feel like they had to be a ’part of the scene’. Or it might.</p>
      <p>I would like to see the data as open and as accessible as a Wikimedia Foundation project. In fact, more so than some of those are. I would like no one to ’own’ the wiki, so to speak, and be able to fork it, archive it or whatever-they-like it.</p>
      <p>Uptime. When Typophile is down is when I need the reference info the most, because I’m getting more work done! :)</p>
      <p>There is some relational wiki technology that is not used here that I am considering, that would be particularly helpful to a spec-centric wiki, and I am intrigued by how that could help. In fact, most of it is still being developed, so I guess that is neither a pro or con.</p>
      <p><a href="http://www.chozcunningham.com">Choz Cunningham</a><br>
      <a href="http://www.exclamchine.com">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark">The Snark</a></p>
