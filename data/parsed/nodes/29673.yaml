    <p>I think something like <a href="http://diacritics.typo.cz/" title="http://diacritics.typo.cz/">http://diacritics.typo.cz/</a> but about the features (and use of scripts, languages, etc) of <a href="/wiki/OpenType" class="wiki">OpenType</a> might be very useful. It could explain which tags have current application support, discussions of implementation, all sorts of things.</p>
    <p>1) Is there one already?</p>
    <p>2) If not, is there interest in one?</p>
