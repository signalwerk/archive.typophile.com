    <p>I’ve three fonts that I got curious about, on two posters. The first is used to spell “Abessynian” in the first poster:</p>
    <p><a href="https://web.archive.org/web/20080904220751/http://www.cafepress.com/dogs_of_war/4668414" title="http://www.cafepress.com/dogs_of_war/4668414">http://www.cafepress.com/dogs_of_war/4668414</a></p>
    <p>The others are used for the top two lines in the following, “OBEY THE BASSETT”:</p>
    <p><a href="https://web.archive.org/web/20080904220751/http://www.cafepress.com/dogs_of_war/981540" title="http://www.cafepress.com/dogs_of_war/981540">http://www.cafepress.com/dogs_of_war/981540</a></p>
    <p>I’ve a feeling the “OBEY” font may have also been used by Shepard in the original OBEY series, but I couldn’t find an example.</p>
