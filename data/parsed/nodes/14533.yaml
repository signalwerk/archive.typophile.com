      <p><em>we cannot expect our scholars—the ones who most need to use this font—to have anything more than a word processor such as Microsoft Word</em></p>
      <p>I would hope that you wouldn’t expect scholars to design their own documents, which is a task best left to designers.  On the other hand, if all your scholars have access to is Word, then the only fonts they should have access to are Windows 95 format PS fonts — at least that opens a wide Unicode range to them.</p>
