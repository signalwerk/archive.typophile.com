  html: |-
    <p>Greetings,</p>
    <p>I am responsible for overseeing the development of a new font for use to scholars. The optimal design of this font requires some complexity in options for glyph substitution, repositioning, and so forth. Obviously, to do this would require <a href="/web/20080907030307/http://www.typophile.com/wiki/OpenType" class="wiki">OpenType</a>.</p>
    <p>What is the prognosis of software development for advanced OT features? It is wonderful to think that our publications department, which runs InDesign, can use these features, but we cannot expect our scholars—the ones who most need to use this font—to have anything more than a word processor such as Microsoft Word.</p>
    <p>Is anyone keeping track of programs that support or intend to support advanced OT features? Thanks,</p>
    <p>jk</p>
