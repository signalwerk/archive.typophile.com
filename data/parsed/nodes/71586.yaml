  html: |-
    <p>Hey there,</p>
    <p>I am currently looking for a font that has a similar Art-Nouveau feel as the Belwe font. This means that it needs irregular sized B and A. I think this is called a high and low axis?<br>
    Anyay we love Belwe but would actually like it to be a sans-serif. The shapes in this font are supernice but it is a bit too romatic with all the serifs.<br>
    Does somebody know a sans-serif which relates to this font?</p>
    <p>Thank you for the help!</p>
