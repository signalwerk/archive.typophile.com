    <p>Can anyone ID the font used by the Giant Eagle supermarket company?  It's been bugging me for a while.</p>
    <p>Small logo here: <a href="http://www.gianteagle.com/media/HomePage/ge_logo.jpg">http://www.gianteagle.com/media/HomePage/ge_logo.jpg</a></p>
    <p>and on signage outside a store:  <a href="http://www.comfortrol.com/images/giant-eagle.jpg">http://www.comfortrol.com/images/giant-eagle.jpg</a></p>
    <p>Any thoughts?</p>
    <p>-peterb</p>
