    html: |-
      <p>What kind of hints are you talking about? I'm guessing that you're talking about delta hints, which have particular ‘strength’ expressed as a fraction of a pixel. In FontLab, all deltas are expressed in 1/8th of a pixel, with the maximum strength for any individual delta being one pixel.</p>
      <p>[You can shift things more than one pixel by combining medial and final deltas. In VTT, you can define the strength of deltas, so it is possible to shift by more than a pixel with a single delta or to use a smaller refinement than 1/8th of a pixel. When using deltas for fonts in black and white rendering, it is typical for many hinters to move things by whole pixels; whereas, witg greyscale rendering one can use smaller delta hints to ‘paint’ shades of grey. ClearType by default ignores x-direction deltas, because otherwise fonts hinted for black and white environments would get messed up. This is not an ideal solution to the problem!]</p>
      <p>Now, if what you want to know is the relationship of the strength of a delta hint at a particular ppm size to a measurement in points, then you need to know the resolution of the output device, because you need to know at what nominal point size that ppm size will be used.</p>
      <p>I'm pretty sure that whatever calculation you used to conclude that ‘one hint at 12PPM is 83pt’ is really badly wrong. Consider: a delta strength is less than or equal to one pixel at any ppm size; ergo, at 12ppm a delta is up to 1/12th of the nominal point size at which that 12ppm size is used. It would be an incredibly low resolution device at which 83pt = 1/12 of the nominal point size for a 12ppm bitmap.</p>
