      <p>The use is, if you want your glyphs to look at their best at a certain PPM value, let's say 12PPM, that you can change the glyphs to the hint size of that PPM value accordingly. Adjust the glyphs to the hints, instead of the other way around.</p>
      <p>By looking at the comments on this question I'm afraid there is no calculation formula for this :(</p>
