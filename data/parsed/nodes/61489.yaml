    html: |-
      <p>&gt;...if you want your glyphs to look at their best at a certain PPM value...</p>
      <p>forget the 'hints'. find the Units Per Em of your font,<br>
      divide this value by the pixels per em of the target size,<br>
      use this 'em units per pixel value' (you may have to round it yourself),<br>
      to define the x and y grid steps in FL preferences,<br>
      scale character groups  (a-z or A-Z, e.g.) modestly in y to fit the grid, (end of formula)<br>
      leave more time for x-fitting to the grid (glyph by glyph),<br>
      make sure to set each glyph's total width to a whole number of pixels, (don't forget space glyph), </p>
      <p>Proof and serve.</p>
      <p>Cheers!</p>
