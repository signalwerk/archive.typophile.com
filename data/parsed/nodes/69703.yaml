    <p>I picked up a copy of  John Mullan's <em>How Novels Work</em> (OUP) in a bookshop, and thought the text face was surprisingly pleasant and readable. I wondered what it was, as none of the Bodoni and other "modern" (in the classification sense) faces I have on my computer really work for sustained text.</p>
    <p>I didn't buy the book (I don't buy books just for the typeface any more) and I haven't been able to find a downloadable image, but you can look at extracts from the book on <a href="http://www.amazon.co.uk/gp/reader/0199281785/ref=sib_rdr_ex?ie=UTF8&amp;p=S00P&amp;j=1#reader-page" rel="nofollow">Amazon</a> and <a href="http://books.google.co.uk/books?id=ubvNf_U-Qu4C&amp;printsec=frontcover&amp;dq=how+novels+work+john+mullan&amp;ei=XDzPS_e_MormzASC9ZHSAg&amp;cd=1#v=onepage&amp;q&amp;f=false" rel="nofollow">Google Books</a>.</p>
    <p>Any thoughts?</p>
