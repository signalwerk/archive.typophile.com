    html: <p>It looks like the designer made a square with rounded corners, skewed it 36 degrees, rotated it 45 degrees, added a version with a big stroke underneath, knocked the smaller one out of the bigger one, copied it and moved the copy below, then added the two extra connectors, combines all the paths, and then tweaked all of the curved connections using circles, the pathfinder, and the pen tool.</p>
