  html: |-
    <p>I love this logo and I can't seem to figure out how to create it in illustrator. Could anyone give me a few helpful hint on what tool to use. I know there has to be some shortcuts other than the pen tool. I want to figure how to pull off the rounded edges and have a perfect symmetrical icon.</p>
    <p>Thanks, Donny</p>
