      <p>You can do "live" rounded corners with Effects &gt; Stylize &gt; Rounded corners. Although you'd want to adjust them manually at the end of the process, this could be good for quick mockups. </p>
      <p>Here's a tutorial: <a href="http://www.kadavy.net/blog/archive/2004/12/using_adobe_ill.php" title="http://www.kadavy.net/blog/archive/2004/12/using_adobe_ill.php">http://www.kadavy.net/blog/archive/2004/12/using_adobe_ill.php</a></p>
