  html: |-
    <p>any recommendations for body/subhead text combo for a corporate brochure.<br>
    client supplied a dell brochure for reference and it uses a sans serif for body text,<br>
    unfortunately the client’s brochure has a lot more body text, three full pages at three columns each.</p>
    <p>I’ve tested Myriad for a sans, but then went with a used serif: Minion for economical reasons,</p>
    <p>I’m wondering if there’s a serif that reflects, corporate and technology more than Minion and legible at 8-9 points. I have to use a font from bitstream. </p>
    <p>the brochure is going to internal coporate managers to push the companies IT guys, hence technology.</p>
    <p>any suggestions very much appreciated from you smart people!</p>
