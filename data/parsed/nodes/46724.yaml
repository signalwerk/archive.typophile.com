    <p>Hi there,</p>
    <p>I am having an issue with TTF fonts in PCs being displayed too small in MS Word and Bistream’s font manager . (see attach)</p>
    <p>In the beginning I thought I’ve made a mistake in the TrueType Metrics, but after reading in the FL Forum “Tips and Tricks: Setting Font Family Metrics in FontLab” carefully I realized this was not the case.</p>
    <p>The fonts has 1000 units UPM and only if I set it with 2048 they are displayed correctly.</p>
    <p>I thought 2048 units were not mandatory for TTF fonts but apparently this is the case here.</p>
    <p>Or am I doing something else wrong?</p>
    <p>Have anyone had the same problem with TTF set with 1000 units? And which was the solution?</p>
    <p>Thanks in advance.</p>
