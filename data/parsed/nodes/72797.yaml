      <p>Hello, and welcome to Typophile! Your store sounds awesome. I wish I wasn't on the East coast!</p>
      <p>Some answers:</p>
      <p>1. Using region-specific fonts is often discouraged, as they frequently tend to add to a stereotype and thus look gimmicky with tasteless results. You may want to consider using one or two type families and, say, use colors specific to each geo-political region. If these Highlight areas are separate from one another, it may be a very effective and dramatic approach. </p>
      <p>2. Have you considered hiring a graphic designer with strong typographic skills rather than trying a do-it-yourself design approach?</p>
      <p>I realize these probably aren't the kinds of answers you're looking for, but they're worth consideration.</p>
      <p>Cheers</p>
