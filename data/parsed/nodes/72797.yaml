    <p>I'm in the mist of starting a curated store/gallery in San Francisco and online that will focus on limited edition fashion, furniture, music,design, objects, art books and magazines from a specific region. The first region I'm going to focus on is Belgium. It will be a collection with vintage industrial pieces as well as "cutting edge" contemporary pieces.</p>
    <p>I'm calling the store Highlight which is the brand name that will expand to include Highlight Belgium, Highlight California, Highlight Japan, etc. For every country or region I would like to use a specific font, however I would like the word Highlight to always stay consistent.</p>
    <p>A few questions for you.</p>
    <p>1. Does the community have any recommendations on a source for regional specific fonts?<br>
    2. For the word "Highlight" what fonts are versatile and can compliment the regional specific fonts for the region?</p>
