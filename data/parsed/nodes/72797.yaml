      <p>Thanks for the comment microspective. I'm working with a designer right now and he's taking his time to come up with ideas. I'm playing the role of creative director and he's playing the role of a draftsmen with little creative input. I have been tentative about playing with "country specific" fonts for the same gimmicky reasons that you mentioned.  </p>
      <p>I was thinking of using "regional or "country specific" coloring to denote the country to the font. Similar to what Wallpaper* magazine did with their Brazil issue a couple months ago.They used their same font but colored the various letter green or yellow to denote the country.</p>
      <p>Creative but obvious, I'm searching more for a sort of logo/design that the user will not be able to grasp at first glance but have an "ah-huh" moment on second glance. For years, I never saw the arrow in the negative space of the FedEx symbol until someone pointed it out to me. Now the arrow is the only thing I look at it when I see a FedEx truck. </p>
      <p>Thanks for the suggestions and please keep them coming.</p>
