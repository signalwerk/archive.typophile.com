      <p>Nice how the diamond tittles ﬁt with the tonos in the dieresistonos mark.<br>
      The same ductus works well for marks combining the inverted breve form of perispomeni (rather than the tilde variant) over a breathing mark.<br>
      All very neat. Respect!</p>
