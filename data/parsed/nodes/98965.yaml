    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Maiola-greek_6086.png"></div><p></p>
    <p>Veronika Burian's multi-award winning type family <a class="freelinking external" href="http://www.type-together.com/maiola" rel="nofollow">Maiola</a> has grown even bigger. Its Pan-European OpenType Pro version now supports, in addition to Cyrillic and Latin A, full polytonic Greek. The calligraphic details of Maiola collaborate gracefully with each of the three scripts and generate a sense of consistent personality that creates a welcoming tension on the page. The polytonic extension was done by Greek specialist Irene Vlachou.</p>
    <p>More information about Maiola on <a class="freelinking external" href="http://www.type-together.com/maiola" rel="nofollow">our web</a> </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Maiola-greek2_6469.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Maiola-greek3_3802.png"></div><p></p>
