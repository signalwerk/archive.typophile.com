    html: |-
      <p>&gt;&gt;<br>
      - 9pt ITC Stone Serif, 14pt leading<br>
      - 2-column layout<br>
      - each column 2.375 x 6.5 in<br>
      - 0.25 column gutter<br>
      - 0.5pt rule in between columns<br>
      &gt;&gt;</p>
      <p>Lets see, that's a 14.25 pica column width, 1.5 pica gutter, and 39 pica column depth. Setting 9-point Stone serif (sets a bit large) with 14-point linefeed. Off the top of my head, I don't remember the characters-per-pica data for Stone Serif, but I'd guess is equal to or less than 10-point Times. </p>
      <p>You don't say what the trim is (assuming this a book). The thing is, all spaces relate. My gut feeling is you have too much leading for what will amount to a pretty cramped column. The second thing is that the column gutter is wide enough that you probably don't need the rule.</p>
      <p>In any case, this is a fairly narrow column; a lot will depend on the author's word selection. Scholarly prose not only has a lot of long words, equally important is the relative absence of short ones. Newspapers have an advantage here; the prose is suppose to be terse.</p>
      <p>There is a big difference between "elegant" and "unacceptable"; it will be the details that determine if it is unacceptable</p>
