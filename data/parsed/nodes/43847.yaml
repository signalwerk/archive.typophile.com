      <p>You don't specify whether your text is justified or FL/RR. I wonder if the rule will look odd and off-center if the text isn't justified. Or whether it's necessary with .25" btw the columns, as Charles said.</p>
      <p>Another thing to be careful about with columns is the proportion of the gutter between the columns to the leading. If you have generous leading, as you do, make sure that it doesn't visually exceed the space between the columns and thus get confusing to read.</p>
      <p>BTW it would have been nice to see a sample rather than use our imagination.</p>
