      <p><cite>What’s acceptable…</cite></p>
      <p>Readable typesetting.</p>
      <p><cite>…and unacceptable in column usage?</cite></p>
      <p>Unreadable typesetting.</p>
      <p>Aside from not justifying columns without enough characters to balance the spaces, there aren’t really any solid rules. The nature of the text, the press, the paper, the font, character size, and so on all come into play, and the only way to really know what works is to set it up, print it out, and look at it. Convention is important to consider, but conventions vary and can’t really be used to generate rules that apply to anything but conventional designs.</p>
