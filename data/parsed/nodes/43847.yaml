      <p>A lot of what is behind newspaper columns is flexibility. The have advertising to sell, and you can buy a variety of space. The more columns, the greater variety of advertising space available. There is some of this thinking in magazines as well.</p>
      <p>But the article too can vary in column width, depending on how the editor/layout person chooses importance, copyfitting, etc.</p>
      <p>* * *</p>
      <p>It is unusual, in a book, to have equal top &amp; bottom margins. It happens, but it is also unusual to have equal inside/outside margins. I don't know magazines very well; I do know scholarly journals, which tend to take on book characteristics.</p>
      <p>The best advice I know of when you're unsure about something is to steal. Look at a popular/respectable publication in your field &amp; steal &amp; adapt everything useful. But watch out for differences in spacing; as I said, spacing all interrelates.</p>
      <p>BTW, we once did a book on Spina Bifida, &amp; used the entire Stone "Clan" (serif, sans, and informal). <cite>Living with Spina Bifida: A Guide for Families and Professionals</cite> Chapel Hill, UNC Press. What shows on the web isn't the text as set, but here is a link:</p>
      <p><a href="http://uncpress.unc.edu/chapters/sandler_living.html" title="http://uncpress.unc.edu/chapters/sandler_living.html">http://uncpress.unc.edu/chapters/sandler_living.html</a></p>
      <p>The following link shows the book as set, though the book was obviously scanned (in the book, the side-rules are in red), so the type isn't as clear as if a PDF was used</p>
      <p><a class="freelinking external" href="http://books.google.com/books?hl=en&amp;id=SScROpQ6v3sC&amp;dq=Living+with+Spina+Bifida&amp;printsec=frontcover&amp;source=web&amp;ots=HZD60ssmi7&amp;sig=rT64qQC-hLwVGIOJxZJmaeGSV-Y#PPA49,M1" rel="nofollow">http://books.google.com/books?hl=en&amp;id=SScROpQ6v3sC&amp;dq=Living+with+Spina+Bifida&amp;printsec=frontcover&amp;source=web&amp;ots=HZD60ssmi7&amp;sig=rT64qQC-hLwVGIOJxZJmaeGSV-Y#PPA49,M1</a></p>
      <p>If you have obviously different voices or audiences, the different but related typefaces can help.</p>
      <p>FWIW</p>
