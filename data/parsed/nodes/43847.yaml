      <p>Chipman, thanks so much for the tip, will look into it.</p>
      <p>Aluminum, easier scanning is why I pursued a double column layout. The textbook isn't so much a textbook as it is a manual. It's a how-to that has lots of quick reference features and some selective in-depth information.</p>
      <p>What's a bit confusing is that newspapers do have lengthy articles that are set in narrow columns. These articles, I assume, aren't meant for scanning, like classifieds (granted an unfair comparison as the two have drastically different column widths). But yes, would be good to know the thinking behind newspaper layouts, or if there's been any sort of usability studies on columns.</p>
      <p>Charles, thanks so much for the insight. The top/bottom margins are 1 in, the inside/outside margins are 0.75 in. Apart from the occasional medical term, the prose is a bit informal so fortunately I don't have to worry too much over long words.</p>
