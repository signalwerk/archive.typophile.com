    <p>Hello.</p>
    <p>What's acceptable and unacceptable in column usage? I read somewhere to avoid too narrow columns as it compromises readability, understandably so. But are newspapers and magazines exempted from this rule? Is it not acceptable to apply the same narrow columns in a text book?</p>
    <p>Case in point..<br>
    - 9pt ITC Stone Serif, 14pt leading<br>
    - 2-column layout<br>
    - each column 2.375 x 6.5 in<br>
    - 0.25 column gutter<br>
    - 0.5pt rule in between columns</p>
    <p>Would appreciate any thoughts.. Also wondering if this type layout is reasonably accessible to both high and low level readers.</p>
    <p>Thanks so much, anything helps!</p>
    <p>PS. I've searched the forums best I can for this topic, I apologise in advance if it's been covered before.</p>
