  html: <p>I understand that Arial was commissioned by Miscrosoft as a sub for helvetica so that they would not have to pay helvetica royalties....So does that mean that Windows does not ship with the Helvetica at all? Curious.... OS X has both Helvetica and Arial, so am wondering if Windows only has Arial?</p>
