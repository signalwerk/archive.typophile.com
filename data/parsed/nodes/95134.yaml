    html: |-
      <p>Arial pre-dates Windows; IIRC it IBM was using it first, near the time when it was made, 1982.</p>
      <p>Microsoft generally got Monotype fonts (the Garamond, Gill Sans, News Gothic and a few others bundled with MS Office were Monotype licences; Times New Roman is from Monotype) around the time, which they stuck with and I suppose it's why they picked up Arial, being compatible in metrics to Helvetica.</p>
      <p>I think some of the Nimbus (URW) family are available open-source, which is their version of Helvetica.</p>
    html_clean: |-
