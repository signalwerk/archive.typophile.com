      <p>When it comes to fonts, Microsoft's position is quite clearly stated:</p>
      <blockquote><p>The fonts are governed by the same restrictions as the products they are supplied with. You are not allowed to copy, redistribute or reverse engineer the font files. For full details see the license agreement supplied with the product. </p></blockquote>
      <p>So whether you saw the licensing information for the XML converter tool or not, the fonts you helped yourself to are governed by that license. It may be the case that this license in fact does not prohibit what you have done, my point is that you should check the license and not <em>presume</em> that the fonts are some kind of free gift.</p>
