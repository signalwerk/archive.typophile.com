      <p>Windows XP and previous versions indeed only have Arial. If you buy Microsoft Word, I think you get Helvetica and numerous other typefaces then.</p>
      <p>But there are open-source typefaces that clone Helvetica, so Microsoft users are not that deeply disadvantaged.</p>
      <p>John Savard</p>
