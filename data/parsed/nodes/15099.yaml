    html: |-
      <p>Stephen, it’s a good start.<br>
      The weight difference between “head” and “way” are very close and on the drop shadow versions difficult to see. I’m not sure of the company or their intent, but the word-play should make sense.<br>
      “Headway” has a positive sense of making progress, and “Head Way” either connotes cerebral activity or a brand of headphones or hats.</p>
      <p>Also, try treating the “y” as if you rotated the “h” 180°. That way the design looks completely symetrical with the “d” as centerpoint. Lose that little sliver of white between the stems of the drop shadow “h” since it is too thin and becomes bothersome.  Good luck.</p>
      <p>————————————————————-<br>
      Yes, I’m old, but I’m making headway!</p>
