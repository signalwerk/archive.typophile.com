  html: |-
    <p>hi! ,<br>
    this is a request of collaboration for the creation of a collaborative font.</p>
    <p>The font name's GRASSO and it is a stylish, big, glam, only-uppercase, font for headers, magazines and posters....</p>
    <p>I developed the entire alphabet and 3 number but now i would like to collaborate with someone else to create a better font. </p>
    <p>When the font will be complete I will release it under opensource license.</p>
    <p>If you believe in typography, collaboration, sharing ideas and opensource write me an email to tonio[at]webelieveindesign.com and I could send the vector file to work on.<br>
    (send me some example of your  work)</p>
    <p>here some example of the font I'm talking about...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/492743679_3d36782a8a_3837.jpg"></div><br>
    the red one.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/493472212_84afdd996c_4268.jpg"></div><p></p>
