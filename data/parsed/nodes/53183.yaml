      <p>For just the fonts that support Turkish available on MyFonts, see:<br>
      <a href="http://tinyurl.com/92kots" title="http://tinyurl.com/92kots">http://tinyurl.com/92kots</a></p>
      <p>For just the fonts that support Arabic, see:<br>
      <a href="http://tinyurl.com/982rmc" title="http://tinyurl.com/982rmc">http://tinyurl.com/982rmc</a><br>
      (note: the MyFonts font preview system cannot currently render right-to-left Arabic text).</p>
      <p>For the fonts that support both Turkish and Arabic:<br>
      <a href="http://tinyurl.com/7x9caa" title="http://tinyurl.com/7x9caa">http://tinyurl.com/7x9caa</a><br>
      (but as Jongseong says, it may make sense to mix two fonts rather than insisting on using one).</p>
      <p>Regards,<br>
      Adam</p>
