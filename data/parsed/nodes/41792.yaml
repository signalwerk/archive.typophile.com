    html: |-
      <p>You <em>could</em> use it to print on shirts. There is generally a difference between textile and paper water-based screenprinting ink, but nothing so substantial that you couldn’t do it just to recover the ink. As far as water-based goes, it lacks the opacity of Plastisol inks—which are acrylic-based—and cures itself. So you’ve got to move a little faster with it. It’ll work though, its worth a shot. But yes, there are water-based screen-printing inks that textile printers use all the time. A lot nicer to breathe. </p>
      <p>I will say that i’ve had problems crossing plastisol emulsion with water-based inks and vice versa.</p>
