    <p>Quick question,</p>
    <p>I have a lot of water based ink left over from projects I did when I was silkscreening on paper.</p>
    <p>Can I use this ink to silkscreen on tee shirts? Or do I have to buy different ink?</p>
    <p>I feel silly.</p>
