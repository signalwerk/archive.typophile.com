    html: |-
      <p>Am I right to assume that by water-based inks, you mean waterborne acrylic emulsion that is waterproof when dry, right? Not a soluble gum based paint like gouache or poster tempera?</p>
      <p>If that is the case it should be compatible with most brands of artists acrylic paints and inks. You may need to add an elastic medium to prevent it from cracking on garments. Ceramcoat Textile Medium is good if you are producing a relatively small volume. It’s available at craft stores. For larger volumes I’m sure a commercial silkscreen supply house can provide an equivalent. Of course adding clear acrylic medium of any kind will increase transparency of the inks, so this is generally only a viable solution on white shirts.</p>
