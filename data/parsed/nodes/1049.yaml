    html: <p> I still use Illustrator 6.0, so it sounds as if this might just be a glitch with the newer versions of Illustrator. <br> <br>A couple of things to try.... <br>(Chances are you may have tried these already. If these don't work, I don't even have a guess as to what is wrong... :/ ) <br> <br>1. Save your drawing as an EPS. (Downsaving to Illustrator EPS version 5 or lower may improve your chance of success, rather than using the default option of the most current version of Illustrator or Freehand.) Open the Fontographer font file. Select the glyph cell into which you wish to import the EPS drawing. On my version of Fontographer (4.0.4 for Macintosh), there's an option under the FILE menu to IMPORT an EPS. Find the EPS file you just saved, and select it. This should work. <br> <br>But if it doesn't, try this instead.... <br> <br>2. Open your EPS drawing in Illustrator. Keeping Illustrator open, open the Fontographer font file. Back in Illustrator, select the entire drawing that you wish to copy to Fontographer, and do an old fashioned cut-and-paste COPY (Command-C). Go back into your Fontographer font file and select the glyph cell that you wish to copy to. PASTE it in using (Command-V). This should also work. <br> <br>Both of these methods should work whether you actually open the glyph cell or whether you just select it. <br> <br>Best of luck. Let us know if it's still not working. :/ If all else fails, perhaps a phone call or e-mail to Adobe would be helpful. <br> <br>David </p>
