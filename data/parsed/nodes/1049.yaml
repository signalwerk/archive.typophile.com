  html: <p> K, it's been awhile but I'm stuck. <br> <br>I'm using fontographer and I can't figure out how to paste my outlines into fontographer so I can edit them.  <br> <br>I followed the tutorial on Chank's site, holding down the option key while using the pulldown menus to copy. But when I paste into Fontographer it's still gray and not editable outlines. <br> <br>Does Fontographer work with Illustrator 9? I even tried copying from freehand 8 but get the same problem. You'd think freehand would work with fontographer... Is Macromedia just full of slackers? <br> <br>Oh yeah, and I'm on a Mac. Help! (And happy new year too!) </p>
