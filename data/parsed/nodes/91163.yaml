      <p>Ryan, your "fairly close" list only goes up to Unicode U+FFFF. There are, quite literally, <em>thousands</em> of additional character assignments with yet even higher codes. Do not confuse the number of glyphs (not "characters") that can be stored into an Opentype file with the Unicode assigned to each glyph. They are separate things.<br>
      For all things Unicode, Unicode.org is the website to explore. Every other list is derivative.</p>
      <p>Unicode, by the way, is the answer to your initial  puzzling query "it's not in the ascii chart". "The" ASCII chart (a name so ill-defined that you are better off <em>not</em> using it) can only hold 256 characters. To circumvent that built-in limitation, as well as to finally set a world-wide standard to what character gets assigned what code, Unicode was devised. Current font design software may appear to "support" various ASCII-based constructions such as Code Pages, but in reality everything is done through Unicode.</p>
