      <p>To me the "secret" to multi-script harmonization* lies<br>
      in the proper relative use of the Cartesian space, where<br>
      apparent size has to be balanced against the natural<br>
      bouma-formation needs of the given script. For example,<br>
      how to "translate" Latin's dominant x-height into other<br>
      scripts. Imposing the x-height on Arabic for example is<br>
      so hopeless that people have the sense to quickly give up,<br>
      but this undesirability is also true -just more subtle- in<br>
      the case of pretty much any other script, like Greek,<br>
      Cyrillic or Armenian. Human consciousness likes to line<br>
      things up; but our reading mechanism has deeper needs.</p>
      <p>* At least for a text face.</p>
      <p>In contrast, whether one uses geometry, chirography or<br>
      the "third way" (or some combination) in constructing the<br>
      "strokes" merely imparts an overall consistent style (which<br>
      to me is a more superficial/easy matter).</p>
      <p>hhp</p>
