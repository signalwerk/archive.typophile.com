    html: |-
      <p>It's kind of hard to put a real number to that. The largest fonts, by far, are always going to be the Asian ones. I can't think of a "regular" font that literally has thousands of glyphs. Maybe Zapfino Pro just goes across that number, as it has lots of alternates and ligatures.</p>
      <p>Arial Unicode MS and Lucida Sans Unicode are efforts to have a large, design-wise coherent set of glyphs. You might already have one of these, or both, in your system fonts. ("Design-wise coherent" was the intention, but there has been comments on Arial Unicode's. Search this forum, I'm sure it has been mentioned a few times.)</p>
      <p>Code2000, by James Kass, is a serious attempt to contain all Unicode characters in the Basic Plane. Its official website has been taken over by someone else, so you have to Google for a download site -- it's freeware.<br>
      Code2000 is a <em>huge</em> font (8.4MB), but aiming for completeness rather than proper design. Lots of glyphs are "shared" between the same code points, some of which are perfectly acceptable ("Latin "A" and Greek "Alpha") and others where there seems to be some dispute. Code2000 contains 63,545 <em>glyphs</em>; but not every glyph is bound to a single character; the last 10,000-or-so glyphs are just there to make compound characters from, and should not be used on their own.</p>
      <p>Since Unicode is layered (some might say, like an onion) -- additional Planes are put in separate fonts Code2001 and Code2002. A very worthy effort, except that Unicode is constantly expanding, and they are always adding more and more glyphs to the defined sets.</p>
      <p>Then there are the so-called "Fallback" fonts -- an interesting category of their own. They do <em>not</em> define a single glyph for each separate code, but assign one per Unicode <em>block</em>. That way you always see <em>something</em> -- even if it's only a reminder you are "missing thus-and-thus". The canonical fallback font is "Last Resort", included in Mac OS X.</p>
      <p>And then there is <a href="http://typophile.com/node/89519" rel="nofollow">Ken Lunde's "UnicodeAll"</a>, which not as much concentrates on having correct glyphs (I think it only contains one ;-) ) but solely on stuffing as much as possible in the available table definitions in an Opentype font. Still -- font software ought to <em>think</em> it contains as much as 1,112,030 separate characters!</p>
      <p>So I guess that makes Ken the winner!</p>
