    html: <p>So likely the idea of a font comprising the entire unicode standard in a unified style would be something very difficult to produce. This is quite disappointing. Many of the languages are similar enough to Latin, or are sub-Latin, where one designer can cover it, as is the case with Andron. It becomes a problem when you get into more "exotic" languages, I think. I'm guessing one could make less work from the CJK symbols by breaking the glyphs into a couple hundred main components and building the glyphs from there, although it seems that even still there would have to be adjustments to every glyph, since the stroke weights seem to vary greatly in order to achieve more unity in appearance between the complicated and simple glyphs.</p>
