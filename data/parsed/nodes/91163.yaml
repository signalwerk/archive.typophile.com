    html: |-
      <p>&gt; a competent attempt at a font that contains the entire unicode standard in a relatively consistent style</p>
      <p>Well, that very idea was actually the starting point of Andron (11 years ago), theoretically. The style had to be not only consistent but also rather classical, so that the font is suitable for large-scale scientific editing. “The entire unicode standard” is of course not feasible for one man in ten or twenty years. 90% of “the entire unicode standard” is Chinese, there you have the problem.</p>
      <p>But there are other challenges beyond Chinese, which cannot be mastered by one alone. Above all, the vast range of Indian and Asian scripts. Many of them are highly sophisticated (as Latin or Chinese or Arabic, for instance), so you just can’t step in and make the glyphs of it, having no related background at all. </p>
      <p>The classical type styles of many scripts seem to have some underlying common characteristic principles, which derive from the pen (or the brush). Latin, Arabic, Devanagari, Chinese … have their own respective ductus, but all those ductūs have more or less something in common. Would be worthwhile to explore how far you can go in “harmonizing” all that.<br>
      I’d love to study Tibetan, Devanagari, Arabic and Korean (and Chinese) for a while, and than start with Latin and Greek from point zero again … But for that I’d have to get imprisoned first, I suppose.</p>
      <p>A world writing camp would be great, where masters from all scripts tutor the crowd how to hold the pen.</p>
