      <p>Brian, typography as you know it is very Western (= Latin) biased. "Italics", for instance, has no real counterpart in a lot of "exotic" fonts. (I was surprised to find an Arabic Italic font with the latest InDesign -- I darenot vouch for its currency among arabists.)</p>
      <p>A lot of CJK fonts *do* contain building blocks for more complicated glyphs. Then again, portions of Chinese characters, for example, lend themselves to this because of their natural design. I.e. if there were a script with just horizontal and vertical lines, a designer could just design one horizontal and one vertical line and then let software search things out.</p>
