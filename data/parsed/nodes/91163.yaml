    date: 2012-03-19T10:01:00
    date_raw: 19 Mar 2012 — 10:01am
    votes: null
    html: <p>The 'tough boss' approach seems to me counter productive if the whole point of involving multiple people is to overcome the difficulty of one person being able to master all the knowledge and skills necessary to designing for all the scripts. I've spent the last two years working with a team of six other people on a set of fonts supporting nine different Indian scripts, and it would have been pointless -- no matter how benign my monarchy -- having me lay down the law on how it should be done. We planned carefully. We analysed the client needs and target use environments in depth (the fact that the client then went and changed the environment after we'd done 95% of the work isn't our fault!). We researched options for the individual scripts, looking for ways to harmonise them to each other and to an existing Latin type that were in accordance with the individual writing and/or typographic traditions . We documented those technical issues that would inevitably force us to deviate from those traditions (notably, the difficulty of producing traditional bold designs for southern Indian scripts in an asymmetric rendering environment). We produced trial forms and tested them before proceeding to the main body of design work. And we discussed, discussed, discussed.</p>
