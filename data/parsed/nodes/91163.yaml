    <p>On the new Turkish Lira thread, I heard you guys debating weather or not it already existed as "charecter 2024" or something like that.  What is this list, and where can I get a hold of it?  It doesn't seem to be the standard ascii chart.  I would assume this is the list or chart or whatever that loads into fontlab when you start a new font?  That doesnt seem to match the ascii chart either.</p>
    <p>Here is a super basic list, helpful for anyone trying to create a font with only the core english charecters:</p>
    <p>!"#$%&amp;'()*+<br>
    ,-./0123456<br>
    7890:;&lt;=&gt;?@<br>
    ABCDEFGHI<br>
    JKLMNOPQ<br>
    RSTUVWXYZ<br>
    [\]^_`abcdefg<br>
    hijklmnopqr<br>
    stuvwxyz{|}</p>
