    html: <p>My font with the most glyphs has just over 1,200 glyphs.  It includes Cyrillic and Greek as well as almost all  Latin glyphs.  A typical font for me is between 500 and 800 glyphs for Latin only support.  My decisions on glyphs is based on languages rather than some numbers game.  It boiled down to how many languages can I support without killing myself with labor.  Some languages may only need a few more glyphs so I support them.  Some require a great deal more time.  Vietnamese needs many additional glyphs and stacking sets of diacritics which affects vertical metrics some so I have decided not to attempt Vietnamese at this late stage of my life.</p>
