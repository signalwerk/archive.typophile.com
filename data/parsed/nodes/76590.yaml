    <p>Bruichladdich is a small sophsicated distillery that produces single islay malt whisky in Scotland. I have always enjoyed the typography treatments on almost all of the packaging design they have in my local liqour store. I wonder who designed the fun image &amp; text on those packaging designs. If anyone know, please let me know! </p>
    <p>Images are attached below.</p><div class="imageWrap"><img src="http://typophile.com/files/PCLOB_5387.2001V1.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/bruich_3772.jpg"></div><p></p>
