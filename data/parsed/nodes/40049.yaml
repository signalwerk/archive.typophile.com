    date: 2007-12-13T10:03:00
    date_raw: 13 Dec 2007 — 10:03am
    votes: null
    html: |-
      <p>Firstly turn on colour management in Bridge (so that the settings are synchronised across CS applications). Choose the Prepress setting for your territory. Now don't print and distil to make the PDF, but use the export menu in InDesign. Choose the PDF X-1a setting and you are golden.</p>
      <p>Doing it this way ensures that untagged CMYK or grey colour values defined in InDesign goes unchanged to the PDF. Make sure your document is converted to the new colour settings you are using, and check to see that all elements are now tagged with the correct colour: K=100</p>
      <p>Changing the appearance of black in the preferences has no effect on the values in the PDF, it only changes how black is show on your screen.</p>
