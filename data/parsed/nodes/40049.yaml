  html: |-
    <p>Hi,<br>
    I have a file in inDesign that I need to send to a publisher in pdf format. But when I output it (using print to pdf), the 100% black gets spread over all the cmy plates as well. I have color management turned off, but can't seem to find what I need to change to stop this.</p>
    <p>Any ideas?</p>
