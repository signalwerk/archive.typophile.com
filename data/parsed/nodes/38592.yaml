    html: <p>It's getting somewhere. Perusing the David Carson books a few times over could really help. Your blocks of body copy really flatten the piece  ... break it up with some more hierarchy. Look at some existing magazines and figure out how they're able to do that and then take it to your postmodern level! Lookin' good just needs a push.</p>
