      <p>I really like the collage feeling that you get with these. It does not seem so digitized like many of these kinds of projects end up looking like. I hate when these compositional paragraph studies seem forced or contrived; but be careful with the imagery that is used. Make sure that your images/pictures are not defining the piece and ask yourself if you can achieve the same ideas with just text. Great work on the duo tone images, might want to play around with that motif.</p>
      <p>Also, I am not sure if you are familiar with <a class="freelinking external" href="http://www.davidcarsondesign.com/" rel="nofollow">David Carson</a></p>
