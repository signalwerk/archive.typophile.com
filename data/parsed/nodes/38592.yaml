      <p>Thanks for the great feedback--</p>
      <p>I am familiar with David Carson, but I was a lot more interested in the work by Massin, and how he could create these really dynamic compositions using minimal color...</p>
      <p>I've reworked the spreads, basically cleaning them up and I tried to push them so that they defintely got the point across. </p>
      <p>Here are the *hopefully* finished pieces:</p>
