    <p>I have tried whatthefont, identifont and typenavigator without luck to identify this font so I thought I would try the experts!  This is from a bill produced by the company I work for but we are having a hard time trying to reproduce it on a different (Windows) system.  It is printed on an IBM (I believe) printer from a mainframe program.  I can produce more samples if needed.  Thanks!!</p>
