    <p>Lost &amp; Found Stock will be a collection of old photos in black &amp; white, some of them hundred years old. Most of them though, there are no information as to where they are from, who shot the picture, and the people on it. It' part of the charm and mystic.</p>
    <p>I wanted to pick a type that was not elegant, but maybe trying too, or just an old weary elegance. The logo could be an acronym, so Lost &amp; Found Stock could be typesetted "L&amp;F stock".</p>
    <p>I've attached two examples. I have fine-tuned anything, these are just too give a good idea of what I was thinking. I'm looking for any advice, tips or critiques, and I'm specifically looking for alternative ampersands for the script-logo, because I don't like the current one.</p>
    <p>The typefaces used are Paperback (serif) and Dear Sarah (script), and H&amp;FJ's Historical FellType (alternative ampersand)</p>
    <p>Thanks!</p>
