      <p>Actually David, you were the one that introduced the concept 'Victorian', not me. I agree with most of what you said, but maybe you're judging the logo development too heavily under your search for "good old victorian photos for a current".</p>
      <p>When you mention belt &amp; buckle from Nashville, you're actually not spot on for some of the photos in the collection! It's a diverse body of photos, most of them having a sense of melancholy, humour &amp; nostalgia in them – in my mind.</p>
      <p>I leaned towards a script type because I wanted to associate with the signatures people have put on their old photos from time to time (and which the collection preserved in the digital form). Also, the obvious historical and nostalgic aspect of it.</p>
      <p>By the way, people seemed to presume I was the  creator of the collection, but this is not the case.</p>
      <p>Agreeing with David, my biggest problem seems to be the fuzziness at small sizes. I guess this is a general problem with script-type, so I'm a bit uncertain what to do. Could you perhaps explain more in detail why you like the signage-approach? I tried to make a logo with rubber stamps, but couldn't use the technique properly, I might need some practise. Maybe later again..</p>
