      <p>I like how you are starting with the L&amp;F mark. I think it could use a little tightening of the space between the L and F. "Stock" should be smaller so it properly aligns with L&amp;F or  it should expand beyond (and not just a smidge, enough so it looks intentional) on both sides. Personally I lean toward having it align but play with the design. </p>
      <p>Set ampersands in every font you own and see which appeal to you. Look at samples from foundries, and practice drawing your own - you will strike upon an idea that inspires you and then develop it more.</p>
      <p>You need to determine the name. Will it be Lost &amp; Found Stock, or L&amp;F Stock? Do you want to be able to use both - if so you need to work on both now. Your Dear Sarah samples are an ok start but using Dear Sarah for your L&amp;F design might not work so well.</p>
      <p>With the name Lost &amp; Found it might be interesting to have your logotype look like it was put together by mixed pieces. By that I mean different typefaces. It's a great name for a stock collection. Maybe you should try old wood block letters or something that has a corrosive rubber stamp feel.</p>
      <p>Keep working at it, would like to see more postings.</p>
