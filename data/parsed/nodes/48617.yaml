    html: <p>Malte, I still like your last posting. The ampersand was going to need an alternate solution to work at the smaller sizes though. To me your latest design said elegant and by-gone era. However, after reading more descriptions of the photo collection that direction may not be the most suitable. The formal script is sophisticated, but not at all like the actual writing you would find on someone's old family photographs. I do very much like David's suggestion of using Brothers, a definite cool vintage feel. You are right, there are so many directions to go in. Look at the collection, what adjectives would you use to describe it? nostalgic? quirky? vintage? elegant? Victorian? retro? funky? moody? off beat? whatever that essence is try to incorporate it into your design.  The palette is subtle (some say boring) but I thought it was appropriate for the subject - old photographs - black, white, gray, sepia, beige. Looking forward to your next post.</p>
