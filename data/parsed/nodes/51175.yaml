    html: |-
      <p>If you remove all other Helvetica fonts and install only these 4 font files in Windows:</p>
      <p>HelveticaNeueLTStd-BdIt.otf<br>
      HelveticaNeueLTStd-It.otf<br>
      HelveticaNeueLTStd-Roman.otf<br>
      HelveticaNeueLTStd-Bd.otf</p>
      <p>you will get what you need in MS Word.</p>
      <p>"75 Bold" is the file HelveticaNeueLTStd-Bd.otf</p>
      <p>The font name shown varies depending on the MS word version.</p>
    html_clean: |-
