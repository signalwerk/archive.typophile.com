    <p>hello.</p>
    <p>my design partner and i are working on a resume template for a client - requested to be edited in word. we designed in apple pages first, so we used helvetica neue (75 bold), opentype.</p>
    <p>now, i use a PC, and when i use indesign, i can choose the 75 bold style. but in word, i cannot seem to find it. basically, our client and i cannot see the typeface now. so i know it's not a translation issue, it's just something wrong with either office, or word, or windows!</p>
    <p>anyone familiar with this issue? are we just SOL with using word?</p>
