    html: |-
      <p>The file name that Uli specifies, as shipped from the font vendor (Linotype/Monotype, Adobe, or a reseller), would not produce the menu names you are seeing. Are these OpenType CFF (.otf) fonts, or OpenType TrueType (.ttf)?</p>
      <p>If the former, the menu names are definitely messed up, and I'd bet somebody converted the fonts manually to OpenType using some utility, instead of getting well-made OpenType versions from the font vendor. I am suspecting that the Windows menu names and style links are messed up.</p>
      <p>Cheers,</p>
      <p>T</p>
