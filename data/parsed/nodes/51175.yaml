      <p><em>when i use indesign, i can choose the 75 bold style. but in word, i cannot seem to find it</em></p>
      <p>Perhaps the Helvetica font family is style-linked? In that case you would have to choose the Regular style in Word and then press the Bold button. You would only see the Regular style in the font menu.</p>
    html_clean: |-
      <p><em>when i use indesign, i can choose the 75 bold style. but in word, i cannot seem to find it</em></p>
      <p>Perhaps the Helvetica font family is style-linked? In that case you would have to choose the Regular style in Word and then press the Bold button. You would only see the Regular style in the font menu.</p>
