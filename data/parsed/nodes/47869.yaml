      <p>You can try Identifont instead --  not always that accurate, but it can narrow things down a little. It will ask you a series of questions about the face you're looking for, like "Serif or sans?" or "Is the crossbar on the A angled or straight?".</p>
      <p><a href="http://www.identifont.com/" title="http://www.identifont.com/">http://www.identifont.com/</a></p>
