    <p>Although many are shopworn by now, one of the best gifts I ever got was when Adobe included a large chunk of their then-Postscript 1 library on, I believe, an Illustrator upgrade CD some 10 or so years ago. I'm wondering whether anyone knows of any similar legitimate collections of types both serif an sans for book-work from real foundries (not the "1000 fonts for a penny apiece" knock-offs that, essentially, steal from the fonts' real creators).</p>
    <p>Thank you.</p>
