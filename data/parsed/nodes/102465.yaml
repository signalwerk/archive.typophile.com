    <p>Hello everybody,<br>
    I just registered to your forum. To introduce myself I could say that I'm a french graphic designer who love typography.<br>
    I probably don't have the skills to draw one of my own but I'm working on it.</p>
    <p>Really sorry if my english is not perfect, I'll try to explain my issue of the day.<br>
    With a friend of mine we are fixing some bikes and we are trying to get the logos, which are stuck on it, right.<br>
    Here is the image of the aerospace contour logo. It looks like a bauhaus but not entirely... a mix between Bauhaus and ITC Avant Garde...</p>
    <p>Tanks in advance if you can help!</p>
