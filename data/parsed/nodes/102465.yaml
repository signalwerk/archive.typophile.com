    html: <p>Whatever font it is or wherever they started, it is deeply rooted in  "<a class="freelinking external" href="http://www.myfonts.com/fonts/itc/bauhaus/" rel="nofollow">Bauhaus</a>". Many freebies (an endless list actually) share the same backbone (<a class="freelinking external" href="http://www.dafont.com/vomzom.font" rel="nofollow">Vomzom</a> is one of them). Having a look to <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=303" rel="nofollow">Techno &gt; Sci-fi</a>, <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=304" rel="nofollow">Techno &gt; Various</a> and <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=501" rel="nofollow">Basic &gt; Sans serif</a> sections at DaFont could be helpful to spot either an alternative or a match. Good luck!</p>
