    <p>Details of the 2010 annual intensive short course in typeface design, to take place at Reading this summer, are now available on <a href="http://www.typefacedesign.org/tdi/TDi2010_A4.pdf" title="http://www.typefacedesign.org/tdi/TDi2010_A4.pdf">http://www.typefacedesign.org/tdi/TDi2010_A4.pdf</a> . Five very full days, crammed with seminars, feedback on practical work, examination of rare material, and hands-on sessions. </p>
    <p>Get in touch for more information.</p>
