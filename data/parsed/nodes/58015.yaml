    <div class="info">Submitted by <a href="/user/23695" title="View user profile.">UPPERCASE</a> : 14.May.2009 3.22pm </div>
      <p>Hello!</p>
    <p>We are looking for submissions to the summer issue of UPPERCASE magazine and thought your readers might be interested. </p>
    <p>The Lost Art of “The End”</p>
    <p>Early films often featured an elegant “The End” title at the conclusion of the story. What happened to that tradition? We invite you to imagine what “The End” would look like for today’s movies. For example, what would the end title look like for No Country for Old Men? Twilight? Terminator?</p>
    <p>(Images should be 4” wide at 300dpi, emailed to info–at–uppercasegallery.ca) Closing date: June 1.</p>
    <p>-Janine Vangool<br>
    <a href="http://www.uppercasegallery.ca" title="http://www.uppercasegallery.ca">http://www.uppercasegallery.ca</a><br>
    <a href="http://www.uppercasemagazine.com" title="http://www.uppercasemagazine.com">http://www.uppercasemagazine.com</a></p>
