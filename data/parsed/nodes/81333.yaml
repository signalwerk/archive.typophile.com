      <p>Briem drops it below the x-height:<br>
      <a href="http://www.fontshop.com/fonts/singles/creative_alliance/briem_mono_bold/" title="http://www.fontshop.com/fonts/singles/creative_alliance/briem_mono_bold/">http://www.fontshop.com/fonts/singles/creative_alliance/briem_mono_bold/</a></p>
      <p>That's also what I do when things get tight.</p>
      <p>There are some other glyphs where there is a precedent for this kind of technique, eg Cyrillic б and ф.<br>
      It's also common practice for "g" in many sans faces (raising the bowl above the baseline to accommodate the extender business).</p>
