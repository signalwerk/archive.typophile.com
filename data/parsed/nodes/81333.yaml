    <p>So, I'm building a template for the features and hierarchy of all the glyphs in the Latin-1 layout and I have a question about the Icelandic eth. </p>
    <p>Vertically, the character has two parts, the bowl below and the crossed ascender. </p>
    <p>As the resolution descends and there are not enough pixels, is it better to lower the height of the bowl and give additional pixels to the ascender, or is it better to let the ascender just become a blob of undistinguished but fairly unique pixels so the bowl can remain at the x-height, from an Icelandic point of view? </p>
    <p>Thanks in advance for any insights.</p>
