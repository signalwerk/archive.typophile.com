      <p>Third option (not necessarily/always recommended): break the EM - let the ascender rise. The UC accents do that after all.</p>
      <p>BTW, one way to "lower" the bowl is to keep the top at the x-line but make the bowl more teardrop-shaped, like here:<br>
      <a href="http://www.flickr.com/photos/ohbendy/5462601945" title="http://www.flickr.com/photos/ohbendy/5462601945">http://www.flickr.com/photos/ohbendy/5462601945</a></p>
      <p>hhp</p>
