  html: |-
    <p>I can’t identify the subline sans from the Upper Austrian newspaper »Oberösterreichische Nachrichten.« They are using ITC Slimbach for their Headlines and Lucida Bright for the copy (!) so I am assuming that the subline typeface isn’t a custom one. But I can’t put my finger on it. </p>
    <p>The R with the gap is quite distinctive and the N with the angled corners, but … well&nbsp;… I don't know the typeface. </p>
    <p>Thanks in advance for any helpful reader. </p>
    <p>UPDATE: Could it be Syntax with a (custom/alternative) R?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ooen_4271.jpg"></div><p></p>
