    html: <p> Knockout, Gotham (caps only), and Gotham Condensed might be good choices from among our collection at typography.com, unless you're a stickler for absolute historical accuracy. That is, these faces can easily engender a Dust Bowl feeling if used appropriately, but strictly speaking they're all new designs from 2000. <br> <br>If you're going for museum-piece accuracy, look for typefaces issued by the Ludlow or Barnhart Brothers &amp; Spindler type foundries -- you can probably do some sleuthing at myfonts.com. But to get you started, try Tempo, Cheltenham, Franklin Gothic (not ITC), Cooper Black, Alternate Gothic, Post Roman, Copperplate, Radiant, Agency Gothic, Poster Gothic, Bank Gothic, or the ineluctable Goudy Old Style. As always in typography, finding the right font is only half the battle -- the real challenge comes in composing them properly. <br> <br>JH </p>
