    html: <p> If your interest is early 1900s midwest display typography (à la signage), then you may want to try contacting John Downer (he'll be at TypeCon in Toronto next weekend). He's an accomplished sign painter, as well as a type designer, from Iowa -- you can't get much more midwest than that, I suppose -- and he's a collector and aficionado of public display lettering from this era. I'll bet he could offer expert advice. </p>
