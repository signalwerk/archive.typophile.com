  html: "<p><b>AIGA San Diego invites you to the annual membership event being held October 15th at the AIGA San Diego Center for Design. </b> <br> <br>This event is free for members, only $5 for non-members, and will include a <b>presentation by guest speaker Doyald Young.</b> Doyald is a teacher and author of numerous books on design and typography. He will speak about his latest book, The Art of the Letter. <br> <br>All members in attendance will receive a copy of the book courtesy of Smart Papers. <br> <br>This is your opportunity to enjoy the benefits of membership, or become a member if you're not already, and get connected with the chapter. Hook up with old friends and meet new ones. Learn more about what the chapter is doing. Sign up for a committee. Volunteer. Get involved. Make it your own. <br> <br><b>October 15, 2003 <br>AIGA San Diego  <br>Center for Design <br>344 Seventh Avenue <br>Downtown San Diego</b> <br> <br>FREE for members -- Invite a friend! <br>$5. for non-members <br> <br>RSVP to 619 233-5470 <br>More info at <a href=\"http://www.aigasd.org\" target=\"_blank\">www.aigasd.org</a> <br> <br>This event is sponsored by Smart Papers <br>Design: Miraclebrand Design <br>Printing: Partner Press  <br>Paper: Smart Papers <br> <br>6:00pm <br>Happy Hour <br>Join us for a social hour with appetizers and no-host beer and wine. Socialize, mingle, enjoy the current exhibit on display in the gallery with a special presentation of work by our guest speaker. <br> <br>6:45pm <br>Membership Presentation <br>Get the 411 on all that's happening with AIGA San Diego. We'll announce the annual calendar, discuss committees  <br>and help you get more involved. <br> <br>7:00pm <br>Guest Speaker <br>Doyald Young, teacher and author of numerous books on design and typography. All members in attendance will receive a free copy of his latest book, The Art of the Letter.  <br> <br>Doyald Young <br>For 43 years, Doyald Young has specialized in the design of logotypes, corporate alphabets, and typefaces. He has designed logotypes and trademarks for the industrial design firm of Henry Dreyfuss Associates, California Institute of Technology, University of California at Los Angeles, exhibition catalogs for UCLA's Clark Memorial Library, Mattel Toys and Max Factor. Recently he completed the redesign of Prudential Insurance Company of America's company name and corporate font. With Don Bartels, designed the GE Logo Font for General Electric Company's corporate identity program. As an associate of International Design Associates of Japan, designed logotypes for over a dozen hotels, including restaurants, bars and amenities. Mr. Young has served as typographical consultant to Xerox Corporation, Southern California Edison Company, and Bechtel Corporation, designed fonts for Esselte Letraset, Agfa Corporation, Visual Graphics Corporation, and consulted with Emerson Stern, and the Salk Institute on the development of a written American Sign Language alphabet for The National Institutes of Health. He is a member of AIGA and lectures and consults with students at Art Center College of Design, where he has taught lettering, logo design, and typographic basics for 27 years. Mr. Young is the author of Logotypes &amp; Letterforms, Handlettered Logotypes and Typographic Considerations, and a 388-page volume, Fonts and Logos, that addresses basic letter and font structure, typography, and logo design.</p>"
