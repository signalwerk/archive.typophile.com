      <p>Usually, i don't use Loremp Ipsum.<br>
      Because of the missing letters in latin language, and figures.</p>
      <p>Something I use to do is to copy paste everyday the first News on top from Google News.<br>
      Likehow, i have almost everything i want.</p>
      <p>Long Text.<br>
      Figures &amp; Ponctuation.<br>
      Also sometimes Small Caps.</p>
      <p>The great thing with this "ipsum" generator, is that you also copy paste some Date information. Then when you print your design research, you automatically have a kind of Date Mark.</p>
      <p>This is very useful for me.</p>
      <p>Merci !</p>
