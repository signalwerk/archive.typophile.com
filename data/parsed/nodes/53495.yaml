      <p>When I was in school I typeset some very academic BS text about Morris Louis, an American abstract color painter. After having read it a few times I realized that post-WWII fine art criticism is rife with long essays that amount to nothing more than doggerel, so now I use that to greek up pages.</p>
      <p>Although given the current state of the economy, most of the type I’m setting is just to test my fonts—not much paying print work coming my way.</p>
