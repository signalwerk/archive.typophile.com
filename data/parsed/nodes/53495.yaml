    <p>The tattoo thread has gotten me thinking, do you guys usually set your dummy type to Cicero's text, or do some of you prefer your own custom passages?</p>
    <p>I've recently started moving away from lipsum to personal copy.</p>
    <p>The advantage, is that the paragraphs look and break in a more natural way (for English).</p>
    <p>I am however concerned that clients might concentrate too much on reading the copy, which could color their judgment, and detract from the aesthetic/conceptual considerations.</p>
