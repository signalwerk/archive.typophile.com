    <p>Hi,</p>
    <p>I have a question for you guys, I came around this site with a lot of nice pictures that you could buy to use for presenting for an example an corporate identity. There where everything from white boxes to stacks of business cards etc, that you could add your design on to. It was proper photos rather that the generic vector stuff you find on shutterstock etc.</p>
    <p>Anyone? </p>
    <p>Many thanks!<br>
    //C</p>
