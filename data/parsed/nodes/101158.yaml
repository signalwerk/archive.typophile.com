    html: |-
      <p>Photos of blank business cards, brochures, etc. can be found at many stock photo sites. For example, at iStockPhoto.com if I search for "business cards blank" I find numerous images similar to this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stock-illustration-22964126-business-cards-templates_3561.jpg"></div><p></p>
      <p>If you've got Photoshop you can easily take a business card mockup and apply it to the stock photo . Open the stock photo, then in a new layer add your card mockup, and then distort your card mockup to fit the photo's perspective by selecting the mockup and then Edit &gt; Transform &gt; Distort and drag the mockup's corners until they align with the card in the stock photo.</p>
