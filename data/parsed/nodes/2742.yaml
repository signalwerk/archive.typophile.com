    date_raw: 20 Jan 2004 — 9:44am
    votes: null
    html: "<p>Hi Daniel, <br> <br>Just put two and two together with your ID thread. I was thinking this was Schwabesque. <br> <br>A side note about viking helmets: <a href=\"http://elfwood.lysator.liu.se/loth/l/u/luiro/vikinghelmet_01_copy.jpg.html\">no horns</a> <br>But you probably want to keep them for recognition since the myth is more recognized than the original. I think you can add some more details and still be simple enough. Perhaps some rivet highlights? Mabe the eye/nose mask? Maybe not? <br> <br>I'd also try non-horizontal type treatments. Circle, with VIKING between the horns and DECAL below? Maybe a simple U shape below the helm? <br> <br>Whoops, just got another idea. Second to the viking helmet in recognizability is the viking longship. I think that might make a more compelling image.  <br> <br>For inspiration: <br><a href=\"http://www.celticcharms.com/viloshpe.html\" target=\"_blank\">http://www.celticcharms.com/viloshpe.html</a> <br><a href=\"http://www.lysator.liu.se/nordic/mirror/longship/0298hale.html\" target=\"_blank\">http://www.lysator.liu.se/nordic/mirror/longship/0298hale.html</a> <br><a href=\"http://www.woodenboat.com/\" target=\"_blank\">http://www.woodenboat.com/</a> <br> <br>Definitely less clich</p>"
