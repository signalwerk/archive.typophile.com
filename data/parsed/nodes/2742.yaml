  html: <p>I posted this on another thread about sketches, I think this spot is a better fit. <br> <br>These are a few initial directions of an identity system for a truck decaling company in NJ. Pretty much they travel the NJ/NY/PA area putting gigantic decals on trucks like FedEx (I worked for them and after staring at that logo for entire summer I no longer see the ingenuity of the "hidden" arrow) and other big names. It's tedious work, blowtorches are involved, and it's blue collar. So that's the background.  <br> <br>I am of course interested in receiving feedback on my work. As most who post their work on these forums, I am very open to criticism. <br> <br>I only have two jpgs of pencil sketches. My Illustrator sketches are in the preliminary stages. <br> <br><img src="http://www.typophile.com/forums/messages/29/24323.jpg" alt="sketch 1"> <br> <br><img src="http://www.typophile.com/forums/messages/29/24324.gif" alt="logo 3"> <br> <br><img src="http://www.typophile.com/forums/messages/29/24325.gif" alt="logo type"> <br> <br><img src="http://www.typophile.com/forums/messages/29/24326.gif" alt="logo 4"> <br> <br><img src="http://www.typophile.com/forums/messages/29/24327.gif" alt="logo 1"> <br> <br><img src="http://www.typophile.com/forums/messages/29/24328.gif" alt="logo 2"></p>
