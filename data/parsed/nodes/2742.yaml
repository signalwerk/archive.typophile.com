    html: <p>I concur with Hrant regarding the angled view of the helmet, and more specifically with Shreyas' direction of "having the higher horn on the left", or rather the red horn in the white area (whichever side it ends up being on). <br> <br>Have you explored any solutions "outside of the box", but within the same direction as this concept? Maybe there's no red frame outlining the red area and the type, and red type is to the right of the mark. Perhaps try framing the graphic mark only, then positionig the type somewhere outside of the rectangle. Try creating a random red and white/negative space checker pattern (not a square board) and incorporating the elements (graphic and type) into a portion of that pattern. Just some ideas</p>
