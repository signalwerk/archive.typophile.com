    <p>These (very nice) English subtitles are from the 1991 French film "<a href="http://www.imdb.com/title/tt0101700/">Delicatessen</a>". I imagine that Miramax is responsible for them since they are the US distributor of the film. It was released in the US in 1993 but this version (from Netflix) could be from a DVD released later. </p>
    <p>My first guesses were TheSans, FF Strada, FF Kievit, FF Profile, even FF BeoSans. But none of these fit. </p>
    <p>Beyond identifying the font, does anyone know how I can find the team responsible for these? Subtitling often doesn't get credits in the film or on IMDB. Emails to Miramax have gone unanswered. I'd like to write a piece for <a href="http://fontsinuse">Fonts In Use</a>, but I imagine my request pales in comparison to the big time press inquiries they get daily.</p>
    <p><img src="/sites/default/files/old-images/deli1_6244.jpg][img:sites/default/files/old-images/deli2_4790.jpg][img:sites/default/files/old-images/deli3_4645.jpg][img:sites/default/files/old-images/deli5_4339.jpg][img:sites/default/files/old-images/deli4_3940.jpg][img:sites/default/files/old-images/deli6_3796.jpg][img:sites/default/files/old-images/deli7_5866.jpg"></p>
