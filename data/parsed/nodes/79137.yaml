    html: <p>The answer about decision making is 'all of the above'... we have worked with distributors to license type for subtitles. But some players include fonts to render the captioning. The mysterious 'l' is either due to the fact we have offered one with and one without a 'foot'; or someone did, in fact, lop off the foot in the bmp file used to render this.</p>
