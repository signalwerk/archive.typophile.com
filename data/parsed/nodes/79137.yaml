      <p>Yes, this study is now 5 years old. If anyone wants to commission us to create a new report, please let me know. :)</p>
      <p>Stephen, as to your question on who makes the decision on the subtitle font, the answer is not an easy one because there are so many people/companies involved in the process. So it could be "all of the above" multiple guess answer... We've licensed fonts to a variety of different companies involved in the process. </p>
      <p>I think the good news in all of this is that the state of the art continues to advance, and we are seeing better quality typography on the big screen, in addition to the small screens!</p>
