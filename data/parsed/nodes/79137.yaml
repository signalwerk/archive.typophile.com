    html: <p>Subtitles are all rendered by our authoring house via whichever software suite they are using for a particular media. In my experience it is rare on distributor or studio side for someone to pay attention to details like this. I would suspect it is the individual author(s), and perhaps even a design commitment of the whole authoring house, to own good choices for subtitling typefaces. I would doubt it extends much higher in the project hierarchy than that — especially based on my experience with Lionsgate.</p>
