    <p>Hi folks,</p>
    <p>I have a couple of fonts, with an insane amount of styles, that do not display as one font, in programs such as Illustrator. </p>
    <p>Example:<br>
    Politica<br>
    Politica Italic<br>
    Politica Bold<br>
    Politica Light<br>
    Politica Light Italic<br>
    and so on..  instead of just displaying Politica.</p>
    <p>This very much clutters the font menu and makes it quite a hassle to find a certain font.<br>
    Does anyone have a solution to this problem or shares it?</p>
    <p>Any input is very much welcome.</p>
    <p>Peace,</p>
