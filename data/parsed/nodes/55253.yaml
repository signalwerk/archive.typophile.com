    html: <p>I don't use Illustrator, but if it is like other Adobe apps the font menu supports the OpenType preferred name fields in the font name table (presuming we're talking about TTF or OTF fonts). Your list suggests that the fonts are misnamed even for simple style-linked families.</p>
