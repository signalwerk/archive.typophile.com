    <p>Hi,</p>
    <p>Since applying typography to my work, it has occurred to me that Microsoft Word isn't very efficient. For example, I am using Myriad Pro and I find myself manually adjusting letter spacing and letter kerning all of the time.</p>
    <p>Being that I am relatively inexperienced in matters of typography, it seemed reasonable to assume that proper typographers would know of more efficient work flows. Could you please share your thoughts on text editors?</p>
    <p>I cannot justify the cost of InDesign. However, I welcome your thoughts on all software as it could save me many hours trying free approaches such as <a class="freelinking external" href="http://www.freeserifsoftware.com/software/pageplus/">Serif PagePlus</a>.</p>
    <p>Thanks for your input, it is appreciated and I apologise for being a novice :)</p>
