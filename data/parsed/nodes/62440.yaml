    html: |-
      <p>Glen, when you say you're applying typography to your work, do you mean you're being paid to design with type? If you are, you're going to have to bite the bullet and get InDesign sooner or later anyway. </p>
      <p>If you're self-employed, you may be able to get a tax deduction. (You can in the US, I don't know what the rules are in the UK.)</p>
      <p>If, on the other hand, your principal occupation is something else, and you're simply frustrated that MS Word has a thousand features you don't want and none of the features you do want--well, join the club.</p>
      <p>You can still differentiate your work from the careless stuff you see everywhere. Use styles rather than manual formatting, and override the default "based on Normal." Specify line spacing in points instead of "single," and always use "space above/below" in the Paragraph menu to create space around headings, lists, etc. You'd be surprised how professional you can make MS Word look.</p>
