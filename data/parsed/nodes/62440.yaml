    html: |-
      <p>Define a style or styles with the spacing and kerning the way you want. You're not limited to Word's built-in styles. You can even define character styles that won't affect the entire paragraph. Or just change the Normal style and everything based on it will automatically change, too. Then allow Word to save the changes in your normal.dot file if it asks.</p>
      <p>Later edit: You don't have to create completely new styles -- you can modify Word's built-in styles any way you want to, except they can't be renamed.</p>
