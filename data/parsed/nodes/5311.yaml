  html: <p>I would love some feedback on my logo for my freelance design studio (Makaio Design). I do have a feminine edge to much of my design which is reflected in this logo; I am concerned that it might be too feminine? Or does it communicate refined, artistic elegance? <br> <br>I design a broad range of projects including identities/ websites/ print/ invitations &amp; announcements/ as well as freelance photography (mostly portraits and still life). <br> <br>I welcome all input! Thanks. <br> <br><img src="http://www.typophile.com/forums/messages/29/38907.jpg" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/38908.jpg" alt=""></p>
