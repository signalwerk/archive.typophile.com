    html: '<p>I have made a few modifications: <br>- I tilted "design" like Scott  suggested <br>- I have also shown two samples here, one with without the shading (the top ones) <br>- I have also debated on whether the white "streak" on the top petal is distracting (so the bottom ones have this adjusted) <br> <br>Does anyone have any input or suggestions? <br> <br>Thanks! <br> <br><img src="http://www.typophile.com/forums/messages/29/39625.gif" alt=""></p>'
  - id: 38302
    user: 4004
    date: 2004-07-02T03:06:00
    date_raw: 2 Jul 2004 — 3:06am
    votes: null
    html: "<p>I would recommend two changes: <br> <br>1 <br>You could say that  there are three points of interest in the design (a)the typeface/calligraphy contrast (b)the picture/words contrast (c)the fact that the 'o' is handwritten. <br>Why is the 'o' handwritten? If there isn't a good reason for it, it would change it to regular type. In that way the two other points of interest seem stronger. <br> <br>2 <br>I would move the illustration just a bit away from the lettering, in northwestern direction. As it is now, the southeast corner of the square fits just snugly over 'ak' and 'm' is precisely aligned with the vertical division of the square. It seems cramped/crowded when you align things like that ... at least in my opinion. <br> <br>-- <br>S</p>"
