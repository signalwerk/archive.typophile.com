  html: <p>Hi, I'm in the somewhat unenviable position of having to reproduce the Texas Heat Wave bit of this graphic. They were supposed to supply this to me, but they seem to have forgotten or something. Please help me identify the font that's been manipulated here so that I can do my best to remanipulate it in similar fashion. <br> <br>thanks, <br>Alex<img src="http://www.typophile.com/forums/messages/83/39672.gif" alt=""></p>
