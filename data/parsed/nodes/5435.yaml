    html: <p>I know, it's awful. Nope, I'm no Texan. I'm from Wisconsin, but usually live in Chicago. (I'm currently in Green Bay, an exile of love). However, I'm doing some freelance webmastering in Texas so I have sort of an electric toe in those waters. And thank goodness I'm working with people in Austin. <br> <br>Anyway, please, if anyone can identify a font (any font) that approximates this thing (with its' S and W especially), I'd be much obliged. <br> <br>This is a request that will stop being relevant tomorrow afternoon, for reasons of deadlines, etc. <br> <br>Thanks</p>
