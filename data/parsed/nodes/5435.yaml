    html: <p>This looks custom drawn. I think it's extremely unlikely to be a font. Notice how the E's and A's differ and how the shadow changes in the two T's.  <br> <br>If you need to re-create it, they don't come any easier than this. It's all straight lines. If you are handy with Illustrator (or something similar) it shouldn't take longer than 15 minutes to do. Just paste your sample into the background, zoom in, and connect the dots.</p>
