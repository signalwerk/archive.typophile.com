  html: |-
    <p>I could use some of your font expertise!</p>
    <p>I am working on redesigning an outdoors magazine, geared towards older, male, conservative readers. </p>
    <p>Current serif fonts used for headlines/subheads/folio included Colossalis &amp; Rockwell (Bold Condensed). (This combination I've inherited, not my choosing.)</p>
    <p>Can you suggest any fresh fonts? I need something with a squared serif preferably, and if it's available in various weights, that would be great. I've gone through our font library but I'm just not finding what I'm looking for. Undoubtedly you know of something I don't. I guess I kind of like Stymie, but I'm not completely sold on it.</p>
    <p>Please let me know if more information about the project would be helpful/necessary.</p>
