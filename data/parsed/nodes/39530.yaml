      <p>If it's a slab serif you're looking for Serifa could be a great choice. I once used it as part of a destination branding project where the focus was on rugged outdoor adventure. It worked really well:</p>
      <p><a href="http://www.fontshop.com/search/?q=serifa&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=serifa&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=serifa&amp;x=0&amp;y=0</a><br>
      .</p>
      <p>If you want something more contemporary try Dispatch:</p>
      <p><a href="http://www.fontshop.com/search/?q=dispatch&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=dispatch&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=dispatch&amp;x=0&amp;y=0</a></p>
      <p>.</p>
      <p>Caecilia could be another choice. I think Golf Digest uses it.<br>
      <a href="http://www.fontshop.com/search/?q=caecilia&amp;x=0&amp;y=0" title="http://www.fontshop.com/search/?q=caecilia&amp;x=0&amp;y=0">http://www.fontshop.com/search/?q=caecilia&amp;x=0&amp;y=0</a></p>
