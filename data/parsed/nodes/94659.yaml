  html: |-
    <p>Hi all</p>
    <p>Is it possible to use Robofab to generate weights from a MM vfb.</p>
    <p>I'm generating 6 weights from the MM fonts - Thin, Light, Regular, Medium, Bold and Heavy.</p>
    <p>While I'm developing the font I wanted a quick way to generate the weights with a script instead of<br>
    generating each vfb with Fontlab - Tools &gt; Multiple Master &gt; Generate Instance &gt; Enter the weight &gt; Name the vfb.</p>
    <p>I just need a script that will generate 6 vfb from a MM vfb. The script doesn't need to be expandable<br>
    the weights can be hard coded into the script.</p>
