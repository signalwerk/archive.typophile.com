  html: "<p>I really don't know what this font is, it's part handwriting but part display, I mean, it's very close to my handwriting but like my handwriting doesn't work in large blocks of text.   <br>it's kind of a font for the backs of photos.   <br>   <br>please this is only my second font, I am struggling with the office copy of fontographer (is there a way to add guides? or change the guide for the decender?)   <br>   <br>I'm still debating the kerning, my writing is very spaced out (like the alphabet sample but for the sake of convention I tightened it up and i'm not sure i like it as much.   <br>   <br>Enough babble, on with the show:   <br><a href=\"http://jen.f1-comics.com/ifalphabet.jpg\" target=\"_blank\">http://jen.f1-comics.com/ifalphabet.jpg</a> <br>  <br>Thanks in advance,   <br>jen   <br><a href=\"http://jen.f1-comics.com\" target=\"_blank\">http://jen.f1-comics.com</a> <br> <br>edited: I swear I never get the upload right</p>"
