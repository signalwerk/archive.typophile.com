    html: <p>I'd like to see more consistency in the swashes. The truly great calligraphers like Ismar David make their swashes an element that unifies the script, and in your sample they seem to clash. I'd suggest drawing out dozens of different versions of each letter and picking the ones that are the most harmonious.</p>
