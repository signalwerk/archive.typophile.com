    html: <p>Kent, <br> <br>I am not sure we should assume it was set on a Linotype. For that matter, without a study,  how does Hrant, John, and yourself know this was not set on a Unitype, Typobar, Munson? Or even hand set with self spacing type. In other words, how many people have been jailed because the prosecution is too lazy. With three hundred "typesetting sytem suspects" why assume it was only one. Especially where there is evidence that contradicts the mechanics of a Linotype. <br> <br>Unlikely it would have been set on a Paige. There were only three of those made and all three remained in America. One still sits in the basement of Mark Twain's house, another was donated to the war effort by American Linotype. I am not sure of the other. But for good reason I suspect it was not set on a Paige Typesetting machine. <br> <br>That said, I have viewed this setting and determined by reason of mechanics, which system(s) it most likely was set on. Linotype is not impossible, just unlikely, very unlikely. Unless the word was cut, shaved and reassembled. That did happen, sometimes. <br> <br>But I am glad you are all here. What do you see in this illustration <a href="http://lanstontype.com/BurgessSetting.html" target="_blank">http://lanstontype.com/BurgessSetting.html</a> <br>that clearly indicates typemaking in progress? <br> <br> <br> <br> <br></p>
