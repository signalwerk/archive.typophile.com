    html: <p>One of the most important palimpsests, if not the most important is the one containing <a href="http://www.aip.org/pt/june00/origins.htm" target="_blank">Archimedes Method</a>. Here Archimedes explains how he made his great discoveries. The Archimedes was erased to write a prayer (!) and thus a precious historical record was almost lost. Someone saw the erasures at the end of the nineteenth century and realized what it was. Recently they have been able to recover more of it using infrared technology etc. <br> <br>Archimedes is arguably the most original scientist in history, and his proof of the area under a parabola is just mind blowingly inventive. This was the first breakthrough to the calculus - done geometrically! In the same  generation as Archimedes works were translated into latin in Europe, the scientific revolution took off. They, such as Galileo and Newton's teacher Isaac Barrow were his disciples, referring to him as the 'divine Archimedes'. <br> <br>Oh yes, and the conic curves are the basis of splines in true type! </p>
