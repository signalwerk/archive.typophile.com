    html: <p><i>On religion, there are many more other serious variations within religious denominations in addition to level of observance of ritual.</i> <br> <br>I certainly didn't intend to equate practice of religion simply with observance of ritual. It is indeed possible to be slavishly observant of ritual yet lack charity or develop spiritually or, as a friend put it, to know all the rubrics yet live like an animal. I maintain that what determines a religion is form and matter (which is a particularly Thomistic way of looking at it, I'll admit). The form and matter of Catholicism differs so completely from that of, for instance, Presbyterianism, that I think it is ridiculous to try to lump them together into a single Christian religion. The problem of this discussion may be, simply, that we lack a sufficient terminology to describe, at once, an historical set of shared beliefs and, in some cases, <i>similar</i> practices (what Adam calls religion) and also the very clearly distinct set of formal practices and material beliefs (what I call religion). I'm certainly not denying that both of these phenomena exist. Without the former, there wouldn't be any point in praying for Christian unity, but on the other hand how would you know such unity if you saw it? As agreement in form and matter. If, as Adam has, you apply the term religion to the shared beliefs, rather than to the distinct matter and form, you are left without a good term to label that which is distinct within this 'religion'. You can, as Adam has, fall back on the term 'churches', which is certainly a common currency in Protestantism, but this is a terminology that runs directly counter to the explicit teaching of at least one of the distinct entities to which you are trying to refer. [And I admit being disturbed to see Adam at once describing himself as a Roman Catholic and stating a Protestant conception of multiple churches that is completely counter to Catholic teaching, and this is the only reason I'm going on at such length.] The fact that a religion invented in Germany in the 16th century inherited some core beliefs from the Catholic religion that it expressly sought to attack and undermine in every moral, social, economic and spiritual sphere, does not make them one religion. There's a lot of Judaism in all the Christian religions; that doesn't make a single Judaeo-Christian religion. There's a lot of both Judaism and Christianity in Islam; that doesn't make one big religion. It is the differences that define the religion.</p>
