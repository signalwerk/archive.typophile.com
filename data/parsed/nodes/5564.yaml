    html: "<p>Which three major religions, Hrant? A key feature of this history is, I think, the differentiation of what are typically lumped into single categories. This is the sort of thing that should appeal to you: the complexity of religious and cultural identity, as against a simplifying homogeneity. As William pointed out, Rabbanite Judaism is distinct religion from earlier Judaism: distinct on the basis of practice and teaching: a religion remade for a new condition. Of course, this too is a simplification. <br> <br>A religion is not a set of philosophical propositions that are believed or not believed. It is something that is lived (Catholics are practising, Jews are observant, but the emphasis is the same: it is about doing, not just believing). Christians presumably agree on the divinity of Christ; beyond that the range of both belief and practice make it ridiculous to speak about Christianity as a religion. Catholicism is a religion. Orthodoxy is a religion. Protestantism is half a dozen religions. It makes no sense to suggest that when I attend Mass I am practicing the same religion as a Baptist.</p>"
