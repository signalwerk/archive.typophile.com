    html: <p>It's a manuscript that's been erased and written over.  <br> <br>This is just a wild guess, but the dots look like Hebrew to me, but the script like Arabic, which I don't know at all, though some of the characters could be Hebrew also. In the 'golden era' of Spain a large percentage of Jews were Arabic speakers - Maimonides wrote 'Guide to the Perplexed' in Arabic with Hebrew characters. So it could be from that era.  </p>
