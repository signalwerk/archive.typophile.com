    html: '<p>John writes: <i>"Christians presumably agree on the divinity of Christ; beyond that the range of both belief and practice make it ridiculous to speak about Christianity as a religion. Catholicism is a religion. Orthodoxy is a religion. Protestantism is half a dozen religions. It makes no sense to suggest that when I attend Mass I am practicing the same religion as a Baptist."</i> <br> <br>I can do nothing but differ. I believe the common understanding of the terms is that Christianity is one religion with a large number of Churches. Roman-Catholics are one Church, Lutherans another Church, Calvinists yet another, Orthodox yet another etc. In Germany, Protestants (mostly Lutherans) and Catholics consider themself to be one religion in two Churches. They organize joint events and even common services. Being a Roman-Catholic, when I attend a Lutheran service, I do find myself practicing the same religion.  <br> <br>Adam <br> <br></p>'
