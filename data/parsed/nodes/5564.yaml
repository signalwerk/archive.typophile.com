    html: "<p>I believe Collette Sirat relies on R Hoerning for the explanation, but will need to find the latter book for more information. At the time the manuscript was produced, the Karaites were anything but a 'side story': numerically, they were as strong as the followers of Rabbanite Judaism during the 10th-12th centuries. In Persia, Iraq and the Byzantine Empire it was probably the dominant form of Judaism. [Ankori, Z. <i>Karaites in Byzantium: the formative years, 970-1100.</i> New York, 1959.]</p>"
