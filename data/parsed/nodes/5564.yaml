    html: <p>&gt;they were as strong as the followers of Rabbanite Judaism during the 10th-12th centuries <br> <br>I don't think this is correct. Even at their peak, they were a minority according to my check in Solo Baron's 'Social and Religious History of the Jews.' (1957) Intellectually, Maimonides is in the 12th Century, and much more important than any Karaite thinker.  <br> <br>Just checking on this in a cursory way, the Karaites were depleted in numbers by being murdered by Christians in the Crusades, and then by Maimonides, who intellectually overpowered them in the Arabic speaking world.      <br> <br>But Judaism is fundamentally Rabbinic Judaism - something generally not understood by Christians and even by many contemporary Jews. In particular, the achievements of the Tanna'im who created the Mishnah were as great as the Prophets, and they in fact invented the religion on which later Judaism, Christianity and Islam are based.  <br> <br>The Karaites, from the little I have read, are very thin gruel by comparison</p>
