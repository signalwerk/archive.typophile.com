    html: "<p>Sorry for the delay. A couple of people sent me e-mail with guesses, but no one got it quite right. <br> <br>You are correct, William, in noting that the document is a palimsest: an earlier text has been erased and the new text written over it. <br> <br>The language of the text is Hebrew, but written in with Arabic letters. This is the direct reverse of the normal interaction between language and script, e.g. Yiddish, Ladino and Judaeo-Arabic, in which Jewish communities develop a dialect of majority local language(s) but write it using Hebrew letters. This example is stranger still, because although the text is written with Arabic consonants, the vocalisation is written with Hebrew <i>nikudot</i> (vowel marks). The text is Biblical (Exodus 1:12-22) -- which makes the use of Arabic letters even more remarkable -- and also include <i>te'amim</i> (accents or cantillation marks). I wish I had a colour image: the letters are black, the nikudot are red, and the te'eamim are green. I'm not sure what colour the Arabic <i>shadda</i> marks are. The original manuscript is in the British Library, so I'll go look at it next time I am there. <br> <br>The likely history of this document is fascinating. It dates from the 10th or 11th century, and is a product of Karaitic Judaism, the anti-Talmudic competitor to Rabbinic Judaism. Colette Sirat notes: 'Certain Karaites considered the original written text to be identical with the true tradition of reading: it is not reasonable to think that certain of the divine words were written down in a certain way but must be read in another, as the masorah maintains. So as to remove any further ambiguity, some people decided to write the Bible in Arabic characters without the masorah, thus giving the only text that they considered authentic.' It takes some doing to wrap one's head around this reasoning: only the original Hebrew consonantal text is authentic, and to better isolate this from latter readings we're going to write it in Arabic letters. <br> <br> <br>See also: <br> <br>Sirat, Collette. <i>Hebrew Manuscripts of the Middle Ages.</i> Cambridge, 2002. pp.49-51. <br> <br>Hoerning, R. <i>Six Karaite Manuscripts of Portions of the Hebrew Bible in Arabic Characters.</i> London, 1889. [Cited by Sirat.]</p>"
