    html: <p><i>I believe the common understanding of the terms is that Christianity is one religion with a large number of Churches.</i> <br> <br>It is perhaps a common <i>mis</i>-understanding. It is certainly contrary to the teachings of the Church. <br> <br>Adam, I suggest you go ask the Congregation for the Doctrine of the Faith how many Churches there are. They will tell you there is <i>one</i> Church (one, holy, catholic and apostolic, as the Nicence Creed says). Or ask them whether you are fulfilling your Sunday or Holy Day obligation by attending a Lutheran service. If you think you are practicing the same religion as a Lutheran, consider what the gifts of grace mean in the theology of those two very different religions. Since gifts of grace are received in the sacraments, it is obvious that Catholic and Lutheran sacraments are not the same thing (quite apart from the fact that Catholics have seven sacraments and Lutherans have two). When Catholics and members of other religions meet together in ecumenical services, those services are expressly not sacramental in nature, unless the non-Catholics are explicitly attending a Catholic service as non-participating guests (as when the Orthodox Ecumenical Patriarch attended Mass at St Peter's recently). And of course non-Catholics are not permitted to receive Catholic sacraments. The fact that some people in Germany -- and elsewhere, I know -- confuse ecumenism with syncretism shouldn't cloud the very clear teaching of the Catholic Church on all these matters. <br> <br>If Christianity were a single religion, I would not have felt the need to make the very difficult conversion from comfortable Anglicanism to far more demanding Catholicism. Perhaps some people raised in predominantly Catholic countries take their religion for granted, and don't grasp just how huge the gap is between Catholicism and other Christian denominations, because they've never had to step across that gap. <br> <br> <br>William, again, I define religion in terms of practice as much as belief. Of course, belief informs practice -- or should --, and practice reflects belief -- or should. I too have found that faithful and observant people of different religions may have more in common with each other, in terms of temperament and values, than with weak-faithed and neglectful members of the same religion. But this is a interesting observation precisely because they are members of different religions. The faithfulness and observance is in the practice of the religion. I find it much easier to admire the Orthodox Jews I see walking many blocks to the synagogue on Shabbat than I do the Catholics who show up for Mass half an hour late and bolt out the door as soon as they've received communion. In that sense of 'how individuals interpret their religion', I agree with you, but as my exchange with Adam should indicate, I think there are clear limits on the degree to which religion is a matter of personal interpretation. There are Protestant sects for people who want to make it up as they go along, but this is not Catholicism nor, as I understand, Judaism.</p>
