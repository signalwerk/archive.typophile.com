    html: <p>&gt;Christianity precedes Rabbanite Judaism <br> <br>This is only correct in a technical sense that the same outlook was called the Pharisee view before the fall of the Temple, and Rabbinic afterwards. Otherwise, it is not correct. The ethics of Jesus comes directly from the outlook of Hillel, a generation before, and the combination of the ethics of peace and kindness, and belief in afterlife judgment and resurrection - both of which are not typically biblical, but are Pharisee - were adapted by Christianity. This was understood by the Christian scholars G.T. Herford and G.F. Moore in the early twentieth century. They actually bothered to study the Talmud and therefore saw what is obvious if you know the literature.  <br> <br>The Christian views of sacrifice I think are more derived from and bear more resemblance to the pagan religions that Paul grew up among than the Temple sacrifices. (The general Jewish view is that Paul invented Christianity.) No doubt there are strands of first century Judean religions that survive in Christianity and not in Judaism and visa versa. They both came out of the same pot, but the stew already had a huge amount of Pharisee ingredients. <br> <br>I suspect that, as I guess Hrant means to indicate, the ideas of resurection and the end of days came into Judaism during the Bablyonian exile, with exposure to Zoroasterianism. These these became Jewish with the Pharisees, then part of Christianity, and finally Islam. The point is that the synthesis of the Biblical, Greek and Zoroasterian elements that make up the Rabbinic outlook was in place probably well over a hundred years before Jesus. <br> <br>But this doesn't have much to do with type design!    <br> <br>     </p>
