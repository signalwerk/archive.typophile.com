    html: <p>From the point of view of a non-Christian, the Christian denominations do share a great deal, but also differ greatly.  <br> <br>They share not only the belief in the divinity of Jesus, but also in original sin from which Jesus supposedly is needed to save us. This sets up a framework of thought that is shared, as well as the text of the New Testament as a sacred text, and the history of its interpretations and meaning.  <br> <br>However, there are no doubt profound differences not only between Catholicism and Protestantism, but also among different Catholics and Protestants.  <br> <br>Personally, I find that how individuals interpret their religion is often more important than the theoretical content of the religion. I think it is easy to find Jews, Christians, and Muslims who resemble one another more in the realities of their beliefs than they do other of their co-religionists. <br> <br>  <br> <br></p>
