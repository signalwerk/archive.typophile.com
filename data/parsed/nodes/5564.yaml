    html: "<p><i>The Christian views of sacrifice I think are more derived from and bear more resemblance to the pagan religions that Paul grew up among than the Temple sacrifices.</i> <br> <br>I don't disagree with your characterisation of the progress from Pharisetical to Rebbanite Judaism, but I do disagree with the above statement. The Christian view of sacrifice is directly related to that of the Jewish sin-offering or sacrifice of atonement. There isn't anything like this in Paganism, in which the whole concept of sin is largely missing. In Paganism you sacrifice because you want something or believe you need to placate an angry power. The idea of the Mass as re-presenting memorial and atoning sacrifice is directly related to distinctly Jewish belief and practice: the Passover Seder and the sin-offering. The unique aspect of the Mass -- distinct from both Pagan and Jewish sacrifice -- is that as a bloody sacrifice it happens only once, on Calvary. Every other Mass is a participation in that single sacrifice. <br> <br>Anyway, as you say this doesn't have anything to do with type design. I just wanted to share this remarkable image of Hebrew written with Arabic letters and Hebrew vowels.</p>"
