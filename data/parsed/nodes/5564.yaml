    html: "<p>Generally, I agree with you. The 12th century is the end of the period of Karaite prominence in the Middle East, their principal base. Their lasting impact is clearly very small. Sirat estimates that there are about 20,000 Karaites in the world today. <br> <br>Judaism, as we typically encounter it, is indeed Rabbanite through-and-through. I disagree, though, with the idea with this statement: '... they in fact invented the religion on which later Judaism, Christianity and Islam are based.' Catholic (and by extension Orthodox) Christianity precedes Rabbanite Judaism, and can be seen as having more in common with Temple Judaism (specifically in the primacy of liturgical sacrifice, as against the primacy of the text in Rabbanite Judaism, Islam and Protestantism). This was a point first made to me by a Jewish friend.</p>"
