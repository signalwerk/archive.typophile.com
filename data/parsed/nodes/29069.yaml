      <p>The style is known as "prisma" which was particularly popular during the 60s and 70s.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/churchward_4010.png"></div><p></p>
      <p><a href="http://www.myfonts.com/fonts/churchward/design-lines/" target="new" rel="nofollow">Chrurchard Design-Lines</a> is just one of many variations. ITC AKI Lines is another, popular as a phototype film font but I haven't seen digitized.</p>
