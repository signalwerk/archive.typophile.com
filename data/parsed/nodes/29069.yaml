    <p>Hi,<br>
    I foud this beautiful hand drawn type from <a href="http://www.loveworn.com" title="www.loveworn.com">www.loveworn.com</a> by Mario Hugo.<br>
    Amazing stuff! I have seen a few typefaces with the multiple lines from the 60's &amp; 70's<br>
    but I am after some names, and ones that have been digitized. Or even more modern<br>
    one that have been made similar. Any help would be greatly appreciated. Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/loveworn_3916.gif"></div><p></p>
