      <p>I like the idea of a bowl. I think that’s something good to work with. </p>
      <p>Standard logo advice:<br>
      Take a pencil to paper and draw some ideas before getting on the computer.<br>
      Focus more on the form and the text without worrying about color. Use only black first and then add color later.</p>
