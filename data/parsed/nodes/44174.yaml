    votes: null
    html: |-
      <p>A logo is not a template for other text. A logo is needs to be static and scalable, and this is neither. I think you were closer to a logo with the first one, but why don’t you start by going to your local pet supply store and looking at all the logos. </p>
      <p>Notice the simplicity of the logos you find, and the way they could appear comfortably at the top of and invoice, a small product label, or on a poster, and still be legible. Like most company identities, <a href="http://spcacincinnati.org/pages/images/iams_logo_web.jpg">this Iams logo consists of three parts.</a> The paw print is the logo, the word IAMS is the logotype, and “Good for Life” is their tag line. </p>
      <p>Notice, in your green sample, that the paw prints would become blobs if you printed them any smaller? And the website would be a blur? That’s a huge problem. </p>
      <p>I like the retro idea, and for what it’s worth, I also liked your original color pallet. The font and the “rays” don’t work at all, though.</p>
    html_clean: |-
