    <p>Hello,<br>
    First of all I am an absolute newbie to logo-design...or any kind of design.<br>
    I do have some basic AI skills and I’m trying to help my younger brother design a logo for his small business; A fresh dog-food delivery that he wants to start this summer.<br>
    I decided not to use an image of an actual dog because A: I don’t know to draw one and B: It wouldn’t be very original. So I’ve decided to go with the bowl instead.<br>
    I have an idea of making it look like retro-50’s logo and this is what I came up with so far:<br>
    I would really appreciate your input...keep in mind I am not a designer, just trying.<br>
    Thank you.<br>
    </p><div class="imageWrap"><img src="/files/cb_3493.jpg"></div><p></p>
