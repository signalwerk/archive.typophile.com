    html: <p>I learned a long time ago, as a designer, never to get a tattoo...I will never be happy with it. Is it straight, is the kerning off, are the serifs equal... really... I suggest the same to you. LOL  <br> <br>Plus you will always want to change it, modify it, or worse, add to it...</p>
