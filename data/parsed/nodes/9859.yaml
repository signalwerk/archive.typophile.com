    html: <p>"<i>A friend wants to get "ROMANCE" tattooed across the palm of his hand.</i>" <br> <br>ow Ow OW! <br> <br>If you're stuck on serifs, I'd go with a slab like <a href="http://store.adobe.com/type/browser/P/P_064.html">Clarendon</a> or the like. The thicker forms may dampen the effect. From what I've seen of traditional tattoo lettering, it tends to be thick stems and thin, monoline serifs; a kind of deviant, curvier Bodoni. Not sure if that's a stylistic or practical thing, but you might want to consider it.</p>
