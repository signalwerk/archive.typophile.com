    html: <p>Robb, <br> <br>It seems to me that the location of the tattoo would guide in type choice as well. Traps for cheap paper is one thing, but what about the way the hand wrinkles? Seems to me that a sans would be the safest bet, or maybe a semi might be interesting. Another thought could be that it isn't the new tattoo that is considered but the journey it will be on.  <br> <br>Interesting location too. <a href="http://www.westcoastchoppers.com/low.php" target="_blank">Jesse James</a> has a tattoo on his hand that says "Pay up sucker" in a script.</p>
