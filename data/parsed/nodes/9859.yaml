    html: "<p>I've already yelled at him for wanting (in my opinion) a regrettable tattoo, but he has his heart set on getting \"jobkillers.\" He also has a printer's mark fleuron inside his lower lip. after I got over the initial shock, the legibility question seemed interesting from a print production perspective.  <br> <br>The stylized moderns are classic probably because tattoo pioneers drew that way--more style than utility. Just a guess considering most of those thins turn murky in a few years. Yet people still get them. <br> <br>Tiffany: there was an interview with Jesse James in Fast Company, FSB, or Inc (one of the business-lite mags) that had a gorgeous gritty photo of that PAY UP SUCKA. A poor quality one here: <br><a href=\"http://clantongang.com/oldwest/tgplb0313a.jpg\" target=\"_blank\">http://clantongang.com/oldwest/tgplb0313a.jpg</a> <br> <br>I'll suggest the Clarendons to him.</p>"
