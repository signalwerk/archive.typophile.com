  html: <p>A friend wants to get "ROMANCE" tattooed across the palm  <br>of his hand. We started digging through specimen books  <br>wondering what sort of serif would best hold up over time. <br>Old tattoos do this strange sort of shift. It's not exactly like <br>ink bleed nor loosing focus, but somewhere in the middle.  <br>So how do we compensate? Designers have dealt with  <br>cheap newspaper printing and type for the screen, are any  <br>of those techniques applicable for aging skin? Ink traps  <br>were discussed to prevent too much bleeding. Sharp latin  <br>serifs could eventually erode into something like a soft  <br>transitional bracket? Has anyone had any experience with  <br>this? Or know people whose tattoos remain legible?</p>
