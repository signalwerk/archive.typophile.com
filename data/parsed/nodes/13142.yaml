    html: <p>I haven’t used Vista but I might disagree with Paul on the point about personality... Vista alternates provide plenty in the personality department. I have used and worked with Auto and I love it. The roman is very capable and the italics are stunning. There’s a lot of versatility built in to the different italics.</p>
