      <p>While Auto’s italics are stunning, I would probably only use them sparingly in the magazine. Sort of a secret weapon to throw out there occasionally. As long as Auto will function as a workhorse typeface for sidebar copy, captions, blurbs, etc., it seems like it could be the right choice. It’s fresh, exciting, critically acclaimed (will be recognized in TDC’s next annual). Any further comments/experiences/advice? Thanks.</p>
