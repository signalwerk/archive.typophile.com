    <p>Is it a bad idea to add a bar atop <strong>J</strong> to help fill the white space this letter creates in all caps setting or is there a chance this will be mistaken for an <strong>I</strong>, as it is designed this here:</p>
    <p><a href="http://new.myfonts.com/fonts/berthold/ag-schoolbook-bq/" title="http://new.myfonts.com/fonts/berthold/ag-schoolbook-bq/">http://new.myfonts.com/fonts/berthold/ag-schoolbook-bq/</a><br>
    <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_schulbuch_sud_normal/" title="http://www.fontshop.com/fonts/singles/fontfont/ff_schulbuch_sud_normal/">http://www.fontshop.com/fonts/singles/fontfont/ff_schulbuch_sud_normal/</a></p>
    <p>I'd rather the J I am drawing didn't (truly) drop below the baseline.</p>
    <p>How many are familiar with the <strong>I</strong> as it appears in AG Schoolbook BQ Regular and FF Schulbuch Süd or is this a relative anomaly? Is this style of <strong>I</strong> only common in Germany?</p>
    <p>Many thanks</p>
