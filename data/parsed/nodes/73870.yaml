      <p>Oddly enough, I find myself interpreting the <strong>J</strong>s as Is more WITH the crossbar as shown in the sample. It has an oddly cursive look to it; weird at the very least. I don't get that at all with the <strong>J</strong> without the crossbar, to the point that I don't see how anyone could. There might be a cultural bias working here.</p>
      <p>However I do appreciate having an <strong>I</strong> with serifs in an otherwise sans font, if only to reinforce distinction between it and lowercase L.</p>
      <p>A descending hook on your cap J would allow for tighter kerning in all caps settings, resolving the white space issue, but that's not a suitable design decision for every situation.</p>
