      <p>Hi,</p>
      <p>as its name implies Schulbuch/Schoolbook typefaces have been made particularly for school / educational books or are modified versions of existing typefaces – e.g. AG Schulbuch is a modified version of Akzidenz Grotesk Buch.</p>
      <p>It’s no coincidence that this specific /I/-form reminds of Italics and/or handwriting.</p>
      <p>In Germany, pupils were/are taught a standardised form script/handwriting (one of them is called Lateinische Ausgangsschrift, but there are several revisions).<br>
      It was assumed that seizing the letter forms pupils were used to, e.g. the one storey /a/ and the /I/ like the one you mentioned would ease the recognition of particular letters and therefore improve the overall readability and legibility for reading rookies.<br>
      Quite likely, the ‘abstract’ look of a Grotesk /I/ – a simple vertical line – was an issue, too.</p>
      <p>The one-storey /a/ and /g/, the hooked lc /l/, the spurless G and the peculiar /I/ could also be considered an atavistic parallel to German blackletter letterforms. Even though blackletter wasn’t taught anymore in school at that time it was still way more present than it is today. And in blackletter (and therefore in Germany until WW2), the differentiation between /I/ and /J/ has not been popular till the late 19th century / early 20th century. This potential parallel might be a reason why a single-storey /a/ and /g/ and a hooked lc /l/ are still looked upon as being ‘German’ by some.<br>
      Until then, it was most common to have one glyph for both /I/ and /J/ which either sits on the baseline or drops it, but always with some kind of crossbar and in the shape of what (nowadays) most people would read as a /J/.</p>
      <p>And, being German, I doubt that a lot of people in Germany would misread this specific one as an /I/. In a custom font I made two years ago (a Geometric Grotesk), I used a /J/ with a crossbar similar to the /I/ in Schulbuch Süd, the /I/ being a simple vertical stroke. I didn’t hear of complaints about ambiguity or the danger of confusion so far…</p>
