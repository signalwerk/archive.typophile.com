    <p>Hi - I'm a new designer working with a social justice nonprofit to design a new look for all their publications. </p>
    <p>They want to use ITC Eras for as their display font. It feels dated to me but what do you think? Not sure if I should work hard to convince them otherwise.</p>
    <p>Also, I'd really appreciate any suggestions about how to choose a body font to pair with it.</p>
    <p>Thanks!</p>
