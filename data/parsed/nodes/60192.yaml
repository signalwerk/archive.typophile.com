    html: |-
      <p>Sure it's dated, like a Lambo.<br>
      So you gotta ask, how will you make 1960s high-tech go-faster styling work for a social justice non-profit?<br>
      With some retro styling, perhaps?--try negative tracking the hell out of it, or at the very least, "tight but not touching".<br>
      Because when Eras isn't set ultra tight, it's just not right.<br>
      So to go with that tight set, choose a small x-height text face and set it solid in narrow columns rag right.<br>
      Choose from any contemporary ITC face--light weights of ITC Souvenir or ITC Garamond would be cool.<br>
      My <a href="http://www.shinntype.com/pratt.html" rel="nofollow">Pratt Pro</a> would work that look too.</p>
