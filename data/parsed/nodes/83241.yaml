  html: |-
    <p><a href="http://www.amazon.com/Type-Image-Barbara-Brownie/dp/1584234423/ref=cm_cr-mr-img" title="http://www.amazon.com/Type-Image-Barbara-Brownie/dp/1584234423/ref=cm_cr-mr-img">http://www.amazon.com/Type-Image-Barbara-Brownie/dp/1584234423/ref=cm_cr...</a></p>
    <p>Perhaps I have an unfair bias since two of the works published in the book are mine so I will try to be fair.<br>
    The images collected are a joy to look at but I wish there would have been more connection to the text in the book. Some visuals have plenty of description while others (the ones that appealed to me most) get none. There is no apparent reason why these choices were made. Adding brief captions would have helped the reader understand why the author included that particular image.<br>
    For a book on typography, I found the layout and typography less than stellar. I would have expected great typography and design. The H&amp;J settings are spotty and the column spacing is claustrophobic. The unneeded meandering between 3 column and two column layout is just bewildering. With such a high density of visuals to text, the layout has not found a way to make it all work together. I find myself wishing for more text and I am a visual guy!<br>
    All-in-all, I like the book for what it contains and give kudos to the author for her amazing effort in collecting so many differing pieces. I just wish that the presentation matched the ingredients.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/type_image_5342.png"></div><p></p>
