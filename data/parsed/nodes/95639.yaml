  html: |-
    <p>Hi everybody,</p>
    <p>After a couple of years out of the type scene, I'm glad to present Rebellia. It has been a joy to make some furious destroyed forms, so I hope you like it and the fonts can be useful for specific graphic contexts :-)</p>
    <p>It is already available at <a class="freelinking external" href="http://www.myfonts.com/fonts/outras/rebellia/" rel="nofollow">MyFonts</a>.</p>
    <p>The description:<br>
    Rebellia is a sans serif display type family designed in a aggressive grunge style. The family is composed by Rebellia Regular and Rebellia Dingbats that contains some drawings that follow the same destroyed visual language. Rebellia is suitable for titles, posters, fashion, t-shirts, covers, action movies, advertising and deconstructive things in general.</p>
    <p><img src="http://outrasfontes.com/rebellia1.png"></p>
