      <p>@charles ellertson:<br>
      <cite>Books have been set in Greek, Latin, and Hebrew since the 16th century. How did they ever manage?</cite></p>
      <p>Excuse me. The fact that the original post did not explicitly mention that the poster was trying to typeset his book using OpenType or TrueType fonts on a computer, instead of with hot metal does not mean the original poster was being mendacious.</p>
      <p>Your other complaint, that he was seeking advice of a nature that amounted to asking people to do work for him for free, may or may not have been valid, but the claim about using half-truths is simply <em>absurd</em> if that is intended as its basis, as it appears to be.</p>
      <p>Most of the free fonts I know of with lots of support for foreign languages are versions of Times Roman, and I don't know of a Garamond with such coverage. There's a font with a lot of characters <em>called</em> Caslon, but it's actually in the style of the ugly Roman lettering used with some old Chinese fonts. If one is using Windows, it now comes with Sylfaen, which has wide language support without being Times Roman.</p>
      <p>For Greek, specifically, the Greek Font Society has numerous free Greek fonts with a matching Latin part. There are free Hebrew fonts with a Helvetica-like Roman, and no doubt others as well. But if you insist on setting your Roman, Hebrew, and Greek in a single font, I'd suspect that Times Roman, Arial and Sylfaen are almost your only free choices. Oops; Sylfaen doesn't have Hebrew.</p>
      <p>Ah; there is another choice. TexGyre Pagella has both Greek and Hebrew. It looks like Palatino by Hermann Zapf.</p>
      <p>Of course, you probably don't need to choose a free alternative, as you're using Adobe InDesign, not Scribus.</p>
      <p>As for old German, you perhaps should look at Dieter Steffmann's selection of Fraktur fonts, although I don't know if they have the hyphen you want.</p>
      <p>Oh, wait: there's EB Garamond from Google Fonts.</p>
