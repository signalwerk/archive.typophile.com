      <p>Since I don't <em>use</em> fonts much there could very well be a perfect free solution (such as Brill - although, as David hints it actually has some usage restrictions you need to mind) that I'm not aware of, so please take this with a grain of salt: one solution is to pay somebody to make any and all modifications you need; you're actually lucky that Adobe allows this sort of thing (while most font houses these days don't). On the other hand it might be possible to patch base letters and stand-alone accents into a working system, but you might actually end up paying more for that to be set up for you, since it's not as practical as something that works out of the box. BTW, I know I'll sound like a broken record, but: I was actually once commissioned to add 20 dotted letters to Garamond Premier Pro (for transcribing Sanskrit) so please feel free to ask for a quote*. That said, there are many people reading this who could also do this sort of work for you, quite possibly better and/or cheaper.</p>
      <p>* hpapazian at gmail dot com</p>
      <p>Concerning your issues with non-Latin text: you <em>might</em> get away with using different fonts, but there's a good reason some type designers make matching Latin/Greek/etc. fonts... A nice level of harmony isn't so easy to achieve (especially when it comes to matching color - AKA weight), and you might spend a lot of time tweaking disparate fonts into a working whole. When one writing system looks "more important" on a page, <em>somebody</em> will accuse you of cultural favoritism!  :-/</p>
      <p>BTW, AFAIK the "wide-coverage" version of Gentium doesn't have a Bold, in case that matters.</p>
      <p>Whatever you do, try to avoid mixing fonts inline (I mean in a single writing system) since that's very unlikely to result in something to be proud of...</p>
      <p>hhp</p>
