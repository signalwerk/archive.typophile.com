  votes: null
  html: "<p>I am setting the text for an anthology on Pre-existence. The text has quotes in Greek, Hebrew, transcribed Hebrew and old German (the later uses a double hyphen with a slight upward curve [⸗]). As an alternative to Times New Roman, I am using Adobe Garamond Pro in InDesign. I soon found out that I had to upgrade to Garamond Premium Pro in order to get support for Greek. For Hebrew, I am using Adobe Hebrew. I am surprised by facing problems I've never had using Times New Roman: some glyphs are missing in Garamond, for instance two transcribed Hebrew Letters (Ḥ and ṣ) and the double hyphen used in old German (⸗). I am considering replacing single letters set in Garamond to Times New Roman just to make the text readable, but I am generally surprised by the fact that it is so troublesome to find a worthy replacement of Times New Roman. Does anyone have any suggestions to typefaces that can match Times New Roman in its a broad support of languages and glyphs?</p>"
