      <p>Well Charles, this time there's no <em>direct</em> personal attack, but you <em>are</em> accusing me of lying in order to get business. I'm not like that. We are simply disagreeing on certain things, and I believe that what I do can be valuable to some people sometimes. I make/modify fonts not because I can't make money any other way (in fact I do) and I have to trick people to pay me, but because I enjoy providing that service that some people sometimes need. I don't know when a particular person needs it, so when it seems to make sense I offer it and see if it clicks. If it does, both parties benefit. If not, oh well.</p>
      <p>But I actually don't think you care about how I make money or not; I think the real reason you're upset is that I expose your shallow understanding on some topics. I guess it's not enough that I agree with you sometimes, I must not disagree with you ever on anything.</p>
      <p>Start your own blog. This is a <em>forum.</em></p>
      <p>--</p>
      <p>People got around before the invention of the wheel too. Unlike you I have made multi-script systems, and people have paid good money for them (and paid me to consult on refining such systems). I don't make them as a snake-oil ruse or because I'm bored - I make them because I think they're needed. And I'm not the only one by any means. Claiming that formal harmonization of scripts (as opposed to hoping for some dumb luck with whatever fonts are on hand) is not a design parameter is nothing short of deluded.</p>
      <p>Furthermore, I actually have no fonts that meet Christian's multi-script criteria, and I couldn't promptly make any. So how could I sell him anything? I was simply giving free advice there. The only service I can/did offer related to adding missing characters to Adobe Garamond Premier. And how could that be a deception? Do you really think cobbling things together is a better solution? Well, I guess you could... But I simply don't agree with that (even though I did mention that approach).</p>
      <p>--</p>
      <p>BTW, I have again saved Charles's formerly helpful post. I don't feel totally OK reposting it, but since I consider a post to Typophile as being partly "owned" by Typophile, if anybody needs a copy please let me know.</p>
      <p>hhp</p>
