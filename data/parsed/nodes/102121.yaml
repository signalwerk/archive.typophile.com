      <p>kmmai,</p>
      <p>Andron Mega has the best coverage regarding Latin, Greek and Cyrillic scripts, including phonetic alphabets and medievalist support. It is a high quality font, with consistent design through all scripts, and goes far beyond Times.</p>
      <p>Second to Andron, you can find the SIL fonts –Gentium, Doulos, Charis, Tinos, and Junicode– and Brill, already suggested.  Someday, <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">my own project</a> will be on this list too.</p>
      <p>Times New Roman offers a large language support, but it has several glyphs poorly designed. Phonetic glyphs and barred letters, for example, does not match the quality of the original set.</p>
      <p>To edit a font is also a good possibility. You will be in good hands if you get hrant's help on this.</p>
