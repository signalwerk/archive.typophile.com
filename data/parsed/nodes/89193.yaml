    html: |-
      <p>I agree with the others that the icon needs improvement. If management wants to stick with it, I'd experiment with variations that are bolder and more contemporary. </p>
      <p>For example, perhaps making it larger than the type and putting the type on top of it (or reversed out of it so the letters are holes in the shape) so its a background for the type and it's all one integrated unit. (Might need to adjust the angles.) And perhaps overlapping the panels and/or using translucent effects. </p>
      <p>The double m's in the name — perhaps something interesting could be done with them. Not sure what; my first thought is some kind of overlap effect.</p>
