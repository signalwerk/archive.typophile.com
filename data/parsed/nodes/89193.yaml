    html: |-
      <p>I really do appreciate all the help, but I feel I need to just go on to the final stage and show the design to everyone for their feedback. At the end of the day, they're the ones who are going to decide whether we go with it as-is, or change certain aspects before approval.</p>
      <p>I've attached what I think should be the final revision of this concept. I'll present it together with a proposal I'm putting together now:</p>
      <blockquote><p>
      CONCEPT</p>
      <p>Everything in woodmark - no separate icons to distract attention from name, or confuse the image</p>
      <p>Italicised - implying movement and forward-thinking</p>
      <p>Sharp and rounded elements - implying astuteness and precision, as well as friendliness and flexibility</p>
      <p>Customized font - /c/, /s/, /t/, /m/, and /i/ have been modified, meaning no risk of doppelgänger logos </p>
      <p>Flexible - the more neutral typeface (compared to Industria) gives more flexibility. Custom Media can be bold and cool, friendly and approachable, or a bit of both.</p>
      <p>Two focus areas - merged double-M and two-colour /i/</p>
      <p>Merged double-M<br>
      - Implies: collaboration, merging of ideas (between us and the client, as well as in-house)</p>
      <p>Two-colour /i/<br>
      - Creates a good color balance<br>
      - In usage: when flipped 180 degrees, the /i/ becomes an exclamation mark, implying thoughts, ideas, and creativity (as per our recent print ad)</p>
      <p>The idea is to play with the angle of the italicised type, together with the exclamation mark, to create a striking, forward-thinking, creative brand, without coming across as cold or rigid.
      </p></blockquote>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2_4960.5_final.jpg"></div><p></p>
