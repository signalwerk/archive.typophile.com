      <p>Luma: You might have missed the post where I mentioned we're based in Japan. I was thinking it'd be nice to combine that with our core strength (print).</p>
      <p>Yeah, I realise it's not an original idea. I thought I'd seen a similar design before and Googled 'origami logos'. That Kite String Studio design from Logopond came up loads of times. Like 99% of the designs on there, though, it appears to be for a fictional company. Green Chutes doesn't exist either.</p>
      <p>It's an interesting question to ask, though: if you come up with a design for a real company that everyone is happy with, and then realise someone from the other side of the world has created something similar for a fictitious company and posted it on a design blog, does that mean you have to scrap the idea entirely?</p>
      <p>Apankrat: Appreciate the comment. There does appear to be several "30 Inspirational Origami Logo Designs" blog posts out there, featuring mostly Logopond creations. I'm not sure it warrants dismissing the idea, though.</p>
      <p>Also, I like my design more than the others, because I haven't resorted to gradients and built-in drop shadow effects. ;P</p>
      <p>Incidentally, I'm not scrapping the double-m ligature idea. I've simply had time to play around with a few other concepts, and the origami one was quite pleasing so I posted it. I might end up proposing these two ideas so the bosses have a choice (and I've got a feeling they're going to prefer the bolder, origami design).</p>
