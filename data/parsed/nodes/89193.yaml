    <p>Hello! Long-time lurker, first-time poster.</p>
    <p>My company is looking to re-brand itself, and I'm playing around with a few ideas for our new logo. The attached design is currently popular (especially the slightly modified Industria version), but I'm concerned Industria - while bold and interesting - is too cold and unfriendly for a company looking to attract new clients.</p>
    <p>Your thoughts on the font selection below, and the general design? We're a publishing/design house, mostly working with print.</p>
    <p>Thanks in advance!</p>
    <p><a href="http://bit.ly/wIMMk1" title="http://bit.ly/wIMMk1">http://bit.ly/wIMMk1</a></p>
  html_clean: |-
