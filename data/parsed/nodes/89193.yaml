    html: <p>The icon seems inconsequential above the text.  It is small, plain, and constructed out of very basic geometric shapes arranged in a typical way.  I think it will be challenging for you to stand out without something more memorable in the icon (assuming the name is not up for change - it is quite generic too).  I would dive into the brief more.  What is unique about you?  Is it just about a folded piece of paper?  What do you want the identity to communicate?  What does a custom media piece mean?  Custom type?</p>
