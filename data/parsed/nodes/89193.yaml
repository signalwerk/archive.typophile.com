      <p><cite>&gt; I feel like I'm having to shoehorn an icon into the logo</cite></p>
      <p>Can you try to argue for a purely typographic solution? I'm thinking that a strong wordmark, like you might be developing here, can stand alone (and perhaps even <em>should</em>, so the logo doesn't get overloaded with too many different ideas). And where an icon is needed, such a typographic solution could in turn spawn short-form icons – for instance you might consider using that triple "m" for favicons and the like.</p>
