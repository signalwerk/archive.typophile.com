      <p>I made my own version of Franklin Gothic, and named it Tee Franklin. There has been no problems from any big guys (Monotype, Linotype or Adobe). My design was in between Adobe and ITC versions, based on my samples of M. F. Benton, with added thin weights. In fact I offered Tee Franklin to Monotype/ITC, but they declined. </p>
      <p>I also made a new version of Kabel, but with that my design was very different from the original, so there was no real conflict.</p>
      <p>Historically, during metal type, font foundries bought each others fonts just to copy their designs. I guess things have not changed that much from those times…</p>
