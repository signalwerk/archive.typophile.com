      <p>I'm not a lawyer, but "public domain" is simply intellectual property that isn't controlled by anyone. Since copyright doesn't apply to typeface designs in the US, I'm not sure the term "public domain" can be applied to them in any meaningful way in the US.</p>
      <p>And given the long and storied history of typeface cloning in this country, I don't think a font copyright in Europe means anything in the US. Speaking of Futura, there are a number Futura clones from the period and since. See Fotura, Spartan, Tempo, Twentieth Century, etc.</p>
      <p>We have to distinguish here between what we believe should be right and what the law actually states, and again, and I don't know how else I can phrase this: US copyright law does not protect typefaces.</p>
      <p>So, back to the original question. By all means consult a lawyer, but based on everything I've read, my understanding is that tracing the original Futura drawings, or indeed any typeface that catches your eye, is legal in the US.</p>
      <p>It's a double-edged sword. Imagine being a one-person foundry and getting a legal notice from Megafont, Inc that they believe your typeface infringes their copyright, dragging you into an expensive lawsuit. In the same way that patent law has been perverted to stifle innovation by companies that exist only to hold and enforce patents, typeface copyright could be used to strongarm the little guys out of the business.</p>
      <p>Here's more:</p>
      <p><a href="http://nwalsh.com/comp.fonts/FAQ/cf_14.htm#SEC40">http://nwalsh.com/comp.fonts/FAQ/cf_14.htm#SEC40</a></p>
