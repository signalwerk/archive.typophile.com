      <p><em>Example: Linotype ripped off Futura and sold it as "Fotura":</em></p>
      <p>Seems like this came up another time, but Fotura originated at Alphabet Innovations, Phil Martin's film font company, around 1970. It's not a clone of Futura, although it is clearly based on it and acknowledges the fact (with a wink) in its name. While the caps are very close (maybe identical), the proportions of the lowercase are different in the extreme, with an x-height nearly as high as the caps. One may well call it a rip-off of Futura, but it's obviously not meant as a look-alike substitute.</p>
      <p>How Fotura wound up at Linotype I don't know, but that's not where it originated.</p>
