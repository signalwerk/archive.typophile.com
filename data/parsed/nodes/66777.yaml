      <p>Uli: perhaps not <em>granted</em> copyright, but as you are surely aware, whenever you write, draw, paint, sketch, etc. something, you automatically <em>have</em> copyrights. Unless somekind of law explicitly states where this doesn't apply, you always have copyrights on whatever original work you make. At least in most European countries. Peraps not in the US, as they seem to do these kinds of things differently for some reason.</p>
      <p>And then there is the Berne Convention, under which every country that agrees to this has to respect the copyright laws of other signatory countries. I.e. the US has to respect copyrights on type designs from other countries, but not those designed inside its own borders. In other words, as far as I know, if a type design is copyrighted in a country that signed the Berne Convention, that copyright is valid in the US. But I'm sure someone has found a loophole in that.</p>
      <p>But I think it is safe to say - unless I'm horribly mistaken - that Futura and Helvetica are <em>not</em> in the public domain, as that was the original purpose of this thread.</p>
