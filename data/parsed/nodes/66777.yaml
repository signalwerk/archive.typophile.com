      <p>sii:</p>
      <p>&gt; <cite>A EULA is an agreement between you (the person forking over cash for a font) and the creator of that font. Not sure how that relates to the question of copyright?</cite></p>
      <p>A font EULA is not a purchase agreement, but it is a copyight license agreement granting to the licensee (against payment of a stipulated license fee) the non-exclusive copyright usage right to use a given copyrighted font in a particular manner.</p>
      <p>However, if a country's copyright law does not provide for the copyright protection of fonts at all, then such font EULAs are null and void, because a foundry cannot grant to you copyright licenses to non-copyrighted fonts. Foundries which (by means of font EULAs) offer to you copyright licenses to non-copyrighted fonts commit the crime of fraud.</p>
