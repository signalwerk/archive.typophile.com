      <p>&gt; <cite>So in short, all typefaces (including Futura and Helvetica) are basically in the public domain in the USA, <strong>but not in the EU</strong></cite></p>
      <p>Germany and Switzerland and the EU (European Union) are not the same!</p>
      <p>And what is more: The EU did not exist when Paul Renner designed Futura!</p>
      <p>For Futura as a font by a German designer the legal situation is this:</p>
      <p>Germany has two laws:</p>
      <p>- Copyright law (no protection for fonts)<br>
      - Design law (protection for fonts)</p>
      <p>The German design law protects fonts for a short period, provided they are registered in the year of publication and provided the registration fee is paid for the period of protection.</p>
      <p>When Paul Renner designed the font Futura (circa in the year 1928), the period of protection for fonts by the German design law was a maximum period of 15 years. This means, that by the end of World War II, the font Futura was already in public domain.</p>
      <p>The German design law protects all technical forms of fonts including the outline data, which are called in EULAs "font software". Since fonts are protectable by the German design law, protection of fonts by the German copyright law is practically impossible and was never confirmed by the German Supreme Court, because there is no need to protect a font by two different laws.</p>
      <p>The Berne Convention, to which Germany is a signatory, relates to the copyright law, not to the design law. Therefore it does not make much sense to discuss the Berne Convention in the context of German fonts, e.g. in the context of the public domain font Futura.</p>
      <p>For the public domain font Helvetica, which was designed by the Swiss designer Max Miedinger, the legal situation is similar.</p>
