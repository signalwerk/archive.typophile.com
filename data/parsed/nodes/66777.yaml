      <p>In the US, typeface designs aren't copyrightable, so sure, you can trace and redraw any font you like. It's not a good way to make friends, but many companies have done just that.</p>
      <p>It's the name that has trademark protection, as was mentioned, but the design is considered to have an "intrinsic utilitarian function for use in composing text." (Dingbat fonts would seem to be a different story.)</p>
      <p>The workaround in the US is to call fonts software, but again, the shape of the letters isn't what's being protected, just the particular software that generates them.</p>
