      <p>Uli, your response makes sense except for one small thing: Futura LT is NOT Futura. That is, it isn't the same type that was designed more than 70 years ago, but a version of it, design much later. Therefore, if they have rights to sell it, you don't have rights to use it by free will. As a specific type, Futura LT is subjectable to copyright as software. Another thing that I find really interesting in your judgement is the fact that you defent type is copyright-free, however people pay really big cash to get a font designed by Adobe or ITC. Why? Because they are specific variants, designed, and subjected to copyright. And even if not, Creative Commons definitely apply. Don't know the specific terms of USA law, but by what was said here, my conclusion is that a typeface designed and unaltered for more that 70 years since it's designers death is public domain. However, that does not seem to apply to digital typefaces, does it? Even more, digital typefaces ARE software. Specifically because software does not mean program. A word file is software, and abides by the terms of software copyright. Its encriptation is copyprotected, as well as it's content. You can go check it out, you'll see I don't lie. ;) But then again, I COULD be wrong.</p>
