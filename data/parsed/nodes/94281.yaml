    <p>I am looking for an authoritative, informed opinion on the subject of proper spacing before and after the slash/solidus/slant character in professional typesetting.</p>
    <p>I need advice on spacing in English, French, and Spanish languages. Opinions are fine, and I have one myself. I am hoping for some professional, scholarly information that goes beyond personal opinion.</p>
    <p>Thank you!</p>
