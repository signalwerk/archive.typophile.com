    html: "<p>In English, I go by the context: by default, I space / around the slash, but sometimes it helps solve ambiguity not to have spaces. So whichever is clearer in context. In the same way that a hyphen becomes an en dash when one of the compound parts it's connecting is more than one word, I think a slash gets spaces around it when one (or more) of the things it's diving is more than one word. I usually prefer spaces, though, unless there's a good reason not to. I think Bringhurst has examples of both styles, which seems to imply it depends on context.</p>"
