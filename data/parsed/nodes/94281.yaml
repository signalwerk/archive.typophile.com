    html: |-
      <p>And don't ignore the virgule, which has a different slope.  Bringhurst states that the solidus should be kerned,which implies no spaces before or after. However, his printed examples have quite a bit of white space around them, indicating very loose kerning.</p>
      <p>It depends on the context whether a line break can occur following a slash. FOr instance, it's never OK to split the two parts of a fraction, but if it's two words that are separated by the slant character (there: I've used all the terms for it) then a line can end with the solidus. Personally, I wouldn't end a page with it, though. Too confusing.</p>
      <p> - Herb</p>
