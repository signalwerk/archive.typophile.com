      <p>The <a href="http://www.microsoft.com/typography/VOLT%20Release%20Notes/gsub.mspx" target="_blank">VOLT Release Notes</a> (bottom of the page) say:</p>
      <p><cite>NOTE: Glyphs in groups are always ordered by their glyph IDs and not by the order implied from the way a group is described.</cite></p>
      <p>So what matters is not the order of glyph names in group definitions, but the order of glyphs in the font. The glyph order should be <cite>A B C ...</cite> and <cite>A.alt B.alt C.alt ...</cite></p>
      <p>Karsten</p>
