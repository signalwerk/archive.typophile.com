    html: "<p>Yes, Karsten has it right: the GID orders of the two groups need to be cardinal. This limits the use of groups in substitution lookups. Generally, I recommend against the use of groups in this way anyway, since it doesn’t provide any visual feedback on the substitutions in the lookup.</p>"
