    <p>Hi,<br>
    I am currently building an arabic font with a number of contextual alternates lookups.<br>
    In some of the lookups, I use groups as substitution targets and/or context.</p>
    <p>All my lookups and groups seem to follow the appropriate syntax; the font compiles just fine.<br>
    However the “substitution behaviour” of those lookups which use groups (instead of a list of individual substitutions) is completely erratic. Per ex, in a lookup where I have:</p>
    <p>&lt; Group1a &gt; -&gt; &lt; Group1b &gt; in the context of being followed by &lt; Group99 &gt;</p>
    <p>in which the elements of Group1a are: A and B (in that order)<br>
    the elements of Group1b are: A.alt  and B.alt (in that order)</p>
    <p>We would normally expect A to be replaced with A.alt  and B with B.alt</p>
    <p>However it is not what is happening. Instead, A is replaced with B.alt and B is replaced with A.alt.<br>
    It is not simply an inversion [which itself would also be puzzling]; with larger groups, elements A, B, C, D are replaced randomly (ex: A by C.alt, B by A.alt, C by D.alt, D by B.alt)</p>
    <p>The randomness does not come from the glyph order in the classes. The glyphs in each respective class are enumerated to match the position of the substitute glyph in the other class. In the vtl and vtg files:</p>
    <p>DEF_GROUP “Group1a”<br>
     ENUM GLYPH “A” GLYPH “B” END_ENUM<br>
    END_GROUP<br>
    END</p>
    <p>—</p>
    <p>DEF_GROUP “Group1b”<br>
     ENUM GLYPH “A.alt” GLYPH “B.alt” END_ENUM<br>
    END_GROUP<br>
    END</p>
    <p>—</p>
    <p>DEF_LOOKUP “Calt01” PROCESS_BASE SKIP_MARKS DIRECTION RTL  [#this is an arabic script font]<br>
    IN_CONTEXT<br>
     RIGHT GROUP “Group99”<br>
    END_CONTEXT<br>
    AS_SUBSTITUTION<br>
    SUB GROUP “Group1a”<br>
    WITH GROUP “Group1b”<br>
    END_SUB<br>
    END_SUBSTITUTION<br>
    END</p>
    <p>——-</p>
    <p>The random substitution happens for a given lookup even when I delete all the other substitution lookups to make sure there is no unforeseen “interference” or problem of substitution order/sequence.</p>
    <p>Clearly if this is not working I must be doing something wrong, but I’ve checked again and again, notably by comparing with “Arabtype.volt.ttf”, and I can’t find where I’m erring.</p>
    <p>An inelegant way around this would be of course to explicitely enumerate each ’glyph to glyph’ substitution individually (and it does work that way for the few lookups I’ve converted) but using groups *should* work and there are lookups which contain 30+ glyphs to substitute in the context of 6+ glyphs so I would not want to have to enumerate each combination individually.</p>
    <p>Any help would be much appreciated! Thanks,<br>
    Patrick</p>
