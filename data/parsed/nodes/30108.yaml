    html: "<p>Maybe it is a Mactel issue, since on my PC, that's really all there is to it. But when I use baseline grids on Macs, both text and shapes snap to them, and I think that hiding it does the trick. Two suggestions: Does changing the spacing of the baseline grid in ID's preferences change where your vector shapes snap? Do you by any chance have grids or guides on any non-visible layers, hidden behind other objects, or with no or transparent strokes?</p>"
