  html: <p>I'm running Indesign CS2 on a Mac, and I'm having problems with vector shapes snapping to the baseline grid when I move or resize them. It happens intermittently, and I can't find a setting that allows me to turn this on or off. Page grid snapping is disabled, and the baselines in question are often nowhere near my guides, so I'm sure that's what it's snapping to. Does anyone know how to turn this off?</p>
  html_clean: <p>I'm running Indesign CS2 on a Mac, and I'm having problems with vector shapes snapping to the baseline grid when I move or resize them. It happens intermittently, and I can't find a setting that allows me to turn this on or off. Page grid snapping is disabled, and the baselines in question are often nowhere near my guides, so I'm sure that's what it's snapping to. Does anyone know how to turn this off?</p>
