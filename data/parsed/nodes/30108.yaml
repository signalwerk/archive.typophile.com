    html: |-
      <p>Hiding it doesn't make it stop snapping to it. Oddly it only seems to start happening after I've configured the baseline grid and started aligning text to it. But I just can't see how or why it would try to align vector shapes to it... </p>
      <p>Come to think of it, I never ran into this problem on my G4 Powerbook. Maybe it just a Mactel issue, sort of like when all my 10-point type suddenly resets itself to 8.97893523...</p>
