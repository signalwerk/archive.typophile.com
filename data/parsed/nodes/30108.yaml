    html: <p>On my Windows version of ID CS2, going to View&gt;Grids and Guides and toggling "Show Baseline Grid" to "Hide" does the trick, although, of course, you can no longer see the baseline grid. But there's a quick keyboard shortcut (My guess is that it's Cmd-Option-' on Mac).</p>
