    <p>Dear All, <br> <br>I hope you can help and I hope this is the right forum.  Just installed the Linotype Essentials 1 and 2 sets of fonts on my new Mac (OSX 10.38, Quark 5.01 and 6, Suitcase X1, ATM Lite) and I have a problem. <br> <br>In both versions of Quark some of the fonts both display and print with the bottom of descenders sort of chopped off (examples would be Avenir, Caecilia and Ergo among others).  It also happens in Word. <br> <br>In Quark 6, adjusting the baseline shift upwards slightly seems to correct (a pain but it works).  In Quark 5, which I need to use as some of my clients still use 4, it makes no odds. <br> <br>Scratching my head here and hoping someone can come to my rescue.  Just moved from OS8 and Quark 4 so still finding my way round all this new software, but thhis ones bugging me bigtime as I have a deadline (isn't it always the way) <br> <br>Thanks in advance <br> <br>Paula <br></p>
