  - id: 530344
    user: 57325
    date: 2012-11-14T16:44:00
    date_raw: 14 Nov 2012 — 4:44pm
    votes: null
    html: <p>Probably not Photoshop, but yes, they apparently used some software to either modify Futura or rather create the letters for the logo from scratch. It seems unlikely that there is an entire typeface; it’s just these eight letters, I think. At least to me, the result looks amateurish and contrived. As I said, you might like Futura although I admit that it does not have this type of ‘N’, not to mention the quite unusual (and hard to read) ‘R’. And I’m quite sensitive when it comes to this letter.</p>
