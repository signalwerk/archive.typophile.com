  - id: 530392
    user: 22675
    date: 2012-11-15T05:08:00
    date_raw: 15 Nov 2012 — 5:08am
    votes: null
    html: '<p>Agree with R. Looks like a manipulated <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/futura-book/" rel="nofollow">Futura Demi</a> (Demi and Paratype version to get a very close /S, /U, /O and /N with flat connections). The rest could have been redrawn: /B from /P with an additional bottom bowl (in Futura, /B top bowl is not identical to /P one), /R obviously with /P with a vertical stroke as leg, /N customized (moving vertical stroke left and removing the resulting external oblique stroke), /M and /A redrawn (or may be simply horizontally compressed?). Everything could be done using vector software like Illustrator or CorelDraw (type text, vectorize and simply edit moving strokes or points).</p>'
    html_clean: '<p>Agree with R. Looks like a manipulated <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/paratype/futura-book/" rel="nofollow">Futura Demi</a> (Demi and Paratype version to get a very close /S, /U, /O and /N with flat connections). The rest could have been redrawn: /B from /P with an additional bottom bowl (in Futura, /B top bowl is not identical to /P one), /R obviously with /P with a vertical stroke as leg, /N customized (moving vertical stroke left and removing the resulting external oblique stroke), /M and /A redrawn (or may be simply horizontally compressed?). Everything could be done using vector software like Illustrator or CorelDraw (type text, vectorize and simply edit moving strokes or points).</p>'
