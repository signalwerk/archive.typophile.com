  html: |-
    <p>In this case the cause is not as big or important as <a class="freelinking external" href="http://www.typesociety.org/fontaid.html" rel="nofollow">Fontaid</a>, but rather a perk for helping out a <a class="freelinking external" href="http://www.wnybookarts.org/" rel="nofollow">non-profit book arts center</a> that I have spent the last 18 months working to build into a world-class facility for letterpress printing. The digital font is free if you become a member (memberships start at $25 for student rate) This is the only way to get a license for the font. I hope you will consider <a class="freelinking external" href="http://www.wnybookarts.org/joinus.php" rel="nofollow">becoming a member</a> (plus you get additional swag... and letterpress print shop access if you happen to be in the Western New York Area. </p>
    <p>The font in question is called <a class="freelinking external" href="http://www.wnybookarts.org/winchell.php" rel="nofollow">Winchell and the story of the font is here</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Winchellimage_3643.jpg"></div><p></p>
    <p>We have hundreds of metal fonts, dozens of Woodtype fonts and over 100 Ludlow faces at the WNY Book Arts Center plus a library of type specimens and reference books.</p>
    <p>Thanks for listening.</p>
