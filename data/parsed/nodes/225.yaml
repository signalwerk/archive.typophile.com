    html: <p>After some mixed experiences with FontReserve on OS X,  <br>I've been doing without any sort of add-on font utility for <br>the last six months. <br> <br>Basically, what I do is keep all of my fonts in a large  <br>organized collection, with each family in its own folder.  <br>When I want to use a font, I just drag-copy its folder into  <br>my user Fonts folder. (In OS X, you can keep fonts in  <br>folders within the Fonts folder.) Most apps will update their  <br>font menus automatically. For those that don't, just quit  <br>the app and start it up again. When I'm done using a font, I <br>just put it in the Trash (I still have the original with the rest  <br>of my collection).  <br> <br>If you rely on auto-activation or use Classic a lot, this may  <br>not be for you, but it has a kind of elegant simplicity that  <br>appeals to me.</p>
