    date_raw: 18 Jun 2003 — 5:51am
    votes: null
    html: <p>Well, after using the trial of FontAgent Pro 1.2 for nearly 30 days, I'm back to FontReserve. I think FontAgent has serious potential, but FontReserve is just more transparent to the user, facilitates easier exporting and importing of fonts, and is much faster. Exporting fonts in FontAgent Pro and shutting the program down was very slow. FontReserve is extremely quick. Also, the character map in FontReserve is very helpful. Some features in FontAgent are quite nice, such as the Font Player, font diagnostics, and its generally prettier, more OSX-like interface. But Reserve just seems better still.</p>
