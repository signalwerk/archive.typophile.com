  - id: 1224
    user: 1898
    date: 2003-06-01T06:38:00
    date_raw: 1 Jun 2003 — 6:38am
    votes: null
    html: "<p>I've just disabled FontReserve, and downloaded and installed a Trial version of FontAgent Pro. It's pretty slick, but there are a couple of drawbacks I see so far. First, it's slows up launching and shutting down, since it has to do some database management thing that FontReserve never did. Second, libraries and sets are a little confusing, but I think once you get used to the difference, it's probably a powerful feature. Third: you have to keep the program running, apparently, all the time; FontReserve is \"transparent.\" Fourth: when a font is auto-activated in FontReserve, you can tell it's active because it has \"active status\" in the program window; with FontAgent, an auto-activated font does not show up as active, which is kind of weird. Fifth, the auto-activation in Photoshop is, by the company's admission, buggy, but they claim it will be better with Photoshop 8 (!). I should send this list of concerns to them. Positives: intuitive, cocoa platform and interface; font player is excellent; wysiwyg menus are very helpful; customizable specimen sheet was something I always wanted in FontReserve but never got (you can customize type color and background color as well!); a tiny download; easy to set up and use.</p>"
    html_clean: "<p>I've just disabled FontReserve, and downloaded and installed a Trial version of FontAgent Pro. It's pretty slick, but there are a couple of drawbacks I see so far. First, it's slows up launching and shutting down, since it has to do some database management thing that FontReserve never did. Second, libraries and sets are a little confusing, but I think once you get used to the difference, it's probably a powerful feature. Third: you have to keep the program running, apparently, all the time; FontReserve is \"transparent.\" Fourth: when a font is auto-activated in FontReserve, you can tell it's active because it has \"active status\" in the program window; with FontAgent, an auto-activated font does not show up as active, which is kind of weird. Fifth, the auto-activation in Photoshop is, by the company's admission, buggy, but they claim it will be better with Photoshop 8 (!). I should send this list of concerns to them. Positives: intuitive, cocoa platform and interface; font player is excellent; wysiwyg menus are very helpful; customizable specimen sheet was something I always wanted in FontReserve but never got (you can customize type color and background color as well!); a tiny download; easy to set up and use.</p>"
