    html: <p>I've been an advocate of FontReserve since the early days. But, the program is buggier in X, and is showing signs of age with respect to its interface. I might give FontAgent a whirl. Seems like it has what I liked in FR, but in a better package. On a semi-related note, I've always wondered why something like font management, which seems fairly close to the OS level, shouldn't be included with the OS. I appreciate competition with regard to software, but part of me thinks Apple could do a dandy job if it would include some sort of font management utility built into the OS. </p>
