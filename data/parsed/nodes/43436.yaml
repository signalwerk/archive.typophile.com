    html: "<p>I think it fits into a pattern: When he wants to solve a problem, he meets up with a real expert. Other politicians, faced with anything from the threat of a comet about to strike the Earth to choosing a campaign logo, would form a committee of career political staffers to hash out ideas with what little understanding they have of the subject, perhaps drawing some guidance from public opinion polls. Obama has often demonstrated that he would see that the best solutions can only come from, in the former case, an actual astrophysicist, or in the latter case, an actual graphic designer, and go talk to the best one he can find.</p>"
