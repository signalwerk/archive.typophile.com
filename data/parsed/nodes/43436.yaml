      <p>or maybe the place in which a lot of this takes place. I have seen more Digg user icons and facebook group joins than all the obama anything in the real world. Maybe that’s just cause I spend too much time on the machine, but it seems like campaigning is lending itself more and more towards the internet, which is dominated by design rather than physicality. In the real world having a sign versus having no sign seems to make the difference. On the web the competition for space isn’t as wide a gap, so looking better seems to be more important.</p>
      <p>I also see calendars (albeit set in futura bold condensed) <a class="freelinking-external" href="http://www.iclips.net/deadheadsforobama.php">signage</a>, etc. etc. which is campaign design taken into the hands of supporters, which bugs me greatly.</p>
      <p>sorry. as for the actual fonts I don’t think there’s a whole lot that hasn’t been covered.</p>
