    <p>G’day guys,</p>
    <p>I feel my internet world has shrunk to a very few websites which I check really painfully often so, at the risk of finding more ways to waste my time at work, I’d like to hear your suggestions for more good design blogs. In the past, I have spent a lot of time on <a href="http://www.designiskinky.com"> designiskinky </a> and that’s good, and also the fwis <a href="http://covers.fwis.com/"> book-cover design blog </a> is great, but I want to widen the net, I’m feeling a bit creatively dry and I’m thinking there must be heaps more stuff out there.<br>
    thanks</p>
    <p>—N</p>
