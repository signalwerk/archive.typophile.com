  html: <p> Right, I recently started with Flash, so my knowledge of it leaves much to be desired. <br> <br>because regular anti-aliased fonts don't give the right feel to the design, I turned my head towards pixelfonts, but also those I found far from being my choice.  <br> <br>The only solution that I found satisfying was using html text Verdana. <br> <br>[insert laughter and possible insults] <br> <br>right, is there a pixelfont which comes incredibly close to the html/anti aliased version of Verdana at font size="2" ? <br> <br>Thanks for your patience <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> </p>
