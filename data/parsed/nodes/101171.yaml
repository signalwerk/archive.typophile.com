    <p>Hello everyone,</p>
    <p>I'm a final year Graphic Design Student working on a Final Major project. I'm redesigning a book most of you will know; G u l l i v e r ' s    T r a v e l s .  I'm choosing a typeface/font, and wanted some advice as to what would be best..</p>
    <p>The story is based in the 1800s, the book reads in the first person. Gulliver is educated, has a passion for voyage and shows no Emotion - A suitable typeface, in my opinion, would be a Sans Serif, possibly found in Geography text books?<br>
    Another option could be - Serif typeface found in Dictionaries from the 1800s?<br>
    Another - A readable, monotone, Serif typeface from that period?</p>
    <p>Any suggestions welcome..</p>
    <p>Thanks for reading!</p>
