      <p>Have you read the book? I think you will find that it is set in the 1700s, not the 1800s. It was published in 1726 (revised 1735). </p>
      <p>Here's the <a href="http://www.computerhistory.org/atchm//wp-content/uploads/2012/11/JSW003_31.jpg" rel="nofollow">titlepage of the first edition</a>, predictably set in Caslon's types (with perhaps engraved letters used for the largest sizes on the page). If you wanted to move away from that obvious model, into perhaps something that captures the mid-1700s rationalist culture that Swift satirises in the book, consider <a href="http://www.swisstypefaces.com/fonts/new-fournier-bp/" rel="nofollow">New Fournier BP</a>.</p>
      <p>BTW, your Random Capitalisation is very 18th Century.</p>
