  html: <p>hi. Am new to this forum, so perhaps am posting my questions in the wrong place. <br> <br>I'm looking for highway road signs, specifically "fallling rock" graphics  or "falling ice". The old falling rock in Colorado seems to be replaced by just words. I found one at Mesa Verde, but its not what I'm looking for. <br> <br>I glimpsed a great one in a friends slide from New Zealand.</p>
