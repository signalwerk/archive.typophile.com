    <p>The people in charge like this design, but want it to look less 1970s. Of course, I was only alive for 1979, so I don’t really know what to change to get away from that 1970s feel, unless its just a color thing. </p>
    <p>And don’t nick me for the stolen sheep dancing across the top; that was <em>not</em> my idea.</p><div class="imageWrap"><img src="http://typophile.com/files/BuildingCodes_Cover_6539.png"></div><p></p>
