      <p>It does seem to be those bars that's giving it a bit of the 70s look. Remember those stripes they used to have in racing cars? </p>
      <p>I think it's a good suggestion to be less rigid with the type, does it really have to be all caps?</p>
      <p>Beyond that, I wonder if the design really connects with the content of the book. I'm not sure what the particular constraints of the project are, but it looks a little generic from here. Some sort of content cues may help.</p>
      <p>It could be an idea to break the page into two background bands of white and orange to give it a greater sense of structure.</p>
