    html: |-
      <p>My question would be, why red and orange anyway? Whether or not that's a "70's" look, it's a pretty harsh combo, and reminds me for of fast food than anything.</p>
      <p>I'd think Greens and Blues would be a better palette to work from, especially since the content (assuming) is more of a guide to the less than exciting world of building to code and the use of permits...</p>
      <p>Always thought the organized cutting mat grid was a nice touch for topics that require a more linear approach of thinking (which is usually a foreign thing for creative types.)</p>
      <p>And I like Jelmar's suggestion, it does seem like the text is floating in a sea of orange...</p>
