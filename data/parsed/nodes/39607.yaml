      <p>What about less restraint on the typesize? I think you could get away with enlarging those bars with the type in it quite a bit. That way the type, instead of the orange background, takes the leading role.</p>
      <p>The 1970's feel is probably because of the colors. To me it doesn't really feel 1970's, but I wouldn't really know either because I'm from after 1980. But brown and orange was their thing, right? ;)</p>
