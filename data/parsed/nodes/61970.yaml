      <p>I think the problem is that globally, the big H has had a resurgence of passion.  It’s become iconic.  Just look at Veer’s Merch; it’s full of it.  Globally, the big H has just been played out in terms of topic and over played in it’s “Pride” (my humble opinion).  I was highly suggest you find an emerging typeface.  I think even the resurgence of Black Letter would be more rewarding.</p>
