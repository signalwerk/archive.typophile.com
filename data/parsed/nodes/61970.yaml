      <p><em>“Isn’t Helvetica’s (or, Helvetica &amp; Arial’s) accessibility in electronic media one of the reasons for it’s continued dominance in the world?”</em></p>
      <p>Yes. Helvetica, Arial, and Verdana are all on par with accessibility. Matthew Carter even worked on some Helvetica fonts. But since Verdana was originally designed specifically for small sizes on screen it seems to be a better choice for electronic media.</p>
      <p>It makes me wonder if there would have been an “ikeagate” if they had made the decision to use Verdana for screen and Helvetica for print/display/signs.</p>
