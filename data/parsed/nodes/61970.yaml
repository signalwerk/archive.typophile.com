    html: <p>I don’t know if the subject itself is by definition bad, but if you do go for such a much-covered one, you’ll have to (1) know what has been said and written about this before – so read existing stuff, then (2) find your own niche/perspective/question/angle of research which is novel/special, and (3) do a lot of brainwork yourself. Then maybe you’ll arrive at new insights. Otherwise, chances are it’s really just going to make you look… unimaginative.</p>
