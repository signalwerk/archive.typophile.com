    html: |-
      <p>Dan, a sweeping generalization based on one man's anecdotal reference is not good history.</p>
      <p>Both Univers and Helvetica were readily available from North American type houses from the 1960s on, and type set in either was the same price per character.</p>
      <p>There were some differences. For instance, referring to the metal specimen of Fleet Typographers, a shop in Toronto still active in the 1980s (I used them occasionally), one notes:</p>
      <ul>
      <li>Linotype: Helvetica Light, Medium and Bold with italics; Univers Light, Medium, Bold and Extra Bold with italics.</li>
      <li>Ludlow: neither (Tempo, a Futura clone, is the sans)</li>
      <li>Foundry: Helvetica Light, Medium and Bold; no Univers</li>
      <li>Monotype: Univers Medium and Bold with italics, Bold Condensed, Extra Bold; no Helvetica. </li>
      </ul>
    html_clean: |-
