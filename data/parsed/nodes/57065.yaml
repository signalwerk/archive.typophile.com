      <p>&gt; Helvetica is one of the widely used in design today. Why?</p>
      <p>It got selected as the default face in the original PostScript printers as the sans face. Just as Times Roman was the default serif face. Without that, it would be no where as popular (or overused, if that is your view).</p>
