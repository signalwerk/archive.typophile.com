      <p>@James<br><a href="/node/57619" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mike Parker</a> said it a bunch of times at Typecon. He said that he, as the dude at Linotype here in America, had to choose between Helvetica and Univers for import into America for general use. He said that Univers was probably better, and had a wider range of characters, but that it was much more expensive to license than Helvetica.</p>
      <p>And thus, America got Helvetica, while Europe got Univers.</p>
    html_clean: |-
