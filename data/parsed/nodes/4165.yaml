    votes: null
    html: <p>Signs like this are made with sign-making systems such as the Leroy Lettering System. The "fonts" are templates which are traced with a pantograph and an engraving or routing tool. The lettering styles made for such systems are similar to existing typefaces, but not the same. It's a kind of parallel universe to the world of typography.</p>
