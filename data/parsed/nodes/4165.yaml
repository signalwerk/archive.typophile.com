    html: <p>I don't think the text is Arial, the tail on the R is wrong, as is the E. More like Trade or News Gothic, although the S is wrong for both those fonts. <br> <br>The people who make this sort of sign don't necessarily use the same digitized fonts that are readily available for the computer.</p>
