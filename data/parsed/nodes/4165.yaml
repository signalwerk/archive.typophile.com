    votes: null
    html: <p>Trade Gothic or News Gothic have a very different "skeleton" so I  <br>guess that rules them out. This is a clear Helvetica-model grotesk. <br> <br>The other possibility I had in mind (if the leg on the "R" proves to  <br>be straight and the "G" has a spur) is <a href="http://www.philsfonts.com/detail.html?sku=AB89001001P1" target="_blank"> Berthold Akzidenz-Grotesk</a>  <br>or a similar face, but the middle bar on the "E" is too short and  <br>the "S" is closed more in the sample</p>
