    html: <p>Thet text face looks like plain ole <a href="http://www.myfonts.com/fonts/agfa/arial/mt-light/testdrive.html?s=MARSHY%20AND%20DANGEROUS&amp;p=36" target="_blank"> Arial</a> (can't really make out  <br>the tail on the "R" nor the spur on the "G") while "Pendol Pond"  <br>is quite similar to <a href="http://www.myfonts.com/fonts/bitstream/engravers-gothic/engravers-gothic/testdrive.html?s=PENDOL%20POND&amp;p=60" target="_blank"> Engravers Gothic</a>/<a href="http://www.myfonts.com/fonts/agfa/sackers-gothic/light/testdrive.html?s=PENDOL%20POND&amp;p=48" target="_blank"> Sackers Gothic</a>.</p>
    html_clean: <p>Thet text face looks like plain ole <a href="http://www.myfonts.com/fonts/agfa/arial/mt-light/testdrive.html?s=MARSHY%20AND%20DANGEROUS&amp;p=36" target="_blank"> Arial</a> (can't really make out  <br>the tail on the "R" nor the spur on the "G") while "Pendol Pond"  <br>is quite similar to <a href="http://www.myfonts.com/fonts/bitstream/engravers-gothic/engravers-gothic/testdrive.html?s=PENDOL%20POND&amp;p=60" target="_blank"> Engravers Gothic</a>/<a href="http://www.myfonts.com/fonts/agfa/sackers-gothic/light/testdrive.html?s=PENDOL%20POND&amp;p=48" target="_blank"> Sackers Gothic</a>.</p>
