  html: |-
    <p>LOL! I was just doing some post-Christmas-present book reading when I saw this passage in Patricia Cornwell's latest book <em>The Scarpetta Factor</em>:</p>
    <p>"...you should pay attention to fonts, like I've told you how many times? Fonts are part of the twenty-first-century documents examination, and you ignore them at your own peril. What they are and why someone might pick them for a specific communication can be telling and significant."</p>
    <p>Maybe I can get a job with CSI as a font forensic examiner :)</p>
