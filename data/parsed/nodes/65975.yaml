      <p>Geez... I'd rather be on the Font Police Squad busting type crimes on the spot than post mortem examination.</p>
      <p>Though I find "font forensics" during pre-digital era more viable and intriguing since setting type was less accessible to the masses and sources more identifiable. </p>
      <p>The font in question in <em>The Scarpetta Factor</em> was Gotham -- just think of how many knock-offs and pirated copies are out now since the Obama presidential campaign.</p>
