      <p>This style is sometimes known as an Antique. Closely related to early Clarendons (narrower, not like the ones we think of today).</p>
      <p>You can probably get close in look and feel with a more historic version of Clarendon, like the old <a href="http://www.fonts.com/findfonts/detail.htm?productid=172327" rel="nofollow">Monotype Clarendon</a>:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ClarendonMT_4000.png"></div><p></p>
