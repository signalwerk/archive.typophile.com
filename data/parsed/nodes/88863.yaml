    <p>Hi everyone -</p>
    <p>I'm looking for digital match of this face from a 1909 French tabloid:</p>
    <p><img src="http://i40.tinypic.com/fdu9aq.jpg"><br>
    (more of it and illustrated niceness here: <a class="freelinking external" href="http://gallica.bnf.fr/ark:/12148/cb328281130/date1909.langEN" rel="nofollow">http://gallica.bnf.fr/ark:/12148/cb328281130/date1909.langEN</a>)</p>
    <p>Bitstream's Century 725 comes close, maybe something like a narrower Monotype Ionic?<br>
    My main concerns are the word fit and overall color, I'd like to make a facsimile of these captions.</p>
    <p>Any help would be much appreciated!</p>
