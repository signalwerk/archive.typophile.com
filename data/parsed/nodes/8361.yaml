    html: <p>Thanks to all for the feedback thusfar.  The business purpose is the marketing and sale of real estate investment property in Idaho.  We cater to a wide range of investors.  From the lower end individual that is looking for a smaller single family rental property to the large, possibly multi-party investor looking to invest 10 million in a development project.  The logo needs to cater to both parties and everyone in between.   <br> <br>I agree with the potential for confusion given the lack of clarity with regards to type of investment.  Are we an investment brokerage i.e. stocks or we do real estate or what?  However, I'm reluctant to throw a house or some such in the logo as 1) We're not just talking about houses and 2) Real Estate logo with a house = very common. <br> <br>I'm at a loss on how to move forward.</p>
    html_clean: <p>Thanks to all for the feedback thusfar.  The business purpose is the marketing and sale of real estate investment property in Idaho.  We cater to a wide range of investors.  From the lower end individual that is looking for a smaller single family rental property to the large, possibly multi-party investor looking to invest 10 million in a development project.  The logo needs to cater to both parties and everyone in between.   <br> <br>I agree with the potential for confusion given the lack of clarity with regards to type of investment.  Are we an investment brokerage i.e. stocks or we do real estate or what?  However, I'm reluctant to throw a house or some such in the logo as 1) We're not just talking about houses and 2) Real Estate logo with a house = very common. <br> <br>I'm at a loss on how to move forward.</p>
