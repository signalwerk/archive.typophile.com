    <p>hi.</p>
    <p>I am looking for a sans serif typeface that has real italics, and a "feeling" similar to Din or Gotham. Basically something that is very readable and allows enough richness in a page that combines regular and italics. It needs not to have a strong presence of itself due to subject. For book on Aids.</p>
    <p>Recomendations are most welcome.<br>
    Thank you,</p>
    <p>G.</p>
