    html: |-
      <p>Nick. Figgins does not fall short at all. It actually exceeds my needs. A beautiful font, but for this particular project, i think the italic feels too texturized, rhythmic. What turns me out of it it is that it feels to masculine for this project, on the regular style, and too playful on the italic characters. I think i need something more contained, specially to fit the taste of my two clients and subject.<br>
      All this comment are made with my deepest respect. Hope you find the too.</p>
      <p>I am in the tries in between Gotham and Whitney. I am not thrilled by Gotham's italics for this job, preferring Whitney's.</p>
