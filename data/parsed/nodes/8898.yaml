  - id: 58331
    user: 5157
    date: 2005-01-28T01:30:00
    date_raw: 28 Jan 2005 — 1:30am
    votes: null
    html: "<p>Thank you all for your coments and encouragement. <br> <br>\"if this is the Answer, what is the Question?\" hmm...  As this is my first font (but not my first attempt) it was a massive learning experience.  The Question was something along the lines of 'how hard can it be?'.  I've lost my innocence now.   <br> <br>But my intentions for the font was to create something I would want to use.  I'm an artist first, and I mostly use printed type to describe mine or others art.  Catalogues, postcards that sort of thing.  So short texts, information, presented in a smart and contemporary environment. <br> <br>'that g': my thinking was sometihng like this - traditional g; elegant but inefficient use of space (cramped) - modern* g; inelegant but efficient.  So i came up with a sort of hybrid of the two.  I think it works for now, non-type-interested people i've shown examples to haven't noticed it until i pointed it out.(* i don't know if 'modern' is acurate historically). <br> <br>The lowercase j and t. This typeface thinks the hooks traditionally put on these letters are calligraphic and inefficient and are therefore to be spurned.  Plus i've been enjoying Futura.  I know this has readability issues, and if my arm was twisted i would make a hooked t. <br> <br>As for the quirkiness of it.  Tiffanys coment about quirking other letters made me think.  The phrase 'stopped short feeling' had quite a lot of resonance.  I guess it comes from the influence of sans-serifs faces and my inner modernist.  <br>It seemed that these letters could be quirked: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/64106.gif\" alt=\"\"> <br>(original in grey) <br> <br>I dont' think the k works, but i like the m, and arn't sure about the w.  I don't want to make it into a semi-serif. So maybe I should go further back on some letters.  But I want it to be a serious typeface. With useful quirks. The lack of a final serif on the new m reduces the width of a wide letter. <br> <br>I've adjusted the 'sad a' and b as suggested by Juan Pablo.  Totally redrawring the bowl of the a and making the top of the bowl of the b 2 degrees steeper. I think it is an improvement. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/64107.gif\" alt=\"\"> <br> <br>Titus, yes that corner of the Z is a bit arbitary,  it'll probably go.  about the X do you mean the junction is too low on the glyph, or do you think the heavyness is to do with the stroke contrast?  i see what you mean about the elephantishness of the @ :-) I was wanting to make it as small as possible, the large @ symbols allways seem to be out of place written in lowercase email adresses, and often too light.  I'll probably re-work it. <br> <br>Again thanks for your critiques - keep it coming. <br> <br>Ed</p>"
    html_clean: "<p>Thank you all for your coments and encouragement. <br> <br>\"if this is the Answer, what is the Question?\" hmm...  As this is my first font (but not my first attempt) it was a massive learning experience.  The Question was something along the lines of 'how hard can it be?'.  I've lost my innocence now.   <br> <br>But my intentions for the font was to create something I would want to use.  I'm an artist first, and I mostly use printed type to describe mine or others art.  Catalogues, postcards that sort of thing.  So short texts, information, presented in a smart and contemporary environment. <br> <br>'that g': my thinking was sometihng like this - traditional g; elegant but inefficient use of space (cramped) - modern* g; inelegant but efficient.  So i came up with a sort of hybrid of the two.  I think it works for now, non-type-interested people i've shown examples to haven't noticed it until i pointed it out.(* i don't know if 'modern' is acurate historically). <br> <br>The lowercase j and t. This typeface thinks the hooks traditionally put on these letters are calligraphic and inefficient and are therefore to be spurned.  Plus i've been enjoying Futura.  I know this has readability issues, and if my arm was twisted i would make a hooked t. <br> <br>As for the quirkiness of it.  Tiffanys coment about quirking other letters made me think.  The phrase 'stopped short feeling' had quite a lot of resonance.  I guess it comes from the influence of sans-serifs faces and my inner modernist.  <br>It seemed that these letters could be quirked: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/64106.gif\" alt=\"\"> <br>(original in grey) <br> <br>I dont' think the k works, but i like the m, and arn't sure about the w.  I don't want to make it into a semi-serif. So maybe I should go further back on some letters.  But I want it to be a serious typeface. With useful quirks. The lack of a final serif on the new m reduces the width of a wide letter. <br> <br>I've adjusted the 'sad a' and b as suggested by Juan Pablo.  Totally redrawring the bowl of the a and making the top of the bowl of the b 2 degrees steeper. I think it is an improvement. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/64107.gif\" alt=\"\"> <br> <br>Titus, yes that corner of the Z is a bit arbitary,  it'll probably go.  about the X do you mean the junction is too low on the glyph, or do you think the heavyness is to do with the stroke contrast?  i see what you mean about the elephantishness of the @ :-) I was wanting to make it as small as possible, the large @ symbols allways seem to be out of place written in lowercase email adresses, and often too light.  I'll probably re-work it. <br> <br>Again thanks for your critiques - keep it coming. <br> <br>Ed</p>"
