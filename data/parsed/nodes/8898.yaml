    html: <p>This is fun. I don't see it as a something that should be set in long books, but certainly in poetry or special editions of prose. This would be fun as something used in letterpress shops. <br> <br>I also like the -g- but I wonder if a few of the other glyphs could sway a little further towards the same level of quirkiness? The -j- has that too, and the -f- is working towards it. I see the -y- and -t- also have some of that stopped short feeling. However, the uppercase should probably maintain more solemnity. What other characters can you quirk?</p>
