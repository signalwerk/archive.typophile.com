    html: <p>So, if this is the Answer, what is the Question? (In other words, what's your intention for the typeface?) It can be helpful to start your design with a brief, like "This should be a text face in the style of Garamond, condensed approximately 5%, available for use with Monotype, Linotype, and hand setting." (That's a paraphrase of the brief for Sabon.) <br> <br>If you want to use this for ad work/short text/headings, it has promise, and with a bit of polish, it would find a niche.  <br> <br>If you want to use this for book work/long text, there's much more work ahead. In addition to the items Juan Pablo mentioned, the cap J also is likely to stand out. Remember that text faces tend to be conservative, and characters that "pop out" at the reader are not likely to lead to the typeface being used. <br> <br>Keep us posted on the progress!</p>
