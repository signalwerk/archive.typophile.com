    html: "<p>i quite like your approach and the ideas you've got -- but i think it isn't commited enough. go for \"quirkie\" or for text, in each case you'd have to be more radical. <br> <br>some things that came to my eye: <br>the top right extension of the Z looks a bit arbitrary to me. <br>the X is very top heavy. <br>the connection of bowl and stem of the b could perhaps be a bit lighter.   <br> <br>and without the intention of being offensive: the @ looks somehow elephantish!</p>"
