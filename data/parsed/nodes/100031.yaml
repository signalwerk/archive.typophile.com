    html: |-
      <p>As far as I know, no.</p>
      <p>Here's a trick I don't use, but does work resonably well. Find a font that looks similar, but is spaced and kerned much better.</p>
      <p>Copy the left and right sidebearing values into your font. Not the widths, the sidebearings. With Fontographer, I believe you'll have to do this by hand, but it won't take as long as you think.</p>
      <p>Now import the kerning from that parent font.</p>
      <p>If you don't have much experience, you'll be a lot closer than if you just start from scratch.</p>
      <p>As for manually refining the kerning, use a long string of characters. I put something like</p>
      <p> the pae<strong>aa</strong>eiling evehnory</p>
      <p>in the metrics window. Get the fit of the characters other than the pair show in bold at least reasonable. The pair I've shown in bold are the pair I'm kerning. (You don't use bold, of course.) So, to work on "a", keep advancing the second (shown in bold) character from "a" to "z", changing the kerning as needed. Now change the first shown-in-bold to "b" and repeat the process.</p>
      <p>As you go, you may see an opportunity to cut down of the number of kern pairs by changing a sidebearing value. If you do, you'll have to rekern that character...</p>
      <p>You'll also want to include punctuation with each alpha character, and punctuation with itself (period+quotedblright, for example).</p>
      <p>Spend time on the numbers -- pretend you're setting three digit page numbers, or four digit dates. Have a couple short words with the wordspace in the metrics window along with the numerals. </p>
      <p>It sounds daunting, but I can kern all the alphas, upper &amp; lower case, the punctuation, and the numbers in about 6-8 hours. Not a short period of time, but not two weeks, either.</p>
      <p>Generate your font, set a page or two of text at a size that will be typical of the size used, and print that out. Fix anything obviously wrong.</p>
      <p>That should be a pretty good start.</p>
