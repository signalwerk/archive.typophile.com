    html: |-
      <p>So as noted above, "no", there's no way to force optical kerning as the default.<br>
      At first I thought you wanted to modify the kerning in the font, which would be easy enough to do with a python script in Robofont or Glyphs or Fontlab. </p>
      <p>But if the kerning is bad or non existent, you need to fix it manually. </p>
      <p>I would suggest that you sub it out to someone to do the kerning for you. There are many folks here who could do it quite quickly, and it'd be worth your while, i think. Although truth be told, I'm not one of them. ;)</p>
      <p>Jason C</p>
