      <p>have more wine, Hiro. I admit I've never been particularly fascinated by Bauhaus in general but now that I have to prepare this little talk I find myself reading books on bauhaus history like a thriller, there's everything: politics, international intrigue, back-stabbing and I've also rediscovered Moholy-Nagy, I guess one of the most interesting characters in the Bauhaus. There's a brilliant article in the Guardian (2006 I think) where the author tells how he was snobbed in England <cite>London Transport's design impresario Frank Pick expressed a widely held artistic xenophobia in dismissing Moholy-Nagy as "a gentleman with a modernistic tendency who produces pastiches of photographs of a surrealistic type, and I am not at all clear why we should fall for this. It is international, or at least continental. Let us leave the continent to pursue their own tricks"</cite> and how they regret it now.<br>
      Anyway, mine is going to be a panoramic of Bauhaus graphic production, the Bauhaus Books, portfolios etc.<br>
      By the way, Ralf your photos are awesome but I have a question if you're there, the photo of a publication called Utopia- Dokumente der Wirklichkeit you posted [by Oskar Schlemmer], what is that about exactly?  Thanks.</p>
