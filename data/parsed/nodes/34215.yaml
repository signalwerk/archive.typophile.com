      <p><em>And feel free to discuss and post anecdotes, ideas etc. on the subject here!<br>
      Thank you. thank you, thank you.</em></p>
      <p>Around about the time cubism began playing itself out on the canvases of Picasso, Duchamp, Leger, Braque, et. al, came a new understanding throughout the art community which I believe was brought on by 'the machine'. Painting began to be identified with its two-dimensional support. No longer was it the external world, but the internal logic of the painting which began to dictate form. Surface organization gained over all representational depth. The compositional systems of academic painting were being deconstructed and then reconstructed as - Frontality.</p>
      <p>Also, traditionaly speaking, form and space were talked about in terms of mass and volume, conventional techniques whether it be architecture, sculpture, painting, graphics or type etc., where forms which occupied a certain volume and suggested a certain weight. Form and space were talked about in terms of opposites, or as positive and negative. Space was only implied and measured by its displacement. Some works which seemed "lighter" than others indicated that mass was still the standard of referenece and space remained peripheral.</p>
      <p>Inspired by the constructivists (and and to a certain extent the ideas of futurism), Bauhaus made space the essential basis of their art, whether it be in architecture, sculpture, painting, graphics, or type, etc.,, Bauhaus considered works produced by conventional methods, no matter how stylized, to be naturalistic, static, and subjective, because it reflected personal feeling. Bauhaus is the influence of modern physics and geometry and the machine, and not the visualization of science.</p>
      <p>But just prior to Bauhaus, guys like Mondrian and Matisse were to have an enormous influence on Herr Gropius, Itten and Le Corbu too for that matter. Colour and texture were now elements of specific information, indications that 'spoke' for themselves. Colour acquired its independence and autonomized line. The artist now drew on the coloured areas, the line - graffti - freed from the constraints of the effect of reality, developed according to its autonomous rhythm.</p>
      <p>This is when Bayer, Moholy-Nagy, Klee, amoungst many others, really came into their own. Bayer's painting 'Alphabet' of 1927 comes to mind - but then so too does the whole of Itten's method of teaching - the teaching of opposites. Other examples - Picasso's 'Man in the Hat' of 1912, Klee's 'The Vocal Fabric of the Singer Rosa Silber' of 1922, and Mohonly-Nagy's sculpture 'Space Modulartor' of 1940, all on the heels of Frontalism. I think Frontalism and to a certain extent constructivism and futurism, shaped guys like Itten and Bayer et. al, and all that they were to produce - except for Mohonly-Nagy who I think was just a wonderer. But it was Herr Gropius and Le Corbusier too, that were to be totally consumed by 'the machine'.</p>
      <p>I'm  beginning to ramble... need more wine... ahhh, that's better!</p>
      <p>I'm really interested to see how you peg Bayer to Bauhaus and Herr Gropius and his want of 'the machine'. </p>
      <p>Gropius was just a punk - looking for the funk.</p>
      <p>Okay, ok, I've said enough...</p>
      <p>_________<br>
      Hiro</p>
