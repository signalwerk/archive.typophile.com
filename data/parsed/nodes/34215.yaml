    <p>Hello<br>
    I need a big favour...Wednesday 6/6 I need to talk about Bauhaus graphics/typography (part of the post-graduation programme in Architecture &amp; Urbanism in S.Paulo/Brazil) but I was unable to find decent images to analyse since our library is not very good and it has been closed for several days due to a strike. What I need are good images of posters (especially the 1923 exhibition) and other representative pieces (book covers, advertising, etc.). Obviously there’s stuff on Google but the quality, as you can imagine, is low.<br>
    If you have interesting images (Moholy-Nagy, Joost Schmidt, Herbert Bayer etc.) please send it to lore <cite>that symbol</cite> ukonline.co.uk  (stuffed if possible), it doesn't need to be very high res but good size and good quality would help. Eternally grateful.</p>
    <p>And feel free to discuss and post anecdotes, ideas etc. on the subject here!<br>
    Thank you. thank you, thank you.</p>
