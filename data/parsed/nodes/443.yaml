    html: <p><i>&gt; It was really just luck, I only know the free ones.</i> <br> <br>Lisa, it really doesn't matter that much how many samples  <br>you identify. The important thing is that your knowledge  <br>of free fonts is a valuable addition to the "knowledge-mix"  <br>at work here, and perfectly complements the expertise  <br>of the other IDers. This match and <a href="http://www.typophile.com/forums/messages/83/6784.html?1046445733#POST13591" target="_blank"> both</a> <a href="http://www.typophile.com/forums/messages/83/10870.html?1054767783#POST19512" target="_blank"> others</a> illustrate  <br>this eloquently. <br> <br>This reminds me of a remark by Christopher Purcell, who  <br>also manages to dig up matches that we simply can't find.  <br>This is how it works, and that's the sheer beauty of this <br>message board.</p>
