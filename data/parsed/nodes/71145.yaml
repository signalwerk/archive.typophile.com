  html: |-
    <p>Hello all,</p>
    <p>My name is James Pannafino and I have worked on / am developing a Typographic Comic. It uses all type and no images ... it's different than most comic books but can still carry a narrative experience.</p>
    <p>I have started a kickstarter campaign to help support this kind of project. So far I haven't gotten much support, not sure if it's a project most people are into. I am reaching out to fellow type lovers to see if you can help. If you know anyone that might be interested please feel free to pass the kickstarter link on to them, also if you are on facebook or twitter any mention help would greatly.</p>
    <p><a href="http://www.kickstarter.com/projects/1529426808/typographic-comics?ref=email">http://www.kickstarter.com/projects/1529426808/typographic-comics?ref=email</a></p>
    <p>Also, I will be presenting at the Museum of Comic and Cartoon Art on Thursday July 22nd, at 7pm in NYC. The presentation is titled Typographic Comics!</p>
    <p>Wish me luck, I think I need it.<br>
    James</p>
    <p>ps. I emailed Typophile to make sure it was ok to share this info, I didn't want to seem like I was spamming.</p>
