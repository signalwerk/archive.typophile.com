    html: <p>As a type person, cartoonist, comics reader, self-publisher, and someone who has made Kickstarter contributions, I want to tell you that I think there are some things wrong with your model. For commercial ventures, Kickstarter works as quid-pro-quo, not charity. What this means is that contributors are going to want at least the same value for money as someone who waits until it's all over to purchase the result with less risk. Basically what I'm saying is that you've priced a comic book at $50.</p>
