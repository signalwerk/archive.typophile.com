    <p><strong>Turn images, logos and signatures into OpenType fonts, fontlets or SING glyphlets!</strong></p>
    <p>Fontlab Ltd. announces the release of SigMaker 3, an affordable font utility that allows users to turn any image such as a scanned signature, a corporate logo or a digital photo into a font that can be easily used in any wordprocessing or graphic application ― all is six easy steps.</p>
    <p>With SigMaker 3, the user picks an image, optionally opens one of the fonts installed on his system, chooses the keystroke position under which the new symbol will be available ― and SigMaker does the rest. It will generate a modified version of the original font or ― new in version 3 ― a tiny one-glyph font, either in the Adobe InDesign-compatible SING glyphlet format, or as a universally usable OpenType “fontlet”.</p>
    <p>More at:<br>
    <a href="http://www.fontlab.com/news/announcements/sigmaker-3/" title="http://www.fontlab.com/news/announcements/sigmaker-3/">http://www.fontlab.com/news/announcements/sigmaker-3/</a></p>
    <p>Regards,<br>
    Adam Twardoch<br>
    Fontlab Ltd.</p>
