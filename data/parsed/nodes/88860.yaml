    html: |-
      <p>The duplicate outlines were perfectly sorted,</p>
      <p>but in the "Supproted codepages and default character set" FontLab had assigned "Western (Latin 1) CP1252 / ANSI" it lists the PFM default character as space too. I fiddled with it but it didn't change much...</p>
