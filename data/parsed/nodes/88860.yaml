    <p>Hello,</p>
    <p>I have searched the forums for a while now,<br>
    after battling through numerous problems with your help<br>
    I have created my first typeface and generated an OTF</p>
    <p>However, the OTF file icon in windows is displaying "∑√≠" like it does with corrupted fonts. I can't identify a problem and neither can FontLab studio.</p>
    <p>I have found a very weird thing though: in Illustrator's Glyph Pallette the glyps "À" and "É" show up as outlines, but when I write them they sow properly. What could this be?</p>
    <p>thanks in advance and sorry if this is a repeated topic, I really searched for an answer.</p>
    <p>-Álvaro Franca</p>
