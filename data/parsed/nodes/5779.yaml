  html: <p>This is a pro bono logo (Is that enough O's, or what?) for a senior national league baseball team. I know this isn't the typical baseball look, but I think it captures the Southern California personality and the energy of sports. Once I started designing the logotype, I started thinking that this was a job for Andrew Baker, but I put my head down and plowed forward. <br> <br>I welcome any critique ya'll are willing to offer. <br> <br><img src="http://www.typophile.com/forums/messages/29/41456.jpg" alt="SoCal Waves Logo"> <br> <br>Mahalo! <br>Scott</p>
