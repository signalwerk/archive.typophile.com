    html: <p>Will the logo always say Southern California with the word Waves. I know most baseball team logos typically only use the name of the mascott on there jersey's,ex Giants, Mets, Braves. Maybe it could be nice to do an SC emblem for a hat or something. I guess my point right know is that the logo feels a little congested, Especially where the ball comes out of the V. There might also be some kerning issues in the word Waves. I'm sure your are probably been teeking it like crazy. IMPO take a look at MC ESCHER and Victor Vaserely for some fine art inspiration on how to maximize the potential of the curves to create the best optical effect.</p>
