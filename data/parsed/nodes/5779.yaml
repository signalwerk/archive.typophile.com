    html: <p>hey scott --  <br> <br>(sometimes i wish there was an option to edit comments already posted!) <br> <br>after looking at your logo a second time, these are my revised comments . . . (i apologize for my somewhat fickle opinion in this case, but it might turn out to be beneficial (my first comment was my  initial reaction; the second comments are after studying the logo a bit more . . .) <br> <br>Anyway, the bottom right logo is the one i think is best. <br> <br>Although I didn't notice it right away (which is why i didn't initially prefer the curvy S), i like the wave shape the S completes . . . it might work better if you have the blue lines meeting directly with the red. The lines look akward as part of the V, I did a little fiddling and they look even more akward making them transition from thicker to skinny, so i would suggest the detached line. <br> <br>I still think the ball should have more of a slant to the right and that the end of "southern" is scrunched. <br> <br>Well anyway, i guess that's my 4 cents. ;) <br> <br>In any case, i do love the direction of this logo. </p>
