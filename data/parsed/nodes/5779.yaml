    html: <p>overall, great job, scott. <br> <br>i definitely think the top right one works best witht he regular S. <br> <br>It seems like the lines coming of the V should be thicker towards the V and get thinner towards the end like they are now. If that doesn't work, maybe just the lines like you have in the lower right would work best . . . <br>  <br>It also seems like the ball is too straight up in the air, i think it would look better if it were at more of an angle tilted right--the "ERN" of southern also looks crowded and squished together (moving the ball angle could also solve that)</p>
