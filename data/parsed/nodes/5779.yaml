    html: "<p>I fail to see why the upper curve of the S should end in a very thin line. The same goes for the part of the V, meeting with the S. To me, it's decoration without purpose (and it may cause production/application problems in the future. <br> <br>The lines coming out of the V shouldn't touch the ball -- I think it would look much nicer, if you could see the ball as a circle. To give you a hint about what I mean: if I were to make the correction in Illustrator, I would place a circle with white fill under the ball, cropping the red lines. The lines should be cropped approx as much as the distance from E to the line growing out of the V. <br> <br>Otherwise, I think it looks great! <br> <br>-- <br>Soren O</p>"
