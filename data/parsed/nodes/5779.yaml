    html: <p><i>I started thinking that this was a job for Andrew Baker</i> <br> <br>I would enjoy this job! Heh, thanks for the laugh, Scott. <br> <br>Some comments... <br> <br>Some of the channels between the letters need evening. The W is leaning into the A,  <br>as the V is with the E. <br> <br>The VES in my mind needs the most work. The sightline is broken visually on the bottom of the E, and should continue flowing with the S. <br> <br>I'd open the counters of the W and A, they are pretty clogged. <br> <br>The baseball is great. I like the implied W in it. I also like the alternate S that tapers.  The problem is no other letters taper. Maybe you could incorporate this effect into other letters. <br> <br>Also the tapered S might need to hug the guideline above it for stability. <br> <br>Southern California possibly in a lighter weight. <br> <br>This is so cool! I could mess with this for hours! <br> <br>Andrew </p>
