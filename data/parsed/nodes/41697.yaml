    <p>The Type Club of Toronto has posted it's Winter/Spring 2008 roster of events on our revamped website (<a href="http://www.typeclub.com" title="www.typeclub.com">www.typeclub.com</a>).</p>
    <p>The first event is on Tuesday, February 26 with Karl Thomson from Compass 360 at the Arts &amp; Letters Club in Toronto.</p>
    <p>Full event listings are available at the website and through the Type Club's Facebook page.</p>
