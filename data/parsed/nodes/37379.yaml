    html: <p>It’s a frame garb from the title sequence of “Targets” (1968) starring Boris Karloff. I’m suspecting it’s an alternate version of Swiss 721 Black Extended - except, as I said, for the R &amp; G.</p>
    html_clean: <p>It’s a frame garb from the title sequence of “Targets” (1968) starring Boris Karloff. I’m suspecting it’s an alternate version of Swiss 721 Black Extended - except, as I said, for the R &amp; G.</p>
  - id: 229063
    user: 110
    date: 2007-09-23T11:44:00
    date_raw: 23.Sep.2007 11.44am
    votes: null
    html: <p>1968? That rules out Swiss 721 Black Extended completely, as this is Bitstream’s digital version of Helvetica and Bitstream didn’t even exist back then. This indeed matches Annonce Gothic — except for the G of course. Berthold Venus has a similar spurless G, but some other key characteristics like the angled finials don’t match.</p>
