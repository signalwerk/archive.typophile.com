      <p>I would like to see better tools for drawing with b-splines. It took me a while to realize that TrueType doesn't use simple quadratic curves, but b-splines that allow for multiple off curve points. However the tool support in FontLab isn't great. For example it would be nice to be able to force off curve points to align with the previous segment.</p>
      <p>Bezier curves are easy to use, but after a while with points only at the extremes, all of the curves start to look the same. With beziers making smooth curves is pretty easy (which is why we use them), but if <em>everything</em> is smooth, things can get pretty boring. It's knowing where to put the kinks and lumps that makes great type.</p>
