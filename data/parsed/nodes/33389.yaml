      <p>&gt;Am I missing something here?<br>
      &gt;&gt;No. Thanks for asking though. </p>
      <p>What Raph is addressing in his spiral curves for drawing in not whether smooth straight to curve outlines can be drawn, but what they are going to look like. </p>
      <p>If you look over at the <a href="http://typophile.com/node/33531#new" rel="nofollow">Spiro release thread</a> you will see an example of how a good designer, Christian Robertson (See Dear Sarah and Pill Gothic over at Veer), says he was able to get curves he liked on an S far more easily with the Spiro tools, compared to the Bezier tools. </p>
      <p>Lucas de Groot didn't say to me that he couldn't draw good straight-to-curve outlines--he obviously can. He said he couldn't get some organic shapes he was trying to based on hand drawn examples of another designer. </p>
      <p>I haven't tried the Spiro tools, and may not until they become more accessible and integrated with font production programs. However, I do find it plausable that this will be helpful in getting a new flavor into type, even for those who are masters of drawing with Bezier curves. For I do think that tools do influence the result. You can play the same tune on a flute and a guitar. But it isn't going to sound the same.</p>
