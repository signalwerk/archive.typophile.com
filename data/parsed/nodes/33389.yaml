      <p>Quick responses (because I'd rather spend more time actually building the app than talking about it right now):</p>
      <p>It's not impossible to get good straight-to-curved transitions with Beziers, just difficult. It is very easy with my spiral tools.</p>
      <p>You draw on-curve points, just like Ikarus, and a batch process converts them into optimized Beziers. You can control exactly how close you want the match to be. Fortunately, even with a modest number of Beziers you get a match that's close enough to be invisible at large sizes. The input is on the left, the result is on the right. You can see that it automatically takes care of such details as putting points on the extremities.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/spiro_4996.png"></div><p></p>
      <p>The bad news is that I myself am not going to integrate my tools into FontLab. The good news is that I am doing a GPL release, and will be happy to work with people to either do a free software plugin, or license the technology if it's to ship with an application.</p>
      <p>B-splines are primitive compared with what I'm doing. They're definitely easier for some things than Beziers, but in the hands of an expert, Beziers are more lithe and expressive.</p>
      <p>I am expecting that volunteers will step forward to write good documentation. More than one person has expressed interest.</p>
      <p>Stay tuned.</p>
