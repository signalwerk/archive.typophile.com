    html: |-
      <p>As Hrant and Carl have said, you can often improve a curve by making the handles between Bezier nodes more equal. </p>
      <p>Here are useful three features in FontLab you can use to work on the curve.</p>
      <p>1. To slide a point as Carl recommends: first shift, then click and hold on the Bezier node you want to slide. This will drag the node while keeping the handles fixed. Very useful for taking out lumps.  </p>
      <p>2. As I learned recently, you can also keep the nodes in place by shifting, then clicking and holding on the curve. This will move the handles around while keeping the nodes in place.   </p>
      <p>3. You can shift then click and hold on a Bezier handle. Then you can slide the handle while the node and angle of the handle remain the same. </p>
      <p>Doing these three separately I have found useful, as you learn what does what, and start to get a feel of what to use when. </p>
      <p>The straight-to-curve transition is often a problem, as Carl pointed out. His advice here is very sound, I think. Sometimes it is also desirable to use an intermediate point, but you risk adding lumps, so  I try it both ways: first try without an intermediate point, then highlight and paste to mask. Then try with an additional point and adjust. You may have to try this repeatedly. Also it is sometimes best to get rid of the straight, and make it a slight curve.  </p>
      <p>You have to play with all these different options for some time to get a feel for what does what in Bezier curves. It is quite unnatural, and only after sometime do you start to get a feeling for 'how to get there from here.'</p>
