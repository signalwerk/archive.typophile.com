      <p>@dberlow:</p>
      <p>Short answers: <em>Think it’d be better to have spirals than a decent UI to QBs?</em> No.</p>
      <p><em>Think spirals are a substitute for proper placement of off-curve points in ether QB’s or CB’s?</em> Yes.</p>
      <p>@hrant:</p>
      <p><em>But couldn’t the conversion process be hinting-aware?</em> It could be, but I want to be clear up-front. The tools I'm about to release to <em>nothing</em> to help with hinting. Nada. Bupkis. If you care about hints, you need to either manually hint the converted outlines (which, I believe, is not terribly painful given how well-optimized those are), or integrate the tool with an autohinting technology such as the one Adobe ships in <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a>.</p>
      <p><em>Or maybe you’re talking about resolution? In that case though a larger Em space (which is admittedly sometimes problematic, but not much for contemporary computers) should address that well.</em> Actually, a rather little-known fact of the Type1 font format is that the div operator lets you get pretty much any precision you want, even at a 1000 em. FontForge, for all its other limitations, does have an option to save outlines using this trick.</p>
      <p>Ted Nelson once said, "if the button is not shaped like the thought, then the thought will end up shaped like the button." All I'm trying to do here is create a button more font-shaped than Beziers. I'm not claiming they'll be better in every situation (especially when the designer has invested a huge amount of time learning how to beat Beziers into submission), but I do claim that my tools will expand the palette open to font designers, and, based on my experience so far, suspect that a lot of people will find that they enjoy sketching in spirals directly on the screen.</p>
