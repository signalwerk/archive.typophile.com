      <p>The difficulty is in having continuous curvature at the transition from the straight line (which has curvature 0) to the curve.  This is possible but difficult with cubic Beziers, as it requires the control point of the next on-curve point (not the control point for the tangent node, but the next one) to be collinear with the line segment.<br>
      I'm not sure, but it may be impossible to have continuous curvature at line-to-curve transitions with quadratic Beziers. </p>
      <p>Large discontinuity in curvature may be the cause of what's known as the "bone effect."  If the discontinuity is small (as it seems in your example), the effect may not be noticeable.</p>
