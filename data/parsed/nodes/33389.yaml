      <p>Not [exactly] what you're having trouble with, but some of your point placement is problematic: your top-left and bottom-right curves are using off-extrema points; same with the two tips of the terminals, although these can probably be safely left as-is; and the inside points of the topmost and bottommost curves are missing a BCP on one side. (Actually the top one has one, but it's stunted.)</p>
      <p>The off-extrema stuff probably happened because<br>
      you mechanically slanted upright originals.</p>
      <p>hhp</p>
