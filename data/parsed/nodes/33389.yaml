      <p>If you're interpolating (which is actually a generally very useful thing) then yes it's important to have full consistency of point placement, order, etc. Otherwise it's pretty secondary.</p>
      <p>Also, some glyphs in some weights will in fact sometimes need their points to be different; the [not supremely elegant] solution to this when it comes to interpolation is to put equivalent "dummy" points in those glyphs for every weight, even though they might not affect the actual resultant outlines [much].</p>
      <p>hhp</p>
