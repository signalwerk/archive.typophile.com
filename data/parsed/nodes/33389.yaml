      <p>@dberlow: <em>In fact, to me, QB’s (with their ability to represent the entire spectrum of curvature in a quarter of a circle with two off curves between two on curves), is perfect &amp; complete.</em></p>
      <p>Could you please explain this comment more?  I don't understand when you say that quadratic Beziers can represent the "entire spectrum of curvature."  Quadratic Beziers cannot exactly represent circles (which have constant nonzero curvature).  In general, because of their quadratic nature, controlling the curvature along a quadratic Bezier is difficult.  Cubic Beziers are a bit easier because they have an additional degree of freedom, but I still find them not very natural.  I'm eager to try Raph's new splines based on Cornu spirals to see if they are more natural.  From my understanding of how they work, they guarantee nice smoothness properties (continuous curvature) with fewer degrees of freedom (ie, a nice curve with fewer things to worry about while drawing).</p>
