      <p>"but I do claim that my tools will expand the palette open to font designers"<br>
      I think your claim is bogus and challenge you to make a shape with your spirals that I can't make. I.E. show me the expanded pallette and 1 way or another, I will expand to greet it.</p>
      <p>"I guess you’re talking about hinting? That’s a good point."<br>
      I am not talking about hinting Hrant. When one scales a digital outline with or without hints, all of the points, on and off the curve, MUST find a new location on the new grid to round to when the outline is scaled to that em size.</p>
      <p>" it would have to deploy a level of abstraction to obviate the cumbersome nature of quadratics"<br>
      You are looking at optimized quadratica on the right of my illustration. How abstract is that compared to CBs? In fact, to me, QB's (with their ability to represent the entire spectrum of curvature in a quarter of a circle with two off curves between two on curves), is perfect &amp; complete.</p>
      <p>"if the button is not shaped like the thought, then the thought will end up shaped like the button"<br>
      Yes... well, if the button is shaped like a snap, than the snap will not function like a button, much less with any button hole.</p>
      <p>"All I’m trying to do here is create a button more font-shaped than Beziers"<br>
      For the output QBs of CBs, there is no button more font-shaped than QBs or CBs. I'm not certain how to say it any clearer, except to point out, with all due respect, that we are not making outlines for their appearance, we are making containers for the appearance of pixels. You seem to be making containers for containers for pixels.</p>
      <p>"a larger Em space (which is admittedly sometimes problematic, but not much for contemporary computers) should address that well."<br>
      How? I heard Bill suggest this in another thread— please, tell me how a larger em helps?</p>
