      <p>&gt; its more dificult to control this on thin weights</p>
      <p>Yyyup. That's because the two outlines are closer so it's easier to see unevenness. For a thin, monoline, "constructed" design very often it's useful to start from a skeleton* and do an expand-stroke, although that does entail a lot of subsequent clean-up, especially at terminals and [non-perpendicular] intersections.</p>
      <p>* Which is not to say that I think seeing letters are expanded<br>
      skeletons is at all optimal in type design - quite the contrary.</p>
      <p>hhp</p>
