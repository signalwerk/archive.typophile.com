      <p>&gt; if the most popular font format in the whole wide world<br>
      &gt; is TRUETYPE, then why do designers draw in beziers?</p>
      <p>I guess you mean cubic beziers, à la PS, as opposed to quadratic, à la TT? If so, that's a good question, and I guess it comes down to: habit, both concerning users and app makers; and the fact that popular is one thing, paying customers is another. And actually the fact that most people design using a math structure that's less popular is good news for the potential future success of Cornu spirals.</p>
      <p>And anyway it's not a matter of what <cite>outputs</cite> spirals, it's really a matter of: does the thing that let's you <cite>design</cite> with spirals let you convert to beziers in the end? And Raph already knows the answer needs to be yes.</p>
      <p>Now clearly it would be really nice to have spiral-based editing available directly in FontLab. But you have to start somewhere, and if the public design&amp;conversion tool becomes popular enough FontLab will end up integrating spirals as an option.</p>
      <p>&gt; converting “losslessly” to T1 of TT were possible</p>
      <p>It's not only a matter of losslessness. People design in cubics<br>
      and output in quadratics all the time, and that's lossy too.</p>
      <p>&gt; that representation of TT or T1 would be as good as the spirals were.</p>
      <p>Sure, but the spirals are supposed to help <cite>drawing</cite>, not representing.</p>
      <p>&gt; I feel sorry for all type designers... who ... convert<br>
      &gt; them automatically to ... anything else.</p>
      <p>This is a good point. Spirals aren't "native", and probably never will be. And yes, it's always nicer to draw in whatever way will be output (and this applies very well to screen font design for example) but there's a limit to that - like sure the rasterizer ends up converting all the outlines to bitmaps but you don't want to be designing your fonts as bitmaps hundreds of pixels high! It just has to be <cite>good enough</cite>. So if the conversion is tight enough (for which all you ever really need is enough points) then the -presumed- gain in drawing efficiency would make up for the slight lossiness.</p>
      <p>hhp</p>
