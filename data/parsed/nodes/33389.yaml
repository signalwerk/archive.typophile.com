      <p>&gt; make a shape with your spirals that I can’t make.</p>
      <p>But, again, it's not about Possible, it's about Comfortable,<br>
      which however does translate to Doable at the end of the day.</p>
      <p>&gt; When one scales a digital outline</p>
      <p>But there's no scaling going on here. You convert spirals to beziers,<br>
      in the same resolution space, and then it's the same thing, no?</p>
      <p>&gt; You are looking at optimized quadratica on the right of<br>
      &gt; my illustration. How abstract is that compared to CBs?</p>
      <p>But I'm not talking about the results, I'm talking about what it took to get the results. The premise here is that somebody who wants to end up with a given result will generally arrive at it more comfortably with spirals than with beziers (especially quadratic ones). And what I was saying about "abstraction" is that if you wanted to make a more comfortable UI for quadratic beziers you might ruin the only reason to use them in the first place, essentially by removing "direct" control. This is an intuitive judgment though - I'm not too sure about it.</p>
      <p>&gt; to me, QB’s (with their ability to represent the entire spectrum<br>
      &gt; of curvature in a quarter of a circle with two off curves between<br>
      &gt; two on curves), is perfect &amp; complete.</p>
      <p>If you mean as a representational method, I might agree. But if you mean it as a design process, then you're quite special: most people seem to hate drawing quadratics compared to cubics, and this seems to be due to more than just habit. And these are the same people who might prefer to use spirals over beziers for the same reason. So no, the point isn't that David Berlow will benefit from spirals, or even that Sophisticated Designers will benefit, it's that Some Designers (I suspect Most Designers) will benefit; that's all a new tool needs to be a useful contribution.</p>
      <p>This distinction I keep repeating, and you keep dismissing, concerning result vs process is critical, because we're humans who are by nature attuned to certain ways of doing things, and the end result has to be put in the context of how [comfortably] we can get to it.</p>
      <p>&gt; we are not making outlines for their appearance,<br>
      &gt; we are making containers for the appearance of pixels.</p>
      <p>That's a great way of looking at it, and sadly many people [prefer to] forget that even a 3600 dpi imagesetter is laying down pixels. BUT: if the conversion from spiral to bezier is tighter than a single pixel (which it can be made to be - it's up to the converter) or even almost as tight as a single pixel, then it's Good Enough, and that's Great.</p>
      <p>&gt; I heard Bill suggest this in another thread—<br>
      &gt; please, tell me how a larger em helps?</p>
      <p>Well Bill's point was something else: that a larger Em space allows finer placement of points, which is obvious. My point above was that when you scale [down], a larger Em is more accomodating. But this is really moot anyway because -as I tried to explain just above- there's no scaling going on that I see, I mean not any time before the spirals get converted to beziers.</p>
      <p>--</p>
      <p>Maybe what you're getting at is that at the very high end of digital type design one must directly draw quadratic beziers, that spirals can't take you there. That actually sounds right to me, even though I'm not there myself. But 95% of type design out there isn't like that. People still make money and enjoy their work with clunky, poorly hinted cubic beziers, and it seems pretty safe to believe that spirals can help many of them, perhaps even most.</p>
      <p>hhp</p>
