    html: |-
      <p>I am certainly no expert, but so far as I know, there is no need to put points at the extrema in an italic. For example, open a Minion italic m in FontLab with the Font Audit turned on. You will see that none of the 'east-west' extrema have nodes. </p>
      <p>My conclusion is that the extrema are not necessary for hinting purposes on an italic. Minion does have hints on the horizontal width at extrema without the nodes being present. Hence the key question is what looks best for your font, either printed or on the screen. Having nodes at extrema is often a good idea, but is not an iron-clad rule, especially on an italic. </p>
      <p>Furthermore, you can have intermediate points if they help. For example you will see this on many italic D's. And, for example, Minion's lower case italic o has four intermediate points. </p>
      <p>If you do want to add in the extrema then make sure you copy to mask you character, so you can very closely approximate the curves you like. </p>
      <p>Finally, as you probably know, no one can really have a clear idea about the strengths and weaknesses of your S without seeing how it works in relation to the other letters in your font.  </p>
      <p>Edit: I crossposted with you. You could get closer to the original that you have in mask by sliding the nodes around and then adjusting the handles. --Not that I'm recommending it. It is one way to go, but not any technical or aesthetic requirement, so far as I know.</p>
