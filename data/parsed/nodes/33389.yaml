      <p>Yes, in Nick's example the straight segment is too short for the "bone effect" to be notable. On the other hand that effect is an optical one, not something that happens exactly at the straight/curve transition. Which is not to say that it doesn't require wrangling with beziers, as there's no other way to fix it anyway (assuming the straight part isn' sacrificed). The assumed benefit of cornus in terms of this effect are that they reduce it due to the way they "get away" from the straight and/or they're easier to compensate with.</p>
