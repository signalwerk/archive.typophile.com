      <p>Slide the point at the bottom of the S to the right. Adjust the length of the two bezier handles on the segment just left of that point. You just have to fiddle with them and look at them until they are smooth. It might also be necessary to adjust other bezier handles nearby to get everything to balance. Smoothness comes when the handles are balanced and when the on-curve points are ideally located on the curve. I'll repeat Hrant's suggestion to pull the bezier handles out of the inside curves at top and bottom. </p>
      <p>Those features (terminals of SCGscert) are notoriously difficult to control. </p>
      <p>For this shape you may find you need the straight segment in the middle to be shorter. Straight segments can be obvious unless you use ample space for the transition to curves (tangent point).</p>
    html_clean: |-
