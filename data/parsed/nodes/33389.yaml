      <p>Caveat: I haven't really tried Raph's spirals yet. It's possible that for the way I work beziers are just as good/bad. But it's also possible that a person could be turned from his scepticism by actually using spirals.</p>
      <p>I wrote:<br>
      &gt; the fact that most people design using a math structure that’s<br>
      &gt; less popular is good news for the potential future success of<br>
      &gt; Cornu spirals.</p>
      <p>Maybe that was too easy to misunderstand. What I meant was, since so many people design in cubic beziers but often generate and sell those designs in TT format (a conversion which is not lossless), the lossiness of spiral-to-bezier doesn't seem to be a huge barrier to "success". Which is not to say it's ideal in terms of Designing For The Medium, but other considerations, like in this case the efficiency of wrapping your head around a design process, are not secondary. If it takes you half the time to make something that's 95% good enough, that suits quite a lot of people.</p>
      <p>&gt; All the points in a contour must find a new position on the grid<br>
      &gt; when scaled. How more points effect this is not a mystery to me,<br>
      &gt; but apparently it is to others.</p>
      <p>I guess you're talking about hinting? That's a good point.<br>
      But couldn't the conversion process be hinting-aware?</p>
      <p>Or maybe you're talking about resolution? In that case though a larger Em space (which is admittedly sometimes problematic, but not much for contemporary computers) should address that well.</p>
      <p>&gt; Think it’d be better to have spirals than a decent UI to QBs?</p>
      <p>If spirals are as "natural" to design with as it sounds, I would say that a "decent" UI for quadratic beziers* would have to be almost prescient to match! I suspect it would have to deploy a level of abstraction to obviate the cumbersome nature of quadratics. And that abstraction might in fact ruin the advantage of "native" design. It seems safe to say that beziers -especially quadratics- have some inherent mismatch to how humans like to make shapes - at least more of a mismatch that spirals [might] have, and you can overcome that without ruining the main reason you're using them.</p>
      <p>* And note, we've been talking about the advantage of spirals vs <cite>cubic</cite> beziers, which seem to be [even] less "unnatural" for most people than quadratics.</p>
      <p>&gt; Think spirals are a substitute for proper placement<br>
      &gt; of off-curve points in ether QB’s or CB’s?</p>
      <p>Maybe.</p>
      <p>&gt; There is no help for drawing that is not representing the actual.</p>
      <p>In an absolute sense, I agree. But human activity is never absolute, not even when Designing For The Medium, and if you bend that "actual" just a little bit spirals could in fact be a superb substitute.</p>
      <p>as for your interesting Calibri example, I think I know what you're getting at, but I don't see how scaling is relevant to the one-time, non-scalar conversion of spirals to beziers.</p>
      <p>BTW, the righthand ones looks like cubics<br>
      to me - are you sure you meant "native TT"?</p>
      <p>hhp</p>
