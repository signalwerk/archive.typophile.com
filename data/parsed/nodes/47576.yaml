    <p>Not only does political signage amuse me during election time , but the attitudes and tactis of the participants are pretty dam funny as well. It seems as though elections are a manifestation of the fountain of youth considering that it makes fifty and sixty year old men and women  behave like they’re five year old children.Everthing from the mud slinging, the backstabbing, the alliances, and the buttons, is reminiscent of days I spent in middle school. Rediculous, isn’t it?</p>
    <p>I kind of have the same opinion of my country that I do of my state, a type of love/hate relationship. I love the people, the diversity, the entrepeneurial spirit, but I do not agree with it’s politics, nor the “notion” that we are actually “free”. I do believe that our country has strayed too far from the original ideas of it’s founding fathers and in turn has taken power away from it’s citizens and has created an imperealistic way of governing.</p>
