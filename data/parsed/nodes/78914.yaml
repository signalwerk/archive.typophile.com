    <p>It's celebration time @ ARS Type!</p>
    <p>Along with the launch of our <a class="freelinking external" href="http://arstype.angusrshamal.com" rel="nofollow">new website</a>, I'm proud to announce the official release of the redrawn and fully extended <a class="freelinking external" href="http://arstype.angusrshamal.com/ars-maquette-2/" rel="nofollow">ARS Maquette PRO</a> !</p>
    <p>Completed in November 2010, this new version however, is much more than an upgrade. Not only was it extended with two versions of newly designed italics and a generous amount of features &amp; alternate characters — it was completely redrawn, refined and extensively spaced &amp; kerned (with the extensive help from Igino Marini-iKern) to fully excel in all its applications. Quite certainly for text and even more so for headlines, by introducing a unique new Display cut for all weights and styles.</p>
    <p><a class="freelinking external" href="http://arstype.angusrshamal.com/ars-maquette-2/" rel="nofollow">ARS Maquette PRO page</a>.<br>
    <a class="freelinking external" href="http://arstype.angusrshamal.com/ars-maquette-2/overview/" rel="nofollow">Read all about the design here</a>.<br>
    <a class="freelinking external" href="http://arstype.angusrshamal.com/ars-maquette-2/test-drive/" rel="nofollow">Test ARS Maquette Pro</a>.<br>
    <a class="freelinking external" href="http://arstype.angusrshamal.com/ars-maquette-2/buy-ars-maquette/" rel="nofollow">Buy ARS Maquette Pro</a>.</p>
