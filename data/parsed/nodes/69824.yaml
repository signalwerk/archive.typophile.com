      <p>Wherever curves run into stems (for example at the top left of /n/) it's conventional, and almost always preferable, to thin out the curving stroke. Otherwise those intersections tend to look clotted and too dark.</p>
      <p>More on that and other tips can be found here:<br>
      <a href="http://typographica.org/2010/on-typography/making-geometric-type-work/" title="http://typographica.org/2010/on-typography/making-geometric-type-work/">http://typographica.org/2010/on-typography/making-geometric-type-work/</a></p>
