      <p>I think the dots on the i and j need to be moved to the right and raised quite a bit.<br>
      You need some consistency , why is the n different than the m, why is the terminal on the k's stem different than the l, h and b. I like the Interstate-ish k however it's too narrow compared to the y, x and o. I like the shape of the y, it's leaning a bit to the right like an Italic (find a way to get rid of that), the really big descender and the small x-height may be a nice feature.<br>
      Try sketching your typeface with pencil, you'll probably end up thinning out the curves at the intersections, but also the movement of your hand will add a consistency in the flow. Try that and then go back to the computer and imitate your drawings.</p>
