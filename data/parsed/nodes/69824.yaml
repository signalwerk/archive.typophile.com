    <p>Last year I was working on this font that I eventually got frustrated with, mainly because it looked like rubbish.</p>
    <p>So in the last few days I decided to have another stab at it: starting from scratch, I drew something that I think might be worth following through with.</p>
    <p>I only have a screenshot at this time, because I haven't started compiling the outlines into an actual font yet, so you'll have to make do with how it looks in Illustrator!</p>
    <p>As you can see, the capitals are not yet done, nor are the numbers. But I do have a full lower case set and ligatures.</p>
    <p>Any comments would be most appreciated!</p>
