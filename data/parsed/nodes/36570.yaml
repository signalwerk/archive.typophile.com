  html: |-
    <p>Hi Everyone,</p>
    <p>I'm in the process of designing a logo for a client.<br>
    I've spent hours (actually days) trying to design my own letter system, but that seems to be taking too long. This is to be used for commericial pruposes, so ideally I'd be designing each letter from scratch.</p>
    <p>This is my first job for a large client so I'm taking this seriously. I want to make sure I'm doing it right.<br>
    I found a gorgeous font that is so well suited for the logo. I've been manipulating the letters to personalize it for the company.</p>
    <p>I'm not sure whether I can actually do this.<br>
    What are the laws pertaining to font manipulation? Is there a percentage that needs to be altered?</p>
    <p>If anyone knows a little bit about this, I'd greatly appreciate your advice.</p>
    <p>Thank You.</p>
