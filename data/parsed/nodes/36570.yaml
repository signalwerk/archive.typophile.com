    html: <p>Most logos are conceived from manipulated fonts and there isn't any restriction on the altering or usage. Once you puchase a font for repoduction you have the rights to create any shape or form from it. An example is the horizontal or vertical modification that is allowed in page making or graphic programs.</p>
    html_clean: <p>Most logos are conceived from manipulated fonts and there isn't any restriction on the altering or usage. Once you puchase a font for repoduction you have the rights to create any shape or form from it. An example is the horizontal or vertical modification that is allowed in page making or graphic programs.</p>
  - id: 222988
    user: 1049
    date: 2007-08-28T15:42:00
    date_raw: 28 Aug 2007 — 3:42pm
    votes: null
    html: <p>Most EULAs allow (or at least don't disallow) the creation of logotypes as static images or even static outlines. What most (but not all) EULAs don't allow is the creation of a derivative font. I think we all assume or at least hope that you're considering the former option. No one at AT&amp;T types A, T, &amp;, T, death star to form the logo, they place an eps, bitmap, or use a logofont where the complete lockup is assigned to one key.</p>
