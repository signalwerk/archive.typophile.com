    html: |-
      <p>For my part I look for complete glyph showing and some evidence that it's accurate (not, "our fonts include all the Macintosh standard characters" for example, stuck next to a symbol or ornament font), and I often want to bookmark a page, or at least keep it open in a browser tab, and come back to it later, so a site like ourtype.be doesn't work well for me.  And like others, I don't particularly want to have to buy a whole package, or to choose a "collection" to browse.  On the other hand, I think I've more often bought fonts based on printed samples.  It helps to see usage samples and notes on what makes the typeface design unusual.</p>
      <p>Liam</p>
      <p>--<br>
      Words and pictures from old books: <a href="http://fromoldbooks.org/" title="http://fromoldbooks.org/">http://fromoldbooks.org/</a></p>
