    html: |-
      <p>I have to say the usability of MyFonts is top of all. Keyword search, live-testing is a must. And the WTF-engine is awesome. Thats one of the reasons many people go there ...</p>
      <p>Also it would be nice to have a specialized system of categorizing if you are a logged-in-user. What does that mean? As a logged-in-member I would like to give the typefaces I am seeing special keywords. Just for me. For example, the ones I choose looking like Bauhaus-examples, I want to categorize like that. Just for me. Or if a see a typeface which looks like the one from the local bakerys, Iwant to categorize it like that: Let's say: "Mayers Bäckerei Script". MyFonts is having something like that, but it is pretty complicated. Dafont has it, too, but I would prefer Pulldown-menus instead of those "go-to-the-next-site-and-choose-what-you-like-sites". Speed is important. </p>
      <p>BTW: Fast-loading is a must. And re-direct is an absolute no-no! If you have to, redirect at the secure-paysites, but not at the fontchoosing ones. Good luck.</p>
