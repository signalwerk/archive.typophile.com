    html: |-
      <p>Just an FYI: If I worked for a type foundry - I would not put my faces out in PDF form - (unless they were photoshop - and no fonts attached).</p>
      <p>I've been watching the "black market" -- kids out there love to get PDF files so they can extract the font. They don't care about kerning. They don't care about stealing. They just don't care.</p>
      <p>I belong to several different type boards - and some are definitely easier than others. Some you learn their personality - and it works. One feature that makes a type board easiest - is a strong SEARCH feature. Also, I like see the Upper &amp; lower cases - not a sentence... and I appreciate the ability to see the word in each of the typefaces I am browsing.</p>
      <p>Biddy - if you are interested in an expensive font - and need to see all the characters - I have found Veer.com's character sets flawless, especially when it comes to the OT fonts with their tons of characters...</p>
      <p>P.S. I just looked in on a site - and sure enough there was a new listing - and I'd like to share it with you:<br>
      All experts of Pdf extractions<br>
      Hello, I have a little question...<br>
      Yes, I know that with the Mac is not possible extract characters from a pdf (I'm wrong?).<br>
      Ok, but I would like to know how much time need for extract characters from a pdf like this and make a font?<br>
      Please see: <a href="http://www.mytempdir.com/1128315" title="http://www.mytempdir.com/1128315">http://www.mytempdir.com/1128315</a><br>
      Logically if somebody know how make extraction with Mac I'm here for learn!!! :-)))<br>
      *****<br>
      And I am sure someone will help this person and extract the font... see what I mean?</p>
