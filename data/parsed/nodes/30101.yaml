    html: <p>I love OurType's site too. The unfortunate trade-off with a very interactive, flexible sampler is that it is built in Flash, which converts font outlines to quadratic curves, noticeably altering the letterforms, especially at small to mid sizes. Extremities are often cut off. PDF isn't interactive, but it's still the best method for previewing a face in its true form.</p>
