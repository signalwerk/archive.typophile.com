      <p>I for one am always quite pleased when I visit <a href="http://www.ourtype.be" title="www.ourtype.be">www.ourtype.be</a>...<br>
      The massive type on the right side is nice to start. And then the extensive font-tester, which allows a number of things to be changed, like the different weigts of a typeface, point size, leading, preset paragraphs, printed samples, sample-PDF, etc.<br>
      I hate the limited test-fields on sites like myfonts for example. Sample PDF's only are okay, but those also give you a limited impression of a typeface. Being able to set a bit of own text helps alot.</p>
