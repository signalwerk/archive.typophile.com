    user: 6012
    date: 2006-12-22T00:35:00
    date_raw: 22 Dec 2006 — 12:35am
    votes: null
    html: |-
      <p>Stephen -</p>
      <p>Why make it so easy for people to get the fonts. You can have your pdfs - I only suggest at this point to "flatten" the file -- so that the font will not be embedded. When done properly, you will still see the crispness of each character.</p>
      <p>You wrote that very few sales are lost to them. I am starting to disagree. It isn't one person going about their business... there seems to be a whole underground - whether its through a torrent or a rapid access type site -- the foundries are losing a fortune. Part of me wants to say I don't care -- I paid out plenty in the late 1980s and 1990s -- being a typographer in NY -- and the second one in the city to use Macs for "real" typesetting. But then it drives me crazy - I paid... and now someone can pluck a whole foundry's collection for their own use - and for free.</p>
      <p>It also amazes me that the person at home, with a computer - can own more typefaces today -- than Photolettering owned in the 1990s -- and it doesn't have to cost them a cent.</p>
      <p>I'm rambling on here - but, I just wanted to add one thing about paying - I have a neighbor new to computers. She bought a Dell. She was amazed at my type library, and the price it cost me. Her attitude - "I didn't know you had to pay for fonts." Unfortunately, that is the mentality of so many novices out there...</p>
