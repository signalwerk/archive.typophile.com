    html: |-
      <p>1. Multiple ways of finding a typeface (authors, names, keywords, style...)<br>
      2. preview tester showing ALL characters in the font incl. kerning<br>
      3. detailed description of all opentype features<br>
      4. table showing ALL glyphs in a font*<br>
      5. pdf showing all styles, all glyphs and sample texts</p>
      <p>* This is very important, especialy for for multilingual typography. Many fonts could contain CE glyphs, but quite often these glyphs are so badly designed they can't be used at all. It is necessary to check glyphs like dcaron or eogonek before buying a typeface.</p>
