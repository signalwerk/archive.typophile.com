      <p>Stephen...one of the main things that I don't like about FontShop's site is that if I'm looking for say: <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=scala" rel="nofollow">Scala</a> when I type them in I get 40 fonts or items on a list, and have to dig to find the package that consists of what I want. The user has no way of knowing what the particular font package they are looking for is called, in order to find <em>exactly</em> what they need. (Does that make any sense?)</p>
      <p>Sometimes I've been digging only to find that there is no package for a family and I have to add each weight or style in order to build my own package. To me, <a href="http://www.stormtype.com" rel="nofollow">StormType's</a> site is near perfect in both how it displays its type, and providing PDF samples (though it also appears to be based a lot on <a href="http://www.fontbureau.com" rel="nofollow">Font Bureau's</a> site).</p>
      <p>On a more positive note, FontShop's printed materials are <em>outstanding</em>.</p>
