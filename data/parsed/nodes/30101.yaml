    html: |-
      <p>Some sites have glyph-reduced testfonts (maybe without essential glyphs, you normally need for text, that nobody can work with them in real life), but with all different weights etc.<br>
      With them you can layout, show the client why this font is eventually worth buying, get a "feeling" for the font yourself, see it's kerning etc.. Especially important when it is not a typical display font.<br>
      PDF are fine at first glance, but you can't show them to the client as an buying-argument. It's much too abstract.</p>
      <p>1. First the possibility to find, link etc. a certain content (ie typeface) – usability, accessibility topic<br>
      2. Starting with an appealing grafic, use of the typeface (hmm, this looks nice...)<br>
      3. A good typesetter (yes, this font could be something for my xxx-layout)<br>
      4. testfonts in all weights (layout with the typeface)<br>
      5. A pdf showing uses, glyphs, otf-features, etc.  </p>
      <p>and</p>
      <p>What i'm feeling generally as a client –<br>
      Sometimes i think the "font-industry" has to learn how to sell something - marketing. Where are the ideas to reduce the gap between possible users and the fontsellers. Where are the concepts that makes the customer proud of owning a typeface. Identification? OK, there are some good examples i know so far (like underware...), but…</p>
