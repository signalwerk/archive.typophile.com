    html: <p>hmm, do you mean “tints” … <br><br>in this design (.001), you have solid <br>contiguous shapes and you’d just <br>print that 3 color, imho. <br><br>You’d have red, dark burgundy, and <br>the third color, which is kinda slate grayish. <br><br>You could match the slate gray <br>or you could use clear ink to achieve <br>a similar eﬀect. <br><br>The clear ink will darken the fabric and <br>could achieve an eﬀect as shown. <br><br>We use a base plate of white <br>so the fabric color isn’t a factor. <br><br>Because the designs in this competition are <br>entirely vector, there’s no need for halftones, <br>which are used for raster art. <br><br>as far as tints… <br><br>Tints oﬀ a main color tend to cheapen the look of T-shirt <br>designs, in my opinion,  <br>because of the coarse line screen, typically <br>less than 85; the dots are quite big. <br><br>They work great in print! <br><br>Our local screenprinter, the printer who’ll print the <br>Typophile shirts, is the primary printer for <br>Split, Quiksilver, Volcom, Freshjive and <br>a bunch of others…so we are in good hands. <br><br>The operation is quite massive <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. The place <br>has 28 automatic machines of 12 color or more, all of  <br>them laser sighted. I could ﬁnd out what brand they <br>are. Anyway, the printer is always printing with <br>new inks and new techniques so I will advise <br>Jared and Joe on options depending on which <br>design wins. <br><br>diﬀ. screenprinters do diﬀ. things. but that’s <br>the info from this end. <br><br>bj</p>
