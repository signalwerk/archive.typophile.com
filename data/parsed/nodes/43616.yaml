      <p><cite>I just assumed it was the math function symbol.</cite></p>
      <p>If we look at the unicode chart <a href="http://www.unicode.org/charts/PDF/U0180.pdf" title="http://www.unicode.org/charts/PDF/U0180.pdf">http://www.unicode.org/charts/PDF/U0180.pdf</a> we see this</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/unchart_5182.jpg"></div><p></p>
      <p>So, it seems, you are not the only one to assume that, yet I am unaware of a character called "function symbol" in mathematics. In  France, there is a tradition where capital letters and  Greek letters used in mathematical formulae are upright (and that is why the psi in my avatar is upright) but I am unaware of a mathematical tradition that would denote functions with small upright italic letters. If I use the LaTeX fourier package with the upright option to denote a function <em>f</em> from X to Y, I get this</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/function_6158.jpg"></div><p></p>
      <p>The X and Y are upright (contrary to the American tradition) but the f is not.</p>
      <p>[Edit] However, I have seen comments on another thread where it is contended that the florin should be slanted...</p>
    html_clean: |-
