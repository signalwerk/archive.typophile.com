    html: |-
      <p><cite>it seems we have answered the question well enough.</cite></p>
      <p>Agreed, but the comment "= function symbol" for U+0192 in the unicode chart troubled me. I now had a look at the Unicode Technical Report #25, <a href="http://unicode.org/reports/tr25/" target="_blank" rel="nofollow"><em>Unicode support for mathematics</em></a>, which seems to solve my worry: U+0192 is not in the mathematical character repertoire: the report refers nowhere to any character in the range U+0100..U+01FF.</p>
      <p>Solved for me too.</p>
      <p>Michel Boyer</p>
