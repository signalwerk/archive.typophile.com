      <p>Mike, there are two independent questions here, the hook and the slant. Concerning the use, here is something interesting I found in Victor Gaultney's (pdf) text <a href="http://scripts.sil.org/cms/scripts/render_download.php?site_id=nrsi&amp;format=file&amp;media_id=Gentium_RU_spec&amp;filename=Gentium_RU_spec.pdf" rel="nofollow"><em>gentium, a typeface for the nations</em></a>, and I cite: </p>
      <p>&nbsp;&nbsp;<em>The design of the italic f [in Gentium] allows a clear distinction to be made between it and the hooked version. Both are used for the Ewe language of Ghana.</em></p>
      <p>and he gives the example:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ufaital_5165.jpg"></div><br>
      I gather that in the regular, that should read<br>
      <div class="imageWrap"><img src="http://typophile.com/files/ufareg_6116.jpg"></div><br>
      and that U+0192 should normally be upright in the regular and, in the italic, it should share it's slant.<p></p>
      <p>As for the requirement of a hooked f in mathematical formulas, I am suprised at what you say but engineers may have conventions that mathematicians don't. Normally mathematics lowercase is italics and, in most fonts but not all, the italic f is hooked. So I looked at my math books to see if any would use a non hooked italic f to represent a function; I found a few nicely edited books from the Springer series "Ergebnisse der mathematik" (one of which is even printed in the USA) with f(x) written as in (1), which is less hooked than the non hooked gentium italic f. I found essentially the same f in two books published in France (2); I also found a little book from Mir publishers, Moscow, with an italic f(x) that is absolutely not hooked (3). Those books date from the sixties and seventies and are all "graduate level" pure mathematics.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fofx_5671.jpg"></div><br>
      If you have any reference about that hook requirement, please let me know.<p></p>
      <p>Michel Boyer</p>
