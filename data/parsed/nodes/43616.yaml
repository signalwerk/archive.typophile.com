      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/sassoon-sans/" rel="nofollow">Sassoon Sans</a> has a vertical f like that, but there is more contrast in your letter suggesting a serif font. It's possible the italic was backslanted. It might also be a Math function (ƒ) symbol [Option-f on a Mac]. Most font showings don't show this glyph, so it would be hard to browse for this one.</p>
      <p>- Mike Yanega</p>
