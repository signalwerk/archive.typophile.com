      <p>Michel, you have done much more research on this than I have. I was an engineering student in 1962-67, when anything we did was done by hand. We didn't even have calculators, not to mention laptops. As long as what we wrote seemed to resemble the function symbol, that was good enough. Our textbooks were probably printed with metal type, and I can't honestly say that I paid too much attention in those days to what the function symbol f was like. At that point it would still be about 20 years until I started caring about fonts, or noticing details like that. </p>
      <p>I tend to think that the 'requirements' about this are just general conventions, and as long as the function symbol is distinct from the other lettering in the textbooks, no one would be confused. I have been told that mathematicians can be very particular about their symbols, but as long as I am not typesetting one of their books, I don't think I will worry about it much.</p>
      <p>We still don't even know what the 'f' of this post was supposed to be -- a vertical italic f, or a Florin symbol, or a function symbol -- but it seems we have answered the question well enough. </p>
      <p>I am impressed by your thoroughness though, and I have noticed that about you before. Well done.</p>
      <p>- Mike Yanega</p>
