      <p>Max, I suspect that anyone using Adobe fonts as you describe is using them illegally, which is to say under conditions not covered by the licensing agreement. If you want to knock off some of your competitors, you could probably point out this little detail to Adobe's legal department, if you had a mind to...but that would be wrong.</p>
      <p>Nonetheless, since you are a potential customer who has seen a WIDE variety of possible pricing options, what is a "middle ground" you could live with? Everyone's gotta eat, but no one needs to be greedy. Is a ten-user license, from your point of view, an acceptable compromise? I just need some feedback: so far, I've had to pass on three offers because I am currently clueless about what would be fair to ALL parties concerned...</p>
