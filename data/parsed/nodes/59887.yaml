      <p>Pricing for this kind of use is all over the place. I run <a class="freelinking external" href="http://www.designyourowncard.com">http://www.designyourowncard.com</a> and have contacted probably a dozen type foundries about using fonts on my site. They range from being fine with it on a regular license (on the logic that it's a single installation) to being breathtakingly restrictive and expensive ($1500/weight with a 100 character limit), to simply being impossible at any price. Adobe, for example, has told me that they don't allow this kind of use under any license, which makes me wonder how some of my competitors are using their fonts.</p>
      <p>It's difficult to put a price on this kind of use. Maybe some kind of volume-based percentage makes the most sense, but as James mentioned the unpredictability of that makes it a tough sell. But this isn't that different than the off-line world: as a designer, I can buy a $100 font and use it in a $500 logo or as the centerpiece of a $50k advertising campaign. In the same way, an online design site might sell a $6 rubber stamp a week or be doing Vistaprint-level sales. I think there are far more of the former than the latter, so I'd suggest gearing your pricing toward them.</p>
