      <p>I thought about this before releasing Downturn for web embedding and the following items came to mind:</p>
      <p>• Nobody wants to deal with per-use royalty rates. Unlike print campaigns, it’s not something that most projects can budget for. Sure a designer might only expect ten-thousand individual users a month, but if Digg, Slashdot, or BoingBoing link to a site that number can exceed a few hundred thousand in just hours, possibly resulting in royalties that exceed a small project’s yearly profits. And unless you want to set up and manage the tracking server yourself, you’ll probably get ripped off by under-reporting (just ask musicians how they feel about album sales reporting).</p>
      <p>• From a designer’s perspective, licensing type for a web project is very limiting. They don’t care how many users are getting it, they just care that they’re probably only going to be able to use each license on one web site and one server and probably only for a few years or months, depending on the project. Contrast that to buying a solid workhorse face for print use, where it’s generally usable over and over until software no longer supports the font format, without ever paying again.</p>
      <p>Based on these observations, I decided that the best way to go is with per-server, per-site licenses at the same price or less (I chose the same because I only sell the fonts through MyFonts, which has limitations with pricing). It could really work in your favor to sell cheap server licenses and make money in volume when designers use the font on multiple projects, or if you’re lucky, on web-sites with redundant load-balanced server pools.</p>
