    <p>I have been out of the loop for awhile, due to some time-consuming family business, so I don't know if this topic has been discussed yet. Anyhow...</p>
    <p>I have had several inquiries concerning licensing fees for web-based applications and have yet to come up with an acceptable solution. Licensing fees are normally based on the number of users, but the number is usual fairly consistent over time and each user is assumed to have unlimited access to a licensed font. With these apps, the number of users varies—ideally, if the developer has a killer app, users could number in the thousands—but the actual usage time is rather limited.</p>
    <p>As far as I can see, the most sensible way to assess fees would be to have a meter-based system that would charge the developer a nominal fee—say, 5¢ or so—each time a font was used. Unfortunately, none of the developers who have contacted me knows of any available software that would accomplish this task. Bottom line, until some enterprising programmer sees some profit in developing a meter-used licensing system, I am stuck with coming up with a set fee that is fair to all parties involved.</p>
    <p>Anyone got any ideas, experiences, guidelines, or such to share?</p>
