  html: |-
    <p>I have to find some text and signage type to go with an identity that uses Doyald Young’s Finesse Light. It actually looks OK with the symbol that another designer sold to the client. (I have been given far worse.) But, what to use with this? Any ideas? I am stumped… The signature portion of the identity uses all caps, which helps and makes it look more classical. A bit like Trajan, before it was overused. Finesse Light is more similar to the heavier Berthold Christiana in design.</p>
    <p><a href="http://www.myfonts.com/fonts/doyald-young/young-finesse/light/" title="http://www.myfonts.com/fonts/doyald-young/young-finesse/light/">http://www.myfonts.com/fonts/doyald-young/young-finesse/light/</a></p>
