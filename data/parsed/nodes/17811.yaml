      <p>I’d say they’re probably derived from typefaces, but modified when drawn by hand for the specific logo in question.</p>
      <p>I know for a fact that’s how Doyald Young created the Prudential logo: he did the lettering based off a condensed version of Century Schoolbook (I think) and made customizations where he saw fit.</p>
