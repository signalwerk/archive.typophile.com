    <p>I just subscribed to "typophile.com" and I'm in the middle of de-codifiying the whole font creation thing (being still a student) I have been looking into a number of commercial books for guidelines but none of them offeer some basic rules of the trade like standard optical corrections that each letter needs, kerning specifications... my typography teacher has a do-it-you-self style that is good to begin with but not of much use any more.... </p>
    <p>If you had to name one book that kind of sums the whole thing up, which would that be?</p>
    <p>Any other web sites that might offer guide lines?</p>
    <p>Plus does any one know wich fonts Nat West uses?</p>
