    html: |-
      <p><em>there is a minority of committed Windows users who would love to see Glyphs </em></p>
      <p>A very small minority, I think, and mostly only from curiosity. It should be said that the debate between FontLab and other tools on the Mac isn't due to the fact that most of those other tools are Mac-only, but also because the Windows version of FontLab is so much more stable than the current Mac release version, and in a Windows-centric font production workflow, e.g. involving VOLT and/or VTT, is well integrated.</p>
      <p>My personal choice for primary font development tool on the Mac is the Windows version of FontLab running in Parallels. I use the RoboFab and UFOcentral scripts to integrate this into a UFO workflow (Prepolator, UFOstretch) on the Mac.</p>
