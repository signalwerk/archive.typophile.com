    html: |-
      <p>It is always difficult to predict when the cows will come home. I don't think it is a case of predicting "the winner" among the choices out there and on the way.  I do think the honest competition is very healthy.  FontLab has enjoyed being the only show in town long enough that they have been too slow to update with the needs of their users. When Glyphs and RoboFont came along, they gave FontLab a much needed kick in the tail to get serious about improvement. All practitioners in any field do not confine themselves to only one tool, neither should you.  My hope for all developers is that they adopt the very adaptable UFO format as standard, at least as an import and export seamless function.  This would allow anyone to work with any set of tools they choose and not have to be saddled waiting for that long-promised version update to finally arrive (and pray that it is bug free). We all know the arguments about type designers and beginners being financially strapped but so are fledgling software developers (who are also type designers, btw).  As much as I have moaned about how font prices are too low, I cannot fairly expect the developers of the tools I need to bear the bourdon for me.  I know I have to bite the bullet and borrow money in meager times to pay them enough to survive as well.<br>
      None of us can predict which tool or combination will end up best for you and which will BE AVAILABLE in a reasonable amount of time to do us any good.  Do you bet on the older pride leader who is slower yet now worried about competition or the new young Lions out there with self-imposed eagerness yet fewer resources? You can guess and pick one now or support them all and help them grow into a healthy competitive system.</p>
