    html: |-
      <p>I love using Glyphs, it is comfortable and evolving fast.<br>
      Despite someone says, you can edit advanced values (meta, name etc) by yourself, but you have to know the keywords. It's quite simple and good documentations are available online.<br>
      The bigger limitation, in comparison with Fontlab, is you can't export true type fonts nor old postscripts, but I think they're dying formats; UFO export is always possible.</p>
      <p>I’ve never used this feature but manual hinting is also available in Glyphs. You have to disable "auto hinting" before exporting to keep your own hints.</p>
