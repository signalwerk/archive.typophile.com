    <p>The previous Glyphs/Fontlab topic was informative but I'd like to ask a question pertinent to my situation. </p>
    <p>I've been toiling away with TypeTool for a while and want to upgrade to a more comprehensive tool. I had always thought that FontLab was the obvious next step, but seeing the demo for Glyphs, I really like the interface and to be honest, the price. Should I just hold out for FontLab? Will Glyphs be a satisfactory move up?</p>
