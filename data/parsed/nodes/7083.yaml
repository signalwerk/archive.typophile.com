  html: <p>I'm tantalizingly close to having figured this out, but now I'm stuck. <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="scriptsample"> <br> <br>This looks like <a href="http://bowfinprintworks.com/Script08Pg4.html">Hudson (Solo)</a> from Mike Y's script font guide. However, I can't find an electronic version. I'm certain it's available electronically, since the sample came from a banner ad. I've also seen it several other times in print and on the web. It must have another name. What is it? <br> <br>s'marks <br></p>
