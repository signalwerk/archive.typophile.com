    html: |-
      <p>I don't know if this is a font or artwork. It's a mash-up of features from Helvetica -- the closed counter _S_, and Franklin Gothic -- the angled spur on G and the straight leg on R.  The heavy weight letters are forced into the Procrustean bed of a perfect square and displayed in a monospace grid.  Whether font or artwork the effect is to suggest that the Protestant milieu in Basel was regimented and oppressive. At least for this subset of letters, the design is effective for condemning authority. But when you place a heavy W or M into this format it disappears into a box of black.<br>
      Don</p>
  - id: 577894
