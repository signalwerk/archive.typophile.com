      <div class="comment-spam-body"><p>Hi Buddy, I think you found the most likely base<br>
      ---start quote---<br>
      The closest I could find was Bureau Grot which are close to some letters, "C", "S" ,"G".<br>
      ---end quote---<br>
      Using Bureau Grot Bold, straighten the leg on the R, do minor adjustments to most letters and fit them into the square format and you should have it. W and M are going to be very closed and almost solid black boxes, but if you edit to ensure at least narrow open wedges in the right places, they would still be recognizable.<br>
      Don</p>
      </div>
