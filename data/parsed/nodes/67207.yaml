    <p>I'm looking for the following fonts; either free or close alternatives that are free.  The originals can be found at <a href="http://www.sudtipos.com/fonts" title="http://www.sudtipos.com/fonts">http://www.sudtipos.com/fonts</a>.</p>
    <p>Feel Script<br>
    Almond Script<br>
    Amorinda<br>
    Angelus<br>
    Biographer<br>
    Brisa<br>
    Cenizas<br>
    Diplomatic<br>
    Galgo Script<br>
    Herencia<br>
    Inoxida<br>
    Matogrosso<br>
