      <p>I very much like the bold version and would use it in my projects. The uppercase G and B bolds are quite shy: the upper part doesn't reach out very much. I wonder what it would look like to type uppercase words beginning with G or B, like GUNNING or BOLD.</p>
      <p>Nice. Robust.</p>
