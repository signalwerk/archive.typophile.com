      <p>I was updating my wiki and discovered this loose end ... a *few* days later here are more samples. I've put the final version next to the original posted in <a href="http://typophile.com/node/2349" rel="nofollow">this thread</a> for comparrison. Eason is in yellow, St. Nicolaus in the white. It was rather embarassing to see myself calling Jenson's long S an "unusual F ligature" in the original post! At least I can quantify that I've come a short ways since then :-) Enjoy and thanks (Yves for you kind words).</p>
      <p>Oh, and sorry for the wide image. A relic from typophile's neolithic past.</p>
      <p>Randy</p>
