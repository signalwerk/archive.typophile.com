    html: |-
      <p>Paul and all: Thanks for dragging this thread back up! Eason has been a long time in the making, and she's at least partly out the door. I'm currently finishing up the Open Type version with has extended language support, and many useful features. Since the previous posts i've revised the italics, added a bold italic (thanks for the push Nick), tab and osf across all weights, monospaced the ornaments and added another ornamet series, and reworked the smallcaps.</p>
      <p>I send a big thank you to the Typophile community for your help and encouragement on this and other projects. Also thank you to Peter Bruhn and the good people at Veer.</p>
      <p>I will post up some other samples here in a few days. Love them inline caps!</p>
      <p>Randy</p>
