      <p>It truly is a wonder to behold. When asked for my favourite font of the moment while I was being interviewed for TypeRadio at TypeCon2005 New York this summer, I simply blurted out: "Eason". With no time to think or rationalise, I suppose this is what I really felt in my heart.</p>
      <p>(I know, it wasn't released yet, but I had the privilege to review an advance copy for the Typographer.org booklet, so I did know what I was talking about.)</p>
