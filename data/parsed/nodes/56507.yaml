    <p>Mr J Hoefler clearly <a href="http://www.typography.com/ask/showBlog.php?blogID=91" rel="nofollow">does not approve</a>, however the typographic community has <a href="http://www.museumofhoaxes.com/hoax/Hoaxipedia/San_Serriffe/" rel="nofollow">standards to uphold</a>. I do not know if we are able to meet them, but try we must. Tradition in typography is important.</p>
    <p>Discuss.</p>
