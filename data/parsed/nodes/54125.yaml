  - id: 325590
    user: 39290
    date: 2009-01-28T19:49:00
    date_raw: 28 Jan 2009 — 7:49pm
    votes: null
    html: <p>I didn't read them as birds to begin with not till I saw the comment. I don't think that the top logo with the huge k e r n i n g is that effective. You have high kerning in everything. Tighten up the letters in nicole brown. Also, I don't know if I would go with both of those n's. I like one because it is unique two makes it look repetitive and they are not quite the same so its a little weird. I would also make the rings just a tad thicker than what they are (I don't feel like they would communicate in a 1inch x 1inch space like a good logo should.</p>
