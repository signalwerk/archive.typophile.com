    <p>I'm currently working with a wedding photographer to develop a wordmark, logo (to be used primarily as a watermark), and business card.</p>
    <p>I've attached the wordmark and logo for critique. The client loved the wordmark and has approved it, but I would still like to hear your thoughts.</p>
    <p>I'm new here and hope to post more work in the future. Thanks for your feedback.</p>
