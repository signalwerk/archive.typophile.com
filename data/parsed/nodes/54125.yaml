    html: |-
      <p>thanks for the comments.</p>
      <p>I agree about the rings, they should be a bit thicker. Interesting note about the kerning; the 'nicole brown' is kerned very little, if at all. The typeface (Novarese) is naturally loose, and that coupled with the modified 'o' could be leaving things looking too spaced out.</p>
