    html: <p>Are you referring to the birds? I'm not sure how I feel about them, but the client is pretty adamant that they be included. I think it is a decent idea in theory, I just hope it doesn't look corny. Perhaps one should be a bit smaller, like the rings in the wordmark.</p>
