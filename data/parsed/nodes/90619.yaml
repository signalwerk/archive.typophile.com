    <p>Is it okee dokee that I suggest a typographic type battle?</p>
    <p>It is!?! </p>
    <p>Awesome!</p>
    <p>Typography on an Easter Egg! Otherwise known as Easter Egg Typography or EET. Whether it be TEE or EET, this awesome challenge has two categories!! Typography drawn directly on a whole egg shell just like traditional Easter Egg decorating (except now you buy plastic egg shells and they will be accepted in this challenge too) - or - typography drawn in the form of an Easter Egg. Either one is totally awesome!! Bonus points if you can submit both :)!!</p>
    <p>The Typophile powers that be will have to sign off on this awesome type battle, but here are the details copy/pasted the Type Battle Forum...</p>
    <p>// REQUIREMENTS</p>
    <p>- Image size: 550 width x 400 height. 72 dpi<br>
    - Color: Any<br>
    - Format: JPG or PNG</p>
    <p>I suggest a nice long timeline starting NOW and ending 11:59:59 PM PST, April 8th 2012.</p>
    <p>???</p>
