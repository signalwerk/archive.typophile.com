      <p>I appreciate your comment darkwolf29a1. We've had to set the bar a little high hoping we get someone at least qualified, because a lot of people seem to consider themselves designers because their degree says so.  </p>
      <p>This internship involves working on a variety of projects that may be considered a little more exciting than some environments, and at the end of two years should produce a decent real-world portfolio.  And finally, we're looking for the sort of person who cares about what we're doing.  This is a Christian ministry in the heart of Purdue University.  There's are people out there who, not only want to be designers, but want get behind a non-profit and what it stands for.  In other words, it isn't just about the salary or notoriety, but what they're producing at the end of the day.  We've had plenty of people apply, but it just hasn't seemed like the best fit.  I've already received a few more applicants since posting this, which is encouraging.</p>
