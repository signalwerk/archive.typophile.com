      <p>Had I seen a copy of the Golden Encyclopedia, I would probably have just ignored the typeface, assuming the book to have been in a typeface I never saw before because of being printed in Hungary or somewhere like that to save money.</p>
      <p>It is a beautiful typeface, but I can also understand why it was not successful. The italic looks particularly bad in the absence of any kerning. I would suspect the rights to digitize the face belong to Monotype, and, were they to do so, since a digital version would be properly kerned, the face would have a chance of achieving its potential - basically, as competition to Palatino; an oldstyle typeface comparable to Bembo or Caslon, but with a very modern design sensibility in some areas, such as the serif at the bottom of the lowercase y.</p>
      <p>The fact that it has "hybrid numerals" - like those in Microsoft's Georgia - is interesting. I had not known that there were legitimate examples of this; although it's certainly useful in avoiding confusion for modern readers, some people will react to a 1 that doesn't look like an I in non-ranging numerals as an indication of typographic illiteracy - instead of simply a creative and original touch. As I noted in the thread on Al Gore, though, people are familiar with hybrid numerals in typewriter faces.</p>
      <p>Thus, if hybrid numerals were hybridized a second way - so that while certain digits did extend below the baseline, or above the digit height, they did so by small amounts, and the numeral height was only slightly less than the cap height - then the ranging-style 1 would be perceived as normal.</p>
    html_clean: |-
