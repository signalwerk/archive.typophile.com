    html: |-
      <p>I can guess <em>one</em> reason they might have chosen to use Plantin for the <em>all caps</em> headings of the entries in the encyclopedia.</p>
      <p>They may have even partly chosen Emerson for its "hybrid" numerals, having the charm of old-style numerals while not being confusing to the younger readers of the encyclopedia.</p>
      <p>However, Emerson does share one important attribute with Perpetua: the upper-case U looks like a lower-case U, having a tail. Plantin, as your image illustrates, doesn't. So they may have picked it to avoid something confusing to younger readers.</p>
      <p>It could also be, however, that Plantin was simply part of the Golden Books visual identity for some of their covers.</p>
      <p>Oh, I've just thought of a simpler reason. When Monotype obtained permission to make a version of Spiral, they added an italic. But the accounts of that I've seen never mentioned them adding a <strong>bold</strong>. So, once they decided to use Emerson, but they wanted to begin entries with their names in bold, they had to use another face just to <em>get</em> a bold.</p>
