    <p>May 12, 2008,Tipo released Overlock, a font designed by Darío Muhafara. Seven styles in OTF format.<br>
    Know more about it at <a href="http://www.tipo.net.ar/overlock" title="www.tipo.net.ar/overlock">www.tipo.net.ar/overlock</a></p>
    <p>Eduardo Tunni</p>
