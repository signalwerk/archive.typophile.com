      <p>The first version definitely does have too much going on. I don't think it works.</p>
      <p>The second version is better, but still looks too busy to me. I don't know if the "Sh" has to be connected to the "oo", or even if the "oo" needs to be connected to the swoosh.</p>
      <p>I'd say simplify it. Pick one element that you think works best, and focus on that, whether it's the ball with the swoosh, or the goal, or something else.</p>
      <p> - Lex</p>
