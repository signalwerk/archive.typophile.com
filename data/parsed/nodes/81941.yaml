    <p>This is my first post on this forum. I am a graphic design student working towards branding a local museum. </p>
    <p>When creating an identity for a gallery or museum what are some things that I should consider for the direction of the branding? I guess I am just struggling with the branding process and where to start when I really do not have anything to go off of. The goal is to create a strong, transparent identity that is open to the vast styles of art that is show in the museum.</p>
