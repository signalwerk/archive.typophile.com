      <p>Use some cloud brushes - there's some great ones <a href="http://share.studio.adobe.com/axQuickSearchSubmit.asp?txt=clouds&amp;allprods=2&amp;submit1.x=32&amp;submit1.y=8" rel="nofollow">here.</a><br>
      Then mask the layer with a font you like.<br>
      Then gaussian blur the mask to soften it a little and use soft brushes in the mask to make some irregularities…</p>
