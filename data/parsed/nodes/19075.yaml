    html: <p>You haven't a clue about sky writing its not a continious line like the old biplanes. What they do is make a series of dashes that form letters as they fly. An example would be an I being created from four verticle dashes with space in between each. A N would be the same four verticle dashes but with one dash after it at the number 2 level and another at the number 3 level then 4 more dashes. I will see If I can find an example I made a number of years ago in Photoshop.</p>
