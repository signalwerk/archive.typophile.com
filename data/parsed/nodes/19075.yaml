    <p>Hi, I'm looking for a simple dotted font that could work for skywriting. I've tried in Photoshop to make dots over a template but I'm wearing out. I've googled and searched this site. I'm attaching one attempt at using a stripey font (Labtop Tartan--not one of your more elegant fonts...) but I'm not impressed.</p>
    <p>Thanks--I'm new to this site but I've loved fonts for 30 years--I knew typography was a profession but I didn't know it was such an official obsession. </p><div class="imageWrap"><img src="http://typophile.com/files/bluesky.jpg"></div><p></p>
