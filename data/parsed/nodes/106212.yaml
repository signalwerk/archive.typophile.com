    <p>Hi</p>
    <p>I'd like to introduce you to a brand new type design software<br>
    <a href="http://www.fontark.net" title="www.fontark.net">www.fontark.net</a></p>
    <p>It features for the first time a simple method of synchronizing glyphs and enables real time multi-glyph editing.</p>
    <p>It's a browser based software so no installation required</p>
    <p>I'm very interested interested in your opinion about it</p>
