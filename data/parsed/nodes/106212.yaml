      <p>I think this project has potential. It's not common to see this kind of iniciative on web environments. I tested it a little bit and those are my firsts impressions:</p>
      <p>Right now the app has some performance issues (maybe my fault because im on a old machine), and is also difficult to edit the nodes with the cursor. The smart multi-editing is quiet nice though. Would be great to have more control over the actual stroke (and not just the skeleton) but for basic geometric typefaces and prototyping this is really nice.</p>
      <p>Congratulations, keep doing good work!</p>
