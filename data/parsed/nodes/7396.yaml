    html: "<p>&gt; what font you use it is crystal clear, that's <br>&gt; because it has not been converted to flash <br> <br>Nope, that's exactly how it looks in Flash. <br>Because it's made to work just right in Flash. <br> <br>&gt; How do I set it to 8pt <br> <br>In the box next to \"Sui Generis\", choose 8 instead of 10. <br>HOWEVER: Sui Generis has to be a pixelfont, and one that's made to \"snap in place\" at 8 pt. Is it? <br> <br>All the Ultrafonts snap at 8 pt. <br>Try it with Silkscreen. <br> <br>-- <br> <br>The degradation you're describing when you output an actual Flash movie does happen with \"normal\" outline fonts (not pixelfonts), although it's actually pretty faint: what you're seeing instead is mostly resolution limits wreaking havoc on letterform fidelity. Like you suggested earlier, it's a bit like \"mixing oil and water\". But grayscale pixelfonts give the best possible results. <br> <br>hhp</p>"
    html_clean: "<p>&gt; what font you use it is crystal clear, that's <br>&gt; because it has not been converted to flash <br> <br>Nope, that's exactly how it looks in Flash. <br>Because it's made to work just right in Flash. <br> <br>&gt; How do I set it to 8pt <br> <br>In the box next to \"Sui Generis\", choose 8 instead of 10. <br>HOWEVER: Sui Generis has to be a pixelfont, and one that's made to \"snap in place\" at 8 pt. Is it? <br> <br>All the Ultrafonts snap at 8 pt. <br>Try it with Silkscreen. <br> <br>-- <br> <br>The degradation you're describing when you output an actual Flash movie does happen with \"normal\" outline fonts (not pixelfonts), although it's actually pretty faint: what you're seeing instead is mostly resolution limits wreaking havoc on letterform fidelity. Like you suggested earlier, it's a bit like \"mixing oil and water\". But grayscale pixelfonts give the best possible results. <br> <br>hhp</p>"
