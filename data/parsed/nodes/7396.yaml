    html: "<p>Don, for small-to-medium text in Flash there's only one way you can get the most of the screen: grayscale pixelfonts. And by far the best to get them is Ultrafonts. <br> <br>Besides Miguel's Odyssey (Bold or Black in this case), you can really push the limits of handcrafted grayscale text with my Mana, which however is currently too big for setting what you showed. The good news is that the 11 point version is almost ready*. The Mana fonts are pretty narrow, which can be both good and bad, but it uses generous letterspacing to greatly increase readability. Plus the different sizes are visually highly compatible, allowing for \"total\" screen typography. <br> <br>* <br>Here's a quick preview of the Bold for you: <br><img src=\"http://www.typophile.com/forums/messages/30/52335.gif\" alt=\"Nascar\"> <br> <br>hhp</p>"
