    html: <p>Don, I don't know what to tell you - there's some incorrect setting on your end. Many people use pixelfonts (b&amp;w or grayscale) just fine and it doesn't blur (when set correctly). The Ultrafonts site is Flash itself, and you can see everything works fine in there. Maybe read the User Guide on the Ultrafonts site? I know, I know, reading a manual when you're frustrated is not easy.  :-/ <br> <br>Note that <i>everything</i> in your "text box" has to be in integer pixels for a pixelfont to snap. Like if you have a line of 13.7 Arial on the first line and then a pixelfont below it, it'll blur. Another thing I noticed is that you have Bold checked - try turning that off. It actually works with Mana, but from what I understand most pixelfonts put their weights under different entries. <br> <br>Don't fret, once you get the hang of it you'll relish the big quality increase. <br> <br>hhp</p>
