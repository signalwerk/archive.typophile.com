  html: <p>Hi <br> <br>Mike from bowfinprintworks.com who helps out here <br>and was kind enough to point me to this forum, his words were these folks know fonts <br>  <br>I am looking for a better font to use in my Flash charts. I have tried just about every type of font there is and am unable to find one that will give me that sharp detail, the Sui Generis in the chart below is one of the best I have found, The title is size 12 Bold, the names on the left are size 10 bold and the numbers are Swis 721 Blk BT size 10 Bold, the best I have found for numbers. <br>There is no way to adjust the X &amp; Y axes in the Flash Chart program. <br>I have also tried Fonts designed for Flash but with no better results. <br>The Chart tech support suggest using very large fonts and decrease the size in the software. <br> <br>I guess its a little like mixing oil and water <br>using fonts not designed from lines which is the way flash is. <br> <br><a href="http://www.theinsidegroove.com/charts/year_stats/special/nascar-driver-season-top-20.php" target="_blank">http://www.theinsidegroove.com/charts/year_stats/special/nascar-driver-season-top-20.php</a> <br> <br>Our main stats page with over 700 charts <br> <br><a href="http://www.theinsidegroove.com/nascar-winston-nextel-cup-driver-stats-statistics-charts.php" target="_blank">http://www.theinsidegroove.com/nascar-winston-nextel-cup-driver-stats-statistics-charts.php</a> <br> <br>Thanks  <br>Don Miller</p>
