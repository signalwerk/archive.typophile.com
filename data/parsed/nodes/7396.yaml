    html: <p>Because you are using a third party application to produce your charts, I don't think you'll be able to get the control you need over the exact pixel placement of the textfield.  <br> <br>This means that you can't ensure that your pixel font is on a whole pixel (eg. 2 rather than 2.3). So, even if you correctly use the right font size, you'll still get blurry characters. <br> <br>Sorry for the bad news.</p>
