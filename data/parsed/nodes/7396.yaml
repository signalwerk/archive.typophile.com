    html: <p>Don, I can tell from that test that you're simply using the wrong point size. A pixelfont has to be set at a single given point size (at a certain dpi) to work. UPFs are pixelfonts - and they need to be set at 8 point (no matter how many vertical pixels the font spans). <br> <br>If you're still unconvinced by the Ultrafonts site (or my sample), you can choose a font and go into "Sample", and set your own text. In this case I guess you'd also screen-grab then reverse-field it, which however brings up the possible need for gamma correction*. So don't despair, I think you're almost there.  :-) <br> <br>* Note that Mana comes with two versions (for each size &amp; weight), one for positive setting, and another for higher-quality negative setting. The latter version can also be used as a native Windows font (like in a word processor) to great effect. <br> <br>hhp</p>
    html_clean: <p>Don, I can tell from that test that you're simply using the wrong point size. A pixelfont has to be set at a single given point size (at a certain dpi) to work. UPFs are pixelfonts - and they need to be set at 8 point (no matter how many vertical pixels the font spans). <br> <br>If you're still unconvinced by the Ultrafonts site (or my sample), you can choose a font and go into "Sample", and set your own text. In this case I guess you'd also screen-grab then reverse-field it, which however brings up the possible need for gamma correction*. So don't despair, I think you're almost there.  :-) <br> <br>* Note that Mana comes with two versions (for each size &amp; weight), one for positive setting, and another for higher-quality negative setting. The latter version can also be used as a native Windows font (like in a word processor) to great effect. <br> <br>hhp</p>
