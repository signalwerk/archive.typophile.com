    html: "<p>The font you choose depends on a few things, including the importance of legibility versus style. <br> <br>It's conceivable that many people will be looking for their favorite racer, and since your tables have a lot of entries, you might like to facilitate that by having a font that makes it easy to scan-and-find names quickly. This means a font with: structures that people are used to seeing (considering that most reading is done in print where fonts have a certain \"traditional\" look), so for example having a \"y\" with diagonal arms helps; sufficient interletter spacing (which is actually where most pixelfonts fail); and capital letters that have some presence (since this is all about proper names). <br> <br>Very tight and \"geometric\" pixelfonts are great for buttons and short headings, but not reading tasks that are performance-based. You don't race a Miata on a oval, dude.  :-) <br> <br>hhp</p>"
    html_clean: "<p>The font you choose depends on a few things, including the importance of legibility versus style. <br> <br>It's conceivable that many people will be looking for their favorite racer, and since your tables have a lot of entries, you might like to facilitate that by having a font that makes it easy to scan-and-find names quickly. This means a font with: structures that people are used to seeing (considering that most reading is done in print where fonts have a certain \"traditional\" look), so for example having a \"y\" with diagonal arms helps; sufficient interletter spacing (which is actually where most pixelfonts fail); and capital letters that have some presence (since this is all about proper names). <br> <br>Very tight and \"geometric\" pixelfonts are great for buttons and short headings, but not reading tasks that are performance-based. You don't race a Miata on a oval, dude.  :-) <br> <br>hhp</p>"
