    html: |-
      <p>URW’s Danmark is actually a pretty good match for the overall letter shapes/proportions—with a little manual condensing:</p>
      <p><a href="http://www.myfonts.com/fonts/urw/danmark/" title="http://www.myfonts.com/fonts/urw/danmark/">http://www.myfonts.com/fonts/urw/danmark/</a></p>
      <p>Thicken the crossbar and refine the serifs on the |H|, add serifs to each |s|, and add a ball finial to the tail of the |y|, and you are pretty close.</p>
      <p>Agree with Ryuk about Times New Roman for |COGNAC|—a little artificial widening, and it is a better than 95% match.</p>
      <p>Nimbus Roman by URW is a close second:<br>
      <a href="http://www.myfonts.com/fonts/urw/nimbus-roman/" title="http://www.myfonts.com/fonts/urw/nimbus-roman/">http://www.myfonts.com/fonts/urw/nimbus-roman/</a></p>
      <p>For the script face, Ballantines Script by Elsner+Flake is good for everything except the initial caps:<br>
      <a href="http://www.myfonts.com/fonts/ef/ballantines-script/" title="http://www.myfonts.com/fonts/ef/ballantines-script/">http://www.myfonts.com/fonts/ef/ballantines-script/</a></p>
      <p>Novia isn’t bad, either:<br>
      <a href="http://www.myfonts.com/fonts/fontbureau/novia/" title="http://www.myfonts.com/fonts/fontbureau/novia/">http://www.myfonts.com/fonts/fontbureau/novia/</a></p>
