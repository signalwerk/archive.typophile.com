      <p>Sounds probably "lazy" but to me a slightly edited <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/times-new-roman" rel="nofollow">Times New Roman</a> might work for 'Hennessy' and 'COGNAC' mainly squooshing it and curving top /n serif. <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/starling" rel="nofollow">Starling</a> FB might be a good option to consider too.<br>
      No match for the script. Some close: <a class="freelinking external" href="http://www.myfonts.com/search/Englische+Schreibschrift" rel="nofollow">Englische Schreibschrift</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/profonts/symphony-pro" rel="nofollow">Symphony</a>, <a class="freelinking external" href="http://www.myfonts.com/search/english+157" rel="nofollow">English 157</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/profonts/sonata-pro" rel="nofollow">Sonata</a><br>
      BTW, this logo is freely available to download as vector <a class="freelinking external" href="http://www.brandsoftheworld.com/search/logo?search_api_views_fulltext=hennessy" rel="nofollow">here</a>.</p>
