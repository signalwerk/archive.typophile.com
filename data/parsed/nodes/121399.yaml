      <p>Sounds probably "lazy" but to me a slightly edited <a href="http://www.myfonts.com/fonts/adobe/times-new-roman" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Times New Roman</a> might work for 'Hennessy' and 'COGNAC' mainly squooshing it and curving top /n serif. <a href="http://www.myfonts.com/fonts/fontbureau/starling" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Starling</a> FB might be a good option to consider too.<br>
      No match for the script. Some close: <a href="http://www.myfonts.com/search/Englische+Schreibschrift" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Englische Schreibschrift</a>, <a href="http://www.myfonts.com/fonts/profonts/symphony-pro" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Symphony</a>, <a href="http://www.myfonts.com/search/english+157" title="Click to visit an external URL." class="freelink freelink-external freelink-external">English 157</a>, <a href="http://www.myfonts.com/fonts/profonts/sonata-pro" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sonata</a><br>
      BTW, this logo is freely available to download as vector <a href="http://here" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://here</a>.</p>
