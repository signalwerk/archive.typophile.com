    <p>This forum is aimed at discussing both Biblical &amp; Modern <a href="/wiki/Hebrew" class="freelinking" rel="nofollow">Hebrew</a>. So, roll up your sleeves and be prepared to talk, share, and ask anything  and everything about  type design, typography, lettering, cantillation, grammar, culture &amp; history.  Please respect other  members' opinions even if you don't agree with them.  Don't hijack other threads,  there's room for  everyone so  start your own thread. And please do not post links, works or fonts that smell of  plagiarism.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HebrewSample_4955.gif"></div><p></p>
    <p>We hope you will stay and participate. Please observe courtesy at all times. This is a community, so please help make it a pleasant and welcoming environment. Offensive or insulting comments will be brought to the attention of the Typophile moderators.</p>
    <p><a href="http://typophile.com/node/18067" rel="nofollow">A guide to uploading graphics can be found here.</a> Please note the only way to add a PDF is to edit the original thread and use the import options available.</p>
    <p><a href="http://typophile.com/node/add/forum/373" rel="nofollow">Start a new thread and begin your discussion.</a></p>
