    <p>I have been put in charge of the MS Sharepoint server at work, and they want it redesigned.  I found a really great blog posting <a class="freelinking external" href="http://cameronmoll.com/archives/2007/05/skinning_ms_sharepoint_with_st/" rel="nofollow">http://cameronmoll.com/archives/2007/05/skinning_ms_sharepoint_with_st/</a> that has an amazing(ly small picture of a) redesign.  For those of you that may be interested I will post my progress here in the blog.  </p>
    <p>Status - Installed and working for multiple users. No mean feat!</p>
