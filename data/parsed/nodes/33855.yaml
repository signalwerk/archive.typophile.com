      <p>&gt;some of the larger sizes</p>
      <p>This variation in serif shape may be partly a feature of Dutch type. </p>
      <p>I don't know original examples of Van Dijck's work, but in Caslon's, which was influenced by it, there is a variation with optical size. </p>
      <p>In smaller sizes the serifs are a bit variable: sometimes straight, sometimes somewhat slanted. In the very large large size caps Caslon gave the caps bracketed serifs, and much higher contrast. These forms are the basis of Caslon 540 and Matthew Carter's Big Caslon. In both these revivals, the both the  caps and lower case have bracketed, or curved serifs, as opposed to wedges. </p>
      <p>Looking at James Mosley's reprint of Caslon's 1766 specimen book, I only see one example of a lower case serif on the biggest sizes, but it it is straight, and unbracketed, like Christian's Fleishman sample, while the caps have bracketed, high contrast serifs.  </p>
      <p>In all the sizes of Caslon, the vertical serifs on the CEFGST are wedges or softened wedges.</p>
