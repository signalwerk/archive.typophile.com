      <p>Hrant, no. I worked from a small specimen from 1930. The cover says "Joh. Enschedé en Zonen, A Selection of Types" and the half-title page reads: "A selection of types from six centuries in use at the office of Joh. Enschedé en Zonen at Haarlem, Holland, Printed &amp; Issued in the year MDCCCCXXX". The title page is in Latin. It's a little heavy on van Krimpen's work, considering they had six centuries worth of stuff to show - van Dijck just gets four pages, one of italic and three of fraktur, while Lutetia is shown in a large range of sizes - but it's a great little book and I don't think it's particularly rare or expensive.</p>
      <p>Apologies to Mili for hijacking the thread to geek out about specimen books.</p>
