      <p>&gt;Van Dijk fonts were long lost</p>
      <p>I googled to find the story, and was somewhat shocked that the whole of book Dutch Type is on line at google.books [low res]. According to Mittendorp, only one italic physically survived, and that was the basis of the request to Jan van Krimpen to produce a roman for it, which became Romanée.</p>
      <p>However, the Van Dijck specimen sheets exist, and these evidently are the basis of the DTL revival by Gerard Daniels, called Elzevir. </p>
      <p>I can't tell much on the low-res image on Google Books, but it seems that the large size font, 'Ascendonica Roman' is like the Caslon Four Lines Pica in having bracketed serifs on caps and unbracketed on lower case--but not consistently. The DTL Elzevir has bracketed serifs on both upper and lower case. </p>
      <p>It does seem that Christian is the first one to make this variation in serifs--which seems to hold for large sizes in 17th Century Dutch type--a general rule within a font family.</p>
    html_clean: |-
