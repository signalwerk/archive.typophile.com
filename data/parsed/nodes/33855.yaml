      <p>Mili, I did write a bit about this on my site, but looking at it again, I can see how there might still be some question:</p>
      <p>"His [Fleischman's] serifs are an odd mix of wedge-shaped and rectangular, as dictated by where the characters needed additional weight. "</p>
      <p>I certainly can't credit myself with any kind of innovation here. When I looked at some of the larger sizes of Fleishman's Roman, particularly No. 68, in an excellent little specimen that Enschede put out for one important anniversary or another in the early 20th century (sorry, I can't seem to find the specimen right now, or I'd give you the name), the cap serifs seemed to have some taper, and the lc serifs seemed to be flat. I may have been wrong, but it seemed to work in the early version of Farnham, so I kept it. Flattening out the serifs on the caps made them look weak and bland to me, especially with the tapered thins on E F M N etc.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FleischRom68_3615.gif"></div><p></p>
      <p>Incidentally, Sports Illustrated didn't like the mix of serif forms, so they hired me to redraw the lc serifs with the wedge form for their 2005 redesign. I think it looks okay, but i think it's less interesting than the mix, which is probably a good thing - in SI, photography is the main focus.</p>
