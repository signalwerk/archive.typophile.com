      <p>Tiffany, I think Mili is talking about caps vs lower case in one font. </p>
      <p>The caps do indeed have slanted serifs, and the lower case flat. Farnham was inspired partly by Fleishman. If you look at DTL Fleishman, the most faithful revival, it has flat serifs on both upper and lower case. Mercury, by Hoefler and Frere Jones  is also inspired partly by Fleishman, and there both upper and lower case have slightly angled serifs. </p>
      <p>So this decision to have upper and lowers case different in Farnham is Christian Schwartz's innovation, it seems. </p>
      <p>Edit: I just checked the Jaspert Encyclopedia and the Enschede metal Fleishman there, which I think is the original, has flat serifs, like the DTL digital version.</p>
