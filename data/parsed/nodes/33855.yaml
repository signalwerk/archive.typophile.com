  html: <p>I just spotted <a href="/wiki/Farnham" class="freelinking" rel="nofollow">Farnham</a> (Display, probably) used in headlines in a Finnish newspaper's travel special. To my shame this is actually first time I've seen it properly, and noticed, that the serifs are different in caps and lc. The caps ones are slanted and lc are straight, which is quite interesting. Is this typical for a certain style and are there other fonts like that?</p>
