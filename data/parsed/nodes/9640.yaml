    date: null
    date_raw: null
    votes: null
    html: <p>I think you're certainly right that culture is a huge factor - for example certain Thai forms look decidedly evil to me even when they're actually <i>divine</i> for Thais! But there are also physicaly realities that all people share (since we're all human animals after all). For example that sharp things hurt. And that an upper overbite is sinister (picture an eagle's beak) while a lower overbite is carnal (think of an ape's snout). I've used things like this in my Daam Entity. <br> <br>BTW, drop the salutation and surname, habeebi!  :-) <br> <br>hhp</p>
