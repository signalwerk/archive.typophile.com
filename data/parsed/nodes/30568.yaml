  html: |-
    <p>Hey people,</p>
    <p>I've been working on the digitization of a wooden typeface for a while now.<br>
    I got the woodtype from my father, who in turn bought it some 15 odd years ago from a printer that was closing it's shop.<br>
    The woodtype is not complete; so I had to design some of the characters from scratch. I first set and printed the type, and then scanned and traced the characters by hand in Illustrator and Fontlab.</p>
    <p>I would like to have some critique and suggestions. Although, since I have tried to stay mostly true to the woodtype, I don't want to change a great deal of the character shapes themselves.</p>
    <p>The following characters were available in wood;<br>
    - The whole lowercase alphabet,<br>
    - The uppercase alphabet, except D and Q (made those),<br>
    - The question mark (although I did change it a bit),<br>
    - The numerals, except for 2 and 4, which were available in a less narrow, smaller pointsize version of the woodtype I also have. Working on digitization of that one as well. I changed those numerals to match size, narrowness and weight.</p>
    <p>I designed and added the rest, like the diacritics, interpunction, monetary signs, ligatures, the @, plus/minus, etc.<br>
    These characters are open to suggestion. I'm still working on the ampersand.<br>
    There are still some bézier-curve inconsistencies here and there, I'm going to smoothen everything out later. Kerning is also on it's way, I have about 550 pairs already.</p>
    <p>I own more woodtype, which I also plan to digitize, if they do not already exist.<br>
    Please keep in mind this is the first step into digital typeface design I've made.</p>
    <p>Thanks!</p>
