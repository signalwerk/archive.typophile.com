      <p>Fernando: your English is good enough. It's not my native tongue either.<br>
      Anyway, to reply to your comment; I agree, the 'a' is quite different, although that curve is also in the 'g' and in a couple of other characters. I thought about changing it when I was digitizing it, but I decided I wanted to stay true to the woodtype I had printed. But maybe I might give it a try, and add it as an alternate.</p>
      <p>Antonio: Thanks for the compliment. Photos of the printed version of that specimen (which is 29x29 cm by the way) are on my site as well. But since I have a flash-site, I can't specify a direct link (which is why I sort of hate flash sites, eventhough I made it myself). But it's in the 'Print' section, on the top. I say this because in the PDF you can't see the embossed and spot-varnished parts of the physical specimen. Which were the most fun to make, with photopolymer plates and such. :)</p>
