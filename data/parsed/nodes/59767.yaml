      <p>The reason Appleworks can fake it under OSX is because it's a Carbon app, based on the old Mac (pre-OS X) application programing interface (API). Carbon was a workaround devised by Apple to make sure there were lots of apps for OS X when it was first launched. Older programs could be updated to work with OS X by simply recompiling to Carbon, instead of starting over from scratch. </p>
      <p>Pages is built with Cocoa, the "native" OS X API, which generally doesn't do fake type effects. You can tell when an app is Cocoa-based if it includes the system-wide "Fonts" window for choosing fonts, as in Pages.</p>
