      <p>You could get an effect similar to a pixel shift in Pages by using the shadow effect in the Font window. Set the angle to 0°, drag the opacity to 100%, and the blur to 0. Then adjust the offset as needed. The resulting effect could be set up as a style, or you could redefine the "Emphasis" style using this psuedo-pixel-shift effect. It works okay if you save as PDF for viewing on-screen, but has a double-strike appearance if you print it on a laser printer.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PagesScreenSnapz001_5519.png"></div><p></p>
