    <p>Can anybody please help? I have written 3 books for screen reading using  Geneva as my preferred font, originally on OS9, later in OSX but in Appleworks 6. That program allows Geneva as a screen font, and enables Bold / bold italic as options. </p>
    <p>Now I'm trying to export this as a DTP layout into Pages, and find that Bold Geneva does not exist in the OS, and that, somehow, these more modern programs refuse to 'fake' it. Am I missing something? Did Bold Geneva exist under OS9? (Of course my Intel Mini refuses anything to do with OS9.)</p>
    <p>How then is it possible for Appleworks to fake it under OSX, but no other program? </p>
    <p>I know that I could reset the whole 90 chapters in Verdana etc., but I have always preferred 12 pt. Geneva for simplicity of reading.</p>
    <p>I have failed to find any way of downloading a Bold (etc.) suitcase.</p>
    <p>Help please.</p>
    <p>Thanks GS</p>
    <p><a href="mailto:gs@topartists.co.uk">gs@topartists.co.uk</a></p>
