      <p>You know I don't go for the "rhythm" stuff. Plus I don't think the eye (here meaning our core perception/cognition mechanisms) needs to be kept "interested": I think the eye is a grunt, a (domesticated) animal - it does what it's told, bullishly. Instead of your balance between contrast and regularity (which can be said to be the "classical" view) I would offer the duality of bouma decipherment versus the need to flow through a text - if you get my drift.</p>
      <p>&gt; distinguish glyphs from each other</p>
      <p>Not glyphs, boumas.</p>
      <p>&gt; stronger than usual cues which would wreck a conventional<br>
      &gt; typeface could perhaps be better tolerated or even leveraged<br>
      &gt; for better readability if their form could be contextually<br>
      &gt; met &amp; balanced by the next glyph.</p>
      <p>I agree.<br>
      Keep giving readers due credit in spite of themselves.</p>
      <p>hhp</p>
