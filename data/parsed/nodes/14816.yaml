      <p>Thanks for starting this thread! I don't know that I am correct about this notan/type idea, but intuitively it seemed strange to me to talk about notan completely outside of the context of the caligraphic process that gave rise to the term. </p>
      <p>I have thought a tiny bit more about this since I wrote about this. Some of this is probably obvious but...</p>
      <p>As Spiekermann &amp; Smeijers remind us, type needs to serve a purpose - or put another way, it has to be grounded in a context. Context is partly use - In this case we are talking about a text face. But it is also the environment/technology in which the face is used. </p>
      <p>For example, to be successful a text face that used this idea/technique would probably have to used in a very high rez envirnoment like paper or film - as opposed to a computer screen. I think the subtle shifting implied by a caligraphic kind of adjustment/replacement would tend to look overly blurry on screen except at pretty large sizes. So a font using this approach would have to be targeted at appropriate use. But this is a pretty small issue in a way.</p>
      <p>The most serious reasons that doing this would be quite hard are: </p>
      <p>- First, it will be difficult to integrate what is done almost reflexively and without much analytic process by a caligrapher 'in the moment' to what has been a comparatively analytic and much slower process of font design. The two processes are like different kinds of personality. The person who successfuly makes 'contextual replacement based notanic text faces' ( how is that for jargon?)  will probably have to have to be sympathetic/sensitive to both the slow &amp; the fast kinds of creative process'. It might even take a team of two or more people to get both kinds of skills and insight. </p>
      <p>- Secondly, and maybe more difficult, our text face culture has for a long time developed a fine sense of what is possible, beautiful and fuctional in the context of a stable set of design options and limitations. Even massive technological change from metal to photo &amp; then to computer type has not shifted the idea that there is one shape for an 'a' in the font. </p>
      <p>Our whole idea of what a text face is ( and our whole text face culture ) is based on superb adaption to these limitations. To throw off the idea of a single a ( or maybe 3 to 5 of them for point sizes ) is to throw out a basic tenant of text face design that begins with gutenberg. This is no small mental leap - like that of kerning pairs. It would be a fundamental shift in culture.</p>
      <p>The exception proves the point - we have gone backwards in many cases because type designs are mostly not made specifically for a given pt. size any more - a kind of hold over of caligraphic awareness now mostly discarded. To have a more complete kind of progress we would idealy have contextual substitution for text size as well.</p>
      <p>- Third, The work load imposed by this kind of change is enormous. It is this core simplicity that made the shift from scribe to type such a big advantage. For example, assume you made a single weight and the letter 'a' required mere 5 variations in shape &amp; kerning, add to this for the sake of purity some pt size variations. Say 5 of them. Now we have 25 'a's. Now make a bold &amp; a thin and their italics. 6x25 is 300. Small caps? Double it - 600. Numerical variations don't concern us yet. And that is for what was formerly one glyph, or with the weights &amp; so on : 40 glyphs. 40 to 600 is big change. I have a feeling I am underselling the complexity of this by a factor of 2x to 4x. But the point is it would be a hell of a lot of work. </p>
      <p>- Fourth and finally, the slowest kind of change we see in the font world is that of text types. Some have blamed the conservatism of users/editors/reader. Whatever the reason, or the rightness or wrongness of this the text face made in this way would have to face a notoriously tough audience.</p>
      <p>I still love the idea anyway.</p>
      <p>BTW - When I wrote "When I look at your logo work I see a lot of that contextual sensitivity. That is one of the things that deeply impressed me about your work." I was writting to Mark Simonson. Here is an example of what I think of as Mark's sensitive and contextual letter/word design.</p>
      <p><a href="http://www.ms-studio.com/Lettering/Resources/baseballbig.gif" title="http://www.ms-studio.com/Lettering/Resources/baseballbig.gif">http://www.ms-studio.com/Lettering/Resources/baseballbig.gif</a></p>
