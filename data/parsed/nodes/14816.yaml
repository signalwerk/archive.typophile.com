      <p>Like positive and negative space, rhythm needs counter-rhythm.  The expected pulse of stroke and counter widths is countered by the variations that the individual glyphs bring to bear and the shape of their adjoining space in interaction. All of these things can build notan and the recognition of pattern broken by the counter pattern glyph pairings make.  It may be that the replacement scheme that Eben seeks to make more harmonious fit and more even color could actually harm pattern recognition and defeat the balance. An r next to a v can be a problem to space compared to an n next to a u but this visual "problem" may actually aid in recognition of the glyph pattern forming notan. I don't know this to be true at all.  I just feel it is as valid a concept to explore as alternate glyph substitution.<br>
      Calligraphers naturally adjust each character to meet its neighbor but I have never seen data that says this aesthetic quality reads better than type without alternate contextual substitution. That would be intriguing research! Compare very fine calligraphy to equal quality typography to see if there are truly advantages in writing over typesetting. I personally doubt it but I have been wrong countless times before :-)</p>
      <p>ChrisL</p>
