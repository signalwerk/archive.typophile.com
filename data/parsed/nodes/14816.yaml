      <p><cite>Overemphasize the role of the white</cite> &amp;<br>
      <cite>how the blacks related, not just the negative space.</cite></p>
      <p>Is that happening? Where? How can you tell? Is anyone Just working with Negative Space? I am still not with you yet except that I am inferring you are saying that the black of the glyph is primary perhaps. Is that your point? If so, then you are against the idea of Notan which does suggest that you consider each issue equally. And certainly considering each aspect with seriousness is what Noordzij encourages as well. I can go dig up a quote if anybody wants me to.</p>
      <p>Which is why I don't see how you can relate Notan either for or against to dazzle. Notan is just about a potential balance occuring despite the overwrought conflated claims of new-age art types. It could be a balance between extremes ( lots of dazzle probably ) or a balance of quiet differences. It's still Notan. And actually from a Notanic perspective you can have a successful balance or not. The presence of Notan isn't predicated on that balance. In other words, visual phenomena don't lack Notan as a result of a lack of balance. Notan is just a way of thinking about what's there.</p>
      <p>Also, Has Noordzij ever talked/writen about Notan by name? If so I would love to read that!</p>
      <p><cite> very constraining frame </cite><br>
      Glyphs have a very constrained theoretical frame. But in litteral or practical use this frame is only implied only. Notan exists inside the theoretical box where the black might go &amp; outside it too. What's more designing glyphs requires thinking ( sorry boys &amp; girls it's cliche time) thinking outside the em square. ;-) Because there is white out there (usually). See what I mean?</p>
      <p>BTW, When I was talking about the frame earlier I was refering to a painting's frame - or the frame of your black box. Neither one is a good example to use for glyphs because the frame is way too tight in comparison. Put another way, I don't think you can compare the notanic relatonship of glyphs &amp; of paintings with each other all that well because the frame on the painting is more defining for that notan than the frame of an em box is. The painting's edge is far far more absolute in almost all cases - except where the painter/sculptor violates this boundry. And in the case of a painting it's surroundings, the color of a room etc effect the Notan of the painting too. The only exception to this that I can think of readily &amp; it is a partial exception; would be a diptych or tryptich where you have two or three painting side by side. Then there is at least a potential relationship.</p>
