      <p>&gt;I don’t see how you can relate Notan either for or against to dazzle</p>
      <p>I thought I was clear, but obviously not. I wrote that "Good notan in text type is generally anti-dazzle." I didn't mean that the balance or influence of white and black on each other--notan--is not operating--it is. I meant what I thought I wrote, which is that if there is dazzle in a text face, particularly the lower case, it is notan operating, but not good notan. In fact 'notan' as seems to be used often to refer just to such assertive white, and I was saying that would be misleading to say we are after that kind of notan in text faces. </p>
      <p>&gt;&gt;Overemphasize the role of the white &amp;<br>
      how the blacks related, not just the negative space.</p>
      <p>&gt;Is that happening? Where? How can you tell? Is anyone Just working with Negative Space? </p>
      <p>Here, from the Wikipedia article on Frutiger, is the locus classicus of this discussion:</p>
      <p>***</p>
      <p>The form of the Yin and yang, perfectly balancing black and white impressed Frutiger...</p>
      <p>[quoting Frutiger]<br>
      “The white surface of the paper is taken to be ‘empty’, an inactive surface, despite the visible structures that are present. With the first appearance of a dot, a line, the empty surface is activated. A part, if only a small part, of the surface is thereby covered. With this procedure, the emptiness becomes white, or light, providing a contrast to the appearance of black. </p>
      <p>"Light is recognizable only in comparison with shadow. The actual procedure in drawing or writing is basically not the addition of black but the removal of light. The sculptor's work also consists essentially of taking something away from the block of stone and in this manner forming it: the final sculpture is what remains of the material” (Rauri, ?) </p>
      <p>A professor of Frutiger's, Alfred Williman said: “Do not apply black but cover up white, so as to make the light of the white sheet active.” (Traces) Frutiger took this as his mantra.</p>
      <p>***</p>
      <p>Frutiger is one of the greatest type designers, and awareness of the influence of white is important, and he was right to emphasize it. </p>
      <p>But the quote from the professor taken literally as a 'mantra' is misleading, as the Noordzij illustration shows. In text faces we want to keep the light as background in text faces, not push it forward. The occassional rare character, such as the italic Caslon ampersand or swash Q, which do have the 'vibration' of whites asserting themselves, add a pinch of spice to a text face (the italic itself appearing occasionally as a complement to the much more readable roman). But in general, contrary to the 'mantra', the whites should stay in the background. </p>
      <p>As to results, there is just better and worse type. I don't know how it was arrived at. What we are talking about here is the heuristic to guide the process of drawing type. I think Noordsij's diagram shows that we shouldn't take Frutiger's teacher literally when we draw type. </p>
      <p>The other part of this which is quite important is the fact that Kindersley was able to get pretty far in spacing issues looking at the black alone.</p>
      <p>But at this point I have to get back to drawing type!</p>
