      <p>Information comes from contrast. Totally even color is pure gray - it's a lack of notan. The trick is carefully limiting contrast* to avoid errant fixations during reading. The rest is just style.</p>
      <p>* Which however is not limited to color. Think for example of how two<br>
      borderline-too-distracting "g"s can come together to in fact become too<br>
      distracting in pattern.</p>
      <p>hhp</p>
