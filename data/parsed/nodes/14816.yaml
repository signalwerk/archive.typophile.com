      <p>Ps. Nick Shinn pointed out to me that sometimes you want more dazzle, particularly in a display face. He explained that he designed <a href="http://shinntype.com/" rel="nofollow" class="link-external">Eunoia</a> to get dazzle from the 'picket fence effect'.</p>
