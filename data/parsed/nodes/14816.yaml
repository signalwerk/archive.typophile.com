      <p>Eben, I wrote "assymetrical balance", and never mentioned symmetry. Few letters are symetrical, and cannot be balanced in that way. I am certainly not equating good notan or good type design with symmetry. </p>
      <p>I am saying that you can overemphasize the role of the white in good type design. You have to look at the blacks. My icon--my drawing of Caslon Pica II italic ampersand--is in reverse, but it's an example. Getting the terminals the right place in space and the right weight so the whole thing balanced was a matter of looking at how the blacks related, not just the negative space. Because of the spirals there is more assertive negative space here than most characters, but still looking at the blacks is key to achieving good balance and color of the letter.  The same for your concern of two characters together that may be awkward--it's not just the negative space but the weight and location of the blacks in relation to each other, and not the shape of the negative space.  </p>
      <p>I'm not saying I understand this stuff. But I am saying that nobody does. And when it is understood my conviction is that the weight and location of blacks will be important, not just relationships of white and black, and the shape of the negative space. </p>
      <p>A few other points:</p>
      <p>Good notan in text type is generally anti-dazzle, as Noordzij points out, because dazzle is fatiguing. And you want to be able to read text for extended periods. If you want to dazzle in display type to get attention, that is fine, but it is restricted to that. </p>
      <p>To me, glyphs do have a very constraining frame, theoretically the side bearings and body size; in practice the letter on one or two sides, and the pierced band of white above and below.</p>
