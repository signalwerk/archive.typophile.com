      <p>Hrant, nice points! It might be worth trying to describe what I mean by dynamic balance. I think it is the same sort of thing that Hrant means by contrast. I think we are talking about a balance in which there is a certain amount of regular rhythm but also dynamic swings to keep the eye interested. This dynamic quality is what makes for the contrast Hrant is talking about.</p>
      <p>To be theoretical for a minute, I think these swings should ideally come at the point where Peter Enneson ( if I grok his ideas) might be looking for salient features that distinguish glyphs from each other - the better they distinguish themselves the higher the cue value. However too strong a cue and the overall balance is ruined. I think my idea is that stronger than usual cues which would wreck a conventional typeface could perhaps be better tolerated or even leveraged for better readability if their form could be contextually met &amp; balanced by the next glyph. When I look at Beorcana in the heavy weights and especially the small sizes the forms of the letters individually seem grotesque to me. But they play together beautifully. I think that's because the forms balance each other and because their small size effectively quiets the final imapct of their potent shapes. The reason I mention this is that what I am describing theoretically may sound grotesque at first. But I think it could be wonderfuly strong and balanced too. It might even be that the contextual notanic substitution is most helpful at small sizes...</p>
