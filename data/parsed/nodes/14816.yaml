      <p>Armin Hofmann, reknowned Swiss graphic designer and educator at the Basle school, demonstrated and taught the importance of negative space.  His philosophy about it sounds very much like Frutiger's. Typographer Emil Ruder also was a great proponent of negative space defining positive space an vice versa. He also used the term "activates the space". Ruder and Hofmann were colleagues at the Basle school and certainly were friendly with Frutiger. If you look at both Hofmann and Ruder's books from the mid 60's, you may see what I mean.</p>
      <p>ChrisL</p>
