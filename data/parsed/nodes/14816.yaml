      <p>Eben, while I think the notion of 'notan' is one useful concept to describe the kind of balance you are talking about I think it can be somewhat misleading.</p>
      <p>1. Kindersley, an master stone carver looked upon design of letters and spacing of letters based on the black, and its dispersion over the advance width. In other words, you are looking at the generally assymetrical balance of different parts of the black of the glyph. </p>
      <p>2. The notion of notan has several meanings. Originally 'notan' (nóng dàn in Chinese) means how the artist balances ink of greater and less density in an ink brush painting--in other words shades of black and grey, with the extreme being white. </p>
      <p>In the West, what seems to have been picked up is the significance of the white areas of a painting, drdawing or photograph, particularly when these come to the foreground. The example of the 'yin-yang' symbol is given, for example. Here the white fights with the black for attention on an equal level. In illustrations from China and Japan, examples are often given where, eg. white comes to the foreground as snow, and has presence to the eye of the viewer. </p>
      <p>G. Noordzij points out that in this diagram:</p>
      <p>      </p><div class="imageWrap"><img src="http://typophile.com/files/NoorddzijIllustration_5388.gif"></div><p></p>
      <p>the white and black oscillate, trading places as foreground and background. Noordzij them points out that ordinarily in glyphs for text, the effort is made to *avoid* this effect. The white is kept in the background. </p>
      <p>That white shape in the background is important, but so is the balance of blacks, as Kindersley's work indicates.   </p>
      <p>Ps. Nick Shinn pointed out to me that sometimes you want more dazzle, particularly in a display face. He explained that he designed <a href="http://shinntype.com/" rel="nofollow">Eunoia</a> to get dazzle from the 'picket fence effect'.</p>
