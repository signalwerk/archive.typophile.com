    <p>Hello,</p>
    <p>I need a font converted from .pfb to .ttf so that I can use it on a website with php, the server doesn't support .pfb fonts but it does support .ttf fonts.  I know that this can be done with TypeTool2, but I can't justify spending $100 on it just to convert this font.  I tried the demo and it's simply open the .pfb and save as .ttf, but the demo only does 20 glyphs and half of them have the fontlab logo in them, so it's needs to be done with the full version.</p>
    <p>Is there anybody willing to help me out?  I'll paypal $10 for it if that's any incentive.</p>
    <p>Thanks,</p>
