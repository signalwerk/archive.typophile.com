    html: |-
      <p>I use FontForge under Linux.</p>
      <p>#!/usr/local/bin/fontforge<br>
      # Quick and dirty hack: converts a font to truetype (.ttf)<br>
      # Requires Fontforge. Run as "fontforge -script otf2ttf.sh FONTNAME.otf"<br>
      Print("Opening "+$1);<br>
      Open($1);<br>
      Print("Saving "+$1:r+".ttf");<br>
      Generate($1:r+".ttf");<br>
      Quit(0);</p>
      <p>FontForge might be fugly but it can do about everything with fonts.</p>
