    html: <p>The original was called MacHumaine by Bill Horton, 1989 or 1990. He put it in the public domain. It was a very badly made font technically and, in 1993, Doug Miles updated it. I don't know if it was then or later that it got the name Alpine. It was obvious why folks preferred the "improved" versions over the original, though - it was simply more usable.</p>
