      <p>Thanks Fivos for the extensive index of pirates and possible independent digitizers.<br>
      Most of the pirates are obvious, e.g. Southern and SSK.<br>
      There may have been more than one original digitization. It would take some checking to determine if the fonts seem to have a common digital source. This is compounded by the fact that the font was probably originally in ps format and converted to ttf, with varying degrees of accuracy, and some of the fonts have been tinkered with for various reasons. From the Horton reference it could perhaps originally have been a Mac font. Preliminary digging is not conclusive.<br>
      One of the candidates for being an individual source is WSI. See Luc Devroye <a href="http://luc.devroye.org/fonts-25319.html" title="http://luc.devroye.org/fonts-25319.html">http://luc.devroye.org/fonts-25319.html</a><br>
      Don</p>
