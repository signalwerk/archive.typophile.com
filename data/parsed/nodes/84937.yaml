  html: "<p>I have another simple question: what is the narrowest book page stock (European or American)? I am looking for a large size (a bit larger than an average leather bound bible), and a smaller size (somewhere between a paperback and hardcover).</p>"
  html_clean: "<p>I have another simple question: what is the narrowest book page stock (European or American)? I am looking for a large size (a bit larger than an average leather bound bible), and a smaller size (somewhere between a paperback and hardcover).</p>"
