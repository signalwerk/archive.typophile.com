    html: |-
      <p>What James said. The printing press is the key here, and you really need to know what dimensions it will have. If the book will be a longer run, it will probably run on a web unit. In that case, the cutoff on the press will define sizes.</p>
      <p>More likely, it will run on a sheet fed. Book stock can run on 25x38 inch sheets, although that is a large press, and 19x25 is more common. Do the math. 19/2 and 25/4 gives you an 9.25 by 6 book, 16 pages per sheet (allowing for trimming). You can go to a 19/2 and 25/2 for 8 pages per sheet (you are printing on both sides) to get a 12x9.25 book. </p>
      <p>Of course, some presses will be other sizes, and this will constrain your finished dimensions.</p>
      <p>As James says, talk to a printer ... preferably the one you want to print the book. (Be aware that the small little print shop will be able to print the book, but if you are going to run over 500 or so copies, the cost may not be effective, because small presses will only print 2 pages per sheet for a larger book. They often can only go to 18x22 paper.</p>
      <p>(I hope you are in the US/Canada ... otherwise this non-metric talk will be confusing. But the same rule applies ... talk to a printer).</p>
