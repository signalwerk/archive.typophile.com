      <p>You can find standard paper sizes here:</p>
      <p><a href="http://www.designerstoolbox.com/designresources/paper/" title="http://www.designerstoolbox.com/designresources/paper/">http://www.designerstoolbox.com/designresources/paper/</a></p>
      <p>The "narrowest" (i.e.,m smallest) standard American size I know of is 5.5 x 8.5, but that's not "between a paperback and a hardcover." Trade paperbacks are 6 x 9.</p>
      <p>If you are designing the book, can't you specify whatever size you want? Or are you limited to standard sizes?</p>
