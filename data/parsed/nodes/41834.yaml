      <p>Knowing people is really a great way to get into an internship, or get your foot in the door for an interview (this is also where coming from an "established" art school can help –&nbsp;whatever that means…).</p>
      <p>But these things will not get you the job. That depends on you and your portfolio. They have to want both to make you a permanent offer</p>
      <p>On the whole, for the first job, I'd say that it really is what you can do, not who you know. Your portfolio and abilities will be the biggest help in you getting your first real jobs. But a few years down the line, it will become more and more about who you know. Many of the really great jobs aren't publicly advertised. They just get filled through contacts. So when you are working, it is important to get to know a lot of people outside of your studio or office, maybe join some local design oganizations, etc.</p>
      <p>As for the 2–3 years experience… um, that's a "for real" requirement. You've got to build that up somehow. When I was in college, I spent three summers interning with design studios, and I also spent four semesters working as a part-time intern at other design studios. This builds up your time, resume, and portfolio. Plus, it was a lot of fun, and it paid me, too.</p>
