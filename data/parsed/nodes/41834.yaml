      <p>We hire everyone from Creative Circle. That way they are pre-screened and at least have some software skills. I think a placement agency is a good way to go, you get different experiences and see what the workplace is actually like.</p>
      <p>The hires at my work get accepted on 2 qualifications: portfolio and more important than that, personality. If I have to work closely with someone I need to be able to get along with them. Most portfolios I see are about the same - haven't been knocked out yet.</p>
      <p>If you had the greatest portfolio ever and I didn't think I could get along with you then - no….</p>
