      <p><cite>First gig = great portfolio<br>
      Every other gig thereafter = it’s who you know</cite></p>
      <p>Actually I'd almost have said the reverse. My first gig came thru a connection, I didn't have a portfolio at all (did not attend design school). I started out making stats and ended up designing books. My portfolio (and to some extent connections) got me my subsequent jobs. I got my dream job at 30 through a cold call. My letter and resume happened to land on the A.D.'s desk just after she learned someone was leaving. Then the A.D. left and I got her job ;-)</p>
      <p>It NEVER hurts to network. Always have your business cards on you. But a design school portfolio is just that. Your portfolio won't be as much help until it has professional work in it (IMHO). I echo what Don said above, do what you can to get a foot in the door and don't expect too much at first. If you're good, you'll move up soon enough.</p>
