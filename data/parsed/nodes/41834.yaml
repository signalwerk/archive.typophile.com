      <p>&gt; Also, does anyone know how to get any experience when companies say ’2-5 years experience’ because there’s no way any designer will get that experience coming out of design school.</p>
      <p>Sounds like something you read in an ad. Those people don't want someone coming out of design school. They want someon with 2-5 years experience.</p>
      <p>Places don't advertise for rookies. If you are a rookie, you go to them. Drop off portfolios, resumes, and network all you can. Offer to work for free a day a week at a studio you would like to get into. Be prepared to do mindless jobs like photo copying. Even listing your part time placement at that studio will mean something to a prospective employer (including getting another good reference contact). This assumes that you do a good, diligent job.</p>
