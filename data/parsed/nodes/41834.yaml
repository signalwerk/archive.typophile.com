    <p>I just wanted to get everyones honest opinion on getting a design job. Is it more important to actually know someone in the industry or who works in a company? or do companies judge by looking at portfolios first? I noticed that it's most important to know someone whether it's an instructor, classmate, friend, etc. So if that's the case, why should we have a portfolio in the first place? </p>
    <p>Also, does anyone know how to get any experience when companies say '2-5 years experience' because there's no way any designer will get that experience coming out of design school.</p>
