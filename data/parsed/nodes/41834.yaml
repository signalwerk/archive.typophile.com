      <p>This is one of those things that varies a lot depending on where you live and who you want to work for. In a town with more jobs than designers, you can find a good job just by submitting a portfolio in response to a Craigslist ad. But go to one of the cities where prospective designers far outstrip the jobs, and you’d better know somebody. And really great design firms that every kid coming out of school wants to work for might just ignore anybody who isn’t recommended by some third part acting as a scum filter. Of course, the are exceptions to any situation; a great portfolio and persistence might land you a job at a firm that isn’t even hiring to begin with. </p>
      <p>That said, there’s not really any downside to networking. I’ve never walked away from an AIGA function without at least having a good conversation.</p>
