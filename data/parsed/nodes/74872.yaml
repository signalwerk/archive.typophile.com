    html: |-
      <p>There are quite a few differences between the two types. If you don't have a license for either one, I would go with Garamond Premier, because it <em>is</em> more cost effective. You'll also note that Garamond Premier is more lively, whereas Sabon Next is quite sterile. Visually, Garamond Premier is more interesting - that may or may not be a reason to choose it, if you are looking for something more bland, go with Sabon Next.</p>
      <p>My own choice would be Garamond Premier, although I have not seen what exactly is being set.</p>
