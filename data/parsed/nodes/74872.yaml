      <p>Thanks for your response.</p>
      <p>Yes, the price difference is startling, which is why I would get only four styles for Sabon Next.</p>
      <p>It's a scientific text for university, done with TeX. A classic appearance is important.</p>
      <p>I've tested a friend's Sabon Next, but I couldn't get the leading right (tested 13pt and 13.5pt, either to dense on the first page or too sparse at others).</p>
