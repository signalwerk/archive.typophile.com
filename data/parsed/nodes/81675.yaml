    <p>Hello! Long time lurker, first-time poster...</p>
    <p>I am designing a book where I want the pages to have the feel of a book from the 1880s and 1890s. I am looking for a good typeface to use for the body copy that has a slight irregular, letterpress feel to it.</p>
    <p>So far I have found: <a class="freelinking external" href="http://new.myfonts.com/fonts/baselinefonts/old-times-american/old-times-american/" rel="nofollow">Old Times American</a><br>
    but this seems more in keeping with a newspaper or periodical than a book.</p>
    <p>And: <a class="freelinking external" href="http://new.myfonts.com/fonts/t26/archetype/" rel="nofollow">Archetype</a><br>
    which I like a lot but I am not sure whether it is from the right era</p>
    <p>Does anyone have any thoughts or suggestions?</p>
