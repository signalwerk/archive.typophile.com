      <p>Wow. Scotch Modern is <em>perfect</em> in terms of letter shapes. A great recommendation. </p>
      <p>I think for my needs it may be a little too perfect in execution as it lacks the slightly irregular quality I am seeking. Although my printed page will obviously not have the texture of a letterpress-printed page I want it to suggest at first glance that it may have been printed on a Victorian press, with the slightly irregular baseline and all that entails.</p>
