      <p>&gt; So, I’m basically modelling my type on something thats not really a good text face.</p>
      <p>You can pick up a copy of just about any English-language magazine from the 1920s and find ads with body copy set in Goudy Old Style. It was considered a top-notch face in its day. Not as ubiquitous as Kennerley, but a classier development in the same vein. </p>
      <p>Eric, you're just tinkering with Goudy's design, and don't have a clear design principle, other than "basing my design on..." You need to find a reason of its own for your typeface to exist, in a hurry.</p>
      <p>As you have gone too far to abandon the project, and as what you're doing is cosmetic, I would recommend comparing your face with a letterpress-printed sample of GOS (not individual vectored glyphs), and basing your re-styling ideas on that. </p>
      <p>Stop looking at the letters so big and in isolation: this typeface is all about fit, and the changes you are making to it, such as squaring off the bottom right serif of the L and E, work against the face's inherent fitting strategy. OK, if you are going to dismiss Goudy's snug fit and asymmetric serifs, and produce a chunkier setting with more discrete characters, then you should be testing settings of character-pair combinations, to see how you fitting scheme compares with the original.</p>
      <p>Let's see a text setting now; get that right and the glyphs will take care of themselves.</p>
