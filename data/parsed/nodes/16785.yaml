    html: |-
      <p>"if a make the rounded characters less wide and heavier, I assume thats going to happen to everything else?"</p>
      <p>The heavier part is true. You don't want the thin lines to be too weak for text sizes. The narrower part is not really the same. The reason I said some of the characters were too wide was that they "appeared" wider than the rest. In your sample above, you may have narrowed the b too much. Balancing widths of glyphs is a subtle shift of incremental adjustments to make the proportions appear to balance each-other.  It is very hard to see this at large sizes. I think you need to create a usable test font with a minimal character set to be able to test it out.  You will also see how fitting letters to their neighbors affects the glyph design and you may have to revisit your outlines to compensate.</p>
      <p>ChrisL</p>
