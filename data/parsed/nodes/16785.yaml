      <p>Good typefaces exist because they arise out of a certain need. Like most other sorts of design, they are there to solve problems not [just] to look pretty.</p>
      <p>Drawing new letters based on the proportions of old letters really isn't design… Wouldn't you want to "design" something for your senior project? Your senior project isn't just a chance to show that you know how to use illustrator or FontLab or whatever, but rather to show what sort of designer you can be when you work independently.</p>
      <p>You need to set a target audience and medium… and because this is small for a type project (at least in your fitted time range, I assume), you might want to limit output size as well. Really, after this point, its all up to you… maybe you could find some vehicle through school? i.e., new 11pt type for the student newspaper, new 9 point captions for the yearbook, or new font to be used in graphics on campus intranet websites, etc.</p>
