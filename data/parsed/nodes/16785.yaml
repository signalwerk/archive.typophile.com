      <p>Eric, get your font functioning so that you can make sample settings.<br>
      Once you see which character combinations are not comfortable, then decide whether to fix the situation by varying the sidebearings, or changing a detail of the serif (eg width, sharpness, amount of bracket). Or vary a stem weight. Whatever -- the important thing is that you will be designing a typeface, not lettering glyphs.</p>
      <p>Try not to look at GOS, and figure out a way to make your typeface set nicely.</p>
