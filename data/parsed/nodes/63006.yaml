    html: |-
      <p>- Do the rounds have any overshoot? "o", "e" and such look small to me.<br>
      - The caps seem more unfinished than the lc, also in terms of divergent curve character and widths (doesn't that "QUARED" look a bit strange?)<br>
      - I see some clogging issues in joins, especially in the Thin version, but also the Regular. You might try to compensate/thin/taper more.<br>
      - The spacing needs a lot of work. :-\  Your glyphs can be as pretty as they want – the spacing really makes or breaks a font.</p>
      <p>I'd say if you spend some more time polishing this, you can make it *really* nice (as opposed to quite interesting for a first/early one).&nbsp;&nbsp;:-)</p>
