    date: 2009-10-27T09:59:00
    date_raw: 27 Oct 2009 — 9:59am
    votes: null
    html: |-
      <p>Really interesting!<br>
      I really like the lc. nuy are too large though. u has too be less wide than n too (on average over 40 fonts I surveyed it is 2%) ; f and t are too narrow as almost always with a first font. m &amp; w look too similar and w is too empty at the top.<br>
      There are many spacing issues. The rounds may need to overshoot slightly more.<br>
      J is really strange. The bar of the A could be lower. The R is a bit out of proportion with the rest. M is too narrow. Check the width of each stem and joints, they seem to vary too much.</p>
      <p>HTH, let me know if it does not or if you think that I am wrong.</p>
