    html: |-
      <p>The Adobe proliferation is around different ways to end a paragraph.<br>
      There are also different ways to start, e.g. indent/no indent/negative indent (hanging), drop cap, raised initial; and type changes—e.g. small caps/all caps for a few words, then to U&amp;lc.</p>
