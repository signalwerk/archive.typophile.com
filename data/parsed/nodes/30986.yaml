      <p>Manitoba's kind of funny that way. We have Winnipeg (700 000), Brandon (50 000) and then the list drops off... (there's only just over a million in the entire province). Winkler's about 8500 which qualifies it for city status in Manitoba, but I still don't think it's a city.</p>
