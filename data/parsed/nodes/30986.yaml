    <p>My wife's 19-year-old cousin is looking at taking online training in graphic design and multimedia. She lives in a smallish city (Regina, Saskatchewan, Canada), and works days, so she and her dad are thinking that would be the best option for her.</p>
    <p>They're looking at Sessions (<a href="http://www.sessions.edu/" title="http://www.sessions.edu/">http://www.sessions.edu/</a>) which is an accredited online-only institution, and looks okay. Any other options they should seriously consider? Any good/bad opinions on Sessions?</p>
    <p>Note that Sessions has a "tuition sale" for which tomorrow is the last day, so they're trying to make a decision quickly....</p>
    <p>Thanks,</p>
    <p>T</p>
