    html: |-
      <p>It's not so much NEEDING the font as it is wanting to know what it is.  Ever since I first saw the logo for "The Ring" I've been obsessed by it -- kind of fitting, when you think about the content of the film.  It's like a childish scrawl, but there's something unnerving about it.     The font in the pictures is undeniably ugly - but it's also sort of cool.  Maybe I'm alone there.  I don't know.  Fonts can't all be perfectly proportioned.</p>
      <p>The reason I think it's commercially available is because on the show "Scariest Places on Earth" (I'm a bit obsessive over that show) they used to use this creepy handwritten font.  When I posted a font request over at the WhatTheFont forum, they came back with "Herrick's Hand" (see here: <a href="http://www.kandjsupplies.com/text_fonts_handwriting/herricks_hand.html" title="http://www.kandjsupplies.com/text_fonts_handwriting/herricks_hand.html">http://www.kandjsupplies.com/text_fonts_handwriting/herricks_hand.html</a>).<br>
      I thought the SPOE font was custom-made, but then lo and behold: there's the font, commercially available.  (Just for the record, I've checked all the fonts at the kandjsupplies.com place...I've found a few results that come vaguely close, but nothing perfect.)  Another example: I swore that the font "The Sixth Sense" used was custom made.  Then - there it was, Las Bonitas.  Most fonts used in movies are available, even if they are slightly altered.  In the examples above, if you compare the letters ot those used in the logo for "The Ring," you'll notice definite differences -- but also definite similarities.</p>
      <p>This font, I can't tell if it's all lowercase or if they only use lowercase letters to achieve the "Ring" effect.</p>
      <p>Another similar logo was used in the recent movie "Reincarnation" (an After Dark 8 Days of Horror or whatever film festival movie), seen here: <a href="http://www.impawards.com/2006/reincarnation.html" title="http://www.impawards.com/2006/reincarnation.html">http://www.impawards.com/2006/reincarnation.html</a>.  I realize that this poster uses handwriting - the letters don't match up, so it can't be a font, but it gives you a sort of idea about what I'm looking for.  Argh.</p>
      <p>@fontplayer: I snooped around deviantart...by snooping I mean casually glancing ... and I couldn't find ANY fonts, period.  Is there like a section for them?  There's a possibility that some user-made font made it to the big screen -- the "Harry Potter" spinoff font "Lumos" that was designed to emulate Ablefont made its way onto the Harry Potter DVD menus, so you never know.</p>
      <p>Another thing.  Look at the Unrated Edition version of "The Ring Two" DVD.  The "Unrated Version" is written in a similar "Ring"y font.  <a href="http://g-ec2.images-amazon.com/images/I/51KBVJRVDVL._SS500_.jpg" title="http://g-ec2.images-amazon.com/images/I/51KBVJRVDVL._SS500_.jpg">http://g-ec2.images-amazon.com/images/I/51KBVJRVDVL._SS500_.jpg</a>.  So many examples...so few answers.</p>
      <p>Wow, long post, and I lost exactly where I was going.  Long story short, keep your eyes peeled, and let me know if you find anything!</p>
      <p>Thanks!! :)</p>
      <p>-BT7</p>
