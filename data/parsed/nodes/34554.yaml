    <p>Hello,</p>
    <p>This is driving me crazy.  I've posted elsewhere with little luck, so I'm going to post this here in the hopes that someone will recognize this font.  I'm fairly sure it's commercially available - it's been used in a number of sources extensively.  Hopefully this font will ring a bell here -- you guys are experts, I'm trusting you!  :D</p>
    <p>The font I'm looking for is the font used the logo for "The Ring."  A possibly modified version was used in the cover for the Thai movie "Shutter."  The examples that follow are all taken from the HBO Making-Of special on the DVD for "The Ring Two."  (The font was also used as the font for captions in the last few episodes of "Scariest Places on Earth" which aired last Halloween; unfortunately as of now I don't have any examples of those.)</p>
    <p>Here are the examples I have so far ... they should be enough to at least form a rough outline of the font in question.</p>
    <p>"Shutter" cover:<br>
    <a href="http://www.bloody-disgusting.com/gallery/phpThumb.php?src=/gallery/images/760/poster.jpg&amp;w=280" title="http://www.bloody-disgusting.com/gallery/phpThumb.php?src=/gallery/images/760/poster.jpg&amp;w=280">http://www.bloody-disgusting.com/gallery/phpThumb.php?src=/gallery/image...</a></p>
    <p>"The Ring Two" examples:<br>
