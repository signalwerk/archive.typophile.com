      <p>Reading the transcript of his speech, I think he is both right and wrong at the same time.</p>
      <p>Do we "really need" more <em>text</em> (and "moderate" display) fonts than</p>
      <p>Times Roman<br>
      Baskerville<br>
      Century Expanded<br>
      Caledonia<br>
      Caslon<br>
      Garamond<br>
      Bembo<br>
      Poliphilus<br>
      Palatino<br>
      Cloister Lightface<br>
      Bodoni<br>
      Optima<br>
      News Gothic<br>
      Franklin Gothic<br>
      Venus<br>
      Helvetica<br>
      Univers<br>
      Copperplate Gothic<br>
      Microgramma</p>
      <p>But when it comes to display typography, faces like Dynamo, Stop, Bank Gothic, Cheltenham, and even Papyrus have their place... along with thousands of others.</p>
      <p>EDIT: While I added in Bodoni before seeing "The Vignelli Canon", I see I forgot Futura. But I would also add Kabel to the list, dated though it may be.</p>
