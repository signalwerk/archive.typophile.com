      <blockquote><p>Which one? Which one do you trust to do what you want it to do?</p></blockquote>
      <p>Exactly, although written with good intentions, well meant lists such as the Vignelli Canon are to be read in the perspective in the time they were written. Still Caslon is probably Monotype Caslon or Linotype Caslon, although at that time, Berthold Caslon was superior to them. Still Bodoni is probably Linotype or Monotype Bodoni, although they did not resemble Bodoni’s typefaces because the drawing room people (including those at Berthold) were taught that Bodoni had to have a look that was ‘as cold as the Alps’ (citing Updike) and that therefore(?) the curves had to be drawn with lines and arcs. Bauer’s foundry type was better but at the time Massimo Vinell wrote his list, there was no supplier of photocomposition machines that had a decent version (i.e. suitable for small sizes) of Bodoni in its typeface catalogue. Monotype Bembo suffers from weak details (such as the curves in the diagonals of the K that were merely an invention of the drawing room) and the photocomposition and digital versions never managed to capture the lower contrasts of the smaller sizes needed for offset printing of text matter. Also check Tim Ahrens on optical scaling for what happened after that.</p>
      <p>Summing up all this, combined with the good and serious work that has been done on text faces in the last 25 years (at the aforementioned foundries as well as many new ones), these lists have become nothing more than ‘name dropping’. Ignoring that development is indeed a bit disrespectful and above all, it unveals that some modernists have difficulties to cope with the better part of the outcome of the progress they were after.</p>
    html_clean: |-
