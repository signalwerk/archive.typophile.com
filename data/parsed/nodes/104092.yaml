      <p>In practice, I only use a few. And I think most do. But I'd rather each person use their own few than every one using the same few.</p>
      <p>I think I use Lucida, Georgia, Helvetica, and Times the most daily, along with a large variety of Webfonts, of which I have some favorites. But this has to do with the fact that I do web development, and these are defaults that "just work". If, for instance, somehow Franklin Gothic had been "chosen" for the default instead of Helvetica, we would all use Franklin and not know the difference.</p>
