      <blockquote><p>how many text faces does a bloke need?</p></blockquote>
      <p>How complex is the human subconscious?</p>
      <p>A big part of text fonts is about emotion, just like with display fonts, but on a different -deeper- level. The smallest flick in somebody's lips reveals a subtle emotion. You can't put your finger on what the flick looks like, but you can feel it. And people who can design for such feelings are qualified to make text fonts.</p>
      <p>hhp</p>
