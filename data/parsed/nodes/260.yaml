    votes: null
    html: <p>I did a little match'em up in Photoshop. It definitely looks  <br>like a bold(ened) Linoscript/Typo Upright, but the proportions  <br>of the loops on ascenders and descenders are similar to  <br>those found on Gando/French 111 BT (but there several other  <br>characters like 't', 'd' and the numerals don't match up at all).  <br>Furthermore I have the impression that the upper branch of  <br>the 'k' is not open but has a loop. <br> <br><img src="http://www.typophile.com/forums/messages/83/11317.gif" alt="comparison.gif"> <br> <br>Does anyone have access to old Linotype specimens? Is there  <br>a bold Linoscript/Typo Upright-like face available on the  <br>(digital) market? <br> <br>The mystery deepens...</p>
