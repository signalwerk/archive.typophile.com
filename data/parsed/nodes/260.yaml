    votes: null
    html: "<p>The sample is a little small, but to me the loops on the k and l look too short to be Typo Upright or its near-identical twin, Linoscript, whose loops come down to the x-height. As far as I can tell from the provided sample, the loops end noticeably above the x-height. All other characters look like Typo Upright, particularly the v and the t. I'm sorry I can't provide an alternate suggestion. <br> <br>One thing to note, if I'm reading MyFonts' Test Drive results accurately, is the stroke on the end of the v: if it rounds off a little, it's closer to <a href=\"http://www.myfonts.com/fonts/linotype/linoscript/linoscript/testdrive.html?s=kvt&amp;p=96\">Linoscript</a>; if it's more of a straight angle, it's closer to <a href=\"http://www.myfonts.com/fonts/bitstream/typo-upright/typo-upright/testdrive.html?s=kvt&amp;p=96\">Typo Upright</a>.</p>"
    html_clean: "<p>The sample is a little small, but to me the loops on the k and l look too short to be Typo Upright or its near-identical twin, Linoscript, whose loops come down to the x-height. As far as I can tell from the provided sample, the loops end noticeably above the x-height. All other characters look like Typo Upright, particularly the v and the t. I'm sorry I can't provide an alternate suggestion. <br> <br>One thing to note, if I'm reading MyFonts' Test Drive results accurately, is the stroke on the end of the v: if it rounds off a little, it's closer to <a href=\"http://www.myfonts.com/fonts/linotype/linoscript/linoscript/testdrive.html?s=kvt&amp;p=96\" class=\"link-external\">Linoscript</a>; if it's more of a straight angle, it's closer to <a href=\"http://www.myfonts.com/fonts/bitstream/typo-upright/typo-upright/testdrive.html?s=kvt&amp;p=96\" class=\"link-external\">Typo Upright</a>.</p>"
