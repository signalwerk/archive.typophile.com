      <p>The correct text should be:<br>
      <strong>С наилучшими пожеланиями</strong> (if you prefer to stick to the exact text above). </p>
      <p>Note that in Russian headlines not every beginning of a word is uppercased. So use uppercase only for the "С".</p>
