    html: |-
      <blockquote><p><em>I want to make sure that the Cyrillic text is correct</em>.</p></blockquote>
      <p>Dear Andreas, there is no Cyrillic language.</p>
      <p>One serious—<em>typographic</em>—problem with your <a href="http://typophile.com/files/Billede%203.png" rel="nofollow">test setting</a> is that the <em>Russian</em> version is set in upper and lower case, except the <strong>Ж</strong>, whereas the caps-and-small-caps style is used in other language versions…</p>
      <p>Your French is misspelled. It should spell <em>Meilleurs Vœux</em>, not <em>Meillerurs Voeux</em>.</p>
      <p><em>Счастливых Праздников</em> would make a better Russian version of your original <em>Frohe Festtage</em>.</p>
