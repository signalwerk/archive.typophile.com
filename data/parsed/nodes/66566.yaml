    html: |-
      <p>The smudge factor, of course, is an artifact of hand-typing using a flaky carbon ribbon onto not-so-great paper, one level of 1980s-quality xerox copying, then scanning at 600 dpi, that is then highly compressed into a jpeg file so the site would accept the upload, and then over-magnified for display here.  In other words, it isn't supposed to be smudged, but clean.  Saving the jpeg file off and shrinking the display down to something more reasonable might give a better feel for the overall general typeface appearance.</p>
      <p>By the way, I did see a lot of Magda-like typewriter copy during the same general era (70s-80s) in various paper newsletters to which I was subscribed, almost all from Europe.  That particular typeface didn't seem to catch on as well here in the 'States.</p>
