    html: |-
      <p>Oh, I see; thanks anyway!</p>
      <p>I have now done some research, and it seems that the 1980's BASIC manual that I had as my template when I made the SV Basic Manual font most likely was printed with a Swedish Facit typewriter. According to the typewriter experts I consulted, this particular font was very common with the Facit typewriters, if not the standard during this period, and it went under the name "Cubic 10/12 FA 46". As edo_nick rightly points out, it is not exactly identical to Report; most notably, the numeral "1" looks like the letter "l" in Report, but in Cubic it is different. (Curiously though, the glyph "½" in Cubic has the "l" shape; yet it is not identical to the ½ of Report, for that one has a slanted solidus, while that of Cubic is horizontal.)</p>
      <p>Evidently, it was not at all uncommon that different typewriter manufacturers had similar fonts, which all differed in some small details. For example Triumph-Adler has a font named "Prestige-Cubic", which is identical to Report in some respects, and to Facit's Cubic in others; yet it has a "W" and "w" which are wider at the bottom than those of either Report or Cubic.</p>
      <p>I have now acquired a nice specimen from the Facit typewriter, which I intend to digitize. (And so replace SV Basic Manual, which I already regard as deprecated.) I guess that with an alternative glyph shape for "1" it will pass as a remake of Report as well. If the administrators agree, I will start a separate thread in the Critique forum, where I'll discuss this digitisation process.</p>
