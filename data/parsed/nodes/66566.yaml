    html: <p>Thanks Florian.  Your examples have the same general shape as Report, but one difference that jumps out at me is that in all these example fonts (described in layman's terms by a non-typographist [i.e. me]), all the lines in the characters are exactly the same thickness, whereas in Report they are weighted differently within individual characters.  I think that very factor is what has always given it the eye appeal for me.</p>
