    html: |-
      <p>Hi there; I'm the creator behind the SV Basic Manual font. In fact, it is one of my very first attempts at drawing a font, and it probably shows. I did not personally own a typewriter with this font (and thus I was not aware of its name), but I had a computer manual written with it. A particularly important problem was that at the time I did not own a scanner; however, I had access to a fax and a modem, and so I managed to get a bitmap template by faxing to my computer! Obviously, the resolution was very limiting, and some of the subtleties were no doubt lost.</p>
      <p>(The more recent update, version 1.1, included vowels with ogonek, since that was requested. I don't remember doing any other improvements.)</p>
      <p>I can not make any promises, but it would indeed be interesting to attempt to redo the digitization from scratch, now that I have a high-resolution scanner, and perhaps at least a little more experience with vector drawing. To that end, if anyone could donate high resolution scans of a, preferably, first generation document, I would be very grateful: in particular, I need examples of @|•½¼²³¶§†, which did not appear in my manual; also (if they exist) _\`^~, as well as any other rare characters.</p>
      <p>In the meantime, I'm afraid the current version will have to suffice. I'm not aware of any other digitization of "Report".</p>
