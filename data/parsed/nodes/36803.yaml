    html: |-
      <p>Hello Mr. Hoefler. Your new site is very handsome, but I noticed a few things which I thought I would share.</p>
      <p>+ On my home computer, a 12" laptop, the navigation bar across the top takes up a large portion of the screen.<br>
      + The pop-up Interactive/Specimen Test Driver reminds me of old sites from a few years ago. Most sites incorporate the test driver into the main browser window.<br>
      + The Interactive Test Driver states that, "Some characters may not be accessible from your keyboard," which makes it seem like it's somehow my fault. I don't understand why characters which are typed using the option key are either missing, replaced by a ?, or completely wrong. (I typed ® and got ﬁ.)<br>
      + The Interactive Test Driver doesn't have kerning.<br>
      + The Characters Test Driver in a large font, like Chronicle, is awkward to scroll through. I had to press on the arrow key for 10 seconds to see the numbers!<br>
      + The "Fonts" pages are difficult to browse with, as they show all of the weights of a font. It would be more helpful for me to see all of the same-style fonts in the same weight so that I can compare them.<br>
      + I like the shopping interface! (See, I can pay a compliment!)</p>
      <p>This is a fine effort! A very smart and serious-looking website which puts the Hoefler Foundry back on the top of the type league.</p>
      <p>JN</p>
