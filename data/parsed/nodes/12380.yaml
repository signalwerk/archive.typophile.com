    <p>Could anyone suggest any titles of books that deal with typeface design, particularly the basics of letterform construction - ie with pen, ruler &amp; compass? Ideally with visual examples of how the different forms are constructed…<br>
    I’ve been trying to construct some ‘traditional’ faces for a poster, but am struggling with some of the letterforms (particularly s, g and e…) I had a look through my college library and considering the size and reputation of it it doesn’t seem to have any such books!<br>
    Many thanks.</p>
