      <p><em>I’ll just add that there is little in type design that *actually* uses a compass. Even stuff that looks geometric usually isn’t, and normal lettering is much more organic than constructed.</em></p>
      <p>Not to mention that no existing font format (that I’m aware of, at least) supports rational curves, so even if the type was designed with a compass, it won’t be perfectly circular.</p>
