      <p>I’ll just add that there is little in type design that *actually* uses a compass. Even stuff that looks geometric usually isn’t, and normal lettering is much more organic than constructed.</p>
      <p>That isn’t to say that there isn’t consistency - but it’s of a different sort.</p>
      <p>Regards,</p>
      <p>T</p>
