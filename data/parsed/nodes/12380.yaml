    html: <p>Doyald Young’s <a href="http://www.delphipress.com/">two books</a> (Logotypes &amp; Letterforms, Fonts &amp; Logos) are pretty strongly oriented towards lettering-based font construction, and Leslie Cabarga’s Logo, Font &amp; Lettering Bible has a lot of good stuff. As for the rest, yeah, use Google to search Typophile and look for threads on <a href="wiki/lettering" class="wiki">lettering</a>. The Cabarga and Young books have the advantage of being in print, but when it comes to lettering, they only touch the top of the iceberg.</p>
