    html: |-
      <p>Perhaps caricature isn't the right word (I hadn't yet had coffee when I wrote all that!) and I didn't mean to make it sound like Bell Gothic was strictly a caricature. I more meant that if you were to ask "What typeface takes the concept of the ink trap to its logical extreme?" my answer would be Bell Gothic. Similarly, if you were to ask me "What typeface takes the concept of this inner/outer tension to its logical extreme?" the best answer I could give would be Ad Lib (I know, it's pretty weak), since, nutty and papercut though it may be, almost all it's outsides are curved, and almost all it's insides are optically rectangular. I can't think of a typeface that takes this same approach but does it rationally or seriously to the hilt. </p>
      <p>What was that Novarese face called?</p>
