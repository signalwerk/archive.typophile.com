      <p>i like it. i may get crucified for saying so, but it has a feels similar to much of kris sowersby's work. is this part of a kiwi aesthetic that we're just starting to see in the West? if so, i hope we see more of this.</p>
      <p>first remarks: this seems a bit light for text usage. what are you intending this for primarily? it looks great large. i love the broken strokes, they seem to be becoming very trendy, would love to see how they play out in this.</p>
      <p>minutiae: love the a. watch your bowls on bdpq: b seems narrow compared to d. c and e seem wide. the f seems a bit broken. the counters on the g seem too large with not much breathing space in between. i disagree and disagree with Jelmar on hmnu: you should either make your joins smoother or more disjointed, i'd opt for more broken. r feels a bit weak. s may be a bit too narrow, same with t. the tail of the y feels like an unfinished thought and the tail of the j to a lesser extent. the crotches on hmnrp feel a bit too shallow, these could be a bit more dynamic.</p>
      <p>overall a very nice start! keep up the good work.</p>
