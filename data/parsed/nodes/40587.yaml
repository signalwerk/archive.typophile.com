      <p>Thank you. Well, I entirely agree on the attractiveness brought by them.<br>
      One of the earliest examples of such stylizations I have seen (and very good too), is in a typeface by Aldo Novarese (which does not exist in digital format).<br>
      He married the proportions of Roman inscriptions with the overall feel of a "drawn" sans-serif.</p>
      <p>I can't see how you could relate Ad Lib to this, anyway. It looks to me as informal "paper-cut" lettering.<br>
      I do not think Bell Gothic was meant as a caricature: it was designed by Carter to withstand bad printing conditions and the exaggerate look of these features comes from this, right?</p>
