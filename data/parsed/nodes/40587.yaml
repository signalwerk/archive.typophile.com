      <p>And in that spirit:</p>
      <p>This has some traits that are not commonly seen and therefore welcome. There is a generous width to certain characters that reminds me of Diotima somewhat. Nice! Along with that is a brushy feel that gives a whiff of Oz Cooper's hand lettering. Very nice! Long serifs, small eye in a and e, all nice, distinctive touches. </p>
      <p>The spacing needs to be refined; it's uneven, but should not be tighter or looser, just more consistent. </p>
      <p>Not sure the trendy sharp cuts in the counters are in the right places however. Look at c, e, g, s. In s and f especially those cuts are creating a weak spot (as mentioned above). </p>
      <p>Given the other, desirable influences that appear here, consider whether the cuts belong at all; or at least reconsider where they are. I am skeptical at this point, having seen them everywhere lately. Make sure you know how to use them.....</p>
      <p>There seem to be principles with letter design that make bends or sharp angles highly functional in certain places (a, s, c terminals), and very distracting in other places. Observe how this affects a typeface's performance in reading. It's those distracting bits that mar otherwise good readable faces.</p>
