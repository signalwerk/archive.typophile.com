      <p>Oh I like the feel this has. The roundness combined with the kinks.<br>
      Couple of things that come to mind:</p>
      <p>I think the kink in the lower right corner of the <strong>b</strong> might have been placed a bit too low. The bowl is being 'pulled' to the lower right, as if it's being ripped of the stem. The lower curve of the <strong>j</strong> is indeed too heavy.<br>
      <strong>h/m/n/u</strong>, I think the transition from the shoulders (round) to the stems (straights) could be a bit more subtle or smooth (a less direct change in direction, if you know what I mean).<br>
      <strong>p/q/r</strong>, usually the serifs on the side of the bowls/ear is a bit longer than the ones on the other side; that way they 'carry' the load as it were. Also the ear of the <strong>r</strong> could be a bit too long, and might start lower on the stem and extend into a tad more heavy terminal.<br>
      The <strong>s</strong> seems to be too light, and also very slightly tips over to the right.<br>
      The <strong>t</strong> looks like it could use some love, it looks less defined as other characters.  The <strong>z</strong> looks too heavy, but it might be ok in text. I don't think the terminal of the <strong>y</strong> fits very well in the design, look at those of the 'f' and the 'r'.</p>
      <p>If you include a couple of lines of text in a future sample, people can probably give more contructive critique. :) But I hope this helps. I like the characteristics this design has alot.</p>
