    html: |-
      <p>The "kink"s in this case are the corners, so to speak, on the inside outline of a counter, where a node has been placed and the bezier handles are "broken".  Oftentimes these kinks are meant to emulate a kind of brush-formed style, or else are placed in such a way as to mimic the normal stress/modulation of a pen-formed letter. In Weka, you can see it in the c, p, q, s, etc.</p>
      <p>Their attractiveness, I think, comes from the tension they bring to a given form — continuous curve outside, discontinuous curve inside. In this way, (and I don't know if I'm alone on this) Ad Lib is sort of a caricature of the style in the same way Bell Gothic is a caricature of the concept of the ink trap.</p>
