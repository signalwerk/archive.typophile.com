    html: <p>The unfortunates would still need to be used at approximately the size of the pattern digitised (12 pt for Centaur, 9 pt for Bembo), and bad kernings can need repair. I used 2x2 and 3x3 emboldenings for Centaur, but I'm certainly not an experienced designer.</p>
