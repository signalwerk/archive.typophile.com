  html: |-
    <p>There was a post here a while ago by a member (my apologies, but the name escapes me) who had an interesting idea:</p>
    <p>Throw our current Bembo or Centaur into Fontlab and apply some vertical and horizontal bold effect in order to fatten up these otherwise sad victims of digitization. I tried that with the Cetnaur we have now, and it looks and reads much better.</p>
    <p>I applied a 5-horizontal, 5-vertical bold effect, nothing else changed. My question is: Even though what I did looks good, what would the more experienced users/designers recommend? A little more bold? A little less? And finally, is doing this a good idea? It Seems a bit blasphemous, but effective all the same. Could this be the solution - all that is needed to "fix" Centaur, Bembo, and other unfortunates? Or is my inexperience getting the better of me?</p>
