      <p>Here are the Subtitles that are featured in the episodes. They always show this typeface to introduce people, and give a title. </p>
      <p>Now I edited this font, because it was the only one that had a photo, with the text from the show..  So it was like a 300px, by 500px image so I had to do a lot of tweaking and removing  the background and tried to make it as usable as possible.  so forgive me its not the best, but picture the glyphs as completely rounded on the edges. COMPLETELY rounded. There was a bit of loss because it was a light background so it gives the appearance of not being completely rounded.<br>
      But I think it should be fine enough to see the specific things that make it stand out among others.. hopefully.. </p>
      <p>Again I appologize, I did the best I could with a tiny 15px by 70 px text..</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/burnsubs_4320.jpg"></div><p></p>
