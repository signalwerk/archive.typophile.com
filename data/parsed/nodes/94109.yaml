    <p>Hello everyone,</p>
    <p>Trying to figure this one out, been searching around and not really getting anywhere with it.<br>
    I tried Identifont, WhatTheFont!, and WhatFontIs identification without any luck so far. </p>
    <p>It may actually be a custom typeface for it, but I would be surprised if so.. Maybe they used a simple font design, and just put the slant on the t, and the r? Thats my best guess.</p>
    <p>I edited the logo to make it easier to see, so see the image I am inserting..</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/burn notice font_4400.jpg"></div><p></p>
    <p>But not only that, I noticed they use a nice smooth Rounded sans in the TV show as well.<br>
    Like when they list people's names, and their title below it, there is a whole other typeface. That smooth rounded medium sans. </p>
    <p>Ill try to find that font, for identification as well, that one is the really beautiful one. The Logo is separate.</p>
