    <p>TypeCon Buffalo organizers have signed up a crack squad of A-list live-bloggers (and me) to cover the upcoming event. If you have any pre-announcements, gossip, ideas or other info to share send it along to <a href="https://web.archive.org/web/20080907014409/mailto:blog@typecon.com">blog@typecon.com</a> - so we can get the blog rolling in the run up to the big show.</p>
    <p>Cheers, Si</p>
