      <p>With a company like Saks I think something like this works because they are depending upon everyone wanting to be a part of the so-called ’in’ crowd and anyone in the ’in’ crowd would know. It could, perhaps, also be likened to retail where they don’t use price tags, because as you know, if you have to ask, you can’t afford it.</p>
      <p>Seriously, I do like it. It seems very eighties which is oh so very aughties. I love black and white and I really am happy to see them using a script again.</p>
