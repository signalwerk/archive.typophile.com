    html: |-
      <p>Thank you all, but on the Artcraft font, there are subtle differences. Tops of letters are more curved on artcraft, serifs of S are slightly different, etc. I used the font preview at the fontshop site, but increased the size to 288pt and 388 pt and could see slight differences. </p>
      <p>Could the logo have used a knockoff font or is another close font? God knows there are dozens of variations on Garamond, Palatino, Times, Goudy - just to name a few.</p>
