    html: |-
      <p><a href="http://www.exuberance.com/type/artcraft.html" target="_blank">Matt Jalbert’s version</a> is closer, but not a match.</p>
      <p>Philippe, from the MyFonts forum, has noted in the past that <a href="http://www.castcraft-software.com/homepage.html" target="_blank">Opti</a> had an Artcraft and that there was a Compugraphic version digitized by Alan Prescott. Best of luck trying to deal with Castcraft and I have no idea if the CG font is available anywhere these days.</p>
      <p>As to the curvy tops of the letters, that is a distinctive feature of the typeface. A font without those wouldn’t be Artcraft. Surely that feature was removed by the logo maker.</p>
