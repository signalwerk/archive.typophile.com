    html: |-
      <p>Evan, I believe that the differences you saw may have been in the version of Artcraft, or even tweaks by the artist who made the logo. I have no doubt in my mind that Artcraft was the basis for the logo. The typeface was designed by Robert Wiebking in 1912</p>
      <p>- Mike Yanega</p>
