  html: <p>Hi, <br> <br>For the users of identity systems, what is the current state of the art in terms of templates with styles and typographic auto-correction? I'm not a big Word user so I haven't tried creating a template within it - is there a way to export an InDesign file into a Word template? <br> <br>I wish Adobe would come out with a PDF XML based word processor that could take specially formatted indesign files. Having it use optical margin adjustment, proper quotes, dashes, and numerals, etc, would be great. If it had CSS-like external style sheets/master pages that the documents referenced when opened, that would be really cool too. <br> <br>Thanks.</p>
