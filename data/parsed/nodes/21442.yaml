    <p>My friend is a Magician/Sideshow/Fire Performer and desperately needs an identity/logo type plus promotional materials. This is what I have for him so far, he saw a rough comp where I didn't have any of the typefaces, but I've since bought the fonts and done some iterations. I need your input, the forums were down exactly when I wanted to post this! We've not decided if he's going to use colors or just keep with the black and white/grey theme. I know these aren't EXACT sizes of biz cards yet, but I need to nail the details first. Thanks!</p>
