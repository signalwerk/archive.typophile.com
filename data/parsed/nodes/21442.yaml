    date: 2006-08-06T10:17:00
    date_raw: 6 Aug 2006 — 10:17am
    votes: null
    html: <p>Lex, the interesting thing is that Barry is a pretty 'normal' run of the mill guy. No tattoos or crazy costumes or piercings. This is kinda why I went with a more clean approach because going in the direction you mentioned would conflict with the fact that this 'normal' guy is doing all these crazy acts.</p>
