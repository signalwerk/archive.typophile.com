    html: |-
      <p>I'm not too sure about the combination of typefaces, or at least the proximity of the artsy crafty one with the tuscan one seems kind of Aleister Crowley and the other showbizzy, having glanced at the sideshow website I assume that you wanted to imply both, it's the closeness of the two that bothers me. The alignment (without the spade) doesn't work for me either, I can see that you have centred Silver on the address details but it seems kind of left heavy, maybe moving the Master Magician away would help or changing the order so that the name is near the vertical centre and the descriptor was more connected to the address, which needs to be kerned out. On a production issue if you do decide to go two colour (rather than a tint) your keylines might suffer from registration errors. Obviously you have a lot of work to do in drawing the ornate spade device but however you work it out I think you should look at using elements from it in the monogram in the corners the circles seem to simple to me.<br>
      Tim</p>
  - id: 150794
    user: 2462
    date: 2006-07-30T10:06:00
    date_raw: 30 Jul 2006 — 10:06am
    votes: null
    html: <p>The little BS monogram lacks coherence, especially with the M's stuck in wherever you could fit them. It sort of reads "Bm mS". You may want to simplify that as much as you can, down to the two letters or even just one.</p>
