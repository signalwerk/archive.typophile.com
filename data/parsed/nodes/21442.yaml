    html: |-
      <p>I like it. Use of playing card motif is very eye catching and appropriate. The phone number spacing looks kinda tight. Also, its really hard to read the @ symbol--it was hard for me to catch on that what I was reading was an email address. Also, kerning on Master Magician could use some work (but maybe you're not there yet). Looks great in B&amp;W, but adding color would look sweet too. Or reflective silver ink!</p>
      <p>I like the silver backside. The white spade in the upper left balances better than the black spade next to the name, but having more black on the frontside of the card adds something. Maybe try right justifying the contact details to balance the spade in the upperleft?</p>
      <p>What you have is really good--keep working at it!</p>
      <p>Eron</p>
