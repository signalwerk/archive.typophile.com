  html: <p>Hi, this is a logo I'm working on for dwfc.org. I'm on a team that may be doing a complete overhaul and branding for their company and was hoping to get some early critiques. I haven't put too much work into this... only a couple hours. I'm open to font ideas and any comments on the idea overall. (I'm not a big drywall fanatic; my google research on "drywall" brought up a lot of those paste spatulas which are used for spreading the goo over the seams... so I thought I'd work one in.) The colors are not set in stone, as we have ZERO feedback on that from the company yet. I just need some prelim ideas. <br> <br>Thanks!</p>
  html_clean: <p>Hi, this is a logo I'm working on for dwfc.org. I'm on a team that may be doing a complete overhaul and branding for their company and was hoping to get some early critiques. I haven't put too much work into this... only a couple hours. I'm open to font ideas and any comments on the idea overall. (I'm not a big drywall fanatic; my google research on "drywall" brought up a lot of those paste spatulas which are used for spreading the goo over the seams... so I thought I'd work one in.) The colors are not set in stone, as we have ZERO feedback on that from the company yet. I just need some prelim ideas. <br> <br>Thanks!</p>
