    html: "<p>Well, my thinking behind that: <br> <br>Basically, Drywall Finishing Council is a group of people who oversee standards in drywall finishing materials for the industry.  I think they're probably known mainly by members of the Drywall community.  (Hehe)  Anyway, I was using the fact that they used the acronym dwfc as their domain name as a basis for using it in their logo.  Do you have suggestions other than utilizing dwfc?  Unfortunately, Drywall Finishing doesn't conjure a lot of graphic images in my mind, which is another reason why I went with dwfc, while incorporating the one notworthy graphic element that I could consistently find in searches.  </p>"
    html_clean: "<p>Well, my thinking behind that: <br> <br>Basically, Drywall Finishing Council is a group of people who oversee standards in drywall finishing materials for the industry.  I think they're probably known mainly by members of the Drywall community.  (Hehe)  Anyway, I was using the fact that they used the acronym dwfc as their domain name as a basis for using it in their logo.  Do you have suggestions other than utilizing dwfc?  Unfortunately, Drywall Finishing doesn't conjure a lot of graphic images in my mind, which is another reason why I went with dwfc, while incorporating the one notworthy graphic element that I could consistently find in searches.  </p>"
  - id: 26334
