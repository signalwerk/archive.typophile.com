    date: 2004-03-02T18:09:00
    date_raw: 2 Mar 2004 — 6:09pm
    votes: null
    html: "<p>Brian: <br> <br>An acronym is commonly used for a group, such as a \"Council\", but DWFC is not an acronym friendly title, meaning that it doesn't flow. \"W\" rarely lends itself to a nice sounding acronym (exception, A&amp;W Rootbeer). DFC is not bad, but unfortunately, it isn't consistent with their URL. <br> <br>RE: \"Drywall Finishing doesn't conjure a lot of graphic images in my mind\" <br> <br>Have you considered doing a strictly typographical logo? This would be an appropriate approach for a \"Council\". Maybe a very simple shape such as a trapazoid (representing an angled sheet of drywall) could be incorporated</p>"
    html_clean: "<p>Brian: <br> <br>An acronym is commonly used for a group, such as a \"Council\", but DWFC is not an acronym friendly title, meaning that it doesn't flow. \"W\" rarely lends itself to a nice sounding acronym (exception, A&amp;W Rootbeer). DFC is not bad, but unfortunately, it isn't consistent with their URL. <br> <br>RE: \"Drywall Finishing doesn't conjure a lot of graphic images in my mind\" <br> <br>Have you considered doing a strictly typographical logo? This would be an appropriate approach for a \"Council\". Maybe a very simple shape such as a trapazoid (representing an angled sheet of drywall) could be incorporated</p>"
