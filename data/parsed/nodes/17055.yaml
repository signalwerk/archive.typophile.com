    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Barnhart Brothers &amp; Spindler</strong></p>
    <p>Opened in Chicago as the <a href="/wiki/Great%20Western%20Type%20Foundry" class="freelinking" rel="nofollow">Great Western Type Foundry</a> in 1868. This firm had been founded by a family of German immigrants, but had never been very successful. It was bought out by the Barnhart Brothers later that same year and remaned Barnhart Brothers &amp; Spindler. The Barnhart Brothers were newspaper publishers in Iowa who came to Chicago as advertising agents. They got into the type founding business by accepting type in lieu of cash for payment on a bill. They retained Herman Spindler as the foreman, since he was the only typefounder in the group.<br>
    They competed directly with the <a href="/wiki/Marder%20Luse%20Foundry" class="freelinking" rel="nofollow">Marder Luse Foundry</a> and several sales representatives for New York foundries. But the Barnhart brothers were extremely aggressive businessmen and their company grew to be the largest in Chicago. Their first type catalogs were small pocket size books called “pony” books still bearing the name <a href="/wiki/Western%20Type%20Foundry" class="freelinking" rel="nofollow">Western Type Foundry</a>. Later catalogs increased in format and thickness with the addition of many newly designed faces.<br>
    It was finally acquired by <a href="/wiki/ATF" class="freelinking" rel="nofollow">ATF</a> in 1911; it closed in 1933. This foundry published many popular and lasting typefaces including <a href="/wiki/Caslon%20Antique" class="freelinking" rel="nofollow">Caslon Antique</a>, <a href="/wiki/Cooper%20Black" class="freelinking" rel="nofollow">Cooper Black</a> and <a href="/wiki/Caslon%20Openface" class="freelinking" rel="nofollow">Caslon Openface</a>.</p>
