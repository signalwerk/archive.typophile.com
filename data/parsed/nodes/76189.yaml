  html: |-
    <p>I watched "The American" yesterday. And the subtle yet superb opening titles caught my eye. Can anyone identify the font they used there? Also I searched for the agency, who made the title design, but no luck. they are not listed in the credits. Any idea?</p>
    <p>note: the font in the titles is NOT the same as for the movie poster.</p>
