    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 14.Dec.2007 12.08pm </div>
      <p>The deadline for TDC2 2008 Type Directors Club Type Design Competition has been extended to Friday 4 January 2008.</p>
    <p>Designers or submitters may either send printed samples by mail or send 11x17 US Tabloid formatted PDFs via secure server uploads. PDF entries will be printed out by the TDC prior to the judging. The server can be also used to register entries and print labels for mailed or shipped entries.</p>
    <p>Full Call guidelines and procedures for the TDC2 2008 Type Design Competition are at:<br>
    <a href="http://www.tdc.org/calls/tdc22008/index.html" title="http://www.tdc.org/calls/tdc22008/index.html">http://www.tdc.org/calls/tdc22008/index.html</a></p>
    <p>Thanks for your inquiries; additional inquiries may be made to Carol Wahler at director [at] tdc [dot] org</p>
