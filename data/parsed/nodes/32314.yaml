    html: |-
      <p>Stephen, thanks for the clarification...Yves you do more than follow, I 've been chasing some of your ideas for years. but..."When four weights of Today Sans are lumped in with some other fonts and then sold for $19.95...explain why a single weight should retail for $39.50"</p>
      <p>Because, they don't have a license for it, that's why.</p>
      <p>Explaining to someone that fonts must be bundled should not be too hard: no user of any supported language of the OS should have to go out and buy fonts to enable use of the OS and its bundled apps. </p>
      <p>The fewer and fewer applications that come separate from the OS, must come with enough fonts so that any user wishing to make any kind of document you've Ever seen before will not have to go out and buy more fonts. </p>
      <p>Then there are bundles that are not associated with OS or Application, and those are targeted at users of other products and or services where people need to make documents like you've Never see before.</p>
      <p>Then, and in order to go on, the definition of independent font foundries needs to be estabilshed as what? — those foundries who do not involve their fonts in bundling? </p>
      <p>I think perhaps you hear people who have an IP-IQ problem?</p>
      <p>Here is a good test: PCs of all kinds from the Huskiest Desktop to the Invisiible Nosephone come bundled with music. Do all users find themselves content with the bundled music? What are their choices in aftermarket bundled music? Does any of this have anything to do with the indy musicman (relative to digital technologies effects)?</p>
      <p>If people think intellectual property is not worth 39.95, but want to use it anyways, then they are breaking the law. It's not that some fonts are free or cheaper that make them do it is it? </p>
      <p>Tiffany says, "People who license type are not one sort of people" which I heartily agree with, and I think it goes without saying that "People who don't license type, are one sort of people." :)</p>
