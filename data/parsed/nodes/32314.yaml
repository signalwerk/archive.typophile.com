      <p>David - I've been following the business side of type for a little while and I have the impression -- I could very well be completely wrong -- that the way certain typefaces are bundled and discounted make them look "cheap". I often have had discussions with end users, trying to convince them that digital type is a product of intrinsic value. Basically it's really hard to make them see type licenses should be paid for, not just exchanged amongst friends and colleagues.</p>
      <p>When four weights of Today Sans are lumped in with some other fonts and then sold for $19.95, it tends to get difficult to explain why a single weight should retail for $39.50. And even more so when InDesign CS comes with a.o. complete high quality OpenType families like Adobe Caslon Pro, Adobe Garamond Pro, Adobe Jenson Pro and Adobe Warnock Pro. Make no mistake, I'm happy to have those with my software, but I suspect this might make the lives of independent font foundries a little harder.</p>
    html_clean: |-
