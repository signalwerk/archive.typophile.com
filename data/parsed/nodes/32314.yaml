    <p>Hi,</p>
    <p>I'm designing some covers for a client and they've asked me to give them one alternative using a particular font called Agenda (see sample below). As I haven't got it and they aren't sure they want to use it anyway I wondered if there might be a free shareware alternative which might be similar just to get by until they decide what they prefer.</p>
    <p>Anyone know of anything as I've looked and found a few but think the curles on some of the letters (such as L's) are quite extreme.</p>
    <p>Thanks.</p>
    <p>A</p><div class="imageWrap"><img src="http://typophile.com/files/Agenda_6280.jpg"></div><p></p>
