    html: |-
      <p>I agree with you, Yves, but I also see something else. I'll try to explain. I'm going to generalize and so might step on some toes. I'm not trying to insult anyone, I promise.</p>
      <p>People who license type are not one sort of people. There are many shades of gray. Some people do have an eye for good type but would never, ever, pay $39.50 for a font. No matter what. But they would pay $19.95 for a quickie bundle. </p>
      <p>Then there are those who wouldn't buy an inexpensive font bundle because they'd wonder if there were hidden strings attached. </p>
      <p>Then there are those who are in the middle somewhere. They know fonts are tools and need them for their toolbox. They can't always afford the most expensive and so bundles such as this might ingratiate them to a foundry because they were able to use some of their fonts for less money.</p>
      <p>I could see using bundling, from a foundries point of view, as a way to get the lower end of the spectrum to consider using more of their fonts. </p>
      <p>Yes, in some ways it makes one wonder about the worth of a typeface. But the truth of the matter is that it is a success just to have someone licensing the font instead of downloading it. </p>
      <p>Perhaps this is clear as mud.</p>
