    html: |-
      <p>If the image is from something modern about Godard, then I agree with Ryuk that Neutraface is most likely the match.<br>
      Christian Schwartz designed the font  for House Industries in 2002. According to a wiki on Richard Neutra<br>
      <a href="http://en.wikipedia.org/wiki/Richard_Neutra" title="http://en.wikipedia.org/wiki/Richard_Neutra">http://en.wikipedia.org/wiki/Richard_Neutra</a><br>
      Christian Schwartz based the font on Richard Neutra's  architecture and design principles.<br>
      Does this mean that the letters were originally designed by Richard Neutra and came to the attention of Jean Luc Godard?<br>
      I don't know.<br>
      Anyway this is all speculation without knowing the approximate date of the sample.<br>
      If the objective is simply to reproduce something like the letters rather than to identify anything specific, then Neutraface works for me.<br>
      Don</p>
