      <p>If I recall correctly Jean Luc Godard's movies used lettering rather than fonts as such.<br>
      A fan has made a Jean Luc Godard font based on the lettering in some of his movies: <a href="http://www.carvalho-bernau.com/jlg/" title="http://www.carvalho-bernau.com/jlg/">http://www.carvalho-bernau.com/jlg/</a><br>
      It's heavier and less rounded than the letters in your image, but has an interesting discussion of the lettering used in the movies.<br>
      There are several fonts that resemble the one in your image such as Intertype Vogue, not digitized. I trust that one or more of my colleagues will give you a list of digital fonts similar to your image.<br>
      Don</p>
