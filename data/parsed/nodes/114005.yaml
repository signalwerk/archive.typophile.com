  html: <p>Looking for something to represent the typeface used to annotate images in Gray's Anatomy drawings. Thought it might be Garamond but the 'g' is wrong. It ws published in 1858. Not a big choice of typefaces then. Maybe someone knows and will tell me while I search!</p>
