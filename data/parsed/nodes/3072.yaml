  html: <p>I have been racking my brain all day and reading about exporting PC TrueType faces that work in Adobe products as well as Macromedia's. I am a Mac Fontographer user and it seems no matter what font generating application you use, the TT fonts on PC will have some odd conflict or don't name properly.  <br> <br>I will cut to the chase, does anybody know how to export PC TT properly (in Fontographer or Fontlab) so that all the fonts in a family will show up in Flash MX without using a font management program? I have had my friend that is well versed in Fontlab (PC user) look into it and he is stumped also. In theory, it should be a brainless task, but it seems whenever I try and properly generate a family, some app on either platform (usually Macromedia) gives me problems.  <br> <br> I know of shortcuts and older methods to make it work, but I am looking for someone that understands this problem a little better than most people do. It is late and I hope I am explaining myself properly, but this is driving me nuts. Anybody know why or how to generate in either platform in Fontographer or Fontlab so it lists "properly" in Flash MX for PC?  <br> <br>Thank you in advance. &lt;/font&gt;</p>
