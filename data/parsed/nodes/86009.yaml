    <p>Hi there</p>
    <p>Here is a question on mid-points. I know they are used for quantities and monetary units, but how about time? For example, what would be the correct typographic use for mid-points in this case: 10.30h or 10·30h?</p>
    <p>Thank you!<br>
    m</p>
