    <p>I don’t want Mormons or Islamic fundamentalists or born-again Christians running Typophile. I also don’t want squeamish, schoolmarmy atheists running it. As it stands now I can’t tell which of those groups is in charge, because the result is the same: You can’t really swear on this site.</p>
    <p>In particular, not only can you not write the word “fuck” or any derivative, you can’t even post a link that includes those four characters in its URL (even if you’re using an actual <code>A</code> element rather than being dumb as a mule and pasting in an URL like it was plain text).  You have to <a href="http://typophile.com/node/59606" title="As by f%75%63%6B" rel="nofollow">obfuscate the link</a>.</p>
    <p>It’s OK if you’re offended by the word “fuck.” I’m offended by Arial, but I don’t try to ban its usage, which is what the self-proclaimed “moderators” of this site are doing. And they’ve gone to elaborate lengths to set up a system that automatically censors your words without human intervention. (Yes, Americans, it’s still censorship even if the government isn’t the one doing it.)</p>
    <p>Typophile has a whole list of banned topics, implicitly including all the topics I am posting under the MetaPhile rubric but explicitly including any topic explicable with the word “fuck.”</p>
    <p>It’s simple: The most uptight and censorious members of Typophile, even if, for some reason, they have the keys to the house, should not get their way. If this is a discussion forum, I expect to be able to discuss things, and in particular I expect to be able to express indisputable facts (like the full and accurate text of a link) without interference.</p>
