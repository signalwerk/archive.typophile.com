      <p>Hello Guys et Gals:</p>
      <p>Man has be marginalizing man since the beginning of time, and even in these (supposedly) educated times the practice is still just as common. The heart doesn’t engage the brain anymore. Intolerance and lack love for your fellow man (no matter what he is) will make its way into another susceptible heart. </p>
      <p>Bendy, you rightly should find my words offensive much the same way I find Joe Clark’s intolerant comments towards Mormons, Muslims, Born Again Christians, and even Atheists outrageous. </p>
      <p>I (we) don’t know if Joe harbors any true hatred for the aforementioned groups—perhaps a literacy device (or stunt)—a punch in the gut to the reader to draw him into the censorship portion of his Metaphile manifesto. I dunno.</p>
      <p>I think Joe was trying to be provocative when he really was being reckless, spewing evil vitriolic dross—much in same way people say the f-word to show “they really mean it” or racial epithets when they run out of the more intellectual put-downs.</p>
      <p>In any case I find it hypocritical (and ironic) for Joe (especially) to make ANY marginalizing comments about ANY group when he is member of two oft-sidelined groups ever in history of human beings: gays and the disabled. (There are Born Again Christians who cuss up a storm and there are gay Muslims who find cursing repugnant... I bet that wasn’t apart of your equation Joe.)</p>
      <p>I think fear is at the heart of the issue. </p>
      <p>Joe, do really feel Typophile is taking something important from you? What are these “list of banned topics” involving the f-word? Are these topics particular to disability or homosexuality? Are they relevant to a website revolving around the typographic arts?</p>
      <p>Joe, if you got your way and Typophile was truly no holds barred, do you expect me or anyone else to keep the level discourse and the level of nastiness only to a bar you set and that everyone else except you be stung? Perhaps I <em>was</em> being veiled. In your truly meaningless conversation here in the ether are you willing to discriminate against Mormons, Muslims, Born Again Christians, Atheists or anyone else and yet not be held to the that same standard? If my “diatribe” was too “surreal” for you Joe then I’ll make it clear—I don’t do anything piecemeal. What you dish out, you will get dished back. Some will do it worse than I.</p>
      <p>Why are you fighting for freedom on Typophile for yourself when you want to marginalize students to their own zone YET you don’t want Zara to put your topics in a special folder?<br>
      Why do you say f.ucktard when this word is portmanteau of f.uck and retard—do you not champion the mentally retarded?</p>
      <p>I want you to think about ways you can feel strongly about something and fight vigorously for it, and bring it to success, yet in a way that doesn’t require the discrimination or disrespect of someone else. This doesn’t mean you have to dilute your being. You don’t have to appreciate an ideal, nor respect it, you can even hate it, but you do have to tolerate the person believing it .</p>
      <p>(That is a concept so many people failed to understand after 9/11.<br>
      Osama=terroist=middle easterner=all middle easterners are terrorists=let’s light up that mosque)</p>
      <p>Mike Diaz</p>
      <p>PS... Coles, I don’t ever recall saying I was gay on Typophile-never had sex with a man. SuperUltraPuzzlingFrequentUseOfTheWordFabulous?</p>
