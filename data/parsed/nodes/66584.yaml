    html: <p>I'm not a fan of content filtering, but if you're going to do it, the best way is to implement it as a user preference -- and if desired, enable it by default for guests and new accounts. Don't filter content as it's submitted; instead, filter it as it's sent to each person's Web browser, <em>if</em> that person has requested filtering. The pages that Typophile serves are dynamically generated anyway; adding a filter should have a negligible impact on performance.</p>
