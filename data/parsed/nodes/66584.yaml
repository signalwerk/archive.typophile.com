      <p>Hrant, boys don't have the swearing skills men have. Proper swearing really does separate the men from the boys but the other way around. Swearing can be powerful and beautiful. Knowing when to use horseshit instead of bullshit . . . kids don't know. Have you ever heard a kid deliver "**** son of a bitch" properly? They can't do it. When said properly it's a breathtaking tom, tom, bass, hihat, cymbal crash. You try when you're a kid but it just doesn't sound right. When you're 20 and your voice is a bit lower, you can deliver a good "bastard" with the proper oomph it deserves. It takes years do do it properly. To swap an expected swear with a more obscure one at the right moment is a fine craft. When I was a kid, I could hear old men swearing in such an manly way, especially Quebeckers. I loved how they threw in a little English "**** you" right in the middle of a sentence. It's said so quickly and casually; you wouldn't ever put a comma before it. Sublime.</p>
      <p>Forbidding specific English words is far more childish than using them.</p>
