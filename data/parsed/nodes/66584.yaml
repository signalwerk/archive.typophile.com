      <p>That said, I rarely mind other people swearing. Except when I feel sorry for a person becasue a valid point he's trying to make is masked by offensive-for-its-sake language; or when an impressionable person is present, and he leaves as a result. Quite often, not swearing is simply a wise compromise for the greater good.</p>
      <p>hhp</p>
