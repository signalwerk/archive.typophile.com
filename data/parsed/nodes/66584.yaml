      <p>I hesitate to make this post lest I reveal my other internet affiliations, but SomethingAwful has a filter that is turned off when a user is logged in, but if someone is just lurking, swear words are replaced by much less offensive phrases. The f-word is replaced by "gently caress," as in, "What the gently caress are you rambling on about?" or "Gently caress you." Its gerund form is replaced by "loving," as in, "you're such a loving idiot."</p>
      <p>I'm not suggesting that Typophile do anything like this, given that this is not a comedy forum, but there could be a filter that is only activated when a user is not logged in, and a user could turn the filter on or off, as Lex suggested.</p>
