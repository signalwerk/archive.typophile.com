      <p>Ray, I hear ya. I grew up in Lebanon, and Arabic is held up by many as by far the most glorious language to swear in - not just because of its repertoire of oldschool insults, but also because of its incredible acoustic range. I've experienced the same sort of high as you when witnessing masterful cursing; it can bring on a smile or even a loud chuckle, sometimes even if you're the target!</p>
      <p>But I rarely feel inclined to engage in it myself, especially not in a place like this. Reacting explosively to almost getting run over by a car is one thing, telling somebody off about his lack of respect for readability is another! Words, even the simplest ones, have so much subtle, nebulous power within them - I simply enjoy leveraging that too much to fall for the sledgehammer that is swearing. BTW, this might be running parallel to my preference for text fonts over display.</p>
      <p>That said, I rarely mind other people swearing. Except when I feel sorry for a person becasue a valid point he's trying to make is masked by offensive-for-its-sake language; or when an impressionable person is present, and he leaves as a result. Quite often, not swearing is simply a wise compromise for the greater good.</p>
      <p>hhp</p>
