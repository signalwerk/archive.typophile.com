      <p>I understand censorship to be the suppression of ideas, not necessarily the language in which ideas are suppressed. With this view, of course, comes the recognition that some ideas require particular language, but so far as I know it is general possible to talk about typography without profanity. [That said, I'm glad that my recent OED reference to the dog's bollocks was not censored.]</p>
      <p>If Typophile were a communally created and operated site, then I'd say that the members should determine what standard of language usage is desired. Typophile is a private concern, and I view my participation here as something like my attendance at someone else's house party. If my host doesn't want swearing, I will generally respect that wish. Of course, I'm able to look at it in such terms because I know various ways to circumvent the nanny when occasion demands.</p>
      <p>‘Circumvent the nanny’ is my new euphemism for fuсking.</p>
