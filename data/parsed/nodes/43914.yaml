    <p><cite>The design of Graublau Sans Pro took Georg Seifert over 5 years. With 7 weights and over 1000 glyphs per style, Graublau Sans is a type family that suits all typographic tasks. The regular styles have a rather clean and neutral appearance. The italics on the other hand, have a vivid design based on handwriting. For the use in headlines or logotypes Graublau Sans Pro offer 6 additional display styles with rounded corners and tighter spacing.<br>
    Beside the typical western codepages, Graublau Sans Pro also supports Greek, Cyrillic, CE (Central European) and Turkish. There are also several sets of figures available: oldstyle figures and lining figures (both proportional and tabular), small caps figures, fraction figures, subscript and superscript figures and figures inside circles.</cite></p>
    <p>Exclusively available at fonts.info:<br>
    <a href="http://www.fonts.info/info/en_graublau-sans-pro.htm" title="http://www.fonts.info/info/en_graublau-sans-pro.htm">http://www.fonts.info/info/en_graublau-sans-pro.htm</a></p>
