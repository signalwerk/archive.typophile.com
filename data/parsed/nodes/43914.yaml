      <p>Personally, I have a bit of "humanist sans fatigue." </p>
      <p>There have been so many new releases in this vein over the last several years that it's hard to get excited about another one, as accomplished/polished/complete as this one is.</p>
      <p>The expressive italics are a nice touch, and should help distinguish this face from other similar efforts.</p>
