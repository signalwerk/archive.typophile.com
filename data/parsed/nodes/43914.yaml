    html: |-
      <p>Chris,</p>
      <p>Keep working on yours. Yes, the Graublau Sans is lovely. Yes, there is a humanist sans fatigue among certain people. But remember that the Typophile community is a tiny fraction of the type using public, and one never knows what captures the public's attention. Four years is a long development. It may be best to work faster, release quicker, and then move on to the next design. Paraphrasing something I read about poetry, "Type design is never finished, only abandoned."</p>
