      <p>My comments weren't meant to discourage further releases in the humanist sans vein. And in part they reflect the fact that I spent the last 3 months looking at dozens of humanist sans as I searched for one to recommend as my employer's new corporate face.</p>
      <p>But I think the sheer volume of offerings available in this genre means that new releases must work harder to be noticed, whether that's in design, features or marketing.</p>
