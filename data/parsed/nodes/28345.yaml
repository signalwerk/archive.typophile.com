      <p>Things you can try:</p>
      <p>1. Export to InDesign Exchange format. Reopen.<br>
      2. Disable Auto-activation (if applicable). Disable ALL fonts. Put just the fonts you need in InDesign's font-folder. Log out, log in.<br>
      3. Create a new user. Try working in the new user account.</p>
      <p>(I surmise you are on OS X)</p>
