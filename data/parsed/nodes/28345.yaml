    <p>ARRRRRGH! (and I say that not because of <a href="http://www.survivinggrady.com/2006/09/willie-stargell-for-national-talk-like.html" rel="nofollow">NTLAPD...</a>)</p>
    <p>I am working on a book in InDesign CS (which needs to go to the printer today, natch), and FF Bau regular is acting up.</p>
    <p>It keeps substituting individual characters from the expert set, or from another typeface, willy-nilly.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bau_3_4783.jpg"></div><br>
    As you can see, the last two lines are gibberish. <p></p>
    <p>If I change typefaces, or even weights of Bau, and then switch back to regular, it fixes itself.<br>
    Until the next time I open it, of course, when it reverts to its old messed-up self.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bau_4_6187.jpg"></div><br>
    Now for some reason the last two lines are ok, but the date after Derrick's name has gone screwy.<p></p>
    <p>Any suggestions?</p>
    <p>I've trashed my InD preferences, I've cleaned my font caches, I've installed new versions of Bau direct from FontShop (thanks, Ivan!), but nothing seems to work. </p>
    <p>Any ideas would be greatly appreciated.</p>
    <p>Thanks,<br>
    ben</p>
