  html: |-
    <p>I have been contacted by a Mr. Mulindwa Arthur in Kampala,Uganda East<br>
    Africa with the following request. Does anyone out there know where to obtain this material?<br>
    Thanks.</p>
    <p>"I would like order for a type mould which are used in hand<br>
    casting type, plus its matrices of 14pt, 18pt and 24point in Times<br>
     Roman upright in alpha-numeric and their punctuation marks inclusive.<br>
     At our workshop I have three platen letterpress, I find a lot of stand<br>
     stills with scanty types. I kindly ask you to get us this kind of<br>
     mould so that we can revive our letterpress machines.<br>
     Kindly send us quotation plus shipping charges to Kampala,Uganda East<br>
     Africa. "</p>
