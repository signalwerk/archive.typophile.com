    html: "<p>Thomas: I guess now is as good a time as any to ask. I keep seeing the name Joseph W. Phinney pop up, one of the principals of Dickinson Type Foundry (later merged into ATF). Among other things, he was involved in the Centaur story. Any relation?</p>"
    html_clean: "<p>Thomas: I guess now is as good a time as any to ask. I keep seeing the name Joseph W. Phinney pop up, one of the principals of Dickinson Type Foundry (later merged into ATF). Among other things, he was involved in the Centaur story. Any relation?</p>"
  - id: 47501
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Yup, JW Phinney is a distant relative. Very distant, though--you have to go back to 1740 before you hit our common ancestor. <br> <br>I did a talk that was partly about him at ATypI in Vancouver last year, btw. I've done a bunch of research on him, because I was curious to learn more about his work and life. Knowing about him helped stimulate my pre-existing interest in type design of the mid 1880s to early 1930s. <br> <br>Cheers, <br> <br>T</p>
