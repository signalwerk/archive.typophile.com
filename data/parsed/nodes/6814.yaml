    date: null
    date_raw: null
    votes: null
    html: <p>Well, the son of a guy who came over on a boat (with his mom, as well). The guy who came over had seven kids, and one of them changed -- or maybe "solidified" is a better word given the state of spelling at the time -- the spelling of his last name to use a "Ph." <br> <br>The family came from Lenton, which was then a village just outside Nottingham. <br> <br>T</p>
