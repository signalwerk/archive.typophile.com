    html: <p>&gt; .... our common ancestor.  <br> <br>The guy who came over on a boat to America, right? I remember you writing something about that on the TD list, about 3 years ago. At which point Bill Troop promptly lambasted your uncle Joe, right? <br> <br>hhp</p>
