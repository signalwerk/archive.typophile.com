    html: |-
      <p>For news setting I personally favor wide fonts (with large x-heights) for these reasons:<br>
      – Wide fonts can be set at smaller point sizes than narrow ones: you end up with the same apparent size, but you don't lose the space savings every time there's a paragraph break (something very frequent in news typography). Basically you predictably save <em>vertical</em> space on every line no matter the text.<br>
      – In terms of readability wide fonts leave more room for bouma* divergence.<br>
      – In terms of "mood", wide is earthy (while narrow is classy) and that suits news.</p>
      <p>* <a href="http://themicrofoundry.com/ss_read1.html" title="http://themicrofoundry.com/ss_read1.html">http://themicrofoundry.com/ss_read1.html</a></p>
      <p>hhp</p>
