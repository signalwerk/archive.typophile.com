    html: <p>I'm not a type designer, but in the U.S. (and other countries I assume) sales of printed newspapers are declining as younger people read the news online, and advertisers move to the web. Perhaps some changes in printed newspaper design are attempts to make newspapers more appealing to younger readers.</p>
