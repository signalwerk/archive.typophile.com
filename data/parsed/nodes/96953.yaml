  html: |-
    <p>Hello to all,</p>
    <p>I know the importance of good graphic design - but don't have the means to have a graphic designer revisit mine (which I'm trying to set up).<br>
    Nevertheless, maybe something can be done about the font, at least for the header/name (the rest I think I'll keep in Tahoma or courrier). Would you give me your feel about a font if I describe what is the aim of the site and what I whish to express?<br>
    I know well it's a personal choice, but my range of font is extremely limited, so all advise, feel, any idea would be really  welcome!</p>
    <p>The site will about saving a home/ historical, the subject serious, communicated mostly through pictures but also some text of course. The content Iam aiming for is clear, honest, and also aesthetic. The design and structure so far I wish as clean, simple, but significant - there should be an own identity to the title/  name. I haven't designed a logo yet, so for the moment I just wish to give as much meaning to the name by choice of font as possible, it's 'deeprooted'.<br>
    I was going for Arial in size 72, bold black, but maybe there are more fitting choices with a stronger identity - </p>
    <p>have you alternatives in mind?</p>
    <p>many many thanks - let me know if I should clarify</p>
