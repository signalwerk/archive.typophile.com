      <p>If you're limited to system fonts I think Georgia and Constantia convey a mood compatible with what you're describing (partly because they have hefty Bolds, and you seem to want weight).</p>
      <p>BTW, Tahoma is flawed for extended text (too tight) which is why Verdana was created.</p>
