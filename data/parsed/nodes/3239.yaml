    html: <p>hi tim . just saw your work. ...the usual suggestions... <br>lc "s" needs a bit more work, weights are a bit uneven, lc "k" stems are a bit out of character from rest try centering them a bit more, Swooshes are a nice little addition but "tips should be similar either oval horizontals or verticals. not just the flip. lc "e" seems thin in center, lc "a' has a tiny bit too much overhang, b and d would perhaps look more symetrical withrest of forms if  <br>the bowels came in with a bit of curves vs. straight. uc M seems thin in center v-shape... keep going...</p>
