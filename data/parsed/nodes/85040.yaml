    <p></p><div class="imageWrap"><img src="http://typophile.com/files/relaunch001-home small_5338.JPG"></div><p></p>
    <p>&nbsp;<br>
    <strong>Improved Font Browsing and More Comprehensive Search Results Headline New Features</strong></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, and its subsidiary, Linotype GmbH, have revamped <a class="freelinking external" href="http://www.linotype.com/" rel="nofollow">Linotype.com</a>, offering visitors an improved site experience for all things relating to typefaces – from browsing, licensing and downloading fonts to learning about type and how to use it effectively.</p>
    <p>More than 130,000 fonts are available from Linotype.com, which features the prestigious Linotype® collection, home to some of the world’s most widely used designs including the renowned Helvetica®, Neue Frutiger® and Univers® families.  The redesigned site now features a more streamlined approach to searching Linotype’s vast offering, enabling site visitors to quickly and easily distill results. Several search criteria are available and may be combined, including searching by font library or font foundry; by typographic category such as “sans serif” or “script;” by usage such as “magazine” or “newspaper;” and by theme such as “business” or “casual.” Results may be further narrowed by applying filters, such as showing only the fonts that support a particular language, or displaying fonts that offer OpenType® typographic features such as contextual ligatures or small caps.</p>
    <p>“Linotype.com is now at the forefront as an online type resource,” said Lorenz Schirmer, marketing director at Linotype. “With its enhanced look-and-feel, the site is also much more pleasurable to use. Moving forward, we’re planning additional filters that will make browsing and searching even more powerful.”</p>
    <p>“We linked information and functions. This gives users a very smooth searching and shopping experience,” said Manual Fork, chief executive officer of Fork Unstable Media, a Hamburg-based creative agency that designed the site.</p>
    <p>Linotype.com was designed using Web fonts from Monotype Imaging’s Fonts.com Web Fonts service. The Generis® Serif typeface from the Linotype collection is used for headlines and Neue Frutiger is used in the body copy.<br>
    In addition to various improvements to the Linotype.com store, the site features detailed information on corporate design and identity services as well as offerings targeted to manufacturers and developers of consumer electronics devices. </p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype and ITC® typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>.</p>
