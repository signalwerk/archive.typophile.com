  html: |-
    <p>Hi all,</p>
    <p>At present I do not own any Printed Font Reference guides/books. As I am tyring to become more serious about my design work and are interested in becoming a better designer, owning a few of these (which I didnt even know existed) hopefully would benefit me.</p>
    <p>I see the Fontbook is availabe, does any know what year this was last updated?<br>
    <a href="http://www.fontshop.com/products/fontbook/" title="http://www.fontshop.com/products/fontbook/">http://www.fontshop.com/products/fontbook/</a></p>
    <p>I also see the Font Bureau Third Edition Specimen Book but that was published in 2001.<br>
    <a href="http://www.fontbureau.com/books/" title="http://www.fontbureau.com/books/">http://www.fontbureau.com/books/</a></p>
    <p>Can anyone recommend any other printed referenes or free online PDF’s etc.</p>
    <p>Any help would be great</p>
