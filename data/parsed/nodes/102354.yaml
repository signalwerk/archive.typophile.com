    html: |-
      <p>Given the fact Minion was born as a sister to Myriad, the two typefaces work very well together. I believe they share the same x-height and roughly the same width, although that can be modified with Multiple Master. I think Myriad and Minion were the first Multiple Master fonts released by Adobe in the mid nineties.</p>
      <p>Myriad has a great level of legibility, but it is used in Apple’s advertising and therefore I think a lot of people associate it with the Apple brand.</p>
