  html: |-
    <p>Hi guys,</p>
    <p>I'm looking for a simple, honest and approachable san serif for use in body text.  My idea is to have a journal feel but without being too themey. Something with the characteristics above that come together looking elegant. I loved the feeling of Frutiger on my page ( one of my faves) and although quite neutral  it's the complete opposite of what I want, its cold and distant and not really in line with the honest feel i'd like to convey.</p>
    <p>I like Myriad Pro but wanted to see if there are others you can recommend, perhaps something I am simply not finding. Any recommendations would be appreciated.</p>
    <p>Thanks!</p>
