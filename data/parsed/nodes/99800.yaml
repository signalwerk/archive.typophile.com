    html: |-
      <p>I believe that small case a's, as well as g's, are the letters that have the most nuances, details and "personal touch" from all characters in a given font. The ampersand is beautiful too, but an a is beautiful in its simplicity.</p>
      <p>The new project is a serif font, something I wanted to do long, long time ago.</p>
