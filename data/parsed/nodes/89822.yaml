  html: |-
    <p>Type Directors Club has posted an announcement of [[http://www.tdc.org/archives/4147/]TDC Non-Latin Weekends], a series of professional seminars and workshops on non-Latin type design.</p>
    <p>The first seminar in the series of four will address the problems related to the design of Cyrillic typefaces. It is scheduled to take place from Friday, March 2 to Sunday, March 4, 2012. Reservations for TDC Cyrillic Week-End are now open. Seating is limited.</p>
    <p>The course will be taught by Maxim Zhukov. </p>
    <p>A similar series of seminars was offered by the TDC five years ago. Detailed information on TDC Cyrillic Week-End 2007 is available on the Type Directors Club’s Web site. It was also discussed on [[http://typophile.com/node/31986 ]Typophile.com]. </p>
    <p>Maxim Zhukov specializes in multilingual typography. From 1977 to 2003 he worked for the United Nations. For many years he has been intimately involved in typeface design, consulting for many individual designers and type foundries. Among them are Adobe, Agfa, Ascender, Bitstream, Carter &amp; Cone, Font Bureau, International Typeface Corporation, Microsoft, Monotype, ParaType, Typoart. Maxim Zhukov is a member of many Russian, American and international professional societies and associations. He is a member of the Board of ATypI, and the member of the Board of the Type Directors Club.</p>
    <p>Note: I have adapted this text from the TDC web site and Atypi's web site</p>
    <p><a href="http://www.atypi.org/news/tdcnonlatinintensive2012" title="http://www.atypi.org/news/tdcnonlatinintensive2012">http://www.atypi.org/news/tdcnonlatinintensive2012</a></p>
