      <p>It’s a very clean approach and it’s definitely better than the original, but it’s stil a bit bland. Are you going to incorporate any other colors or textures? At least use a richer/darker green something closer to a tyipcal Forest Green for the “Green Fields” type. </p>
      <p>I do like the hill and tree illustration, but the sun and clouds looks too childish and unrealistic. I’m not sure the sun actually has straight lines shooting out of it. I’m visualizing something with a lot more  color (yellows&gt;oranges&gt;reds) and maybe even a gradient or two. </p>
      <p>And the lower case co. next to the all caps ARTS doesn’t seem right. either use all caps or all lower case.</p>
