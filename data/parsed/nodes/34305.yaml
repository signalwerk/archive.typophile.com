      <p>Even if you decide against incomporating some colors from the previous pallette, a few shades of green could help add some depth. For instance using a darker, richer green for the type and filling the white area possibly with the more yellow green you are using for the time now.</p>
      <p>I also agree about the “ARTS co.” area. It feels a bit like an after thought in how the type was handled (not to mean offense, just that it seems very much as if it were the last bit you added). I think all lower case may help.</p>
      <p>Overall I think it is worlds better than the original (which for some reason seems NASCAR-esque to me (slanted type and color bars probably)</p>
