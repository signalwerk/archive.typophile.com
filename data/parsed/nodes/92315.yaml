      <p>The type for "SOAIS" looks like <a class="freelinking external" href="http://www.iconian.com/g.html" rel="nofollow">Gunship</a> by Iconian Fonts. Use lowercase; the uppercase /I/ has serifs.</p>
      <p>Also seen at Dafont: <a class="freelinking external" href="http://www.dafont.com/gunship.font?text=soais" rel="nofollow">Gunship</a>.</p>
