    <p>ABC Zoo is a collection of two typefaces where the alphabet letters are combined to create a design of animal using the own letter of the name of each animal. You can see the entire set of this fonts at<br>
    <a href="http://new.myfonts.com/fonts/intellecta/abc-zoo-english/" title="http://new.myfonts.com/fonts/intellecta/abc-zoo-english/">http://new.myfonts.com/fonts/intellecta/abc-zoo-english/</a><br>
    <a href="http://new.myfonts.com/fonts/intellecta/abc-zoo/" title="http://new.myfonts.com/fonts/intellecta/abc-zoo/">http://new.myfonts.com/fonts/intellecta/abc-zoo/</a></p>
