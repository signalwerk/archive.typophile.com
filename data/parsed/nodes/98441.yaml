      <p>The paragraph indent is a legacy from the days when ideas were plentiful and paper was scarce, so publishers used every space-saving technique available (including justified right margins).</p>
      <p>Paper is ceasing to be a limiting factor on the publication of ideas, and ragged-right columns and extra space between paragraphs are becoming more common. But that didn't come about because of supply and demand.</p>
      <p>Until the 1980s, the only way to get copy ready for publication (i.e., presented in typographic letterforms), was to pay a professional with years of training to enter the copy into a big, expensive typesetting machine. Part of the training those professionals got was the publishing standard of justified columns and indented paragraphs with no extra space between them.</p>
      <p>Starting in the 1980s, any fool with a desktop computer could put his (or her) copy into typographic letterforms, and thus render it ready for publication, sort of. First-generation word-processor users had never been trained as professional typesetters, but they had learned to type business letters on a typewriter, i.e., they had learned "block style": ragged right with an extra space between paragraphs. Word processing evolved into desktop publishing, bringing with it the default practices of the office typing pool, rather than the standards of professional typesetters. A vestige of this evolutionary path is that many people who've never seen a typewriter have a tendency to put two word spaces after the period at the end of a sentence.</p>
