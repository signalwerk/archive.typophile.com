      <p>It's a plus and minus, James. I have to do more design work these days, too -- hard to find a good traditional designer... ;-)</p>
      <p>The technology helps, thought, if you're willing to take the time. In type, true-cut superiors, small caps, etc., we can all now make the things for which we use to be at the mercy of the foundries. Spacing work can be done, even weight tweaking. Much of this can be done, or closely approximated,  in an  applications program like InDesign.</p>
      <p>The biggest plus is black &amp; white halftone work. You can now get an ICC graysale profile (well, sometimes you have to figure it out) for a particular printer and a particular paper. Often the printer doesn't know, but even here, there are standards. You lose some shadow detail if you can't get the "exact" profile. Truth to tell, they can only hold +/- three to five percent on press, which makes things a bit of a crap shoot.</p>
      <p>You can then set up an inkjet in the office to essentially make b&amp;w proofs that will be very close to what you'll get on press, and adjust your work accordingly. The same for color, of course, but it is harder, more work. For color, we set up to match the printers' laser proofer, and assume they can match their own proofer. If they can't, we all know where the blame lies...</p>
      <p>The biggest problem is all the ham-handed tinkerers who go into the image in Photoshop &amp; posterize things with their so-called adjustments, or clip the black/white points. Do your adjustments in layers, so the original image is unmodified. Flatten at the end, &amp; write that off as a separate file. Save the original, working image file as a .pfd (NOT .pdf). If you have to send the image to a professional downstream, or adjust the image in proof, you'll be glad to have that .pfd with the original image &amp; layers.</p>
