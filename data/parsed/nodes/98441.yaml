      <p>From what I know space was left by the scribes for somebody else to later add a large decorated initial. But to sell cheaper copies some books never got the initial (although the missing letter was somehow added of course, often by simply <em>printing</em> it, sometimes at a tiny text size right in the middle of the gaping hole). Eventually that emptiness became acceptable style. Legacy junk.</p>
      <p>Certainly not every paragraph was intended to get a large initial, but I'm pretty sure indenting was not acceptable style before "missing-initial-syndrome" kicked in.</p>
      <p>The great thing about the pilcrow is that you can start a new idea (the main -maybe only- point of a paragraph break) without wasting space or causing ungainly gaps.</p>
      <p>hhp</p>
