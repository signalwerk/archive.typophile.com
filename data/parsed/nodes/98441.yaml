      <p>One of the unfortunate side effects of modern technology is that graphic designers do a variety of jobs themselves that used to be done by specialists who were probably better at it. I used to have professional typesetters set my type; now I do it myself. Photos used to be scanned and retouched by specialists; now I drop in a digital file and tweak it in Photoshop. Many designers do their own prepress work (trapping, etc), rather than letting the printer's prepress professionals do it.  And so forth. </p>
      <p>(Not that I'd want to go back to the days of waiting overnight to get type galleys and then pasting them up with rubber cement; I'm glad those days are gone.)</p>
