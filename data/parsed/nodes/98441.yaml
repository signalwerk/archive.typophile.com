      <p>Hrant, to reiterate, the indent space with EVERY paragraph was not to have a letter painted in. Read my post again. </p>
      <p>If that's not enough -- and it probably shouldn't be -- go look at specimens we have, 1560 through, oh, say yesterday. Lots of books. If you want a quick source, Updike covers a long time period and a lot of nationalities.</p>
      <p>@Victor. </p>
      <p>Well, the 1980s is perhaps an unfortunate choice for the date. The IBM strike-on composer had been in use for a while, and you *could* use a personal computer like the Xerox Star to drive a Linotron 202 (we did) by the mid-1980s, but PostScript was a child of the 1990s, and it wasn't really until the mid-1990s that "desktop" publishing" was a viable option. </p>
      <p>Moreover, "self publishing" was still just another name for "vanity publishing." But I take your point.</p>
      <p>Typesetters like me didn't become irrelevant until later. Actually, we're still not irrelevant if a publisher doesn't just rent their imprint, but uses it as a mark of professional work, of standards in selecting what to publish, editing, and manufacturing. </p>
      <p>Sadly, you're probably right for the future -- publishing is becoming just another land populated by mid-level-managers, who tell you  they provide "content" when caught &amp; questioned between their meetings.</p>
      <p>None of our rantings changes the simple fact that the purpose of writing is to communicate, and (1) that requires an audience, and (2) it is rarely the designer's job to challenge that audience. </p>
      <p>As I once told a designer who thought otherwise, you want to challenge the audience, write your own damn book. He didn't. And author's didn't like his work, I wonder why? So he took the only avenue left, teaching.</p>
