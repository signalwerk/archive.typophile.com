      <p>While I'm probably not really understanding your post, it seems to me that the people supplying you with artwork should convert their text to outlines before sending files for production.</p>
      <p>If you are offering your customers the choice from a list of fonts, you should license those fonts. You are earning money using the fonts, so it is only fair that you should properly license those fonts. Depending upon what your country's tax laws are, you may find that you can deduct the purchase as a business expense.</p>
