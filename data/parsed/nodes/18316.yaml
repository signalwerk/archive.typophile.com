    <p>Windows XP User</p>
    <p>I work for a retail store online that personalizes products from many different vendors. Each vendor offers many different types of fonts. If we do not have a font that they offer or they don't give us the font(s), we will purchase the font(s). These fonts are strictly for viewing on the web, not for print. Are we obligated to purchase the fonts? or should the vendors (legally) supply us with them since we are not using them for printing purposes? Is there any documentation on this topic? Any help would be greatly appreciated.</p>
  html_clean: |-
