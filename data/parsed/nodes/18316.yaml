      <p>Enzo,</p>
      <p>If I'm reading this correctly, to protect yourself legally you should have some kind of form that a partner would sign that says they have the rights to pass the fonts to you, and on that form they should list the name of the font vendor and some kind of reference to when the license was purchased - this should cover you legally and serve as a reminder to your clients that they need to obtain licenses for any fonts they pass on.</p>
      <p>Cheers, Si</p>
