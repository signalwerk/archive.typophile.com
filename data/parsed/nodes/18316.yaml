    html: |-
      <p>A few things:</p>
      <p>1. The best thing you could do is ask your vendors for a sample image of the typeface. If you are using this on the web, just give the vendors a template. This keeps you from having to license the type as well as keeping you free from having illegally had copies of the fonts.</p>
      <p>2. If you are using the fonts you should license them.</p>
      <p>3. You should not have them give you copies of the fonts as most of -- 99.9% -- the EULAs out there do not allow this.</p>
