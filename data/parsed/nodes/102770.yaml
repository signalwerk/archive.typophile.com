      <blockquote><p>Furthermore -normally- the pen is always pulled and never pushed.</p></blockquote>
      <p>In formal writing / calligraphy / interrupted scripts the pen is always pulled (downstrokes only as in n) and never pushed. But in  cursive writing/calligraphy the upstrokes connect the downstrokes may be pushed (upstroke as in <em>n</em>). In informal writing / calligraphy / running script the upstrokes are always pushed.<br>
      The Stroke by Gerrit Noordzij may be an good read when you are interested in that subject.<br>
      Getting the tangents right is troublesome indeed. I wrote something about that subject on page 20 of my brochure entitled <a class="freelinking external" href="http://issuu.com/fontfont/docs/ff_din_round" rel="nofollow">FF DIN Round digital block letters</a>.</p>
