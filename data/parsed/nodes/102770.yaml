      <p>Interesting.</p>
      <p>A lot of the terminology you're using seems to be coming from the world of 3D animation (something I myself used to do, but in the dark ages) which few type design people are familiar with, so it's a little hard to follow.</p>
      <p>If I understand correctly that you want to do 3D calligraphy, I would say that -to make it more interesting than merely dragging along a blob to make letters- you need to analyze what makes 2D calligraphy more than writing with a ball-point pen.</p>
      <p>I'm sadly not a calligrapher, but I've been paying attention, and I believe formal calligraphy is based on manipulating a one-dimensional shape (namely the flat, wide tip of a broad-nib pen) in one or more of three ways: translation (movement along the 2D Cartesian space), rotation and modulation (pressure = releasing more ink); note however that not all three of these are always used; also, in <em>type</em> what the pen wants is often ignored. Furthermore -normally- the pen is always pulled and never pushed.</p>
      <p>Extrapolate these to 3D:<br>
      - The tip of your pen must be a 2D form. What shape should it be? Probably a parallelogram. But what aspect and cant?<br>
      - Translation is very easy - just add depth.<br>
      - For rotation you need two dimensions, not three: the direction the pen tip is pointing is what limits it to two.<br>
      - For modulation you need to figure in which dimensions the pen can swell. Is it two or three? Not sure.<br>
      - Lastly, what is pull/push here?</p>
      <p>hhp</p>
