    <p>Hello there</p>
    <p>I'm designing a 3D letter, like Steingruber did with his <a class="freelinking external" href="http://www.spamula.net/blog/2005/10/steingrubers_alphabet.html" rel="nofollow">alphabet</a>.</p>
    <p>But for the letter build, I would like to go in a calligraphed way.</p>
    <p>As I couldn't find a weapon of choice to make it in 3D, I decided to draw the iso-lines of the basic shape tool -tend to be used as a pen-, and use each iso-line to draw the letter's iso-lines as separate letters.</p>
    <p><a class="freelinking external" href="http://kepfeltoltes.hu/130504/von_sok_www.kepfeltoltes.hu_.png" rel="nofollow">http://kepfeltoltes.hu/130504/von_sok_www.kepfeltoltes.hu_.png</a></p>
    <p>Here are the iso-lines of that pen shape:<br>
    <a class="freelinking external" href="http://kepfeltoltes.hu/130504/alapelem_szintvonalak_kicsi_www.kepfeltoltes.hu_.png" rel="nofollow">http://kepfeltoltes.hu/130504/alapelem_szintvonalak_kicsi_www.kepfeltoltes.hu_.png</a></p>
    <p>My question is, how to construct an iso-line based on that, for the letter?</p>
    <p>More precisely: how to use a 2D shape as a pen tool, when accurate geometry is needed?<br>
    Like, there is a function for that in gimp, and the scatter extension come close to it in inkscape,<br>
    but none of them nail the problem.</p>
    <p>Is there an automatic workaound for that?<br>
    If there is no such, how would you construct a curved stroke, drew by a "random" shape?</p>
    <p>Basically I want to draw them in a vector format that could be imported to blender.<br>
    And, as the 3D work would need, draw the curves from many nodes, in right positions.</p>
