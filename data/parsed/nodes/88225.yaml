      <p>&gt; how can I set that up as a style so that only the first line<br>
      &gt; has leading of 14.4pt ...</p>
      <p>Perhaps there's some workaround to do that, but a simple design change would eliminate your formatting problems. Have you considered just putting more space below the item heading? Just give it the same leading as the paragraph below it.</p>
      <p>This would make the formatting much simpler. You wouldn't have to mess with baseline shifts or other workarounds, and frankly I think it would look better, too.</p>
      <p>(If you're worried that this spacing change would make the item and subject heads too much alike, perhaps one could be made italic.)</p>
      <p> It would look something like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/example_4865.jpg"></div><p></p>
