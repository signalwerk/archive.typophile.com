      <p>The text is doing what it's supposed to. The distance between the baseline of the first line of text and the baseline of the item heading above is going to be determined by the leading of the text. </p>
      <p>If you want the space to be less than the leading of the text itself, then I think your simplest solution will be to apply a negative baseline shift to the entire item heading, and then compensate by reducing the leading of the item heading by the same amount. </p>
      <p>This can then be easily propagated throughout via a stylesheet.</p>
