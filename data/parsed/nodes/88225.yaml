      <p>Word's line-spacing issues can be avoided by setting the line spacing in pts instead of "single" and so forth.</p>
      <p>Additionally, in western fonts cross-platform line spacing differences in Word would be simply a font bug. Carefully produced fonts can avoid this by synchronizing the platform-specific metrics in the font. I don't know if there is anything special going on for Asian fonts in this regard such that it is more problematic, or if it's still just an easily corrected error in font production.</p>
      <p>Regards,</p>
      <p>T</p>
