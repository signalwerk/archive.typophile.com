    html: |-
      <p>Word and InDesign I think use different metrics in the font and handle them differently. In InDesign you have much better and more explicit controls. The top line begins with ascenders just below the top of the text box—unless you lock the text or the first line to the grid—and then you've got controls over everything else. </p>
      <p>So you can't take the Word file and expect it to look identical in InDesign. As Theunis says, the best thing is to forget about the formatting in the original Word document, and re-set it afresh in InDesign, using its better controls.</p>
    html_clean: |-
