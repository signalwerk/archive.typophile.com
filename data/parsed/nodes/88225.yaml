      <p>&gt; All paras are showing the same symbol </p>
      <p>Okay very good. Even though it wasn't part of the solution this time, viewing the hidden characters is a good troubleshooting tip to remember. </p>
      <p>In fact I routinely make the hidden characters visible while working on documents. It's a good way to immediately spot formatting errors such as extra spaces, soft breaks where hard breaks were intended, and so forth.  And when I import Word files given to me by clients, I often find that they've used a lot of weird formatting techniques (forcing a line break by inserting a tab at the end of a line, for example), and showing hidden characters makes these things easy to spot.</p>
