    html: |-
      <p>When type isn't doing what I expect, the first thing I do is to view the hidden characters (Type &gt; Show Hidden Characters) to see if that gives me a clue. </p>
      <p>In the example below you can see in blue the characters for a hard break (Return) and a soft break (Shift-Return). If you have a soft break after the subhead, InDesign will view the subhead as part of the paragraph below it, and the leading you apply to the text might end up accidentally getting applied to the head also.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/breaks_6092.jpg"></div><p></p>
      <p>Also, if you're adjusting the text's leading via a style sheet, make sure the subhead doesn't accidentally have the same style sheet applied to it as the text, or that the subhead's style isn't based on the text's style. One way to check that is to open the style sheet for the text and change the text's color. If the color of the subhead changes too, then you know it's a style sheet problem.</p>
    html_clean: |-
