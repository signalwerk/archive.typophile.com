      <p>Firstly, I am not sure why you want this look, as it looks rather like a mistake to me.</p>
      <p>But, if you really want it, here's how you do it simply.</p>
      <p>Create a paragraph style with the appropriate leading for the entirety of the paragraph. Then create a separate character style that is identical (and "based on") the first style, but with less leading. Add the character style to the paragraph style as a "nested line style" that will apply it to just the first line.</p>
      <p>Done!</p>
    html_clean: |-
