    html: |-
      <p>Here is the standard behavior. The Item Head has 18pt linespacing (baseline-to-baseline distance from Subject Head to Item Head). The text is set 12pt on 15pt linespacing. Thus the baseline-to-baseline distance between Item Head and Text is 15pts.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BaselineNormal_3572.png"></div><p></p>
      <p>&nbsp;<br>
      If you want the baseline-to-baseline distance between Item Head and Text to be 12 pts, then baseline shift the Item Head -3pts. But that will open up equivalent space above; so, to maintain Subject-to-Item spacing, you have to reduce the linespacing on Item Head by the same amount: thus it now has 18 – 3 = 15pt linespacing.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BaselineShift_6412.png"></div><p></p>
