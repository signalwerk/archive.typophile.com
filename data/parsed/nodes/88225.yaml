      <p>"Word automatically sets I think 20% leading as "single" spacing,"</p>
      <p>Actually, Word's "single" spacing is font-specific, depending on the vertical metrics of the font (usually equvialent to the vertical extents of the bounding box). So in one font it might be 15% and in another it might be 40%. Thanks to this, even applying italics or boldface on a given line can change the spacing in Word....</p>
      <p>Cheers,</p>
      <p>T</p>
