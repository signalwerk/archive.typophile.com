      <p><cite> &gt; Then create a separate character style that is identical (and "based on") the first style, but with less leading.</cite></p>
      <p>Joshua’s is an equally clever solution. </p>
      <p>One clarification: you can’t base a Character style on a Paragraph style.* Just make sure that the only value defined in your first-line character style is the leading field (presumably the only value you want to override for the first line). All other fields should be left blank in order to have any future edits to the paragraph style maintain precedence.</p>
      <p>*This is true up to CS 5, anyway. I don’t know if maybe Adobe changed this in CS 5.5</p>
