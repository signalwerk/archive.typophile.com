    html: |-
      <p>Ok, I'm checking how Word works. Normally you control spacing between lines in Word by the format paragraph menu, not the format character menu. When you tell it to do 1 1/2 line spacing, it applies that to lines *below* the formatted lines, not above, so the behavior is opposite of InDesign, which I think is what has been confusing you. </p>
      <p>Word automatically sets I think 20% leading as "single" spacing, so you have to work from that to translate between InDesign and Word. And 1 1/2 lines of 12 pt is not 18 pt but 21.6 pt (I think). You have to use the "exactly" line measurement in points if you want to set the distance between baselines to an exact point measurement.  In any case, it will not affect the line above the paragraph, but below. Let me put this another way: if you want to control layout precisely, Word is a nightmare. </p>
      <p>So just design in InDesign and be happy. Or less unhappy, depending on your temperament.</p>
      <p>You answered Kent that the problem was not the heading. But you are thinking in Word, not InDesign, where the vertical gap affects lines above, not below, as in Word. So his work-around for full paragraphs, which is necessary to put in a paragraph style sheet, has to involve the heading in InDesign. So his work clever work around—thanks Kent—will work as promised. Try it, you'll like it :)</p>
