    <p>I am converting word documents over to InDesign and am having a problem with line spacing. In Word the body text aligns neatly with the Item Heading, however in order to achieve the equiv. of 1.5 line spacing (Word Term) in ID CS5.5, the same effect is not achievable, as when leading is added the whole paragraph moves down. Does anyone know how to fix this so that my body text can appear flush with the item heading? Please see the image attached.</p>
    <p>Thanks</p>
