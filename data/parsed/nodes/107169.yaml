    <p>I thought perhaps some people here would get a kick out of this 18th-century Swiss automaton, that writes letters on a page using a set of programmable mechanical instructions, an analog version of today's engraving and Leroy machines.</p>
    <p><iframe width="560" height="315" src="//www.youtube.com/embed/FUa7oBsSDk8" frameborder="0" allowfullscreen=""></iframe></p>
