    <p>I'm looking for the variation on the classic New York Times font that can be found on the T Magazine website and in the print editions as a sub-header and occasionally header. Any help is greatly appreciated.</p>
    <p>NY Times won't allow copying of images, so I only have links. And of the pages have it at the top, labeled "Women's Fashion", "Men's Fashion", "Design", "Travel", etc.</p>
    <p>Try <a class="freelinking external" href="http://www.nytimes.com/pages/t-magazine/mens-fashion/index.html" rel="nofollow">here</a><br>
    Or <a class="freelinking external" href="http://www.nytimes.com/pages/t-magazine/travel/index.html" rel="nofollow">here</a></p>
    <p>Thank you so much.</p>
