      <p>You can find on Commercial Type's Facebook page photo section it states that 'In June 2009, Berton Hasebe drew Karl, a hairline blackletter display type, exclusively for T, the New York Times Style Magazine. Karl is based on NYT Fraktur originally drawn by Matthew Carter.'</p>
