    html: "<p>Update:  Commercial Type's \"Marian Black\" is significantly different than Karl-Hairline, the font that's still being used by the New York Times T-magazine. Marian Black is more of a Fraktur, and shares little with Karl-Hairline other than a general blackletter-like appearance.</p>"
