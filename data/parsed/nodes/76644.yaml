    html: <p>I think these modern tiles are based on the original 1900's ones from when this early stretch of the Northern Line was the Hampstead Tube, and they were put up in a mid-'90s refurbishment. Right now I'm looking at a photo of Euston in 1907, which I'll try &amp; scan later, and it looks the same. I don't think they have them anywhere at Euston now, but have you seen them on any other line apart from the stretch of the Northern between Hampstead &amp; Mornington Crescent.</p>
