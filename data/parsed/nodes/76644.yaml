      <p>In case anyone knows a good match, here are the original tiles at Euston in 1907:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Euston1907_4086.png"></div><p></p>
      <p>And my photos of the new tiles which were at the earliest mid-'90s.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/MyShots2009_4901.png"></div><p></p>
      <p>London Transport seem to be very good at archiving all their material, and as the original plans for the 1900s Hampstead Tube stations still exist I expect they had the drawings of the original lettering to work from.</p>
