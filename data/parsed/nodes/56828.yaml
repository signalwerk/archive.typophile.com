    html: <p>Its not. In the metrics window letters kerned into the A have a blue line mark showing the kern distance. They preview fine in the metrics window. The only place they don't is in the OT features preview. All other kerning shows up except letters kerned to A. It hasn't been a problem since I know the kerning is there, its just weird it doesn't show in that one preview window.</p>
