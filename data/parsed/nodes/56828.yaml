    <p>Yesterday I was working on an OT font and double checking some kerning. In the metrics window kerning shows up as it should. It has a generated kern feature which I can turn on in the OT preview panel.</p>
    <p>What I noticed that was weird is kerning worked everywhere except letters kerned to the cap A in the OT preview panel. I even muddled through the kern feature code to check and it shows up there and generates with kerning. It just won't preview anything kerned to A. I wondered if it has something to do with A being the default first character.</p>
