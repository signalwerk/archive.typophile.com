    html: |-
      <p>There is probably a check box somewhere in the preferences that says, "Show kerning with cap A in preview window" that's not checked. (Kidding.) </p>
      <p>Are you using class-based kerning? If so, it may be that you have "A" in more than one kerning class. (Although, usually there is a warning about this when you compile the OT features.)</p>
