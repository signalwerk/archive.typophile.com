      <p>Did you define basic parameters for Justification? To do this, close all documents in InDesign. Then go the Paragraph-pallette and choose Justification (via the triangle-button) or use the keyboard-combination Command-Option-Shift-J.<br>
      Here you define values for Word &amp; Letter Spacing and Glyph Scaling. Eg my standard values are:<br>
      Word Spacing - Minimum 75% - Desired 87% - Maximum 100%<br>
      Letter Spacing - Minimum 0% - Desired 0% - Maximum 0%<br>
      Glyph Scaling - Minimum 99% - Desired 100% - Maximum 101%<br>
      Auto Leading: 100%<br>
      These values will be used for all documents you CREATE afterwards.</p>
      <p>The values above give the Composer some latitude when Justifying text. For unjustified text reasonably tight wordspacing is achieved.<br>
      For some typefaces it is necessary to change these values, eg Gill Sans, which is way too loose.<br>
      Hope this helps.</p>
