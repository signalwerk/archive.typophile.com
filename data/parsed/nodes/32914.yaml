      <p>What you could try as a test would be to use InDesign’s single-line composing mode, pick the same values you use in Quark (70-100-150?), using the the same old Type 1 font, and see what happens. Most single-line composing programs work about the same, so if the two are making the same line ending decisions, you have a starting point.</p>
      <p>I came to ID from TeX, which uses a paragraph optimization routine which is to my mind superior to ID’s paragraph composition mode. Could just be sour grapes on my part, I suppose. Anyway, I found that I had to go into the fonts &amp; make the “ideal” wordspace smaller, usually right around 200/1000, then use 80% 100% 120% as justification settings. You could get the same effect by varying the ideal &amp; min percentages, I suppose, but we’re trying to set up fonts so our comps can just use 80-100-120 for text settings.</p>
      <p>To give you some idea of the difference with TeX, we use to use the equivalent of 65% 100% 140% to get roughly the same results — of course, TeX would not exceed certain limits (you get an overfull box to resolve by hand); Neither Quark nor ID do that.</p>
      <p>I did look at your PDF. As you say, it is a mess &amp; I can’t imagine what values gave you so tight a setting. As to loose, hum.</p>
      <p>Anyway, try the single line composition mode.</p>
