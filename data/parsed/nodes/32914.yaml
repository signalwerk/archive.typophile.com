    html: <p>Probably you’ve already ruled out this possibility, but I’ve experienced similar-looking justification problems in ID2 on occasion when I’ve missed stripping out a few unwanted hard returns from the text before placing it into a text box. Scanned text seems to be the worst for causing this problem (the OCR software usually puts a hard return at the end of every line). You can usually spot them in the story editor.</p>
