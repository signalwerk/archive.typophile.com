    <p>Hey there, I’m having a lot of problems getting ID CS2 to deliver acceptable word spacing when I justify text. I’ve tried different settings; manually breaking words; no hypenation; playing with the “Better Spacing/Fewer Hyphens” slider; changing fonts; individually adjusting ALL the controls under Justification; removing nearby object which force wraparound. To no effect, it still lays out type with unacceptably large or small word spaces. Ref attached JPEG screen-shot for a reference sample. Font is Franklin Gothic Book (but seems to have no relevance to problem). Working on a PC.</p>
    <p>I’m relatively new to InDesign CS2 but had a lot of exposure to Quark a few years back so I know there must be an answer to this problem. All input appreciated.</p>
