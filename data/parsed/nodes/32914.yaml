    html: |-
      <p>Well, I’m not sure what made the difference EXACTLY but things are looking much better today - thanks for all the hints and tips. Here are some of the things I did/changed:</p>
      <p>1. Turn on “Show Invisibles” Ctrl+Alt+i<br>
      This allowed me to find at least one soft return that was adding to the problem.<br>
      2. Change the Justification settings<br>
          - Word spacing 90/95/100 which may be tight but it certainly helped with the words that were too far apart<br>
          - I left letter spacing at 0<br>
          - Glyph spacing 99/100/101; no significant visual impact on this document but it probably helped somewhere.<br>
      3. I turned hyphenation on and then off again and I SWEAR it helped. OK maybe it didn’t really but I know it didn’t hurt. It made me feel more powerful, at least</p>
      <p>Attached is a “Before and After” image. There are no soft returns in this copy - it’s all just from changing justification settings and getting rid of that soft return on one line.<br>
      Thanks for all your help! </p><div class="imageWrap"><img src="/files/justification_problem2_5038.jpg"></div><p></p>
