    html: |-
      <p>"Simulated process" means setting it up with four colors, but the colors aren't CMYK, and typically there's an underlay color because the substrate (usually a dark T-shirt) isn't white. In your case, you could have black, two shades of brown, and white. Check out <a class="freelinking external" href="http://www.impressionsmag.com/impressions/content_display/screen-printing/e3ia99a083a1bd87a2b808db05af2df38fe" rel="nofollow">this article</a> about it, and/or google "simulated process separations."</p>
      <p>Also, it's probably worth mentioning that antialiasing is a bad idea in printing in general, so you'll want a version (if you don't already have one) at a higher resolution without antialiasing. You'll need to know the final size they're printing this at.</p>
      <p>There probably are plug-ins to streamline this process, but essentially you want to end up with a Photoshop file with a channel for each color. When you make a new channel, you can pick the color and screen angle, and then you can move the appropriate parts of the image into the new channel.</p>
      <p>Good luck!</p>
