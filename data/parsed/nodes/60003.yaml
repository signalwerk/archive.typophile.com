      <p>Screen printers used to reproduce full-color images with a kind of paint-by-number approach using spot colors. </p><div class="imageWrap"><img src="http://typophile.com/files/batman2_4608.gif"></div><br>
      <em>Example swiped from <a class="freelinking external" href="http://thelittlefriendsofprintmaking.com/oops/" rel="nofollow">this site</a>.</em><p></p>
      <p>Modern screen printers can print fairly high-resolution halftones in 4-color process, but you should talk to your (or your client's) screen printer and find out what his/her requirements are (and what substrate they're printing on--your artwork looks like it might go on a vehicle). Also, ask your client if they want "simulated" process color for an intentional retro look.</p>
