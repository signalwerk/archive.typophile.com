    html: |-
      <p>It looks like <strong>OPTI Carmi Five Caps</strong> by OPTI/Castcraft<br>
      OPTI is a known font-forgery company and they almost always renamed the fonts they copied/digitized.</p>
      <p>If you go to the OPTI Archive, Letter "C" here:<br>
      <a href="http://opti.netii.net/fonts-c/index.htm" title="http://opti.netii.net/fonts-c/index.htm">http://opti.netii.net/fonts-c/index.htm</a><br>
      you can see the following note bellow "Carmi Five Caps":</p>
      <blockquote><p>Original is Collier</p></blockquote>
      <p>and this is further indication it's the font used on your sample ;)</p>
