    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF Call</strong></p>
    <p>Released by <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a>, 2000</p>
    <p>For their work in cell phone advertising, the three designers (<a href="/wiki/Maik%20Ignaszak" class="freelinking" rel="nofollow">Maik Ignaszak</a>, <a href="/wiki/Stefan%20Kisters" class="freelinking" rel="nofollow">Stefan Kisters</a>, and <a href="/wiki/Astrid%20Scheuerhorst%20" class="freelinking" rel="nofollow">Astrid Scheuerhorst </a>) were constantly in need of display type for phones from Nokia, Motorola, Siemens, etc. As PostScript versions of these fonts weren't commercially available, either from the companies themselves or from various type libraries, they decided to make their own. The result is FF Call, a package of over 70 fonts from a dozen brands of cellular phones. Each design comes in three versions: Regular, Italic and Negative, plus Expert Sets.</p>
    <p>Compatibility list:</p>
    <p>FF Call One - Alcatel<br>
    FF Call Two - Bosch<br>
    FF Call Three - Ericsson<br>
    FF Call Four - Motorola<br>
    FF Call Five - Nokia<br>
    FF Call Six - Panasonic<br>
    FF Call Seven - Philips<br>
    FF Call Eight - Siemens<br>
    FF Call Nine - Sony</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/showfont.cfm?fid=FF.11200.0.0" rel="nofollow">FF Call at FontShop</a></p>
