  html: |-
    <p>Soon I will have the power (mwah-hah-hah-hah) to purchase a decent set of fonts around here. I've been surviving off the basics: Helvetica, Univers, Gill Sans, Sabon, etc. I want to get at least a dozen new display typefaces that bring us at least into the last decade. Would love some HF&amp;J action, as well as some smaller foundries.</p>
    <p>Has anyone been in a similar situation? I'd love to here what you ended up doing. TBH I don't even know where to start. I guess a budget. Is $5K enough?</p>
