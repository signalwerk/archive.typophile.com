      <p>When I was in your situation I would get new fonts for speciﬁc projects as they occurred.<br>
      Although once in while I would get something that really intrigued me.<br>
      Isn’t it better to try out fonts for a new project, having the entire universe of fonts at your disposal, rather than being limited to what’s on hand?<br>
      The downside to this strategy is that there are advantages to working with familiar tools.<br>
      Also, if you have crowd-pleasers such as Gotham, it does make one’s designs more attractive, although at the expense of sameness.</p>
      <p>At the moment, some foundries offer huge discounts on new releases, so you might ﬁgure that into your plans.</p>
