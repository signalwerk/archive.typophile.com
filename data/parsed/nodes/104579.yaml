    html: |-
      <p>however, we need a group of fonts to <strong>share across designers, teams, </strong>etc. [emphasis added]</p>
      <p>Be sure to read the number of users permitted with the license. A few -- such as H&amp;FJ you mention, start with one computer &amp; the price goes up with each additional station. More common is a basic license that covers 5 computers. --Though not always, which is why you should check.</p>
      <p>Also, some companies favor bundling of fonts -- you buy a package for a fairly stiff price. Not always a very good bargain.  Sometimes that's the only way to get anything from that publisher, sometimes you can buy individual fonts.</p>
      <p>Listen to Nick. His strategy will save your company money over time. And if the world works the way it should, saving your company money will pay off for you, too.</p>
