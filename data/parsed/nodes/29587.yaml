      <p>ORICANA</p>
      <p>(A combination of Oriens and Arcana. ORIENS: The Latin for rising or east. ARCANA: meaning a hidden thing; a mystery or profound secret. From arca, the Latin for chest.)</p>
      <p>(THE) COMPASS ROSE</p>
      <p>(THE) CARAVEL</p>
      <p>(THE) WOODEN GLOBE</p>
      <p>THE TREASURY</p>
      <p>OLD EXOTICA</p>
      <p>THE ANTIQUARIAN</p>
      <p>HARBOURIANA</p>
      <p>THE IMPORT TENT</p>
      <p>(THE) SILK ROAD / OCEAN ROAD / STONE ROAD / BRONZE ROAD / JADE ROAD / GILDED ROAD</p>
      <p>A three word combination by mixing and matching one word from each of these three groups...</p>
      <p>1: WHITE / RED / LONG / EAST / WEST / TRADE / OCEAN</p>
      <p>2: STAR / SUN / SKY / OCEAN / ROAD / ROUTE / LINE / FLAG</p>
      <p>3: LINE / ROAD / ROUTE / EAST / WEST / TRADE</p>
      <p>eg: RED SUN ROAD / WHITE STAR ROAD / EAST ROAD WEST etc</p>
