    html: |-
      <p>Questions:<br>
      1) Does there not need to be a Russian angle to the name?<br>
      2) "... if their submission contains the name we decide to use as our new business name." By "contains", is it possible you could for example add "The" to the submitted name and not pay up?<br>
      3) If a submitter is told that he has to share the prize because others also thought of the same name, how does he know that's true?<br>
      4) "If you have not received an email after 30 days from your submission ..." There are more than 30 days between now and March 1 (January30 + 30 days). Does that mean you will not necessarily wait until the deadline to pick a winner? Also: why would it be difficult to alert the winner?<br>
      5) Is there an easy way to check for USPTO availability?</p>
      <p>hhp</p>
    html_clean: |-
