      <p>Dunno. Where's the research that says jumping off a building is bad for you?</p>
      <p>Humans make their decisions -especially important ones- based on thought and instinct. Instinct is extremely individual, but thought develops thanks to many things, including intellect, and communication with others, and certainly not only empirical findings (I'm sure you agree). Some people have thought about some things more than others; and the thoughts that lead me to believe that rag-right (when properly done) is better are documented, and seem sound (in that I have yet to hear good counter-arguments).</p>
      <p>I guess each of us simply has to decide who to trust.</p>
