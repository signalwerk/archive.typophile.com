      <p>Rag right modernism was primarily post-WW2.<br>
      For a long time now, it really doesn't matter.<br>
      Modernists can be purists (all ragged), or mix rag with justified.<br>
      There's no reader impact one way or the other, except as has been pointed out, when you have long words poorly justified on a short measure. But even then, a spot of "bad" justification can enliven a dull slab of text.</p>
