      <p>&gt;Authoritative sources</p>
      <p>You could quote what Bringhurst has to say, which I think is pretty sound. </p>
      <p>With justification you have the problem of the variation in word spacing, which has to be addressed by the typesetter, using things like the 'paragraph composer', the H &amp; J slider, and his or her own judgment. </p>
      <p>With ragged right you have the problem of producing a good rag, which as I believe some in the other thread pointed out is not so easy. </p>
      <p>Bringhurst points out that the problems of word spacing become greater with shorter measures, so the argument for ragged right becomes stronger there. But note that newspapers, with narrow columns, still usually have justified type as the norm. </p>
      <p>To have a balanced view of what works best when, I think it is important not to buy into ragged right as a modernist dogma, which it has been.</p>
