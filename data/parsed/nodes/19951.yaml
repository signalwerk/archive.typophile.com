      <p>&gt; ragged right as a modernist dogma</p>
      <p>As I've been told before (and I've certainly seen all those examples in typographic history books) Modernism actually professed left-aligned setting. But that was in the early years* (and more prominently applied to titles, not text) and possibly a reactionarism to the "classical" establishment for the sake of a reaction. It should be clear that Modernism's preference for Das Grid naturally leads to a preference for full justification, and that is what we see <cite>today</cite>, with Modernism's terminal evolution.</p>
      <p>* In this case I don't mean Rome.  :-)</p>
      <p>hhp</p>
