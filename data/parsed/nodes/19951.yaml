  - id: 124066
    user: 11282
    date: 2006-05-19T04:10:00
    date_raw: 19 May 2006 — 4:10am
    votes: null
    html: <p>I suppose that I can just chime in here for the sake of contribution. I typically prefer justified texts or well balanced ragged lines, and for a current project, a short newsletter style publication, I chose to go with ragged right. This is something I have not done for a while, and I was reminded as to why. Even though I was writing all the content on my own, which gave me the freedom to edit words, line lengths, paragraphs, and what not to make the proper fit, I felt it was still just as difficult, if not harder to achieve a well balanced rag all the way down the page. Although, at this point, I have to say that I am pleasantly surprised with how nicely the columns have come out, and how the publication looks overall. I set with Chapparal Pro for the body copy with variations of Frutiger for section headings and sub-heads. I also intermingled more artistic typography, pertinent to the content and overall design of various other bulky sans serifs.</p>
