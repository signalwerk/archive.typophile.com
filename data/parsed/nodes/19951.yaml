      <p>If you ask me FL/RR vs justified is a matter of taste and also can depend on the usage. For narrow column measures justified type can be problematic because you end up with word spacing issues as  you sometimes see in newspapers or mags. Justified type is cleaner though and you don't have to deal with rag issues. </p>
      <p>What is the job? And why are you resistant to justified type?</p>
      <p>Centered type is fine for heads or for short bits of text like captions, callouts, or blurbs but can be very annoying to read in longer paragraphs.</p>
      <p>Right aligned type can be effective for heads perhaps but not for running text.</p>
      <p>Also with either centered or right aligned text it can be hard to distinguish paragraph breaks.</p>
