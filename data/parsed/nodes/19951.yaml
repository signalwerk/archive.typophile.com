      <p>Except we don't apply some sort of fixed "return distance" picked up from the first line (?) of a paragraph (?) when we do a line return on a given line; we use the boundary between the whitespace and the left side of the text block, which is clearly visible in the parafovea.* So yes, centered throws that off (unless the leading is ridiculous) but ragged-right does not.</p>
