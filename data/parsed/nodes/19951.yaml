    <p>Hi,</p>
    <p>I'm fighting a battle at the moment! I've designed some guidelines for a client in which the prevailing style is left-aligned, un-justified type. </p>
    <p>The cleint's company have just been introduced to the new style and they are moaning about not being able to justify or centre-align text with the new guidelines!</p>
    <p>Does anyone know of or have some concrete material that I can use to convince them that left-alignment is both more elegant and more legible than a centred or right-aligned column? Also interested in any benefits of un-justified type (although I know this is debatable!)</p>
    <p>Something like a case-study would be ideal. Anything that concentrates on legibility benefits is really the key thing!</p>
