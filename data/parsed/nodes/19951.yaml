      <p>One reason for not using centered or ragged right text is that it is harder to read. When the eye gets to the end of a line, it needs to travel back a distance (hopefully not too far) to get to the start of the next line. If that starting point is always at the same position on the x-axis, it speeds up reading. Ragged right and centered text mean the eye must return to that position, and then work across to where the text eventually starts.</p>
      <p>Non-justified type, as has been mentioned, should not be a problem in good typesetting. But in word processed documents, where hyphenation programs may be suspect, and users often double space after a period, you can easily wind up with a space between words, or at the end of a sentence, that is much wider than the eye expects. When it hits this, it acts like a brick wall. The reader stops reading, wondering if something should be in this space, as it looks big enough to contain something. Eventually the eye starts up again, and continues, but the delay from bad spacing can be significant.</p>
