  html: |-
    <p>Hi there,</p>
    <p>A while ago I created <a class="freelinking external" href="http://pixelambacht.nl/2014/compyx-a-multicolor-8bit-font/" rel="nofollow">Compyx</a>, a multicolor font (using Abdobe/Mozilla's SVG-in-OpenType technique). It'll show up like your average singlecolor font in browser that don't support this yet, but it'll show up in classic green/gray colors in Firefox, and soon Chrome.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bpj6a02CMAAC85k_4593.png"></div><p></p>
    <p>You can download the TTF/WOFF  <a class="freelinking external" href="http://pixelambacht.nl/2014/compyx-a-multicolor-8bit-font/" rel="nofollow">in the blog post</a>.</p>
    <p>I was wondering if you know a good place to upload this font so it can be used by more people. It's pretty much open source/public domain.</p>
