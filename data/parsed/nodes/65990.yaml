      <p>It reminds me of Ray Larabie's <a class="freelinking external" href="http://new.myfonts.com/fonts/larabie/still-time/" rel="nofollow">Still Time</a>. You might also check at Dafont.com for Brush and Comic styles. Also might be worth checking Comicraft's collection, as this sort of dramatic lettering is sometimes seen in comic books.</p>
