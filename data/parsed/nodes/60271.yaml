    html: |-
      <p>This is a wonderful font, probably one of the most beautiful text fonts I've seen, beautiful enough to be a reason to register here for this comment. ;)<br>
      It is not too far away from the caption/face (german: Schriftbild), of Times in a way. It follows the x-height and letter shape, but is rounder where needed, like with the c, u and o, and overall wider, which is nice :) . Plus it is of course less "modern" in the sense of the horizontal and vertical "broadness" of the letters (sorry not an expert, don't know the term), but looks of course fresher with the twist you put on it with the upwards inclined lines to create the flow, and leaving aside the drops and things that would make it look to classic. Not sure if your "inclined direction" is the reason why it flows, but it works overall perfectly.<br>
      In a way it achieves what Gentium and Lido don't achieve, to be a Times with a human touch and look good with it. Lido looks like a Comic font too me ;) well a bit.<br>
      Sorry for the comparison to Times, but I mean it in a good way ;) cause Times is a good font, but it is obviously born long time ago, it is just too modern, too narrow, too traditional. To me, Calluna is a great font of its own. :)</p>
    html_clean: |-
