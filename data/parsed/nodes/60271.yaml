    html: |-
      <p>Jos,</p>
      <p>First of all, Calluna is hot like wow! Absolutely beautiful! The directional serifs work so well with the spiky serifs. And the result is not distracting at all, very easy to read.</p>
      <p>Second, the two Rumi poems in the specimen are priceless. Wonderful way to show off Calluna's love for poetry. And not just any poetry, but poetry from one of the greatest poets who ever lived, East or West.</p>
      <p>Third, your talent is unstoppable. I haven't met a typeface of yours I didn't like. Your work is worth far more than you charge for it.</p>
      <p>Thank you for pouring more beauty into our lives.</p>
      <p>Rahim</p>
