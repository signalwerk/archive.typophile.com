      <p>I'm sure Stephen's list is just a starting point. As I said earlier, most of the Open Type releases, especially of new serif families, will probably include these ligatures. For example Adobe's <a class="freelinking external" href="http://store1.adobe.com/type/browser/pdfs/MINP/MinionPro-Regular.pdf" rel="nofollow">Minion Pro</a>, <a class="freelinking external" href="http://store1.adobe.com/type/browser/pdfs/1737.pdf" rel="nofollow">Garamond Premier Pro</a>, <a class="freelinking external" href="http://store1.adobe.com/type/browser/pdfs/1739.pdf" rel="nofollow">Arno Pro</a>, <a class="freelinking external" href="http://store1.adobe.com/type/browser/pdfs/BIOQ/BriosoPro-Regular.pdf" rel="nofollow">Brioso Pro</a>,<a class="freelinking external" href="http://store1.adobe.com/type/browser/pdfs/1716.pdf" rel="nofollow"> Jenson Pro</a>, <a class="freelinking external" href="http://store1.adobe.com/type/browser/pdfs/WARP/WarnockPro-Regular.pdf" rel="nofollow">Warnock Pro</a> and probably most of their other "Pro" releases all have st, ct and sp ligatures (although Garamond Pro has only the ct, as Stephen stated).</p>
      <p>- Mike Yanega</p>
