      <p>Typographica.org has a good review on the Calibre typeface that should be helpful in your search... it would be useful to frame questions not only with "what is similar"... but also with: "the design intentions to fulfill".  As an example, Calibre is in a similar genre as "signage" types such as FF Din and Interstate...</p>
      <p>The Typographica article is here:<br>
      <a href="http://typographica.org/typeface-reviews/calibre/" title="http://typographica.org/typeface-reviews/calibre/">http://typographica.org/typeface-reviews/calibre/</a></p>
      <p>Cheers</p>
