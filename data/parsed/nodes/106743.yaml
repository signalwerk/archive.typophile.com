  html: |-
    <p>Hi all!</p>
    <p>I am looking to identify this font, which I used a few years ago but lost track of. (I'm now trying to recreate the design I used the font in after frying my hard drive and losing most everything.)</p>
    <p>Any info would be helpful! Here's what I know: It was a free font from a website like 1001fonts.com, dafont.com, etc., and I remember that while I looked for it specifically the first time around, it took a few days to find it. </p>
    <p>Please see the examples attached below. (One of the examples is the font in outline; in reality the font is solid, but I'll take the outline if that's what you can find.)</p>
    <p>Thank you!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/disco2.jpg" width="800" height="538" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/rock_n_roll_girl_shirt.jpg" width="225" height="225" alt="">
