  html: |-
    <p>Hi. I'm working on a webdesign for dj school.</p>
    <p>We are going to use FUTURA PL as the main font for headers, titles and menu. The client doesn't want to use a serif as a complement for body text.</p>
    <p>Which sans-serif font do you recommend to use for body text that would look good in combination with FUTURA PL?</p>
    <p>I'm trying to avoid using Helvetica as the combination.</p>
    <p>Here is a draft with FUTURA and Helvetica<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Captura-de-pantalla-2014-04-17-a-la(s)-15_6414.40.03.jpg"></div><p></p>
    <p>Thank you!</p>
