      <p>Don't get me wrong. I didn't want to persuade you in the opposite direction. My opinion is just that you can't really work for a long time on low budget small projects that don't give enough satisfaction. Especially because client's won't see it as something they actually REALLY need. Web medium didn't serve them so far, why would it now?</p>
      <p>Anyway. I think I missed something. If you have a good salesman, he/she'll be able to get you at least medium size projects that you can benefit from. That's why you'll probably make it. Which is good. So go for it and prove me wrong. ;)</p>
      <p>Otherwise: is there any other variation of the logo as well?<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
