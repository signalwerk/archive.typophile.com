      <p>Quite a sophisticated logo for a primarily web company. I like it though, but it may not be appropriate.</p>
      <p>What I'm more interested in is: is it really possible to make business of clients that have crappy websites since they don't want to spend money on something they don't see any real potential and are present in the area just because it's trendy.</p>
      <p>I was thinking of the same business model few years ago but came up with the conclusion there may be some money but probably much more nerves and not enough persistent income.</p>
      <p>___________<br>
      <em>Robert Koritnik</em></p>
