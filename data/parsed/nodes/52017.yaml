    <p>Hey everyone,</p>
    <p>My business partner and I have come up with a new design company. This company will put emphasis on website redesign for all the businesses out there with a crummy website (large market). The redesign will echo the feel of the establishment, and be tailored on a per client basis, like it should have been done the first time.  Designs will be clean, intuitive, and modern with a hand-crafted feel. NuArtisan will also handle identity, print media, and photography.</p>
    <p>We went with the color scheme of black, white, and red as a throwback to original print medium colors, but based on a modern typeface that spans eras of type.</p>
    <p>Let me know what you think of our concept.</p>
    <p><a href="http://www.nuartisan.net" target="_blank" rel="nofollow">Austin Web Design</a></p>
    <p>(Aside from a concept, the logo is the only other item that has been 'fleshed out' so far)</p>
    <p>Adam</p>
