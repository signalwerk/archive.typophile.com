    html: <p>With the unique qualities found in the larger, wedge serifs, perhaps you should see if you can somehow incorporate more of a wedge-like serif on the C and S -- those two seem to be naked compared to the others. You might also consider removing the sharp apexes, rounding them slightly. Maybe dulling down all the sharp points throughout just a hair. Maybe rendering it a bit more hammered and chiseled. &gt;&gt;&gt; just thoughts. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
