    html: <p>I think that sloped cut at the top of "A" could be a bit out of context. "M" seems to be slightly too narrow (comparing to "C" or "U" for example...) and "S" seems to be rotated 180 deg, probably because the upper curve is the same size as the lower. I think it should be smaller. I agree with Tiffany about heavier serifs at C and S. I hope we will see the new version soon. It could be a nice piece.</p>
