  html: |-
    <p>hi all,</p>
    <p>in indesign there is an option called ‘slashed zero’ in the opentype menu and i thought it neat to put this option into my new font.</p>
    <p>i’ve read all kinds of opentype documentation and googled it at least a dozen times but found no way how to implement this so far. what clue am i missing?</p>
    <p>cheers,<br>
    alex</p>
