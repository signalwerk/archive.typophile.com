    html: |-
      <p>Create your zero.slash glyph, then your feature code should say:</p>
      <pre>feature zero { # Slashed Zero
          sub zero by zero.slash;
      } zero;
      </pre><p>
      If you have oldstyle or other numeral variants don't forget to include those too.</p>
