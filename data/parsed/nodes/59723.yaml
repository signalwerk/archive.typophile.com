  html: |-
    <p>I'm trying to identify this beautiful typeface in W magazine this month (july) on the spread on page 93, the headline type is "earl's court." </p>
    <p>It's a lower case serif with really thing thins and it had an art nouveau feeling to it. </p>
    <p>I've attached the scan of it.</p>
    <p>Thanks in advance for any help.</p>
    <p>ray</p>
