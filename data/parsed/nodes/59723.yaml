      <p>nevermind found it.<br>
      The font is called Narziss Drops and was designed by Hubert Jocham,<br>
      a terrific German typographer W magazine works with regularly.<br>
      Here's a link:<br><a href="http://www.hubertjocham.de/item.php/type/display/Narziss/">http://www.hubertjocham.de/item.php/type/display/Narziss/</a></p>
