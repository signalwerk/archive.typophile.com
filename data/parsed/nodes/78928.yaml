      <p>It does indeed make sense, but then I thought to double-check, and at first, I wondered.</p>
      <p>The Didot typeface wasn't started until 1784. And even Baskerville was only designed in 1757 - but it did not have the unbracketed serifs characteristic of modern faces, even if it had other characteristics of theirs in incipient form.</p>
      <p>However, the Romain du Roi dates from 1693. Whew!</p>
