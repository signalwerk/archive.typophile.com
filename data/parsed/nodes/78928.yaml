      <p><em>It may refer to removal of bracketing, so all the corners are clean and sharp, rather than rounded</em></p>
      <p>I think Bill is right – I’ve never understood it well myself, but now it seems to me a key passage. Fournier did this ‘removal of bracketing’ with his own capitals, especially the larger sizes that were used for drop initials or titling. It is not so noticeable in the text sizes of the <em>romain du roi</em> (for which the engraved ‘drawings’ all show bracketing), but here is an initial for casting on a body of 96 Didot points, from the specimen of the Imprimerie royale printed in 1760.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1 A - triple gros canon - Imp roy 1760 - 500_6432.jpg"></div><p></p>
      <p>One also needs to reckon with the influence of the clean, sharp effect of big letters engraved as outlines on copper and then filled in, even if they then get bracketing added, as in this example from Diderot’s <em>Encyclopédie.</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/2 Gravure - Encycl - 1 b copy bw - det - 500_3728.jpg"></div><p></p>
      <p>That engraved line helps to shape the serif that eventually gets into both the capital and small letters of the new types. It is there in Fleischmann in the 1730s and the Didot types in the 1780s.</p>
      <p>A note on dates. None of the punches of the <em>romain du roi</em> was cut before 1696, and the process of making it went on for decades. That big A was made by Grandjean’s successor Alexandre in 1730.</p>
