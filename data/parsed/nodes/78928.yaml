    <p>In Fournier's <em>Manuel</em> (1764), as translated by Carter and reprinted in Smeijers's <em>Counterpunch</em> pp. 99-100, we find:</p>
    <blockquote><p>It is a safe rule that [the punchcutter] should do nothing without a correct understanding of the design of the letters, or having good models before him to allow him to catch the fashion of them, and to make such alterations as he thinks necessary. For example, such an alteration has lately been made in the case of capital letters, whose angles have been squared to give an effect of lightness, whereas they were formerly somewhat concave, which gave the letters a heavier appearance. The same thing has been done to all the angles of the lowercase letters.</p></blockquote>
    <p>Can anyone help me understand just what "angles" have gone from "concave" to "square"? I have a hard time following the referents in this verbal description.</p>
