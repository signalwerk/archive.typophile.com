      <p>I like it. Nice and quirky, but also quite balanced. It's a bit like a mix of broad-nib and brush.</p>
      <p>It does looke like the ear of the 'r' is a bit heavy. The h/m/n shoulders too? The 'e' might be leaning to the left, slightly. Probably because of the shape of the crossbar (which I like in itself). I'm personally not a big fan of g's where the connecting stroke between the top and bottom part extends so far out to the left.</p>
      <p>I would definitely keep working on this. :)</p>
