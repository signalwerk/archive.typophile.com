      <p>Thanks for the comments so far. I have taken on board some suggestions - shoulders of h, m and n are less heavy. the ear of the r is lighter with a steeper angle. The i dot is lower. The o is wider. The spine of the s is thicker. The terminal of the c is longer and heavier. It now has longer ascenders and descenders. </p>
      <p>It's quirky but not gimmicky.</p>
      <p>So now I've done a to z lower case in 2 extreme weights. Here it is:</p>
