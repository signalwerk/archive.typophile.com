      <p>Your work is, as Marcelo says, wonderful. However, I have two questions for you:</p>
      <p>1. What use do you have in mind for this face? Is it mainly for display, or do you intend it for text as well?<br>
      2. Given that the r+n combination has been pointed out by several persons, and given that there are serifs on the terminals of a, c, and s, I'm curious why have you not added a serif on the r? Not only would it solve the legibility problem created by your curved stems, but it would be more consistent with the other letters. Is it because you'd rather not add one on the f? I always thought that, for consistencies sake, a, c, r, and s were supposed to more or less share terminals, the s being the most likely to receive separate treatment. Anyway, I'm just curious why you chose this finish the r differently than related letters in this case.</p>
      <p>I really admire the strength of the black weight in particular. I think the range of weights relates extremely well and this will be a type family that could be used effectively in a variety of settings.</p>
