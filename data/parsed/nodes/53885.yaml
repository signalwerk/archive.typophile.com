      <p>The family is now complete in 6 weights instead of 7: Light, Regular, DemiBold, Bold, Black and UltraBlack.</p>
      <p>The Organon is the name given by Aristotle's  followers, the Peripatetics to the standard collection of his six works on logic. A fair amount of logic coupled with creativity goes into the creation of a typeface. And of course those six works of logic by Aristotle are essential reading - they're on my bedside table now.</p>
      <p>But really I got the name from the first line of "Cloudbusting" by Kate Bush.</p>
