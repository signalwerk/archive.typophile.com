      <p>I like it too.</p>
      <p>I agree that the r ear is heavy; it and the top terminal of f seem a bit raw to me - have you tried other types of terminals? Bottom of y is similar but works better.</p>
      <p>I like the g and the t best.</p>
      <p>i's dot seems quite high to me, esp. next to the rather low t ascender.</p>
      <p>I wonder if putting a little curve on the underside of e's crossbar would help. As it is, that crossbar's taper seems a bit out-of-character compared to the other tapers in the font - it looks to me like it has been chiseled where the others have, as Jelmar mentioned, a more brushy softness.</p>
      <p>Interesting that you used "Reptilian" - this face has both some slinkiness and some fangs to it!</p>
