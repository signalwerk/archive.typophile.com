    user: 3834
    date: 2009-02-24T08:43:00
    date_raw: 24 Feb 2009 — 8:43am
    votes: null
    html: |-
      <p>More alterations: the top arms of Z and z, M is wider in Bold, both top counters in the K and k are now smaller than the ones below, the leg of the R in Thin is now thicker, the thins of the Bold l/c x are thinner, less weight on top left of d f and q, shorter ears on the r's and less angled. I don't think there will be a problem with rn combinations when seen in the context of whole words, which is how we read anyway - by recognizing whole words rather than groups of letters.</p>
      <p>I have made the Bold characters b, d, g, h, m, n, o, p, q and u wider. I haven't altered the tail on the Q as that is part of the overall design which gives it character, I like that calligraphic element. If it's good enough for Robert Slimbach in Minion it's good enough for me.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/U_l_c24209_5064.gif"></div><p></p>
      <p>Nick Cooke</p>
    html_clean: |-
      <p>More alterations: the top arms of Z and z, M is wider in Bold, both top counters in the K and k are now smaller than the ones below, the leg of the R in Thin is now thicker, the thins of the Bold l/c x are thinner, less weight on top left of d f and q, shorter ears on the r's and less angled. I don't think there will be a problem with rn combinations when seen in the context of whole words, which is how we read anyway - by recognizing whole words rather than groups of letters.</p>
      <p>I have made the Bold characters b, d, g, h, m, n, o, p, q and u wider. I haven't altered the tail on the Q as that is part of the overall design which gives it character, I like that calligraphic element. If it's good enough for Robert Slimbach in Minion it's good enough for me.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/U_l_c24209_5064.gif"></div><p></p>
      <p>Nick Cooke</p>
