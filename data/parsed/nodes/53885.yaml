    html: <p>[1. Interesting approach you're taking. The smooth join vs. thin taper of the b d p q is the reverse of what is common in roman fonts. From a legibility perspective, this should help to distinguish p's from n's, b's from h's, etc. I don't know if you tried the crisp taper on the bottom of the b bowl, for the sake of consistency. This would probably draw too much attention to itself, but it would be interesting to see how it looks anyway.] [2. I particularly like the taper on the bar of the lc e.] [3. The upstroke on the lc r would benefit from a steeper angle. The r is definitely running into the curved upper serif of the n creating the awkward r+n = m situation.] [4. The spine of the lc s seems too light in relation to all other letters.] [5. Relative to the n and other lc letters the o seems unusually narrow.] [6. I am delighted by the curvaceous a; Since the fairly prominent terminal on it seems to work quite well, you might try strengthening the terminal on the c. Right now they look like they descend to about the same line, but I think the c's terminal could benefit from a bit more weight/length.]</p>
    html_clean: <p>[1. Interesting approach you're taking. The smooth join vs. thin taper of the b d p q is the reverse of what is common in roman fonts. From a legibility perspective, this should help to distinguish p's from n's, b's from h's, etc. I don't know if you tried the crisp taper on the bottom of the b bowl, for the sake of consistency. This would probably draw too much attention to itself, but it would be interesting to see how it looks anyway.] [2. I particularly like the taper on the bar of the lc e.] [3. The upstroke on the lc r would benefit from a steeper angle. The r is definitely running into the curved upper serif of the n creating the awkward r+n = m situation.] [4. The spine of the lc s seems too light in relation to all other letters.] [5. Relative to the n and other lc letters the o seems unusually narrow.] [6. I am delighted by the curvaceous a; Since the fairly prominent terminal on it seems to work quite well, you might try strengthening the terminal on the c. Right now they look like they descend to about the same line, but I think the c's terminal could benefit from a bit more weight/length.]</p>
