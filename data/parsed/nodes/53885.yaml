    html: |-
      <p>I think your changes have all been for the better.</p>
      <p>That light w is very nice. I also like the curve that comes out of the crossbar on the left side of bold f.</p>
      <p>In the bold weight, k's arm isn't well integrated into the letter to my eyes. The concavity of the left side of m and n in bold also detracts a bit. I wonder if that lead-in serif on m, n, p and r might be lowered yet another touch in both weights.</p>
      <p>u's tail seems to float up, in both weights.</p>
      <p>On the bowl-and-stem letters bdpq, the thick of the bowl seems not thick enough to me. I get the sense that the straight stems of those letters overwhelm the bowl. The same might be said for o (though c and e look fine on that score). These observations are based on the bold, though it's worth considering to what extent they hold true for the light.</p>
      <p>The offset of x looks too great, particularly in the lighter weight.</p>
      <p>The z, particularly in bold, may be on the wrong side of your quirky/gimmicky distinction. :-)</p>
