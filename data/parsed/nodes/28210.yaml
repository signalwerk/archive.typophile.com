    <p>I have major problems with typography seen on tickets (movie tickets, boarding passes, etc) Maybe someone can enlighten me on the reasons why it’s usually so bad. </p>
    <p>Is the current technology for ticket printing so outdated that it can only do off-register dot matrix patterns? In addition to figuring out the distorted letters, numbers, and cryptic abbreviations, the information organization on airline tickets could drastically be improved. The logical me wants to believe there’s a reason for it all. Is there maybe a digital-based foundation to the design of these things, like the MICR font?</p>
