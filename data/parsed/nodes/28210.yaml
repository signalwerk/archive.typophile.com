      <p>Ticketmaster tickets are printed with thermal printers. Don’t leave your tickets in your car on a hot day or they will turn black.</p>
      <p>I don’t know how that interfaces with typography but I’m sure there are limitations.</p>
      <p>Designing tickets is a pain. I’ve done many vanity tickets and the amount of legal mumbo jumbo they want on the back is mind-boggling. I think at one point I had it in sub 3pt type. Couldn’t read a lick of it - but it was there and they were satisfied with that…</p>
      <p>peace</p>
