      <p>I would presume the continued use of dot matrix is still used because “it will do”. I guess airlines in particular have bigger issues to deal with. Maybe the letterforms are poor because no-one has given these types of typeface any serious consideration (there’s been plenty of parodies) since the technology that used them became antiquated.</p>
      <p>On the subject of the presentation of information on the tickets, it’s probably down to who ever set up the computer systems behind them. As a programmer,their interest would be in what was quickest and simplest for them to set up, rather than what would be simplest for the user. A similar thing happens with utility bills, and in some cases, websites. I know Erik Spiekermann recently did design work on the tickets for (I assume) DB German Railways.</p>
