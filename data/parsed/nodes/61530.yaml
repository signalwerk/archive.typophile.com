      <p>I know what you’re talking about. You don’t like Bembo’s long leg of R, so you’re trying an alternate, right?</p>
      <p>It’s hard to tell, since the color of the new R can be slightly different from Bembo. I don’t know if it is a good solution, but why don’t you choose another font? I was thinking in <a class="freelinking external" href="http://www.fonts.com/ES/detail.htm?pid=4334871&amp;grab_id=0&amp;page_id=4375&amp;query=poliphilus&amp;SCOPE=Fonts" rel="nofollow">Poliphilus</a> &amp; <a class="freelinking external" href="http://www.fonts.com/ES/detail.htm?pid=4334844&amp;grab_id=0&amp;page_id=8826&amp;query=Blado&amp;SCOPE=Fonts" rel="nofollow">Blado</a>. Same source of inspiration, no strange legs. Some other strange letters, though.</p>
