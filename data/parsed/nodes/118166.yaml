    html: |-
      <p>It's not DIN--thanks to the full sample, I can see that the numerals don't match (specifically, the 6). Same goes for all flavors of OCR.</p>
      <p>The 4 has a gap and a high waist, the top of the 6 is rounded over, the 1 has a sharply angled downstroke, and the Q tail is a straight line at about a 45 degree angle.</p>
      <p>Linefeed is the closest I found, but the 6 and the Q aren't right:<br>
      <a href="http://www.myfonts.com/fonts/typodermic/linefeed/" title="http://www.myfonts.com/fonts/typodermic/linefeed/">http://www.myfonts.com/fonts/typodermic/linefeed/</a></p>
