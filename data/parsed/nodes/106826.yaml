    View Monotype’s OEM Font Catalog: <a href="http://bit.ly/1apiFHF" title="http://bit.ly/1apiFHF">http://bit.ly/1apiFHF</a> </p>
    <p>Monotype has engaged with several of Japan’s top typeface foundries and distributors to enhance company’s portfolio of high-quality Japanese fonts. Typefaces from Iwata, JiyuKobo, Motoya, Ricoh and Type Project comprise the latest additions, bringing the total to more than 500 high-quality Japanese fonts that can be licensed from Monotype for a wide variety of uses. </p>
    <p>Monotype’s selection of Japanese typefaces now represents one of the world’s largest and most comprehensive portfolios of Japanese fonts. The latest additions – several of which are available for the first time outside of Japan – are licensed through Monotype’s direct sales channels and through the company’s <a class="freelinking external" href="http://www.fonts.com " rel="nofollow"> Fonts.com</a> and <a class="freelinking external" href="http://www.linotype.com " rel="nofollow"> Linotype.com</a> websites. In addition to licenses for Web fonts and traditional desktop fonts, licensing options are available for mobile applications, e-publications and Web-enabled services, as well as for OEMs and developers of consumer devices. </p>
    <p>Monotype’s Japanese collection comprises a wide range of styles, including classic Mincho and Gothic designs, featuring several weights, as well as brush and decorative styles. Typefaces have been designed for optimal legibility and readability for both screen and print environments, and designs are able to complement Korean, Chinese and other language fonts that Monotype offers. In addition, certain faces have been designated by Monotype’s foundry partners as “universal design” fonts, which offer simplified strokes and other refinements that help to maximize on-screen clarity. </p>
    <p>Licenses for Web and desktop fonts are available from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> and direct channels, which also handle licenses for OEM customers. Licenses for iOS®- and Android™-based mobile apps, e-publications, and Web servers and applications are available from <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. OEMs and developers may also visit Monotype’s <a class="freelinking external" href="http://catalog.monotype.com/language/japanese " rel="nofollow"> OEM Font Catalog</a> to view the Japanese fonts. In addition, Monotype type experts can be consulted to recommend Japanese typefaces that best match Latin-based designs and other language fonts, enabling a consistent appearance across multiple languages and writing systems.</p>
