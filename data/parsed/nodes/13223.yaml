      <p>Well it seems I was fast enough to answer this question myself...</p>
      <p>American Airline have a magazine called NEXOS, which is the onboard magazine for all their Spanish speaking destinations (mainly Latin America and Central America). Coes out six times a year, in about 236.000 copies each time... so it can't be to bad to have Sophisto featured could it?! :-)</p>
      <p><a href="http://nexosmag.com/Default.aspx?tabid=193" title="http://nexosmag.com/Default.aspx?tabid=193">http://nexosmag.com/Default.aspx?tabid=193</a></p>
      <p>Any additional info could come handy though, TIA.</p>
