    <p>I've been told from a colleague that Sophisto (Psy/Ops) <a href="http://www.psyops.com/html/spec_sophisto_ss.html" title="http://www.psyops.com/html/spec_sophisto_ss.html">http://www.psyops.com/html/spec_sophisto_ss.html</a> is used as part of the layout in  a magazine for American Airlines. Probably the one onboard the planes. Could anyone else confirm this? Have anyone else seen it lately? I would be most eager to lay my hands on a copy. Any further info on this is helpful. TIA. ;-)</p>
