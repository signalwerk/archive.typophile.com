      <p>@jasonmenzies</p>
      <p>There is a command "fontplot" contained in the Adobe Font Development Kit for OpenType. It might help:</p>
      <p><cite>fontplot</cite></p>
      <p><cite>Make a pdf file showing all the glyphs in the font. This fills a page with many glyphs, and shows just the filled outlines at a small point size, with some info around each glyph. Works with OpenType fonts and Type 1 fonts.</cite></p>
      <p><cite>"charplot", "digiplot", "fontplot", "hintplot", and "showfont" are all command files that call the ProofPDF script with different options. ProofPDF takes as options a list of fonts, and an optional list of glyphs, and prints a PDF file for the specified font. showing the glyphs as specified by options.</cite></p>
      <p>Do you want to print the character map or do you want to dump the font file? If you want to dump (decompile) it, TTX is right. Otherwise I don’t know, in which way TTX should be a help there.</p>
      <p><strong>I am not sure, whether fontplot works with TrueType fonts.</strong> I assume, it does not, although OpenType fonts can be TrueType flavored.</p>
