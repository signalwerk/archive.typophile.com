    html: |-
      <p>@jasonmenzies</p>
      <p>I think I have an idea:</p>
      <p>Decompile the CMAP-table of the font file with TTX (-t cmap). Then use a search&amp;replace tool.</p>
      <p>Example:<br>
      &lt;cmap&gt;<br>
        &lt;tableVersion version="0"/&gt;<br>
        &lt;cmap_format_4 platformID="0" platEncID="3" language="0"&gt;<br>
          &lt;map code="0x20" name="space"/&gt;&lt;!-- SPACE --&gt;<br>
          &lt;map code="0x21" name="exclam"/&gt;&lt;!-- EXCLAMATION MARK --&gt;<br>
          &lt;map code="0x22" name="quotedbl"/&gt;&lt;!-- QUOTATION MARK --&gt;</p>
      <p>should look like this (without underscores):<br>
      &amp;_#x20;<br>
      &amp;_#x21;<br>
      &amp;_#x22;</p>
      <p>OpenOffice Writer wants to have them at least in a html element. So you should have this in the end (without underscores):<br>
      &lt;p&gt;&amp;_#x20;&amp;_#x21;&amp;_#x22;&lt;/p&gt;</p>
      <p>Store it as html file and open it in Word or OpenOffice Writer or anything comparable and save it as doc or rtf file. Word and Writer will display the glyphs then (and naturally your browser), as long as the font is installed and selected (with the font menu or a CSS declaration).</p>
      <p>For the case, that this does not work, it might help you to find the right way. I am not sure, whether the cmap table necessarily contains the Unicode positions of all characters of the font. But I assume, you neither would be able to get access to characters, that are not in the CMAP table with their Unicode positions, with the help of the clipboard.</p>
      <p>And probably there is a more elegant way.</p>
