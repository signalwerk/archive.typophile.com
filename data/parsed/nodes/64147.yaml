    html: |-
      <p>Just for fun, added a few more options to the quick-and-dirty proggie (most recent version: <a class="freelinking external" href="http://www.jongware.com/binaries/cmaptofile101.zip" rel="nofollow">cmaptofile101.zip</a>).</p>
      <ul>
      <li><code>-html</code> Write a HTML file, with the character codes in full decimals</li>
      <li><code>-cr</code>, <code>-lf</code>, <code>-crlf</code> and <code>-lfcr</code> change line ending mode</li>
      <li><code>-o<em>filename</em></code> set output file name</li>
      <li><code>-name</code> (just for fun) show the name of each character</li>
      </ul>
      <p>I removed the worthless long listing of the character names while processing.<br>
      I changed the default line length to 10 characters (should've done that right away).</p>
      <p>If you feed it a TTC, it writes out one file per sub-font (although I seem to get the same files -- my few TTCs must all have the same CMAP).</p>
      <p>I added a GetWindowsFolder call -- if you need a font from your Windows folder, you don't have to explicitly prepend "c:\windows\fonts", it'll automatically check in there if the file is not found in your currect folder.</p>
      <p>Oh -- and I added CMAP12 support, for those *huge* codes. If present, the program uses this. Couldn't really check; it seems to work with LastResort though.</p>
      <p>The program is hardwired not to add null characters, U+FFFE, U+FFFF, and U+D800..U+DFFF (but these really should not be present in the file anyway).</p>
