      <p>Thanks for the suggestions and assistance everyone. None of these ideas helped but maybe with a bit more refinement of my original question, someone will have a different suggestion.</p>
      <p>Aric, I work in home video subtitling so all my text needs to be rendered as a bitmap or other graphic image for client delivery. I need all the characters dumped from a font to text so I can load them into my rendering engine (which runs on proprietary Unicode text-based files), render them out to graphics, and QC the outputs. </p>
      <p>Antonio, thanks for the suggestion. TTX seems helpful, but I think it's giving me all the stuff behind the scenes to make the characters work (for programming, compiling, etc), whereas I just need the characters themselves. </p>
      <p>Arno, thanks to you for the suggestion as well. I think I found a couple of other programs that do the same thing yesterday (dump to a printable PDF), but again since I can't actually use the text from the PDF in my editing software, it isn't exactly what I need. </p>
      <p>Ideally I just need content like this:</p>
      <p>!"#$%&amp;'()*+,-./01234</p>
      <p>That's the first row of the character map from Arial, copied one-by-one with the select button and then copied to the clipboard, and pasted here. </p>
      <p>For Arial, it won't be such a big deal, but SimHei has 16,000 characters, so I was hoping to find something that would do it a bit quicker. </p>
      <p>Any further ideas would be warmly welcomed. I thank you all for your time thus far.</p>
