    html: |-
      <p>Here are things that work best (and most easily) on Linux, that I use on a Mac and that may work on a PC with Cygwin.</p>
      <p>I always use small scripts. The following one outputs the unicode numbers (in hex format) in a font; it requires Fontforge, the Python Fontforge module and, of course, Python. Copy what is between the cut lines and paste in a terminal window (Cygwin, mac or Linux), and this creates the executable file <code>lstucodes</code> in the current directory.</p>
      <p><code><br>
      ----<br>
      cat &gt; lstucodes &lt;&lt;'EOF'<br>
      #!/usr/bin/env python</code></p>
      <p>import fontforge,sys<br>
      fnt=fontforge.open(sys.argv[1],1)</p>
      <p>for g in fnt.glyphs():<br>
      &nbsp;&nbsp; if (g.unicode &gt;= 0x21):<br>
      &nbsp; &nbsp; &nbsp; print "%04X" % (g.unicode)<br>
      EOF<br>
      chmod 755 lstucodes<br>
      ----</p>
      <p>If <code>simhei.ttf</code>  is also in the current directory then</p>
      <p><code>./lstucodes simhei.ttf |sort &gt; simhei.txt </code> </p>
      <p>outputs all the unicode values of the characters in simhei.ttf, sorts them and puts the result in <code>simhei.txt</code>. </p>
      <p>To format, I usually use sed and awk but young people use other things now. Anyway, here is my script (if I want 10 characters per line); again, copy and paste in the terminal window to get hex2html:</p>
      <p><code><br>
      ---<br>
      cat &gt; hex2html &lt;&lt;'EOF'<br>
      #!/bin/sh</code></p>
      <p>awk 'BEGIN{print "&lt;html&gt;&lt;body&gt;"}{<br>
      &nbsp; printf "&amp;#x%s;\n", $0<br>
      &nbsp; n = n+1<br>
      &nbsp; if (n == 10) {<br>
      &nbsp; &nbsp; printf "&lt;br&gt;\n"<br>
      &nbsp; &nbsp; n=0<br>
      &nbsp; }<br>
      }END{ printf "&lt;/body&gt;&lt;/html&gt;\n"}'&nbsp; $1<br>
      EOF<br>
      chmod 755 hex2html<br>
      ---<br>
      </p>
      <p>Now <code>./hex2html simhei.txt &gt; simhei.html</code> gives the file that you can find here: <a href="http://www.iro.umontreal.ca/~boyer/typophile/simhei.html" rel="nofollow"><strong>simhei.html</strong></a>.</p>
      <p>Characters with a unicode number above FFFF cause problem. If you find other problems, I'd like to be told.</p>
      <p>Michel</p>
