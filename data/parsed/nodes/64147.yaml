    <p>Does anyone have any free or paid Windows XP utilities they can recommend that will dump a TTF font file to editable text? </p>
    <p>Ideally, I want an extensive Asian Unicode font (like SimHei for example) to be dumped to a text file that looks just like the Character Map (a grid that's 10 or so characters wide and several hundred rows tall), but in editable text (DOC, RTF, TXT, whatever works). </p>
    <p>I'm trying to do it using the copy and paste function in Character Map but it's taking way too long. Is there a utility out there that will do something like this for me in an automated manner? I'm willing to pay a decent price.</p>
