    date: 2009-11-14T16:33:00
    date_raw: 14 Nov 2009 — 4:33pm
    votes: null
    html: |-
      <p>The ­­<code>lstucodes</code> script above is something I had in my <code>~/bin</code> folder.</p>
      <p>I now took the time to compare with Arno's method. On tens of thousands of characters, comparing outputs can be quite instructive. Looking at <code>stxihei.ttx</code>, I see only one cmap table, of type 12; there are 34962 character codes (and 31 multiply encoded glyphs).</p>
      <p>For each line containing <code>'map code'</code> we want the string enclosed between the first and the second quote character. That can be done with <code>awk</code>, telling it to use quote as a field separator. In any unix-like shell, typing</p>
      <p><code><br>
      grep 'map code' stxihei.ttx&nbsp; | awk -F\" '{print $2}' | sed 's/0x//' &gt; stxihei.txt<br>
      </code></p>
      <p>does it (and removes the leading 0x). Then (using the hex2html script above)</p>
      <p><code>hex2html stxihei.txt &gt; stxihei.html</code> </p>
      <p>gives the desired html file, 10 characters per line.</p>
      <p>After comparing the output from FontForge and the above, one can see that on multiply encoded glyphs in stxihei, FontForge outputs only one unicode value per glyph (I checked with a script). Arno's method based on the ttx output gives all the unicode values in that font and that may be what you want.</p>
      <p>On other ttx files, with multiple cmap tables, I don't know what may occur. For some other font, I saw unicode points with <code>.notdef</code> glyphs (that would need to be discarded with grep -v). What else?</p>
      <p>Michel</p>
