      <p>Just for fun, I compiled a Mac version!<br>
      Direct link: <a class="freelinking external" href="http://www.jongware.com/binaries/cmap2file_mac.zip" rel="nofollow">cmap2file_mac.zip</a></p>
      <p>Download it and put it somewhere you can reach using Terminal. Then run, using</p>
      <p><code>./cmap2file <em>font_file_name</em>[*] [ options ... see previous mails]</code></p>
      <p>[*] Typically, your installed fonts can be found in either /Library/Fonts or in ~/Library/Fonts.</p>
      <p>I added support for the old(!) versions of TTF that start with 'true', rather than "ttcf", 0x10000 (Windows TTF), or "OTTO". dfonts are <em>not</em> supported!<br>
      I also added another option: <code>-name</code> inserts the name per character, taken from the file if present, synthesized otherwise.<br>
      Be sure to use the <code>-o<em>filename</em></code> option to put the output somewhere you can find it later -- remember, default output is where the font file was found.</p>
      <p>Disclaimer: It appears to work just fine on my Mac OSX 10.6, but I set the minimal target to 10.4. Still, your mileage may vary.</p>
