    html: |-
      <p>There you go.<br>
      Download "cmaptofile.zip" from <a class="freelinking external" href="http://www.jongware.com/binaries/cmaptofile.zip" rel="nofollow">my site</a>. Extract to a suitable place.</p>
      <p>It's a console program; usage:</p>
      <p><code>cmaptofile <em>font file name</em> [ -utf8 | -buc ] [ -ll<em>number</em> ]</code></p>
      <p>Default output is Unicode, little endian. Use <code>-buc</code> to toggle to big endian. Use <code>-utf8</code> to output as UTF8 encoded file (not thouroughly tested ;-). Use <code>-ll<em>number</em></code> to set the line length in characters -- default is <code>-ll32</code>.</p>
      <p>Output goes to the same folder as the program is in, to a file with the same name as the font plus ".txt" appended.</p>
      <p>Ideally, it oughta use the largest CMAP it finds -- any unicode one. If the font doesn't have a unicode map .. well, anyone's guess what happens then. I think it fails silently. OTOH, if it <em>does</em> work, you'll see a complete dump of the UC characters it writes to the file.</p>
      <p>Tested with a handful of PFB, OTF, and TTFs -- still, no guarantees, it was a real quick hack.</p>
