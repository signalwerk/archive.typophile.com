      <p>On OS X 10.5.8 (on my MacBook Pro) there is a font named STXihei in /System/Library/Fonts that appears to be seen as "STHeiti Light" in the character palette. According to the FontForge dump, that font contains 4241 characters in CJK Unified Idiographs Ext.B range 20000-2F7FF. That font is /System/Library/Fonts/华文细黑.ttf. The characters I checked (just a few, of course) are seen in the character palette and in the dump to be seen here: <a href="http://www.iro.umontreal.ca/~boyer/typophile/stxihei.html" rel="nofollow"><strong>stxihei.html</strong></a>.</p>
      <p>My guess is that FontForge does well its jobs.</p>
      <p>Michel</p>
