      <p>From what I remember, I think this was a customised version of (Treacyfaces?) Forever type family for British Airways HighLife magazine that I did about 5 years ago through Fontworks UK.</p>
      <p>So in answer to your question 'Forever' is close to it.</p>
      <p>Nick Cooke</p>
