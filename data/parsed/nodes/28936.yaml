  html: |-
    <p>Hi all,<br>
    I'm trying to ID the sans featured in the magazine "High Life."  I have an inkling it's a custom, and if so I would like to know some other fonts close to it (and even if it's not a custom).</p>
    <p>Thanks,<br>
    Will</p>
