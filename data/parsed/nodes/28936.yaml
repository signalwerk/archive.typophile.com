    html: |-
      <p>'Forever Two' is the Treacyfaces font with this style of 'g'. The customization seems to be essentially the elimination of the stems, and reshaping the counters on letters like the 'a', 'b', 'd', 'g', 'm', 'n', 'p' and 'r'.</p>
      <p> - Mike Yanega</p>
