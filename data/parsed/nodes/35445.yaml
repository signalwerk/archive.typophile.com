    <p>Ok, I'm looking forward learning about the characteristics of the Adobe Myriad® typeface, both looking at it as:</p>
    <p>I- A mutation in history of humanist typeface taking root in the work of Frutiger<br>
    II-Taking part in a turning point in typography by the use of a new technology<br>
    (Multiple Master)  </p>
    <p>Myriad don't seems to be THE typeface of a revolution like Heletica or Univers were (let's not make a topic out of this) more the crossing of multiples events, creating let's say, a both generic but unique typeface. </p>
    <p>What I know about the Myriad Typeface is that it was created mostly by Robert Slimbach and Carol Twombly, that it was first release in 1992 under the Adobe Originals familly  (in which the two designers have greatly contributed). I know also that it is a humanist sans serif font witch the fluidity reminded the human handscript. It's it organic structure that give the Myriad it's friendly look. Myriad as a humanist sans serif is based on the Adrian Frutiger eponymous font offert both a great lisibility in big and small scale as the Frutiger was created for signage purposes for the Charles de Gaulle Airport in France. </p>
    <p>On the comparative image below, you can see a great similarity between the two typefaces. The first and second observation that I can do is that Myriad is a little bit more condensed that Frutiger and that some optical correction have been bringed to the letter legibility.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/MyriadCompa_4182.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/A_3574.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/B_3795.jpg"></div><p></p>
    <p>I know that even it is not the first typeface generated in the multiple master technology (minion was?), it as been part of the first number of typefaces who where.  </p>
    <p>By structuring my research I thought that it should involve: </p>
    <p>I- A mutation in history of humanist typeface taking root in the work of Frutiger<br>
    I-a) The evolution of humanists fonts<br>
    I-b) The history of the Frutiger typeface<br>
    I-c) A logical evolution from the work of Robert Slimbach and Carol Twombly</p>
    <p>II- A turning point in typography by the use of new technology<br>
    II-a) The Multiple-Master technology<br>
    II-b) Turning point in typography</p>
    <p>What do you know about Myriad Typeface? do you know other aspect relevant to the typeface, or good books talking about it.</p>
    <p>Which are the typeface or the topics, relevant to the study of Myriad?</p>
    <p>references:<br>
    <a href="http://www.adobe.com/type/typedesign/slimbach.html" title="http://www.adobe.com/type/typedesign/slimbach.html">http://www.adobe.com/type/typedesign/slimbach.html</a><br>
    <a href="http://www.adobe.com/type/typedesign/twombly.html" title="http://www.adobe.com/type/typedesign/twombly.html">http://www.adobe.com/type/typedesign/twombly.html</a><br>
    <a href="http://www.adobe.com/type/opentype/T1_to_OTF_FAQ.htm" title="http://www.adobe.com/type/opentype/T1_to_OTF_FAQ.htm">http://www.adobe.com/type/opentype/T1_to_OTF_FAQ.htm</a><br>
    <a href="http://kb.adobe.com/selfservice/viewContent.do?externalId=328600&amp;sliceId=1" title="http://kb.adobe.com/selfservice/viewContent.do?externalId=328600&amp;sliceId=1">http://kb.adobe.com/selfservice/viewContent.do?externalId=328600&amp;sliceId=1</a><br>
