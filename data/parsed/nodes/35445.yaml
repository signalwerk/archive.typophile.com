      <p>Thank you Nick,</p>
      <p>We often see comparaison when it's time to analyse a typeface (the eye's article -n°63- about Helvetica is one exemple). Do you say it's a wrong reflex? or is it wrong, only in the case of humanists fonts? If it is soo, is there a way of learning something about theses typefaces or does it have to be a pure act of self-expression?</p>
      <p>In architecture and in design in general, a research field look at the process of design. In an architecture contest this means looking less at the final object and more at the sketches and the notes and what surrounded the project. Would it be relevant to look at theses sketches in the case of typefaces. For what I know (and I could be wrong)  there are no publication on the subject. </p>
      <p>I think your right about the preparation part, it's probably more important to practice the hand and the eye. Your exemple of Man vs. Machine represent perfectly the dichotomy here. Where a part of designer looked at the machine as the perfection needing the design to be aim at, humanists fonts look at differences and particularities as a good thing. In that sense, the subject could also be seen thought the lenses of the debate of general v.s. the particular.</p>
      <p>I still have to find information on the Myriad typeface but obviously will looking somewhere else. William Berkson (3 posts before), was writing about the process of designing Myriad by two persons (and the exchange during the process) resulting in a "more impersonal, less idiosyncratic" font. If it's true, it would probably be an interesting path as Myriad is seen as a more generic font even if it's a humanist one. Seeing also Myriad in relation with other humanistic typeface would probably inform us a little about the amount of the handmade, calligraphic original, wished to be kept in the process of «réaliser» a humanist typeface.</p>
