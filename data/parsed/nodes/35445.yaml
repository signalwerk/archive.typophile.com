      <p>Matt, comment ça va?</p>
      <p>I don't think your preparation has much direct relevance to your task.<br>
      If your alphabet will be a humanist sans, presumably you will be drawing it.<br>
      I doubt that Robert Slimbach traced Frutiger or Today when he made Myriad and Cronos, although those designs obviously inform his -- but he is an accomplished calligrapher and drafstman (Carol Twombly too.)<br>
      You don't have the skills to design a typeface/alphabet by closely reinterpreting another -- Frutiger's Avenir (from Futura) is another example.<br>
      So the only way you could get close to that kind of result would be tracing, which would be a bad idea, as, I believe, the whole point of the humanist approach is to work by hand and eye, rather than mechanically. (Man vs. Machine, rather than its original meaning, Man Vs. God.) It is the best way to avoid rote plagiarism, avoiding the trite veracity of the mechanical simulacrum.</p>
      <p>What you can do is to draw an original alphabet, without immediate reference to any other typeface, and then, when you have developed ideas on the kind of letter shapes and proportions your design will have, then and only then, refer to the font files of Myriad, Cronos, Auto, etc., to see how the glyphs have been refined with regards to parameters such as stem thickness, overshoot, sidebearing widths, terminal angles, etc.</p>
      <p>The assumption is that you have absorbed and internalized enough typography to be able to "work out" (réalizer?) an original design, and squeezing it though your personal, hand-made process, will give it that originality and humanity.</p>
      <p>Bit of a tangent: contestants in the Prix de Rome (French painting competition, late 18th century) were sequestered in a villa for a month, where they were required to paint a work in the history genre, with no reference material! Now there's a concept for reality TV.</p>
