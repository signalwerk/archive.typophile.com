    html: <p>There's a dot-font article by John Berry called "Neutral Type" or similar that you should look up. Also a line of research might lead you to look at how naturally the Myriad forms render on screen at small sizes (in Adobe’s rasterizers), as opposed to Helvetica and similar grots that close up – largely unrelated to MM technology. The “a great signage font = great outlines for a screen font” link hasn’t had much comment (the small world of type criticism is still very much print-focused – note Arial and Comic Sans crits don’t mention on-screen qualities) but this would let you draw in other designs like Lucida ;-) and Verdana, and also look at Myriad’s (non)appearance on the iPod as Podium Sans.</p>
