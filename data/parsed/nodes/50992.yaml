    <p>Hi all,</p>
    <p>I'd like to get your feed back and suggestions on a logo I'm working on for a Education Program sponsored by a local public school system. I'd also like to get some general feedback on designing in education. I've designed for education programs before and I have a really hard time getting my clients past clipart and 'chalkboard' They love it... Does anyone have any examples of good design in education (I'm talking elementary-high school) or have any comments on what works well generally. </p>
    <p>To the issue at hand. I'm designing a logo for a 'community learning center" It's a center where kids can go after school to take classes not available in the ciriculum or classes to supplement their required courses. The name of the federal grant is the "21st Century Community Learning Center" The administrative folks call the program CLC. They want to brand the 2 locations in the town differently and they've chosen a train theme. 'Jefferson Junction' and 'Lincoln Station.' So the logo needs to evoke EDUCATION and TRAIN. I've attached my concepts so far but I'm missing it. any Help?</p>
    <p>tré</p>
