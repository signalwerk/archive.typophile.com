  - id: 308676
    user: 17904
    date: 2008-10-28T10:59:00
    date_raw: 28 Oct 2008 — 10:59am
    votes: null
    html: <p>You have a difficult challange, imagery that will appeal to elementary students will not necessarily appeal to high school students. You need to simplify the design. Will both locations have the same programs? or will one cater to younger children and the other to older kids? What I mean is, can the two marks be related or do they have to match exactly? The train drawings should be more iconic, less cutsie. Play more with the typography, the faces you have been working with seem stiff and old-fashioned for this project. On the clc train version it was difficult to read Jefferson Junction. Push yourself a little more - have fun with these logos.</p>
    html_clean: <p>You have a difficult challange, imagery that will appeal to elementary students will not necessarily appeal to high school students. You need to simplify the design. Will both locations have the same programs? or will one cater to younger children and the other to older kids? What I mean is, can the two marks be related or do they have to match exactly? The train drawings should be more iconic, less cutsie. Play more with the typography, the faces you have been working with seem stiff and old-fashioned for this project. On the clc train version it was difficult to read Jefferson Junction. Push yourself a little more - have fun with these logos.</p>
