    html: <p>Here's the latest. I like where this one is going a lot better. it balances whimsy/playful look with out making it look like the smiling apple style above. Type face I'm not sure about yet. I like serifs for the project. Serifs say education to me. I think it's from all the papers I've handed in in Times New Roman. The train car transition icon I think lends itself well to the project. Going from a child's toy caboose to a mono rail engine car shows progress from childhood to modernity. The monorail rendering still needs some work. I want to keep it simple but I don't want it to look like a boat. Thoughts</p>
