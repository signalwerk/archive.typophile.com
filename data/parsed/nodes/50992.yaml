    html: <p>Great insight. I'm working on some new versions. I really had no direction when I started this project so this helps a lot. One other obstacle I ran into with the first round of logos i did was, I was designing the logos in a "train industry style" So I was using colors and mimicking the style of railway signs, companies, stations etc. What I ended up with was a logo that looked like a railroad company logo. I didn't look like it had anything to do with education. I can't figure out how to capture that with out adding the cliché 'kids holding hands,' or a book or a pencil.</p>
