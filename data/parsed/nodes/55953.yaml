    <p>I've been working on two designs for postcards. They're meant to advertise books. I think they could just as well be book covers (except that one should then be rotated and the stress changed to vertical).</p>
    <p>What do you think?</p>
    <p><em>PS: the translations would be something like "Dick Poems" &amp; "The Flashing of Orange on Traffic Lights"</em></p>
    <p><em>Edit: added a third one ("Getting used to the Light") to complete the series. Corrections to "Flashing".</em></p>
