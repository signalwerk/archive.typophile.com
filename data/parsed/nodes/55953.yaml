    html: |-
      <p>My thoughts:</p>
      <p>1. Too much space between R and C in "KURC". The name needs manual kerning, too. Look carefully at the spaces between the letters. Make the "LUD Literatura  2009" bolder, perhaps in all caps. Lose that star, it adds nothing.</p>
      <p>2. Good use of an often misused typeface. Mrs. Eaves was all the rage five or ten years ago. The background makes me slightly nauseous, but that's probably the intention. Good work.</p>
      <p>3. "Privajanje" looks too light, and the letterspacing in "svetlobo" looks weird.</p>
