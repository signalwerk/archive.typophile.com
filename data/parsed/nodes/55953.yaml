    html: |-
      <p>I totally agree about the kerning, thanks for pointing it out. I guess I was just too eager to share the layouts with everyone here to even give kerning a thought. Lesson learned! I've also made "Privajanje" bold.</p>
      <p>I'm surprised though that you found the star superfluous. I thought the little sun-like dings on the orange one were maybe a bit too much, but if nothing else the author loved it. In my oppinion, they all have a rapport with the titles and contents. Believe me, however, I fully understand that no explanation or reasoning, no matter how brilliant, don't make up for bad art.</p>
      <p>Thanks again for the input!</p>
