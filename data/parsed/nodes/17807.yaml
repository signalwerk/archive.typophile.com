    <p>sometimes, when i’m logged on to this forum, i wonder what all of you are doing out there as you are typophiling. right now, we’re all logged in and yet, we are in different parts of the world, at different times of the day, doing different things. </p>
    <p>i’ll go ahead and assume that most of us are near a computer, but where? you could be sitting at a coffee shop with a laptop, or in the comfort of your own home. some of you might be the principle of your studio in the corner suite, others may be huddled in a cubicle, sneaking a peak at your recent posts.</p>
    <p>is your spouse getting a little jelous or are you almost late for work?</p>
    <p>the sun went down 30 minutes ago. my boss and co-workers are gone. it’s nice and quiet in the studio. i’m staying a little late, trying to get this project done, realizing that i’ve just spent way too much time crafting this post. what about you?</p>
    <p>nick cottrell</p>
