      <p>It’s 5pm now, here in Central Europe. I’m at home drinking coffee. Saturdays give me time to work on what I want to work on… today I’m working on two display typefaces, one bigger one for Linotype, and a smaller one that isn’t.</p>
      <p>I usually have Typophile on at work, but try to keep my reading and posting time there to a minimum. I’ll post links to Linotype faces, or answer questions. Otherwise, I should stay away from it :-D</p>
      <p>At work, I always have Vienna on in the background to keep tabs on every other type site  (especially Jürgen Siebert’s <a href="http://www.fontblog.de">Fontblog</a>) via their RSS-feeds, but that only shows me new the new Typophile threads, not the new posts :(</p>
      <p>My girlfriend began working on her graduate thesis on Monday, so my weekends are now all working weekends, too. Hopefully, this’ll be productive, and I’ll be able to bring some things to market by the summer.</p>
