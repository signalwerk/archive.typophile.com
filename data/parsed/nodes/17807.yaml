      <p>My wife and daughter are taking a nap at the moment, so things are unusually quiet. It’s two pm here in Seattle. I’m sitting at the dining room table with my laptop, sitting in an Aeron chair, and occasionally glancing out one of the windows to admire the trees. We’re just outside Seattle proper, so there are tons of tall trees. The room has a lot of eight-foot windows, and some skylights. I’m sipping ice water from a huge acrylic tumbler that could hold one of those convenience store drinks. Next to me are: what’s left of the pile of mail I just sorted through, a biography of the Beatles, and some just-arrived items: the book “Real World InDesign CS2,” and CDs by Biff Rose and Ry Cooder. Maybe I’ll put one on to listen to.</p>
      <p>We just got back into town late last night, and this morning I read an email that said a friend needed help moving. I called him up, but he now has plenty of help and suggested that I take it easy. So I am catching up on remaining email, and in a minute I will take a break from that and continue working - either on a typeface or on a DTP revival of an antique out-of-print board game.</p>
      <p>Cheers,</p>
      <p>T</p>
