      <p>Font pairing is a bit subjective under the best of conditions, but without being able to see your logo I’d hesitate to make a recommendation. </p>
      <p>The website Fonts in Use may be of help to you. Depending on whether you are looking for a serif or another sans serif typeface to pair with Gotham, the samples at this link might provide some inspiration:<br>
      <a href="http://fontsinuse.com/typefaces/20/gotham" title="http://fontsinuse.com/typefaces/20/gotham">http://fontsinuse.com/typefaces/20/gotham</a></p>
