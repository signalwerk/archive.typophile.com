  html: |-
    <p>Started a project on OSX Indesign CS3. Have prepared Paragraph Styles in advance, a month ago.<br>
    Now, everytime, every PStyle is apllied, text appears underlined. Non of PStyles have underline checked in. Any idea, what went wrong here?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/44078" class="topic-previous" title="Go to previous forum topic">‹ Indesign: Dealing with a probably-corrupt file</a> <a href="/node/44075" class="topic-next" title="Go to next forum topic">InDesign: Paragraph Rules, Keep Options, H&amp;J ›</a></div>
