  html: |-
    <p>Alison Eickhoff, with the help of Chank Diesel, created a beautiful 52-page book containing the Font Aid IV submissions. The book is now available through Lulu.com:</p>
    <p><a href="http://www.lulu.com/product/paperback/coming-together-font-aid-iv/6553234" title="http://www.lulu.com/product/paperback/coming-together-font-aid-iv/6553234">http://www.lulu.com/product/paperback/coming-together-font-aid-iv/6553234</a></p>
    <p>I ordered a copy last week and I'm really impressed with it. The cost is $25 and all profits will go to help victims of the Haiti earthquake.</p>
    <p>Thanks everyone for your help and support!</p>
