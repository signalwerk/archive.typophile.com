  html: <p>I suppose the majority of fonts were never named after their creators.  But in the past, at least it seemed to happen (Frutiger, Gill Sans, Caslon, Lubalin).  Of course I'm not aware of every single font that's been released recently, but is it just not done to name a font you designed after yourself anymore?</p>
