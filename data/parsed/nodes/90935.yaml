    html: |-
      <p>It can make sense. Especially if it's something you<br>
      consider to be your magnum opus (which however<br>
      tends to come towards the end). Here's a more subtle,<br>
      modest <em>and</em> more effective idea: at least for your more<br>
      serious work, use names that start with the letters of<br>
      your last name. In my case so far I've used Paphos and<br>
      Patria. You could use Maelstrom, Mallard, Magus...<br>
      Or you could leverage the cool "horn" in your name.</p>
      <p>* At least the more serious ones.</p>
      <p>hhp</p>
