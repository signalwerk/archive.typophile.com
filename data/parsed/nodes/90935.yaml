      <p>maybe many designers don't because they are usually designing for a client and so feel its inappropriate to name it after themselves? </p>
      <p>i think typefaces named after the designer give a different impression. To me they seem more sophisticated and elegant... i can't explain why though it's just a feeling i get. maybe it's because it reminds me more of the craftsmanship and tradition side of type design while typefaces like 'Metro' make me think of advertising and business...i get the same feeling from design studios named after the designer as opposed to studios with names like 'intro' or 'tomato'(both great studios)... something like Atelier 'insert designers name' or Studio of 'insert designers name' conjures up images of a craftsman who knows what he's doing...or she's doing, anyway i'm going off topic now.</p>
