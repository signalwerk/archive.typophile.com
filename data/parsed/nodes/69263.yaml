    <p>Howdy,</p>
    <p>The title says it all, I'm quite interested in getting my work and drawings up on <a href="http://www.dribbble.com" title="www.dribbble.com">www.dribbble.com</a>, so are a lot of other people...invites are a bit sparse. I've signed myself up at <a href="http://www.featural.com" title="www.featural.com">www.featural.com</a> in case a random person wants to give one out, but I figured I would at least ask around here.</p>
    <p>My portfolio can be seen here: <a href="http://www.davebailey.us" title="www.davebailey.us">www.davebailey.us</a> (New work added tonight!)</p>
    <p>Thanks!</p>
