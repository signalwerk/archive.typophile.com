    html: |-
      <p>This is the same request you posted in <a href="http://typophile.com/node/117300" title="http://typophile.com/node/117300">http://typophile.com/node/117300</a> but with a larger picture and a second font suggestion.<br>
      In my opinion this is hand lettering rather than fonts as such.<br>
      I have not been able to get any closer than Font Mesa's Brewmaster [Your "Brewmeister"?] <a href="http://www.myfonts.com/fonts/fontmesa/brewmaster/" title="http://www.myfonts.com/fonts/fontmesa/brewmaster/">http://www.myfonts.com/fonts/fontmesa/brewmaster/</a> and note that it was based on an old Budweiser logo.<br>
      This type of script was popular in the decades around 1900. We sometimes lump them together as "Baseball" scripts. See for example Fenway Park JF <a href="http://www.myfonts.com/fonts/jawfonts/fenway-park-jf/" title="http://www.myfonts.com/fonts/jawfonts/fenway-park-jf/">http://www.myfonts.com/fonts/jawfonts/fenway-park-jf/</a> Philly Sport Script is close <a href="http://www.myfonts.com/fonts/urw/philly-sport-script/" title="http://www.myfonts.com/fonts/urw/philly-sport-script/">http://www.myfonts.com/fonts/urw/philly-sport-script/</a> except for the J.<br>
      Another possible alternative is Arizona <a href="http://www.myfonts.com/fonts/typesetit/arizonia/" title="http://www.myfonts.com/fonts/typesetit/arizonia/">http://www.myfonts.com/fonts/typesetit/arizonia/</a><br>
      For this type of business a script based on an old Miller beer logo, like Font Mesa's Draft Beer <a href="http://www.myfonts.com/fonts/fontmesa/draft-beer-classic/" title="http://www.myfonts.com/fonts/fontmesa/draft-beer-classic/">http://www.myfonts.com/fonts/fontmesa/draft-beer-classic/</a> might be adaptable.<br>
      As for "Barbador" I am not certain as to which font this is.<br>
      Don</p>
