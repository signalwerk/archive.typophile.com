      <p>BAR &amp; GRILL: I never did find anything with a name like Barbador. You could do the letters from scratch or edit a heavy flare-serif like Clearface Gothic <a href="http://www.myfonts.com/fonts/linotype/clearface-gothic/" title="http://www.myfonts.com/fonts/linotype/clearface-gothic/">http://www.myfonts.com/fonts/linotype/clearface-gothic/</a> or URW Agenda <a href="http://www.myfonts.com/fonts/urw/agenda/" title="http://www.myfonts.com/fonts/urw/agenda/">http://www.myfonts.com/fonts/urw/agenda/</a><br>
      Don</p>
