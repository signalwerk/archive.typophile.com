    <p>Script/Display</p>
    <p>I thought I posted this the other night, but no posts show up in my profile?</p>
    <p>Anyway, original artwork done by a signmaker who passed away.<br>
    The business asked me to recreate the logo.</p>
    <p>Any ideas on these two fonts? The script is similar to Brewmeister.<br>
    Barbador was the closest I came to the "Bar &amp; Grill" line.</p>
    <p>Do you think hand drawn?</p>
