      <p>To all that have commented,</p>
      <p>I greatly appreciate your help and the time you have spent assisting me with this project. You all have some great points, and I am still working on addressing them.</p>
      <p>I have worked on eliminating the extended feel. I feel I have that pretty much worked out, but maybe I've been looking at it too long. </p>
      <p>Number3Pencils, I pretty much came to the same conclusion that you did, when I was inking out the forms. After examining my strokes, I found the rounded forms had some unusual kinks. I've reworked those characters.</p>
      <p>I have attached a new .PDF file with some markings noting some areas I need to touch up and underlined characters that are so hideous they need reworking. I am primarily looking for areas that I missed, and your comments regarding the "extension" effect at this point. The numbers in particular have some balance issues.</p>
      <p>Once again, thanks for your assistance both with the design and motivating me to create a better typeface.</p>
      <p><a href="http://www.insignedesign.com/files/avianor2.pdf" title="http://www.insignedesign.com/files/avianor2.pdf">http://www.insignedesign.com/files/avianor2.pdf</a></p>
      <p>JDooley</p>
