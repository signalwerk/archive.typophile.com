      <p>I think what it wants is some squaring of the round. This is just a theory, but I--hold on. I'm not going to be able to use words well enough to say this.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/allpurposetemp_3770.PNG"></div><br>
      Okay, my idea is that a font looks awkward if it has curves that are shallower than those in a circle. Curve a is shallower than a circle. Curve b is just as wide, but the curves aren't as shallow, so it looks sturdier. I think that's why your font looks artificially extended. Now, there may be a font or a person out there that contradicts my theory, but this is what my gut tells me is the solution.<p></p>
