      <p>I was also having troubles with how it looks mechanically pulled. Just so you know, it isn't. I wonder if the problem is that the extenstion isn't quite enough- it's sort of in limbo. Anyone have experience drawing extended typefaces? This is my first real attempt at it. The "extension effect" isn't as pronounced when you print it out.</p>
      <p>Excuse the kerning/spacing for now, I'm still working out the letterforms at this stage. I completed A-Z, and here is a .pdf, as requested. There could be some "crunchies" from the illustrator import still.</p>
      <p><a href="http://www.insignedesign.com/files/avianosample.pdf" title="http://www.insignedesign.com/files/avianosample.pdf">http://www.insignedesign.com/files/avianosample.pdf</a></p>
