      <p>Eben,</p>
      <p>Those are some really great photos. Thanks for sharing those.</p>
      <p>I think I should be clear about my objective. I am not necessarily trying to do “Trajan Extended.” I want to provide an alternative to someone that might be doing a job that would normally scream “Trajan!” My objectives were to have the typeface exhibit regular and even geometric styling, but with a heavy influence from the power and timeless beauty of Trajan.</p>
      <p>I agree with your comment about the O and Q, and have corrected the problem. For the P, I have added it as an OpenType alternate so it is available if desired.  I’ve corrected the group. I was having problems balancing it and got distorted to the point it was almost obliqued. I think the C and G are ok, and I have reduced the size of the H.<br>
      I have also extended the base of the E.</p>
      <p>Once again, thanks to all for the assistance so far.</p>
      <p>PDF: <a href="http://www.insignedesign.com/files/avianor4.pdf" title="http://www.insignedesign.com/files/avianor4.pdf">http://www.insignedesign.com/files/avianor4.pdf</a></p>
      <p>Jeremy Dooley<br>
      <a href="http://www.insignedesign.com" title="www.insignedesign.com">www.insignedesign.com</a></p>
