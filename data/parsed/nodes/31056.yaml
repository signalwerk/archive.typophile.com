      <p>Dan,</p>
      <p>Thanks for the comment. I rounded off the U and the u.</p>
      <p>One of my objectives before beginning this project was to do a titling with "power." I thought that sharper serifs would help achieve this. I can certainly see how my choice of sharper serifs contributed to the extension problem I was having, but since this was one of my original objectives, I don't want to abandon it.</p>
      <p>All,</p>
      <p>Thanks for your assistance with this project. I ended up with a much better typeface, thanks to your help.</p>
