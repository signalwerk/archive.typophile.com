      <p>Beautiful! It reminds of of Goudy's work a bit.</p>
      <p>I'd suggest making the bowls of the U and u much more round. They are too pointy at the moment, and feel forced.</p>
      <p>Your serifs also all feel like they've been stretched out, rather than drawn out. Perhaps you could make them a little more "slab" like? Obviously, I don't mean that you should make them real slabs, or even wedge slabs… but the curves could have more meat to them!</p>
