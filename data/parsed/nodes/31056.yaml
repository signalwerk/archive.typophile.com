  html: <p>Aviano is an extended all caps face inspired by Trajan. I wanted the face to have extended letterforms for a more “formal” look, and also more geometric and consistent letterforms. This is some early experimentation. I welcome any comments.<img src="/sites/default/files/old-images/Aviano-R1_5692.gif"></p>
