      <p>Hi</p>
      <p>Nice, though I agree with the above posts on the wideness looking unnatural. It looks like a wide font that has been stretched even wider. See the G for example. Its left side looks almost pointy to me.</p>
      <p>I also think there are some problems with the balance of certain letters. Here I am talking about the S for instance. It looks top heavy. Make the top part a bit narrower maybe. The Z is leaning backwards (to the right, that is to me). The X is also unbalanced. The top and bottom part are probably equal in size but this makes it look unbalanced optically. Make less whitespace in the top part and it will start to balance.</p>
      <p>Magnus</p>
