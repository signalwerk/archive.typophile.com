    html: <p>Have a look at Bringhurst’s ’Elements of Typographic Style’. He has a table, based on the widely accepted idea that 2 1/2 lc alphabets is the maximum optimal measure for single column pages. That can be stretched with additional leading. When a column gets too narrow in multi-column layouts, then you either have problems with spacing or the ’rag’. But the best thing is to try it with the typeface and size you have in mind. The thing is to find the mixture of point size, leading, measure and margins that work together. And as Stephen indicates, there’s no formula for that; the ’eyes’ have it.</p>
