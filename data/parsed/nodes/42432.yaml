  html: <p>Hey guys and gals, I am a new designer and I cant for the life of me remember what the standard words per line is in publications. Anyone help me out? Thanks and much appreciated!</p>
  html_clean: <p>Hey guys and gals, I am a new designer and I cant for the life of me remember what the standard words per line is in publications. Anyone help me out? Thanks and much appreciated!</p>
