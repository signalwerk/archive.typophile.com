    html: |-
      <p>I don’t know if this is of any use to you, but one bit of wisdom that is always passed around is that there should be no more than 10 to 12 words per line (or 50 to 60 characters), because this is what the human eye is comfortable with.</p>
      <p>Of course, everything already said above also applies — if you are working on a letter-size page broken up into four columns of text, the words per line will probably be less than 10 to 12.</p>
