      <p>Whatever this is, it's nicely designed,in my opinion. All I can say is that it doesn't seem to be at the MyFonts site, or they didn't categorize it as "curly".</p>
      <p>The most similar font I can suggest is Edison Swirl, an Art Nouveau-era design that has digital versions from both <a class="freelinking external" href="http://new.myfonts.com/fonts/hihretrofonts/edison/" rel="nofollow">HiH, as "Edison"</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/spiecegraphics/edison-swirl-sg/" rel="nofollow">Spiece Graphics</a>.</p>
      <p>- Mike Yanega</p>
