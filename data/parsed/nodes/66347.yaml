    html: |-
      <p>Nice work Jim. They categorized it under 'Gothic'.  Hmmm. I don't think I ever would have looked there.</p>
      <p>Florian, "Times New Roman"? It looks completely hand-drawn to me, but the more I look at it, I can see why you'd say that. The proportions are pretty much TNR and the skeleton core of each letter, with the exception of a few letters, also seems to follow TNR's shapes. I can see you making the overlays now, that show how the wispy, curly serifs are the main thing that were changed.</p>
      <p>That being the case, if they gave prizes for the most creative font based on Times New Roman, this would be a contender in my book.</p>
      <p>- Mike Yanega</p>
