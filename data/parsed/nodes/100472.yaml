    html: |-
      <p>It looks like a customized <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Font-Bureau&amp;ffam=Interstate%20Black%20-%20Regular&amp;fid=3c556996a958f8b25a2a44ce5bb876b7&amp;fsize=60&amp;text=QUIKSILVER&amp;fit=1" rel="nofollow">Interstate Black</a></strong> by Font Bureau<br>
      /Q is probably constructed from /O and you could try also to use the /O of DIN Black which is a bit more "square" and closer to your sample.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
    html_clean: |-
