    html: '<p>Some more possibilities (quite same work as described by fivos): <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova/" rel="nofollow">Proxima Nova</a> (Extra Bold), <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=10000" rel="nofollow">Gotham</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/gibson/" rel="nofollow">Gibson</a> (a bit bold this one), <a class="freelinking external" href="http://processtypefoundry.com/fonts/colfax" rel="nofollow">Colfax</a> (a bit like DIN but probably too much work to do as /K and /S are totally off)</p>'
