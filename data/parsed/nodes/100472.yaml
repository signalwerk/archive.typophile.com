    html: |-
      <p>It looks like a customized <strong><a href="http://Interstate Black" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Interstate Black</a></strong> by Font Bureau<br>
      /Q is probably constructed from /O and you could try also to use the /O of DIN Black which is a bit more "square" and closer to your sample.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
