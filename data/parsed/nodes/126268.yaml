    <p>I created the font Oscar Bravo based on the NATO phonetic alphabet after a visit to Duxford Air Museum just outside of Cambridge, UK, where the whole history of aviation is represented in a series of exhibits ranging from early prop planes to supersonic jetliners.</p>
    <p>In response to popular demand this font is now available in ‘Scotch’ and ‘Irish’ versions.  If you take your whiskey with an ‘e’ choose Oscar Bravo Whiskey. If you prefer it neat, choose Oscar Bravo. And no, I am not going to bring out an Oscar Bravo Bourbon version!  Follow the link to view:</p>
    <p><a href="https://www.myfonts.com/fonts/studio-k/oscar-bravo/">https://www.myfonts.com/fonts/studio-k/oscar-bravo/</a></p>
