    date_raw: 17 Apr 2006 — 1:13pm
    votes: null
    html: "<p>I'm very partial to letterpress Bembo in the context of British commercial printing of the 1930s to 1960s, especially academic books. I've never been very impressed with Bembo in private press and limited edition printing (even when printed by Mardersteig), where the larger sizes are usually used. Bembo is a great commercial bookface, but is somehow too common for the special treatment of fancy papers and bindings. But give me a copy of any OUP scholarly work set in Bembo and its the typographic equivalent of comfort food: not spectacular, but very palatable and pleasing.</p>"
    html_clean: "<p>I'm very partial to letterpress Bembo in the context of British commercial printing of the 1930s to 1960s, especially academic books. I've never been very impressed with Bembo in private press and limited edition printing (even when printed by Mardersteig), where the larger sizes are usually used. Bembo is a great commercial bookface, but is somehow too common for the special treatment of fancy papers and bindings. But give me a copy of any OUP scholarly work set in Bembo and its the typographic equivalent of comfort food: not spectacular, but very palatable and pleasing.</p>"
