    html: <p>I only pick Bembo because it's an obvious touchstone. But can everyone really like any one type? I expect it could only be so with a type too old to be unfashionable, but if it can happen at all then there's a consistency, in that subset of typographic judgement that constitutes bibliophile taste, which I don't think exists in any other art or craft.</p>
