    html: |-
      <p>Hmmm. What's up with Bembo lately?</p>
      <p>I've printed several letterpress books with Bembo. I'd like to think they were well printed. Never had a problem with the face except for those related to its metal configuration. It was weak as a metal face in that thin crossbars such as those in the lowercase e would wear out quickly. But then again, Monotype was never meant to be edition printed so why complain.</p>
      <p>Unattractive or uncomfortable? What are you kidding? Ever see Mrs Eaves?</p>
