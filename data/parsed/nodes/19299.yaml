      <p>I go in and out of phase with the classics, including Bembo. But I think it's easy to read which I think is more to the point. And it has a lovely italic.</p>
      <p>I try not to be doctrinaire about fonts because they can be so wrong or so right depending on their use. Not that there aren't fonts I will NEVER use (Bookman! anything ITC!). But I do try to keep an open mind. </p>
      <p>I for one am sick to death of all the new grotesks, DIN and it's ilk. And publishers like Phaidon who use unreadable fonts for running text thinking it's edgy and cool.</p>
