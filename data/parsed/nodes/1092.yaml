    date: 2003-09-01T23:59:00
    date_raw: 1 September 2003 - 11:59pm
    votes: 0
    html: '<p>Has it been 72 hours? I really can’t hold it in any more… &nbsp;;-) <br><br>I personally like large pixelfonts in general, not least because there are so few of them! This is a strange one (in a good way), and the main question about it seems to be: what’s it for? <br><br>If it’s for good performance in video, then the trapping is going to look strange versus “display” usage, but <span class="caps">OK</span> functionally. So if you’re shooting for the former, you’ll have to put in more traps (like in the “I” — yes, I can see the trickiness there), but if it’s for the latter you’d probably need to balance them aesthetically (generally by reducing the trapping in some glyphs). <br><br>As to the somewhat unorthodox glyphs (like the “g” and “y”), I honestly can’t ﬁgure out if they should stay or go… One thing about the “g” though: it’s too wide, and leaning rightward — try to make the join to the tail thinner and within the left bound of the head. <br><br>hhp <br></p>'
    html_clean: '<p>Has it been 72 hours? I really can’t hold it in any more… &nbsp;;-) <br><br>I personally like large pixelfonts in general, not least because there are so few of them! This is a strange one (in a good way), and the main question about it seems to be: what’s it for? <br><br>If it’s for good performance in video, then the trapping is going to look strange versus “display” usage, but <span class="caps">OK</span> functionally. So if you’re shooting for the former, you’ll have to put in more traps (like in the “I” — yes, I can see the trickiness there), but if it’s for the latter you’d probably need to balance them aesthetically (generally by reducing the trapping in some glyphs). <br><br>As to the somewhat unorthodox glyphs (like the “g” and “y”), I honestly can’t ﬁgure out if they should stay or go… One thing about the “g” though: it’s too wide, and leaning rightward — try to make the join to the tail thinner and within the left bound of the head. <br><br>hhp <br></p>'
