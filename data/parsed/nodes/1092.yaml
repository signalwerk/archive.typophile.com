    html: <p>The starstruck g and y are fine to my eye, maybe because they look great from 5 feet away. A fitter quote might go, "Pixeltrap attains its shape at a distance of 5', or 120 dpi, whichever comes first." <br> <br>I am not teasing. Photonic analog interference is wild and real between the viewer and the display. Only those with digital eyes will see strange lighttraps. <br>&lt;self-serving&gt; maybe some of them want to be gray. &lt;/sans&gt;</p>
