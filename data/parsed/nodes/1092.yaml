    html: "<p>Miguel said: <i>I think that the tails of f, g and y are too decorative.</i> <br> <br>I like those tails Jared, but they do look a bit out of context with the rest of the face. Perhaps you could derive two versions of the characters: one that is a straighter gothic sans; and one that is more decorative - sort of a sans w/swash lowercase. <br> <br>Or, whatever. <br> <br>Regardless, it looks swell.</p>"
  - id: 8470
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 1 Sep 2003 — 9:59pm
    date: 2003-09-01T21:59:00
    votes: null
    html: "<p>Has it been 72 hours? I really can't hold it in any more...  ;-) <br> <br>I personally like large pixelfonts in general, not least because there are so few of them! This is a strange one (in a good way), and the main question about it seems to be: what's it for? <br> <br>If it's for good performance in video, then the trapping is going to look strange versus \"display\" usage, but OK functionally. So if you're shooting for the former, you'll have to put in more traps (like in the \"I\" - yes, I can see the trickiness there), but if it's for the latter you'd probably need to balance them aesthetically (generally by reducing the trapping in some glyphs). <br> <br>As to the somewhat unorthodox glyphs (like the \"g\" and \"y\"), I honestly can't figure out if they should stay or go... One thing about the \"g\" though: it's too wide, and leaning rightward - try to make the join to the tail thinner and within the left bound of the head. <br> <br>hhp <br></p>"
  - id: 8471
    user_id: 2046
    user_name: tidchris
    user_path: null
    date_raw: 30 Nov 2003 — 1:54am
    date: 2003-11-30T01:54:00
    votes: null
    html: <p>The starstruck g and y are fine to my eye, maybe because they look great from 5 feet away. A fitter quote might go, "Pixeltrap attains its shape at a distance of 5', or 120 dpi, whichever comes first." <br> <br>I am not teasing. Photonic analog interference is wild and real between the viewer and the display. Only those with digital eyes will see strange lighttraps. <br>&lt;self-serving&gt; maybe some of them want to be gray. &lt;/sans&gt;</p>
