    html: |-
      <p>Interesting!</p>
      <p>But, like in many modular/geometric typefaces, some letters cause problems in terms of distinguishing them from another. Especially D≠O and V≠U. BTW, where has zero gone? ;)</p>
      <p>Regarding inconsistency… In some of your glyphs you avoid diagonals at any cost (e.g. V), in others you don‘t (X, Z, 7). Maybe you could either find a way to avoid them entirely or let other glyphs also “profit“ from breaking out of the strictly squarish grid.<br>
      To me, the glyphs with a single stroke instead of the paper-clippy doubled stroke tend to stand out a bit too much (esp. S, 2 and 8). Maybe you could try to include some paper clips on these? Or how about overlapping the two shapes of the 8?</p>
      <p>Also, the glyph widths seem dissonant to me – e.g. X looking too wide, H, T and 7 too narrow etc.<br>
      But to judge this, a pangram or short sentence would be helpful.</p>
      <p>Keep it up,</p>
      <p>jörg</p>
