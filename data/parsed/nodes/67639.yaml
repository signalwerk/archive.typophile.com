    html: <p>Nice.  I feel the letters should be really close together. This will create regular clusters of verticals here and there with the wide spaces of the letters in between.  As it is, the spaces between the letters seem like letters themselves..I have not thought this out completely but yes, sample sentences with various spacing would help. The 8 is clever, but it looks flimsy with its two large unconnected pieces - unlike the logic of the other letters.</p>
