    html: <p>In an attempt to work off of Tomi from Suomi's advice and make the logic and application of the "clippy" things way more uniform JoergGustafs comments about modular/geometric typefaces having some real problem letters are becoming quite clear. As the "clippy looking things" become more uniform my O &amp; D,   V &amp; W,   K, H, X &amp; 8 are kind of difficult to tell apart. I was wondering if anyone knows of some fonts that totally avoid diagonal strokes or have solved some of the problems i've encountered successfully. Just looking for some inspiration. Thanks for any help.</p>
