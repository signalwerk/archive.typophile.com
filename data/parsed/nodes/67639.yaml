    date_raw: 22 Jun 2010 — 3:20pm
    votes: null
    html: |-
      <p>Maybe if you extended the doubled up line to or above the top on the /D/ and very little of that on the /O/ or maybe put it on the bottom....</p>
      <p>I don't like the /G/. It looks like "...the lazy 009." You could easily make a capital G with your system, and especially since it is currently the only lowercase letter I would change it.</p>
      <p>This is a really cool system that works well for a lot of the characters, but I'm sure you've noticed that the way the Q breaks the mold makes it stand out as the best letterform of the set. I think you need to break the rules more in order to make this a truly great font and to solve your differentiation issues. As it is now, I'd place this in the category of Electronics-inspired fonts—of which there are thousands—but if you are really going for string, paperclips, and neon lights, it should be a bit freer. At least use an angle or two.</p>
      <p>That's my 2 cents...</p>
