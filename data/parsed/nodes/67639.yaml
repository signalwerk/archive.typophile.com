    html: <p>Nice overall effect of the font.  Flipping the D around a horizontal axis might make it more D-like since the outline will then 'start' at the gap top left as one naturally writes it by hand.  The tiny gaps where horizontal meets vertical in the black image gives an interesting 3D effect.  In the black panel also, the curve that joins the two parallel lines is slightly pointy rather than a perfect semicircle - a shape you might consider for the font as a whole.</p>
