      <p>Interesting, JanekZ. <strong>K</strong>onsul looks like an exact match. What’s the source of your sample?</p>
      <p>Assuming that Consul and Konsul are the same typeface with some alternate letters*, I’d say it’s a Jugendstil/Art Nouveau/Wiener Secession inspired typeface (also see the a, f and g of your sample). Which in turn would imply that it could not have appeared till the late 1890s or the early 1900s.</p>
      <p>* the only picture I could find online, of «Halbfette Consul I | Klassische Form»:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ff-dagny_inspiration_3_3516.jpg"></div><br>
      link: <a href="http://fontfeed.com/wp-content/uploads/2009/08/ff-dagny_inspiration_3.jpg" title="http://fontfeed.com/wp-content/uploads/2009/08/ff-dagny_inspiration_3.jpg">http://fontfeed.com/wp-content/uploads/2009/08/ff-dagny_inspiration_3.jpg</a><p></p>
