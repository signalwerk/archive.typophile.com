  html: |-
    <p><a class="freelinking external" href="http://www.ascenderfonts.com/font/ayita-pro-family-1.aspx" rel="nofollow">Ayita Pro</a> is a cheerful new sans serif design by Jim Ford of Ascender Corp. Ayita is a Cherokee name which translates to 'first in dance' and recalls the exuberant rhythm and flow of these 14 new typefaces. Originally conceived as an upright italic design, the Ayita typeface family remains contemporary, friendly and elegant yet hard working. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/AyitaPro_ChewingGum_6607.jpg"></div><p></p>
    <p>Ayita Pro's open shapes render faithfully at small point sizes and on device screens while the compact design allows more characters per line for headlines. The Ayita Pro fonts feature a typographically-rich Latin character set, with OpenType features for advanced design applications and a variety of decorative patterns and ornaments to fuel your creativity. </p>
    <p>Ayita Pro is a unique and powerful design that is useful for a wide variety of applications from fashionable headlines and greeting cards to user interfaces, packaging and signage. The Ayita Pro Complete font family contains 14 fonts in total. An OpenType-compatible application is required to access the advanced typographic features.</p>
    <p>As a special offer, the <a class="freelinking external" href="http://www.ascenderfonts.com/font/ayita-pro-family-1.aspx" rel="nofollow">Ayita Pro family package</a> is available at 50% off now through June 1, 2010. </p>
    <p>Two weights of Ayita Pro are also available with a free license and can be downloaded from <a class="freelinking external" href="http://www.ascenderfonts.com" rel="nofollow">AscenderFonts.com</a></p>
