    html: |-
      <p>To kern MATT correctly, I would do this:<br>
      1. type NATN or HATH (whichever has both sides vertical and is largest),<br>
      2. kern AT so that the visual distance between MA and AT is the same (other way of seeing it: so that you get the same white in-between)<br>
      3. use the AT kerning value in MATT, chances are you need not change TT BUT if you do<br>
      4. type HHTTHH or NNTTNN so you get an evenly spaced block.</p>
      <p>IMVVHO your name does not look good with the shortened TT bars; it might look better with<br>
      either a ligature TT (joining on top)<br>
      or a TT where only the inside of the 'cross' bar is shortened.</p>
      <p>Still, I would keep it as in the font (or change font).</p>
      <p>PS. My name is DAVID and in 99.99% of the fonts, it looks horrible when spelt in all-caps, I need to respace everything manually, sadly (working first on HHDAHH, then HHAVHH, HVIH and chekcing HIDH, though this is rarely a problem - then it all assembles magically).</p>
    html_clean: |-
