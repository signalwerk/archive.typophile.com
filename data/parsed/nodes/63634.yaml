    <p>Hi all, I'm designing my cards and have been caught up trying to decide a way to best present my name, the problem is I'm writing it out in full in all caps, my name is MATT and kerning the double T's is killing me! I've drawn them together linking the crossbars but it attracted too much attention and looked odd, I tried to make custom T's with narrower crossbars but they too stood out strangely, the gap and between large gap between the ascenders and the tiny space between the end of the crossbars makes me cringe! Any thoughts? Advice?</p>
    <p>Much appreciated, thanks in advance...</p>
    <p>Matt</p>
