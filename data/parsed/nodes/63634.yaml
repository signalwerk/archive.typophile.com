    html: |-
      <p>All-cap (and small cap) settings are traditionally letterspaced, and to this day, many foundries add extra "cpsp" as an OpenType feature, as a matter of course.</p>
      <p>I concur with Ilene.<br>
      When I first started making fonts, I put a lot of kerning in them, but now I consider that less is better. If a font has kerning between A and T, and A and C, as this one appears to, it only worsens gappy combinations where kerning is not possible.</p>
      <p>The exception is the "tight but not touching" style, where the spacing is all about proximal distances, not the balance of light and dark.</p>
      <p>IMO, the proximal style makes sense for Syndrome, as it is a feature of the wordmark, where the stencilling leverages the proximal effect. So I don't have a problem with MATT MACDONALD; however, I find the letterspacing in Syndrome to be too great, in relation to the stencil gap, and the tightness of MATT MACDONALD, which is also much tighter than the U&amp;lc text. So, the card exhibits three different spacing strategies--loose, tight, and default-- which seems wrong.</p>
    html_clean: |-
