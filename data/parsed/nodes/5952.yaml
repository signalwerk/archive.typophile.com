    date: 2004-08-16T14:08:00
    date_raw: 16 Aug 2004 — 2:08pm
    votes: null
    html: <p>I think that a possible way to learn to design text typefaces is to try to design words instead of letters, always watching a preview on your screen and printing often text in small size, but not using always the same words (it's obvious).  <br>You can choose some words and work on them until the single letters work, then change the words, to see if there is any problem.  <br>Maybe I said you too much... <br> <br>In my opinion the serifs are too small for a text typeface.  <br>I think the letters, apart R and P, are now too bare and "standard", you could emphasize the shapes, while you look for the right proprotion.  <br>Waiting for the lowercase. </p>
    html_clean: <p>I think that a possible way to learn to design text typefaces is to try to design words instead of letters, always watching a preview on your screen and printing often text in small size, but not using always the same words (it's obvious).  <br>You can choose some words and work on them until the single letters work, then change the words, to see if there is any problem.  <br>Maybe I said you too much... <br> <br>In my opinion the serifs are too small for a text typeface.  <br>I think the letters, apart R and P, are now too bare and "standard", you could emphasize the shapes, while you look for the right proprotion.  <br>Waiting for the lowercase. </p>
