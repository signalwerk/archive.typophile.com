    html: <p>The glyphs are mostly very solid, but to me the only interesting character there is the "R". If you can carry that spirit thoughout the font (for example in the "A" by lowering its bar a lot), you should end up with something pretty nice. Otherwise I fear the font will basically a good exercise for learning how to make a text font - useful, but mostly only to you. <br> <br>hhp <br></p>
