    html: <p>The abrupt change in curvature between the straight strokes and arc in the U bothers me a bit. These curvature discontinuities are typical of fonts designed on the computer screen using Bezier curves, but aren't that difficult to fix once you're aware of them.</p>
    html_clean: <p>The abrupt change in curvature between the straight strokes and arc in the U bothers me a bit. These curvature discontinuities are typical of fonts designed on the computer screen using Bezier curves, but aren't that difficult to fix once you're aware of them.</p>
  - id: 42234
