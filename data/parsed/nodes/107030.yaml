    <p>Dear Typophiles,</p>
    <p>I'm currently considering embarking on a typeface design project (just for fun). I could do with some advice: </p>
    <p>1. Could any books be recommended that detail how to draw type?</p>
    <p>2. What tools would I need to initially hand draw type? Is a pica ruler useful and would I need a set-square/protractor/compass etc.? I would really love to know of any tools that would be particularity useful for hand drawing/designing a typeface. My eventual aim would be to digitise it should it go well, but for now I'd love some advice on books and tools.</p>
    <p>With thanks in advance.</p>
    <p>Best,<br>
    Joe</p>
