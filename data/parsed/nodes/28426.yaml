    <p>Hi </p>
    <p>I cant't seem to make my opentype features work within this script font.</p>
    <p>They are supposed to substitute a connecting letter with a nonconnecting letter whenever it is typed as a single letter.<br>
    So typing 'Banana' would result in a fully connected word. But typing 'B anana' would give you a nonconnecting 'B' followed by connecting letters 'anana'.</p>
    <p>I have been pulling my hair out trying to work out somethin with the opentype tags 'init', 'isol' and 'fina' but obviously something is wrong since it doesn't work.</p>
    <p>Heres a copy of the 'isol' tag</p>
    <p>----<br>
    EDIT (something whent wrong in this post also :)</p>
