      <p>I'm not sure what programs support "init’, ‘isol’ and ‘fina’, but I don't think most Adobe programs do, if that's what you're using to test. </p>
      <p>In addition to those features, you should probably add a "calt" feature, which the current InDesign does support. I've never done it, but I think the "calt" feature can be made to do this sort of thing. See the rather daunting "calt" definition in Adobe's <a href="http://www.adobeforums.com/cgi-bin/webx?233@@.3bb7c828!enclosure=.3bb7c829" rel="nofollow">example feature file</a> for Bickham script.</p>
