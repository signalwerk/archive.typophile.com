    html: |-
      <p>Well I didn't have to write a very long feature file to get it to work. I guess you were right about the fact that indesign and other programs do not yet support isol init medi and fina. </p>
      <p>I got the thing working by making a calt feature looking like this:</p>
      <p>----<br>
        ###replaces the uppercase letter followed by punctuation or numeral with the isolated formof the uppercase letter.<br>
        sub @LETTERS_UC' @PUNCTU by @LETTERS_UC_ISOL;<br>
        sub @LETTERS_UC' @FIGURES_LINING by @LETTERS_UC_ISOL;<br>
        sub @LETTERS_UC' @FIGURES_OSF by @LETTERS_UC_ISOL;</p>
      <p>  sub @LETTERS_LC' @PUNCTU by @LETTERS_LC_FINA;<br>
        sub @LETTERS_LC' @FIGURES_LINING by @LETTERS_LC_FINA;<br>
        sub @LETTERS_LC' @FIGURES_OSF by @LETTERS_LC_FINA;<br>
      ---- </p>
      <p>Thx man you saved my day</p>
