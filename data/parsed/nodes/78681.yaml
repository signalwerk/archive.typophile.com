    html: |-
      <p>I don’t know what this FAQ Pronunciation really is worth.</p>
      <p>Arnold Böcklin (or Boecklin), for example, is nothing like ‘BOKE-lin’.</p>
      <p>Cochin is, as far as I know, ‘cosh-’ and a nasal ‘un’, as in ‘un, deux, trois’</p>
