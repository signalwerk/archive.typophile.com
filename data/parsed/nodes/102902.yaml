      <p>Will, I seldom post here — I'm still a beginner, so I mostly read what others more advanced have to share — but your last reply that says "I know there's still a lot of work to be done, and I'm constantly tweaking these fonts" makes me wonder what's in some peoples' head (and also how young and immature are you):</p>
      <p>Yes, fonts have a version number, like software programs, so they can be updated with small corrections (correctly aligning a misaligned diacritical mark, for example, 'cause everybody makes small mistakes), but what do you mean "constantly tweaking these fonts"?!? Like "the shape of the letters of the fonts I already put on sale on MyFonts.com will change with time, when I get more professional with this font design thing"?   I can't believe some people think like that!</p>
      <p>(Also… what Frode said 110%).</p>
