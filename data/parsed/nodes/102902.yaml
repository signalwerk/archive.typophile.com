      <p>Will. To be perfectly honest, I think your typeface is horrible. That is, some of the effects are very nice, but it seems to me it’s <em>all</em> effect and <em>nada</em> substance. I can’t believe you are actually selling this! Or, actually: I have no doubt you <em>can</em> sell it (you know, people are horses), but how on earth you are going to <em>live with yourself</em> afterwards beats me.</p>
      <p>Looking at your website, I was thoroughly impressed by your reimagination of the InDesign font menu. You’ve clearly been thinking a lot about how it could be improved. Why not devote the same attention to your type design? Read stuff! Study the masters! Don’t churn out whatever. Do the best you possibly can, and spend the years it takes to get there. Anything else is just a waste of time.</p>
      <p>(Maybe I’m just misunderstanding a faux naïve thing …)</p>
