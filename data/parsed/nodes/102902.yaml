    html: |-
      <p>To be a bit more specific: Your letters lack (some) basic optical corrections (like for example thinning of joints), but appears to have others (like overshot). Your curves are poorly drawn (look at transitions from straight line to curve; uneven edges where they should be smooth) and especially your circular shapes suffer. Most internal shapes appears to follow the external shapes closely (or vice versa) which makes me believe you started with a skeleton and applied a stroke, leading to problems like the strongly ellipse shaped counter in ‘o’ (this needs to be more squarish) and a sagging right edge of ‘n’ etc. And then there’s ‘s’, with thinning, a fairly good spine — the odd one out. The letters themselves are poorly balanced, and the spacing is uneven and I don’t understand the point in providing a bold when it is so close in weight to the regular. </p>
      <p>Even after that long tirade, there’s still nothing in here that is particularly exciting or new. It seems to be a common misconception that making something “neutral” is easy. On the contrary.</p>
