      <p>The quality &amp; resolution of the picture is good enough.<br>
      What I was asking is a photo of another physical sample i.e. if you have the old stamp you could try to make a new sample by laying out the stamp carefully on a smooth white paper to show us as many details as possible.<br>
      If this is your only sample, then we can only make general assumptions and Helvetica Narrow still looks good enough for me.<br>
      Take also into account that if the stamp is τοο old [i.e. 10, 15, 20 years] the technology used to create it could vary and the fonts used (which were proprietary at some point back in time) may not correspond to any modern digital font.</p>
