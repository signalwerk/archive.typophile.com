    <p>I'm curious what viable options are out there for online type testers, the ones used by various online font stores. I understand there are numerous options using flash but that kerning and open type features are not supported. I also understand that their is:</p>
    <p>LettError LetterSetter </p>
    <p><a href="http://www.letterror.com/lettersetter/index.html" title="http://www.letterror.com/lettersetter/index.html">http://www.letterror.com/lettersetter/index.html</a></p>
    <p>which supports kerning and various features but are there any other options out there?</p>
    <p>How  important is font testing with online font stores?</p>
    <p>Thanks,</p>
    <p>Mike</p>
