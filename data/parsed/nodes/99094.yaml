  html: |-
    <p>I'm creating a return address stamp for a couple with last names beginning with C and A. We want the C to encircle the A, which is totally possible with many century-gothic type fonts, but I would like to find something a little more interesting. Does anyone know of a serif font with a perfectly round c? It doesn't matter if it's upper or lowercase.</p>
    <p>Thanks!</p>
comments:
  - id: 534846
    user: 1250
    date: 2012-12-21T14:39:00
    date_raw: 21 Dec 2012 — 2:39pm
    votes: null
    html: |-
      <p>No self-respecting font, especially not a serif font, has a perfectly round C/c.</p>
      <p>I might try making the inside letter "negative", I mean the counter of the outside letter. You'll end up with a simpler shape, that's more elegant and easier to render nicely. BTW does the "C" have to be dominant? Assuming it's a typical western couple it's most probably better to avoid such hierarchy.</p>
      <p>Or, what about alluding to an @ sign?</p>
      <p>hhp</p>
  - id: 534847
    user: 3254
    date: 2012-12-21T15:28:00
    date_raw: 21 Dec 2012 — 3:28pm
    votes: null
    html: <p>Extended serif fonts might have a counter that approximates a circle. Something like Linotype's Kepler Extended or Canada Type's Clarendon Wide. Or a Copperplate Gothic if that counts as a serif.</p>
