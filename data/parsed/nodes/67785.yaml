  html: |-
    <p>Hello,</p>
    <p>This is not a logo per se. I'm working on an invitation for a local festival's 75th party. It is a separate event from the festival itself. Since the dogwood festival started in the 1930s, I was thinking that an art deco/streamline design style would be appropriate. My intent was to meld deco/streamline with an organic sensibility. I met with the organizers today and they were excited about this direction as they were also working on a 30s theme with a swing band for the event. Originally I was just working on the words "Dogwood Festival" the client now asked me to add "75th Jubilee". Is it too much in that style? My plan was to have the rest of the invitation copy set in a sans. I am not a type designer - parts of this look like it's working to me, but there are elements that appear awkward. I've been staring at this so long, fresh eyes and some expert advice from the forum would be greatly appreciated. </p>
    <p>Thanks,</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dogwoodfest_6068.jpg"></div><p></p>
