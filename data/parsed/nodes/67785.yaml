      <p>When I first looked at it I read "Dogsood testival". I read the 'w' as an 's' because that's how an old italic 's' would look. If you lowered the middle part of the 'w' I prob wouldn't read it as an 's'. Even if you don't read it as an 's' the middle part of the 'w' still seems like it's too high up.</p>
      <p>I read 'testival' cus the top thin part of the 'F' kinda disappears when the lower part of the 'g' dominates that area. For some reason the 'F' looks like a small 'f' instead of a capital 'F'.</p>
      <p>'Jubilee' looks a little thin.</p>
      <p>75th looks nice though and the type overall is very nice. I think it suits the event.</p>
