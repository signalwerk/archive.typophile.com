      <p>Don't scale down '75th jubilee'. The stroke weights should all be the same — think of it as if you actually hand wrote this with a pen. </p>
      <p>I'd also like to see more interaction between words. Right now they all seem haphazardly nested with each other — and '75th jubilee' definitely looks like an afterthought.</p>
