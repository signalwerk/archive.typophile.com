    html: |-
      <p>I was just researching more-or-less this issue a couple of weeks ago. I was specifically looking at e-commerce solutions for WordPress, with priority on ease of implementation, and low-cost or free solutions. So I was looking only at WordPress-based solutions. Don't knock this if you are unfamiliar with it—WordPress is a lot more than just a blogging platform.</p>
      <p>My conclusions, based on reviews and ratings:</p>
      <p>- if you want the option to do physical goods as well, “Ready! e-commerce” is one of the easiest and best options.<br>
      - if you really want to only do digital downloads, “Easy Digital Downloads” is definitely the best thing out there, and easier to use than any of the platforms that also do physical goods. It does one thing very well.</p>
      <p>Both offer more features for extra money.</p>
