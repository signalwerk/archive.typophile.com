      <p>Thermography is only cool in an ironic way. If you can't pull off the irony, stay away.</p>
      <p>If you're printing your own, go down to Kinkos, choose the highest thickness card stock that will go through the printers, and print a few sheets with crop marks. An xacto and a straight edge work fine for low-runs.</p>
