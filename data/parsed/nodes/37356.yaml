      <p>Haley,</p>
      <p>I've had many friends that need a business card - fast. Our solution: I buy cover stock #110 from Staples. I run it through 10 up to a sheet on a 4/c laser printer (Okidata) and cut (well, I have a person who does superb, accurate xactoknife slits....)</p>
      <p>If there is a bleed - then we use an 8-up format, so we can give (till it) bleed(s)...</p>
      <p>They go home happy - and we are cheap, cheap, cheap.</p>
      <p>And... yes, they look professionally printed and we receive many-a-smile.</p>
      <p>Or... you could go to Popular Printing in NY - fast, reliable, not expensive. Here are their business card prices:<br>
      <a href="http://popularprinting.com/BC.html" title="http://popularprinting.com/BC.html">http://popularprinting.com/BC.html</a></p>
      <p>P.S. Ricardo - I just did check out where you asked - and boy are they expensive<br>
      1 color  1 side 500 cards $170 (and maybe a 10% off) (and they don't even quote 4/c just 3/c 500 cards for $285)<br>
      Guys I use - 4 color 1 side  UV coating applied 500 cards $39 bucks - no discount....</p>
