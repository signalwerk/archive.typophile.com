    <p>Hey guys,<br>
    I again ran into a small issue and  have no idea how to resolve it.<br>
    In the metrics windows when I enter the percent character into the input string panel, I am not getting the display. I am getting it only when I enter it as /percent<br>
    Any idea how to rectify this?<br>
    PFA image for more details </p>
    <p>Thanks<br>
    Chaitanya</p>
