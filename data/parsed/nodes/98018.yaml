    html: |-
      <p>This is a very old problem. Some older FontLab distributions were missing an entry in the Standard.nam file. on a PC, you can find the file in c:\Program Files\Common Files\FontLab\Mapping\ </p>
      <p>Edit the file and insert the line<br>
      0x0025  percent<br>
      between<br>
      0x0024 dollar<br>
          and<br>
      0x0026 ampersand</p>
      <p>The line may be missing in other .nam files in that same folder (Mapping)</p>
      <p>Is this the same font you're having the icon problem with?</p>
      <p>- Herb</p>
