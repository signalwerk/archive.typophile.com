      <p><cite>"When you have a logo that is identifiable without type, you have achieved the ultimate."</cite><br>
      I can see your point maybe if you measure the quality of a logo through minimizing the elements used while maximizing recognizability. As in the Nike swoosh. But (apart from the fact that, like Hrant says, it's not always workable to go without type) I wouldn't think that's the only measure of success in a logo; there are some terrific logos that use (and depend on) type. Are wordmarks inherently worse? Like Coca-Cola – is that really worse than Nike?</p>
