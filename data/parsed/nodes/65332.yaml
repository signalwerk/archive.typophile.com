    <p>Hello - a client has requested that their logo use multiple fonts, 'to reflect the diversity of the communities served by their nonprofit organization'. sigh.</p>
    <p>i feel that i have actually seen 1 or 2 examples of identity systems that used multiple fonts well - can anyone think of successful examples of this? or have other advice...?</p>
    <p>thanks!!</p>
