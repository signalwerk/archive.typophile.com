    html: |-
      <p>This is a logo for an expansion program for a church. The underlying message is the power of "one" or unity. Bringing a bunch of people together to accomplish a common goal or make an impact on:</p>
      <p>Individuals who impact<br>
      Families who impact<br>
      Communities who impact<br>
      Culture ... etc</p>
      <p>Sub-text is: The power of one ... Life ... Family ... Culture ... etc</p>
      <p>The mark is derived from a glass tower that stands in the courtyard of the property. The courtyard is kind of a central meeting place (tables, chairs, etc.) so we thought it would serve as a nice inspiration for the mark.</p>
      <p>I chose Dax as the typeface as I felt it had a calm, inviting feel to it's shapes. Not a huge fan of the "c" and I had to merge the "I" and a "1" for the first letter as well as elongate the "p" to allow for better framing.</p>
      <p>Thoughts?</p>
