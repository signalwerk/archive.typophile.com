    html: |-
      <p>I’d like to know how you found that! Maybe you should be on this panel, if you can pull that one out of a hat like that. Looks like some of their typefaces are using the ‘real’ names, and some are renamed, so Jancyzk Jubilee might be anything.</p>
      <p>The style resembles Brody, but I can’t find anything else very close. It looks like the 30’s era styles that Nick Curtis and Harold Lohner have mined so well from old lettering books. </p>
      <p>- Mike Yanega</p>
