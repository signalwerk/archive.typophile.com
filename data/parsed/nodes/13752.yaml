      <p>After much hunting and realizing that this was probably done on some type of vinyl cutting machine (like Gerber) I tracked down this font where most all of the letters are the same - it looks like the lower case o was modified and some new “connections” were created between letters.</p>
      <p>The font appears to be called Jancyzk Jubilee<br>
      <a href="http://lendaproducts.com/graphics/letstyle/page201.htm">http://lendaproducts.com/graphics/letstyle/page201.htm</a></p>
      <p>Curiously, any idea of it’s origins?</p>
