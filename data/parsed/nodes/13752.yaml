      <p>I think that this is probably a custom lettering (artwork) job, but the font shown as Diana in the Solotype Catalog, and sold as <a href="http://www.myfonts.com/fonts/ef/ballantines-script/ef-bold/testdrive.html?s=Thompsons&amp;p=48" target="new">Ballantines Script </a>might be a fairly close substitute. </p>
      <p>At least it would be a place to start, and with a few modifications, you could come fairly close.</p>
      <p>You could also browse the Casual Flowing Script samples in <a href="http://bowfinprintworks.com/Script07Pg1.html" target="new">Part 7 of the Script Font ID Guide</a> for similar styles.</p>
      <p>- Mike Yanega</p>
