      <p>Monotype script has NO matching letters - it IS Jancyzk Jubilee with some minor modifications - specifically the lower case o.</p>
      <p>As for finding it, I remember it from my old days working at a sign shop - I knew that I had seen it before and then I had one of those “ah-hah” moments that come out of nowhere.</p>
      <p>Some people want exact and similar just won’t cut it.</p>
