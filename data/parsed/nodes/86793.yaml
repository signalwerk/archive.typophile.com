    <p>Hi,</p>
    <p>I'm designing a poetry book with particularly modern content. References to jpegs and google pop up regularly as do swear words and sexual innuendo.</p>
    <p>I'm looking for a typeface which is a little more modern or controversial, rather than a standard poetry typeface such as Minion, Janson or Granjon. Ideally, something maybe more along the lines of some of Barnbrook's typefaces (I like the idea of Tourettes, being created purely for swearing), but with more subtle qualities and designed specifically for poetry.</p>
    <p>Any ideas appreciated.</p>
  html_clean: |-
