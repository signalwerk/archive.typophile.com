    html: <p>Can Mac group large TTF font families properly? Is there a way I could change the metadata of the font itself?</p>
    html_clean: <p>Can Mac group large TTF font families properly? Is there a way I could change the metadata of the font itself?</p>
  - id: 260715
    user: 14529
    date: 2008-02-21T23:34:00
    date_raw: 21 Feb 2008 — 11:34pm
    votes: null
    html: <p>I use FontAgentPro to manage my fonts, and in Quark 7 and Photoshop nearly all of them are properly grouped into families, especially Adobe OpenType families. It's only the boutique fonts, like FF Scala or Meta, that don't list properly, but there are also keystroke-link problems with those too. You really shouldn't have these problems on Mac OSX with proper software like FontAgentPro.</p>
