  html: |-
    <p>Having recently moved to the Mac, I'm importing my fonts and notice that most of the TrueType and OpenType fonts aren't organised in font families, like the Mac does with all the other fonts.</p>
    <p>And it truly gets horrible in Photoshop.</p>
    <p>What's going on here; what can be done?</p>
