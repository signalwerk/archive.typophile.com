  html: <p>All Central and Eastern European languages use letters with diacritical marks. These characters are not included in standard western fonts. To write texts in those languages you need special CE fonts or fonts with expanded character set (as Adobe Pro fonts). <br> <br>Unfortunately many western typographers are not experienced in designing Czech or Polish characters and many foreign CE fonts are not suitable for correct typesetting at all. Bad accents are usually too small or huge, too close to the letter, incorrectly shaped etc.  <br> <br>For the next issue of <b>TYPO Magazine</b> (<a href="http://www.magtypo.cz" target="_blank">http://www.magtypo.cz</a>) we plan to publish an extensive overview of Central European diacritics (historical background, design hints etc.). <br> <br>Dear members of this forum, could you please send me <b>samples of correct diacritical marks</b> for your mother tongue? Send me either just font and foundry names or samples (PDF preferred) with letters and accents. Sample attached. Every participant will be credited in TYPO Magazine.  <br> <br>The result of this research will be published in TYPO Mag in September and then on a special website on CE accents. <br> <br>Thank you <br> <br>Filip Bla</p>
