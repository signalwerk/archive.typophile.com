  html: |-
    <p>Hey everyone, new to the board and glad to be here.</p>
    <p>I need help in identifying this particular typeface. It's taken from the drink cup of "The Hamburger Stand" (formerly known as The Original Hamburger Stand), a chain of food joints in the Southwestern United States. The Galardi Group is the parent company if that helps in identifying design/marketing houses they may have worked with for producing this updated logo in the 90s. Any help in identifying this or similar fonts would be greatly appreciated! Thanks!</p><div class="imageWrap"><img src="http://typophile.com/files/hamburgerstand_5461.jpg"></div><p></p>
