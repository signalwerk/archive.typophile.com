  html: <p>It's probably too late now, but I found the mystery font from Anika Qureshi's second sample <a href="http://www.typophile.com/forums/messages/83/34158.html" target="_blank">in this thread</a>--the one that says "Riviera. Developing its...". It's an old Headliners face called Somerset. Not available digitally. <a href="http://www.treacyfaces.com/" target="_blank">Treacyfaces</a> owns the design now. Perhaps Joe will digitize it one of these days.</p>
