    <p>FOR IMMEDIATE RELEASE<br>
    <em>Amsterdam, The Netherlands - September 13, 2012</em></p>
    <p>The new type foundry <a href="http://arktype.nl/" rel="nofollow">arktype.nl</a> is the collaboration of Dutch designers <a href="http://www.atelierreneknip.nl/" rel="nofollow">René Knip</a> and <a href="http://www.jannohahn.nl/" rel="nofollow">Janno Hahn</a>. This collection of digital typefaces is borne from their professional practice. 25 OpenType fonts and families, which have roots in their joint design work, were specifically designed for use in architectural lettering and environmental graphics. Their extensive expertise in these fields enabled René Knip and Janno Hahn to create workhorse faces of a singular originality – practical, visually striking and perfectly legible. The advantage of having the alphabets as digital fonts instead of hand-drawn letters is that text can be composed quickly and easily, and subsequent editing is effortless. The alphabets are conceived to be physically cut, drilled, cast, routed, etc. in a variety of materials. Each font can be reproduced as physical text with the least possible effort, both in materials and tools. Once they enter the physical world, the letters resist degradation from the elements or vandalism very well. This collection is an invaluable asset for architectural projects, environmental design, street furniture, interior design, public art, signage, etc.</p>
    <p><strong>launch of arktype.nl</strong><br>
    The arktype.nl collection will be launched on October 18, 2012 at the <a href="http://www.bijzonderecollecties.uva.nl/en" rel="nofollow">Special Collections - University of Amsterdam</a>, with presentations and lectures from René/Janno and Yves Peters (writer on this project), a small exhibition of type examples, and the release of the 176 page arktype.nl specimen book.</p>
    <p>Date: Thursday, October 18, 2012, 17:00<br>
    Address: Bijzonder Collecties - Universiteit van Amsterdam<br>
    Oude turfmarkt 129, 1012 GC Amsterdam, The Netherlands, <a href="mailto:info-bc@uva.nl">info-bc@uva.nl</a> </p>
    <p><strong>about René Knip</strong><br>
    René Knip (Hoorn, 1963) initially wanted to become a painter. His fascination for lettering, calligraphy and typography however led him to study graphic design at the Academy of Visual Arts St.Joost, Breda. Upon graduating with distinction in 1990, Knip worked for three years as the assistant designer to Anthon Beeke. In 1992 he started his own studio Atelier René Knip, which concentrates on design in the netherworld between flat and three-dimensional works. He calls it the ‘2-1/2 dimension’, a largely unexplored field. Knip also dedicates himself to product design with a strong graphic feel. René Knip teaches and lectures all around the world. He has been a member of the Alliance Graphique Internationale since 2005. After living and working in Amsterdam for twenty years, Knip moved to an old farmhouse in Fryslân in 2005. He is married to filmmaker Jorien van Nes and father of Yuna and Finn.</p>
    <p><a href="http://www.atelierreneknip.nl/" rel="nofollow">www.atelierreneknip.nl</a></p>
    <p><strong>about Janno Hahn</strong><br>
    Janno Hahn (Enkhuizen, 1980) likes to call himself a semi-autodidact, even though he studied at the Graphic Lyceum in Amsterdam, the Royal Academy of Fine Arts in The Hague and the Plantin Institute of Typography in Antwerp. His ambitions in type design made him quit each time after two years, deciding he had seen enough. In between studying he accumulated practical experience by working for a small cultural design studio in Amsterdam and later one of the oldest and biggest graphic identity studios in The Hague. His combined experience in these two companies with totally different views was put to good use when he started working with Atelier René Knip in early 2006. Being confronted with the spatial aspect of graphic design both opened his eyes and threw him back into his childhood. As René and Janno perfectly complemented each other in their design work they decided to create a type collection (arktype.nl) together. Janno also operates under his own name in Amsterdam, working on several type and art projects.</p>
    <p><a href="http://www.jannohahn.nl/" rel="nofollow">www.jannohahn.nl</a></p>
    <p><strong>contact</strong><br>
    For additional information, a copy of the arktype.nl specimen, type samples and images, and interview/lecture requests please contact:</p>
    <p>arktype.nl<br>
    Riegeweg 9Yo<br>
    8749 TD Pingjum<br>
    +31 517 579 805<br>
    <a href="mailto:info@arktype.nl">info@arktype.nl</a><br>
    <a href="http://arktype.nl/" rel="nofollow">arktype.nl</a></p>
