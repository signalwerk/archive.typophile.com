    html: |-
      <p>Thanks, Craig</p>
      <p>I love Ambicase by the way!</p>
      <p>Yeah the tight spacing is to get the ligatures to hold together.  I can increase the trracking a bit and they still look like part of it but too much and I have to break the ligatures apart.  I only see it as any use for headlines, and maybe sub-headlines without the ligautures and increased tracking.  I never envisioned it being any good for text of any length, that's the main reason I didn't bother with a lower case.</p>
