    <p>Schizotype is proud to announce the release of the foundry's first fonts to be created over two continents.  Started in the UK, finished in Japan.<br>
    Quickscript is a casual retro script. </p><div class="imageWrap"><img src="http://typophile.com/files/Quicktypophile_6328.jpg"></div><p></p>
    <p>Sizemore is a fashion headliner with Avant Garde inspired ligatures and alternates.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Sizemoretypophile_4384.jpg"></div><p></p>
