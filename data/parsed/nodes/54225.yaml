    <p>This blog is about art work from three design movements. The three design movements that I am going to write about are Pictorial Modernism, The Modern Art Movement in America, and the New York School.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/p180466s_5914.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/04363008_4534.jpg"></div><br>
    The first piece was designed by Otto Baumberger, and the second by Herbert Leupin.What I like most about these pieces is their realistic aspect. I can see the texture.The first time I saw it I had to double check to see if it was a picture or not. These come Pictorial Modernism and more specifically the style of Sach plakat. This design style is characterized by its simple, laconic, and realistic approach.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/01593001_6484.jpg"></div><br>
    This piece was designed by Herbert Bayer. It is a poster that encourages egg production. The thing I like most about this piece is the flat muted colors. What first caught my eye was the matter in this composition, and egg in front of a factory ablaze. I like the symmetry, I'm not really a person who goes for asymmetry for composition but I am working on it.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gottschall_284_5744.jpg"></div><br>
    This is and advertisemet for Woman's Day by Gene Federico. My favorite thing about this piece is the use of the bicycle tires as text. I like the simplicity of the composition. The image is simple, but the way that it is used makes it more appealing.<p></p>
