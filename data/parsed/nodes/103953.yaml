    html: |-
      <p>As far as i recall Goudy Old Style is already taken by some big British warehouse (or defintely was, though i do not exactly remember which one it was), therefore i would not recommend using this typeface. There are lots of other Antique styled typefaces with soft rounded serifs. Look at all the different Garamonds, for example.<br>
      Between old &amp; new maybe something in the direction of a <a href="http://typematters.de/tmt_MS.html" rel="nofollow">typeface without serifs</a> would do the job also pretty well. The roundness can be found in its italic.</p>
