      <p>Some applications use old system text layout APIs that does not support OpenType, so only AAT fonts (e.g. Apple supplied fonts) will work, I know that OpenOfice (and LibreOffice) are so, may be Pages as well.</p>
      <p>No idea about GIMP problem, but it seems to be a text input issue rather than text layout, but if everything else is fine OpenType should work in GIMP as well since GTK (its the UI toolkit) has its own text layout engine.</p>
      <p>If you are building your own fonts, you may want to make them hybrid OpenType/AAT fonts, but I don't think FontLab can create AAT fonts, you'll have to use separate tools from Apple.</p>
