    <p>Hello friends. After a hiatus of about a year (cataracts operations restored vision, and  the Japan earthquake survived!) I am back here on these Typophile Arabic Forums that I had the pleasure to help initiate with colleagues. </p>
    <p>I am a bit puzzled about the behavior of some Arabic fonts on the Mac and how to generate Arabic fonts that work properly on OS X 10.6 (Snow Leopard) and using the Arabic (QWERTY) input method. Here are some questions:</p>
    <p>1- On some applications like TextEdit and Photoshop my fonts display properly, but on others such as Pages or OpenOffice the complex script is outputted with the letters disconnected.  This is not a problem with the applications themselves because Arabic fonts supplied by Apple like Al Bayan and Baghdad display properly there. I looked at Al Bayan and it has no classes whatsoever yet it works perfectly. This is puzzling!</p>
    <p>2- On some applications like GIMP the keyboard does not even type Arabic at all.</p>
    <p>3- Is there a Fontlab setting or workaround that allows generation of OT Arabic fonts that work on the Mac?</p>
    <p>Many thanks for your experience with these issues and how to resolve them.</p>
