    html: |-
      <p>* The <a class="freelinking external" href="http://freetype.sourceforge.net/FTL.TXT" rel="nofollow">FreeType license</a> was designed as a license for the <a class="freelinking external" href="http://www.freetype.org/" rel="nofollow">FreeType</a> rendering engine (a software library) not as a license for fonts.</p>
      <p>* Recently <a class="freelinking external" href="http://perens.com/about/introduction/" rel="nofollow">Bruce Perens</a> in his blog article <a class="freelinking external" href="http://perens.com/blog/2009/02/17/64/" rel="nofollow">Warning: SIL Open Font License</a> has expressed some concern about SIL's <a class="freelinking external" href="http://scripts.sil.org/OFL" rel="nofollow">Open Font License</a> claiming: <em>"There appears to be an unintended loophole that would allow the conversion of any font under the license to public domain."</em> </p>
      <p>* There is a "<a class="freelinking external" href="http://www.gnu.org/licenses/gpl-faq.html#FontException" rel="nofollow">Font Exception</a>" which can be tagged onto the end of the <a class="freelinking external" href="http://www.gnu.org/copyleft/gpl.html" rel="nofollow">GPL</a> to make it suitable for fonts ~ however the author of that subsequently wrote an article on <a class="freelinking external" href="http://www.fsf.org/blogs/licensing/20050425novalis" rel="nofollow">Font Licensing and the GPL</a> in which he expressed some reservations. </p>
      <p>- Chris</p>
