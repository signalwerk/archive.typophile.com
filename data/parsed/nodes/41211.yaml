  html: |-
    <p>I want to publish a typeface I'm working on (which I hope will form part of a small family) and need to include a license. I've been trying to find an appropriate free license, along the lines of the GPL/copyleft which might cover any nasties/abuses happening later.</p>
    <p>I'm aware that there are issues with GPL licenses in fonts. (See here: <a href="http://www.typophile.com/node/31738" title="http://www.typophile.com/node/31738">http://www.typophile.com/node/31738</a>) So it needn't be a GPL license. I just can't find an appropriate, simple license text specific to font distribution.</p>
    <p>Essentially it needs to cover my free distribution, future free distribution (license intact) and my copyright.</p>
    <p>Anyone with a similar license they use?</p>
