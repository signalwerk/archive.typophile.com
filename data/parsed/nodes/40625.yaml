    html: <p>On the other hand, the lowercase allows the almost-palindromic character of the name to come through more easily, since e and o are more similar than E and O (even if you try to square up the O as in the old mark). Since "xerox" has come to copying (esp. by machines that go back and forth as they scan), that's a happy feature of their name that they do well to capitalize upon.</p>
