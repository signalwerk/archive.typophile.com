  html: |-
    <p>This is how I do it:<br>
    I have a personal selection of typefaces of my liking that I keep in a folder (my "best").<br>
    I have imported this folder in a set in Font Explorer.<br>
    I have created an illustrator file containing a line for every different typeface, one after the other. I can use the function "find&amp;replace" to change all the dummy text to my desired logo word.</p>
    <p>How do you do that? Do you use something online like myfonts? Maybe you use your font manager and then you just activate the ones that might work?</p>
    <p>The trick is to create a system that is fast, does note engulf the computer, and is portable (think about a freelancer who is often offsite, working in an agency).</p>
    <p>Thanks,<br>
    P</p>
