      <p>Hi Gene.<br>
      It looks simple and elegant to me. Interesting how you've kept all crossbars at the same hight. Number '9' and letters 'P' and 'R' stand out a bit because of this. I prefer the rounded 'W' and the sharp 'V' (as obviously you do too). Any ideas for lower case?<br>
      Good luck!<br>
      /Mårten</p>
  - id: 104304
    user: 8393
    date: 2006-01-16T01:26:00
    date_raw: 16 Jan 2006 — 1:26am
    votes: null
    html: <p>I think the light version is not that good, but it works. The bold one is very nice. The B is too angular compared to the other letters.</p>
  - id: 104565
    user: 10530
    date: 2006-01-17T16:15:00
    date_raw: 17 Jan 2006 — 4:15pm
    votes: null
    html: |-
      <p>Thanks for the feedback. I did take a whack at a lower case. They are sketches. A good deal of tuning is needed but I think the basic ideas are there. Also, the punctuation may need to be adjusted to better work with the lower case. </p>
      <p>Seems the bolder version is more desireable. I think that i will adjust the lighter version so that it has a greater amount of contrast - being that the original concept sprung from a need for a set of characters that were very light in weight, condensed and had a space/future/NASA kind of feel.</p>
      <p>thanks again for the comments. keep em coming. No holds barred - I want to learn.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/morecondLC.jpg"></div><p></p>
