    html: |-
      <p>The angle and blurriness don’t help, but <a class="freelinking-external" href="http://new.myfonts.com/fonts/berthold/akzidenz-grotesk-be/">A.G. Condensed</a> looks close. I suspect some other Grotesque/Gothic choices would too (those aren’t the best letters for ID purposes). For example <a class="freelinking-external" href="http://new.myfonts.com/fonts/adobe/trade-gothic/">Trade Gothic Bold Condensed</a> also seems close.</p>
      <p>- Mike Yanega</p>
