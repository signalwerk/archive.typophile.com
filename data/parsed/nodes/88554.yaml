    html: |-
      <p>Grzegorz, that's actually what I'm trying to resolve:<br>
      <a href="http://typophile.com/node/88503#comment-488380" title="http://typophile.com/node/88503#comment-488380">http://typophile.com/node/88503#comment-488380</a></p>
      <p>However I do think your conclusion is simplistic. To<br>
      me the point of a block of text isn't to look nice, it's to<br>
      be read. So I have to wonder what's worse: a paragraph<br>
      that's hard to read on most devices (because the lines<br>
      are way too long) or one that looks funny on some? Sure<br>
      funny lines aren't great, but missing the line return<br>
      every single time (or in practice, having to do the line<br>
      return very slowly in order to avoid missing the landing)<br>
      is worse. Most long posts (i.e. posts that contain long<br>
      paragraphs) on Typophile are quite daunting to read<br>
      because they look like that slab from Space Odyssey.</p>
      <p>Hence the question I pose here. So if enough people view<br>
      Typophile on small screens what I should ideally do is go<br>
      even narrower on my measure. More work for me (because<br>
      it gets harder to have a non-distracting rag), but hey, that's<br>
      what Design is about.</p>
      <p>hhp</p>
