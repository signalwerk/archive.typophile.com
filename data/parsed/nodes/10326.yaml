    html: <p>I like it, in general, but I have two concerns.  <br> <br>1) I think the blue marble needs something. The roughness that Dav envisions might be better accomplished by putting in the continents on the planet. They can be pale and not stand out too much. <br> <br>2) More of a problem. Why is a distressed, cutout letter template indicative of "healthy" or "money"? The more I look at it, the less I think it fits.</p>
