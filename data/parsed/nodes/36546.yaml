      <p>Some great suggestions from Stephen in this thread.<br>
      Popular or FF Zine look like great options for you, Peter.</p>
      <p>Regarding Soho, which I designed, it has been pretty well received<br>
      thankfully and people might want to check out the bigger pdf at<br>
      <a href="http://www.monotype.co.uk/soho/" title="http://www.monotype.co.uk/soho/">http://www.monotype.co.uk/soho/</a> to make their own minds up.</p>
      <p>It's a comprehensive pdf showing lots of text settings and<br>
      stylistic alternatives for InDesign, if a particular letter<br>
      or weight is not for you.</p>
      <p>If some people just don't like the overall feel (refined industrial/<br>
      mechanical) or whatever else, then there's not much I can do about<br>
      that and fair enough. I love that aesthetic myself.</p>
