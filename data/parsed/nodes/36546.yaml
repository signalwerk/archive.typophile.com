    <p>I know it's a crappy picture but can anyone give me the name of the slab serif and/or alternatives. It's has to be different from the vere used – but great – Glypha, Serifa, Rockwell etc. </p>
    <p>See it at: <a href="http://imgs.zinio.com/magimages/115942081/2007/221437591_toc1.jpg" title="http://imgs.zinio.com/magimages/115942081/2007/221437591_toc1.jpg">http://imgs.zinio.com/magimages/115942081/2007/221437591_toc1.jpg</a></p>
    <p>I like Enclave (<a href="http://www.terminaldesign.com/fonts/sets/?CID=6" title="http://www.terminaldesign.com/fonts/sets/?CID=6">http://www.terminaldesign.com/fonts/sets/?CID=6</a>) but I'm really not so mad about the new Soho that everyone seems to be raving about.  (<a href="http://www.fonts.com/FindFonts/RecentReleases/2007/Soho.htm" title="http://www.fonts.com/FindFonts/RecentReleases/2007/Soho.htm">http://www.fonts.com/FindFonts/RecentReleases/2007/Soho.htm</a>)</p>
    <p>Thanks</p>
