      <p>A font that is the victim of this serif clipping treatment is sometimes called demi-serif. It was a fad a few years ago -- some stores even redid their logos -- but the attraction of the procedure seems to have waned. For fonts that look like this try searches for demi-serif and semi-serif. Might even find one that matches.<br>
      Don</p>
