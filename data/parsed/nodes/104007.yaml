      <p>Doesn't look like a font to me, more a custom job (and a bad one). It may have started with a contrasted flare serif, removing some serifs and rebuilding some letters (/G?)<br>
      Same vein, better design to me: <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/goldenbook" rel="nofollow">Goldenbook</a>,  <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/felix-titling" rel="nofollow">Felix Ttiling</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/castletype/shango" rel="nofollow">Shango</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/danmark" rel="nofollow">Danmark</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/garagefonts/clarice" rel="nofollow">Clarice</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/seta-reta-nf" rel="nofollow">Seta Reta</a></p>
