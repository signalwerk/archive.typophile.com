  html: |-
    <p>Hello all,</p>
    <p>As a software developer I use fonts primarily as "graphical embellishments" to my interface. The fonts are not embedded as "fonts", they are integrated into the visual aspect of my designs.</p>
    <p>I have fonts that are commercial use fonts, providing the standard "...for Personal or Internal Use..." statement, however it leaves out the real "clarity". As I am using these fonts "in house" on my own computer when developing my software I assume my usage is covered under the standard "Commercial" EULA, but if anyone can shed some light and help to clarify the murky waters I'd appreciate it.</p>
    <p>Tim</p>
