    <p>Hi there,</p>
    <p>Wondering if anyone can identify any of the four fonts on display here, please? They’re all from the Nuttelex factory in Melbourne, Australia. Nuttelex was first manufactured in 1932, but I don’t know when the signage went up. </p>
    <p>Incidently, I posted the bottom one a while ago, but no one was able to name it. Thought as I was posting some new ones, I may as well try it again...</p>
    <p>Cheers,<br>
    /stephen</p>
