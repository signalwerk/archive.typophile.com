      <p>I did quite a search for the NUTTELEX typeface, and I couldn’t find anything that had that stepped X. The bracketed vertical serifs on the E and T suggest a Clarendon, and my suggestion would be to use a medium weight Clarendon, with a modified E (remove the middle serif) and X (to step the legs).</p>
      <p>For the script ’Solidified’, this looks like a hand-drawn sign painter script that was made into an illuminated sign. A similar example is ’Blaze’ from Art &amp; Sign (signfonts.com) shown with other sign scripts <a href="http://bowfinprintworks.com/Script07Pg8.html">here</a>. The style of ’f’ is common in sign painting scripts for some reason, and that’s what made me look at these.</p>
      <p>- Mike Yanega</p>
