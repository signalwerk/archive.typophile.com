    <p>here's a new logo i'm working on for a new trading card game company. i'm trying to tie the look of the logo into the comic book world, as the two industries are closely connected.</p>
    <p>i'm not very experienced with outline type designs, or drawing letters by hand for that matter, so any input would be most welcome.</p>
    <p>the company name is crown hero games, or, crown hero for short.</p>
