      <p>I agree with hrant, it's fun and young! I especially like that the letterforms flay out to the sides to imply the word 'hero' is coming out toward the reader in perspective. Young, kind of punky and in-your-face...appropriate for the video game market.</p>
      <p>But the 'r' is not legible: it's too easy to see an 'n' or an 'm' that's closed on the lower right....hrant's idea of UC form there may be the ticket, but perhaps then it will be difficult to center the 'e/r' on the crown once the 'o' must connect to the 'r' from the bottom....?</p>
      <p>The thing I think is least successful is the tagline type. First, try the tagline "It's your turn" without the period. Then, look at it without the "It's" altogether: just "Your turn" with and without the period.....Also, try to differentiate the company name from the tagline more: the company name should perhaps be in tracked out upper case against the more conversational and informal lower case above....</p>
      <p>And Frutiger (oops, I guess it's actually Myriad) is just so sort of corporate &amp; wayfinding "friendly blah" to me for this kind of mark. Try something with more edgy personality (perhaps digital-ish?) and maybe not a sans (the mark's forms are sans)...</p>
      <p>Fun work for not being "experienced with outline type designs"!</p>
