      <p>thanks for your feedback on a sunday afternoon!</p>
      <p>i have tried versions with an UC r, and as you might predict, it makes the interior spaces in the logo look too busy, and worse, ruins the symmetry of the logo. i have succeeded in getting the UC r to join the o at the bottom, but it just aint workin for me.</p>
      <p>i like your suggestions, dish, for the tag. i love playing with tags. they're so cool. however, i'm still stumped on what face to use. i tend to think that for a logo like this, that is, a typographic one, that whatever face i use for the tag ought to be as plain as possible, so there is no conflict for graphical attention. i've thrown in some trajan here, simply because it's 'kingly' in its appearance, but i'm not sold on it by any means, as it really departs from the comic/pow look i'm trying to hit.</p>
      <p>now, as for the r... i'm not sure i like this solution, or even if this is a solution. i do think that it brings out the r more, without destroying the o. still, the o looks more like a d than it did before.</p>
      <p>so here's where things get interesting: per the first version, i was banking on the 'recognizability' of the word hero to slip the reader over the problematic r. is this a horrible nono for logo design? i know that the concept is used all the time, as graphics sometimes replace critical letters altogether in other logo designs.</p>
      <p>i guess the point to focus on, is if something looks amateurish or not. if it looks like a mistake, or a weak point in the design, it is not the same thing as a well-executed graphic treatment of text, no?</p>
