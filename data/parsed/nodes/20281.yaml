      <p>Tyler,</p>
      <p>I think I may have noodled out some interesting solutions for you while munching on dinner.......</p>
      <p>First, yes it's a problem to assume recognizability in a word instead of paying close attention to the actual letterforms as they exist on the page. Our minds play all sorts of tricks on us, and often what we assume may be the only reading of something turns out to be open to many readings....</p>
      <p>This word in particular has few alternate readings though.....perhaps if someone was a big mythology buff, they may see Zeus' wife Hera, but probably not. Still, you can make the word more legible as is by:</p>
      <p>ROUNDING THE COUNTER of the "O".</p>
      <p>Instead of focusing on fixing the "r", an easy solution to the legibility issue is simply to ignore the alignment with the crown's angle you were trying to repeat from the "H". Once it's round, three things can happen:</p>
      <p>1. The letter is instantly "O"-ish because you read the counter before the form since it stretches up to the right so far.<br>
      2. An interesting help occurs for the "r".....the counterform "o" also becomes a ball terminal for another "r" in the counterform!! Double the benefit...<br>
      3. The connection to the crown's angle can still be maintained by keeping the intersection of that angled line and the counterform as the "spring point" for the round counter.</p>
      <p>Now, on to the problem of tagline type:<br>
      I did several versions to show what I had in mind. Most are sans solutions and the last two are serifs.</p>
      <p>1. Close Call PM: techy video-game feel.<br>
      2. DIN: still techy, but more tailored and machined.<br>
      3. Briem Akademi: very video game score display-ish.<br>
      4. Charlemagne + Chapparal: You said you wanted the "kingy" aspects of Trajan.....Charlemagne is a little spikier and plays on the crown idea....but for those spikes to still read in the smaller company name, I used Chapparal.<br>
      5. Scala + Scala Sans: Still the spiky, thorny, crown reference, but more modern and engineered....and interesting "W" in the company name sans version.</p>
      <p>Gotta get back to "real" work,<br>
      Cheers and Happy Holidays!<br>
      DiSH<br>
