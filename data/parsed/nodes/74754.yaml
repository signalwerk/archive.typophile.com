      <p>It's been a while, but I thought I really ought to get Saltaire finished this year. Spurred on by a tweet from Stephen Coles, I have been back working on it again for the past few weeks; concentrating on swashes for the most part. Trying to decide which characters should be swashed and which left alone is proving very time consuming. Some just don't look right and kind of ruin the overall flow, while others are just obviously swashable. It also occurred to me that some are obvious candidates for swash ligatures. So here is a taster of recent progression.</p>
