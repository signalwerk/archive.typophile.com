    date: 2010-10-05T05:43:00
    date_raw: 5 October 2010 - 5:43am
    votes: 0
    html: |-
      <p>I'm trying to create a Didone with distinct character that will be taken seriously. I want a look that is formal, but just veering towards contemporary informality. I don't want to go too far down the road that leads to fonts like Nueva and Jimbo, however much I might admire them. I wouldn't want to exaggerate any inconsistencies which may introduce a note of 'cartooniness'.</p>
      <p>IMO it looks distinctive enough without any more quirks, besides if it's unsettling it's interesting.</p>
