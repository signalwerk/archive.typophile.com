    html: <p>Nick, you may well be able to make asymmetry work. What may be unsettling to me is that it is *almost* symmetrical. I know Matthew Carter, in his critiques at TypeCon, often makes the point that if something is going to be a feature, it needs to look like a definite decision. I do think you can have subliminal stuff that works, but I'm wondering whether if you go further one way or the other it will strengthen it. In any case, it looks good already.</p>
