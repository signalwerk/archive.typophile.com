    html: |-
      <p>This is going to be lovely. A few things I wonder. Is there too much space in the top "v" of the "k"? Looking again, I think the asymmetry of the tapers on the caps generally works well. But the H still seems off to me. Is it too narrow? Maybe it should be more straight internally, and/or widened. I feel like the I needs to pull up his pants a bit--the waist is maybe too low. The 5, should the top going into the thin vertical be more like the 7?</p>
      <p>On the weight of the stems, maybe the issue on the caps is the relationship between the vertical and diagonal strokes. I don't know of the diagonals should be a little lighter or the stems heavier. With heavier stems you'd probably have to adjust vertical arches...</p>
    html_clean: |-
