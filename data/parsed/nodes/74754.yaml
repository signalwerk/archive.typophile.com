    html: |-
      <p>I think both z's could be improved on. The weight of the top one harmonizes better with the rest of the face, but I think it dips too far below the baseline, and is a bit distracting. Could you get the weight on both top and bottom, less descent, with no ball terminal? Or you could make it more of a showy swash character by having both ball terminals. Or alternatives, depending on the use?  </p>
      <p>Unlike Lex, I'm not a fan of the t. To me the left side curve is too extreme, and out of harmony with the face. In old style faces the rule is that the longer vertical strokes are more upright, and that has some visual logic to it. Here your vertical angle is rather more uniform, like a Didone. That makes the t look out of place. It can lean forward a hair, as the t often does, but here I think it goes too far, and is distracting. </p>
      <p>On my screen your example is really pretty big, and the thins still look a little weak. It would be great for what some call a 'poster' size, but for regular display I don't know. Maybe just having the thick to thin be a little less extreme. You to want the roman and italic to play together, right? Have you mixed them together? If they work, then ok.</p>
