      <p>I second what Bill said about the /H/ and the /5/.<br>
      The thin arms of /X/ may be a little too floppy in their curves.<br>
      I'd consider getting a little more white into the counterish interior of the hooks of /J/ and /j/.<br>
      In addition to considering widening of /H/, /B/, too, could use a touch more width to its counters, IMO.<br>
      Does the shape of the serif of /c/ threaten to be read as an /e/?<br>
      I love the upright of /G/, and the tails of /y/ and /Q/. The energy of the lowercase is just delightful.<br>
