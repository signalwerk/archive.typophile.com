      <p>This is a very nice idea. </p>
      <p>My feeling is that the long concave sides (caps, ascenders) need some more work to fully realize this design. The right and left curves seem a little different, with the extreme generally being lower on the left, and maybe pulled in a little bit too much. The column of the I seems a little top heavy to me. I'm not saying it can't succeed weighted more toward the top--I don't know--but it feels a little too much now. The difference between the left and right of the "l" also doesn't feel totally right.</p>
