      <p>Really impressive typeface and wonderful to see how it developed. I've never done a typeface like this but working with these extremes often make it more obvious where you will compensate for what, like the consideration you made with the angles of 5 and 7.</p>
      <p>I think the legs of K and k are indeed a tad too light. Perhaps the top should be a bit heavier to make the shape more constant so it flows better with most letters. The bottom seems thick enough.</p>
      <p>The G bothers me a bit as I feel the spur should be sharper to be more consistent with the other capital letters but I'm not even sure if that's a valid consideration as it may work optimally in combination with lowercase letters as it is.</p>
