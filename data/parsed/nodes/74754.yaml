    <p><img src="/sites/default/files/old-images/Camb_5882.gif"></p>
    <p>I'm working on this new Didone style. It's characterful with high contrast and ink-traps as a feature, tapered stems and a 'bumpy' appearance. I'm not sure about the cap G, but I quite like its quirkiness. </p>
    <p>Any comments welcome.</p>
