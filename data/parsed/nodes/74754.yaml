    html: |-
      <p>Not sure if going above the cap height so far works. I think that traditionally there is more restraint in this direction, maybe because of accents, or bumping into the line above. I don't remember exactly why, but I do remember trying to go more above the cap height in my Caslon swashes, and then seeing it didn't work. Check out some swashes on classic typefaces and see what you think about the handling of the cap height, if you haven't done that already. </p>
      <p>I think the R is very good. I would try bringing down the height of the others, and see if you still get the exuberance, but more harmony with the rest. The V to me is better than the arm of the K, but even it I would try bringing a little lower. As I've said, overall I love this design!</p>
    html_clean: |-
