    html: |-
      <p>The preference for descending cap swashes over ascending ones probably comes from the fact that in metal the latter -which unlike the former would be floating kerns- were much more likely to break off. But that stopped happening in digital. :-)  Although I guess even in digital there's more room to play below the baseline than above the capline.</p>
      <p>hhp</p>
    html_clean: |-
      <p>The preference for descending cap swashes over ascending ones probably comes from the fact that in metal the latter -which unlike the former would be floating kerns- were much more likely to break off. But that stopped happening in digital. :-)  Although I guess even in digital there's more room to play below the baseline than above the capline.</p>
      <p>hhp</p>
