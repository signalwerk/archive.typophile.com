    <p>///////////////////////////////////////////////////////////////////////////<br>
    SUDTIPOS. 09. NEW RELEASES. <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000387" rel="nofollow">Kewl Script</a> &amp; <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000368" rel="nofollow">SugarPie </a><br>
    ///////////////////////////////////////////////////////////////////////////</p>
    <p>We are proud to announce the release of two new fonts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/kewlsugar_6148.jpg"></div><p></p>
    <p><strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000387" rel="nofollow">Kewl Script</a></strong> is the result of being caught in the afterimage of one design project while conceptualizing another one. Just before finishing the final tests on Mrs Blackfort, the first of what became a long series of Charles Bluemlein fonts, some of the letters began morphing differently in my mind. The idea was to go on the heavier and more playful side, but with a South American sign letterer’s twist, rather than just good handwriting. I did some sketching, took some notes, then got busy with other projects. Some of that stuff eventually seeped into Candy Script and, to a lesser extent, the Whomp font. But it was only a matter of time before I got back to the original concept and finished it. Kewl Script is ideal for food packaging, book and music covers, magazines, and window splashes.</p>
    <p><strong><a href="http://www.veer.com/download/pdf/kewlscript.pdf" rel="nofollow">A Kewl Story</a></strong> was produced with wonderful illustrations specially done by the argentinian artist Catnez. Grab it!</p>
    <p>///////////////////////////////////////////////////////////////////////////</p>
    <p><strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000368" rel="nofollow">SugarPie</a></strong> I called it Sugar Pie because it has a sweet taste, quite similar to Candy Script, mostly because of its round-to-sharp terminal concept. This in turn echoes the concept of the clean brush scripts found in the different film type processes of late 1960s and early 1970s.<br>
    While Candy Script’s main visual appeal counts on the loops, swashes, and stroke extensions working within a concept of casual form variation, Sugar Pie is artistically a straight forward packaging typeface. Its many ligatures and alternates are just as visually effective as Candy Script’s, but in a subtler and less pronounced fashion. The alternates and ligatures features of Sugar Pie contain quite a few nice variations on the main character set. Use them to achieve the right degree of softness you desire for your design.</p>
    <p>The SugarPie <strong><a href="http://www.veer.com/download/pdf/sugarpie.pdf" rel="nofollow">PDF specimen</a></strong> illustrates some possible uses of the font.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/specimens_3910.jpg"></div><p></p>
