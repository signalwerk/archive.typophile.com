    html: |-
      <p>I normally try a tab after a circular bullet which is set to half leading (so a 10 on 12pt bullet would be indented 6pts), if the first letter in each bullet is lowercase it is worth applying some baseline shift to centre it on the x-height, some typefaces can look good with a square bullet, in the 10/12 setting a 3.5pt square (n in Zapf Dingbats) with baseline shift up, an en-dash can work too but with a wider tab (12pt following the 10/12). I avoid the more ornate bullets, they seem to add more emphasis than necessary.</p>
      <p>Tim</p>
