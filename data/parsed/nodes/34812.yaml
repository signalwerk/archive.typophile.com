    html: |-
      <p>Well, the amount of bullet points you have will be a determining factor. If you only have a few (say less than 5 or so), I'd recommend a more ornate bullet point icon; such as a custom mark, something indigenous to your select typeface, or even transplanted from a seperate typeface (Gill Sans's doesn't have any ornate bullet points that I'm aware of). </p>
      <p>If it's a good bit more than 5 or so, you might want to stay with something less robust and more common, like the standard bullet point or dash.</p>
      <p>I've always set my bullet points a pt size smaller than the text size set with a .1378in tab, but that's me. You can set it anyway you like, I don't believe there's a standard form, set in stone when it comes to setting bullet points.</p>
