      <p>11, that's not a huge list. Another thing to consider is how compressed your list is. Does it make up the majority of the text on the page? Is your page size large and would accommodate for more space between bullet points (leading vertically)? </p>
      <p>Can you post your current work for us to see what you're working with?</p>
