  html: |-
    <p>Currently designing one in a series of brochures for a client.<br>
    I have come across (as happens many times) content that needs to be listed and bullet pointed/accentuated in some way.<br>
    What is the most elegant way of structuring this list? Should I use<br>
    • bullet points at constant type size<br>
    • bullet points slightly larger than type size<br>
    - dashes<br>
    - m dashes<br>
    * some bespoke icon<br>
    + etc / other??</p>
    <p>Any advice welcome...<br>
    I guess all I want is something that will look elegant...and if there is any concensus on this.<br>
    FYI Type used in this exercise is Gill Sans</p>
    <p>Any help much appreciated<br>
    cheers<br>
    Javier</p>
