    html: |-
      <p>I suppose the final product is long out the door, but I had a few observations:</p>
      <p>The new masthead is going to be considerably taller than the old one, changing the balance of the entire cover. Assuming that was approved as acceptable before design started.</p>
      <p>Maintaining the same stem width between the two lines of text creates an awkward juxtaposition. The top line looks elegant and airy while the bottom one ends up looking almost thuggishly short. It creates a visual incongruity beyond that which is difficult to put a finger on. A certain dissonance.</p>
      <p>The double "s" in connoisseur has a visual density that attracts attention to itself. I feel like they should be a bit wider to open them up.</p>
      <p>The unique treatments of the upper line "n" and the "r"s looks a little weird because they call attention to themselves. Everything else looks classical and so they end up looking like gratuitous flourishes.</p>
      <p>Don't like the differing treatment of the "n"s. It's discordant.</p>
