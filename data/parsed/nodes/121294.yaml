      <p>A Google search for the existing magazine indicates that the mast never covers the artwork or other graphics, and I'm assuming that will be the case going forward as well. </p>
      <p>Even so, does the magazine depend on newsstand sales, or is it solely based on subscriptions? What I'm getting at is that from a distance, those ultra-thin strokes tend to disappear, which compromises both aesthetics and readability.</p>
      <p>If the design of the cover ever does change to accommodate full-bleed imagery, those thin strokes will really cause problems — from most any distance.</p>
