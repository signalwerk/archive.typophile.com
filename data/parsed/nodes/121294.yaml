      <p>What a difference a fresh pair of eyes makes: Thanks for all the input. Most of what was listed I found to be spot on and even the suggested tweaks that I don't quite agree with helped me spot areas were further refinement can occur.</p>
      <p>In particular, the comments on the top serif of the "A" being a little tame and short made me laugh as I was caught red handed. That was a last second adjustment I made when I realized that the original apex I was planing on creating could of been noticed by a non typophile and I could of very well received a directive of "Don't use any font with a weird "A" for the masthead." Of course, this is 100% made from scratch but that is an incomprehensibly alien notion to the powers that be. Covertly inserting quality, is the only strategy that stands a chance.</p>
      <p>Thanks once more and keep it coming if there is more that can be added.</p>
