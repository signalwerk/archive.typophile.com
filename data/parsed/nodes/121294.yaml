    <p>Was up all night creating this so I can't see straight right now. To cut on time I went straight into the computer to start building the letters without having skated out what I was going to do first and now I am second guessing myself. Maybe it's just the lack of sleep that is keeping me from liking this but I can't figure out at this moment what it is that bothers me about it.</p>
    <p>Not going to get into the politics of why it has to be done in this rushed manner if it is going to get done at all. I will only disclose that I am trying to covertly insert as much quality as I can into the redesign of the magazine despite begin straightjacketed in what I am permitted to do. </p>
    <p>The letters are still in separate pieces so the serifs joining the ligatures are off as there not done yet. Concerned about the width of the serifs on the "F" and "E". Not sure on the tail of both "R's". Also contemplating making the "A" a bit wider.</p>
    <p>Please don't pull any punches in the critique and be very specific.</p>
    <p>Thanks in advance.</p>
