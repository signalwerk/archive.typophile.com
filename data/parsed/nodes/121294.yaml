      <p>All over, I think it looks very nice.</p>
      <p>A: Have you considered adding a little bit of weight to the crossbar? I would have taken another look at the transition to serif in the left diagonal. Its top serif is a little tame, no?<br>
      S: The spine appears slightly bumpy in the top/right side curve.<br>
      R: Where the leg and bowl of the R meets, there is a dark spot. The bowl is not as “determined” as similar curves in S.<br>
      O: I think I would have tried to make the internal white less pointy in the top and bottom.<br>
      U: Needs some work on the transition from straight to curve on the right side of the left stem.<br>
      F: I would reconsider the width. Narrower, IMO.</p>
      <p>(I suspect I’m not qualified to give a proper critique, but I would love to see if someone else also notices the things I do.)</p>
