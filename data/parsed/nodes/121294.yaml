      <p><img src="/sites/default/files/old-images/WIP_masthead_sample_99_5156.jpg"></p>
      <p>Ok, spent the weekend recutting each letter.</p>
      <p>Thylacine, you are correct that the logo will still be seen on top of white and never over any artwork. The magazine is 9 inches wide so the mast is quite large and newsstand read is therefore not compromised. </p>
      <p>It may interest you to know that in the U.S., even though magazines are sold on newsstands, after a few years in business the paid subscriptions becomes the largest portion of paid circulation. I have worked on magazines from a few different countries so I know that in those other countries newsstands sales tend to outperform paid circulation.</p>
      <p>Please don't pull any punches in the critique and be very specific.</p>
      <p>Thanks once more.</p>
