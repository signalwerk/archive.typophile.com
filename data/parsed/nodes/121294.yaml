      <p>Thanks for the input. I did indeed decide to reconsider the thickness of the smaller R's tail and also made the transition slightly more graceful. Funny that the cut of the R's tails which I consider to be the most, if not the only, original aspect of the mark is what is drawing such attention and opposing opinions. It is funny that I cannot recollect having seen a junction to tail transition cut exactly like this before even though the cuts at the top of an R's tail is an ideal that has been around for a very long time.  Now I am curious if anyone, has in the past, spotted an R who's tail has the same "clawy" cut as the one I devised.</p>
