    html: <p>For the capital R, I would try to expand the right leg slightly towards the baseline. Or rather, make it slightly narrower towards the bowl. I suspect this optical correction is mostly due to the inherent “gravity” of letterforms. I’m not yet entirely satisfied with the transition from straight to curve in your serifs. Have a closer look at the transitions in the diagonals, and also both sides of the stem in R. I would keep the lower right “cut” in N in the smaller size. The same goes for R’s junction&nbsp;– more equal in both sizes. Consider being even more flamboyant in the apex of A. It should relate to R and N.</p>
