      <p>William!<br>
      Ha Ha! I pass these guys almost daily. I don’t insult the A out-loud, although I do repeat it as a mantra in my head. It may need some kerning as-well but I like seeing letters that large. If you read them in the order in which they appear, as street floor signs are read ( stay in lane is written “lane” then “in” and then “stay”) then it read “Oil Heats Best” which is a nice subliminal.</p>
