    html: <p>Ha! I pass this every time I visit my son in New York City. It is on the exit 14 connector from the Jersey Turnpike into the city. Every time I pass it I scream out FIX THE A! They didn’t know to taper the diagonals so the counter of the A is big enough. —Of course I get the indulgent ’Dad the type nut’ looks.</p>
