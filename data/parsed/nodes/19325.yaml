      <p>Thanks guys.  I thought it had to be a custom font, but I’m not schooled enough in signage to know if that’s always the case with giganto lettering like this.  </p>
      <p>It does look similar to Futura and Century Gothic (particularly Futura Extra Bold), but the differences intrigue me.  Particularly the B and the O.  Any other suggestions for similar fonts?  I’m looking to copy the B and O for a font I’m using for a film title. BRUNO is the title and right now we’re using Futura Extra Bold, but it looks a little too “goofy” and is very very overused in the film industry (Wes Anderson and Kubrick particularly LOVE IT).</p>
      <p>Thanks again,<br>
      Sam</p>
