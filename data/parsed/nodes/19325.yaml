    <p>I saw this signage on a bunch of oil tankers on the New Jeresey Turnpike and I’ve been trying to indentify the font ever since.  Word on the street is that this is the place for font identification.  Checking the forum, it very well does appear to be the case!</p>
    <p>For some reason I can’t embed the image (File copy failed: no directory configured, or it could not be accessed) so I’ll link to a photo that I found of the tankers, and I’ll try to embed it with some html.</p>
