    html: <p>Geez ...thanks! Although 'experienced' is hardly a word I'd use to describe myself. Infact if people ask me if I'm a typographer I say 'no, just a designer who really loves type'.  <br> <br>The hardest thing for me creating type in South Africa is that there is absolutely no one there who I know of that has an expansive knowledge of typography and fontographer. So I've pretty much been working in a vacuum. That's why this Typophile forum is definately the best thing I've come across on the net...ever! Props to those concerned...I cling to your every word. <br> <br>Oh, the "FRESH" font is basically 'Retoric', designed by Darren Scott and released by <a href="http://www.t26.com/changeyourface.htm" target="_blank">[T.26]</a>, that i've just given a stencil effect to and tweaked around a bit.</p>
