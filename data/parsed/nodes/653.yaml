    votes: null
    html: <p>I like FB Scala Sans* best, with its complete family of weights, lining and old-style figures, <br>and true italics. <br> <br>AGFA's new recutting of Syntax* looks <br>promising as well, but I haven't had <br>a chance to try it yet. <br> <br>Akzidenz Grotesk*, Avenir, Bureau Gothic, <br>Formata*, Franklin Gothic, Gill Sans, Kabel, <br>ITC Legacy Sans*, News Gothic, Officina Sans*, <br>Trade Gothic, Emigre's Triplex* and even <br>Frutiger, Helvetica, Myriad and Univers <br>make my list on occasion. <br> <br>Also, by all means look into Storm Type Foundry's <br>John Sans*, a sanserif based on Baskerville. <br> <br>Also, the Dutch Type Library offers several that <br>come highly recommended, including DTL Argo*, <br>DTL Caspari*, DTL Documenta Sans*, <br>DTL Haarlemmer Sans* and DTL Nobel. <br>I haven't yet been able to get licenses <br>for any of the DTL faces, but I plan to start <br>investing in them as soon as I can. <br>Their reputation is excellent. <br> <br>I have to admit that I'm intrigued by AGFA's <br>new recutting of Futura* as well, with its <br>full family and the recent addition of <br>old-style numerals. <br> <br>I don't care much for ITC Stone Sans* myself, <br>but a friend of mine swears by it. <br> <br>Most of the fonts can be found (or linked to) <br>at MyFonts.com. <br> <br><a href="http://www.myfonts.com" target="_top">http://www.myfonts.com</a> <br> <br>I'm sure I've left a lot out, but this list <br>offers a good starting point. <br> <br> <br>* Indicates fonts that I know offer old-style figures <br> <br>David</p>
