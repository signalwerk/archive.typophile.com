  html: <p> After reading that Helvetica is primarily considered a display font (in one of the other discussions), I was interested to know what sans serif fonts are considered good for laying out masses of text? <br> <br>Perhaps something that would have complimentary accompanying numerals for laying out the financials of an annual report. <br> <br>What are the qualities one should look for when identifying a suitable sans serif text face? <br> <br>Thanks for a great resource :-) </p>
