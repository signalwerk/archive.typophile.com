    <p>Hi,<br>
    This is my first post on this forum. I am making a blog for a client who happens to be a Product manager at a large social network company. The blog would be more Daring Fireball style with occasional posts in the long form and many links from the interwebs. In both these format the common point would be the highly insightful yet opinionated commentary.<br>
    I have decided to go with Skolar as the primary text for body text. Can you guys suggest a secondary font that you know goes well with Skolar. I tried looking around but could not find great examples with other font combinations.<br>
    The other combination that might work is the FF Meta and FF Meta Serif but I would like to use that as the last resort.</p>
