      <p>If you have readers on Windows machines, be aware that Skolar <a href="http://static.typekit.com/render-waterfall-54059-ie7-windows-xp.png" rel="nofollow">isn't good below 14px</a>. There is a <a href="http://twitter.com/typographica/status/11896522706784256" rel="nofollow">revision in the works</a>. I'd go with Meta/Meta Serif until it’s ready. Or <a href="http://typekit.com/fonts/ff-tisa-web-pro" rel="nofollow">FF Tisa</a>, which has some similarities to Skolar.</p>
      <p>More serif webfonts for text: <a href="http://typedia.com/blog/livelook/cure-for-the-common-webfont-part-2-alternatives-to-georgia/" title="http://typedia.com/blog/livelook/cure-for-the-common-webfont-part-2-alternatives-to-georgia/">http://typedia.com/blog/livelook/cure-for-the-common-webfont-part-2-alte...</a></p>
