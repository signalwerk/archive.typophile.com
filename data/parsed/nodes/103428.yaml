    html: |-
      <p>Most EULAs (these days) forbid any kind of modification. If you do decide to violate a EULA's no-mod clause, make sure the resultant font doesn't leak out (which in a large company is pretty impossible though); and if it does leak out, be prepared to pay for that.</p>
      <p>hhp</p>
