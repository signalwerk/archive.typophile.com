  html: |-
    <p>My company bought font licenses for the office. Let says Helvetica. I want to modify the name to HelveticaSPD to the whole family. I have seen it done, can someone point me to some instructions?</p>
    <p>Thanks in advanced.<br>
    :tony</p>
