    html: <p>Typically a modification like that would be done by the font's author/licensor (and with their knowledge/permission). Even changing something as simple as the name is more complicated without the original source files, since it involves decompiling/recompiling the font. <a class="freelinking external" href="http://sourceforge.net/projects/fonttools/" rel="nofollow">TTX</a> would be one tool to use; it converts fonts to XML, so you could use a text editor to search for and modify the appropriate name entries (there are several), then recompile. (Worth mentioning that many font/software licenses prohibit modification or decompilation, so, you know, be kind, don't get into trouble, etc.)</p>
    html_clean: <p>Typically a modification like that would be done by the font's author/licensor (and with their knowledge/permission). Even changing something as simple as the name is more complicated without the original source files, since it involves decompiling/recompiling the font. <a class="freelinking external link-external" href="http://sourceforge.net/projects/fonttools/" rel="nofollow">TTX</a> would be one tool to use; it converts fonts to XML, so you could use a text editor to search for and modify the appropriate name entries (there are several), then recompile. (Worth mentioning that many font/software licenses prohibit modification or decompilation, so, you know, be kind, don't get into trouble, etc.)</p>
