    html: |-
      <p><em>There’s no such thing as boring type. Only boring designers.</em></p>
      <p>i don't buy it. it's like saying there are no boring movies, no boring songs, no boring novels, no boring architecture... (choose your own metaphor)</p>
      <p>that said, times can be interesting depending on how you use it, but because it is a "default font" in this digital era, it has lost much of its meaning and personality simply because of overuse. i think you'd have to use times (helvetica, gill sans, palatino, &amp;c.) very well to make it look interesting these days. i concede that not everything has to be interesting, but rarely do you want your design to be downright dull, which is the problem of using overused fonts.</p>
