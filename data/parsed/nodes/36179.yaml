    html: |-
      <p>Only a typophile would be likely to ask this question. For most people, who are not obsessed with type, it is just something you read. If you can read it without distraction, or difficulty, then it is 'good type'. 'Like' or 'dislike' rarely enters into the mind -- it is the printed matter that absorbs the attention. I can still recall a time when I never thought about what typeface was used. It was just 'type'.</p>
      <p>However, when you can't read something without noticing the letters themselves and how they look on the page, then over-familiarity may make you frown inside, and say to yourself 'borrring', until you actually stop studying the no longer interesting typeface, and begin to read what it was used to say.</p>
      <p>For me, I like variety, so a too-familiar typeface is uninteresting (maybe a better way to say it than boring). Often a familiar type at a larger size will show me things I didn't appreciate about it before, but as Paul says, at normal sizes it just becomes 'type' and not really a 'typeface'.</p>
      <p>- Mike Yanega</p>
