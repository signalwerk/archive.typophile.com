    html: <p>paul, I hear you, but the problem with your metaphor is that while songs, movies, architecture are all forms of art, as typefaces are, they are not tools to achieve a final design, they are the final designs. Type is a tool of design. Type is the notes of a song - that can be stretched and pulled and organized to make a song, not the song itself. It is up to the artist to mold, alter, and design how that type appears. And if they just take an overused generic typeface right out of the box and lay it on the page, then yeah, kinda dull. But that's not the typeface's fault. It's the designers. Thoughts?</p>
