    html: |-
      <p>the problem with metaphors is that they're metaphors. a typeface is neither a song nor a note. you can liken a typeface to a tool, but a tool that leaves an unmistakable impression on the work it creates. maybe it is more like an ingredient in a cake, but sometimes a particular face can be the flour (a necessity) or it can be a pinch of spice (a luxury that makes the whole oh-so-much nicer). so you can say type is like this or like that, but type is type. and taste is taste.<br>
      perhaps, though, you're right: it matters more how a typeface is used than the actual form of the typeface. perhaps i feel times is boring simply because most times i see it is en masse at a range of 10-12 pts on some regular leading. i'm sure there are other settings of times that could make it look fresh.</p>
