    html: "<p>Many of your objections to Stone Serif would be solved by an Open Type Pro version with optical sizes like display and subhead. When Stone Serif was new, typositor strips were still being used, and for that market Stone released a display weight of the book and book italic. Today, walking past a hardware store, I saw a box design that used the typositor display, roman and italic, and it was just beautiful. Can't help you with the large x-height, though: unfashionable here, perhaps, but loved to death by clients--and it's not hard to figure why. One curiosity: the Serif book weight is actually tagged \"medium,\" which suggests there's a Serif Light stuck in Stone's desk...??</p>"
