      <a class="freelinking external" href="http://www.type-together.com/Karmina" rel="nofollow">Karmina</a><br>
      <a class="freelinking external" href="http://typography.com/fonts/font_overview.php?productLineID=100033" rel="nofollow">Archer</a><br>
      <a class="freelinking external" href="http://typography.com/fonts/font_overview.php?productLineID=100036" rel="nofollow">Vitesse</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/fontlist/super_families/ff_yoga" rel="nofollow">Yoga</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fontfont/ff_meta_serif_ot_book" rel="nofollow">Meta Serif</a><br>
      <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fontfont/ff_celeste_ot_regular" rel="nofollow">Celeste</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/nonpareille/stuart-pro" rel="nofollow">Stuart</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/tisa/" rel="nofollow">Tisa</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/ludwiguebele/marat/" rel="nofollow">Marat</a><br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/type-together/skolar/" rel="nofollow">Skolar</a><br>
