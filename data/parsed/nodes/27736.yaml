      <p>ben:</p>
      <p>I have alot of respect for Dean Allen. He's a purist of sorts when it comes to type and I like that. His site is what got me interested in type a couple of years ago. I wonder whether he's on Typophile. </p>
      <p>Yes, there are a few Baskervilles out there, but I think professional opinion has basically brought it down to three that are truly worth considering:</p>
      <p>John Baskerville (and Baskerville Ten) by StormType<br>
      Baskerville 1757 by Fountain<br>
      New Baskerville by ITC</p>
      <p>Every time I find something particularly good about JB, I recall something equally good about, say, B 1757. I really can't decide between those three. Although it seems to me that most people here on Typophile prefer the first two I listed. I'm not very knowledgeable about Baskervilles anyway. </p>
      <p>Mrs. Eaves, however (which is considered a play on Baskerville), is NO Baskerville, no matter what anyone tells you. ;-) If you want that low x-height whimsical charm of Mrs. Eaves but with spacing that actually makes sense (in terms of extended text), then have a look at Emigre's Tribute, which is quite a gem.</p>
