    html: |-
      <p>Jabberjaw, your question is like asking us to name the best song ever recorded. The only answers you'll be able to get from it will be subjective. I might think that Adobe's Garamond Premiere Pro is the best serif typeface on Earth. But another poster might point to FF Maiola. Or Palatino nova, or Sabon, or a typeface from Steffan Hattenbach's MacRhino collection.</p>
      <p>While there are certainly a number of typefaces that *I* would definitely say are not the best serif types on the planet, this wouldn't be helpful either. The best typefaces are tuned to specific periods, moods, media, environments, and printing technologies.</p>
      <p>Are you looking for a font for corporate identity, a novel, a newspaper, a website, a logo, or something else? For each of these uses, you'll still get different answers from most Typophile posters here, but at least the answers, like the question, will be more specific and help you make the right purchase and create the best design.</p>
    html_clean: |-
