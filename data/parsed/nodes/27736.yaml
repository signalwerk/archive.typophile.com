      <p>Anyone who is seriously after 'the best serif font on the planet' usually ends up having to draw their own, after all, so if you have time... or the money and the inclination, why not commission some of the good people who hang out here? </p>
      <p>The <a href="http://www.yale.edu/printer/typeface/" rel="nofollow">Yale Typeface</a> that Matthew Carter did for the university there is a case in point – commissioned as a proprietary face, it sure is nice, but you can't use it unless you're at Yale. Apparently it's based on the Aldine roman.</p>
      <p>Would that be unique, classic and high-end enough for you?</p>
      <p>BTW I agree with the people who have already mentioned the newer, better versions of Bembo, Sabon etc in this thread. Apart from <a href="http://www.emigre.com/EF.php?fid=109" rel="nofollow">Mrs Eaves</a> does anyone know of a similarly overhauled version of Baskerville? I might also add <a href="http://www.typography.com/catalog/hoeflertext/index.html" rel="nofollow">Hoefler Text</a> and <a href="http://www.linotype.com/1500/stempelgaramond-family.html" rel="nofollow">Stempel Garamond</a> to the list for consideration.</p>
    html_clean: |-
