      <p>Lately, I've been reviewing Josh Darden's new Freight Text, a high-x-height serif family not unlike Stone Serif, but crisper above 10pt. Both book and medium weights are available for text, very subtly different, and both quite beautiful. This family really deserves careful consideration for workhorse use, as does Linotype's Sabon Next. Josh's website doesn't sell Freight Text very well; on the "set your own sample" page, you can try it yourself.</p>
      <p><a href="http://www.joshuadarden.com/shop/freighttext.php" title="http://www.joshuadarden.com/shop/freighttext.php">http://www.joshuadarden.com/shop/freighttext.php</a></p>
      <p><a href="http://www.linotype.com/53159/sabonnext-family.html" title="http://www.linotype.com/53159/sabonnext-family.html">http://www.linotype.com/53159/sabonnext-family.html</a></p>
