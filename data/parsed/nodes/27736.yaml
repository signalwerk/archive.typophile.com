    html: |-
      <p>&gt;works well at 9 pt. </p>
      <p>I recently read 'Printers Type in the Twentieth Century' (library copy) which if I remember rightly is in Stone Serif. I can see that it could work very well at 9 pt, but at the larger size in that book, I didn't find it so nice. </p>
      <p>Walter Tracy writes "For my own taste, if x to h is a proportion of acout six to ten a face will look refined and pleasant to read. If the x height if much less than that the face may be stylish but will be unsuitable for a long text. A larger x-height conduces to dullness."</p>
      <p>I think Tracy got it right, and that Stone Serif is a bit lifeless. I see it was finished in 1987, when I think the huge x-height fashion was still in full swing.  </p>
      <p>So: suberbly crafted? No doubt. Ideal? No way. Just reading about it, I would think that Stone's <a href="http://stonetypefoundry.com/html_pages/CyclesOverview.html" rel="nofollow">Cycles</a> would be more of a candidate.</p>
