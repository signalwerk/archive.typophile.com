      <p>If the central vertical were full width, it would help the P and wouldn't hurt the R any.</p>
      <p>I think "Suerto" is a significant problem and it's probably even a word. It may be preferable to use a leaning-to-the-right-sort-of-long-S. And then you could bring down the height of the U/O, tucking the u into the empty space under the P, which will also help the legibility of the O because it will be rounder and because a raised O is commonplace in deco.</p>
