    <p>My Dad's cousin Melissa lives down in Costa Rica as an industrial designer, building and designing the most magnificent homes you'll ever step foot in. My gf and I had the opportunity to spend some time with her and her family at the end of our recent trip to Costa Rica. Not only is she building amazing homes, but she's revitalizing the design sense of the town around her. The main town nearest to the houses/beach is referred to as Quepos, but it's technically Puerto Quepos and interestingly enough Quepos is a few meters below sea level, they have a New Orleans complex. The only thing that separates the town from the ocean is a big sea wall that runs the width of the town on one side, which can be seen here in one of the photos from our trip: <a href="http://dl.dropbox.com/u/4337387/P1000082.jpg" title="http://dl.dropbox.com/u/4337387/P1000082.jpg">http://dl.dropbox.com/u/4337387/P1000082.jpg</a> On the back of the sea wall are benches and plants running most of the length, behind which Melissa has started turning the retaining wall into a giant tile mosaic. It depicts different native Costa Rican animals on each section, ie. a sea turtle on one, a marlin on another. Melissa asked me if I could create a PUERTO QUEPOS ambigram to be installed on the wall and possibly other places around the town, naturally I told her not every word or phrase is possible, but I'd try it out. Fortunately for her, it is possible and thus created this for her to work with. To have my work become a part of a permanent installation, a landmark if you will, is pretty damn exciting, especially in a different country as beautiful as Costa Rica is.</p>
    <p>Edit: Wow, the cap Q from the thread title in Belucian is nice!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/puertoquepos_lg_6269.png"></div><p></p>
