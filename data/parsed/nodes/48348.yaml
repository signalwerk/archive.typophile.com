      <p>edit: crosspost with florian</p>
      <p>there's not a font quite like this ... it's either built-from-scratch (custom) or<br>
      a font heavily modified (customized)</p>
      <p>if it is customized, it might be a titling face such as New Horizon Titling</p>
      <p><a href="http://www.myfonts.com/fonts/aboutype/new-horizon/" title="http://www.myfonts.com/fonts/aboutype/new-horizon/">http://www.myfonts.com/fonts/aboutype/new-horizon/</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nim_3429.jpg"></div><p></p>
      <p>You could get in contact with Mojohouse ... Mojo did the Nim's Island movie posters. They might have been working with key art created by someone else.</p>
      <p><a href="http://www.mojohouse.com/contact/emails.html" title="http://www.mojohouse.com/contact/emails.html">http://www.mojohouse.com/contact/emails.html</a></p>
