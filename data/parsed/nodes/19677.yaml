      <p>See "aids_06.pdf"</p>
      <p>James, thanks for suggesting Formata. It lead me to find Zwo. I used FF Zwo Black Italic Alt for "Tulsa" and FF Zwo Semi Bold SC Italic for "AIDS WALK". I started seeing "ulsa" too, so I made the whole thing red. I also took your advice and started with the font rather than the ribbon. Do you see "Pulsa" now?</p>
      <p>Tiffany, the burgandy was supposed to be red. I changed it to be more of a true red. I opted against adding depth to the rest of the letters because I thought that might confuse the ribbons with the letters. Hopefully the word reads well as a whole. </p>
      <p>Thanks for your suggestions. They are much appreciated.</p>
