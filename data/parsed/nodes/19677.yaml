  html: |-
    <p>I have been asked to volunteer my time to design the Tulsa AIDS Walk logo. I started off by designing a red ribbon to look like the "T" in "Tulsa". Then, I browsed through several bold/black sans serif fonts. I ended up using Myriad Pro Black Italic. In order to have the "ulsa" at the same angle as the "T", I had to sheer the type set in Myriad Pro Black Italic by about 22 degrees. I am not an advocate of sheering type, but I wasn't sure what else to do. </p>
    <p>What do you think about the "ulsa"?  Now that I have sheered the type, should I adjust the shapes of the characters to compensate? Thanks for your input. Should I use a different font?</p>
    <p>Ty</p>
