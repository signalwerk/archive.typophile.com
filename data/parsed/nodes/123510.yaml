      <div class="comment-spam-body"><p>Some similarity to Dorchester Script <a href="http://www.identifont.com/find?font=Dorchester+Script&amp;q=Go" title="http://www.identifont.com/find?font=Dorchester+Script&amp;q=Go">http://www.identifont.com/find?font=Dorchester+Script&amp;q=Go</a> A visiting card script designed by Monotype in 1938. The previous year Monotype produced Grosvenor  Script, which is similar but with short descenders.</p>
      <p>UPDATED INFO:<br>
      Luc Devroye comments on Dorchester Scrip:<br>
      "Script, issued in 1938 by Monotype, based on a Grover Foundry script found in Ichabod Dawkes's News Letter from 1698. "</p>
      <p>Don</p>
      </div>
