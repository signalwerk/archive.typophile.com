    votes: null
    html: |-
      <div class="comment-spam-body"><p>BTW it is possible to digitize  Hermann Ihlenburg's fancy scripts. See the excellent treatment of his Centennial Script by Rebecca Alaccari for Canada Type <a href="http://www.myfonts.com/fonts/canadatype/centennial-script/" title="http://www.myfonts.com/fonts/canadatype/centennial-script/">http://www.myfonts.com/fonts/canadatype/centennial-script/</a> The original metal type of these scripts was extremely fragile and printed text other than the ones in the Specimen Book often show broken, bent or missing connecting lines. It is only with the arrival of digital type that they can be widely used.<br>
      Don</p>
      </div>
