    html: |-
      <div class="comment-spam-body"><p>It's been several years since I went through the MS&amp;J Specimen Book of 1892, but now that you mention it I do recall seeing the display of Sansom Script.<br>
      Note that the practice of the day was to show the font in use and not provide a full character set. So it's necessary to use imagination to see the shapes of characters not included in the presentation.<br>
      I considered the idea of making a digital version. I tracked down the patent. Despite the poor quality of the patent image -- bureaucratic masterminds in the Patent Office made crappy quality microfilm of the patent applications and trashed the originals so that this was all that was available for the recent digitization of patent records -- it at least shows the general outlines of the characters not included in the specimen Book. I extracted the full character set and rearranged the letters into shorter lines at are easier to assess.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SamsomScriptIhlenburgD18735_1888SM_5621.jpg"></div><br>
      No further work done on the project.<br>
      Don<p></p>
      </div>
