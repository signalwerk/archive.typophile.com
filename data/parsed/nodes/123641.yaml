      <p>The sans serif (TO SIDNEY and the smaller labels), could be various weights of Monotype Grotesque:<br>
      <a href="http://www.myfonts.com/fonts/mti/grotesque-mt/" title="http://www.myfonts.com/fonts/mti/grotesque-mt/">http://www.myfonts.com/fonts/mti/grotesque-mt/</a></p>
      <p>|TEAL| could be replicated with Antenna Compressed Bold Italic:<br>
      <a href="http://www.fontbureau.com/fonts/Antenna/" title="http://www.fontbureau.com/fonts/Antenna/">http://www.fontbureau.com/fonts/Antenna/</a></p>
      <p>Hoefler &amp; Co.’s Numbers (Indicia) could help you replicate the sequential numbering:<br>
      <a href="http://www.typography.com/fonts/numbers/styles/" title="http://www.typography.com/fonts/numbers/styles/">http://www.typography.com/fonts/numbers/styles/</a></p>
      <p>PsyOps Crash Numbering is also an option:<br>
      <a href="http://www.psyops.com/shop/typefaces/crash-numbering/" title="http://www.psyops.com/shop/typefaces/crash-numbering/">http://www.psyops.com/shop/typefaces/crash-numbering/</a></p>
