      <p>"TO SYDNEY" must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype%20%2F%20%28Commercial%29&amp;ffam=Grotesque%20MT%20Std%20-%20Extra%20Condensed&amp;fid=bb6d9705f3fbef7f120dcceb93b48368&amp;fsize=60&amp;text=TO%20SYDNEY&amp;fit=1" rel="nofollow">Grotesque MT (Extra Condensed)</a></strong></p>
      <p>"TEAL" looks modified and has no distinct letters to be sure, but it could be started as <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Font-Bureau%20%2F%20%28Commercial%29&amp;ffam=BentonSansExtraComp%20-%20Bold%20Italic&amp;fid=0845128b327f05fb20b28a7db43b02fe&amp;fsize=60&amp;text=TEAL&amp;fit=1" rel="nofollow">Benton Sans Extra Comp (Bold Italic)</a></strong> or <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Font-Bureau%20%2F%20%28Commercial%29&amp;ffam=AntennaComp%20-%20Bold%20Italic&amp;fid=b1ec85aa618746f46bf400c62b34f729&amp;fsize=60&amp;text=TEAL&amp;fit=1" rel="nofollow">Antenna Comp (Bold Italic)</a></strong></p>
