      <p>Yeah, I was also wondering if type design is somehow more appealing to males!</p>
      <p>Let me come back to this in a day or two. I think you're definitely on a good path, but will need to examine the forms more closely to give useful advice.</p>
      <p>The proportions are getting much more harmonious. However, a quick glance tells me you still need to resolve the contrast. A and x have quite noticeable contrast whilst other glyphs are a bit less pronounced. (Compare x with e for example.)</p>
      <p>Did I say anything about the quotes/comma already? Forgive me, I'm quite picky about commas for some reason, and I think yours need to be like curved rectangles instead of tadpoles to fit nicely in this design. </p>
      <p>Your descenders look different lengths.</p>
      <p>I'll be back in a day or two... ;)</p>
