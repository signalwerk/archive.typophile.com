    html: |-
      <p>Hi Jean Paul, this is looking great. </p>
      <p>Regular:<br>
      -Double quotes don't match single quotes.<br>
      -Traps on A, Y etc could be deeper; I haven't printed this but it looks like the traps wouldn't do much.<br>
      -Knee of Kk looks dark.<br>
      -Xx could do with more stroke offset on the thins. Italic k needs more compensation.<br>
      -Comparing the bowl of a with the spine of s, it seems a is much squarer. Could they be harmonised more?</p>
      <p>Black:<br>
      -q and b of the black weight look a bit too square in comparison to the regular.<br>
      -Wordspace might be too narrow (or letterspace too loose)?<br>
      -With w, try moving the two upper counters left a couple of notches.<br>
      -v might be too wide/dark.<br>
      -I wonder if e is a bit wide.</p>
