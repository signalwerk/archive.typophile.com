      <p>Thats a really nice design. I like especially the thin connections of curves and verticals.</p>
      <p>Some things that come to my mind:</p>
      <p>- You show a lot of contrast in your diagonals for example in V, W, k, x but no (or very low) contrast in diagonals of v.<br>
      - Holes in R and P are okay (even if I personally dont like it) but R and P draw a lot of attention because they are the only 2 characters with those holes. I suggest to either drop those holes at all or put even more in other characters.<br>
      - S is to heavy compared with other capitals.</p>
      <p>Great work with the italic and bold. How do you do them? Do you have a Multiple Master of your design?</p>
