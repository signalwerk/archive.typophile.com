      <p>Sorry, I didn't notice the right cut at /T/ was also used in /F/ and /E/. Anyway, as this is very typical of /T/ in serifed, old style fonts, I think it becomes a bit strange to a contemporary, squarish sans. But this is subjective.</p>
      <p>I don't know an easy way to treat these diagonals – I also have dificulties to even the colour of /v/w/x/k/ strokes myself. My method is to analise how they do in other good fonts and test test test test... Hope Typophile fellows could help on this.</p>
      <p>The /j/ is a minor issue:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Capturar_4730.gif"></div><p></p>
      <p>Probably you did work with two pieces and the nodes of one aren't aligned to grid. Illustrator sometimes does not align a node properly. This is usual after pathfinder and reflect operations, even if the original pieces have nodes aligned to grid. It seems to be a problem with the roundness of internal measures.</p>
    html_clean: |-
      <p>Sorry, I didn't notice the right cut at /T/ was also used in /F/ and /E/. Anyway, as this is very typical of /T/ in serifed, old style fonts, I think it becomes a bit strange to a contemporary, squarish sans. But this is subjective.</p>
      <p>I don't know an easy way to treat these diagonals – I also have dificulties to even the colour of /v/w/x/k/ strokes myself. My method is to analise how they do in other good fonts and test test test test... Hope Typophile fellows could help on this.</p>
