    html: |-
      <p>Jean Paul,</p>
      <p>I think this design is very good, with a nice feel, readability and personality. Italic is also very proportional and well done. But I guess the bold is somewhat excessive – it's almost a black style. The /e/ and /a/ storeys became very closed.</p>
      <p>It would interesting to have a medium height to expand the family.</p>
      <p>You may improve some little points:</p>
      <p><strong>1.</strong> in /j/ the vertical nodes are misaligned;<br>
      <strong>2.</strong> in /k/ the bottom leg is very heavy;<br>
      <strong>3.</strong> in /T/ inclination of the right cut is out of font's general style;<br>
      <strong>4.</strong> in /s/ and /S/ there are small vector problems (bumps, misalignments) in curves;<br>
      <strong>5.</strong> difference in strokes of /A/ and /K/ are higher than one finds in other letters (N, W, Y).</p>
      <p>Good job! Soon I also would like to hear your critique for the serif I'm developing.</p>
