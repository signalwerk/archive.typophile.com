    <p>I have just had a small bit of text printed in Proxima Nova (light), and I have noticed that the weight of some letters look bolder than others  (noticeably the numbers, capital letters and v, w and y).  </p>
    <p>I cant figure out if this is a font problem or a printing problem.<br>
    It seems strange to be a printing problem, as it is consistently the capitals that look off<br>
    But also strange that the font always looks fine on screen.  </p>
    <p>I do understand that its meant to be a web font but I still wouldn't expect these results when printing.<br>
    Should I just not be using this font for print?  </p>
    <p>Thanks for any help in advance, I'm very new to this kind of thing.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2015-04-02 at 01_4884.26.49.png"></div><p></p>
