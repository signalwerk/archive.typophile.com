    html: |-
      <p>Which app and printer are you using? I assume that was just a desktop printer? Laser? I have seen problems like this which were simply caused by the printer driver. The stroke width in those capital letters and figures IS larger than in the lowercase letters. So something in your print process might emphasize this.<br>
      Playing with the driver/quality settings could resolve this and it will probably not appear when another printer is used or it printed in offset.</p>
