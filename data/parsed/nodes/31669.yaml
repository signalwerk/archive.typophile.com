    html: |-
      <p>I find it a bit ironic that the two two faces she seems best known for (Trajan and Lithos) are adaptations of literally ancient designs, if I recall correctly. Even Goudy had a go at <a href="http://www.myfonts.com/fonts/castletype/goudy-trajan/" rel="nofollow">Trajan</a> in 1930 (Revived by Jason Castle).</p>
      <p>She won the Morisawa award for <a href="http://www.myfonts.com/fonts/bitstream/mirarae/" rel="nofollow">'Mirarae'</a>, but you don't see that too often.</p>
      <p>My personal favorite of hers, in a completely different vein is <a href="http://www.myfonts.com/fonts/linotype/nueva/" rel="nofollow">'Nueva'</a>, a lively, casual font that has a great range of color and utility, where you are not trying to weigh down the world with 'meaning' and importance.</p>
      <p> - Mike Yanega</p>
