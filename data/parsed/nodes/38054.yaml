      <p>Great recommendations, Reed. All of those would play very well with Giza. </p>
      <p>Since you're using a 19th-century face for the logo you might want to consider using something more modern to reflect the product. Perhaps a grotesque sans (like FF Bau) would be best. Or maybe <a href="http://www.fontshop.com/fonts/downloads/arstype/maquette/" rel="nofollow">Maquette</a>, <a href="http://www.fontshop.com/fonts/downloads/arstype/region/" rel="nofollow">Region</a>, or <a href="http://www.fontshop.com/fonts/downloads/mark_simonson/proxima_nova_ot/" rel="nofollow">Proxima Nova</a>. Perhaps a modern gothic like <a href="http://www.fontshop.com/fonts/downloads/primetype/ptl_skopex_gothic_complete_ot/" rel="nofollow">Scopex</a>.</p>
