    <p>Hello,</p>
    <p>I'm working on an brand identity for a manufacturer of designy modern furniture.</p>
    <p>At first, I was thinking of something explicitly design &amp; modern.<br>
    Maybe some kind of gotham thin, or a klavika, maybe even engel.</p>
    <p>But I wanted to add strength to the brand.</p>
    <p>I fell on Giza.</p>
    <p>I love the great impact of this face, but now I'm stuck in the choice a typeface to go with it in the body copy, and I feel Giza would be difficult in a daily use.</p>
    <p>I 'd love to share your thoughts</p>
    <p>thanks in advance</p>
    <p>+</p>
