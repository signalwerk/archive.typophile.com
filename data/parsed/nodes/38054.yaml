      <p>I'm a Giza fan, too. Nick Shinn's <a href="http://shinntype.com" rel="nofollow">Figgins</a> is based on the sans-serif font that Figgins (on whose Egyptian David Berlow based Giza) brought out, so that could be sympathetic or even be used instead of Giza. It's not out yet, but I believe it will be soon -- e-mail Nick if you're interested.</p>
      <p>In the same vein as Figgins, I think a slightly idiosyncratic and 19th-century-feeling sans or serif might work nicely. <a href="http://stormtype.com/typefaces-fonts-shop/families-55-dynagrotesk" rel="nofollow">DynaGrotesk</a>, <a href="http://processtypefoundry.com/typefaces/maple/index.html" rel="nofollow">Maple</a>, <a href="http://www.klim.co.nz/national_samples.php" rel="nofollow">National Grotesque</a> (soon-to-be-released), and <a href="http://ourtype.be" rel="nofollow">Parry and Parry Grotesque</a> could be some really nice possibilities. And <a href="http://christianschwartz.com/bau.shtml" rel="nofollow">FF Bau</a> would be a 20th-century-style alternative.</p>
    html_clean: |-
