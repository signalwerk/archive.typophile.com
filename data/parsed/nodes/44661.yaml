    html: <p>Your teal/yellow logo is definitely the strongest, but the letter forms look a little live-trace-esque. especially for a technology company, i think a less hand-lettered look is appropriate. That said, i wouldn’t say you should modify some geometric sans serif either. A little character is nice, but I would like to see it with some of those curves cleaned up. The direction that the mark is going in  is nice. A little freedom from ipod/itunes shapes and icons seems like a good idea to me.</p>
