    <p>I’m helping a friend out with his new website that focuses on helping users discover new podcasts (audio and video) as well as roll all your subscriptions into one feed address. This is the current logo.<br>
    </p><div class="imageWrap"><img src="/files/cr_5618.png"></div><p></p>
    <p>I’m trying to take this into a more appropriate direction for a technology and media related company. So far I’ve sketched out some ideas, and put some into illustrator, but I’m not sure if a solution is comming forth. Here is where I am now, typeface and colours are not necessarily what I’ll go with, I just used whatever to show a proof of concept. Ideas, comments?<br>
    </p><div class="imageWrap"><img src="/files/fIRE 001_3663.jpg"></div><br>
    <div class="imageWrap"><img src="/files/CR2_5305.jpg"></div><br>
    <div class="imageWrap"><img src="/files/cr3_3989.jpg"></div><p></p>
