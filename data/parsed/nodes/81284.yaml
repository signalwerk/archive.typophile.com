    html: |-
      <p>Thanks again, everyone.  </p>
      <p>I'd love to do a sans companion, Matheus, and have been noodling with some sketches.  And I'm a great admirer of Scala; it was definitely one of the faces on my mind when I was designing Spinoza.</p>
      <p>The little corner on the spine of the S is something I'd wanted to do for a long time, Hrant.  </p>
      <p>Eliason, I don't remember any more where I got the idea of the reversed stress oldstyle zero, but probably from Stempel Garamond, another inspiration.  The italic tittles came out of a conversation with Andreas at FSI.  My original tittle was a three-cornered version of the four-cornered tittles in the roman.  Andreas at first recommended making the itals more genuinely calligraphic—more like a Minion Italic—and suggested a tittle that could be drawn with an edged pen.  When I said I didn't want a purely calligraphic ital, he suggested I go in the other direction, and make the tittle very clearly non-calligraphic.  So I came up with this, with the hard straight leading edge.  I like it better than my first idea.</p>
