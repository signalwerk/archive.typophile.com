      <p><em>Nick:</em> I kind of got that you were teasing me a bit for being slow, but I'm hoping you also meant it when you called the typeface good. Since I haven't had any training in type design, I'd guess I spent about nine of those 11 years bumbling around in circles, trying to teach myself the basics. The design itself probably took about two of those years, once I'd run out of ways to do things wrong. Just trying to design a companion italic with near-horizontal departures, to match the roman's horizontal departures, took a lot more time than I want to think about.  Once I threw that out and started from scratch with an italic that felt right instead of one that matched my preconceived notions, the actual italic only took a few months. But I'm hoping the next typeface won't take a decade.</p>
      <p><em>Andreas:</em> Thanks! I did have a good time. And I'd love to add Greek language support, and Cyrillic, too.  But first I've got to sell a few downloads, just so I know this isn't just a really time-consuming hobby...</p>
