      <p>A good reference on how fonts work with TeX is the book <a class="freelinking external" href="http://www.oreilly.com/catalog/9780596102425/" rel="nofollow"><em>Fonts and Encoding</em></a> by Haralambous. It explains in detail all the steps to make a postscript font work with LaTeX. If you want to do everything by hand, these steps are:</p>
      <ul>
      <li>Step 1: make a .pfb file out of your font.</li>
      <li>Step 2: make a corresponding .tfm file; this can be done with <a class="freelinking external" href="http://fontforge.sourceforge.net/PfaEdit-TeX.html" rel="nofollow">fontforge</a>, but you might fint it easier to do it by hand.</li>
      <li>Step 3: choose an encoding or make a new .enc file for your font; this depends whether the glyphs you are making are standard or not.</li>
      <li>Step 4: make a .map file to tell dvips or pdftex that they must use your .pfb file with the corresponding .tfm file and the encoding you chose.</li>
      <li>Step 5: make a .fd file (font definition file) for latex to be aware of the font.</li>
      <li>Step 6: make a .sty file (a LaTeX package) which will give the user shortcuts for the symbols in your font (or which will swich the text font to your new font if you made a text font).</li>
      </ul>
      <p>You must then install the font on your system in order to test it. The procedure depends on your TeX distribution, but typically, you must put all the preceding files into a local texmf tree following the TDS specification, then tell LaTeX that it must must use the .map file you made and finally update the file name database with a texhash and a updmap.</p>
      <p>It might seem a bit complicated, but once you've done it a couple of time, you'll get used to it.</p>
