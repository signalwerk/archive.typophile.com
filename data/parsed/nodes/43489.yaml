    <p>I am a math student with a type obsession. I've searched just about every place I could think of for information on how to create fonts that can be used in TeX and have not had any luck. I run Linux and have played around with FontForge, but do not see a clear way of getting everything to work with TeX. I must admit, it is really difficult to make a decent glyph and I really appreciate your craft! Even though I have had no success making anything appealing in FontForge, I still am interested in how everything works. What are some good references for this?</p>
    <p>Thanks!!!</p>
