      <p>I spent the summer before my son was born obsessing about creating a companion math font to go with Aldus. After my son was born, well it didn't seem quite so important. :)</p>
      <p>In addition to the resources mentioned above, you can look up the <a class="freelinking external" href="http://www.tug.org/applications/fontinst/" rel="nofollow">fontinst</a> script, which has been the standard method to install Type 1 fonts for use with LaTeX. Philipp Lehmann's tutorial (found at the link above) has been especially helpful. The <a class="freelinking external" href="http://www.lcdf.org/type/otftotfm.1.html" rel="nofollow">otftotfm</a> software is another way to install OpenType fonts for TeX (perhaps not as automatic as the tool mentioned above).</p>
      <p>When I tried creating a Math Font, I remember that I started by finding the pfb files for 10-point Computer Modern and altering the glyph shapes without altering the spacing of the characters (I wanted to start on the glyphs before worrying about how to correctly space the math fonts--I knew I could use the font metric files for Computer Modern while I was working on the glyphs). That method also helped me really learn what was in each file.  Check out cmex10.pfb, cmsy10.pfb and cmmi10 (I think). I also found the source for the psnfss package (psnfss-source is what is looks like in my files right now) and  looked at the code that generates the mathppl or mathpazo fonts. I think the file pazofnst.tex was the one I looked at because I wanted to basically recreate the mathpazo package using math fonts other than the computer modern ones. I did a lot of looking and a lot of pondering, but I eventually was able to understand most of what was going on (unfortunately, now I've lost many of the details).</p>
      <p>One resource I found really helpful was the book <em>TEX Unbound: Latex and TEX Strategies for Fonts, Graphics, and More</em> by Alan Hoenig. Math fonts in TeX really do seem to be something of a mysterious thing (especially at first), and this was the first book I found that gave information about them in a more digestible form.</p>
      <p>I'd be happy to send you the files I created in trying to make my math font--not because they're at all perfect, but they might show the things you have to look at to get started.</p>
      <p>I second the idea of getting involved in TUG, and I assume that you are aware of usenet groups like comp.text.tex (I think) and other mailing lists that can be found through TUG or CTAN. I'm subscribed to the tex-fonts mailing list through math.utah.edu, and TUG seems to have a math-font-discuss list (which might really be the same list?). The tex-fonts list doesn't get a lot of traffic, but questions are usually quickly addressed.</p>
      <p>As an aside, I've always thought it would be great for someone to make a multiple-master font just for mathematical symbols--nothing that requires <em>too much</em> design skill, just so that it would be possible to quickly generate a math font that matches the weight of any particular text font. I think someone did this with metafont, but the result at the time was the generation of bitmapped fonts, not scalable fonts.</p>
      <p>Finally, I've also noted that the beamer package has code that automatically substitutes your chosen text font for the letters (not symbols) when you use math mode. This isn't standard behavior in LaTeX, and I've always meant to check out how it's done automatically (whether it's easy or hard). It _is_ fairly easy (after you start to understand what's going on) to copy a file like mathpazo.sty and by hand replace the references so that the letters in math mode will match another typeface, even if you don't create a new symbol font to go along with it.</p>
      <p>This may be more than you want, but do feel free to contact me if you have specific questions that I might be able to answer.</p>
      <p>st</p>
