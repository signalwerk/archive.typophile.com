    <p>I've just recently started using FontLab Studio 5.<br>
    I know I'm being lazy, but is there any quick way or shortcuts for creating different weights for an entire font family.</p>
    <p>I tend to design most of my fonts in Illustrator CS, but find the 'stroke' function doesn't quite work for the different weights.</p>
    <p>I'm sure the only solution is hard work, but I was just wondering if anyone had any good techniques for solving this problem?</p>
    <p>I have even tried designing an ultra thin font, and then the ultra fat, then morphing the rest using the 'Blend Tool' and a specific number of steps.<br>
    This seems to be the quickest method so far, although it can produce some very unexpected results if the number of points don't match.</p>
    <p>thanks</p>
