      <p>In FontLab, I've found that "Make Parallel Path" is neater than "Expand Path".<br>
      Actions &gt; Effects &gt; Bold is also very useful, especially in the way it can be weighted differently for x and y axes.<br>
      You might take a look at Superpolator.</p>
