  html: |-
    <p>Typo is proud to announce the release of a new font family "Loreto"</p>
    <p>This font gets its inspiration from the typography of the Manuale ad Usum (1721), printed by Jesuit missionaries who worked at the beginning of the XVIII century with communities of "Guaraná" native indians from the Northeast region of Argentina.<br>
    It is a manual of sacraments published by Paulo Restivo and some collaborators among the native population. This manual features the peculiarity of being the first printed piece where there is a record of the place where it was printed: at the Loreto mission.</p><div class="imageWrap"><img src="http://typophile.com/files/Loreto-550_6510.png"></div><p></p>
    <p><a href="http://new.myfonts.com/fonts/tipo/loreto/" title="http://new.myfonts.com/fonts/tipo/loreto/">http://new.myfonts.com/fonts/tipo/loreto/</a></p>
