    html: <p>Why are you posting this to a typography discussion forum? <br> <br>It is, by the way, a myth that Islam is the fastest growing religion in the world. It is often cited, but most people are simply repeating what they have heard without questioning either the source or the method arriving at the conclusion. The idea was first put forward by Harvard University scholar Samuel Huntington, who is also responsible for the whole 'clash of civilisations' idea back in 1993. For a contrasting study you might read Philip Jenkins's <i>The Next Christendom</i>. There are no reliable numbers for the spread of religion in the places that matter most in terms of population growth -- Africa and South America --, but it is pretty clear that in both these continents Christianity is spreading faster than Islam. The number of Christians in Africa outstripped the number of Moslems some time in the 1960s, and the number has more than doubled since 1970.</p>
