    html: "<p><i>John, so why are you encouraging him?</i> <br> <br>You know me, Hrant: if someone makes an unsupported assertion as if it is fact, I'm liable to question it, especially if I'm aware of something that suggests it is incorrect or misleading. Gerald's post is a good point: if <i>I</i> were to cite 'Approximate Global Mission Statistics' from an evangelical Christian source that cites only other evangelical Christian sources, I reckon you would pretty quickly accuse me of being taken in by their propaganda. Philip Jenkins debunks much of the statistics regularly cited to 'prove' that Islam is the fastest growing religion, pointing out that reliable figures from much of the world, simply are not available, but that in many of these areas there is very little Islamic growth through either conversion of population growth; much of the statistics simply do not include these areas. Even Samuel Huntington, who first suggested that Islam was the fastest growing religion, now notes that there was a baby boom in many Islamic countries that has now ended, with birth rates in some Islamic countries now lower than they were before the baby boom. It is in the interests of <i>some</i> evangelical Protestants to spook their donors with fear of an Islamic planet. <br> <br>There. That's all I have to say on the topic, and I'm going to ignore this thread from now on.</p>"
