    html: |-
      <p>I agree with TypeSEtit, you need to add weight to your where your stems would be. Also, I would consider experimenting with a cursive "J", one with an upper and lower loop. I think you could make some nice vertical rhythm. Even for the fanciest of uses, such as wedding invites, I think there is room for completely straight portions, it adds a degree of variety that just makes the whole thing look more elegant when balanced nicely. Imho a fully curved monogram tends to be too flourishy, too decorative.</p>
      <p>Please excuse the rough comps, just trying to provide my train of though.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jd_6520.png"></div><p></p>
