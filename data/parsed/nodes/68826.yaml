    html: |-
      <p>I don't think you suck at this, your forms look good to me. I did this sketch to show how you might want to heavy up your shades (thick parts of the letters). Heavier shades will define the letters more and differentiate from swashes.</p>
      <p>I know you're trying to combine the two letters so it's all one continual stroke, but that may be what is preventing the J from really standing out. If you want the design to be all one stroke, make sure that the transition from one character to the next is thin... any thickness will be confusing.</p>
      <p>Also, I've made the J stem and the D share the same double stroke... why not let them really echo each other?  Like they're dancing... let them hold each other close. Just my two cents for what it's worth. I know you'll end up with a great design.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/JD_4120.jpg"></div><p></p>
    html_clean: |-
      <p>I don't think you suck at this, your forms look good to me. I did this sketch to show how you might want to heavy up your shades (thick parts of the letters). Heavier shades will define the letters more and differentiate from swashes.</p>
