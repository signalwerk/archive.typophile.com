      <p>Friedman's site is a nice list, but note that not all of the ones listed there are actually free for commercial use. So be sure to read the fine print.</p>
      <p>Bitstream vera is one of my favorites, though it only comes in standard and bold:</p>
      <p><a href="http://www.bitstream.com/font_rendering/products/dev_fonts/vera.html" title="http://www.bitstream.com/font_rendering/products/dev_fonts/vera.html">http://www.bitstream.com/font_rendering/products/dev_fonts/vera.html</a></p>
      <p>Personally, I think it works better as a display face than text face.</p>
