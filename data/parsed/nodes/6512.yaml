    html: <p>Hrant, you do have a point, but what I'm trying to do is diversify what is appropiate rather than follow a set formula. <br>    ex. what if one side of a serif was longer than the other. or what if one went straight in to the stem while the otherside curved into the stem softly. <br> <br>raph, thanks so much for the idea of tracing some classic lettering. It was an idea I had in mind but I was afraid if I based my ideas on other fonts my designs would lack originality, I know now that this is not true. also thank you for the font examples I'll write it down. anymore suggestions? <br> <br>IM</p>
