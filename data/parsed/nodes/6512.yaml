    votes: null
    html: "<p>Try tracing a few letters from excellent fonts. You'll learn how the masters constructed their serifs. If you don't have it, Jan Tschichold's \"Treasury of Alphabets and Lettering\" is a good place to start. <br> <br>I'm currently tracing Centaur caps, which have truly magnificent serifs. For a more typographic, less calligraphic approach, try the Le Be alphabet in the Tschichold book (or in Harry Carter's \"View of Early Typography\", which is more scholarly). Dozens of fonts with beautiful and distinctive serifs come to mind: Palatino, Bembo, Bodoni, Perpetua, Trajan, Columna, Goudy, Friz Quadrata, Albertus, Egyptian, Novarese, etc., etc., etc.</p>"
    html_clean: "<p>Try tracing a few letters from excellent fonts. You'll learn how the masters constructed their serifs. If you don't have it, Jan Tschichold's \"Treasury of Alphabets and Lettering\" is a good place to start. <br> <br>I'm currently tracing Centaur caps, which have truly magnificent serifs. For a more typographic, less calligraphic approach, try the Le Be alphabet in the Tschichold book (or in Harry Carter's \"View of Early Typography\", which is more scholarly). Dozens of fonts with beautiful and distinctive serifs come to mind: Palatino, Bembo, Bodoni, Perpetua, Trajan, Columna, Goudy, Friz Quadrata, Albertus, Egyptian, Novarese, etc., etc., etc.</p>"
