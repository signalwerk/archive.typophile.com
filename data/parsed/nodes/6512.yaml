  html: <p>I need help with something. You see when I design a letter my biggest problem is creating the serifs. So I started this thread in hopes of obtaining info from fellow typophiles on serifs that set themselves apart from the usual triangle formation. I would really appreciate the feedback.  <br> <br>IM</p>
