    <p>Hello everyone.</p>
    <p>I have a problem with fonts displayed for example in photoshop...</p>
    <p>Here I'm posting a screenshot of font-family menu in photoshop.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/screenshot_6520.jpg"></div><p></p>
    <p>I would like to have just one choice for knockout in font family menu, and all other sub-weight in font-style menu. But instead, I have all the weights in font-family menu..</p>
    <p>I have the same problem with some other fonts too.</p>
    <p>I was searching the forum, but I didn't find such a topic..</p>
    <p>Thanks for your help..</p>
    <p>Mike</p>
