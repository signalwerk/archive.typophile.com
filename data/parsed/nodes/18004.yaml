      <p>When I noticed that Nick Shinn said, "I don’t believe that Illustrator users have any need of fractions.", I wanted to respond with a plea that some of us need all the power for setting mathematical expressions you can give us in both Illustrator and Indesign! Please consider that any mathematical expression an author/scientist might want to write in a figure for a journal article or book needs to be doable in Illustrator so that it looks good when put in InDesign.</p>
      <p>As another example, in Indesign I figured out how to insert multiple non-breaking white spaces each with negative kerning to write a Greek word with both a superscript and a subscript that start at the same position. (The text contains 139,000 Greek words, each with a id superscript and a separate id subscript). </p>
      <p>From comments I have seen others also are struggling with math expressions in text (InDesign) and figures (Illustrator) even when we buy math plugins.</p>
