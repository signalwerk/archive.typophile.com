      <p>I've done the same thing.<br>
      I optimized for InDesign.</p>
      <p>The problem I have with Illustrator is that in order to position the superior figure, bar(s), and inferior figure on the same vertical axis, I've given my horizontal bar(s) negative sidebearings, and while InDesign recognizes them on both sides, Illustrator appears not to recognize the right-side negative sidebearing -- so I'm contemplating closing up the space between figure and bar by kerning instead.<br>
      But perhaps I will not bother, as I don't believe that Illustrator users have any need of fractions.</p>
      <p>Quark 7 offers "fraction" in its OpenType menu, but it is not the correct "Fraction" feature: rather, it is a "hack" using the numerator, fraction slash (virgule) and denominator features.<br><img src="/sites/default/files/old-images/frax.png"></p>
      <p>I think it may be possible to achieve consistency across the applications by replacing the angled virgule with a horizontal bar, making superiors and numerators identical, and inferiors and denominators identical, and positioning the fraction elements by kerning -- although the kerning support of OpenType fonts in the beta of Quark 7 is incomplete.</p>
