      <p>It's almost certainly not you, but Illustrator. The rendering engine and underlying font engine is shared across all the major Adobe apps, but the text engine is not (though Illustrator and Photoshop do share their text engine), and there's where the problem lies.</p>
      <p>We don't have anything like this in-house to test with. If you'd be willing to share the font along with a description of the problem, I can pass it on to the relevant engineers. With any luck we could get this fixed for a future version of the Creative Suite.</p>
      <p>Regards,</p>
      <p>T</p>
