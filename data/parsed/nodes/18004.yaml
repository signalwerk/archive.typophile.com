    html: |-
      <p><cite>What the XPress 7 frac feature does is exactly what the specs say.</cite></p>
      <p>I think QuarkXPress violates the specification, because it ignores the following rule:</p>
      <p><code>When the full sequence is found in the frac coverage table, the application passes the sequence to the frac table and gets a new GID in return.</code></p>
      <p>Instead of that it directly assumes case two:</p>
      <p><code>When the frac table does not contain an exact match, the application performs two steps. First, it uses the numr feature (see below) to replace figures (as used in the numr coverage table) preceding the slash with numerators, and to replace the typographic slash character (U+002F) with the fraction slash character (U+2044). Second, it uses the dnom feature (see below) to replace all remaining figures (as listed in the dnom coverage table) with denominators.</code></p>
      <p>Maybe the problem can be solved by a hack. (At least the slash can be substituted in the numerator feature. And then it will not be automatically replaced by QuarkXPress.)</p>
      <p>At first QuarkXPress seems to check, if a string "figure slash figure" is present in the text for which the fraction feature shall be applied. And then it goes to the numerator feature. If the slash is not substituted there, Quark replaces the slash automatically, before the substitutions embedded in the frac feature can be applied. So "sub slash by fraction.alt" is ignored in the frac feature, because the slash already was replaced by the fraction.</p>
      <p>I did make a quick test only. I may be wrong. And in cases, where you have a string of a prebuilt fraction followed by a number, Quark is not replacing anything, because the slash is missing in the string. This problem could maybe solved by integrating a multiple substitution like "sub onequarter by one.numerator slash four.denominator" in the numerator feature. But I did not check that.</p>
