      <p>Wow, looks nice.</p>
      <p>What the XPress 7 frac feature does is exactly what the specs say. So literally, this is not "hack" but "the right thing". But nicely indicates that specs are a bit behind real-world development.</p>
      <p><cite>... although the kerning support of OpenType fonts in the beta of Quark 7 is incomplete.</cite></p>
      <p>There are always applications which don't support things correctly. Making OpenType fonts either means: including the nice things which specs promised, or: making fonts that work in a majority of applications. If anyone knows how to do both, please let me know. :)</p>
      <p>More and more I am convinced that trying to get fonts right is one thing. Another one would be to tell application developers explicitly what they shall do with all the information they can find in OpenType fonts! Like, we find the entire history of digital type represented in a collection of font name entries, or three sets of vertical metrics values, or a strange numeric weight value which is even used by apps which otherwise read legacy family/style name (with the nice effect that weight value must be set "wrongly" [specs p.o.v.] so that they work "right" [applications' p.o.v.], or style linking doesn't work) &amp;c ... And there isn't a chance to get rid of some of these information if fonts shall be backward compatible. Which also means that most likely -- because information are there -- even future apps may make use of them.</p>
