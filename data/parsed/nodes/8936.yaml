    html: "<p>I take both your points. I think because I started this as a display face then thought about dyslexic issues later it will always be a secondary thing, not the main reason behind the design. I was going to take the dyslexia part out of the title of this post (and attach a proper PDF!) but didn't know how. <br> <br>I have started a sans serif face much more aimed at helping dyslexics so I think I will put those efforts into that design instead. Is it worth doing more work on this typeface or are there already faces like this available? <br> <br>(PS: Read Regular still doesn't seem to be commercially available, unfortunately.)</p>"
