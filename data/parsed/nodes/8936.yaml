    html: <p>I think that design for dyslexia is quite interesting, and that this design can become interesting, but the two don't mix, basically because this is very firmly in the display realm, and dyslexia is about reading. <br> <br>You can use science (or at least analysis) to make <i>any</i> font more legible or readable, but I think if you want to focus on such a singular "disorder" a texty design would have to to be the target. <br> <br>(That took about 2 minutes - not too bad a redistribution of <br>time/efficiency if it might end up saving Derek a few hours, eh?) <br> <br>hhp</p>
