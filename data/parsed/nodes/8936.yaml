    <p>This is my first attempt at properly developing a typeface so I warn you now it will probably look a bit crude. It's still in FreeHand at the moment while I read up on Fontographer.  <br> <br>I started off trying to make a more readable alternative to display typefaces like Sharp. I then amended the idea to include designing for dyslexics (avoiding the double-storey 'a', making the 'a', 'e' and 'o' very different and making 'b'/'d' and 'p'/'q' characters that don't mirror each other). This was sparked by articles in Creative Review on alternatives to Comic Sans that are readable for dyslexics (like Lexia - <a href="http://www.k-type.com" target="_blank">www.k-type.com</a>) and the Read Regular font by Natascha Frensch (<a href="http://www.readregular.com" target="_blank">www.readregular.com</a>). <br> <br>I realise the ascenders of my typeface may not be tall enough for dyslexics but wanted to get some feedback anyway. I especially wanted to know if there's anything similar to this already out there?  <br> <br></p>
