    html: <p>I agree with Hrant; this is like an expanded ultra-black, and would not work at all in a text setting. It wouldn't even be that legible in a display setting, although I suppose it would be more legible than usual for dyslexics. This might be interesting if you treat it as a blackweight alternative to a much lighter regular textface, but if readability is your goal, you're probably going to need to play with serifs of some kind as well. <br> <br>On another note, has Natascha ever released Read Regular? It's a neat idea, and someday I'd like to actually play with it.</p>
