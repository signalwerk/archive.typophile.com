  html: |-
    <p>I created a document to start cataloging all of the drills I may use in practice for my own reference and to spread knowledge to better the sport of water polo. I would love most of all tips for setting up my file in Adobe In Design to make this process easier as well as general tips on my design and layout and typography.</p>
    <p>Here is the pdf:<br>
    <a href="http://www.norcalwaterpolo.com/downloads/wpb_401.pdf" title="http://www.norcalwaterpolo.com/downloads/wpb_401.pdf">http://www.norcalwaterpolo.com/downloads/wpb_401.pdf</a></p>
    <p>I can also post up the indesign files if someone can give me tips on setting up my files.</p>
    <p>Thanks!<br>
    -Jesse</p>
