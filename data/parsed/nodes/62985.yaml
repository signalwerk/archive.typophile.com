      <p>lots to comb through but something that stands out immediately is the forced justification, it makes the text too airy and with the sans serif font and depth of information *pardon the pun* it makes it hard to read and digest.</p>
      <p>also consider limiting the use of the // as a separator, try the bullet instead • alt 0149 on pc, option 8 on mac.</p>
      <p>also i think some clever and occasional usage of line drawings or illustrations could spruce up the layout and break it up so it doesn't seem so type-dense. also the thick line above the side headers makes the page feel heavy to the left. try to extend a thinner line, 2 pt across or halfway at least over the top of the first line of the section. </p>
      <p>the whole document looks a bit like a resume so some subtle character and 'breaking up the boxes' so to speak will go a long way.</p>
      <p>also to change it slightly ... how about some historical nuggets or waterpolo records as inset callout boxes like you'd see a pull quote in a magazine formatted.</p>
      <p>thanks for sharing it with us and good luck.</p>
      <p>In the spirit of unbridled creativity,</p>
      <p>Troy Vera<br>
      Kingdom Graphics<br>
      <a href="http://www.kingdomgraphics.biz" title="http://www.kingdomgraphics.biz">http://www.kingdomgraphics.biz</a><br>
      Yahoo IM: kingdom_graphics<br>
      Skype: kingdom_graphics</p>
