      <p>Awesome, Thank you Troy! </p>
      <p>I will try it without forced justification, bullets, and a 2 pt separator. I plan on adding line drawings and rewriting most of the drills for the layman as well as including a glossary. That is a good idea about the quotes! </p>
      <p>This is only 1 part of a larger document wherein I include fundamental concepts of the sport,team plays, coaching philosophies, etc.</p>
