  html: |-
    <p>Hello,</p>
    <p>I am trying to decide on a typeface to use for my own portfolio/identity. I'm a pretty big fan of Din, but it seems like it is being a little overused lately. I like how it is mildy- techy and mildly-retro feeling, but not over the top, I suppose. It feels very what-you-see-is-what-you-get (objective, maybe) while still having a bit of distinction. Of note, industries I'm interested in working with in the future: design-industry related (architecture, ID, etc), fine-art/gallery, editorial/book design/publishing.</p>
    <p>I am looking for other typefaces similar to Din: objective, modern, geometic. It would be great if this typeface could work well for both headlines and for body type, print and web. I'm putting together a web portfolio, resume and business card.</p>
    <p>I'm new to all of this (just finishing up my degree) and still trying to figure out what it is that I'm responding to when I have a reaction to a typeface - good or bad - and I really like Din. I liked Neutraface for a while (but now it feels a little too quirky for my tastes), and Trade Gothic has been a staple of mine for sometime. I don't know what all of these have in common. </p>
    <p>I appreciate the help!</p>
    <p>Erin</p>
