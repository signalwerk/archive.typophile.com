    html: |-
      <blockquote><p>Does that mean that I can re-draw my own version and use it commercially?</p></blockquote>
      <p>– Draw, not re-draw<br>
      – From the DIN 1451-2 standard sheets, yes, but not from the fonts DIN Mittelschrift and DIN Engschrift (from Adobe/Linotype), not from FF DIN or from most other commercially available versions of the DIN typefaces or designs that relate to them.</p>
      <p>To be more precise:<br>
      DIN 1451-2 is not a „design in the public domain“, it is a standard. Anyone may produce or design typefaces that relate to the standard.</p>
