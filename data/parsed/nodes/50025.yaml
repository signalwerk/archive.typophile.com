    <p>The Society of Typographic Aficionados (SOTA) is pleased to announce that <a href="/wiki/www.typecon.com" class="freelinking" rel="nofollow">TypeCon2009</a> will be held in Atlanta, Georgia, July 14-19, 2009.</p>
    <p>SOTA's going to be on location in Atlanta to meet with local crew and others interested in helping to develop the TypeCon2009 program and extracurricular activities. We are looking for volunteers and brainstormers from all walks of typographic, design, book arts, and lettering fields.</p>
    <p>Everyone is encouraged to join us for our first official local planning/brainstorming meeting for next year's conference. Refreshments will be served - please let us know if you are coming.</p>
    <p>Tuesday, October 14 | 6:30 pm<br>
    Center for Design Study<br>
    400 Trabert Ave<br>
    Atlanta,GA<br>
    Tel 404-607-8031<br>
    <a href="http://thecenterfordesignstudy.com/" title="http://thecenterfordesignstudy.com/">http://thecenterfordesignstudy.com/</a></p>
    <p>DIRECTIONS:</p>
    <p><a href="/wiki/a%20href%3D%22http%3A/%252Fmaps.google.com/maps%3Ff%3Dq%2526hl%3Den%2526q%3D400%2BTrabert%2BAve%2BNW%2C%2BAtlanta%2C%2BGeorgia%2B30309%2C%2BUnited%2BStates" class="freelinking" rel="nofollow">Directions to TypeCon2009 Meeting from Google Maps</a></p>
    <p>or</p>
    <p><a href="/wiki/a%20href%3D%22http%3A/%252Fthecenterfordesignstudy.com/contact.htm" class="freelinking" rel="nofollow">Directions to TypeCon2009 Meeting from Design Center Website</a></p>
    <p>Anyone interested is welcome to attend, but please RSVP in case we need more space/vittles.</p>
    <p>EMAIL<br>
    <a href="mailto:info@typesociety.org">info@typesociety.org</a> (Tamye Riggs at SOTA) AND Albert Whitley (Atlanta ground crew) <a href="mailto:albert@whitcreative.com">albert@whitcreative.com</a></p>
    <p>PHONE<br>
    Atlanta Center for Design Study - 404-607-8031<br>
    Tamye Riggs for SOTA - 510-748-0784<br>
    Albert Whitley for Atlanta TypeCon ground crew - 404-499-2190</p>
    <p>If you can't make it to this meeting but would still like to participate, please email us at <a href="mailto:info@typesociety.org" title="mailto:info@typesociety.org">mailto:info@typesociety.org</a>. Everyone is welcome in creating this amazing volunteer-driven event!</p>
    <p>Tamye Riggs, Executive Director, SOTA and TypeCon<br>
    Hank Richardson, Nancy Rorabaugh, Albert Whitley, and Joey Hannaford, Atlanta Site Committee Chairs</p>
    <p><a href="/wiki/www.typecon.com" class="freelinking" rel="nofollow">www.typecon.com</a></p>
