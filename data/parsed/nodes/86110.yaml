  html: |-
    <p>FontQA is reporting multiple errors (not merely warnings) with a face due to multiple dot suffixes (e.g. a.sc.alt). However, I'm unclear on why this should be a problem.</p>
    <p>Is this something which I can safely ignore, or is it crucial that there be only one suffix per glyph name? I frequently use multiple suffixes and have never run into problems. Are there situations which I am unaware of where this could be problematic. It doesn't seem to violate any specs that I'm aware of.</p>
    <p>André</p>
