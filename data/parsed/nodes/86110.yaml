    votes: null
    html: <p>This is fine. The only thing to be aware of is that Adobe's name parsing will ignore everything after the first dot, which in this case would be correct.</p>
    html_clean: <p>This is fine. The only thing to be aware of is that Adobe's name parsing will ignore everything after the first dot, which in this case would be correct.</p>
  - id: 479890
    user: 21687
    date: 2011-10-07T03:00:00
    date_raw: 7 Oct 2011 — 3:00am
    votes: null
    html: <p>The public version of FontQA is rather old, and tends to be over-critical ;) Plus some tests reflect FontFont's internal standards. But even FontFonts are allowed to have multiple glyph name suffixes nowadays.</p>
