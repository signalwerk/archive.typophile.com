    html: <p>Christos, if you ever have blown-out highlights on your jewlery and want to add back some color I have a tip. Change the mode of your photoshop file from RGB to LAB and add a layer in color mode and color the blown-out highlight. Then convert it to CMYK, it works. I read the article in Photoshop User magazine and still don't understand the technical reason it works but it does.</p>
