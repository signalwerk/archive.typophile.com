    html: <p>Thank you all for the immediate response. I really had a lot of ideas  <br>about this project and that gives you a hard time with all that logos. <br>I also found it difficult to decide which way to go (luckily there is a client to make the choice). <br> <br>About the font variations i really went a long way before i conclude to those i show.  <br>Of course millions of better choices could be done, but right now i want a first choice  <br>from the client, so then i can move on in more details about typography. <br> <br>Personally i would pick 1a, 3a,  4a and maybe 10. <br> <br>About the last one the concept is the generic image i have in my mind about jewel.  <br>I was thinking that the shape is not that important as the way it will be applied  <br>on different objects. I send a photo with a first trial on this direction to describe what i mean. <br> <br>christos <br> <br><img src="http://www.typophile.com/forums/messages/29/54260.jpg" alt=""></p>
    html_clean: <p>Thank you all for the immediate response. I really had a lot of ideas  <br>about this project and that gives you a hard time with all that logos. <br>I also found it difficult to decide which way to go (luckily there is a client to make the choice). <br> <br>About the font variations i really went a long way before i conclude to those i show.  <br>Of course millions of better choices could be done, but right now i want a first choice  <br>from the client, so then i can move on in more details about typography. <br> <br>Personally i would pick 1a, 3a,  4a and maybe 10. <br> <br>About the last one the concept is the generic image i have in my mind about jewel.  <br>I was thinking that the shape is not that important as the way it will be applied  <br>on different objects. I send a photo with a first trial on this direction to describe what i mean. <br> <br>christos <br> <br><img src="http://www.typophile.com/forums/messages/29/54260.jpg" alt=""></p>
