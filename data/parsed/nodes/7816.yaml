    html: "<p>From the choices you provided I like 1a, 2b, 3a. The symbol at #10 is very obscure, but if that was your idea, it is ok. Number 9 looks drastically modern to me and won't work for a gallery. #7 and #8 are pleasing, however, with a chinese tint. The symbols of #6 series are very welcoming, but you should work on the font choice. I like #5 least. Number 4 has some potential. <br>   From the choices I prefer 1a. <br> <br>In general, this work is outstanding. <br> <br>Salute</p>"
