  html: <p>Logo for a jewelry shop.  <br> <br>Not many clues, just that it is  <br>a gallery that exhibits top quality piecies  <br>from Gavello to small workshops around Greece. <br> <br>So, the prices are not always high,  <br>but what it matters is the good taste  <br>and the carefull selection of the exhibits. <br> <br>Here are the first roughs. I didn't work much  <br>on the colors but i would like to avoid  <br>the black-gold clic</p>
