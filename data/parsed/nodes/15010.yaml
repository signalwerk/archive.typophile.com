      <p>Fascinating PDF on the development of the face, thanks.</p>
      <p>My feeling is that the earlier version, more round with less contrast, would be better for text, but I am just guessing. The final version is extremely consistent and well thought out and beautifully executed. I don't warm to it, though this may be a matter of personal taste.</p>
