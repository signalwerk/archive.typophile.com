      <p>This is really fascinating, Frank. It seems that he had similar problems as I did when trying to "figure out" a typeface of this construction. It is really hard, for instance, to make it seem like certain glyphs don't fall over to the left. </p>
      <p>Personally I think the first version feels more like a text face, the high-contrast final version is not as nice. Still hard to tell without seeing text blocks of both side-by-side! I found the italics were also very tricky, almost unworkable. Still, it is very interesting to see the development, side by side, thanks!</p>
    html_clean: |-
