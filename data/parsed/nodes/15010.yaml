      <p>Erhard Kaiser has been in the trade for quite a long time now and sometimes this shows up in his designs. The trapping, not always completely consistent, has almost become a part of his hand. Therefore it is quite difficult to remove, but it does not bother me that much actually, especially considering the overall very high quality of Erhard’s designs. There is not much trapping in DTL Antares, but perhaps we will suppress it somewhat more before the typeface is officially released.</p>
      <p>To give you an idea how meticulously DTL Antares was developed, I have placed a small PDF at <a href="http://www.dutchtypelibrary.nl/PDF/Temp/Antares/DTLAntares_develop.pdf" title="http://www.dutchtypelibrary.nl/PDF/Temp/Antares/DTLAntares_develop.pdf">http://www.dutchtypelibrary.nl/PDF/Temp/Antares/DTLAntares_develop.pdf</a>. It shows for instance the first version, which was rounder with a lower contrast and the former and final versions with the high contrast.</p>
    html_clean: |-
