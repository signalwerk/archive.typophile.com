      <p>Insight into font development is always highly welcome - thank you!</p>
      <p>The earlier more round version is indeed more appealing when looking at large glyphs; but this is a text face, and I have a strong hunch that the final version is more "true" to what needed to be done. And this ties in to my view that a true text face needs a certain subtle ugliness to really click.</p>
      <p>hhp</p>
