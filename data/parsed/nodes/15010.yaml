    html: |-
      <p>Prokyon looks like something I'd have done to Gill Sans models ten years ago. The difference is these types are very well drawn, but it seems to me such radical stylistic choices seriously limit their applicability.<br>
      It seems to me they become quickly very tiring on the eye.<br>
      The lc a of the Italic is even more problematic than the one in my own Ottomat. It's like the one in Dax Italic.</p>
      <p>I say these things because, being DTL releases, I guessed they may have been thought as text-aimed. Or are they meant more as display types?</p>
      <p>Please, Hrant, note I used the term "display types". I happily see how I've changed (and still changing).</p>
