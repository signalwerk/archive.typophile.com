      <p><cite>"Sneaking dissonance is what keeps things interesting in life, isn’t it?"</cite><br>
      Well, that's not up to you and me to decide in this case, but the typographer in charge, who asked quite clearly for recommendations. I understood he wanted a punch, not a sneak. :)<br>
      I'm aware of the overlap/blur between constructivism seen as revolutionary, and modularity seen as stifling and monotonous – super-interesting stuff actually. Tschichold's own change of stance in this regard is maybe the best proof of this.<br>
      But there is still a difference in freshness to my understanding, in (historical) edginess; wouldn't you agree that it'd be equally unfitting to see DIN on Russian Constructivist posters as it would be to see Iwan Reschniev on traffic signs?<br>
      But maybe everyone "draws the line" somewhere else in this case.</p>
