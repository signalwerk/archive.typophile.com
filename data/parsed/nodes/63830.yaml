      <p><cite>"You dismiss the DIN-knock-off and recommend a geometrically constructed typeface?"</cite><br>
      Yes.<br>
      It's not just about tangible formal principles; fonts evoke cultural contexts.<br>
      DIN (and its knockoffs) say standardization, bureaucracy, rules, norms –<br>
      that's the context DIN was developed in/for. Iwan Reschniev stems from Tschichold's New Typography, a strongly ideological movement (plus its constructivist approach, to me, links back to Russian propaganda æsthetic,<br>
      which no doubt is a "revolutionary" context). </p>
      <p><cite>"Thinking about it, setting REVOLUTION in DIN Engschrift adds an interesting layer to this rather beaten term, don’t you think?"</cite><br>
      I was under the impression that the original poster wants a font that speaks in unison with the content, not one that adds a sneakily dissonant second layer.</p>
