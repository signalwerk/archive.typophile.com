    html: |-
      <p>They exist. Whitney by H&amp;FJ and Avenir Next by Linotype all have small caps. In fact, a good number of new(er) Sans Serifs usually include small caps and old style figures.</p>
      <p>As for your font, you could try Trade Gothic (or if you have lots of money, Benton Sans, or alternatively, one of the other "gothics" ie. News or Franklin) or Akzidenz Grotesk. Both have straight leg 'R's, and at bold weight, look pretty robust.</p>
    html_clean: |-
