  html: |-
    <p>I'm looking for a bold (or so) weighted sans serif that has a punch--the word to be typeset is "REVOLUTION." </p>
    <p>But it should have a small caps to go with it.</p>
    <p>In particular the leg of the R need to be straight, not curved.</p>
    <p>Does anyone know any fonts that might fit this bill? </p>
    <p>Thanks in advance</p>
