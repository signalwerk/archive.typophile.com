    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Ductus</strong></p>
    <p>Ductus is the path the writing implement makes in forming a letter. Typefaces are formed by other tools than the (broadnibbed or flexical) pen, but the contrast patterns of the shapes that are constructed in type traditionally paraphrase the shapes formed by the stroke of the pen. Every typeface that deliberately imitates the broadnibbed pen has (or borrows) a ductal&nbsp;logic.</p>
    <p>See also <a href="/node/40402" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Modulation</a>, <a href="/node/13878" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ductal logic</a>.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/33869">Greek&nbsp;Ductus</a></p>
