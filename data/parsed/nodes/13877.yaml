    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Ductus</strong></p>
    <p>Ductus is the path the writing implement makes in forming a letter. Typefaces are formed by other tools than the (broadnibbed or flexical) pen, but the contrast patterns of the shapes that are constructed in type traditionally paraphrase the shapes formed by the stroke of the pen. Every typeface that deliberately imitates the broadnibbed pen has (or borrows) a ductal logic.</p>
    <p>See also <a href="/wiki/Modulation" class="freelinking" rel="nofollow">Modulation</a>, <a href="/wiki/Ductal%20Logic" class="freelinking" rel="nofollow">Ductal Logic</a>.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/33869" rel="nofollow">Greek Ductus</a></p>
