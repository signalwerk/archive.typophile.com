      <p>Matt, there are two additional possibilities I know of from students in the master's programs at the University of Reading and KABK: Joke Gosse's <a href="http://www.typefacedesign.org/resources/A5specimen/2008/JokeGosse_Melville_specimen.pdf" rel="nofollow">Melville</a> and Emma Laiho's <a href="http://typemedia2011.com/emma" rel="nofollow">Taiga</a>. Not sure about the licensing situation with them, but you could try getting in touch.</p>
      <p>Since I was just looking for multiple-italic faces, I'll add two more to the thread:<br>
      Laure Afchain's <a href="http://typemedia09.com/index.php?/graduates/laure-afchain" rel="nofollow">Malaussene</a> (student typeface at KABK; translation version released at <a href="http://fonts.gestalten.com/malaussene-translation.html" rel="nofollow">Gestalten</a>) and Florian Schick's <a href="http://typemedia2011.com/florian" rel="nofollow">Mag Grotesque</a> (student typeface at KABK).</p>
