    html: |-
      <p>I don't know whether you're aware of it, but word "svoboda" means FREEDOM in Slovenian (and probably in some other Slavic languages as well) where this word most probably comes from if owners are Austrian and their surname is Svoboda (which wouldn't be unusual).</p>
      <p>Maybe word FREEDOM will give you some nice ideas. It should also go very well with cycling because cycling in its inherent nature is very free.</p>
      <p>Apart from this fact I think that /O/ glyphs that form bike wheels are too heavy, because they look like a motorbike and not bicycle. Space between the two /O/ also implies this is a motorbike and not a bicycle.</p>
      <p>And BTW: This thread should be in Forum/Critique/Logos instead of Forum/Design... All logos are discussed there. Maybe some admin can move it.</p>
