  - id: 460327
    user: 14722
    date: 2011-04-15T11:17:00
    date_raw: 15 Apr 2011 — 11:17am
    votes: null
    html: <p>I think the problem with Gotham in this case is that the style of the logo makes one think of old logos like this set in Futura or Helvetica. So you end up with a logo that seems to be settling in-between those two, or worse, looks like an imitation with a weird version of Helvetica or Futura. Something closer to Futura and less American gothic would be better; perhaps Neutraface No. 2 or Brandon Grotesque.</p>
    html_clean: <p>I think the problem with Gotham in this case is that the style of the logo makes one think of old logos like this set in Futura or Helvetica. So you end up with a logo that seems to be settling in-between those two, or worse, looks like an imitation with a weird version of Helvetica or Futura. Something closer to Futura and less American gothic would be better; perhaps Neutraface No. 2 or Brandon Grotesque.</p>
