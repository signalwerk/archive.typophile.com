      <p>Hello James,</p>
      <p>As mention earlier by Robert(litera) 'svoboda' means freedom. I personally think that the word 'svoboda' itself is very powerful and would work on it's own, if treated well typographically. If I were you, I would do the symbol separately based on the name of the company. It could be something abstract.</p>
      <p>Currently your logo reminds me more of a company that sells asphalt compactors rather then bicycles. Esthetically it's not pleasing as well. </p>
      <p>Regards,<br>
      SB</p>
