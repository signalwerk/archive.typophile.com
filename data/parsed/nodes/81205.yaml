    <p>Hi all. I've been asked to design a logo for a local bike store and while I think the concept I came up with is quite solid, it still feels as if something is off. I'm not trying to ask anybody to do the work for me, but it would be nice if you could point out any obvious flaws. I'm quite new to the design process and after staring at this image for so long, I just don't know anymore. I'd be thankfull for any advice. </p>
    <p>The store sells exclusively KTM bikes, a (middle- to upperclass) Austrian bicycle brand. The orange in the logo is the KTM orange. </p>
    <p>(Sorry for my English, it isn't my native language)</p>
