      <p>Type in #4 works best, but logo is too busy. Logo #1 is very good. Although I might try to use F^3 because number 3 can be mirrored with very similar geometric shape. And to maybe make /F/ more similar to /E/ (inverted /3/) I might write it as /F./ on 3...</p>
      <p>But to make it sufficiently fine to combine with type it would rather be inverted in a square. And use #4 type as mentioned.</p>
