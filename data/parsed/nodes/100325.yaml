      <p>I'm not sure that references to physical film are as relevant as they used to be; aren't most young independent directors shooting video these days? </p>
      <p>But anyway, the versions that slope look more energetic to me, and I'd suggest italic type that matches the same angle. </p>
      <p>Have you explored putting the type inside the graphic? Maybe change the proportions so it's like a single frame from a movie's title.</p>
