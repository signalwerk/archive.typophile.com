    html: |-
      <p>BTW Brian, the old book "Rookledge's International Typefinder" has a diagnostic visual key scheme to use attributes of letters to identify typefaces with those features. It's excellent, but it was published in 1983, so the typefaces are truly 'classic', and many have not made it into digital form. The collection of Serif fonts in my edition reaches 240 typefaces. I think these is a later edition of the book, but still with fewer than 300 serif families shown. There are only 50 Sans Serif families in the next section of the book, although more are found under Display headings.</p>
      <p>Identifont does try to use a similar scheme allowing you to select attributes for a subset of letters, but I have found it very unreliable about using the information you give it, as if some of the algorithm code is messed up. Many times the selections are not even close to your choices.</p>
      <p>My Serif and Sans Guides use a limited set of Key letters for you to select structural attributes, and tries to show you all the catalogued fonts that have those attributes for the letters you specified. You use the visual comparisons to pick the right font from the choices shown.</p>
      <p>- Mike Yanega</p>
