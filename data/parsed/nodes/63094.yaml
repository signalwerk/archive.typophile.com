    <p>Hi people,<br>
    I was wondering if there is a website or book or guide of any kind that highlights specific details of a typeface which clearly identifies it. Such as... the leg of the capital R helps to identify Gill Sans, or whatever.<br>
    I feel like I'm slowly getting better at doing this, but a guide would great to have.</p>
    <p>Thanks.<br>
    brian</p>
