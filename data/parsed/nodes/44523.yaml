    <p>I’m not one to talk a lot of politics, but feel it necessary to remind all the registered Pennsylvania Typophiles to get out and vote. Especially so, if you’re a Democrat.</p>
    <p>I’m an Obama guy myself. Don’t let that sway you, it’s more important that you vote period!</p>
    <p>Need Help: <a href="https://web.archive.org/web/20080706085543/http://www.dos.state.pa.us/voting/" title="http://www.dos.state.pa.us/voting/">http://www.dos.state.pa.us/voting/</a></p>
    <p>Even if you’re not registered, still attempt. They’ll help you fill out a provisional, and a registration form, so that you can vote in November.</p>
    <p></p><div class="imageWrap"><img src="/web/20080706085543im_/http://www.typophile.com/files/vintage-retro-123_5731.jpg"></div><p></p>
