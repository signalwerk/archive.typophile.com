      <p>You wrote:<br>
      ’avant garde font was made specifically for avant garde magazine? what a gorgeous magazine... wow’</p>
      <p>Actually, Herb Lubalin designed a logo for the AvantGarde Magazine, and this became later the typeface. The original by Letraset for instance had very interesting alternatives, which were not easily available digitally until recently. At ITCfonts.com you can see them now in the AvantGarde Pro series. But when you look at (old Letraset catalogues and) the ElsnerFlake EF alternative designs, you will see a few very distinct letters (e, v, w, y) that did not make it to the Pro obviously.</p>
      <p>Many gorgeous headlines and logos resulted, and i am sure that you will find samples everywhere. Although it seems that AvantGarde is not extensively used recently.</p>
