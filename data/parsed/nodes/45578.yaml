      <p>Some of the more classically-cited examples for some:</p>
      <p>Cooper Black: You’ve gotta go with the Beach Boys’ <a class="freelinking-external" href="http://homepage.mac.com/john_kruper/artwork/beach_boys/pet_sounds.jpg">Pet Sounds</a> album. It single-handedly revived Cooper Black.</p>
      <p>Joanna: A lot of J.Crew’s signage <a class="freelinking-external" href="http://www.mooneythinks.com/images/jcrew_weddings.jpg">uses Joanna</a> to great effect. Also, Obama’s campaign signs are set in Joanna, if I’m not mistaken.</p>
      <p>Optima: You can’t find a better example of Optima than the <a class="freelinking-external" href="http://www.thedctraveler.com/wp-content/uploads/2007/09/vietnam-veterans-memorial.jpg">Vietnam Veterans Memorial.</a></p>
      <p>Trajan: Any movie ever.</p>
      <p>Univers: The <a class="freelinking-external" href="http://www.mapsofworld.com/olympic-trivia/images/olympic-emblem/munich1972.gif">Munich Olympic logo</a> was set in Univers.</p>
