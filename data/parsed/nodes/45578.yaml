      <p>Hi Emily!<br>
      Yes, this request is way too broad, sorry. One or maybe two typefaces – okay. Everything else is really time-consuming. You could at least state what you have found yourself, so far, or what medium/period etc. you are focussing on. See also <a href="http://typophile.com/node/45208">this similar request</a>.</p>
      <p>All I can do is give some general advice for finding typefaces in use:</p>
      <p><a href="http://www.typophile.com/node/12344">Search typophile.com</a>. Most of the faces you need have been asked for before. There’s a <em>lot</em> to find.</p>
      <p>Linotype.com has a pretty neat <a href="http://www.linotype.com/2106/byalphabet.html">in use section</a>.</p>
      <p>A lot of other foundries maintain such showcases aswell.</p>
      <p>Especially if you’re looking for images, <a href="http://www.flickr.com/search/?ss=1&amp;ct=6&amp;w=all&amp;q=palatino+font&amp;m=text">searching Flickr</a> (or similar services) has proven helpful, to me. You might try adding ‘font’ or ‘type’ to your query, when searching for short/ambiguous terms like ‘Arnhem’, ‘Bell’ or ‘DIN’.</p>
      <p>F</p>
