      <p>Hi Thomas,</p>
      <p>Yes, I know that. It also will not do because of the italics. There are some occasional italics in the texts but they need to be much more subtle than Joanna's. Whitman is the classic alternative but then again it does not relate particularly to the concept of utopia, does it? </p>
      <p>Utopia makes me think more of timelessness and perfection which clashes a bit with the "contemporary" idea.</p>
      <p>Iowan Old Style is a possibility...</p>
      <p>One idea was to use Hypatia Sans for titles so the solution could be a serif that works well with Hypatia.</p>
