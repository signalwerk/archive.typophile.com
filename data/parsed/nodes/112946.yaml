      <p>William Morris’ <em>News From Nowhere</em> was set in his Golden Type, a Jenson revival of sorts. </p>
      <p>But I don’t think that any revival made today is really timeless, referring as it does to its original’s time and place of conception.</p>
      <p>Rather, I would say that a new design informed by traditional precepts is less tied to a speciﬁc time and place in history.</p>
      <p>Therefore I would recommend my own Richler, a “book face” that combines some contemporary principles of readability with elements of the classic old-style or antiqua genre.</p>
      <p><a href="http://origin.myfonts.com/s/aw/original/211/0/108166.pdf" title="http://origin.myfonts.com/s/aw/original/211/0/108166.pdf">http://origin.myfonts.com/s/aw/original/211/0/108166.pdf</a></p>
