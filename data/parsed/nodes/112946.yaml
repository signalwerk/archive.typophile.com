    <p>Hi everybody,</p>
    <p>I am designing a book series of utopian novels. There will be some classics of the genre and some less known books. Most of the novels are late 19th century but not all. I have to decide on the main typeface that will be used for the text. The texts will be in English with no other language requirements.<br>
    The concept of an "utopian" book typeface intrigues me but I have not reached any conclusion yet so I would like some suggestions.</p>
    <p>I would prefer to use a relatively new typeface and so give some money to a living designer and not just Adobe. Also a kind of "contemporary" look (whatever that may mean) is part of the brief.</p>
    <p>For no particular reason I am drawn to the idea of using something like Joanna...</p>
