      <blockquote><p>I would prefer to use a relatively new typeface and so give some money to a living designer and not just Adobe. Also a kind of "contemporary" look (whatever that may mean) is part of the brief.</p></blockquote>
      <p>If by "contemporary" you mean letterforms that aren't classical, take a look at Skolar. It's reasonable without being too abysmally clunky</p>
      <p>(See  <a href="http://media.caranddriver.com/images/12q4/492040/2014-gmc-sierra-1500-all-terrain-photo-497174-s-1280x782.jpg" title="http://media.caranddriver.com/images/12q4/492040/2014-gmc-sierra-1500-all-terrain-photo-497174-s-1280x782.jpg">http://media.caranddriver.com/images/12q4/492040/2014-gmc-sierra-1500-al...</a> for an ostensive definition of "abysmally clunky")</p>
      <p>Huronia has a similar contemporary look, vis a vis letterforms. (Rosetta distributes Huronia, but it is a Tiro Typeworks design.) Both families have Greek, though I'm not competent to judge how good any contemporary Greek font is -- and Huronia had, as of 2012, Greek in the roman only.</p>
      <p><a href="http://www.rosettatype.com/Skolar" title="http://www.rosettatype.com/Skolar">http://www.rosettatype.com/Skolar</a><br>
      <a href="http://www.rosettatype.com/Huronia" title="http://www.rosettatype.com/Huronia">http://www.rosettatype.com/Huronia</a></p>
      <p>By the way, be careful of fonts with newish letterforms -- IMSLTHO letterforms are less than half of what an effective font is about, unless you're selling a product and need brand identity or some such. General spacing and the way letters fit together is far more important. Of the "contemporary" fonts, the two above at least meet that test. </p>
      <blockquote><p>For no particular reason I am drawn to the idea of using something like Joanna...</p></blockquote>
      <p>Well, except for the fact that it's been described as "so 1990s," Scala is quite reminiscent of Joanna. This, as with so many fonts designed for printing from repro-negative-plate, comes out a bit light with current direct-to-plate printing. </p>
      <p>Many examples of this effect, one I'm reading right now (set in Scala)  -- <cite>Mountains Beyond Mountains</cite>, Tracy Kidder's book about Paul Farmer, which any library should have. (See a Random House first edition, any printing.)</p>
      <p><cite>Edit</cite> -- if the publisher is planing an ebook in a pdf version (unlikely) stick with Adobe fonts, or do some serious checking on EULAs. Aside from Adobe, almost everyone else charges extra for embedding fonts for commercial use, such as a pdf ebook. Been there,  got the T-shirt...</p>
