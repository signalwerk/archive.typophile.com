      <p>Hi Agiedo,</p>
      <p>I'm not sure if you or your client would be open to this but, I would chop/reduce the width of the cross on the 't' in 'Consulting' if I were you. There seems to be a little ugly white dot developing in-between the 'l' and 't'.</p>
