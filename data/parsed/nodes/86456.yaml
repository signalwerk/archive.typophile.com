      <p>for 'Consulting'  - move 'Co' a bit closer to 'nsulting' and the 'g' creeping away</p>
      <p>for 'Baptiste' - move 'B' a bit closer to 'aptiste' </p>
      <p>just a little for both...</p>
      <p>Best way my professor describes it. Look at 3 groups letters at a time... if 2 of the 3 letters seem more friendly then space them so all 3 are evenly friendly.</p>
      <p>Example of how you would do this:<br>
      for Baptise:<br>
      1. Bap<br>
      2. apt<br>
      3. pti<br>
      4. tis<br>
      5. ist<br>
      6. ste</p>
      <p>for Consulting:<br>
      1. Con<br>
      2. ons<br>
      3. nsu<br>
      4. sul<br>
      5. ult<br>
      6. lti<br>
      7. tin<br>
      8. ing</p>
