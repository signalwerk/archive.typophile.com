    html: <p>Hi. To my eye, the problem in the first (manually kerned) logo is that it looks like you made everything as tight as possible; rather than making the rhythm/pattern regular. That makes it look irregular and a bit cramped. For example in «Consulting» the "on" and "ul" and "in" are too close together compared to the space around the "t" – which of course cannot be made much tighter, so it stands out like a bit of a gap. IMO the idea should be to harmonize and balance the spaces between the letters.</p>
    html_clean: <p>Hi. To my eye, the problem in the first (manually kerned) logo is that it looks like you made everything as tight as possible; rather than making the rhythm/pattern regular. That makes it look irregular and a bit cramped. For example in «Consulting» the "on" and "ul" and "in" are too close together compared to the space around the "t" – which of course cannot be made much tighter, so it stands out like a bit of a gap. IMO the idea should be to harmonize and balance the spaces between the letters.</p>
