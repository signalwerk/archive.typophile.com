    <p>I need some help identifying this font –&nbsp;it's a bit of an odd one. I thought it'd be super easy to find it because of its distinctive features but despite trying the obvious search words (decorative, dots, swirls, Victorian, display, retro etc), but so far I've failed to find it. </p>
    <p>The closest I've got so far is this shoddy traced free font, but it won't really do: </p>
    <p><a href="http://www.fontspace.com/furdzville/nocker" title="http://www.fontspace.com/furdzville/nocker">http://www.fontspace.com/furdzville/nocker</a></p>
    <p>Thanks very much in advance!</p>
