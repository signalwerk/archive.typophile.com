    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WebFonts_5639.jpg"></div><p></p>
    <p><strong>Monotype Imaging Adds Omnibus, Emboss and Tour de Force Collections Plus Over 500 Fonts to Fonts.com Web Fonts</strong></p>
    <p><strong>Selections from a Variety of Foundries Expand Diversity of Web Font Offering, Now at 11,000+ Fonts</strong></p>
    <p>Monotype Imaging, a leading global provider of text imaging solutions, has introduced more than 500 Web fonts to its <a class="freelinking external" href="http://webfonts.fonts.com/" rel="nofollow">Fonts.com Web Fonts</a> offering, now featuring more than 11,000 Web fonts. New fonts include selections from three type foundries recently added to Fonts.com Web Fonts: Omnibus, Emboss Fonts and the Tour de Force Font Foundry. </p>
    <p>In addition, the Klint™ Rounded typeface has been added from Monotype Imaging’s Linotype® Library, as well as ITC® fonts featuring extended character sets for supporting multiple languages. Among the ITC additions is the ITC Avant Garde Gothic® face, the iconic sans serif design based on the logo for Avant Garde magazine, popular in the late 60s and early 70s in the New York advertising and editorial art communities. </p>
    <p>“Our rich collection of Web fonts continues to grow,” said Chris Roberts, vice president of marketing at Monotype Imaging. “We’re dedicated to providing a continually expanding range of exceptional typefaces, from the biggest brands in type to new, contemporary trendsetters. Whether it’s the classic Helvetica® or Trade Gothic® faces you need, storied typefaces from the past or emerging designs of the present, we’re here to meet every Web font requirement – as easily as possible.” </p>
    <p>New additions from Omnibus include more than 250 typefaces, including the Vega™ family by designer Franko Luin, who describes his design as a free interpretation of 16th and 17th century typefaces, suitable for books and other text settings in addition to the Web. New from Stephen Boss’s Emboss foundry are 42 fonts, including the Crossell™ display design, which was inspired by linoleum cuts and old comic strips, according to Boss. Also new are 47 selections from Slobodan and Dusan Jelesijevic’s Tour de Force foundry. Featured designs include the Oblik™ typeface, a modern face available in serif and sans serif variations for lending personality to text. </p>
    <p><strong>About Fonts.com Web Fonts</strong></p>
    <p>Monotype Imaging’s Fonts.com Web Fonts solution enables thousands of high-quality fonts to be used in Web page design. Typefaces include some of the world’s most renowned designs used in branding and advertising, such as the Helvetica, Frutiger® and Univers® faces, available as Web fonts exclusively from Fonts.com Web Fonts. Typefaces are added on an ongoing basis from the company’s Monotype®, Linotype and ITC font collections, in addition to fonts from contributing type foundries and independent designers. </p>
    <p>Three subscription plans are available: free, standard and professional. The no-fee plan includes more than 3,000 fonts that can be used on an unlimited number of websites for up to 25,000 page views per month. Both the standard and professional plans provide access to more than 11,000 fonts and feature several flexible page view allowance options, starting at $10 and $100 per month, respectively. In addition to a recently released self-hosting option, professional tier subscribers may also receive up to 50 “desktop downloads” each month – fonts that can be used for the creation of Web page mockups in applications such as Adobe® Photoshop® and Illustrator® software. Complete details and pricing are available at Fonts.com Web fonts. </p>
    <p>Monotype Imaging’s Web font service complies with W3C (World Wide Web Consortium) specifications for deploying server-based fonts and supports all major browsers. </p>
    <p>Fonts.com Web Fonts is also accessible from the homepage of Fonts.com, which offers more than 160,000 font products. Included are the downloadable versions of Monotype Imaging’s latest Web font additions, which may be licensed separately for use in desktop applications. </p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype, Linotype and ITC typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype, Trade Gothic, Frutiger and Univers are trademarks of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. Klint is a trademark of Linotype Corp. and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC and ITC Avant Garde Gothic are trademarks of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Crossell is a trademark of Emboss Fonts. Vega is a trademark of Omnibus. Oblik is a trademark of Tour de Force Font Foundry. Adobe, Photoshop and Illustrator are trademarks or registered trademarks of Adobe Systems Inc. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Inc. All rights reserved.</p>
