  html: |-
    <p>Some time ago in a book store I saw a very charismatic,<br>
    but traditional serif typeface.</p>
    <p>It used diamond shaped dots.<br>
    Semicolon also used diamond instead of a dot.<br>
    There was a lot of ligatures used also.</p>
    <p>Unfortunately, that's all I can recall.</p>
    <p>Which font it might be?</p>
    <p>TIA</p>
    <p>--<br>
    best regards</p>
