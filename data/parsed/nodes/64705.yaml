      <p>Warnock does have diamond dots. So do the following (a partial list of serifs browsed at MyFonts): FB Spira, Centaur, Iowan Old Style, Andralis ND, LTC Deepdene, Goudy Oldstyle, LTC Metropolitan, Benicia (Parkinson), Bertham Pro, P22 Mai, LTC Hadriano, Caxton, RTF Cotillion and Priori Serif.</p>
      <p>All you have to do is set a sample of type with various glyphs involving dots and then scroll away with 'serif' as the search term.</p>
      <p> - Mike Yanega</p>
