    <p>Hello FontFans!</p>
    <p>I'm back with another request.  The community has been very helpful and I'd appreciate one more question:</p>
    <p>This time, I'm trying to find a font that looks similar to the twix font</p><div class="imageWrap"><img src="http://typophile.com/files/twix.jpg"></div><p></p>
    <p>I'm sure the logo itself was done as an in-house custom job, but if anyone could recommend a font that looks similar, I would definitely appreciate it.  I've been searching online for quite some time and haven't come across anything yet.</p>
    <p>Thanks!<br>
    -Brian</p>
