    <p>Hello, </p>
    <p>I’m in the final stages of developing this logo for my client. I am now stuck on finding a colour scheme that would most effectively define his service of teaching online jazz piano lessons. So, please review my 6 semi-final logos and let me know what colour scheme represnets JAZZ the most. If you don’t like any of them, then please let me know of another 3-colour RGB colour scheme. </p>
    <p>Thanks!!!</p>
    <p>Brian</p>
