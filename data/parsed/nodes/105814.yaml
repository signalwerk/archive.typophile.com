  html: |-
    <p>Dez Squeeze Pro is a display family in seven bold widths. Choose the width that fits the space available for your headline. Dez Squeeze Pro is a very bold display face with multiple language support, nearly 600 glyphs, stylistic sets, Unicase, and many alternates. Dez Squeeze Pro is Bold enough for knock-out photographs, so go ahead, knock yourself out.<br>
    Currently on MyFonts but other places soon <a href="http://www.myfonts.com/fonts/dezcom/dez-squeeze-pro/" title="http://www.myfonts.com/fonts/dezcom/dez-squeeze-pro/">http://www.myfonts.com/fonts/dezcom/dez-squeeze-pro/</a></p>
