    html: |-
      <p>To duplicate the lettering using a font would take a lot of editing in illustrator or whatever program you might prefer for designing with vectors. If you do tackle the project there are a variety of candidates in the heavy "bulbous serif" category that you could use as a starting point. In no particular order:<br>
      Goudy Heavyface [Several digitizations] by Frederic W. Goudy 1925:<br>
      <a href="http://www.myfonts.com/search/Goudy+heavyface/" title="http://www.myfonts.com/search/Goudy+heavyface/">http://www.myfonts.com/search/Goudy+heavyface/</a><br>
      Gator by Canada Type, based on Poppl Heavy by Friedrich Popppl:<br>
      <a href="http://www.myfonts.com/fonts/canadatype/gator/" title="http://www.myfonts.com/fonts/canadatype/gator/">http://www.myfonts.com/fonts/canadatype/gator/</a><br>
      Robur  by Canada Type, based on a Georges Auriol design from 1909:<br>
      <a href="http://old.myfonts.com/fonts/canadatype/robur/" title="http://old.myfonts.com/fonts/canadatype/robur/">http://old.myfonts.com/fonts/canadatype/robur/</a><br>
      Henriette Black by Typejockeys:<br>
      <a href="http://www.typejockeys.com/fonts/Henriette" title="http://www.typejockeys.com/fonts/Henriette">http://www.typejockeys.com/fonts/Henriette</a><br>
      Windsor, originally by Stephenson Blake circa 1905:<br>
      <a href="http://www.myfonts.com/search/windsor/fonts/" title="http://www.myfonts.com/search/windsor/fonts/">http://www.myfonts.com/search/windsor/fonts/</a><br>
      Verona by Typeshop [VeronaSB is a different design]:<br>
      <a href="http://www.myfonts.com/fonts/ef-typeshop/verona/" title="http://www.myfonts.com/fonts/ef-typeshop/verona/">http://www.myfonts.com/fonts/ef-typeshop/verona/</a><br>
      Lamp Post JNL<br>
      <a href="http://www.myfonts.com/fonts/jnlevine/lamp-post/" title="http://www.myfonts.com/fonts/jnlevine/lamp-post/">http://www.myfonts.com/fonts/jnlevine/lamp-post/</a><br>
      Krazy Kracks NF by Nick Curtis based on Carl Holmes lettering:<br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/krazy-kracks-nf/" title="http://www.myfonts.com/fonts/nicksfonts/krazy-kracks-nf/">http://www.myfonts.com/fonts/nicksfonts/krazy-kracks-nf/</a><br>
      Ziggy by Mickey Rossi:<br>
      <a href="http://www.dafont.com/search.php?q=ziggy&amp;text=MerlinRocket" title="http://www.dafont.com/search.php?q=ziggy&amp;text=MerlinRocket">http://www.dafont.com/search.php?q=ziggy&amp;text=MerlinRocket</a><br>
      Don</p>
