    <p>Hello? <br>Maybe this is too easy, I dunno, but anyway: <br><img src="http://www.typophile.com/forums/messages/83/18733.gif" alt="Madeleine (Mecanorma)"> <br>Found this in a Mecanorma catalog from 1975. I've seen it used (The Donnas logo most recently), so it must exist as a font, but haven't found it. Tried using WhattaFont too, but no luck. <br> <br>Help much appreciated - love you guys!</p>
