    html: "<p>It seems that the Donnas' logo (<a href=\"http://www.thedonnas.com/htm/site.htm\" target=\"_blank\">http://www.thedonnas.com/htm/site.htm</a>) and your sample aren't quite the same font.  The Donnas' logo looks like an obliqued and bolded version of Octopuss:  <a href=\"http://www.myfonts.com/fonts/linotype/octopuss/octopuss/testdrive.html?s=the%2BDonnas&amp;p=72\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/octopuss/octopuss/testdrive.html?s=the+Donnas&amp;p=72</a>.  However, unfortunately, Octopuss is not the font of your sample (see:  <a href=\"http://www.myfonts.com/fonts/linotype/octopuss/octopuss/testdrive.html?s=Madeleine&amp;p=72\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/octopuss/octopuss/testdrive.html?s=Madeleine&amp;p=72</a>).  I was excited, because, at first, I thought Madeleine would be found with the Donnas and Octopuss  ... but she seems to be  somewhere else.</p>"
    html_clean: "<p>It seems that the Donnas' logo (<a href=\"http://www.thedonnas.com/htm/site.htm\" target=\"_blank\" class=\"link-external\">http://www.thedonnas.com/htm/site.htm</a>) and your sample aren't quite the same font.  The Donnas' logo looks like an obliqued and bolded version of Octopuss:  <a href=\"http://www.myfonts.com/fonts/linotype/octopuss/octopuss/testdrive.html?s=the%2BDonnas&amp;p=72\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/linotype/octopuss/octopuss/testdrive.html?s=the+Donnas&amp;p=72</a>.  However, unfortunately, Octopuss is not the font of your sample (see:  <a href=\"http://www.myfonts.com/fonts/linotype/octopuss/octopuss/testdrive.html?s=Madeleine&amp;p=72\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/linotype/octopuss/octopuss/testdrive.html?s=Madeleine&amp;p=72</a>).  I was excited, because, at first, I thought Madeleine would be found with the Donnas and Octopuss  ... but she seems to be  somewhere else.</p>"
