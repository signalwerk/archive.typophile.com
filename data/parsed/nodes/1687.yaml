    html: <p>Octopuss does come very close. It did fool me in the Donnas logo at least <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> But still, how I wish she could be found... Madeleine, with her more evenly weighted contours is a bit more to my own liking than the slightly rubbery "quirkyness" of an Octopuss. <br> <br>Seems strange to me that WhattaFont didn't even list Octopuss among the many suggestions it gave me. Well, you know what they say:"The best font ID technologies can't match the eye of a typophile"! <br> <br>Thanks for the help!</p>
