      <p>The last sentence from <a href="https://listserv.heanet.ie/cgi-bin/wa?A2=typo-l;58h0xQ;199807271144420700">Sean Cavanaugh's justification for the FontSite fonts</a> says a lot:</p>
      <p><cite>You have to keep in mind that holding a copyright does not preclude one from entering into licensing and distribution arrangements as many companies did with URW.</cite></p>
      <p>Sean firmly maintains that he has been granted a distribution license to many URW/ATF/Softmaker fonts when he was employed by SoftMaker/ATF.  And I remember buying his book when I graduated college in the mid nineties that included many of these fonts in the jacket CD. He's been distributing them for a long time.</p>
      <p>Have you considered contacting FontSite and asking directly?</p>
