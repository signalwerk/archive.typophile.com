    <p>Hello Typophiles,<br>
    I noticed some days ago Fontsite Inc. released a font using a name already used by another typographer I know. Looking further, we realised the Fontsite’s font is a copy of Excoffon’s Mistral (!)<br>
    In the meantime Fontsite slightly changed the font name and re-edited here<br><a href="http://www.fontspring.com/fonts/fontsite/malacca">http://www.fontspring.com/fonts/fontsite/malacca</a><br>
    Looking deeper in the list of proposed fonts <a href="http://www.fontspring.com/search?q=fontsite+inc">http://www.fontspring.com/search?q=fontsite+inc</a><br>
    is seems most of them are copies.<br>
    Or I am wrong?</p>
