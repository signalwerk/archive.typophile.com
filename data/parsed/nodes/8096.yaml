    html: <p>&gt; since no other software manufacturer does that. <br> <br>Especially for educational purposes we developed the free Light version of DTL FontMaster. In comparison with the full version there are a few limitations, like the size of the font databases which are restricted to 256 glyphs. And it does not allow you to generate TrueType or OpenType fonts. <br> <br>Obviously DTL FontMaster is not really a program for the rest of us; it has a somewhat steep learning curve. Personally, I don't think that any other program matches the capabilities of FM when it comes to font database handling (for instance the exchange of data between databases) and batch processing, especially with the OpenType production in mind. Not everybody needs to handle large amounts of data though.  <br> <br>Practically no end user will be interested in the tool that was used for the production of the purchased font; the font should be well made and reliable. For the font manufacturer the production has to be controllable and economical. For most font manufacturers other programs than DTL FontMaster seem to be sufficient. What scares me though, is that sometimes in the educational world but also at font related technical events there seems to be a sort of mono culture nowadays. I admit that we do the same at the DTL FontMaster Conferences, but the naming of the event is in this case clear.</p>
