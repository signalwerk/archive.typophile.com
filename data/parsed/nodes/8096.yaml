  html: <p>Hello, <br> <br>I am a graphic design student and I'm quite smitten with type. I've noodled over type in Illustrator before, but I'm thinking of becoming more serious and buying a proper type editing app. The obvious choices are FontLab or its little brother TypeTool. If I really become obsessive about this, I'm affraid I'll outgrow TypeTool, but I don't want to buy FontLab for the odd occassion I might use it. Any thoughts? <br> <br>The student discount is 50% so FontLab isn't quite as big an investment, but TypeTool would only be $49! <br> <br>Thanks, <br>Scott</p>
