      <p>&gt;but also at font related technical events there seems to be a sort of mono culture nowadays.</p>
      <p>I always choose the software that the majority are using, in this case FontLab, because, given my ongoing struggle with software, it's too daunting to make any other choice.</p>
      <p>I have nothing against FontLab, and I will be using it in the workshop I'm giving at TypeCon, as it is a popular font production tool that I'm passably familiar with, but it's not a "Fontlab Workshop", or an "OpenType" workshop, it's a design workshop.</p>
