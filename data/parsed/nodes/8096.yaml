    html: <p>I think the educational world is concerned to prepare students for work in the 'real world', so there is a tendency to promote the use of whatever tool is perceived to be 'the professional choice'. This is one reason why Fontographer was taught for so long, because even when it became obvious that FontLab was better, more regularly updated, etc., the perception was still that Fontographer dominated the market. Now FontLab dominates the market, so it gets most attention in educational settings. As you suggest, Frank, DTL FontMaster is something of a niche tool that meets very specific needs of some font developers. So it is regretable that DTL FontMaster does not get more attention in the educational world, but this is also understandable given typical pedagogical goals.</p>
