    votes: null
    html: <p>I am lecturing writing (calligraphy), type designing and font producing for almost 18 years at the Royal Academy at The Hague and purely the theoretical aspects for ten years at the Plantin Society in Antwerp now. My pedagogical goal has always been to widen the horizon of my students without pushing my personal preferences. By giving practical and theoretical information but above all stimulating the gathering of information by the students themselves, I always hoped and still hope to provide a solid basis for their further personal development. Although my lessons on font production in the post graduate program Type &amp; Media at The Hague are mainly focused on DTL FontMaster, I always list and discuss other programs. My position as lecturer is not to promote FM but to inform the students about the technical possibilities for font development and to show how we at DTL deal with it. At the end they have to make up their mind themselves. <br> <br>Let me make clear that the development of FM is the result of the internal production needs at DTL and URW++. I am happy to state that although we sell the product, the further development is not depending on sales numbers at all. It is just a wonderful program ('niche tool' are not my words) for professional font production and Dr. Juergen Willrodt, Peter Rosenfeld, myself and the rest of the FM Team is proud and very happy to work with it and to work on it and we will further develop and enhance the program the coming decades for sure. Considering the price for the full product, it must be clear that we never aimed at a big market. The free Light version is just a service to students. Looking at our list of customers and -of course- our own production, DTL FontMaster is absolutely 'the professional choice' also. And please correct me if I am wrong, but I have the strong feeling that since we introduced DTL FontMaster at the ATypI conference in Copenhagen in 2001, we have in some way inspired the FontLab (add on) developers also. <br> <br>The fact that history seems to repeat itself in the educational world now FontLab has taken the position of Fontographer should in my opinion actually be a reason to learn a lesson and alter the situation. The fact that something is mainstream does not mean that it is automatically better, as Apple convincingly proves with its products. I underline here my worries about the current situation in the educational world and tech forums (the FM Team is in for any invitations). But maybe I am wrong and is for instance the active promotion for the current dominant product on this forum really built on altruism.</p>
