      <p>Only confirming your title... Looks definitely handwritten to me, all repeating letters are different (sample <a class="freelinking external" href="http://eventjubilee.com/wp-content/uploads/2013/02/WELL_WED_C10_-1477.jpg" rel="nofollow">here</a>. According to <a class="freelinking external" href="http://annabriggsphotography.com/?p=2083" rel="nofollow">this post</a>, "<a class="freelinking external" href="http://www.coralpheasant.com" rel="nofollow">Coral Pheasant</a> purveyed of unique custom paper goods and stationary for weddings". Try asking them, they may answer.<br>
      Some alternatives now: <a class="freelinking external" href="http://marketplace.veer.com/font/Plumero-UMT0000018" rel="nofollow">Plumero Script</a>,  <a class="freelinking external" href="http://www.myfonts.com/fonts/magpiepaperworks/saissant/" rel="nofollow">Saissant</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/magpiepaperworks/vermandois/" rel="nofollow">Vermandois</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/jacques-and-gilles/" rel="nofollow">Jacques and Gilles</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/carolyna-pro-black/" rel="nofollow">Carolyna</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/peoni-pro/" rel="nofollow">Peoni</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/bombshell-pro/" rel="nofollow">Bombshell</a>, <a class="freelinking external" href="http://www.creatingkeepsakes.com/articles/CK_Cursive" rel="nofollow">Cursive CK</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/trial-by-cupcakes/anna-clara" rel="nofollow">Anna Clara</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/debi-sementelli/cantoni" rel="nofollow">Cantoni</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/great-lakes-lettering/asterism" rel="nofollow">Asterism</a>, <a class="freelinking external" href="http://the-lilypad.com/store/Key-Notes.html" rel="nofollow">Key Notes</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/magpiepaperworks/ondise" rel="nofollow">Ondise</a></p>
