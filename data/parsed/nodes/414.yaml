  html: <p>Hi, <br>This is a font I've been working on for quite some time now, but I can't seem to finish it. I rebuild it now 2 times new, but somewhere I keep having an invisible border. <br>Perhaps Philip Cavette has some good ideas. I like his fonts and would appreciate his opinion. <br> <br><img src="http://www.typophile.com/forums/messages/29/12042.jpg" alt="Vagebond"> <br> <br>I have some problems with the "2", "x" and "&lt;". Does anyone have some ideas on how to improve them? <br>I'm working on the other special characters. I have some ideas on them and will post them very soon.  <br>From this font I will also make different weight and italics. <br> <br>Thanks, <br>Ren</p>
