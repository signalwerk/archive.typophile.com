    html: <p>Hi Phillip, <br> <br>Thanx again for your opinion. Like I said I also had some problems with those characters. The first 'x' is not bad, though it would have to be wider. I wanted to optically correct it a bit, but keep the vertical idea. But this little diagonal touch is great. The second one is not it, for me.  <br>The '2' is a good suggestion. I will try to make the lower horizontal line a little longer. It is just a little to heavy at the top. But other than that it's better than before. <br> <br>Concerning the caps, yes I will make them bigger than the x-height. I wanted to take the top hight of the font and make them all as 'squared' as the lowercases. <br> <br>The 'r' I will leave like that. I will adjust the cluttering a little, but I kind of like that diagonal there. <br> <br>Ren</p>
