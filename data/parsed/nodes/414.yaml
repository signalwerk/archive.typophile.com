    html: <p>Hmmm, I think I used the opposite word! In a Roman (upright) font a shear is when the ending of a stroke (like a vertical stem) is not flat, it's at an angle (usually "uphill"). <br> <br>In an italic, a flat ending is already at an angle to the stem! But I was thinking leaving it like that makes the italic "boring", so maybe you can try making the ending either perpendicular to the stroke (which would make the letters look like they're falling forward), or try making the endings <i>more</i> sheared (uphill), which would make the letters look... sharper? Not sure. <br> <br>hhp <br></p>
    html_clean: <p>Hmmm, I think I used the opposite word! In a Roman (upright) font a shear is when the ending of a stroke (like a vertical stem) is not flat, it's at an angle (usually "uphill"). <br> <br>In an italic, a flat ending is already at an angle to the stem! But I was thinking leaving it like that makes the italic "boring", so maybe you can try making the ending either perpendicular to the stroke (which would make the letters look like they're falling forward), or try making the endings <i>more</i> sheared (uphill), which would make the letters look... sharper? Not sure. <br> <br>hhp <br></p>
