    html: "<p>before the \"nice\", \"good\", etc., etc.,.... <br> <br>1. what is the story of this typeface?  <br> <br>2.== \"...I can't seem to finish it.\"  == what is your method?   to wit: did you start the design from a to z?  or did you work with groups - A,V,W....- diagonal steams...and so on, so  on....    ? <br> <br>it is important since you need to know the proportions of the strokes - uppercase &amp; lowercase.  <br> <br>3. compare &amp; study : Drukpa (Diehl. Volk, 1990),  Akimbo (Joe Treacy, 1992), Mata ( Greg Semata, 1993), and Eurostile extended # 2. <br> <br>have a good day, <br> <br>David Hamuel</p>"
    html_clean: "<p>before the \"nice\", \"good\", etc., etc.,.... <br> <br>1. what is the story of this typeface?  <br> <br>2.== \"...I can't seem to finish it.\"  == what is your method?   to wit: did you start the design from a to z?  or did you work with groups - A,V,W....- diagonal steams...and so on, so  on....    ? <br> <br>it is important since you need to know the proportions of the strokes - uppercase &amp; lowercase.  <br> <br>3. compare &amp; study : Drukpa (Diehl. Volk, 1990),  Akimbo (Joe Treacy, 1992), Mata ( Greg Semata, 1993), and Eurostile extended # 2. <br> <br>have a good day, <br> <br>David Hamuel</p>"
  - id: 2600
    user: 1946
    date: 2003-06-24T00:43:00
    date_raw: 24 Jun 2003 — 12:43am
    votes: null
    html: <p>Hi David, <br> <br>I realised I was always busy with fonts, from an early time. Somehow I seem to have forgotten that. But not really, because one day I started again. Out of nothing.  <br> <br>I have propably no interesting story behind this font. I just started on an idea in my sketchbook and very quickly started to build the glyphs in Freehand. I had an idea of the overall look and feel of the font. I wanted a monoline, so no thick-thin proportions. I wanted a font that is very open and, when typed in longer texts, it will start to look like a wallpaper. <br>I'm not looking for selling the font. It was mainly my early contact with font creating. I would like to do that in order to create fonts for myself to use in my work. <br> <br>Because the font is mainly based on a square with rounded edges, it was very easy to create the basic of the font. So I had no specific order in which to work.  <br>That is maybe also part of the problem. I wish I knew how to handle a fontcreation like that. I'm a graphic designer and know about typography, but not (enough) about font creation. Is there an order in which to work or to handle a project like this? <br> <br>I rebuild the font because, in my FOG, there was no room for the kapitals, etc, etc, etc. Perhaps thats also the fact that I can't seem to finish it. I did so much for it that maybe I'm over the point. <br> <br>Does anyone have some info on how to deal with font creation? Guidelines, background info, etc. I know it is a profession for itself, but it has to be possible to do it semi-professionally. <br> <br>Ren</p>
    html_clean: <p>Hi David, <br> <br>I realised I was always busy with fonts, from an early time. Somehow I seem to have forgotten that. But not really, because one day I started again. Out of nothing.  <br> <br>I have propably no interesting story behind this font. I just started on an idea in my sketchbook and very quickly started to build the glyphs in Freehand. I had an idea of the overall look and feel of the font. I wanted a monoline, so no thick-thin proportions. I wanted a font that is very open and, when typed in longer texts, it will start to look like a wallpaper. <br>I'm not looking for selling the font. It was mainly my early contact with font creating. I would like to do that in order to create fonts for myself to use in my work. <br> <br>Because the font is mainly based on a square with rounded edges, it was very easy to create the basic of the font. So I had no specific order in which to work.  <br>That is maybe also part of the problem. I wish I knew how to handle a fontcreation like that. I'm a graphic designer and know about typography, but not (enough) about font creation. Is there an order in which to work or to handle a project like this? <br> <br>I rebuild the font because, in my FOG, there was no room for the kapitals, etc, etc, etc. Perhaps thats also the fact that I can't seem to finish it. I did so much for it that maybe I'm over the point. <br> <br>Does anyone have some info on how to deal with font creation? Guidelines, background info, etc. I know it is a profession for itself, but it has to be possible to do it semi-professionally. <br> <br>Ren</p>
