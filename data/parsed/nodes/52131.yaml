      <p><cite>“Helvetica? kel.sey”</cite></p>
      <p>Dear Wording,<br>
      there are several reasons by which it is NOT Helvetica.<br>
      One is the date of manufacturing.<br>
      But you can compare (even at a low size, low resolution) some characters' shapes like ‘7’, ‘&amp;’, ‘C’, ‘M’, ‘R’, ’S’ that are very different than those in Helvetica.</p>
      <p>Marcelo Soler</p>
