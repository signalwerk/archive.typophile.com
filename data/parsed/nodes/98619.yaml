  html: |-
    <p>Thursday,  December 6,  2012,  7:30 PM<br>
    Free to the public</p>
    <p><img src="/sites/default/files/old-images/Holster_4026.jpg"></p>
    <p>Andrew Keith Strauss will present a free lecture about the history of typography from the calligraphic era to the present digital age. Andrew Keith Strauss is an Adobe Certified Training Provider. He offers consulting, support and training in print, digital, video and online publishing technologies. His specialties include cross-media publishing, structured documentation, typography and colour theory. He provides customized service to clients across many different industries. </p>
    <p>Strauss will cover a range of topics including:<br>
    [1] The invention of the alphabet<br>
    [2] Stone carving and inscriptions<br>
    [3] Handwriting with ink and paper<br>
    [4] Three-dimensional letterpress printing<br>
    [5] Two-dimensional lithographic printing<br>
    [6] Digital design and typography</p>
    <p>The Muckenthaler Cultural Center<br>
    1201 West Malvern Avenue<br>
    Fullerton, California 92833<br>
    themuck.org</p>
