    <p>Hello lads</p>
    <p>First time posting on this forum. </p>
    <p>I am currently refining a logo for a jewellery company</p>
    <p>[Brand background]</p>
    <p>TTF is a jewellery brand in China specialised in designing their own jewellery and is currently gaining international notice from Switzerland Jewellery Show and Gem Fair. As it’s gaining more popularity in the jewellery industry internationally, the client would like to have its brand identity and logo re-designed in order to fit in with the international market.</p>
    <p>The original logo “TTF” is very boring. However it’s a registered trade mark, so unfortunately it cannot receive major modification. In order to add more to the brand ID, the client decided to include the word “design” by the TTF logo.</p>
    <p>Original logo - a tad bit boring and my job is to refine the design.<br>
    <img src="http://farm7.static.flickr.com/6129/5939115685_25e485d2e3.jpg"></p>
    <p>Currently there are 3 design proposals. As I have mentioned above, the TTF is a registered trade mark, which leave me with little room to tweak, so I can only work on the font and small details. It would be awesome if you guys could give me some C&amp;C.</p>
    <p>1:<br>
    <img src="http://farm7.static.flickr.com/6140/5939112407_da66787145_b.jpg"><br>
    2:<br>
    <img src="http://farm7.static.flickr.com/6132/5939112131_3d17cdab7a_b.jpg"><br>
    3:<br>
    <img src="http://farm7.static.flickr.com/6130/5939664664_f6b61965dc_b.jpg"></p>
