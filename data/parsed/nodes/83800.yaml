    html: |-
      <p>I think that new approach has possibilities, but a few suggestions. The word "Design" is very tiny in most of them and won't hold up well in small sizes. I would probably put "Design" outside of the shape (as you did in one of them) and make it larger. </p>
      <p>Consider putting Design in a more feminine font (perhaps a nice script) as that would be a way to counterbalance the corporate look of TTF and soften the overall look. </p>
      <p>You also might want to consider using softer colors, more like pastels.</p>
      <p>As for the specific shape, I dunno, that's just going to take a lot of thought and experimentation. A shape with curves will help soften the logo, although a hard-edged jewel shape certainly might be appropriate too.</p>
      <p>As research you might want to search "jewelry logo" (or similar phrases) on Google Images to see example logos of other jewelry companies.</p>
