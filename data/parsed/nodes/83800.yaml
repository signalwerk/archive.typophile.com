      <p>It's a bland but sturdy logo. Adding the little embellishments is making it messier and then tacking on of 'design' is awkward. None of the accoutrements integrate well and they'll all suffer when reproduced at different sizes.</p>
      <p>I'd suggest moving away from the original TTF in your experimenting. You can always come back to it, but spend some time rethinking it entirely.</p>
