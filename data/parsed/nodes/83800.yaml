    html: |-
      <p>&gt; Original logo - a tad bit boring </p>
      <p>Not only boring but also inappropriate for the company's product; it could be a logo for a company that makes machine parts. </p>
      <p>&gt; it’s a registered trade mark, so<br>
      &gt; unfortunately it cannot receive major modification</p>
      <p>Well it's not like they're legally required to use the same logo forever; most companies revise their logos periodically, sometimes in very major ways. </p>
      <p>But anyway, most of those variations you show will not reproduce well in smaller sizes, especially the tiny diamond. Try making prints of those logos postage-stamp size and see how they hold up.</p>
      <p>If the client just wants tweaks, you might consider leaving the letter shapes alone but maybe reverse them out of a shape (an oval or jewel shape or whatever) and then soften the overall look through the use of color.</p>
