    <p>I saw <a class="freelinking external" href="http://www.btinternet.com/~comme6/saville/fonts.htm" rel="nofollow">this</a> posted on kottke.org some time ago. Peter Saville has various fonts used for his New Order album sleeves up for download on his site.<br>
    I can't imagine these are anything more than slight tweaks to existing faces. There's no EULA or anything, and I can't find much more info about it.<br>
    Just curious, i guess...</p>
