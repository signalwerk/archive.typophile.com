      <p>I'd stay away from those fonts if I were you. Saville wasn't really much of a font guy anyway. Most of what is on that page is incorrect or poorly wrought.</p>
      <p>In the case of the Closer font, it is both. That's not the font. And in fact, that's not even the proper name of that font that has been modified. They didn't even bother changing the copyright.</p>
      <p>I'm still in the process of digitizing the Closer font, see <a href="http://typophile.com/node/41650" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this thread</a>.</p>
