    <p>I saw <a href="http://www.btinternet.com/~comme6/saville/fonts.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this</a> posted on kottke.org some time ago. Peter Saville has various fonts used for his New Order album sleeves up for download on his site.<br>
