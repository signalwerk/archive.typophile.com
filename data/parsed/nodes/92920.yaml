    html: |-
      <p>Try<br>
      <code>from robofab.interface.all.dialogs_legacy</code><br>
      instead of<br>
      <code>from robofab.interface.all.dialogs</code></p>
      <p>I was having the same problem and found this: <a class="freelinking external" href="http://groups.google.com/group/robofab/browse_thread/thread/3a495566dbe88a0" rel="nofollow">http://groups.google.com/group/robofab/browse_thread/thread/3a495566dbe88a0</a></p>
