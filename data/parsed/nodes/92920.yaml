  html: |-
    <p>Hi all</p>
    <p>I have this simple Robofab script here I wrote to shift the vertical position<br>
    of subscript glyphs.</p>
    <p>I haven't used it for a while but it has stopped working now.</p>
    <p>I get an error message saying - NotImplementedError</p>
    <p>Is there a reason why this has started to happen? can I fix it?</p>
    <p><code><br>
    from robofab.world import CurrentFont<br>
    from robofab.interface.all.dialogs import AskString<br>
    #<br>
    f = CurrentFont()<br>
    #<br>
    glyph = [</code></p>
    <p>	'a.subs',<br>
      'b.subs',<br>
      'c.subs',<br>
      'd.subs',<br>
      'e.subs',<br>
      'f.subs',<br>
      'g.subs',<br>
      'h.subs',<br>
      'i.subs',<br>
      'j.subs',</p>
    <p>]<br>
    #<br>
    down = int(AskString('Move Down'))<br>
    #<br>
    for g in glyph:<br>
    	f[g].move((0,down))<br>
    	f[g].mark = 140</p>
    <p>f.update()<br>
    </p>
