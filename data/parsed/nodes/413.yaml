    html: <p>it looks nice in most areas.  some problems for me are in the sharp corners found in the N, and the very awkward tail of the j/J.  the tail of the y is much better resolved.  also, i think the capitals R and P are a little weak, maybe making them wider will help.  in the lowercase alphabet, the a seems most out of place and unfitting.</p>
