    html: "<p>Hi Brad, <br> <br>Much improved. A couple of observations: <br> <br>-- The top cross bars on the E and F seem droopy and tired. Perhaps handle it like the letter T? (With the T: the horizontal stroke seems heavier than the vertical stroke.) <br> <br>-- The J's are improved, but could still be shortened a tad. <br> <br>-- How would it look if the leg of the R dipped below the baseline? <br> <br>-- I can see you are struggling with the lowercase a. What if you simply mimicked the bowl of the d? (See my horribly rendered version below...you get the idea.) <br> <br>Anyway, keep massaging it and it will start to shine!! <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13635.jpg\" alt=\"\"></p>"
    html_clean: "<p>Hi Brad, <br> <br>Much improved. A couple of observations: <br> <br>-- The top cross bars on the E and F seem droopy and tired. Perhaps handle it like the letter T? (With the T: the horizontal stroke seems heavier than the vertical stroke.) <br> <br>-- The J's are improved, but could still be shortened a tad. <br> <br>-- How would it look if the leg of the R dipped below the baseline? <br> <br>-- I can see you are struggling with the lowercase a. What if you simply mimicked the bowl of the d? (See my horribly rendered version below...you get the idea.) <br> <br>Anyway, keep massaging it and it will start to shine!! <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13635.jpg\" alt=\"\"></p>"
