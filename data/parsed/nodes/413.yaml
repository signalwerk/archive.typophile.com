    html: <p>Very friendly looking. I'd enjoy seeing a few sample headlines set in mixed case. My eyes are stopping particularly on the cap S and Z - which seem heavier than the rest of the uppercase. I like the quirkiness of the stroke junction I the X/x, and wonder if this could be applied elsewhere in the font - perhaps R or K? The little beard serif on the cap G made me smile.</p>
