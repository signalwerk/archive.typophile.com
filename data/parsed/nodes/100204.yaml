    html: |-
      <p>With millions/billions of logos already in use, most designs you come up with will have similarities to existing logos. </p>
      <p>So while originality is good, I think appropriateness for the client is more important. But obviously you don't want to simply copy someone else. Come up with your own design solution, and then search for logos (Google is handy) that might be similar — especially logos used by your client's competitors — to make sure you're not accidentally coming too close to an existing logo.</p>
