  html: |-
    <p>I'm was doing some digital sketches for a mark and one of them ended up looking / feeling a bit too familiar.<br>
    I remembered and went back to an old logodesignlove.com article called <a class="freelinking external" href="http://www.logodesignlove.com/similar-original-logos" rel="nofollow">When logos look alike</a><br>
    And indeed, my sketch looks a lot like the classic Stadt Bruhl logo by Stankowski. Basically it's the same  just flipped / mirrored and not all rounded.</p>
    <p>After lunch I went for a walk and within two minutes I saw a bus driving by with a huge logo similar to Stankowski's.</p>
    <p>How important is originality really?<br>
    And... is similarity even avoidable? I don't think it is, but when becomes similar too similar?</p>
