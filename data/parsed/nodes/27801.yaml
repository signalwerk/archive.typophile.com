    html: |-
      <p>Folks,<br>
      I'm not a professional typographer or designer, and make do with Microsoft Word for most of my basic desktop publishing needs (can't afford/justify the more expensive dedicated design software, for the limited use I would make of it). I'm just wondering: is there some reason why Microsoft chooses not to incorporate OpenType features in Microsoft Word? I work in a university setting, where it would be really nice to use some of the alternate-glyph and other OpenType features without having to do search-and-replace, or (worse) manually inserting the characters I want. I know these features are probably considered a luxury or superfluous to many users, but it would be nice to have them available, for those times when I really want to "pull out all the typographic stops" without having to invest in another piece of software. Do you think it's too much to ask for in a word-processing programme these days? Is there any chance that the forthcoming edition of Word might finally include these features, for us non-professionals who try to use our limited resources to produce the best typographical output we can?<br>
      I'd be grateful if anyone has any insight into these questions, which I'm sure many other people are asking as well.<br>
      All the best,<br>
      MurrayK</p>
