    html: |-
      <p>Chris,<br>
      true, true. I am sure that this is possible with OpenType, only it is hard to have all the different norms of various cultures and languages encorporated in one piece of software. That is because most type designers are not linguists (of course, vice versa most linguists also won't care about whether their texts have correct ligatures as long as it looks ok and someone has made a nice layout for it).<br>
      Regarding the above example: I am quite sure that there are no german words that begin with "auf" followed by "fi/fl" and still need a ffi/ffl lig. Same goes for most of the words that start with the prefix auf- (and therefore should not have a ﬁ or ﬂ lig in this place), but although I admit that I had to think a little: there are instances in German where au may be followed by a ﬁ or ﬂ lig. All the words that start with ﬁ/ﬂ and have a prefix auf- should have a ﬁ/ﬂ, but not a ffi/ffl lig.<br>
      Does some major foundry look for a consultant in german typography norms? ;)</p>
