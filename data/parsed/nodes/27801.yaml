      <p>I always create my own documents with InDesign.  It is only when other parts of my working world impose on me to "just use Word" (with that all-knowing smile) that I dare open the devil's Wordshop.<br>
      I find it amazing that I would have to do a search and replace to put in ligatures in text but can shot-gun blast a document with cute little clip-art excrement as easy as pie.<br>
      I hope that Tiffany's class was the last one to have to do a typography dissertation with Word. I can see some bright young Reading grad student doing a brilliant thesis on the history of ligatures and the modern OpenType usage of them only to have to search and replace them in after each draft. Maybe if they wrote it without any words using fi, fl, ffi, or ffl?</p>
      <p>ChrisL</p>
