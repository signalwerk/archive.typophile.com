    html: |-
      <p>You kids and your Unicode. Back in my day, if I wanted ligatures, I'd have to wrestle with arcane proprietary character mappings. If I was using, say, <cite>MinioMM_367 RG 585 NO 11 OP</cite>, first I'd have to change the font to <cite>MinioMMEp_367 RG 585 NO 11 OP</cite>. Then I'd have to make substitutions as follows:</p>
      <ul>
      <li>ff → V
      </li><li>fi → W
      </li><li>fl → X
      </li><li>ffi → Y
      </li><li>ffl → Z</li></ul>
      <p>And I liked it, dammit!</p>
