    html: <p>Searching and replacing ligs is not always the very best idea, at least in some languages where there are grammatical exceptions where <em>not</em> to use a ligature. E.g. in German there is no ligature to be set in composita where the words are joined (Auf-lösung, not Au-ﬂösung). But anyway, it became quite common to use ligs there with people who just discovered that their fonts do have a nice feature called <em>ligature</em>…</p>
