    html: |-
      <p>ChrisL,<br>
      can you give me an example of a font/application combination where OpenType ligatures actually works and produces correct output? After my last posting I tried it with Indesign CS and Times Italic, Zapfino and Adobe Jenson Pro. Results in German language are not conform to the rule I explained in the last post. Indesign still makes Au-ﬂösung and au-fﬁnden, even with an automatic ffi-ligature if there's one available. I tried the same using TextEdit and the standard OpenType treatment of OS X 10.3.9, with similar results.<br>
      The only workaround seems either to use a discretionary hyphen where the words join (this only seems to work while writing the text and before the au<strong>f-f-i</strong>nden is substituted with a ffi-ligature). Both applications give up their wrong ligatures if you kern e.g. at <em>auf|ﬁnden</em>.<br>
      Any suggestions?<br>
      So the "Wordly mysteries" do not only apply to <em>the big MStery</em> called Wörd.<br>
      My way would be to use a typesetting system that relies on dictionaries and is really capable of handling ligatures. I've had good experiences with LaTeX in that respect.<br>
      And never trust the software (may it be a layout software or an OpenType font) you're using, it is always only as good as its developers knew what they were doing…<br>
      The alternative would be (a) to stop using ligatures at least in the languages that "the software" does not know the rules of, (b) use fonts where ﬂ, ﬁ etc. look just the same as fl, fi (that is the case with many standard sanserifs, see<br>
      <code>span style="font-family:Arial,Helvetica,sans-serif"</code> =)</p>
