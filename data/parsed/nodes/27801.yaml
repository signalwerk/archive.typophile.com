      <p>My understanding has always been than OpenType couldn't help here yet. Perhaps language tags could aid designers, but these don't have application support, and a font does not have a dictionary inside of it.</p>
      <p>Most fonts do not include any ligatures in them other than fi and fl. Of course it is excellent when the designer includes ff, ffi, ffl, etc. Then again, there are other types that have been so designed so that they do not require ligatures at all.</p>
