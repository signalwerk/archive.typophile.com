    <p>I used to like MS Word several years ago (1980s or so) before it became a full featured behemoth carnivore (This happened somewhere after version 5.5 for the Mac). Now I just tolerate it because it is ubiquitous and I must.  It took some poking around to find a way to turn on kerning but I finally managed to do it.<br>
    My next dilemma is finding out how to turn on ligatures.  Is it even possible? Surely a word processing program pays more attention to all the things needed to set words more than all the things needed to insert clip art of the worst degree? The tacky clip art thing is quite easy to find but the kerning thing eludes my best detective efforts. Do I need Inspector Clouseau or Adrian Monk?</p>
    <p>ChrisL</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/peter_sellers_3918.jpg"></div><p></p>
