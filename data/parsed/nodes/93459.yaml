      <p>As always it depends on content, but I think I remember Nick Shinn saying that Clarendons were used as bold variants for Scotchs (<a href="http://www.myfonts.com/search/scotch/" title="http://www.myfonts.com/search/scotch/">http://www.myfonts.com/search/scotch/</a>).<br>
