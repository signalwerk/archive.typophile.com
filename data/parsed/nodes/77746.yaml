      <p>The problem is that since radiation dangers have been recognized, except for using tritium in sealed vials, the phosphorescent substances used on clock faces now only glow for a short period of time after exposure to light recharges them.</p>
      <p>The old-style radioactive phosphorescent substances were used in writing messages to secret agents during World War II, I vaguely recall reading somewhere.</p>
