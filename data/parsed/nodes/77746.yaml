      <p>The problem might be that the glow-in-the-dark ink will need to be exposed to light in order to glow. Might not work well in a book: how could all the pages be exposed to light at once? Will it glow long enough to make it through the whole book, reading in the dark?</p>
      <p>FWIW, my son had a "creatures that glow" book. The book was meant to be read in regular light, but it came with a poster of illustrations printed with glow-in-the-dark ink.</p>
