      <p>Bird,<br>
      When you pronounce the name of the company do you call it "bee ten" or "bee one zero", or should it be bilingual? Should it include "solutions inc" in the title, in which case it would be a mistake to leave that out when considering the logo design. The suggestion Jan made of separating by using colour would result in the b being treated as a separate element in the pronunciation, you could also use a zero with a diagonal crossbar to make it clear that it is a numeral, and by extension the character next to it is also (because it has the same height and colour). The b needs some attention try making the ascender lead into the counter like <a href="http://www.myfonts.com/search?search%5Btext%5D=pump" rel="nofollow">Pump</a>, not necessarily with the open counter, just the junction of the two elements at the base and keeping the echo of the 1 in the curve at the top. A point about printing orange, like purple it is difficult to get it to print satisfactorily using 4 colour process.</p>
      <p>ChrisG,<br>
      At the moment, since the redesign, it is not possible to upload images unless you are the creator of a thread, when you can add them to the initial post. You might also want to read this <a href="http://typophile.com/node/14424" rel="nofollow">thread</a>.</p>
      <p>Tim</p>
