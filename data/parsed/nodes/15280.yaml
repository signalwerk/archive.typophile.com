    html: |-
      <p>That junction of stem and bowl on the b makes a dark spot in your new design. The same x-height removes the b-one-zero reading and returns it to bio. The binary look you were trying to employ overwhelms the logo in your new designs.<br>
      The strapline is not positioned well under the logotype, it appears to overhang to the right (because of the curve of the 0); it is also a bit light for use in all applications, a business card for example, the tracking/kerning is too loose, especially apparent in the INC, you should be aiming for even optical spaces when kerning, a method for checking kerning is to print it out and view it upsidedown with half closed eyes, the light areas should appear similar in size.<br>
      As a final point it is more useful to create your logos in a vector drawing program (like Adobe Illustrator or Freehand) because that will allow you to enlarge the logo without worrying about resolution and the file size will be smaller, it will also be easier to create 4 colour, spot colour and rgb versions. If you continue with Photoshop, for most print uses you will need to have the logo at least at 300dpi at the size you intend to use it.<br>
      Tim</p>
