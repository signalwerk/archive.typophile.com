      <p>To simplify (possibly oversimplify)<br>
      stem – the vertical section of a letter<br>
      bowl – the circular part of the b<br>
      x-height – the height of a lowercase x, used as an average height of lowercase letters like a,c,e,m,n etc<br>
      strapline – more correctly this is a subordinate line that appears with a logo for example Smith's Sausages (the logo) followed by Taste like pork should (the strapline), in this case the Solutions inc<br>
      I don't know SVG but if it is a vector program that can be imported into your artwork that will do the job.<br>
      Tim</p>
