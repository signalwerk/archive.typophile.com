      <p>Bird,<br>
      My question related to how you space the characters, to see if it was possible to infer the pronounciation from their appearance. A customer, seeing your company name might presume bee-ten, it might be worth your while practising with the spacing to see if you can produce the correct pronounciation.<br>
      The problems with reproducing orange are due to the limited colours that yellow and magenta can produce, generally they reproduce as a brown. Your printer should be able to tell you what he would prefer, but I would go for something like 100% yellow and 50-60% magenta. The effects will also be influenced by the type of stock you are printing on.<br>
      Tim</p>
