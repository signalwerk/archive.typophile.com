    <p>I have spent a lot of times reading the other threads in this forum, and I must say that I am slightly ashamed of posting a logo of such inferior quality... but you have to start somewhere.</p>
    <p>I am creating a logo for our company, b10 solutions inc. The company will provide consulting services in bioinformatics (computer science applied to biology). I wanted the logo to be simple and to show a mix of both fields, so I constructed the word "bio" (biology) out of 0's and 1's (computers). It's not really original, but I find it better than using a double helix to represent biology (examples of double helixes on top of my head: <a href="http://www.idtdna.com/images/home/home_pic_logo.gif" rel="nofollow">IDT</a>, <a href="http://www.genomecanada.ca/GCimages/navigation/logo.jpg" rel="nofollow">Genome Canada</a>, <a href="http://www.sanbi.ac.za/GenomeAfrica/Sanbi_logo1.gif" rel="nofollow">Sanbi</a>, <a href="http://www.stratagene.com/templates/images/logo1.gif" rel="nofollow">Stratagene</a>, <a href="http://www.beckmancoulter.com/images/home_img/top_banner_logo.gif" rel="nofollow">Beckman</a>, <a href="http://www.invitrogen.com/imgLibrary/home_ivgn_logo.gif" rel="nofollow">Invitrogen</a>, <a href="http://www.vwrsp.com/globalimages/vwr_intl_logo.gif" rel="nofollow">VWR</a> and <a href="http://www.biocan.com/images/nav/BioTop_1.jpg" rel="nofollow">Bio Can</a>).</p>
    <p>As you will probably notice instantly when looking at the attached logo, I have no formation whatsoever in graphic design (only an interest). We unfortunately cannot afford to pay for a graphic designer at this time. We definitedly will one day.</p>
    <p>Of course, I will be really thankful of any comment or critique I get concerning the logo, but I am particularly interested to find out about basic or technical errors I made. Things that anyone with some education in graphic design will spot right away.</p>
