    html: <p>Yes. This typeface goes back to Herkules (H. Berthold AG, 1899), which is a bolder companion to <a href="/wiki/Hermann%20Hoffmann" class="freelinking" rel="nofollow">Hermann Hoffmann</a>’s Carola (H. Berthold AG, 1896). There is another digitization by Dieter Steffmann, under the name of <a href="http://moorstation.org/typoasis/designers/steffmann/samples/h/hercules.htm" rel="nofollow">Hercules</a>. The details (look at ‘k’) reveal that this version is the actual ID in this case.</p>
    html_clean: <p>Yes. This typeface goes back to Herkules (H. Berthold AG, 1899), which is a bolder companion to <a href="/wiki/Hermann%20Hoffmann" class="freelinking link-lost" rel="nofollow">Hermann Hoffmann</a>’s Carola (H. Berthold AG, 1896). There is another digitization by Dieter Steffmann, under the name of <a href="http://moorstation.org/typoasis/designers/steffmann/samples/h/hercules.htm" rel="nofollow" class="link-external">Hercules</a>. The details (look at ‘k’) reveal that this version is the actual ID in this case.</p>
