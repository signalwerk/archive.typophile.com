    html: |-
      <p>Probably by an actual typewriter. Faux typewriter sans fonts are fairly rare.  Earmarks for this one are i with a lower serif, two story a, and single story g. Very short descenders &amp; ascenders. Wide lowercase  letter forms.<br>
      Not a perfect match, but a very well executed font. Atlas Typewriter, <a href="http://typographica.org/typeface-reviews/atlas-typewriter/" title="http://typographica.org/typeface-reviews/atlas-typewriter/">http://typographica.org/typeface-reviews/atlas-typewriter/</a> and <a href="https://commercialtype.com/typefaces/atlas/typewriter" title="https://commercialtype.com/typefaces/atlas/typewriter">https://commercialtype.com/typefaces/atlas/typewriter</a> If you want a distressed match then some digging of "free" fonts might be your best bet. Myfonts did not have a match, clean or dirty.<br>
      Don</p>
