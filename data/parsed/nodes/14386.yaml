    html: |-
      <p>&gt; original copy of Edward Johnston's <em>Writing and Illuminating and Lettering</em> (with diagrams and illustrations by the author and Noel Rooke).</p>
      <p>Yes, a great book and an essential manual for calligraphers. I picked up my copy just after college. First published in 1906 by Sir Isaac Pitman and Sons Ltd. My version is the 1969 reprint by Pitman Publishing Corp., New York.</p>
      <p>Another Pitman book I've used is <em>Roman Lettering</em> by L.C. Evetts (original printing 1938, my version reprint 1960). It has a long subtitle -- "A Study of the Letters of the Inscription at the Base of the Trajan Column, with an Outline of the History of Lettering in Britain."</p>
      <p>My personal favorite is just a tiny little book:<br>
      <em>A Book of Scripts</em>, by Alfred Fairbank. Originally published in 1949 by T<em>he</em> K<em>ing</em> P<em>enguin</em> B<em>ooks</em>, my version revised and reprinted 1960. This was our textbook used in Paul Standard's calligraphy class at The Cooper Union.</p>
