  html: |-
    <p>I just found an old lettering guide from Pratt that was my grandfather's. It consists of a greenish paper folio heavy white cardboard printed with black. The Author is William Longyear. The publishers are Bridgman Publishers Inc. Pelham NY. It has 13 plates plus an explanation sheet. There is no date on it but I am guessing it was made in the 1920's or 1930's based on what I know of my Gpa. It's not in super fantastic shape - but it isn't ruined either. Is this interesting to anyone? If you have seen it, or know it, is there anything you think that is useful to study in it? Thanks!</p>
