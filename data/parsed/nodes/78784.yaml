      <p>Is the word "aksharaya" Sanskrit?</p>
      <p>The noun "akshara" (= letter, word, etc.) is attested in old Sanskrit texts, and the adjective "aksharya" (= relating to letter, word, gana), though very rare, is also attested in old texts, but I cannot find any attestation for "aksharaya" in Sanskrit.</p>
