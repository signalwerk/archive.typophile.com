    <p>Hi everyone,</p>
    <p>I'm new to the forums, and I just like fonts, but I'm not a fontographer or any kind of design specialist, I'm a civilian, lol. But I love type, me thinks I must have been a printer in a former life.</p>
    <p>I have a question about Adobe Caslon Pro. Does anyone know why the line spacing is so wonky (1.5 or double spaced, not sure which)? There don't appear to be any characters in this font that need to have room made for them, so why by default is there this huge 1.5 or double-spaced gap between lines by default in this font? This example is set at <strong>single spacing</strong>.</p>
    <p>Thanks in advance</p>
    <p>Larry</p><div class="imageWrap"><img src="http://typophile.com/files/caslonexample_4014.jpg"></div><p></p>
