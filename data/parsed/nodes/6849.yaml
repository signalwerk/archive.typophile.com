    html: "<p>I couldn�t pass this thread... <a href=\"http://mmbc.bc.ca/exhibits/1-tilikum.html\"> Tilikum</a> is (among other things) the name of the boat in which an early mariner, Captain Voss, sailed from Victoria (on Canada�s west coast) at the turn of the 20th century, and reached London in 1903. What makes his feat amazing to me, is that Voss <i>found</i> this 38' native dugout on the beach, rigged it for sailing himself, and sailed a distance that exceeds a world circumnavigation and touched every inhabited continent. <br> <br>Now for the type: I think it might be something like <a href=\"http://www.myfonts.com/fonts/bitstream/bookman/\"> Bookman</a>... but I would have guessed �Bookman Bold Italic with Swash�, which is not shown. Also the apex of the �A� only seems to match the Bitstream version, not the ITC; and the counter/bowl of the �G� and �C� has an uncomfortable transition between curve and straight (along the left edge of the counter) which I don�t see (thankfully) in either Bitstream or ITC versions. Although faces like this were popular when I was at University (and the mammals were descending from the trees), I am unable to find a current digital face that matches your sample. Could it have been made from press-type (rub-down, like Letraset or Chartpak)? <br> <br>cheers, <br>Dana</p>"
    html_clean: "<p>I couldn�t pass this thread... <a href=\"http://mmbc.bc.ca/exhibits/1-tilikum.html\" class=\"link-external\"> Tilikum</a> is (among other things) the name of the boat in which an early mariner, Captain Voss, sailed from Victoria (on Canada�s west coast) at the turn of the 20th century, and reached London in 1903. What makes his feat amazing to me, is that Voss <i>found</i> this 38' native dugout on the beach, rigged it for sailing himself, and sailed a distance that exceeds a world circumnavigation and touched every inhabited continent. <br> <br>Now for the type: I think it might be something like <a href=\"http://www.myfonts.com/fonts/bitstream/bookman/\" class=\"link-external\"> Bookman</a>... but I would have guessed �Bookman Bold Italic with Swash�, which is not shown. Also the apex of the �A� only seems to match the Bitstream version, not the ITC; and the counter/bowl of the �G� and �C� has an uncomfortable transition between curve and straight (along the left edge of the counter) which I don�t see (thankfully) in either Bitstream or ITC versions. Although faces like this were popular when I was at University (and the mammals were descending from the trees), I am unable to find a current digital face that matches your sample. Could it have been made from press-type (rub-down, like Letraset or Chartpak)? <br> <br>cheers, <br>Dana</p>"
