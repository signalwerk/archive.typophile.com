    html: <p>This was probably originally Bookman Swash (digital version possibly available as OPTI Bookman Italic Swash from <a href="http://www.castcraft.com">Castcraft</a>, but you'll have to call them as their website's broken), and like Dana said, it's not the same as ITC Bookman Italic Swash. The sample was probably created sometime in the '70s. It looks like someone tried to trace over it in an attempt to reproduce it. <br> <br>We've seen this one <a href="http://www.typophile.com/forums/messages/83/24826.html?1075527026">before</a>.</p>
