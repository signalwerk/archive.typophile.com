  html: |-
    <p>Quote from P22 email:</p>
    <p>"P22 Zaner, designed by Paul Hunt, is based on ornamental penmanship as<br>
    taught by Charles Paxton Zaner at his art college at the turn of the 20th<br>
    century. The Zaner font set includes four unique fonts that complement the<br>
    other fonts in the set. Each font is available in PostScript and TrueType<br>
    formats as well as OpenType which offers even more characters, options and<br>
    overall functionality. Set options include PostScript and TrueType with a<br>
    bonus set of extras and a "super" pro set containing over 3,000 characters.<br>
    Zaner is perfect for wedding invitations and documents that require a touch<br>
    of elegance."</p>
    <p><a href="http://www.p22.com/ihof/zanerset.html" title="http://www.p22.com/ihof/zanerset.html">http://www.p22.com/ihof/zanerset.html</a></p>
