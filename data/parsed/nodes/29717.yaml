    <p>Hey,</p>
    <p>I've been working on DejaVu and I'm kinda wondering where I should draw the line between tweaking "bearings" (<em>the way the left/right limits of the character are called in FontForge, not sure it's the "standard" term</em>) and start working on the kern table.</p>
    <p>Of course there are some very obvious letter combinations that need it, but I'm still too unsure of my technique of placing characters in place and make it all look even, and all that across lowercase, uppercase, small-caps and the punctuation.</p>
    <p>I don't want to adjust kerning on letters that don't need it, which could cause problems in further development.</p>
    <p>I'm sure you guys have some good tips on that.</p>
    <p>Thanks for the help,</p>
    <p>Pierre-Luc</p>
