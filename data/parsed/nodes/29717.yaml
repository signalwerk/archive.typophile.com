      <p>One consideration: If it's likely (as Hrant implies) that the typesetting or layout software doesn't support kerning by default, then it's worth considering a different strategy for spacing (how I describe setting sidebearings). If you know the font will usually be used with kerning on by default, then space everything to work adequately between control characters, and then fix bad combinations, usually with negative kern values. If it's likely to be used without kerning, space everything between a variety of control characters: HOVTAX. I suggest this because you might specify tighter sidebearings (with negative values) for things like V and A, so that in general, combinations with them are less gappy. Some combinations will be tight, some loose, but none as gappy as if those glyphs were spaced to be kerned by default. It's a way to average out the unfortunate combinations over all combinations, so that a lack of kerning is not so apparent. </p>
      <p>I'd agree with Chris on method. I also find that usually some initial sidebearings need adjustment after kerning is applied. Though Hrant's suggestion takes into account how we can create notan more fluidly, for large character sets it does start to seem endless and impractical. What is inescapable is that the designer must know what texture or setting they are going for, even as they sketch shapes. There are too many factors that influence each other.</p>
