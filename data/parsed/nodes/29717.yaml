      <p>It certainly helps to use kerning classes to group glyphs for the different kinds of spacing, and perhaps kerning, that may be required -- as David has indicated. If you consider glyphs as potential members of kerning classes, it will help you determine what kind of a spacing beast each one is.</p>
      <p>For instance, you may decide to group f, t, and r in a "left" class, which will lead you to consider whether that is appropriate for the typeface you are working on, and it might be, but perhaps only at one end of the weight scale.</p>
