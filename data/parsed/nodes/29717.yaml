      <p>"I’ve been working on DejaVu..."<br>
      I think, I'm having one. ;)</p>
      <p>It's not true of all typeface designs and is most effective for a given size, and the decisions made on the "common" bearings must be correct for either upper and lowercase mixed or uppercase alone, but here's something: There are common bearings (a fine term), and uncommon bearings (I hope a fine term). Common bearings usually come in three pairs: the straight left and right bearings, the round l&amp;r bearings, and the diagonal l&amp;r. Uncommon bearings are like the right side of K e.g. which is usually between the right round bearing and the right diagonal bearing, and often is a unique numerical value.</p>
      <p>We at FB generally use sample strings of H and O for spacing the uppercase because, among other things, their bearings are all common. So the K is the same as the H on one side, but the other side might be a compromise to space between H's and O's. Sometimes, you space it to work best with H, and kern it with O. sometimes, the opposite. </p>
      <p>But our spacing stops and kerning starts when all the common bearings are correct, and all the uncommon bearings are the best compromise for a given design in a system that uses no kerning pairs, and then kerning pairs make the best spacing possible if a system uses them.</p>
