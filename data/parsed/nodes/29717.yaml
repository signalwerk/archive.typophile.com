      <p>I would just offer the general observation that I think it is more efficient to have the sidebearings in the best possible (i.e. "most finished") condition before doing any kerning, because after kerning has started, one will have to re-check all the existing kerning if the metrics subsequently change. If the font has a lot of glyphs, this can be pretty time-consuming and unpleasant.</p>
      <p>That said, I've never seen anyone <em>not</em> go back and change sidebearings after starting the kerning -- it will come to that eventually. It's just that starting the kerning is a powerful temptation which is worth resisting as long as possible! :-)</p>
    html_clean: |-
