      <p>"David, what proportion of your users would you say don’t have kerning on?</p>
      <p>That's why, for general audience fonts,  we use the method we use, we don't know.</p>
      <p>" I’ve never seen anyone not go back and change sidebearings after starting the kerning.."</p>
      <p>I can count on one hand the number of times I HAVE gone back to change bearings after kerning over the last 17 years since I started this method, and almost all five were a single bearing that was missed, or misassigned. As Chris points out, once you start kerning, bearing edits are complex. So I take this very seriously.</p>
      <p>"typesetting or layout software doesn’t support kerning by default, then it’s worth considering a different strategy for spacing"</p>
      <p>We don't do it this 3rd way for the following reason: the user is used to two states, kerned type that is flawless, and type that suffers obviously from a lack of lerning pairs.</p>
