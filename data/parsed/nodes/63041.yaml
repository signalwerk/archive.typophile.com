    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SmSovba-rounded-poster-3_5396.png"></div><p></p>
    <p>Sovba is an amiable rounded sans-serif inspired by handwriting. Sovba is useful for a look that is uniquely casual, fresh and smooth. Sovba simplifies character forms down to their basic characteristics, and has a strong, silky smooth forward motion.</p>
    <p>Sovba includes more traditional optional alternates for a number of characters, including the E and F, OpenType alternate characters, old style figures and small caps. Sovba is a fine choice when you require a versatile upright oblique for logotypes, headlines or short blocks of text. Available from <a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/sovba/">MyFonts.com</a>. 20% off for a limited time.</p>
    <p><a class="freelinking external" href="http://origin.myfonts.com/s/aw/original/60/0/31110.pdf">PDF Sample. 13 pgs.</a></p>
