  html: <p>Hello, <br> <br>currently we are working at our fifth issue of spatium � Magazin fuer Typografie (magazine for typography). This issue will be published in October 2005, titled �Hamburgefonts�, and will deal with the questions what kind of information an type-specimen book must/can supply and how typefaces can be presented. <br> <br>For this we would like to show the type-specimen books or catalogues of as many type-foundries as possible. <br> <br>A second topic will be how graphic designers create their own type-specimen books to choose fonts by. Did you create a type-specimen book for the fonts installed? How did you sort the fonts? <br> <br>Anyone who likes to contribute can send us a printable (!) version, either PDF or laserprints. <br> <br>Best regards, <br>Spatium team <br> <br><a href="http://www.spatium-magazin.de" target="_blank">http://www.spatium-magazin.de</a> <br><a href="mailto:info@spatium-magazine.de">info@spatium-magazine.de</a> <br> <br>spatium Magazin <br>c/o TYPOSITION <br>Waldstra�e 10a <br>63065 Offenbach <br>GERMANY</p>
  html_clean: <p>Hello, <br> <br>currently we are working at our fifth issue of spatium � Magazin fuer Typografie (magazine for typography). This issue will be published in October 2005, titled �Hamburgefonts�, and will deal with the questions what kind of information an type-specimen book must/can supply and how typefaces can be presented. <br> <br>For this we would like to show the type-specimen books or catalogues of as many type-foundries as possible. <br> <br>A second topic will be how graphic designers create their own type-specimen books to choose fonts by. Did you create a type-specimen book for the fonts installed? How did you sort the fonts? <br> <br>Anyone who likes to contribute can send us a printable (!) version, either PDF or laserprints. <br> <br>Best regards, <br>Spatium team <br> <br><a href="http://www.spatium-magazin.de" target="_blank" class="link-external">http://www.spatium-magazin.de</a> <br><a href="mailto:info@spatium-magazine.de">info@spatium-magazine.de</a> <br> <br>spatium Magazin <br>c/o TYPOSITION <br>Waldstra�e 10a <br>63065 Offenbach <br>GERMANY</p>
