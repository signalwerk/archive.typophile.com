    html: "<p>I don't have the Johnston book. <br> <br>I'll snailmail you a copy of the de L Meyer article if you remind me of your ground address. <br> <br>To me the best specimen book in history is the 1908 Enschede. The 1978 is great too - just not sublime like the 1908 is. You might consider a sidebar article on it/them. <br> <br>-- <br> <br>I got a request for the contents of my \"pinnacle\" group, but I figured to just put it up here too, so here it is, in no particular order: <br> <br>- The 1908 Enschede <br>- Gentium booklet (V Gaultney) <br>- The Centaur Types (B Rogers) <br>- Lexicon booklet (B de Does) <br>- Johnston Sans (ITC) <br>- Tact in Typographical Design [Octavian] (S Morison) <br>- Ex Ponto (Adobe) <br>- Sabon Next (Linotype) <br>- She's the Best of the Mall (Veer) <br>- Newspaper Type (Font Bureau) <br>- An Exhibit of Garamond Type (Redfield-Kendrick-Odell) <br> <br>hhp</p>"
