    html: "<p>Hi, thanks for your posts! <br> <br>@ Joe: The deadline will be on end of may <br> <br>@ Hrant: I don't know this book yet, so I am intersted on a copy of this article, if possible.  <br> <br>At the moment we collect a lot type specimen books by foundries, but there are usually the newest books. So I could intersteting to see also older specimen books from USA oder other contiries. We have some old booksfrom germany.  <br> <br>Peter</p>"
