    html: "<p>Peter, you already know about Alistair Johnston's book I suspect: \"Alphabets to Order. Literature of Nineteenth-Century Typefounders' Specimens\". In addition there's a cool old article that might help: \"Advertising for a Type Foundry\" by J J de L Meyer, in the Penrose Annual 1968 (pp 198-208). It has some pretty cool and unique examples (like type on a pear). Let me know if you'd like a copy (although my own copy isn't so hot). <br> <br>My own font specimens suck, but I've collected a ton of stuff from other foundries. I've divided them into three groups: regular (90% of my collection), third-party (stuff done by users), and \"pinnacle\" (the best of the best). If it might help you to know the members of the third group, let me know. <br> <br>hhp</p>"
