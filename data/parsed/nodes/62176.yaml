      <p>I would not put it too extreme, but fonts should not work too specific. Sans serif that resembles a serif font, etc. can be quite boring.  Making a typeface wider for use at caption size is not always a good idea if you need caption size to put more text on limited space. Titling could be meant for reading from some distance.<br>
      How about "rounded" as a future tendency, or indy, "hand drawn", vernacular, experimental?</p>
