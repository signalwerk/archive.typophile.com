      <p>Well, I agree with you Thomas that Tam isn’t quite convincing in respect to the difference between the humanist sans of the 80s and 90s and the specific design traits that he mentions. He raises some interesting issues and if one (or even better, a typographic scholar) includes all and all humanist typefaces designed up to the present day and then analyzes them his conclusions would be more acceptable than Tam’s. </p>
      <p>Just put Johnston’s London Underground Sans side by side with Frutiger Next, the former does give the impression of being quite aged, a classic nevertheless… while on the other hand Frutiger Next emanates postmodern aesthetics.</p>
      <p>And here comes an interesting question, which was the very first Humanist Sans? Doric Bold, aka Humanist 970 (1870) or Johnston’s London Underground Sans (1916)?</p>
