      <p>Hi Eric,</p>
      <p>You make some well thought off and quite valid points and I do agree totally with most of them.</p>
      <p>-	‘Pointing out obscure experiments done by cogsci or tracking the multitude of typefaces available seems like an unreliable way of anticipating what typefaces will “likely succeed”...’</p>
      <p>Surely the ‘cogsci’ experimenters have neither the experience nor the talent to come up with streamlined ‘Letter Spirit’ typefaces as a seasoned type designer would have done and obviously they never thought of testing them typographically. They  way they look now (and if they are improved upon) they could be used for display or to deign logos with. </p>
      <p>Nevertheless, it is something innovative and I believe that eventually a type designer or two might pick up these ideas and come up with quite acceptable ‘Letter Spirit’ inspired typefaces, geometric sans typefaces.</p>
