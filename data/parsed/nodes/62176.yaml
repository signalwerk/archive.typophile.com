      <p>Hmmm. I have just read that section of Tam's thesis, and while he's a smart fellow, a good typographer and a nice guy, I am not yet convinced that the humanist sans typefaces of the 90s are all that different than those of the 80s. Their positioning in an extended family is more common, but not entirely new (e.g. Stone Sans / Serif, Legacy Sans / Serif). There aren't any specific design traits he calls out that distinguish these from their predecessors. Availability of oldstyle figures, maybe? But these are not such a fundamental characteristic of a typeface, in my mind, unless they are made the default figures.</p>
      <p>Cheers,</p>
      <p>T</p>
