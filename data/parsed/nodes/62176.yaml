      <p>My point was two-fold:</p>
      <p>- In the 90s there were still grotesques, neo-grotesques, geometric sans and even humanist sans being designed and released that did not fit any obvious "neo-humanist" mold. What it is fair to say, and may be all that Tam was trying to say, is that some particular style of humanist sans became much more popular. However, one would need to define the characteristics of that style.</p>
      <p>- I would be very interested in how one defines the characteristics of this "neo-humanist" style, as to whether said characteristics are particularly "new" in the 90s or have antecedents in the 80s and earlier. I'm expecting the latter, but it depends on the definition.</p>
      <p>For my part, as long as we have somebody calling themselves "Hypatia" in the thread, I'll note that the past decade or so saw a resurgence of geometric sans, which was largely a revival, stylistically: Avenir came back into vogue, and new typefaces like Gotham and Neutraface were innovative and well-executed, yet also in the style of previous work. (My* own Hypatia Sans was intended to be part of that geometric sans resurgence.)</p>
      <p>Cheers,</p>
      <p>T</p>
      <p>* I'll continue to call it "my" typeface as a shorthand, and because the main ideas and all the outlines of the upright were my doing, but I owe a huge debt to Robert Slimbach for constant input and guidance, Miguel Sousa and Robert for doing the kerning on the upright faces, and now Paul Hunt for finishing the italics.</p>
    html_clean: |-
