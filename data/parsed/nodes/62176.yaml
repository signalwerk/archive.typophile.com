      <p>Hmmmmmmmmm… the postings in this thread are quite interesting and informative and yet my original question was “Which kinds of typefaces are likely to succeed the Grotesques and Humanist Sans in the future?"</p>
      <p>As no one actually gave his views about this particular topic, I thought a bit about it and this is what I came up with:</p>
      <p>1.	We could have a new type of  Sans Serifs based directly on 'almost upright' handwriting and enhanced structurally according to the principles of Graphology.<br>
      2.	We could alternatively have Sans Serifs based on curvatures and other structural details found in industrial objects, such as cars and even architectural buildings.<br>
      3.	The Geometric Sans on the other had might evolve from experimental typefaces and ideas such as those presented in Letter Spirit:</p>
      <p><a href="http://www.cogsci.indiana.edu/farg/mcgrawg/lspirit.html" title="http://www.cogsci.indiana.edu/farg/mcgrawg/lspirit.html">http://www.cogsci.indiana.edu/farg/mcgrawg/lspirit.html</a></p>
      <p>4.	New type design algorithms will be invented and their use will give rise to a whole new species of typefaces, Serif and Sans Serif.</p>
      <p>I look forward to hear your own views about it.</p>
