    html: |-
      <p>Pointing out obscure experiments done by cogsci or tracking the multitude of typefaces available seems like an unreliable way of anticipating what typefaces will "likely succeed" (I do think that is a good rephrasing of this question). A better way of looking at this is by seeing how the neo-grotesques/neo-humanists address the problems that exist in typographic settings.</p>
      <p>I still think that Scala Serif/Sans as well as other early <a class="freelinking external" href="http://typophile.com/node/29924?" rel="nofollow">super families</a> are the most notable contemporary examples of how the sans serif can be used in a complete typographic system. They address the problem of the lack of harmony that exists in a setting where non-linear reading occurs (as mentioned by <a class="freelinking external" href="http://www.keithtam.net/documents/sanserif.pdf" rel="nofollow">Tam</a> p.12), without being overly ambitious in creating a sans serif that aims to bear the full burden of body copy.</p>
      <p>I think that when one neglects looking at how typefaces are being used, the explanation of their success—or potential success—becomes too speculative.</p>
