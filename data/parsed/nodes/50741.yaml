    html: |-
      <p>It looks beautiful; the curves don’t quite work yet but I don’t think that’s the main problem. To be honest, I could absolutely not read it until I read your explanation, and even knowing what letters are supposed to be there, it’s really hard. I see FJa, or maybe FSa or FHl or FHe, but mostly just a nice scripty “thing” (sorry). The d is not a d, and the u looks like it wants to be an a or maybe an o or a couple of e’s or something.</p>
      <p>Also, have you checked if an “Fdu” (instead of “FDU”) treatment may be confusing?</p>
      <p>FWIW, your letters reminded me just a bit of <a href="http://www.stormtype.com/typefaces-fonts-shop/families-72-pivo">Pivo</a> – might be worth checking out.</p>
