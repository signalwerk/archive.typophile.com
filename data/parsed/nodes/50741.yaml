    <p>It’s for a youth organisation called FDU. I’m trying to do something 70s-ish, with a modern feel. I guess Bello by Underware is somewhat similar to my goal. It’s not good yet, I know. This is my first go at a handwritten script ever. If you have a minute, please give your opinion.</p>
