    <p>This is the internet. So, I doubt anyone gives a shit, haha. But, I figured I would try anyways. </p>
    <p>I’ve lurked around for awhile and I know a bunch of the guys from LogoPond.com have recommended this site over and over gain. So, I decided to finally get off my ass and register. </p>
    <p>I live in San Francisco. I work for Pandora.com designing “digital brand experiences” for advertisers (that’s right, I am the guy that annoys you while you listen to music) and every once in awhile I take some brand identity projects on the side as well. </p>
    <p>I am slowly becoming a typeophile as I play ’Guess that Typeface’ while I walk down the street and make my own type treatments for logos. </p>
    <p>Anyways, that is all. Flame on.</p>
