    date: 2009-04-08T17:14:00
    date_raw: 8.Apr.2009 5.14pm
    votes: null
    html: |-
      <p>FL's not good at this if the contours intersect twice. Sometimes, if there are lots of contours, it only understands one pair of contours merging at a time. And, sometimes, until you correct the direction for each path separately it won't merge. Finally, when not even this works, I copy the parts into the mask, rip 'em apart and put them together manually. </p>
      <p>When we want to annoy them, let's all ask for "Create Overlap". </p>
      <p>Cheers!</p>
    html_clean: |-
      <p>FL's not good at this if the contours intersect twice. Sometimes, if there are lots of contours, it only understands one pair of contours merging at a time. And, sometimes, until you correct the direction for each path separately it won't merge. Finally, when not even this works, I copy the parts into the mask, rip 'em apart and put them together manually. </p>
