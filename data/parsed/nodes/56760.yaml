    html: <p>Make sure each segment of the glyph has counter clockwise contour for OTF. If not, cut the good segments, reverse the contour of the bad ones, then paste the good ones again. That works for me.</p>
    html_clean: <p>Make sure each segment of the glyph has counter clockwise contour for OTF. If not, cut the good segments, reverse the contour of the bad ones, then paste the good ones again. That works for me.</p>
