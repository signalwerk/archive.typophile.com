  html: |-
    <p>Hi, my name is Megan, and I'm currently developing my first typeface. The purpose of this typeface was to demonstrate how people change their way of thinking as they grow older. In this project, I gave children of varying ages the exact same set of shapes cut out of paper, and instructed them to create letters from the alphabet out of the shapes. The younger children were considering the parts of the letters, whereas the older children payed closer attention to the overall forms of the letters. </p>
    <p>I'd appreciate any input anyone may have in terms of translating their forms into a successful type family. Thanks :]</p>
    <p>Here's a link to my specposter.<br>
    <a href="http://farm3.static.flickr.com/2001/2410567701_f6220c7ec0.jpg?v=0" title="http://farm3.static.flickr.com/2001/2410567701_f6220c7ec0.jpg?v=0">http://farm3.static.flickr.com/2001/2410567701_f6220c7ec0.jpg?v=0</a></p>
