    html: |-
      <p>I shall add: there is no format difference in how FontLab Studio treats PS hints and PS links. When a PS-flavored font is generated (OpenType PS, Type 1), all PS links are converted to PS hints. When a TT-flavored font is generated (OpenType TT, TrueType), all PS links and hints are converted to TT hinting instructions. </p>
      <p>The difference in PS hints and PS links is only a matter of how they behave in the FontLab Studio UI: hints don't follow outline changes while links do.</p>
