      <p>If you mean in the context of FontLab:</p>
      <p>- A hint is a PostScript hint. They are usually aligned with nodes to define a stem. They can also be converted to TT instructions.</p>
      <p>- A link is similar, but more generalized. Links can be converted to hints (or hints can be converted to links), or TT instructions. Unlike hints, they automatically adjust themselves if you make changes to a glyph. Links are especially useful when you are working with multiple masters. Links are shared across masters, whereas hints must be set separately for each master.</p>
