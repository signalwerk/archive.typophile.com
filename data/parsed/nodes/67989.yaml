    html: |-
      <p>Svenni, the way I'm working with hints and links in FontLab (to produce CFF OpenType):</p>
      <p>1. after the outline is ready, use PS autohinting.<br>
      2. manually edit hints and add links if necessary (usually are).<br>
      3. convert these links to hints.<br>
      4. use PS autoreplacing.</p>
      <p>At this point, the PS hinting is ready to be tested.</p>
      <p>I convert all hints back to links before any edition is made to outlines. And then back to hints (with autoreplacing) to finalize the work.</p>
      <p>TT hinting is another universe I'll later step into.</p>
    html_clean: |-
