      <p>the term Hinting or instructing as it is sometimes called, is used to describe a set of hints or instuctions that are used to make individual glyphs in a font look better at small point sizes, especially on low-resolution screens, printers, and other devices with fewer dots, or pixels for accurately and legibly matching the glyph outline. </p>
      <p>a link is one of the set of instructions, and can define a relationship between: </p>
      <p>a parent point (on the edge of the left hand size of a stem for instance) and<br>
      a child point (on the right hand edge of a stem). </p>
      <p>so if you were using VisualTrueType, the tool for hinting developed by Microsoft, a 'link command' written in the higher level VTTalk might look like XLink(10,8,81), where 10 is a point on the left hand side of a vertical stem, and 8 is a point on the right hand side of the same vertical stem. 81 is a reference to a CVT value (control value table reference) The term 'link' is used to decribe a higher level concept so that it can be written and understood more easily. The code for the 'link' above compiles to lower level TrueType Language, where it will look like 'SRP0[],10 (set reference point 10) followed by MIRP[m&gt;RBl], 8, 81 (move indirect relative point 8, by a distence defined in the CVT 81,)</p>
      <p>there is a lot of information on the Microsoft Typography site related to hinting fonts with VTT. </p>
      <p><a href="https://www.microsoft.com/typography/hinting/hinttut3.htm" title="https://www.microsoft.com/typography/hinting/hinttut3.htm">https://www.microsoft.com/typography/hinting/hinttut3.htm</a></p>
