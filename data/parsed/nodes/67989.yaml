    <p>Hi.</p>
    <p>I've been studying optimal hinting techniques for correct screen display of typefaces. I've read tens or hundreds of pages of text about hinting, and I've taken quite a few stabs at googling it (the word "link" is a pretty useless search term on the internet). </p>
    <p>Still I can't still quite grasp the difference between a hint and a link. Could someone here explain it to me?</p>
    <p>Regards,<br>
    S.</p>
