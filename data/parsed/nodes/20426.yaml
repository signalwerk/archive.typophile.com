    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Michael Browers</strong></p>
    <p>Based in Duluth, <a href="/wiki/Minnesota" class="freelinking" rel="nofollow">Minnesota</a>, Michael Browers specializes in <a href="/wiki/dingbat" class="freelinking" rel="nofollow">dingbat</a> and <a href="/wiki/display" class="freelinking" rel="nofollow">display</a> typefaces that are sold worldwide to countries such as Australia, Canada, Germany, India, Indonesia, Netherlands, Poland, Switzerland, United Kingdom, and the United States.</p>
    <p>Additionally, Michael offers print, web, and logo design.</p>
    <p>E-mail:	<a href="mailto:info@michaelbrowers.com">info@michaelbrowers.com</a><br>
    Web: <a href="http://www.michaelbrowers.com" title="http://www.michaelbrowers.com">http://www.michaelbrowers.com</a></p>
