      <p>David: <em>Metadata belongs in the format, not the wrapper.</em></p>
      <p>If you're talking about metadata about the typeface and its use, I entirely agree, which is why the WOFF metadata does not include what I think of as typographic metadata, e.g. your ‘recommendations’. It makes much more sense for that to be included in the font data.</p>
      <p>A WOFF file is a package, and the metadata is just some labels on that package and about that package. They are not the instruction manual that tells you how to operate the piece of machinery that the package contains.</p>
