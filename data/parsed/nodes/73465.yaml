      <p>David, here's an update on the W3C FAQ. Chris Lilley just got back from two weeks of business trips followed by two weeks of vacation. During today's working group conference call he confirmed that the existing FAQ was something he put together quickly following the WOFF press release that came out during TypeCon, so that journalists would have something to which to refer if unable to contact him during his travels (which further explains the nature of the questions and answers, reflecting the sort of exchanges Chris was having with journalists). We opened an action item today for the FAQ to be revised, and Chris, Vlad and I will be working on this, and then having the working group review and provide feedback before a new version is posted on the W3C site.</p>
      <p>As I envisage it, the FAQ will relate to both WOFF specifically and web served typography more generally, within the context of W3C specifications (CSS2, CSS3, use of @font-face, and WOFF), but will better distinguish the particular benefits of WOFF and the general benefits of web fonts. Sound all right?</p>
