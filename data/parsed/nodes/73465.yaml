      <p>I support the idea of WOFF and the effort; I support and highly respect Erik, Tal and all the others involved; but as a type designer who is following the whole webfont story closely for years, and actually designing screen fonts, I still fail to see the benefits of the format. It used to be standard support in all new browsers, but as it turns out TTFs will be just fine for IE9. It could have been standard access and display of meta-information, but this part now is considered to be optional. Meanwhile, the fundamental issues for people designing typefaces for screens — rendering, scaling — remain unadressed.</p>
      <p>(To be continued. Or maybe not.)</p>
      <p>PS: I don't want to sound pessimistic; the glass is half full. But I wonder how many of the type designers/foundries who rushed to put their names in I-support-WOFF lists actually understand the issues surrounding the design of typefaces for screens, and are actually following the work being done by the W3C. (If they do understand, and are following: why are they silent?)</p>
