      <p>David: <em>I want to point out that this gross generality is false. The web could not have founded without the near-identical input and output of TrueType fonts on the commercial OSs from 1994 to 1999.</em></p>
      <p>Sorry, David, but the fact that one font and rendering technology was better suited to the web than its competitor and was, for a relatively brief period, near uniformly rendered on two operating systems, does not make the general observation false. TrueType only existed at that critical time because Apple didn't want to pay Adobe's PS licensing fees any longer so produced its own, competing format. They didn't call it the Font Wars because it wasn't competitive. The relationship of TrueType and the web in the 1990s was symbiotic: yes, the web benefited from the better screen legibility of hinted TT, but the TTF format benefited from having a niche in which it was clearly better than the competition; this at a time when many print service bureaux were still refusing to handle TT fonts because of the bad reputation they had gained due to early problems with RIPs. Meanwhile, the competition, i.e. Adobe, was busy rolling its own screen rendering in competition with that available from the OS to other applications. The arrangement of the competitors changes, such that two companies like Apple and MS might temporarily align their efforts on promoting TTF—just as Microsoft and Adobe later temporarily aligned their efforts on OpenType*—, but there was never a time since the introduction of TTF when fonts and rendering were not areas of competition.<br>
      ___</p>
      <p>* And when that temporary arrangement came to an end, MS and Adobe did something smart: they got OT into the MPEG standard, so that there would be a formal process by which the format could develop that was not reliant on good will between two competing companies. Which leads me back to the point I made above: if you think some kind of standardisation of rendering is possible at this stage, then you need to get the various players to sign up to a standardisation process, with all that entails in terms of patent releases, conformance commitments, etc. Simply hoping that they will agree—and agree for long enough not for the whole thing to unravel on the next release—is not enough.</p>
