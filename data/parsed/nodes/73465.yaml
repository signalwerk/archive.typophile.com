      <p>David: <em>they already crapped that up , but good.</em></p>
      <p>Your link is to the SVG spec. One of the outcomes of the WOFF standardisation -- along with Mozilla and Microsoft's refusal to inplemenet SVG web fonts -- is that the SVG working group is thinking of giving up on SVG fonts as any kind of compliance requirement, in effect acknowledging that SVG is dead-in-the-water as a web font format.</p>
      <p><em>But the biggest issue may be that the W3C thinks they've taken this GIANT step, and are too exhausted to go on?</em></p>
      <p>Working groups are established with specific charters. So it isn't a case of the W3C being 'too exhausted to go on' with web fonts beyond defining the WOFF wrapper format and web font compliance and testing requirements, but that the current charter of the web fonts working group is limited to those items. I presume there is a mechanism for extending the charter of a working group, once it has met its initial goals, but that would involve defining new goals and getting agreement from the members to pursue those and from the W3C to consider formalising the results. What are you suggesting such goals might be? Specifically?</p>
