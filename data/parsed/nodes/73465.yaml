      <p>David, it isn't when the fonts are doing their work that is a concern, in web fonts any more than in e.g. embedded PDF or simply in use on a licensed user's system, it is how the fonts are delivered to the place where they will do their work and what protocols exist for ensuring that they go to that place and not to another. To borrow your metaphor, it is about letting the ladies walk the streets naked vs. putting them in a taxi with written instructions for the driver on the destination and standard protocols for the doorman when the ladies get there.</p>
      <p>The WOFF wrapper provides a convenient way to compress and identify a web font <em>as a web font</em> and to indicate <em>without needing to touch the font data inside</em> where it comes from and where it belongs. Yes, it isn't the only way it could have been done, but it is the only way on which there was any kind of consensus from the different parties that are necessarily involved. So it is what is happening, is being implemented by all the browser makers, and seems to be widely supported by pretty much everyone except you.</p>
