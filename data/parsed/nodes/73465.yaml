      <p>David, you're right that WOFF specifically and the W3C web fonts working group in general can't affect what a font looks like in terms of rendering. I think the working group is well positioned, however, to influence the decisions that browsers make about what to do with font data, through its mandate to define a web font conformance specification. This is unlikely to affect what fonts look line in terms of rendering, i.e. rasterisation, but it may well affect what they end up looking like when browser makers attempt to ‘sanitize’ fonts. Google Chrome, for instance, currently strips GSUB and GPOS tables from web fonts, because it perceives them as a security risk. That might not be affecting your fonts yet because of lack of support for CSS3 typographic features, but it affects how complex script fonts look, and for some of us is a major concern.</p>
      <p><em>I am advocating conformance requirements and a test suite for implementations for TT/OT/OFF compliant fonts, (i.e. so we all can work skillfully on what’s going to be unskillfully compressed and wrapped in your WOFF) &amp; (saving the web from a WOFF standard containing an internet monster). And, I am advocating additional requirements and test suites for implementations for extensions to TT/OT/OFF compliant fonts, to account for the massive and relatively sudden changes to the technology of the “press” on the web.</em></p>
      <p>Laudable. And who is going to define these conformance requirements? And who is going to agree to recognise them?</p>
      <p>I think it is worthwhile to point out problems and keep them on peoples' radar until such time as those people -- browser makers, operating system makers, rendering engine makers, font format specifiers -- might start to behave as if they want to fix the problems. Until they start behaving that way, talk of conformance requirements seems to me more likely to drive them away.</p>
      <p>WOFF is happening because a lot of different parties with different agendas decided to try to solve a particular set of problems. They didn't set out to solve all the problems of fonts on the web, and they wouldn't have got very far if they had. Some of the problems that WOFF aims to solve could also have been solved within a naked font serving model, yes, but others could not, which is why a delivery format distinction was put on the table by both font developers and browser makers. I've got it that you disagree, David, but if we'd stuck where you are a year ago we'd still be arguing the toss about exposure of existing fonts that most of your colleagues find unacceptable. They may all be wrong and you may be right, but your being right wouldn't move anything forward.</p>
      <p>I've tried to ensure all along that, as you requested, WOFF wouldn't get in the way of the things that you want to do with web fonts, and it doesn't. It's a compressed delivery format for font data with some packaging labels stuck to it. What you put in that font data is up to you.</p>
