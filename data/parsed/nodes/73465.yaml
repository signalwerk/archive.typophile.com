      <p><em>WOFF is not a font format, it is a font delivery format. The SFNT font data content of a WOFF file is 100% identical to the un-WOFF'd font: there is no conversion of that data taking place, only compression and wrapping.</em></p>
      <p>This is what makes WOFF a different animal, and generally friendly toward flexible licensing. We've just updated the <a class="freelinking external" href="http://scripts.sil.org/OFL-FAQ_web" rel="nofollow">SIL Open Font License FAQ</a> to clarify many things, including in which circumstances WOFFing a font is allowed without triggering a required name change.</p>
      <p>I do, however, agree that it's best for everyone if foundries would provide WOFF versions of their fonts, and be clear about their licensing. So although our fonts are licensed with the OFL, and could be WOFFed by users, we're still scrambling to create canonical WOFF versions.</p>
