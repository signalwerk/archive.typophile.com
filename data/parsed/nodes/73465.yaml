      <p>Dave: <em>Of course it is - the font is distributed to each visitor to the website.</em></p>
      <p>While I agree that using a font on a web page constitutes a kind of distribution, it isn't what I would consider the primary meaning of ‘redistribution’ in terms of a EULA, which would be intentional selling or giving away copies of a font <em>for use</em> by other parties. A font on a website is displayed to each visitor to the site, and only as a by-product is it sent to that local machine in some format and possibly cached. It is convenient that existing font licenses that prohibit redistribution also prohibit web serving on the grounds that this technically involves distributing the font, but moving forward I don't think it is in anyone's interest to continue to lump web font serving with redistribution, any more than it has been to lump PDF embedding with redistribution. These are specialised uses of fonts, which should be clearly and independently covered by appropriate license terms. As new technologies make new things possible, updated license agreements should explicitly clarify whether these things are permitted or not.</p>
    html_clean: |-
