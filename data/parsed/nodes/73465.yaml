      <p><em>So interop., metadata and s.o. restrictions, none of these are inherently woff specific</em></p>
      <p>WOFF has better interoperability potential than other font formats, including unwrapped TTF, because it is being defined through the W3C process by the people who will interoperably implement it in browsers. This means not only that there is a will to make it broadly interoperable, but that there is a formal description of what interoperability mean in terms of conformance requirements and testing. Sure, unwrapped TTF might have been defined as a W3C recommendation with such conformance requirements and testing, <strong>but it wasn't</strong>, because there was no will to make it broadly interoperable, just as there was no will to make EOT or SVG fonts broadly interoperable or, back in the day, TrueDoc.</p>
      <p>WOFF has standard metadata. Sure, one could put whatever metadata one likes in the sfnt font data -- and one still can within a WOFF wrapper --, but after a <em>decade or more</em> of hearing font makers talk about font metadata, and seeing some putting private data tables into fonts, I don't see us being any closer to a standardised metadata structure or even agreement over what should go into such metadata. WOFF sidesteps the issue -- leaving it open for future development -- by putting some standard metadata as labels at the delivery wrapper level.</p>
      <p>Single origin restrictions <em>as a conformance requirement</em> are indeed WOFF specific. There is no other web font format in which SOR is an explicit requirement, because there is no other formally defined web font format. Sure, a foundry might put a requirement in its web font license agreement that a web developer must prevent hot linking of the web font to multiple sites, but that is unenforceable without browser-side application of same origin restriction, and there is no SOR conformance requirement for unwrapped TTFs.</p>
