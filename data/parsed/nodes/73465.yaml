      <p>Dave, when you start making smileys in response to something I've said, I immediately wonder how I might have been misunderstood. :)</p>
      <p>To be completely clear: I am not saying that web font serving is not redistribution, I am saying that the fact that the question is raised and needs to be answered is a good indication that everyone will benefit from future EULAs making explicit statements regarding web serving of fonts, rather than presuming that it is understood that prohibition of redistribution also covers web serving (and conversely, that permission to serve on the web does not imply permission to redistribute).</p>
