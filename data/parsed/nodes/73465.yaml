    <p>Here's a question, prompted by the TypeCon web fonts "monster" panel (expertly moderated by Bryan Mason). </p>
    <p>Will commercial font licenses that allow for user conversion of desktop fonts into <a href="/wiki/WOFF" class="freelinking" rel="nofollow">WOFF</a> fonts add to web font licensing confusion?</p>
    <p>Would it be less confusing if all commercial font producers opt for a no conversion policy, and make the WOFFs themselves?</p>
    <p>Thanks, Si</p>
