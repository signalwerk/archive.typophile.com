      <p>The wrapper distinguishes, at the file delivery stage, a font licensed for use on the web from all the existing fonts out there not licensed for use on the web, and does so with the option of labels that make it possible for font vendors and their customers to see where a font came from and where it is licensed to be used. The wrapper also comes with conformance requirements that stipulate same origin restriction, hence protecting the customer's investment in the web font license and bandwidth by preventing hot linking. </p>
      <p>The first of these benefits would presumably be possible with new metadata in the sfnt font data, although trying to standardise something in the OT/OFF specs looked like taking a lot longer and wouldn't engage the browser makers in the way that a W3C process has. The second of these benefits would not be possible with .ttf because there would be no web standard definition within which to define a same origin restriction.</p>
      <p>The support of unwrapped font linking on the web is targeted, as Håkon intended when he implemented it in Opera and as MS confirmed when explicitly linking it to installable fonts, at free and open source fonts.</p>
