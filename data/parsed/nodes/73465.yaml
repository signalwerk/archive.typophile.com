      <p>David, while I agree that the FAQ can be improved, I think you are making quite the mountain out of this molehill, and nowhere does that document suggest to me that 'a scenario where readers will think they can go forward with print quality type and typography on the web with html and css, because of WOFF'. The document makes the mistake of equating web font = WOFF (an error, but understandable in that WOFF is the only web font format that is being formally defined as a web standard by the W3C). The words 'print quality' and 'typography' do not even appear in the document.</p>
      <p>I understand and agree with your gripes about rendering quality, but that's not a web standards issue. Its a text rendering issue that relates to individual operating systems and only secondarily to browsers. Its not within scope of the web fonts working group charter. If you want to try to get all the operating system and browser makers to come together and define and accept a standard for text rendering on the web with conformance requirements and testing, then you could probably get the W3C to define a 'web type rendering' standard. I think it is unlikely, given that fonts and rendering have been treated as an area of competition and differentiation ever since Apple first announced TTF; I don't think you will be able to persuade all the OS makers to suddenly change to treating rendering as an area of cooperation and standardisation.</p>
