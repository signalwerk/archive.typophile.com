      <p>David, the WOFF is delivered to the user agent (browser), which is responsible for unwrapping it, so the metadata label is not only 'on the server': it travels with the WOFF file to the user's browser, and while there is no obligation for the browser to display that metadata or do anything else with it, but as Chris notes, there are plenty of people who want to be able to display that metadata, including those users who simply wonder 'What's that cool font?'</p>
      <p>Also, as previously noted numerous times, there is nothing in the WOFF delivery mechanism that prevents you from including other metadata in the sfnt font data, nor from standardising such metadata if you can muster enough agreement and support for how to do so. And there would <em>still</em> be no obligation for any browser or OS do do anything with that metadata, because they've made it perfectly clear that they will not accept such an obligation.</p>
      <p><em>...Howcome is vending Prince, with what its use of WOFF as an embeddable pdf format implies.</em></p>
      <p>It doesn't imply anything at all about WOFF as an embeddable PDF format, because by the time Prince is creating a PDF the font is unwrapped and what matters at that stage is the ol' embedding bits, just like any other PDF creation.</p>
      <p>Of course, if you are going to set all your web font embedding bits to 'Installable' so that you can serve unwrapped TTF to IE9 beta, you've lost any possibility of serving a font to a website that cannot be embedded in a PDF by Prince or by any print-to-PDF function.</p>
