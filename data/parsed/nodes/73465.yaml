      <p>Ray &gt;&gt; Is this customer confusion problem a real thing</p>
      <p>Sii &gt; The question was actually prompted by an audience question at TypeCon. For my customers web font licensing confusion is real. I get questions all the time. Are you finding the opposite? Do your customers get it?</p>
      <p>I think my customers get it now. I haven't had many questions about embedding since I simplified my <a href="http://www.typodermic.com/license.html" rel="nofollow">EULA</a> and added a page on my site about <a href="http://www.typodermic.com/embedding.html" rel="nofollow">embedding</a>. Maybe the diagram alleviates some non-English-speakers' confusion too. You're not limited to using text to explain what customers are allowed to do. Nowadays you can post a sock puppet show on YouTube explaining the embedding situation if you want to. Diagrams, comics . . . whatever gets the point across more clearly. Shoehorning that information into a heavy EULA is the ideal way to ensure that it's less understood.</p>
      <p>It seems the only method I have to measure customer confusion is the number of questions I get. I think having the embedding explanation out in the open rather than buried in the EULA is just common sense. A year ago, the most common embedding question was "can I convert this font myself using Font Squirrel?" I've had many positive comments about my decision to allow all types of web embedding with the standard license.</p>
