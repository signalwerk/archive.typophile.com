      <p><cite>The thing that I don't get is why more people don't defend embedding the design and fonts in the document as graphics, or whatever, as opposed to the mess of the web's delivery and display.</cite></p>
      <p>Because graphics don’t scale well and they can lead to nasty bandwidth bills for big sites. Remember how much bandwidth popular sites like ESPN saved when they switched to CSS instead of loads of inline formatting? Just think about what they’ll save when a font smaller than a decent graphic gets downloaded one time and all the graphics are generated client-side. And it’s not just a big deal for content providers; the ATT/iPhone debacle has shown that bandwidth consumption may become very important on oversold wireless data networks.</p>
