      <p>During his talk at RIT, WIRED's Chris Anderson made it a point to mention - about three times - that Condé Nast had it's best year last year.<br>
      Now, there could be many reasons for this besides the popularity of magazines but it seemed to me like Anderson was trying to convince - not the audience - but <em>himself</em> that everything is hunky dory. He almost seemed amazed by the continued success.<br>
      If you read his books - and there is nothing I would recommend more strongly - you realize he's too smart and too savvy an economist not to realize that THE END is more often than not preceded by boom times. Magazines have not transferred well to the web and there are dark clouds on the horizon.<br>
      When I talked with him afterwards, I asked him if the 80,000 or so downloads of WIRED's premier iPad app - which he also made a point of mentioning - could just be people in the publishing industry wanting to have a look and hoping against hope that WIRED will, indeed, pave a way to salvation - as CN is hoping it might. He said, "It could be."</p>
      <p>(Ain't gonna succeed, if you ask me. And if Chris Anderson was a free-lance economist instead of the editor of WIRED, betcha he'd say the same thing.)</p>
      <p>Yesterday, Ray Kurzweil's Blio book software debuted. Yet another debacle based on the idea that what we need is book simulation software for the screen.<br>
      We do not need magazine simulation software, either. And the sooner everybody gets that idea in their heads, the better. IMHO, of course.<br>
      Whatever form a "magazine" takes on the web, it won't look like a printed magazine. And if it's available only within a walled garden like the iPad, all that will do is limit readership. And then the question becomes, "Will the number of people willing to pay make the effort worthwhile?"<br>
      So far, I doubt it. But that's conjecture. Don't know if WIRED's talkin'.</p>
