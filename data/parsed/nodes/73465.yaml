      <p><em>Will commercial font licenses that allow for user conversion of desktop fonts into WOFF fonts add to web font licensing confusion?</em></p>
      <p>Is this customer confusion problem a real thing or just something meant to scare those of us who allow format conversions to get in line?</p>
      <p>Are customers confused by movies? Movies free in jets but late. Movies are expensive in a theater but cheap to rent. You can buy the movie but it looks no better than the rented version. Sometimes movies are on TV for free and you can tape them. You can pay to download a movie. You can get a friend to rent it and watch it at their place. The prices for these vary from store to store.</p>
      <p>"I wish I wasn't allowed to tape this movie that's showing on TV because it makes me kind of . . . you know . . . confused or something. Must kill everyone." (actual movie customer quote)</p>
      <p>Open source fonts allow format conversion and have no pageview limit. You can buy a multi format web fonts kit complete with style sheet, improved hinting and proper customer service. You can rent (sort of) hosted web fonts - easy to install and reliable. Sometimes a license agreement will allow you to convert your own web fonts from a desktop font. Sometimes you pay a flat rate. Sometimes you're limited to a certain number of hits. Prices vary. A reliable vendor may cost more but to some people it's worth it. Some people need to pinch pennies or just like doing things themselves . . . or dislike restrictions on things they buy.</p>
      <p>Is offering less choice a service for customers or for vendors?</p>
