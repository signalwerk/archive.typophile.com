      <p>The reality is, few type designers are able to even follow the discussions in the W3C list, let alone actively participate and defend positions against programmers, who have a totally different point-of-view and entry point to the subject (and who are actually paid to develop and implement standards as part of their jobs).</p>
      <p>I for one trust David Berlow's experience and support his criticism, and wish more of his points had been taken into account by the W3C working group.</p>
      <p>The few points I have tried to raise – <a href="http://lists.w3.org/Archives/Public/www-font/2009JulSep/0793.html" rel="nofollow">rendering issues and PPEM-specific sizes</a> and <a href="http://lists.w3.org/Archives/Public/www-font/2010AprJun/0235.html" rel="nofollow">standard display of meta information</a> – have been disregarded as unimportant or secondary. The agenda is clearly dictated by browser and tool makers, so why bother?</p>
      <p>Finally, the fact that IE9 adds support to raw font linking completely undermines the WOFF effort, in my opinion.</p>
