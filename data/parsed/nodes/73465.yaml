      <p><cite>The W3C published an admission that WOFF brings absolutely no benefits ... that are not already benefits of the "raw" fonts WOFF wraps.</cite></p>
      <p>I agree that this section is strange, because it seems to be highlighting general benefits of web fonts, not WOFF specifically. However, the real benefit (expected, but not yet realized today) is implied earlier in the article:</p>
      <p>"Until now, downloadable fonts have not been common on the Web due to the lack of an interoperable font format."</p>
      <p>The primary benefit of WOFF is (will be) browser interoperability. Secondary benefits -- harder for developers and end users to grasp because they are more abstract -- are font protection and the increased number of choices that that security is expected to bring.</p>
