      <p>David, everything makes sense to me except the stuff you're saying!</p>
      <p>You keep saying TrueType is the most interoperable format. Interoperable where? All we care about when it comes to fonts on the web is browser interoperability. Right now (a) there is no format that is fully interoperable; (b) there is no expectation that TTF will be fully interoperable; (c) there is an expectation that WOFF will become fully interoperable.</p>
      <p><cite>... by the time the user has had it unwrapped, delivered and enumerated to their operating system by the browser, it is a ttf, with none of the wrapper. WOFF has nothing to do with determining the licensability of font, and it never will.</cite></p>
      <p>A lot of people want to see the browsers expose WOFF metadata to the users. It will never be required, but we're hoping that browsers will see a user benefit to doing so and add it as a feature. So, the idea is that a font vendor adds licensing information to WOFF metadata and the browser shows it to the end user. It is not certain that the WOFF-specific info (e.g. the metadata) will just disappear.</p>
      <p>Having said that, does a user (a viewer) care about the font license? The real value of WOFF metadata is that it is part of the WOFF file. If someone grabs the WOFF off a server or finds it sitting around on someone else's computer, they can (in theory) look to see how it has been licensed, if it's okay to use, whatever. I'm not getting your assertion that WOFF has nothing to do with determining a license. You could argue that WOFF might not end up being as useful as we hope, but that's quite different from the factual certainty you're expressing.</p>
