      <p>J&gt; The single biggest benefit to WOFF is this: it is a web standard, which means that it comes with clearly defined conformance requirements, a test suite for implementations, etc. </p>
      <p>I want to make sure you’ve got this straight then: the benefit of the WOFF standard is, by defining and implementing compression and wrapper definitions as standards, everyone who embraces that standard can be in lock step; compressing, wrapping, decompressing and unwrapping that standard consistently.  (The web is great at solving unskilled problems by itself, but let’s leave that thought for a second. )</p>
      <p>J&gt; [WOFF is unlike] the ad hoc naked font support that is, in fact, different on each browser that claims to support it.</p>
      <p>This is the left ventricle of the heart of the problem John, the right ventricle being the tool maker(s) pretty clearly insisting that font designers/developers work through Type1 font technology to reach TT for the web. Meanwhile here in the left ventricle of the problem, we are seemingly compelled to do without clearly defined conformance requirements or a test suite for implementations <em>of the format users USE</em>. Thus, if the ad hoc “naked font” support you speak of is unaffected by WOFF, which by specification cannot effect the output appearance of the fonts in any way, WOFF pretty clearly brings is no benefit to users, web developers, or foundries. </p>
      <p>Now — I don’t give a hoot for solving unskilled problems first, in order to solve skilled problems later, if that’s the scheme — In typography, this method causes wide area bad-legacy issues, as should be clear? But I have been patient.</p>
      <p>So, if someone can explain the benefit to the W3C, OS and browsermakers of this unskilled operation (naked font in to- WOFF -to naked font out), please, step forward. Is there anyone who will speak frankly? If you please of course. This is just a Forum, and so you are not compelled to speak. </p>
      <p><em>I</em> am advocating conformance requirements and a test suite for implementations for TT/OT/OFF compliant fonts, (i.e. so we all can work skillfully on what’s going to be unskillfully compressed and wrapped in your WOFF) &amp; (saving the web from a WOFF standard containing an internet monster). And, I am advocating additional requirements and test suites for implementations for extensions to TT/OT/OFF compliant fonts, to account for the massive and relatively sudden changes to the technology of the “press” on the web.</p>
      <p>R&gt; Until you'll want to cite some word in Greek, for example ;-)</p>
      <p>Do you advocate font servers and or users being responsible for creating each and every skilled subsetting of a font family themselves?</p>
      <p>Or do you advocate no subsetting whatsoever?</p>
