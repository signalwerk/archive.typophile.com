      <p>Re. compression: as Tal reported during TypeCon, based on a testing of a few hundred fonts the average compression in WOFF = 47%.</p>
      <p>To declare that subsetting 'is the only good compression' is begging the question and ignoring the fact that any subsetted font can be subsequently compressed with WOFF. Subsetting has various problems for font vendors, web authors and even website visitors unless one means by subsetting just splitting a larger font into discreet character sets and licensing them separately. Interactive web content makes it hard to anticipate what characters are actually going to need to be displayed.</p>
      <p>Re. the FAQ: I don't know who wrote that. It isn't something that the working group produced collaboratively, and I suspect it will be subject to review now that we're aware of its deficiencies. Thanks, David.</p>
