      <p>David: <em>As such, subset or not, the compressed WOFF-bound TTF is smaller than a compressed and wrapped WOFF of the same font 100% of the time. So, an un-WOFF bound compressed TTF has the slightly better benefit over a WOFF, in compression terms.</em></p>
      <p>Uh yeah. But WOFF defines a <em>standard</em> compression model for web served font data, in such a way that a user agent knows what to do with it when it downloads a woff file, unlike, say, you picking some random compression mechanism from the myriad available ones and using it to compress a font.</p>
      <p>The single biggest benefit to WOFF is this: it is a web standard, which means that it comes with clearly defined conformance requirements, a test suite for implementations, etc. Unlike, say, the ad hoc naked font support that is, in fact, different on each browser that claims to support it.</p>
