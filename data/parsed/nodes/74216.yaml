    html: |-
      <p>Depends if a typographic nominalist (i.e. type naming fetichist) or not.</p>
      <p>There is no evidence of positive effect of typeface name on sale. </p>
      <p>However, specific name could convey a specific universe that the type design is supposed also to suggest.</p>
      <p>As far as I and my own foundry VTF (<a href="http://www.vtf.fadebiaye.com" title="www.vtf.fadebiaye.com">www.vtf.fadebiaye.com</a>) we are often inspired by music and future, and we try to avoid autoreferential naming (i.e. typeface named after a type designer name) because we think that a typeface is enough specific and elist as such.</p>
      <p>Or more concrete, you could be inspired by the first letters or words you design.</p>
      <p>There is obsviously no absolute rule about all that matter.</p>
