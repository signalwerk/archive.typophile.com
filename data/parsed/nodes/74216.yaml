    <p>What is your typical process when selecting a name for a typeface you're designing...</p>
    <p>especially one intended for the market? My apologies if this question has previously been posed in another forum section or thread; if so, I'd greatly appreciate a link to relevant past discussions. </p>
    <p>At what stage do you select a name for the typeface you're developing? Do you place greater value on choosing a name that holds significance to you, one that 'feels right' for the characters' forms and/or references the inspiration for the face? Or are you primarily concerned with choosing a name that is 'aesthetically pleasing' and would stand to appeal to potential consumers? </p>
    <p>I'm a few months into work on a face and selecting a name for it has been anything but top of mind...I've certainly sat down and set about making a list of candidates but in a strange way can't be bothered with it—I'd rather continue the meat of the design work unbiased by a predetermined name, then decide on something when the mood strikes.</p>
    <p>Thanks in advance for your responses.</p>
