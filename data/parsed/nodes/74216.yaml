    html: "<p>Frank: thanks much for taking the time to respond. You bring up an interesting approach to naming in your comment regarding the first letters or words designed for the typeface. Thanks also for sharing the link to your foundry's site—very great stuff, by the way...I hope to spend more time looking through it at some point. I enjoy the music references in the names of some of your typefaces: Tellier, Morrissey, Kravitz, etc. Given that designers themselves constitute such a large bloc of consumers and more often than not are avid music fans, I definitely see how giving a nod to music is an effective naming convention for capturing a potential user's attention.</p>"
