  html: |-
    <p>Letraset was one of the first things that got me into type. I love watercolour painting, and one day about 25–30 years ago, while I was looking for porcelain mixing trays at the local art supply store, I noticed a stack of these “Letraset” catalogues. I was bored, so I picked one up, leafed through it, and noticed page after page of different types of letters. I had no idea there could be so many. And that was it. From that day on, I pretty much took that book with me everywhere I went. I covered it in clear packing tape to stop the wear, and I even wrote my name and telephone number on it in case I lost it, so some kind soul would return my valuable book to me. Believe it or not, I was a little awkward and nerdy as a kid. First, Favorite, Font,  true story.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tiger_5226.jpg"></div><p></p>
