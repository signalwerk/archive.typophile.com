      <p>ITC Garamond is pretty horrid, but it's not a "kockoff". It's simply a Jannon (albeit an obese one) and for a long time the types of Jannon were (intentionally?) confused for those of Garamont. Although there's still some apologism (some of which does qualify as convenient terminological sleight of hand) concerning calling a Jannon a Garamond, it's merely an issue of naming, not design plagiarism.</p>
      <p>hhp</p>
