    html: |-
      <p>And what would I do with a font on a desert island Mr. Dean?</p>
      <p>OK... I got the most fun from cutting 15' tall Futura Bold for an installation on the top of the CN tower (in Toronto)...</p>
      <p><img src="https://lh3.googleusercontent.com/-LRyDZfsRpEQ/R1MTiv1NAnI/AAAAAAAAC-E/YXPa0IlKiXI/s640/june_07%2520142.jpg"><br>
      (edited to add recently found pic)</p>
      <p>... Garamond. The process in the screen printing shop was to set the type on a piece of paper, blow it up to the required size with a projector and roughly trace the characters on a large piece of paper. We used the 'slip-sheet' roll that came with the Amberlith to keep the gel side from sticking to the backer. Then I'd tape th the paper to a large table be clean up the tracing, making sure weights, cap- heights, x-heights, etc. were consistent and correct  and after that it's moved to a light table and cut. Garamond was a very satisfying font to cut. Every line and every shape somehow made sense and could be resolved with smooth, fluid and, I felt, very human gestures. </p>
      <p>Chris,<br>
      <cite>Amberlith and Rubylith<br>
      and little knives that swivel....</cite><br>
      (sung to the tune of Mares Eat Oats And Does Eat Oats, of course)</p>
      <p>About that time I saw the first CAD plotter. It could cut a circle in 100 straight line segments, and not very fast. I thought, that's cool, but it will never do the job of skilled artist like me.</p>
      <p>Hahahahahahahaha!</p>
