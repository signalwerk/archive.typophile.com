      <p>I can remember noticing the way fonts look when I was learning to read. I think I even know what typefaces I was looking at in hindsight (one of them Century Schoolbook for sure). </p>
      <p>For me, the first <em>favorite</em> font, where I knew the name and actually used it, was probably Times Roman. This was in about 1973, working as designer/editor on my high school yearbook. I thought it was beautiful. Other choices I can recall were Optima (never been a fan), Melior (too weird), ITC Souvenir (my second choice), and Bodoni (which looked old fashioned and ugly to me at the time). </p>
      <p>Computers have kind of ruined Times Roman by making it so ubiquitous as a default font. But I still admire it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/times_4565.gif"></div><p></p>
