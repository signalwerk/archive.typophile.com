      <p>First I’d like to say I think H&amp;FJ are certainly typographic masters of a new generation. I think what’s important about Gotham in this discussion isn’t just Tobias Frere-Jones's masterful execution of the typeface, but of the font as well. </p>
      <p>The topic here is perhaps specifically the font execution and not the appropriation of typefaces. I think Gotham is relevant to this discussion due to the masterful execution of the font, not the typeface. I think that Frere-Jone’s contribution is perhaps more the masterful execution of the digital form of the type rather than the face of the type, (the proportions of the Gotham face are exceptional as well of course, but that’s not the point). Considering the execution of the font as a significant reinterpretation leads back to the original issue; obviously the Little Days typeface is too similar Memimas to not have been directly derivative, but is the execution of the font a more masterful execution? I’ve never seen digital forms of either font, but shouldn’t that be a significant consideration?  If the Little Days font is superior to the Memimas font, wouldn’t that make it worthy of being considered an original work? And I don’t buy the prejudice that just because a font is on daFonts that it’s inherently inferior to a font on the for sale market.</p>
      <p>Part of my problem in this discussion is the prejudice that lesser foundries are given. A subjective line of ethics is drawn by those in the type industry. It seems to me that Adobe, Bitstream, Linotype, Monotype and other “respected” foundries get far less scrutiny of appropriating existing type than some of the lesser foundries. I’m not at all talking about Gotham and H&amp;FJ in this category as much as the examples listed in Devroye’s article.</p>
      <p>We’ve entered a new era of not just type designers, but font designers as well. Most of the time they are one and the same, but that is not a given. At times, maybe like this topic, they have to be considered independently. And maybe someone like West Wind Fonts will get the same subjective consideration that a Hoefler &amp; Frere-Jones receives. Once again, I think the Devroye’s article makes a solid point.</p>
