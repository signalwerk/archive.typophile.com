      <p>@BlueStreak</p>
      <p>The problem here is that you're trying to mix two things that can't be mixed: objective questions of what the law protects and subjective questions of what is "original," "fair game," "plagiarism," etc. As applied to type design, these words have no intrinsic meaning.</p>
      <p>Clearly it's true that the type industry thrives on reuse of ideas. Most of this reuse is legal; some is not. But every type designer has a different idea of the line that separates reasonable reuse from bad sportsmanship.</p>
      <p>Complicating the problem is that when type designers explain their ideas of reasonable reuse, sometimes they don't apply those ideas in a principled or consistent way. That has more to do with the fallibility of human reasoning than the difficulty of the question. </p>
      <p>If I had to define my test for reasonable reuse it would probably be:</p>
      <p>1) Is the newer digital font necessarily derived from a specific older digital font?</p>
      <p>2) Does the newer font address a functional or market need that the older font does not, other than making the older font available for free?</p>
      <p>Specific examples:</p>
      <p>Little Days &amp; Memimas. 1) Little Days is necessarily derived from Memimas. 2) Little Days adds nothing to the world that Memimas hasn't already done, except to be available for free. Therefore, it may be legal, but it's not —&nbsp;to me —&nbsp;a reasonable reuse.</p>
      <p>Gotham. 1) Gotham is derived from NYC signage. But not a specific font. So it's reasonable reuse. Some folks say they see a lot of similarity between Gotham and Proxima Nova. Maybe so. Often, good font ideas will emerge simultaneously without reference to each other. But Gotham has its own source material.</p>
      <p>I have a font called Alix. 1) It's based heavily on old IBM selectric fonts, specifically Prestige and Light Italic. While there are digital versions of these fonts, Alix is not based on those. So it's reasonable reuse. But it would also pass criterion 2): In terms of design, the current digital versions of Prestige are seriously inaccurate. Also, very few monospaced fonts have true italic styles, including the current Prestiges. So it adds functional value to what's already out there.</p>
