      <p><em>He didn’t just sit down and sketch those shapes up from scratch. No one does.</em></p>
      <p>Tobias didn't copy anything. He studied a genre, assimilated it, and produced an interpretation of the style, transposed from one medium to another. Duh.</p>
      <p>Most of my types are drawn from scratch.</p>
      <p>**</p>
      <p>Little Days is a total knock-off.<br>
      It's not exonerated by the existence of other, "accepted" knock-offs, as Luc argues.</p>
      <p>The acceptable "tolerance level" varies with the genre of type.<br>
      A subtle difference, globally applied in a face, can add new meaning and functionality in a much-populated, generic category.<br>
      However, Little Days brings nothing new to the table in mimicking a face with a quite distinctive personality, despite some cosmetic camouflage.</p>
      <p>I will say that the tolerance level in the industry varies: certain large and powerful companies can get away with a lot more, without damaging their reputation, as can free-font plagiarists (not much reputation to be damaged), but the vast majority of foundries are straight shooters.</p>
      <p>So I don't think it's a question of whether there is some benchmark level beyond which dubious behaviour will not be tolerated by "the industry" (even assuming unanimity were possible), but of what kind of companies a foundry wants to do business with (distributors are important!) and what kind of image it wants to have in the marketplace.</p>
