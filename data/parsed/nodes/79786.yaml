      <p>No, that's not what I'm saying. (And what I say is irrelevant. What a District Court says in a published opinion is relevant. Follow the link to the WP article and read it.)<br>
      In short, Bridgeman Art Library claimed that the photographs it had taken of its private collection of public domain artworks resulted in new works which were protectable under copyright. The court said no, they aren't. They are freely copyable and distributable by anybody. (As long as you buy a copy and are not shoplifting them out of the museum's souvenir shop, of course. ;)<br>
      The decision rests on the principle that "slavish copying" of unprotected material is unprotected regardless of the change in the means of expression. (Oil paintings on canvas versus photographs of same.)</p>
