      <p>Here, it's obvious that Duchamp didn't intend for anyone to believe that he painted the Mona Lisa, and personally, I think that's the important distinction. If a creative work has tremendous and distinctive value but is based heavily on something else, we lose something if the derivative work isn't allowed to exist, but as a matter of honesty, it's important for people to acknowledge those who inspired them.</p>
