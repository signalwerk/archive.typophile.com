      <p>I agree with Kent that dropping this is a fine idea.</p>
      <p>BTW - I'm no relation to Mr. Fisk.</p>
      <p>Just to answer your questions:</p>
      <p>&gt;Was it legal for just anyone to sell a copy (print of a photograph) of these works?<br>
      yes.</p>
      <p>&gt;If so, why?<br>
      Because the photos were no more than faithful reproductions, in another medium, of the originals. Copyright is intended to protect expression, and there was no new expression. (I'm just summing up simply what the court said.)</p>
      <p>&gt;Because the works were a certain age?<br>
      Yes, that had a bearing. The works were no longer under copyright.</p>
      <p>&gt;Anyone was aloud to go into the place and photograph those works and sell them?<br>
      No, photographs by the public were not allowed. The photos and digital versions were created by the Bridgeman Art Library and redistributed by Corel.</p>
      <p>&gt;Distributable in this case means legally salable right?<br>
      Yes.</p>
      <p>Now, I doubt if you're any less baffled. And that's one of the problems with copyright law - it never, ever contemplated a world where the cost and ease of copying was near zero and the tools to do so available to everybody. Plus, there are few "bright lines", legally. Most works contain copyrightable elements and non-copyrightable elements and until someone makes a claim and a court or jury decides which is which and what's what, it's hard to know where you stand. A strange form of "property" it is.</p>
      <p>Adios.</p>
