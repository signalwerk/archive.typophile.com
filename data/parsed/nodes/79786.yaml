      <p>One other note. You might ask why anyone should care what type designers think about reasonable reuse of font ideas. You could fairly take the position that what the law does not prohibit, is permitted, and that in a free market, other considerations are irrelevant. </p>
      <p>The answer is that type design is a very small world compared to most industries, even most design industries. Everyone involved professionally with type is in some sense an advocate for the whole industry. Most thoughtful type designers notice that in the long term, they have more to gain from good sportsmanship than from a slash-and-burn approach. One of the ways you earn respect for your own work is by showing that you respect others' work.</p>
