      <p><cite> &gt; So what would we think if the free font were an unequivocal improvement on the non-free one?</cite><br>
      Following European law, every time you’re artwork is a "derivative work" of another artwork which <strong>is not</strong> in public domain, you must have a written agreement of its author.<br>
      To be in Public domain, a work must be<br>
      1. released with a PD licence;<br>
      2. 70 years must have been passed till the original-artwork-author's death (not the artwork's release).</p>
      <p>Generally speaking, I think reusing someone else's work without his permission is taking undue advantage.<br>
      Would you like to see your work to be taken by others, modified (even if improved) and resold? I don't think so.</p>
