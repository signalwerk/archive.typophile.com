    <p>Hello dear typophiles community,</p>
    <p>A client asked me to use a font for his logo that he found on dafont (doh…)<br>
    The one is "<a href="http://www.dafont.com/little-days.font" target="_blank" rel="nofollow">Little Days"</a> and supposed to be freeware.<br>
    However, reading its comments I've discovered it's extremely similar to this commercial font <a href="http://www.fontshop.com/fonts/downloads/typeotones/memimas_family/" target="_blank" rel="nofollow">Memimas</a>.</p>
    <p>Looking forward, I've fallen on <a href="http://cg.scs.carleton.ca/~luc/westwind.html" target="_blank" rel="nofollow">this article</a> by Luc Devroye. He claims it’s not a copy, but I must admit I find his arguments totally wrong.</p>
    <p>I'd like to know your point of view. How would you understand the relation between "Little Days" and "Memimas"? Do you feel Devroye’s arguments are solid?</p>
    <p>Thank you</p>
    <p>PS: I do not know M. Devroye nor both fonts’ authors.</p>
