      <p><cite> &gt; that's what you call a textbook copyright violation</cite></p>
      <p>Ryan — Just to be precise, with regard to your terminology, let me point out that *copyright* is a strictly legal precept. As such, it is subject to various laws, statutes, and jurisdictions, and it has evolved over time.</p>
      <p>The legal concept of copyright did not exist in the 1500s. Modern copyright laws do not (and I don’t believe ever have) actually pertain to a painting created in the Renaissance.</p>
      <p>Duchamp’s <em>L.H.O.O.Q.</em> — despite whatever else one may wish to think about it — is not actually “a textbook copyright violation.”</p>
      <p>Now, perhaps you meant to assert that Duchamp’s action was an obvious example of *plagiarism.*</p>
      <p>I’ll let you and Patrick (apetickler) debate that particular point, if you want.</p>
