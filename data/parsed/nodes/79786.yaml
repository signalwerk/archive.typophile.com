      <p>Regarding the arguments of the article defending the copy, type designers have been copying the work of those preceding them since the beginning of type. The article points out that many well known fonts are clearly derivatives of other fonts. There are no laws prohibiting that. One of the most used (and best done) fonts is Gotham. Tobias Frere-Jones copied the work of others from architectural signs to create that font. He didn’t just sit down and sketch those shapes up from scratch. No one does. Everything with type is inspired by all of the type that’s been done before. This is all talking about copying the shapes (which are fair game) and the discussion is not about copying the digital algorithms, or the font software files (which is illegal).</p>
      <p>It seems in the article that Stephen Coles questioned the ethics in copying those shapes nearly verbatim. The ethics are questionable in virtually recreating an exact copy of the shapes, but since the digital outlines are clearly not the same (and in fact better) there is nothing illegal about the copy, which is why daFonts is able to share the font.</p>
      <p>I find Devroye’s arguments to be solid. Maybe Stephen Coles, or others directly involved with the article, will speak up and expand on this.</p>
