      <p>I may be incorrect, and if so I hope someone will correct me with source material. My understanding, based on U.S. law, is that a typeface (the design of the type) cannot be copyrighted. Only the name can be copyrighted. The only protections I know of regarding type in the U.S. is patent protection of the software used, i.e., the font.</p>
      <p>So since this typeface uses what seems to be original outlines based on the Devroye article, the Little Days font is an original work.</p>
