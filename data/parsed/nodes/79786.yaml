      <p><cite> &gt; My impression was that you were claiming that copyright law is not so much a clear law but a guideline that is often and easily bent.</cite></p>
      <p>No, what I was claiming is that it is a very complex body of laws, bound by time and place, the applications of which may be specific but are not always intuitive.</p>
      <p>Incidentally, Duchamp did not actually copy the Mona Lisa. He purchased a readily available reproduction (a print or postcard, essentially), drew the mustache &amp; goatee on it, added the saucy caption, and hung it in a gallery.</p>
      <p>This really is a bad example. But if you want textbook examples, then I recommend you find a textbook on copyright law. <a href="http://www.nolo.com" rel="nofollow">Nolo Press</a> publishes some very <a href="http://www.nolo.com/products/patent-copyright-and-trademark-PCTM.html" rel="nofollow">useful and accessible guides</a>.</p>
      <p><cite> &gt; If he would have started producing prints and selling them, don't you think he could have been sued for that? </cite></p>
      <p>Do you mean in 1919? For copyright violation? No, I don’t think so. To make a more informed decision, one would have to research the specific copyright laws in France in the early 1900s. </p>
      <p>But this Duchamp example is a red herring I think we should drop it now. It’s just a distraction from the primary point of discussion: the copying of fonts or typeface designs.</p>
