      <p>I feel that if you don't change the design hardly at all, it's copying. There's a copyright law that applies to works of art (but not fonts in the U.S. unfortunately) that states that if an artist doesn't change the work quite a bit it's copying. If I take a print of the Mona Lisa and paint a mustache on her, that's copying (and since it's a painting it's illegal for me to call it my own original work - this kind of thing is legal when done to fonts in America unfortunately). However if I paint lots of stuff all around her and cover a lot of the background and paint the mustache, I can probably prove to a jury that it's an original creation owned by me.</p>
      <p>So if it REALLY looks like another font, it's copying, and though it may be legal in the U.S., I find it unethical.</p>
      <p>However, if the original font is rough looking in places and messed up in some places and you trace it but clean it up and make it look much better, maybe you should sell it under a different name, (if it's a marked improvement) as long as you admit what you've done and what font you traced if anyone asks you if you designed it. Because you didn't really design it, you copied and traced it. But then again maybe not - I'm on the fence about it.</p>
