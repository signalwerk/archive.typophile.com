  html: <p> I think this should probably go into the "Technical Issues" forum, but apparently I've registered once &amp; can't register again w/ the same e-mail, and in the mean time I've forgotten my password ... so sorry if this is off-topic. <br> <br>I'm involved with marketing a TrueType font. (Please don't ask "why TrueType?"; it's a long story) We have not had any problem with the font until last week, when a client w/ a canon printer using a Fiery RIP started choking on it. <br> <br>PDFs using the font would work fine; PS files using the font would not. <br> <br>Any ideas about how to fix this, or suggestions as to the best place to look for answers? <br> <br>Thanks very much. <br> <br>Jay </p>
