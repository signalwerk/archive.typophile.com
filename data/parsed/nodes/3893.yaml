    html: <p> Jay -- <br> <br>As far as I know, there is no "fix" except, as you found out, converting the file to another format like PDF, photoshop, etc. <br> <br>The problem with TT is that it's old technology. A fiery rip is newer technology based on postscript protocols, of which TT has none. <br> <br>Another quick fix might be to drop your TT font into Fontographer and recreate it as a PS font :-) but if you wanted it TT, I suppose, it would be so already. <br> <br>Good luck. </p>
