      <p>Hey! You've done it, thanks!</p>
      <p>I actually created my own complete typeface-interpretation of this logotype as part of my application to Design School a number of years ago (without knowing there was already a font like this). As it was the first type I'd ever designed it was built to a rigid grid (rather than making visual adjustments for letters) - but still a fun experiment.</p>
      <p>Thanks!</p>
