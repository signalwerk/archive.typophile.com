    <p>Ok so I have a bunch of fonts in photoshop lets use myriad pro for example.</p>
    <p>I have one myriad pro name and the different weights in the pulldown so there is only one name for the family and then the different styles are a in the pulldown to the right of the name.</p>
    <p>On the other hand my font klavika, gotham, futura and a few others all have their different weights split up into different fonts. So instead of it saying Futura and then having the weights on the right each weight bold, light, ect. has their own name.</p>
    <p>Is there any way I could take those fonts like that and some how make photoshop recognize them as a family and not different fonts?</p>
    <p>I posted this in general too I will remove that one.</p>
