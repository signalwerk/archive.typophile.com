      <p>I don't think to many people give a crap about much from there either, especially type. I guess I'm an exception to the rule. </p>
      <p>Sounds like things are going well for you. It's good to see a local doing well at anything art related, Hanover definitely was NOT the cultural mecca we all hoped it would be. I spent a lot of time in Baltimore when I was in HS, hoping to get some exposure to anything. </p>
      <p>Florida sounds like a popular destination for designer from this area as well. I knew another kid from Gettysburg that went to Full Sail for 3D design. He's now doing web work in Brooklyn.</p>
      <p>I'd like to move on, Harrisburg isn't much of a mecca either.  I started a thread about it (a href="http://typophile.com/node/32853"&gt;Design Limbo) so I won't go into much detail. </p>
      <p>I'll pass the word on to Sam you said Hi, I think he still talks to Drew so I'm sure he'll say something.</p>
      <p>Nice meeting you, keep up the good work.</p>
