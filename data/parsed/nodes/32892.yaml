    html: |-
      <p>thanks for the kind words on the work. i knew sam as well. cool guy. almost everyone i knew back there i lost touch with after i moved to chicago. i went to school in sarasota, FL. small art school called ringling school of art and design. about 1,000 students give or take. hell of an education. i moved up here in spring 02 with a couple buddies from college and did some freelance for a few years since the economy was crap. found a couple full time deisgn gigs and now i'm at a small firm called firebelly as senior designer. great place. good work for good causes too. most of my stuff lately has been in type. really trying to develop a lettering thing and get some font creation happening. slow so far but time is scarce. </p>
      <p>new oxford. crazy. i didnt think anyone from that area would give a rat's ass about type..</p>
      <p>w|m</p>
