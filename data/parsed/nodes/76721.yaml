      <p>So, as you can see, U uploaded two new images of the now completed Charcter Set of Expletus Sans Basic. I decided to keep the braces the same, since most typefaces I opened in Fontlab had them alligned like Expletus. Instead of lowering = + - I used lining numerals instead of oldstyle. If there's anything important missing or you see any faults, please comment. Do bear in mind that this only the Basic version of Expletus Sans. The later Pro version, will be much more extensive.</p>
      <p>Cheers. Jasper de Waard</p>
