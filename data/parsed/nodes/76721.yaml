    html: |-
      <p>This is going very well, Jasper. Some small observations:</p>
      <p><strong>1</strong>. Hyphen position is fine for use with uppercases, but somewhat high for lowercases. It may also be a bit wider.</p>
      <p><strong>2</strong>. In Maths, braces are used outside brackets and parenthesis. So, they must appear a bit larger (vertically) than these to give an "embracing" effect and keep they hierarchy clear. Your braces does not seem larger than brackets (although having the same height) because they resemble the parenthesis curve very much. I believe a less round shape and a slight larger height would improve them.</p>
      <p><strong>3</strong>. Equal position is also a bit high.</p>
      <p>Quotes at "What are inverted, but I guess this is because you just included right double quotes at this point.</p>
