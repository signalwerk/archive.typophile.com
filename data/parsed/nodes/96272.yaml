      <p>it could be <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/player/" rel="nofollow">Player (Condensed)</a></strong> by Patrick Griffin (Canada Type, 2007)<br>
      MyFonts.com says:</p>
      <blockquote><p>The Player family started as a straight-forward revival of a film face called Ivy League, an early 1970s VGC classic that was very popular with designers of sports paraphernalia (...)</p></blockquote>
      <p>There is also an older font called <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Image-Club-Graphics&amp;ffam=Ivy%20League%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=7b9c205b862b15c2e6facebfdf2c6893&amp;wrap=2&amp;text=PAWNEE" rel="nofollow">Ivy League</a></strong> (Image-Club-Graphics, 1992) but I don't know if it's still available for sale.</p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
