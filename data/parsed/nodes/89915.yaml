    html: |-
      <p>For institutional, I’d take Trade Gothic over Franklin Gothic. Less overt personality. </p>
      <p>The Trade Gothic series was relatively new in the 50s &amp; 60s, riding a resurgence of interest in American Gothics after decades of European Geometrics in the mainstream, and would possibly have been more widely used than Franklin Gothic at that time.</p>
