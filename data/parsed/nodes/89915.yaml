    html: |-
      <p>"...type would mirror what would be used in that sort of institution (a hospital), or of a similar epoch."</p>
      <p>Franklin Gothic, Stymie, Clarendon.  Probably all caps.  Institutions would be a bit behind the curve so their signage would have looked  post war American rather than hip for that time Modernist.</p>
      <p>Also, Cuckoos's nest was staged in a NOT private hospital where the patients were probably poor or blue-collar at best. Think along the lines of Trenton NJ instead of upper East-side Manhattan.  This was a dismal State Mental Institution with a low budget.  Signs should be worn-looking and degraded.  That being said, Leroy Lettering would also be a strong candidate.</p>
