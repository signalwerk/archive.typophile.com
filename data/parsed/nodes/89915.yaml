  - id: 494641
    user: 1215
    date: 2012-02-11T05:36:00
    date_raw: 11 Feb 2012 — 5:36am
    votes: null
    html: |-
      <p>I don’t know that it would have been a matter of “riding the new” as a matter of availability. </p>
      <p>Franklin Gothic was primarily a handset face, from ATF. Monotype did have a version of Franklin Gothic for their machine, I believe, but I don’t think it was widely used in that format (could be wrong about that). </p>
      <p>Linotype never adapted Franklin Gothic, that I know of. Instead, Trade Gothic was Linotype’s response to this general style and would have been widely stocked in most Lino shops at that time. </p>
      <p>So, it becomes partly a matter of what technology was likely to have been used for setting printed matter for a state mental hospital of that era. I’m betting against handsetting or Monotype.</p>
      <p>Now, if one is talking signage, then all bets are off, since that would not likely have been type.</p>
