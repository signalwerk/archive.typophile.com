    <p><strong></strong></p><div class="imageWrap"><strong><img src="http://typophile.com/files/Nassim_slide_1_6581.png"></strong></div><br>
    We are excited to release the award-winning <strong>Nassim</strong> by <strong>Titus Nemeth.</strong> <p></p>
    <p>The typeface is – thanks to its use by BBC Arabic and BBC Persian – one of the most read webfonts in the world today with around 56 milion readers each month. It was first released in 2008 with the Tasmeem software. With the current new and revised release in OpenType technology, Nassim is, for the first time, now available for all mainstream software environments, allowing for high quality Arabic typesetting across platforms and media. It lends itself equally well to Arabic and Farsi, thanks to the dedicated Persian letter drawings.</p>
    <p>Nassim comes in four weights with “Nassim Latin” supporting more than 63 languages using Latin script, and “Nassim Arabic”with additional support for Arabic, Persian, and Urdu. Pan-European Latin is included in all fonts by default.</p>
    <p>Nassim received acclaim from its first public appearances. It was awarded the <strong>‘Certificate of Excellence in Type Design’</strong> at the <strong>TDC² 2007</strong>, first prize for <strong>‘Original Typeface Design’</strong> at the <strong>European Design awards 2007</strong>, and was shortlisted as <strong>‘Design of the Year 2007’</strong> by the <strong>Design Museum London</strong> and featured in the accompanying show. </p>
    <p>Read more about the family at: <a class="freelinking external" href="http://www.rosettatype.com/Nassim" rel="nofollow">http://www.rosettatype.com/Nassim</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Nassim_slide_2_6739.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Nassim_slide_3_4895.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Nassim_slide_4_3961.png"></div><p></p>
