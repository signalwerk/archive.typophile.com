  html: |-
    <p>I'm searching for a nice Arabic font to be used in a book aimed at teaching beginners the language.</p>
    <p>The stock fonts are all pretty ugly however I've come across some nice ones online. Since this is aimed for beginners new to the language, the font has to be clean, easy to understand and written correctly.</p>
    <p>What is important is that the letters be clearly distinguishable and that the positioning of the dots be correct.</p>
    <p>Any suggestions will be appreciated.</p>
