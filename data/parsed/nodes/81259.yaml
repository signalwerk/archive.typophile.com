    html: |-
      <p>It's a logo for a website that organizes monthly contests. It is a logo of a service and not a company. It's perfectly feasible to have such a grunge-looking logo for the service you described.</p>
      <p>And the first logo is really good. But change it as Luma told you. Keep the illustration, remove that type with strange bluish gray outline (or stroke as he named it) and draw those letters just as you drew the illustration. It was working perfectly, but those too perfect letter shapes were telling us they weren't drawn.</p>
      <p>Anyway. Great illustration. Kindda reminds me of the band Gorillaz... That's good. :)</p>
