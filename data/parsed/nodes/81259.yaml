    html: |-
      <p>Personally, I find the first image to be much more effective, it the line weight and shading really bring forth the mascot.<br>
      The second image looks more corporate in my opinion.</p>
      <p>I agree with Luma Vine in the sense the type should be drawn in and to exclude the grey lines.  The only thing I would further recommend is making a difference between both of the "E"'s.  The reason being is because they are situated right beside each other, the eye will compare them against each other. If there is a slight difference, it adds character/complexity, thus making a nicer image.</p>
      <p>All in all it is a wonderful looking design, good work!</p>
