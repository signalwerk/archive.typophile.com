    html: <p> Doesn't look quite like Carpenter, Stephen. Look closely at the 'n' and the 'i'. Very different entry strokes. I doubt the designer changed them -- why bother? But aren't there a couple fonts out there similar to Carpenter? I seem to remember Letraset had one. Anyway, if this is a cheap knock-off, then the fitting is probably in the font, rather than a misfired kern on the designer's part.  <br> <br>-- K. </p>
