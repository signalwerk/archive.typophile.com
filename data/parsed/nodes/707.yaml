  html: <p>The other day, I saw what appeared to be (from a distance) an attractively-designed brochure for Ace Hardware paint. Upon closer inspection, however, I was aghast. It appears the designer created their own script font that looks OK except that the 't' and 'i' in the word "generations" do not correctly connect. There was a similar problem with their other brochure. Why couldn't they have just used something like Edwardian Script and be done with it?  <br> <br> <br><img src="http://www.typophile.com/forums/messages/4100/1326.jpg" alt="script.jpg"></p>
