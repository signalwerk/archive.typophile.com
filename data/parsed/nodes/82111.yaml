    <p>I have been tasked with combining the existing wordmarks of two construction companies to create one unified mark. One mark uses Futura, the other Palace Script. In my eyes this isn't a combination that works. The business is luxury homes, so I would like update the type to create a sturdy, upmarket yet contemporary combination. And avoid the retro route!</p>
    <p>Scripts are a particular weakness of mine, so particularly looking for suggestions on that front. I guess a high contrast black italic could work too. Any examples of contemporary sans/script combinations also appreciated.</p>
    <p>Thanks</p>
