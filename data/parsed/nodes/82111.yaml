      <p>I'm not a fan of scripts at all, either. They're messy, to say the least. To keep it classic and luxurious, I think that a good choice of a script-like font would be something along the lines of <a class="freelinking external" href="http://favwork.com/FribergDesign/1518" rel="nofollow">http://favwork.com/FribergDesign/1518</a> or another 1950-60s-esque font. Keep it classic.</p>
      <p>As for pairing Futura with it, are they using Futura regular or condensed? If they're using condensed, try another condensed font like Bebas, Helvetica Neue Condensed, etc. I think that Helvetica would be a good pair with a script because of it's capital R's, but I understand if you don't want to use it for a logo since it is about as mainstream as it gets.</p>
