      <p>FontLab Studio 5 for Windows is likely to be released in a few days to co-incide with the ATypI Helsinki conference. At the same conference, preview versions of FontLab Studio 5 for Mac and Fontographer for Mac OS X will be presented. The final version of the Mac products should be released in several months from now. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
