    html: <p> it makes me think of cross-stitch! now, I haven't really  <br>examined your characters very thoroughly, so this first  <br>comment may be the only one worth listening to, but... <br> <br>as for the lc, set some text with the uc and lc so we can <br>get an idea of how the two work together. in this  <br>context, I can't say I like the look of the lower case, but <br>the overall structure seems to flow fairly well. for some  <br>reason, however, the lc does feel more open. I think it  <br>has to do with the fact that they are so round  <br>compared to the oblong shapes of the uc. </p>
