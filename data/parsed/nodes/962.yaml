  html: "<p>Was noodling around in Illustrator and created this puppy: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/1434.jpg\" alt=\"purview\"> <br> <br>I'm not sure about the weight, but if it stayed at 12 point land it might work out. <br> <br>I'm particularly unsure of the angles on the lower case letters -- are they too dramatic? Right now the font almost looks like an OCR typeface. However, I like how the caps look right now. <br> <br>Any thoughts?</p>"
