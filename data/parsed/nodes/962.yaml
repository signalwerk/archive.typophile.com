    html: <p>OK, here's another view. <br> <br><img src="http://www.typophile.com/forums/messages/29/1435.jpg" alt="purview2"> <br> <br>It seems very clunky to me. <br> <br>One idea I had was to reduce the prominence of the angles on the lower case... I tried it with the upper case but at smaller point sizes the 45 degree angles are hard to distinguish from curves unless they are as blatant as in these examples.</p>
