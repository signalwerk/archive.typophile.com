    html: <p> For starters, I would increase the letterspacing and decrease the word spacing. This will help it to look less clunky, and help you to evaluate the individual glyph designs. <br> <br>David </p>
    html_clean: <p> For starters, I would increase the letterspacing and decrease the word spacing. This will help it to look less clunky, and help you to evaluate the individual glyph designs. <br> <br>David </p>
  - id: 7061
    user: 1014
    date: 2002-06-01T23:51:00
    date_raw: 1 Jun 2002 — 11:51pm
    votes: null
    html: "<p> John - this face has nice potential... <br> <br>UC J, i'd bring down <br>UC V seems narrow <br>lc e needs some breathing room <br>lc t, i'd try some alternates <br>lc m and w, perhaps widen <br> <br>Also, the glyphs with a crossbar...they might look better with a 'centered' crossbar. <br> <br>Re: Dave's comments...Because you're in illustrator, setting up some guide lines and snapping to them will give you a consistent baseline. Or use a grid. Or when you are done, use the Align tool. <br> <br>In Fontographer, manually tighten your space bar spacing. It defaults at '1000' which is excessive. <br> <br>good lookin' stuff. <br> <br>bj </p>"
    html_clean: "<p> John - this face has nice potential... <br> <br>UC J, i'd bring down <br>UC V seems narrow <br>lc e needs some breathing room <br>lc t, i'd try some alternates <br>lc m and w, perhaps widen <br> <br>Also, the glyphs with a crossbar...they might look better with a 'centered' crossbar. <br> <br>Re: Dave's comments...Because you're in illustrator, setting up some guide lines and snapping to them will give you a consistent baseline. Or use a grid. Or when you are done, use the Align tool. <br> <br>In Fontographer, manually tighten your space bar spacing. It defaults at '1000' which is excessive. <br> <br>good lookin' stuff. <br> <br>bj </p>"
