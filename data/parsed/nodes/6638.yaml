  - id: 46547
    user: 1262
    date: 2004-09-17T11:54:00
    date_raw: 17 Sep 2004 — 11:54am
    votes: null
    html: "<p>I don't speak most of the languages for which I design type. Even if I spoke one language for each of the scripts for which I design, that would still be only a tiny percentage of the actual languages written in those scripts. Speaking or reading knowledge of a language is not necessary to design for 'foreign' scripts. It is important to have a good understanding of the history and development of the script, or to work closely with people who do. I try to understand scripts as systems, in terms of construction, relationship to language and grammar, etc. Most often, I arrange to have my work reviewed by an experienced typographer who is a native user of the script, unless I'm particularly confident in my knowledge of a script or can't find someone with the appropriate skills and experience. <br> <br>I started designing for non-Latin scripts in 1997, when I tried my first Cyrillic design. At the time, I was mainly looking for a way to expand the number of shapes I got to draw: I was getting bored of Latin letters. Later I realised that I'd accidentally stumbled into one of the few growth areas in this business, and also one in which few of my colleagues were working. <br> <br> <br>You can make plenty of non-Latin typefaces without VOLT. You only need VOLT if the script requires OpenType Layout features that are not supported in FontLab yet, e.g. anchor attachment positioning. Since VOLT is a Windows tool, you need to either be running a Windows machine or VirtualPC to make complex script OT fonts. You can, of course, make AAT format complex script fonts using free tools from Apple, but the tools are ludicrously difficult and the format has only minimal application support and is not cross-platform compatible. <br> <br>A lot of people who start out in Latin script type design come to it from a North American or European graphic design background, in which the Mac is still the most common tool. But for non-Latin font development and <i>use</i> Windows is a much more common platform. Personally, when I look at the range of font development applications and tools that are available on Windows, many of them free, I really can't see any point in using a Mac. Windows is simply a better font development environment. This is not to say that typical Latin font makers are missing out on anything by using a Mac: if everything you need to do can be done in FontLab, then it doesn't matter what platform you are on. But I have upwards of 20 font development and testing applications on my system, which perform a variety of functions including things that cannot be done in FontLab and which have no parallel on the Mac. Now, I should also point out that most of my clients are major software developers, who have very strict technical quality assurance requirements, so the kind of non-critical bug that might pass unnoticed in the average Latin retail font is not acceptable in my work. And if, for example, my client says they want a TT font to have a version 3 OS/2 table and a format 3 post table, I need to be able to deliver that, even if FontLab doesn't have these options yet. <br> <br> <br>SBL is the Society of Biblical Literature, a scholarly organisation that is one of my clients.</p>"
