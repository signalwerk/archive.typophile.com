    html: <p><i>Scripts - typefaces? or programming issue?</i> <br> <br>Heh, sorry, neither. The term 'complex script' is used to refer to a writing system in which there is not a simple sequential rendering of glyphs relative to character codes. So Latin is typically considered a simple or non-complex script, because there is a one-to-one relationship between the characters that you type and the glyphs that appear on your screen, which are simply laid out in a line. Of course, once you start including ligatures, variant letters, dynamic accent positioning, etc. Latin ceases to be so simple, but it remains differentiated from complex scripts in the sense of writing systems that require complex processing simply in order to be readable. So, for example, Arabic is a complex script because individual letters may take different forms depending on where they occur in a word or what the adjacent letters are, and this is normative behaviour for the writing system. <br> <br> <br><i>you design Indian and Arabic fonts?</i> <br> <br>I have not designed any Indian typefaces yet, but I'm looking forward to it. I've done Thai (with Fiona Ross and Tim Holloway), which is related to the Indic writing systems. I've collaborated (again, with Fiona and Tim) on Arabic font development, although Tim does most of the actual design and I have the fun job of making the complex script stuff work with OpenType lookups. The most complex thing I've had to both design and build was the SBL Hebrew font for Biblical Hebrew.</p>
