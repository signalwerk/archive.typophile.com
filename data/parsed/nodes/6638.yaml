    html: "<p>In response to Hrant's comment on cultural boundaries: <br> <br>I've found that a little cultural cross polination is the perfect way to push cultural boundaries. For example, Latin alphabets done in Japan are very interesting. (I recently came across <a href=\"https://web.archive.org/web/20141112041540/http://www.p22.com/pavilion/index.html\">these</a> at p22). Even from a linguistic standpoint, non-native speakers often use expressive transliterations that, because they are different from common idioms, communicate beautifully. <br> <br>Now, Hrant may argue that becuase so many Roman-native type designers do non-roman fonts, the cross-polination has gone out of control--an invasive species out-competing the native fauna, as obrusive as non-native sucker fish, sqeezing out the native trout in my state. This may very well be the case.</p>"
