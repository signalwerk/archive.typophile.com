    html: <p><a href="https://web.archive.org/web/20141112041540/http://www.microsoft.com/typography/VOLT.mspx">VOLT</a> = Visual OpenType Layout Tool <br> <br>This is a free, Windows-only tool provided by Microsoft for adding OpenType Layout functionality to TrueType fonts*. It has a number of advantages over current FontLab and the Adobe FDK, most importantly in supporting some lookup types that are not supported in the FDK code, particularly one-to-many substitutions and anchor attachment positioning. It also allows you to order lookups independently of features, which means you can stagger lookups from different features which can help efficiency. VOLT is pretty much essential for doing any work with complex scripts, so it has a large user base of Indian and Arabic font developers. I've been using it since 2000, and still prefer it to FontLab for this kind of work.  <br> <br>*It can also be used to add such functionality to CFF OT fonts, but VOLT does not have a CFF rasteriser, so you need to do your work in a dummy TT font and then import it to a CFF font.</p>
