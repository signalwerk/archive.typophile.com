  html: <p>I'm working on a handwriting font that I would like to make semi-random. I alrady have glyphs for primary and alternate forms set up in fontlab. I tried to read through the Microsoft OpenType spec but it was like eating a box of rocks, a little hard to swallow. All I want to do is code the font so that "ss" and other dual characters that I set up will automatically be replaced with "s s.Alt" etc. <br> <br>Can someone point me to an easy guide to the programming side of OTFs, or let me know which code sequence I should be using?</p>
  html_clean: <p>I'm working on a handwriting font that I would like to make semi-random. I alrady have glyphs for primary and alternate forms set up in fontlab. I tried to read through the Microsoft OpenType spec but it was like eating a box of rocks, a little hard to swallow. All I want to do is code the font so that "ss" and other dual characters that I set up will automatically be replaced with "s s.Alt" etc. <br> <br>Can someone point me to an easy guide to the programming side of OTFs, or let me know which code sequence I should be using?</p>
