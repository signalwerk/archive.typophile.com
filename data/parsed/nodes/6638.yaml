    html: "<p>Are you making the OpenType features with FontLab or VOLT or ? If we know what tools you are using, we can provide more precise advice. <br> <br>Basically, though, you want to create a set of substitution lookups for the Contextual Alternates &lt;calt&gt; layout feature. I use VOLT for OpenType, so in VOLT syntax I would express your example in this way: <br> <br> s -&gt; s.alt <br> s | <br> <br>The bar in the second line indicates the context, so this substitution would occur whenever preceded by s. <br> <br>Someone else can probably explain the FontLab / Adobe FDK syntax better than I can. I always have to go and read the manual again whenever I do any OT work directly in FontLab.</p>"
    html_clean: "<p>Are you making the OpenType features with FontLab or VOLT or ? If we know what tools you are using, we can provide more precise advice. <br> <br>Basically, though, you want to create a set of substitution lookups for the Contextual Alternates &lt;calt&gt; layout feature. I use VOLT for OpenType, so in VOLT syntax I would express your example in this way: <br> <br> s -&gt; s.alt <br> s | <br> <br>The bar in the second line indicates the context, so this substitution would occur whenever preceded by s. <br> <br>Someone else can probably explain the FontLab / Adobe FDK syntax better than I can. I always have to go and read the manual again whenever I do any OT work directly in FontLab.</p>"
