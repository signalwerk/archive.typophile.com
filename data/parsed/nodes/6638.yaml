    html: <p>I love cross-polination. I also love cultural variety. The degree to which these two things can coexist positively depends on the "security" of the scripts/cultures in question. What I mean is that for example Latinization of Armenian is much worse than that of Cyrillic or Arabic. And things like the Arabization of Latin is downright great - and I'm not saying this due to some cultural prejudice, but simply because Latin is too strong to be hurt by it - it can only get richer thanks to cross-polination. <br> <br>Also, a big on-the-ground problem with cross-polination is that it's almost never done with the subtlety necessary in the realm of text design. Virtually all Latinized non-Latin fonts reduce readability through blind fealty to formalism (eg matching x-heights), and pretty much every single Latin face that's made to look like some non-Latin script or other can only ever be a cute, naive display face. We need to clearly understand the qualitative difference between text and display before we can apply typographic cross-polination well. But even then sometimes it's a bad idea. <br> <br>hhp</p>
