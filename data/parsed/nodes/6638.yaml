    html: "<p>There are three types of substitutions that may be useful to you: <br> <br>- ligatures <br>- contextual alternates <br>- contextual ligatures <br> <br>Ligatures are easy as pie. For example, if you have an ss ligature with a glyph name of \"s_s\" (not to be confused with the German eszett), you could do: <br> <br>feature liga { <br>sub s s by s_s;  <br>} liga; <br> <br>Or for a contextual substitution where you get a different ss ligature when ss comes after the letter \"e\" <br> <br>feature clig { <br>sub e s' s' by s_s.alt;  <br>} clig; <br> <br>Note that you would want to put the clig feature ahead of the liga feature to make that work. Otherwise you'd already have the s_s ligature and that substitution wouldn't fire. To make clig work *after* liga, you'd do: <br> <br>feature clig { <br>sub e s_s by s_s.alt;  <br>} clig; <br> <br>Hope this quick tutorial helps. <br> <br>T</p>"
    html_clean: "<p>There are three types of substitutions that may be useful to you: <br> <br>- ligatures <br>- contextual alternates <br>- contextual ligatures <br> <br>Ligatures are easy as pie. For example, if you have an ss ligature with a glyph name of \"s_s\" (not to be confused with the German eszett), you could do: <br> <br>feature liga { <br>sub s s by s_s;  <br>} liga; <br> <br>Or for a contextual substitution where you get a different ss ligature when ss comes after the letter \"e\" <br> <br>feature clig { <br>sub e s' s' by s_s.alt;  <br>} clig; <br> <br>Note that you would want to put the clig feature ahead of the liga feature to make that work. Otherwise you'd already have the s_s ligature and that substitution wouldn't fire. To make clig work *after* liga, you'd do: <br> <br>feature clig { <br>sub e s_s by s_s.alt;  <br>} clig; <br> <br>Hope this quick tutorial helps. <br> <br>T</p>"
