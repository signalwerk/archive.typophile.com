    votes: null
    html: |-
      <p>I had always understood the GFS fonts to be based on historic <em>Greek</em> typefaces, not Latin ones. Less serious font sources will base their faces on popular Latin faces - thus I was startled at one point to see an Armenian version of Mistral. But why shouldn't Armenians get to have fun with display faces?</p>
      <p>Looking at the display of Solomos on the GFS website, the first thing that strikes me as an appropriate companion to it is Century Expanded. That is, however, anachronistic, and a Scotch Roman would indeed be a better match.</p>
      <p>For Cyrillic, there's a free Scotch Roman, the typeface "Old Standard" by Aleksey Kryukov, but that face seems to be a bit heavier with more stroke contrast. However, when I took another look at a specimen, it doesn't seem to clash with Solomos as much as I feared, so it might be acceptable.</p>
