    html: <p><a href="http://www.myfonts.com/fonts/shinn/scotch-modern/">Scotch Modern</a> is a 19th century revival with Latin, Cyrillic and Polytonic Greek, and small caps and other expert features throughout. Note the handling of roman/italic in the Greek, for present day functionality amongst the three scripts. There are also stylistic options for characters such as rho, theta, phi etc.</p>
