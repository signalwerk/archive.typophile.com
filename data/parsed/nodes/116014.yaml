    votes: null
    html: <p>That's probably right; the thing I like most about Solomos is how closely it's spaced vertically, which along with the eccentric curves make it an excellent choice for a font that is both compact and pleasing to the eyes (which is important given I'm using this font for running text, not just italic emphasis), but it's been a challenge to find a Latin or Cyrillic font with similar qualities</p>
