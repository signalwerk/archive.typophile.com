      <p>&gt;… so if I have running text in Solomos and then I introduce a word or two in a Latin or Cyrillic font, it's ascenders will push that line down from the text above it</p>
      <p>To manage such little issues is at the very basic of typographic practice. It has little to do with your initial request of an appropriate typeface.<br>
      I can only second Mr. Shinn, his Scotch Modern might just meet the briefing best. I don’t see where else you may get a quality typeface in that style which profoundly covers Latin, Greek and Cyrillic.</p>
