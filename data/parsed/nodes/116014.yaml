    html: <p>GFS Decker has actually proven a great workaround to polytonic small caps--since it's an uncial font it has approximately the same effect while making a marked contrast to the curves of Solomos! but it's thinness suits it much better for Solomos than for Scotch. Do you suggest I should just use Scotch instead of Solomos?</p>
