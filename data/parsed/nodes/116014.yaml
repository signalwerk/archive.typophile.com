    html: |-
      <p>Here I’ve matched the Scotch Modern to your Solomos specimen, by horizontally scaling it to 96%.<br>
      Note that with the same nominal x-height and leading, there is more space between ascenders and descenders.<br>
      The small caps don’t have polytonic accents, though, so you would have to make do with the convention that capitals, normal and small, don’t require accents, or ﬁnd a work-around. (Or commission those!)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Scotch_Greek_3494.jpg"></div><p></p>
