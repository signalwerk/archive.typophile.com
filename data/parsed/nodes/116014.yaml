      <p>To your credit this font looks great! I think the difficult thing about using Solomos with other fonts is that the letters are set very high compared to other fonts, so if I have running text in Solomos and then I introduce a word or two in a Latin or Cyrillic font, it's ascenders will push that line down from the text above it</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sample V_3955.png"></div><p></p>
