    <p>I'm looking for an italic font with wide Latin and Cyrillic support that looks similar to this Greek font, GFS Solomos. Here's a sample, Romans 3:21-26 (the first word is in GFS Decker for small caps):</p>
    <p><img src="/sites/default/files/old-images/Sample I_4822.png"></p>
    <p>The closest thing I have right now is the italic version of Garamond, but it's not quite right--the strokes are too thin and the letters are too narrow. The sample below compares similar glyphs, GFS Solomos on left, italic Garamond on right:</p>
    <p><img src="/sites/default/files/old-images/Sample II_4784.png"></p>
    <p>Thanks so much in advance!<br>
    --PADetz</p>
