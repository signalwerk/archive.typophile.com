      <blockquote><p>But why shouldn't Armenians get to have fun with display faces?</p></blockquote>
      <p>There are different kinds of fun. Some people think chess is fun. Others think Russian Roulette is fun. The thing with a font is that when you make one, you're potentially deeply affecting the parameters of your culture, long into the future. I've seen the Armenian Mistral: it's like an Armenian faking a French accent. Plus it doesn't have the proper paperwork.</p>
      <p>hhp</p>
