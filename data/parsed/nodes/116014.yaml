    html: <p>I'll go hunting on Google and see what I find, but the GFS doesn't have anything on what this face is based on, all they have is "From the middle of the 19th century an italic font with many calligraphic overtones was introduced into Greek printing. Its source is unknown, but it almost certainly was the product of a German or Italian foundry. In the first type specimen printed in Greece by the typecutter K. Miliadis (1850), the font was listed anonymously along others of 11pts and in the Gr. Doumas' undated specimen appeared as «11pt Greek inclined»."</p>
