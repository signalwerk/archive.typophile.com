      <p>One starting point might be the use of symbols in alchemy to represent elements, planets corresponding to elements, processes, chemicals etc.</p>
      <p><a href="http://en.wikipedia.org/wiki/Alchemical_symbol" title="http://en.wikipedia.org/wiki/Alchemical_symbol">http://en.wikipedia.org/wiki/Alchemical_symbol</a><br>
