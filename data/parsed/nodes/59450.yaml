      <p>Your sketches are more powerful and expressive than your digital version of the logo.<br>
      None of the two convey the idea of wind ("aero" in greek, but I think you knew that) while the last sketch was quite streamlined.<br>
      Try to keep the swoosh of the R, but give it square edges.<br>
      Also pay attention to the thickness of the lines; in the first version the top line of the E and the last one are too different :)</p>
