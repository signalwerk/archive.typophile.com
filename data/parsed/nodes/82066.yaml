      <p></p><div class="imageWrap"><img src="http://typophile.com/files/H01_3570.jpg"></div><p></p>
      <p>This is a pretty old version of the logo and is definitely custom lettering. The three a's are different. So are the two l's and r's. Hallmark were traditionally a good employer for lettering artists.</p>
      <p>Even more recent versions of the logo don't seem to have used fonts. </p>
