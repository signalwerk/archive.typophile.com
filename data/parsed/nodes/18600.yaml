    <p>Among other things, Dr. Wolf was the designer of the famous <a href="/node/18601/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Memphis</a> type family, and the possible creator of the famous type design test string <a href="/node/18596/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">hamburgefontsiv</a>.</p>
    <p>Dr. Wolf received his PhD from the University of Frankfurt, and taught typography in addition to his designing and advertising duties at&nbsp;Stempel.</p>
    <p>The <a href="/node/13012/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Klingspor Museum</a> in Offenbach has a <a href="www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Wolf/RWolf.pdf" class="link-lost"><span class="caps">PDF</span> online listing all known typefaces attributed to Dr. Wolf</a>.</p>
