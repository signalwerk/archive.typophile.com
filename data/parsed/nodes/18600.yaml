    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Dr. Rudolf&nbsp;Wolf</strong></p>
    <p>German, born 1895 in Hechingen, Germany. Died by suicide on September 7,&nbsp;1942.</p>
    <p>Designer at the <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> in Frankfurt am Main,&nbsp;Germany.</p>
    <p>Among other things, Dr. Wolf was the designer of the famous <a href="/node/18601" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Memphis</a> type family, and the possible creator of the famous type design test string <a href="/node/18596" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">hamburgefontsiv</a>.</p>
    <p>Dr. Wolf received his PhD from the University of Frankfurt, and taught typography in addition to his designing and advertising duties at&nbsp;Stempel.</p>
    <p>The <a href="/node/13012" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor Museum</a> in Offenbach has a <a href="www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Wolf/RWolf.pdf"><span class="caps">PDF</span> online listing all known typefaces attributed to Dr. Wolf</a>.</p>
