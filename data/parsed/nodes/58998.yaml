    html: |-
      <p>Bert, can you elaborate upon why you believe it necessary to have all separate screen fonts? I have several machines, all on OS X since 10.1 (currently 10.5.6) and have absolutely no problems with bundled (suitcased) screen fonts.</p>
      <p>I don't use Font Book though; I use Suitcase.</p>
