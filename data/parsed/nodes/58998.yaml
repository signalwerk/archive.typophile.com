      <p>You need to move the "printer" fonts as well, not just the suitcases:<br><img src="/sites/default/files/old-images/fru_4472.png"><br>
      Only "Frutiger" is a screen font (or a "suitcase"), all others are printer fonts. And, they all look the same under OSX!</p>
