    html: |-
      <p>Another matter: the screenfonts need to be separate — in other words: not bundled in one suitcase. AND the family links have to be resolved.</p>
      <p>In the screenshot above there are 9 printerfonts and one suitcase with probably all the corresponding screenfonts. You would want to have nine separate screenfonts.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
