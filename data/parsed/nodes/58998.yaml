  html: <p>Hi all I have some old Postscript fonts on an OS 9.2 macintosh computer that I need to move onto a brand new OSX machine. The fonts are postscript fonts organized by adobe font suitcases. For some reason whenever I move them over to the new machine, OSX font book refuses to recognize them. Does anyone know why or have any suggestions for what to do?</p>
  html_clean: <p>Hi all I have some old Postscript fonts on an OS 9.2 macintosh computer that I need to move onto a brand new OSX machine. The fonts are postscript fonts organized by adobe font suitcases. For some reason whenever I move them over to the new machine, OSX font book refuses to recognize them. Does anyone know why or have any suggestions for what to do?</p>
