    html: |-
      <p>You need to move the "printer" fonts as well, not just the suitcases:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fru_4472.png"></div><br>
      Only "Frutiger" is a screen font (or a "suitcase"), all others are printer fonts. And, they all look the same under OSX!<p></p>
