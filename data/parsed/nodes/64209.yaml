  html: |-
    <p>Hello Typophiles!</p>
    <p>This is my first blog post - how exciting!</p>
    <p>'Poppet' is a typeface that I created a couple of months ago.  I wanted to transform each letter into 'characters'.</p>
    <p>Each letter is doing an individual activity, that you would associate with children, i.e. hop-scotch, hula-hoop.</p>
    <p>The letters, at the moment, are black, but I think that adding a bit of colour would bring each personality to life even more!</p>
