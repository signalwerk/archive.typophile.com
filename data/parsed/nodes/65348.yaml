      <p>You're client's not a designer, and I imagine when he looks at the other guy's image, he sees coolness, which is how he feels about his product.  When he looks at your design in comparison, he sees lameness.  At this point, he's not thinking about the finer points of what makes a good logo; he obviously hasn't considered what the other guy's image will look like when scaled down to one inch wide.</p>
      <p>Ask your client what he likes about the other guy's image.  Once you have a good idea of what it is, tactfully help him understand why that image is deficient.  Explain what makes a good logo in terms he can appreciate, and tell him that you can create a logo with the elements (or the spirit of the elements) he likes from the other image, and that you have the necessary experience and expertise to ensure that it will look good at all sizes where it will be used, in any medium where it will be printed, etc.  Emphasize that you will work with him until he's satisfied and that you are an expert and will save him from grief and embarrassment down the road.  Make him feel good about himself and about you.</p>
