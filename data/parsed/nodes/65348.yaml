    html: |-
      <p>Tell them you had a friend (with no training in home building or product development) design a version of the Window Warden. And it's made of rubber bands and sticks.</p>
      <p>Jokes aside, tell them your honest opinion is that the friend's design won't work. (for the reasons others mentioned above). Use this as an opportunity to educate them on logo design. Point out that a logo is a component of a product's or business's identity. The friend-designed logo is trying to do too much work with the shadow, stroked letterforms and the illustration.</p>
      <p>Of your concepts, 2 and 3 work best for me. Continue pushing the ww combo idea in #2 to create an interesting mark that could stand alone. Perhaps this ww is reversed out of a shape. Try arranging "Window Warden" in different ways below or to the right of the mark.</p>
      <p>I agree with Chris that your type choice feels friendly (with the exception of #3 and maybe #1). I can't say for sure if that's bad. Depends on what this product looks like, where it will be sold/marketed and who the audience is. My guess is that you want the type to communicate secure, but not too serious. If you go too friendly people may lose confidence in what the product promises to perform. If you go too serious, people may feel that the product is too complicated and may fear it would be difficult to quickly disassemble in a hurry. Mostly subliminal, of course.</p>
      <p>Did you get a clear idea of the concepts your client wants communicated?</p>
