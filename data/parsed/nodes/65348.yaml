    <p>I am working on a logo for a piece of hardware that works as a fall safety device. The product was developed by a home building firm to meet specific code regulations and they are now testing the market to see if it may be something that could be sold to mothers of young children and insurance agencies through a mostly online marketing campaign. The device works by being attached to the track of your window and will prevent the window from opening more than four inches...in case of an emergency it can be easily be removed by pushing down on it. They are calling it the Window Warden.</p>
    <p>The first proof of logo concepts that I emailed to them is in the pdf folder. I was disheartened when they returned that email asking my opinion on the below jpg file (1.jpg) According to my client, "One of the guys involved in the project, had a friend draw something up" and they want my opinion on it. How do I make them understand why what their friend drew up is poor design and lead them towards a quality logo.</p>
    <p>Any feed back on my logo concepts (windowwarden.pdf) or how to deal with a client who thinks that the 1.jpg file is a good design will be greatly appreciated.</p>
