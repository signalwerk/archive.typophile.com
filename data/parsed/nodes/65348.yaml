      <p>I'd just scale down their "friend" design and show them that it won't work at small sizes, doesn't work without the fade/gradient, etc.</p>
      <p>As far as your concepts, your type choices feel too friendly to me, solid and secure has me wanting a meaty, bold typeface. I understand you may want something somewhat friendly if you're going after a female audience but it can't be too soft. I don't see a lot of concept behind them other than playing a window form, what about the idea of a lock and window, maybe a gate or bars and a window, etc. Do some more exploring and see what you can come up with.</p>
