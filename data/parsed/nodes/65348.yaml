      <p>Thank you everyone for your astute comments.</p>
      <p>For more insight into the project take a look at this image of the actual product.</p>
      <p>It is really not a very exciting object...more something you would find on a rack at Home Depot. The client also was concerned with the word "warden" conjuring up images of unfriendly and restrictive officials. They definitely wanted to soften the blow of the harsh sounding title with a softer, kid friendly look and feel that, again, attracts women of young children.</p>
