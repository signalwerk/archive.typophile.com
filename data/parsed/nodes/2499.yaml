    html: "<p>I've experimented with curves as you have, but without the results you have achieved. Nice work. <br> <br>My experimenting has been done with bold pixel fonts though, where the contrast between the black and the gray portions of each letterform are much more pronounced. <br> <br>I really think that \"gray\" pixel fonts are great additions to the pixel font world, but what are your thoughts on their useability? <br> <br>What I mean to say is, the letterforms break down when not used at their intended point size. Before anyone yells foul, I'm not talking about setting the type at 10pt when the font should be set at 8. I'm talking about setting the type at 16pt or 24. <br> <br>Granted, not many pixel font owners actually set the type this way, but it is one definate advantage that non aliased pixel fonts have over their \"gray\" cousins: wider useage possibilities. <br> <br>Each has its own strengths, I think, and am glad to see more energy going into pixel font development.</p>"
    html_clean: "<p>I've experimented with curves as you have, but without the results you have achieved. Nice work. <br> <br>My experimenting has been done with bold pixel fonts though, where the contrast between the black and the gray portions of each letterform are much more pronounced. <br> <br>I really think that \"gray\" pixel fonts are great additions to the pixel font world, but what are your thoughts on their useability? <br> <br>What I mean to say is, the letterforms break down when not used at their intended point size. Before anyone yells foul, I'm not talking about setting the type at 10pt when the font should be set at 8. I'm talking about setting the type at 16pt or 24. <br> <br>Granted, not many pixel font owners actually set the type this way, but it is one definate advantage that non aliased pixel fonts have over their \"gray\" cousins: wider useage possibilities. <br> <br>Each has its own strengths, I think, and am glad to see more energy going into pixel font development.</p>"
