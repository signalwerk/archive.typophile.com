    html: <p>Pretty nice overall. <br>1) The taller smallcaps are better. <br>2) Upright italics don't really work (as emphasis) - it's better to call that a "cursive Roman". <br>3) I think the oldstyle numerals a little bit too oldstyle. Try making them hybrids, matching the [larger] smallcaps in scale. <br> <br>hhp <br></p>
    html_clean: <p>Pretty nice overall. <br>1) The taller smallcaps are better. <br>2) Upright italics don't really work (as emphasis) - it's better to call that a "cursive Roman". <br>3) I think the oldstyle numerals a little bit too oldstyle. Try making them hybrids, matching the [larger] smallcaps in scale. <br> <br>hhp <br></p>
