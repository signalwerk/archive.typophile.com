    html: <p>&gt; black pixels keep the font together <br> <br>Indeed. One reason automatic-from-outlines rendering sucks is that you seldom get solid black where you should. <br> <br>You certainly have room for more subtlety with grayscale than you do with b&amp;w bitmap fonts, but there's still a tight limit. <br> <br>hhp <br></p>
