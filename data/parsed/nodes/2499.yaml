  - id: 20180
    user: 2046
    date: 2003-12-22T12:51:00
    date_raw: 22 Dec 2003 — 12:51pm
    votes: null
    html: "<p>There's huge development in pixelfonts, at the garage level, and it is awesome. Big digital type companies so far have seemed to ignore it, which is dumb cause cheap devices are sprouting screens all the time. <br> <br>Luciano asked: <br>&gt; Hello Christopher, How is the TiD patented <br>&gt; method? Can you explain here to compare? Thanks <br> <br>A year ago, there were no greyscale pixelfonts. I had a brainstorm, did some tests, and came up with a reliable method. TiD applied for and got a provisional patent on the use of subpixel forms \"partial fills\" in outline type. Outline type is the key - there are embedded bitmap fonts on Win, Mac and Unix but they are not compatible. <br> <br>Partly this was to make me rich, partly it was to prevent other companies from patenting it for one platform or the other. Currently outline pixelfonts (grayscale and otherwise) are the ONLY crossplatform compatible pixel fonts. <br> <br>It's a little ironic that the outline format, in a way the opposite of pixels, is the bridge. <br> <br>tyler asked: <br>&gt; I really think that \"gray\" pixel fonts are <br>&gt; great additions to the pixel font world,  <br>&gt; but what are your thoughts on their useability?  <br> <br>It's a compromise. They can be MORE usable at their intended size, cause grey helps humans read, especially when the pixels are painted by another human. But they do fall apart at other sizes. I think we'll need every kind of type in the future.</p>"
    html_clean: "<p>There's huge development in pixelfonts, at the garage level, and it is awesome. Big digital type companies so far have seemed to ignore it, which is dumb cause cheap devices are sprouting screens all the time. <br> <br>Luciano asked: <br>&gt; Hello Christopher, How is the TiD patented <br>&gt; method? Can you explain here to compare? Thanks <br> <br>A year ago, there were no greyscale pixelfonts. I had a brainstorm, did some tests, and came up with a reliable method. TiD applied for and got a provisional patent on the use of subpixel forms \"partial fills\" in outline type. Outline type is the key - there are embedded bitmap fonts on Win, Mac and Unix but they are not compatible. <br> <br>Partly this was to make me rich, partly it was to prevent other companies from patenting it for one platform or the other. Currently outline pixelfonts (grayscale and otherwise) are the ONLY crossplatform compatible pixel fonts. <br> <br>It's a little ironic that the outline format, in a way the opposite of pixels, is the bridge. <br> <br>tyler asked: <br>&gt; I really think that \"gray\" pixel fonts are <br>&gt; great additions to the pixel font world,  <br>&gt; but what are your thoughts on their useability?  <br> <br>It's a compromise. They can be MORE usable at their intended size, cause grey helps humans read, especially when the pixels are painted by another human. But they do fall apart at other sizes. I think we'll need every kind of type in the future.</p>"
