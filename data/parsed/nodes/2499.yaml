    html: <p>Nice illustration of a fact - subpixels do not need to be square.  <br> <br>Luciano's way is a twist on the method TiD patented and licensed to FFF. We used square subpixels but many geometric forms are possible. Different fonts may call for different subforms. <br> <br>TiD is launching a foundry to popularize and market such fonts to Flash and Photoshop designers, contact me for info. <br> <br>Adding to Darryl and Gustavo's comments, many diagonals (N,M,K etc) are fuzzy. Tune them in Photoshop, then get a calculator and figure out the grey fill.</p>
    html_clean: <p>Nice illustration of a fact - subpixels do not need to be square.  <br> <br>Luciano's way is a twist on the method TiD patented and licensed to FFF. We used square subpixels but many geometric forms are possible. Different fonts may call for different subforms. <br> <br>TiD is launching a foundry to popularize and market such fonts to Flash and Photoshop designers, contact me for info. <br> <br>Adding to Darryl and Gustavo's comments, many diagonals (N,M,K etc) are fuzzy. Tune them in Photoshop, then get a calculator and figure out the grey fill.</p>
