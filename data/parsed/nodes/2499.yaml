    html: "<p>The flow of the lowercase letters is becoming very smooth. I don't like the upright italics/cursive roman as much. I know, it's hard to keep diagonals the same thickness as horizontal and vertical lines. (see lowercase f). <br> <br>Be careful not to make 'body pixels' too light. They can wash out if the text is inverted, or set against a background. Greys are great but the black pixels keep the font together... <br> <br><img src=\"http://www.typophile.com/forums/messages/29/23045.gif\" alt=\"O'Higgins darkened (gamma +0.71)\"> <br> <br>p.s. I didn't really answer Luciano's question above. this is an illustrated explanation of the TiD patent: <br>http://www.truthindesign.com/gray-cell.html</p>"
    html_clean: "<p>The flow of the lowercase letters is becoming very smooth. I don't like the upright italics/cursive roman as much. I know, it's hard to keep diagonals the same thickness as horizontal and vertical lines. (see lowercase f). <br> <br>Be careful not to make 'body pixels' too light. They can wash out if the text is inverted, or set against a background. Greys are great but the black pixels keep the font together... <br> <br><img src=\"http://www.typophile.com/forums/messages/29/23045.gif\" alt=\"O'Higgins darkened (gamma +0.71)\"> <br> <br>p.s. I didn't really answer Luciano's question above. this is an illustrated explanation of the TiD patent: <br>http://www.truthindesign.com/gray-cell.html</p>"
