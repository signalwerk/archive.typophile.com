    html: <p> For the magazines, you can look up 'Editor and Publisher' at most major libraries. <br> <br>For the design firms, maybe get the Vancouver phone book, also at a major library. You'd be surprised at how many design firms are listed in the Yellow Pages. <br> <br>There's probably an annual that lists design firms, too. Don't know. <br> <br>Then rent all the good Canadian movies, so you can quote the vernacular, eh? <br> <br>bj </p>
