  html: <p> I'm thinking about moving to Vancouver. I'm heading there in March to look for a job, and I want to set up as many interviews as possible. I don't really know too much about the city, but I feel like something is calling me there. I need to find some amazing design firms or magazines to interview at. Does anyone have any good suggestions, or things I should or shouldn't do when I go up there? </p>
  html_clean: <p> I'm thinking about moving to Vancouver. I'm heading there in March to look for a job, and I want to set up as many interviews as possible. I don't really know too much about the city, but I feel like something is calling me there. I need to find some amazing design firms or magazines to interview at. Does anyone have any good suggestions, or things I should or shouldn't do when I go up there? </p>
