    html: "<p> Specifically: <br>I can't suggest too much, as I've only visited Vancouver once, for a few days only, and it was a long time ago, before things like a career were on my mind. I thought it was a very pretty town. But I do know a couple of people who might be willing/able to help/guide you - I'll point them here and see what happens. <br> <br>In general: <br>In December of '92 I moved from LA to Barcelona, and I lasted about 6 months. But even so it was maybe the single best thing I've done in my life so far. I learned *so* much, including things I can feel I haven't realized yet. The main thing I'd try to convey to you is how important it is to strike a balance between being a gracious guest in your new city versus being a brash young adventurer. Too much of either and you'll never become a true citizen of you adopted environment (which however doesn't mean a perpetually nomadic lifestyle isn't an option). <br> <br>Two [potentially intrusive] questions: <br>1. If I may ask (you certainly don't have to answer), is there a girl involved? If so, don't dream so deeply as to lose your direction, eh? Unless it's the real thing. <br>2. What's *really* calling you: foreign lands in general, Canada, or specifically Vancouver? Try to figure that out ASAP. And if it's the middle one, you might consider Montreal instead, especially if you're looking for something more different than Minneapolis (since Montreal is as much French as it is the American). And it's one of the *very* few truly cool cities West of the Atlantic (Toronto is supposed to be pretty cool too, and if you're not a Francophile maybe a better choice). But what am I saying? I'm sure you have a good reason to shoot for Vancouver. Did you go there recently? If so (or actually in any case) you might want to dissect your [clearly] positive experience/impression with Vancouver/Canada to see what's really going on inside you. Heart and mind, working in harmony. <br> <br>Oh, one last thing: go for it. <br> <br>hhp </p>"
