      <p>Ah. I forgot this board is pretty much broken. Apologies for the large image. </p>
      <p>Some additional comments: The thinning of joins is not primarily inspired by pen traces – and hence, does not necessarily occur where expected. This makes me a bit unsure about how to handle contrast in other shapes. For the o, I’ve borrowed an idea from Fleischmann – something I’ve also echoed to some extent in b/d/p/q. Curves get a different treatment in terms of speed/angle/dynamism for inside and outside – if there is such a thing as inside and outside here.</p>
      <p>The a and (the bottom of the) g breaks the logical shoulder treatment of n, but they’ve got each other (as does the numerals, ampersand and Q), and I’ve been pondering adding r to that party too. And X? X is a disaster!</p>
