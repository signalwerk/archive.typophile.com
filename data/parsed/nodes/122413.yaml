    <p><img src="/sites/default/files/old-images/dyst_6281.png"></p>
    <p>I would very much appreciate your critique on this text typeface I’m working on. I am not so confident yet in the domain of <em>antikvas.</em> I suspect the wise thing to do, would be to not attempt to reinvent the wheel, but nevertheless these shapes have been on my mind for a while and I couldn’t bring myself to draw anything boring. It is intended for 9–10 points, sets darker than most text faces and the razor thin joins gives it a rather unique texture.</p>
