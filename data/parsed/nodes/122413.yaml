    html: |-
      <p>Very pretty and satisfyingly grippy. </p>
      <p>I'm not sure how well the /G and /Q will work — would have to see them in context — but they're certainly original and plausible shapes. I really like the chunky ascender tops and the half-circle bowls. The Satyr /a is as gorgeous as ever, and I'm also fond of your solution for the ear of /g, which feels unnatural to me in many typefaces.</p>
      <p>Is /U too narrow? The spine of /S a tad too straight? The tail of /Q a bit too straight and abruptly cut? I could imagine the latter to profit from some thickening or even a serif.</p>
      <p>Most accents strike me as too small and too little differentiated for the intended small text sizes. The ogonek could also use more heft.</p>
    html_clean: |-
