      <p>I think that this typeface despite looking unconventional in some ways is also a highly legible text face, and this combination of originality and utility is a good thing.</p>
      <p>However, I could also imagine someone criticizing it as looking too much like Aldus (Hermann Zapf's Palatino Book, but not given that name) - if one disregards its very original shapes for some letters, the two faces have a similar feel at least.</p>
