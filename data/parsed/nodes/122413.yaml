      <p>I like the new /S, /G, and tail of /Q. Does the body of the /Q have a subtle kink near the apex though?</p>
      <p>The /U still feels too narrow to me. This width might work for a traditional /U with a thin right side, but you have two full stems, which raises its demand for whitespace. I'm not sure the low connection in the /U is that much darker than the middle of /H, and in any case your /O has much more interior space and doesn't look out of place.</p>
      <p>Here's Perpetua's /U for comparison:<br><img src="/sites/default/files/old-images/perpetua_5830.jpg"></p>
      <p>By the way, is the flag of /r perhaps a bit too light and/or finicky? At text sizes, I feel it seems to stand out from the level of detail established by the other letters.</p>
