    <p>Hey guys,<br>
    Nice place you have here!</p>
    <p>I'm wondering if perhaps one of you can help me ID this font. I keep seeing this poster when im out and about advertising a club night (see poster below) and i know the font is very similar to that used in Michael Jacksons Thriller video.. but i can't for the life of me find out any further info about it.</p>
    <p>Anyone know where i can buy/download it?<br>
    (should just point out im talking about the typeface in RED)</p>
