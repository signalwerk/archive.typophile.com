      <p>You can't find it because it appears to be a hand-lettered logotype, not a typeface.</p>
      <p>Similar:<br>
      LHF Billhead 1900<br><a href="http://www.letterheadfonts.com/fonts/billhead.php">http://www.letterheadfonts.com/fonts/billhead.php</a></p>
      <p>Black Velvet 2 (which may very well have been used for "SWEET TEA," with a few modifications):<br><a href="https://fontbundles.net/twicolabs-fontdation/11551-black-velvet-2">https://fontbundles.net/twicolabs-fontdation/11551-black-velvet-2</a></p>
