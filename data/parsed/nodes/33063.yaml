      <p>Robin Kinross' essay "Modern typography" uses per-spread footnotes only on the right hand side (of course, this is a well-written and edited text, so the room for the footnotes does not exceed 1/3 to half of the page.<br>
      One more version I've seen is to use two different levels of notes: endnotes for citation stuff and less important information, and actual footnotes for important explanations, terms, and so on. Endnotes counted per chapter, footnotes with per-page symbols (*, dagger, §). Useful, and the endnotes "not distracting the reader" (whoever that may be).</p>
