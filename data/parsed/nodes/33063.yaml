  html: |-
    <p>I'm typesetting a friend's writing sample in philosophy, and I can't decide how to arrange and format the footnotes. (They must be footnotes, not endnotes.) I've attached an 8-page PDF. Each page is actually the same page of text but with the footnotes designed in a slightly different style. Here are the three main styles:</p>
    <p>1. Note number outdented; footnote text flush left with main text.</p>
    <p>2. Note number slightly indented, so that note text begins where indented paragraphs in main text begin.</p>
    <p>3. Note number indented, so that number appears where indented paragraphs in main text begin.</p>
    <p>Each style comes in two versions: one with a 2-inch rule separating the text from the notes and one without. The first style also has two more variations: one with a period after the note number and one without. In all of them, the main text is Aldus 12/15 and the footnotes are Aldus 10/13.</p>
    <p>I can't decide which of the three main styles I prefer. (An obvious fourth style would be to have the note numbers flush left with the main text.) The first is recommended by Bringhurst, but I don't think he has academic papers (with their sometimes long footnotes) in mind. I'm worried that the numbers standing outside of the margins draw too much attention to themselves.</p>
    <p>Does anyone have any comments about or favorites among these different styles? Any suggestions for doing something different? (I know that the hyphenation needs work.)</p>
    <p>Any help would be greatly appreciated!</p>
    <p>Matty</p>
