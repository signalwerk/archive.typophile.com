    html: |-
      <p>The usual style in the academic world is to use a paragraph indent for the note numbers, unless those numbers are also a superior. Outdenting the note numbers looks OK with loose leaves, but in a bound book, they are apt to get lost in the gutter on a right-hand (recto) page. If you want the note numbers flush to the text page &amp; then block indent the notes proper (flush &amp; hang), that's fine, though not as common. Cambridge University Press did this for a while, maybe still does.</p>
      <p>With paragraph style, the numbers "decimal align" only per-page. In other words, if you have notes 1-7 one page, you do not "clear for two digits." That happens only on the page where you go from one digit to two, and from two digits to three.</p>
      <p>Use of a rule may confuse some people. People reading this will be academics, who are use to footnotes. Usually, a rule is used when a footnote carries over from one page to the next. You always have to start a note on the page where it is called, but sometimes the footnotes are so long, there is no way to page the document without carrying part of the note over to the next page. In such cases, you use a rule to indicate the carried-over note. Three picas long is usually sufficient for the rule, but it can be full measure. If for some reason you must use a rule on all pages, make the normal rule a different measure than the rule you use to signal a carried-over note.</p>
      <p>One of the oddest situations I've ever encountered was a journal article, where the first line of text called three footnotes. The third footnote took over three full pages to set, even in 8-point type. The forth note was called on the second line of text. After taking it over with the publisher, it was decided to set the article opening, the first line of text, then the notes on the rest of that page &amp; the next two full pages (with rule, of course), before picking the text up again on the 4th page.</p>
      <p>Obviously, a poorly written/edited piece. The author would have been better served to either incorporate the note in the text or make an appendix of it, and the editor surely should have pointed this out before accepting the article. But it happens.</p>
      <p><cite>Edit:</cite></p>
      <p>It is also unnerving for a reader to discover some designer feels that he/she needs "help" deciphering a normal situation. So, for example, you do not need extra spaces between footnotes, just like you do not need extra spaces between paragraphs in the text.</p>
      <p>For example, some designers both block indent an extract, and set it in smaller type, so the reader "won't get confused." What reader? Most people who read this sort of thing are use to block quotes, they aren't going to get confused. You might as well put a printer's fist beside the extract. You wouldn't believe the number of things I've seen by both designers and editors "to keep the reader from getting confused" when it is obvious that anybody reading the text is going to have a college education or more. What usually happens is the designer/editor adds to the reader's confusion. There are ways to graphically help the reader, but they are usually not by highlighting elements he/she expects to see anyway.</p>
