    html: <p>I don't like the numbers outdented. I wrestled with the same situation recently - altho the notes were at the end of the chapter, not on each page. I checked a bunch of books for style, and ended up doing what you call the obvious fourth style, where the numbers were flush left with the main text (at least the longest number, as the numbers themselves were right aligned, and the text hung at the indent. It's a little less space-efficient but I also didn't put spaces between the notes themselves.</p>
