      <p>Way (way) back when I was a philosophy grad student, we didn't have such stratagems. If you had already been published (rare, at least in those days), you might include one of your offprints. But if the point is to set yourself off from others, I'd suggest Palatino is not the best choice. I can't really tell the field (epistomology or aesthetics or ethics?) from the snippet, but I think I'd use Cycles, with Arepo display, which would work for any of these. I wouldn't use Cycles for for math logic, and for something in the history of philosophy, font choice would depend on the period &amp; topic.</p>
