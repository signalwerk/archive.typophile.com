    html: |-
      <p>Since you've got your answer, I'll add another way to think about such things generally. Essentially, your question was "how should one handle the element 'footnotes'?"</p>
      <p>There is another way of thinking about the topic, which is, basically, "how should the element 'footnotes' be blended into the text page?"</p>
      <p>This is probably old-school thinking. I saw <cite>Helvetica</cite> last night, and was struck not so much by those who did and did not like the typeface Helvetica, but the two schools of thought, modernism and postmodernism. One of the older modernists remarked that you cannot spend your whole life looking at things a certain way and just change. But postmodernism has been around long enough for one of those devotees to walk slowly &amp; have white hair as well; they too have spent a lifetime looking at things a certain way.</p>
      <p>OK, back to the page. This is not a simple modernist versus postmodernist point of view; the notion of the type page is far older. I do suspect a postmodernist would disagree with what I'm about to say, but so too could a modernist.</p>
      <p>The reason I don't like flush &amp; hang footnotes is that it weakens the page. The page now has two distinct elements, the body text and the notes. Should these have a different graphic interpretation?  I suppose it depends on your point of view. Mine is no, the page is one of the things (aside form the content) that unites these elements. Just like a widow weakens the page, so too do flush &amp; hang footnotes. So would a full-measure rule, which, unlike a rule below the running head block, will not appear at the same place on the page.</p>
      <p>The situation is rather different with endnotes, either end-of-chapter or end-of-book. Here, the problem is to let the reader quickly find the appropriate note &amp; reference it to the text. Running heads giving the page number help (Notes to pages 000-00). So to can flush &amp; hang note numbers/notes.</p>
      <p>But this is just one analysis, and nothing new. The real question a designer has to ask is whether the design problem is to work to display differing elements, or to work to integrate them.</p>
      <p>FWIW</p>
      <p>Charles Ellertson</p>
