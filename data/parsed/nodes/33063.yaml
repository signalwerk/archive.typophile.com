      <p>Also, don't forget to check with your friend regarding any style guide he/she must follow -- many academic disciplines (and their respective college and university departments) require that authors adhere to a particular style guide: <em>The Chicago Manual of Style</em>, MLA style, APA style, etc. Each of these includes specific requirements regarding citations.</p>
      <p>Hope this helps!</p>
      <p>--Michael.</p>
