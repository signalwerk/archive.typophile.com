      <p>I'm generally in favor of endnotes rather than footnotes for this reason, I think footnotes distract you from the text.</p>
      <p>In my informal research among both scholarly texts and less so, books from university presses and trade publishers I saw very little consensus as to how they're handled. I don't think I ever came across outdented numerals tho.</p>
      <p>And yes, I decimal align on a per page or per spread basis for sure.</p>
