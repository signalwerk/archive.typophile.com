      <p>On more white space between text and notes:</p>
      <p>Once again this depends on how you view the page, should you break it up visually, or integrate it. When I design a book interior with, say, 13.5 points text leading, I will use a minimum of about 19 pts b/b between the last text line and first line of notes and a maximum of about 34 points b/b. That is enough variance to allow for one text line to move, such as a widow, or a text line calling another note, or . . . </p>
      <p>That is the other thing that hasn't been mentioned in this thread; if you are setting just a few pages, you can design tightly. If it really is a 200+ page book, you have to allow for the actual <cite>manufacturing</cite>.</p>
