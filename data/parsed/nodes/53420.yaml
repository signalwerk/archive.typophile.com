    <p>Hi you all,</p>
    <p>I'm trying to get an OT-TTF embedded in Microsoft Office. Is there a way to get it done?<br>
    As far as I get it embeds in PowerPoint (Office 2003 and 2007) but no way to get it embedded in Word (2003 nor 2007).<br>
    FontValidator doesn't report any critical error.<br>
    I could follow a topic in this forum about this issue but there wasn't any final solution-conclusion.</p>
    <p>Anybody had these problems and have any light for the path to solve them?<br>
    Many thanks for your help,</p>
    <p>Joancarles, BaseLab</p>
