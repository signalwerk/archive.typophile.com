      <p>There is a 2009 thread on the <a href="http://www.indiscripts.com/post/2009/10/switching-indesigns-ui-language-in-windows">Indiscripts</a> site which has some more information about switching the "feature set" (which is the name referred to the Western vs. CJK vs. Middle East abilities of InDesign) on Windows. </p>
      <p>The bottom line is that it's potentially possible to switch the "Feature Set Locale Setting" on Windows (the values seem to be: 256 for Western feature set, 257 for CJK feature set and 259 for Middle East feature set), but the application still needs to have the actual plugins that are required for a given feature set. </p>
      <p>I just tested this with a trial version of InDesign CS6 Middle East for Windows: it installs the Middle East (259) feature set by default, and the user can change it to Western (256) but *not* to CJK (257) -- then, InDesign complains that "CJK Layout" is missing. </p>
      <p>From reading the comments in the thread, it looks that it's only possible on Windows while on Mac OS X, each version of the application has just one feature set. This is confirmed (by analogy) in the <a href="http://wwwimages.adobe.com/www.adobe.com/content/dam/Adobe/en/devnet/indesign/sdk/cs6/server/intro-to-indesign-server.pdf">InDesign CS6 Server documentation</a>, which states: "InDesign Server performs composition based on the enabled feature set: Roman (English) or Japanese (CJK). On Windows, registry settings are used to specify the enabled feature set. On Mac OS, there are two applications, one with the Roman feature set enabled and one with the CJK feature set enabled." </p>
      <p>Regards,<br>
      Adam</p>
