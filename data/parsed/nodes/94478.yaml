      <p>I’ve just created a little <strong>CS6 Hunspell Enabler</strong> package. </p>
      <p>By default, InDesign CS6 and Illustrator CS6 expose 55 languages for spelling and hyphenation in the Character palette. But in fact, CS6 applications ship with spelling and hyphenation dictionaries for 129 languages. The additional languages can be exposed in the UI using a simple modification. This package provides this modification, it also includes a simple Armenian hyphenation dictionary (CS6 apps only include spelling for Armenian, but no hyphenation).</p>
      <p>1. Download and unpack <strong><a href="http://www.twardoch.com/download/cs6hunspell/cs6hunspellenable.zip">cs6hunspellenable.zip</a></strong> (20 KB).<br>
      2. Read the included README.TXT for further instructions.</p>
      <p>Below is the comparison of hyphenation and spelling languages available in CS6 apps before and after applying the enabler (some of the “before” languages are only available in the Middle East editions): </p>
      <p>Hyphenation patterns available in CS6 by default, before applying the enabler: <em>Bengali, Bulgarian, Catalan, Croatian, Czech, Danish, Dutch, English, Estonian, Finnish, French, German, Greek, Gujarati, Hindi, Hungarian, Italian, Kannada, Latvian, Lithuanian, Malayalam, Marathi, Norwegian Bokmal, Norwegian Nynorsk, Oriya, Polish, Portuguese, Punjabi, Romanian, Russian, Slovak, Slovenian, Spanish, Swedish, Tamil, Telugu, Turkish, Ukrainian</em>.</p>
      <p>Additional hyphenation patterns available in CS6 after applying the enabler: <em>Afrikaans, Armenian*, Belarusian, Esperanto, Icelandic, Indonesian, Interlingua, Irish, Kurdish, Mongolian, Serbian</em>. </p>
      <p><em>*) Requires copying the included Armenian hyphenation file into the correct location.</em></p>
      <p>Spelling dictionaries available in CS6 by default, before applying the enabler: <em>Arabic, Bengali, Bulgarian, Catalan, Croatian, Czech, Danish, Dutch, English, Estonian, French, German, Greek, Gujarati, Hebrew, Hindi, Hungarian, Italian, Kannada, Latvian, Lithuanian, Malayalam, Marathi, Norwegian Bokmal, Norwegian Nynorsk, Oriya, Polish, Portuguese, Punjabi, Romanian, Russian, Slovak, Slovenian, Spanish, Swedish, Tamil, Telugu, Turkish, Ukrainian</em>. </p>
      <p>Additional spelling dictionaries available in CS6 after applying the enabler: <em>Afrikaans, Akan, Albanian, Armenian, Assamese, Basque, Belarusian, Bengali, Esperanto, Faroese, Galician, Icelandic, Indonesian, Interlingua, Irish, Kazakh, Khmer, Kinyarwanda, Kurdish, Macedonian, Malay, Maltese, Mongolian, Nepali, Nyanja, Persian, Serbian, South Ndebele, Southern Sotho, Swahili, Swati, Thai, Tsonga, Tswana, Urdu, Venda, Vietnamese, Welsh, Xhosa, Zulu</em>.</p>
