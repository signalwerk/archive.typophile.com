    <p><strong>New typographic aspects of Adobe InDesign/Illustrator CS6: you can switch to the Middle East version free of charge, and you can easily add spelling and hyphenation dictionaries for many languages.</strong></p>
    <p>If you have a license for Adobe InDesign CS6 or Illustrator CS6 in a Western European language or in U.S. English, either as a standalone product, as part of an “offline” Creative Suite or as part of Creative Cloud, you can switch these apps to the Middle East versions free of charge. You can use the Middle East versions in English, but you’ll get access to additional spelling/hyphenation languages as well as to extra UI elements for right-to-left languages such as Arabic or Hebrew. </p>
    <p>Here’s how you get the Middle East versions of some applications:</p>
    <p>1. Install your normal CS6.<br>
    2. Go to <a href="https://creative.adobe.com/">https://creative.adobe.com/</a><br>
    3. Sign in with your Adobe ID.<br>
    4. Click on “Apps”, download the Adobe installer.<br>
    5. Launch the Adobe Applications Manager if it did not start automatically. You should see a list of applications from the Creative Cloud, and on some it should say “Installed”. Probably with InDesign and Illustrator you’ll get that.<br>
    6. Click on your login name on the left, choose Preferences.<br>
    7. In “Language”, select “English Arabic” (actually, “English” followed by Arabic writing).<br>
    8. As the Install Location, pick /Applications if you’re on a Mac.<br>
    9. Click on Save. Now the list of the applications’ “Installed” statuses should change.<br>
    10. Pick InDesign and click on “Install”. The Adobe Applications Manager should now download the “LS6” (Middle East) version of InDesign instead of the “LS16” (U.S. English) version, and it’ll install on top of your previous InDesign CS6.</p>
    <p>I did just try that and now I have a Middle Eastern version, registered and activated just like the previous one. All my plugins etc. work as before. I’ve also done the same with Illustrator CS6 ME and it also works. The only caveat of course is that the InDesign ME download is 1.22 GB and Illustrator is 1.88 GB. So it’s a long download... </p>
    <p>Before you do all this, you can rename the folder in which you have your U.S. English version of InDesign/Illustrator from /Applications/Adobe InDesign CS6 into something like /Applications/Adobe InDesign CS6 US -- to keep the non-ME version of InDesign/Illustrator just in case. </p>
    <p>Also, InDesign CS6 now uses Hunspell as the default engine for spelling and hyphenation (but the previous engines such as Proximity or Winsoft are still available). Hunspell is based on open-source dictionaries and hyphenation patterns which are used in products such as OpenOffice or Firefox. InDesign ships with a large number of dictionaries for various languages, but it’s now possible to easily add dictionaries for languages that aren’t included (e.g. Armenian or Georgian). The Adobe document <a href="http://helpx.adobe.com/indesign/kb/add_cs_dictionaries.html">“Addition/Removal of Hunspell dictionaries in CS6”</a> explains how to add extra dictionaries and hyphenation patterns yourself. </p>
    <p>Ps. <strong>See my comment below</strong> for an easy way to enable more hyphenation and spelling languages in CS6 apps!</p>
    <p>Enjoy!<br>
    Adam</p>
