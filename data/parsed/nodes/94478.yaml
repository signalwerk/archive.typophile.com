      <p>Greetings, dear Adam.</p>
      <p>Thank you for this post.</p>
      <p>I'm trying the Adobe Design Standard CS6 software @ this moment. I installed the English Int'l version, through a direct download. I'd like to use the ME version. Someone gave me the advise below:</p>
      <p>Adobe InDesign CS6 is InDesign version 8.0. To enable the Middle East version,<br>
      1. Be sure InDesign is not running<br>
      2. Click on the Start button, then on Run<br>
      3. In the Run dialog, in the Open field, type regedit<br>
      4. Navigate to HKEY_LOCAL_MACHINE\SOFTWARE\Adobe\InDesign\8.0<br>
      5. Double-click on Feature Set Locale Setting<br>
      6. Change value to 103<br>
      7. Close Registry Editor<br>
      8. Restart Windows<br>
      9. The next time you run InDesign, it should come up as the Middle East version.</p>
      <p>But it didn't work because I couldn't navigate to see Indesign in the Registry Editor. I could see Adobe, but not Indesign. Is it because I'm using the trial version? Is the License compulsory before switching to the ME version?</p>
      <p>Thank you for your suggestions.</p>
