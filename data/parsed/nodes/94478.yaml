    html: |-
      <p>Sans sleep, </p>
      <p>the big thing about CS6 is that by default, Adobe is using an open-source spelling and hyphenation engine (Hunspell), and that Adobe has worked on many of the included open-source spelling dictionaries and hyphenation patterns themselves (so while the engine is open-source, the same as used in OpenOffice, Mozilla products, hyphenator.js etc.) and while the hyphenation patterns are principally based on TeX hyphenation patterns, the actual dictionaries and patterns included in CS6 are largely upgraded by Adobe. But because of the fact that Hunspell is the default engine, one can easily use additional existing dictionaries and patterns, and it is relatively easy to create your own (or at least, the process of creating them is well-documented). </p>
      <p>In previous versions of CS applications, the spelling and hyphenation engines were licensed from 3rd-party vendors such as Proximity and Winsoft, and were closed-source. In order to add your own, you needed to also write a full plugin. So while it has been possible, it was more difficult. </p>
      <p>For CS5, Mindsteam Software has created <a href="http://www.mindsteam.com/products.html">MindHyph and MindSpell</a> which are plugins that enable spelling and hyphenation using the Hunspell format. This means that with MindHyph and MindSpell, you can install the same Hunspell spelling dictionaries and hyphenation patterns in InDesign CS5 which by default are included in CS6. </p>
      <p>Regards,<br>
      Adam</p>
