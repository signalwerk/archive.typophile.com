      <p>Hi. I found a good solution to my problem, from someone else's advice:</p>
      <p>For documentation sake, to change the Feature Set locale for Indesign to Arabic script on a 64bit computer, the location in regedit.exe is</p>
      <p>HKEY_LOCAL_ MACHINE</p>
      <p>                SOFTWARE</p>
      <p>                                Wow6432Node</p>
      <p>                                                Adobe</p>
      <p>                                                                Indesign</p>
      <p>                                                                                8.0</p>
      <p>                                                                                                Feature Set Locale Setting   REG_DWORD    0X00000103 (259)</p>
      <p> There is an Adode node directly under software, but it does not contain Indesign on my 64bit computer.</p>
