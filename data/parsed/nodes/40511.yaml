      <p>This is great.  I tend to dislike "Cyrillic-inspired" faces, so that's saying a lot, too. :)</p>
      <p>It has exactly the effect you're going for: slightly disorienting with a subtle Cyrillic feel.</p>
      <p>One tiny nitpick: the bevel where the h and the second curve of the m joins the rest of the letter is at a different angle and slightly larger than the rest of the bevels in the a,b,d,g,n,p,q,u. </p>
      <p>I particularly like the K. Looks like a Ж. </p>
      <p>The one thing I strongly dislike is the backwards N.  While the rest of the font has the subtle feel of Cyrillic foreignness, the backwards N seems like a blunt gimmick that screams "It's Cyrillic, idiot!" </p>
      <p>The backwards N also makes it hard to read for people who know Cyrillic; since И is an 'i' sound, I read "WHEN" as "WHEI" and then have to think, oh, yeah, this is just Cyrillic-inspired, so that's probably an N.</p>
      <p>I'd like to see the numbers. I bet they will look cool. :)</p>
      <p>The uppercase needs to be kerned.  See "AT," "LY," "PA," "YO," "AG," "DA."</p>
      <p>Overall, this is great, I can totally see choosing this font for a project.</p>
