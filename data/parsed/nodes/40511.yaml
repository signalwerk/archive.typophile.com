    <p><a href="http://www.alexvaranese.com/work/amv-Komradika_Test_1_3_2008.pdf" title="http://www.alexvaranese.com/work/amv-Komradika_Test_1_3_2008.pdf">http://www.alexvaranese.com/work/amv-Komradika_Test_1_3_2008.pdf</a></p>
    <p>The idea for this one came to me the other day, and I immediately started skeching it out. I've put a couple days of work into this, playing with various ideas and trying to get a decent first stab at the alphabet done.</p>
    <p>The idea is to create something that is LOOSELY inspired by Cyrillic, although I'm not being too dogmatic about what exactly that means. In some cases it's very blunt and obvious, and in others its more subtle (or non existent). Beyond that, I'm going for mostly squarish curves and decorating the terminals with one-sided wedge serifs.</p>
    <p>I revel in the places were the glyph looks awkward, such as the lc k, uc R, and the goofy additions to the ascenders on uc b and d, and the rounded tail on the lc p. Ultimately, I want it to feel foriegn (to us Americans, that is), and slightly off-kilter.</p>
    <p>Lastly, this is very much a display typeface for use in the context of posters and other abstract design projects. Legibility is a concern only to a certain extent; style is slightly more important in this case.</p>
    <p>I'm not taking this one too seriously, so feedback is welcome but I'm not looking for anything in particular. I'm happy with the direction as it is.</p>
