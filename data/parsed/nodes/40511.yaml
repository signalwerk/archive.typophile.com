      <p>Great feedback, I really appreciate it. I pretty much agree with everything you pointed out:</p>
      <p>1) Thanks for catching the notch on the lc h/m-- I knew there was going to be something inconsistent there.</p>
      <p>2) You're definitely right about the N. I've been debating flipping it back and I agree that it betrays my attempt at being relatively non-gimmicky with the rest of the face.</p>
      <p>3) Luckily, this cut of the font doesn't have any metrics yet.</p>
      <p>Thanks again!</p>
