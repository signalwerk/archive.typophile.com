      <p>Ah, I see.</p>
      <p>So encoding the font as Latin 1 doesn't seem to give me the option of adding ligatures, but if I encode it as Unicode BMP I do have this option in some spaces.</p>
      <p>I loaded Myriad Pro into FontForge just to see where these ligatures were hiding, but I couldn't seem to track them down in the table (I'm sure there's a better name). However, if I load the lookup subtable, FontForge gives me a preview of the ligature. </p>
      <p>Where are the ligatures (fi, ffi, ffl, ff, fl, ct, st etc) hiding, and what encoding is generally recommended?</p>
      <p>Thanks again</p>
