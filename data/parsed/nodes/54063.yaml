    votes: 0
    html: |-
      <p>Unicode BMP is the encoding I'd recommend if you're going to output an OpenType font. Naturally you aren't going to fill every one of those slots. As for which glyphs you <em>need,</em> I suggest a union of Latin-1, Latin-0, Macintosh Latin, Windows Latin, and Adobe Standard. Then set it back to Unicode BMP once you're done.</p>
      <p>Still, that's kind of a clumsy way to deal with it. This article might prove more useful: <a href="http://blogs.adobe.com/typblography/2008/08/extended_latin.html#more" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://blogs.adobe.com/typblography/2008/08/extended_latin.html#more</a>.</p>
      <p>You will find some of those ligatures in amongst those encoding tables. Some you will have to add in yourself. Some ligatures have no assignment in Unicode. Both those that do and don't should be addressed with OT features.</p>
      <p>FontForge has the View&gt;Goto feature that can help you find those difficult to locate glyphs and unicode ranges.</p>
