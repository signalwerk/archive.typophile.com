    <p>Hi all,<br>
    Sorry, a newbie question. I am trying to create a ligature in FontForge, yet I cannot access the Element\Build\Build Composite Glyph menu (both Build and Build Composite Glyph are greyed out). </p>
    <p>I am not in Bitmap view.</p>
    <p>Could you please tell me how I can access this menu?</p>
    <p>Thanks!<br>
    CaleD</p>
