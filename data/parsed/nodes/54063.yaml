    html: |-
      <p>You have to have a glyph space selected, either in the font or glyph view, that FontForge thinks is eligible for compositing (i.e., most ligatures and digraphs, and most but not all accented characters; e.g., fi, fl, oe, OE, ij, IJ, i, j, é, among many others, but not ae and AE for some reason). Furthermore, the source parts for the combined glyphs must already exist.<br>
      Then you can select options from the Build submenu. </p>
      <p>Under File&gt; Preferences... there is an option to set the accent compositing height. I've been meaning to write to George about that bit. I think it should be in font info rather than the overall prefs, since that may change from one font to another, and it would be useful to have that carried with the particular font.</p>
