    <p>Dear Philes and Philosophes of Type</p>
    <p>My new design was released 8th April at myfonts.com. It is called Hermecito.<br>
    <a href="http://www.myfonts.com/fonts/artypes/hermecito/" title="http://www.myfonts.com/fonts/artypes/hermecito/">http://www.myfonts.com/fonts/artypes/hermecito/</a><br>
    There are two pdfs posted at the gallery <a href="http://www.myfonts.com/fonts/artypes/hermecito/gallery.html" title="http://www.myfonts.com/fonts/artypes/hermecito/gallery.html">http://www.myfonts.com/fonts/artypes/hermecito/gallery.html</a> – one is A4 and the other in US Letter format – containing much information and specimen text settings etc. I'm attaching the A4 brochure but, as the max. upload is 2mb, not the US letter.</p>
    <p>Kindest regards<br>
    Rafaeli</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hermecito5_5304.png"></div><p></p>
