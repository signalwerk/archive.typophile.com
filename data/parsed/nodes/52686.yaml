    html: |-
      <p>You mean, you exported the ID document to PDF and then exported <em>that</em> to Word? Try exporting to RTF (Word, in later versions) directly from the Export menu. You can only export text, so be sure to click first into the story you want.</p>
      <p><cite>Or is there a way to import a PDF into InDesign?</cite></p>
      <p>Rather than 'just placing', you could buy <a class="freelinking external" href="http://www.recosoft.com/products/pdf2id/index.htm" rel="nofollow">PDF2ID</a>. I've read mixed reports about it; it seems you get at least <em>something</em> editable.</p>
      <p>Why these two different work flows, in two opposing directions? What are you hoping to achieve? There might be reasonable alternatives.</p>
