  html: |-
    <p>Is there an easy way to go from InDesign to Word? I've tried exporting a PDF and it messes up a lot of indents. </p>
    <p>Or is there a way to import a PDF into InDesign? </p>
    <p>Has someone made a plugin for any of these?</p>
    <p>Sorry if this is repost.</p>
