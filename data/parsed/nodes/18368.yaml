    <p>Font fiends,</p>
    <p>Announcing the first ever meeting of, what is destined to be, the most aggressively fanatic typography club in human history …held in a bar. The themed event for our premiere meeting is: Auto-convert your hand-drawn alphabets into usable fonts which will be posted for free on the net.</p>
    <p>A free event.</p>
    <p>RSVP and direct questions to:<br>
    <a href="http://www.flickr.com/photos/imbrettjackson/106906250/?#comment72057594073576781">http://www.flickr.com/photos/imbrettjackson/106906250/?#comment72057594073576781</a></p>
    <p>8PM at The Skinny (174 Orchard St. [1 block off Houston]) New York City</p>
    <p>Apologies if you’ve already seen this cross posted at Typographi.ca….</p>
    <p>Thanks,<br>
    Brett</p>
