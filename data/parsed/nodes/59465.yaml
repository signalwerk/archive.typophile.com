  html: |-
    <p>Im having a really hard time finding a font that looks good for a logo type the company name is A&amp;I &lt;- that is a capital “i”. Its an industrial company. I was in the Lubalin or Rockwell range but it still not right and not really interesting enough for a logotype. </p>
    <p>I am NOT a font geek so don’t be too harsh on the lubalin :)</p>
    <p>the letters must be in CAPS so I can really only use serif typefaces otherwise the i looks like an l.</p>
