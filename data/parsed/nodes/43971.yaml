      <p>Uli: <em>This means: Firstly, the preliminary judgment refers to the font Utopia only, to no other fonts sold by Adobe. Secondly, the preliminary judgment denied Adobe’s motion.</em></p>
      <p>Utopia was used as a test case in the Adobe vs. SSi lawsuit, and was accepted and understood as such by both parties. Of course Judge Whyte's acceptance of Adobe's motion for a summary judgement on the copyright of the Adobe font applies to the other fonts in the case: it was acceptance of the copyrightability of fonts (at which point SSi quickly agreed to settle out of court: they understood that the judgement applied to all the fonts, not just Utopia, even if you dont').</p>
      <p>What Judge Whyte denied was the motion for a summary judgement on the specific <em>patents</em> claimed by Adobe. So he accepted the motion regarding the general issue of font copyright, which he judged in favour of, but he denied the motion regarding the patents. Note that this does not mean that he denied the patents, but that he denied to motion to make a summary judgement on them: the patent issue would have to be decided in court. The copyright issue could be decided by summary judgement, since the US Copyright Office had already established in principle that fonts could be copyrighted as computer programs. What the judgement needed to establish was whether the fonts, and particularly the outlines, met the requisite legal criteria of creativity to be protectable by copyright. And Judge Whyte decided that <em>yes</em>, they did, and that summary judgement is now legal precedence. I don't know what the role of precedence is in German law, but in in US law, derived from English common law, is is extremely important.</p>
      <p>Your later argument that infringing fonts are still available through various sources is not evidence that fonts are copyrightable. Unlike trademarks, which one is obliged to defend or lose, one is under no obligation to defend one's copyright, and the copyright is retained regardless of whether the holder actively prosecutes infringement. I happen to know something of the material cost in time and energy that the SSi lawsuit put on Adobe's type group, that it delayed the development of new products and tied up key people for more than a year. Frankly, I'm not surprised that Adobe are not launching lawsuits at every infringement of their copyright. Like reasonable people, they pick their fights.</p>
      <p><em>...and the term “preliminary judgement” is used by me and others as another expression or as a synonym for “summary judgement” in the USA.</em></p>
      <p>It is not a synonym. There is nothing 'preliminary' about a summary judgement, any more than there is about a summary execution.</p>
