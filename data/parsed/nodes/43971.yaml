      <p>Uli,</p>
      <p>As usual, you resort to insults.</p>
      <p>It is a simple fact that the US Copyright Office accepts the copyright registrations of digital fonts, and does so following an explicit policy decision made in 1992 (quoted below in the court judgment excerpt).</p>
      <p>To the best of my knowledge, you are correct that the US Supreme Court has not ruled on the applicability of copyright to digital fonts. That's because they haven't needed to, because no case has been appealed all the way to the US Supreme Court. Things don't need to be ruled on by the Supreme Court to be law in the USA.</p>
      <p>However, Judge Whyte's 1998 summary judgment in the Adobe vs SSi case in Federal District Court did rule on this issue, and upheld the principle that digital fonts are subject to copyright. <a href="http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4" title="http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4">http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4</a></p>
      <p>The relevant section of the judgment follows:</p>
      <p>* * * * *</p>
      <p>In a 1988 Copyright Office Policy Decision, the Copyright Office determined that digitized typefaces were not copyrightable because they were not computer programs and required little selection or arrangement beyond that dictated by the uncopyrightable typeface design. "Policy Decision on the Copyrightability of Digitized Typefaces, " 53 Fed. Reg. 38 1 lo-381 13 (September 29, 1988). </p>
      <p>However, in 1992 the Copyright Office issued a final regulation regarding the registrability of "computer programs that generate typefaces" which appears to back off the 1988 policy decision, although the parties dispute this. The 1992 Regulation states: </p>
      <p><cite>After a careful review of the testimony and the written comments, the Copyright Office is persuaded that creating scalable typefonts using already digitized typeface represents a significant change in the industry since our previous Policy Decision. We are also persuaded that computer programs designed for generating typeface in conjunction with low resolution and other printing devices may involve original computer instructions entitled to protection under the Copyright Act. For example, the creation of scalable font output programs to produce harmonious fonts consisting of hundreds of characters typically involves many decisions in drafting the instructions that drive the printer. The expression of these decisions is neither limited by the unprotectible shape of the letters nor functionally mandated. This expression, assuming it meets the usual standard of authorship, is thus registrable as a computer program.</cite></p>
      <p>"Registrability of Computer Programs that Generate Typefaces," 57 Fed. Reg. 35 at pp.6201-2 (February 12, 1992)). Plaintiff contends that the 1992 Regulation supports protection for the scalable typefonts at issue. Defendants contend that the 1992 Regulation reaffirms the 1988 policy decision stating that digitized typefaces are not protectable. </p>
      <p>Defendants base their assertion on the fact that the 1992 Regulation specifically states that it "does not represent a substantive change in the rights of copyright claimants." Id. at 6202. They argue that the effect of the 1992 Regulation is merely to revise the procedure in referencing font-depicting data in the registration process. Thus, defendants contend that the numerical reference points that define an outline of a glyph are unprotectable as a matter of law. </p>
      <p>Defendants argue that after one has filtered out the unprotectabie elements of plaintiffs software in order to compare what remains, one finds that minimal, if any, protectable expression remains. Thus, defendants state that "merely manipulating an unprotectable font image to create another, slightly different (but still unprotectable) font image cannot possibly give rise to protectable expression . . . ." Defs. Memo., pp. 15-16. Defendants assert that no matter what points are selected by the Adobe editor performing the process, they correspond directly to, and hence are determined by, the unprotectable font shape. Therefore, because the output is not protected and there cannot be any creativity in what the editor does to obtain the output, nothing is protectable. </p>
      <p>Adobe contends that King copied literal expression.7 Adobe contends that while the shape of the glyph necessarily dictates some of the points to be chosen to create the glyph, it does not determine all the points to be chosen. Thus, each rendering of a specific glyph requires choices by the editor as to what points to select and where to place those points. Accordingly, Adobe asserts that the selection of points and the placement of those points are expression which is copyrightable in an original font output program. The actual code is dictated by the selected points. </p>
      <p>Adobe relies on Feist Publications v. Rural Telephone Serv. Co., 499 U.S. 340 (1991) and argues that because the glyph coordinates are not prescribed entirely by the shape of the glyph they involve creativity and are protectable. "To qualify for copyright protection, a work must be original to the author. [citation omitted]. Original, as the term is used in copyright, means only that the work was independently created by the author . . . and that it possesses at least some minimal degree of creativity." . Id at 345. Further, "the requisite level of creativity is extremely low; even a slight amount will suffice. The vast majority of works make the grade quite easily, as they possess some creative spark, no matter how crude, humble or obvious it might be." Id. Thus, Adobe argues that because there is some creative choice by the editors who select the on-curve and off-curve reference points, Adobe's font software programs are protectable. </p>
      <p>Defendants contend that FontMonger and Fontographer go beyond the code and extract the coordinates and express the coordinates in absolute values. Thus, defendants assert that the source code is not being copied but only the coordinates or points which are not protectable. Defendants then assert that FontMonger and Fontographer create code based on the selection of the points which is necessarily dictated by the shape of the glyph. Defendants contend that because they only extracted the points, they have not infringed because the points themselves are not protectable. </p>
      <p>The evidence presented shows that there is some creativity in designing the font software programs. While the glyph dictates to a certain extent what points the editor must choose, it does not dictate every point that must be chosen. Adobe has shown that font editors make creative choices as to what points to select based on the image in front of them on the computer screen. The code is determined directly from the selection of the points. Thus, any copying of the points is copying of literal expression, that is, in essence, copying of the computer code itself. </p>
      <p>Further, the selection of points is not dictated by functional concerns only. See 57 Fed. Reg. 6201-2. Defendants argue that efficiency is the key which is driven by the goal of minimizing the number of reference points. However, simply because there are several ways to create the same glyph, some being more efficient than others, i.e. using fewer points, does not mean there is no creativity in the process of creating the software to produce the glyphs. That some creativity is involved is illustrated by the fact that two independently working programmers using the same data and same tools can produce an indistinguishable output but will have few points in common. Accordingly, the court finds that the Adobe font software programs are protectable original works of authorship. </p>
      <p>* * * * *</p>
      <p>After this, I think I need to revert back to my principle of not responding to Uli, which I let lapse after nearly a year.</p>
      <p>Bye,</p>
      <p>T</p>
