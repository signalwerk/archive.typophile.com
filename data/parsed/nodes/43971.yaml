      <p>Erik</p>
      <p>I would hope that Safari is running its own text renderer (even if just a separate instance in a sandbox of sorts) because it is lacking many text rendering features standard in CoreText.  Neither required ligatures or kerning render, both of which feature in any standard NSTextField that you can do in Interface Builder in a dummy app (one that just has a single NIB file and no code).  </p>
      <p>I'm not sure why Apple turned off those features, but I do know they (oddly) have inconsistent font technology between their programs.  Why would it be that TextEdit (which uses the available-to-anyone NSTextView) have a more advanced engine that Safari or even Pages?  My only guess is that they don't expect very large documents in a program that would use NSTextView, or that it's not as highly optimized as the engines used in Safari or Pages where speed is more important, especially for long HTML pages or doctoral dissertations, and they've cut out features or done other optimizations.</p>
      <p>One of the main features I've noticed (and irritated me to know end with some of my term papers) is that Pages does not support combining diacritics very well (needed for putting the tilde on a lc Q).  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
