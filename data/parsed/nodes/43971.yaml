      <p>Thanks, Matthew, I just could not find that site! (I noticed the bug report form built into Safari, but it was way to generic. Also, it was so impersonal, you could never know whether the mails incoming to the mailbox from that form are not redirected directly to /dev/null ;-) )</p>
      <p>You know, that's something I really disapprove of with Apple. Absolute intransparency. Also: even bugreport.apple.com is a) well hidden b) you need a registration (oh, the first option they offer you is 3000+ USD/year... of course, if you scroll down, you'll find the 99USDp.a. for students, and at the very bottom, as if they did not want you to notice, the free "OnLine Membership").</p>
      <p>The stipulated aim of making everything as easy for the user as possible, "you don't have to care about technical details" is good. It should be the primary task of good USER (oriented) interface design. However, it should not completely put the user under tutelage, if he _wants_ to care for technical details.</p>
