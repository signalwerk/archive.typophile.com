      <p>vanblokland: </p>
      <p>I think your comments are spot on.  I was playing with this feature yesterday and was able to crash Safari, using a font described <a href="http://cg.scs.carleton.ca/~luc/opentypecrash.html" rel="nofollow">here</a>.  Precisely the problem you described and a relatively trivial example (i.e. overflowing the argument stack).  On the Mac, Webkit is passing the downloaded font data off to the ATS system service which does the rasterization:</p>
      <p><a href="http://trac.webkit.org/projects/webkit/browser/trunk/WebCore/platform/graphics/mac/FontCustomPlatformData.cpp#L41" title="http://trac.webkit.org/projects/webkit/browser/trunk/WebCore/platform/graphics/mac/FontCustomPlatformData.cpp#L41">http://trac.webkit.org/projects/webkit/browser/trunk/WebCore/platform/gr...</a></p>
      <p>So bugs in ATS can be exploited using Safari.  It's quite possible that this code could be tightened up and made more secure but I think some thought needs to be put in to making sure it gets there and not just assuming that it is secure.  With Firefox, we have the same concern, relying on underlying platform API's needs to be done carefully.</p>
      <p>Keep in mind that I think the same thing is probably possible with downloaded PDF files containing embedded fonts.  Using Freetype or another rasterizer is possible but definitely not an easy task, especially when you want the code to be efficient.</p>
      <p>John Hudson:</p>
      <p>One thing I've never quite understood is to what exactly the Adobe vs. SSi case really applies to.  The hints?  The outlines themselves?  Without hints is a font really a "program"?!?</p>
      <p>Put another way, if someone takes a TrueType font and copies the outlines to make a SVG font (no hints) are they in copyright violation?  Would the same user be in violation if they used the outline within a vector graphic of some sort and distributed that (i.e. something that still contains the outline)?</p>
      <p>I don't think these are just theoretical issues but real issues that web designers need to be able to understand.  "No embedding" flags, originally intended for use with Word documents, don't really explain much in this context.</p>
