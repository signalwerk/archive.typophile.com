      <p>I think Erik's point related to font rasterizers (converting a vector glyph outline to a rasterized image of the requested glyph), not text layout (where features like contextual substitution are done), which are normally separate issues handled by different applications. </p>
      <p>It wouldn't surprise me if the Safari browser (for the desktop) uses it's own rasterizer; on Windows it uses it's own rasterizer which produces results similar to the Mac OS. But I am not sure that would be true on the iPhone, where there could be advantages to sharing the system's rasterizer, and the architects may have seen this as a safer environment than the desktop (which would probably be a bad idea!)</p>
      <p>Although it may seem like it's a stretch that a font could crash a system or application, it is entirely possible, and I'd guess that this aspect of "font downloading/embedding" has not been sufficiently tested.</p>
      <p>Jason C</p>
