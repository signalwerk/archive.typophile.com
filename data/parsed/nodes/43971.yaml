      <p><cite>«Firstly, a person who is not a computer programmer and who has not learnt computer programming languages and who is therefore not able to write computer programmes cannot be the writer of a computer programme.»</cite></p>
      <p>That completely contradicts what you yourself said earlier in the same post.</p>
      <p>If I use a WYSIWYG programming tool to create a simple program [please note that there is no such thing as a “computer programme”], then I am the creator of that program, despite the fact that I don’t know C++ or any other programming language well enough to actually write the code itself. If I create an entire font in FontLab and save it as a TrueType Font, then that is considered software and I am considered its creator, despite the fact that I did not actually code the file myself.</p>
      <p>Computer programmer is (at least here) a protected title that requires at least a bachelor’s degree in computer programming, so obviously, the answer to your question is neither yes nor no, but rather, “Yes, if he has a degree in computer programming as well as being a judge”, which is of course completely irrelevant to the discussion.</p>
