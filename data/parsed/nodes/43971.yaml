      <p><cite>I do not know an American Copyright Law nor do I know an American Supreme Court decision ruling that fonts are copyrightable.</cite></p>
      <p>Nor, apparently, do you know US law.  There is no need for there to be a US Supreme Court ruling for something to qualify as legal precedence (as a minor addition/correction to Thomas's statement about the US Supreme Court not needing to rule on something to make it law, well, no court can make anything law in the US, they only interpret extant law).  As well, there is no such thing as a "preliminary judgement" in American law, so I'm not sure what you mean by that but based on a quick question to a German friend (note I explicitly don't claim to know the German system and am only speculating), I think you've confused summary judgement with preliminary injunction, which are very different (and this confirmed by the BEOLINGUS dictionary).  A summary judgement is only preliminary in that it takes place before the primary case, to rule on whether or not claims are triable, and my guess in German would be "beschleunigtes Urteilsverfahren".  Courts can still create precedence in these judgements (in the US), as evidence is presented just as they would be in a normal case.</p>
      <p>SSI would want the court to rule that copyrightable did not extend to the font software thus avoiding the entire court case.  The court stated that they are protectable, and thus Adobe can continue in their case against SSI, which would then involve proving that SSI did indeed violate the copyright.  If SSI had succeeded, there would have been no need for Adobe to attempt to show how their software was copied, because the court would have ruled that it wasn't copyrightable.  This is the point of a summary judgement in US law.  Regarding the copyrightability and generalization of the ruling:</p>
      <p>"The parties do not dispute that defendant King had access to plaintiffs programs.5 Thus, the primary issue in this case is whether the material at issue is protectable expression under the Copyright Act"</p>
      <p>"Thus, defendants contend that the numerical reference points that define an outline of a glyph are unprotectable as a matter of law."</p>
      <p>"Accordingly, the court finds that the Adobe font software <strong>programs</strong> are protectable original <strong>works</strong> of authorship."</p>
      <p>This is indeed a ruling that can be generalized.  Otherwise the court would have stated "Accordingly, the court finds that Utopia is a protectable original <strong>work</strong> of authorship."  But it didn't, leaving the judgement open for reference in other cases.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
