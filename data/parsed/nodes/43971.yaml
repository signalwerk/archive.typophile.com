      <p>The bugreport system is open to members of Apple Developer Connection, and they do make it clear that it's free (I don't think I've had any indication to the contrary), it's designed for developers more than for end-users, because end users tend to not be able to describe in the clarity and detail that is necessary generally to diagnose problems.</p>
      <p>They want registration for more serious natures so they can follow up.  If they have a problem or a question they want a way to contact you and it integrates within their main bugtracking system for all software.  I'm sure also WebKit has one as well.  While I still have some bugs that have been left inattentive for 3 years, others have been rapidly fixed, and not necessarily in the order I would have thought (eg, easy things are unfixed, hard things get fixed).  Partly it depends on how many people submit the same complaint.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
