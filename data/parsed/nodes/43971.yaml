      <p>It doesn’t matter whether fonts are copyrightable or not. That only affects your ability to sue people who have been given copies illegally by someone who owns a legal copy. It doesn’t change the fact that fonts are only distributed subject to a licence agreement; if you don’t comply with the agreement, you could be sued for breach of contract, even if in your country fonts are not subject to copyright.</p>
      <p>In a sense, therefore, the issue of copyright here is a red herring. The real issue is that fonts are licensed, and that the licence agreement (which is a contract between two parties, and applies regardless of copyright law) would in many cases be breached by distributing a font file in the manner presently supported by Safari. And since many users don’t bother reading or following licence agreements, the likelihood of a breach is high. Hence the complaints here about Apple’s marketing of Safari’s new feature.</p>
      <p>Personally I would like to see support for subsetting and maybe a new file format for web fonts that can't be easily installed by end users.  This has been tried in the past (WEFT, for instance), and I think it's the only way that those of us who would like to be able to embed fonts on the web are going to be able to convince the commercial type foundries to permit this type of usage.  It also has the advantage of not requiring every visitor to your site to download large font files when all they needed was the letters ‘a’ through ‘z’. But it needs to be standardised across platforms and browsers, or nobody will want to use it.</p>
      <p>--<br>
      <a href="http://alastairs-place.net" title="http://alastairs-place.net">http://alastairs-place.net</a></p>
