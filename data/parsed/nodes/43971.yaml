      <p>I know Uli was being rhetorical, but he seems to have a typically incomplete knowledge of copyright law. He needs to look up concepts like fair use (U.S.) and fair dealing (Canada, U.K., some other countries). In short, you can post screenshots with attribution in many contexts without infringement. The same goes for photographs and other copyrighted works.</p>
      <p>I don’t see how fair use or fair dealing would cover embedding fonts in Web pages even if they were copyrightable (or even considering that font <em>files</em> actually <em>are</em> copyrightable). Hence, Uli’s point is rather off topic. But the objection “The Web is all about replication of copyrighted works, so why should fonts be any different?” is one that merits discussion.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
