      <p>&gt;Hmmm, are you distinguishing document embedding from a webpage’s use of downloadable fonts? I know others have argued that this is really font linking rather than embedding, but I thought Microsoft claimed that the meaning of those embedding flags extended to the use of downloadable fonts in EOT form.</p>
      <p>Yes, my reading of the OT spec is that the embedding permissions relate to fonts being embedded <strong>within</strong> document files. With EOT the font is not within the file but is tied to it via the URL-binding system. MS consulted with the industry at the time. However, over the years many vendors have put additional restrictions in their EULAs, around commercial embedding (eBooks), and technologies they don't like, such as PDF, or more commonly EOT.</p>
