      <p>Here are two short answers to Mr. Phinney's reply:</p>
      <p>1)</p>
      <p>Mr. Phinney's statement <cite>"most countries recognize digital fonts as software"</cite> was a fairy tale and will remain a fairy tale, because Mr. Phinney could not prove that "most countries" recognize fonts as software.</p>
      <p>2)</p>
      <p>I predicted elsewhere that Mr. Phinney would again quote this old hat, the SSI "preliminary judgement" alias "summary judgement" (in Germany "einstweilige Verfügung").</p>
      <p>Everyone knows that "preliminary judgements" are "preliminary" and hence cannot be generalized, because no trial took place. Furthermore, Mr. Phinney did not disclose the most "relevant section", namely this one:</p>
      <p><cite>"Based on the foregoing, the court grants Adobe's motion for summary judgment on its claim of copyright infringement of its <strong>Utopia</strong> software program, denies defendants' cross-motion on the copyright claims, <strong>denies Adohe's motion</strong> for summary judgment on the patent claims, denies defendants' countermotion on the patent claims and denies Ares' motion for summary judgment on the third-party complaint."</cite></p>
      <p>This means: Firstly, the preliminary judgment refers to the font Utopia only, to no other fonts sold by Adobe. Secondly, the preliminary judgment denied Adobe's motion. In my document about this preliminary judgement</p>
      <p><a href="http://www.sanskritweb.net/forgers/ssi.pdf" title="http://www.sanskritweb.net/forgers/ssi.pdf">http://www.sanskritweb.net/forgers/ssi.pdf</a></p>
      <p>I stated:</p>
      <p>"Adobe did not dare to seek a trial due to the fact that Adobe’s motions concerning Slimbach’s patent claims were denied by the district court."</p>
