      <p><em>I think font vendors’ EULAs should be absolutely explicit about what they allow in terms of Flash SWF embedding, raw fonts on Web servers, EOT usage, etc.</em></p>
      <p>Frankly, some of the contents of font EULA agreements seem byzantine beyond belief.  </p>
      <p>As an experiment, I poked around in Font Book and picked "Century Schoolbook".  Not a normal Mac OS X system font, probably installed with MS Office.  The font information shows Monotype as the foundry along with a license URL.  Hmmm, page not found, okay, dig through the Monotype fonts.com site to find their <a href="http://www.fonts.com/Legal/MI-EULA.htm" rel="nofollow">single-user EULA agreement</a>, which I'm assuming is what applies to me.  Section 12 basically disallows use of a font in anything other than a non-editable static graphic and only for "personal or internal business use" and not "commercial" use.  Definitions for these terms are given but it's not quite clear where "for use in a website graphic" falls.  It also appears to disallow anyone from sending anything containing a glyph outline, such as a path within an Illustrator file or a vector graphic formatted image like SVG, to a user without a license.  </p>
      <p>But wait, dumping out the OS/2 table for the font shows that fsType embedding bits are set to "editable embedding", so maybe it really is okay to use in a website graphic?  And maybe this could be used with Safari as long as the font is not cached?</p>
      <p>Seems like font users who in good faith try to determine "can I use this font for this purpose?" need something that's a little simpler and more straightforward.</p>
    html_clean: |-
