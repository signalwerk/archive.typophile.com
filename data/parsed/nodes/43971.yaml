      <p>guifa:</p>
      <p><cite>A summary judgement is only preliminary in that it takes place before the primary case, to rule on whether or not claims are triable, and my guess in German would be “beschleunigtes Urteilsverfahren”.</cite></p>
      <p>Such terminological discussions do not make much sense, because English is not my mother tongue and German is not your mother tongue. The term “beschleunigtes Urteilsverfahren” is a criminal proceeding in Germany, and the term "preliminary judgement" is used by me and others as another expression or as a synonym for "summary judgement" in the USA.</p>
      <p>Instead of terminological discussions, you should look at the reality which will open your eyes so that you will recognize that the SSI "summary judgement" does not prove that the Adobe fonts are copyrightable in the USA or elsewhere.</p>
      <p>For instance, Paul King has been selling the SSI fonts alias Adobe fonts many years after the lawsuit. And these SSI fonts alias Adobe fonts are even today still downloadable from numerous websites. (Miss Tiffany does not like links to such sites, so that you will have to browse for these sites for yourself.)</p>
      <p>All this would not have been accepted by Adobe, if the Adobe fonts alias SSI fonts were copyrightable.</p>
      <p>What is more, Adobe's entire Font Folio collection (the unmodified fonts, not the SSI clones) is downloadable for free from numerous websites. This would not be accepted by Adobe, if the Adobe Font Folio fonts were copyrightable in the USA or elsewhere.</p>
      <p>And as regards font CDs, Adobe's entire Font Folio collection can be bought for a few cents as commercial ripoff CDs. I documented this at my website</p>
      <p><a href="http://www.sanskritweb.net/forgers/index.html#OSTEUROPA" title="http://www.sanskritweb.net/forgers/index.html#OSTEUROPA">http://www.sanskritweb.net/forgers/index.html#OSTEUROPA</a></p>
      <p>All this would not be accepted by Adobe, if the Adobe Font Folio fonts were copyrightable in the USA or elsewhere. The SSI "summary judgement" alias "preliminary judgement" is entirely useless and proves nothing.</p>
