      <p>aluminum:</p>
      <p><cite>What does being a <strong>programmer</strong> have to do with anything?<br>
      I thought we’re talking about the definition of <strong>software</strong>.</cite></p>
      <p>That's a good joke.</p>
      <p>What you call "software" is called "computer programme" in copyright laws.</p>
      <p>"Computer programmes" (in your non-copyright-law parlance "software") are "literary works" written by authors. There are copyright laws which explicitely define that "computer programmes" are "literary works", e.g. the United Kingdom Copyright Act:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/UK-Copyright-Act.jpg" title="http://www.sanskritweb.net/temporary/UK-Copyright-Act.jpg">http://www.sanskritweb.net/temporary/UK-Copyright-Act.jpg</a></p>
      <p>The author of the "literary work" of a "computer programme" is called the "computer programmer".</p>
      <p>Copyright protection only subsists in original works of authorship, e.g. in "computer programmes" as "literary works", written by "authors", e.g. here the "computer programmers".</p>
      <p>For definition of "authorship" etc. see e.g. the American Copyright Law:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/USA-Copyright-LAW.jpg" title="http://www.sanskritweb.net/temporary/USA-Copyright-LAW.jpg">http://www.sanskritweb.net/temporary/USA-Copyright-LAW.jpg</a></p>
      <p>I hope this answers your question:</p>
      <p><cite>What does being a <strong>programmer</strong> have to do with anything?</cite></p>
      <p>And I hope that you now understand that "talking about the definition of <strong>software</strong>" means "talking about the definition of <strong>computer programme</strong>"</p>
      <p>Mr. Hudson stated above in this thread:</p>
      <p><cite>The USCO defines a computer program as ’a set of statements or instructions to be used directly or indirectly in a computer in order to bring about a certain result’.</cite></p>
      <p>This is not only the definition used by the USCO (US Copyright Office), but much more important, it is the definition in the US Copyright Law itself:</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/USA-Definition.jpg" title="http://www.sanskritweb.net/temporary/USA-Definition.jpg">http://www.sanskritweb.net/temporary/USA-Definition.jpg</a></p>
      <p><cite>If you’re asking is “did John G. Roberts, Chief Justice of the United States, by saving that file, create a unique piece of computer code (ie, software) that describes a particular visual design that he created” then the answer is “yes”.</cite></p>
      <p>The answer is "no":</p>
      <p>Firstly, a person who is not a computer programmer and who has not learnt computer programming languages and who is therefore not able to write computer programmes cannot be the writer of a computer programme.</p>
      <p>Secondly, a person who draws circles with the mouse in a vector drawing programme (e.g. Coreldraw) makes circle drawings, but he does not write computer programmes.</p>
