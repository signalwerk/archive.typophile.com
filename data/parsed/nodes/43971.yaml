      <p>The issue raised at the head of this thread seems to be less about copyright protection and law than the responsibility of a company to keep its public statements in line with protected practice. Copyrights exist to protect an author's economic interest, and the basic test of infringement is whether or not the original owner of the copyright has suffered economic loss (actual or real potential) from the unauthorized use of the item for which the copyright was recorded.<br>
      <em>web designers can go beyond web safe fonts and use any font they want…</em><br>
      A true statement, as long as the requisite licensing fees have been paid or grants of use received. Like most spin meisters the Apple flacks don't detail the costs. How many politicians this season have detailed what costs their programs would entail?</p>
