  html: |-
    <p>This came up at the Business of Type Event on Friday, and yes Apple font people were given a heads up...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Capture_3793.JPG"></div><p></p>
    <p>...from the Fonts section of the main Safari page on Apple.com - <a href="http://www.apple.com/safari/" title="http://www.apple.com/safari/">http://www.apple.com/safari/</a></p>
    <p>One of the biggest concerns around the Web fonts scheme is that Web designers would post commercial fonts through either ignorance or disregard of font licensing rights.  Apple were aware of this (both Safari folks and Font folks) so I find it hard to understand why they’re telling web designers that they can post any font to the Web. </p>
    <p>This is probably a break-down in communication between marketing folks and the font/browser folks, but the damage has been done – Mac World appears to have parroted the misinformation in their recent Safari review... </p>
    <p><a href="http://www.macworld.com/article/132708/2008/03/safari31.html" title="http://www.macworld.com/article/132708/2008/03/safari31.html">http://www.macworld.com/article/132708/2008/03/safari31.html</a> </p>
    <p>Hopefully Apple will fix this quickly, and post material that directs web designers to freeware fonts that can be used with the scheme.</p>
    <p>Cheers, Si</p>
