      <p>jdaggett: <em>One thing I’ve never quite understood is to what exactly the Adobe vs. SSi case really applies to. The hints? The outlines themselves? Without hints is a font really a “program”?!?</em></p>
      <p>Read the text of Judge Whyte's summary judgement on the copyright question, which Thomas posted above. It is very clear. It is important to bear in mind that what US copyright law considers a computer program and what it considers a sufficient degree of creativity to qualify for copyright protection are not what you or I might consider them. The USCO defines a computer program as 'a set of statements or instructions to be used directly or indirectly in a computer in order to bring about a certain result'. That is a very generous definition, especially if one pays attention to the allowance for both direct and indirect use. I don't doubt that some people might want to argue with that definition, or propose alternative definitions, but for the sake of US copyright law that is the definition that counts.</p>
      <p>The other thing that is important to bear in mind is that, as Judge Whyte noted in his judgement, citing precedence, 'the requisite level of creativity is extremely low; even a slight amount will suffice'. That is to say, it is not necessary for a work to exhibit a huge amount of creativity -- what I'm tempted to call a 'romantic amount', since many popular notions of creativity are strongly influenced by romanticism --; the mere presence of creativity, in even a slight amount, is deemed worthy of protection.</p>
      <p>Bearing those two things in mind, this is the key passage of Judge Whyte's judgement (by emphasis:</p>
      <p><em>'The evidence presented shows that there is some creativity in designing the font software programs. While the glyph dictates to a certain extent what points the editor must choose, it does not dictate every point that must be chosen. Adobe has shown that font editors make creative choices as to what points to select based on the image in front of them on the computer screen. <strong>The code is determined directly from the selection of the points. Thus, any copying of the points is copying of literal expression, that is, in essence, copying of the computer code itself.'</strong></em></p>
    html_clean: |-
