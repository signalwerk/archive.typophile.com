    html: |-
      <p><cite>Don’t newer scanners and printers prohibit you from copying and printing money?</cite></p>
      <p>Not the hardware, but some scanning software and Photoshop will not scan US money properly. Most color laser printers sold in the states tag every document with unnoticeable serial numbers. But doing so with fonts means bringing back font DRM, which some important entities are openly against.</p>
      <p>The purpose of my comment was not to elevate Apple’s actions above criticism. I just wanted to point out that this will not be the first time this happens, that the type industry should expect these incidents to happen, and foundries need to start being proactive and creative about licensing and educating users before it becomes a problem—i.e. before Firefox or IE jump on board. Some people are already doing so—creative license models, Adobe working with the AIGA on student fonts, Microsoft’s event hosting and of course, all the industry types talking about it here and elsewhere. But if you guys slip, you could end up in a nasty hole like the record industry, and that’s not something anyone in the industry really wants, is it?</p>
