    html: |-
      <p>Something which doesn't seem to be an issue in the discussion so far is safety. </p>
      <p>It is possible to build fonts which crash rasterisers. I can think of a couple opportunities in a .ttf or .otf which can cause serious problems in the app and the OS. Fonts are part of a text engine, usually integrated deeply into the OS. Fonts are subject to ambiguous standards and can contain many values which catch the rasteriser unaware. Integrity tests for fonts usually catch some of the problems, but never all of them. (Aside, it seems the PostScript Type 1 format is great for non-downloadable fonts). So far, bad fonts were always dealt with by the person who installed them. Even when something goes wrong, the user will usually know what happened and how to solve it.</p>
      <p>In the context of a website there is no sanity check on the server end, it is up to the browser to make sure the font is fit. The user will be unaware of any potential problems in a webpage which is about to open.</p>
      <p>Speculating, if the fonts-for-download is part of WebKit, it won't have its own rasteriser and the Doomsday.ttf might be possible. Speculating even more, Mail.app uses webkit, it would be possible to make an html mail message which links to malevolent fonts. It might even work on the iPhone, depending on how much code is shared between the iPhone and MacOSX.</p>
      <p>Perhaps Apple has separated the rasteriser in Safari from the rest of the OS. Perhaps Safari also checks the integrity of the font after download. In that case a bad font would just not load. But if a bad font isn't caught, and with a rasteriser in Safari, it could crash the app, but not the OS. In the worst possible case, if Safari uses the OS rasteriser, it could trigger a series of crashes which eventually take the whole OS down. And that is quite unacceptable.</p>
      <p>At the very least, the downloading of fonts should be covered in the security prefs of Safari, and off by default. A bad font can do more damage than a run away javascript. Even Java and Flash don't have access to the core OS functions as fonts do. But these do have their own controls in the security prefs.</p>
      <p>And that's just Safari. Will Firefox be able to follow to same safety precautions Safari might have?</p>
      <p>Of course, all of these problems can be fixed in rasterisers and font handling code. But given that rasterisers, after almost 20 years of improvements, still contain problems, makes me wonder how fast browser and rasteriser builders can respond.</p>
      <p>Just my 2¢ of gloom.</p>
