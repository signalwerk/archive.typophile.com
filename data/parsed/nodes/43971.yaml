      <p><cite>Hm, I’d like to play the devil’s advocate for a moment ... if the text read “With NCSA Mosaic, web designers can go beyond text and use any image they like to create stunning web sites ...”, would you want the Web back without images?</cite></p>
      <p>Mr. Kutilek hits the nail on the head:</p>
      <p>While fonts <strong>are not</strong> copyrightable in most countries (although Typophiles wish they were), images or pictures ("pictorial works" as per US Copyright Law) <strong>are</strong> copyrightable in most countries, but many Typophiles do not hesitate to upload copyrighted pictures to Typophile threads without having obtained the permission to do so from the picture copyright owners. The Typophile website threads abound with pictures, for which the publication rights have not been acquired.</p>
      <p>Look, for instance, at the start of this thread: Even this tiny picture (screen shot) inserted by Mr. Daniels probably is copyrightable, although this might be disputed at court, but by browsing through other Typophile threads you certainly will find many copyrighted pictures, for which the uploaders never acquired the picture publication rights.</p>
      <p>If you download the pictures made by others, "as they're are needed", and upload them without permission to your website, why do you complain that Apple Inc. intends to do the same with your fonts by downloading them without permission, "as they're needed" by Safari?</p>
