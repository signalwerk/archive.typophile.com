      <p>&gt; what do you mean with Safari (Win) sucks?</p>
      <p>Well, here are my impressions, even if this is slightly offtopic here:<br>
      - loading times (browser): ages.<br>
      - loading times (pages):<br>
      without flash - slower than IE6, IE7 and Firefox.<br>
      with flash - faster than Firefox and IE7, but slower than IE6.<br>
      - options and settings: too limited for my liking.<br>
      - CSS rendering: well, almost perfect, I admit it.<br>
      - type rendering: blurry (on CRT I do not use any smoothing, if possible).<br>
      - cache: IE, Firefox and Opera allow browsing the cache. Why Safari should not?<br>
      - plugins (Firefox-style)? Bwahahahaha.<br>
      and many, many more. </p>
      <p>Regarding the support of web-fonts, right now there are no alternative browsers to compare with, so... still waiting for next version of Opera, which supposedly will support it. </p>
      <p>Would I use Safari for everyday browsing? God, no! Would I remove/replace my default browser for Safari? At least, not now. I'm keeping it only for web design compatibility checks. </p>
      <p>Maybe under Mac the things are different, but I seriously doubt it. This is a design issue, not a platform one. Apple simply do not provide enough advanced options for customizing the browser design/behaviour. Remember the discussion if there is an option to disable the web-fonts? Of course, Apple are new on this market, but Safari on my WinXP desktop still looks like an oversized iPhone :D</p>
