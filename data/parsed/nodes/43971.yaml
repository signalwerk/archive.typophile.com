      <p><em>This font would be covered by the Office EULA not a Monotype stand alone license.</em></p>
      <p>How would a font user know that?  I don't think Office ever announced that it was installing those fonts as part of the install process and the data within the font itself indicates something else (i.e. that the license is covered by the Monotype EULA)!  </p>
      <p>I'm sure you're right about this but my guess is that other applications also install fonts without explicitly altering the license notice within the name table strings.  Makes it difficult to track down the EULA that actually applies.  Same probably goes for all the lovely fonts that ship with Mac OS X, are they covered by the Apple EULA when the font data indicates something else?  Hard to figure out from a font user's perspective.</p>
      <p><em><strong>Document</strong> embedding (as defined in the OpenType spec) is permitted…</em></p>
      <p>Hmmm, are you distinguishing document embedding from a webpage's use of downloadable fonts?  I know others have argued that this is really font <strong>linking</strong> rather than embedding, but I thought Microsoft claimed that the meaning of those embedding flags extended to the use of <a href="http://www.w3.org/Submission/2008/SUBM-EOT-20080305/#EmbeddingLevel" rel="nofollow">downloadable fonts in EOT form</a>.</p>
