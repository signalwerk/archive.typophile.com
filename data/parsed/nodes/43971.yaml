      <p>Let us assume this legal information just given by me were not correct, and everybody were allowed to upload scans and photos of any pictures to any websites, then for example, everyone were allowed to scan all pictures painted by Picasso and upload them to whatever internet sites. This of course is definitely illegal and would constitute an infringement of copyright, in the very same way, as the publication of the Ali poster constitutes an infringement of copyright.</p>
