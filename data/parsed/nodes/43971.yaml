      <p>Dez:</p>
      <p><cite>"The thing is, a tiny 72 dpi image does not have scalability and usability as a piece of softwarre. I would not have a problem seeing images of type at 72dpi on web sites but..."</cite></p>
      <p>Sii:</p>
      <p><cite>"I agree with Chris (Apple lawyers please don’t come after me) ;-) there’s a difference between the hi-res © photograph and a 60px x 60px picture of a Seahawk helmet..."</cite></p>
      <p>Although it is awfully boring for me to explain again and again the most simple notions of copyright law, I will try to explain them again. For this purpose I refer to a copyrighed picture in this new Typophile thread</p>
      <p><a href="http://www.typophile.com/node/43945" title="http://www.typophile.com/node/43945">http://www.typophile.com/node/43945</a></p>
      <p>The "Ali boxing poster" shown in this thread is indubitably a "work of art".  The date 1975 proves that this poster was made roughly 30 years ago. If the poster was made in the USA, then it will be protected by copyright for a period of 70 years post mortem auctoris (after the authors's death). So nobody except the author (here the designer or painter) or his/her assignee (e.g. the company which acquired the picture rights) is allowed to publish this picture.</p>
      <p>It does not matter, whether this poster is photographed or scanned or reproduced by whatever technical means, and it does not matter, whether this reproduction is done in high or low resolution: In all these cases, you have to acquire the publication rights from the author or his/her assignees.</p>
      <p>Even if you want to reproduce this poster in a very tiny size and in very low resolution, e.g. as a postal stamp, you will have to obtain the right to do so.</p>
      <p>Therefore, the publication of this Ali poster as a scanned reproduction in low resolution at the Typophile thread</p>
      <p><a href="http://www.typophile.com/node/43945" title="http://www.typophile.com/node/43945">http://www.typophile.com/node/43945</a></p>
