      <p>In my opinion, outlines alone could not be regarded as computer programs. But my opinion does not count. If I remember correctly from having read earlier, either by (imho false) court judging or  by copyright office regulation, font files per se (so even without hints) are considered font "sofware".</p>
      <p>Actually, Uli is wrong in a lot of respects (because even if we disapprove of certain laws, they are laws), and while I disapprove of fonts being protected as "software", I do think they need to be protected in some way (as "work of art" e.g.).<br>
      His argument in one of his writings is telling however: If you draw an outline and save the font, the stipulated "software code" is generated automatically. Your work was not authoring software code, but of designing (as an artist) outlines.</p>
