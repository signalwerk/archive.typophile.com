    <p>hello, salam, shalom :)</p>
    <p>excuse me if this text is too long and exhausting, i have much to say:<br>
    (see a shortened version below)</p>
    <p>I'm currently designing my logo. i am a designer and artist.<br>
    when approaching the design, i decided on some values (i'll write the basic ones) -</p>
    <p>i see myself as a combination of east and west,<br>
    living in a place (and leave politics aside) which has both.</p>
    <p>i am also a typographer and i create calligraphy, mainly in Hebrew.<br>
    i also love to experience other languages typography too, and i sometimes i touch Arabic and English too.</p>
    <p>i decided to use HEBREW, English, and also Arabic in my logo.</p>
    <p>i know the dangers, the negative association of many Israelis with the Arabic language (which may harm my commercial work). i already experienced the harsh criticism just because i used the Arabic letters.<br>
    also I'm aware of the problems that occurre with combining three different languages in one form, that should function as a legible logo.</p>
    <p>I'm trying to do something different, which i totally believe in.<br>
    i did not think people will shout at me (people close to me) because I'm using Arabic, but i think that after the shock i am becoming a bit stronger. i believe in culture exchange, peace, bridging the gaps.</p>
    <p>i decided to use the blackletter style and a shape of an "ogive arch" because they appear in my artistic works. the arch is an architectonic shape that can be found in Gothic cathedrals, Arabic buildings (a bit different), and even in israel. thus being the perfect example of something shared by different cultures. in my art it symbolises an "inner world" too.</p>
    <p>i also use blackletter in my works too. my professional name "yaronimus" is an extension of my real name - Yaron ("will rejoice" in Hebrew), with a kind of Latin or Greko-roman ending to it "imus" (like hieronimus:). the name implies on my admiration of history, (medieval times especially, hence my love for blackletter). i love the german blackletter and the Grimm tales.</p>
    <p>what i wrote here may or may nor be historically accurate, but to me it all connects.<br>
    it is a long way i have made with my art and design, and these associations are the fruit of my works.</p>
    <p>the sketch attached here will function as a basis for calligraphy work, which may look different (for example - more fluidity, different style and identical hebraic serifs for all)</p>
    <p>---<br>
    shortened version :<br>
    a sketch of my logo - combining east and west by using three languages and the arch shape (same in Islamic and Gothic architecture). this sk is a basis for calligraphy lettering of the logo later in the process.<br>
    ----</p>
    <p>this sketch is something that was refined after much work, and i think this might be it, but i feel there is much to be improved:</p>
    <p>1.i'm afraid the kerning is not good(especially in the arabic)(who is afraid of kerning?).<br>
    2.what do i do in the right part?<br>
    3.the S letter is stretched just for demonstration, please don't kill me :)<br>
    4.is it too cluttered and stuffy? should i try using lighter weight?<br>
    5.help with arabic:<br>
      a. i need help with arabic<br>
      b. need a recommendation for a free arabic font for the lower text, that will look good with some sans serif font.<br>
    6. help with blackletter<br>
    7. is helvetica good for the lower text?<br>
    i know i can make the lower text made in calligraphy too, but i think it's too much.<br>
    8. Hebrew lower text font will be replaced later on.</p>
    <p>sorry for the long text :)</p>
    <p>general idea:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/general idea_4958.jpg"></div><p></p>
    <p>my original logo (hebrew and english) plus a matching arabic font:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_3439.jpg"></div><p></p>
    <p>my latest sketch:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/update_6014.jpg"></div><p></p>
    <p>sorry for the bad quality.<br>
    thanks for all who will help me!!<br>
    yaronimus.</p>
