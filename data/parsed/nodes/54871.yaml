    html: |-
      <p>On the bottom part, it is a question of getting the three scripts of similar color and length of line (or a pattern) to match. </p>
      <p>You might consider doing it by hand with a smaller width pen, as you've made that work well on top--but with simpler script. Is the Arabic at the bottom actual text? I ask because the last three words look the same. A lot of the issue is the width of the thing in relation to the top, and also getting the lines the same height and color. </p>
      <p>Now your Arabic line--which actually works better with the above--is less tall and darker. If the Arabic is really that long, then you might consider putting the English and Hebrew on one line, with narrower, darker letters. Meta, for example, is narrower. Consider narrow all caps as a possibility also... </p>
      <p>Another way: have the words for 'design' or 'graphic design' repeated in all three scripts on one line, and 'art' in three scripts on the other.</p>
