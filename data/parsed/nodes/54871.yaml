      <p>william - yea, the mem is not so good, and i already have several ideas for fixing it.<br>
      by the way - isn't there a better alternative for the lower text than helvetica? something as legible in small sizes, sans, cristal clear, reliable (sounds like the ultimate text type.</p>
      <p>what do you think - i decided using sans for the lower text because i think that the upper part is complicated enough, so that the basic info will be easy to read.<br>
      the problem is that sans may look too detached and alien to the upper part.</p>
      <p>your views are greatly appreciated :)</p>
