    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 6.Mar.2008 5.13pm </div>
      <p>Font Bureau is excited to announce the release of two major new<br>
    typefaces from our drawing studio - Scout and FB Moderno.</p>
    <p>SCOUT</p>
    <p>A fresh new sans serif, something always useful, Scout (and a<br>
    related logotype) was drawn by Cyrus Highsmith, a senior type<br>
    designer at Font Bureau, for Geraldine Hessler’s 2006 redesign<br>
    of Entertainment Weekly. The 24 style family marks the magazine’s<br>
    first significant typographic update in a decade. Scout created<br>
    a new typographic identity for the magazine with a design that<br>
    derives structural elements from both new and old: DIN, Venus,<br>
    and Cairoli (a quirky and forgotten Aldo Novarese typeface).</p>
    <p>24 Styles: thin, extra light, light, regular, bold, and black<br>
    with italics in normal and condensed widths.</p>
    <p>Explore Scout on our website at:<br>
    <a href="http://www.fontbureau.com/Scout" title="http://www.fontbureau.com/Scout">http://www.fontbureau.com/Scout</a></p>
    <p>Available from Font Bureau and its distributors.</p>
    <p>To find out more about the type designer, Cyrus Highsmith, go to:<br>
    <a href="http://www.fontbureau.com/people/CyrusHighsmith" title="http://www.fontbureau.com/people/CyrusHighsmith">http://www.fontbureau.com/people/CyrusHighsmith</a></p>
    <p>FB MODERNO</p>
    <p>Intended for display use in print publications, David Berlow<br>
    conceived FB Moderno as a relative of Giza, our famous slab serif.<br>
    He used Apple’s (later abandoned) GX technology to interpolate<br>
    between two 19th century serif styles, a “slab” and a “modern” -<br>
    a type design first!</p>
    <p>After being adopted by Eduardo Danilo for the design of Reforma<br>
    in Mexico City (1993), and then Roger Black’s redesign of the<br>
    Baltimore Sun (1994-95), and by Esquire magazine, the Montreal<br>
    Gazette expanded the family under Louise Vincent. Cases i Associats<br>
    added even more weights for La Stampa in Turin.</p>
    <p>David has now aligned the weights and widths to make a super 32<br>
    style family, in much the same manner he tamed Bureau Grot to<br>
    make a wide mix of styles. This is a classic (actually neo-classical)<br>
    Font Bureau tale of custom font development. The result, we offer<br>
    a complete 21st Century Modern Family to you: FB Moderno (Modern is<br>
    the traditional name for Bodoni-like typefaces that have a lot of<br>
    contrast between thicks and thins).</p>
    <p>32 Styles: light, regular, semibold, and bold in normal, condensed,<br>
    extra condensed, and compressed widths. All with italics.</p>
    <p>Come see FB Moderno on our website at:<br>
    <a href="http://www.fontbureau.com/ModernoFB" title="http://www.fontbureau.com/ModernoFB">http://www.fontbureau.com/ModernoFB</a></p>
    <p>Available from Font Bureau and its distributors.</p>
    <p>To find out more about the type designer, David Berlow, go to:<br>
    <a href="http://www.fontbureau.com/people/DavidBerlow" title="http://www.fontbureau.com/people/DavidBerlow">http://www.fontbureau.com/people/DavidBerlow</a></p>
    <p>NEWS</p>
    <p>Benton Modern Expansion<br>
    New styles have been added to this great news text type from our<br>
    Readability Series, including Bold, Italic, and Small Caps for Roman,<br>
    Italic and Bold, all in four grades.<br>
    <a href="http://www.fontbureau.com/fonts/BentonModern" title="http://www.fontbureau.com/fonts/BentonModern">http://www.fontbureau.com/fonts/BentonModern</a></p>
    <p>Type 101<br>
    Check out Font Bureau’s blog, where we share occasional notes<br>
    about type and typography. Our recent posts include “Sam Berlow<br>
    interviewed on NPR’s On The Media”, “Campaign Typography” and<br>
    “The Em”.<br>
    <a href="http://type101.fontbureau.com/" title="http://type101.fontbureau.com/">http://type101.fontbureau.com/</a></p>
    <p>SND Boston<br>
    The 29th annual workshop and exhibition of Society for News Design<br>
    was held this past October in Boston. Font Bureau was a proud<br>
    sponsor of the event. David Berlow gave a talk on “Screen Fonts:<br>
    An Abbr. Hist.” and Matthew Carter’s “It’s The Little Things”<br>
    discussed recent innovations in presenting stock tables, sports<br>
    agate, and other small information. Both were invited to lead the<br>
    Typography Roundtable, a discussion on trends from readability<br>
    to revivals.</p>
    <p>TYPO Berlin<br>
    David Berlow has been invited to speak at the 13th international<br>
    design conference of TYPO Berlin, to be held this May. It has<br>
    established itself as the premier European event for typographers,<br>
    graphic designers and other design professionals from all over<br>
    the world.</p>
    <p>Cyrus Highsmith featured in Cap&amp;Design<br>
    The Swedish design publication Cap&amp;Design interviewed Font Bureau’s<br>
    senior type designer Cyrus Highsmith, featuring him on the cover<br>
    and inside spread of its October issue. Boomer, Highsmith’s<br>
    original typeface drawn for AARP The Magazine in 2006, was also<br>
    used for that issue.</p>
    <p>Helvetica: A Documentary Film by Gary Hustwit<br>
    Released in 2007 Helvetica is an independent film “about typography,<br>
    graphic design and global visual culture…the proliferation of<br>
    one typeface as part of a larger conversation about the way type<br>
    affects of lives.” Matthew Carter and Mike Parker, distinguished<br>
    members of Font Bureau’s type board, were interviewed for the film,<br>
    as well as a Font Bureau contributing type designer, Tobias<br>
    Frere-Jones. After showing in over 150 film festivals worldwide,<br>
    its global screening tour continues and is now available on DVD.<br>
    It was nominated for the Independent Spirit Award and recognized<br>
    by the Design Museum in London.<br>
    <a href="http://www.helveticafilm.com/" title="http://www.helveticafilm.com/">http://www.helveticafilm.com/</a></p>
    <p>NOTEWORTHY</p>
    <p>Font Bureau contributing type designer Christian Schwartz was<br>
    awarded the eighth Prix Charles Peignot by Association Typographique<br>
    Internationale (AtypI) this past September.<br>
    <a href="http://www.atypi.org/" title="http://www.atypi.org/">http://www.atypi.org/</a></p>
    <p>Matthew Carter acted as Jury Chair of TDC2 2008, the Type Director’s<br>
    Club annual international competition of new typeface designs.<br>
    <a href="http://www.tdc.org/" title="http://www.tdc.org/">http://www.tdc.org/</a></p>
    <p>STAY TUNED</p>
    <p>Our next upcoming releases will include two new serif displays,<br>
    Benton Modern Display, prepared by Dyana Weissman and Richard Lipton,<br>
    and Rocky, crafted by Matthew Carter.</p>
