    html: |-
      <p>Would really like to know too. Looks very close to some Futura. I firstly thought about <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/ars_type/ars_maquette_pro_complete/" rel="nofollow">Maquette</a> (using alternate /l and /a) but really too far (too many details remain off: /a, numerals, /w and almost all uppercases).<br>
      Foam uses many fonts on its website and possibly mixed up:<br>
      - Arial as html font<br>
      - <a class="freelinking external" href="http://lineto.com/The%20Fonts/Font%20Categories/Text%20Fonts/Brown/" rel="nofollow">LL Brown</a> for some graphics including <a class="freelinking external" href="http://www.foam.org/media/2817074/08-053%20fm%20media%20kit.pdf" rel="nofollow">press kit</a><br>
      - possibly some <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/futura-bq/" rel="nofollow">Futura</a> and/or the mystery font you're after (closer look <a class="freelinking external" href="http://www.foam.org/media/3443692/08-012-27_issue31_outnow.jpg" rel="nofollow">here</a>, not sure for the numerals though on this one and <a class="freelinking external" href="http://www.foam.org/media/3437371/banner%20talent%20callpresswebthumb.jpg" rel="nofollow">here</a>) which could be a modified Futura...<br>
      The closest I have for "Foam Album 10" would be <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/betatype/apertura_complete_ot/" rel="nofollow">Apertura</a>.</p>
