      <p>@seansk8er – You draw on your mind until you've drawn your mind away.</p>
      <p>Longwinded way: You draw glyphs which you then combine into a typeface. You then work some arcane magic on the typeface until you have a working font, ready to install. For, as it was once said, "A font is a typeface with a hard hat on." And, yes, I'm leaving out some six cuckoozillion steps.</p>
