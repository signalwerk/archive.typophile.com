    html: <p>The copyright on the cover is 1983. But you really don't see any further similarity? Certainly the G, but also the t and a few others, and the overall character. To me it looks like Antique Olive with the letter widths all mixed up. But it could certainly be something completely different. Maybe something else by Roger Excoffon? Either way I'm curious to know.</p>
