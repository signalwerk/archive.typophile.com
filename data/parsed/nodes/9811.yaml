    html: <p>I think it looks more like a typeface called <a href="http://www.myfonts.com/fonts/agfa/vellve/medium/" target="_blank">Vellve</a>, although it's got some obvious differences there too.  <br> <br>A quick skim through the Sans Font ID Guide didn't find anything too close to these shapes. <br> <br>The obvious suggestion with a Disney project is that it has probably been customized by their own artists.</p>
