  html: <p>Here's one that got me curious... A friend sent me a scan of the cover of an old EPCOT Center Official Album. The font looks very much like Antique Olive, but it has some obvious quirks that distinguish it from the typical versions I've seen. Does anyone know the origin of this particular version? Is it available in digital form? <br> <br><img src="http://www.typophile.com/forums/messages/83/67548.jpg" alt="epcot lp"></p>
