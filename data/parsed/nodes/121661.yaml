  html: |-
    <p>I'm creating a new font because I needed some numbers for an app and couldn't find any free font that I was satisfied with.</p>
    <p>It's inspired by Handbook, DIN and the like. </p>
    <p>The letters all have same the width as I need that for the interface I'm creating:) </p>
    <p>Will probably open source it when done.</p>
    <p>Hoping to hear your feedback so I can improve it.</p>
    <p>I've created the thinnest, regular and black from scratch - the rest are just interpolated.</p>
    <p><img src="/sites/default/files/old-images/minfontdemo_5415.png"></p>
