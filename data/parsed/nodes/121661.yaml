      <p>I think it’s looking good for the purpose. A couple of annotations:<br>
      - Even if it’s a geometric design, I think you should address the top-heaviness of the |8|, since you already made other optical adjustments like overshot.<br>
      - Personally I find the heaviest weight a bit jarring in the open glyphs.<br>
      - Not a fan of the bump in |6| and |9| either, where the stem joins the loop.</p>
