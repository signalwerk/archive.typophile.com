    date_raw: 19 Sep 2006 — 6:14am
    votes: null
    html: '<p>Be careful purchasing MvB fonts if you are likely to want to make use them in a PDF: their <a href="http://www.mvbfonts.com/html/info/contents/eula.htm" rel="nofollow">standard EULA</a> is rather restrictive, so you might want to check what they charge for an embedding licence.</p>'
  - id: 162464
    user: 14880
    date: 2006-10-13T15:49:00
    date_raw: 13 Oct 2006 — 3:49pm
    votes: null
    html: <p>I think you would be better off creating all-new original letter forms by hand and screw the EULA. That way you can own it and do what you want.</p>
  - id: 162469
    user: 14880
    date: 2006-10-13T16:25:00
    date_raw: 13 Oct 2006 — 4:25pm
    votes: null
    html: <p>I'm not sure if I made my point. If you can't find the perfect font that works for your needs or the license is too restrictive why don't you design your own font. Start from scratch and make your own. Its easy to do. I know you can do it.</p>
