  html: |-
    <p>Hello,<br>
    I have been trying for the past week to contact the author who created the font " A Yummy Apology" every time I find an email address I get a failure response mailed back to me.<br>
    The authors site is supposed to be  "http://www.moorstation.org/typoasis/designers/gemnew/" I've also tried to contact him by the various sites that stock this font but with the same response as above.<br>
    Its strange as I actually want to buy the commercial liscense to use this font for a project but I can t get hold of the Author, most would jump down your throat to sell you a license.<br>
    Anyone got any suggestions?<br>
    I would be open to using another similar font if anyone has any suggestions.<br>
    Any help much appreciated<br>
    Martin</p>
