  html: |-
    <p>In his book on optical scaling Tim Ahrens states that<br>
    the Ikarus system featured the ability to automatically<br>
    generated optically-scaled designed based on one master<br>
    design (that had some special information embedded,<br>
    somewhat like hinting) and that: "Considering that the<br>
    technology worked on the basis of single master fonts,<br>
    the results are of remarkable quality, which, under the<br>
    aspect of optical scaling, is still unmatched today."</p>
    <p>I had only head of this Ikarus feature once or twice,<br>
    and never in these glowing terms. Could anybody<br>
    elaborate, and -if it's that good- possibly explain<br>
    why it hasn't been reimplemented?</p>
    <p>hhp</p>
