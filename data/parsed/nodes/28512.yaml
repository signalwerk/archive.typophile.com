    html: <p>Hey Paul. I think there was something on this at counterspace, but the page has either moved or disappeared. The link to it from <a href="http://www.typebase.com" title="www.typebase.com">www.typebase.com</a> no longer seems to work, but there are other gems within their education section. There is also a topic page for kerning at Ellen Lupton's <a href="http://www.thinkingwithtype.com" title="www.thinkingwithtype.com">www.thinkingwithtype.com</a>. Not interactive, but informative. The essential thing is that negative space between characters should appear optically even, rather than mathematically equal.</p>
    html_clean: <p>Hey Paul. I think there was something on this at counterspace, but the page has either moved or disappeared. The link to it from <a href="http://www.typebase.com" title="www.typebase.com" class="link-external">www.typebase.com</a> no longer seems to work, but there are other gems within their education section. There is also a topic page for kerning at Ellen Lupton's <a href="http://www.thinkingwithtype.com" title="www.thinkingwithtype.com" class="link-external">www.thinkingwithtype.com</a>. Not interactive, but informative. The essential thing is that negative space between characters should appear optically even, rather than mathematically equal.</p>
