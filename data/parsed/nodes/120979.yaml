      <p>Please do not multiple post. This board is strictly volunteer and it's a weekend, so it may take a while for someone to respond.</p>
      <p>The typeface appears to be based on Goudy Handtooled, to which someone added swashes and other decorative touches (curled terminals on the C and S, decorative crossbar on the T):<br>
      <a href="http://www.myfonts.com/fonts/tilde/goudy-handtooled/" title="http://www.myfonts.com/fonts/tilde/goudy-handtooled/">http://www.myfonts.com/fonts/tilde/goudy-handtooled/</a></p>
      <p>Whether it is an actual typeface or a custom piece of typography will be hard to determine given the size and resolution of your sample.</p>
      <p>EDIT—Found it. TXTSanta Font:<br>
      <a href="http://www.myfonts.com/fonts/lettering-delights/txt-santa-font/" title="http://www.myfonts.com/fonts/lettering-delights/txt-santa-font/">http://www.myfonts.com/fonts/lettering-delights/txt-santa-font/</a></p>
