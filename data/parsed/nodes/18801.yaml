    html: <p>The reason I don’t think it’s based on Tiffany is the square ends on the serifs. Tiffany has round ends on the serifs. Otherwise, I agree there is some similarity. The top of the f is very similar to Poster Bodoni (a.k.a. Ultra Bodoni), but the bracketed serifs and the top of the i are very not Bodoni. It also has some similarity to very bold Caslons, but the top of the f is not like Caslon at all.</p>
