  - id: 349490
    user: 45027
    date: 2009-05-31T00:05:00
    date_raw: 31.May.2009 12.05am
    votes: null
    html: <p>I don’t know how far you want to stray from Helvetica. You might want to try Univers 45 Light, Akzidenz Grotesk Light, Avenir 35 Light, Avant Garde, Franklin Gothic Book. Some of these are not so close to Helvetica, but looking at your site, I think any of these choices could work on some level.</p>
