  html: |-
    <p>Hi. I would very much appreciate some suggestions.<br>
    I'm designing a photobook and I have Stampel Garamond as body text but need a typeface for the headlines and page numbers. </p>
    <p>I have been using ITC franklin Gothic, but I found that its a bit to close the Garamond with its humanist lines. The book is about science fiction (but in a very abstract way) </p>
    <p>Maybe a very tall tapeface that has a lot of character or maybe something more standard line MT Grotesque. Would be great if it was a modern contemporary typeface or at least contemporary looking. </p>
    <p>I tried with Raisonne but its a bit to much, but maybe something along those lines. </p>
    <p>Thanks!</p>
