    html: |-
      <p>I created a non-script handwriting font for the creation a child's primer to teach handwriting, from formation of letters to clear easy-to-read handing.</p>
      <p>This involved a few True Type fonts. Two of the fonts were very identical, featuring stand-alone versions of each letter, and same thing just with little arrows around each letter, indicating the correct manner to draw the letter.</p>
      <p>The third font was extremely difficult to create, because each letter had a tail or extention to connect to the next letter. To achieve a perfect connection for every combination: the a with an a, the a with b, the a with c, the a with a d etc., the b with an a, the b with an e, etc. uppercase with lowercase; the widths of each letter had to be test and tweaked, requiring much much time.</p>
      <p>There were some letters which did not have a baseline connection, but an upper connection, for example, an m with an o. So, there was a default baseline connection for m, and exception upper connection in a fourth font.</p>
      <p>Then, there were combinations that neither choice would work. So, I created a series of ligatures containing two or three letter combinations.</p>
      <p>There is a new technology called OpenType where the position of floating glyph elements and the replacement of them can be programmed into contextual tables, so the abovwe goal could be achieved in only two or three fonts, and have much better, even near perfect results.</p>
