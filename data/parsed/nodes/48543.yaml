    <p>First, is there a word for handwriting that isn't script?</p>
    <p>I'm looking for a font that, if actually written in, would make someone say, "Hey, you have good handwriting." I'm not actually trying to fool anyone, I don't have the printing technology for that, I just think that's a good description of the font I'm looking for. Here are two fonts that are close:</p>
    <p><a href="http://www.identifont.com/find?font=tekton" rel="nofollow">Tekton</a> (too precise):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tekton[1]_3973.gif"></div><p></p>
    <p><a href="http://www.identifont.com/find?font=comicrazy" rel="nofollow">Comicrazy</a> (too cartoonish):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Comicrazy[1]_5506.gif"></div><p></p>
    <p>Any ideas?</p>
