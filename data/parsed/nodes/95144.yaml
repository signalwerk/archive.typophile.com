    <p>Hi, I am trying to improve this page, and I am not sure which fonts to remove or change;<br>
    I used Lobster to "soften" the sharpness of the page, but it looks out of place, and I'm not sure if the body font (Hattori Hanzo) is also a good choice here.<br>
    I am trying to achieve an "artsy" look, It is suppose to be a part of a photography portfolio, and I don't want the hexagon and square shapes to make the page too "robotic"</p>
    <p><img src="http://typophile.com/files/typo_1.png"></p>
