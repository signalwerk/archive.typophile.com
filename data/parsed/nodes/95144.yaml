    votes: null
    html: |-
      <p>Welcome to our planet. It's small and monochrome, and you can't leave.</p>
      <p>The way Italics are traditionally made (steep slant, narrow, cursive, no serifs) causes them to be bad for continuous reading. That said I believe it's possible to make an Italic in a certain way so that it's more readable than most Roman fonts tend to be. The thing is if the Italic has too much of a Roman's good attributes it stops doing its main job well enough, since as a rule an Italic is designed to serve its Roman, and that town ain't big enough for both to be highly readable.</p>
      <p>hhp</p>
