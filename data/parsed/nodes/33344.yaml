      <p>Following the links through from the article it amazes me why people pine for an underground/subway map to be geographically correct. As a rule (and one with a lot of exceptions I realise) people who are going to use the underground start with a geographically correct map to find their destination, then find the geographically nearest station. Once you are in the underground/subway system all ordinairy sense of geography is lost, in fact in many London station all orientation dissapears by the time you've taken the many stairs and corridors to the platform.</p>
      <p>From limited personal experience I have to say I found the numbers on the existing NY subway map a little confusing. I think they put doubt in the mind of visitors - too much choice can be a bad thing. The London map is simpler; but then again so is the system!</p>
