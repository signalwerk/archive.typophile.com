      <p>There's really nothing wrong with the original map as far as functionality goes (disclaimer: I grew up in NYC and have used this map my whole life. Furthermore I have no problem at all with tourists getting lost and ending up in the south Bronx. In fact I wish all the tourists ended up in the south Bronx or just went back home). </p>
      <p>But what has never been clear even to a native is the truly draconian scheduling - why some trains run only at rush hour or mysteriously terminate sometimes at certain stations or go local when they're supposed to be express (or vice versa). I'd give a prize to a map that could clearly let you know whether your train was in fact running when and where you think it is.</p>
