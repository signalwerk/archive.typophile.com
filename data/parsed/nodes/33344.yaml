      <p>I use the subway map pretty regularly. But I'm not a Manhattan-centered local, I have a studio in Queens and lots of friends and family in Brooklyn, so I find myself using a pretty broad variety of subway lines, and often having to compare them to see which one will get me there faster and with fewer stops or fewer connections. It is probably simpler for a lot of people who mostly use it to get to work and back.</p>
      <p>Now, most tourists stick to Manhattan and how confusing can that be? The streets are mostly numbered as are a lot of the avenues. I can see getting lost downtown or in Brooklyn but you have to be pretty clueless to get lost in midtown, whether or not the subway map is geographically accurate.</p>
      <p>I will also add that most NYers are pretty helpful to lost tourists. We like being know-it-alls. I've even seen bidding wars - My route is better than your route! Don't listen to him, take this train! No, not that train, you have to change! But my train makes fewer stops!</p>
      <p>Nothing but nothing beats the Berlin system where you can type in your address and your destination on a web site as well as the time you want to leave/get there and it gives you precise directions even to the minute. And then it's accurate!</p>
      <p>Paris Metro is a snap.</p>
