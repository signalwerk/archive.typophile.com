      <p>I will also add that most NYers are pretty helpful to lost tourists. We like being know-it-alls. I've even seen bidding wars - My route is better than your route! Don't listen to him, take this train! No, not that train, you have to change! But my train makes fewer stops!</p>
      <p>Nothing but nothing beats the Berlin system where you can type in your address and your destination on a web site as well as the time you want to leave/get there and it gives you precise directions even to the minute. And then it's accurate!</p>
      <p>Paris Metro is a snap.</p>
