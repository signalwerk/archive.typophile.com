      <p>As someone who grew up in America but has immigrated to NYC, I never had any problems getting used to the existing subway map. I've found it very helpful that I can match it up approximately to real geography, because I'm generally trying to figure out how to get to some particular place, rather than trying to grasp the overall topology of the system. That's why I think the existing focus on nodes (with less clarity for lines) is better than the focus on lines (with less clarity for nodes) in this new map. Plus, as Patty says, only half the lines actually function at any given time anyway, so why put the emphasis on the lines? :)</p>
