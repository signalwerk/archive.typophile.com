      <p>Tim, the last straw is they are tearing down Coney Island to make it more of a "Vegas-style" themed resort with condos etc. Why? Because tourists don't really go there. Which is, of course, why the natives love it so.</p>
      <p>As an artist and designer it is frustrating to watch my edgy interesting city give way to a sanitized, mallicized, Disneyized place that only bankers can live in and tourists can love. While the artists are fleeing in droves because they can't afford to live here, or don't want (in their 30s and 40s) to once again pioneer a decrepid, borderline dangerous neighborhood with no services so that they can get priced out 10 years later when the bankers decide it's cool (c.f. Dumbo, W-burg, East Village).</p>
