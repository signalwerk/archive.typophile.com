      <p>I don't believe this exists in digital form. There's always <a href="http://www.fontshop.com/fonts/singles/paratype/itc_machine_book_ot/?sample_text=CUTTERS&amp;sample_size=74&amp;acs_ss=-1&amp;acs_p=1&amp;acs_pt=24&amp;acs=1" rel="nofollow">ITC Machine</a>, but that's a bit too condensed and many letters don't match. Another option is <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_oxide_solid_ot_bold/" rel="nofollow">FF Oxide</a>.</p>
      <p>Jeff Levine's <a href="http://www.myfonts.com/fonts/jnlevine/sporting-life/?refby=typographica" rel="nofollow">Sporting Life</a> and Canada Type's <a href="http://www.myfonts.com/fonts/canadatype/player/?refby=typographica" rel="nofollow">Player</a> are slabbed versions of this jersey lettering.</p>
