    <p>Does anyone know this sans being used by Urban outfitters on their updated website? They are using it on the main page (<a href="http://www.urbanoutfitters.com" title="http://www.urbanoutfitters.com">http://www.urbanoutfitters.com</a>) for the header and the secondary navigation, as well as on their blog (<a href="http://blog.urbanoutfitters.com/blog" title="http://blog.urbanoutfitters.com/blog">http://blog.urbanoutfitters.com/blog</a>) in various places. It looks a bit like Planeta from Gestalten, but there are more alternates and a different lower case.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/urban_outfitters_sans_4745.jpg"></div><p></p>
