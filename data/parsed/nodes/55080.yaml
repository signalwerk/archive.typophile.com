    html: <p>Why not try spacing the whole name just a little bit looser? Looser letterspacing is common for uppercase letterforms, and you might decide you don't need the extra space after <strong>Mc</strong>. Don't increase the space between <strong>F</strong> and <strong>a</strong>, though; that's about as loose as you want to get.</p>
