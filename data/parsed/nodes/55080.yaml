    <p></p><div class="imageWrap"><img src="http://typophile.com/files/brianmcfann_5504.gif"></div><p></p>
    <p>This is my namemark for a new business adventure. I wanted to see a little space between the "Mc" and the "Fann" although I don't know of any typographic precedent for it.  So I moved the "c" closer to the "M", and the "F" further away from the "c".  Does it look OK?  Or does it look like just the goofy sort of thing that a newbie would do?  And what about the rest of the spacing?</p>
    <p>The font is Big Caslon at 36pt.  For the web, should I use instead a font that doesn't have such fine hairlines.  Like maybe a text font even though I wouldn't use it at 36pt in print?</p>
    <p>Here is what it looks like at 48 pt.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/brianmcfann_48pt_5505.gif"></div><p></p>
    <p>Thanks,</p>
    <p>Brian</p>
