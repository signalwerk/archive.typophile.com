      <p>Does B look like it's a bit elevated? I'd lower it a bit...</p>
      <p>Is the first image old and second new? or are they two new iterations? I'll comment on the second (thinking it's a new one)... Still Kerning problems. Turn it upside down to see... B still a bit to close to R. And probably M to C as well... Should there be space between Mc and Fann? should it be like Mc Fann or McFann?</p>
      <p>But since you letterspaced it a bit more than before it doesn't look as if you'd be using fake sc's... ;)<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
