    <p>I am currently putting together a costing for a full character set font production for a client. If someone would be interested in assisting on the project please drop an email to</p>
    <p>rat_baggy [-at-] hotmail.com</p>
    <p>All character art will exist, it seems that at this stage it will simply (or perhaps not) be a matter of placing the characters and producing the font file (cross platform etc) to international standards etc.</p>
    <p>Please provide rough timeline, costing and or if you require additional information.</p>
    <p>Cheers,</p>
    <p>Paul</p>
