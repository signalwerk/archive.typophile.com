    <p>This font is a vector rendition of one in an old game, which I created from bitmaps<br>
    no more than 16 pixels high. I <em>think</em> I got its characteristics down quite nicely, but I’m wondering if this might be an existing font. Notice the peculiar rounded left side and block serifs on the “E”. The round edges on this and other characters were hinted at by a single missing pixel ...</p>
