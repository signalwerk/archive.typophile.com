      <p>The Eszett (»germandoubles«) is replaced by two »S« in uppercase texts. So you can simply make a glyph of two »S«, but you should not leave it blank.</p>
      <p>About the missing special characters:<br>
      It's always a good idea to design complete codepages. Take a look at:<br>
      <a href="http://en.wikipedia.org/wiki/Windows-1252" title="http://en.wikipedia.org/wiki/Windows-1252">http://en.wikipedia.org/wiki/Windows-1252</a><br>
      <a href="http://en.wikipedia.org/wiki/Mac_Roman" title="http://en.wikipedia.org/wiki/Mac_Roman">http://en.wikipedia.org/wiki/Mac_Roman</a></p>
      <p>If you use FontLab, it's very easy: Just select the codepage and fill all grey characters with your designs. So you will have support for all the languages mentioned on the Wiki pages above.</p>
      <p>Ralf</p>
