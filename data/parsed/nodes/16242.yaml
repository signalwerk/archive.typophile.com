    <p>hello</p>
    <p>im not sure if Design is the right subforum, please move this thread if its in the wrong place.</p>
    <p>im finishing a font that i plan to release for free download (but with a good EULA, i asked in another thread about that part). i want to finish it for my portfolio (trying to get into a university), and right now im adding some special charaters. its a UC-only font.</p>
    <p>right now i have</p>
    <p>?<br>
    !<br>
    ,<br>
    .<br>
    ;<br>
    $ £ €<br>
    long and short -</p>
    <p>im planning to add ( ) , @, +, the french characters (ç, ´, `, ^) and the german ones (ä ö ü).</p>
    <p>could someone add the characters i'd need for italian and spanish? it is a free font after all, and i dont wanna work much more on this. so english/german/french/italian/spanish are the languages that i want to have in my font.</p>
    <p>is there anything i forgot?</p>
    <p>and: in german, there is the Sz (ß), but this is used in lc only. if i have an UC-font - would you add it? i mean its UC-only, so somehow there are reasons to add it, but also some against it..</p>
