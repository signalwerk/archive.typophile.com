      <p><em>The ‘c’ is often lower-cased in otherwise all-caps settings</em></p>
      <p>With good reason. If they don't do that, you might not know to pronounce the "MC" as "Mac"... For example, in the new movie "Terminator Salvation," the opening credits are in all caps, so the last credit reads:</p>
      <p><strong>DIRECTED BY MCG</strong></p>
      <p>If I didn't happen to know that the guy goes by "McG," I could think that "MCG" is a very strange-sounding name, or the man's initials!</p>
