    html: |-
      <p>Hi russellm,</p>
      <p>You are absolutely correct! You may not be able to find the font, but there is a very good reason for where and how the "c" is placed in McGee.</p>
      <p>I have never been able to find this font. However, as a child, my father taught me to sign my last name McGee with a superscript "c" along with 2 vertical lines beneath as though the "c" is sitting just above an "11".</p>
      <p>He explained to me that it was very important to do this because it is specific to our family line.</p>
      <p>Later in life, while researching my family genealogy, I looked into trying to understand what my father meant when he said it was important to "our family line". </p>
      <p>What I have found is this:<br>
      King James I did dangle the proverbial potato (free farm land in Ireland if you will just leave my country and get off my back) in front of the Scots who were starving at the time, which led to the Scots-Irish or Black-Irish relocating to Ireland. I do not believe that was the beginning of the use of the superscript "c" in surnames like McGee. Most of the people who were not of "Nobility" were essentially illiterate by todays standards.</p>
      <p>What I have found though is that during the Irish Immigration to America, (I will use just the surname McGee for this example) Not all families could immigrate at the same time, or on the same ships. There were McGee family groups from many different areas. The thought of being forever separated from their immediate family was frightening. Each McGee family group adopted a simple symbolic way for separated families to reconnect after immigration. They altered the way they spelled their last name. Many used the superscript "c" alone or in combination with other markings underneath it. </p>
      <p>My theory about why we do not find these variations in fonts is that the use of them served a very specific purpose, for a relatively brief period of time. Most examples show up in 'handwritten' names, very few in 'type set'. </p>
      <p>You may be aware that many years of Irish to America Immigration Records were lost due to a fire in the warehouse used to store them. This makes it all the more challenging for those of us with Scot-Irish and Irish heritage to connect the dots to our Irish ancestors. </p>
      <p>I like to think that our Irish ancestors were very wise in using this clever way of reconnecting with their family members in America because in doing so, they have left us a few "bread crumbs" to help us find our way back to them.</p>
      <p>All the Best!<br>
      Robert Harbin-McGee</p>
