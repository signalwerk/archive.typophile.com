      <p>Here are some examples of the way "Mc/Mac"-prefixed surnames have been set in type.  These examples are from Justin McCarthy, ed., et al <cite>Irish Literature</cite> (John D. Morris &amp; Company, Philadelphia, 1904).  I extracted the images from the digitalized version on the Internet Archive.  Vol 1 can be found <a href="http://www.archive.org/details/irishliterature01mccauoft" rel="nofollow">here</a>.</p>
      <ol>
      <li>This is from the Title Page (the same in all volumes).  The actual size is about 1.4 inches (and the following images are scaled to maintain the correct relative size with this one).<br>
        <div class="imageWrap"><img src="http://typophile.com/files/mcfann_irish_lit_titlpg_5026.gif"></div>
        </li>
      <li>From Vol 3, page v (which lists the Editorial Board);<br>
         <div class="imageWrap"><img src="http://typophile.com/files/mcfann_irish_lit_edpage_6284.gif"></div>
        </li>
      <li>From Vol 1, page xvi (after his article on Irish Literature):<br>
         <div class="imageWrap"><img src="http://typophile.com/files/mcfann_irish_lit_sig_6589.gif"></div>
        </li>
      <li>From Vol 1, page xxi (in the body of a "special article"):<br>
        <div class="imageWrap"><img src="http://typophile.com/files/mcfann_irish_lit_bodytext_4345.gif"></div>
      </li>
      <li>From Vol 6, Table of Contents (selected "Mc/Mac"-prefixed surnames):<br>
        <div class="imageWrap"><img src="http://typophile.com/files/mcfann_irish_lit_toc_3662.gif"></div><br>
          Evidently, the different forms are not interchangeable, even if they are essentially the same, and some people must prefer that their names be set one way or the other.
        </li>
      </ol>
      <p>Since I am new, please let me know if this is not sufficiently interesting and/or it should be posted elsewhere.  I have more examples.  I am not an expert on this topic.  But I have recently been looking around to see how these surnames are written and set in type and wanted to share.</p>
