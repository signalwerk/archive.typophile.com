      <p>The anglicised forms of Irish surnames can have either 'Mc' or 'Mac'; the anglicised forms of Scottish surnames only have 'Mac'.</p>
      <p>The use of a superscript 'c' in 'Mc' is somewhat old-fashioned, an ordinary 'c' being more usual these days. From the 18th century to the early 20th century an 'open single quote' was commonly used instead of a 'c'.</p>
      <p>In the original languages, Irish continues to use two words whereas Gaelic writes surnames as a single word. </p>
      <p>To summarise:<br>
      Irish 'Mac Néill' can be anglicised as either 'McNeill' or 'MacNeill'<br>
      Gaelic 'MacNèill' is invariably anglicised as 'MacNeill'</p>
