    html: |-
      <p>Although these days Mc with the raised and underlined c is a stylistic choice, it was originally the same type of abbreviation as Wm and Thos, both of which you may have seen with the raised and underlined last letter. The letter was raised and underlined as a convention to show that letters had been omitted. It was done by clerks and scribes to save time and ink. We don't think of ink as a precious substance these days, but if you had to make your own, and the process included wetting crushing oak galls to make tannic acid and making iron sulfate, you'd want to conserve your supply, I'm sure. In the case of Mc, the a has been omitted.  I can see Wm, you save illia, which is a substantial amount of ink, but I don't see the benefit in trading the a for an underline. I suppose you have to view it as an incremental savings that adds up over time. </p>
      <p>I am not a typographer per se, and I learned this while studying old (and Olde) English handwriting pursuant to deciphering written records while transcribing them for genealogical use. I stumbled across this discussion while trying to find the rule for "space or no space" in McNames. I believe that over 90% have no space, but I can't find any source or authority to back it up.</p>
      <p>I found Robert Harbin-McGee's story about his dad teaching him to write the family name really fascinating.</p>
