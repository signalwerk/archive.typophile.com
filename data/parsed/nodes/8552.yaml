    html: <p> Jacques --  <br> <br>It seems I've arrived a little late to the party. But let me echo all the praise that's come before.  I really like what you've created here. In some ways TyPress reminds me of some of the things I was exploring in my Whitman typeface, but built on more of an oldstyle model (in contrast to Whitman's Transitional and Scotch forebears). <br> <br>This is a handsome face, and it sounds like you're well on your way to completing the design. If you're open to a few more comments, however, here are a couple of observations I had. <br> <br>This may be the fault of the flash specimen, but it looks to me like your lc 'v' is floating a bit on the line -- in words like 'advertisement' and 'approved'. Check the original to see if maybe you shouldn't extend the overshoot down a bit. If you've trimmed the vertex to the baseline, then I would try dropping to half the overshoot. If it's already below the baseline, I'd try going to the full value of the round overshoots. <br> <br>Again perhaps an artifact of the flash file, but the counter in your lc 'd' seems a little large to me. Although I see what you're after with the horizontality of the top join, you might want to let that inside curve drop a little more as it joins the stem. <br> <br>Finally, this may simply be a matter of taste, but I don't care for the chamfer at the top of lc 't'. I think the effect is perfect in places like the beak of the 'a' or the terminal of the 'y'. But here it serves to round out the top in a way that seems at odds with the crisp character of other, similar details. I would go for a compromise between your original, sharp version and this. Instead of an angled chamfer at the tip, I would try clipping the tip with a horizontal. <br> <br>These are just picky little things. Overall a handsome design. <br> <br>-- Kent. </p>
    html_clean: <p> Jacques --  <br> <br>It seems I've arrived a little late to the party. But let me echo all the praise that's come before.  I really like what you've created here. In some ways TyPress reminds me of some of the things I was exploring in my Whitman typeface, but built on more of an oldstyle model (in contrast to Whitman's Transitional and Scotch forebears). <br> <br>This is a handsome face, and it sounds like you're well on your way to completing the design. If you're open to a few more comments, however, here are a couple of observations I had. <br> <br>This may be the fault of the flash specimen, but it looks to me like your lc 'v' is floating a bit on the line -- in words like 'advertisement' and 'approved'. Check the original to see if maybe you shouldn't extend the overshoot down a bit. If you've trimmed the vertex to the baseline, then I would try dropping to half the overshoot. If it's already below the baseline, I'd try going to the full value of the round overshoots. <br> <br>Again perhaps an artifact of the flash file, but the counter in your lc 'd' seems a little large to me. Although I see what you're after with the horizontality of the top join, you might want to let that inside curve drop a little more as it joins the stem. <br> <br>Finally, this may simply be a matter of taste, but I don't care for the chamfer at the top of lc 't'. I think the effect is perfect in places like the beak of the 'a' or the terminal of the 'y'. But here it serves to round out the top in a way that seems at odds with the crisp character of other, similar details. I would go for a compromise between your original, sharp version and this. Instead of an angled chamfer at the tip, I would try clipping the tip with a horizontal. <br> <br>These are just picky little things. Overall a handsome design. <br> <br>-- Kent. </p>
