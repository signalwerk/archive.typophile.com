    html: "<p> The text setting is wonderful. <br>This font is really promising. <br> <br>It's funny that the \"g\"'s bottom seems less of a problem than I tought. But now I see that the caps are *slightty* too dark with respect to the lc. And the UC \"Q\" is definitely turning clockwise. <br> <br>I won't make any too-specific spacing comments, but I would say this: <br>1. Overall it's a bit loose for a \"real\" text face. <br>2. You might want to make the \"round-round\"s tighter - it helps in the overall. <br> <br>hhp </p>"
    html_clean: "<p> The text setting is wonderful. <br>This font is really promising. <br> <br>It's funny that the \"g\"'s bottom seems less of a problem than I tought. But now I see that the caps are *slightty* too dark with respect to the lc. And the UC \"Q\" is definitely turning clockwise. <br> <br>I won't make any too-specific spacing comments, but I would say this: <br>1. Overall it's a bit loose for a \"real\" text face. <br>2. You might want to make the \"round-round\"s tighter - it helps in the overall. <br> <br>hhp </p>"
