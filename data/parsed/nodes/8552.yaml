  - id: 56390
    user: 1250
    date: 2001-12-29T15:00:00
    date_raw: 29 Dec 2001 — 3:00pm
    votes: null
    html: "<p> &gt; How lose, or how tight should be a text face? <br> <br>Quantitatively, I have no idea. <br> <br>But I would say that it has to be as tight as possible without making the counters overpower the interletter spacing. The reasons for this are: <br>1. We generally read words, so letters should blend together. <br>2. Upto a point (which is essentially determined by the forms, not the spacing), the narrower a word the better, in two ways: more words fit in the field of vision during reading; more words fit in the line/page/etc. <br> <br>Also, I can offer examples. I can't think of a text face that has too-tight spacing (Helvetica's too tight, but it's not really a text), but I can mention two fonts that I admire except their spacing is too loose: Rotis and FF Eureka. <br> <br>hhp </p>"
    html_clean: "<p> &gt; How lose, or how tight should be a text face? <br> <br>Quantitatively, I have no idea. <br> <br>But I would say that it has to be as tight as possible without making the counters overpower the interletter spacing. The reasons for this are: <br>1. We generally read words, so letters should blend together. <br>2. Upto a point (which is essentially determined by the forms, not the spacing), the narrower a word the better, in two ways: more words fit in the field of vision during reading; more words fit in the line/page/etc. <br> <br>Also, I can offer examples. I can't think of a text face that has too-tight spacing (Helvetica's too tight, but it's not really a text), but I can mention two fonts that I admire except their spacing is too loose: Rotis and FF Eureka. <br> <br>hhp </p>"
