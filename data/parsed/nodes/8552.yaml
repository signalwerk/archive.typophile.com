n making the slant small. But of course you *still* need a discernible slant, and the smaller you make it the more you have to use color, width and apparent size to compensate. <br> <br>So, for example, the descending \"f\" is bad for reading: it creates confusion in our bouma decipherment. However, pure readability doesn't exist - it has to be balanced against aesthetics. To see what kind of balance I personally consider ideal (at least at this point in time), look at Patria, where in places I've sacrificed boumas for aesthetic effect - but also differentiation, like the lc \"a\", which is a common single-letter word in English (\"I said I wanted *a* dog.\"), and being short it's very likely to be deciphered through the blurry parafovea, so it needs extra help. <br> <br>hhp </p>"
