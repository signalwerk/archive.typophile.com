    html: '<p>Hi, <br>I put a SWF-File with text samples. Beware that the spacing is just basic. It would not make any sence making the spacing and kerning perfect, before the forms are final. Of course forms will be changed, if they are giving major spacing problems! <br> <br>Some asked how many hours I spent on the font. Well, on the regular wheight, which is the first wheight I made, I worked appr. 3 months (±5 days a week). <br> <br>BTW, thanks again for all the reactions, <br> <br>Jacques <br> <br><!---Attachment: typres_text2.swf-!--></p><center><table border="1"><tbody><tr><td><img src="http://www.typophile.com/forums/icons/mime_gif.gif" align="LEFT" alt="application/x-shockwave-flash">TyPress_Text2.swf<br><a href="http://www.typophile.com/forums/messages/29/typres_text2.swf"><b>typres_text2.swf</b></a> (6 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>'
