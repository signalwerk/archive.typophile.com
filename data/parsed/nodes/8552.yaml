    html: "<p> &gt; Gerrit Noordzij <br> <br>I admire Noordzij in many ways, both inside and outside of type design. His \"Letterletter\" I enjoyed very much, even though I disagree with its basic premise: when it comes to Noordzij's blind love of the hand, I think he's completely wrong - and I'm not the only one. As Paul Stiff writes in Typography Papers #4: \"Gerrit is confident that once we understand writing, we will understand typography. Here he is quite wrong: we will not understand typography until we understand reading.\" We no longer read handwriting. Let the doddering old man rest in peace, instead of trying to teach it the lambada. <br> <br>---- <br> <br>Functionally, in a text face, italics is about slant, and *not* \"ductus\". The simple reason is that immersive reading cannot always pick up too-subtle variations - it needs a discernible contrast in structure (or alternatively color, which is actually my personal preference), and this is provided by the slant. You need the slant*, the rest is a matter of two things: the designer's personal taste (which is often given way too much importance**), and functionalism (see below). <br> <br>* A good example of this is the italic of Seria: Majoor has made a font which is very beautiful, but because it has almost no slant it doesn't really work 100%. Small example: the UC \"I\" (common in English) is nearly impossible to decipher as italics. Note that he has a second -more slanted- italics for Seria, but I'm not sure when/where it's coming out. <br> <br>** Deep down this is a dispute between Art and Craft, and I'm personally tired of the huge exageration of the former in contemporary design. <br> <br>&gt; do you really think obliqued type is more readeable than Italics?  <br> <br>It's mostly a question of familiarity, specifically with boumas (word shapes): the closer  an italic is to the roman, the more readable it is - that should be beyond dispute. Not just in making the structures the same, but also in making the slant small. But of course you *still* need a discernible slant, and the smaller you make it the more you have to use color, width and apparent size to compensate. <br> <br>So, for example, the descending \"f\" is bad for reading: it creates confusion in our bouma decipherment. However, pure readability doesn't exist - it has to be balanced against aesthetics. To see what kind of balance I personally consider ideal (at least at this point in time), look at Patria, where in places I've sacrificed boumas for aesthetic effect - but also differentiation, like the lc \"a\", which is a common single-letter word in English (\"I said I wanted *a* dog.\"), and being short it's very likely to be deciphered through the blurry parafovea, so it needs extra help. <br> <br>hhp </p>"
