    html: "<p> &gt; I'm borderline bored with italics that look so similar to their roman counterparts <br> <br>How can you be bored of something that doesn't exist? <br> <br>Except for mechanical obliques (which are plainly a result of laziness), to me designers put way too much emphasis on superficial differentiations in italics. Why should an italic \"f\" descend, *exactly*? I think you have a point concerning display fonts, but not text fonts. <br> <br>I also happen to think that the sloped-roman idea was Morison's one good original contribution to type design - it was just executed badly: they applied it way too literally, instead of looking at what makes a roman a roman: rigidity. <br> <br>It's been 500 years, but a real italic has yet to emerge, as far as I'm concerned. And I think part of the problem is that italics are dual-natured. <br> <br>hhp </p>"
    html_clean: "<p> &gt; I'm borderline bored with italics that look so similar to their roman counterparts <br> <br>How can you be bored of something that doesn't exist? <br> <br>Except for mechanical obliques (which are plainly a result of laziness), to me designers put way too much emphasis on superficial differentiations in italics. Why should an italic \"f\" descend, *exactly*? I think you have a point concerning display fonts, but not text fonts. <br> <br>I also happen to think that the sloped-roman idea was Morison's one good original contribution to type design - it was just executed badly: they applied it way too literally, instead of looking at what makes a roman a roman: rigidity. <br> <br>It's been 500 years, but a real italic has yet to emerge, as far as I'm concerned. And I think part of the problem is that italics are dual-natured. <br> <br>hhp </p>"
