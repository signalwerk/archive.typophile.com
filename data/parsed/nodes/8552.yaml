    html: <p> Although we are reading words, the role of the white inner/contra forms should not be forgotten either. When the spacing is too tight, they sometimes become a problem. <br>When you make your font tight, what about the Uc? I always have a dilemma there. More Kerning pairs or not? <br> <br>Hrant, you should live in Germany. Here your eyes would be hit a 1,000,000 times a day by Rotis. I can stand the face. The philosophy behind it is very interesting, but it just doesn't work as a text face, even if you change the spacing.... <br> <br>Jacques </p>
    html_clean: <p> Although we are reading words, the role of the white inner/contra forms should not be forgotten either. When the spacing is too tight, they sometimes become a problem. <br>When you make your font tight, what about the Uc? I always have a dilemma there. More Kerning pairs or not? <br> <br>Hrant, you should live in Germany. Here your eyes would be hit a 1,000,000 times a day by Rotis. I can stand the face. The philosophy behind it is very interesting, but it just doesn't work as a text face, even if you change the spacing.... <br> <br>Jacques </p>
  - id: 56393
    user: 1250
    date: 2001-12-29T22:43:00
    date_raw: 29 Dec 2001 — 10:43pm
    votes: null
    html: "<p>&gt; When you make your font tight, what about the Uc? <br> <br>Good question... <br>I think that except for fonts which are abnormally loose, *all* UC-UC pairs should be positively kerned (I mean with respect to their \"traditional\" kerning, so \"AV\" might still have a slight negative kern, for example). <br> <br>Note that OpenType has a feature that lets you automatically open up the spacing of all caps setting, which would work 90% as well as doing it manually, I think. <br> <br>&gt; Here your eyes would be hit a 1,000,000 times a day by Rotis. <br> <br>:-) <br>Yes, I'd heard that, about Europe in general, and have seen it firsthand on trips. But even if I ended up hating Rotis, I'd *love* to live in Berlin! <br> <br>&gt; it just doesn't work as a text face, even if you change the spacing.... <br> <br>I actually don't consider it a \"real\" text face myself! The reason I admire it is its spirit. You might enjoy reading something I once wrote about Rotis. It's in one of the PDFs here: <br><a href=\"http://www.atypi.org/visitors/tour/pubs.html\" target=\"_top\">http://www.atypi.org/visitors/tour/pubs.html</a> <br> <br>hhp</p>"
