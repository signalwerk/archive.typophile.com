    html: "<p> &gt; What did you mean by \"a real italic has yet to emerge\"? <br> <br>I dunno, it feels like italics haven't \"arrived\" yet; nobody can really justify their overall design direction with them (at least not to my own \"functionalist\" satisfaction). The balance between individuality and congruence has not really been grasped yet; people just make them because they have to, or because they enjoy it, and then they just sell them off. Italics is like a temporary girlfriend, as opposed to a wife. <br> <br>Practially speaking, there's no problem, the user's happy (but only in the same way that almost no user takes advantage of the smallcaps right under his nose). My concern is more with the \"mysteries\" of reading, and what italics are supposed to actually do in text. <br> <br>Eidetic Neo: I do like it, particularly the italics, but as a cursive, secondary form. It would be great if it had a rigid (hence more textual) italics as well. <br> <br>hhp </p>"
    html_clean: "<p> &gt; What did you mean by \"a real italic has yet to emerge\"? <br> <br>I dunno, it feels like italics haven't \"arrived\" yet; nobody can really justify their overall design direction with them (at least not to my own \"functionalist\" satisfaction). The balance between individuality and congruence has not really been grasped yet; people just make them because they have to, or because they enjoy it, and then they just sell them off. Italics is like a temporary girlfriend, as opposed to a wife. <br> <br>Practially speaking, there's no problem, the user's happy (but only in the same way that almost no user takes advantage of the smallcaps right under his nose). My concern is more with the \"mysteries\" of reading, and what italics are supposed to actually do in text. <br> <br>Eidetic Neo: I do like it, particularly the italics, but as a cursive, secondary form. It would be great if it had a rigid (hence more textual) italics as well. <br> <br>hhp </p>"
