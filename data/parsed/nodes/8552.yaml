  html: "<p>Hi, I am new here. This is the first font I am showing here. At the moment I am working on a, which I call TyPress at the moment. It is a Sturdy serifed Typed, with subtle details. <br>To Introduce myself. My name is Jacques Le BaiIly,  I studied in The Hague, in the Netherlands. Now I work and live in Berlin, Germany. <br> <br>I need feedback on my Type. What do you think of it? Beware: the font has lining mediæval numerals!  <br>If you'd like it, I could show the Italic, although I only have the undercase at the moment. <br> <br><!---Attachment: typress_alpha.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Typress_alpha.swf<br><a href=\"http://www.typophile.com/forums/messages/29/typress_alpha.swf\"><b>typress_alpha.swf</b></a> (5 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
