    html: "<p> HHP: <br>I just opened a bottle of bear. And I read your essay.  <br>Of course Noordzijs' theory is limited. It is good to start to comprehend the type is constructed. If you looked right to my face, you have noticed I left N. theories. But for me it is still a very important starting point! <br> <br>I have been reading your remarks on typophile for a while now and noticed you probably have an immence knowhow. I never have been able to remind me texts and articles without rereading them. I did always remember the message. Compliments to you here. At the moment I am more busy forming my own point of view. Which is shown by my type. In short: I prefer to work out of the stomac (that is how a german would discribe it) <br> <br>Now to TyPress: <br>I decided not to take the Italic I just shown you, because I found it going too much into the textura/fraktur corner. You might argument now, the origine of Italic type is out of that corner, but the original idea of the type was to make a modern variation of a 17th century typeface. <br> <br> <br>Jacques <br> <br>Jacques </p>"
