    html: "<p> O-o-oh. <br>You are quick tonight. (Berlin it is 21:00) <br> <br>HHP: I am still a disputal of the theories about type I learned. Those are the ones of Gerrit Noordzij. (According to his theory, my Italic is a bastard, having its way of building somewhere between roman and 'real' italic) Noordzij has tried to differ between roman and Italic by analysing the way one would write them. So one can say there is immence difference between Roman and Italic. <br> <br>I think we have here a discussion about theory, not about my typeface. <br> <br>I decided to make my italic a 'bastard' Italic, not only because I like it, but also because i was inspired by 16th and 17th century type. Then they designed Italic to be used with roman faces, but still they were seperate designs. Combined with theory of type of G. Noordzij.  <br> <br>I have personaly my difficulties with obliqued type. <br> <br>Jacques <br> <br>PS: question: hhp, do you really think obliqued type is more readeable than Italics? </p>"
