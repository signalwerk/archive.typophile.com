    date_raw: 22 Dec 2001 — 11:03pm
    votes: null
    html: "<p> This is serious. Maybe the best thing on this forum yet. <br> <br>Wonderful integration of curves and cuts. It's clear you're not afraid to see through the superficial rules of type design - instead getting and giving a taste the real juices inside. <br> <br>It's very nice to see straightness where we usually see mushy curves, like in the lc \"a\", \"g\" and \"s\". In the \"g\", though, maybe the straightness should \"end\" sooner - I think it's pushing the lower counter a bit out of shape. Do you know what I mean? Also in the \"g\": you might want to make the head have vertical stress - like your \"o\". <br> <br>The lc \"a\"'s tail should maybe be more like the finials of the lc \"c\" and \"e\". The lefthand \"stubs\" of the lc \"f\" and \"t\" are a wonderful shape, but they seem to be making a dark spot, especially in the \"f\" (which btw has a great righthand foot serif, as does the \"r\"). The lc \"k\" is killer! For the lc \"q\", maybe consider making the serif on the descender righthand only. I would give the lc \"r\" a stronger beak. The \"seats\" of the \"v\" and \"w\" are amazing. And the lc \"y\" is the real thing. The comma should maybe be more of a comma - less of a period with an appendix. <br> <br>UC: Maybe lower the bar of the \"F\". I'd make the \"G\"'s beard sharp (like the lc \"b\"'s seat). The top-left of the \"M\" and \"N\" is just too good. But I think the \"M\" needs to be wider - maybe open up the middle \"V\". I'd make the \"P\"'s head bigger. As for the \"Q\", it's a \"Q\" alright! I really like the structure and form. But the tail seems to be pulling it leftward/clockwise a bit. The \"R\"'s leg seems a bit too strong - but maybe I'm being to \"rationalist\". I think the \"Y\" definitely needs a bigger torso. As for the \"Z\", it looks a bit too sharp - maybe treat the corners like you did in the numeral \"4\" (same for the lc \"z\"). <br> <br>Numerals: The \"3\" is just wow. The zero is great, but maybe a little light (on purpose?). BTW, all the numerals seem to have a little too much stroke contrast. I think your BP is cool, but maybe too big with OS nums. <br> <br>And in terms of proportions: I think your ascenders are not long enough in relation to the descenders. <br> <br>Please don't take this critique harshly - you have something amazing here, make no mistake. Go all the way with it. <br> <br>hhp </p>"
