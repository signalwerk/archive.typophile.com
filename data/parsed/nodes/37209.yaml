    <p>’ello all )</p>
    <p>I’ve been a graphic designer for just over 10 years now, when it comes to type, it’s like the dudes at office “wo there he goes again...”, and the like. I should admit I spend a considerable amount of time reviewing, arranging, browsing, buying etc out of my love of fonts. Let alone publications and blogs, I’</p>
    <p>I’m not a type designer after all and I’ve been on penalties from higher management over a couple of purchases (made out of love and liquor). Now I know only a number of fonts can do any project in any given world, but I just cannot stop!</p>
    <p>Should i go see a doctor?</p>
