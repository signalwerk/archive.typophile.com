    html: |-
      <p>I agree that it is probably custom. The PANIGUA capitals seem to be built on the Gothic even width principle, using squared forms. The only unusual feature is the termination of the N diagonal in the middle of the right hand stroke rather than at the base. Another squared Gothic font with a similar, but less distinctive N is Big Noodle Titling<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BigNoodleTitling_6264.jpg"></div><br>
      <a href="http://www.myfonts.com/fonts/sentinel/big-noodle-titling/" title="http://www.myfonts.com/fonts/sentinel/big-noodle-titling/">http://www.myfonts.com/fonts/sentinel/big-noodle-titling/</a><br>
      Unfortunately the A does not have angled sides.<br>
      Don<p></p>
