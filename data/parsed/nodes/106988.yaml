      <p>I knew I'd already seen it. Previous discussion <a class="freelinking external" href="http://typophile.com/node/100407" rel="nofollow">here</a> but it was for "MOLTENI" lettering. Dick Pape suggested <a class="freelinking external" href="http://www.myfonts.com/fonts/dawnland/massiva-grotesq" rel="nofollow">Massiva GrotesQ</a> which actually works pretty well squooshed. Reminds me of many of <a class="freelinking external" href="http://www.myfonts.com/foundry/Jeff_Levine/" rel="nofollow">Jeff Levine</a> fonts like <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/canby" rel="nofollow">Canby</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/lobby-card" rel="nofollow">Lobby Card</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/deerfield" rel="nofollow">Deerfield</a>.<br>
      Best chance is probably asking directly <a class="freelinking external" href="http://www.01134.co.uk/studio/paniagua-a-fusion-of-cycling-design-food-and-coffee" rel="nofollow">Hello</a>.</p>
