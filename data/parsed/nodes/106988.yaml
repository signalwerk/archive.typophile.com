      <p>I knew I'd already seen it. Previous discussion <a href="http://typophile.com/node/100407" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a> but it was for "MOLTENI" lettering. Dick Pape suggested <a href="http://www.myfonts.com/fonts/dawnland/massiva-grotesq" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Massiva GrotesQ</a> which actually works pretty well squooshed. Reminds me of many of <a href="http://www.myfonts.com/foundry/Jeff_Levine/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Jeff Levine</a> fonts like <a href="http://www.myfonts.com/fonts/jnlevine/canby" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Canby</a>, <a href="http://www.myfonts.com/fonts/jnlevine/lobby-card" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Lobby Card</a>, <a href="http://www.myfonts.com/fonts/jnlevine/deerfield" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Deerfield</a>.<br>
      Best chance is probably asking directly <a href="http://www.01134.co.uk/studio/paniagua-a-fusion-of-cycling-design-food-and-coffee" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Hello</a>.</p>
