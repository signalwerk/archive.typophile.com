      <p>Nick wrote: <em>The fact that the idiosyncrasies do not belong in the typography of a particular type designer, art director or publication is an indicator of mainstream conservatism when confronted with something a little “over the top”, rather than a mistake by the original designer.</em></p>
      <p>The thing with idiosyncrasies, it seems, is that they should be properly personal, as the term suggests, so the whole question of idiosyncrasies in revivals is problematic. A copied idiosycrasy is no longer idiosyncratic: it has lost the personal touch that made it meaningful and, often, made it work. When Fleischman cuts his idiosyncratic rococo details, he is exercising a personal creative decision within the decorative context of his cultural milieu. When someone copies those details in a 21st century revival, neither the personal creativity nor the cultural milieu is preserved, so what was gloriously idiosyncratic in the 18th century becomes affectation.</p>
      <p>I like true idiosyncrasy in type design. The first time I saw František Štorm's Biblon I was dancing inside. But when it comes to revivals, I'd rather see the idiosyncracies of the reviver than the slavishly copied idiosyncracies of the original.</p>
