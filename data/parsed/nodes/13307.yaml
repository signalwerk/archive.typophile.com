      <p>One of the pleasures (and challenges) of working with historical sources is that they force you to articulate what it is you like about them. With so many type designers engaged in this kind of work, it's increasingly difficult to find new ways to react to old fonts; I really wonder whether the world really needs another Caslon revival, and we surely haven't seen the last of them. But I also felt this way ten years ago, and from the vantage point of 2005 I really can't imagine typography without Matthew Carter's "Big Caslon." (Substitute Justin Howes' "Founders Caslon," or Mark Andresen's "NotCaslon," if you like -- the point is that each of these designers reacted to something different, but very specific, in the same source, and in expressing this reaction produced something truly vital.)</p>
      <p>This might be a good time for me to confess something I shared with Yves, which is that I don't really think of Mercury as a Fleischman revival. I did in the beginning: my first drawings in 1996 attempted a strict facsimile of Fleischman's No. 65 &amp; 66, complete with all the baroque details both general and specific (droopy ball terminals, dart-like serifs on the caps, a very narrow italic, and those blobby serifs that imitate the look of letterpress.) I presented these to the art director of Esquire, who politely told me that he didn't think they were right for the magazine. In struggling to express what what was wrong with the fonts, his assistant came closest when he characterized the fonts as "sluggish." I returned to the drawing board, and tried to figure out whether there was a way to "quicken" my drawings, or whether I should start from scratch.</p>
      <p>In trying to solve the problem, I spent some time thinking about what I liked about Fleischman in the first place, to see whether these attributes could be reconciled with my newly focussed brief. I discovered that it wasn't the details that I liked: I don't especially like the mannered peak of the cap A, or the sleepy lowercase g, and I quite dislike the rococo serifs on the caps E, F, T, L, C, G, S and Z. What I loved was the economy of the design -- its thrify proportions and excellent fit -- and its sparkle. I wondered if these attributes could be amplified, even at the expense of historical fealty, and decided to give it a shot.</p>
      <p>Happily, Esquire loved the result, and I did too. I found that the less I looked at Fleischman types in the Enschede books, the happier I was with Mercury. As Yves observes, there is indeed some Rosart in Mercury's Italics -- there's also some Fournier, and a little Luce. The italics may be the part of Mercury that departs most dramatically from Fleischman, which perhaps also explains why the italic is my favorite part of Farnhamn: Christian figured out a way to capture all the virtues of Fleischman's italics, and still make the font look badass. I also think Fenway deserves a closer look: among other things, Matthew is the only designer who has ever managed to wrangle Fleischman's figures into a workable font. Fenway's figures have all the ardor and wit of Fleischman's, and that Matthew managed to imbue his short-ranging figures with the qualities of these old-style ones speaks to both his skill and sensitivity as a designer.</p>
      <p>Yves mentioned that Fenway was "designed within certain editorial constraints," as obviously was Mercury, but I can't think of this as a shortcoming. External constraints give you something to push against, as Tobias likes to say; they demand that you substantiate your choices, and they provide criteria for evaluating a design's success. This is not to say that a revival that's subject to extraordinary constraints will be historically accurate (imagine a Cresci italic for cellphone screens), but the result can still achieve originality and even greatness. It will certainly be better than a historical revival that takes no position whatsoever, which to my mind is the direct route to blandness. Happily, I don't think any of our homages to Fleischman are guilty of this particular sin.</p>
