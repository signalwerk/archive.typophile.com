      <p>I used Fenway a lot in 2002 and 2003, first in typesetting <em>Language Culture Type</em>, and then in all the print material for the ATypI conference in Vancouver. For the former, I made an extended OpenType version with additional diacritics, e.g. for Arabic transliteration, which I sent to Matthew for approval.</p>
      <p>Judged as a Fleischman revival, I think Fenway is inevitably going to compare less favourably with most of the other designs that Yves reviews. But I'm not sure that it makes sense to judge Fenway in these terms. Fenway was designed as a text face for a magazine, and that is the first basis on which it should be judged. The fact that it is based in large part on ideas that can be traced to Fleischman's types seems to me a secondary consideration. Fenway isn't really a Fleischman revival; at least, it is no more a Fleischman revival than Galliard is a Granjon revival, and probably less so. One of Matthew's great talents is the ability to reinterpret historical models as entirely modern typefaces, without any lingering whiff of antiquity: the models are clearly evident in the resulting designs, but the treatment of the ideas is very fresh and, as in the case of the Fenway 'k', open to influences outside the model, or to multiple models.</p>
      <p>I would go so far as to say that in one important respect at least Fenway may be superior to -- or at least more interesting than -- the various recent Fleischman revivals or Fleischman-inspired designs: what Matthew has taken from Fleischman's types is not the baroque details that make the original so immediately distinctive but which, on closer examination, are quite superficial. What he has revived is not Fleischman's style, but Fleischman's ideas about readability, applied to an entirely contemporary typeface for a specific design brief and printing environment.</p>
