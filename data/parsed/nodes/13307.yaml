      <p>This is in fact quite relevant here I suspect. One thing I've been meaning to ask people like Jonathan (who have spent way more time than me analyzing the history and dissecting the forms) is something Andy brought up years ago: after making the #65, why did Fleischmann revert to more conventional forms on occasion (if not consistently)? The only hunch I have, based on the detailed "development" tables in the Enschede specimen books, is that he made the #65 on his own (it was a size in a style that he thought was needed), or at least without external "art direction", while some of the later works were specifically commissioned, presumably by people who said -or at least were assumed to think- "I want a 'normal' font in this size, for this use, etc." I wonder if this hunch holds any water. If not, then it becomes possible that Fleischmann was just an indecisive fellow!  :-/</p>
