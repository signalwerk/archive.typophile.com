      <p>I've always read every word you've written. Did you read Yves's review? He quotes me thus: "To me they all seem like great fonts." This is because there's a lot more to a good font than Hrant's ideas of how best to carry out a revival. Type is about the user, not one of us. This however cannot stop each of us from having personal opinions.</p>
      <p>Non-literal revivalism doesn't necessarily revive the original's ideas; generally it reinterprets the <strong>forms</strong> according to the ideas of the reviver. This is certainly not useless. But it also doesn't go deep enough in a certain direction, in this case that of structures conducive to greater readability.</p>
      <p>What I was referring to was more a process of:<br>
      1) Trying to figure out what the original designer was thinking; not just observing/borrowing what he ended up with.<br>
      2) Deciding which of his (presumed) ideas are worth reviving.<br>
      3) Applying those ideas to forms of this age.</p>
      <p>I think Fleischmann was a genius*, somebody whose thoughts -not just products- are worth paying attention to. But what could he have been thinking in making his #65?! I mean beyond the superficial baroque styling. Certainly nothing that shows up in any of the fonts here, not even Kaiser's, somebody who explicitly started with my #1 above. Maybe what he was thinking is incompatible with contemporary design. Sure, that's not something to ignore; but at least let's recognize what it is, or even just what it might be, and discuss it.</p>
      <p>* And I don't use that word lightly.</p>
      <p>To be fair, the sort of design I'm thinking of is quite unlikely to make it into a review of Fleischmann revivals. People would go "Huh? That's <strong>nothing</strong> like the dresses Marylin used to wear!"</p>
      <p>hhp</p>
