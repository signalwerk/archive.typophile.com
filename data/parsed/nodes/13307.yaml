      <p>Fleischmann left us with nothing explicit (that I know of).</p>
      <p>&gt; can we presume to know them with any certainty?</p>
      <p>What's "any"?<br>
      More interesting is "enough".</p>
      <p>Different people have different tresholds for crossing over from assumption to action. Some people might limit themselves to thinking "huh, isn't that curious", while others will say "well, if this is what he was thinking, and he was da man, let me try it too". Especially if one has had his own thoughts along those lines. Admittedly, there's the danger of reading too much into it, seeing what one wants to see. But really, can that actually hurt anything here? I mean, it's not like Fleischmann's descendants will complain.</p>
      <p>&gt; Which sets of his things embody them most fully?</p>
      <p>Good question. I think it's most useful to look at the fringes; at the stuff that's hard to explain (but done with full cognizance). Specifically in this case, the #65. The strangeness in the #65 can't really be a "mistake", can it? And if it isn't, what is it? We must try to explain. And I've only managed to think of one possible explanation: divergence to improve readability. I wish people with more talent and skills than me would see that too, and revive that aspect of Fleischmann. But it's hard to sell.</p>
      <p>hhp</p>
