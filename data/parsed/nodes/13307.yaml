      <p>Another thought on Fleischmann's idiosyncrasies.<br>
      They do stand out, because the idea is spottily applied, not evenly distributed throughout the typeface. But is that such a crime?</p>
      <p>He was ahead of his time -- by the mid 19th century, there were many decorated faces that had strange details, but applied throughout.<br>
      Admittedly, this is not everyone's cup of tea: Oz Cooper was really down on it, thinking it was rather precious to take one feature and pound away at it -- he preferrred variety in details.<br>
      Even today there are some faces which manage to integrate a great deal of peculiarity within the general theme -- Quadraat for instance -- it's much easier in an old-style serifed face.</p>
      <p>Idiosyncrasy is no big deal. How about Tarzana or Eplica, with their cap E that looks like a flipped 3?<br>
      That kind of thing may be unacceptable in the publication market that the Schwartz, Carter, and H&amp;FJ "Fleischmann's" are targetted at (am I right on that?), but it is nonetheless legitimate. </p>
      <p>If I were doing a Fleischmann revival, I would probably take the "quaint" details and spin them out a bit further throughout the face.</p>
    html_clean: |-
