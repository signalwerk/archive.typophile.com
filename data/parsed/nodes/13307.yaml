      <p>Having done several revivals, that stray from the original to varying degrees, I do of course agree with the legitimacy of adapting it to one's own muse, or that of one's client.</p>
      <p>And I would have to admit that typefaces do have a life of their own, beyond the initial intentions of their designer: Futura, for example, with most of Renner's signature characters falling by the wayside. But some remained, such as the straight-line j and the splayed M.</p>
      <p>The classics have their signature characters which have not been bowdlerized by future generations: the broken lower bowl of the Baskerville "g", the lower left serif on the Bodoni "b", the different angle of the top serifs on Garamond T etc. These are the exception, however, established by long usage in fine books, prior to mass media.</p>
      <p>The case for the original must still be made, exactly as rendered by its inventor, 'warts' and all. </p>
      <p>The fact that the idiosyncrasies do not belong in the typography of a particular type designer, art director or publication is an indicator of mainstream conservatism when confronted with something a little "over the top", rather than a mistake by the original designer. In other words, it is a question of aesthetic preference, not ergonomics.</p>
      <p>So, a mass-circulation publication's text type will have discreet features, because it must satisy the bell-curve's hump of readers' tastes, not because there is any inherent poor readability in the occasional idiosyncrasy.</p>
