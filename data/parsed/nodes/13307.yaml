      <p>In the right hands, I think that both approaches are valid. It's interesting to see the work that Gerard Unger is doing these days, as he's bringing a decidedly personal (and modern) style to a number of different historical idioms; it's equally interesting to see what happens when a thoughtful designer intentionally tries to slavishly imitate an artifact warts and all (I always think of Justin Howes' "Founders Caslon" here), in the interest of providing designers another type of raw materials with which to work. I think typography, and all of us here, are big enough to admit both kinds of typeface.</p>
      <p>Hrant, you seem to be suggesting that Mercury looks like Fleischman. I really don't think it does; it was the intention of the design to participate in some of the qualities of Fleischman's work that I described above, but not to actually replicate any of Fleischman's shapes. (That was the point of my post, and as always you're making me regret the forty-five minutes that I spent writing it.) I'd really encourage you to look at both designs a little more closely, after which perhaps you'll share whatever additional specific observations you have.</p>
      <p>You asked in another discussion about my thoughts regarding historical revivals in general, and in considering the question I've been straining to articulate precisely how my feelings have changed over the years. While I chew on this a little longer, I can at least leave you with this: Mercury represents the kind of work I'm most interested in doing right now, and it's consistent with an approach that Tobias and I have explored for the last few years. See <a href="http://www.typography.com/catalog/gotham/features.html" rel="nofollow">Gotham </a> for more information.</p>
