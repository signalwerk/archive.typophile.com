      <p>&gt;What was Fleischmann thinking?</p>
      <p>I think that the period he was living in was quite remarkable (at least in his younger days). Science and arts were in full swing, there was excitement in the air - discoveries were made, inventions done, improved communication made for greater awareness of what happened everywhere, etc.<br>
      So F. may have felt part of this movement to Enlightenment and could think outside of this constraining box of "I have to make a living" and tried to have fun doing his job, pushing the boundaries, being creative, trying to lift the level of his craft, showing of to others ("Look what I did!") -- in other words, behaved like a prima donna of typecutting.<br>
      And that is what made him a genius of course.</p>
      <p>(For a great, though perhaps not always historically accurate view of the period, read Neal Stephenson's Baroque Cycle. Three wonderful books.)</p>
