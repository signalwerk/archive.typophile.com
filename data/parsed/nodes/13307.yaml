      <p>As a latecomer to this forum I have to ask: what were Fleischmann's ideas on readability? Was he explicit about them? Did he articulate any in writing? </p>
      <p>If Fleischmann's ideas are in his things (cf. William Carlos Williams: 'no ideas but in things') can we presume to know them with any certainty? Which sets of his things embody them most fully?</p>
      <p>In relation to Yves' review and Jonathan Hoefler’s reflections on his own process, I find it interesting and instructive to observe how the Fleischmann corpus spawns different but recognizably descendant offspring--descent with modification--responding skillfully and intelligently to different, equally vital, ecological pressures, some personal preferential; some niche, marketing, or demographics based; some cognitive-scientifically constructed. </p>
      <p>Peter Enneson</p>
