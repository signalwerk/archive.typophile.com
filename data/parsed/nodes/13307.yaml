      <p>I first saw Fenway in 1998 when it was submitted to the very first TDC type design competition. I remember what struck me then was the larger-than-usual height of its small capitals which were very strongly drawn, and, of course, its excellent figures. I must confess, it did not feel like a revival at all...</p>
      <p>I used Fenway twice: in 2000, in typesetting the <a href="http://www.atypi.org/30_members/35_country_delegates/atypicountry2000.pdf" rel="nofollow"><em>Reports of the </em>[ATypI]<em> Country Delegates</em></a>, and in 2002, in designing <a href="http://www.atypi.org/05_About_us/70_publications/50_LCT/" rel="nofollow"><em>Language Culture Type</em></a> (see John’s post above). In both jobs those small caps and figures worked wonderfully. </p>
      <p>The optimal size range of small caps was one of the important features that was studied and discussed in the process of developing the multilingual fonts for the MS ClearType Font Collection. It felt that the larger s.c.—<em>of the Fenway kind</em>—could work better across all three scripts that constitute the MSCT character set (Latin, Greek and Cyrillic).</p>
