    html: <p>Back when we were writing the <i>Glossary of Typesetting Terms</i> I researched this one a bit. Turns out that (at that time) the Associated Press style was to use three periods with no extra spacing. The <i>Chicago Manual</i> (whatever edition) calle for three periods with a 3-to-em space in between the periods -- of course, Chicago frequently got its "to-em's" a little off; this would give wider than nornal spacing within the ellipsis. <br> <br>I've been known to argue both sides. Finally our company went with a normal (usually justifying) word space between the periods, on the grounds that the more word spaces you can get in a line, the tighter the line will usually set, and the more even the spacing generally. Not the best argument I've ever offered . . . <br> <br>We've programmed this "ellipsis" to prohibit a break within of course, and have a high penalty to break before. A four-dot ellipsis is really a sentence-ending period with a standard ellipsis following. One more reason to use the normal space. <br> <br>MLA style can vary from this, BTW. If it were me &amp; I were building a font with a single ellipsis character, I'd make the space between the dots a bit less than the smallest justifying word space. If someone then decides to go the other route, they just don't use the ellipsis "character." But if you make it a ligature and someone can't turn off that particular ligature without turning off all the ligatures, you do have a problem. <br> <br>FWIW, <br> <br>Charles</p>
