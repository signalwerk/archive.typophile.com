  html: |-
    <p>Hi there, I am trying to implement a generic MIF for my fonts which activates option 14/6 (Typographical Extras/Periods to Ellipsis). I have written the below code which successfully changes the first full stop to an ellipsis, but I have no idea how to change the following two to DELs, can anyone help? (It is originally based on the swash Eva example from Apple's documentation - I realise that it does more than it needs too at the moment, but I'll clean that up later.) <br> <br></p>
    <pre>Type	Contextual <br>Name	Typographic Extras <br>Namecode	14 <br>Setting	Periods to Ellipsis <br>Settingcode	6 <br>Default	yes <br>Orientation	HV <br>Forward	yes <br>Exclusive	no <br> <br>FS	32 <br> <br>	EOT	OOB	DEL	EOL	FS <br>StartText	1	1	1	1	3 <br>StartLine	1	1	1	1	3 <br>Flush	1	1	2	1	2 <br>Saw1	1	2	3	1	4 <br>Saw2	1	2	5	1	6 <br>Saw3	7	7	6	7	7 <br> <br>	GoTo	Mark?	Advance?	SubstMark	SubstCurrent <br>1	StartText	no	yes	none	none <br>2	Flush	no	yes	none	none <br>3	Saw1	yes	yes	none	none <br>4	Saw2	no	yes	none	none <br>5	Saw2	no	yes	none	none <br>6	Saw3	no	yes	none	none <br>7	StartText	no	yes	Ellipsis	none <br> <br>Ellipsis <br>	32	167</pre>
  html_clean: |-
    <p>Hi there, I am trying to implement a generic MIF for my fonts which activates option 14/6 (Typographical Extras/Periods to Ellipsis). I have written the below code which successfully changes the first full stop to an ellipsis, but I have no idea how to change the following two to DELs, can anyone help? (It is originally based on the swash Eva example from Apple's documentation - I realise that it does more than it needs too at the moment, but I'll clean that up later.) <br> <br></p>
    <pre>Type	Contextual <br>Name	Typographic Extras <br>Namecode	14 <br>Setting	Periods to Ellipsis <br>Settingcode	6 <br>Default	yes <br>Orientation	HV <br>Forward	yes <br>Exclusive	no <br> <br>FS	32 <br> <br>	EOT	OOB	DEL	EOL	FS <br>StartText	1	1	1	1	3 <br>StartLine	1	1	1	1	3 <br>Flush	1	1	2	1	2 <br>Saw1	1	2	3	1	4 <br>Saw2	1	2	5	1	6 <br>Saw3	7	7	6	7	7 <br> <br>	GoTo	Mark?	Advance?	SubstMark	SubstCurrent <br>1	StartText	no	yes	none	none <br>2	Flush	no	yes	none	none <br>3	Saw1	yes	yes	none	none <br>4	Saw2	no	yes	none	none <br>5	Saw2	no	yes	none	none <br>6	Saw3	no	yes	none	none <br>7	StartText	no	yes	Ellipsis	none <br> <br>Ellipsis <br>	32	167</pre>
