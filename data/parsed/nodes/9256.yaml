      <pre> <br>Type           LigatureList <br>Name           Typographical Extras <br>Namecode       14 <br>Setting        Periods to Ellipsis <br>Settingcode    6 <br>Default        no <br>Orientation    H <br>Forward        yes <br>Exclusive      no <br> <br>List <br>               ellipsis       period period period <br></pre><p> <br> <br>Although it is not documented Apple's tutorials, you can mix contextual and noncontextual substitutions in any feature set (in this case, Typographical Extras). <br> <br>Brent</p>
