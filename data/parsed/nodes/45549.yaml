    html: |-
      <p>The serifs are unbracketed. That is a Didot. I'm going to guess <a href="http://typography.com/fonts/font_overview.php?productLineID=100004" rel="nofollow">Didot</a> from Hoefler &amp; Frere-Jones because the roundness of the interior shapes on the n. It isn't the same shape in Linotype's Didot.</p>
      <p>Unless, of course, that is Mayeur from James (Montalbano). But I really don't think so as the serifs have no shape or further articulation.</p>
