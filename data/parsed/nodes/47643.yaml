  html: |-
    <p>I have some descriptor type (a short sentence) under a logo and would like to use something a little feminine but not too<br>
    "scripty". Something that has the character of Dalliance that is perhaps an italic font with a slight swash. Something<br>
    contemporary female without being "fussy". A script without being a script. Any recommendations would be sincerely<br>
    appreciated.</p>
    <p>JC</p>
