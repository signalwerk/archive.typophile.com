    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 29.May.2008 1.18am </div>
      <p>Latest news:</p>
    <p><strong>NEW RELEASE: Athelas</strong><br>
    Athelas is finally available at our online store. It is an elegant typeface intended for fine book printing, inspired in Britain’s literary classics. Athelas takes full advantage of the typographic silence, that white space in the margins, between the columns, the lines, the words, the lettershapes and finally, within the characters themselves.</p>
    <p><a href="http://www.type-together.com/ampl_font.php?idpuente=5">See more of Athelas</a><br>
    <a href="http://www.type-together.com/order_font.php?idpuente=5">Buy Athelas</a></p>
    <p><strong>EXHIBITIONS: TypeTogether exhibit in Rosario</strong><br>
    On Wednesday May 21st, TypeTogether opened its exhibition in Rosario Argentina. It presents some of the best known typefaces that TypeTogether has released and a few font families that are still under development. It also focuses on the design process for text typefaces, from conception to reader.</p>
    <p>Given its high educational value, flexibility and portability, there are already plans for showing the exhibition in educational institutions and events around the globe.</p>
    <p><a href="http://www.type-together.com/contact.php">Contact us to receive information about hosting the exhibition</a><br>
    <a href="http://www.type-together.com/exhibit_news.php">See some images of the exhibition</a></p>
    <p><strong>TYPE IN USE: Athelas</strong><br>
    The Society of Argentinian Bibliophiles selected Athelas for the edition of a selection of works by Pastor Obligado: ’Tradiciones Argentinas’. The 70 copies of this limited edition were printed in letterpress and they show Athelas in use in a luxury book environment, with careful typesetting and printed over a fine handmade paper.</p>
    <p><a href="http://www.type-together.com/typeinuse.php">See the pictures</a></p>
    <p><strong>EDUCATION: Workshops on type design</strong><br>
    Veronika Burian and José Scaglione presented their new workshop on type design in Colombia and Argentina. The workshop is designed to quickly introduce attendees to the problems and particularities of typeface design. Concepts as graphic coherence and ductus are tackled in a very practical way that allows students to acquire basic skills of type sketching in just a few hours.</p>
    <p>The Workshop currently exists in two formats. In the 1-day workshop attendees work only with tracing paper and different sketching techniques while in the 2-day workshop they also incorporate computer tools for digitization.</p>
    <p><a href="http://www.type-together.com/workshop_news.php">Click here to see images of the workshops</a><br>
    <a href="http://www.type-together.com/contact.php">Click here to learn more about hosting a workshop in your company or school</a></p>
    <p><strong>NEW RELEASE: Crete italic</strong><br>
    Crete has two new family members, Thin and Thick Italic, two very useful additions. They are true italics, with alternate letterforms, and therefore have, in some cases, different letter widths than the romans. However, they sit comfortably next to the uprights and are metrically interchangeable within themselves.</p>
    <p><a href="http://www.type-together.com/ampl_font.php?idpuente=9">Click here to see more of Crete Italic</a></p>
    <p><strong>CALL FOR SUBMISSIONS: “Type in use”</strong><br>
    We’d love to see samples of your work that use our typefaces. Please feel free to post us your work by email to info(at)type-together.com. Also, include appropiate credits and contact details for publishing.</p>
