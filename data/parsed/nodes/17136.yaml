  html: |-
    <p>Dear forum members,</p>
    <p>besides <a href="https://web.archive.org/web/20150123232735/http://typophile.com/node/15535" rel="nofollow">Terra Nova</a>, I have started another Typeface out of an urge to do "something different".</p>
    <p>After doing some pencil-drawings of some letters, I started working on "Sofa – a cosy typeface". It is kind of a humanist egyptienne with no (or almost no) sharp edges, slightly curved outlines, and flowing, handwritten flavour in the basic shapes.</p>
    <p>Sofa won't be a "monster" like Terra Nova, I don't plan to do that much opentype-scripting, alternate forms, ligatures etc. as I've done so far there. At the moment, there is a basic character set with Upper- and Lowercase, numerals and some punctuation. Also, some basic spacing is done to test the font in text-sizes.</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123232735im_/http://typophile.com/files/sofa_40_logo_4797.png"></div><p></p>
    <p>Do you have any suggestions or objections on the general concept, or (if you like it) on single glyphs?</p>
    <p>Thanks a lot for your feedback and your help, I hope I can give some knowhow back later (after a lot more years of learning...)</p>
    <p>Sebastian</p>
    <p><strong>More members of this family</strong><br>
    <a href="https://web.archive.org/web/20150123232735/http://typophile.com/node/18463" rel="nofollow">Sofa italic</a><br>
    <a href="https://web.archive.org/web/20150123232735/http://typophile.com/node/18464" rel="nofollow">Sofa sans</a></p>
