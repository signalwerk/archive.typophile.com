      <p>So version 40 is up (see first post).</p>
      <p>There are lots of changes suggested by crossgrove, though not all yet.</p>
      <p>I ...</p>
      <ul>
      <li>seriously redesigned the uppercase (serifs, proportions, stroke weight, details)
      </li><li>made some changes to the lowercase (stroke weight, serif angles, details)
      </li><li>tried some changes for the figures (I'm not very satisfied with them yet)</li></ul>
      <p>Concerning ligatures: The using in small sizes in the sample sheet actually is "wrong" (respectively only for testing the spacing of them). I am aware that they should only be used (with deliberation) for display purposes.</p>
      <p>Concerning loose spacing: The sample is not tracked, the setting is that loose at the moment, which might be a relict of even longer serifes. I'm considering to tighten it a bit, though I'm not sure to which extent: in Europe, typographers tend to prefer a bit looser spacing than in America, if my perception is right. I am influenced by that obviously, but anyway, spacing is too loose at the moment.</p>
      <p>Concerning program of a font: I am aware of, that one has to leave the path of strict guidelines when giving a design perfection. But as a beginner, this can be dangerous: I'm afraid of getting stuck in small optical changes and lose track of things. This is why I tried to avoid as much of "irrational" tweaks as possible until now, but I know that this keeps me from finishing it. I have to grope my way piece by piece now :)</p>
      <p>Thanks for your encouraging and detailed comments. Without this feedback I'd be stuck in this state of work...</p>
      <p>Oscar: thanks for your comment, this tells me that I'm not doing this all just to file the whole thing in the end...</p>
      <p>I specially like the ornamental/floral works on your homepage (that doesn't mean that I don't like the rest...)</p>
      <p>Greetings from Austria<br>
      Sebastian</p>
