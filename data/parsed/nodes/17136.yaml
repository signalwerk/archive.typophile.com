      <p>Hi Sebastian,</p>
      <p>Sorry to take so long to make comments. I have to budget the time I give for online critiques; your fine craftsmanship and thoroughness tell me you intend to develop this fully. Very nice specimen texts as well. </p>
      <p>I still see some big kinks in the basic set; with a design like this whose modelling is so subtle, these stand out and snag the eye:</p>
      <p>* Center crossbars on EF too short. Serifs in these letters do tend to clash or close up, but see Dante for an example of a successful application of long serifs in these shapes.<br>
      * Joint of diagonals of K with vertical very dark and crowded, makes letter look narrow. Rearrange where these strokes meet.<br>
      * Some serifs are still much too long; see AVWY and tails of K and R. Conversely, the serifs on C, E, L, T and Z are unnecessarily short.<br>
      * The obvious humanist proportions of the lowercase call for corresponding variation in width proportions in the uppercase. Homogenizing the UC widths creates a deadening feel which doesn't fit the lowercase. See E, F, T (wide) and K, M (narrow). A will look better if the outside serifs are shortened.<br>
      * Do the R and K need to have a drooping, bowed leg? Elsewhere in the design, stems seem rigid (in a pleasing way) and these sagging elements seem like they were left out in the sun. Consider reversing the bow, for more pleasing tension.<br>
      * The nice tapered serifs and the tapered stems imply a range of contrast that the general stroke weights don't deliver except in a few letters: d, e, h, r, z. Consider bringing the contrast modeling, with the color benefits it brings, to the rest of the letters. Especially caps like B, D, E, F, G, M, N, O, R, S, W will benefit from some lightening in appropriate spots. Also a, g, k, w and z will improve with some adjustment in contrast. A striking example is how monoline W and S look compared to d and n. Look at S and T together.<br>
      * Why does the y have such an emphatic tail? The bend at the end of the stroke is already eye-catching; adding a serif at an abrupt angle makes it inescapable. The angle and density of the serifs on s and S also act as snags to the reader's eye. Consider at least changing the angle of these.<br>
      * Apply the corner-lightening trick more in letters like m, n, u, r. the odd horizontal serifs on those letters add weight at the x-height that is continued in their monoline arches and other serifs like those of vwy. LC a would really improve with some thinning of joints.<br>
      * The i-t ligature should be removed: When I read your sample text, it appears exactly to my eye as an f-i ligature. Consider removing other ligatures which distort the components beyond readable recognition: cr, cl, sl. Also consider eliminating ligatures that aren't necessary; is reading enhanced by an sk ligature? It isn't strictly an improvement.<br>
      * The oldstyle figures look preliminary. Contrast, proportions, shapes, and especially the 4 look thrown together. I realize you've put a lot of attention on the 4, but it doesn't even appear to be from the same font. Not because of the unconventional shape, but because it's still so monoline, and appears to be leaning and bent. Balance is what it needs. 5 also looks like a transplant from a grotesque sans. Look at other typefaces to get ideas about where to apply weight in the shapes of 2, 5, and 7.<br>
      * The weight issue of g can be solved with *redistribution* of weight, rather than simply making it lighter overall. This shape, because of its complexity, needs this kind of modeling anyway, especially in a Slab or Sans design where horizontal stems pile up and make a letter dark. You see this in a, e, g, s, and B. </p>
      <p>The spacing in the text samples is very loose, especially considering the narrow space character. Is that text tracked? I think the letters need closer fitting overall. Put two m's together to see what I mean.</p>
      <p>Many of my comments seem to ignore the "program" or "logic" of this design. If there is any rule I think worth following in type design, it is: Rules of logic fall apart more and more as a typeface is realized, and the result should only appear to the untrained observer as if serifs are actually the same, stems are identical, etc. In this design, I see that the sharp serif angle and low contrast are apparent themes. However, where they impede smooth reading or distract the eye, they are only mannerisms. </p>
      <p>Other than these comments, I see the potential for this design to be very useful in many settings. It does convey the comfortable quality you intend. Eliminate the few scratchy, lumpy elements, and it will be a chaise worthy of weekly afternoon naps for years to come....</p>
