    html: |-
      <p>Thanks a lot for your help and your nice words, hrant and paul.</p>
      <p>There is a new version attached, with some changes made from your feedback. I think I can also revise some of the uppercase with hrant's comments. Partially, this is already done as well (F, P – but not too consistent yet).<br>
      In the meantime, I also have done some more glyphs and diacritics, which are included in v08 as well.</p>
      <p>Today I did the first printout on a 600dpi laser-printer (bad quality, but best I can get at the moment...), and the results in small text-sizes are surprisingly well already. The spacing is still done with indd cs2 optical spacing, but if I can get this done with metrics, I would be quite content already.</p>
      <p>I also did merge the paths in this version (thanks for that – Terra Nova would have been much more easy knowing that... but I learn :).<br>
      The only things still overlapping are about 10 composited glyphs like oslash, were I can't merge without decompose them.</p>
      <p>What do you think is the best method to go on? Get near perfection with the basic glyphs first, or start things like smallcaps or lowercase figures already?</p>
      <p>And maybe I should do three-quarter figures instead of lowercase and lining figures in this face... I don't know yet.</p>
      <p>On the naming: Maybe I will call it ... Sauna ... for changing it again because of legal issues ;-)  Thanks for the tip, I did not know that.</p>
      <p>sebilar</p>
