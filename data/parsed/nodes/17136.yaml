      <p>Sebastian, I'm glad my comments were useful to you. Sometimes a design gets stuck in a dead end and it's hard to back it out without a fresh look. </p>
      <p>"should only be used (with deliberation) for display purposes"</p>
      <p>I hope you are ready for all the horrible things people will do with your font that they shouldn't.... Stretching, condensing, skewing, outlining, tracking, hitting the "punk" filter in Illustrator.... and of course turning on all ligatures and setting a book.  ;)</p>
      <p>I see the improvements you've made. It's stronger already. Caps look much more settled. Your work is very subtle and decisive. The spacing, I think, is still too loose for general use, even if the trend is toward loose spacing. This design is somewhat unique in that the serifs are not all equal to stem weights, and there's a lot of proportionality to the design, so spacing will be very tricky. When that's done thoughtfully, I'm sure you'll like it better. If your monitor is big enough, I suggest viewing spacing at 2 very different sizes, such as 16 point and 80 point. Some spacing decisions look right at one size that simply are bad at another. I'm sure you noticed that already. </p>
      <p>I like it!</p>
