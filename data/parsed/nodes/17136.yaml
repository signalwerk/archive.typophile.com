      - "sz": still cluttered... don't know how to solve that yet.<br>
      - "thorn": is it correct to have it the height of ascender?<br>
      - fi- and fl-lig: In old versions i tried to keep the metrics of "f" and "i", and "f" and "l". Now they are narrower.</p>
