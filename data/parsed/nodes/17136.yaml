      <p>:-)</p>
      <p>Hrant calls everyone out.</p>
      <p>Here are a few comments on the lc:</p>
      <p>Serifs: They are all the same length. This is giving you spacing problems and balance problems. Spacing: wvy etc and Balance: rf.</p>
      <p>r: too wide. What about a beak like to be consistent.<br>
      t: narrow. I might try the bottom less hooked.<br>
      bdqp: you'll probably need to thin the bowls slightly where they join, like you have on the n<br>
      s: the terminals make this very closed. May need to thin the top and bottom so it doesn't get too dark.<br>
      lining numerals: have weight/modulation problems see the 5. 1 is narrow :-) 4. I'm not liking the serif on the end of the arm. It makes an already awkwardly spaced glyph even more so. It's also narrow.</p>
      <p>Consider Ben Keil's smart generate font robofab script. It creates a duplicate vbf, removes the overlaps, generates the fonts, and deletes the vbf in seconds. Very handy for testing.</p>
      <p><a href="https://web.archive.org/web/20150123232735/http://benkiel.com/typeDesign/" title="http://benkiel.com/typeDesign/">http://benkiel.com/typeDesign/</a></p>
      <p>Randy</p>
