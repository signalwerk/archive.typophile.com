      <p>I just came here, looking for some old details i was asking then ... </p>
      <p>I was working on Canapé heavily the last half year again, and I have production ready Roman and Bold Serifs, and I'm heavily working on getting the italics there too, looking for family inconsistencies, bugs, etc., especially in metrics and kerning.<br>
      The bugs are getting rather rare now and things keep looking good whatever text i throw at that family ... can't promise a realease date yet (I'm building a home sideways), but the next font that comes out from me is Canapé Serif in a 4-members family or one more member (a ultra bold).<br>
      December 2012 is a very optimistic perspective, Feburary 2013 is more realistic. It will be available on <a href="http://www.fonts.info" title="www.fonts.info">www.fonts.info</a> and myfonts.com. I'll make some noise right here too of course ...</p>
      <p>On the name: There is a "Sofa" typeface out there, so i moved to Canapé. I still like the name, i guess i'll stay with it.</p>
