      <p>Concerning Opentype SMCP and C2SC features:</p>
      <p>I have special small caps figures, currency units and some other symbols in the font.</p>
      <p>Which version is better?<br>
      — SMCP only changes lower case letters, C2SC changes upper case, figures, symbols<br>
      — SMCP changes lowercase, figures, symbols, C2SC finally changes upper case as well</p>
      <p>At the moment I have implemented the second variant.</p>
