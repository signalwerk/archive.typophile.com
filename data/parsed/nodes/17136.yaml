      <p>&gt; Sometimes a design gets stuck in a dead end and it’s hard to back it out without a fresh look.</p>
      <p>A few months ago I couldn't believe how some typedesigners could work on several fonts the same time. Now I know why :). That's why I'm working on a new one (working title "dark chocolate", sketch-stadium). A very early version can be seen in typebattle#12, and a newer one, if chosen, in typecon exhibition. It's a pity that it is the least-thought-about one I have to offer...<br>
      And I'm even thinking about getting Terra Nova back on track. When looking at that one now, I see about 200.000 improvements to be made :)</p>
      <p>&gt; I hope you are ready for all the horrible things people will do with your font that they shouldn’t…</p>
      <p>At the moment, I'm arguing with a friend of mine (a graphics designer), because he wanted a bold version of Sofa/Canapé, and used an outline to achieve that, even without asking me to redraw the four glyphs he actually needed... It will be shown about 4*3m in size – Beautiful! :(</p>
      <p>&gt; spacing</p>
      <p>I'm so shy about that because I'm afraid that it will destroy the kerning time already invested. But that's my fault, if doing such things before having the letter shapes settled down... Just need some overcoming to get it started.</p>
      <p>What I've learned is that typedesign is suffering, especially as a beginner :). And what is needed, but understandably rare, is feedback from people who really "know". Amsterdam, Reading and other schools are far from here, and the decision to go there is not easy, so I'm dependant on friendly people who like to help.</p>
      <p>Sebastian</p>
