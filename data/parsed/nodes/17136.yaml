    html: |-
      <p>very solid, IMO. just a few things</p>
      <p>Roman: the bar on the eth seems a bit wimpy; i'm not sure what the h+macron is, but i don't think it's an hbar; i think your join on the k makes the outside counter too large and the inner counters too small; the diacritic on the dcaron, tcaron and lcaron might be a bit too discrete, you might be able to make it a bit longer; i think the tail on the y is too strong for genetral text use in English where y's are actually quite frequent.</p>
      <p>Cyrillic: the De seems a bit too narrow (same with lowercase de), it looks more narrow than the El; the Pe seems very wide; the teeth on the De don't seem to be long enough, same with the tails on the Tse and Shcha (same for de, tse, shcha); the arms on Ka and Zhe seem a bit weak and i think they would work better with similar terminal treatments - these forms should correlate; The Zhe and zhe look much too narrow; the horizontal serif on the left foot of the El looks very strange, it would likely work better if it matched the kind of terminal that you put on the foot of the U (U looks similar to Y) same problem with the lower case el; the central bar of the Ef can overshoot the Cap and Baselines so that your counters can be larger; the tail on the Hard Sign might be able to be a bit larger; the be seems quite good to my eyes; the pe looks odd with the upper serifs missing as do tse, sha, shcha with missing lower serifs; the upper counter of the che seems a bit too large; The legs on Ya and ya seem week - same problem as with Ka and Zhe</p>
      <p>there you go, i hope that helps. gook luck!</p>
