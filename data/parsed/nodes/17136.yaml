      <p>Thank you Paul, especially for looking at the diacritics as well, they are often forgotten, and there are not many sources to rely on, as you could see with the "hbar" (I must somewhere have seen this h+macron form and thought it was correct).</p>
      <p>I have done the corrections you suggested, and I am especially more happy with the "k" now, and I have also changed the "y", which now should be less dominant.</p>
      <p>About the Cyrillic and Greek: As you can see, I just don't know what I am doing there, it's like flying a jumbo jet on sight instead of on instruments. I can have a look at other solutions, but I just don't know if they are good, and chances are high that I mix things up. I have done some corrections now, but I'm sure they are not good yet, especially the "Ka, Zhe, Ya" problem is still present, and of course many forms don't have the tension yet that I'd like to see. But first I have to become aware of the basics...<br>
      For the Greek, I have orientated widely on Adobes Garamond Premier, because I've heard that it has a fine greek alphabet, but of course it's something different to do a Garamond Greek than to do an almost monolinear slab serif Greek.</p>
