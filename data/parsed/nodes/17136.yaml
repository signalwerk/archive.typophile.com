      <p>So, 13 weeks later, here is the <a href="https://web.archive.org/web/20150123232735/http://typophile.com/files/sofa_v53_14.10.06.pdf" target="_blank" rel="nofollow">update</a> :)</p>
      <p>I've been working on Sofa Serif Roman to get it almost finished. To achieve this, I made some detours to a Black and Ultralight version and to the Roman Italic, to explore more about the general shape principles (and of course I proped heavily on Carls comments). This was very useful for me, it made me have a new look at the principles of the design, and I think I could improve the Roman based on that experience. (You can see Black and Ultralight them compared to the roman in the end of the PDF. They are not perfect yet and won't be until Roman is finished.)</p>
      <p>Then I returned to the Roman, and I won't stop for another typeface until it's finished. I did a lot of finetuning of proportions, stroke weight and details, and I think now I can say the basic character set is almost finished.<br>
      <strong>Please be critical and tell me about every minor error you still find!</strong> I think there are no major ones anymore, but I'm willing to negotiate ;-)</p>
      <p>I've completely re-done the metrics. Spacing is finished, kerning is in finetuning and correction phase, and yes Carl, of course you were right: there is less to do now than in my first attempt.</p>
      <p>What is still to be done:<br>
      - redesign ligatures, swashes, etc.<br>
      - check whether smallcaps are too thin (I have the misgiving they are...)<br>
      - Kerning of Uppercase&lt;--&gt;Smallcaps<br>
      - finetuning of some figures<br>
      - have a look at the opentype classes and coding whether it's still appropriate and complete<br>
      - rearrange diacritics</p>
      <p>So if you have the time and willing, please concentrate your comments on basic character set <strong>(A-Z, Asmall-Zsmall, a-z, 0-9 and basic ASCII characters)</strong>.<br>
      Of course, everything else is apprecialted as well, but know that I'm still working on them, so comments too much into detail may be overtaken by my own corrections anyway... But don't feel hesitated to comment conceptional things or major mistakes. For example, I don't know much about diacritics, It's mainly looking at solutions others have done, but's I can't say "now everything is correct".</p>
      <p>Thanks for your help<br>
      Sebastian</p>
