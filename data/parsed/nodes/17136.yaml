      <p>now i can see to critique!<br>
      a few things:<br>
      B seems a tad wide<br>
      C looks like it had a bit of an overbite (as does the G)<br>
      F seems too wide<br>
      J tail looks too heavy<br>
      K top bar is too long, bottom bar too stiff<br>
      L a bit wide<br>
      M looks a bit wonky over all would look better if the midpoint came to the baseline<br>
      P the bowl could be a bit larger<br>
      Q the tail could be stronger<br>
      R the bowl could be larger and the leg is too stiff</p>
      <p>b could do without the tail<br>
      g the join could be smoother<br>
      j tail seems too heavy<br>
      k the arms are too angular<br>
      q could use a quiter ear<br>
      r i'll let hrant address<br>
      y the tail feels out of joint<br>
      fi and fl ligs seem too wide</p>
      <p>2 looks like it's leaning right<br>
      4 could do without the serif on the horizontal<br>
      5 has an underbite<br>
      7 too wide/leaning right</p>
      <p>currency symbols: i'd try to harmonize these. i would work towards forms that fit within the same character width, making Euro and yen narrower.</p>
      <p>I like the diacritics, the bar on the Lslash could extend further into the character</p>
