      <p>sebilar, to merge paths:<br>
      select all the characters you want your change to effect<br>
      go to contour&gt;transform&gt;merge countours</p>
      <p>i suggest before doing this you put a copy of your characters in the mask layer. you can do this by going to<br>
      Tools&gt;Mask&gt;Copy outline to mask</p>
      <p>there are also keyboard shortcuts for these actions that are quite helpful. these will show up to the right of the command in the drop down menus.</p>
      <p>i hope this helps!</p>
      <p>btw, very nice work! it looks lovely.</p>
