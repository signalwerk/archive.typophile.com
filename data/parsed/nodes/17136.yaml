    html: <p>Hrant, I think you may have misinterpreted the sample on page 3, which shows five os numerals and five lining numerals. Both sets are on the last page. I must admit, though, that the way you saw it does have some intriguing potential. A numeric progression from small to descenders to ascenders would mean that you would get a vague idea of how big a number is with only a glance. That alone wouldn't necessarily be worth flaunting convention, though.</p>
