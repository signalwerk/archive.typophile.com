      <p>I wonder why nobody's reacted to this - it's quite nice I think.</p>
      <p>First of all: those white overlaps are distracting.<br>
      Please make a normal version.</p>
      <p>I'd pull in the descenders.</p>
      <p>Just the lc for now:<br>
      "b": Really really nice.<br>
      "f": Extend the right side of the foot serif.<br>
      "g": Quite nice. The head-bottom gap could be wider, and the ear longer.<br>
      "k": Bring the lower leg forward (partly to relieve the weight in the join).<br>
      "r": Same as "f".<br>
      "s": Slightly dark.<br>
      "t": Extend rightward.<br>
      "u": Make top serifs leftward only. When you do, make the whole narrower.<br>
      eszet: Clotting at the bottom.<br>
      long-s: Same as "f".</p>
      <p>One last thing: Underware's Sauna (I think) was<br>
      initially called Sofa - and I remember they had<br>
      to change the name for legal reasons. You might<br>
      have to do the same maybe. Just don't change it<br>
      to Sauna though.  ;-)</p>
      <p>hhp</p>
