      <p>Oh. Sorry.  :-/</p>
      <p>&gt; you would get a vague idea of how big a number is</p>
      <p>Hadn't thought of that! Sort of how the visual density of<br>
      a glyph in Hangul indicates its grammatical function,<br>
      providing an extra layer of information for the reader.</p>
      <p>&gt; That alone wouldn’t necessarily be worth flaunting convention, though.</p>
      <p>I dunno. The conventional scheme is not only partly arbitrary, but it has problems too, most of all that the overall height position is too low compared to the lc. The old French OS scheme -with 3 and 5 ascending- is better in my view, and readers don't consciously notice the difference, so it probably has a "subvisible" functional advantage. In addition, one could argue for an acending 2 as well.</p>
      <p>See also:<br>
      <a href="https://web.archive.org/web/20150123232735/http://typophile.com/node/15443" title="http://typophile.com/node/15443">http://typophile.com/node/15443</a> _<br>
