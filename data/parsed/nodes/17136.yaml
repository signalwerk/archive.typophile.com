    html: |-
      <p>Thanks for your detailed feedback, and thanks for putting this on the startpage, I'm feeling honoured :)</p>
      <p>There is a new version V10 attached, with detail correction based on your comments.</p>
      <p>uppercase:</p>
      <p>- narrower "B"<br>
      - "C" and "G" overbite corrected<br>
      - more even "D"<br>
      - narrower "F"<br>
      - Tail of "J" thinner<br>
      - corrected "K" (not sure about that yet, as well as with the "R")<br>
      - narrower "L"<br>
      - down-to-bottom and wider "M"<br>
      - bigger bowl of "P"<br>
      - new tail on the "Q"<br>
      - minor changes to "S"<br>
      - narrower "T"<br>
      - wider "U"<br>
      - what do you think about the "W"? should it be analogous to "M"?<br>
      - bigger head of "Y"<br>
      - bigger "Thorn"</p>
      <p>lowercase:</p>
      <p>- "a": I did not quite understand what you meant that, hrant. Tried something...<br>
      - alternate form for "b" without tail (not sure which to use, i like both of them)<br>
      - what do you think about the alternate form of the "e"? It's the older one, and i like the new one with the "edge", but I'm not sure.<br>
      - alternate form for the "g" (smoother loop, but not perfect yet).<br>
      - thinner tail of "j"<br>
      - small changes to "k"<br>
      - alternate form for "q" (like with "b")<br>
      - shorter right part of the "r" (not short enough yet?)<br>
      - "s" lighter<br>
      - "y": not sure what you meant, hrant and paul. Tried some things again...<br>
      - "sz": still cluttered... don't know how to solve that yet.<br>
      - "thorn": is it correct to have it the height of ascender?<br>
      - fi- and fl-lig: In old versions i tried to keep the metrics of "f" and "i", and "f" and "l". Now they are narrower.</p>
      <p>figures:</p>
      <p>- better "2"<br>
      - no changes on "4" yet, but I think you ar right with the horzontal bar<br>
      - "5" no underbite anymore, but maybe too much?<br>
      - "7" more upwards now</p>
      <p>You are right, hrant, I will provide hybrid-figures as alternates.</p>
      <p>others:</p>
      <p>- "asciitilde" too small<br>
      - no changes on currency symbols yet, but you are right paul, they should be equal width<br>
      - "Lslash": longer bar</p>
      <p>Thanks a lot for your feedback, without it, this would take much more time and trial and error. Towards most of the things you said, my reaction was "This is quite obvious, why didn't I see this?". typophile is great :)</p>
      <p>sebilar</p>
