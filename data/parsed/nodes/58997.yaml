    <p>Hi everyone,</p>
    <p>I am writing an experimental chat application, focused on a clean user interface. It draws several ideas from various sources, but is mostly inspired by the <a href="http://ccxvii.net/gargoyle/" rel="nofollow">Gargoyle</a> Interactive Fiction player:</p>
    <p><cite>Gargoyle cares about typography! In this computer age of typographical poverty, where horrible fonts, dazzling colors, and inadequate white space is God, Gargoyle dares to rebel!</cite></p>
    <p>Although I like Gargoyle's default font, Bitstream Charter, I found its Unicode coverage severely lacking (even in the commercial Pro version). For instance, it does not support cyrillics, or some eastern-european characters such as ş/ţ.</p>
    <p>Here is what I have so far:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/0000038A_6330.png"></div><br>
    (also note how the base of the "fi" ligature is blurred)<p></p>
    <p>Thus, I ask: which font could I use with better Unicode coverage that isn't too different from Charter, or perhaps better befitting my application in your opinion?</p>
    <p>Edit: never mind, I just used Georgia...</p>
