    <p>Although I like Gargoyle's default font, Bitstream Charter, I found its Unicode coverage severely lacking (even in the commercial Pro version). For instance, it does not support cyrillics, or some eastern-european characters such as ş/ţ.</p>
    <p>Here is what I have so far:<br>
