    date_raw: 4 Jan 2010 — 9:46am
    votes: null
    html: |-
      <p>This is quite nice! The overall polish is very good, and the display cut is original but understated. However the text cut is of course way too light for [much] text. If you're not going to have darker weights I would suggest changing the naming and targeting the system for intermixed usage - that would allow for some very cool "emphasis" via the [current] display cut in a body of the [current] text, or vice versa! Of course in that case every glyph in the display cut would need some swell.</p>
      <p>Looking at the "text" cut:</p>
      <p>Both "g"s have problems. The binocular one is quite unhappy; maybe make the bottom bowl larger and more to the right, simplify the join between the two bowls, and try making the ear a simple straight line. The monocular one just needs a less curly terminal I think.</p>
      <p>The tittles (dots on "i" and "j") are too big. Although that would work great in the display cut (where I'd make them even bigger).</p>
      <p>Numerals: 4 and 8 too narrow.</p>
      <p>Spacing: considering this will almost always be used large, the spacing I'd make quite a bit tighter. If you decide to keep this loose spacing, the wordspace needs to be bigger.</p>
      <p>hhp</p>
