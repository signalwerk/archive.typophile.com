  html: |-
    <p>I'm tentatively using Caecilia regular for a technical book project. I was setting text 10/12 on a 26p0 measure, but the face's large eye makes the page a tad too dark in my opinion. I'm now playing with 10/14, and was wondering if anyone else has used Caecilia for extended text who would care to share their experiences.</p>
    <p>Cheers,</p>
    <p>Erik</p>
