      <p>Yep, she's a big girl ;-)<br>
      I'm not the most experienced typographer in the room, but I'll say that to my eyes as well, Caecilia seems to be happier with quite a lot of leading. I've set it at 10/15 before, but that was at a measure of 26p8. Come to think of it, I wonder if 10pt on a 26p0 measure isn't a bit on the large side? It seems to accommodate just over 2 lc alphabets (abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabc).</p>
