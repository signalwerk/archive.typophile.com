      <p>The slight condensing I suggested is a way to use a slightly larger size and still have the same character/line count. And Caecilia being a very well designed typeface, it can withstand this practice. And 92% is the limit imho. Try it with some arithmatic (characters/line as a constant — stepping up the size in quarter points).</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
