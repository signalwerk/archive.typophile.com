      <p>Bigger leading and a tad of condensing (horizontal scaling to 92%) has worked for me.<br>
      I would go for 10,5 on 15 (maybe 14,5) and the mentioned 92 to 94%.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
