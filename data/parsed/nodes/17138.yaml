    html: |-
      <p>The fonts more likely to have inspired the Godfather title are <a href="http://woodentypefonts.com/Pages/rubens.html">Rubens</a> and <a href="http://www.myfonts.com/fonts/solotype/goodfellow/">Goodfellow</a>, imho.</p>
      <p>I can’t pin your exact sample, but it looks like lots of wood type from the late 19th century. The category is generically known as “latins”, and since your sample is in Italian, it’s possible that it’s even earlier, and may indeed have inspired the later British/American wood types cited above. On the other hand, it may also have been a later derivative. It’s not all that artful, again imho.</p>
