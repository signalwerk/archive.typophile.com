    <p>Hey guy's.</p>
    <p>I'm on the hunt for some scripts particularly ones that have good swash and alternate functions. I've had a gander around at the usual foundry's and found a couple, but not nearly as many as i expected. I was wondering wether there might be a foundry or designer that specializes or dedicates to this style of typography?</p>
    <p>I've attached something from my travels that interest's me and is kinda what i'm after from MYFONTS.COM (Mon Amour Script Pro) but would be nice to find something not so commercial or exposed shall we say.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/24200_3754.png"></div><p></p>
    <p>Any help from you wonderful people would be muchly appreciated as always.</p>
    <p>With Kind Regards<br>
    Luey</p>
