    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Script</strong></p>
    <p><a name="def1" rel="nofollow"></a>1) Script. A form or <a href="/wiki/handwriting" class="freelinking" rel="nofollow">handwriting</a>, often <a href="/wiki/cursive" class="freelinking" rel="nofollow">cursive</a> in nature. The word script, when used in this meaning, readily brings to mind the fancy, flowery <a href="/wiki/Spencerian%20Scripts" class="freelinking" rel="nofollow">Spencerian Scripts</a> which were adapted for typesetting at a fairly early date. However, there are other types of scripts ranging from the <a href="/wiki/formal" class="freelinking" rel="nofollow">formal script</a> to the <a href="/wiki/informal%20script" class="freelinking" rel="nofollow">informal</a>, as well as many other <a href="/wiki/handlettering" class="freelinking" rel="nofollow">handlettering</a> styles.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/32859" rel="nofollow">Greek Scripts</a></p>
    <p><a name="def2" rel="nofollow"></a>2) Script. A specific <a href="/wiki/writing%20systems" class="freelinking" rel="nofollow">writing system</a>, such as <a href="/wiki/Latin" class="freelinking" rel="nofollow">Latin</a>, <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a>, <a href="/wiki/Arabic" class="freelinking" rel="nofollow">Arabic</a>, <a href="/wiki/Devanagari" class="freelinking" rel="nofollow">Devanagari</a>, &amp;c. The <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> font format uses <a href="/wiki/script%20tag" class="freelinking" rel="nofollow">script tags</a> to identify which languages can be typeset using a particular font.</p>
    <p><strong>See also:</strong> <a href="/wiki/Script%20Tag" class="freelinking" rel="nofollow">Script Tag</a>.</p>
    <p><a name="def3" rel="nofollow"></a>3) Script. A bit of computer programing. <a href="/wiki/Python" class="freelinking" rel="nofollow">Python</a> scripting knowledge is an advantageous skill for today's type designer. Several altruistic designers are willing to share their knowledge by sharing <a href="/wiki/python%20scripts" class="freelinking" rel="nofollow">python scripts</a> that they have written as well as helping others to learn to write their own scripts.</p>
