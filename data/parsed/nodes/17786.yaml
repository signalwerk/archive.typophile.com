    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Script</strong></p>
    <p><a name="def1" id="def1"></a>1) Script. A form or <a href="/node/19525" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Handwriting</a>, often <a href="/node/39906" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cursive</a> in nature. The word script, when used in this meaning, readily brings to mind the fancy, flowery <a href="/node/add/wiki?edit%5Btitle%5D=Spencerian%20Scripts" title="Create node &quot;Spencerian Scripts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Spencerian Scripts</a> which were adapted for typesetting at a fairly early date. However, there are other types of scripts ranging from the <a href="/node/add/wiki?edit%5Btitle%5D=formal" title="Create node &quot;formal&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">formal script</a> to the <a href="/node/add/wiki?edit%5Btitle%5D=informal%20script" title="Create node &quot;informal script&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">informal</a>, as well as many other <a href="/node/add/wiki?edit%5Btitle%5D=handlettering" title="Create node &quot;handlettering&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">handlettering</a> styles.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/32859">Greek&nbsp;Scripts</a></p>
    <p><a name="def2" id="def2"></a>2) Script. A specific <a href="/node/12260" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">writing system</a>, such as <a href="/node/14508" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Latin</a>, <a href="/node/14164" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic</a>, <a href="/node/38857" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Arabic</a>, <a href="/node/70807" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Devanagari</a>, &amp;c. The <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> font format uses <a href="/node/17787" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">script tags</a> to identify which languages can be typeset using a particular&nbsp;font.</p>
    <p><strong>See also:</strong> <a href="/node/17787" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">script tag</a>.</p>
    <p><a name="def3" id="def3"></a>3) Script. A bit of computer programing. <a href="/node/13582" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Python</a> scripting knowledge is an advantageous skill for today’s type designer. Several altruistic designers are willing to share their knowledge by sharing <a href="/node/34509" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Python Scripts</a> that they have written as well as helping others to learn to write their own&nbsp;scripts.</p>
