    html: <p>It's more important that the font work, not sit pretty and keep exclaiming "Hey, look at me, I'm from the exact same time and place as the guy this book is about! How 'bout that huh, huh!!" <br> <br>I agree with this, and more... <br>Remember that your book is also going to be something worthwhile in itself, and its from the 21st century. Now its as valid to argue that you should use a font from your own century as it is to argue that you should use a font from Machiavelli's  <br>That way, in 300 hundred years time, people can look at your book, and say 'hey, this is how they used to make books about the 15th century, way back in the 21st century - how cool is that!' <br> <br>BTW I'm not saying that I think that you MUST use a new font, just that its not necessarily the case that not using a 15th century Florentine font is in some way not doing it right.</p>
