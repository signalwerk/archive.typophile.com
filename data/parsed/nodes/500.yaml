    date_raw: 1 Jul 2003 — 2:46pm
    votes: null
    html: <p>I think Jenson is the dream typeface for this project - don't reject it because it is so logical to use it!. <br> <br>Jenson doesn't just happen to be of the period. The original breathes of that same confidence and disipline and panache as the renaissance thinkers, including Machiavelli. It is not just a question of using something of the same period. It is another example of renaissance brilliance, matched to Machiavelli himself. <br> <br>Now which Jenson best suits your project is a more difficult question. None of course capture exactly the spirit of the original. Actually the italic of Abobe Jenson might work as James suggests. And the Open type does have both the archic long 's' roman (that looks like and 'f') and italic (like the integral sign). <br> <br>I would also look at Hightower and Italian Oldstyle at least. </p>
    html_clean: <p>I think Jenson is the dream typeface for this project - don't reject it because it is so logical to use it!. <br> <br>Jenson doesn't just happen to be of the period. The original breathes of that same confidence and disipline and panache as the renaissance thinkers, including Machiavelli. It is not just a question of using something of the same period. It is another example of renaissance brilliance, matched to Machiavelli himself. <br> <br>Now which Jenson best suits your project is a more difficult question. None of course capture exactly the spirit of the original. Actually the italic of Abobe Jenson might work as James suggests. And the Open type does have both the archic long 's' roman (that looks like and 'f') and italic (like the integral sign). <br> <br>I would also look at Hightower and Italian Oldstyle at least. </p>
