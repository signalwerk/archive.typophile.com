    html: <p>I won't bother to weigh in on the discussion about  <br>whether to use an obvious 1500 typeface or not. But  <br>if you do decide to go that route, and especially if you  <br>want something with that rough faux-letterpress look,  <br>then you should really consider Monotype <a href="http://www.myfonts.com/fonts/agfa/poliphilus/mt-regular/testdrive.html?s=Machiavelli&amp;p=72" target="_blank">Poliphilus</a>,  <br>since that's what it was designed for. <br> <br>Poliphilus was a metal interpretation of the third roman  <br>made for Aldus by Griffo and used in <i>Hypnerotomachia  <br>Poliphili,</i> printed in Venice in 1499. You can't get much  <br>more historically allusive than that. Monotype recreated  <br>the Poliphilus in 1923, with all its bumps and warts, for  <br>a facsimile publication of the <i>Hypnerotomachia.</i> <br> <br>I'm surprised no one mentioned it sooner. <br> <br>-- Kent. <br></p>
