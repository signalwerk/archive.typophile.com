    html: "<p>William, <br> <br>Thanks for the kind words. I'm one step ahead of you: I work at Harvard Business School Publishing, the upside of which is that I just bought Adobe Type Classics for $80. It <i>is</i> an amazing deal. <br> <br>It looks like my type decisions are going to work out as follows: <br>1) Handwritten script based on Machiavelli's handwriting for diary entries or letters. This is the treatment that I used in the prologue, when Machiavelli descibes the Pazzi conspiracy in a manuscript. <br>2) Adobe Jenson italic for excerpts from published works and captions that are not written by Machiavelli <br>3) A handwritten Jenson Italic for dialogue. I've chosen this approach because of the inappropriateness of traditional comic fonts for this project, and the fact that it will make for easier reading than a script. <br> <br>As for the market, there is a small market for art/alternative comics: books like Maus, Jimmy Corrigan, From Hell, Safe Area Gorazde. This book is unlike those in execution, but similar in aims: to use comics as a medium to tell a complex story with a desire to be artistically innovative as well. (I hope that didn't sound too pretentious: basically, there are a number of people out there who believe in comics' potential as an art form that is capable of more than adolescent power fantasies.) <br> <br>But it's not a great way to get rich. :-)</p>"
    html_clean: "<p>William, <br> <br>Thanks for the kind words. I'm one step ahead of you: I work at Harvard Business School Publishing, the upside of which is that I just bought Adobe Type Classics for $80. It <i>is</i> an amazing deal. <br> <br>It looks like my type decisions are going to work out as follows: <br>1) Handwritten script based on Machiavelli's handwriting for diary entries or letters. This is the treatment that I used in the prologue, when Machiavelli descibes the Pazzi conspiracy in a manuscript. <br>2) Adobe Jenson italic for excerpts from published works and captions that are not written by Machiavelli <br>3) A handwritten Jenson Italic for dialogue. I've chosen this approach because of the inappropriateness of traditional comic fonts for this project, and the fact that it will make for easier reading than a script. <br> <br>As for the market, there is a small market for art/alternative comics: books like Maus, Jimmy Corrigan, From Hell, Safe Area Gorazde. This book is unlike those in execution, but similar in aims: to use comics as a medium to tell a complex story with a desire to be artistically innovative as well. (I hope that didn't sound too pretentious: basically, there are a number of people out there who believe in comics' potential as an art form that is capable of more than adolescent power fantasies.) <br> <br>But it's not a great way to get rich. :-)</p>"
