    date: 2003-07-02T08:59:00
    date_raw: 2 Jul 2003 — 8:59am
    votes: null
    html: <p>You can reach dfTYPE (Rialto) here <br> <br><a href="http://www.druckschriften.de/Druckschriften2/Typo-Top-100/Schriften/df-type/df-type.html" target="_blank">http://www.druckschriften.de/Druckschriften2/Typo-Top-100/Schriften/df-type/df-type.html</a>  <br> <br> <br>Since I was involved in the typographic consulting on The Aldine Press project here were the considerations. First, this is first and foremost a catalog of bibliographic descriptions. It is secondarily a book about Aldus. A typeface was needed, any typeface, that had a workable Greek, Latin, roman. By workable I mean we would need "on a discovery" basis, "every" G/L/r letterform that existed as incunabular (including those that no longer exist) as well as any G/L/r letterform that was currently of use in the twentieth century. Matthew was our only choice. Not only as a designer but as a knowledgable historian of type. At the time there was no italic for the Miller and that would have to be developed as well. "He" named the face Manutius in honor of the project and for no other reason. This particular configuration of the Miller/Wilson face no longer exists as it was developed solely for use in this project. <br> <br>I've found that bibliographic descriptions, dictionaries, etc, go a bit beyond their subject matter and are bibliographically considered a subject in themselves. They are certainly categorized that way in every library system that I know of.  <br> <br>RB, as I recall from an email he sent to me, was a bit more emotional about this than he now claims. He also felt my use of Miller for a faux nineteenth-century book about Gutenberg was wrong as obviously anything about Gutenberg should be set in a blackletter. His latching on to subject matter prevented him from seeing the structure that existed beyond the subject matter, a nineteenth century interpretation, a bibliographic description catalog. <br> <br>No incunabular or Renaissance form can adequately provide the legibility/readability needs that would be required in printed matter where such concerns are paramount. Early forms that existed before these historical concerns raised their ugly little heads are often inadequate. Every interpretation of these early forms runs into this problem.</p>
