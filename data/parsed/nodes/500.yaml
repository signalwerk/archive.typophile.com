    html: "<p>Thanks so much for all of the informative posts! <br> <br>I've got plenty of choices to mull over at this point, though I'm leaning in the direction of Adobe Jenson, perhaps in the style that James suggests. William's eloquence in praise of Jenson is also very persuasive. <br> <br>Steve, one thing about using a modern typeface: due to the unique nature of the medium, in which type is superimposed or woven into the images, it would look somewhat jarring (IMO) for a modern typeface to be juxtaposed with images of Renaissance Florence. The comics medium is what demands of me an approach to text which complements my approach to imagery.  <br> <br>I refuse to use the common \"comics\" fonts in this piece, as those emerged as the type of choice for children's adventure comics, and are more appropriate for that genre. (That style of writing in comics has become ubiquitous as the superhero genre became so dominant that few questioned treating text in comics any other way--but that's another hobby horse and perhaps not germane to this forum) <br> <br>If you're interested in what the hell I'm talking about, you can view the prologue to Machiavelli &lt;a href=\"<a href=\"http://www.donmacdonald.com/Machiavelli/machframe.html\" target=\"_blank\">http://www.donmacdonald.com/Machiavelli/machframe.html</a>\"&gt;here&lt;/a&gt;. I apologise in advance for the horrible calligraphy on page 2, which has descenders and ascenders crashing into one another. I was still stretching my legs...</p>"
