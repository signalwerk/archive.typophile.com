    html: <p>In all seriousness, I'd like to give the impression to my readers that I had done everything possible to make the book as good as I could. Even if few people notice something as arcane as the century a particular typeface was in use, some will. Others may notice the research put into clothing, history, and philosophy. In aggregate, I agree with Tiffany, I think, in that people will notice that it's accurate. <br>I have taken some liberties, especially with Machiavelli's handwriting, which I have made more legible while trying my best to remain faithful to his script.</p>
