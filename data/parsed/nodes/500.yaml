    html: <p>Naiditch doesn't design type - he's the Curator of Medieval &amp; Renaissance Manuscripts at UCLA Special Collections. He was the guy in charge of the project (along with Sue Kaplan). Lange does design type, but that wasn't his involvement in that project - he was the typographer. Along with Carter they arrived at the choice of Manutius because that's what their collective typographic expertise told them. They spent a small fortune on just the font. They didn't choose it because it came after Mandrill in their font menu. <br> <br>-- <br> <br>That said, I think for Don's project a old Italian face would probably be best. But it doesn't have to be from the 1500s in Florence - that's too restrictive. It's more important that the font <i>work</i>, not sit pretty and keep exclaiming "Hey, look at me, I'm from the exact same time and place as the guy this book is about! How 'bout that huh, huh!!" <br> <br>hhp <br></p>
    html_clean: <p>Naiditch doesn't design type - he's the Curator of Medieval &amp; Renaissance Manuscripts at UCLA Special Collections. He was the guy in charge of the project (along with Sue Kaplan). Lange does design type, but that wasn't his involvement in that project - he was the typographer. Along with Carter they arrived at the choice of Manutius because that's what their collective typographic expertise told them. They spent a small fortune on just the font. They didn't choose it because it came after Mandrill in their font menu. <br> <br>-- <br> <br>That said, I think for Don's project a old Italian face would probably be best. But it doesn't have to be from the 1500s in Florence - that's too restrictive. It's more important that the font <i>work</i>, not sit pretty and keep exclaiming "Hey, look at me, I'm from the exact same time and place as the guy this book is about! How 'bout that huh, huh!!" <br> <br>hhp <br></p>
