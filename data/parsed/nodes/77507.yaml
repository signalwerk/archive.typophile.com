  html: |-
    <p>Hi all,</p>
    <p>First of all, Merry Christmas to all of you who celebrate it on 25th.<br>
    We, orthodox, need to wait for it till January 7th, so I hope we're all find new ideas in 2011.</p>
    <p>This is another sans serif typeface I'm working on.<br>
    It have some roughen look and it gives a impression like it's something between square/techno/block and sans typefaces.</p>
    <p>What do you think?<br>
    Does it have some personality and flow?</p>
    <p>Ignore metrics.</p>
