    html: "<p>Although only \"simple\" on the surface, Evert Bloemsma's recent Legato font is quite possibly the most readable sans ever, especially at around 10 point. The really good news is that you can currently download the Semi weight of Legato for free from the FontShop site! <br> <br>&gt; is readibility affected by margins , line spacings and paragraph justifications? <br> <br>Margins and line spacing are mostly a matter of having enough of: too little and you'll cause too many errant fixations of the eyes (off the page in the case of the former, and to the wrong line upon a \"carriage return\" in the case of the latter). Justification however doesn't seem to make a big difference (although <i>hyphenation</i> is a totally different matter). <br> <br>hhp <br></p>"
