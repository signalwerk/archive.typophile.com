    <p>Hi, <br>  <br>I am looking for a nice simple sans serif font, which won't hurt the eye, if reading large amount of text at 10 points. <br> <br>Any suggestions? <br> <br>Also, is readibility affected by margins , line spacings and paragraph justifications? <br> <br>What is the optimal arrangement for maximizing legibility? <br> <br>Thanks in Advance, <br>Suddha Satta Ray <br></p>
