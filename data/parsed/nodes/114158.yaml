    <p>Hello,<br>
    my name is Krzysztof Stryjewski and I am graphic design student from Poland and I would like to tell you about my master's project - typeseeing.<br>
    Typeseeing is meant to be a guide, collecting voices and thoughts on local typography from different parts of the world. If I receive enough answers, this small anthology will be published and everyone whose text is included in the book will receive a copy. </p>
    <p>If you like project's idea and want to help me, please follow the video link below.<br>
    I would not only like to hear from you and see yours answers in this publication, but also would be very grateful for any support or sharing news about typeseeing in the world.</p>
    <p>I look forward to hearing from you soon.<br>
    Krzysztof Stryjewski / typeseeing.wordpress.com</p>
