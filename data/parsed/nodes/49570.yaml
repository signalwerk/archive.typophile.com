    <p>Facebuster is my latest plaything.  It's a super slab / block serif display face.</p>
    <p>It'll be on sale 20% off until the end of September exclusively at TypeTrust.com.</p>
    <p>View and buy it <a class="freelinking external" href="http://typetrust.com/font/facebuster" rel="nofollow">here: http://typetrust.com/font/facebuster</a></p>
    <p>And the <a class="freelinking external" href="http://typetrust.com/fonts/specimen_pdfs/TypeTrust-Facebuster.pdf" rel="nofollow">PDF is here</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Facebuster-Typophile_6565.gif"></div><p></p>
