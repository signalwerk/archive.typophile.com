  html: |-
    <p>In some fonts, especially fonts from over a decade ago, the macron diacritical glyph is really, really wide, sometimes almost twice the length of a tilde. Often the stroke seems too thin compared to the rest of the accents.</p>
    <p>Georgia is an example where the regular macron looks like a normal macron and the combining macron is long &amp; thin.</p>
    <p>What's the deal with skinny, wide macrons?</p>
    <p><img src="http://i.imgur.com/uYZye.jpg"></p>
