      <p>@John 0304</p>
      <p>My mistake: Georgia has a regular macron. I think I figured out the problem. Lots of early 90's fonts didn't contain macronized letters so there may have been less likely to require a properly designed macron. That might be why there's sometimes an overscore in the macron (02C9) position.</p>
