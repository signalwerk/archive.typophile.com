  html: |-
    <p>I am building an interactive grammar tool for middle school students - Quill.org. I am looking for a playful font, and the best font I have found at the moment is Oldenburg.  The designer I am working with doesn't like Oldenburg, and he suggests we go with a cleaner font, such as Roboto Slab.</p>
    <p>I was hoping that you could take a look at these two wire frames, and let me know whether the Oldenburg works, and if not whether you knew a font that might work?</p>
    <p>Thank you for taking a look!</p>
