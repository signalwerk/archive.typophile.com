    <p>Hi. Can someone tell me if this is a bug on my end or if afdko is doing something weird. </p>
    <p>I'm trying to build a font with the style name set to "Regular" but when I run makeotf I get blanks in Name ID 4 and Name ID 17. If put anything other than "s=Regular" it works fine. </p>
    <p>I'm running afdko 2.5.</p>
