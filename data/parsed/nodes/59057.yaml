    html: |-
      <p>Jackson: '[...] This rule seems a little arbitrary and I don’t like the inconsistency [...]'</p>
      <p>I don't think the rule is either arbitrary or inconsistent. As you can read in the specs, with exception of the CFF entry for the Windows platform, the <em>Full font name</em> is made of the <em>Font Family name</em> + <em>Font Subfamily name</em>. If a typeface has more than four weights/styles, the fact that a family on the Windows side can't contain more than four 'MacStyles' (fsSelection) will force one to put for instance the Light, Medium, Black or whatever weight into a separate family. So, the <em>Font Family name</em> could very well in that case contain a weight indicator then and adding 'Regular' to it in the <em>Full font name</em> for the fsSelection: 64 would be the undesirable result of your consistency rule.</p>
      <p>For validating the Naming Table the <em>Consistency Checker</em> of <a href="http://www.fontmaster.nl/english/demo.html" rel="nofollow">DTL OTMaster (Light)</a> is a helpful tool, I reckon.</p>
      <p>&nbsp;</p>
      <p>Ken: '[...] There is no harm in experimenting [...]'</p>
      <p>No, there isn't, but, as you will agree, the nice thing of specs is that following these will at least theoretically assure one of a proper behavior of one's fonts. If they don't, one can blame the application in question or even the operating system. </p>
      <p>The rules for the OpenType Naming Table are mostly pretty old anyway, because the format is an enhancement of the TrueType format, of course.</p>
