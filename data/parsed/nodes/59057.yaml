    html: |-
      <p>Jackson: ‘[...] I could change the style name from “Regular” to “Book” and the name tables would be built differently [...]'</p>
      <p>That is according to the specs still. As you know, on the Mac side you can theoretically have an unlimited number of Font Subfamilies (which used as such, is not always an advantage for the end user, but that is another discussion). On the Windows side there is a maximum of four because a Font Family can't contain more than four different styles. </p>
      <p>Using ‘Book’ as a Subfamily on the Windows side is not incorrect as such, but personally I prefer to let the Font Subfamily name correspond with the fsSelection setting and then the specs make sense.<br>
      Not every Windows app shows the Subfamily name, and in my opinion the style information, for instance ‘Regular’, could be confusing when the actual Subfamily is ‘Book’.</p>
      <p>The escape route for the more advanced apps is offered by the naming entries for PlatformID 3 (Windows), NameID 16 (Preferred Family) and 17 (Preferred Subfamily), which I would use for equaling PlatformID 1 (Mac OS), NameID 1 (Font Family name) and 2 (Font Subfamily name).</p>
