      TTName 0 3 1 0x409 "© Dutch Type Library, 1992-2009. All rights reserved."; #Windows<br>
      TTName 1 1 0 0 "DTL Argo •indicator•"; #Macintosh<br>
      TTName 1 3 1 0x409 "DTL Argo •indicator• Medium"; #Windows<br>
