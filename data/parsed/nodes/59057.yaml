      <p>As you probably know, an adapted version of the AFDKO is under the hood of DTL FontMaster. So, perhaps it might be interesting to know how the font naming is controlled in FM.</p>
      <p>The file structure of FM is based on the 35 years old IKARUS system (we celebrate this fact at the FM conference in the <a href="http://www.kurhaus.nl" rel="nofollow">Kurhaus hotel</a> in the Hague coming autumn. Besides the ‘central’ Character Layout file(s) (for character names, Unicode code points and encoding vectors) and OT Layout features file(s), there are four different font files: a glyph database file (BE or IK), the kerning file (AFM or .fea), the font metrics info/naming file (UFM) and a file that contains certain parameters like for instance the blue values (PAR). The files are connected with each other by the file names.</p>
      <p>I have attached an example of the UFM file below. It is just a text file that contains font info such as naming. The ‘TTName’ entries are specifically used for the TrueType and OpenType production and are supplemental to, or supersede related info in the rest of the file.</p>
      <p>When exporting OpenType fonts all required conversions are done in a temporary directory, where all files needed by the conversion tools involved are created or copied. For instance <em>feathead.txt</em>, <em>featname.txt</em>, and <em>featos2.txt</em> contain table blocks for respectively the ‘head’, ‘name and ‘OS/2’ table, with all entries based on the UFM and PAR files. Name IDs from <em>featname.txt</em> are in the range of 1–6 (the standard range). The original <em>Adobe Hatch OpenType</em> tool (HOT) will not take these names from a features file, but the modified HOT tool (by URW++) will accept any ID.</p>
      <p>The main concern of every font producer is <strong>reproducibility</strong> and <strong>consistency</strong> throughout a type library. Font data must be easy to edit and update. The fact that the UFM file is an editable and duplicatable text file, makes it easy to re-use it for variants of font weights/styles, for instance for other scripts.<br>
      I have made simple Apple scripts that rename a couple of entries like •indicator• (for instance TOT for the text version of an OpenType Standard font, or TPRO for the OpenType Pro version) and •UniqueID• and some other font specific entries, and subsequently distribute the UFM files to a static system of directories for the actual font production, where the four font files for the different scripts reside (Character Layout files and OT Layout features files are ‘globally’ used).<br>
      The glyph database files in these directories are renamed copies of ‘central’ glyph databases, of which file-renamed copies are re-distributed over the system after updates using Apple scripts also. The generation of the actual fonts is handled by a ‘pyramid’ like structure of command files that relate to the static directory system.</p>
      <p>With the future in mind, it has taken me some time to organize the production at DTL as described. For quite some years now we are working on WGL4 character sets for all fonts and the copying/distributing system makes it easier to generate (and control!) all font variants that contain subsets.<br>
      &nbsp;<br>
