      <p>Given that the specification deals with the string "Regular" in a special way, overriding this behavior by post-processing the font using "ttx" may have consequences.</p>
      <p>There is no harm in experimenting, which should include a heavy dose of application testing, to make sure that the "Regular" weight of the font appears correctly in the font menus, and otherwise behaves as expected.</p>
      <p>If you don't mind a suggestion, one thing to consider is the use of one- and two-letter abbreviations for the weight names, such as EL, L, R, M, B, and H for Extra Light, Light, Regular, Medium, Bold, and Heavy.</p>
