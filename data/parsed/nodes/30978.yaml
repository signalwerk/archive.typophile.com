    html: <p>So did you open a Didot typeface in FontLab and take off the serifs? Because I think that the specific EULA (End-User License Agreement) for that Didot will govern whether you can use this personally. I'd really doubt that any EULA would let you modify a font and then sell it commercially. But if you made this from scratch (not by opening up a Didot font) <em>based</em> on Didot, then that should be perfectly fine for personal or commercial use.</p>
