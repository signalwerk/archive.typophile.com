    html: <p>Even for personal use you could be stepping on someone's toes. Some people will say you shouldn't worry about it, but if you respect the type designer and his work perhaps you will keep this in your box of tricks and only use it for a logo or something. If this is Hoefler's Didot I'm pretty sure you aren't supposed to be reverse engineering it. However, I do think it is kosher to use in Illustrator for logos and such.</p>
