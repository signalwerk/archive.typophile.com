      <p>I do not believe that there are any Didot family sketches of letters to find. But you could find very old books printed with types cut by the Didot family. These would probably all be in French. Aside from France, tehre may be copies of some of these works in rare books libraries. I suggest contacting the nearest rare books libraries in your area. Some large University libraries collect rare books.</p>
      <p>Otherwise, you could look at old printer specimen books, like ATF catalogs, old Monotype or Linotype catalogs, etc., and try to get a feel from those how <a href="/wiki/Didone" class="freelinking" rel="nofollow">Didone</a>-style letters looked in various point sizes. Maybe some of the Photo Lettering Inc. catalogs could help?</p>
      <p>Lastly, quite a lot of gravestones and engravings and other prints from the first half of the 19th century were made using vaguely Didone letters. You could look at these for visual reference as well.</p>
