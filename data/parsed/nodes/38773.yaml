    user: 5094
    date: 2007-11-07T13:52:00
    date_raw: 7 Nov 2007 — 1:52pm
    votes: null
    html: |-
      <p>Nick,</p>
      <p>I don't make tabular commas and periods the full width of the figures. Usually around 3/5ths. For not too good reasons, I make them both the same setwidth. I fiddle with the sidebearings (&amp; even the set) in the metrics window, so that both the comma &amp; period look OK with all numeric combinations. Yes, I swap them in with the "tabular" feature. I also set U+2008 to that width -- even with InDesign's table features, I sometimes find padding a single entry the fastest way to decimal align a column.</p>
      <p>I also try to make the tabular figures all have the same setwidth, lining and oldstyle, in both roman &amp; italic &amp; even bold, as all will come up in a table from time to time. A number of fonts have a different setwidth for tablular numbers in roman than in italic. Makes for a mess.</p>
      <p>BTW, for a number of fonts, I also make up both lining and oldstyle arithmetic operators (plus, minus, equal, multiply, divide, greater, less), and occasionally currency symbols, (dollar, sterling). These are switched with the lining/oldstyle feature. A few fonts also need a lining/oldstyle endash, though at some point you get absurd, because emdashes &amp; endashes should have the same height, and work with lower-case letters to boot.</p>
      <p>Since the fonts I work on are only used with InDesign, I have far fewer things to worry about than a font designer worrying about multiple applications programs.</p>
      <p>Someday though, it would be fun (maybe in the Design Forum?) to go over a list of niceties for fonts to be used only for, or essentially for, long texts, such as books.</p>
      <p>Oh, we got in a new journal yesterday, which used Franklin Gothic Heavy in some display elements. I kerned "comma" "quotedblright" -130; "period" "quotedblright" -100. I'll allow that a single compromise value would likely be OK in this case, but in other, text fonts, I'd take more control over the sidebearings &amp; thus the kerning.</p>
      <p>FWIW</p>
