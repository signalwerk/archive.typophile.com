      <p>&gt; <em>Are subtable breaks errors?</em></p>
      <p>No. What Karsten was referring to is the infamous <code>Start of new pair positioning subtable; some pairs may never be accessed: ...</code> error. An example here: <a href="http://typophile.com/node/37959" title="http://typophile.com/node/37959">http://typophile.com/node/37959</a></p>
      <p>&gt; <em>If that is the case, why does FontLab allow a class to be “active” on both sides?</em></p>
      <p>There's no problem with using the same class on both sides, but that increases your chances of running into the subtable error above, specially if you're working on a font with a large character set.</p>
