      <p>In passing:</p>
      <p>I wouldn't have a class with "quoteleft" and "quotedblleft" as members. Too many times when you want to do something with one, but not the other -- or the opposite with the other -- for example, kern (negative) two successive quotelefts, but postive kern the string "quoteleft" quotedblleft", "quotedblleft" "quoteleft" and, "quotedblleft" "quoteright."</p>
      <p>"Comma" and "peroid" are another favorite class that probably shouldn't be made. If you do this, compromises will abound. In fact, major punctuation probably shouldn't be combined for good kerning, though it is tempting.</p>
      <p>With vowels, watch combining grave accents with the basic vowel, or be prepared for a lot of exceptions -- "f" "agrave" usually won't take a negative kern -- in fact, a lot of pairs that normally take a negative kern get gefuched with an accented vowel.</p>
      <p>I'm probably one of the few people here who is not a fan of class-based kerning. It can be helpful, just don't make establishing large classes to get the fewest number of kerning commands a goal. Back in the 1985 or so, our first PC version of TeX would only allow about 100 kerning/ligaturing commands (I forget the actual number). However, within a command, you could group characters -- sort of an early "class kerning." I was very happy when we got Y&amp;Y TeX and I could use straight pairs kerning . . .</p>
