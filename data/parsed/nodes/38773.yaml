      <p>K.L. -- <cite>that you don’t run into subtable break error messages</cite><br>
      M.S. -- <cite>What Karsten was referring to is the infamous "Start of new pair positioning subtable; ..."</cite></p>
      <p>Yes, that's it. Thank you, Miguel, for providing the background!</p>
      <p>Nick, yes: For my fonts, I strictly set up classes as either leftside or rightside classes in FLS, even if some leftside and rightside classes share the same set of glyphs -- and upon generating fonts I automatically "merge" classes with identical content into a single class. This may illustrate that the separation helps avoid (or track down) errors during production <cite>but is not at all a requirement as regards OT fonts.</cite></p>
      <p>I thought it's better to mention this trick right away since I anticipated that "Start of new pair positioning subtable" would be next weeks thread.&nbsp;&nbsp;;-)</p>
      <p>Let me also point to the AFDKO2's FLS script for generating the kern feature. It does a better job than FLS5's "Update kern feature" function (though the difference may become evident only with larger or heavily kerned fonts).</p>
      <p>Karsten</p>
