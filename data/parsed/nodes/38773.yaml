    html: |-
      <p>&gt; <em>However, there is no problem with including different characters in a “both sides” class</em></p>
      <p>I agree, and it's very tempting to make only one class — which will be used on both sides — for glyphs that are symmetrical, such as 'A', 'T' or 'V'. But things can get out of control pretty quickly if your glyphset contains an 'AE' glyph or a 'T_h' ligature, for example. In this case, if you don't separate those "both sides" classes it's likely you're going to have a bad time...</p>
      <p>My point is, although it might sound like it's more work if one has to explicitly create left and right classes, that extra effort may in the end payoff, as it helps keeping you away from class kerning errors. And if you run into one of those, it will be easier to find the problem, IMO.</p>
