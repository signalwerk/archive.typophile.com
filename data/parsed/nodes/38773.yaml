      <p>Make sure "class kerning" is selected in the Metrics panel window.<br>
      Windows&gt;Panels&gt;Classes, and make a kerning class, eg "o". Say it includes o' and c.<br>
      Now in the Metrics window, kern between T and o.<br>
      Automatically, the same value is applied to T and c.<br>
      Tools&gt;Kerning Assistance&gt;Update will turn both your individual and class kerns into a "kern" feature.<br>
      Windows&gt;Panels&gt;OpenType and see.</p>
      <p>nb, the quirk is, you need at least one other Feature for OT kerning to work in a font.</p>
