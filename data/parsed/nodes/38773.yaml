    <p>Hi,</p>
    <p>Might as well say Hi, as I just registered. I have only been reading here previously. My Name is Gustaf, currently Studying my last year on a BA Graphic Design course in the Uk.</p>
    <p>To my question;</p>
    <p>I am producing an Opentype typeface as a part of a University Project using FontLab 5 for Win. As I have come to set kerning for it, iv run into some trouble. From some reading, as I understand it, class based kerning is the better alternative and then complimenting with  pairs for those which does not fit in a class with any other. I created a few classes manually with a few glyphs each. I understand that it should be done via the OpenType window but not sure how. </p>
    <p><code>feature xxxx {<br>
      sub by ;<br>
    } xxxx;</code></p>
    <p>Get how to add that, and that the feature should be kern, but not how to set the actual kerning between the different classes. Is the a full list of the Opentype feature tags with how they are used anywhere? How do I set the opentype kerning of single pairs as a compliment to the classes?</p>
    <p>Thanks in advance.</p>
    <p>// Gustaf</p>
