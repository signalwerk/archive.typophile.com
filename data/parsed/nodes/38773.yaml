      <p>This one answers your main question about the "other" feature:<br>
      <a href="http://typophile.com/node/32929" target="_blank" rel="nofollow">http://typophile.com/node/32929</a><br>
      Right from the start, you should set up separate classes for the left and right side, and attach "_1ST" to the class which will be leftside of a pair, and "_2ST" to the class which will be rightside of a pair. In a feature, the result would look like this:<br>
      &nbsp;&nbsp;&nbsp;pos @_A_1ST @_A_2ND 20;<br>
      This makes sure that you don't run into subtable break error messages.</p>
      <p>Google a bit with "kerning site:typophile.com" or "class kerning site:typophile.com" as search string -- there have been some threads on class based kerning which cover most issues that one may run into. Some for a start:</p>
      <p>This thread contains a collection of links to other class kerning threads (as of August 2006):<br>
      <a href="http://typophile.com/node/27424#comment-151733" target="_blank" rel="nofollow">http://typophile.com/node/27424#comment-151733</a></p>
      <p>And some more recent ones, but no really new information:<br>
      <a href="http://typophile.com/node/30567" target="_blank" rel="nofollow">http://typophile.com/node/30567</a><br>
      <a href="http://typophile.com/node/33284" target="_blank" rel="nofollow">http://typophile.com/node/33284</a><br>
