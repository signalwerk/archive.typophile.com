      <p>You forgot the "feature" in the first line:</p>
      <p><code>feature liga {<br>
      &nbsp;&nbsp;&nbsp;sub aring by aring;<br>
      } liga;</code></p>
      <p>The width of glyphs does not matter. What matters in kerning classes is the leftside and/or rightside shape of letters. (So, if you do a serif type and the 'I' has a serif bottom right while the 'N' does not, then you may consider using different classes. In a sans they can be in the same class. It is a design decision.)</p>
      <p>[Edit: Hello Charles! These are indeed tricky cases and require exceptions when using class kerning.]</p>
