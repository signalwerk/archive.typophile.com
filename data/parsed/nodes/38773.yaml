      <p>Right Miguel, as you say in that thread, "...each glyph should only be included in one left kern class, and one right kern class, maximum."</p>
      <p>However, there is no problem with including different characters in a "both sides" class, if their left sides all have similar kerning behaviour, and their right sides all have similar kerning behaviour. For instance:</p>
      <p><code>O' Q</code></p>
      <p>hyphen' endash emdash</p>
      <p>period' comma ellipsis</p>
      <p>quoteright' quotedblright</p>
      <p>and of course</p>
      <p><code>A' Adieresis Aring Agrave Atilde Acircumflex Aacute Amacron Aogonek Abreve</code></p>
