      <p><em>kern (negative) two successive quotelefts</em></p>
      <p>Charles, when do two successive quotelefts occur in text?</p>
      <p><em>“Comma” and “peroid” are another favorite class that probably shouldn’t be made.</em></p>
      <p>I don't see why not. The only place that period and comma may differ is following a double-bowl g, or maybe an ogonek-accented character, but those are the characters I would always design the comma to fit with anyway, not solve lax design with a kern.</p>
      <p>In general, too much kerning is detrimental, but one wants to be able to handle the fundamental letter-punctuation kerns (P, T, V, W, Y, f, r, v, w, y) in a straightforward and efficient manner.</p>
