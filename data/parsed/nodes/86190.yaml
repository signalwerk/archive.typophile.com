      <p>Took a very long time to see the hippo :-)</p>
      <p>Ok on to the type:<br>
      •&nbsp;Hear or Ear? H is problematic<br>
      •&nbsp;EA probably should almost touch like that.<br>
      •&nbsp;REC=Dark, ORDS=Light is odd, I'd do them all negative or.. Hear negative and Records positive etc. Not half a word.<br>
      • Negative space between R and E is wonky. Actually all the way through records is wonky.</p>
      <p>Overall I think you'd improve it if you focused on making it "drippy" all the way through the letters and counters. More like the "HEAR" part, though that could also be more fluid. THe artificial parts of the RECORDS added for legibility need to be rethought so they are less contrived... the worst offenders are the area above the C and Especially the S.</p>
      <p>Bag under the hippo eye? :-)</p>
