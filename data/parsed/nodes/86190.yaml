      <p>it's called i ear music but i can only see eyes... the typography reminds me of the trippy aerosmith logo - needs a bit of work on the text - there is no clever reason to split the word pos/negatively so how about making each word a different colour?</p>
      <p>i'm probrably missing the whole blue shape thing... my only concern being a record label is the size differential of the text to the rest of the logo - at an appropriate size for the back of a CD the "wobbly" text will be tiny...</p>
