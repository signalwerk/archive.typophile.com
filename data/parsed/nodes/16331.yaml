    html: |-
      <p>It was one of the fonts that was included in the original Bitstream Type Shop CD-ROM in which you could get the whole Bitstream library for about $500. They still sell a product like that, but without any ITC faces. </p>
      <p>Other "lost" ITC fonts from that era (many never digitized at all) include Aki Lines, Bernase Roman, LSC Book (3 weights + italics), Caslon 223 (not to be confused with Caslon 224), Caslon Headline, LSC Condensed, Didi, Firenze, Milano (neither of the two by that name on ITC's site are ITC Milano), Neon, Tom's Roman, Grizzly, and Uptight Neon.</p>
    html_clean: |-
