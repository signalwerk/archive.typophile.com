      <p>The font is ITC Grouch, condensed a bit with a customized k. Grouch and the recently ID'd Grizzly are among the ITC fonts which were available at one time only from Bitstream, but no more. Somebody should give ITC a good talking to. If they're going to go around revoking distribution rights, at least they should offer it themselves.</p>
      <p>Edit: Actually the k is an alternate that was part of the original design. It included a few other alternate characters (which were not included in the Bitstream version).</p>
