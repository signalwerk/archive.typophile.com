      <p>Thank you for all the feedback, typophile!</p>
      <p>This logo is actually hand drawn by me, then scanned into Illustrator. I like your idea, evanbrog, but like Phinney said that it wouldn't be ideal for a logo that will go onto clothing tags and such. To clarify, this shop targets the mid to upper-class, not very hipster and mainstream. And also this is a very small store, the floorplan just about the size of a single decker bus. </p>
      <p>And all those Grandma comments just make me laugh! Talk about how off-the-brief my work turned out. I wonder how Victoria's Angels manage to use so much pink and still look appealing!?</p>
