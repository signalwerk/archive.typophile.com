    date_raw: 5 Feb 2003 — 6:01pm
    votes: null
    html: "<p>This is truly a powerful thread. I'm like Randy, very new to the game. It would be nice to see this info compiled into a handy PDF document for people like us to use as research. <br> <br>I believe the best answer I've recieved so far from anyone is this. Don't sell your first fonts, hand them out for free. By doing this you will get a lot more people downloading your font. By doing this you will find out if your font is truly perfect. Are all the contours closed? Are there kerning pairs that you didn't account for? Guaranteed that someone in the world will find something wrong. You also can get a name for yourself and start to generate a little traffic through your web site. Develop a fan base of sorts. <br> <br>Anyways, that's my two cents. I'd like to think that some of my early fonts could start generating cash, but I have a long road ahead of me (much like any starting typographer). If you look at type web sites almost everyone has a free font for download. Chank told me this once: All my free fonts are either very old fonts, or fonts I don't wish to continue on creating glyphs. I think that's a good piece of advice. Get as many of these buggers under your arms. Once you decide your path then take the good ones from the bad ones. <br> <br>Did I go too far off the original subject? <br> <br>t1m</p>"
    html_clean: "<p>This is truly a powerful thread. I'm like Randy, very new to the game. It would be nice to see this info compiled into a handy PDF document for people like us to use as research. <br> <br>I believe the best answer I've recieved so far from anyone is this. Don't sell your first fonts, hand them out for free. By doing this you will get a lot more people downloading your font. By doing this you will find out if your font is truly perfect. Are all the contours closed? Are there kerning pairs that you didn't account for? Guaranteed that someone in the world will find something wrong. You also can get a name for yourself and start to generate a little traffic through your web site. Develop a fan base of sorts. <br> <br>Anyways, that's my two cents. I'd like to think that some of my early fonts could start generating cash, but I have a long road ahead of me (much like any starting typographer). If you look at type web sites almost everyone has a free font for download. Chank told me this once: All my free fonts are either very old fonts, or fonts I don't wish to continue on creating glyphs. I think that's a good piece of advice. Get as many of these buggers under your arms. Once you decide your path then take the good ones from the bad ones. <br> <br>Did I go too far off the original subject? <br> <br>t1m</p>"
