    html: <p>The first time I submited (as described) a typeface it was longtime ago, probably Angie, my first one to FF. In fact, I just send the a basic character set (suh panels done for Morisawa, it was in 1990). But this was before I start to design with computers. They don't have done any comments, I just decided how many weights, etc. <br> <br>Then, i submited Anisette to FB circa 1995/96, there, they asked for hamburgefonstiv and some others trials if you have, such weights, etc. <br> <br>Then, they reviewed it and ask for corrections, etc. <br> <br>Now, its my own boss who decide if he accept my designs, generally he is quite cool with me and we have same feelings on letterforms. <br> <br></p>
    html_clean: <p>The first time I submited (as described) a typeface it was longtime ago, probably Angie, my first one to FF. In fact, I just send the a basic character set (suh panels done for Morisawa, it was in 1990). But this was before I start to design with computers. They don't have done any comments, I just decided how many weights, etc. <br> <br>Then, i submited Anisette to FB circa 1995/96, there, they asked for hamburgefonstiv and some others trials if you have, such weights, etc. <br> <br>Then, they reviewed it and ask for corrections, etc. <br> <br>Now, its my own boss who decide if he accept my designs, generally he is quite cool with me and we have same feelings on letterforms. <br> <br></p>
  - id: 49996
    user: 850
