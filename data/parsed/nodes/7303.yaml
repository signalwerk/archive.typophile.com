    html: "<p>For example: <br> <br>Here is one of my cap/display efforts from the class. Sent off to ITC per the above. The reply was very positive, and(but?) included the following suggestions: <br> <br>1.Create a lower case <br>2. Enlarge to 3-6 weights <br>3. Add italics <br>4. Consider a condensed weight <br>5 (Where's the yen? :-) <br> <br>So perhaps hamburgefonts won't cut it, but the rest of the response indicated an excitement about the work so far, encouraging to a first timer. When and what  do you send? <br> <br>Randy <br><img src=\"http://www.typophile.com/forums/messages/4102/5198.gif\" alt=\"submission\"></p>"
