    html: "<p>To all of you successful, filthy rich typographers out there (and I'm hoping for a response?), <br> <br>When you submit a design for review: <br>1). How complete was it when you first sent it? <br>2). How complete was it when you got accepted? <br>3). What did you send that got accepted? (Full character set? Example as you see it used? PDF? Print outs? Totally finished font files? etc.) <br> <br>This info would be really helpful. Being new to the whole thing, I'm wondering how it works. I suspect at the highest levels there is reputation and personal connections that get you in the door. What about everyone else. <br> <br>Regards, <br>Randy</p>"
