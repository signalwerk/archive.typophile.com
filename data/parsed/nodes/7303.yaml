    html: <p>When I worked at HTF, we would receive submissions from designers who have already blown out their typeface into sixteen weights, complete with italics. And we would look at these and see (I should say, Jonathan would see) some basic letterform design issues in the core weight. At that late stage, to suggest a revision would demand design changes to several dozen fonts, and the work that would entail would seem prohibitive. <br> <br>So I'm with Ed Benguiat on this one. </p>
