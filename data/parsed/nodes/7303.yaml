  html: "<p>Hi all. <br> <br>I just finished reading the transcript from the recent live crit. Almost needed color coding to follow all the conversation threads! More of these live crits are in order. <br> <br>One question in the chat that I wished I'd been involved with was \"when to approach a distributor with you design?\" Generally it seemed the response was: when you have something fairly \"together\" people will work with you to noodle and polish. <br> <br>I was recently in Ed Benguit</p>"
