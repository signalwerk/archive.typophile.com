    html: <p>Tim, I would have to, by instinct, disagree with you on a couple of things.  <br> <br>First, I would not want to use my market to test my designs. They should ( my designs ) be perfected before they are released. It would seem an unfortunate situation that the first impression of your foundry or type face would be riddled with issues. I would give your market more credit. The name you get for yourself might not be good with incomplete efforts. <br> <br>Second,  "Get as many of these buggers under your arms.".  I would rather have one design of top quality than ten of half of the first. In other words, quality not quantity. I believe Bringhurst could be referenced for a much more eloquent version of this statement. As a painter, I totally agree with Picasso</p>
