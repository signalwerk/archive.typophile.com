    html: <p>&gt; interpolation <br> <br>Since the computer can't guess what you want, it needs <i>two</i> fonts (like a Light and a Bold) to create more weights automatically*. Fog can do interpolation, but it seems FontLab's is better, not least because you can <i>extrapolate</i> too, and can often interpolate adequately between totally different fonts! <br> <br>* You can also create lighter/darker weights from a single font, but that's not interpolation, and it generally requires a lot of clean-up, as well as adjustments (like making the thins thinner/thicker). <br> <br>hhp <br></p>
