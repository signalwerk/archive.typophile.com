    votes: null
    html: |-
      <p>well for the de, i and pe, it looks like Tatlin uses script forms for these letters. these forms are also used in (some) serif italics, so you could also think of these as upright italic forms. Tatlin also uses the Delta shape for the upper case De and EL, which fit well with geometric designs (but i might question this decision for something so tall...) if i remember rightly, these Delta shaped forms originally are associated with renaissance type, although the triangular El goes back as far as the inception of Peter the Great's <a href="/wiki/Civil%2520Type" class="freelinking">Civil Type</a> (someone correct me if i'm wrong on these points).</p>
      <p>For a script-informed sans style, see <a href="http://www.flickr.com/photos/pauldhunt/428260395/">this alphabet</a> in my flicker stuff.</p>
    html_clean: |-
