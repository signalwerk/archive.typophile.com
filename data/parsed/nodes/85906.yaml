      <p><cite>had the pleasure to test it for a while and it’s bliss to set and read text in</cite></p>
      <p>Thank you for the kind words Indra. Yes, Equity will be available shortly. <a class="freelinking external" href="http://typo.la/equity" rel="nofollow">(PDF sample available now.)</a></p>
      <p>For color and texture, I’ve always liked Janson Text and Monotype Ehrhardt a lot. But I don’t use them very much because I find some of the details distractingly quaint (the droopy ear on the lowercase g comes to mind). Also, digital Ehrhardt is a pale representation of the metal version.</p>
      <p>With Equity, I took hot-metal Ehrhardt as a model and pushed it to be more contemporary and less quaint. Like my last font family, FB Alix, the project was inspired by my work with legal typography, but all are welcome.</p>
      <p>Janson fans should also be aware of David Berlow’s excellent titling Janson, called <a class="freelinking external" href="http://www.fontbureau.com/fonts/KisFB/" rel="nofollow">Kis FB</a>.</p>
