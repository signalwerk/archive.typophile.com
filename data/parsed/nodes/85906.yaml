    <p>I am considering to buy a "Janson" (Kis) typeface, but I can't make up my mind as to which one I prefer.</p>
    <p>I was going for <strong><a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?productid=713961" rel="nofollow">Linotype/Adobe Janson Text</a></strong> when I stumbled upon the recently released <strong><a class="freelinking external" href="http://www.fonts4ever.com/portrait_typeface.php?id=5" rel="nofollow">E+F Kis Antiqua Now</a></strong> (<a class="freelinking external" href="http://www.fonts4ever.com/download/goodies/Kis_Antiqua_Now_Schriftmuster.pdf" rel="nofollow">sample</a>, <a class="freelinking external" href="http://www.fonts4ever.com/download/goodies/Kis_Antiqua_Now_Schriftportrait.pdf" rel="nofollow">portrait</a>) which seems very nice. And then there's <a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?productid=215876" rel="nofollow">Monotype Janson</a>.</p>
    <p>Which Janson/Kis typeface is your favourite, and why?<br>
    Please share your thoughts, and feel free to suggest alternatives! (<a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?productid=215276" rel="nofollow">Monotype Ehrhardt</a>?)</p>
    <p>Thank you for any comments - and for a wonderful site!</p>
