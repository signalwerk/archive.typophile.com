      <p>What I ment to say is, that you probably can't go wrong with something which is a relative of one the most used typefaces in the 20th century. </p>
      <p>Stanley Morison called Janson "an excellent letter". </p>
      <p>It is well received by Bringhurst:</p>
      <p>“A number of typefaces designed for the Linotype were <strong>artis-<br>
      tically successful</strong> in spite of these constraints. Hermann Zapf's<br>
      Aldus and Optima, Rudolf Ruzicka’s Fairfield) Sem Hartz’s Ju-<br>
      liana, and W. A. Dwiggin’s Electra, Caledonia and Falcon were<br>
      all designed for the Linotype machine. <strong>Linotype Janson</strong>, adap-<br>
      ted by Zapf in 1952 from the seventeenth-century originals of<br>
      Mikles Kis, <strong>is another eminent success</strong>. Many Linotype faces<br>
      have nevertheless been modified in the of digitization,”</p>
      <p>“Linotype<br>
      Janson Text (1985) likewise seems to me the most successful<br>
      digital version. It was prepared under the supervision of Adrian<br>
      Frutiger, based on Kis)s originals and on Zapf's excellent Lino-<br>
      type machine version.”</p>
      <p>I think the two new Variants Kis Antiqua Now and Equity are finally doing it justice for the digital world.</p>
