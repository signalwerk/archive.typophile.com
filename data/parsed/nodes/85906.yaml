      <p>Kis Antiqua Now is the most impressive to me and the character set is rather large in comparison to other versions. </p>
      <p>Apart from Kis Antiqua Now, Janson Text (Adobe/Linotype) is probably the most common choice: <a href="http://www.textism.com/textfaces/index.html?id=14" title="http://www.textism.com/textfaces/index.html?id=14">http://www.textism.com/textfaces/index.html?id=14</a></p>
      <p>It might depend as well on the language you want to use it for. The capitals in Janson Text are quite tall I find, not unusually, but Kis Antiqua Now is a bit more contemporary in this regard.</p>
