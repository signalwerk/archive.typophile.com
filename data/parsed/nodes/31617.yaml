    html: |-
      <p>Here is a simulation of Saudek made using Monotype Sabon Semibold Italic. I added 2.5 pts of stroke thickness and tightened the tracking for the last 4 letters so that they touched. I think the serifs would not have been as blunted if the Bold weight was used, but apparently that’s not in the Monotype version of Sabon. I also expect the letterform variation would be less if the proper starting weight was used.</p>
      <p>I think this makes a case that ’Saudek’ on the cover is made from Sabon with some graphic manipulation.</p>
      <p>- Mike Yanega</p><div class="imageWrap"><img src="/files/SAudekSim_4876.gif"></div><p></p>
    html_clean: |-
