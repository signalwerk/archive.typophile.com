      <p>It’s <a href="http://www.linotype.com/53159/sabonnext-family.html">Sabon Next</a> Extra Bold Italic. Thank you, Mike, for doing the research that led me to check Sabon Next. Usually, if a sample is this close to a typeface, but with this many modifications, it’s more likely that it’s a similar typeface rather than something custom because of the work required to do it right. </p>
      <p>I wouldn’t be surprised to see the rest of the book is also set in Sabon Next — it’s got swash ’e’s.</p>
