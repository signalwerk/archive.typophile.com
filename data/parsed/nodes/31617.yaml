      <p>The most obvious problem with the Galliard theory is that it doesn’t match except for a similarity in the alternate characters. Look at the J and W, for example.</p>
      <p>I think the answer is <a href="http://www.myfonts.com/fonts/linotype/adobe-garamond/">Adobe Garamond</a>, which has the right alternate characters, like the a, e, n and ct ligature, as well as the same J and W.</p>
      <p>- Mike Yanega</p>
