      <p>Modern British Posters<br>
    ======================</p>
    <p>Paul Rennie will be giving a talk on this theme at Central St Martins<br>
    College of Art and Design on Tuesday 6 May, 6.30pm.</p>
    <p>There will be a chance to view the exhibition of the same name from 6pm<br>
    in the Lethaby Gallery. Tickets, including drinks, cost £5 (£3<br>
    concessions) and numbers are limited so please RSVP to the St Bride<br>
    Foundation if you would like to attend:</p>
    <p>info [at] stbridefoundation [dot] org / 020 7353 3331</p>
    <p>Money from ticket sales goes directly to St Bride Library.</p>
    <p>The exhibition is open until 17 May and opening hours are Monday-Friday<br>
    10.00am - 6.00pm and Saturday 10.00am to 4.00pm.</p>
    <p>More information:<br>
