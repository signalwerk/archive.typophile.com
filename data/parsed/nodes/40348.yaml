  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: <a href="/node/60942" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminal</a>&nbsp;: Ball&nbsp;Terminal</strong></p>
    <p>A circle-shaped device used to terminate a <a href="/node/add/wiki?edit%5Btitle%5D=Stroke" title="Create node &quot;Stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stroke</a>, for example on the end of the arm on <strong>r</strong>, or the <a href="/node/add/wiki?edit%5Btitle%5D=Tail" title="Create node &quot;Tail&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">tail</a> tip of <strong>y</strong>. Ball terminals are a prominent feature of so-called “modern roman” types which came into existence in the second half of the 18th century with the appearance of <a href="/node/30993" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Didones</a> and types used by the <a href="/node/add/wiki?edit%5Btitle%5D=Fournier" title="Create node &quot;Fournier&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fourniers</a> as well as <a href="/node/30994" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Giambattista Bodoni</a>. Ball terminals are typically drawn in a strict geometric form of a pure circle. Some types however, principally <a href="/node/14119" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Baskerville’s</a> <a href="/node/add/wiki?edit%5Btitle%5D=roman%20type" title="Create node &quot;roman type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">roman type</a>, feature organically-shaped ball&nbsp;terminals.</p>
    <p>Ball Terminals join the stroke at an angle, as opposed to <a href="/node/14545" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lachrymal Terminal</a>s which taper into the&nbsp;stroke.</p>
    <p><strong>Additional Articles:</strong><br><a href="http://typographica.org/001077.php">Typographica: A Bevy of Ball&nbsp;Terminals</a></p>
