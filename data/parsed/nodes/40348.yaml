    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : <a href="/wiki/Terminal" class="freelinking" rel="nofollow">Terminal</a> : Ball Terminal</strong></p>
    <p>A circle-shaped device used to terminate a <a href="/wiki/Stroke" class="freelinking" rel="nofollow">stroke</a>, for example on the end of the arm on <strong>r</strong>, or the <a href="/wiki/Tail" class="freelinking" rel="nofollow">tail</a> tip of <strong>y</strong>. Ball terminals are a prominent feature of so-called "modern roman" types which came into existence in the second half of the 18th century with the appearance of <a href="/wiki/Didone" class="freelinking" rel="nofollow">Didones</a> and types used by the <a href="/wiki/Fournier" class="freelinking" rel="nofollow">Fourniers</a> as well as <a href="/wiki/Giambattista%20Bodoni" class="freelinking" rel="nofollow">Giambattista Bodoni</a>. Ball terminals are typically drawn in a strict geometric form of a pure circle. Some types however, principally <a href="/wiki/John%20Baskerville" class="freelinking" rel="nofollow">Baskerville's</a> <a href="/wiki/roman%20type" class="freelinking" rel="nofollow">roman type</a>, feature organically-shaped ball terminals.</p>
    <p>Ball Terminals join the stroke at an angle, as opposed to <a href="/wiki/Lachrymal%20Terminal" class="freelinking" rel="nofollow">Lachrymal Terminal</a>s which taper into the stroke.</p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://typographica.org/001077.php" rel="nofollow">Typographica: A Bevy of Ball Terminals</a></p>
