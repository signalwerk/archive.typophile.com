    html: <p>Clockwork Orange!? I've not seen the film personally, but I'm not sure I'd want to associate my ice cream shop with a murderer! :p  James, I have checked out the link and I like how they've carried the theme into the environment.   <br>I think I will try to go in a similar style to the fonts I asked to be ID'd. I am reading a couple of books about retail graphics, for ideas of how to apply the style to the interior/shop front.  This project is fictional so I don't get to work with interior designers (!), so if anyone has any good links for retail graphics especially examples for ice cream I'd be very grateful. <br> <br>Also what do you think of the name "Milk Bar" for a new ice cream parlor? I've noticed a lot of them just use a name like Ben &amp; Jerrys etc.  How about "Marty's"? I need something that will excite the tastebuds but also not sound lame.</p>
