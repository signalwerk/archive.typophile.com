    <p>&lt;font class="dontLookLikeCrap"&gt;Hello. <br>I have a brief at college to design a new idea for a shop and create the brand and graphics (logo, packaging, swing tags, look for the interior/shop front.)  I am doing an ice cream parlor but I am not sure whether to try to make it look more modern or something with a retro twist - such as from this other post I made:  <a href="http://www.typophile.com/cgibin/show.pl?83/70178" target="_blank">http://www.typophile.com/cgibin/show.pl?83/70178</a> <br> <br>The idea is that the shop would sell ice creams and also non-dairy alternatives.  Working title is "Milk Bar"! <br> <br>Would love to hear any suggestions.  I live in the UK so unfortunately I dont get to see as many great ice cream parlors as in the US or Italy.  We get the usual Ben and Jerry's and Haagen-Dazs etc.&lt;/font&gt;</p>
