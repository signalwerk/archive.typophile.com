    html: <p>Cheryl, it would be nice if it was Marty's Milk Bar. Put a personality behind the business. <br> <br>As for retail design, I live in Manhattan and the cost of real estate here (even for rent) is prohibitive so a place like my local bagel shop is a rediculous layout, super thin but fairly long, you can barely get two people to pass one another to get to the end of the counter. So their use of graphics is their back wall and a sidewalk sandwich style sign and their awning. Thats it! So there aren't hard fast rules that always work. The environment (and money) often will dictate what you can do</p>
