      <p>Unfortunately there aren't any more letters from that "EVE" logo font shown in the film, but thanks for everyone's input so far.</p>
      <p>It wouldn't surprise me if those I posted might have all be tweaked versions of fonts I've already found... even on a few of those I'm 100% sure about in the MyFonts album I posted a link to it was clear several of the characters had been modified (predominantly to remove stlyized gaps from letters like A, E, B, K; and numbers like 6 and 9.  SB Vibe and Saved By Zero were both changed in this way, and I'm quite sure they were used in the film.  Even the designer of SB Vibe agrees, as he was kind enough to reply to my e-mail regarding the issue.</p>
      <p>I was kind of surprised at the massive variety of typefaces used aboard the Axiom, though... in almost every other way, the ship is run with an almost military precision behind the scenes.  But the real military has a ton of guidelines regarding typeface styles, what can be used where, and so on.  The Axiom has so many different fonts in so many different areas, sometimes modified from the original and sometimes not; it can be a bit crazy.  I'm starting to think the A-113 font was indeed Konstruct-Square, which can be tweaked just by making 45 degree cuts on both sides of the top of the "A".</p>
      <p>That was an interesting article, riccard0; thanks for the link.</p>
