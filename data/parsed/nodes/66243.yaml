      <p>The top two images do look like <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/eurostile/" rel="nofollow">Eurostile</a>, with relatively simple modifications. The letters seem nearly unchanged from Eurostile Extended Bold. The numerals use all the complex parts of the Eurostile numerals, and then smooth out some of the curved surfaces on the 3, 5, 6 and 8. A simple partial serif amputation fixes the 1, and a diagonal line makes a nice techie zero.</p>
      <p>From other questions about Disney fonts in the past, it seems clear that they have an art staff that knows how to tweak fonts, but they seem rarely to want to spend the effort to design a complete new one.</p>
      <p>- Mike Yanega</p>
