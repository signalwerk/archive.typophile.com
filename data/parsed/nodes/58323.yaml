      <p>Paul, What is the idea of putting this kind of comments here? Is it so that people step out of these places?<br>
      "El Angel y el Leon" (the angel and the lion) is the name of a Roberto Negri´s sculpture located in Santiago de Chile. It was a gift from Italy to Chile for the celebration of its independence. It is not an invention, it is a sculpture, the drawing it is based on a photography of it.http://www.flickr.com/photos/escatologia/3461527828/sizes/o/<br>
      If it is badly drawn is because it´s in development, and that is why it is posted here, so other people can comment what is right or wrong about it. These way I can improve it.<br>
      The idea of using .org in the logo is because more than a publishing company (that publishes books) it is a independent colective of cultural spreading, that remarks it´s inspiration as a independent Organization, more than a commercial one. Besides it´s a webzine and also a independent publishing company, so is more important to remark the domain (URL).</p>
      <p>I will appreciate in the near future that the comments were a little bit more constructive and thoughtful, is a bit violent to receive non constructive critics and only disparaging or malicious ones.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/angel_4343.jpg"></div><br>
      New version, thanks for the comments.<p></p>
      <p>Some really important. Lanzallamas means Flamethrower, the name of a book of Roberto Arlt.</p>
      <p>jko | Santiago de Chile</p>
