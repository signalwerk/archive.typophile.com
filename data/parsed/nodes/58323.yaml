      <p>Hi jko,<br>
      I think this can turn out nicely, it´s an interesting image. But I think there´s a bit too much going on in this logo, too much flames and legs. I would try and find a more dynamic view of the lion and the angel - maybe something like the picture of the statue posted by Mojo would work. Actually I think it would. And I would skip the ground, or incorporate it with the text (making the ground a black box with white text in it). I also would skip the flames. If needed because of the name, stick to one flame - coming from the lion, disconnected from its mouth...</p>
