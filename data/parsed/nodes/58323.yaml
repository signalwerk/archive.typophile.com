      <p>I thought I knew my Bible stories pretty well, but I'm drawing a blank on the angel with the fire-breathing lion. What's the story behind this image?<br>
      Like Zev, I'm not an illustrator, but I think the placement of the angel makes it ambiguous whether he's riding the lion or standing next to it. Also, if you refine the shape of the lion's forelegs, it will be more obvious that they don't belong to the angel.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/lion_Benjamin_Waterhouse_Hawkins_1860_5052.jpg"></div><br>
      <em>(Detail from drawing by Benjamin Waterhouse Hawkins, 1860)</em><br>
      To make the angel more heroic as Zev suggests, try moving his torch-bearing arm forward so it's not superimposed on his head. And give him a stronger chin.<p></p>
