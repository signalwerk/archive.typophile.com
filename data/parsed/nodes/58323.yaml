      <p>Check out the number of legs...I see one front paw, two angel legs, and two hind paws. Although the angel's rear leg looks a lot like the lion's...maybe it is the lion's? Very confusing.</p>
      <p>Also, the area where the angel's robe/dress/tunic touches the lion's back creates a weird shape, I think. </p>
      <p>Overall, I think there's a distracting imbalance of negative and "positive" space. Personally, while I agree that the first flame looks like a car decal, I like it better than the newest version, which looked to me like a duck trying to escape the lion's mouth.</p>
      <p>Have you played around with the direction at all? Flipped the image horizontally so that the lion/angel are facing to the right?</p>
      <p>-Scott</p>
