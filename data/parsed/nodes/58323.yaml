      <p>Hmm, interesting.<br>
      I like the ambiguity about whose legs are whose. I also like the way you've got five legs. On first glance most people wouldn't notice that's an odd number. To me it looks unmistakeably like the angel is walking, and not riding the lion.<br>
      I would however add some sharpness to the contours, it seems a lot of the corners are too round, clean and smooth. I think some polishing of the silhouettes to get them closer to anatomical would be very worthwhile.<br>
      I'm not sure about the way the fire on the lion's mouth is shaped.<br>
      And I'd flip it to face right.</p>
