    html: <p> Ruari McLean's Manual of Typography gives a good history of typography and design and is a very practical book. The only caveat is that it only goes up to the 80s so the digital side of typography is not addressed. <br>I also like Stop Stealing Sheep by Erik Spiekermann, it is a nicely illustrated introductory text. </p>
