    votes: null
    html: "<p>Tiffany, <br> <br>yes i do. but - about Reading - doing what?  <br> <br>this paper or academic paper is pure knowledge. it is about history. culture.   <br> <br>this kind of paper -  MUST!!! <br> <br>i think  the problem with young people, students (and part of this problem is because of the school/university) - that they are looking for shortcuts. they are looking for \"how to\" books.  <br> <br>e.g. a post by a guy(not here). he wrote, more or less, : i am new to fonts. i am looking for a book about metrics. <br> <br>the problem: he wants to create a typeface. but he does not know what is a typeface. just to buy FontLab or Fog....you can't create a typeface. <br> <br>Steven Heller, the Great Heller wrote ( about illustration - but i think you can say type design/ graphic design etc., etc., ) : <br> <br>\"...At most art schools, despite the requisite nod to the liberal arts, the student is not exposed to or encouraged to take part in classes about literature, sociology, psychology, or history... <br> <br>\"Having a liberal education will not necessarily guarantee a rosy illustration career, BUT neither will an art school education. What liberal arts WILL facilitate is a better understanding of subjects and themes that an illustrator will encounter in a majority of assignments..... <br> <br>\"......Without THESE TOOLS AN ARTIST CAN MAKE AESTHETICALLY PLEASING PICTURES.....BUT BEING VISUALLY LITERATE IS NOT SIMPLY A MATTER OF TURNNING A CIRCLE, SQUARE AND CONE INTO A CAT OR DOG, BUT ASSIMILATING, SYNTHESIZING AND TRANSLATING HUMAN KNOWLEDGE AND EXPERIENCE INTO VISUAL TERMS.\" <br> <br>that is why this paper is must. and not just this paper.  <br> <br> <br>David  Hamuel</p>"
