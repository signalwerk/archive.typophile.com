    html: "<p><i>Type &amp; typography</i> by Phil Baines and Andrew Haslem is a great book for beginners as well as those with more experience. It approaches type first and foremost from the linguistic point of view in a section called 'function', then move onto 'form', where history and classification are discussed in great details. The third section is about the designing and manufacturing of type. The next section is titled 'Structure', where hierarchy, grid, and the fine points about setting type are covered. The last section is 'Conventions', the 'rules' of setting text type, if you will. The whole book is illustrated throughout with relevant and engaging examples, The main running text set in Swift in a large point size and 'sidebars' set in a smaller Meta that goes into more depth about each issue discussed. I highly recommend this book. I think it's one of the best, most comprehensive and least biased I've seen so far. It is quite a brilliant achievement: it has a lot of depth and students are going to <i>like</i> reading it because it actually <i>looks</i> so interesting. Along with Bringhurst, it's going to be required reading for my type class.</p>"
    html_clean: "<p><i>Type &amp; typography</i> by Phil Baines and Andrew Haslem is a great book for beginners as well as those with more experience. It approaches type first and foremost from the linguistic point of view in a section called 'function', then move onto 'form', where history and classification are discussed in great details. The third section is about the designing and manufacturing of type. The next section is titled 'Structure', where hierarchy, grid, and the fine points about setting type are covered. The last section is 'Conventions', the 'rules' of setting text type, if you will. The whole book is illustrated throughout with relevant and engaging examples, The main running text set in Swift in a large point size and 'sidebars' set in a smaller Meta that goes into more depth about each issue discussed. I highly recommend this book. I think it's one of the best, most comprehensive and least biased I've seen so far. It is quite a brilliant achievement: it has a lot of depth and students are going to <i>like</i> reading it because it actually <i>looks</i> so interesting. Along with Bringhurst, it's going to be required reading for my type class.</p>"
