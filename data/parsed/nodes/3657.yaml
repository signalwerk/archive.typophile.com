    html: "<p>To me Gill's little book is very serious. It puts type in the context of society, exposing some deeply-rooted problems. The fact that many people today might think it's \"strange\" is simply that we've been brainwashed into loving industrialization over the past 100 years. I think when Gill's book came out, there were a lot more people who \"got it\". <br> <br>According to the colophon*, \"Essay\" was in fact the first use of Joanna. And the later 1936 edition was set in foundry, not Monotype. <br> <br>* It has two: one on page 4 and one at the end. I'm not sure the first one can be called a \"colophon\". <br> <br>hhp <br></p>"
