    html: <p>&gt; &gt; <i>Or have access to a [really] good library.</i> <br> <br>Sure. The library at Emily Carr here in Vancouver is not the best, but it does have quite a well-stocked typography section, as well as a number of books on calligraphy and lettering. <br> <br>&gt; <i>BTW, don't forget Alexander Lawson's "Anatomy of a Typeface". It's &gt; way &gt; up there.</i> <br> <br>Yes, Hrant, you're right. Lawson is a good read. But I remember the copy at Reading University's library has been scribbled all over with comments that challenge the historical accuracy of a particular chapter (I forgot which one it was). I also remember someone from Reading saying that it is a bit iffy on historical facts. Don't quote me on that. </p>
