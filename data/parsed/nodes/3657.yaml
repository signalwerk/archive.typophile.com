    html: "<p>I think part of being a typographer/type designer is having a large library, and spending a fortune on books :-P <br> <br>If <i>Typeform dialogue</i> is out, I want to buy it right now! I, too, have seen a demo of it (in 2001) and was throughly impressed. Definitely a great tool for learning. <br> <br>I agree, Tiffany. <i>The Nymph and the Grot</i> is great and it offers quite a unique pespective on the early developments of sanserif letterforms. <br> <br>Robin Kinross's <i>Modern typography</i> is a great book on the historical developements in the twentieth century. But, imho, the typographic design itself makes for a rather uncomfortable reading experience. <br> <br>There are so many books that I want to recommend. Here are a few that I think are great (sans comments or details, sorry): <br> <br><i>Writing, lettering, &amp; illuminating</i> <br>Edward Johnston <br> <br><i>A book of scripts</i> <br>Alfred Fairbank <br> <br><i>An essay on typography</i> <br>Eric Gill <br> <br><i>Letterletter</i> <br>Gerrit Noordzij <br> <br><i>Elements of typographic style</i> <br>Robert Bringhurst <br> <br><i>Graphic design &amp; reading: explorations of an uneasy relationship</i> <br>Gunnar Swanson, ed. <br> <br><i>Twentieth century type designers</i> <br>Sebastian Carter <br> <br><i>Letters of credit</i> <br>Walter Tracy <br> <br><i>Type, sign, symbol</i> <br>Adrian Frutiger <br> <br><i>The visible word</i> <br>Herbert Spencer <br> <br><i>Texts on type: critical writings on typography</i> <br>Steven Heller and Philip Meggs, eds.</p>"
