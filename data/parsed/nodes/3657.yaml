    html: <p>&gt; spending a fortune on books <br> <br>Or have access to a [really] good library. I worked for UCLA for a couple of years, and I still get to use their stellar library resources, including doing ILLs of just about anything ever printed! Like I certainly couldn't afford Enschede's glorious 1908 specimen book (~$1200 market value, and worth the quadruple price of the 1978) but I recently got to scan it up the wazoo. <br> <br>BTW, don't forget Alexander Lawson's "Anatomy of a Typeface". It's way up there. <br> <br>hhp <br> <br></p>
