    votes: null
    html: |-
      <p>I used the Serif Font ID Guide and found that <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/gazette/?refby=bowfin" rel="nofollow">Gazette</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/imperial/?refby=bowfin" rel="nofollow">Imperial</a> may be closer matches than Bookman. Both were designed by Ed Shaar in the 1950's, so would have been available as metal type.</p>
      <p>I don't think this book looks like it was done with a typewriter, because some rather awkward spacing was used to justify the margins. I don't think a typewriter would be able to do this.</p>
      <p>- Mike Yanega</p>
