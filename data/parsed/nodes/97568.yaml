    html: <p>To judge from the 1971 date, the text was most likely set on an IBM Selectric Composer using one of that machine's proprietary faces, probably Press Roman. I can't identify the sans-serif font in headline, but I think it's dry transfer lettering. The largest size on the IBM Selectric Composer was 12 point, and transfer lettering was a popular low-budget solution for display type in the 70s.</p>
