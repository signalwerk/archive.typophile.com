    html: |-
      <p>For a start:<br>
      S and R are too wide. The head of R is too big and too wide. There is too much weight difference on the S, make it more monoline. The upper curve could be shallower. A is too narow. E too wide. K too narrow, the upward stroke should sit higher. What happened to the H, man? Wasn’t there enough space? It’s the narrowest letter in there, very awkward.<br>
      The spacing is very tight. Not a problem at this size, but if it’s going to be set smaller.</p>
      <p>Best, Jürgen</p>
  - id: 321644
