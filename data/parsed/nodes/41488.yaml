      <p>The characteristics of the Modern (Didone) style are:</p>
      <p>High contrast<br>
      Vertical stress<br>
      Unbracketed serifs</p>
      <p>The class of Scotch types meets the first two criteria, but its adherence to the third varies.</p>
      <p>The Scotch has bracketed serifs.</p>
      <p>There are two ways of looking at this--strictly taxonomic (i.e. what the physical features are), or philogenic (how they evolved).</p>
      <p>So we have the Panose system, with</p>
      <p>cove<br>
      obtuse cove<br>
      obtuse square cove<br>
      square cove<br>
      square</p>
      <p>which are taxonomic</p>
      <p>and IBM with</p>
      <p>transitional<br>
      modern (didone)<br>
      clarendon<br>
      slab</p>
      <p>**</p>
      <p>Some wrinkles:</p>
      <p>The Century styles are Scotch, but in headline faces they tend towards modern, and in text, towards slab.<br>
      Times Roman has Scotch capitals, but not lower case--except in the bold. Bit of a mash-up.<br>
      Press gain on letterpress text gives the impression of subtle bracketing.</p>
      <p>When Richard Austin, inventor of the Scotch, started his own foundry, he addressed the problem of easily damaged type by coming up with what I term the Scotch Modern -- the style with huge, fine serifs and tiny aperture. The brackets are so attentuated that they thin out, becoming didone-like. It was that style of type which was first termed "modern" in the late 19th century, not Bodoni, which had yet to be revived, and which is probably now considered most typically "modern".</p>
      <p>So, as the distinction between Modern and Scotch rests on the degree of bracketing, the degree of "Scotchness" of a particular typeface may vary with both its optical size, and the foundry that produced it. </p>
      <p>For instance, consider these four faces. Pretty similar, eh?<br>
      Yet De Vinne is generally considered a Modern, Georgia and Century Scotch, and Clarendon a slab serif.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Scotched_5769.jpg"></div><p></p>
