      <p><em>Would that make Monotype Modern technically not a strict Modern but a Scotch Modern?</em></p>
      <p>That's my view, and I do think the nature of the Scotch is open to interpretation.<br>
      19th century typography generally hasn't been given critical respect or attention, so there is still much to be discussed and theorized.</p>
      <p>Hoefler &amp; Frere-Jones, in the blurb for their <a href="http://typography.com/fonts/font_overview.php?productLineID=100032" rel="nofollow">Chronicle,</a> consider the Scotch to be Transitional.</p>
      <p>What then does that make typefaces like Century or De Vinne, with their enormous serifs and pot-hooks on a and R?<br>
      They're not modern, in the sense that they don't have the Modern's openness and reductive simplicity.<br>
      Aesthetically, they are between Oldstyle and Modern, but they are not transitional, as we understand that as meaning "on the way to".<br>
      They follow on from the first Modern types of Didot and Bodoni, but we can't call them Post-Modern -- too 20th century.<br>
      So that's why I've suggested Scotch Modern as a term for this genre.</p>
