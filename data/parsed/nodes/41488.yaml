      <p>Interesting… so then it's all about the bracket?</p>
      <p>Would that make <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/monotype-modern/" rel="nofollow">Monotype Modern</a> technically not a strict Modern but a Scotch Modern?</p>
      <p>It's funny because over time, my hyper-simplified technique was to just look at the cap R, and depending on the upstroke at the end of its leg, I would make my distinction. Anything with an extreme flip (à la <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/de-vinne/" rel="nofollow">De Vinne</a>) I labeled as Scotch and reserved <cite>Modern</cite> for the earlier French originals. I think perhaps my assumption of what was typically Scotch was what you refer to more as Scotch Modern… those exaggerated Austin-esque versions which just scream <cite>Victorian</cite>. For whatever reason, I was lumping those faces in with the sturdier, less exaggerated Scotches like <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/miller/" rel="nofollow">Miller</a>.</p>
      <p>Perhaps my scale should look something more this this:<br>
      |Didone----|--Modern--|--Scotch Modern--|----Scotch|</p>
      <p>?</p>
      <p>Is it appropriate to separate Didone from Modern?</p>
      <p>I'd also be curious to know where you would place something like <a class="freelinking external" href="http://www.myfonts.com/fonts/intellecta/zooth/" rel="nofollow">Zooth</a> (for lack of a better example) – the Moderns with ridiculously large (but still unbracketed) serifs.</p>
