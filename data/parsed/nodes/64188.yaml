    html: |-
      <p>To add to that, not all of the fonts on those sites are even supposed to be circulating free.</p>
      <p>If you find yourself on the homepage for Nick's Fonts, he's not too happy they're everywhere for free, and FontSquirrel has some of those fonts he would like you to pay (minimally) for.</p>
      <p>It prob. doesn't matter but it's a word of caution for you to be aware of</p>
