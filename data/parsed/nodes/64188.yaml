  date: 2009-11-12T12:07:00
  date_raw: 12.Nov.2009 12.07pm
  votes: null
  html: <p>I would like to open up a discussion for us to post free font sites. Here you can post where you get your fonts for free. To kick this off, I would like to post my absolute favorite site, <a class="freelinking external" href="http://www.fontsquirrel.com">Font squirrel.com</a>. Check it out and post what you think are great free sites. Also, post what licenses this site primarily deals with (commercial, CreativeCommons, Demo, etc.). Looking forward to see what shows up.</p>
