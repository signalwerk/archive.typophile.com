    date_raw: 10 Jul 2005 — 6:00pm
    votes: null
    html: |-
      <p>Most of that, including the first R, matches Kanzlei Bold, stretched vertically a bit. The two digital versions I'm aware of are Dieter Steffmanns <a href="https://web.archive.org/web/20141112181352/http://www.moorstation.org/typoasis/designers/steffmann/samples/f/fettekanz.htm" target="_blank" rel="nofollow">Fette Kanzlei</a> and Paul Lloyd's <a href="https://web.archive.org/web/20141112181352/http://www.moorstation.org/typoasis/designers/lloyd/blackjewels/index.htm" target="_blank" rel="nofollow">Plain Germanica</a> (listed as Germanica).</p>
      <p>The top of the k and l, as well as the tail swashes on the C and second R will require custom work.</p>
