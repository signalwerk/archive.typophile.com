    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 28.Apr.2008 3.00am </div>
      <p>Hi!<br>
    Green greetings from springlike New York City.</p>
    <p>/ / / / / </p>
    <p>New release: Flama mega family by Mario Feliciano</p>
    <p>One of the maiden releases when Village launched in 2005, and still one of our most popular offerings, the Flama family has been expanded and improved. Mario Feliciano, the great Portuguese designer, has added three additional widths and some extra weights to this eminently useful sans.</p>
    <p>The "standard" Flama family now comprises 10 weights from Thin through Black in both roman and italic with all accents needed for setting western and eastern European languages. Also new for 2008 are Semicondensed, Condensed and Ultracondensed widths of Flama.</p>
    <p>The type family will soon be seen everywhere (in Europe, at least) for a major car company.</p>
    <p>The Flama family of 20 fonts is US$450.<br>
    The Flama Semicondensed family of 9 fonts is US$225.<br>
    The Flama Condensed family of 8 fonts is US$180.<br>
    The Flama Ultracondensed family of 8 fonts is US$180.<br>
    The Flama Superset of all 45 fonts in all widths is US$750, a savings of over 25%.</p>
    <p>Single weights of all types are available, and are covered by the Taste Test program.</p>
    <p><a href="http://vllg.com/Feliciano/" title="http://vllg.com/Feliciano/">http://vllg.com/Feliciano/</a></p>
    <p>/ / / / /</p>
    <p>Speaking of the Taste Test program...</p>
    <p>Don't forget that all fonts offered on vllg.com are in our Taste Test program. If you license a single weight of a family, and then come back later to get the full family, your original purchase amount will be returned to you. Details and examples are at <a href="http://vllg.com/tastetest.php" title="http://vllg.com/tastetest.php">http://vllg.com/tastetest.php</a> </p>
    <p>/ / / / /</p>
    <p>Recession, anyone?</p>
    <p>The US economy is on a rocky path and our dollar keeps losing value, which is great for our friends in foreign countries. We've said it before, and we'll say it again: Our dollar is weak but our types are strong!</p>
    <p>Some examples...<br>
    The new Flama Superset is US$750, or around 470 euros.<br>
    The Stag Superset from Schwartzco is US$500, or around 315 euros.<br>
    Our most popular family, Apex New, is US$249, or around 155 euros.</p>
    <p>/ / / / /</p>
    <p>Coming soon: debut releases from Jeremy Mickel and Jordi Embodas; Galaxie Polaris Condensed; Apex Compact; updates galore...</p>
    <p>/ / / / /</p>
    <p>Thanks again from DUMBO / Vinegar Hill.</p>
    <p>Chester &amp; Tracy Jenkins<br>
    Village<br>
    206 Front Street #4A<br>
    Brooklyn, NY 11201</p>
    <p>telephone ++1 718 852 1005<br>
    fax ++1 718 852 1006</p>
    <p><a href="http://vllg.com/" title="http://vllg.com/">http://vllg.com/</a> / / / / / / / / / / / / / / / / / / / / / /</p>
