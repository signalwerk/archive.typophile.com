    html: |-
      <p>Ugly, like beauty, is often in the eye of the beholder. </p>
      <p>But if you can make a career out of ugly, then that would seem to be a reflection on our society. Perhaps people become so desensatized to the marketing of 'beauty' that 'ugly' catches them off-guard. </p>
      <p>Then one can only wonder what happens when they become desensatized to ugly. I submit that the result would be Ultimate Fighting, or "human cockfighting" as it is sometimes referred to. Believe it or not, some people see a beauty in that. Go figure...</p>
