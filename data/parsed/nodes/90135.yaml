      <p><em>What do you guys have against Lion?</em></p>
      <p>I have nothing against it. I guess it's a decision if you want to make a big step and get a system with many new parts to work (FontLab 5.1 with Lion) or go one change (First FontLab 5.1, new Mac OS later) at a time.</p>
      <p>I'm happy with the new, fast FontLab Studio on Snow Leopard, which uses the recent Python version 2.6, and I'm not sure if I'll ever update my Snow Leopard to Lion, because I know for sure that some of my other applications still need to run PowerPC code, the most important one being Creative Suite 3. I've read that I won't be able to print from it without PowerPC support, and I certainly won't pay 1500$ for an upgrade just to be able to continue printing.</p>
      <p>(The other stuff I'd hate to see fall behind would be my C64 emulator and DOOM Legacy ;)</p>
    html_clean: |-
