      <p>Frode, when writing Lion Apple decided some folders are way too sensitive to have us dumb users mess around, and so "they" in their wisdom, goodwill, and more of that patronizing crap, decided to hide them. If you are fairly sure your file should be around <em>somewhere</em> on your disk, take a look at <a href="http://gothick.org.uk/2011/07/19/revealing-lions-hidden-library-folder/" title="http://gothick.org.uk/2011/07/19/revealing-lions-hidden-library-folder/">http://gothick.org.uk/2011/07/19/revealing-lions-hidden-library-folder/</a></p>
      <p>I'm used to browse around with the Terminal and it seems that's unaffected (pending a definite judgment), but I must admit I draw the line at aliasing 'ls' to show *all* of the hidden dot.name "system" items. It's pretty discouraging to see how much overhead there actually is for each folder ...</p>
