      <p>I've heard some rumblings about network issues on Lion from our IT folks. They have to deal because new Macs come with Lion, but they do not recommend anybody else in the company upgrade yet, unless they have to for some reason. I expect it is related to the problems with Active Directory integration of Lion machines, as described here (among many other places): <a href="http://4sysops.com/archives/troubleshooting-the-network-accounts-are-unavailable-error-in-mac-os-x-lion/" title="http://4sysops.com/archives/troubleshooting-the-network-accounts-are-unavailable-error-in-mac-os-x-lion/">http://4sysops.com/archives/troubleshooting-the-network-accounts-are-una...</a></p>
      <p>Other than this, I don't know of any big problems with Lion. This is only big if you are trying to integrate Lion machines into an Active Directory based network.</p>
      <p>T</p>
