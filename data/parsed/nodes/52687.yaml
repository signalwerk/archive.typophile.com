  html: <p>Just now, I was walking to the basement restrooms of a local library, when a certain dolphin and anchor caught my eye. On display, opposite some vending machines is an Aldine octavo. It is open to the printer's device, so I don't know what the work is. However, judging from the call no. penciled in on the inside, it appears to be from 1534. It is in a regular glass display case (not sealed) with a cheapo display case lock. Doesn't this deserve better treatment? An Aldus Manutius printing is more than just an old book (at least to a typophile). Should I mention this to the library staff?</p>
