    html: <p>They know what it is,probably; a first edition of Ginsberg's Howl is sitting nearby. I have to wonder if they simply don't have the proper storage. I am of the opinion that some things are better of being given to an institution that can properly store them. I'm sure this library will disagree, but it should probably be brought up.</p>
