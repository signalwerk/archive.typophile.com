    html: "<p>If it is in a case open to the printers device, they obviously know what it is. I was similarly astounded to see the exhibit put out for Typecon at the Buffalo Central library with minimal security: A Shakespeare first folio, A Kelmscott Chaucer and  a few other gems.</p>"
