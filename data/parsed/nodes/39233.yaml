      <p>There's too much re-using of common elements, and you should pay some more attention to the way the curves turn into straights — that oughta be more flowing.<br>
      Other points that needs attention are the overall rhythm (relationships in widths of the glyphs) and the balance of outer and inner spaces (ideally the inner space of o should be equal to what's between two o's, but also in line with the innerspace of an m, for instance).<br>
      Look for balance.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
