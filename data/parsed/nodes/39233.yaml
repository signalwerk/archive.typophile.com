    html: <p>OPen up the spaces between the Glyphs. That way you can design it to work in more that one way. The openess of the counters and the tight spaceing don't seem to go together to me eye. Also, making your face geometric doesn't absolve you of needing to compensate ( in non-geometric ways ) for the needs of the eye. This means tapering joins. It can still appear geometric. But this way it will look less clunky. Look at the join on the r. I would open up the mouth of the e. Make the D wider. Consider what widths look best for each letter. This isn't a monospace so take advantage. A full character set would help too.</p>
