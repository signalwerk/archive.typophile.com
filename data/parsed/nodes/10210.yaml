  html: <p>I'm redesigning my personal identity (I am a web designer). My business name is monolinea, which means "one line".  <br> <br>I found a great font Alusine by Jack Usine, which fits the concept perfectly and am working at customizing it a bit. Here's what I've got so far, basically making changes to the  "i" in the first line, and the "r" and "V" in the second, but I'm not sure it's working to well. Any critiques, suggestions or comments would be welcome.  <br> <br><img src="http://www.typophile.com/forums/messages/29/69252.gif" alt="monolinea"></p>
