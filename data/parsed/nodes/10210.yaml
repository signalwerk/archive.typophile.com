    html: "<p>Hi Kemie, <br> <br>Two thoughts: <br>1. The e/a combination is awkward. Considere drawing a single storey a and connecting the e to it like the m/o combination. I think it will match the feel of the other letters better. You might also consider a small cap E form. The overbite might be less awkward. <br>2. The off-center diseno interactivo seems odd because of the symmetry of the end swashes (which I like alot!) I'd get rid of these words all together if it was me. <br>3. What other monolinea ideas have you explored? How about a connecting script or brush script. How about connections more like Process Lingua? Or a rounded version of lingua if that suits your style better. What about a sharpie drawn Bickham? Monoline has so many possibilites! <br> <br>Also, be sure to do a pixel-perfect (hand hinted) version at the small size you will use it online. In other words, make the thins exactly 1 pixel, the white space 1 pixel, and the stems 7 pixels (or whatever makes sense). This could look very cool methinks. <br> <br>Randy</p>"
    html_clean: "<p>Hi Kemie, <br> <br>Two thoughts: <br>1. The e/a combination is awkward. Considere drawing a single storey a and connecting the e to it like the m/o combination. I think it will match the feel of the other letters better. You might also consider a small cap E form. The overbite might be less awkward. <br>2. The off-center diseno interactivo seems odd because of the symmetry of the end swashes (which I like alot!) I'd get rid of these words all together if it was me. <br>3. What other monolinea ideas have you explored? How about a connecting script or brush script. How about connections more like Process Lingua? Or a rounded version of lingua if that suits your style better. What about a sharpie drawn Bickham? Monoline has so many possibilites! <br> <br>Also, be sure to do a pixel-perfect (hand hinted) version at the small size you will use it online. In other words, make the thins exactly 1 pixel, the white space 1 pixel, and the stems 7 pixels (or whatever makes sense). This could look very cool methinks. <br> <br>Randy</p>"
