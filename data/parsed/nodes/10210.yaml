    html: <p>'Mono' gives the idea of a closd set, like an oval. <br>The oval is not one oval, but several shapes of ovals. <br>   If you say 'mono-oval' can be that you use _only_ that <br>kind of oval -- jus tlike typography means that you write <br>with types of letters.  One font is not a mono-font. <br>  Monospaced font are not called onespaced font. <br> <br>'Egg' in Finnish is 'muna' but if you start counting them <br>it is 'munaa' the word.  Not sure about this neuron. <br> <br>Mono- is the first element of composed Greek root words, <br>or modern genesis ones, from Greek 'monos,' 'single - made <br>by only one.'  'One' remains more abstract, just like you <br>can write 'one' or '1' and in the font, numbers are called 'figures'. <br> <br>AS</p>
    html_clean: <p>'Mono' gives the idea of a closd set, like an oval. <br>The oval is not one oval, but several shapes of ovals. <br>   If you say 'mono-oval' can be that you use _only_ that <br>kind of oval -- jus tlike typography means that you write <br>with types of letters.  One font is not a mono-font. <br>  Monospaced font are not called onespaced font. <br> <br>'Egg' in Finnish is 'muna' but if you start counting them <br>it is 'munaa' the word.  Not sure about this neuron. <br> <br>Mono- is the first element of composed Greek root words, <br>or modern genesis ones, from Greek 'monos,' 'single - made <br>by only one.'  'One' remains more abstract, just like you <br>can write 'one' or '1' and in the font, numbers are called 'figures'. <br> <br>AS</p>
