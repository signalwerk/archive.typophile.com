      <p>The client requested ".. a combo of Georgia and Raleway.." .. </p>
      <p>Georgia, a great typeface, was designed optimally for screen reading. How will your zine be printed? Offset? Digital? That should influence your typeface's choice. As a personal advice, I would rahther use a bundled - and probably "overused" font -, instead of a free one, if you don't have to spend anything on fonts. And if you don't want to go with Garamond or Arno, then there is Adobe Caslon, which has been designed by a woman and has some classy "feminine" feel. But, generally speaking, I wouldn't avoid using a well-designed typeface just because it is overused.</p>
