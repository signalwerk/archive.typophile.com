    <p>I am looking for a serif for a women's literature/art/environmental 'zine and have narrowed it down to Mrs Eaves for the body copy.. I'm hesitant (... it seems overused, but really didn't want to go to Garamond or Arno), but for the look, feel and overall projection of the 'zine, Eaves seems to fit well and look spoken from the perspective I am after (.. a tad more feminine). Also looking for a sans serif to pair, but am coming up blank.</p>
    <p>This 'zine is modern, but also praising elements of women's history, so want to pair a more formal/historic serif type with a gentle/clean sans.. It's 72 pages, and don't want to overdo it with number of faces I am including.</p>
    <p>Any experienced editorialists out there that could help weigh in? Help much appreciated.</p>
    <p>-A</p>
