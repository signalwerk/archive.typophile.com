      <p>In Ireland the 24-hour clock tends to be preferred... but it's considered bad form to omit the full stops from "a.m." Why? Because while "a.m." and "p.m." are used in English, both are also used in Irish, and "am" is a noun meaning 'time' in Irish. So for consistency (particularly in light of bilingual invitations and so on) "a.m." is recommended here.</p>
      <p>In Irish "roimh nóin" and "iarnóin" are also used for "before noon" and "afternoon"; the abbreviations are "r.n." and "in." though "i.n." is also seen.</p>
      <p>Michael Everson<br>
      evertype.com</p>
    html_clean: |-
