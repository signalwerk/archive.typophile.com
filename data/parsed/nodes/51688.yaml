      <p>I'm not sure I can justify this any better to my friend the art history prof than by saying "After many years this is what I prefer."</p>
      <p>Maybe on the grounds of disambiguation: the periods prevent "A.M." from becoming "AM," which is a word. I know, I know: in books for readers with any degree of smart much beyond a brick, this will not be an issue; they'll dig that it is time we are talking about here, not a state of existence. </p>
      <p>Maybe for some the periods "stop the flow." Not for me.</p>
      <p>Dez's dubble-period example is indeed horrid. But he needn't worry. In this case the period serves equally as part of the abbreviation and as the sentence terminal. You could look that up in Chicago at 9.42 ("The first train leaves at 5:22 a.m. and the last at 11:00 p.m.").</p>
      <p>Which leads me to say, once again: Following Chicago or Bringhurst should always take second place to our own well-considered ideas of what helps a page. As long as they are indeed "well-considered."</p>
      <p>Horrid also is the lack of a space following the hour number. </p>
      <p>powers</p>
