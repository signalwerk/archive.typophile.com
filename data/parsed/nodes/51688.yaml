    html: |-
      <p>wow! tremendous insight everybody, thanks a ton!  I'd love to keep hearing different persepctives on it.</p>
      <p>Some more specific information about the actual situation I'm dealing with right now.  I am making a flyer equivalent to a conference schedule for a series of training sessions happening at a college here in my town.  Space is at a premium and the chart has to fit within the width of a standard letter-sized sheet.</p>
      <p>I haven't be fortunate to have the shortest workshop names, and the names on the chart are literally usually half of the actual full name of each session already!</p>
      <p>I put the format as <em>'5:00 pm'</em> and my supervisor requested <em>'5:00 P.M.'</em> "because that's the proper way to do it, and also to change the times throughout the body copy to that format as well to be consistent."</p>
      <p>I can understand including the 'pm' so people don't show up at 5 am to the college, but I think making the times that big and spaced out will ultimately break the flow of the chart, and if I do it my way in the chart, I must remain constant throughout the whole document.</p>
      <p>I am using Myriad Pro SemiCondensed, which unfortunately, doesn't have Small Caps that I could find anywhere.  Here's a picture of what I've got so far:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/chart_4587.png"></div><p></p>
