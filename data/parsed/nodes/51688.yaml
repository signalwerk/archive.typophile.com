    <p>Hey all,</p>
    <p>I've recently run into a slight dilemma.  I did a document and formatted the times in this method: hh:mm xx,(4:50 pm)</p>
    <p>My client wants the times to all be in this format: hh:mm X.X. (4:50 P.M.)</p>
    <p>Personally, I cringe at the thought of visually disturbing the flow of the text like that, but it made me wonder.</p>
    <p>What is the proper way, I know all forms xx, x.x., XX, and X.X. are accepted, but what is the most widely accepted, what do you as designers do, and are there prominent examples of use?</p>
    <p>Thanks in advance for your insight on this matter, I never considered that I didn't know this before.</p>
  html_clean: |-
