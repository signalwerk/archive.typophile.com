      <p><cite> &gt; I assume any font designated as Caslon would have been designed by William Caslon himself?</cite></p>
      <p>Not true. “Caslon” has been co-opted for any number of designs, not all of which bear any true relationship to the faces cut by the original William Caslon or the Caslon Type Foundry, and some only distantly related. So it is wise to do research.</p>
