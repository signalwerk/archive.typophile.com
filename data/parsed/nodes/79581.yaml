      <p>Is this the font to which you refer?<br>
      <a class="freelinking external" href="http://marketplace.veer.com/type/jbt0000060#" rel="nofollow">http://marketplace.veer.com/type/jbt0000060#</a></p>
      <p>Wherein it says:</p>
      <blockquote><p>
      Cabernet Regular Set<br>
      by Jukebox Type<br>
      See all fonts in this collection<br>
      A digital revival of a vintage, Caslon-style photo-typesetting face. The character set has been expanded and modernized. Heavy yet upbeat, the true vitality of this typeface emerges with use of the swash variant. The swash font contains several additional alternate characters, including alternate cap A, K,L, M, N, V, W, Y and lowercase ligatures for 'ki', 'ri', 'vi', and 'wi'. The character set has been expanded and modernized from the original.<br>
      This package contains:</p>
      <p>Cabernet Regular, Swash</p>
      <p>Copyright © Jason Walcott / Jukebox / Veer</p></blockquote>
      <p>While the proper name of the copyright holder may not necessarily be the same individual as the designer, it's sufficient grounds for further investigation. Note that this is a revival of an earlier photo-typesetting face, and may have been marketed under a different name when produced in its original form, and the original designer may be someone other than who did the digital conversion.</p>
