      <p>Ah...I just connected that Cabernet was probably a re-imagining of Caslon Black Swash.  I had already researched Caslon Black Swash for over an hour with no success of a design year.  Perhaps I should change my question to:</p>
      <p>What year was Caslon Black Swash designed?  And (foolish question, but I am rather new to typography) I assume any font designated as Caslon would have been designed by William Caslon himself?</p>
