      <p>Here is the letterpress "about us" given to my class:</p>
      <p>"Operating from our home, we try to lend our signature touch to every project we work on. With ten years of letterpress experience, we have the skill to handle any job – yet our small size allows us to treat every customer like our only customer, providing the personalized attention you deserve. It is not uncommon for us to make house calls in Chicago to show paper samples, ink colors or to help with design. Mindful of budgets, our customers never have to sacrifice quality and preference for price.</p>
      <p>In order to provide our clients with a special, one-of-a-kind product, most of our work is custom designed. Custom designs include your choice of design, color and paper." </p>
      <p>Since they do more elegant and custom work I was thinking of thinner type.  But I do like the suggestion of organic.  Would it be appropriate to use an old cursive letterpress font? If such thing exists? Similar to the text on the site, "that wicked worn look."</p>
      <p>Thank you for your help thus far.</p>
