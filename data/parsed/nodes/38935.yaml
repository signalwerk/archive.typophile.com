      <p>Well, I'd say you really should be working with much more organic imagery. Likely, actual letterpress printed type.</p>
      <p>Whatever you do, do NOT use that stretched, skewed type. </p>
      <p>This is a great book:</p>
      <p><a href="http://www.amazon.com/New-Vintage-Type-Classic-Digital/dp/0823099598/ref=pd_bbs_5/002-3450317-6025637?ie=UTF8&amp;s=books&amp;qid=1194620562&amp;sr=8-5" title="http://www.amazon.com/New-Vintage-Type-Classic-Digital/dp/0823099598/ref=pd_bbs_5/002-3450317-6025637?ie=UTF8&amp;s=books&amp;qid=1194620562&amp;sr=8-5">http://www.amazon.com/New-Vintage-Type-Classic-Digital/dp/0823099598/ref...</a></p>
      <p>Now, that said, I agree with Blue and Manlio about the wood type/worn look, BUT...that really depends on what this letterpress shop is focused on. If they mainly do 'fine letterpress printing' in the form of awards/certificates/wedding invites, etc, then the whole wood type/worn thing might not be quite appropriate.</p>
      <p>But do focus on what makes letterpress appealing. It's a tactile medium. Show some texture in your imagery.</p>
