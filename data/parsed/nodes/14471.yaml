      <p>You seem to have three discernibly different weights here to reconcile. The round letters are heavier than everything else, and the fishhooks and descending mirror S are lighter. The latter is going to need some serifs or curls or something; look how solid that letter is in the manuscript.</p>
      <p>I understand why the letters with ascenders don't have a full x-height, but I think the "n" should grow to reach the x-height, because the "nc" ligatures look like they were made from two different sizes, like a 12pt fused to a 14pt.</p>
