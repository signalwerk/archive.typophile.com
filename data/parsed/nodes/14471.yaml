    html: |-
      <p>Thanks for all your feedback!  I wrote up a great long message before and apparently pressed the wrong button, so I apologize if this is a bit short, or repeated, or anything else. I'll take everything in order.</p>
      <p>Cerulean:  While they appear to be ligatures, and are in fact based on earlier ligatures, they're really distinct letters in this version of the alphabet.</p>
      <p>Dan: I'll try to make sure I get them in the right place from now on, and thanks for the feature. That n-c ligature bothered me, too.  If you look closely, you can see that I already adjusted the n part it a bit, but I guess it still needs to go higher. I haven't had much time to work, though, so I don't have any new samples yet.</p>
      <p>Miss Tiffany: This font is pretty light for text sizes. I wonder how it would look in print. Anyway, I imagined the script being written with a broad pen, so it should probably be darker anyway.  It was for the same reason that I made it so sharp. But that was before I tried displaying it on my slightly fuzzy television (my computer was already connected anyway), and it looked absolutely beautiful! So I'll have to try that and see how it looks.  As for referring to letters, I considered posting all their "native" names, but I didn't want to confuse everybody. A reference to the closest Latin letter, or another descriptive term will suffice.</p>
      <p>Dan: It was inspired a bit by Greek and Latin. I did an earlier font, which came out terrible (partially due to the software I used). That font (<a href="http://www.deviantart.com/deviation/9822005/" rel="nofollow">here</a>) is much more like Latin, but with this one I'd like to create a design that would be more natural to the people writing it. They live in a fictional world, thoughThey would generally use pens (perhaps metal or read, probably not quill), though brushes could also used in some areas.  For another interpretation, see my mediocre calligraphy, with ample ligatures, alternate forms, and embellished names (also the source of my icon):<br>
      <a href="http://img.photobucket.com/albums/v629/WurdBendur/afil.gif" rel="nofollow">http://img.photobucket.com/albums/v629/WurdBendur/afil.gif</a><br>
      When I designed the script I was thinking of Insular miniscules (more like in the manuscript), but I just went in completely different directions with both fonts.  I'll have to try lettering this style more on paper to see if I can come up with any other ideas.</p>
      <p>Paul: I'm not sure if that's supposed to be a joke or not, but I like it! I will definitely try some things in that direction.  As it happens, the fictional people in question had earlier encounters with a race of giants whose writing is based more heavily on Tibetan, so that would make a lot of sense.</p>
      <p>Thanks again for all the feedback.  I have many more ideas now to work with, so I'll start trying some things as soon as I get reunited with my calligraphy pen (been moving...).</p>
