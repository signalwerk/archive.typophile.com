      <p>Looks like this thread is returning from the dead. I've fixed some (but not all—see the last two in the following sample) of those letters without the full x-height. Since I can't seem to add an inline picture to this thread (why is that?), here's an external <a href="http://img.photobucket.com/albums/v629/WurdBendur/update.png" rel="nofollow">link</a>.</p>
      <p>As you can see, there's still the problem of inconsistent weights. However that got past me, I'll never know, but I guess fixing it is the next step. Since I have the work already started, I'd like to split this font into two weights. Then it's on to OpenType features. Here's to having a plan!</p>
