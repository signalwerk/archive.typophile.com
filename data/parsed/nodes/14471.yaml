      <p>Thanks.  I did use some real scripts as examples in that I wanted this font to have the feel of uncial, with some black-letter qualities.</p>
      <p>Every people using a particular script will develop guidelines describing what constitutes a well-formed letter, especially in relation to calligraphic styles like this.  But, since this is an artificial script with no real history, I have to invent that myself.  And of course, It would hardly be authentic to emulate any one script entirely.</p>
      <p>What further complicates it is that even this style is a bit non-standard in the fictional world where it lives, but needs to still be readable by others while imparting it's character onto the area where it's used.</p>
      <p>My main reason for posting here is that I think there are several forms that need adjustment, though they're hard to see in the GIF, unfortunately.</p>
