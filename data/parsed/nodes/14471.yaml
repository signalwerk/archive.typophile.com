    <p>This is a font designed for an invented alphabet, so designing a font for it is a little tricky with no examples to follow. (If you're interested, you can read a little about the fictional history of the script and find a sample manuscript <a href="http://www.livejournal.com/users/lower_geldorian/672.html" rel="nofollow">here</a>).</p>
    <p>I didn't know about OpenType when I designed this font, so the alternate letter forms are all just placed in different positions to be typed by the user.  I'd like to design an OpenType font to make the replacement automatic. Anyway, it's been a little while since I actually made this font, but I just recently found Typophile and thought I'd ask for opinions.  I'll explain the sample PDF (and GIF) so nobody will be confused.  It's contents are, from top to bottom:</p>
    <ul>
    <li>Font Name (Sëftos Parathenia, in the Sëftos script)</li>
    <li>Three lines containing all the letters, with alternates</li>
    <li>Two lines with groups of similar letters</li>
    <li>A sample sentence</li>
    <li>Four columns containing a poem</li>
    <li>And finally, figures 0-9 at the very bottom</li>
    </ul>
    <p>Thanks in advance.</p>
