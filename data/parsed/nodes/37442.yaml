    <p>I'll have a couple of days in NY next month - what should I make sure I don't miss typewise, or designwise?</p>
    <p>Also, where will be the best place to see the Rugby World Cup final - an Aussie bar maybe?<br>
    (Will have the family with me, so somewhere not too rough!)</p>
    <p>Thanks</p>
