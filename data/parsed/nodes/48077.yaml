    <p>So I’ve decided to make the effort and actually keep up to date on the latest in design and that means picking up the pieces of my long lost relationship with Type. We had it good back in the day but we both grew successful, didn’t have time for one another and then eventually drifted apart. But I’ve decided no more games. I’m back. And this time, it is for real.</p>
    <p>I love you Type. You are all that is pretty and perfect. </p>
    <p>Forever,<br>
    zeena</p>
    <p>PS - To further prove my pining for you, I’ve attached a token of my affection.</p>
