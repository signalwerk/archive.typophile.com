    <p>Hey typophiles!</p>
    <p>Does anyone know what typeface Marc Jacobs uses, or if it is a custom typeface? I'm thinking it is similar to engraver's gothic? </p>
    <p>If you know, is there anywhere I can get it, or something similar without costs? Or if not, where to purchase it for a decent price? </p>
    <p>Thanks,<br>
    Cat</p>
