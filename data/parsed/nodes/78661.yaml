  - id: 453270
    user: 82773
    date: 2011-02-23T10:23:00
    date_raw: 23 Feb 2011 — 10:23am
    votes: null
    html: <p>What? You're telling me they didn't have browsers in the 18th century? That was just a little show in the title. I think some of us are missing the point. The point is that there is a significant percentage of mankind's printed works (from the beginning of the printing press to early 19th century) which was produced in this manner. 33 million pages from the Eighteenth Century Collections Online (ECCO parts I and II) and another million pages in the Burney Collection of newspapers to quote two sources only. To be able to see this exactly as it was printed and then switch to a format that is easier for the modern reader (dberlow excepted) to enjoy is, for me, a huge bonus.</p>
