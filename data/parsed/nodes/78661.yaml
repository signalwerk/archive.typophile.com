  - id: 453261
    user: 82773
    date: 2011-02-23T09:04:00
    date_raw: 23 Feb 2011 — 9:04am
    votes: null
    html: <p>Well, I would hope you're not presuming to speak for all readers. To be able to take a regular text document and without losing the ability to spell-check and without having to type with special characters such as the long-s and ligatures directly, allows for great flexibility. The intention was to reproduce documents exactly as they were produced in the 18th century. I feel very confident I have achieved this goal. Almost all of the MUFI fonts have the required ligatures; which one is used is entirely irrelevant to me.</p>
