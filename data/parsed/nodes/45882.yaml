      <p>The IP rights to the ATF library were still very much owned and being protected in the early-to-mid nineties. At that time the person to contact regarding licensing was Mark A. Lester, Esq., in Los Angeles. This may still hold true although I don't have current contact information for him. If he's still practicing he's probably in the phone book.</p>
      <p>The one thing I found most frustrating about trying to deal with them was the fact that they weren't really interested in licensing for a single font or single family. They were far more interested in licensing the entire package.</p>
      <p>I also do not know which of their library of faces they claim IP rights to. The very old ones, in my mind at least, probably have no protection at all.</p>
