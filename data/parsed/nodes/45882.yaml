  html: <p>Can anyone tell me if the ATF typefaces are public domain? I am considering digitizing a typeface from one of the old specimen books (1934), but wasn't sure if another company now owns the copyright to those designs. Thanks in advance.</p>
  html_clean: <p>Can anyone tell me if the ATF typefaces are public domain? I am considering digitizing a typeface from one of the old specimen books (1934), but wasn't sure if another company now owns the copyright to those designs. Thanks in advance.</p>
