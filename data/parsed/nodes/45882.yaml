      <p><em>Technically, the design of a typeface is not copyrightable in the US.</em></p>
      <p>Lifted from the always accurate wikipedia:<br>
      "Although typeface design is not subject to copyright in the United States under the 1976 Copyright Act, the United States District Court for the Northern District of California in Adobe Systems, Inc. and Emigre, Inc. v. Southern Software, Inc. and King (No. C95-20710 RMW, N.D. Cal. Jan. 30, 1998[1]) found that there was copyright in the placement of points on a computer font's outline, i.e., because a given outline can be expressed in myriad ways, a particular selection and placement of points has sufficient originality to qualify for copyright."</p>
      <p>This would lead me to believe that as long as it hasn't been digitized, it should be okay, but maybe sources other than Wikipedia should be consulted...</p>
