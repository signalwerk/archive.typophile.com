    html: |-
      <p><cite> &gt; As I said I have interest in the designer, </cite></p>
      <p>The prime force behind the design of most ATF faces was indeed Morris Fuller Benton, with some 200+ designs to his credit. The names of the numerous drawing office workers who did most of the drawing and production on those are shrouded in the mists of time.</p>
      <p>ATF also published designs from outside designers. Mac McGrew gives attributions for many, many faces in his very thorough <cite>American Metal Typefaces of the Twentieth Century.</cite> I recommend anyone look up any face they're contemplating reviving.</p>
      <p><cite> &gt; The very old ones, in my mind at least, probably have no protection at all.</cite></p>
      <p>Let's assume for a moment, for the sake of argument, that typeface designs were copyrightable. In the U.S., works published before 1978 were afforded a maximum of 75 years protection if all renewals were made in a timely fashion. Anything published before 1933 would have entered the public domain by now. (One more year to go on any designs that were <em>new</em> to that 1934 catalog ;-)</p>
      <p>So, from several angles, it seems that the legality is fairly clear. But this does not address any of moral considerations or intrinsic creative value of such an undertaking. If you haven't already done so, read and consider the various motives and approaches that John Downer categorizes in his <a href="https://web.archive.org/web/20150123060053/http://www.emigre.com/Editorial.php?sect=2" rel="nofollow">Call It What It Is</a> article.</p>
      <p>But hey, Benguiat revived Benton's Souvenir for ITC in the ’70s and that was well-received -- for a while, right? On the other hand, look what happened after that ;-) As Eben said, context is important. Souvenir in the ATF 1923 catalog looks really nice, IMO. Souvenir in the ’70s seems cliche now. Souvenir these days would be downright dorky.</p>
      <p>Don't get me wrong. I'm not slamming revivals. (Heck, I'm about to embark on one of my own -- well, more of a restoration than a revival, really.) I'm just pointing out some of the considerations that anyone should think through before doing so.</p>
      <p>-- K.</p>
