    html: |-
      <p>I think James meant to put a "not" in the second clause of his first sentence. Technically, the design of a typeface is not copyrightable in the US. </p>
      <p>There are some circumstances under which a design is patentable. I believe some ATF faces received patents. But patents are much shorter lived than copyright and would have expired. </p>
      <p>IIRC, for a while someone (ATF-Kingsley, I think it was) was maintaining the registration of the trademarks. But trademarks can lapse if the mark is abandoned. You would have to undertake a trademark search with the USPTO if you were thinking of retaining the original name.</p>
      <p>-- K.</p>
