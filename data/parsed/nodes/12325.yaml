    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Gábor Kóthay</strong></p>
    <p>Gábor Kóthay was born July 19th, 1962. He works as a graphic designer and teaches second-form art students. Typeface design was a hobby for many years but it has become an everyday routine with <a href="/wiki/Fontmunk%C3%A1sok" class="freelinking" rel="nofollow">Fontmunkások</a> and <a href="/wiki/Fontana%20Type%20Foundry" class="freelinking" rel="nofollow">Fontana Type Foundry</a>. He lives with his wife and two daughters in a suburb of Szeged, a sunny southern Hungarian town that lies on the banks of the Tisza river.</p>
    <p>Typefaces by Gábor Kóthay: <a href="http://www.p22.com/ihof/ambient.html" rel="nofollow">Ambient</a>, <a href="http://www.veer.com/products/typedetail.aspx?image=FOT0000074" rel="nofollow">Incognito</a>, <a href="http://www.p22.com/ihof/ladanse.html" rel="nofollow">La Danse</a>, <a href="http://www.p22.com/ihof/schwartz.html" rel="nofollow">SchwartzKopf</a>, <a href="http://www.fountain.nu/catalogue/zanzibar.asp" rel="nofollow">Zanzibar</a>, <a href="http://www.p22.com/ihof/zephyr.html" rel="nofollow">Zephyr</a></p>
