    <p>Hi all,</p>
    <p>I'm using FL 4.5, and I'm doing the kerning using classes to produce a opentype font. Everything is fine apart form this output I get when I compile the opentype features.</p>
    <p> Start of new pair positioning subtable; some pairs may never be accessed: [Y Yacute Ycircumflex Ydieresis] [agrave aacute acircumflex atilde adieresis aring amacron abreve] [WORK:Applications:FontLab 4.5:fontlab.fea 114]</p>
    <p>I've checked the classes to make sure there is no duplications, and the kerning for the key glyph. The kerning seems to be working fine, so I carn't work out what's causing this output.</p>
    <p>s.</p>
