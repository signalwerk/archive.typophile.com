      <p>&gt; Isn’t FL 4.6 a free upgrade?</p>
      <p>Even if it was, it is not anymore. We’re not issuing any free updates for FontLab 4.5 or 4.6 anymore. Even though they did help in some matters, these versions of the software are still behind the current font format needs. Especially if you’re making OpenType fonts, I’d definitely consider upgrading to FontLab Studio 5, since previous versions of FontLab simply did not completely fulfill the "best practice" recommendations for OpenType fonts. Unfortunately, the reality of OpenType for the last 2-3 years has been that the OpenType specification has been frozen and a lot of un- or underdocumented fixes and recommendations were issued by Adobe and Microsoft. FontLab Studio 5 takes these into account. </p>
      <p>A.</p>
