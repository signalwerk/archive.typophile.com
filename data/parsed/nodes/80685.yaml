    html: |-
      <p>After some research: the florin isn’t used in any programming language (at least the most popular 50 according to TIOBE), but Mac users use it for “folder”. I’ve tried a few alternatives for the <em>f</em> and the nicest one was B with a one-pixel descender.<br><img src="/sites/default/files/old-images/font_cc2_6232.png"></p>
      <p>The <em>&amp;</em> looks a little squished now, but it doesn’t disturb the surrounding letters anymore.<br><img src="/sites/default/files/old-images/font_cc2b_3536.png"></p>
