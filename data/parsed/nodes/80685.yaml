    <p>I've created a narrow monospaced bitmap font for programming and plan to release it to the Public Domain. Some inspirations were Espy Sans, Dina and a few 5×7 dot matrix fonts I've found on the 'net.</p>
    <p><img src="/sites/default/files/old-images/font_cc2_6733.png"></p>
    <p>Any suggestions will be appreciated.</p>
