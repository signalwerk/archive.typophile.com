      <p>&gt; Everyone should be socially responsible</p>
      <p>Hear, hear.</p>
      <p>Specifics to type design are indeed hard to come by, but I can think of these:<br>
      - Participating in (or even initiating) fund-raising efforts, like FontAid.<br>
      - Functionality is a reflection of sobriety, something I for one feel we need more of today. So to me making a text font is more socially responsible than making a display font for example.<br>
      - The making of fonts for endangered writing system - and really most of them are! For example when I make Armenian fonts, it's not for money, it's to help keep my culture alive. And I try to apply that sensibility when making fonts for scripts besides my own. And some future generation will have to do that for Latin...</p>
      <p>hhp</p>
