      <p>I would regard it as legitimate to try to restrict use of a typeface in, say, an advertising logo for something political, religious, or carcinogenic... but highly inappropriate to restrict use of a typeface as a text font for any purpose.</p>
      <p>The idea being that in the former use, the typeface itself, and hence its designer, is becoming identified with something, while in the latter there is, among other things, a First Amendment issue.</p>
      <p>Does anyone else see this as a valid distinction? Of course, one could say that this distinction is more concerned about the self-interest of the type designer for his own reputation than with social responsibility... but that's another can of worms.</p>
