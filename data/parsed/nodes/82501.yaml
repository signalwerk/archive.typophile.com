      <p>I totally agree with John Hudson when he stands that "social responsibility begins in the workplace". It's not only a matter of doing a good job or just doing it well. It's about how we could contribute as we — type designers — are part of our society. We're not living in another Galaxy (although it might seem so ;-)<br>
      According to this responsibility, in the last years, I've been involved in Arabic, taking into account the Arabic heritage of my country (Spain) and looking for some original historical roots that could help when designing an Arabic-Latin script. A research has been made in order to fulfill some basic requirements. It's not easy, indeed. But the most important thing is establishing a cultural "bridge" between our spanish culture and the increasing arabic population that is now living in Spain.<br>
      Immigration is becoming a big problem in my country. A real stuff within the political agenda. There's a lack of tools in order to improve a better understanding among our cultures. I believe that typography, as a tool for communication, can help. That's the reason why I got engaged in this work. This is only a sample I just wanted to highlight.<br>
      I could also talk about languages like Guaraní that are not considered within the unicode system yet. Type design can support this kind of "unknown" languages throughout the visibility of text.<br>
      I'm sure there're other ways to contribute as part of our responsibility as designers. But, first of all, our responsibility is as people, as human beings sharing the same place.</p>
      <p>Andreu B.</p>
