      <p>Nick: <em>We're starting to see foundries make some serious retail money now, and with that independent financial strength the paradigm that the top type designers sell out to OEMs may change, and more come to realize that doesn't serve our best interests as a group.</em></p>
      <p>That seems to me contradictory. If some foundries are making some serious retail money now, that must either be despite the work that type designers also do providing fonts to OEM distributors, or in some way actually contributed to by that work, e.g. by OEM distributed fonts exposing more potential retail customers to a richness of typographic variety. You've been suggesting for years that OEM font distribution undermines retail font licensing, and yet OEM font distribution isn't getting less while you are acknowledging a growth in retail licensing income. Indeed, not only is OEM distribution not getting less, it is now supplemented by the growth of free and open source font distribution. That ‘serious retail money’ is being made within a diverse font business ecosystem, and without a systematic analysis of how that ecosystem works it isn't possible to say what the actual impact of one area is on another. I don't think it should be presumed that OEM font distribution ‘doesn't serve our best interests as a group’.</p>
      <p>There are things that I instinctively think are probably not a good idea: retailing and OEM licensing the same fonts, for example, which is why I prefer a clean distinction between custom fonts and retail fonts, although recognising that product-specific OEM distribution may actually create a retail demand among users of other products, as was the case with the Microsoft C* fonts. [In that case, the issue is not of OEM negatively impacting retail, but of custom font development contracts not providing for the original designers to receive a share of subsequent retail licensing, in this case by a licensed third party. Something for people to think about when contracting custom font work.]</p>
      <p>Another thing I think is wrong is the exploitation of libre and open source fonts by multi-billion dollar corporations like Google, who derive value from those fonts far in excess of the peanuts that they only sometimes offer to type designers. I think it is naïve to think that application of the free software model to creative works within a capitalist economy will result in anything other than the exploitation of those works by corporations whose capital resources enable them to leverage far more value from those works than the individual creator can. Giving away your fonts to people who can and should pay for OEM licensing is flat out stupid.</p>
