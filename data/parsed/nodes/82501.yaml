      <p>There are a lot of professions whose connections to social responsibility are hard to see. Would the world carry on fine if no new typeface designs were produced in the next 50 years? We would be able to 'survive' without them, but quality of life would be diminished, the same way as if there were no new board games, flavors of ice cream, styles of clothes, or varieties of architecture. Creative professions push the culture forward, make people happy, and increase quality of life, and it's hard to discount that.</p>
      <p>At the same time, I have been interested in how type design relates to the greatest threat of the 21st century, climate change. Unfortunately, for this particularly important issue, type design doesn't seem to offer much help. New type designs could help in communicating environmental issues through posters, videos and interactive media, but it seems the thousands of existing, fantastic typefaces would be more than up to the challenge. Graphic designers appear to be able to have more social influence than type designers, who make the tools designers use.</p>
      <p>David Berman's book looks good, I'll have to check it out!</p>
