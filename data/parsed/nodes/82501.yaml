    html: |-
      <p>Nick: <em>AFAIK, the otherwise-available fonts they bundle are not owned by type designers.</em></p>
      <p>Ross owns Euphemia and Plantagenet. They are distributed under license by Microsoft and Apple. Other fonts we have made for Microsoft as custom fonts, which they own outright (see below). </p>
      <p>Recently we were approached by someone representing Google who wanted us to release Euphemia under a libre license for hosting on the Google web font server. I, after my fashion, gave them the long explanation of why we wouldn't be doing this and how I think the naïvité of free software enthusiasts is being taken advantage of by corporate capitalists. Ross gave them the short response: Google can obtain a corporate distribution license if they want, and will pay no less than Microsoft and Apple.</p>
      <p><em>That's a moot point. The fact is, the client is acquiring the intellectual property that the type designer has created, and could have just as easily provided under a less exclusive contract.</em></p>
      <p>I don't think it is a moot point, because in such cases the intellectual property in question would not have existed other than as a result of the contract. This is not speculative work or work produced and then licensed: it is contracted work, and since the client is specifically interested in owning such rights that is what they are a) looking to contract and b) willing to pay for.</p>
      <p>It isn't the case that the intellectual property inherent in the contracted work 'could have just as easily provided under a less exclusive contract'. If it was that easy, don't you think we would regularly be doing so? The people with the money and the freedom to contract with whomever they choose are in effect able to dictate what it is that they will purchase. We can decline the contract, but we can't really dictate it. I suppose if there were an association whose bylaws prohibited members from selling intellectual property rights outright, then members could attempt to dissuade clients from seeking such and accept less exclusive terms of use, but I suspect the outcome would simply be that the clients would go elsewhere and contract with non-members, and probably at lower rates for poorer quality.</p>
      <p>I believe the contracting of a private, custom typeface to which the client assumes all rights is a legitimate arrangement providing that the fee represents to the designer adequate remuneration for both the work done and the value of the intellectual property. Note also that the client assumes not only the rights but the responsibilities for defending and enforcing them.<br>
      _____</p>
      <p>With regard to the notion of a professional association, I think the two dominant modes of type design work that I outlined above present a problem. The artisan mode suggests something like a guild, in which the responsibilities and rights of members at different levels of the the type business -- masters, journeymen and apprentices in the traditional language -- would be codified. But the proper organisation for wage workers in the capitalist mode is the trade or industrial union. I look forward to the arguments of Monotype management that type designers and hinters should not be members of the same union.</p>
