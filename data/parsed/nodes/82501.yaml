      <p><cite>the First Amendment of the US Constitution says that government will not enact laws to limit the freedom of speech. It doesn't put any onus on private citizens to materially provide for the free speech of others</cite></p>
      <p>Correct. </p>
      <p><cite>aren't all font EULAs documents (contracts actually) that outline how and under what circumstances the font software may be used</cite></p>
      <p>Even a legal EULA provision is only as good as one's ability to enforce it, and use-based restrictions are difficult that way. You can't know what people are doing with your font at all times, everywhere. (Though I'd like to have a EULA provision that prevents horizontal scaling of more than ±10%.)</p>
      <p>Also, if you dinged someone under your EULA for a forbidden message, the likely result is that they'd pay you to settle the dispute, so you'd end up profiting from their misuse anyways. Maybe the EULA would specify that they'd have to donate to a nonprofit organization with a diametrically opposed viewpoint (!)</p>
      <p>But aside from the practical issues, I agree with DB that in general, social responsibility is an awkward duty to impose on type designers. Responsibility can only be manifested through choices. The type designer's zone of choices is the typeface itself; everything beyond that is someone else's choice.</p>
