      <p>Nick: <em>Those industry organizations in which we do participate (e.g. ATypI) represent a variety of interests, many of which—such as the major corporate sponsors—conflict with those of type designers.</em></p>
      <p>And even if not directly conflicting are certainly not the same interests. ATypI used to be a professional organisation of type companies -- a cartel in fact --, but is now a social and educational organisation, open not only to people who work in the type business but also to those who buy type, work with type, like looking at type, etc. There are, broadly, three sets of economic interests represented -- employers, employees and customers --, all at odds with each other.</p>
      <p>As I see it, there are two major mode of work for type designers. One is a modern capitalist mode in which a type designer is a wage worker employed by people whose own business is not designing typefaces; in this category are those designers employed at companies like Monotype Imaging and Linotype, i.e. companies whose owners are not type designers. The second is the older artisan mode, in which master type designers own their own businesses and employ journeymen type designers (and may take on apprentice type designers too), albeit without the regulation provided by a guild (a journeyman is defined by his employment, not by certification). A good example of this mode is H&amp;FJ.</p>
      <p>At Tiro, we've tried to come up with a third mode in which workers individually own the means of production and no one is an employee. I don't imagine this would work for everyone: one has to value freedom higher than stability. No one is bound to Tiro, but by the same token we can't guarantee continuous work to all our associates. Then again, the stability of employment under those other modes is illusory, as those laid-off type designers who write to me asking if I have any work for them surely know.</p>
