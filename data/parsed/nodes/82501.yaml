      <p>Nick: <em>It's a one-time pay-off to surrender one's intellectual property.</em></p>
      <p>There are three distinct models of OEM font licensing:</p>
      <p>1. Non-exclusive corporate distribution license. In this case one isn't surrendering any intellectual property at all: one is simply granting a license that permits redistribution. Such a license may be linked to a specific volume of product for bundling purposes, specific number of downloads, etc.</p>
      <p>2. Exclusive corporate distribution license. In this case one surrenders the right to sell licenses to other parties, whether corporate or retail; one may or may not surrender other intellectual property rights up to an including all rights, or one may surrender some rights only for a limited period of time. Obviously the size of the fee should be commensurate with the rights purchased.</p>
      <p>Note that both of these models presume that what you have is a creative product for rights licensing, and the only difference between this and retail font licensing is the size of the fee and the rights granted under the license. OEM licensing of products in this way does not necessarily involve surrendering any intellectual property.</p>
      <p>3. Custom or proprietary font development. This is the area I work in most of the time, and I see it as something quite distinct from corporate distribution licensing. This is contracted creative work, not product licensing, and the disposition of intellectual property rights varies considerably. Some clients want to completely own their custom typeface and be able to do anything with it that strikes their fancy, including distributing or even selling licenses themselves; in other words, they want to include in the contracted fee a transfer of all intellectual property rights. But this is not the case of surrendering intellectual property to the client -- as would be the case if one were selling rights to an existing product --, because the intellectual property is only coming into existence because of the contract. Some clients do not see a need to assume all rights to the custom font, so long as they have the rights to use the font in the ways in which they need it, and hence the font developer gets to retain some or most rights, including the right to license the font to other customers, either immediately or at some future date after a period of exclusive use by the client. That's my favourite kind of work, because it means that all the font development is paid for up front, while the possibility of future income is retained. Obviously the fee for work under such terms is lower than if the client wishes to own the product outright.</p>
