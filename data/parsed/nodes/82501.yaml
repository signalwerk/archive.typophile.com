      <p>I don't see the purported First Ammendment issue with James' EULA restriction. He is making and selling a licenses to use a product and reserves the right not grant such a license for certain uses. No one's freedom of speech is dependent on the right to license James' product. It's not as if he's making the only fonts in the world.</p>
      <p>Further, the First Ammendment of the US Constitution says that <em>government</em> will not enact laws to limit the freedom of speech. It doesn't put any onus on private citizens to materially provide for the free speech of others. About as close as any jurisdiction gets to that is the California ruling that shopping malls, although private property, function as public spaces and hence owners cannot prohibit peaceful assembly, although they may limit them.</p>
