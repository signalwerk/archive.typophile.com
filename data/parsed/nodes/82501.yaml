      <p>For me, social responsibility begins in the workplace. I don't think there is necessarily a single model of social responsibility to which type designers should conform, but certainly the way in which you organise your working relationships with other people should not be at odds with your beliefs about the organisation of society. Beyond the workplace, in relationships with other people and institutions, things get more complicated. For instance, Tiro operates as a free association of individuals in which no one profits from anyone else's labour, but most of the work we do is for companies that are based on capitalist models because, well, they’re the people who are paying.</p>
      <p>There was an old Typophile thread on the subject ‘Who wouldn’t you work for?’, i.e. what clients or kinds of work would you turn down on ethical or other grounds.</p>
