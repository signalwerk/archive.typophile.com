      <p>In the 1980s I attended a talk by F.H.K. Henrion in which he listed the responsibilities of a graphic designer.<br>
      I can't remember them exactly, but was impressed by the scope.<br>
      Something like this:<br>
      - Do original work, to a high standard of quality<br>
      - Educate the next generation of designers<br>
      - Organize one's peers (industry bodies, trade shows, conferences)<br>
      - Promote the profession to the trade and general public (public relations, competitions)<br>
      - Cause marketing (he had designed wartime propaganda posters for the Ministry of Information (UK) - possibly "Keep Calm and Carry On"- and later  volunteered his services to causes he believed in, eg designing posters for Oxfam)</p>
      <p>Type designers have some catching up to do, but bear in mind that type design has only very recently become a viable full-time profession for more than a handful of people.</p>
