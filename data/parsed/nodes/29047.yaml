    <p>Greetings for All Developing Typophiles<br>
    Arabs unnecessarily do place Zamma before every Waw, Fatha before every Alif and Kasra before every Ya. And they use both tooth-like hamza + mark on or below Alif Though the mark alone indicates Hamza.<br>
    I have been battling the web so that Arab make the change, but the only answer I get is:<br>
    Our Fathers were on a course, and we are have to follow their footsteps?</p>
    <p>Now, it is the turn to the latin-oriented.<br>
    Triggered by the still-hot topic <a href="http://typophile.com/node/28777">Do ligatures improve readability?</a> that I have been monitoring from the very beginning, I would like to ask:<br>
    Why is there a dot on i and j? Why not dotless and why not using one dot for ï..?<br>
    At least the “fi” problem (if any) is half-solved?! Do dots improve readability? Any other reason?<br>
    Thinking Aloud, Allowed?!</p>
