    html: <p>The story on the i and j, IIRC, is that as black letter, especially textura evolved, it became hard to distinguish an i from the stems of the n, m, etc. And to distinguish it, they put a diagonal line above it. This evolved into the dot. The j was originally just a swashed i at the beginning of words. It was adopted in languages other than Latin, such as English, for a different sound than the i, and so became a separate letter.</p>
