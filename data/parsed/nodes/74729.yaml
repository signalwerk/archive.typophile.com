      <p><em>ontLab scripting features didn't tell me position of all nodes -&gt; using postscript curves, there is no data about control points (handles) of nodes in the 'nodes' list of a glyph</em></p>
      <p>No, you have to iterate through each node’s <code>points</code> list to get all the point positions.</p>
      <p>Check out the FontLab Python documentation if you haven’t already: <a href="http://www.e-font.de/flpydoc/" title="http://www.e-font.de/flpydoc/">http://www.e-font.de/flpydoc/</a></p>
      <p>There is <code>Glyph.Rasterize()</code>, but I'm not sure you can control the ppm size.</p>
      <p>Hope this helps,<br>
      Jens</p>
