    html: |-
      <p>You need to calculate the offsets yourself, based on the original glyph's bounding box. I'm not sure how you'd expect it to work directly, i.e. how e.g. you'd expect the baseline to be "stored" in the image for a letter such as "p"? </p>
      <p>When you're generating a background image in FontLab Studio, the image is rendered at the ppem size determined by FL.Options().BitmapSize. If you set BitmapSize to 1000 then one pixel in your image will correspond to one font unit in a 1000 UPM font (Font().upm). If you set BitmapSize to 200, then one pixel will correspond to 5 font units in such a font. So there you have the scaling factor you need. </p>
      <p>By calling Glyph().GetBoundingRect(), you'll get the actual position of the glyph drawing within the design space (in font units). By querying for Glyph().width, you get the advance width. From the difference of GetBoundingRect().ll.x and .ur.x, and Glyph().width, you'll easily get the sidebearings, and from .ll.y, you'll get the position relative to the baseline. All in font units, but you can then convert them to pixel dimensions by comparing Font().upm and Options().BitmapSize. </p>
      <p>As for the maximal y dimension to which you should crop your images, there are various scenarios possible. You could crop to the height of the font's bounding box -- which you'd need to calculate yourself by iterating for Glyph().GetBoundingRect() for all glyphs and choosing the maximal value -- or you could crop e.g. to one of the vertical dimensions (such as OS/2.WinAscent and OS/2.WinDescent, but then you're risking that some of your glyphs may be cropped too much. </p>
      <p>It all depends on what you really need this information for. </p>
      <p>Best,<br>
      Adam</p>
