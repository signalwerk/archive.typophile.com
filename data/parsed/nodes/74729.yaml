  html: |-
    <p>Hi there</p>
    <p>I'm writing a script for optimizing my kerning algorithm. so I need to get bitmap outputs of glyphs in FontLab. I tried to render it using PIL but FontLab scripting features didn't tell me position of all nodes -&gt; using postscript curves, there is no data about control points (handles) of nodes in the 'nodes' list of a glyph. So images that the script generates are not precise enough to expand kerning scale.</p>
    <p>Is there a way to get such image directly? fore example to get an image of a certain glyph in a given em. I know FontLab uses FreeType to render glyph shapes. I have installed sip library. so could I use some API of FontLab to accomplish?</p>
