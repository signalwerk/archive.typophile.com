    html: <p>The only one who could give you "the exact and precise font" is probably the manifacturer that machine-engraved the piece in the seventies/eighties (<a href="http://www.marklev.com/2014/05/ml-1-preamplifier.html">http://www.marklev.com/2014/05/ml-1-preamplifier.html</a>). But it would almost certainly be a custom typeface for engraving machines, in a proprietary format and with no direct relation with any digital font for personal computers.</p>
