      <p>faithhiend, I'm very sorry nobody has identified it. I still think it's a custom job and has never been a digital font. Almost one week here and still no positive identification and unsolved at <a href="http://www.myfonts.com/WhatTheFont/forum/case/245562" title="Click to visit an external URL." class="freelink freelink-external freelink-external">WhatTheFont Forum</a> too... I think it'd be not so hazardous to definitely consider it as a custom logo work (meaning not a font).<br>
      Now depending on what you need, you have 3 options to reproduce this lettering:<br>
      - vector logo freely available to download <a href="http://here" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://here</a><br>
      - redo it from scratch which not be very long as it's monolined and quite geometric/symmetric/squared (starting with the <a href="http://www.myfonts.com/WhatTheFont/forum/case/245562" title="Click to visit an external URL." class="freelink freelink-external freelink-external">previous sample</a> I linked to)<br>
      - adapt one of my previous suggestions (I'd probably start with <strong><a href="http://www.dafont.com/arkitech.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Arkitech</a> Light</strong>)</p>
