      <p>'mark levinson': no perfect match even with a better <a href="http://www.myfonts.com/WhatTheFont/forum/case/245562" title="Click to visit an external URL." class="freelink freelink-external freelink-external">sample</a> which makes me thinking it could be custom(ized) (or a freebie maybe); alternatives: <a href="http://www.myfonts.com/fonts/urw/theo-ballmer" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Theo Ballmer</a>, <a href="http://www.myfonts.com/fonts/studiocharlie/stereotype" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Stereotype</a>, <a href="http://www.myfonts.com/fonts/northernblock/logan-five" title="Click to visit an external URL." class="freelink freelink-external freelink-external">LoganFive</a>, <a href="http://www.myfonts.com/fonts/flat-it/design-system" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Design System</a>, <a href="http://www.myfonts.com/fonts/typodermic/nesobrite" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nesobrite</a>, <a href="http://www.dafont.com/arkitech.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Arkitech</a> and <a href="http://www.dafont.com/neogrey.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Neogrey</a>, <a href="http://www.dafont.com/birdman.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Birdman</a>, <a href="http://www.dafont.com/a-space.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">A Space</a></p>
      <p>WOODBRIDGE CONNECTICUT USA: <a href="http://www.myfonts.com/fonts/mti/arial" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Arial (Rounded)/Arial Narrow</a> (or squooshed) might work;</p>
      <p>Digits and rest of the lettering: very "<a href="http://www.myfonts.com/search/trade+gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Trade Gothic</a>/<a href="http://www.myfonts.com/search/news+gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">News Gothic</a>/<a href="/node/add/wiki?edit%5Btitle%5D=%5B%5Bhttp%3A//www.myfonts.com/search/bell%2Bgothic" title="//www.myfonts.com/search/bell+gothic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bell Gothic</a>/<a href="http://www.myfonts.com/fonts/fontbureau/griffith-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Griffith Gothic</a>. Reminds me also a lot of <a href="http://typophile.com/node/79271" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Leroy Lettering machine</a>;<br>
      alternatives: <a href="http://www.dafont.com/engineering-plot.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Engineering Plot</a>, <a href="http://www.myfonts.com/fonts/nicksfonts/planscribe-nf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Planscribe</a>, <a href="http://www.fontspace.com/character/leroyletteringlightbeta01" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Leroy Lettering Light Beta 01</a>, <a href="http://lineto.com/The%20Fonts/Font%20Categories/Text%20Fonts/Gravur%20Condensed" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gravur Condensed</a>, <a href="http://www.myfonts.com/fonts/jnlevine/rendering" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Rendering</a>, <a href="http://www.myfonts.com/fonts/cercurius/simpliciter-sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Simpliciter Sans</a>, <a href="http://www.myfonts.com/fonts/urw/gordon/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gordon</a>, <a href="http://www.myfonts.com/fonts/btn/register-sans-btn" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Register Sans</a> (open counter digits), <a href="http://www.myfonts.com/fonts/larabie/primer-print" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Primer Print</a>, <a href="http://www.myfonts.com/fonts/typodermic/report" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Report</a>, <a href="http://www.myfonts.com/fonts/bedoodle/oxymoron" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Oxymoron</a>, <a href="http://www.dafont.com/tgl-0-16