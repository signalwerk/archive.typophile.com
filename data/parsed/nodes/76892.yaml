    html: |-
      <p>These could have been done by an old sign shop, either using a digital font that is specific to some machinery of theirs or even some pre-digital system.</p>
      <p>Prismatic is another term for this effect, especially in the sign industry. <a class="freelinking external" href="http://signdna.com/shop/index.php?main_page=index&amp;cPath=1_10&amp;zenid=35d97d8e3f19671a9dad6b394bb72893" rel="nofollow">Sign DNA</a> have a few prismatic fonts that might be a close match, but they don't show a full character set for any of them.<br>
      Letterhead Fonts' <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/quadrex.php" rel="nofollow">Quadrex</a> is fairly close if you use the alternate A. They have a tutorial on creating a <a class="freelinking external" href="http://www.letterheadfonts.com/tutorials/prismaticeffects/index.php" rel="nofollow">prismatic effect</a>. You could apply that to something like one of the heavy weights of <a class="freelinking external" href="http://www.letterheadfonts.com/tutorials/prismaticeffects/index.php" rel="nofollow">Agency Gothic</a>.</p>
    html_clean: |-
