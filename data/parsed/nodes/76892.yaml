    html: |-
      <p>These could have been done by an old sign shop, either using a digital font that is specific to some machinery of theirs or even some pre-digital system.</p>
      <p>Prismatic is another term for this effect, especially in the sign industry. <a href="http://Sign DNA" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Sign DNA</a> have a few prismatic fonts that might be a close match, but they don't show a full character set for any of them.<br>
      Letterhead Fonts' <a href="http://www.letterheadfonts.com/fonts/quadrex.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Quadrex</a> is fairly close if you use the alternate A. They have a tutorial on creating a <a href="http://www.letterheadfonts.com/tutorials/prismaticeffects/index.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">prismatic effect</a>. You could apply that to something like one of the heavy weights of <a href="http://www.letterheadfonts.com/tutorials/prismaticeffects/index.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Agency Gothic</a>.</p>
    html_clean: |-
