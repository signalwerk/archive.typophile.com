      <p>There is also <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_primary_ot/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">FF Primary</a>, which uses overlaying of beveled shadows to create the 3D effect. Hard to see on the web site, but the printed sample in their catalog gives the idea.</p>
