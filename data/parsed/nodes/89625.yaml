  html: |-
    <p>The February edition of the Metal Type newsletter is now out. To view the video, click here:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=17" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=17">http://www.metaltype.co.uk/rail/clicks/click.php?id=17</a></p>
    <p>A number of people are currently looking for assistance in the forum. Don't forget there's no need to register now to post on the Metal Type Forum.</p>
    <p>Colin Ansell needs some assistance identifying some Intertype mould liners (with photo): <a href="http://j.mp/xCuaBj" title="http://j.mp/xCuaBj">http://j.mp/xCuaBj</a></p>
    <p>Mike Gunnell needs a photograph of his name set in type for a website project: <a href="http://j.mp/wcDB0Z" title="http://j.mp/wcDB0Z">http://j.mp/wcDB0Z</a></p>
    <p>Roy Foley needs to find a home for some brand new Linotype mats (still in boxes, with pictures), UK: <a href="http://j.mp/yZFqWt" title="http://j.mp/yZFqWt">http://j.mp/yZFqWt</a></p>
    <p>If you're not on the Metal Type mailing list, you can join here. It's just one email per month! <a href="http://j.mp/n3wkjc" title="http://j.mp/n3wkjc">http://j.mp/n3wkjc</a></p>
    <p>I have recently launched Metal Type Printing. 250 letterpress business cards (to your design) for £75. 750 100gsm A6 flyers (again to your design) for £100. Further details: <a href="http://j.mp/x3sEhX" title="http://j.mp/x3sEhX">http://j.mp/x3sEhX</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
