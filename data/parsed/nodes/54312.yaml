      <p>Thank you Steve.</p>
      <p>The idea that they used the darkest type available sounds very interesting as it shiftes the reasoning from evoking authority to catching attention. I'll read the article to see how the authors support their claim. </p>
      <p>However, as far as America is concerned many papers used blackletter already in the 1790.   According to Kevin G. Barnhurst, John C. Nerone in The Form of News: A History ( Guilford Press, 2002) many papers used blackletter "because [it] provided a visual germanic clue, referring to the Teutonic origin of the English people and their ancient order" (p. 54, book is available on google books).</p>
