      <p>According to Jim Parkinson, blackletter began to be used for newspaper nameplates in the 1860s in England. The papers wanted to attract attention by using the darkest type available, which in most print shops at the time was blackletter. </p>
      <p>See Jim Parkinson, "More than you ever wanted to know about nameplates" in John D. Berry, ed., <cite>Contemporary newspaper design</cite>, 2004, Mark Batty Publisher, 159--169.</p>
