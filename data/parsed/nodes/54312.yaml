      <p>I was about to post more or less exactly what Peter says in his 22sep09 note.<br>
      I don't know that there was any "desire for Teutonic identity" involved, certainly, I've never considered any such reference before except, obviously, in German mastheads.</p>
      <p>The fact that "Blackletter" is also widely called "Old English" is a better clue, and likely one would find English broadsides printed with 'mastheads' in such type back nearly to Caxton. This would then be a simple path to seeing the same structural form persist, if anachronistically, in the New York Times, et al, to the present day.</p>
      <p>Although my favorite "Old English" is BM Harley 2904...</p>
      <p><a href="http://www.british-library.uk/catalogues/illuminatedmanuscripts/ILLUMIN.ASP?Size=mid&amp;IllID=21019">http://www.british-library.uk/catalogues/illuminatedmanuscripts/ILLUMIN....</a> etc... (what an incredible book. I've had the pleasure/honor of paging through this treasure, when I was studying calligraphy under Ieuan Rees in the early 1980s. Ieuan wrote a letter of introduction for me, and I was admitted to the rare book room at the British Library. Would love to get back there some day.)</p>
      <p>The evolution of blackletter's cultural semantics is well documented in Peter Bain's and Paul Shaw's book:<br><a href="http://www.amazon.com/Blackletter-National-Identity-Paul-Shaw/dp/1568981252">http://www.amazon.com/Blackletter-National-Identity-Paul-Shaw/dp/1568981252</a></p>
      <p><a href="http://slowprint.com/">http://slowprint.com/</a> Letterpress for Typographers!<br><a href="http://alphabets.com/">http://alphabets.com/</a></p>
