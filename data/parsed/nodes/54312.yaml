    <p>Hello to All, </p>
    <p>This is my first post here, though I've been reading this forums for quite a time now and found them to be very helpful.There is one topic however on which I am doing research on and couldn't find information on (please correct me if there was a thread on this). </p>
    <p>Are you aware of any article published on the use of blackletter type in American newspaper titles? Why has been the use of blackletter so popular amongst publishers an designers of many diferent kinds of newspapers in the US, big and respected as well as small and local ones?</p>
    <p>I will also appreciate your own thoughts and theories. </p>
    <p>Thank you,<br>
    Marek</p>
