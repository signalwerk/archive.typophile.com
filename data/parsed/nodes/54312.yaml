      <p>Thank you for your response. I thought this might be the line of reasoning -it evokes formality, authority etc.<br>
      But what does it mean "simply looks formal" after all? Why does Americans associate blackletter with authority? It certainly doesn't look very formal to me, but rather pretentious. We, i.e. in Poland, for intance never use it for diplomas etc., and I am not aware of any country in Europe where this would be the case.</p>
