      <p>Interesting.  But I wonder why people would want the link to Germanic history.</p>
      <p>I think the formalness comes in part from the complexity and calligraphic quality of the letters.  I'm talking out of my ass now, but I'd assume in the olden days degrees were considered important enough to be handlettered instead of typeset, and might have been done in an English blackletter.  Once universities started issuing so many degrees that they couldn't economically handletter the degrees, they wanted to maintain the style and simply switched to a blackletter font. This is pure speculation, but might be worth some investigation.  </p>
      <p>Then again, most European degrees I've seen are butt ugly (Spain's top university uses around seven different fonts on one sheet of paper including the largest type in Georgia—a great SCREEN font)... I'll take my pretentious blackletter :)</p>
      <p>Also keep in mind that many things are culturally "learned".  I could definitely see newspapers using blackletter for attention.  But we have "learned" that now for newspapers which are more serious.  I'm thinking about things like the USA Today etc, that use sans serif for their titles which then emphases an idea of blackletter=serious/formal.  Again, just tossing ideas around.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
