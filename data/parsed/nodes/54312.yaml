      <p>@marek and @thompson<br>
      While I don't have references on newspaper history at hand, you might recall that blackletter types were in common use when the first journals appeared, so the idea of authority is most probably based on its early appearance in print.</p>
      <p>I'm not familiar with the Barnhurst &amp; Narone book, but this conclusion seems rather broad, and would look at actual examples of newspapers and see if there is any text in those papers themselves that would support this assertion. Plus recall that blackletter is as much english as german as french etc. by manuscript (pre-typographic) tradition.</p>
      <p>Hope this helps.</p>
