      <p>Indeed, the yellow is frightfull for people actually wanting to read the intro. </p>
      <p>What you’ve done here is trying to match the sensationalism of the pulp-covers in the surrounding design. This could work, but it is not easy. It is hard to match two loudly screaming voices. Maybe you are better off creating a bit of contrast in visual voices. I’d try making the design of the book itself rather restrained, and typographically ’quiet’. This has two advantages - it makes the covers themselves stand out more, and it creates an atmosphere of taking the subject more serious.</p>
      <p>I know this suggestion differs totally from what you have now, but then design is often redesign.</p>
