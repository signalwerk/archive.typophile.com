    <p>i have attached a PDF containing the introduction for a book i am designing. i’m not too thrilled with my present layout and i could really use some suggestions on how to make improvements.</p>
    <p>the main body of the book consists solely of illustrations from pulp paperback covers along with their corresponding captions. i don’t know if the intro needs to be more visually dynamic and sensationalistic to reflect the content of the book’s imagery, and if so, what i could do to achieve this. it seems pretty stale and boring right now.</p>
    <p>any suggestions and comments are greatly appreciated.</p>
    <p>thanks</p>
    <p>gregg</p>
