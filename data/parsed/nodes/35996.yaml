      <p>What kind of demographic you aiming for? </p>
      <p>Of what you've drawn, the tree logos are less logos and more illustrations. That's not necessarily bad, but does greatly restrict how/where they can be used. I'm with alainch and I think the blue-type option is the best of the lot. I'd suggest not even having the children to simplify the mark.</p>
      <p>Fisheye's suggestion definitely takes the vibe into a more upscale target. Perhaps something like that combined with an etching-type illustration of an actual mulberry bush might be something worth trying.</p>
