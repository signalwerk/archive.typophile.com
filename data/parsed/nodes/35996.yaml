    html: |-
      <p>My favourite is by far the one written in blue with the tree. On the other hand, I am not certain for the long string of children with lots of colors. I would not put them. Otherwise, I would go simpler with less colors and less children.</p>
      <p>For the others, the mixture of two types sans serif is not happy. You should remain with the same one but in another grease or choose another type with serif which mixes well. The stroke of the bunch of berries is also too much black and bold. It clashes much as a whole.</p>
      <p>Personally, I would not use the clothesline. That recalls too much at laundry days, which is not especially an exciting activity.</p>
      <p>However, they are very good ideas and a very interesting project. I hope to see the final result.</p>
      <p>- - -</p>
      <p>alainch</p>
