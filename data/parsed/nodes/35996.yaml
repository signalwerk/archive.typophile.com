      <p>I like the direction your going in with the silhouettes of children. I also like the font used. Just an idea, but what if the children made up tree branches and leaves or the children playing around/on the tree or maybe a kid(s) on a tire swing? A graphic approach, not as animated as clothes hanging on the three. I would also narrow down your color seletion on this logo and include the 'children's boutique' tag.</p>
      <p>hola!</p>
