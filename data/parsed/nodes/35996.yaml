      <p>It's rather hard to make an opinion on the upper logos, because they are too close to each other and without any order.</p>
      <p>But on my second look I wouldn't go with any. Maybe the one with kids, but it should be heavily changed. The one with circles/bubbles/mulberries(?) doesn't imply on anything.</p>
      <p>I like fisheye's idea but it may be a bit too adult. If the demographics are rich people, than even this could work.</p>
      <p>But be very careful about the logo detail. Remember that this logo will probably have to be stitched on clothing etc. and you have to keep that in mind too.</p>
      <p>The tree on the logo with kids is the only mark that could possibly be used as a logo in the forms you've presented.</p>
