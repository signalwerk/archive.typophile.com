      <p>I think you need a typeface more reminiscent of children's books. I would probably find something used widely the 19th Century, like Baskerville for example. This, I think, would make for a softer, more sentimental mark. I've always found design related to children to be most lasting when it emphasizes charm and sweetness rather than fun and playfulness. Fun and playful graphics and type tend to have a very short shelf-life and that doesn't make for good brand-building.</p>
      <p>Here I used Baskerville 10 along with some included ornaments, though if I were designing this logo, I would probably draw some ornaments of my own that are a little less formal.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mulberry_3619.gif"></div><p></p>
