    html: "<p>My standard approach is two type families for one client nonprofit agency: the main, a serif workhorse with plenty of weights and both lining and oldstyle figures, easily switchable (but never on the same job). Then, for highlights and sidebars, a well-matched sans. But after a few years, as PattyFab says, you get tired of those faces, but the client is happy and doesn't want to re-invent the wheel, so you're stuck. I used Bitstream Arrus as soon as it was released and got tired of it within three years--no fault of Arrus. But there's too much happening in type today to limit yourself to a handful of families, as Vignelli did years ago.</p>"
