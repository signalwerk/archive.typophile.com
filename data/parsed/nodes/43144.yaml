      <p>Hello MT. I agree 100% with the you about exploring. It's oxygen for a typo or designer. Otherwise we'd never feel the drive to create sommthing new and totally original. </p>
      <p>But sometimes it can be just as rewarding (and more challenging) to explore a small back yard for nuggets as to explore a massive wilderness. </p>
      <p>I spent the first ten years deliberately seeking something new with fonts hardly anyone had used - I fewltI owed it to myself to find something recognisable new for every project - then I saw a 30x20 sheet of stuff a design student had done with Bembo and it blew my socks off - totally fresh, immaculate new ways with line spacing and kerning, wild indents etc.</p>
      <p>I've been playing around with Gill lately - chopping back ascenders and descenders - pairing Gill headlines with bold heavily leaded u/lc Perpetua for the body copy, squashing, stretching, metal spacing etc - add colour and suddenly fonts I thought I'd exhausted in my first moths out of college jumped up another level or two. </p>
      <p>It was like havin learnt all the rules I could now decide which rules to break. But the important thing was probably to know which rules to break.</p>
      <p>It just seems that now, with untold thousands of fonts available, young designers tend to switch font for each job almost as a point of honor - and never really get to extend the infinite possibilities that a font with a really big range of weights and styles can offer.</p>
      <p>I don't say there is a right way to approach choice of fonts or a wrong way.</p>
      <p>Just interested to think that if all the fonts in the world except five or six suddenly disappeared off our screens tomorrow which ones you'd keep. And whether that'd slow you down as a designer or simply add to the challenge.</p>
