      <p>i'm not nearly as prolific or knowledgable in print design as most folks here, but when i begin considering fonts for a given assignment i start by setting the words, headline, or sample in a variety of extreme variations, just to see how they feel.</p>
      <p>even if i'm sure a title or word demands a script, for example, i'll set it in several scripts, a chunky sans, lowercase serifs, circus type, whatever. i want to see it take on unexpected qualities, even if i drag it back to an understated and perhaps more predictable solution.</p>
      <p>usually my initial instincts are confirmed but there are surprises. i'm essentially self-taught, so i may be wasting time in my round-about methods, but i feel confident about the results and i enjoy the process.</p>
      <p>i'm usually designing for film or video titles where the criteria are rather different than for print, but i always print out many test groups and examine the words on paper in a variety of fonts, as that retinal experience yields a unique kind of information about the choices.</p>
