      <p>As a letterpress lover who works with lead type, I prescribe to the limitation philosophy, in part because I have (or had) no choice. But, because I really enjoy setting type by hand, and because I don't like to find reasons to bitch, I decided to embrace that limitation, and in doing so have become an advocate of having a "house typeface," or a library of "house fonts." (In my case it's the Century family and News Gothic by MF Benton...I feel lucky to have this stuff in metal because I believe it's classic American type.)</p>
      <p>Now that I've entered the digital age and have an unlimited number of options (well, limited I suppose by the pocketbook, but digital fonts are a lot cheaper and lighter and smaller than lead type), I've made a conscious choice to stick to my house fonts when possible, which are dictated by my metal type collection.</p>
      <p>HOWEVER...I operate as a private press, primarily, and I like the signature that my chosen house fonts give to my work. When it comes to freelance work for clients, I look first to my house fonts, but allow myself to explore other options whenever necessary.</p>
      <p>This means that limiting oneself to a specific set of house fonts is, in a way, branding your designs, which may or may not be something a person wants to do. I think there are clients who might appreciate it; potential clients may choose you as a designer because they like your "brand." On the other hand, there are clients who will have no interest in working within your own personal-taste-driven typeface choices.</p>
