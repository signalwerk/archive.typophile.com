    <p>Do you agree that a good designer really only needs five or six families of types to explore - for me it is Eric Gill's Sans in its mnay forms - plus his father-in-law Edward Johnston's charismatic and ground-breaking Sans for the London Underground (still very much in use and full of beans and new applications today) not to mention Joanna who, as well as being a fine fnt somewhat akin to his Perpetua, was also incidentally Johnston's daughter, hence the font name.</p>
    <p>Top that list of three font families off with Bembo or Goudy etc or whatever you like working with and you have enough type variations and weights etc to keep you busy for a year or three ringing the changes and possibilities.</p>
    <p>By the way, this is my first post - just stumbled on this lovely site while idly Googling for a beautiful alphabet series of lithos by The Beggarstaff Brothers (which I did not find, any help anyone can give will be very gratefully received). I have owned an original for the letter "Y is for Yokel" for fifteen years and want to find out the rest.</p>
    <p>But back to my question: Do you find that, except for specific briefs of course, you come back to certain type families - rather like a musician having a favourite instrument which you get better at playing the more varied ways you use it?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gill_3493.jpg"></div><p></p>
