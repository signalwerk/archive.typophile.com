      <p>That was nice Chris, good text for a type specimen...?</p>
      <p>I worked as an advertising agency art director in the 1980s. An agency would have many clients, and each had its own typeface. The most fun work I did was for the Ad Club of Toronto, which organized monthly lunchtime speaking events. One year my boss was the chair, and every month I'd be called upon to design a flyer to be mailed to members, advertising the upcoming event. This was an imposition, as I wasn't remunerated, so I rewarded myself by indulging in using a different set of typefaces each time (ah yes, the old pro bono accommodation). One month Folio Extended heads with Fairfield text, next month ITC Fat Face Black with ITC Caslon No.224 Medium, and so on. I did settle down a bit in the 90s, and recall Myriad Bold Condensed in a lot of sidebars in financial newsletters. I went to town with Adobe Garamond when it was released, as it introduced the opportunity to apply "real" typography to desktop publishing--small caps, old style figures, swash characters, extra ligatures, titling, &amp;c. For one newsletter I managed to use almost every font in the set, except the one of bold superiors.</p>
      <p>Now that I design type full time, I continue to follow the "so many flavours, try them all" approach, although critics such as Bald Condensed have discerned favorite themes.</p>
