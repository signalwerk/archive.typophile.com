      <p>There are type families that are very versatile, and of course they will get used a lot. Trade Gothic is still kicking because it's so unassuming and utilitarian. But that's not the same thing as being afraid to try new things, or lazy about making decisions. There are new, versatile workhorse families introduced every year. So there isn't really any reason for design to be as stale as it sometimes is (in the US anyway). When someone's portfolio clearly reveals what one font CD they own, or when a designer makes very different campaigns or products all look the same, something is wrong. It's like eating the exact same bland lunch every day. </p>
      <p>It's one thing to explore and truly understand the range of a typeface. That helps you know when not to use it as well as what it can do. Every typeface has a different range of applications. It's another thing to get in a rut with a few comfortable, safe, and reliable families, ignoring everything else. </p>
      <p>I think the method described by Ch is ideal. By trying various unexpected things before committing to a certain typeface, you can learn new things about a few different ones, and experiment with voice.</p>
