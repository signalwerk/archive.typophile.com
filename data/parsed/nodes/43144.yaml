      <p><cite>Note: Book covers are almost a completely separate issue from other kinds of design, including the guts of the same books. </cite></p>
      <p>Not in art book design which is primarily what I do, and what I was referring to. </p>
      <p>It's true that American book design is more marketing savvy (if that's the right word. Marketing driven? Marketing aware?) than European. For example it is not uncommon for European art book jackets to have blank back covers, blank flaps, and no frontispiece.  The same is often true of the interiors. Our french co-publisher often considered our designs too showy, unseemly for the European market.</p>
