      <p>Note: Book covers are almost a completely separate issue from other kinds of design, including the guts of the same books. I agree this is a strong area; it's actually a very vital category of design. But I think that moves away from the original question. Can you get by with very few families? It's certainly possible, but that policy probably works better with versatile families that can handle display as well as text, a few different styles, and a certain number of typefaces that have a neutral quality. </p>
      <p>Hoefler &amp; Frere-Jones show examples on their website combining various families of theirs. It's wonderful and informative because they demonstrate some of the versatility of the various designs and they also show how rich and varied layouts can be when type is combined well. You could stick to one foundry's work, if it is well-rounded.</p>
