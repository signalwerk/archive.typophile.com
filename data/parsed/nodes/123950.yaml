    html: |-
      <p>Sorry, I couldn’t locate a match. It may be custom.</p>
      <p>You’d have to edit it quite a bit, but Camphor gets the broad details right:<br><a href="http://www.myfonts.com/fonts/mti/camphor/<img src=">"&gt;http://www.myfonts.com/fonts/mti/camphor/[img:sites/default/files/old-im...</a></p>
      <p>Also very close:<br>
      Comenia Sans, by Suitcase<br>
      Metric by Klim Type<br>
      Equip Condensed by Hoftype<br>
      TDC Bold by Dalton Maag (has the minimal |r|, |n|, and |p|, but the angle on the stroke ends isn’t a match)</p>
      <p>The Google web font, Ubuntu, is also minimalistic (including the |t|) and comes very close, but again the terminal stroke angle isn’t a match.</p>
