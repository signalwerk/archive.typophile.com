    html: |-
      <p>You're welcome.<br>
      As for Letterhead, they had a many fonts released under their name that they no longer sell at their website. These fonts are now in limbo, endlessly downloaded but without any possible return to the designer. AFAIK, they were never released as "free" fonts. That being said, the design may be in one of these. Google will find them if you look.<br>
      The lettering in the image is representative of fonts from the latter half of the 19th century, mini serifs &amp; spurs being the main features of the basis for this lettering. To find it, or something close, a good strategy is to go though the revival &amp; "inspired by" offerings, at MyFonts, Fontspring or elsewhere,  of Intellecta Design, Font Mesa, Greater Albion Typefounders, Jeff Levine, and HiH. It could also be a revival from the Solo collection, by Solotype or somebody else.<br>
      If you are in luck one of the typophiles is doing this already.<br>
      Don</p>
