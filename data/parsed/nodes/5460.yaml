    html: <p>Jonathan, I can't help you with a ride as I am flying from Oregon, but I saw that JetBlue flies from Long Beach to Oakland for $122 RT, and United and Southwest are both $144RT from LAX to Oakland... $105 RT on Amtrak from LA to SF Union Square... for what it's worth! I know the bus is a bit cheaper, but... well... maybe someone else will chime in about a ride... what days are you planning to travel?</p>
