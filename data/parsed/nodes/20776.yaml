    <p>Hi Guys,</p>
    <p>A new client has approached me to design a new logo/identity for her Interior Design company called “Modern Spaces”.<br>
    Her work is incredible and is very minimalist with a focus on custom made surroundings.</p>
    <p>Anyway- she has provided my with the following sample of particular typefaces she likes. (attached)</p>
    <p>I’m wondering if any one can name them?  : )</p>
    <p>I’m stoked they aren’t Arial!<br>
    Also while we are at it what are some of your all time favorite contemporary type faces?</p>
    <p>I’m looking into “FF Din” where would I find the history behind this font.</p>
    <p>Thanks in advance!</p>
    <p>Jason</p>
