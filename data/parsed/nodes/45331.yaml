      <p>In all my decades in book work, I have never heard it stated as a general rule that a single word in the last line of a paragraph is a bad thing. Not even in the last line of a page.</p>
      <p>When you do leave a single word on that last line, it is a good idea to make sure that single word is longer than the ¶ indent on the following line.</p>
      <p>I also try to avoid breaking the last word of any paragraph, so there will not be some kind of "non-word" on the last line. In well-designed and well-set books, the word "hide" in Lars's example would most likely be longer than the ¶ indent.</p>
      <p>I might make an exception were I told by a publisher that a book I was designing/setting was to be aimed at an audience of people who were not highly skilled readers.</p>
      <p>&amp; I've never been involved in the production of "cheap books" (unless you are making a value judgement about the content). In fact, I've set plenty of ¶s like that in really expensive books. So that argument holds no water, at least when I'm in the room.</p>
      <p>If people are missing words such as Lars's "hide," they are reading too fast. Slow down, savor the text, get involved with it. You'll miss fewer words.</p>
      <p>powers</p>
