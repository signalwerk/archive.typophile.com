      <p>Thanks for sharing the insight. I agree, slowing down helps. It doesn't happen that often but I find it really interesting to hear about this from a book design perspective.</p>
      <p>It may also be a question of reading technique. At work, I often have to read large amounts of text rather fast in order to get an overview of some material. And in order to do that I try to read words in clusters rather then single words. Thus, if there is no cluster for my eyes to latch on to, I may miss something. This is OK when doing the kind of scanning and skimming I talked about. </p>
      <p>Will, what you wrote reminds me that I need to actively remember to get out of that mode when I'm "really" reading.</p>
      <p>Thanks again,<br>
      Lars</p>
