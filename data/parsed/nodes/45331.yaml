      <p>Do you know whether applications such as InDesign or Quark can do this automatically (either as a build in feature or with 3rd party plugins)? It seems to be in the same similar complexity category as the widow/orphan control features that everybody supports. However, I have not seen this yet but I just might not have looked in the right places. Especially as I don't know the terminology for "lone word at end of paragraph. <a href="http://www.typophile.com/node/41152" rel="nofollow">This thread here on Typophile</a> suggests that those loners may be called widows after all. Or "runts" or "stragglers".<br>
      The fact that I usually see them in cheap books could be a hint that most software can't handle those automatically. Or that the switch one has to turn on to handle them automatically is hidden away so that those cheap-book-peddlers can't afford to find it ;)</p>
