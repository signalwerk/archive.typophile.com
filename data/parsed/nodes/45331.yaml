    <p>I've got a question for those doing or knowing book design...</p>
    <p>I noticed, that when I'm reading a book that I sometimes 'miss' the last word of a paragraph when it is alone on a single line at the and of the last paragraph. (Of course, this mostly happens when I'm a bit distracted or otherwise not fully concentrating on what I'm reading.)  I'm not talking about widows and orphans, rather something like this</p>
    <p>... (bottom of recto) ...<br>
       Slowly he slid toward the door, pressing him-<br>
    self more and more into the wall, into the dark,<br>
    away from his enemy. Would this door save his<br>
    hide?<br>
    [turn page to continue on next verso]<br>
    ... next paragraph...</p>
    <p>Thus, I would visually skip or miss the word "hide", then turn the page to read on and think "hey, there was something missing from that last sentence" only to turn back the page and discover that I had missed the last line.</p>
    <p>Two questions:<br>
    Is this something that is so common that there is some term for it? (No, I don't mean ADS ;)<br>
    In case this is common, do some book designers take care about justifying paragraphs in a way that prevents this. E.g. making sure that there are a few more words on the last line of a paragraph when it ends on a recto so it has more visual weight and isn't missed by distracted dorks like myself?</p>
