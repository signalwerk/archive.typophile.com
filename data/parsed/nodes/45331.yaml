      <p><cite>In case this is common, do some book designers take care about justifying paragraphs in a way that prevents this. E.g. making sure that there are a few more words on the last line of a paragraph when it ends on a recto so it has more visual weight and isn’t missed by distracted dorks like myself?</cite></p>
      <p>All book typographers take care in avoiding that. Lesser designers can make that mistake, and it very much is an error to not adjust your way out of that situation.</p>
