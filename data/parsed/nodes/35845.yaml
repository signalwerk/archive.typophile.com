    <p>I have 2 things hanging me up, and I'm hoping somebody can help out.<br>
    This is the first: RUDE RAMS....I have been looking for days and days w/o luck.</p>
    <p>This is the next one. Its called MARKER ACCT.AK.REV.D and is included in a Gerber Scientific Products stencil plotter/cutter, but the font is nowhere else to be found. I can use something close, but that has turned useless as well.</p>
    <p>Thanks a ton!</p>
    <p>Scott</p>
