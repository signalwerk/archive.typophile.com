      <p>Ahh ... I should have gotten this one. That 'A', though, was leading me in the freebie or, as Yves said, the comic lettering direction. But nay ...</p>
      <p>Freehand was a pre-1912 ATF typeface. I know of three digital versions, but the most readily available would be Nick Curtis's <a href="http://www.myfonts.com/fonts/nicksfonts/duly-noted-nf/" target="_blank" rel="nofollow">Duly Noted</a>.</p>
      <p>Oh, and I want to add a definite confirmation that the other font is, as Marcelo stated (and ought to get credit for) Silver Graphics' 'Sanford'.</p>
