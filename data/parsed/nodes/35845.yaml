      <p>I think the RUDE RAMS lettering looks like a blend of a Chancery style, like <a href="http://www.myfonts.com/fonts/linotype/itc-zapf-chancery/" rel="nofollow">Zapf Chancery</a> (which is pretty close) or <a href="http://www.myfonts.com/fonts/bitstream/cataneo/" rel="nofollow">Cataneo Swash</a>, with the M from a Mediaeval font like <a href="http://www.myfonts.com/fonts/linotype/omnia/" rel="nofollow">Omnia</a>. Apply a little customizing of the terminals to make the look unified, and voilá.</p>
      <p>- Mike Yanega</p>
