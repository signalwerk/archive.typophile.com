      <p>Wow. Sorry I couldn't get back to this earlier. </p>
      <p>To clarify, I'm not looking for an outline font or one that has the feather motif (mentioned that at the top). I probably should have mentioned "Falcons" refers to the athletic program at a school. They play soccer, basketball, and volleyball. </p>
      <p>Steven, I looked at Tangier before I posted, but it's shapes are too "stylish" for what I need, as if written with a pen, which is too formal for an athletic program.</p>
      <p>Riccardo, I'm not too fond of Sloe Gin Rickey...</p>
      <p>Frode, Bello is indeed an interesting option, but lacks "sharpness," which would require quite a bit of customization. (Don't get me wrong, I'd love to do it, I just haven't attempted anything this extensive yet.)</p>
      <p>Kent, Casey is the closest of the suggestions to what I had in mind. Love the capitals, but the lowercase again lacks sharpness. (That F is phenomenal, though!) I'll keep this one on the list.</p>
