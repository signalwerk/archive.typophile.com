    html: |-
      <p>Seems to be custom branding by lg2boutique <a href="http://lg2boutique.com/en/work/464/hangar-29-branding" title="http://lg2boutique.com/en/work/464/hangar-29-branding">http://lg2boutique.com/en/work/464/hangar-29-branding</a><br>
      The word HANGAR is in the style of  Sans octagonal/Sans angled.<br>
      For a comparable base font see House Industries United Sans Semi Condensed Black<br>
      <a href="http://www.houseind.com/fonts/unitedcollection" title="http://www.houseind.com/fonts/unitedcollection">http://www.houseind.com/fonts/unitedcollection</a><br>
      and Ryan Clark's Liberator<br>
      <a href="http://www.losttype.com/font/?name=liberator" title="http://www.losttype.com/font/?name=liberator">http://www.losttype.com/font/?name=liberator</a><br>
      To make the word HANGAR the upper terminal of the G needs to be clipped and the chin squared. Also all corners should be rounded, in the style of Blender by Binnenland Nik Thoenen <a href="http://www.binnenland.ch/font/about/Blender" title="http://www.binnenland.ch/font/about/Blender">http://www.binnenland.ch/font/about/Blender</a><br>
      Don</p>
