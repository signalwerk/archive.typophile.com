  html: |-
    <p>Hi all,</p>
    <p>I'm creating my font by importing from AI -&gt; Fontlab.</p>
    <p>For some reason, the letter /T renders very thin compared to all my other glyphs as if it's been stroked with white. I quadruple-checked the proportions and even redrew the glyph in fontlab (i.e. no AI import) but to no avail. I also feel the stems of /V are a bit thin too, but not certain.</p>
    <p>Is this a hinting issue? I haven't really delved into that yet. </p>
    <p>Thanks in advance!</p>
