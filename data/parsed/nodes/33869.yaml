      <p>Sorry if I sounded normative about the alpha, that wasn't my point (and my point was about handwriting rather than type). What I was after was that Greeks do it differently (by hand) and so perceive it differently (in print), and that the relationship (and history of the relationship) between handwritten and printed letterforms is an important part of how we perceive Greek writing. (As to being normative about ductus in general, any palaeographer knows that ductus is the most conservative aspect of writing, but that it does change occasionally, resulting in structural changes that are invisible at first but gradually become more radical, leading to completely new letterforms).</p>
      <p>The history and present form of Greek was (and still is) largely determined by Greek type being designed by non-Greeks. The Byzantine cursive scripts that inspired the first Greek fonts had virtually no contrast compared to Latin scripts, because of different writing implements (weight being added to the end of strokes, with something like ball terminals, rather than to certain strokes vs others according to direction). So the introduction of contrast into Greek scripts is mainly a matter of Latinisation. </p>
      <p>Uppercase first: Greek inscriptional capitals had no thicks and thins. Contrast according to direction of the brush or pen works more or less consistently in Latin capitals because it was developed based on that limited set of letters. Adapting it to the Greek alphabet is impossible without cheating, particularly because of the greater importance of horizontal strokes in certain letters (Xi being most obvious): visual balance can only be achieved at the expense of consistency in the 'virtual pen angle'. Serifs of course, an essential part of the Latin thick-and-thin structure, were also virtually unknown in Greek before they were imported from Roman capitals. And using inscriptional capitals together with medieval minuscules is itself an essentially Latin invention, which entails all sorts of problems in visual consistency, even worse in Greek than they ever were in Latin.</p>
      <p>In lowercase Greek, stronger contrast is a late development, having originated, I believe, mainly in the Bodoni-Didot kinds of Greek. What made it possible was that by then contrast in Latin cursive handwriting was no longer determined by a broad nib but by pressure: in G. Noordzij's terminology, expansion vs translation. So a lc sigma, for instance, can end with a horizontal thick stroke. And even then there was quite a lot of "cheating" for regular colour's sake, with stress patterns that would be quite impossible by hand.</p>
      <p>A further obvious observation is that Greek type, even though it was based on cursive, joined, scripts in the first place, dropped the ligatures very soon because they must have been hell (meaning expensive) to engrave and to compose. Which is why, learning the script from printed books, we are taught to write Greek by hand with cursive letterforms originally designed to join, but without being told we could (may I say should?) join them. If we did use (traditional) ligatures, anyone would understand what makes a goldfish alpha awkward. (BTW even the lovely alpha in Apollonia seems perfectly orthodox in ductus, impossible to see as the goldfish type).</p>
      <p>I wonder if Opentype Greek might bring about new changes in Greek handwriting. I'd love to see all those crazy Byzantine ligatures back in classrooms.</p>
      <p>* A footnote: interesting article about Greek type by Gerry Leonidas in Berry's great book <a target="blank" href="http://www.atypi.org/05_About_us/70_publications/50_LCT" rel="nofollow">Language, Culture, Type</a>. Something like a short version of that is here: <a href="http://typophile.com/wiki/Greek" title="http://typophile.com/wiki/Greek">http://typophile.com/wiki/Greek</a></p>
