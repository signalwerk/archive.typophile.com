      <p>Whatever the mechanism for the evolution towards the "standard" roman typeform of say Griffo, it seems that there was a lot of variety in calligraphic forms prior to the Incunabula, and a lot of experimenting going on during it, especially the interplay between northern and southern letterforms, and I think this must have led to the emergence of post-calligraphic, type form letters.</p>
      <p>Fust &amp; Schoffer's 1459 small type was more like a southern rotunda in form, and perhaps influential on S&amp;P's type. They may have been pointed in that direction by the practical demands of being small type, more than cultural or stylistic considerations. In other words, "let's make small type, which available script model works best?"</p>
      <p>**</p>
      <p>Another factor that may have kept Greek in a more scripty form was its frequent use in contrast situations with Latin. For instance in The Polyglot Bible c.1500, lines of Latin and Greek text are alternated. Typically in the West, a learned work would be in Latin script, and quote a few lines of Greek, so a slanted Greek form provided good contrast. I would guess that there were far more works printed that contained a minority of Greek text, than works that were all Greek. And for Classic studies, comparison in texts was their main reason.</p>
