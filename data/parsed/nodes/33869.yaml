      <p>With regard to the history of Latin script, Eben, I see in several references that the Carolingian miniscule was distinctive in being less cursive than the other hands which proceded it, such as the half-uncial. These previous scripts were influenced by the Roman cursive hand, as opposed to the formal 'Capital' letters used in inscriptions. The Carolingian miniscule was, then, a conscious effort to make the lower case resemble more the Roman Capitals. </p>
      <p>In the examples I see of Carolingian miniscule, the lc serifs do not extend to the left as well as the right on eg the last stroke of the n. However, Harry Carter in his book has an example of a humanist script of 1450, just before the first Roman type. Though the reproduction is small and hard to see, it does seem to have serifs extending both ways. And this would, then have been an even more deliberate attempt to make the lower case look like the formal Roman letters. And our Roman type it seems is based on this hand-written revival of an earlier script. </p>
      <p>[edit: this was cross-posted with Nick's interesting examples and analysis. The example of Harry Carter from 1450 does seem to have a bit more serif to the left, though.]</p>
