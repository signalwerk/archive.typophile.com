      <p>Stephen, yes I meant that some Greek caps do "violate" the Latin cap "rules".<br>
      On the other hand, some Latin fonts do have an UC "Z" with thick horizontals...</p>
      <p>&gt; Could you post some examples of non-Lazy Greek letters<br>
      &gt; that show different “structure” from their Latin “cognates”? </p>
      <p>I wish I could. I mean, they do exist, but they're so rare that I can't think of any off the top of my head. And fonts that do have that feature will generally (sadly) be intended for display setting - like they might be caps-only.</p>
      <p>A good example of the type of thing I'm talking about though is Adobe's Sava, where the "Y" is different in each script, even though it doesn't "have to be".</p>
      <p>Recent related:<br>
      <a href="http://typophile.com/node/33576" title="http://typophile.com/node/33576">http://typophile.com/node/33576</a> _<br>
      <a href="http://typophile.com/node/33414" title="http://typophile.com/node/33414">http://typophile.com/node/33414</a> _<br>
      At the end of the latter thread there's something that sheds some moderating light on your "designed by Matthew Carter". In fact Carter had a subsequent reaction against those Linotype efforts and made Cadmus, which in a way (although apparently not too robustly) is an effort at cultural authenticity; and way after that he made a Hellenicized Latin companion to Cadmus: the widely-used Skia.</p>
      <p>&gt; I’m working on a new set of Greek glyphs that are more natural<br>
      &gt; but that will still harmonize with New Century Schoolbook.</p>
      <p>Sounds like a worthwhile effort. Just one bit of advice, which is hard to<br>
      grasp the merit of easily: if it's a text face, don't match the x-height.</p>
      <p>hhp</p>
