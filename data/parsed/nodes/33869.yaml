      <p>&gt;Does anyone know how these differences in stress arose? </p>
      <p>I don't know about the Greek, but, to add some balance here, many type designers do think that the original pen formation of the letters, including stroke direction and order, is relevant to type design. For example Jan van Krimpen, while being opposed to making type calligraphic, never the less said that the pen remains an "underlying force" in type.</p>
