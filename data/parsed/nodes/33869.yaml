    html: <p>Just one point, for what it's worth. Lowercase alpha, which Westerners (at least in France) are taught to write like an elementary goldfish, should actually be done just like an italic lowercase a. It's an interesting case of handwriting adapting to a false impression of ductus derived from a printed letterform.</p>
