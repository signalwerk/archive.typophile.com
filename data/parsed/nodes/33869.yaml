      <p>Of course I agree type does not follow handwriting all the way, although its initial motive was reproduction. I am more concerned with reciprocal interaction: just as Greek print influences our Greek hands, Humanistic manuscripts after 1450 soon showed signs of the influence of type on scribes; and 17th century calligraphy was even more typographic. Still, it may be pointed out that symmetrical foot serifs were already used in late (11th cent.) Italian Caroline minuscule, and this just may have played a part in the idea for 15th cent. serifs. No pre-Jenson examples spring to mind just now, but I'll look if I can find any. Even that, of course, would not account for bracketed serifs.</p>
      <p>PS Hrant, I am also interested in your article.</p>
