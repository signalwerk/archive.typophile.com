      <p>Nick: <em>What’s the connection — Is the whole genre of formal upright non-ligated Greek “not very good”?</em></p>
      <p>No, not at all. There's a lot of good writing and type in this style. My point was that the example you provided by Ratdolt is not a good one. It is very crude, especially compared to contemporary types in similar style by Jenson and others, and all the more remarkably so because Ratdolt worked in Venice and would have been familiar with these other Greek types.</p>
      <p><em>IF Latin and Greek came from the same scribal tradition, why did they end up so differently in type?</em></p>
      <p>But this is my point: they do <em>not</em> come from the same scribal tradition. The Latin miniscule and Greek miniscule alphabets developed in geographical and largely in cultural isolation (especially after the Great Schism), and did not come back into significant contact until the advent of typography (which was initiated in Europe by Gutenberg at almost exactly the same time as Constantinople fell to the Turks, causing a massive influx of Greek refugees to the west, especially to Italy). This happened to coincide with the revived interest in classical civilisation that had begun in the west in the late Middle Ages and that we now think of as the Renaissance. The influx of Greeks into the western centres of scholarship and publishing assisted the rapid development of study of ancient Greek literature in the original.</p>
      <p>Hrant: <em>I think they ended up differently in type not least because<br>
      one was done by people with nativity and the other without.</em></p>
      <p>That ignores the major involvement of emigré Greeks in the development of Greek typography in Italy and elsewhere, which has been excellently documented by Konstantine Staïkos in <em>Charta of Greek printing.</em> No, the reason why they ended up differently in type is that they were already different in manuscript. One can say that Latin type dispensed with most ligatures while Greek type, in the cursive style, maintained them (for almost 300 years), but a) Latin writing was never as heavily ligated as Greek, and b) there was already plenty of manuscript precedence for both roman and italic writing with very little ligation (in explicating the chancery italic hand, the writing masters make an important distinction between <em>corsiva</em> and <em>formata</em>). Such precedence did not exist in the Byzantine cursive hand, and I think printer publishers -- both Italians like Aldus and Greeks like Kallierges and Vlastos -- saw it as an all-or-nothing proposition. If you were going to print books in this style of lettering, i.e. in the style that convention considered appropriate for small format pocket books, then you had to deal with the ligatures.</p>
