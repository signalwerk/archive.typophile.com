      <p>Marc, the 'Roman' character of the Carolingian miniscule I thought lay in the roundness of the obpdq bowls which is similar to the Roman Capital letter. The roundness of the mnh, which echo this, are different from the Roman Capitals, but do give a roundness that is more consistent with the Roman Caps than broken scripts. </p>
      <p>Interesting point you make about getting rid of ligatures as being deliberately non-cursive. In a long thread on ligatures here, I thought David Berlow put it best when he said something like: it is a negative for readability if you ligate in a separated script or if you separate in a connected script. Of course there may be positives that make you want to do a ligature (or not) anyway, such as in the fi ligatures. </p>
      <p>That is why I am not so keen on ligatures in text. For display they can be cute, but they can also get out of hand.</p>
