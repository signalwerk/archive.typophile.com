      <p>The pen angle in the Byzantine cursive hand is much more variable than in most Latin writing: in some hands it varies by as much as 40 degrees, and may involve rotation past the vertical, although that is extreme. In general terms it is much steeper than the typical Latin ductus, and closer to the ductus of Hebrew and Arabic than to Latin. This shouldn't be surprising if one considers the geographical territory covered by the Byzantine empire during the evolution of the miniscule hand.</p>
      <p>The most obvious impact of this steep ductus is found in the typical forms of letters like pi and tau, in which the heavier stroke is the horizontal. When a less steep ductus is applied to Greek, these letters and others can end up looking quite strange, which is why one often sees hybrid type designs in which different letters have different ducti. I've designed Greek types using this approach (e.g. Constantia) -- usually when close harmony of texture with a companion Latin is a desired goal -- but I'm never as satisfied with the results as I am when I design with a more traditional Greek contrast pattern consistently across the letters. It is very difficult to avoid a spotty appearance when some letters have a horizontal contrast pattern and some a more vertical.</p>
    html_clean: |-
