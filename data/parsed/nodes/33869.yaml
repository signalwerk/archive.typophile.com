      <p>Thanks. I thought it might be from the Fell collection, which includes the larger sizes. This is the Double Pica Greek. And what a delightful discovery:</p>
      <p><em>A resetting of a passage in Thucydides as edited by John Hudson, Oxford, at the Theatre, 1696.</em></p>
      <p>It's worth noting that not all the ligatures in the Fell Double Pica were original to the Granjon/Plantin face. More than half of them were cut for Fell, presumably by Isaiah de Walpergen. He did a very good job, and they blend very seamlessly with the main font.</p>
      <p>There is an interesting thing to note regarding the Granjon Greeks, which I alluded to in my presentation at the ATypI Rome conference in 2002: the smaller the type size, the greater the number of ligatures. The relatively small number of ligatures in the Double Pica size prior to the additions of de Walpergen further confirms the pattern. My belief is that because the smaller sizes of type were used mainly for marginalia, footnotes and other text in constrained spaces, they benefited from more ligatures, which reduced the length of the text.</p>
