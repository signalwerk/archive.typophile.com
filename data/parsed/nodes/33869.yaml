      <p>Methods to determine optimal relative vertical proportions between scripts can vary from the primitive (looking at the "raw" alphabets themselves) to the somewhat refined (weighting the letter structures according to linguistic frequency*) to the highly refined (possibly using surface area computations of the letter structure frequencies). But since this is all deterministic (meaning that you can never really arrive at The Answer) the important thing is simply to have a method at all. The important thing is not to blindly impose the vertical proportions (or other things, like serif structures) of one script onto another.</p>
      <p>* This is the method I use, and the one I've described in<br>
      the 2005 edition of Hyphen (and Spatium #4 before that).</p>
      <p>hhp</p>
