      <p>Certainly, there were "serifs" in pre-print writing, but they were small and generally transitive. The S&amp;P type follows that convention.<br>
      Even Jenson's foot serifs at the bottom of the left stem of "n" for instance, although pronounced, were a bit like that (taken up by Goudy) -- but by the time of Griffo's work, that serif has become substantial and symmetrical, to match the cap serifs. The characteristic repose of the roman script, as seen in Griffo's type, results in large part from giving the lower case symmetrical, non-transitive serifs on the vertically-stemmed letters.</p>
