      <p>Marc, I don't think that there is much correspondence between writing and type, although other media can give cues to type design.</p>
      <p>Consider the Rome type of Sweynheym and Pannartz, often cited as the first true humanist/roman type. In it, the caps have pronounced serifs, but the lower case has barely any serifs at all. This corresponds to the way that Renaissance scribes handled the <em>lettera umanistica,</em> lavishing a little bit of extra work on capitals. The Big Idea that an upper case detail may be applied to the lower case was entirely typographic, and had nothing to do with writing practice and the tools thereof, as it is too cumbersome to "write" serifs on every lower case letter.</p>
      <p>Therefore, it seems that the archaic quality of classic Greek typography (without lowercase serifs) stemmed, indeed, from foreigners, because they paid too much respect to making it look "authentic" -- like writing. However, it's interesting that this backwardness turned out to be forward-looking, producing several monoline, sans serif faces at one time or another, such as Hibbert's <em>Greek Uncial</em> of 1827.</p>
