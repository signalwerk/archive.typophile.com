      <p>Well yes, 9th to 11th-c. Caroline minuscule is nice and round, but so were most previous minuscules. Roundness as opposed to broken strokes applies to neo-Caroline, i.e. 15th century humanistic scripts (even though Italian gothic wasn't nearly as spiky as the northern varieties).</p>
      <p>Pre-caroline scripts are considered cursive or semi-cursive mainly because of their many ligatures, which modified letterforms more than any ligs used in type today, since a single letter would take on a completely different form (or more than one) in order to join up with another. So, when learning to write, you were taught the shape of single letters plus the special shapes of pairs (mainly pairs). In that respect Caroline minuscule made both writing and reading easier, essentially br reverting to the basic letterforms of semi-uncial (plus a few letters borrowed from other scripts). Of the few ligatures that stayed on, the most frequent of course was the ampersand, e+t.</p>
