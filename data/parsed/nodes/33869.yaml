      <p>Nick, Ratdolt's Greek simply isn't very good. It belongs to a struggling effort of non-Greek printer-publishers, beginning with Fust and Schoeffer, faced with the need to incorporate bits of Greek text in their Latin books. What is notable about Ratdolt's specimen, if the date is correct, is just how bad it is, because by then Jenson and others had done much better Greek types in the non-ligated style.</p>
      <p>Do you have access to a copy of Scholderer's _Greek Printing Types_? It reproduces a fine set of examples of 40 years worth of pre-Aldine Greek types, many of which are non-ligated or display only a small number of ligatures.</p>
      <p>I wouldn't call these types Latinised. Their point of typographic departure is the mediaeval formal book hand that preceded and continued to be used alongside the late Byzantine cursive writing. Such letters are upright, quite broad and generally employing fewer and simpler kinds of ligation. Barbours very good _Greek Literary Hands_ shows dozens of examples from the 10th century onwards. Since ligation was a less vital aspect of the formal book hand than than the cursive, it could more easily be dispensed with in the transition to type.</p>
      <p>Aldus' cursive Greek types should be seen in context of his Latin 'italic' types, i.e. as the adoption of the manuscript conventions for the kind of small format pocket book that he was publishing.</p>
