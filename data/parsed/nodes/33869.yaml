    html: <p>The pattern of thick and thin strokes is interesting in Greek.  Unlike the standard forms for Latin, there are many thick horizontal strokes.  There are also many fonts that have strong top-right-to-bottom-left diagonal strokes, most noticably in the chi, but also in alpha, gamma, and lambda.  Does anyone know how these differences in stress arose?  Interestingly, I've never seen any difference in the stress pattern of uppercase Greek and uppercase Latin.</p>
