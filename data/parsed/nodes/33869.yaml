      <p>You might also want to read Noordzij on the subject of serifs not for the historical sense of when they show up in writing ot type, that isn't his focus; but for a clear theoretical context in which to fit serifs &amp; ductus. His ideas are practical &amp; process oriented. I am paraphrasing quite a bit but his point as I recall it is re: serifs some kinds of serif like shapes can &amp; do occur in some running hands without extra trouble. And more of them can show up in a hand where letters are composed not in one stroke but as a result of sokes &amp; lifts &amp; stokes etc. I suspect that you had both kinds of hands at work even in the early days to which Nick refers. </p>
      <p>The main point I would make here is that 'serifs' as such may not have been seen as ontologically distinct in the miniscule when this writing was being made. And our seeing them as such may have to do with looking at the material through the lens of type. To them it might just have been 'feet' and different from the Roman serifs, or they may have been an invisble, unnamed, unthought about part of the process. The mental connection to the Roman Cap forms probably came up gradually. Anyway this is all speculation in the service of urging caution or at least provisionality when talking about 'serifs' &amp; the miniscule forms in early Latin calligraphy. Certainly it takes a while for the serifs on the miniscule to be visually harmonized with the Majiscule or Caps.</p>
      <p>In the conext of greek this might be different - or not. The scripts are alike enough &amp; the tooks alike enough that I bet there is a great deal of overlap. Still, only looking at a range of historical materials will let you know what did happen as opposed to what could have happened.</p>
