      <p>Serifs transitive &amp; intransitive: The point of my 1456 example (as in Carter's) is that the serifs here seem to be deliberately intransitive, unlike Poggio and S&amp;P and most humanistic scripts, not to mention Italian rotunda, even though they aren't quite as neat as Griffo's yet.</p>
      <p>It's difficult to tell from the very small script of my sample, but this does look like possibly a revival of earlier Italian styles (11th c. as I said) in which symmetrical serifs were quite clearly added on as horizontal hairlines. At any rate it isn't just accidental or unconscious movements. As for the original Caroline minuscule, it was "less cursive" than previous, early mediaeval minuscules (not really half-uncial) mainly because it dropped almost all standard ligatures. I wouldn't say the letterforms themselves were made any more similar to Roman caps, but having separate letters, and a single shape for each (or nearly), certainly was felt to be more "classical", because Latin grammarians had explained that every sound should be represented by a distinct sign. (Sorry if I sound a bit stuffy, I didn't mean to turn this Greek calligraphy thread into a course on mediaeval palaeography.)</p>
      <p>As far as I remember Noordzij on serifs, he has an exciting and paradoxical theory about the influence of the French or Burgundian bâtardes on the development of serifs, but I do think it needs to be reassessed in the light of late-Caroline precedent.</p>
      <p>&gt; dropped the ligatures very soon etc.<br>
      Actually complex ligatures were also omitted in the earliest, more rudimentary Greek fonts. Whatever engravers and printers would have liked to do, it obviously required uncommon craftsmanship and capital to get it right.</p>
      <p>&gt; Byzantine ligatures: sorry, I mean late medieval and Renaissance Greek cursive in general. Even Granjon was following that kind of model, wasn't he? I would be glad to see what his Greeks look like, I haven't got much material on Greek type. Any pictures or bibliography welcome. Cheers.</p>
