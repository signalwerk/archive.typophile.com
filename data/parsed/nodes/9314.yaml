    html: |-
      <p>Jas - Neil Bold was a VGC original by one Wayne J. Stettler, 1967. VGC ceased to exist long ago.</p>
      <p>Opti never created fonts - they just made their own "versions" (clones) and sold them under different names. I understand from friends who were in the business back then that this was common. Companies would clone popular fonts and sell them formatted for a particular proprietary photolettering machine system.</p>
      <p>As such, Opti had no "rights" to any VGC fonts. I really doubt that anyone does any more. As evidence of this, you can find plenty of one-time VGC originals digitally reproduced by various entities today.</p>
      <p>Just a few examples among many: Amelia (Bitstream [BT], Linotype [LT]), Aquarius (Red Rooster), several of Arthur Baker's faces, Bloc (BT as Geometric 885), China (Mark Simonson as Changeling), Davida (various), Eightball (Canada Type as Orotund), and so on. Oh, and let's not leave out Serpentine, which has been digitized by just about everyone.</p>
      <p>So, I would agree wholeheartedly with Mike Y. that " ... it would be a shame to let a good revival go to waste." I see no reason for you not to release what you've faithfully recreated. Note that in some of my examples above, the name was changed from the original. That might be a good precaution, but you've already got that in place with the perfect name of Armstrong.</p>
      <p>You've got some wonderful fonts and photograph galleries. I really enjoyed the viewing - especially the pics from Japan.</p>
