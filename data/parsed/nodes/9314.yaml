      <p>That's OK. I don't need the font. I was just wondering if you were going to sell/distribute it. As long as your digitization is original, I don't think you have to worry about Castcraft, since I'd bet they don't own the design either. You might need to use a new name, since typeface names can be copyrighted.</p>
