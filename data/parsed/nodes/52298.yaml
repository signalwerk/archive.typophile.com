  html: |-
    <p>Trixie is a distressed monospaced serif typeface created by Dutch type designer, Erik Van Blokland, in 1991 using the inspiration of an old, worn typewriter. Probably the most famous presentation of a single letter is the Trixie capital X used in the title of the popular science fiction television series, “The&nbsp;X-Files”.</p>
    <p>Since its release in 1991, from “The X-Files” to  more recent appearances in “Capote” and “Atonement”, <span class="caps">FF</span> Trixie has served as the defacto typeface of mystery and intrigue. Although there have been a number of typewriter-like designs, <span class="caps">FF</span> Trixie remains the most convincing, and accurate, typewriter font&nbsp;available.</p>
    <p>More information, production samples and technical specifications are available at the <a href="http://trixiefont.com/ " title="Click to visit an external URL." class="freelink freelink-external freelink-external"> Trixie Font Site</a> and the <a href="http://www.fontfont.com/fonts/trixie " title="Click to visit an external URL." class="freelink freelink-external freelink-external"> foundry site</a>.</p>
