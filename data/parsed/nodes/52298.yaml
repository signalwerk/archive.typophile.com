    <p>Trixie is a distressed monospaced serif typeface created by Dutch type designer, Erik Van Blokland, in 1991 using the inspiration of an old, worn typewriter. Probably the most famous presentation of a single letter is the Trixie capital X used in the title of the popular science fiction television series, "The X-Files".</p>
    <p>Since its release in 1991, from “The X-Files” to  more recent appearances in "Capote" and "Atonement", FF Trixie has served as the defacto typeface of mystery and intrigue. Although there have been a number of typewriter-like designs, FF Trixie remains the most convincing, and accurate, typewriter font available.</p>
    <p>More information, production samples and technical specifications are available at the <a class="freelinking external" href="http://trixiefont.com/ " rel="nofollow"> Trixie Font Site</a> and the <a class="freelinking external" href="http://www.fontfont.com/fonts/trixie " rel="nofollow"> foundry site</a>.</p>
