    <p>The font has class-based OT small caps and swashes.<br>
    But Turkish /I letters are messing it up.<br>
    I need an example on how to make language specific exceptions in the feature. FL manual doesn't provide one.<br>
    <code><br>
    sub I to Dotlessi_smcp;<br>
    sub I to Dotlessi_swsh;<br>
    </code><br>
    etc.</p>
