      <p>You need to make up another glyph -- a small cap I with a dot. BTW, in naming it, you shouldn't use the underline. That is by convention reserved for ligatures. Use a period. For example:</p>
      <p>Idotted.sc, or even I.dotted.sc,</p>
      <p>Then, with c2sc, for the dotted capital I, substitute your new glyph. For the standard Capital I, substitute I.sc That works whether you have Turkish or not.</p>
      <p>Lower case (generally the smcp feature) is trickier -- the normal Latin dotted i has to be substituted with the new glyph,  Idotted.sc. The dottless i gets the regular I.sc</p>
      <p>Problem is, when &amp; how to do it? Most anything will be a hack. I'd be tempted to use a stylistic set before the smcp feature, to be switched on when setting Turkish. Then the smcp feature gets the normal substitution, Latin lowercase "i" to "I.sc". As the stylistic set occurs before smcp, and is "on," it just won't be found in smcp, so won't cause a problem.</p>
      <p>Whether to make up a language-specific substitution depends -- most users won't put in language tags. And it could muck up your smcp feature for setting any other language. Remember that even though you write the code, the application program has to support it...</p>
      <p>BTW Nick, your treatment of ligatures makes no sense unless you also have the other characters needed for Turkish -- The dotted capital I (&amp; small cap, if you want; the G,g breve; etc.If you don't have these, why worry about the ligaturing?</p>
      <p>&amp; if there is room between x-heigth and ascender height, you can use ligatures. I made up a dotted "i" for a f_i ligature in Bembo once -- it worked just fine. The standard lig was used in Turkish with an undotted i.</p>
      <p>FWIW</p>
