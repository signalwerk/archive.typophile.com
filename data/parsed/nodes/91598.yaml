      <p>Eimantas: ‘<em>[…] I still need a real-life code example.</em>’</p>
      <p>Maybe <a href="http://www.fonttools.org/downloads/Typophile/features_2.1_New.txt" rel="nofollow">this ﬁle</a> is of some use to you. As I wrote before on <em>Typophile</em>, in DTL Bezier-, Ikarus-, and DataMaster (batch) the generation of OT Layout features can be done using a features ﬁle that contains as much info as possible. Features that are not covered by the character set of a font are removed during compiling. The same subsetting can be done with existing OpenType fonts in DTL OTMaster, but currently not in batch.</p>
      <p>FEB</p>
