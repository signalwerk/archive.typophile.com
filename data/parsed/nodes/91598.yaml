      <p>Mea Culpa. I just mentioned this thread to my business partner, who has to deal with manuscripts. He reports a situation similar to what David reports. The reason I've never seen a language tag in a file is they're all stripped out with our conversion scripts &amp; never make it to comp. </p>
      <p>He also mentioned that InDesign itself sometimes seems to throw in a spurious tag now &amp; then -- for example (but probably not this one), it sees an egrave &amp; decides we're in Japanese...</p>
