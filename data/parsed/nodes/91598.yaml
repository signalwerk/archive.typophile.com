      <p>I set scholarly material, and I get a lot of manuscripts in *.doc or *.docx format with various language attributes set.  Sometimes this is useful, often not, but enough are useful that I preserve attributes when pulling the files into InDesign.  Early on, these seemed to be files from East Asian versions of MS Word, with "Japanese" or some variant of "Chinese" applied to text that was mostly alphabetic.  The most noticeable effect, of course, is to turn off ID's hyphenation; more subtle, ID picks up (and can re-use) language attributes that were not part of the original installation -- so far as I know, that's the simplest way to get the CJK attributes into English-language ID.</p>
      <p>More recently, as authors pull stuff in from all over the web, files show up with all kinds of attributes.  And it seems that if they continue typing from the insertion point without changing the language back to that of their main text, the typed additions pick up the insertion's language attribute.  Neither authors nor editors notice, of course.  For me, the the most noticeable effect is again on hyphenation.</p>
      <p>The trouble is, ID's search routine only works for specific language attributes.  The simplest way to find out which are used in an InDesign story must be Rorohiko's <a class="freelinking external" href="http://www.rorohiko.com/wordpress/indesign-downloads/framereporter/" rel="nofollow">Frame Reporter</a>.  (I confess I haven't tried this yet -- I keep thinking I'll move to IDCS5.5 as soon as Adobe fixes the pagination/indexing bugs).  Jongware was kind enough to note (over at InDesign Secrets) that scripting this task say to run quickly on entire ID files was "<a class="freelinking external" href="http://indesignsecrets.com/forum/indesign-add-ons-scripts-scripting-and-plug-ins/script-to-change-the-language-of-all-text-on-document?value=3291&amp;type=8&amp;include=0&amp;search=1&amp;ret=all#7657" rel="nofollow">tricky</a>."  But he'd earlier provided a simple script over on the Adobe Forums <a class="freelinking external" href="http://forums.adobe.com/message/3279054#3279054" rel="nofollow">that can do it</a>, albeit slowly --  I go warm up my coffee in the microwave.</p>
      <p>David</p>
