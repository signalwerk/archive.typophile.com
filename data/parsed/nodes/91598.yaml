      <p>On the ligatures -- no one's ever satisfied.<br>
      <a href="http://typophile.com/node/34200" title="http://typophile.com/node/34200">http://typophile.com/node/34200</a></p>
      <p>So, Minerva, following that assumption, you can create a separate lookup for small caps in the smcp feature that is turned on only when the Turkish language tag has been applied.</p>
      <p>Theunis -- congratulation, by the way, for taking the time &amp; having the knowledge to tag all the words in a long file with the correct language. Time is part of it -- we may have a book with 1,000 or more Spanish words --  all untagged coming in, and usually single words or short phrases. I just create an exception dictionary for the job which blocks hyphenation on words like barrio. We always create an exception dictionary that contains every word over five letters. Sadly, InDesign allows hyphenation before a single vowel in English, and that's a not allowed in our world, which is based on the Chicago <cite>Manual of Style<cite>. There are other reasons for the custom dictionary, of course.</cite></cite></p>
      <p>And I have to admit, as an American,  I'm not always sure, say,  what's Swiss &amp; what's German; what's Danish or Norwegian, etc., unless an author's directly given the language.  The latter is esp. shameful for me, as my father's first language was Norwegian...</p>
