      <p>I don't know if this answers your particular question, but this is how I handle fi ligatures for Turkish:</p>
      <p><code>feature liga {<br>
      # Latin<br>
          sub f i by fi;<br>
          sub f l by fl;<br>
        lookup NOFI {<br>
          sub f l by fl;<br>
        } NOFI;<br>
        language TUR exclude_dflt;<br>
        lookup NOFI;<br>
      } liga;<br>
      </code></p>
