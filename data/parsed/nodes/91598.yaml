      <p>I always take care to set the correct language to texts of more than a single word long -- well, or at least to entire <em>paragraphs</em>. (If there are lots of single long foreign words in a text I just check the ones that get hyphenated.)<br>
      InDesign supports "applied language" for Opentype features; and it behaves correctly with capitalized Turkish text as well as the dreaded "fi" ligature (of course only when the font designer did it right!).</p>
      <p>I'm curious, though, why designers think a clashing "fi" is bad in general but okay for Turkish! In the one single font I made, I created a short-topped "f" character specifically to use in this case.</p>
