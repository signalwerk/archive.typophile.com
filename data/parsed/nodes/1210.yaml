    html: "<p>from the fontlab community site: <br> <br>Patric King and Lune have provided the following tips how to seamlessly copy-paste your outlines between FontLab and Illustrator. The described procedure works on Mac OS X 10.2.4 with Illustrator 10.0.3 and FontLab 4.5.1, but should also apply to other versions.  <br> <br>1. In FontLab, check \"Do not reescale EPS...\" in the FontLab Preferences / General.  <br> <br>2. In Illustrator, change the units to points: 1 point will be equal to 1 unit in FontLab.  <br> <br>3. Make a box with 1000x500 points in Illustrator, add the baseline, x-height lines and whatever you want, make your drawing.  <br> <br>4. Fill or stroke everything with something. FontLab won't import paths with no fill/no line. <br> <br>5. Copy in AICB format (you can change this in Illustrator preferences). I don't know if it's necessary, but I have also turned off PDF copy. <br> <br>6. Paste into a glyph window in FontLab. You'll have to actually open the glyph window, which is annoying. <br> <br>You can now copy/paste between FontLab and Illustrator without re-scaling your outlines. It also works with Photoshop files, it might be useful when you bring bitmap images as background templates. Bon Appetit!</p>"
    html_clean: "<p>from the fontlab community site: <br> <br>Patric King and Lune have provided the following tips how to seamlessly copy-paste your outlines between FontLab and Illustrator. The described procedure works on Mac OS X 10.2.4 with Illustrator 10.0.3 and FontLab 4.5.1, but should also apply to other versions.  <br> <br>1. In FontLab, check \"Do not reescale EPS...\" in the FontLab Preferences / General.  <br> <br>2. In Illustrator, change the units to points: 1 point will be equal to 1 unit in FontLab.  <br> <br>3. Make a box with 1000x500 points in Illustrator, add the baseline, x-height lines and whatever you want, make your drawing.  <br> <br>4. Fill or stroke everything with something. FontLab won't import paths with no fill/no line. <br> <br>5. Copy in AICB format (you can change this in Illustrator preferences). I don't know if it's necessary, but I have also turned off PDF copy. <br> <br>6. Paste into a glyph window in FontLab. You'll have to actually open the glyph window, which is annoying. <br> <br>You can now copy/paste between FontLab and Illustrator without re-scaling your outlines. It also works with Photoshop files, it might be useful when you bring bitmap images as background templates. Bon Appetit!</p>"
