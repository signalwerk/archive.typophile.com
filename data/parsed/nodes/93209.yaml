    html: |-
      <p>There should be no need to make your Mac dual-boot or to use MacPorts in order to install FontForge—in fact, I recommend pretty strongly against both of these. MacPorts installations are really awful to maintain (I've done it—never again, I hope); Homebrew is much nicer to work with. Don't give up on it because of a faulty formula.</p>
      <p>In this case, it looks like there was an error in the Homebrew formula for FontForge. That error appears to have been fixed since the original post; <code>brew install fontforge</code> was able to properly interpret the formula and start building when I tried it just now.</p>
      <p>Summary: I'd recommend Homebrew as the best way to install FontForge on Mac OS X today.</p>
      <p>As for dual-booting, if you <em>really</em> need an Ubuntu environment (which is unlikely), using VirtualBox or similar to set up a VM will be more convenient, because you won't need to reboot every time you want to use the other OS.</p>
