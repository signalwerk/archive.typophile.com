    votes: null
    html: <p>One other thing worth knowing. <code>brew install fontforge</code> will, by default, install only the command-line components, which are great for doing things like programmatic font conversion, but pretty sucky for actually making fonts. :) If you want to actually run the GUI, you'll need to do <code>brew install fontforge --with-x</code> .</p>
