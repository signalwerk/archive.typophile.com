    html: |-
      <p>Thanks Karl. MacPorts did the trick, I have it running now.</p>
      <p>For the record (and if anyone else wants to know how to install fontforge on a Mac):</p>
      <p>1. Download a MacPorts Package Installer from <a href="http://www.macports.org/install.php" title="http://www.macports.org/install.php">http://www.macports.org/install.php</a><br>
      2. Download Xcode from the App Store or <a href="https://developer.apple.com/xcode/" title="https://developer.apple.com/xcode/">https://developer.apple.com/xcode/</a><br>
      3. Once Xcode is installed, open it. Open Preferences and click the Downloads tab. Click "Install" next to "Command Line Tools".<br>
      4. Once that is installed, open Terminal and type:</p>
      <p>sudo port install fontforge</p>
      <p>5. Once fontforge has installed, you will find it in the MacPorts folder in Applications. Open it.<br>
      6. In the menu bar, click X11 and open Preferences. Click Pasteboard. Deselect 'Enable Syncing'</p>
      <p>And hopefully that will do the trick.</p>
