    html: |-
      <p>The Macports files are in /opt/local, those for Fink are in /sw. If you want to get rid of Macports completely, the following instructions should do the job: <a href="http://guide.macports.org/#installing.macports.uninstalling" title="http://guide.macports.org/#installing.macports.uninstalling">http://guide.macports.org/#installing.macports.uninstalling</a> ; for Fink </p>
      <pre>  sudo rm -fr /sw
      </pre><p> should be enough (In fact, for Macports, <code>sudo rm -fr /opt</code> should already solve your problems).</p>
