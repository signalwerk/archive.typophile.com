    <p>I am having arabic transliterated letters drawn to work with Adobe Garamond Premiere Pro, including the hamza and ayn. We are are having the designer draw U-02BE and U-02BF for these letters. Should the hamza and ayn have an "italic" version? In Chicago 15, page 423, the word "ayn" is italicized but the half ring is not. Is that correct?</p>
    <p>Any help would be appreciated!</p>
