    <p>Hello,</p>
    <p>I need a typeface with ice cold nordic look and feel.<br>
    The custom design made by <a class="freelinking external" href="http://www.helsinkitypestudio.com/" rel="nofollow">Helsinki Type Studio</a> for the <a class="freelinking external" href="http://www.werklig.com/solutions/design-museum/" rel="nofollow">Finnish Design Museum</a>.<br>
    As we can't find an available exact match, can I ask help to find the closest possible ?</p>
    <p>Cheers,<br>
    L.</p>
