      <p>Thin brushed angled serfis were popular in 1915 and I expect that some similar lettering has been digitized. A quick check turned up Clementhorpe <a href="http://www.myfonts.com/fonts/gatf/clementhorpe/" title="http://www.myfonts.com/fonts/gatf/clementhorpe/">http://www.myfonts.com/fonts/gatf/clementhorpe/</a> which has similar serif treatment but pointing backwards instead of forwards.<br>
      Don</p>
