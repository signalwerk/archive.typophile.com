      <p><cite>... although I first saw Sulley. </cite></p>
      <p>LOL! That's was *very* funny :-)</p>
      <p>It could have looked better in another room, but you also have to take in account my lousy camera and camera work. It looked better in the real world. The entrance is near the back (where my wife stands looking at the ribbons) and the first view from that was really great. It *did* work for me, but I must confess that I was a bit distracted because she used my type :-)</p>
