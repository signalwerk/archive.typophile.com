    <p><cite>During the sculpture exhibition ‘Sonsbeek 2008: Grandeur’, the Kröller-Müller Museum will show work by one of the participating artists, Ana Maria Tavares. Tavares is fascinated with water. The workings of the water in the streams in and around Park Sonsbeek in Arnhem inspired her work, both in Sonsbeek and at this museum. During her investigations, she discovered some 80 springs in the vicinity, flowing into a large number of streams. The names of these springs – along with the mantra ‘Desire, Deserve, Delight, Still Life, Sparkling Water, Still Water, Sparkling Life’ are part of ‘Chrystal Waters’. This object, specially made for the museum consists of stacked layers of reflecting coloured acrylic glass. The mantra also appears in the net of ribbons that was carried as a banner in the Sonsbeek Procession and now makes up the installation, in combination with ‘Chrystal Waters’ and a map of locations. The installation will be on display until January 31 in one of the museum's project rooms.<br>
    </cite></p>
    <p>+++</p>
    <p>Another (beautiful) sighting of <a class="freelinking external" href="http://www.josbuivenga.demon.nl/museo.html" rel="nofollow">Museo</a>.</p>
