    html: |-
      <p>There's a slightly easier method: Duplicate the type and nudge it in the desired direction (as oldnick suggested) but instead of filling it white and duplicating again, leave the shadow whatever colour you want it to be and simply give the top type a white stroke. (It works best if you outline the type and apply the stroke to the outside of the path, leaving the type design unaffected by the stroke.)</p>
      <p>Yves Peters also gives a great tutorial on an engraved effect <a href="http://fontfeed.com/archives/engraved-festive-type/" rel="nofollow">here,</a> which also discusses the shadow effect.</p>
