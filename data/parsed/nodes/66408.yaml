    html: |-
      <p>The easiest way to accomplish the offset effect is to duplicate the type, nudge it right and down (usually an equal increment), send it down one level, then color it white. Repeat the process and color the duplicate the shadow color.</p>
      <p>If you're working on a non-white background, simply use the white copy to trim the shadow copy.</p>
