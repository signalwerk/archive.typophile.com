    <p><a href="http://ink.creativezeune.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Wallington Typeface</a></p>
    <p>Hey guys! allow me to introduce my first release font.</p>
    <p>Wallington is a decorative-serif font embodying vintage and elegant curves with functional structure. Inspired by Old English cultures and their descendants between the mid-5th century and the mid-12th Century. Made up of two styles, Wallington Regular that consists of 491 glyphs and Wallington Small Caps with 365 glyphs. All glyphs are divided into several OpenType features such as Ligature, Contextual Alternates, Old Style Numeric and some astonishing special characters that allows you to mix and match pairs of letters to fit your design. </p>
    <p>Find out more : <a href="http://ink.creativezeune.com">http://ink.creativezeune.com</a></p>
    <p><img src="/sites/default/files/old-images/1_4492.png"><br><img src="/sites/default/files/old-images/4_4962.png"><br><img src="/sites/default/files/old-images/2_6555.png"><br><img src="/sites/default/files/old-images/3_6664.png"></p>
