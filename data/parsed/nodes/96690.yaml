    html: <p>Hi Hrant, The up/down twists is coming from humanistic approach. Bengali calligraphy and handwriting follows this format, which makes the font/text more readable. We were suppose to design the Star Bengali as per the given brief. The channel is in Bengali language, so the expected version should be readable on various screens. I hope, you got the answers.</p>
