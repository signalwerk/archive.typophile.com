  html: |-
    <p>While poking at the unfinished parts of a face that is <em>still</em> not ready for release, I'm taking another look at the core alphabets and wondering if they need to be reorganized. It's a unicase which has cap and lower forms for A/a, E/e, N/n, U/u, and Y/y, and caps for the rest. These are all lining. But I also have descending swash-tailed versions of J, Q, and R, which at present reside in the capital slots. Should I move them? Because this is my thinking:</p>
    <p>1. Users may want to set it as no-nonsense allcaps, and will want that to be as easy as turning on capslock.<br>
    2. Still, most users who want the unicase will probably want solid lining, too, as easily as <em>not</em> pressing shift or capslock.<br>
    3. But duplicating the first J, Q, and R and relegating the second to an Opentype feature is just erecting barriers to people who aren't using InDesign — still a significant part of the market, I think.</p>
    <p>What do you think? How would you want it if you were using it?</p>
