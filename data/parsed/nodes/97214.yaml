    html: "<p>The <em>case</em> feature kicks in with Caps Lock or selecting all capitals, but not when using the  Shift button. That’s nice for OT savvy application, but surely not bulletproof. You could write a <em>calt</em> feature that checks if the pre- and proceeding characters are capitals (or punctuation/spaces), and swap the swash variant for a straight capital variant. The downside is: what if someone wants to write a word in all caps including your swash?</p>"
