      <p>Hi there,</p>
      <p>I work for Skanska and can confirm that it is a custom font. It's a proprietary font we use for our materials.</p>
      <p>The logotype isn't so much a font as a graphic. We don't ever use it as a typeface.</p>
      <p>I hope this helps. I can try to answer any other questions, though I will warn you I may not have all the answers.</p>
      <p>Jay</p>
