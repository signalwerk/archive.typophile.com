    html: |-
      <p>Thanks guys!</p>
      <p>It is aimed at children, yes.  It's primarily a decorative typeface.  I've been creating name plaques, which is sort of like a personalised gift - suitable for a child's christening / birthday.  They've gone down quite well.  I've been trying to attach images of those, but it won't let me for some reason.</p>
      <p>If I did want to make it purely educational, then yes, I would need to have the activity relate to the corresponding letter. i.e. A-apple, B-ball etc or along those lines.</p>
