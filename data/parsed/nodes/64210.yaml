      <p>Looks pretty, but lacks originality. To be negative, it's just a decorated Myriad and nothing more. I think you should design it from scratch; you will learn many things and it can be much like what you wanted.</p>
      <p>I see few letters that are related to the activity. If you designed it to be educational, I think it's not working.</p>
