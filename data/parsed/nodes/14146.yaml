    <p>Just getting started on this one.</p>
    <p>HoopFX will make basketball gear for backboards. Can't really say what that will be, but stuff. They want to attract college basketball fans.  And people who play basketball.</p>
    <p>I've tried a few other directions but I like the type on this best.  It takes the form of the backboard and translates it into type.  At least that is what I was trying to do. HOOP has gone through a couple drafts.</p>
    <p>The FX mark part I am just getting to.  I think I need to try a few different renderings before this starts working.  I think the bottom of the mark is the tricky part...that will impact how FX reads.</p>
    <p>Would love to hear what you all think.</p>
