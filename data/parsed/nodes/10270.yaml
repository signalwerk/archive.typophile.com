  html: <p>Can anybody help me find a shop that supplies type gauges in the UK? Preferably one with online ordering. I've exhausted every search I can think of in Google and can't find a source anywhere. The best I could find was a PDF but it only has Pica measurements and I sure could do with something that has Points as well.</p>
