    html: <p>do you know if you want a serif or a sans? <br>Personally i would think a serif would make for a richer image. I would suggest Emigre's <a href="http://www.myfonts.com/fonts/emigre/mrs-eaves/" target="_blank">Mrs. Eaves</a> but it may be a bit overused (and I hear its not to great for long passages of text). <br>I would definately look at some stuff from <a href="http://www.stormtype.com" target="_blank">Storm</a>. I always get an exotic vibe from their stuff that i think would go well with a book on rainforests. Some suggestions from their library <a href="http://www.stormtype.com/serap.html" target="_blank">Serapion</a>, <a href="http://www.stormtype.com/mediaeval.html" target="_blank">Mediaeval</a>, <a href="http://www.stormtype.com/bibl.html" target="_blank">Biblon</a>, or for a nice clean look <a href="http://www.stormtype.com/andulka.html" target="_blank"> Andulka</a>.</p>
