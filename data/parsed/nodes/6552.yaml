    html: "<p>Well, there's all kinds of fonts. But: <br>1) Versatile and expressive tend to be strongly opposed (at least the way I use those terms). <br>2) Low contrast and expressive can be somewhat opposed. <br>3) Really large x-heights (like in ITC Garamond) are bad for readability (at least at normal reading sizes). <br> <br>If you want something mannered, beefy and organic, what about ITC Barcelona? <br><a href=\"http://www.myfonts.com/fonts/linotype/itc-barcelona/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/itc-barcelona/</a> <br> <br>hhp</p>"
