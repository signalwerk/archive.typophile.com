    date: 2004-09-08T10:16:00
    date_raw: 8 Sep 2004 — 10:16am
    votes: null
    html: <p>When you say "coffee table book", do you mean something where people won't actually read the text too much? I'm not trying to be fascetious, it's just the nature of coffee table books - you could say the type becomes a texture, more than a carrier of language. <br> <br>I ask this because if readability is secondary that would affect the font choice. <br> <br>hhp</p>
