  html: <p>Sorry if this has popped up in the list before, but I couldn't find it in the archives. Does anyone know a place where to see the 'catch me if you can' title sequence in quicktime format? I'd love to see it over and over again. The Nexus boys (<a href="http://www.nexuslondon.com/main.html" target="_blank">http://www.nexuslondon.com/main.html</a>) created the brilliant sequence that has a definite Saul Bass ring to it without being a rip off. On their site it has been embedded in the whole flash design and besides it's very small. It deserves more than that!</p>
