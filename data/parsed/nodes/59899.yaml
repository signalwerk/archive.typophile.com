    html: <p>Hollywood movies are rarely imaginative, so why expect the posters to be?</p>
    html_clean: <p>Hollywood movies are rarely imaginative, so why expect the posters to be?</p>
  - id: 356111
    user: 2462
    date: 2009-07-13T05:45:00
    date_raw: 13 Jul 2009 — 5:45am
    votes: null
    html: <p>Big studios with dumb comedies aren't concerned with using design to convey anything to a discerning moviegoer who wants to know if a film is likely to meet his individual tastes. They demand market saturation, and they won't risk the possibility that one person in a hundred thousand <em>might</em> not notice the movie poster, or not be able to read the title, or not remember seeing it. They're pretty sure that to use anything more subtle than red on white is to take that risk.</p>
