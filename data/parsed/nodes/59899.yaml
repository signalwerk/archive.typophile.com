  html: |-
    <p>It's often been said that Trajan is an overused font for movie titles (at least until recently). But that seems to apply only to dramas and thrillers and a few other genre. Comedies almost always have their titles set in red extra bold sans-serif fonts on plain backgrounds. </p>
    <p>A collection of such titles are in this <a class="freelinking external" href="http://www.collegehumor.com/video:1911773" rel="nofollow">video at College Humor</a> (SFW, but don't count on it being so for other stuff at that site)</p>
    <p>Is big red text funny for some reason?</p>
