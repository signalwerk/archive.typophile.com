    <p>Hi</p>
    <p>I've been reading the forum here off and on for a couple of years and found that you're a very helpful bunch...so here's a question from me.</p>
    <p>I'm involved in the production of a film titled "The Waiting Room" part of which is set on a British railway station during the Great War (1914-1918). The film investigates the paranormal and the original type for the title had a ghostly feel, however the Director would now like to use something a little less ghostly and use something which reflects the period more appropriately.</p>
    <p>Now if there is a specific typeface for railway stations of the period that would be terrific...unless it was too modern! I get the feeling that an audience for this film would expect a serif type of some description. What's more the railway station would probably have been built in the late Victorian or Edwardian period and not repainted and updated with new signage for a while.</p>
    <p>So expectations are more important than accuracy. One final thing, whatever font is chosen needs to be readily and cheaply available...the movie budget disappeared on hiring a steam train!</p>
    <p>Thanks in advance,</p>
    <p>Ian</p>
