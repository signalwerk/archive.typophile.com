    html: <p>British railway signage of this period would most likely be a sans, or with very small copperplate-style serifs, , but hand-lettered. Greater Albion's <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/chipperly/" rel="nofollow">Chipperly</a> is based on Edwardian railway lettering and is cheap. Jim Parkinson's <a class="freelinking external" href="http://new.myfonts.com/fonts/parkinson/modesto/" rel="nofollow">Modesto</a> has some weights that would be good too.</p>
