      <p>The Smith lettering is really quite elegant; I prefer Paul Shaw's Cresci and Pontif to Facia.</p>
      <p>The WH Smith story is fascinating.<br>
      Among other accomplishments, Smiths was arguably the first advertising agency, designing and selling poster campaigns nationwide in railway stations in the 1850s.<br>
      Smith's 1905 corporate identity (at a time when such things were only just emerging) was strongly informed by St. John Hornby's (their managing director) work as a private press printer — a hobbyist, but much respected. The lettering was Gill's first public success, at age 23.</p>
      <p><a href="http://en.wikipedia.org/wiki/Ashendene_Press" title="http://en.wikipedia.org/wiki/Ashendene_Press">http://en.wikipedia.org/wiki/Ashendene_Press</a><br>
      <a href="http://www.amazon.com/First-News-Smith-Charles-Wilson/dp/0224021567/ref=ntt_at_ep_dpi_5" title="http://www.amazon.com/First-News-Smith-Charles-Wilson/dp/0224021567/ref=ntt_at_ep_dpi_5">http://www.amazon.com/First-News-Smith-Charles-Wilson/dp/0224021567/ref=...</a></p>
