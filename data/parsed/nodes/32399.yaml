      <p>My mistrust of classification systems is well documented, but teleological classification is a respectable Thomistic tradition, so I'll play along with Adam's suggestions. I'm not very happy with the titles 'Strong Stylistic' and 'Weak Stylistic', because these qualifiers seem to undermine the functional focus of the classification. I would probably use, respectively, 'Articulatory' and 'Stylistic'.</p>
      <p>Of course, now we can have a good argument about whether e.g. the 'curs' feature is linguistic, articulatory or stylistic. And the answer is that it might be any of these, or straddle categories, depending on the particular script, language, font and the purposes for which the user is employing the font. And there goes another classification system... :)</p>
