    <p>The font I'm working on, I wanted to have an alternative "i", so I used the salt feature. I have two classes, "i" and "salt", containg the glyphs to change.</p>
    <p><code><br>
    feature salt {<br>
      sub @i by @salt ;<br>
    } salt;<br>
    </code></p>
    <p>First of all, is this the correct way to go ? </p>
    <p>Everything works great within Fontlab in the opentype window, but how do I get it to work in Adobe Indesign or other applications. The opentype menu doesn't seem to have any options to use the alternative glyphs.</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/Picture1_4659.jpg"></div><p></p>
