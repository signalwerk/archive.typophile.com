      <p>I apologize for delivering the brunt of my irritation to your doorstep.</p>
      <p>I find it so strange that Adobe, or the product teams of the individual products, or whoever, doesn't make complying with OpenType as robustly as possible a priority.  When I think of typography, Adobe is one of the first few companies I think of, and it's a standard they helped create.</p>
      <p>The reason Stylistic Sets aren't a solution for what I'm doing is that Indesign is the only of the four CS5 programs I use that supports it.  Premiere probably isn't that big of a deal for me personally, as on the rare occasions I use it it's usually just for personal projects.  Indesign supports it, but Illustrator and Photoshop scratch their collective heads at it.</p>
      <p>The typeface I'm creating is historically related to Win Crouwel's New Alphabet, so the options I'm creating are more appropriate for Stylistic Sets than the "traditional" OpenType features.  An example of this is that I'm providing a set for an overline to represent a doubled character, a monospace set, a monocase set, etc.  OpenType has a unicase tag, but none of CS5 supports it, and a monocase tag isn't in OpenType.  The overlining for doubled characters - effectively a set of double-letter ligatures - is too idiosyncratic to even consider as an OpenType  feature tag.  Stylistic Sets would be ideal, but most of this is per-pixel based work and best suited to Photoshop.  To be a bit more practical, it would help if re-naming the Stylistic Sets were supported, so that someone wouldn't have to guess or consult a cheat sheet.</p>
