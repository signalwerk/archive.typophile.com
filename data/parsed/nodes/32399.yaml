      <p>Thomas, </p>
      <p>I agree that my wording was overly optimistic. My "salt" and "ss01" do not work identically. I guess I should have said that using my implementation, it is possible to achieve largely similar results using "salt" in Illustrator and one or more "ssXX" features in InDesign. Since the "ssXX" features in InDesign are implemented in an additive way, one could say that InDesign offers a finer control than Illustrator but altogether gives access to the same glyphs. </p>
      <p>As you noted, I'm also opposed to "hi-jacking" features that have a clearly defined purpose. This is most true for linguistic and semantic features. Strong stylistic features are a border case -- if there are really good reasons, some hi-jacking would be permissible, within reason. For example, the description of <em>titl</em> in the OpenType spec says <em>"Function: This feature replaces the default glyphs with corresponding forms designed specifically for titling. These may be all-capital and/or larger on the body, and adjusted for viewing at larger sizes. (...) Recommended implementation: The titl table maps default forms to corresponding titling forms (GSUB lookup type 1)."</em>. However, as the English word <strong>titling</strong> is ambiguous (it may stand for "to provide a title for" or "to designate or call by a title"), I could imagine a designer putting fancy abbreviations such as "Mr.", "Ms.", "Mme." into that feature. It would not necessarily go with the exact wording of the specification, but would still make sense by general logic. </p>
      <p>A.</p>
