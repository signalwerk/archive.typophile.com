      <p><cite>Surely it was mechanization that sundered design and production in the 19th C.,, not the pecadilloes of compositors.</cite></p>
      <p>Well, maybe. Take a look at Vincent Steer's <cite>Printing Design and Layout</cite> (London: Virtue &amp; Co, 1934).</p>
      <p><cite>At the beginning of the present century, however, the need for an intervening stage between the written word and the printed word became acute. The printing industry had been split up into sections and where one man formerly performed all the operations necessary in the production  of a piece of printing, now many specialists were required. Printers had lost the art of designing their own work and were soon to lose the proud privilege of doing so. The master printer, having now become a modern business man, was no longer to be regarded as an artist craftsman.</cite></p>
      <p>My take is that it was the time of Victorian excess in the comp world. The comps resisted the intervention of a "layout man," but the print shop owners noticed they got more billable hours out of the comps if they didn't do design as well, do that was that. It pretty much came about because the comps tried to outdo each other with different typefaces &amp; complicated layouts -- not what the customers wanted -- sound familiar?</p>
      <p>BTW, there is one used copy of the Steer at Amazon, cheap (I paid about $50 for my copy). Lots of good out-of-date ornaments if that's your thing.</p>
