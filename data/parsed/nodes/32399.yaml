      <p>It is very appropriate for both Titling Alternates and Stylistic Sets. Language tagging typically makes sense to enforce certain behaviors by default if the text is known to be in a particular language (e.g. the Serbian Cyrillic alternates in "locl", the localized forms feature, specific substitutions for non-Arabic languages that use the Arabic script), or to prevent some behaviors to happen in a particular language that would otherwise occur, but would "spoil" the setting in that language (e.g. the formation of f+i ligatures in Turkish and related languages). </p>
      <p>I think for completely discretionary features where it is not known with certainty that a particular behavior is suitable only for German or not at all for German, restricting a substitution to one language only is not a good idea. </p>
      <p>Best,<br>
      Adam</p>
