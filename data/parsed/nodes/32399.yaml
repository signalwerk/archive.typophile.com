      <p>I think RachelR has her answer, so I hope we’re not really hijacking the thread. OK, I understand that someone may specify “set” is to be used only when there is more than one member, though that borders on Wittgenstein’s grumble about “private language” -– as best I remember my math logic, a set could have no members, one member, or more than one member . . . whatever.</p>
      <p>Here is a true story. We had a book to set where the designer wanted to use text (old style) numbers, and small capitals for acronyms. Pretty normal stuff. As it turned out, there were some acronyms with an “I”, and one that occurred more than once where there was both an “I” and a “1” in the acronym. On seeing sample pages, the editor hit the roof; down came the mandate that either the os figures or the small cap acronyms had to go.</p>
      <p>Putting on my Solomon cap (an unfamiliar role), I made up a os fig “1” that looked like a regular “1” (or like a Minion os “1”). Problem solved. This was back in the Type 1 days, so the glyph was named oneoldstylealt, and since, as I mentioned, we could write our own encoding vector, everything was pretty clear downstream to boot.</p>
      <p>Now how are we going to handle this with OT? The need is there; designers and editors still fuss about their overlapping turf. As I understand it, if we were to put the alternate “1” in the salt feature, then it is on when any of the other features we might want as stylistic alternates are on. Not a happy situation. Moreover, if the “1” variant is to be used throughout the book, it needs to be picked up in ID’s “Paragraph Style Options - Open Type Features” which includes stylistic sets, but not salt, unless I’m wrong yet one more time.</p>
      <p>My point, I hoped, was that the designers of type too frequently don’t pay enough attention to the users of type and their needs. Comps have that problem too, I know. All throughout the 19th century, the lead comp was the designer. But the compositors developed their own aesthetic, and it turned out not to be an aesthetic shared by most people, including the customers who paid the printing bill. Enter the layout man; the comps lost the privilege of designing.</p>
