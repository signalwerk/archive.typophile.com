      <p><em>if you hijack features for your own purposes</em></p>
      <p>It depends on one's perspective. It would seem that Thomas expects font developers to abide by the way Adobe interprets features.</p>
      <p>For instance, by combining figure features, the InDesign implementation of OT figure styles is somewhat of a hack/buggy. Suppose I produce a font with two figure features, pnum and tnum. Now, if an InDesign user clicks on "Proportional Oldstyle", what happens? I just hope that doesn't "damage OpenType's reputation" :-)</p>
      <p>To use Thomas' colourful language, the OT features have been hijacked so that Adobe's OT fonts, all of which have either one or four figure styles, serve the purposes of Adobe's layout applications, or vice versa. Either way, a perfectly legitimate font with two figure features appears buggy, when in fact it is the layout application which is at fault.</p>
      <p>Actually, I have found it quite stimulating to *have* to produce four sets of figure styles, and I have great admiration for Adobe apps--and I always design with them in mind. And like chester, I follow their lead and advice on many things. I only draw attention to this figures issue to demonstrate that it's not an absolute situation, no design is perfect, and as there may be some interpretation involved in implementing OpenType features, there should also be room for flexibility.</p>
      <p><em>Design 10 years into the future</em></p>
      <p>But what if someone who chooses not to upgrade CS1 wants to access a stylistic set with InDesign today, without doing it glyph by glyph from the glyph palette? What possible negative future ramifications will occur if I put the alternates of a font like Softmachine in "Titling"? In fact, that's what I've done, and explained it in the "read me" pdf.</p>
