      <p><cite>To use double-f ligatures, you had to lie about the name, whether you put them in a separate font, like Monotype, or the same font, like some FontFont fonts. So, better not to use them?</cite></p>
      <p>Well, I wouldn't say that it's "better not to use them". The glyphs are in the font and are usable. We agree that the current UI is not very good for stylistic alternates, and using them is a hassle in some cases. (On the other hand, if one is only using an occasional alternate, the current UI in InDesign is quite adequate.)</p>
      <p>But the old Type 1 method which you are describing reinforces my belief that it's better to resist nonintuitive workarounds (which is how I would describe typing cap-Y to get 'ffi'). The appeal of keeping glyphs in appropriate OpenType layout features is an idealistic one for me. If I enter <code>characters + 'titl'</code> into my document, I've just specified a description which is independent of font and application.</p>
      <p>I want to see all applications implement a wide range of layout features, which I am optimistic about -- but when that happens, it will not be so pleasant if all the fonts out there have been built with inconsistent layout features. Imagine how crazy things would be if applying 'bold' to a font produced italics or titling alternates. I don't think layout features are so different from these more entrenched styling choices, and in a world where styling and content are becoming more distinct all the time (HTML, CSS, etc.), it is only becoming more important to ensure that style tags produce the expected visual result.</p>
      <p><cite>And by the way, how did anyone ever get the idea that “set” implied more than one member?</cite></p>
      <p>The same way I learned what lots of other words mean, I guess. (Reading? School?) My Webster's dictionary says:</p>
      <p><cite>a number of things of the same kind that belong or are used together</cite></p>
      <p>My real point with that was that, the way I see it, 'ss**' was meant to be the multiple-glyph version of 'salt'.</p>
