      <p>Rachel, you should avoid the salt feature, which is not a plain 1:1 GSUB lookup. As salt is explained on the Adobe OT Resources page:</p>
      <p>The salt table maps GIDs for default forms to one or more GIDs for corresponding stylistic alternatives. While many of these substitutions are one-to-one (GSUB lookup type 1), others require a selection from a set (GSUB lookup type 3). The manufacturer may choose to build two tables (one for each lookup type) or only one which uses lookup type 3 for all substitutions. </p>
      <p>What you're working with is a GSUB lookup type 1, but of a non-standard kind. In other words, it's not a calt, hist, titl, or swsh. In order for your feature to work in less-OpenType-knowledgeable apps, such as InDesign CS1 you are using, you should use one of the available features, such as titl, and duplicate your feature as a Stylistic Set: SS01. SSes are accessible by InDesign CS2 and Apple's TextEdit, but not Illustrator CS2 for example.</p>
      <p>So, watch out for salt. Until the implementation of the lookup type 3 is sorted out, stay away from it.</p>
