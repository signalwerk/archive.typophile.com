      <p>Mark, we're really talking about two different things. First, what is an OpenType layout feature intended to do? And second, how successfully is a feature supported in an application?</p>
      <p>I can't argue with your observations about feature UI. It is very helpful to be able to specify features in a style sheet, and the fact that one cannot do that with 'salt' is a problem. The real solution, though, is for applications to improve their feature support and UI. 'salt' is a valid and useful feature, and we need applications to handle it better.</p>
      <p>(By the way, in case anyone doubts it: Application users have the most influence over its features. I urge all users to write to application developers and describe UI problems and make suggestions. The more they hear about something, the more likely it is to be addressed. The fact that one cannot easily apply a single 'salt' substitution across an entire document, for example, is something to complain about.)</p>
      <p>Stylistic sets are a tricky business. My recollection is that the feature was conceived as an adjunct to 'salt', as a way to say, "These glyphs are, collectively, a single stylistic alternate and should be used together, not individually." Given that, a stylistic set with one glyph should simply be in 'salt'. I don't know that it's some horrible sin to put a single glyph in a stylistic set, but I'd describe it as inappropriate -- something akin to putting a regular, non-contextual ligature in 'clig' instead of 'liga'. The best argument I can make against single-glyph stylistic sets is that they are not "stylistic sets", they are "stylistic alternates".</p>
      <p>Really though, I understand the real-world situation is less than ideal, and I am sympathetic. I just didn't want the opposing view to go unmentioned, as I think it's worth keeping in mind.</p>
