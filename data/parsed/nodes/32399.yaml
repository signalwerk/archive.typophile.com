      <p>The fact that InDesign allows stylistic sets to be specified in a style sheet <strong>and</strong> that it allows more than one stylistic set to be applied on the same text makes for a powerful combination and implies that they were meant for more than the limited way you describe (presumably the way in which they were intended to be used).</p>
      <p>salt severely limits the usefulness of alternate since they can't be specified in style sheets. Using the Glyph palette to select alternate characters is probably okay for display fonts, but impractical for text. </p>
      <p>Imagine using the Glyph palette to substitute every lowercase "a" with an alternate form in a 300-page book. If it's included as a single character stylistic set instance, you can change the style sheet and every "a" in the book will use the alternate form. And who is to say that a single alternate character could not be considered a valid stylistic set? Why must it be "multiple glyphs"? Especially since we have up to twenty sets to utilize?</p>
      <p>I realize that what I'm describing could be considered a hack. But this is such an incredibly useful and powerful thing that I very much hope that InDesign's implementation of stylistic sets becomes the norm.</p>
