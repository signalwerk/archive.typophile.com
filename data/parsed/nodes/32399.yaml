      <p>I apologize in advance for resurrecting such an old thread, but just like Mighty Pete, I got here exactly the same way - trying to google how to turn on stylistic alternates in InDesign for a font I'm creating.</p>
      <p>I also agree with Thomas Phinney in that "hijacking" OpenType features is a bad idea.</p>
      <p>So, Adobe, quit making us "hijack" OpenType features.  "Hijacking" OpenType is a lot better than not doing the work to create a flexible typography option.  I find the tone of Phinney's post rather galling, as it's the company he works for which has forced my hand.  What are the other options?  Offering different fonts and going back to the bad old days before OpenType?  Not even remotely imaginable.</p>
      <p>The best solution would be for Adobe products to actually support OpenType features consistently and fully.  What I'm doing with my typeface is, in some circumstances, not really covered in OpenType, so my original plan was to create ten different stylistic sets, not including the default.  I can't do this, so then I was forced to "hijack" features to get them to work at all, only to find out how woefully Illustrator is behind the times, and then to discover that the common feature tag support between programs WITHIN CS5 isn't even consistent.</p>
      <p>I'm very irritated that I'm being forced to hijack features due to inconsistent and incomplete support in CS5 for issues that involve OpenType feature tags that have been documented for at least 11 years.  The  tag may be older, but I see references to it in the spec change logs that go back to at least 2000.</p>
