      <p>Pete, I'm afraid this is not news.<br>
      The folks at Adobe, in the different departments of type and the several applications involved, have been aware of the problems with OpenType application support since they first introduced it, and their attention has been drawn to the problems by others (such as <a href="http://www.shinntype.com/Writing/BigThing.pdf" rel="nofollow">myself</a>), since at least 2002.<br>
      For many reasons--the most telling of which is that expert typography is an insignificant part of the graphic design industry --fixing the problems is simply not a priority, although some progress has been made, in Illustrator for instance, where the OT features palette can be brought to the top level.</p>
      <p>I for one am grateful that OpenType exists (and we do have Adobe to thank for that), despite any flaws, inherent or in application support.<br>
      And I'm really excited about the OpenType support in the upcoming MyFonts.com redesign.</p>
