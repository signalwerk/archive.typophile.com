    html: |-
      <p><cite>It’s tempting to look at the features that are supported in popular applications and comandeer them in order to make alternates more easily acccessible, but I personally believe it’s bad practice. I understand the arguments in favor of it, but I don’t necessarily agree with them.</cite></p>
      <p>I understand the sentiment, but don't agree at all. You only have to go back to the Type 1 days &amp; the Windows &amp; Mac operating systems to see the problems with this kind of thinking. To use double-f ligatures, you had to lie about the name, whether you put them in a separate font, like Monotype, or the same font, like some FontFont fonts.   So, better not to use them?</p>
      <p>Of course, if you weren't stuck with those kludge programs Quark and PageMaker, or with Windows or Mac OS, you could do as you chose. We ran TeX out of a DOS box, so could write a legitimate encoding vector to include whatever glyphs we wanted. Features for fonts aren't new -- a little thing most people don't know was that you could put ligaturing instructions in an AFM file, and if your typesetting program made use of it (the AFM), you would get automatic ligaturing -- fj gg, zy, ggy, no problem.</p>
      <p>The point is that end users, so often ignored, turn the tables when it is time to get work done -- we have to ignore your whims, while thanking you for the basic tools.</p>
      <p>And by the way, how did anyone ever get the idea that "set" implied more than one member?</p>
    html_clean: |-
      <p><cite>It’s tempting to look at the features that are supported in popular applications and comandeer them in order to make alternates more easily acccessible, but I personally believe it’s bad practice. I understand the arguments in favor of it, but I don’t necessarily agree with them.</cite></p>
      <p>I understand the sentiment, but don't agree at all. You only have to go back to the Type 1 days &amp; the Windows &amp; Mac operating systems to see the problems with this kind of thinking. To use double-f ligatures, you had to lie about the name, whether you put them in a separate font, like Monotype, or the same font, like some FontFont fonts.   So, better not to use them?</p>
      <p>Of course, if you weren't stuck with those kludge programs Quark and PageMaker, or with Windows or Mac OS, you could do as you chose. We ran TeX out of a DOS box, so could write a legitimate encoding vector to include whatever glyphs we wanted. Features for fonts aren't new -- a little thing most people don't know was that you could put ligaturing instructions in an AFM file, and if your typesetting program made use of it (the AFM), you would get automatic ligaturing -- fj gg, zy, ggy, no problem.</p>
      <p>The point is that end users, so often ignored, turn the tables when it is time to get work done -- we have to ignore your whims, while thanking you for the basic tools.</p>
      <p>And by the way, how did anyone ever get the idea that "set" implied more than one member?</p>
