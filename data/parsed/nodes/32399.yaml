      <p>I hear and share your frustration.</p>
      <p>Getting a glyph palette in Photoshop would be fabulous. The best current work around is to get what you want in Illustrator and copy/paste it into Photoshop. (Illustrator and Photoshop share a text engine, while InDesign has a different one.)</p>
      <p>To be fair, Adobe was big and silo'd even before Warnock and Geschke left day-to-day running of the company. It's gotten worse, but that is as much a function of pure size as anything else.</p>
      <p>Much as I wish I had stylistic sets in Illustrator and Photoshop, and that InDesign and the others all supported showing "friendly names" for Stylistic Sets, I understand the motivations of the product managers for these products. As basic as typography is to me, and to most of the people reading posts on a site called "Typophile," the product managers are looking at what gets user demand and what solves the problems that users complain about. The PMs can do the stuff that they are really sure will sell, or they can take a chance that if more/better typography is dangled in front of the users that those users will turn out to appreciate it in the end. As long as the list of sure winners is sufficient, the stuff you and I really want is not making the cut.  :(</p>
      <p>Chris: The golden age might not have been as golden as you think. Some time ask me in person and in private exactly how we got the big burst of OpenType features in InDesign 2.0.....</p>
      <p>Cheers,</p>
      <p>T</p>
