      <p>Maybe I'm just grouchy today or something, I dunno.</p>
      <p>Predictably enough, I'm with Christopher on this one. I'll also go so far as to add that if you hijack features for your own purposes, you are making a font that can reasonably be called a hack, or even buggy.</p>
      <p>On the other hand, perhaps I should be more appreciative; if other folks make sub-standard OpenType fonts, more people will want to buy ours instead. I just hope it doesn't damage OpenType's reputation.</p>
      <p>This discussion reminds me of a popular OpenType script font that uses the 'calt' feature for non-contextual substitutions of ending forms. Since 'calt' is on by default, this means that typing with this font in common applications such as InDesign yields ending forms in the middle of words... sigh.</p>
      <p>Charles: the reason that some people think stylistic sets should affect more than one glyph is not because they don't know the definition of "set" but because the OpenType feature registry says so.</p>
      <p><cite>Function: In addition to, or instead of, stylistic alternatives of individual glyphs (see 'salt' feature), some fonts may contain sets of stylistic variant glyphs corresponding to portions of the character set, e.g. multiple variants for lowercase letters in a Latin font. Glyphs in stylistic sets may be designed to harmonise visually, interract in particular ways, or otherwise work together.</cite></p>
      <p>Cheers,</p>
