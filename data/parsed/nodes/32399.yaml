      <p>Rachel, what you're doing is fine, but you should choose a different feature; one which is supported by all of the applications you want to use the font in.</p>
      <p>I screengrabbed all of the OT interfaces from the CS2 apps. You can view them here:<br>
      <a href="http://vllg.com/files/cs2/" title="http://vllg.com/files/cs2/">http://vllg.com/files/cs2/</a></p>
      <p>I would nominate Titling Alternates in your case.</p>
      <p>feature titl { # Titling Alternates<br>
      # Latin<br>
      sub i by i.alt;<br>
      } titl;</p>
      <p>And use a stylistic set too:</p>
      <p>feature ss01 { # Alternate lowercase i<br>
      # Latin<br>
      sub i by i.alt;<br>
      } ss01;</p>
      <p>I believe that you need to have a GPOS feature - kern, for example - in the compiled OT file in order for the GSUBs to work.</p>
      <p>Good luck.</p>
