      <p>Thomas, </p>
      <p>&gt; Yes, the English word “titling” is ambiguous, which<br>
      &gt; is why instead of an English word we use a feature<br>
      &gt; tag and we define what that feature tag means. So<br>
      &gt; the example you give is a great example of a designer<br>
      &gt; doing something they shouldn’t.</p>
      <p>Let’s analyze the feature description: <em>"This feature replaces the default glyphs with corresponding forms designed specifically for titling. These may be all-capital and/or larger on the body, and adjusted for viewing at larger sizes."</em></p>
      <p>A fancy "Mr." ligature is a "corresponding form designed specifically for titling". Not "titling" as in "to provide a title for" but "titling" as in "to call by a title". </p>
      <p>The feature description then goes on to speak what the corresponding forms <em>may</em> be. Just by reading the feature description, it does not say that a fancy "Mr." ligature with a raised and underscored "r" is <em>not</em> what this feature is for. As I said, the word "titling" is ambiguous, and the <em>titl</em> feature description does not clarify whether it is only one of the meanings that it is intended for. The example cited in the feature description (<em>"The user applies this feature in Adobe Garamond to get the titling caps"</em>) shows one possible solution, but it is not exhaustive. </p>
      <p>It was not me who wrote the feature descriptions in the OpenType specification. An average font developer <em>may or may not know</em> what the developers of the specification <em>had in mind</em> when writing the wording. </p>
      <p>If you must, please accept this contribution of mine as a call for clarification of the feature description of <em>titl</em> to minimize possible implementations that you consider non-conformant. </p>
      <p>A.</p>
      <p>Ps. Please keep in mind that non-native speakers such as myself tend to read texts more literally if they do not necessarily know the cultural background. Perhaps for you, it is obvious what exactly the word "titling" means in this context. For me, it is not.</p>
