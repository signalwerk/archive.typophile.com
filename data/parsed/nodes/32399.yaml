      <p>Adam: Yes, the English word "titling" is ambiguous, which is why instead of an English word we use a feature tag and we define what that feature tag means. So the example you give is a great example of a designer doing something they shouldn't. In any case, even that kind of logic would not support putting a sylistic variant of a lowercase "i" into 'titl'.</p>
      <p>Mark et al: Personally, I would not consider it egregious to have a stylistic set that only affected one glyph. I do think it would be a really bad idea to put completely unrelated things in a single stylistic set, as the whole point of a stylistic set is to get a consistent look, and it's meant to be applied globally.</p>
      <p>Also of note is the idea that 'salt' is meant to be applied on a single character at a time, and implies a UI that allows the user to pick which alternate they want for the character being affected.</p>
      <p>Josh: The functionality you're asking for is already possible and has been implemented in some fonts that work with shipping applications today. The 'rand' feature is not directly supported, but can be imitated by contextual substitutions. Given that context can go across words, the same word can be made to appear differently when typed repeatedly in different contexts, as one can see with "the" in Bickham Script Pro.</p>
      <p>Nick: <cite>It would seem that Thomas expects font developers to abide by the way Adobe interprets features.</cite></p>
      <p>No, I simply expect developers to abide by the published specs.</p>
      <p>You bring up a quite different (though certainly important) question of application support and UI. I have certainly never argued that InDesign's UI for OpenType features is wonderful. I agree that it could stand improvement in a variety of ways, and have repeatedly suggested that if other people are unhappy about it, they should put in a feature request so that the InDesign team will know that people are unhappy (<a href="http://www.adobe.com/cfusion/mmform/index.cfm?name=wishform" title="http://www.adobe.com/cfusion/mmform/index.cfm?name=wishform">http://www.adobe.com/cfusion/mmform/index.cfm?name=wishform</a>). But as of a few weeks ago, going through the entire InDesign feature request database for the previous year, NOT ONE PERSON made such a request, and hardly anyone has asked for support for more OpenType layout features. This despite thousands of feature requests.</p>
      <p>So, Nick, if that bothers you enough to write about it here, you should make a feature request. Otherwise you're like people who complain about the actions of elected leaders but can't be bothered to vote. It's not like I haven't pointed out the link before:<br>
      <a href="http://www.adobe.com/cfusion/mmform/index.cfm?name=wishform" title="http://www.adobe.com/cfusion/mmform/index.cfm?name=wishform">http://www.adobe.com/cfusion/mmform/index.cfm?name=wishform</a></p>
      <p>Cheers,</p>
      <p>T</p>
