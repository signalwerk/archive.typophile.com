      <p>My own understanding is that OpenType Layout features can perform several different functions. In my own terminology, OpenType Layout features can perform five different kinds of tasks: </p>
      <p><strong>a) linguistic</strong>: there is a very strong inherent meaning to the feature; the feature performs a task that is crucial in the process of producing linguistically (orthographically) correct text. Usually, there is an established orthographic tradition when such features are applied, and they are usually applied automatically by the typesetting software. Such features are <em>init</em>, <em>medi</em>, <em>fina</em> or <em>isol</em> for Arabic, <em>haln</em> or <em>nukt</em> for Indic scripts, <em>rlig</em>, <em>locl</em> or <em>ccmp</em> for all writing systems, and many others.<br>
      <strong>b) semantic</strong>: the feature has some clearly defined purpose, and affects the semantic aspect of the text — as well as the visual side. Typically, its use is discretionary but there is an established typographic tradition of when such features are applied, i.e. whenever a feature is applied, the general reader knows what this accentuation means. Such features include <em>sups</em>, <em>subs</em> and <em>sinf</em> commonly used in scientific purposes, <em>frac</em>, <em>numr</em>, <em>dnom</em> and <em>afrc</em> to denote fractions, <em>hist</em> to indicate a shift in the historical context of the text, <em>ornm</em>, <em>ordn</em> and others.<br>
      <strong>c) casing</strong>: the feature assists the typesetter in case conversions. It is a border-case between semantic and articulatory function, and deserves a class of its own. Use of different case may affect the semantic aspect of the text (e.g. proper names) or just the visual side (emphasis, headlines). The features include <em>smcp</em>, <em>c2sc</em>, <em>case</em>, <em>pcap</em>, <em>c2pc</em>, <em>unic</em>, <em>cpsp</em>.<br>
      <strong>d) articulatory</strong>: the feature has a defined purpose but there is not commonly-accepted convention, or code, that allows the reader to decipher the function; the convention needs to be established on a per-publication basis, e.g. <em>zero</em>, <em>swsh</em>, <em>cswh</em>, <em>titl</em>, <em>dlig</em>, <em>onum</em>, <em>lnum</em>. Such features may also be used to solve purely visual tasks, e.g. <em>jalt</em>, <em>kern</em>, <em>pnum</em>, <em>tnum</em>, <em>curs</em>. For non-cursive writing systems, this also includes <em>init</em>, <em>medi</em>, <em>fina</em>.<br>
      <strong>e) stylistic</strong>: the feature has no defined purpose and is used solely to diversify the visual aspect of the text or assists in solving of typographic problems, e.g. <em>ss01</em>–<em>ss20</em>, <em>salt</em>, <em>liga</em>, <em>calt</em>, <em>aalt</em>. </p>
      <p>Each feature typically is tied to one of these functions, but some features can perform different functions. For example, features such as <em>curs</em>, <em>init</em>, <em>medi</em>, <em>fina</em> can perform linguistic, articulatory or stylistic functions, depending on the particular writing system, language, font and the purposes for which the user is employing the font. </p>
      <p><em>My own view:</em> Substitutions defined in features classified as performing semantic or articulatory functions, as well as some liguistic features (<em>ccmp</em>, <em>locl</em>) may also be duplicated in the stylistic features. "Hi-jacking" of the linguistic, semantic or casing features (i.e. implementing functionality in them that contradicts their defined function) should be avoided at all cost. The stylistic features can be "hi-jacked" practically without limitations: it really is up to the designer what kind of functionality gets implemented in <em>ss01</em>–<em>ss20</em>, <em>salt</em>, <em>liga</em>, <em>calt</em>. "Hi-jacking" of articulatory features should be avoided, but in some very specific cases exceptions can be made. For example, the <em>zero</em> feature might perhaps substitute some other glyphs except "zero" if the designer deems it necessary, or instead of a slashed zero, a different form of the zero glyph (clearly distinct from "O" but not necessarily using a slash) might get inserted. </p>
      <p>For <em>ssXX</em> and <em>salt</em>, I personally always consider them to have a similar, "pivotal" relation to each other. In the fonts I develop I typically first develop the semantic and articulatory features.  </p>
      <p><code>feature fina {<br>
        lookup fina1 {<br>
          sub a by a.fina;<br>
          sub e by e.fina;<br>
        } fina1;<br>
      } fina;</code></p>
      <p>feature swsh {<br>
        lookup swsh1 {<br>
          sub b by b.swsh;<br>
          sub g by g.swsh;<br>
        } swsh1;<br>
      } swsh;</p>
      <p>feature hist {<br>
        lookup hist1 {<br>
          sub r by r.hist;<br>
          sub M by M.hist;<br>
        } hist1;<br>
      } hist;</p>
      <p>Then, I develop the stylistic features. I start off with stylistic sets. In addition to substitutions that only happen within the stylistic sets, I also make sets that duplicate the functionality of some of the previously defined semantic and articulatory features. Pretty much any semantic or articulatory substitution can also in addition be viewed as a stylistic substitution -- users may want to use a different glyph not because they want to express a different function but also simple because they like it visually. I wouldn't go so far and duplicate the basic casing features (<em>smcp</em>, <em>c2sc</em>, <em>case</em> etc.) onto stylistic sets, but would do so for their alternates, e.g. if a font has several sets of small caps, I'd include <em>pcap</em>/<em>c2pc</em> but also make the petite caps a stylistic set <em>ss01</em> and stylistic alternate <em>salt</em> for the small caps. Similar, alternate fractions (<em>afrc</em>) should be IMO also stylistic sets of regular fractions (<em>frac</em>) -- at least for precomposed fractions. </p>
      <p>So, my <em>ssXX</em> features might look like: </p>
      <p><code>feature ss01 {<br>
        sub a by a.ss01;<br>
        sub b by b.ss01;<br>
        sub c by c.ss01;<br>
      } ss01; </code></p>
      <p>feature ss02 {<br>
        sub a by a.ss02;<br>
        sub d by d.ss02;<br>
      } ss02;</p>
      <p>feature ss03 {<br>
        lookup fina1; # Same as "fina"<br>
      } ss03; </p>
      <p>feature ss04 {<br>
        lookup swsh1; # Same as "swsh"<br>
      } ss04; </p>
      <p>feature ss05 {<br>
        lookup hist1; # Same as "hist"<br>
      } ss05;</p>
      <p>Finally, I create the stylistic alternates feature (<em>salt</em>) which implements the same substitutions as the <em>ssXX</em> features but using one-to-one out of many lookups. Since Illustrator only supports the first alternate, stylistic alternates in Illustrator works exactly the same as stylistic set 1 in InDesign: </p>
      <p><code>feature salt {<br>
        sub a from [a.ss01 a.ss02 a.fina];<br>
        sub b from [b.ss01 b.swsh];<br>
        sub c from [c.ss01];<br>
        sub d from [d.ss02];<br>
        sub e from [e.fina];<br>
        sub g from [g.swsh];<br>
        sub r from [r.hist];<br>
        sub M from [M.hist];<br>
      } salt;</code></p>
      <p>I found this approach rather logical, consistent and also predictable for end-users. </p>
      <p>I wonder what your thoughts on this might be. </p>
      <p>Best,<br>
      Adam</p>
      <p>Ps. Edited: by John Hudson's suggestion, I replaced "strong stylistic" with "articulatory" and "weak stylistic" with "stylistic". Also added a paragraph explaining that while most features are tied to one function, some features can be tied to different functions depending on the script, language or font.</p>
