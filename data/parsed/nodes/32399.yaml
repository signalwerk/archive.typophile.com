      <p>We come up with feature functionality before giving it a name, so to argue that one can interpret the name of a feature one way or another is beside the point. The thing to consider is its specification and (lacking clarity there) its intended function. The stylistic sets features were conceived (IIRC) to gather more than one alternate and activate them together. Anyone is welcome to interpret a feature's function differently, but in the end, font developers will benefit from knowing what the intended, agreed-upon function of a feature is, to ensure that what they implement in their font will be consistent with those from other developers.</p>
      <p>That said, the discussion about the difference between 'salt' and 'ss**' is more difficult than is typical, because the general concept of stylistic alternates is quite fuzzy compared to other features. For example, if one applies 'smcp' to a letter, it's pretty obvious what one should get. OTOH, if one applies 'salt' to a letter, all one knows is they should get "some stylistic alternate." Such an expectation is pretty vague, and certainly can't be expected to be consistent between different font families. Also, applications will probably always have different UIs for 'salt' and 'ss**', because the former is often "one from many", and the latter is always "one to one". (The reason there are multiple 'ss**' features is kind of a way of implementing "many to many from many".)</p>
      <p>I don't think all this is a matter of "insistence" or "bureaucracy". I only think that a specification exists to create a standard on which people can depend to ensure consistent and successful results is a world where many things (fonts, applications, OSes) interact. I think the best way to ensure successful, pleasing layout features is to follow a specification, so I recommend that. Everybody else is quite welcome to do differently, with the inherent advantages, disadvantages, and risks. As we know, taking liberties with a layout feature's specified function has some appeal, but I just want everyone to be aware of the downside, too.</p>
