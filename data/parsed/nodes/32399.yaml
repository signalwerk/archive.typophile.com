      <p>Adam, a very nice &amp; thorough job of thought &amp; explanation.</p>
      <p>Having said that, there are always matters that do not fall nicely into categories. I stayed out of the "small cap numbers" thread, but consider that there is  a style <cite>Harvard Blue</cite> where titles are set cap-small cap. It is a fairly common legal style. Now any numbers occurring withing the book titles in this style should NOT be set with small cap lining figures, but with either full lining or old style, depending on the figure style of the journal.</p>
      <p>But the feature one would turn on to set the titles would be "small caps," so as to make setting the Cap-small caps easier, and to avoid blocking kerning between the full &amp; small caps. And for this reason, I wouldn't want the small cap feature to include small cap lining features.</p>
      <p>From my perspective then, small cap figures belong in a stylistic set. I agree it is debatable.</p>
      <p>Best,</p>
      <p>Charles</p>
