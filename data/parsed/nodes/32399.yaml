      <p>As you know, most or all of us at Adobe disagree with you on the acceptability of "hijacking"; we think it should either never be done, or certainly not for mere convenience in a regular retail font.</p>
      <p>That being said, some features are flexible enough that few uses of them are likely to constitute hijacking. I think this is true of 'salt' and 'ssXX'.</p>
      <p>The type of hijacking that I find most objectionable is when there is a feature that is clearly defined for one purpose, and that is the purpose in question, but the font developer chooses to assign another feature as well or instead because of what happens to be supported in current versions of applications, and that other feature has a clearly defined and contrary meaning to the glyphs being put in it.</p>
      <p>As an example, putting ending forms into 'calt' (connecting/contextual alternates) in a way that causes them to show up even in the middle of a word when 'calt' is on, is bad practice. Especially so given that 'calt' is supposed to be on by default. Also undesriable would be putting an arbitrary stylistic alternate into 'titl' (titling alternates).</p>
      <p>Many of these sorts of things will be reasonable candidates for a stylistic set and perhaps a stylistic alternate.<br>
      I will continue to label such fonts as broken and buggy. I think that making fonts in this way is bad for everybody in the long run, even if it seems convenient in the near term. Yes, you can get much better performance out of your 16-cylinder font, but the gas consumption and emissions are long-term problems.</p>
      <p>As a side note, your code example of 'salt' does not function identically to 'ss01' the way you say it does, unless your 'ss01' happens to also invoke some ".ss02" glyphs and some ".hist" glyphs, etcetera.</p>
      <p>Regards,</p>
      <p>T</p>
