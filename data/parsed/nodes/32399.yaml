      <p>I know this conversation is as old as the (OpenType) hills, but what everyone is advocating is not ideal, from my perspective.</p>
      <p>Many OpenType features are really the same -- they substitute one glyph for another, in the case of 'titl' or 'smcp' or 'sups'. The reason there are different features is that the feature itself conveys information about the substitutions it comprises. If you put an alternate in 'titl' that is not a titling alternate, then you are telling an application "this font has one or more titling alternates" when it actually doesn't.</p>
      <p>It's tempting to look at the features that are supported in popular applications and comandeer them in order to make alternates more easily acccessible, but I personally believe it's bad practice. I understand the arguments in favor of it, but I don't necessarily agree with them.</p>
      <p>My opinion is that your alternate i belongs in 'salt'. If it truly is a titling alternate, then of course it's appropriate to put it in 'titl'. Whether it correctly belongs in a stylistic set ('ss**' feature) is even murkier; I personally think that stylistic sets should be reserved for multiple glyphs which are intended to be substituted together, not single alternates.</p>
      <p>Of course in InDesign, alternates from 'salt' are available through the glyph palette.</p>
      <p>In the long run, I think it's better to keep glyphs in appropriate features, because we all hope that one day soon that OpenType feature UI will improve, and when that day comes, font users will find that their fonts behave consistently and predictably.</p>
