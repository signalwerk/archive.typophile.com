      <p>Charles, the emergence of the layout man, later to be termed art director or graphic designer, was due to more widespread phenomena than just changes in typography. Mechanization happened in all areas of publishing. "The Origins of Graphic Design in America 1870-1920" by Ellen Mazur Thomson is the best work I've come across on the phenomenon. </p>
      <p><em>Also undesriable would be putting an arbitrary stylistic alternate into ‘titl’ (titling alternates)</em></p>
      <p>Thomas, "titling" is the least logical of the "discretionary alternates", because really it's just a lazy way of not making another font. After all, what is the difference between titling and a display/size-specific ("optical scaling") font? Surely typographers should have access to (almost) all characters in a font at display size?  It seems to me that "titling" was instituted to accomodate Adobe Garamond's titling caps -- meanwhile types such as Kepler, Freight, Filosofia, Requiem etc. offer the whole shebang. Therefore it deserves to be repurposed!</p>
