      <p>Nick, </p>
      <p>since Titling Alternates is an "articulatory" feature and Stylistic Sets is a "stylistic" feature, I think it is quite fine to place the Inline, “Tooled”, or Decorative Capitals into the "titl" feature and *also* have them as one of the "ssXX" features. I think everybody agrees that there is no problem with having the same glyphs being invoked through different features, as long as each and every of these paths does not conflict with the registered description or the intended meaning of each of these features. A set of decorative capitals is both "titling" and "stylistic", and you don't have to make an "either or" choice. </p>
      <p>A.</p>
