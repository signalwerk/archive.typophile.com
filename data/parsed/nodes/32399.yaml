      <p>Adobists-</p>
      <p>I would expects a spec-positive approach from anyone developing fonts inside Adobe. Not only have they co-authored the specification, but are large and need a consistent toolbox for everyone internally.</p>
      <p>Nevertheless, what makes a font OpenType, is the file format (talbes) and a digital signature. This is accessible to anyone. The structuring of the specification is not. The value of OpenType to Adobe is increased by Metcalfe's law, so your OT fonts increase in value with the aggregate output of outside developers--but without being part of the spec design, they (we) are a lawless horde, which tends to complicate things.</p>
      <p>Likewise, I do not think it is unfair for others to expect that Adobe will implement all the features they sponsored for inclusion prior to dictation of best practices. I take most earnestly the recommendations that are implemented by them, not just stated. They are the only (of all two) specification designers that has a strong position in actual dtp software and font development. After all, why else should they determine the final wording of the specification? (Example: 'RAND')</p>
