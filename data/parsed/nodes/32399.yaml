      <p>&gt;&gt; an umlautted n, as an homage to Spinal Tap.<br>
      &gt; Sounds like a candidate for Unicode.</p>
      <p>It is in Unicode. The Unicode Standard encodes it as <em>U+006E U+0308</em>. The character does not have a precomposed form, but it does not necessarily need one. In an OpenType font, you’d define a mark attachment feature <em>mark</em> so that "n" followed by "dieresiscomb" snap into place, and optionally, you could also supply a precomposed glyph named "uni006E0308" that you’d access through the <em>ccmp</em> feature. </p>
      <p>A.</p>
