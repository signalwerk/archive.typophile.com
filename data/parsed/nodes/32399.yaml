      <p>If you are talking about multiple glyphs to be substituted by a single combined glyph, then you have to label it as a ligature. Not all ligatures must be substituted automatically. Besides the discretionary ligatures you could also employ the feature clig. That lets you define the context of a ligature, however, both calt and liga features must be active for it to work as far as I've seen.</p>
