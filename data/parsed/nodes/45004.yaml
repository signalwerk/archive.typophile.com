      <p>I suppose it may depend on whether or not we consider the Montaigne type to be “pre-Centaur” or not. There was a set of different caps cut for its use at the Metropolitan museum and its Press.</p>
      <p>But maybe when you say “alternative glyphs” maybe you mean something beyond just alt caps at a different size.</p>
      <p>Good luck with this.</p>
