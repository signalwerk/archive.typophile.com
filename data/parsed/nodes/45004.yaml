    <p>Has anybody here looked at any Alternative Glyphs for existing type cast by Bruce Rogers before he designed Cenataur? I was talking to Kay Amert today and she said Blumenthal mentions them in his book on Bruce. I will try to get the book of course but in the meantime I thought it would good to know what Typophiles think about it.</p>
