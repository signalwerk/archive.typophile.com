      <p>Eben:</p>
      <p>I’m assuming you know the little book called “The Centaur Types” by Bruce Rogers? Chicago: October House, 1949. Maybe this has some of that info on alternate sorts? I recall that in one part it talks about—I think—some alternate uppercase sorts For the Montaigne type that was Centaur’s precursor.</p>
      <p>I’m not sure where you can get this book. A few years ago a bunch of copies came on the market. Maybe through APHA. I’d reckon some libraries with good holdings about type would have it. There was also an even smaller book about that type published by I cannot recall whom; sorry. Both of mine, like most of my type books, are buried away. I need a few hundred feet of new bookshelves in this old house.</p>
      <p>powers</p>
