    html: |-
      <p>ANIMALS PASTURES CREAM is an interesting combination of influences. Very likely lettering. If it is a font, I don't recall it offhand. So my comments would apply to a matching font, if found, and to the letters themselves. My first thought when seeing this was that someone had taken a chiseled font like Berthold Wolpe's Albertus <a href="http://www.myfonts.com/fonts/adobe/albertus/" title="http://www.myfonts.com/fonts/adobe/albertus/">http://www.myfonts.com/fonts/adobe/albertus/</a> and applied the swoosh treatment to soften the contours and give it an "organic" mood. Foxtail terminals, tilde crossbars and mini serifs -- very bovine.<br>
      Don</p>
