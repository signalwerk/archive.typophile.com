      <p>Great to see that the creative lettering abilities of Frank Atkinson, Samuel Welo, Ross George [Speedball], Alf Becker and other great lettering artists of the past, are shown by a modern lettering artist like Alan Ariail. His blog seems to be a good source of letter design ideas.<br>
      Don</p>
