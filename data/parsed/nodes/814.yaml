    html: <p>Thanks Yves for the welcome, I was hoping I hadn't walked into a closed little club where I would be ignored until I went away. I've been impressed by the expertise I've read so far, and hope I can make a contribution too.  The atmosphere here is a bit different than the newsgroups where I usually participate, and it's nice not having to sift through all the posts to find an ID request that has been unanswered. I'm looking forward to participating here.</p>
