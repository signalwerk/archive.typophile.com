    html: <p>The font is Jukebox "Opulence", a reincarnation of  a Photolettering Script called Zoom Script in the Solotype Catalog. See sample at <a href="http://bowfinprintworks.com/Script01Pg5.html" target="_blank">http://bowfinprintworks.com/Script01Pg5.html</a></p>
