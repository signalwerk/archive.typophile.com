  - id: 5952
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Hi Mike - <br> <br>I think I should have clarified something in my previous post. I wasn't debating whether or not Jason based Opulence on the older version - I think it's pretty clear that it was used as inspiration somewhere along the line. I was just trying to show that there is enough difference between the original sample posted by Misa and Opulence to perhaps keep looking for a closer match. Opluence certainly displays the right flavour and style. I guess it depends on how close to identical the type needs to be.</p>
