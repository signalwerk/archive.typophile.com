    <p><a href="https://web.archive.org/web/20080905211400/http://wordle.net/create"></a></p><div class="imageWrap"><a href="https://web.archive.org/web/20080905211400/http://wordle.net/create"><img src="/web/20080905211400im_/http://www.typophile.com/files/tag-cloud2Picture9_6593.png"></a></div><p></p>
    <p><a href="https://web.archive.org/web/20080905211400/http://wordle.net/create">Wordle</a> (no, not worlde) is has a pretty impressive world cloud generator. It’s not quite a tag cloud, as that would imply that it’s linked to content somewhere, but the visual algorithms are pretty cool.</p>
    <p>(Lastly, I can’t vouch for the source of the fonts in use - there are a half dozen to choose from. They’re not font names I readily recognize.)</p>
