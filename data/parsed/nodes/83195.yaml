    <p>&nbsp;<br>
    <strong>FontExplorer X Pro version 2.2 for Windows Debuts</strong></p>
    <p>Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, and its subsidiary, Linotype GmbH, have launched their award-winning FontExplorer® X Pro font management solution for standalone Microsoft® Windows® platforms. FontExplorer X Pro version 2.2 for Windows is available at <a href="http://www.fontexplorerx.com" title="www.fontexplorerx.com">www.fontexplorerx.com</a>. </p>
    <p>Standalone Windows users can now take advantage of comprehensive features and an intuitive look-and-feel that are an integral part of the workflow for thousands of Macintosh® customers. FontExplorer X Pro for Mac® computers has become recognized for its feature set that far exceeds competitive offerings yet remains easy to use even for casual users. Last week, Macworld gave the newest Mac version of FontExplorer X Pro its highest possible five-mouse rating. </p>
    <p>Prior to today's launch, FontExplorer X Pro was available for Windows as part of a client-server set-up. "Windows is the preferred platform in some creative areas which often aren't managing and centralizing their data with the help of a server. These customers have typically had to refrain from deploying professional font management. Now we've closed the gap," said Tobias Meyerhoff, senior product manager for FontExplorer X at Monotype Imaging's Linotype subsidiary. </p>
    <p><strong>About FontExplorer X Pro</strong></p>
    <p>FontExplorer X Pro enables individuals to easily manage, activate and organize fonts and also discover and experiment with new typefaces that can be added to font collections. Designed for quick, efficient and reliable font management, FontExplorer X Pro features an enhanced user interface with a configurable toolbar, activation control, at-your-fingertips font information, entry into an integrated store featuring thousands of typefaces, backup functions and access to FontExplorer X Server, which adds network administration to a FontExplorer X Pro client solution, providing a complete system for organizing, exploring and buying fonts, while also managing font licenses. </p>
    <p>With FontExplorer X Pro, users gain flexible capabilities such as the ability to individually sort fonts into groups or be classified by projects, customers, topics or categories. Fonts can be compared with each other or activated in specific documents. FontExplorer X Pro features a look-and-feel that mimics popular applications and contains plug-ins for the Adobe® Photoshop®, InDesign®, Illustrator® and Creative Suite® products as well as the QuarkXPress™ 9 application. If a document is opened which has been generated with the help of one of these applications, fonts are automatically activated on demand by the plug-in. </p>
    <p><strong>Availability and system requirements </strong> </p>
    <p>FontExplorer X Pro 2.2 for Windows is available at <a href="http://www.fontexplorerx.com" title="www.fontexplorerx.com">www.fontexplorerx.com</a> for $79 for a single user license or €79 (including VAT) or ₤59 (excluding VAT) and supports the English and German languages. The software operates in 32-bit and 64-bit Windows environments and has been optimized for Windows XP SP3, Windows Vista® SP2 and Windows 7. </p>
    <p><strong>About Monotype Imaging</strong></p>
    <p>Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Linotype and FontExplorer are trademarks of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Microsoft, Windows and Windows Vista are either trademarks or registered trademarks of Microsoft Corp. in the U.S. and/or other countries. Macintosh and Mac are trademarks of Apple Inc. registered in the U.S. Patent and Trademark Office and other countries. Adobe, Photoshop, InDesign, Illustrator and Creative Suite are either registered trademarks or trademarks of Adobe Systems Inc. in the U.S. and/or other countries. QuarkXPress is a trademark or registered trademark of Quark, Inc. and its affiliates in the U.S. and/or other countries. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
