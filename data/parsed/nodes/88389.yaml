    html: |-
      <p>Columns are multiple rows. You could have a 10-row grid, with 3 columns, one at 2 rows, two at 4, for instance.</p>
      <p>The subdivison of a column in rows has its use when you have to incorporate block-quotes over two columns, or when one has to incorporate a table into text matter. By using the smaller unit there is a solid underpinning to the overall design.</p>
      <p>In webdesign this setup is called a framework, in graphic design a grid. </p>
      <p>In addition: if you base the width of the rows on the baseline you have the kind of grid Brockhaus proposes. This leads to layouts that have a strong relationship between vertical and horizontal elements.</p>
