    html: <p>I would recommend an odd number of columns in your grid. Back in my previous life as a publications designer, I preferred 11 and 13 column grids. They lent themselves to the most flexibility. Willi Kuntz had a lot to say on odd numbered grids. I learned a lot of this from his American protege Will Hopkins of Hopkins/Baumann.</p>
