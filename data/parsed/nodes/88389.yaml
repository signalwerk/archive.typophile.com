    html: <p>I guess I would be asking in general. Not a specific project but if that sort of grid structure would be overkill. I guess I ask this because when I set up the guides at least in InDesign it doesn't line up with the baseline grid (I could be doing it wrong). I really like the structure of a lot of columns and rows, at the same time I just don't know if it would be overkill. I was reading a book on typography where the person showed the behind the scenes of the structure of the book and the book seemed to use only columns (but maybe they had another way to divide the content vertically). I want to get a copy of the book on grids again. But anyways thanks for the replies. I really appreciate it. Any other opinions on this topic would be appreciated as well. I'm working on all sorts of printed stuff right now. Editorial articles mainly right now, thinking about this grid structure for posters, brochures and other printed materials.</p>
