  html: <p>I have been tweaking my grids. I am trying to finalize a grid for a layout. One thing I'm having trouble with is if the rows are needed within the grid? Or is the columns enough to structure content? I am asking this because in InDesign I have a baseline grid set up and also have rows to kind of see a division of content(if needed). I am wondering would this be overkill? Would I just either have rows or baseline grid? I feel like rows give potential for divided up the content vertically but I am not sure if the baseline grid is already in a way accomplishing that job. I remember seeing the grids in Josef Muller Brockmann's Grid Systems, which is what gave me an appreciation for grids and they always seemed to have both columns and rows not sure about the baseline but I think it would make sense so the copy lines up. Thanks all opinions would be appreciated.</p>
  html_clean: <p>I have been tweaking my grids. I am trying to finalize a grid for a layout. One thing I'm having trouble with is if the rows are needed within the grid? Or is the columns enough to structure content? I am asking this because in InDesign I have a baseline grid set up and also have rows to kind of see a division of content(if needed). I am wondering would this be overkill? Would I just either have rows or baseline grid? I feel like rows give potential for divided up the content vertically but I am not sure if the baseline grid is already in a way accomplishing that job. I remember seeing the grids in Josef Muller Brockmann's Grid Systems, which is what gave me an appreciation for grids and they always seemed to have both columns and rows not sure about the baseline but I think it would make sense so the copy lines up. Thanks all opinions would be appreciated.</p>
