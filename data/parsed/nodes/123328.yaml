      <div class="comment-spam-body"><p>For similar optical correction reasons the mid portion of a curved stroke, such as on the bowl of _D_ is thicker than the straight vertical stroke that extends from top to bottom of the the letter.<br>
      Again this is something that you can ignore if there is a special purpose for your font. For example, if you are trying to produce a font that mimics old time sign lettering by store owners who are not professional sign painters, or lettered propaganda phrases painted on walls in the 1930s.<br>
      Don</p>
      </div>
