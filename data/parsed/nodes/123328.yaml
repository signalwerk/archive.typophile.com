      <p>At the risk of oversimplification, I can offer a very short comment:<br>
      Most low contrast sans-serif fonts make an optical correction to reduce the thickness of the horizontal strokes compared to the vertical strokes -- which produces the illusion that the strokes are the same thickness -- unless the objective is to produce what is called a reverse or inverted contrast font. An example of the latter is Antique Olive.<br>
      If you are trying to produce a reverse contrast font then your design is generally O.K. Otherwise the horizontal and diagonal strokes look too thick.<br>
      Don</p>
