      <p>Adding to Don’s spot-on advice, I would also note that, even in a display typeface, the curves of round glyphs should extend a bit below the baseline and over caps-height.<br>
      Here two primers discussing optical correction:<br><a href="http://typographica.org/on-typography/making-geometric-type-work/">http://typographica.org/on-typography/making-geometric-type-work/</a><br><a href="http://ilovetypography.com/2007/10/29/so-you-want-to-create-a-font-part-2/">http://ilovetypography.com/2007/10/29/so-you-want-to-create-a-font-part-2/</a></p>
