    <p>Hello Everyone, this is my first foray into making my own typeface. It's based on  a mark I created for myself. I started with D, and then I needed letters to spell out EVERYDAY. And then I just kept drawing letters…</p>
    <p>For how to approach a letter, I've used Benton Sans Wide and Idlewild as references, leaning more heavily on Benton Sans. Though of course I'm trying to bring my own ideas and touch to it rather than just copying. </p>
    <p>I'm almost finished with the letters and then I'm going to move to numbers and glyphs. It's going to be an uppercase only font.</p>
    <p>Any comment, feedback, criticism, etc. is welcome. This is new territory for me.</p>
    <p>One thing I've learned already: the capital S is hard!</p>
    <p><a href="http://typophile.com/files/Everyday_5727.TestBoard.png">Large image here</a></p>
