      <p>Thanks all, this is very helpful. I adjusted the horizontal strokes of the H and the T, but now looking at it with fresh eyes, the E is way too heavy. I'll reevaluate them all. Thanks for the advice on the D as well. </p>
      <p>For the curves I have made the glyphs taller, but I forgot to lower them below the baseline in Glyphs. I had manually adjusted a few of them before posting the image, but forgot to do all of them. I'll make this change across the board. Thanks for those links too.</p>
      <p>I'll post a new sample once I've made these optical adjustments and hopefully created more letters.</p>
      <p>Thanks again!</p>
