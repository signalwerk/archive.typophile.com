    html: <p>Once you’ve desquooshed the letters, you will be able to see that this is <a href="http://www.fontshop.com/fonts/singles/linotype/helvetica_pro_condensed_bold/">Helvetica Condensed Bold</a>, also sold as Europa Grotesk. The ink traps on the ‘W’ are indeed a dead giveaway that it’s a) Helvetica and b) not Neue Helvetica.</p>
