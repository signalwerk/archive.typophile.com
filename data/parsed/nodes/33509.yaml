    <p>I have a collection of about 2000 one inch photolettering film strips. About half are in nice wooden storage racks, the rest are in plastic storage boxes.</p>
    <p>The designs are mostly common typefaces (Helvetica, Univers, ITC etc) but there are a few gems in there as well.</p>
    <p>They have been stored in a store cupboard in the office that we use – free from damp and frost, but now they have to go! I am willing to give them to a good home (yes give!)- anyone who wants to come and pick them up is welcome to them.</p>
    <p>We cannot ship them anywhere, if you would like them you must come and pick up, and you will need a small van and a bit of muscle to do so.</p>
    <p>If you want any further information please drop me an email:<br>
    Mwooden at dtptypes dot com</p>
    <p>Thanks<br>
    Malcolm</p>
