    <p>At the instigation of Ben Mitchell I'm starting this thread, potentially about the often strong influence of silent punchcutters on the end-result fonts. Many type designers (such as JvK) have on occasion derided this contribution, but the least we should admit is that they've played a role, and in the case of successful/appealing fonts presumably a positive one.</p>
    <p>Here's an image of Bremer Antiqua:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/BremerAntiqua12_5055.gif"></div><p></p>
    <p>And here's one of Emerson:<br>
    <a href="http://www.themicrofoundry.com/other/Emerson.gif" title="http://www.themicrofoundry.com/other/Emerson.gif">http://www.themicrofoundry.com/other/Emerson.gif</a></p>
    <p>Both fonts were cut by Louis Hoell... almost 3 decades apart!</p>
