    html: |-
      <p>The development of Emerson isn't detailed much in the one place you would expect it, Blumenthal's "Typographic Years". If memory serves Blumenthal took a long trip to Europe during the Great Depression, and ended up at Bauer when he wanted his font cut; I think this was due to some mutual acquaintance. Louis Hoell was Bauer's resident punchcutter (although he was actually nearing the end of his life). In his book Blumenthal speaks admiringly of him, his experience and abilities. But there is no talk anywhere about any affinities with Hoell's earlier work, such as Bremer Antiqua; I noticed that myself, by chance. Also of note is that Spiral (see below) was proofed at the Bremer press during its development.</p>
      <p>BTW, a clarification and a correction: the original version cut by Hoell was called Spiral, while Emerson was the name of the typeface released by Monotype; the elapsed time between Bremer Antiqua and Spiral was closer to 2 decades than 3.</p>
      <p>hhp</p>
