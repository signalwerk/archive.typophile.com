      <p>Well, you won’t get any argument from me that punchcutters like Hoell, Malin, Wiebking, et al. made a contribution to the final results of projects they were engaged in. But I don’t know if Hoell deserves *equal* credit in the sense that we currently credit type designers. </p>
      <p>I think you would need to examine the progress of the design a little more carefully before making that claim. Apparently a bunch of material (punches, smoke proofs, etc.) exists now in the Cary Collection at RIT.</p>
      <p>If you read the Kelly article, you’ll find that Blumenthal started sketching well in advance of engaging Hoell/Bauer. The similarities between the Bremer Presse font and Spiral are probably as much a result of Blumenthal’s obvious admiration of Wiegand’s work as they are of any innate stylistic contribution of Hoell’s. (Or perhaps I’m not giving adequate credit to Hoell’s influence on the Bremer?)</p>
      <p>And, as I understand the account, the movement progressively away from the calligraphic was driven by Blumenthal’s personal ideas and experiences as a printer. </p>
      <p>Again, I’m not saying that Hoell did not probably contribute a great deal in terms of making the design a successful <em>font</em>. I just don’t know if the contribution rises to the level of equal <em>design</em> credit.</p>
      <p>I’m not familiar with the Conseugra book.</p>
