      <p>The development of Spiral/Emerson was covered pretty thoroughly by Jerry Kelly (who worked with Blumenthal and has first-hand accounts) in his article on this typeface in the APHA’s <em>American Proprietary Typefaces</em>.</p>
      <p>In the section entitled “The Influence of the Bremer Presse,” Kelly writes that the Bremer Presse was “the strongest influence on Blumenthal’s early work.” He’s speaking here specifically about influence on Blumenthal’s printing sensibility, but obviously it applies broadly. </p>
      <p>Blumenthal visited Wiegand in Munich shortly after starting the Spiral Press and just a few years before embarking on his own type design.</p>
      <p>When Blumenthal was ready to have his type produced, he traveled to Frankfurt specifically to work with Hoell and the Bauer foundry, presumably because of their success with Wiegand’s font.</p>
      <p>Kelly reports, “The initial drawings formed more of a guide than an exact model for the punchcutter Louis Hoell to work from. The punches were cut by Hoell with the designer close at hand.”</p>
      <p>The Spiral face went through a couple different cuttings, becoming progressively less overtly calligraphic, before arriving at its final form.</p>
      <p>You should get your hands on a copy of <em><a class="freelinking external" href="http://oakknoll.com/detail.php?d_booknr=97457&amp;d_currency=" rel="nofollow">American Proprietary Typefaces</a></em>.</p>
    html_clean: |-
