    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/13082" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Technologies</a>&nbsp;:&nbsp;Intellifont</strong></p>
    <p>Intellifont was a scalable font technology developed by <a href="/node/17391" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tom Hawkins</a> at <a href="/node/add/wiki?edit%5Btitle%5D=Compugraphic" title="Create node &quot;Compugraphic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Compugraphic</a> in Wilmington, Massachusetts <span class="caps">USA</span> during the late 1980s. Intellifont fonts were hinted on a Digital Equipment Corp. (<span class="caps">DEC</span>) <span class="caps">VAX</span> mainframe&nbsp;computer. </p>
    <p>Using <span class="caps">DEC</span> terminal computers, Design Engineers would enter command line instructions to launched programmes including the Intellifont hinting programme. This programme displayed <a href="/node/12225" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ikarus</a> <a href="/node/add/wiki?edit%5Btitle%5D=outlines" title="Create node &quot;outlines&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">outlines</a> on a Vector Automation screen. With a <a href="/node/add/wiki?edit%5Btitle%5D=stylus" title="Create node &quot;stylus&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stylus</a> pen the Design Engineer placed <a href="/node/add/wiki?edit%5Btitle%5D=hint" title="Create node &quot;hint&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">hints</a> via graphical links on the Ikarus outlines. These links are similar to the ones now seen in Microsoft’s <a href="/node/12587" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Visual TrueType</a> and other hinting programmes. Intellifont production included a model based autohinter (1990) which allowed faster hinting by transferring hints from a library of previously hinted characters of common design&nbsp;styles. </p>
    <p>Intellifont technology was shipped with the Hewlett-Packard Laserjet <span class="caps">III</span> and <span class="caps">IV</span> and was one of the rasterizers in Agfa’s <span class="caps">UFST</span>.</p>
