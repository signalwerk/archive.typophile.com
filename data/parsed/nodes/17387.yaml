    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Type%20Technologies" class="freelinking" rel="nofollow">Type Technologies</a> : Intellifont</strong></p>
    <p>Intellifont was a scalable font technology developed by <a href="/wiki/Tom%20Hawkins" class="freelinking" rel="nofollow">Tom Hawkins</a> at <a href="/wiki/Compugraphic" class="freelinking" rel="nofollow">Compugraphic</a> in Wilmington, Massachusetts USA during the late 1980s. Intellifont fonts were hinted on a Digital Equipment Corp. (DEC) VAX mainframe computer. </p>
    <p>Using DEC terminal computers, Design Engineers would enter command line instructions to launched programmes including the Intellifont hinting programme. This programme displayed <a href="/wiki/Ikarus" class="freelinking" rel="nofollow">Ikarus</a> <a href="/wiki/outlines" class="freelinking" rel="nofollow">outlines</a> on a Vector Automation screen. With a <a href="/wiki/stylus" class="freelinking" rel="nofollow">stylus</a> pen the Design Engineer placed <a href="/wiki/hint" class="freelinking" rel="nofollow">hints</a> via graphical links on the Ikarus outlines. These links are similar to the ones now seen in Microsoft's <a href="/wiki/Visual%20TrueType" class="freelinking" rel="nofollow">Visual TrueType</a> and other hinting programmes. Intellifont production included a model based autohinter (1990) which allowed faster hinting by transferring hints from a library of previously hinted characters of common design styles. </p>
    <p>Intellifont technology was shipped with the Hewlett-Packard Laserjet III and IV and was one of the rasterizers in Agfa's UFST.</p>
