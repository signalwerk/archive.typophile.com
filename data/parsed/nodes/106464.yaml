    <p>Received this from a client, and by golly I've tried everything. Whatthefont, Identifont, DaFont, looked through a million fonts like Eurostile. It's like a mix of Ando and Trump Gothic – with Eurostile. But with rounded caps and ultracondensed. The pincher is that I swear I have it and have used it before. Hoping someone will look at it and say "It's ______ Dummy, you know this." </p>
    <p><a class="freelinking external" href="http://fontdeck.com/typeface/refrigeratordeluxe" rel="nofollow">RefrigeratorDeluxe is close</a></p>
