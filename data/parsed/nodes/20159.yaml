    html: |-
      <p>Well, that is an interesting question to ask here. Most often fonts downloaded from the internet are illegal copies or of obviously bad quality. Both are frowned upon here.</p>
      <p>But if you want to know, as always, JFGI (just f***ing google it).<br>
      <a href="http://simplythebest.net/fonts/how_to_install_fonts.html" title="http://simplythebest.net/fonts/how_to_install_fonts.html">http://simplythebest.net/fonts/how_to_install_fonts.html</a><br>
      or<br>
      <a href="http://support.microsoft.com/kb/314960/" title="http://support.microsoft.com/kb/314960/">http://support.microsoft.com/kb/314960/</a><br>
      or<br>
      just copy and paste the file into C:\Windows\Fonts.</p>
      <p>It will automatically appear in any windows program, after you restart the program.</p>
      <p>I am assuming you are using a windows OS.</p>
