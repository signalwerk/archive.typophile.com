      <p>As I understand it, in the U.S., there is very little to protect a typeface. There is no copyright protection and only very novel and unique typefaces are able to argue for design patent protection. The primary legal protections come regarding the software, i.e. the font. Draw yourself silly. That's really old-school type work and I miss my days hunkered over an Art-O-Graph.</p>
      <p>And Simon is a Seahawks fan! I'm so sorry dude. [insert uncontrollable laughter]</p>
