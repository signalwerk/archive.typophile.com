  html: |-
    <p>If a person owns a copy of a typeface does that mean they can hand draw it?  Like say one owns Nelly Script. Can one sit and draw it and then use that drawing in a poster?</p>
    <p>So say someone were doing a poster and instead of using the Nelly Script itself in the poster they hand drew the letters (and scanned them in) using Nelly script as a close reference. Is that copyright infringement or rightful use of something you own the right to use?</p>
  html_clean: |-
    <p>If a person owns a copy of a typeface does that mean they can hand draw it?  Like say one owns Nelly Script. Can one sit and draw it and then use that drawing in a poster?</p>
    <p>So say someone were doing a poster and instead of using the Nelly Script itself in the poster they hand drew the letters (and scanned them in) using Nelly script as a close reference. Is that copyright infringement or rightful use of something you own the right to use?</p>
