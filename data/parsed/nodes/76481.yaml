    html: <p>Assume you’re talking about fonts that look hand drawn, not high-fidelity copies? If so I've never seen a font license that mentions hand drawing/tracing. I've also never heard of anyone getting into trouble hand drawing or tracing a licensed typeface for use in a poster. However, I have heard of people getting cease and desists when they’ve redistribute fonts that they’ve hand drawn/traced using high profile commercial fonts as models – in these cases they were also using the original fonts name in the promotion of the hand drawn version - making this more of a trademark issue than a copyright issue.</p>
