    <p>Hello all,</p>
    <p>A while ago I made a typeface consisting entirely out of Unicorns (which is still downloadable free of charge from <a class="freelinking external" href="http://www.arthus.nl" rel="nofollow">http://www.arthus.nl</a>)</p>
    <p>Of course, Unicorns are strange beasts, so my printed specimen weren't enough to satisfy them. Due to this I made a video specimen, which also includes a message which will hopefully followed this new year!</p>
    <p>So without further ado;</p>
    <p><a class="freelinking external" href="http://www.youtube.com/watch?v=fMRPVQ_sXao&amp;" rel="nofollow">The Specimen</a></p>
    <p>And a good new year from the Unicorns as well.</p>
