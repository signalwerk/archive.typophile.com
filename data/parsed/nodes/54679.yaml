    html: <p>It's a really sweet face. We used it for a client's website and just assumed that the print projects would employ it as well. But if we can't find a licensed PC version to buy we'll have to choose something else. Too bad, it's a beautiful face in usage.  Short ascenders and descenders, high x-height and round shapes that have a nice edge to them.</p>
