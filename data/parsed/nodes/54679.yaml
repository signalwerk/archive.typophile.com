  html: |-
    <p>I found this lovely condensed sans laying around somewhere. It’s a PostScript font from 1997 and a search for its name comes up empty. Does anyone recognize it? Might it be a typeface borrowed from another and renamed? I need to find a cross platform Open Type face that's a good match if not the same one. </p>
    <p>The #4 is especially telling and the high cap height is unique as well.</p>
    <p>Thanks in advance.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/colympia.jpg" width="590" height="76" alt="">
