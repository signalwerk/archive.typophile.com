    html: |-
      <p>It sure is. Futura was the official font for the Apollo program, used internally on much of the concept artwork and graphics created to illustrate the numerous key moments in the moon journey, as well as concept art illustrating the launch vehicles and spacecraft.</p>
      <p>Futura was first major Latin font to become mainstream type on the surface of the moon. Other Latin fonts got there ahead of it aboard other NASA and JPL spacecraft, and Cyrillic fonts made it aboard Russian spacecraft.</p>
      <p>Source—NASA.</p>
      <p>j a m e s</p>
