    html: |-
      <p>It's a very interesting concept, but it's all Flash and there are no unique URLs per page or area, which runs counter to many of the underlying concepts of the web and accessibility in the first place.</p>
      <p>But judged as an interactive concept alone, it's intriguing. I find all of the movement and reconfiguration to be a bit much, and the information density would require a lot of handling and segmenting so an errant mouse hit wouldn't send the user flying through the site.</p>
      <p>This all sounds negative, but I do like it.</p>
    html_clean: |-
