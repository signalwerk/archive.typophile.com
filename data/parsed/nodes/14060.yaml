    html: <p>What about right clicking to bring up menus? What about click and drag for selections? Within the context of this site, which requires only simple navigation, no clicking is ok. But I think that so long as we have to drag mice about rather than do everything through the keyboard (like in the old days) because it adds functionality which reduces the amount of stressful wrist movements with the mouse that can make carpal tunnel problems happen. This is why I personally prefer the greater comfort of my tablet, despite the fact that it takes up most of my desk!</p>
