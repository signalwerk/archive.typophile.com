    html: <p>It's a nice idea. I agree with Chris...too much Flash. Too many websites do this and make it difficult to navigate their site. Like Chris was saying, with no unique URLs you can't hit the back button and go to information that you were just looking at. As a guy who gets "mouse cramps" on his hand pretty frequently, I'd love to see an interface that just used keyboard commands. Sometimes I hate "meeces to pieces."</p>
