      <p>There is some opinions as I see, let's speak about the line which say the site is full of flash: no unique URL. I think this opinion is true. But I think if we think of future of web to make it like  a huge multimedia web.. then this site will be a good move.<br>
      The site was speaking about to use click or not to use click, it looks like how scientists think in planes, that they try these days to make the driver of the plane drive it with his head only, I saw a documentary in Discovery Science about that case, which reflects that they are moving forward in this technology in solid steps. Let me say this site is very good as a source for designer who work on flash as web or as CD that it is not necessary to make all your buttons click able! What if you made a button some place in an interactive CD or site working by rolling over your courser on it? It may do a strange effect.<br>
      Sorry for speaking a lot, but let me declare things by graphics. I made here a small experiment to describe what I mean, this may be used as a surprise for the person who suppose to click.<br>
      <a href="http://www.deviantart.com/view/20981312/" title="http://www.deviantart.com/view/20981312/">http://www.deviantart.com/view/20981312/</a><br>
      Surprised ?<br>
      I saw a file like that in past, by someone I know in channel flash I guess while I was learning Macromedia Flash in 1999, I just made something like it to show you.</p>
