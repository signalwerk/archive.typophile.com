      <p>Thanks for comments. this forum is saving my sanity. I found what I needed.<br>
      It is the "Free Transform" Tool under the scaling tool on palette. It gives me that box I need. </p>
      <p>I agree with stretching. I have always maximally hated it, it looks totally amateur. It's so offensive to me it makes my lower digits cringe. I understand about lettering and type, and it is a high aesthetic indeed, thats why I'm excited to find this forum! Type people like me!</p>
