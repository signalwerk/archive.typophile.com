    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : <em>Postscript: Zur Form von Schrift heute</em></strong></p>
    <p>Exhibition catalog of the <em>Postscript</em> exhibition, which took place at the Künstlerhaus Wien in Vienna, Austria, in 2002. The exhibition displayed Austrian, Swiss, and German typefaces designed during the <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> era.</p>
    <p>The book, which is entirely in German, was edited by <a href="/wiki/Martina%20Fineder" class="freelinking" rel="nofollow">Martina Fineder</a>, <a href="/wiki/Eva%20Kraus" class="freelinking" rel="nofollow">Eva Kraus</a>, and <a href="/wiki/Andreas%20Pawlik" class="freelinking" rel="nofollow">Andreas Pawlik</a>. The book contains an article by <a href="/wiki/Robin%20Kinross" class="freelinking" rel="nofollow">Robin Kinross</a>.</p>
