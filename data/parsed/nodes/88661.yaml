  html: |-
    <p>I downloaded Crimson, available here: <a href="http://aldusleaf.org/" title="http://aldusleaf.org/">http://aldusleaf.org/</a>, and noticed strange absence of kerning. You can see a screenshot of my FontExplorer Pro (FXP) here: <a href="http://cl.ly/Csie" title="http://cl.ly/Csie">http://cl.ly/Csie</a> </p>
    <p>I contacted the maker of the font, and he ensures that those letters are kerned (also took a screenshot himself). So, I tried installing the font in my user folder, rather than FXP, and use it in different applications. Some show the proper kerning and some do not. Here is an example of Illustrator CS5 (top) and InDesign CS5 (bottom) showing differences in kerning: <a href="http://cl.ly/CtF5" title="http://cl.ly/CtF5">http://cl.ly/CtF5</a>.</p>
    <p>I'm on the latest OS X (Lion) and run a clean system. I tried emptying my font cache, restarting computer, doing all kinds of maintenance, and I can't seem to fix it. Any suggestions?</p>
