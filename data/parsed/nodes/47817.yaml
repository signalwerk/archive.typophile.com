  - id: 292275
    user: 1844
    date: 2008-07-29T17:01:00
    date_raw: 29 Jul 2008 — 5:01pm
    votes: null
    html: |-
      <p>IMO, the FDK's Autohint is better than FontLab's Autohint. On this thread <a href="http://www.typophile.com/afdko2" title="http://www.typophile.com/afdko2">http://www.typophile.com/afdko2</a> you can find other people's opinion about it.</p>
      <p>The FDK's Autohint tool comes in two flavors,<br>
      1) a command-line program, that you can run from the Terminal (Mac) or from the Command Prompt (PC)<br>
      2) a FontLab macro<br>
      Both flavors run independently of each other, but should produce the same results, with one exception: the FontLab macro won't generate Flex hints.</p>
      <p>Another thing to keep in mind is that the FDK's Autohint tool won't do miracles. In order to do its "magic" the tool needs to have the font's Alignment Zones (a.k.a. BlueValues, OtherBlues) and Standard Stems setup beforehand.</p>
      <p>The installation instructions are all on the Wiki <a href="http://www.typophile.com/wiki/afdko" title="http://www.typophile.com/wiki/afdko">http://www.typophile.com/wiki/afdko</a>   Please read and follow them *carefully*. I have been fine-tuning them based on feedback I get from people and eventual troubleshooting I have to do during workshops. So they should work for almost everyone.</p>
    html_clean: |-
