    html: <p>Is the fontlab Auto button for the Alignments Zones and Stems widths a good way to set these options or should they be done manually ?</p>
    html_clean: <p>Is the fontlab Auto button for the Alignments Zones and Stems widths a good way to set these options or should they be done manually ?</p>
  - id: 292423
    user: 1844
    date: 2008-07-30T11:10:00
    date_raw: 30 Jul 2008 — 11:10am
    votes: null
    html: |-
      <p>The Auto button is a good start, but you should definitely confirm the values and do adjustments as necessary.<br>
      AFAIK, FontLab looks at the outlines of a few key glyphs (e.g. 'o', 'H') to set the Alignment Zones.<br>
      Before pressing the Stem's Auto button, you need to first Autohint -- use FontLab's-- a few glyphs (e.g. A-Za-z), otherwise you might get bogus values.</p>
