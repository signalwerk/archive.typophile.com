    html: <p>FWIW, back in the mid-90s, a very technically adept designer I knew was working for IBM using the Adobe tools and simultaneously evaluating Fontlab 2.5. He said Fontlab's autohinting then was just about on par with Adobe's -- a remarkable achievement of Yuri Yarmola's. Adobe's gift of its hinting system reflects the importance of FontLab in its workflow today. But beware of Greeks bearing gifts! Don't forget that John Warnock cried when he announced the disclosure of the Type 1 format which the industry had essentially forced on him.</p>
