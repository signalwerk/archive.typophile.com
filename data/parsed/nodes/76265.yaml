    <p>Hey folks,</p>
    <p>Working on a new brand, getting tunnel-vision. I'd love some feedback from people with fresh eyes.</p>
    <p>Here's the logotype: <a href="http://drbl.in/COU" title="http://drbl.in/COU">http://drbl.in/COU</a> (Also attached to this post)</p>
    <p>My primary concern is legibility -- reads OK?</p>
    <p>Any other critique on form would be welcome. I'm not so sure about the colors (and don't think they matter at this point, can be changed).</p>
    <p>Cheers,</p>
    <p>Idan</p>
