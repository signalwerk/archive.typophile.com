    html: |-
      <p>I brought this question up elsewhere and...</p>
      <p>"You'd spend the last of your money on a single-weight caps-only font? Not the most versatile use of your money."</p>
      <p>I knew this point would come up, which is a fair and completely logical one. But, yes, I would, when the single-weight/caps-only font looks like Pelso. Now, if it were a cent over $20...</p>
      <p>Fontlove is obviously subjective, so this isn't so much about the worth of a particular font, but rather, degrees of sacrifice when it comes to one's passions.</p>
      <p>Also, regarding my survival, did I mention, I could stand to lose a few pounds, so food comes second to exercising my typography muscle.</p>
