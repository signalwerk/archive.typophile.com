  html: |-
    <p>Hi, </p>
    <p>I’m currently working on a design for a Danish magazine on running. I’m using Berthold City bold set in caps for some various headings and <a class="freelinking-external" href="http://www.fontbureau.com/fonts/BentonSans "> Benton Sans</a> as my main grotesque. For the feature stories (body copy) and for some headings I need a serif to work along with Benton Sans. I have tried various classics from my collection - Adobe Caslon, Baskerville etc – but It doesn’t seem right. Somehow they clash.</p>
    <p>Can anyone suggest a serif to work along with Bentons Sans and Berthold City?</p>
    <p>I’ve included the cover to give you an idea of the look. </p>
    <p></p><div class="imageWrap"><img src="/files/loebemagasinet_01_cover_5070.jpg"></div><p></p>
