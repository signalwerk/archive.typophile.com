    html: |-
      <p>I could imagine it might be in a foundry's interest to establish such a deal -- something like you might find in book publishing, where a publisher negotiates first right of refusal for a popular author's next several titles.</p>
      <p>But in today's market, I think most freelance type designers would not be interested in any such restrictions.</p>
      <p>Note that back in Dwiggins's day, there were no such thing as royalties on sales of type. WAD's agreement amounted to something like a yearly retainer. So this would have been a more attractive arrangement.</p>
      <p>Things work differently now.</p>
      <p>-- K.</p>
