      <p>I think perhaps Jason Walcott works exclusively for Veer - they have purchased the rights to his whole library, and he still develops new fonts.<br>
      Or something to that effect.</p>
      <p>Veer also have quite a few exclusive fonts by Alejando Paul, but many other of his fonts are available from other sources like FontShop and MyFonts, so he is not completely exclusive for Veer.</p>
      <p>Only examples I can think of offhand...</p>
