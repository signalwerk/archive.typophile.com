      <p>So it has been done before, that's great. I was thinking that with today's dramatic increase in font design participation that a few talented designers would have landed the same sort of contract.</p>
      <p>Perhaps the internet now gives font designers more creative and financial security. Or, perhaps font shacks just aren't interested in signing design talent to a multi year deal.</p>
