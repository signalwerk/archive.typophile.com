      <p>Interesting AGL, you came up with the same solution essentially for the lh as I did for the ll, although I'm still not 100% satisfied with it (but I can't think of any other way to lig them without making it be too distracting for a reader or just not make sense).  Seeing your solution and mine I think the longer serif but not connected works better.  I'll try it out tomorrow and see it how looks.  For now, here's my current ll, de, and ch ligatures for Spanish:</p>
