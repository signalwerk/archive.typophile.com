    html: |-
      <p>I recommend using a "merged" fi-ligature only if your f and i would collide. I pretty much dislike fonts where an fi-ligature disrupts the rythm of the line (this often happens in fonts with narrow f's which would not make any trouble anyway).</p>
      <p>Also, if you are to support extended latin (e.g. Eastern European), consider all possible f+ acute accented letter /f+ double acute accented letter diacritics combinations.</p>
      <p>I'd suggest to include gj, gy combinations if they would collide. Especially gy looks really awkward in a number of italics.</p>
