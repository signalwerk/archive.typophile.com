      <p>Thanks Florian. That's impressively complete. I must admit that I should've done some rummaging around inside the OpenTypes and I will now. Arno Pro is indeed a good tip which includes a lot of long s ligatures at my first glance.</p>
      <p>I guess then, that the st, sp type ligatures are either a scribal legacy or perhaps a gratuitous flourish on part of the designer. They are certainly decorative rather than practical (i.e. to prevent collision). I wonder if they test well in terms of readability compared to their individual counterparts or whether they're best put to use at display sizes.</p>
