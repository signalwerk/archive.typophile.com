      <p>Hi Mark,<br>
      Æ, æ, Œ, œ and ß are different from ‘fi’ etc., they can’t be referred to as ‘true ligatures’ anymore. They are ‘stand-alone’ characters now.<br>
      Ligatures mostly solve problems of colliding characters. If your face doesn’t suffer from such problems, then you don’t need any additional ligatures.<br>
      You might wanna take a look at this thread about <a href="http://typophile.com/node/40439" rel="nofollow">f colliding with various tittles</a>.</p>
