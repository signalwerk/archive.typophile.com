      <p>Mrs Eaves demonstrated that "quaints" aren't necessarily anachronisms.<br>
      Depending on circumstances, a typographer may wish to set text <em>unmarked</em> (crystal goblet theory) or <em>marked.</em> These distinctions were articulated by Johanna Drucker in "The Visible Word".<br>
      There are various ways to mark text, and the option of discetionary ligatures is one of them.<br>
      OpenType recognizes and enshrines the distinction between marked and unmarked text, in the separation of default ligatures (<code>liga</code>), which serve to "unmark" potentially obtrusive glyph sequences, and discretionary ligatures(<code>dlig</code>), which are available to add marked interest.</p>
