      <p>Hmm. The Basque connection is certainly interesting. Another thing the linguistically lazy English speaker won't have come across. NA, TR and RA are quite spectacular in the graphic on that link. I think you'd need a keen eye to decipher TR which relies on the left arm of the T only and would probably look like a swash (or bastard?) lone R.</p>
      <p>As for onomatopœia, I think Nick's closer in thinking it's an aid to pronunciation, -- Like the diæresis is in 'naïve' or 'Zoë' -- despite English being largely non-phonetic.</p>
      <p>American usage of English seems to strip both the ae and oe digraphs and replace them with a single e. As an English English speaker I ought to object, but the lone e does make some sense to me -- though I'll admit my fusty British heritage is squealing to object as I type. In terms of visual language -- i.e. set type on the page -- I can't help preferring Words like 'Encyclopaedia' to 'Encyclopedia' and 'Encyclopædia' is even better. Also, I suppose keeping the digraph respects more faithfully the word's etymology. Things change though and as there are more Americans speaking English in the world than Brits I can't see the æ/œ digraphs surviving.</p>
