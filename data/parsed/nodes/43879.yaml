      <p><cite>perhaps something that as a native English speaker I was bound to overlook.</cite></p>
      <p>That’s why I’ve started it. :-)</p>
      <p>Another pointer: the thread that triggered the other one, on <a href="http://www.typophile.com/node/40338" rel="nofollow">The Most Useful OpenType Ligatures</a>.</p>
      <p>You certainly have checked out some of the well-equipped OpenType text fonts that are out there, to examine which ligatures were included. It depends on the style, of course. A lot of today’s text faces are revivals of, or – in a broader sense – are based on historical models. Thus, the designers often incorporate ligatures that have also been part of the original. This can relate to linguistics as to the specific style.</p>
      <p>One frequently sees ‘Th’, for example. Also: ch, ck, ct, st, sp.<br>
      All kinds of combinations of f and characters with ascenders, also triples like ffb, ffh, ffk. Same for long s (ſ), if you want to include that historic alternative.</p>
      <p>An Italic may have even more. Adobe’s Garamond Premier has ta, th, us, is, ij, ll, among a lot others. Have a look at Arno, Requiem or Galliard, too.</p>
