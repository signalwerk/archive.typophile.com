      <p>ll is nice in an italic, though I'm still searching for a good design for a double l in non-italic type.  Ch / ch is nice, especially when designed so that it doesn't change spacing, so that it can be discreetly (as compared to, say, a ct lig) placed into a document.  For language where ch constitutes a separate letter it's definitely an nice effect.  Don't forget the capital DE ligature for Spanish, it's easy and quick to do so no reason not to include it IMO.</p>
      <p>Olho, some of those capital ligatures have a lot of history pre-printing presses.  For instance, in <a class="freelinking external" href="http://www.txikizabalo.org/grafia/grafia32.php" rel="nofollow">traditional basque writing</a></p>
