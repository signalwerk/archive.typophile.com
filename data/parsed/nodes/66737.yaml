    html: |-
      <p>Looks kinda neat. I really love the texture.</p>
      <p>For the USSR part, I think the layout and relation of the letters to each other could be improved. One thing that looks odd is the U to the two S's, which don't share the same baseline. I think it would look better if those letters were aligned. Second, I think the R would look better being joined at the same angle as the spine of the S. There's a nice pattern that could be created there which is broken by the angle of the R's stem.</p>
      <p>Beyond that, I don't have much to suggest. If you haven't yet, I'd play around a bit with placement on the page. Center placements are often not the most effective layout, as there's less play for the eye in a centered placement.</p>
