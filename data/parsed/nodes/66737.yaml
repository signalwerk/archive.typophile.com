    <p>i love working with the WW2 (1930s to 1950s) timeline, i feel i presents alot of useful material because the history is so rich, so that really inspired this design for me, and PS: i understand the smaller text is hard to read and i dont really intend for it to be read by most people because for one its in Russian so if dont speak or read that language you wont be reading it anyway, but in short the poster is designed after the ussr era in euro, and is an anti war poster. </p>
    <p>And just to clarify the upside-down R and the transition from the S to the R, its really design purposes and aesthetics purposes.</p>
    <p><a href="http://www.flickr.com/photos/unlogic/4307910925/sizes/l/" title="http://www.flickr.com/photos/unlogic/4307910925/sizes/l/">http://www.flickr.com/photos/unlogic/4307910925/sizes/l/</a></p>
