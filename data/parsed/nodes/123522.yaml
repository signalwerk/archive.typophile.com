  html: |-
    <p><img src="/sites/default/files/old-images/Tschild_Andron_Irisch_9-musik_5364.png"></p>
    <p>I take the pleasure to announce the release of <a href="http://www.myfonts.com/fonts/andreas-stotzner/andron-2-eir-corpus/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Andron-2-Irish</a>.</p>
    <p><img src="/sites/default/files/old-images/Tschild_Andron_Irisch_2_3476.png"></p>
    <p><img src="/sites/default/files/old-images/Tschild_Andron_Irisch_1_5661.png"></p>
    <p>Andron Irish is the youngest child in the ever-growing Andron family. Together with Andron-Latin, Andron-English, Andron-Deutsch, Andron-ABC and other brothers and sisters it forms a unique set of specialized typefaces in a classical style.</p>
    <p><img src="/sites/default/files/old-images/Tschild_Andron_Irisch_3_4197.png"></p>
    <p><img src="/sites/default/files/old-images/schild_Andron_Irisch_4_5266.png"></p>
    <p>Andron-Irish is a comprehensively furnished suite of 5 fonts. Now you can use Italics, Bold and small caps as with Latin, the usual way. A fancy extra is the middlecase font with uncial glyphs. It follows the proportions of the  <a href="http://www.myfonts.com/fonts/andreas-stotzner/andron-mc/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Andron MC series</a>.</p>
    <p><img src="/sites/default/files/old-images/Tschild_Andron_Irisch_6_5582.png"></p>
    <p>Opentype features have been implemented to enable the easy use of alternative insular glyphs as well as to switch from modern orthography to the tradional one.</p>
    <p><img src="/sites/default/files/old-images/Tschild_Andron_Irisch_8_6723.png"></p>
    <p>Best wishes for St Patrick’s day … !</p>
