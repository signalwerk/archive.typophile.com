  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tschild_Andron_Irisch_9-musik_5364.png"></div><p></p>
    <p>I take the pleasure to announce the release of <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/andron-2-eir-corpus/" rel="nofollow">Andron-2-Irish</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tschild_Andron_Irisch_2_3476.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tschild_Andron_Irisch_1_5661.png"></div><p></p>
    <p>Andron Irish is the youngest child in the ever-growing Andron family. Together with Andron-Latin, Andron-English, Andron-Deutsch, Andron-ABC and other brothers and sisters it forms a unique set of specialized typefaces in a classical style.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tschild_Andron_Irisch_3_4197.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schild_Andron_Irisch_4_5266.png"></div><p></p>
    <p>Andron-Irish is a comprehensively furnished suite of 5 fonts. Now you can use Italics, Bold and small caps as with Latin, the usual way. A fancy extra is the middlecase font with uncial glyphs. It follows the proportions of the  <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/andron-mc/" rel="nofollow">Andron MC series</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tschild_Andron_Irisch_6_5582.png"></div><p></p>
    <p>Opentype features have been implemented to enable the easy use of alternative insular glyphs as well as to switch from modern orthography to the tradional one.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tschild_Andron_Irisch_8_6723.png"></div><p></p>
    <p>Best wishes for St Patrick’s day … !</p>
