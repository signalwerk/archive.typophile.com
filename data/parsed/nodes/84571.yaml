    <p>Any thoughts on deciding on a method for breaking poetry across pages without altering the flow of the poem?</p>
    <p>I'm designing a book-length poem in sections. The line, verse, and section lengths vary greatly, which is the cause of my difficulty. I've tried many methods of breaking the pages, but none are entirely satisfying, either causing uneven space at the page bottoms or widow/orphan lines and short verses. I'm wondering if anyone has a helpful way to think through this, or perhaps examples that are worth looking at. </p>
    <p>(In contrast to my poem, all the printed poems I've looked at either have sections of similar length, allowing a consistent number of sections per page, or no verse-breaks within sections, allowing the text to flow naturally to the next page.)</p>
