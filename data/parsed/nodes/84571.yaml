      <p>If you mark beginnings clearly (but not obtrusively), then pauses will not be mistaken for endings.</p>
      <p>Traditionally, verse typography has conventions for this, by capitalizing the first letter of a line, putting paragraph spacing between verses, and using raised caps or small caps at the start of sections/the whole.</p>
