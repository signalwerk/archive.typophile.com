    html: <p>Could you talk to the poet about it? The varying lengths of the different components may have been a structural and rhythmic choice on their part, not unlike how a designer makes decisions about layout and pace in their typography. By talking to them, you'll be able to make a better interpretation of their creative intentions, and use that interpretation to inform your own decisions.</p>
