    html: |-
      <p>Well, if you know this is from the 60's that should tell you why finding similar fonts could be hard. Many pre-digital fonts never made it into digital form. </p>
      <p>The most similar font I could think of is called <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/arbiter-bq/" rel="nofollow">Arbiter</a>, by Aldo Novarese.</p>
      <p>I have scoured the Solotype Catalog, Rookledge's Typefinder and some of my Photo-Lettering books. It has a familiar look, so it's driving me nuts. I think Mark Simonson has a pretty good collection of older type books, and might recognize this. </p>
      <p>I am still looking.</p>
      <p>- Mike Yanega</p>
