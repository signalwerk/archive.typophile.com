      <p>An additional thought -- awaiting John's (hopefully) long list of wanted scripts -- is that, if a certain script can <em>not</em> be found in bog standard Arial, it's most likely one of the more pictoral ones as found in the Far East (Hangul, Mongolian, Devanagari, Thai) or new orthographies (Cree comes to mind, although I don't know why).</p>
      <p>It's a tall order to find a single font family for all these different writing systems. He'd better settle for "a sort of sans look, but if there isn't one, no worries."</p>
      <p>Is this brand to target all of Western, Mongolian, Chinese and minority Aboriginal dialects? It must be the hottest thing since the iPod, then! How about calling it "匣磬  ( xiá qìng qǐng)", "little music box"?</p>
