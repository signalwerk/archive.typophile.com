      <p>I can't speak for the other scripts, but the hangul (Korean alphabet) component of Arial Unicode should absolutely not be used in any work where it is assumed that it will be seen by people who read Korean. I've said this before, but it is an atrocity. If the need ever arises for a typeface for setting Korean, use any of the hangul-dedicated system fonts that are widely bundled (okay, maybe avoid Gulim, but Dotum, Apple Gothic, etc. are great) but never Arial Unicode.</p>
      <p>Besides, these days Arial Unicode hangul is cropping up everywhere on the web on awkwardly 'localized' websites and banner ads complete with bad machine translations into Korean. Not a pleasant experience from a design point of view for the Korean web surfer.</p>
