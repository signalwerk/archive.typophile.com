      <p>Arial Unicode is indeed a fall-back font. But you can use it along with normal Arial Bold and normal Arial italic if you want.</p>
      <p>Windows Vista has five font families with a very large number of characters, almost every character in Unicode 5.0 found in the Latin character set.</p>
      <p>But for free fonts or low-cost fonts, look in <a href="http://www.alanwood.net/unicode/fonts.html">http://www.alanwood.net/unicode/fonts.html</a> . The subsection “Large fonts” contains a number of fonts with many, many characters, though a lot of these don’t contain bold and italic versions.</p>
      <p>A good choice is the DejaVu family available at <a href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page">http://dejavu.sourceforge.net/wiki/index.php/Main_Page</a> . Note that the fonts with LCG in their names are versions with contain only the Latin, Cyrillic and Greek character sets so you probably won’t want these. The regular versions also contain Hebrew, Arabic, and other goodies. The standard sans-serif also contains a lot of math symbols and pictures and so forth that normally would not be required in bold or italic versions. This font family is upgraded regularly.</p>
      <p>As to Thomas de Jong’s quip: ‘Let’s not mention the Microsoft invention “ÿ”’ — this character is part of the ISO Latin 1 alphabet, and its inclusion in that character set has nothing whatosever to do with Microsoft. The character “ÿ” appears (though rarely) in French names, including some place names: Pierre Louÿs, Le Blanc de Nicolaÿ, rue des Cloÿs, L’Haÿ les Roses, Aÿ, Moÿ and so was sensibly and rightly included in the set.</p>
      <p>It does not have an uppercase counterpart in the Latin 1 alphabet, because, at the time the Latin 1 alphabet was being created, it was generally thought to incorrect in French to normally place diacritics on capital letters. Since the committee involved was very pressed for space in creating this character set, it made perfect sense to omit “Ÿ”, as a character that could not exist in the scripts the Latin 1 set covered (ignoring Quebec French where omitting diacritics from capital letters was considered incorrect).</p>
      <p>Of course, nowadays it is usually considered incorrect to omit diacritics on capitals in French. And the Microsoft variant of the Latin 1 aphabet adds the missing “Ÿ”.</p>
