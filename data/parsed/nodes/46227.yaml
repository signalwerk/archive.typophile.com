    <p>Hi There,</p>
    <p>Can anyone help me find somewhere to find a bold version of Arial Unicode? I am trying to produce a multi-language toolkit for a channel brand and i need arial unicode both in regular and bold but after i bought it online (thinking it was a family) it only had one weight....</p>
    <p>Any help gratefully received,</p>
    <p>John</p>
