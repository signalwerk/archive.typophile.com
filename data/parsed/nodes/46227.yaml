      <p><cite>[..] its inclusion in that character set has nothing whatosever to do with Microsoft [..]</cite></p>
      <p>... There goes another one of my little MS bungle-up anecdotes! Oh well, it was hear-say after all.</p>
      <p>All jokes asides, it still appears to me the OP (John) has overrated the importance of Arial Unicode, versus just about any serious font. I know <em>I</em> wouldn't use it for anything but a last resort to finally insert that obscure mathematical character I was looking for, or as a handy repository for all kinds of dingbats.</p>
      <p>My line of work is heavily geared towards multilingual typesetting, and, while the main bulk of text is in English or French, I've encountered snippets in more languages than I care to remember. My bread-and-butter font for just about all of them is Minion Pro, with a tasty side dish of hugely specialized characters for phonetics and accents, which my colleagues and me created in the semblance of that same Minion. For CJK I use the set of fonts that came with CS3, which are all drawn lovingly and carefully.</p>
      <p>The only ones I really miss in my <em>répertoire</em> are the RTL languages -- specifically Hebrew and Arabic, since standard IDCS <em>still</em> does not support them natively, and I don't trust Word to do my shopping list with, let alone my typesetting.</p>
