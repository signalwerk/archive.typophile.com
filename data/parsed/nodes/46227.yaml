      <p>Arial (in Windows) includes full support for Unicode 4.1 Latin, Greek, Cyrillic, Arabic and Hebrew. And it comes in reg, bold, italic, bold italic. </p>
      <p>Arial Unicode is really a fall-back font. I don't think it should be considered for brand use. However if you really want to use it you might want to contact Ascender or Monotype to see if they can produce a bold style for you.</p>
      <p>Cheers, Si</p>
