      <p>For regular multi-language work -- French, German, Dutch, Norwegian, Swedish, Danish, and a couple of other Western European languages, you only need a handful of accented characters. These appear in the majority of "serious" fonts -- we're talking Windows Western mapping here, "ä", "é", "ñ", "þ" and the like. Let's not mention the Microsoft invention "ÿ" :-)</p>
      <p>Plain Arial (the one that comes for free with Windows, in Regular Italic, Bold, and Bold Italic) has an extended character set, supporting Central-European languages, with characters such as "ł", "ŗ", "ō" (Polish, Slowak, Lithuanian -- anything not Cyrillic), but <em>also</em> Greek (kathaverousa, not polytonic), Cyrillic, Turkish, Hebrew, and a smattering of Arabic -- of this last one, I'm not sure if it supports everything completely, i.e., with all initial, medial, and final forms.</p>
      <p>If <em>that</em> is still not enough for your multilingual needs, Arial Unicode adds characters for Ancient Greek, Japanese, Korean, Georgian and a whole lot of others, but surely you are not looking that far, are you? Perhaps you should list the languages (scripts) that you're interested in.</p>
