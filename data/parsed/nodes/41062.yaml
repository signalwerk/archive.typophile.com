      <p>The original <cite>CHOOSE LIFE</cite> T-shirts designed by Katharine Hamnett were set in <a href="http://www.myfonts.com/fonts/adobe/folio/bold-condensed/">Folio Bold Condensed</a> (or something similar).</p>
      <p>Folio is generic-looking enough that it doesn’t look overtly “retro” by any means, but people who get the reference will recognize the face from the original T-shirt, consciously or otherwise.</p>
