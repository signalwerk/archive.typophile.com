    <p>I need to design a t-shirt with two words on it and am having trouble finding an appropriate typeface. The t-shirts are aimed primarily at 30-/40-somethings and are not ’comedy’ but will probably raise a wry smile from those who get the reference, which is to a pop song from the eighties.</p>
    <p>I can’t reveal the text yet (sorry), but it’s along the lines of “Like a Yo-Yo” - i.e. lyrics from part of a song. If there is to be a whiff of retro about it, then it should be subtle.</p>
    <p>I would be very grateful for your suggestions!<br>
    Thank you,<br>
    Kate</p>
