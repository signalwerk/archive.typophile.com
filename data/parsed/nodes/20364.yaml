    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 31.May.2006 3.54pm </div>
      <p>/ / / / /</p>
    <p>Galaxie Cassiopeia from Village is published!</p>
    <p>This fresh script face is the second release in the Galaxie family, following on its northern sky neighbour, Polaris. Cassiopeia is available as two bold fonts, one a basic non-joining font, the other a complex OpenType font using advanced feature programming for natural letter-to-letter joins.</p>
    <p>Just turn on the OpenType Contextual Alternates feature and type; there are 11 versions of each lowercase letter and 5 versions of each uppercase letter. The “calt” feature will select the correct version of the letter for its context. The code was written by the OpenType pioneer Tal Leming, responsible for the “randomisation” feature in Orange Italic’s “Local Gothic”. (Unfortunately, the feature can’t be displayed by the mudTyper; you can see only the Basic version.)</p>
    <p>An early beta version of the font was used for the Village logotype.</p>
    <p>Galaxie Cassiopeia ships as cross-platform OpenType format for both fonts along with the Basic version of the font in legacy PostScript Type 1 format. The type supports dozens of languages, and a license sells for US$59.</p>
    <p><a href="http://vllg.com/Village/GalaxieCassiopeia/mudTyper+Weights/" title="http://vllg.com/Village/GalaxieCassiopeia/mudTyper+Weights/">http://vllg.com/Village/GalaxieCassiopeia/mudTyper+Weights/</a></p>
    <p>/ / / / /</p>
    <p>Flama Version 2 from Feliciano Type Foundry</p>
    <p>Mario Feliciano presents an update to his popular Flama family, adding Thin and Ultralight weights at the skinny end of the gamut, and Extrabold filling a gap at the heavy end.</p>
    <p>The family is now 9 weights in roman and italic, ratcheting the usability up a notch. You can see the family put through its paces in “Black Book” magazine.</p>
    <p>Flama V2 ships as cross-platform OpenType format along with legacy PostScript Type 1 format fonts. The type supports the Latin 1 encoding, and a single user license sells for US$380.</p>
    <p><a href="http://vllg.com/Feliciano/Flama/mudTyper+Weights/" title="http://vllg.com/Feliciano/Flama/mudTyper+Weights/">http://vllg.com/Feliciano/Flama/mudTyper+Weights/</a></p>
    <p>/ / / / /</p>
    <p>An offer you can’t refuse!</p>
    <p>It feels like Summer, but is still technically Spring, and we’re offering a specially-priced springtime selection of recent display fonts: 5 type families from 5 foundries.</p>
    <p>Spring 2006 Display set:<br>
    / Bello Pro from Underware (Connecting script with OpenType ligatures and small caps)<br>
    / Garda from Feliciano Type Foundry (3 variants of classic capitals)<br>
    / Kaas by Hugo d’Alte for Thirstype (Silver prize in Finland’s Grafia competition!)<br>
    / Local Gothic from Orange Italic (with revolutionary OpenType randomization)<br>
    / Mavis from Village (2 variants with subtle alternate-replacement)</p>
    <p>Get these five families for only $229, one-third off the combined price of $353. Offer available through July 31, 2006.</p>
    <p><a href="http://vllg.com/offers.php" title="http://vllg.com/offers.php">http://vllg.com/offers.php</a></p>
    <p>/ / / / /</p>
    <p>With warm wishes from New York.</p>
    <p>Village<br>
    168 Second Avenue #253<br>
    New York NY 10003<br>
    USA</p>
