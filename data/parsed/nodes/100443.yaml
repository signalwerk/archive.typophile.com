      <p>Yep, I know of Photofont, but it's already quite designer focused, which makes it not much different (for my use) than making a very good aligned PSD which people just can copy/paste (seeing it will mostly be used for initials and not full texts)</p>
      <p>The issue is that about 75% of the users will stick to basic text editors such as MS word which doesn't offer a lot of possibilities. I guess the best solution is to let the user place the high-res images and then hope for the best, I just want to make it as easy to use as possible.</p>
