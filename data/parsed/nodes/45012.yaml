      <p><cite>How about Locator?</cite></p>
      <p>And what a lovely choice that is. Yes this has the "pop" that I am looking for.</p>
      <p>When I say "pop" I am referring to a font that would look as though it was meant to go together with Beaufort and didn't look like something that was created yesterday and would be gone tomorrow.<br>
      Additionally, it shows a character you wouldn't find anywhere else.<br>
      __________________________________________________<br>
      I know I am in my own little world, but its ok.  They know me here</p>
