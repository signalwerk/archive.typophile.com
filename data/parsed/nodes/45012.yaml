    <p>If one was to use the Beaufort extended font as an exhibit font on sports banners, posters, and brochures what would be a nice font to compliment it.  </p>
    <p>I have looked at FF Kievit, FF Meta and Fedra Sans, but those just do seem to fit.  I have also considered Akzidenz Grotesk but wanted something with a little more pop.  Are there any other possibilities I should consider?</p>
