    html: <p>To fit with the turn-of-the-century feel, maybe something like <a href="http://fontbureau.com/fonts/BureauGrot" rel="nofollow">Bureau Grot</a>. I think an ideal match would be warm in a slightly idiosyncratic way, not warm in a "modern" way like Kievit, Fedra, etc., but I'm drawing a blank on what would fit the bill. Maybe Nick Shinn, <a href="http://shinntype.com" rel="nofollow">Beaufort's</a> designer, will chime in.</p>
