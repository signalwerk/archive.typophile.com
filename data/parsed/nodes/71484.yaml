    <p>The <a href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados (SOTA)</a> presents its annual letterfest in the City of the Angels this summer, featuring more than 70 of the brightest names in type and design, including:<br>
    <a href="http://www.linotypelibrary.com/469/akirakobayashi.html" rel="nofollow">Akira Kobayashi</a>, <a href="http://www.aiga.org/content.cfm/medalist-doyaldyoung" rel="nofollow">Doyald Young</a>, <a href="http://www.jillbell.com/about.html" rel="nofollow">Jill Bell</a>, <a href="http://www.terikahandesign.com/aboutteri2.html" rel="nofollow">Teri Kahan</a>, <a href="http://www.andrewbyrom.com/cv_page2.html" rel="nofollow">Andrew Byrom</a>, Sean Adam, <a href="http://new.myfonts.com/person/Richard_Kegler/" rel="nofollow">Richard Kegler</a>, Kevin Larson, <a href="http://www.typofonderie.com/profile/profilejfp/?SID=7885b6bad81a9d93724641e57277cad1" rel="nofollow"> Jean Françous Porchez</a>, <a href="http://www.portfoliocenter.com/about/programs/design/counsels/" rel="nofollow">Hank Richardson</a>, <a href="http://www.fontbureau.com/people/MatthewCarter/" rel="nofollow">Matthew Carter</a>, <a href="http://www.fontbureau.com/people/JohnDowner/" rel="nofollow">John Downer</a>, Gerald Bieler, <a href="http://www.rtea.org/dec/artists/chaz.html" rel="nofollow">Chaz Bojorquez</a>, Ricardo Martins, <a href="http://en.wikipedia.org/wiki/Johanna_Drucker" rel="nofollow">Johanna Drucker</a>, <a href="http://klim.co.nz/about.php" rel="nofollow">Kris Sowersby</a>, Denise Gonzales Crisp, <a href="http://typecamp.org/instructors.html" rel="nofollow">Shelley Gruendler</a>, <a href="http://www.adhesiontext.com/contact/" rel="nofollow">Miguel Sousa</a>, <a href="http://www.twardoch.com/adam/" rel="nofollow">Adam Twardoch</a>, <a href="http://www.typecon.com/talk.php?id=354" rel="nofollow">Satya Rajpurohit</a>, <a href="http://www.typecon.com/talk.php?id=350" rel="nofollow">Adrian Wilson</a>, and many more.</p>
    <p>Topics being covered at <a href="http://www.typecon.com/" rel="nofollow">TypeCon2010</a> include an eye-popping look at antique lettering of the textile trade, the typography of Disneyland, a documentary on the life and work of Jim Rimmer, the current state of web fonts, an exploration of a graduate program in type design in the US, and much more.</p>
    <p>Special events include the fifth annual <a href="http://www.typecon.com/education.php" rel="nofollow">Type &amp; Design Education Forum</a> and an <a href="http://www.typecon.com/gallery.php" rel="nofollow">international exhibition of type and design</a>. Dozens of workshops, presentations, panel discussions, networking events, tours, and social gatherings will form a typographic adventure that will inspire you for years to come.</p>
    <p><a href="http://www.typecon.com/talk.php?id=358" rel="nofollow">Register</a> now and save!<br>
    Take advantage of early bird pricing by registering before June 30th.</p>
    <p>Remember, SOTA members also receive a discount on their conference registration. Why not <a>Join</a> SOTA or renew your membership before registering and receive your member discount.</p>
    <p><strong>Early Registration (Through June 30th)</strong><br>
    SOTA members: $250 professional / $145 student<br>
    Non-members: $295 professional / $165 student</p>
    <p><strong>Regular Registration (July 1st - August 1st)</strong><br>
    SOTA members: $295 professional / $165 student<br>
    Non-members: $350 professional / $185 student</p>
    <p><strong>Late/Walk-Up Registration (After August 1st)</strong><br>
    SOTA members: $350 professional / $175 student<br>
    Non-members: $410 professional / $195 student</p>
    <p><strong>Pre-Conference Workshops (Optional)</strong><br>
    $50 per half-day session (plus materials / lab fees, if any)<br>
    $100 per full-day session (plus materials / lab fees, if any)</p>
    <p><strong>Type &amp; Design Education Forum (Optional)</strong><br>
    $100 for the full day session, including your choice of breakouts</p>
    <p>Stay close to the action — <a href="https://resweb.passkey.com/Resweb.do?mode=welcome_ei_new&amp;eventID=2542488&amp;fromResdesk=true" rel="nofollow">book your room</a> at the conference hotel and take advantage of discounted room rates for TypeCon attendees. TypeCon2010 Attendee Rate: $169/night single/double (plus taxes)</p>
    <p>TypeCon2010 would like to thank the wonderful individuals and businesses that make TypeCon possible. Without their continued assistance, we would not be able to offer such an affordable, high-quality event. Please help us support our partners and sponsors by checking out their products and services. Presenting Partners—Otis College of Art and Design, Society for Calligraphy, Southern California. 72 Point Sponsors—Adobe Systems, Clients &amp; Profits, The Font Bureau, Fontself, Monotype Imaging, MyFonts. 48 Point Sponsors—Ascender Corporation, Emigre, FontLab , Linotype, TypeTrust, Veer, YouWorkForThem. 24 Point Sponsors—Daidala, Fontdeck, Mark Simonson Studio , Munchfonts, P22, Parkinson Type Design, Typeco, Typostrophe, URW++. 12 Point Sponsor—Extensis. Media Partners—GD USA, Typophile, Typo Magazine. Design Partner—Corey Holms. Technology Partner—Campaign Monitor. Event Partners—Cina Associates, Type Directors Club.</p>
