    <p>I decided to throw together a tumblr blog of my 3d type explorations. I know I'm treading well-worn ground here, but I'm teaching myself the software and having fun with type while doing it. Although there's nothing particularly groundbreaking here, there may be something of interest to the people that frequent this board. Hope you like it.</p>
    <p><a href="http://coreyholms.tumblr.com/" title="http://coreyholms.tumblr.com/">http://coreyholms.tumblr.com/</a><br>
    and for those of you that don't like tumblr, I'm also replicating it all on my flickr site.<br>
    <a href="http://www.flickr.com/photos/whinger/sets/72157630637179352/" title="http://www.flickr.com/photos/whinger/sets/72157630637179352/">http://www.flickr.com/photos/whinger/sets/72157630637179352/</a></p>
    <p>If you don't like flickr or tumblr, sorry, got nothing else for you.</p>
    <p>Here's a teaser image [one of the better ones, ha].<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/tumblr_m7ex6598wI1rbwzc4o1_500_4707.jpg"></div><p></p>
