      <p>Lovely Art Nouveau lettering. Several interesting alternatives with a similar feel, but not quite as vertical. Bonnard by Casady &amp; Greene <a href="http://www.moorstation.org/typoasis/designers/casady_greene/" title="http://www.moorstation.org/typoasis/designers/casady_greene/">http://www.moorstation.org/typoasis/designers/casady_greene/</a> Regina Cursive <a href="http://www.myfonts.com/fonts/hihretrofonts/regina-cursiv/" title="http://www.myfonts.com/fonts/hihretrofonts/regina-cursiv/">http://www.myfonts.com/fonts/hihretrofonts/regina-cursiv/</a> and virtually the same font under the name of Toffee Script <a href="http://www.myfonts.com/fonts/suomi/toffee-script/" title="http://www.myfonts.com/fonts/suomi/toffee-script/">http://www.myfonts.com/fonts/suomi/toffee-script/</a> as well as Spring#7 <a href="http://www.myfonts.com/fonts/jmaul/spring7/" title="http://www.myfonts.com/fonts/jmaul/spring7/">http://www.myfonts.com/fonts/jmaul/spring7/</a><br>
      Don</p>
