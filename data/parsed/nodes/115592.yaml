    html: <p>Ryuk, Grocers Script actually reminds me a lot of OPTI Fonts <a href="http://opti.netii.net/fonts-m/index.htm" rel="nofollow">Morgan Fifty Nine</a>.  Grocers Script says it was discovered on the market Cours Saleya in Nice and was Designed in 2004 according to MyFonts where as the Castcraft/OPTI version says Copyright 1990-1991. I wonder what the real source of this typeface is.</p>
