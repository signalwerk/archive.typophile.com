      <p>In lieu of the deafening silence on this, might I suggest the rather obvious <a href="http://www.fontshop.com/search/?q=eurostile+extended&amp;x=0&amp;y=0" rel="nofollow">Eurostile Extended</a>?<br>
      For more personality, Carl Crossgrove's new <a href="http://www.linotype.com/702864/biome-family.html" rel="nofollow">Biome</a>. He says it's a display face, but IMO it does pretty good text as well.<br>
      And somewhat off the wall, picking up on the unicase style of Armchair, my own <a href="http://www.shinntype.com/panoptica.html" rel="nofollow">Panoptica Sans Regular</a>.</p>
