      <p>If its ’just’ the logo this could have been easily custom made, or customized<br>
      <em>( An alternate may be ’<a href="http://www.typodermic.com/fonts/16.html" target="_blank">Zekton</a>’, a typeface that originally started out as a free font by Ray Larabie; <a href="http://image2.myfonts.com/textimage/c0/c003d5163e29f93e9ea25a57da55a1c2.png" target="_blank">Just cut the angles of ’C’, ’S’ and ’E’, leave the ’H’ and ’connect’ the ’A’</a>  )</em></p>
      <p><em>( It may sound rude, But, That ’<a href="http://www.whitestone.ac/clients/2006/typeface.htm" target="_blank">Welcome / 2006 FIFA World Cup Germany</a>’ type has to be one of the ’oddest’, Ive seen in a while, Sorry, That just looks like one of those ’trendy’ free fonts )</em></p>
      <p>Dav</p>
