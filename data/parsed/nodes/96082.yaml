    html: |-
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/device/chase/chase/" rel="nofollow">Chase</a>, from Device Fonts, is about the closest; unfortunately, it's only available as a grunge font. It must have been based on something else, but I can't find it.</p>
      <p><a class="freelinking external" href="http://content.sportslogos.net/logos/7/179/full/4965.gif" rel="nofollow">Here's a link to the logo </a> that  has the matching 4, 9, E, and R </p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/clarendon-extended/clarendon-extended/" rel="nofollow">Clarendon extended (Wood Type Fonts)</a> is also quite close, but the serifs are somewhat different.</p>
      <p>All terminate the leg on the R differently as well.</p>
      <p>Herb VB</p>
