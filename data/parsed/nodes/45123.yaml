    <p>I have a client who wants a poster done just like it for a movie, but with different names, and he wants THAT font. Help! If I have to hand draw all this lettering it will be the death of me, but nothing close is making him happy, he wants this, exactly. Does it exist; this lettering is so uniform, I don't believe it was hand drawn; perhaps it's a modern replica done with type&gt; I'm crossing my fingers someone has seen these two fonts somewhere. He even want the type above Benny's Name, as well: "The Kind Of Swing..."  that, also, is a mystery to me.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Benny_5912.jpg"></div><p></p>
