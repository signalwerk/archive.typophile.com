    <p></p><div class="imageWrap"><img src="/web/20080905083741im_/http://www.typophile.com/files/diedrawer1_5042.jpg"></div><br>
    <div class="imageWrap"><img src="/web/20080905083741im_/http://www.typophile.com/files/diedrawer2_4173.jpg"></div><p></p>
    <p>Selections from <em>History in Small Spaces</em> the upcoming exhibition of large format archival pigment prints July 17-21, TypeCon 2008, Buffalo, New York.</p>
    <p>The desire for getting along in polite society have long tempted the fancy of aspiring souls, following are the musings of beautiful and enchanting young Undine Spragg, newcomer to the travails of the cosmopolitan dream:</p>
    <p>“She went to the window, and drawing back its many layers of lace gazed eastward down the long brown-stone perspective.  Beyond the Park lay Fifth Avenue–and Fifth Avenue was where she wanted to be!</p>
    <p>She had read in the ’Boudoir Chat’ of one of the Sunday papers that the smartest women were using the new pigeon-blood note-paper with white ink; and rather against her mother’s advice she had ordered a large supply, with her monogram in silver.  It was a disappointment, however, to that Mrs. Fairford wrote on the old-fashioned white sheet, without even a monogram–simply her address and telephone number.”–Edith Wha<!--
