  html: "<p>Not what I would call an unbiased look at the Bush and Kerry campaign logos: <br> <br><a href=\"http://www.nytimes.com/2004/10/09/opinion/09dadich.html?oref=login&amp;oref=login\" target=\"_blank\">http://www.nytimes.com/2004/10/09/opinion/09dadich.html?oref=login&amp;oref=login</a> <br> <br>\"...Folio Extra-Bold Italic letters. (Even the name of the font sounds forceful, doesn't it?)\" <br> <br>Can anybody tell me why they would even publish this tripe?</p>"
  html_clean: "<p>Not what I would call an unbiased look at the Bush and Kerry campaign logos: <br> <br><a href=\"http://www.nytimes.com/2004/10/09/opinion/09dadich.html?oref=login&amp;oref=login\" target=\"_blank\" class=\"link-external\">http://www.nytimes.com/2004/10/09/opinion/09dadich.html?oref=login&amp;oref=login</a> <br> <br>\"...Folio Extra-Bold Italic letters. (Even the name of the font sounds forceful, doesn't it?)\" <br> <br>Can anybody tell me why they would even publish this tripe?</p>"
