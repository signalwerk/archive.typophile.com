    html: "<p>I prefer Bush/Cheney's logo as well, but the assessment comes off very weak. He's playing on the generic perceptions of the candidates to make inane-sounding observations. Plus, he sounds about as Democratic as Cheney: <br> <br>\"Loose letter spacing between K and e communicates inexperience\" <br> <br>How about we just have the NYT publish a one-sentence article titled: \"Graphic Design, It's All As Stupid As You Thought\".</p>"
