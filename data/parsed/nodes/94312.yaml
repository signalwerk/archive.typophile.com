      <p>Hip hop is a lot about the $, so I would go all the way and use it.</p>
      <p>I feel like the progression idea is getting in the way of symmetry, and people like symmetry.</p>
      <p>As said before I think the type should be more bad ass. Maybe it's a cool idea to give it some perspective? Along with your 'wings'.</p>
      <p>Your fist indeed should look a little bit more like a fist.</p>
