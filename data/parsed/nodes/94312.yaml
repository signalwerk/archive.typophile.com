    <p>The title  &gt;&gt; ashes to ashes &lt;&lt; has been done lots of times in the music industry, so I wasn't all that concerned when a hip hop client requested that I create a cover design for his next LP/CD ... called ashes to ashes. </p>
    <p>Here's the line work, which dollar symbol do you think works best??</p>
    <p><img src="http://www.graphicdeclaration.com/images/ashes2ashes_5a.jpg"><br>
    <img src="http://www.graphicdeclaration.com/images/ashes2ashes_5b.jpg"></p>
    <p>Thanks in advance!</p>
    <p>n.</p>
