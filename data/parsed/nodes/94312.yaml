      <p>hrant, thanks for the inspirational comments bro. Ya, I wanted to say /fist/ without pushing the 2/thumb vibe either way ... this or that ...and the knuckles too for that matter.  </p>
      <p>And thanks for the linkage, Alias Collection Klute is great, diggin' Pop also!</p>
      <p>I'll try strengthening the grip of the fist by graduating the dollar signs from center outwards. and for that matter the letter shapes and knuckles too.</p>
      <p>Predictable is a good word... stable, is another as in not dynamic enough. But the last thing I want to do is get comical about it. </p>
      <p>n.</p>
