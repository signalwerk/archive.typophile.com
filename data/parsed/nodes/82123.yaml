    html: |-
      <p>I think the layout of the info is nice, but I don't get the m, e, w.  Are you concerned that people will not know which is which?  I would skip right to the info, which speaks for itself.  If you had a cell and an office phone, and a fax phone, then I can see making the distinction, but here it is not ambiguous at all.  And why M for telephone?</p>
      <p>I like the idea of "crow about it" and it really ties in nicely with your URL.  I would stick with that phrase throughout the branding.</p>
      <p>This is somewhat subjective, but to me the grunge font does not seem "creative" or "different and gained viewers attention".  To me it says "trend follower" in a bit outdated style.  Unfortunately every teenager 10+ years ago discovered these grunge fonts, and subsequently they became very trendy and were largely used in amateur designs.  I would strongly suggest you consider other options unless that particular style is a strong component of your overall portfolio.  That may be the best strategy to determining the style - play to what your work is all about.  I hope my perspective is helpful.</p>
