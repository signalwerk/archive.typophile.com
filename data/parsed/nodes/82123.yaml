      <p>I think those changes have helped.</p>
      <p>&gt; I have chosen five colours</p>
      <p>Not sure if you mean the cards will be printed in 5 different color variations, too, or just the other materials. If you mean the cards, I'd suggest asking your printer how it would affect the price to print it as 5 separate flat colors, rather than using CMYK. It will cost more, but the colors will be better and the type will reverse out more cleanly. </p>
      <p>(One way to reduce the cost of flat colors is to ask which ink colors the printer already has in stock, as those may be cheaper than custom-mixed colors.)</p>
