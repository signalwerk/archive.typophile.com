  html: |-
    <p>I have recently attempted to brand myself and would like your input. My name is Matthew Crowe so decided to play of my last name and the phrase, 'to crow about it' adapted to 'Crowe About It' and 'Something To Crowe About'. To show people croweing about my work I used a speech bubble with a creative, designed font inside. I have chosen five colours to differentiate each promotional material, for example each letter head a client received could have a different coloured logo on, accompanied by a different colour business etc. You get the idea. I did this to spice up the design a bit.</p>
    <p>My current logo design will be adapted to suit certain needs, ie, CD cover would say 'Something to Crowe About Inside'.</p>
    <p>For business cards I decided to take the entire shape of the speech bubble. Although it would cost more, the initial cost of the die cut will only be a one off payment.</p>
    <p>Any thoughts and criticisms will be very much appreciated, I do not want to commit to a design and then realise I have made mistakes or could improve it.</p>
    <p>Thanks in advance.</p>
