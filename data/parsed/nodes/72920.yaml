    <p>I'm having weird things happen with a font name.</p>
    <p>I've dabbled with Fontographer over the years to create some architectural fonts for my business (I'm an architect, if that's not obvious). I created a font "ErickTheArchitect 9" in Fontographer, and when it was ready to deploy I saved it as MikitenArch, to match my firm's web address. </p>
    <p>I've used the font for 2-3 years with no problems. All of a sudden a few months ago the font showed up missing in some software, getting something else substituted. In other places it reverted somehow back to "ErickTheArchitect 9". In FontBook I've only got ErickTheArchitect 9. Other people in my office continue to use MikitenArch just fine. But I seem to be seeing more and more places where my computer won't accept it.</p>
    <p>I looked every place I can think of, but nowhere was there any ErickTheArchitect 9 name in my Fontographer file. I re-created the font from Fontographer anyway, but to no avail. I delete ETA9, add MikitenArch, it shows up in FontBook, but ultimately changes back again.</p>
    <p>Now I've got CAD software that's spitting out drawings with substituted fonts, and I've got to get to the bottom of it, so I'm looking for any suggestions.</p>
