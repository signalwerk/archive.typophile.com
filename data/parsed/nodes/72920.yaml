    html: |-
      <p>Did you make any substantial system upgrade a few months ago that might have precipitated the transformation? </p>
      <p>Sounds like there are some font name id fields that obviously still have the working title in them. For some reason your systems started referencing one of those instead. </p>
      <p>There are many more id fields in a font than older versions of Fontographer give you access to. (Don’t know about the latest v5.) I don’t recall how or if it populates them all upon generation. </p>
      <p>Is your font a TTF or PS T1 format?</p>
      <p>You should probably find someone with a copy of FontLab who can crack open your font and rewrite all the font name id fields and regenerate for you.</p>
