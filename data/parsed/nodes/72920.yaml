    html: |-
      <p>Thanks for the comments. Maybe that was an initial error, having a numeral in the name. But Now I want to use the "MikitenArch" font only. </p>
      <p>New Info: It turns out that my employees saw the font names change on their computers, too, but didn't mention it to me - a couple of months ago! They've all been using Erick The Architect 9.</p>
      <p>I cleared my font cache and the MikitenArch has stuck for three computer startups. But since they all had ETA9, I had one of them export it. Here's what happened:</p>
      <p>1. Export Folder named Erick the Architect 9<br>
      2. Font file named MikitenArch!<br>
      3. Double-clicked to install, and it came up as Erick The Architect 9<br>
      4. I clicked Install, and it installed as Erick The Architect 9, but both it and MikitenArch (still installed) show that there are duplicates installed!<br>
      5. I disabled MikitenArch in FontBook, and Erick The Architect 9 shows up where it's supposed to in my CAD software.</p>
      <p>For now this is working and I can output, but I need to understand what's going on here to avoid anomalies in the future.</p>
      <p>Could there be a Font ID I can save that's separate from the Font Name?</p>
      <p>Any other suggestions are welcome.</p>
