      <p>"techradar.com": very close to <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/russell-square/" rel="nofollow">Russell Square</a> (needs to adjust some finials) and <a class="freelinking external" href="http://www.ffonts.net/Control-Freak.font" rel="nofollow">Control Freak</a> (needs to close the all thing up)<br>
      "Deep into technology": <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/scene/" rel="nofollow">Scene</a> using alternate <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/scene/pro-medium/glyphs.html#glyphs/544326/467" rel="nofollow">/i</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/scene/pro-medium/glyphs.html#glyphs/544326/469" rel="nofollow">/l</a></p>
