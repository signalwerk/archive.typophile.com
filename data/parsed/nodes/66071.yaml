    <p>Hi there typophiles. I'm working in indesign with Itc Avant Garde Gothic Std and i'm trying to use ligatures with upper case letters ie, CA AVA etc.. . I have the ligatures option turned on but the letters don't appear to change. Is there something i'm doing wrong? ligatures seem to work with other typefaces, just not any of the avant garde typefaces which i own!  I love the ligatures that are in this typeface and would love to be able to use them! pleasse help!</p>
    <p>these are the kind of ligatures i want to see!</p>
    <p><a href="http://www.blogotype.co.uk/wp-content/uploads/2009/03/avantgarde1.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.blogotype.co.uk/wp-content/uploads/2009/03/avantgarde1.jpg</a></p>
