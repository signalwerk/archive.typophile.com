    html: <p>Yuri - when I change the line gap manually, it changes the default from automatic to manual. I screen grabbed it in the wrong state, but thanks. <br> <br>Eduardo - such a simple thing is always the fault isn't it.  Thank you very much, I will recalculate the UPM and go from there. Thanks!</p>
