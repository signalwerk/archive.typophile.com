    html: <p>I'm not sure, but I guess you might need to scale  <br>down your characters, Corey. <br>The second windows shows 'Ascender' = 930 and  <br>'Descender' = -280. Which means, IIRC, total height  <br>= 1210. It's bigger than your 'Font UPMs', set to  <br>1000. <br></p>
