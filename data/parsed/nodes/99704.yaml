    html: <p>What you experienced in 5.04 is actually normal behavior. Using the guideline you have set the Tools &gt; Options &gt; Glyph window &gt; Dimensions &gt; Visual descender parameter. Removing the guideline doesn't change options. If you cannot reproduce this in v5.2 then this is a bug in 5.2.</p>
