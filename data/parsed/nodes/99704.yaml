      <p>Objection, Your Honor :)<br>
      FLS5MacManual reads on page 444:<br>
      "Global guidelines have an additional set of commands located in the<br>
      Guideline Is submenu. By selecting the commands in this submenu you<br>
      can set the font parameters: Ascender, Descender, Caps Height, x Height<br>
      or Visual Ascender and Descender that are used to set 100% zoom in the<br>
      Glyph Window."<br>
      Visual Ascender and Descender are described on page 77.</p>
      <p>Regards,<br>
      Johnych</p>
