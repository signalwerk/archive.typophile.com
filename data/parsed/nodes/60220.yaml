      <p>Interestingly, the W3C discussion of EOT Light as a possible interim format has gotten increasingly reasonable and in-depth in recent days. The Mozilla/Firefox people seem to be seriously entertaining the idea.</p>
      <p>I had originally thought that having EOT Lite as a stepping stone towards another format was kind of redundant and that nothing else would probably happen. But the non-Microsoft browsers have a strong interest in something "better," for the long run, and even Microsoft seems amenable to a two-stage solution, so who knows?</p>
      <p>Regards,</p>
      <p>T</p>
