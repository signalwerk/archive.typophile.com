      <p>&gt; I’m sure there are others - hopefully they will add their names to this post.</p>
      <p>I'm delighted to add Dalton Maag to this list.</p>
      <p>While we would be happy to offer our support to any format which ticks all the right boxes, EOT Lite is the one which we believe has the highest chance of cross-platform, cross-browser, and cross-device success. And the only realistic proposition for fast roll-out.</p>
      <p>We'd also like to see an easy-to-use and thorough subsetting tool (but that applies to font files in general) and ideally opposition to MTX fall - both on grounds of keeping the file compact to deliver real benefits over raw fonts.</p>
      <p>If MTX doesn't gain traction, I would advocate an, if you like, extension to EOT Lite which allows the whole content to be compressed using LZMA. Obviously no out-of-the-box IE support for that, but there's no IE support for CFF either, so once it's in the spec, that may come.</p>
      <p>Dave</p>
