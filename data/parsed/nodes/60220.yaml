      <p>Please excuse my self-promotion, but I do think my explanation of the new EOT format is the most concise and easily understandable treatment I've read so far:<br><a href="http://readableweb.com/jeffrey-zeldman-questions-the-eot-lite-web-font-format/"><strong>Jeffrey Zeldman Questions The EOT Lite Web Font Format</strong></a><br>
      To bring readers of this site up to date:<br>
      So far, even though the new EOT is a reasonable interim solution which would bring web fonts to the most people in the shortest amount of time, the folks from Mozilla FireFox and Opera have said they are "not interested" in deploying it, despite this one great advantage. I'm not sure where Apple stands.<br>
      Since it would appear unreasonable to not give reasons for declining to support the new EOT, bullshit reasons have been put forth, in public, in the main forum for these discussions so far, the W3C Web Fonts mailing list.(Don't have the link handy... anyone?)<br>
      Failure to deploy the new EOT means delaying any kind of reliable cross-browser support <strong>for perhaps as long as ten years</strong>.<br>
      Please note that there is nothing to prevent a more mature and comprehensive spec such as .webfont or .zot from being developed either alongside or on the heels of an EOT solution.<br>
      Me, I guess I'll be boning up on my Adobe Flash skills because the way things are going, that's the only way I'll be able to see what I want to see inside a browser window for the foreseeable future. A shame. Really.</p>
