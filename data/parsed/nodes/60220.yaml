  - id: 360662
    user: 1262
    date: 2009-08-09T00:06:00
    date_raw: 9 August 2009 - 12:06am
    votes: 0
    html: "<p>I'm not talking about browser caches, I'm talking about the fonts that people have installed on their systems, most of which most people have no idea where they come from: fonts that come with the system, fonts that come with applications, fonts that some friend installed on their machine, etc. Most people have no idea that font licenses even exist, let alone what these licenses permit or do not permit. This leads most of the font makers I know to be concerned that naked font linking is basically just an invitation to give away all existing TTF/OTF fonts. Moving forward, with a viable interoperable format and appropriate license metadata etc., font makers can provide web fonts and earn some money from this use, but only if they're not competing against massively widespread unlicensed use of existing desktop fonts on the web.</p>"
