    html: |-
      <p>Yes James, Now you understand! Nobodies are stealing our fonts, and we have to do nothing to stop them, never. </p>
      <p>JH&gt; Typical example of casual misuse of naked font linking: user has a font on his or her system and wants to use it to display text on web page. [etc through 3 examples where obvious 'nobodies', casually copy, serve and link unlicensed font IP, supposedly because it's 'naked' (OpenType)]</p>
      <p>Bought your red herring argument at the red herring argument store?</p>
      <p>John's 'casual users' are either Fired by Legal eventually, or they are Nobodies we'd never get a license fee from... ever. All three 'casual misuse' examples are happening soon-as-can-be in another format, just as "casually". Users will send each other EOTL. Users will serve each other EOTL, and users will link to fonts on other's servers, in EOTL.</p>
      <p>JH&gt;The presence of a permissions and recommendations table in the font to which no browser pays any attention and that the user never sees seems to me to have no impact on this scenario.</p>
      <p>If no browser can pay any attention to, and no user can ever see anything from EPAR or metadata of a truly useful nature, ever... is that the better scenario then? </p>
      <p>A lot that was impossible, becomes possible with EPAR, for all formats 'downstream' and as OT is...</p>
      <p>JH&gt;This leads most of the font makers I know to be concerned that naked font linking is basically just an invitation to give away all existing TTF/OTF fonts. </p>
      <p>OT is a web font format recommendation of the w3c. If a founder does not have a licensable OT font for the web, and there is nothing else for a developer's browser(s), (for years) what is that an invitation to do? </p>
      <p>So... this fear is not resolved by the means most of the font makers I know are being ponded into. And as you can see, the demonization of EPAR has begun! "It will never do anything for anyone ever, so why do it?"</p>
      <p>Ironically, I said the same a long time ago about any new format, then talked to 100's of clients and types, looked at thousands of types on clients, read a mozillion words from users, developers, permitters and recommendor's, confirmed that no new format will work, and that's how I got to EPAR. </p>
      <p>How'd you get here, John? What's your motive? Who do you represent?</p>
      <p>Cheers!</p>
