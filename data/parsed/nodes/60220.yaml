      <p>Typical example of casual misuse of naked font linking: user has a font on his or her system and wants to use it to display text on web page. User has no clue where the font came from or what license terms may apply to it, only that it is available and he or she likes it. So the font is uploaded to a server and linked to as you describe. This is the first casual misuse. The second casual misuse happens when someone writes to that user and says 'Cool font! Where can I get it?' and the first user says 'Oh, you can download it from my server'. The third misuse happens when another user links to the naked font on the server to display text on his own website. The presence of a permissions and recommendations table in the font to which no browser pays any attention and that the user never sees seems to me to have no impact on this scenario.</p>
      <p>Now consider the impact of a format distinction between desktop and web fonts: the existing fonts on the user's system are not useful on the web because they don't offer cross-browser interoperability. The user has to either get a new license and a new (customised, serialised, PERM'd) font, or has to figure out a way to make a web font. Either way, the very fact that some action is required raises the question 'Why?' which is directly answerable in terms of the existing license agreement. Simply put, the format distinction provides an opportunity to educate the user about the license, which is the distinction between casual and deliberate misuse.</p>
