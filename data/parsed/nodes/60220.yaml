      <p>Right, Nick. There is no protection against deliberate theft, there is only protection against casual misuse. I've lost track of how many times that has been clearly stated, and I'm surprised if anyone is still confused about this.<br>
      _____</p>
      <p><em>Don’t ever be fooled; unless the format you’re supporting the serving of has Electronic Permissions and Recommendations, being on these support-the-format lists is for the improperly informed, just properly afraid.</em></p>
      <p>Since your EP&amp;R proposal is for a font table, it can be included within any wrapper that wraps an sfnt font. The latest WebOTF proposal used the ZOT compression model, which compresses individual tables rather than the whole font, so a tool could efficiently decompress just the EP&amp;R table to check permissions and recommendations, without needing to decompress and load the whole font first.</p>
      <p>I'm still far from clear who you think is going to look at this table and what you think they are going to do with the information in it.</p>
