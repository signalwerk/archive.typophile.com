      <p>The funny thing about the bullshit reasons given not to support EOT Lite is that 'It smells like Microsoft' seems to me a valid reason and I don't know why Mozilla and Opera are making themselves look foolish coming up with obvious red herrings to try to justify their objection on supposedly technical grounds. :)</p>
      <p>Microsoft's resistance to naked font linking isn't supported by technical reasons: it is supported by IP and strategic reasons. As such, it is a much stronger position than the pseudo-technical case that Mozilla and Opera are trying to make against EOT Lite. Microsoft are not trying to invent technical reasons why they won't support naked font linking: they're just stating it as a policy.</p>
