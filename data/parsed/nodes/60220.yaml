      <p>Personally, I support proposals which reasonably protect the font from theft and do not burden users or browsers with excessive roadblocks. Both EOT and EOT lite "seem" to do this. The proof is in the pudding though. We will have to see what becomes of the Monotype offer of release of compression sourcecode and the Microsoft offer to release its wrapper. The major browsers need to all be on a level playing field.<br>
