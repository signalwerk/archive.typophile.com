      <p>Ascender supports the ideas in the .webfont proposal (and also the .zot proposal). Unfortunately those will take years to achieve widespread adoption. So the only opportunity that we see for a single web font format across all browsers in the short term is EOT Lite.</p>
      <p>We proposed EOT Lite to address the two features of EOT that the browser makers objected to: MTX font compression and URL binding. If the browser makers take up <a href="http://lists.w3.org/Archives/Public/www-font/2009JulSep/0599.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Monotype's offer for MTX</a>, then EOT Lite would be an even better solution.</p>
      <p>Regardless, EOT Lite provides an achievable solution that would give web designers a single web font format, and access to a large collection of commercial fonts that they desire (and that we want to offer!).</p>
    html_clean: |-
