    <p>Many of you may have already seen the <a href="http://tr.im/sF8B">growing list</a> of foundries and type designers who support, and/or at least like the idea of, the <a href="http://tr.im/txMm">.webfonts proposal</a>. I'd also like to get a list together of foundries that support EOT and/or EOT Lite. (I can't find a link to the current propsal.) And while we're at it what about foundries who are going to use Typekit? </p>
    <p>This is a lot to ask. But if you could just list your name, foundry, and which format you support. And if you are going to use the Typekit service.</p>
