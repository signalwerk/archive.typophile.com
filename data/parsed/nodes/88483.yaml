      <p>If you want more print examples, the Dover reprints of Clarence P. Hornung's collections of 19th Century type ornaments have pages of them, but no text. This excellent book on <a class="freelinking external" href="http://www.artisticprintingbook.com/" rel="nofollow">fancy type</a> has some too but the text is more about the technical side of printing rather than the source of the styles.</p>
      <p>As a calligraphic ornament, I'm sure somewhere on youtube there's at least one film of someone drawing these with a pen held in a very strange way, dragged with the hand palm-side up.</p>
