    <p>Can anyone point me to a list of artists or a compendium that contains ornamentation similar to that in the attached image? I'm just curious as to the historical inspiration of this. It has some Spencerian influence, but it's still different. Also, do you think it's French, Italian? I'm doing a study on ornamentation and curious to find more ornament of this nature. </p>
    <p>Thanks,</p>
    <p>AS </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/spencerianflourishing_4401.jpg"></div><p></p>
