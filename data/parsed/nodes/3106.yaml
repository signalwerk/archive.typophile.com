    html: <p>&gt; You mean it's over?! Dang. Who won? <br> <br>I would say Tatiana did. <br> <br>&gt; "Business 2.0" magazine? <br> <br>Clean, Simple and straight-forward. No "tricky-feathers" (to quote a former teacher). <br> <br>&gt; I really liked Paula Scher's redesign of Metropolis. <br> <br>Although I really am guilty of loving the over-sized magazines, especially when they are typographically amazing, the re-design has kept much of what was good in the first place. It seems to have all-around been proportionally scaled. Ergo, same ratio of positive to negative space.  <br> <br>&gt; strategy+business <br> <br>This one is nice as well. The writing is a little too heady for me, but the typogrpahy is straight-forward and doesn't make the reader perform too much to find the info. <br> <br>&gt; critique <br> <br>I was lucky enough to be purchasing this as it was published. My favorite of the issues was that on mentoring. It was a great tool for teaching as well. My students really enjoyed the bits of info put before them and were able to digest it and use it.  <br> <br>The paper suggestion, Michael's, is a good idea. Some paper companies do try to combine education and promotion, such as Sappi.  <br> <br>&gt; Considering that the staple colors  <br>&gt; are red, black and white... <br> <br>Pentagram is not the only company guilty (although I don't think it such a bad color combination) of using the holy trinity of colors. A study of all the magazines which <a href="http://www.daniloblackusa.com/"> Roger Black and Danilo Black</a> has been involved with will quickly show that he is probably even more so. Guilty that is. Although Pentagram is more Sans and Transitional and Black is more Egyptian and Oldstyle. <br> <br>&gt; aware of Fernando Gutierrez <br> <br>Didn't he work with Roger Black at one point? <br> <br>&gt; wassup with that "Discuss"?! <br> <br>;-) my mistake. ;-) <br> <br>&gt; Naw, not school teacher... <br> <br>Joe, that would make a good handle. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">  <br> <br>&gt; I have chronic M.A., too.  <br> <br>I'd bet most people with any involvement in typography probably have to go to border's for at least a weekly fix. i love shopping online, but the feel of the paper and the smell of the ink, now that is a rush!  <br> <br>Seriously. <i>Esquire</i> is great. (doesn't hurt that Jude Law is on the cover. An amazing example of taking a face that perhaps is intended for body text and using it in a dynamic way for display purposes. Although it is a display version of the face. I also enjoy <i>Town &amp; Country's</i> use of Requiem. In general, this is a well thought out magazine.  <br> <br>For all of you helvetica nay-sayers. Does anyone remember Michael Koepke's work on <i>Creme</i>? He truly pushed that typeface into new directions. <br> <br>&gt; Vince Frost <br> <br>That's right. That magazine is so... refined, sterile, great judgment (pick a word). <br> <br>&gt; try to utter the word BRODOVITCH to a bunch  <br>&gt; of snowboard-obsessed "new media" designers <br> <br>;) Right! Have you seen the Book? The book itself is a perfect addition to anyone's library. I've used it in publication design class to show great use of composition. Cipe Pineles is another example of great design BM (before macintosh). And you can't forget the work of Paul Rand either. <br> <br>Does anyone remember <i>Details</i> before it became a men's magazine? It was a who's who and what's what of Manhattan life. I coveted those. Why oh why did I throw them away? Does anyone know who designed those? Or what about <i>TAXI</i>? Sheesh my age is showing again. <i>Egg</i> was pretty cool too. It had to have been one of the first magazines to try a square format. <i>Flaunt</i> is really good for straight-forward (but with a wink) typography. Although I have a feeling it is more of a men's magazine. Hrant would like this one! ;) The latest issue is all about Italy, how timely for those of us going. <br> <br>Admittedly I'm more old-school. But is this such a bad thing? Isn't design about discovery and re-discovery? Especially with type. I suppose the urge to design type comes from not wanting to use what is there already. But for magazine design this is not always feasible, therefore you find yourself on a road of discovery. Asking questions and looking for answers from what is there. But trying to take the answers and use them in new ways. <br> <br>Magazine design isn't so different from building a house. The structure's skeleton (grid) must be strong enough to hold the rest. If you have a wonky grid then everything else will never hold strong or make sense.</p>
    html_clean: <p>&gt; You mean it's over?! Dang. Who won? <br> <br>I would say Tatiana did. <br> <br>&gt; "Business 2.0" magazine? <br> <br>Clean, Simple and straight-forward. No "tricky-feathers" (to quote a former teacher). <br> <br>&gt; I really liked Paula Scher's redesign of Metropolis. <br> <br>Although I really am guilty of loving the over-sized magazines, especially when they are typographically amazing, the re-design has kept much of what was good in the first place. It seems to have all-around been proportionally scaled. Ergo, same ratio of positive to negative space.  <br> <br>&gt; strategy+business <br> <br>This one is nice as well. The writing is a little too heady for me, but the typogrpahy is straight-forward and doesn't make the reader perform too much to find the info. <br> <br>&gt; critique <br> <br>I was lucky enough to be purchasing this as it was published. My favorite of the issues was that on mentoring. It was a great tool for teaching as well. My students really enjoyed the bits of info put before them and were able to digest it and use it.  <br> <br>The paper suggestion, Michael's, is a good idea. Some paper companies do try to combine education and promotion, such as Sappi.  <br> <br>&gt; Considering that the staple colors  <br>&gt; are red, black and white... <br> <br>Pentagram is not the only company guilty (although I don't think it such a bad color combination) of using the holy trinity of colors. A study of all the magazines which <a href="http://www.daniloblackusa.com/" class="link-external"> Roger Black and Danilo Black</a> has been involved with will quickly show that he is probably even more so. Guilty that is. Although Pentagram is more Sans and Transitional and Black is more Egyptian and Oldstyle. <br> <br>&gt; aware of Fernando Gutierrez <br> <br>Didn't he work with Roger Black at one point? <br> <br>&gt; wassup with that "Discuss"?! <br> <br>;-) my mistake. ;-) <br> <br>&gt; Naw, not school teacher... <br> <br>Joe, that would make a good handle. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">  <br> <br>&gt; I have chronic M.A., too.  <br> <br>I'd bet most people with any involvement in typography probably have to go to border's for at least a weekly fix. i love shopping online, but the feel of the paper and the smell of the ink, now that is a rush!  <br> <br>Seriously. <i>Esquire</i> is great. (doesn't hurt that Jude Law is on the cover. An amazing example of taking a face that perhaps is intended for body text and using it in a dynamic way for display purposes. Although it is a display version of the face. I also enjoy <i>Town &amp; Country's</i> use of Requiem. In general, this is a well thought out magazine.  <br> <br>For all of you helvetica nay-sayers. Does anyone remember Michael Koepke's work on <i>Creme</i>? He truly pushed that typeface into new directions. <br> <br>&gt; Vince Frost <br> <br>That's right. That magazine is so... refined, sterile, great judgment (pick a word). <br> <br>&gt; try to utter the word BRODOVITCH to a bunch  <br>&gt; of snowboard-obsessed "new media" designers <br> <br>;) Right! Have you seen the Book? The book itself is a perfect addition to anyone's library. I've used it in publication design class to show great use of composition. Cipe Pineles is another example of great design BM (before macintosh). And you can't forget the work of Paul Rand either. <br> <br>Does anyone remember <i>Details</i> before it became a men's magazine? It was a who's who and what's what of Manhattan life. I coveted those. Why oh why did I throw them away? Does anyone know who designed those? Or what about <i>TAXI</i>? Sheesh my age is showing again. <i>Egg</i> was pretty cool too. It had to have been one of the first magazines to try a square format. <i>Flaunt</i> is really good for straight-forward (but with a wink) typography. Although I have a feeling it is more of a men's magazine. Hrant would like this one! ;) The latest issue is all about Italy, how timely for those of us going. <br> <br>Admittedly I'm more old-school. But is this such a bad thing? Isn't design about discovery and re-discovery? Especially with type. I suppose the urge to design type comes from not wanting to use what is there already. But for magazine design this is not always feasible, therefore you find yourself on a road of discovery. Asking questions and looking for answers from what is there. But trying to take the answers and use them in new ways. <br> <br>Magazine design isn't so different from building a house. The structure's skeleton (grid) must be strong enough to hold the rest. If you have a wonky grid then everything else will never hold strong or make sense.</p>
