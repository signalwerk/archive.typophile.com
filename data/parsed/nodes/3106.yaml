    html: <p>&gt; everything else will never hold strong or make sense. <br> <br>That said. What about <i>Ray Gun</i>. I mean before David Carson left. I'll admit I kicked against the pricks when it came out, that and <i>Emigre</i>. I was a holier than thou helvetica worshipper. But I still bought them. I still looked at them. And I still tried to emulate them. I tried because I wanted to see what was inside of them. Where was the structure. Some of those designs although on the surface seemed free of rhymne and reason really did work and make sense. But, is that because sometimes, in art, it just works? If you follow the rules of composition it will work won't it?</p>
