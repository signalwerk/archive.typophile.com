    html: "<p> Tiffany, you had a wonderful idea, starting a magazine design discussion! <br>I share with you a chronic case of M.A. (Magazine Addiction). Living in Milan, Italy, I have easy access to almost all American and European magazines. Being not only a magaholic, but a graphic designer also, I especially buy design publications, but also quite a few \"lifestyle\" magazines (and many more, not on a regular basis). After a few years of working mostly on web sites (I still work for the italian office of one of those very large - and very, very worried - web consultancy firms) I decided to get back to my first love, print, only this time I want to do things on my own terms. <br>So, with the help of a journalist friend, I am currently working on my first magazine design project (a new title that we're starting from scratch and - hopefully - one day eventually publish, if we find the right financial backing). We plan to create a dummy issue and then show it around. <br>So I will gladly participate in this discussion. I am currently asking myself so many magazine design questions working on this project, so I think it will be great to share my opinions with you guys! <br>My flat has always been packed with old/new magazines, but as you can imagine, now that I am working on one, it's even worse. <br>So, regarding your first posting: I also have fond memories for Baron, Woodward and Kalman at their creative peaks, and I rate their work like some of the best magazine design ever.It is still fresh today, which is NOT what could be said of a certain other magazine art director/surfer who once believed to be god and has currently been sucked in a black hole, apparently. <br>Are you guys aware of the work of Fernando Gutierrez, the spanish creative director behind Vanidad, Matador, Tentaciones and who is currently designing Colors Magazine? His work is fantastic, maybe you saw a great article about him on a not-so-recent issue of Eye Magazine? What do you guys think of him? <br>Ciao a tutti, from Milan. </p>"
