  html: "<p> For a very long time now I have been a great lover of magazines.* Upon  <br>entering design school I obviously had new reasons (and excuses) to continue  <br>with this obsession, or if you like, fetish. Over the years since I have  <br>witnessed great magazines and/or great design, come and go with the tides.  <br>Remember _Interview_ when Tibor Kalman was in charge? It was an amazing  <br>example of great magazine design. And what of _Rolling Stone_ before  <br>Photoshop and Illustrator made some things too easy? Or _Vogue_ during the  <br>height of Supermodeldom? Not to mention anything that Fabian Baron touched,  <br>or so it seemed, in the nineties? <br> <br>Perhaps my references show my love of a more traditional time, but I really  <br>have many questions and I'll wager others would like to hear a serious  <br>discussion about magazine design and typography. And perhaps while we're at  <br>it we could list out favorites and least favorites. In view of the forum we  <br>are on the list should include both creative director and the typefaces  <br>used.** This discussion, or my guilt, are born out of two recent redesigns  <br>and one wish for involvement in a redesign. <br> <br>First, _Harper's Bazaar_. I love the magazine, I love Didot, but ... *** <br> <br>Second, _Fast Company_. I only just recv'd this issue in the mail today, but  <br>Ty' fa is gone  The design IMO is still strong, the content not gotten weak.  <br>I suppose when I saw the flag I was a little depressed. I like it, in an of  <br>itself, but there are so many business magazines with sans serif screaming  <br>from the top. I suppose I should hold judgement until I go the bookstore and  <br>see for myself. <br> <br>Last, what ever happened to _Vogue_? <br> <br>QUESTION:  Do type foundries ever approach publication houses with the  <br>desire to change the look? Or is this considered arrogant? Is it any more  <br>arrogant than a design studio approaching them? <br> <br>*It is an addiction I picked up very early on in my life starting with my  <br>stacks of _Seventeen_. ** Perhaps a pattern could be shown? *** The word I  <br>have in mind is overkill. </p>"
