    html: <p>Thanks, I had never heard of J. T. Blanchard... as to the words, I actually knew they exist in that spelling, I just find their usage today inadequate. The only words that I'd spell with diacritics in English are façade, naïve, rôle, etc. «The New Yorker» likes to spell reëlect, coöperate...</p>
