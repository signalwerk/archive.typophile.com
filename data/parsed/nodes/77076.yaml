    html: <p>This font is indeed right on, but, unfortunately, nearly all letters have artwork -- they're not just the plain letters, but they add "bricks" of one sort or another, as shown in the sample palettes.  They do work beautifully in Word, as you suggested, but they can't be used for the envelopes.  Still searching ... Thanks.</p>
