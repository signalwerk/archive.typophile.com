  html: <p>I need to self-print two emergency envelopes for invitations that should have gone out last week (all the others did already). My invitation typeface is Trajan Regular. Is there a typeface that is sufficiently similar but available in either MS Word for Mac or in Apple iWork?  I'm really in a jam and I can't afford the turn-around time involved in getting my envelope person to address them and return them to me.  Thanks!</p>
