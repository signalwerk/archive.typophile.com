      <p>Thanks Tiffany, </p>
      <p>The comment I made about what this would do to the reputation of freeware type designers associated with this effort (either by choice or not) was an honest one. I can see things going in a number of directions for them, they could become heroes of the new font-enabled Web, or they could find themselves unjustly blamed for the fugly – I’ll coin the phrase “Vinnification” :-( - Comic Sans is still a very popular font with the masses, even though through no fault of his own, Vinnie gets flack for it. Equally until Firefox and IE jump on the bandwagon nothing may happen. Likewise if mainstream commercial font vendors can find a way to be involved then it won’t be an issue. </p>
      <p>The timing, with respect to the <a href="http://www.microsoft.com/typography/links/news.aspx?NID=6121" rel="nofollow">Business of Type event</a> couldn’t be better, rather than focus purely on the issues of enforcement and risk we can explore ways for font makers to benefit from this technology. </p>
      <p>In addition the "PS" comment about Ray’s fonts having their place, was an honest effort to counter any perception that I was anti-Ray in my earlier post. I know various Microsoft games groups use his fonts, and I was lucky enough to be able to license one of his fonts (through an agent) for redistribution in Halo 3.</p>
