      <p><cite> it had to fetch parts of the font data from several other files</cite></p>
      <p>I guess Guifa already suggested something similar before.<br>
      I just played around with that idea and was very surprised: It already works!</p>
      <p>Safari seems to already honor the definition of unicode ranges in the font-face declaration as it was proposed in the CSS3 working draft. So you can easily build one virtual CSS font from several (incomplete) physical font files. So the font acts like one normal font, but in the browser cache there will be a bunch of font files with incomplete character sets. Halleluja! :-)</p>
