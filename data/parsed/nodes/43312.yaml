      <p><cite>But, if we are speaking in general terms I fear for what the web will become.</cite></p>
      <p>I don't. The web already has some nasty features: Animated GIFs, the Marquee tag, the blink tag, ...<br>
      But just because they are there, doesn't mean they will be used all the time. At least not on professional websites. They are used on a Harry Potter fan site of a teenager. And this kid will be very happy to set the text in the Harry Potter free font. But that doesn't mean it will be used on Typophile. ;-)</p>
      <p><cite>You had a technique to hide the fonts, which introduces a barrier to misuse. Does this work with Safari’s implementation?</cite></p>
      <p>It does. In my example there is no public URL for the font file itself. The font is only delivered (from the foundry website) after an authenticated request from an external (i.e. the client's) website. So no one can just look into the soure code and download the font. But in the end, the full font file is delivered to every browser. So of course it IS possible to get the font. And this will always be the case. Whether the font will be extracted from a browser cache, from the RAM or from a EOT-file. There is no bullet-proof protection. We all know this sort of discussion from the music industry, so we can learn from their mistakes. I think we shouldn't embrace the possibilities in this new and huge market as soon as possible. There are millions of websites out there and I am pretty sure that web designers will not hesitate to buy web licenses. We just need to figure out the right models and conditions.</p>
