      <p><cite>Keep in mind that while this is cool, this was in all likelihood done for one reason and one reason only: custom iPhone apps</cite></p>
      <p>I think that there’s more to it than that; namely, Apple got sick of waiting for the standards crowd to get something done and took the initiative to craft a solution that will annoy some people, but get the ball rolling. It’s something that Apple is in a unique position to do; if say, Microsoft or Adobe tried this, people would just start screaming “monopolists!” and “embrace and extend!”. Surely custom fonts for iPhone apps is something Apple would like to have, but the reality is that the W3C should have worked this stuff out a long time ago.</p>
