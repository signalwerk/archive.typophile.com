    html: |-
      <p><cite>The more interesting would be if you could shift the codepoint values in CSS</cite></p>
      <p>(To answer your email as well)</p>
      <p>Messing aroung with the Unicode values is a clever way of doing it - as long as you have full control over the site. But I think if we want to offer webdesigners fonts for embedding they wouldn't accept such hacks. Copy&amp;Paste still has to work, an html text must also be working in the feed reader and so on.</p>
      <p>But the combination of hiding the download URI and splitting the font file is a sufficient level of protection (at least to me). You could even break this down to single characters! Give the fonts the same name and they wouldn't even install in the OS. To rebuilt the original font would be more work than it is today to extract the "Typophile featured face". And since I wouln't put any kerning or OpenType features in a web fonts (because they are not supported), no one could rebuilt the original font, that may also be available with a regular print license.</p>
    html_clean: |-
