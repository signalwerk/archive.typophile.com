      <p>James, I agree that a huge amount of vitriol surges through Typophile from time to time. It isn't good, but it may be the price we pay for having a rich fast free and deeply helpful resource. For me it is utterly worth it. For Jim it was not. I too have talked to him about that ( in person which was very very nice indeed ) and I encouraged him to come back. I think if you feel know what you need to know to do what you are doing ( he does ) the draw to typophile may be less as well. That is unless you want to try to promote an idea or two! </p>
      <p>About Moderating: As a moderator I am sure I don't find or intervene in all the vitriol that goes by, but when I do and it seems excessive I usually encourage folk to keep it nicer. But it has to be a bit protracted and really I can't MAKE THEM. Further, unless somebody is making personal accusations or insults ( as opposed to insulting their work ) I/we don't come down like a ton of bricks. And yes, unfortunately that has happened. </p>
      <p>There are a lot of good reasons to be nice! My favorite being that it helps ideas be exchanged more smoothly. This is happily enough for lots of people. However paradoxically enough it is a respect for the free flow of ideas that also stops us from not MAKING them stop even if they are not being 100% nice. And actually I don't think Typophile would be as useful without a candor that might feel cutting to some some of the time.</p>
      <p>So about what Si wrote: I realize that what Si wrote looked very personal to you but I actually think his real concern was aesthetic which he has every right to. These are different things. </p>
      <p>Another aspect to consider is a kind of human adaptation/weakness. If you know somebody and respect them and have seen their posts be helpful again and again and again it is possible that your sense of what's right, fair, nice, etc when it comes to their posts is shifted a bit. You may give them more benefit of the doubt. It's not ideal but it's human and no doubt this is even adaptive to a degree. In my case I am sure you fall into that category, so as you see it works both ways. Not that that should matter. So as I say when it comes to moderating I try hard to put that aside in the interests of fairness but I can't be sure I or anybody else succeeds. In fact the reverse. Knowing you will fail isn't an excuse for not trying. Instead it all the more reason for doing your best. I promise to keep doing that.</p>
      <p>I am happy to talk with you or any Typophiler about this further and I am interested in fairness and in recognizing my and our failings. Here or on IM or email or whatever.</p>
      <p><cite> Typophile’s political policy </cite> This is fiction. Maybe we should be that organized ( or maybe not! ) but the reality is that we are not. What you see is a unconnected pattern of individual responses. You may not agree with the pattern. And you don't have to be silent about it. But that's what it is - a pattern- not a a policy.</p>
      <p>Anyway, I do very much hope you hang around! </p>
      <p>Let's keep talking about the embedding...</p>
      <p>I don't think locking things down is a viable or desirable option. Okay maybe personally it is... </p>
      <p>And while the interweb* may get uglier for a time while people learn how to use the tool it may be a great thing eventually - but not if the Type industry doesn't work to create a mechanism to take advantage of this catastrophe/opportunity that includes kerning! Sadly I don't have one in mind.</p>
      <p>This is happening for a reason which is that if you want substantial control over the look of your text you have to opt for a display layer in flash and a searchable layer in HTML.  No?</p>
      <p>Since ring tones are being sold (Licensed) with songs maybe fonts could be too. What do you think?</p>
      <p>* What do you call it these days any way?</p>
