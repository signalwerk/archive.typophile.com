    html: |-
      <p>Are we saying that I can save an html page in Safari and download the fonts installed in the host's operating system?</p>
      <p>If so, then the font license must either cover or limit the rights of the user who downloads the fonts.</p>
      <p>If the user has limited rights, he or she may not install and use them in other documents, without violating his or her limited user rights.</p>
      <p>It os likely that as most font foundries include PDF embeddable rights, they will also include limited html user rights.</p>
      <p>But I doubt if font foundries will unleash complete user rights to install downloadable fonts in their operating system and usse ther fonts freely in any document. That's the same as granting unlimited worldwide rights for anyone for a single sale.</p>
