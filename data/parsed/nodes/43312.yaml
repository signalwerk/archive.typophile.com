      <p>It is built in a way so that the font can be requested only from one specific site. But like I said before: No matter how you disguise the font on the server, in the end the full font file is downloaded to EVERY user accessing this (authorized) site. It will always be possible to catch the font at this point and there is nothing we can do about it.<br>
