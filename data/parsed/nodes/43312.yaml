      <p>Eben: <em>About Moderating: As a moderator I am sure I don’t find or intervene in all the vitriol that goes by, but when I do and it seems excessive I usually encourage folk to keep it nicer. But it has to be a bit protracted and really I can’t MAKE THEM. Further, unless somebody is making personal accusations or insults ( as opposed to insulting their work ) I/we don’t come down like a ton of bricks. And yes, unfortunately that has happened.</em></p>
      <p>Why didn't you or another moderator cut the cards on all the threads where Nick Shinn and Hrant were tearing strips off each other? On one occasion it was left to John Hudson to moderate Nick and Hrant. John cut the cards on that occasion because the personal fight between them derailed the discussion so completely. Like Tiffany and Stephen, you're making excuses for your own intransigence and gutless attitude to the job of keeping civility.</p>
      <p><em>Another aspect to consider is a kind of human adaptation/weakness. If you know somebody and respect them and have seen their posts be helpful again and again and again it is possible that your sense of what’s right, fair, nice, etc when it comes to their posts is shifted a bit. You may give them more benefit of the doubt. It’s not ideal but it’s human and no doubt this is even adaptive to a degree. In my case I am sure you fall into that category, so as you see it works both ways. Not that that should matter. So as I say when it comes to moderating I try hard to put that aside in the interests of fairness but I can’t be sure I or anybody else succeeds. In fact the reverse. Knowing you will fail isn’t an excuse for not trying. Instead it all the more reason for doing your best. I promise to keep doing that.</em> </p>
