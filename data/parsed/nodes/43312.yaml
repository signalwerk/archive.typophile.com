    html: |-
      <p>Thanks very much for defending me, James. I really appreciate it.</p>
      <p>Freeware fonts are more likely to be used in lowbrow design hence I'm used to being a typographical punching bag. The more widely fonts are distributed, the more likely it is that they'll be misused. Young font designers, take heed: don't release freeware fonts unless you don't mind a future career as whipping boy/girl. Even if you make great fonts, you'll be remembered for fonts misused. I guess Vincent Connare knows how that goes. Praise for Magpie will always be overshadowed by anti-Comic Sans sentiment.</p>
      <p>About the ugly fonts:</p>
      <p>The first font in the example at the beginning of this thread is <a href="http://www.myfonts.com/fonts/larabie/primer-apples/" rel="nofollow">Primer Apples</a> which was created for a German teacher at no charge based on drawings she had sent me. The dashed lines are supposed to look casual and have square ends. I don't know how such a font could be made much more beautiful but in the right context I think it looks fine. If Primer Apples was the only headline font in the above example and the theme was school, sewing or scrapbooking it would look alright.</p>
      <p><a href="http://www.myfonts.com/fonts/larabie/prime-minister-of-canada/" rel="nofollow">Prime Minister of Canada</a> isn't so bad. I looks a little "autotraced" but I think it looks inky and appropriate at about 12 points in print. In the context you've shown, it's been tracked wide and seems to have a fake bold applied to it. In proper use, it comes off as 1960s style casual pen &amp; ink lettering.</p>
      <p><a href="http://www.myfonts.com/fonts/larabie/sexsmith/" rel="nofollow">Sexsmith</a> is just cute. The early version was pretty weak but I've seen it used in beautiful ways over the years. In a context where cuteness is required, Sexsmith does its job well. Unfortunately, many freeware font sites still carry the old version.</p>
      <p><a href="http://www.myfonts.com/fonts/larabie/vahika/" rel="nofollow">Vahika</a> was created as a by-product of a FontLab tutorial and yeah, it pretty much blows goats. You'd never guess that someone would use it for paragraph text but there it is.</p>
      <p>Many creators of web font technology have contacted me over the years. <a href="http://www.truefontfamily.com/" rel="nofollow">True Font Family</a> is the best one I've seen. It works right now with current browser technology and anyone capable of basic HTML/CSS coding can handle it. It works right now with no plugins. I don't know if it would be suitable for text but it seems to work well in headlines. There's an iGoogle app available as well.</p>
