    html: |-
      <p>I'll preface this by saying that I would hardly consider myself a type designer and much less a lawyer;<br>
      But I was under the impression, at least in the U.S, that a typeface is not something that can be held under copyright - that is the letter form itself. That what is copyrightable is the "software package" of it's distribution - which could also include metrics and kerning.<br>
      Now if a web page is just displaying the letters of a typeface on it's page - without metrics or a packaged means of distribution, then how can this be considered infringement?</p>
    html_clean: |-
