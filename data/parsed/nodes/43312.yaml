    html: |-
      <p><cite>Typographica: John Gruber, via email, succinctly describes the dilemma:<br>
      The fonts you’re allowed to embed legally aren't worth using; the fonts that are worth using aren't embeddable.<br>
      </cite></p>
      <p>So what can we do about it? Provide the fonts worth using!</p>
      <p>Yes, there will be ugly MySpace sites which will be unreadable. Yes, there will be websites using commercial fonts without paying. But still: it's a big opportunity for everyone.<br>
      If anyone thinks the same I would be very interested in sharing ideas. How would web fonts be licensed? Per user? Per domain? Per domain per year? On demand (per download from the foundry's server)? At which prices? How can commercial fonts be protected (which means: how can we make it a litter harder to get them)?</p>
