      <p>Shifting the code points via CSS as I was hoping would be possible would allow the text to stay clear for assistance devices and other automated things to still work (as well as copy and paste), but keeping a scrambled font file.  With FontForge at least, if there aren't many (or any) code point overlaps, reconstructing a font, at least less kerning information and OT features, is relatively easy.</p>
