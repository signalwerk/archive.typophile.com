      <p>Worse that poorly spaced Arial? Worse than (the execrable) Comic Sans? </p>
      <p>And the type community is against typographic diversity on the web?</p>
      <p>C'mon!</p>
      <p>I clearly remember Roger Black declaring, at Type '90, that by the year 2000 everybody would have their favourite font. What I don't think any of us realised then was that it would one or other of the tiny Microsoft core set: Verdana or Tahoma. But, back then, few of us saw the web coming...</p>
      <p>Thank goodness we seem to be living through another typographical renaissance (perhaps we should call this 'the Latin type renaissance' - referring to the powerhouse of Southern European and Latin American type designers who seem to be driving it, rather than the Latin alphabet). But I wonder how the fantastic and prolific creations of all these independent type designers and type houses has a chance given the monolithic effect of a type-constrained web. </p>
      <p>Have none of you had a client who wants to use Verdana in print, because that's what is used on their website? If I had a glyph for each time that has happened... I'd probably now be in unicode. </p>
      <p>But what about legibility? Seeing as reading glasses recently caught up with me, with a vengeance, I have to say I can't read anything on the web now anyway, without pushing 'Make Text Bigger' several times, at least (the days of 7pt addresses on my business cards consigned to a now cringe-worthy past). In any case, Arial renders so badly - and looks so dreadful - at almost every size - and so many people use it - that the idea of Apple unleashing a deluge of unreadability is ridiculuous. These days I like my type big, and wonder why more webdesigners aren't using headlines and decent sized standfirst. And at 24pt or above, at 72dpi, I can cope with the vagaries of anti-aliasing. What I can't cope with is typographic blandness. (And if type on screen is so bad, how come I lust to own at least half of the faces shown on this site's 'best of...' lists?)</p>
