      <p>@ aluminum, sil:<br>
      If the "software product" is uploaded and used by the client's machine to render a web page, then who exactly is breaking copyright? I guess to put in other terms, if I upload a copy of Photoshop to your machine and you start using it who is responsible?<br>
      There are two acts of infringement I can see - the unauthorized use of a copyright work and the distribution of that work.</p>
      <p>It would seem silly to go after the users, for one it's bad for business. But also it would be trivial to circumvent. Ie. if I design a web page with 'officina', I could just make a script that removes the metrics and repackage it as 'myCrappyOfficinaRipoff.ttf' and upload that to the clients browser.(I'm sure most of the free font pages are full of junk like this.) Regardless, I would think at that point that the user is no longer in violation.</p>
      <p>Which would take us to distribution, which in this case is the graphic designer (or non-designer if you're going after someone's Myspace page). Obviously we would want good, ethical designers paying for the fonts they use; but the whole problem is these designers are not paying (or maybe type designers placing an unrealistic value on the wrong clients - I guess that's another topic). So if you are looking to get money out of these people that you believe have unfairly benefited from your work and they refuse to pay you'd have to have some kind of regulatory means of acquisition. You could setup an association of "licensed designers" and take fees from them, but the idea of licensing designers sounds pretty gross.</p>
      <p>So if you can't get money from the designers you could go after the application publishers that enable the use of your work - Adobe, Apple, Microsoft. They could put a "font tax" on their products, but then if a designer is not going to pay for a font there's a good chance they'll use a pirated copy of InDesign. And who would receive this tax collected? Official type foundries? What about the individual designer? Then you have to determine value of one font versus the next, what a mess.<br>
      You could put a tax on the hardware makers, even the most unscrupulous designer is probably buying their computer legally unless they are knocking off old ladies. Isn't this what the music industry did? But still you'd have to distribute that money which would seem the difficult part.</p>
      <p>What was the point of this post? I forgot - Sorry for some rambling I'm just thinking out loud. I certainly don't mean to insult the work of type designers, it's quite the specialty - I guess the hard part id figuring out where to collect.</p>
    html_clean: |-
