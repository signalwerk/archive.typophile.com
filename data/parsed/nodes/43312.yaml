    html: |-
      <p><em>Randy: PHP can create images dynamically containing whatever text you’d like, in the typeface of your choice. Images have drawbacks though.</em></p>
      <p>I hear you, but that isn't what I meant. What I'm suggesting is that it might be possible to have a php file as a gate keeper for the typeface file, allowing it to be rendered only on a website hosted on the same server. In that way, you'd prevent someone from direct linking your font and redistributing it (or at least you'd make it harder). The idea comes from SIFR which has similar issues. But it's possible to write a lock in the SWF that requires a key to be passed from the site requesting the flash. Uncrackable, no. But it can prevent casual direct linking of SIFR flash movies. </p>
      <p>In this case instead of linking to font.ttf in the css you'd link to font.php (similar to php image rotation scripts). The php would in turn write the ttf, but only if a particular variable was set. Such as via a cookie earlier. I am no php expert, so cookies are probably not the desired or elegant way to do it. But it seems like something like this could work.</p>
      <p>R</p>
