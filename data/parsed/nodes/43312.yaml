      <p>Coles: <em>James, I respect you, but you’re taking Si’s comments far too seriously. I’m sure if you contacted him directly after you felt offended that he would have been happy to put his comments into context and probably even apologize for any insensitivity. But instead you’ve accused him in the public square for something that most would argue was your own misinterpretation.</em></p>
      <p>So what (the last bit)? Your logic is self-defeating and changes nothing. Sii made his comments regarding Ray in the public square. You are now trying to debunk my reaction in the public square. Some typophilers have had a go at Richard Kegler in the public square. You all had a go at Miss Giggles in the public square. Are you asking for special treatment for Sii? Why should he be treated any differently? He had a go at me by singling out my font EULA on the other thread on web font embedding. Yes he did. Let's reexamine the last bit again: </p>
      <p><em>But instead you’ve accused him in the public square for something that most would argue was your own misinterpretation.</em> That's just your opinion and you have no proof "most people" would argue I misinterpreted. Plus you're generalizing, "most people"? Gimme a break. You'll have to do better than that.</p>
      <p><em>I am sorry to hear Jim Rimmer avoids Typophile because he felt offended. I think that may be indicative of an unfamiliarity with online communication that is often suffered by older users.</em></p>
      <p>You're generalizing again. Want proof? I feel the same way Jim Rimmer does, and I'm not an older user. I've seen many former members much younger than me leave tyophile in past years.</p>
      <p><em>Not only is talk on the web (unfortunately) less genteel, but the poster’s age, experience, tone, and demeanor aren’t immediately apparent like they are in the real world. This makes giving people the benefit of the doubt all the more important. Ask for clarification before accusation. Assume the best in people and you’ll get it.</em></p>
      <p>Assumption of bad faith is a mistake everybody makes in online discussions. I do it, you do it, Darrel does it, John Hudson does it, Hrant, Nick Shinn, Sharon Van Lieu, James Puckett. It happens constantly, here and on every otehr message board on the web. Assumption of bad faith causes a lot of arguments (note I didn't say "most"). In the case of Sii's comments, I assumed bad faith because the snarkiness of what he said <strong>was as obvious as all get out</strong>. If you cannot admit that---CABAL!</p>
      <p><em>Assume the best in people and you’ll get it.</em></p>
      <p>Man, that is so naive. Assume the best in some people and they take advantage of your good faith by stabbing you in the back. It happened to me recently and I've seen it happen to many other people at typophile.</p>
      <p>j a m e s</p>
