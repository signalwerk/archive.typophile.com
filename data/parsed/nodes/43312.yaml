      <p>James, I don't agree that Typophile is run by a cabal. As any other on-line community, Typophile benefits from the "crowd effect". This means, Typophile is not controlled by just a few people as you seem to think, but by the masses, all of us members. We're all free to express our views, and the moderators are here to help in case someone gets way out of line. But even them, the moderators, are not immune to criticism, and we, the non-moderators, have call them to the stand on other occasions. We all have good days and bad days, and sometimes we wished we hadn't said something, or wished we could have said it in a different way. I'm sure that regular contributors gain from the experiences on past threads that didn't go the way they expected, and have that in mind before posting the next reply. At least I do. You also have to keep in mind that this medium can't communicate all the original emotions that went into the reply (which is actually good, in some cases!). So, it's possible that you interpreted Simon's post in a way that he didn't intend to.</p>
      <p>Anyways, all in all I think that a lot of the friction around here is caused by the fact that we're not interacting face-to-face, and because very few know each other personally. If everyone attended to type conferences and spent some time socializing, some discussions around here would probably have a less harsher tone.</p>
