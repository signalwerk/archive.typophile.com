      <p>Wow, I leave for a while and look what happens.* Anyway, back to Safari.</p>
      <p>I like aluminum's theory, but I suspect that it's not as contained as that. I think it's just the next step. Rich content on the web has always been a goal, with mixed results, and being able to use a broad palette of fonts on 'live' web content just makes sense (in terms of technological development). Preventing use of 'bad' fonts has never stopped people from designing dreck on the web, so allowing them will not change anything. Those whose medium is crap will still be crap, regardless of how many varieties they have on hand.</p>
      <p>The music industry has finally turned the barge around and is now embracing digital content (see <a href="http://www.joystiq.com/2008/03/20/rock-band-surpasses-6-million-song-downloads/" rel="nofollow">Rock Band's 6 million song downloads</a>) but only after being essentially overrun by consumers who decided that they would get their content the way they want to, whether the industry came along or not. The type industry is going to have to experience this as well. The structure and relationship of type vendors/makers and the consumer is a model based on old technologies that empowered the supplier over the user. The web runs counter to that, particularly when it comes to digital content. Period.</p>
      <p>I think Si is right: those who go for the free/super-cheap fonts model will become, in a way, font gods on the web. Look at Chank! It's not a comment on quality, just a fact. People want it fast and cheap (free) on the web, end of story. Type makers are in the unfortunate position of being practically unknown, which makes the piracy worse, as most people assume A) it's very easy, or B) fonts are made by huge monolithic corporations only. It eases their minds as they steal from type designers. But if they'll do it with music, they'll do it with type.</p>
      <p>I am <em>not</em> saying that I want to see type designers and vendors get bludgeoned by technology, nor do I think this whole thing will sort itself out in a clean, desirable, or profitable manner. But it will sort itself out no matter what, and we will all have to deal with it. I was lucky enough to skip the early days of digital type, which I heard were a mess as well. I gather than type distribution has been a mess since day one. Then add the web to that. People are empowered by the web, for better or worse, and Apple's just doing what any smart tech company should do: keeping up with change, or at least preparing for it.</p>
      <p>Perhaps the real solution is updating the sales model. Maybe use free web-friendly fonts to draw the users? Or distribute fonts to key websites in exchange for some ad space/attribution? In reality, most users will not use fonts that are illegible, and most web designers will stick to what works. This problem is the start of big changes, but I'm not sure that Safari is going to trigger any real problems. Not that many people use it outside of the iPhone (though I do).</p>
      <p>It would be nice if there were an easy way to display a chosen typeface without the user needing it. I bet one day computers will be able to do calculations on the fly to allow something akin to that. But maybe we'll have designed the perfect typeface and we'll all just be using that...</p>
      <p>; )</p>
      <p>Boy, I sure can blather on about this.</p>
      <p>*A joke. I have no influence on Typophile.</p>
