      <p>The title font looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=MS-Windows-Fonts&amp;ffam=Constantia%20-%20Bold&amp;fid=52aa0a3cdfe35d06f7b5ee97ab0cb6f3&amp;fsize=36&amp;text=BEATRIX%20%2F%20WILLEM%20-%20ALEXANDER&amp;wrap=2" rel="nofollow">Constantia (Bold)</a></strong> by John Hudson (Ascender Corp, 2005) delivered with Microsoft Windows but I will be really surprised if they used a standard Windows font in this document.</p>
      <p>The text-body looks close to <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Google-Web-Fonts&amp;ffam=Fondamento%20-%20Regular&amp;fid=bc5bd19e57c28417fe4e8a88c345073c&amp;fsize=60&amp;text=Prins%20van%20Oranje%2C%20overeenkomstig&amp;wrap=2" rel="nofollow">Fondamento</a></strong> by Brian J. Bonislawsky (part of  Google-Web-Fonts, 2011) but it's probably still not a perfect match</p>
