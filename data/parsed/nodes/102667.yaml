    <p>I was wondering if the act of abdication that was signed in the Netherlands yesterday is handwritten or typeset in a font. Here are some pictures I found:</p>
    <ul>
    <li><a href="http://www.google.com/hostednews/getty/media/ALeqM5iDOK5lfyRa5mKmxWgw3EDdYMjlTQ?docId=167786391" title="http://www.google.com/hostednews/getty/media/ALeqM5iDOK5lfyRa5mKmxWgw3EDdYMjlTQ?docId=167786391">http://www.google.com/hostednews/getty/media/ALeqM5iDOK5lfyRa5mKmxWgw3ED...</a></li>
    <li><a href="http://image.gala.de/v1/cms/Gx/thronwechsel-urkunde_5864477-landscape-lightbox.jpg?v=7659203" title="http://image.gala.de/v1/cms/Gx/thronwechsel-urkunde_5864477-landscape-lightbox.jpg?v=7659203">http://image.gala.de/v1/cms/Gx/thronwechsel-urkunde_5864477-landscape-li...</a></li>
    <li><a href="http://www.nrc.nl/wp-content/uploads/2013/04/ANP-23178448.jpg" title="http://www.nrc.nl/wp-content/uploads/2013/04/ANP-23178448.jpg">http://www.nrc.nl/wp-content/uploads/2013/04/ANP-23178448.jpg</a></li>
    </ul>
    <p>This <a href="http://www.myfonts.com/fonts/thomasjockin/ductus/" rel="nofollow">font</a> seems pretty close, but it’s not quite it. I’d be grateful for some expert advice. Thanks in advance!</p>
