    html: <p>Kerning adjustments add or remove cumulative width, which will affect subsequent glyphs in the line, as you have discovered. Mark positioning should be done using anchor attachment positioning, not kerning. The mark glyph itself should be zero-width, and needs to be classified as a mark in the VOLT glyph data (this gets written to the font GDEF table), then in the VOLT GPOS editing window you need to select 'Anchor attachment' from the lookup type list, enter the base glyph names in the first glyph column and the mark names in the second column.  Note that you should name the anchor e.g. 'AboveMark', replacing the 'DEFAULT' anchor name. For Indian scripts, the mark positioning lookups need to be associated with the appropriate positioning features, in this case Above Base Mark Positioning ('abvm').</p>
