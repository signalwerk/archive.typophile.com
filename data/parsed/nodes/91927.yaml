    html: |-
      <p>Think of it this way:</p>
      <p>Pair positioning is expected to have an effect on the position of subsequent glyphs in a string. So, for example, if I use a pair positioning lookup to kern the 'o' to the 'T' in 'Tomato', I expect the 'mato' glyphs to move along with the 'o'.</p>
      <p>Anchor attachment positioning is expected *not* to have an effect on the positiong of subsequent glyphs in a string. This is why all secon dglyphs positioned in this way need to be classed as Marks, and need to be zero-width. They are positioned independent of subsequent glyphs.</p>
