  html: |-
    <p>Estimados:</p>
    <p>¿Alguien sabe si en FL5 podemos sustituir dos glifos (o clases) por tres?</p>
    <p>Necesitaría algo como:</p>
    <p>sub a b by c d e;</p>
    <p>o</p>
    <p>sub @clase1 a by  @clase2 c d;</p>
    <p>Pero estas líneas no funcionan.</p>
    <p>¿conocen alguna manera?</p>
    <p>gracias</p>
    <p>ViC</p>
