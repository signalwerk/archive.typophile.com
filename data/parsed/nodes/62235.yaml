    <p>Hi Guys, Im looking for some advice for this logo,  a freind who's got a great writing style is doing a custom signature style logo for me (my father actually) and Im looking for advice on how best to combine the supporting text with it.</p>
    <p>Due to the odd outline shape of the signature Im finding it hard to sit it next anything comfortably.  Do any of you have any good examples or advice on how best to combine heavily scripted hand rendered styles with supporting sans serifed text like this?</p>
    <p>Thanks for your help.<br>
    George</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_06B_5431.jpg"></div><p></p>
