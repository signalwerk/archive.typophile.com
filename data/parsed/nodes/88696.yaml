      <p>I like the idea, but it needs some refinement to avoid the "rendering error" reaction.  May need to work a little on the balance. For example, the 'u' and 'p' look good but the 'L' is lacking weight at the top to balance out the double serif at the bottom.  Also more definition of some of the serif transitions. The 'c' right now looks like it just gets thicker and the 't' and 'r' blend a bit giving a muddled look.</p>
      <p>Great idea though and you should run with it.  If you stuck, print it out and stick it in your bag for a few weeks.  Let your brain run in the background until an idea strikes.</p>
