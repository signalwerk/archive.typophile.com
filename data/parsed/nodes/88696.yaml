    html: |-
      <p>This is starting to look very promising! The 1 degree is also an improvement.</p>
      <p>I think the serifs on the 's' are too big though. I see you essentially rotated the serif of a stem, which might be the best solution to avoid giving the 's' the appearance of a more or less normal serif letter, but I don't like the inconsistency in regard to other letters; I think it will look more consistent if the serif has the same length and angle. The same counts for the 'a'. I think the 'r' is the only exception I'm comfortable with in your typeface as its arch resembles the downstroke of the 'm'.</p>
      <p>Also, I see you're applying the serifs to most of the letters which would normally feature serifs, though I personally think the serifs are so prominent that it contrasts too much with the serif-less letters. 'e' usually has no serif but I think you did good by adding one. I think I would also add such a serif to the 'g' and definitely to the 'c' (what's your reason for excluding the serif on a letter which usually feature serifs?).</p>
      <p>The 'o' is a tough one. It's just too smooth and clean compared to the other letters (as is are 'c' and 'g' but as I mentioned those are easily fixed). I think I would actually make the stroke go inwards a bit at the top instead of a closed circle. A bit more calligraphic. On the other hand, that will make it deviate too much from 'd' and perhaps even other letters with a rounded top. Maybe add a little serif kind of thing which kind of resembles the ear in a spectacle 'g'? Just to have a bit of a weight build-up there.</p>
    html_clean: |-
