      <p>I would still like to see what hrant explained because it seems a very worthy exploration for this typeface.</p>
      <p>However I think the second design (your misinterpretation of hrant's comment) is quite an improvement on the former design, though those curves might not be necessary if you follow hrant's idea.</p>
      <p>I also like the last version with the curves. In that regard I disagree with hrant that this typeface needs hard straight lines but I think right now you really need to establish which direction you want to take this typeface in. Also, this might be a rubbish idea but perhaps it's nice to vary a bit in serif style between Regular and Italic (if you plan to make an italic); for example rely on those hard straight lines in Regular as hrant suggests, and introduce those curves from the last picture you posted in the Italic.</p>
