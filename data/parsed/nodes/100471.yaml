      <blockquote><p>Neil, that is a great figure (for lack of a better description), I particularly like the head, which feels like it is in motion. Do you have your site/identity ready to go yet?</p></blockquote>
      <p>Karl, thanks so much for your comment! </p>
      <p>It only took about twenty years for me to find that figure ...lol. I always admired guys like Dondi, Haring, Basquiat, et al, who could create a coolio stick figure almost as a second nature of expression. So natch I wanted to create my own. It's more of a squiggle man than a stick man but hey I'll take it :)!!</p>
      <p>And what I really dig most about the figure is it's my name/signature. </p>
      <p>The feet form an /N/ and up from there is the rest of my first name. The head is a /C/ and the rest of my last name down from there. So the mark doubles as a gestural figure and as my signature.  I've snuck it into a couple of important graphics as a main feature ...hehe. It's gestural qualities and figural relationship compliment a manufactured element(s).</p>
      <p>And thanks also for asking about my identity ready to go  yet ... I'll have it ready sometime during the Spring ...long time coming.  </p>
      <p>Form Function, you still here??? </p>
      <p>Have you found a satisfactory thump of plump??? </p>
      <p>n.</p>
