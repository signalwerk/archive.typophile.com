    html: |-
      <p>@Form Function: Welcome to Typophile. Can you tell us a bit more about your context? It may provide people with greater insight, and allow them provide you with more informed recommendations (and prevent random shots across the bow). It may even be possible that the solution lies in the treatment of the type, and not it’s selection.</p>
      <p>An example an old professor used to illustrate this point was a client asking a designer to build a door. They spent days talking about blue doors, green doors, screen doors, french doors, sliding doors, rotating doors &amp;c. After several failed attempts, the designer asked the client “Why do you want a door?” The client replied “So I can provide my guests with privacy.” The designer replied “Oh, well if what you want is <em>privacy</em>, there are many things other than a door we can do for that. A bent hallway or flight of stairs to obfuscate view, sound dampening walls, a guest house &amp;c. By identifying privacy, a whole new set of solutions presented themselves. If memory serves, this was from a lecture on the role of rhetoric and semiotics in the design process.</p>
      <p>My father used to use a medical analogy: “Don’t tell me what kind of treatment you want, just tell me where it hurts.”</p>
      <p>It has also been my experience that members tend to get more feedback if they use their real names as their screen names. It used to be somewhat of a convention.</p>
      <p>And remember: May the fonts be with you™.</p>
