    <p>Hi, everyone.</p>
    <p>I'm looking for a really fat font. The fattest. It can be almost unreadable. Preferably slightly organic. Like every letter was bitten by a snake on saturday, and no medical help is readily available. Or was comically decompressed in outer space. Or is just about to eat a last mint.</p>
    <p>Finding it hard to locate anything like it and would very much appreciate help on this one.</p>
    <p>Thanks for helping!</p>
