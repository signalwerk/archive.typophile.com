      <blockquote><p>Hi. No I've not found a good font, but no matter, the project went in another direction. Your "Eat Fat" font is the closest thing I've seen till now though, so thanks for that.</p></blockquote>
      <p>Hi. No probs glad to give it a fat chance. </p>
      <p>The letter shapes were done by stroking a skinny old normal sans serif font (one with slightly rounded corners) in Illustrator. I tried applying the same technique to a slab serif and the result was just as much a splat of fat except it had square corners. To apply a stroke and maintain the letter shape characteristics just use the drop down menu in the Appearance palette. Select Add Stroke (I think that's what it known as) and make sure to arrange the Stroke layer below the Type layer in the layer stack of the Appearance palette.</p>
      <p>To bad your project went in another direction.</p>
      <p>n.</p>
