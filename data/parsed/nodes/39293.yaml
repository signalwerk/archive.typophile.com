    <p>Thanks for all the responses to my earlier post.</p>
    <p>I do want to persevere with the choice of font - it was originally specc’ed for the mag when it had the title of ’groundswell’ and worked really well. The client loved it, however we were forced to change the title as there is already a mag out there with the name (Christian Surfers title).</p>
    <p>Anyhow the font is poorly rendered, so I have redrawn it and made some changes in response to peoples posts.</p>
    <p>Thanks again</p>
    <p>Look forward to any thoughts?</p>
