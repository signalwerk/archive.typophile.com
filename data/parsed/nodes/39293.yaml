      <p>You might want to post a slightly smaller image, but with a uniform white margin running around it. Would make it easier to view.</p>
      <p>The way you’ve done the ’A’ bothers a bit. Somehow it seems horizontally flipped. I think the curving of the apex should be on the left-hand side. You’re probably trying to mirror the lines of the ’R’ on SURF, but it doesn’t work too well. </p>
      <p>Also the weight of the first ’A’ does not match with that of the other characters in the word AUSTRALIA. Have you created it by scaling up the smaller ’A’? </p>
      <p>Likewise, the R also may look better if redrawn. Being a curved form, it typically should go a little over the cap-height so that it visually aligns with the more angular characters.</p>
