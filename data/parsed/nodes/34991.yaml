    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 9.Jul.2007 10.33am </div>
      <p>Greeting Friends!</p>
    <p>It is our distinct pleasure to announce the return of the first Filmotype typefaces to return to the graphic designers palette since their heyday in the 1950s as photo lettered alphabets.</p>
    <p>The first two releases are Filmotype Glenlake and Filmotype MacBeth</p>
    <p>Filmotype Glenlake - Initially designed and released in 1955, this Gothic Sans Serif having disappeared from graphic design history reappeared in 1994's Ed Wood in it's starring role as the opening credits of Woods famous film "Glen or Glenda" ironically.</p>
    <p>It is joined by Filmotype MacBeth - This Free Style typeface owes its origins to Lettering Inc where its original author penned a similar style prior to creating a unique version of the typeface for Filmotype in the early 1950s.</p>
    <p>Both typefaces were remastered and expanded with exacting precision and include a full international character compliment, automatic fractionals, ordinals, and a complete suite of alternate characters in dynamic OpenType format.</p>
    <p>We hope you enjoy these timeless gems of typographic design and will find them as exciting as we have.</p>
    <p>You can purchase, preview and discover more about these faces online exclusivly at Font Bros!</p>
    <p>See 'em here: <a href="http://www.fontbros.com/filmotype.php" title="http://www.fontbros.com/filmotype.php">http://www.fontbros.com/filmotype.php</a></p>
    <p>Warmly,<br>
    Stuart</p>
