    html: |-
      <p>Dave, your solution posted initially is very good. The high end of this would be an all-black hand.</p>
      <p>And I like the idea of mapping the womanicule (new term?!) to Italic …</p>
      <p>As for Unicode, there are actually three pairs (left/right) of pointers encoded:<br>
      261A – 261B<br>
      261C – 261E<br>
      1F448 – 1F449<br>
      DON’T ask me why.<br>
      It is a mess, of course. That’s Unicode …</p>
