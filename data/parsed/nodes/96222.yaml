    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FigMan_5678.png"></div>This is what I did in Figgins Sans.<br>
      However, in types where I’ve included manicules, I’ve usually done two—Regular and Bold— which are not style linked, because they have different Unicodes, 261E WHITE RIGHT POINTING INDEX, and 261B BLACK RIGHT POINTING INDEX.<br>
      e.g. Fontesque:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/FonMan_6502.png"></div><br>
      Scotch Modern:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/ScoMan_5203.png"></div><br>
      Other aspects of the manicule may be considered, such as the typographic quality of its counters vis-a-vis those of the letters in the font, and whether it’s left or right handed—i.e. with or without ﬁngers 2, 3 and 4. Perhaps we could have a different Unicode for left and right handed manicules?!<p></p>
