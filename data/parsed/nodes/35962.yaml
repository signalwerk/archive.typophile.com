    <p>I am kinda having a hard time trying to post this so I hope this works. This post is for anyone who loves hand lettering as much as I do. These are some recent and not so recent projects that I have done. The "Glad I did logo" was for a lady who is writing a book about caring for an elderly lady with special needs. The script is in my own style. Eliza Schulte thought the D looked like an O. I can see where it does. Moes wanted his logo to have a vintage feel to it. I think I nailed it while still being somewhat contemporary. I plan on making the word "Truck Repair" into a font someday. I plan on calling it Moes Thick and Thin. The Prince logo got rejected. They thought it looked like a book cover. I have to agree with them on that one, but it was a lot of fun to design. :)</p>
    <p>Thanks for looking!</p>
    <p>-Charles Borges de Oliveira</p><div class="imageWrap"><img src="http://typophile.com/files/cbdo recent lettering_6608.jpg"></div><p></p>
