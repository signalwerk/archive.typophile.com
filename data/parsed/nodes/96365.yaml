  html: <p>Tired of using nothing but the "symbol" font to do designs for frats and sororities.  Anyone know of a nice "fashionable" looking font with greek symbols?  Something close to <a href="https://www.fontfont.com/fonts/clan/ultra" rel="nofollow">Clan Ultra</a>? Also, perhaps a distressed version?</p>
