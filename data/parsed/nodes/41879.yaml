      <p>Simoncini Garamod is still an essentially “round” face. As a general rule, the rounder the letterforms, the fewer characters per pica you get. You get the character count up by going to smaller setting size, and you retain legibility by having a larger x-height.</p>
      <p>One font that really packs in the characters is Stone Print. It is pretty traditional though, and may not be appropriate for a business/scientific magazine. But so too is Simoncini Garamond. I assume this is an double-column 8-1/2 x 11 *magazine* &amp; not a single column 6 x 9 *journal*. Another thing about Stone Print is that is won’t read well when the measure gets over about 24-25 picas.</p>
      <p>Quadraat too packs in the characters, due more to it’s large x-heigth.</p>
      <p>A slightly condensed font can help a bit — Richard Eckersley, who was fond of narrow books, use to use Minion from the multiple masters, with about a 95% value for character width. Gave him a couple more characters per 25-pica line.</p>
      <p>BTW, it is the characters per line rather than the lines per page that really makes a difference with straight text. The resaon is that stories and/or chapters usually begin a fresh page, so the only time you save pages are those few times when, by the luck of the draw, a few lines force another the last page.</p>
      <p>All this changes when you have to fit in images or tables, but not as much as you might think.</p>
      <p>I’d go with a slightly condensed font that has a large x-height, so you can set it reasonably small. In passing, while you probably wouldn’t want to use it, Optima can be set very small &amp; still be legible. I didn’t believe it until I saw an encyclopedia Rich Hendel designed that had to really pack in the copy.</p>
      <p>Oh, another font that might work is Arnhem; much more modern looking &amp; business like than any Garamond. We set <cite>The Encyclopedia of North Carolina</cite> using Arnhem — another Hendel design. While a roundish font, you can set it small &amp; retain readability.</p>
      <p>FWIW</p>
