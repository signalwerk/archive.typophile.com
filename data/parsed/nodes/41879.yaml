    <p>I am currently re-designing a scientific/business magazine which has a very high word count. 1000 words + heads and images per A4 (UK) page.</p>
    <p>In an attempt to give myself maximum designing space, I have been seeking a body copy serif font that will give a high word count whilst achieving good clarity and readability. To get the project off the ground have found that a version of Simoncini Garamond at 9/9.5 is OK, however have a budget to buy something offering an even better word count.</p>
    <p>Just wanted some advice on what other people are using or have experienced in similar situations.<br>
    Have got it in my head that something like HTF Mercury might be the answer?</p>
    <p>Thanks</p>
