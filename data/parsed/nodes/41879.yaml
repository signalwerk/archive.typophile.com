      <p>Reduce your need for margins and blank space, use boxes: make a thin stroke frame outlining narrow margins and use all of the inner space dividing elements with rulers: leave a pica or so as white space margin. If you manage it well, it won’t feel crowded and you get to use more space for contents.</p>
      <p>Also use page elements in a scale that won’t make your text feel small, use not very wide columns and hypentate.</p>
      <p>An example:<br>
      <a href="http://www.venaqueretaro.com/asomarte/" title="http://www.venaqueretaro.com/asomarte/">http://www.venaqueretaro.com/asomarte/</a></p>
      <p>Héctor</p>
