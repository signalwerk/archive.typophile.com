      <p>Firstly thanks to everyone who has taken the time to respond.<br>
      I have spent some time today testing out your suggestions and a few others of my own...</p>
      <p>I am creating a template for a ’non-creative’ production team to work with and need the solution to be extremely rigid and user friendly - I was concerned that using a semi condensed font for page after page would need extra care and attention in use, something its not always going to get - but was getting resigned to looking in that direction - We are taking about people who would think nothing of throwing in a bit of minus tracking/kerning to get something to fit...</p>
      <p>For those interested, bearing in mind in some instances I am calculating the text length on the info gleaned from the various websites and taking into account the fonts that I prefered - the following shaped up well.</p>
      <p>Quadraat gained about a line or two on the Garamond.<br>
      Arnhem is a nice font and will be conducting some further tests.</p>
      <p>But the typotheque fonts Freda and especially Greta showed up really well. Greta looks like it will save up to approx 20-25% of text space (compared to the Garamond) + it looks really good as a body copy font. In fact I would recommend the pdf tester on the website as an extremely useful resource as I was able to set a paragraph of actual copy and alter the size and width.</p>
      <p>Once again thanks.<br>
      Tim</p>
