    <p>I’d like to guage the interest in some t-shirt designs, particularly those of my daughter, age 3, posted on <a class="freelinking-external" href="http://www.heavydutypress.com/shirts/closet">my web site</a>. I’m trying to decide whether or not I should go through the hassle of setting up a paypal account so I can sell them to the general web public. I figure Typophiles would be the best market for these t-shirts.</p>
    <p>If nothing else, you might be amused by Katrina’s designs. These came unsolicited at the kitchen table. She drew them, and at first glance I was confused...when she told me what they were, I, her alphabet-loving dad, couldn’t help but to smile with pride and glee.</p>
    <p><a class="freelinking-external" href="http://www.heavydutypress.com/shirts/closet">Heavy Duty Fashion</a></p>
