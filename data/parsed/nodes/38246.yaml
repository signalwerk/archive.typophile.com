      <p>&gt; I also like the tired mom t-shirt </p>
      <p>That drawing and the type on it were done by my friends’ 9-year-old kid. He’s autistic. I, too, thought it was great, as did the guy who printed 24 of them for me, but so far I’ve sold about 4 at the <a class="freelinking-external" href="http://www.viroquamainststation.com/">local public market</a>. I think the problem is that the population of our town is 4,335. Once 4 people are seen with the shirt, nobody else wants it, regardless of how great it is!</p>
      <p>&gt; I’d buy one if the t-shirt itself was a good cut and good cotton.</p>
      <p>Agreed. And here lies the problem with t-shirts. An average joe like me really cannot afford to print up an inventory of shirts to meet the demands of what has become a very particular market. So, sorry, there will be no excellent women’s cuts until I sell at least twelve of the remaining Tired Mom “standard-cut” t-shirts. I do have some mediums and smalls in stock, 100% cotton...they look good on my wife. $15 and I’ll cover the shipping. That goes for everyone and <a class="freelinking-external" href="http://www.heavydutypress.com/shirts/closet">every shirt I’ve got</a>. <a class="freelinking-external" href="http://www.heavydutypress.com/">Contact me</a> if you’re interested. Thanks.</p>
