      <p>Just because it isn't in Unicode doesn't mean it can't be in a font. Small caps aren't encoded in Unicode, either. If using an appropriate application that supports such things, you could use an OpenType font that has superiors or ordinals (and adjust their vertical position if needed).</p>
      <p>Cheers,</p>
      <p>T</p>
