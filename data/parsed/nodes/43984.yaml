      <p>The Mc prefix comes from 'Mac' in Gaelic from Ireland (and later Scotland), Mac literally meaning 'son'. It is normally taken to mean 'son of' – Mac Arthur, for example, meaning Son of Arthur.</p>
      <p>Being Irish, I have never seen Mc with an apostrophe between the two letters. I would say that the most correct way of writing it, taking its history into account, is simply 'Mc', without any dots, lines or otherwise.</p>
      <p>Ross</p>
