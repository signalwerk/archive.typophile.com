      <p> You might try abusing U+1D9C (Modifier Letter Small C) as in MᶜGuffin. If you're willing to restrict your choice of font somewhat, the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Medieval_Unicode_Font_Initiative" rel="nofollow">MUFI</a> semi-standard probably encodes characters like that somewhere in the Unicode PUA.<br>
      —Joel</p>
