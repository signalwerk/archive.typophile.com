    <p>There are many variations of how the c in last names starting with "Mc" (like my own, McArthur) have been used in handwriting and in type. I have seen a raised c such that the top of the c lines up with the capital letters on either side of it, a raised c with a horizontal line under it, a raised c with two dots under it, a raised c with two horizontal lines under it (the way I was taught when I was little), and a raised c with a horizontal line under it and two dots under the line. The lines and dots seem to be most common in handwriting, but I have seen the c raised frequently in type, and have also seen it in type with underlines sometimes. Nowadays it is obviously common to use a normal lowercase c, with or without an apostrophe between the M and the c.</p>
    <p>Does anybody know of any Unicode characters that would match any of the raised variants? Does anybody have some insight into which variant(s) may be most correct?</p>
