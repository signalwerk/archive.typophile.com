      <p>I also learned to print my name with a raised c. Can't remember if there was a line under it or not, but I think not. It was done that way on the family business signage, and occasionally I have seen it with a little triangle instead. Never double underlines though.</p>
      <p>Since adopting the typewriter in 1970 as a cure for horrid handwriting and printing, and later the computer, I have given up on the raised c and let it slide back to the baseline. It does not bother me down there.</p>
