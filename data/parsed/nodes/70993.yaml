      <p>Suggestions: </p>
      <p>Drop the Personal Statement. Unless it's truly unique and highly specific, it's pretty much pointless. </p>
      <p>Expand upon both your Experience and Education. You have the room. Elaborate a bit more on details, highlights, etc.</p>
      <p>HTML and CSS are acronyms (should be all caps)</p>
      <p>JavaScript (note spelling). Also, drop 'very' or drop the whole line. </p>
      <p>Minor pet peeve...switch from the hotmail address to a gmail one.</p>
