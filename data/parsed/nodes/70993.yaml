    html: |-
      <p>I suggest dropping the Interests section. Also, I think the headings need a little more to set them off from the content; centered headings works, or you could place the headings to the left and the content to the right.</p>
      <p>Education typically refers only to degrees that you have earned; if you want to discuss specific classes, I think a Coursework section would be more appropriate. </p>
      <p>I would avoid sub-headings such as "Experience," "Duration," and "Responsibilities." Instead, simply state what you did: "Designed fliers for several Latino Film Festival events, as well as banners for the company's website, mediaartscenter.org." Always use "strong action words" in the past tense. Also, I'm fairly certain URLs technically should be italicized.</p>
      <p>Although I'd advise dropping the "Duration" sub-heading, how long you've done things should be included, in the form of start and end dates. Include the month and the year: "August 2005 to May 2007." This applies to any jobs, internships, education, etc.</p>
      <p>It's good that you dropped the Personal Statement section; however, a similar Objective section may be in order. Remember that you should never submit a generic résumé! Each one should be custom-tailored for the specific job you want. In which case, stating a description of said job is easy, eg "An entry-level document design position," "An entry-level web design and development position," or something along those lines. If you're just writing a generic résumé, then omit the Objective section.</p>
      <p>When you write your cover letter, be sure to refer to the résumé (eg "As stated on the enclosed résumé..."). As Kris10 points out, the "I hope to hear from you soon!" would be a good conclusion for your cover letter, but I'd advise staying away from words like "hope," "want," "if," etc, as these do not convey confidence. Its a good idea to give them your contact info to close the cover letter, and close confidently: "I can be contacted by phone at 619-757-7310 or by email at <a href="mailto:etahchen@hotmail.com">etahchen@hotmail.com</a>. I look forward to meeting you soon."</p>
      <p> Be sure to print both on résumé paper as well—the person reading this will be very busy, and likely has a bunch of other applicants to go through. Its likely that they will look at your résumé for 3 to 5 seconds, so you have to make an excellent impression!</p>
      <p>As with all of my posts, take it with a grain of salt, but those are my suggestions.... and sorry to be so lengthy; I'm just a bit of a stickler when it comes to résumés. Good luck!</p>
