      <p>Looking much better! If you could include dates for your time at Southwestern and SDSU, that would be good. Also, for the schools, you don't need the whole address. Just the city and state will be fine. For dates, the exact day isn't necessary; just put the month and year.</p>
      <p>Also, if you want to make it longer, you could include a Coursework section, describing specific courses you've taken that are relevant for the job you are applying for. Write it in the same way you write the work experience section.</p>
      <p>In the previous version, you had a lot of writing under each section. As Steven said, that is too much information—for a résumé. Don't trash those thoughts altogether, because they may well be appropriate for your cover letter.</p>
      <p>On a side note, please make sure that the entries under each heading are sequenced <em>from most recent to most long ago.</em> It's a bit of a pesky detail, but I'd advise paying attention to it.</p>
