    html: <p>Just a thought, I recently did a resume for my current job and I did something that included graphics that went over pretty well. If you are planning to hand this to creative-types, it could go over well. I would say to line break at "Festival events and ... etc" and use that half of your resume for an image that really showcases your work. Simple, clear, precise work. Maybe even an image similar to your website header, but black and white. Just some thoughts!</p>
