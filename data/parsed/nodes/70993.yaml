      <p>Eh, I think you're giving too much information.</p>
      <p>Under work experience, nobody cares that you only worked 2 months because school etc. Just put the months you worked. When was it? It should read:</p>
      <p>Work Experience</p>
      <p>Media Arts Center - Design Internship<br>
      May - August 2010 (insert the correct months here)<br>
      Designed fliers for various Latino Film Festival events, designed web banners for the website, <a href="http://www.mediaartscenter.org" title="http://www.mediaartscenter.org">http://www.mediaartscenter.org</a>.</p>
      <p>Education</p>
      <p>Southwestern College, (insert where/when it was)<br>
      Associates Degree in Graphic Design</p>
      <p>San Diego State University, (insert where/when it was)<br>
      Bachelors Degree in Applied Design</p>
      <p>I don't see any reason for the other information you have given. It might help to actually read some other resumes... Here's mine, for example: <a href="http://www.studioimbrue.com/resume.pdf" title="http://www.studioimbrue.com/resume.pdf">http://www.studioimbrue.com/resume.pdf</a></p>
