      <p>You don't need to say "Contact Information" and keep your website with your other contact info.</p>
      <p>The ital you are using looks smaller and somewhat condensed compared to the roman and thus of less importance. Perhaps switching your job and schools to be roman and the following info in the ital. Or try setting the italic a little larger.</p>
      <p>Overall it looks unbalanced with a narrow margin on the left and a very wide margin on the right. </p>
      <p>As Aluminum said HTML and CSS should be ALL CAPS not large and small caps.</p>
      <p>Delete the duration of your internship and "Hope to hear from you soon" the later can be the sign off of your cover letter but it's not appropriate on a resume.</p>
      <p>If you want to keep your name centered with the rest of the copy flush left there should be more space between the two. It's not a rule but often you will see resumes have the name and contact info centered and then the body of the resume is set flush left.</p>
      <p>There should be more info about your job and colleges; where they are and the year you worked/graduated. List the few design classes you too at SDSU rather than say "took several design classes, but mostly arts and crafts".</p>
      <p>Your interests don't tell us anything new. Either delete entirely or list your specific arts and crafts here.</p>
