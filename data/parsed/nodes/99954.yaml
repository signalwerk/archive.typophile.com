    html: |-
      <p>Just to be clear: I don't consider myself an expert; it's simply that when you actually go to the trouble of making a full font, red flags go up when you see that sort of thing. I'd be curious to find out what proportion of people who regularly ID fonts have ever made one (I mean that other people would want to actually purchase).</p>
      <p>But I actually think your stance is OK (it's all relative after all) and thank you for the offer of amending your post if something turns up. I myself am more cautious, but I'm not going to try to force people to be like me - that's crazy. Pressure, sometimes - force, never. And pressure only when I think it helps the community. At least that's my intention - sometimes I slip.</p>
      <blockquote><p>do you think all Graham Meade's GemFonts should be considered as "not to be recommended"?</p></blockquote>
      <p>I would try to avoid making such a blanket damning statement. But I guess if I had a choice between recommending between two similar fonts I would prefer the one that's not "guilty by association".</p>
      <p>Again: I'm not trying to control anybody - I'm simply trying to help this particular community. And if anybody ever feels guilty for some action here, I have to feel that I'm not wasting my time. You can't learn without making mistakes.</p>
      <p>Arial: Some people do avoid it as you describe. I'm not that strict. For one thing, Arial's outlines are original (the spacing was indeed copied however - but I don't mind that) and its texture is sufficiently different. But you're right if you mean that corporations aren't saints: just look at Chalkboard!  :-/</p>
      <p>hhp</p>
