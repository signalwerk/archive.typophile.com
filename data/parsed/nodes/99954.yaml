      <p>Well, if its of any interest to you at all, hrant, Walkway was  an incomplete font I did, completely from scratch using simple lines and circles in Fontographer.  Yes, it is crap.  It has nothing taken from anyone elses fonts at all. It shouldnt have been posted anywhere, as it was still being worked on, I sent it nto someone to have a look at, and they spread the thing around without me knowing</p>
