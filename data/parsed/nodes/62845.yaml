      <p>Dan Reynolds seems to <a class="freelinking external" href="http://typophile.com/node/39318">remember</a> an obsolete GX (read: pre-OS X QuickDraw) version of Helvetica with small caps. From that link you can get a sense of similar fonts – even a convincing imitation with small caps, but otherwise incompatible with Helvetica/Helvetica Neue. Nothing to my knowledge is currently available, let alone installable, like a true Helvetica SC.</p>
      <p>You may not be the first to do it, but hey, every revival has its share of ardent fans ;-)</p>
