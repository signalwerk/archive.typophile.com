  html: |-
    <p>Am I missing something obvious, or has no one actually released a true small caps rendering of Helvetica? Same goes for Arial.</p>
    <p>I've got a copy of TypeTool and I'm thinking about doing this as a fun project in my spare time. But no point in doing it if it's already been done.</p>
    <p>(FWIW, fake small caps are one of my biggest typographic pet peeves. What annoys me the most is that Microsoft includes real small caps in all of their new ClearType fonts, yet Office still uses fake small caps with these fonts.)</p>
    <p><a href="http://www.kpao.org/blog/2008/07/microsoft-office-generated-small-caps-evil.html" title="http://www.kpao.org/blog/2008/07/microsoft-office-generated-small-caps-evil.html">http://www.kpao.org/blog/2008/07/microsoft-office-generated-small-caps-e...</a><br>
    <a href="http://www.kpao.org/blog/2008/07/small-caps-versions-common-web-fonts.html" title="http://www.kpao.org/blog/2008/07/small-caps-versions-common-web-fonts.html">http://www.kpao.org/blog/2008/07/small-caps-versions-common-web-fonts.html</a></p>
