      <blockquote><p>Can anyone think of a reason why I shouldn't leave out six.lnum and eight.lnum altogether, and omit their substitutions from the feature?</p></blockquote>
      <p>If shapes happen to be identical, a single occurrence in the font is enough.</p>
      <p>A good question, in my opinion. It is <em>adding</em> redundant info to fonts that asks for a damn good reason, not <em>omitting</em> redundant info.</p>
