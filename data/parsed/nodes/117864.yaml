  html: <p>I have default oldstyle figures and lining figures in a font. Due to its particular constructed nature, the glyphs for 6 and 8 are each identical in both styles. Can anyone think of a reason why I shouldn't leave out six.lnum and eight.lnum altogether, and omit their substitutions from the feature?</p>
