    html: |-
      <p>With the caveat that I think Frode is right, no. You write the lnum and onum GSUB code. As long as everything is in the default number style, it should work. But why not own a copy of, say, InDesign and MS Word, so you can check such things out?</p>
      <p>Odd that an eight (in particular) is the same. Usually the old-style 8 has to be condensed a bit more than the full-size lining, to fit with the other os numbers.</p>
      <p>In the end though, what is saved? Which is at least one more reason Frode nailed it.</p>
