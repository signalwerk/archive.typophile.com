    html: |-
      <p><cite>are those quotation marks? And if so, is that [their] correct usage?</cite></p>
      <p>They are quotation marks. Their usage is a bit, we could say, “creative”, especially on the wheel. In this case, at that time quotation marks were used to shown the wordmark/shop name (Alla Lettera), as opposed to the name of the owner (Antonino) and the type of shop/goods (insegne).<br>
      Speaking of creative typography on the wheels, the address, which reads “Corso Reg. Margh.”, stands for “Corso Regina Margherita” (which one could roughly translate as “Queen Margaret Avenue”.</p>
      <p>One last bit of trivia: “alla lettera” could be translated both as “at the letter” (as in French, “chez”), and as “to the letter” (as in “literally”, “verbatim”).</p>
