    <p>I saw this image on the interwebz today thought I'd share...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ALLA_LETTERA_5613.jpg"></div><p></p>
    <p>...super awesome sign shop marketeer.</p>
    <p>By-the-way, are those quotation marks? And if so, is that they're correct usage? I noticed that the ones used on the building are not in the same location (at the top of the word(s)), as on the front wheel cover.</p>
    <p>And perhaps some entrepreneur somewhere might just seize the initiative and produce a modern version of those wheel covers. I imagine at the very least there might be a nice niche market for cyclist delivery services...</p>
