      <p>That's weird, Futura seems to have more in common proportionally with the Roman caps (Trajan?) than Gill. Perhaps that explains why the Futura caps always set so nicely when letterspaced generously. I always perceived Gill's capitals as being more closely related to incised capitals, I believe he had some experience cutting letters into stone.</p>
      <p>Just noticed this came out:<br>
      <a href="http://www.typography.com/catalog/verlag/index.html" title="http://www.typography.com/catalog/verlag/index.html">http://www.typography.com/catalog/verlag/index.html</a></p>
      <p>Says it has something to do with the type on the 'Goog. I believe it was Nobel that was cited as the type on the outside of the structure, so this would be an improvement over the available versions of Nobel, as it has 3/4 height numerals and alternate characters. But unfortunately it has no small caps, and is slightly ovoid. I know this is basically a post to myself, but thought others might be interested in Verlag -- has all the genuine looks of circa 1950, but with the nice typographic touches of 2006. Except for the small caps thing.</p>
