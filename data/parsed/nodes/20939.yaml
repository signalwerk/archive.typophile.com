    html: |-
      <p>Indeed.</p>
      <p>Paul Renner himself stated that Futura's capital was designed to be in proportion with its Roman counterpart. The thing that nobody notices is that Roman capitals <em>was</em> geometric in construction because it was built on Golden Proportion and such.</p>
      <p>So a humanist sans that is based on Roman capital proportions should also, in some sense, be geometric. It seems counterintuitive, but there you go.</p>
      <p>Speaking of which, Mr. Gill was a stonecutter; and the example that I used -- Trajan -- was a rendition of stone inscription.</p>
