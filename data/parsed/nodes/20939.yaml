      <p>I was speaking in context of Gill Sans' capital characters. Aren't they based roughly on classical proportion (unequal bowl on 'B' and such), which in itself was based on basic geometric forms? I find this fact to be the only similarity between Gill Sans and Futura -- hence my defense on its usage.</p>
