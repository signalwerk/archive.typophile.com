      <p>"how you handle really heavy weights"</p>
      <p>I have the same issue with a not-so-geometric sans I have been working on.  The heavy weights don't allow for narrow and wide proportions in the same font with a monoline weight.  You either have to increase contrast as weight increases or widen the narrower letters to avoid plugging counters. The caps are the toughest glyphs to make work for me.</p>
      <p>ChrisL</p>
