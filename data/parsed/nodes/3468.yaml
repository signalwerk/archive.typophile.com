    html: '<p>I believe that is Pump, designed by Phillip Kelly, part of the ITC library. ($39.95) <br> <br>The ITC site reads as follows: <br>Designed in the Letraset Type Studio in response to the renewed interest in the simple, geometric, sans serif Bauhaus style from earlier in this century. Pump has endured over twenty years and remains one of the best typefaces of this style in use today. For maximum effect, Pump should be set closely. <br> <br><a href="http://www.itcfonts.com/itc/fonts/detail.asp?sku=ITC2292" target="_top">http://www.itcfonts.com/itc/fonts/detail.asp?sku=ITC2292</a></p>'
