    html: <p>Hmm. I also found a listing for the same font, sold through URW++ (<a href="http://www.urwpp.de" target="_top">http://www.urwpp.de</a>). It says it's designed by Bob Newman and sells for $49 per weight. I couldn't find a family price.</p>
