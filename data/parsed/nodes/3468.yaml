    html: "<p>Funny Hrant. <br> <br>Here are some alternatives: <br> <br>Blippo Black from URW... <br><a href=\"http://www.myfonts.com/Testdrive?p=96&amp;s=23&amp;id=3624&amp;submit=display\" target=\"_top\">http://www.myfonts.com/Testdrive?p=96&amp;s=23&amp;id=3624&amp;submit=display</a> <br> <br>Elsner + Flake sells a 5 weight family  <br>including a way cool \"Triline\" style. I think  <br>Fontworks sells their stuff but type.co.uk is  <br>down as I write this. Eyewire.com doesn't show  <br>the E+F Pump. <br> <br>Oops, wait... Precision Type has 'em all... <br><a href=\"http://www.precisiontype.com/fontsearchres.asp?n=0&amp;tf=0&amp;s=1&amp;results=25\" target=\"_top\">http://www.precisiontype.com/fontsearchres.asp?n=0&amp;tf=0&amp;s=1&amp;results=25</a> <br> <br>and here's a double line version by Mecanorma... <br><a href=\"http://www.atomictype.co.uk/mecanorma_page.html\" target=\"_top\">http://www.atomictype.co.uk/mecanorma_page.html</a> <br> <br>In short, for old school obscure foundries  <br>like E+F, Mecanorma and URW++ you can always  <br>check the big vendors: <br> <br>AtomicType - <a href=\"http://www.atomictype.co.uk\" target=\"_top\">http://www.atomictype.co.uk</a> <br> <br>PrecisionType - <a href=\"http://www.precisiontype.com/\" target=\"_top\">http://www.precisiontype.com/</a> <br> <br>MyFonts - <a href=\"http://www.myfonts.com\" target=\"_top\">http://www.myfonts.com</a> <br> <br>Fontworks - <a href=\"http://www.fontworks.co.uk/\" target=\"_top\">http://www.fontworks.co.uk/</a> <br> <br>FontShop - <a href=\"http://www.fontshop.com\" target=\"_top\">http://www.fontshop.com</a></p>"
