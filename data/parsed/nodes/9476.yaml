    html: <p>That doesn't sound right to me. I would think that the tracking wouldn't need to change that much for such a small size increase. Generally, unless I move from text size to headline/subhead size, I do not decrease the tracking at all. <br> <br>However, below 8pt, I usually add a little, to open it up a bit.</p>
