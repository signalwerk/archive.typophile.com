    html: "<p>&gt; Could this be right? <br> <br>Yes, but: <br>1) Minus 25 seems like too much. <br>2) If you're using InDesign you might as well turn on its optical spacing (at least for \"non-intended\" sizes), which is nicely size-aware. <br> <br>hhp</p>"
