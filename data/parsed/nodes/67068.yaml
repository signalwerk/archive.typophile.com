    <p>Im not sure if anyone has attempted this already, but whatever, i've been working on the merge of these two faces into what i call Helville, mantaining the weight and proportions of helvetica with some characteristics of baskerville...<br>
    here are some screencaps of the work in progress... more to come - </p>
    <p>Your comments will be highly appreciated as this is my first experience "creating" a typeface (i know im cheating, but its a start!)<br>
