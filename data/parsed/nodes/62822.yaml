  html: |-
    <p>Two questions:<br>
    1) What's the tradition wrt the spacing of bold-type text?<br>
       Was it set with more spacing than medium-weight text?<br>
    2) Is it only me[^1] or does bold text in most fonts become<br>
       more readable if some spacing is added?</p>
    <p>[^1]: I have a problem with peripheral vision so it might<br>
          very well be just me.  However since my field of vision<br>
          is narrow I typically want blocks of text to be narrower,<br>
          not wider.<br>
    /BP</p>
