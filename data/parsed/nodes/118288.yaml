      <p>Could have been a custom job by Joe Finocchiaro:<br>
      <a href="http://luc.devroye.org/fonts-39089.html" title="http://luc.devroye.org/fonts-39089.html">http://luc.devroye.org/fonts-39089.html</a></p>
      <p>But I think Alan Fletcher is a better bet:<br>
      <a href="http://www.alanfletcherarchive.com/archive/corporate-identity" title="http://www.alanfletcherarchive.com/archive/corporate-identity">http://www.alanfletcherarchive.com/archive/corporate-identity</a></p>
      <p>I also cycled through dozens of Palatino-like faces, and found no good match, so I'm betting it is custom.</p>
