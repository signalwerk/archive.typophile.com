      <p>Jason is right; S looks too narrow, and so does L. To my eye, A, H, N and U are too wide. And the lower leg of K should bend in only one direction. Now it's sort of trying to go in both directions. I would make it bend down, and lose that start of a serif, just leave an angle at baseline or overshoot.</p>
      <p>This is just after a quick look, but I see that you want to make a brake from Trajan style, with some hints remaining, and it pretty much works. Just don't over-do it.</p>
