    html: |-
      <p>Speaking of spacing, have you done tests using HH_HOHO_OO? Your "O"s seem way to airy and larger in size compared to the rest, The "E" seems to have a different SB than the "H" (look at "THE") and there seems to be a lot of weight balancing issues. I would like to see the letter combos in the HH...OO combo before I make a final comment. </p>
      <p>At first glance, I think the diagonal are all too heavy(M,N,A,V), or the verticals are too light(H,L,) in the major stroke weight. </p>
      <p>And I think the secondary stroke weight for the "A" isn't working with the secondary strokes of the rounds like "S" or in transitions from round to vertical like the "R".</p>
      <p>Do you have unit numbers for these things? As much as type design is a creative discipline, it requires a lot of constancy and precision.</p>
