    <p>Hello, </p>
    <p>I'm new on the forum so I introduce myself</p>
    <p>i'm a swiss student, and I tried for my studies In ancient history to build a font.<br>
    I used fontforge and finally fontlab. Everything works perfectly except the kerning. </p>
    <p>MS word 2010 doesen't take count of the kerning of my new font...<br>
    Kerning works perfectly on Oppen office, but I have to make it work on MS word. Is it possible ?</p>
    <p>Somebody knows what is the problem ? Can somebody help me ?</p>
    <p>Thanks for help :)<br>
    1nordman</p>
