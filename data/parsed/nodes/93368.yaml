      <p>I remember being surprised at his appearance at TypeCon in SF—older, taller and more dapper than I expected.</p>
      <p>I thought his name was made up when I first started acquiring his series of type specimen books (published by Dover) back in the early '80s. "The Solotype Catalog of 4,147 Display Typefaces" is still the over-all best reference for identifying display film fonts. I owe a lot of my ability to i.d. fonts from years of poring over those books.</p>
      <p>Sad to seem him go.</p>
