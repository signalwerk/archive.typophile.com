      <p>Thank you for the information. I haven't yet been able find any further information, but I'm sure it will be out there soon. Has was instrumental in preserving some of the vintage typefaces and in both digitizing them and promoting others to do so, in order that they won't be lost and available only on old, poorly maintained and reproduced images from foundry catalogs.</p>
      <p>   - Herb</p>
