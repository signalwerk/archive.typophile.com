    html: <p>If all of us passed off everything to people who are better than us, than none of us would take on any work. I see the job as an opportunity to hone my skills, and I feel capable enough to do it correctly with the right OpenType code and following the curve patterns of the existing font. Maybe we should all pass our jobs on to Matthew Carter and Jonathon Hoefler ;)</p>
