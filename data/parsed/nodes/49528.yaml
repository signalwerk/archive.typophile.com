  html: <p>I have the opportunity to extend the character set for a corporate typeface. It's a script, meant to look handpainted. I pitched them on the idea of creating OpenType ligatures to give it a more handpainted feel, and they'd like to do it. But I don't really know what the going rate for something like that is -- the Graphic Artist's Guild Handbook talks about rates for customizing typefaces and creating new ones, but not really anything this specific. Any ideas based on your own experiences? Maybe a per glyph fee?</p>
