    date: 2008-09-20T22:23:00
    votes: null
    html: |-
      <p>I can't think you can do anything other than quote based on your hourly rate, plus some padding for inevitable re-work. Under-charging and usin this as a learning experience probably isn't a good idea, esp. if you plan to do repeat work with this client.  </p>
      <p>However I do like the idea of adding some fees for expert consultation and travel, and perhaps hiring Matthew or Jonathan for half a day to review the work. :-)</p>
      <p>Also if the “corporate font” is being used in corporate apps and OS’s be sure that the client understands that the features won’t work in those apps.</p>
