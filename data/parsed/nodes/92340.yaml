      <p>Wow. This is the most intelligent, cosmopolitan dinosaur in history! :-)  Actually I'm not sure it's too late for something like this, since many electronic devices (think of appliances, like coffee makers) still use lo-res 1-bit displays. However the constraint of monospace (which, predictably does the most "damage") although I understand your original intent, might actually be worth abandoning. How much programming is done in non-Latin, or even non-English? Unless it's important to have non-Latin text strings in programming not cause misalignment.</p>
      <p>Pretty much all your design compromises seem superbly pragmatic. And making the Armenian (and Georgian) x-height smaller is very refreshing, especially in this niche application. And I love seeing that classical «հ» in a bitmap font! :-)  Just some of your bold forms (in many of the scripts) might need tweaking.</p>
      <p>Bravo.</p>
      <p>hhp</p>
