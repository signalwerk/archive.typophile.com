    <p>Heres a question for ya. Actually my professor asked it. “If you maximize the x-height, ascenders and descenders of a particular glyph, does that mean the glyph gets larger in measurement?”</p>
    <p>Maximize=increase the length vertically.</p>
    <p>My thinking is no because the width and the stroke contrast remains the same.</p>
    <p>Any ideas guys?</p>
