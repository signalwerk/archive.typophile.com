  - id: 518085
    user: 18942
    date: 2012-08-05T07:56:00
    date_raw: 5 Aug 2012 — 7:56am
    votes: null
    html: |-
      <p>The original files provided by Adobe are, so far as I know, those listed at the URL <a href="http://www.ctan.org/tex-archive/fonts/utopia" title="http://www.ctan.org/tex-archive/fonts/utopia">http://www.ctan.org/tex-archive/fonts/utopia</a></p>
      <p>Those fonts come installed with <a href="http://www.tug.org/mactex/" rel="nofollow">MacTeX 2012</a> (and I presume also <a href="http://www.tug.org/texlive/" rel="nofollow">TeX Live</a>). When installed, </p>
      <pre>    kpsewhich putr8a.pfb</pre><p>
      tells you where the regular is located.</p>
