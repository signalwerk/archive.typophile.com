      <p>Already much earlier did Adobe made a typeface open source, this was an early version of Utopia. It can be found searching the web for “adobe utopia latex”. However this version of Utopia was even further improved (hopefully) and expanded and is released under the name Heuristica/Evristika, the latter being the russian transliteration of its name.<br>
      <a href="http://code.google.com/p/evristika/" title="http://code.google.com/p/evristika/">http://code.google.com/p/evristika/</a></p>
