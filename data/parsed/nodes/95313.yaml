    html: <p>Thanks.  The files provided at <a href="http://www.ctan.org/tex-archive/fonts/utopia" title="http://www.ctan.org/tex-archive/fonts/utopia">http://www.ctan.org/tex-archive/fonts/utopia</a> are same as the original fonts donated from Adobe. First donated in '92, kept in 'free/not free limbo' for 14 years, and finally confirmed as free 2006. Or something like that.</p>
