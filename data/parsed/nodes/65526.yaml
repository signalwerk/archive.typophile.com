      <p>Really nice! I love it!</p>
      <p>Another trick is to use ligatures for those cases when the connections are really problematic. I'm developing a script font too, and don't wanted to fight with connections, so ended up with more than 70 ligatures.</p>
      <p>I also added 'terminal' alternates, because at the end of each word you don't need to connect to nothing, so each glyph has an alternate version with a shorter tail.</p>
      <p>Maybe you can use the ligatures trick in your font.<br>
      Feel free to download mine at <a href="http://www.impallari.com/lobster" title="www.impallari.com/lobster">www.impallari.com/lobster</a> and check it out.<br>
      If you need any help with the OT programming thing, I will be glad to help!</p>
