      <p>Incidentally, I'm curious about the definition of "cursive" found in the <a href="http://typophile.com/node/39906?" rel="nofollow">typowiki</a>.</p>
      <p>"Being Cursive is a property of typography and Calligraphy which implies a certain inclination or angular tilt, either positive or negative, relative to the orthogonal “y” axis."</p>
      <p>whereas <a href="http://en.wikipedia.org/wiki/Cursive" rel="nofollow">wikipedia</a> says (this is how I'd understood it):</p>
      <p>"Cursive is any style of handwriting that is designed for writing notes and letters quickly by hand. In the Arabic, Latin, and Cyrillic writing systems, the letters in a word are connected, making a word one single complex stroke. In fact, the word comes from the Latin cursivus, meaning "flowing"."</p>
