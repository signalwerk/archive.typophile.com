      <p>I think you're onto something very nice for a first font.<br>
      I'm also a beginner at this so read this advice with skepticism.</p>
      <p>/x/ is great. The more I look at the /o/ the more I like it.<br>
      Figures are generally great, esp. /2/, /5/, /7/<br>
      the /t/ crossbar variety is fun</p>
      <p>/b/ threatens to read as /le/<br>
      descender loops seem too small, especially on /g/<br>
      /s/ (not the initial form) looks like it leans backwards - I suppose because it picks up on the angle of the stroke coming in. /z/ has a similar difficulty. I would keep trying new approaches for both.<br>
      /ti/ in "rationalization" and /at/ in "telepathic" and /yr/ in "polystyrene" have some lining-up issues<br>
      have more fun with the /?/!</p>
      <p>the curving vertical of /t/ might suggest possibilities of making other vertical stems (/d/, /h/, /k/) less rigid.</p>
