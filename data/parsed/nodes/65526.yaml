      <p>This is coming along nicely! I won't go into a very long critique, but will try to add a few tidbits.</p>
      <p>I really like the way downstrokes have that subtle taper at the tops. I would just advise carrying that feature throughout. That may have been mentioned above. I just noticed some as flat and some tapered. You might even consider this sort of taper for crossbars.</p>
      <p>I would try to see if you can strengthen the connections on the upstrokes of s and r. These are appearing perfectly vertical while the strokes that meet up with it taper into the point. This makes it look thinner on screen and weakens the connection. You might try having it slightly heavier at the top and overlap a bit deeper. I recently made an upright script myself and remember having to rework connections a few times.      </p>
      <p>I agree with Hrant about the contrast of the x. It also appears to be leaning left. The lowercase x is probably the most difficult as it doesn't naturally want to play well with the rest. Once you get it closer to ready you might still want to add some ligatures to further control how it looks.</p>
      <p>I wish you the best with this as I think its going to be a wonderful and useful design.</p>
      <p>S</p>
