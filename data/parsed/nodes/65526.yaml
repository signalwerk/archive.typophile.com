    html: |-
      <p>Thanks so much for the feedback!</p>
      <p>Craig: </p>
      <p>Oddly enough I'd never really related the shape of the cursive s as I'd learned to write it in elementary school with the shape of the printed s. They've always just been completely different shapes to me, the weight of the cursive one being entirely in the fat round part on the lower right. So to me it doesn't appear to lean at all. I guess the little loop at the top undermines that. I added the loop intending that it would suggest a sloppy, hastily drawn corner, not a tiny little underdeveloped top loop. It's good to know how other people interpret it, though, especially when they interpret it so differently than I do. I have a big round-topped alternative z which I've been meaning to substitute back in. Perhaps that one will look more balanced. </p>
      <p>What do you mean about lining-up issues? Are the connectors not lining up or..? </p>
      <p>The vertical stems are one of my larger unresolved issues. Some of them I've left completely straight and flat, some of them taper a bit, the a is rounded off on the top, and of course some of them curve a little bit...still not sure how I'd like to unify it all.</p>
      <p>Hrant:</p>
      <p>Clearly both! :) </p>
      <p>I'm not sure what you mean about the bowl and stem of the d. </p>
      <p>The e is one of my least favorite of the letters. It always seems to stick out in an ugly way. I made some ligatures for s-e and b-e and some other combinations. I think they resolve some issues. They still need some finessing, though. </p>
      <p>I have some alternate t's that I used in "title" and "situation" which resolve the t-i problem adequately IMO. I forgot to substitute them into "rationalization" (they used to sub in automatically with opentype but I messed that up when I tried to make the beginning and ending swashes automatic too). </p>
      <p>It took me such a long time to make that x work that well! I agree that it still needs some tweaking. It's been such a relief that it finally works as well as it does. </p>
      <p>I have some figures which relate better to the letters with bigger loops but they don't look as nice as these. Actually, quite a few of the older scripts I've come across have rather formal looking numbers. I was hoping that the teardrops on 2,3,5,6 and 9 would relate to those on the c and the alternative s and r. The 2, 5 and 7 have parts based on the F (one of 2 caps I'd started out with). Perhaps the contrast is different. They do seem to stick out a bit. </p>
      <p>And "Retro Upright" is just my working title. Haven't really put much thought into a real title but had to call it something, so...</p>
      <p>Thanks again for the suggestions. Back to the drawing board I go!</p>
      <p>Gilly</p>
