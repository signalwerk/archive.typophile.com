      <p>Very nice for a first effort. Either you're very<br>
      talented, or you've had good teachers. Or both!</p>
      <p>Here's what I see for now (only in the alphanumerics):</p>
      <p>- You're nicely varying the lengths of the descenders. I would definitely do the same with all the ascenders.</p>
      <p>- Another variance I'm liking is the different leans, like how the "f" leans backwards. That's very nice, and there seems to be room for more of that.</p>
      <p>- "d": I might try to disconnect the bowl from the stem at the bottom.</p>
      <p>- "el": the discontinuity from the previous letter's join is jarring. Maybe you can just make its loop start from higher up (basically breaking the connection).</p>
      <p>- The shifting bar of the "t" is great. But it shouldn't skewer the tittles (dots of the "i"/"j"); I would raise the tittles [anyway].</p>
      <p>- "x": could work, but more contrast.</p>
      <p>- "z": maybe the middle loop has to go.</p>
      <p>- The numerals are out of character.</p>
      <p>- The asterisk: nice that it's not vertical, but I'm thinking you might try something fancier; maybe a form like this: <a href="http://en.wikipedia.org/wiki/Saint_John%27s_Arms" title="http://en.wikipedia.org/wiki/Saint_John%27s_Arms">http://en.wikipedia.org/wiki/Saint_John%27s_Arms</a></p>
      <p>BTW, about the name: I think "Retro" is cool and fitting, but it's over-used. So you'd need to have a second word in the name (and I don't think "Upright" cuts it). Or you could choose something related, like the name of a famous TV housewife from the 50s. Lucy?</p>
      <p>hhp</p>
