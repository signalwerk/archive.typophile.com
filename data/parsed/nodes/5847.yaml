    html: "<p>Microsoft, Agfa Monotype and Linotype are discussing the Segoe/Frutiger issue. <br> <br>I think MS commissioned the new types in good faith: they certainly didn't ask for a Frutiger clone (indeed, they already license Frutiger Linotype for the MS Reader, and have no need for a clone). Agfa Monotype deny that Segoe is an intentional Frutiger clone, but most people I've spoken to seem to agree that, whatever AM's intent, the result is too similar to Frutiger for comfort. In this respect, I don't think it matters much, certainly not to MS, whether it is an intentional copy or not: the possible PR damage from something that large numbers of people think looks like a copy is reason enough to be concerned.</p>"
