    html: <p>Frutiger is a much beloved typeface known and used by lots of professional graphic designers, many more of whom are now Windows users than when Book Antiqua hit the personal computer. MS are justifiably concerned about what might written about them in a wide circulation design mag like Print or Communication Arts, especially since negative stories tend to travel. Even the utter stupidity of the claim that Wingdings contains hidden antisemitic messages made it to the New York Times. <br> <br>I happen to know for a fact that a lot of people at MS are very concerned about the Segoe/Frutiger issue, and are working to resolve it. I wouldn't be saying anything in this thread if all I had to offer was speculation. I work with these people.</p>
