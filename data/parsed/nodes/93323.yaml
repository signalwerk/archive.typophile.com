      <p>Well yes, but doesn’t that logic make any old face which happens to ﬁnd some usage at the moment a “timeless classic”?</p>
      <p>There was a time, in my pre-digital career, when Bank Gothic and “Trajan” were nowhere to be seen. Trajan had yet to be designed, and Goudy’s Trajanus and Bank Gothic were not carried by most type shops. Some of the larger shops did have Bank Gothic on typositor, though.</p>
      <p>This “timeless classic” business is, I’m afraid, a bit of a cliché.</p>
