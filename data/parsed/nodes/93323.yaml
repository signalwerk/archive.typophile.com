      <p>Far from being timeless, Bank Gothic is a late 19th/early 20th century style, revived in 1930 for its proto-modernist afﬁnities, I would imagine.<br>
      If it were truly, reductively modernist, it would not have the chamfered or angled terminals which are its most distinctive feature, and the D would not chicken out of being a true match for O and C (note that Trump’s City holds the line in that respect).<br>
      Another giveaway to its 19th century origins: the short central bar on E.</p>
      <p>Its name refers to how this square style was used in bank signage, often in brass. Here is an example (photo from 1905)—on the scaffolding, not above the door.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/central-savings-bank_6340.jpg"></div><br>
      And another:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/PaducahTxFirstStateBank1910DateStone1208BG_6270.jpg"></div><p></p>
      <p>Although a sign style, it was probably more popular engraved. As Mark Van Bronkhorst notes re. his <a href="http://www.mvbfonts.com/sweet_square/" rel="nofollow">Sweet Square</a>:</p>
      <blockquote><p>The engraver’s square gothic has been one of the more widely used stationer’s lettering styles since about 1900, made popular long ago by bankers and others seeking a serious, established feel to their stationery. </p></blockquote>
      <p>Here is another square style from the turn of the century:<br>
      <a href="http://www.letterheadfonts.com/fonts/hamiltonnailhead.php" title="http://www.letterheadfonts.com/fonts/hamiltonnailhead.php">http://www.letterheadfonts.com/fonts/hamiltonnailhead.php</a></p>
    html_clean: |-
