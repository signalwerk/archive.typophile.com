      <p>If you want to pair your type in a complimentary way, you might try Apex Serif.</p>
      <p>Apex Serif is super-elliptical (squarish circle), which would reference the Bank Gothic. And the S in both -- they're not related at all of course, but there's something of a resemblance. </p>
