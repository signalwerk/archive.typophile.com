      <blockquote><p>Far from being timeless, Bank Gothic is a late 19th/early 20th century style</p></blockquote>
      <p>And Trajan is a late 1st/early 2nd century style, but still going strong.<br>
      That’s what I meant by “timeless”, not that it hasn’t a specific and recognisable  point of origin in time, but that, despite it, it has proved useful in a variety of situations far removed in time and intent from such origin.<br>
      And I suspect one of the reasons is also because it isn’t “truly, reductively modernist”, but have distinctive features.</p>
      <p>All that said, nowadays I wouldn’t use it (and that holds true for Trajan too), if not for a parody piece.</p>
