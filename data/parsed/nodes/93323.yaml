    <p>I'm trying to find a typeface which will compliment Bank Gothic, but I'm not sure how to go about pairing an upper case only typeface with a mixed case one.</p>
    <p>It will be used for body copy - paragraphs, titles etc, and extended sections of text.</p>
    <p>Any tips?</p>
