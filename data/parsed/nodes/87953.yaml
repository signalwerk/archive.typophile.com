    html: |-
      <p>Isn’t the rationale in Univers that the lining figures are designed slightly lower than full caps, and thus straight quotes align on figs? </p>
      <p>Assuming one is using proper typographic quotation marks, then the straight quotes are most likely to be pressed into service for feet/minutes and inches/seconds directly following numerals.</p>
