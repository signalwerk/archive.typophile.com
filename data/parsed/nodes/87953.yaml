    date_raw: 2 Dec 2011 — 8:52am
    votes: null
    html: "<p>Two possibilities occur to me: A) plausible, but less likely: the alignment is an attempt to more or less match the placement of guillemots; and B) more practical: lowering the quotes makes for fewer kerning pairs. Lowering the quotes eliminates the need to kern with round characters (“O”). An elegant solution or laziness? Hard to say…</p>"
