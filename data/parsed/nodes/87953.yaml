  html: <p>Some fonts have straight quotes that hang flush from the cap height, others they straddle it, and on rare occasions they float below it. I can understand the rationale for the first two, but is there some reason for hanging the straight quotes noticeably low, as in Univers? Or it is just a stylistic decision?</p>
