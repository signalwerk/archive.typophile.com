      <p>That's a “fashion” look, combining Bodoni with a light weight of Helvetica for body text.<br>
      The idea is that the linearity of the Bodoni hairlines relates to the linearity of the body text.<br>
      You might use the Light weight of Brandon at a comfortable size, and with plenty of leading, to create a spacious upscale tone.<br>
      Montague has a contemporary quality, in a traditional style, so would work well with Brandon or Seria Sans, which are likewise.</p>
