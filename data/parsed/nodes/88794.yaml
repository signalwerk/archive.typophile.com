    <p>Hi I'm looking for some suggestions on what font types pair well together for a luxury real estate company.</p>
    <p>The client has requested a script font to be used in conjunction with another type in background of headlines in ads. We've somewhat narrowed it down to Montague, with optima and chronicle. It seems to work aesthetically but want to know from the type board if there are other options that would work better for our needs.</p>
    <p>The company is targeting $1+M homes in North Scottsdale and Paradise Valley. Demographics are mostly couples ages 40-60, average income $175K annual and are interested in Arizona for the cultural offerings, weather and current real estate market here.</p>
    <p>Clients do a majority of advertising in luxury magazines, home magazines, billboards and website.</p>
    <p>Any suggestions on what fonts would pair well for their needs would be greatly appreciated.</p>
    <p>Thanks,</p>
    <p>Chris</p>
