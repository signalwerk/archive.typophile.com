    html: |-
      <p>Chronicle is, as the name suggests, primarily a newspaper type.</p>
      <p>For luxury, you need a face that isn’t quite such an economical workhorse, one that wastes space with profligacy, i.e. a book face with a very small x-height, which you should then set with plenty of leading, at a suitably large size for the failing eyes of your demographic.</p>
      <p>What do you think of Brandon and Seria Sans? They are both a bit retro/quaint, and modern (if not modernist) by virtue of being sans.</p>
