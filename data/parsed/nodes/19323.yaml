      <p>Beautiful images, Drew. If design is one of the aspects of your thesis, then I agree that Palatino or Garamond would be good choices for the text.</p>
      <p>If you will be using small caps, be sure to get a font that has "true" small caps as opposed to picking the "small caps" style in your layout program (same goes for "bold" and "italic" settings -- use a font that has these weights as part of the font package). Here's an example of <a href="http://www.myfonts.com/fonts/linotype/palatino/small-caps-and-old-style-figures/" rel="nofollow">Palatino Small Caps</a>. (And here is the whole range of <a href="http://www.myfonts.com/fonts/linotype/palatino/" rel="nofollow">Linotype Palatino</a> weights, also by way of illustration.)</p>
