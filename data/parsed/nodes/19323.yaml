    html: <p>I do not know if it is the best option to make captions in Small Caps. Small Caps seems to work better for sub-headings or in some cases the headings themselves. In this instance I would make the caption text italic but keep it the same size as the text on the right. And then I would play around with the idea of making the heading small caps at the same size as the text and drop the saturation of the overall text to about 90% so it is not overpowering. I apologize if you are not after a critique though.</p>
