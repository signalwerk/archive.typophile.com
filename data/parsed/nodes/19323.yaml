      <p>Hi, Drew.</p>
      <p>Fonts can or may be a personal choice but they are also helping to communicate something, so it is important to bear in mind the content and subject matter of the text you are setting (which you already are, since you mention these), as well as the audience that will be reading it.</p>
      <p>One thing you can do to get started (perhaps you have already done this) is look at existing books on the same subject and see what font choices their designers made -- not to blindly copy, but to see what you think works or doesn't work in those examples.</p>
      <p>Another thing you could do is make a list of the different functions the texts in your thesis will have. For example, you will have body text, but probably there are also titles and subtitles, and perhaps captions for the photographs. You may want just one font, in a range of weights, for all of these... or perhaps two fonts -- one for titling, the other for body text, to give a simple example. With a list of functions you can have a better idea of what you need to look for.</p>
      <p>I hope these suggestions don't sound too obvious!</p>
