      <p>Good luck with the writing. :^) Forget about the "design" of the book until you get all the words right! Once you got the font family, styles and the template the rest is easy. </p>
      <p>I agree with the earlier suggestions that Palatino and (Adobe) Garamond would be more than suitable (and economical) for setting your thesis/book in.</p>
      <p>It seems that you've used "faux" Small Caps (SC) in InDesign, they don't look quite right. The problem with "faux" SC is that they're not weighted/designed proportionally to the regular/or corresponding weight. For this reason alone, I suggest you purchase the single SC weight of your chosen face. It should not be expensive if you've already got the other weights as you have with Palatino and Garamond.</p>
      <p>Again, good luck. :^)</p>
