  html: <p>I am a college senior about to graduate at the end of May and am currently putting together my final thesis.  My thesis is a book of essays and photographs on the Florida Everglades and this weekend I will be doing the final layout.  While I already have the design in mind I have no idea on where to start on picking a font.  I would love some suggestions on what resources to look at that will help me with this process.  I realize fonts are typically a very personal choice so I am not really looking for a "use this" but rather some information (or link to an essay) explaining how people make these decisions.  Thanks for your help and I look forward to hearing your responses.</p>
  html_clean: <p>I am a college senior about to graduate at the end of May and am currently putting together my final thesis.  My thesis is a book of essays and photographs on the Florida Everglades and this weekend I will be doing the final layout.  While I already have the design in mind I have no idea on where to start on picking a font.  I would love some suggestions on what resources to look at that will help me with this process.  I realize fonts are typically a very personal choice so I am not really looking for a "use this" but rather some information (or link to an essay) explaining how people make these decisions.  Thanks for your help and I look forward to hearing your responses.</p>
