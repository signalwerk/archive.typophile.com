      <p>Drew</p>
      <p>I am sure this is going to get me kicked off the list but if you are doing a thesis, use Courier. I'd also recommend it for resumes. Avoid "personal choices" for informational documents such as these. I once remember being on a job search panel, and an applicant who had sent in a very appealingly designed resume got kicked off just for that reason. You are going to be judged on the information you present not on how you present it. And, how you present it can actually be detrimental (to you) if it does not conform to the norm.</p>
