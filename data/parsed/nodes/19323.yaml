      <p>Drew, I am, shamefully, still something of an InDesign newbie. When I advised against using Small Caps, Italic and Bold styles rather than the actual weights in the font menu, I was referring to programs like QuarkXPress, which "fake" those styles -- the faked styles don't always print the way they look onscreen. Maybe someone else here can tell you how InDesign handles these things -- from the evidence of the PDF it <em>looks</em> alright, but better to be sure.</p>
      <p>As for your layout, you have not asked for a crit, but I agree with timd; it will look better if you don't indent the first line of the photo caption on the lefthand page (the same applies to the first paragraph of your main text on the facing page -- you could start it with a drop cap, or with the first few words in small caps, to give a couple of suggestions). And one more thing about the caption: it might look better if the parentheses around those unitalicized names were also not italicized... right now they look like they are running into the text... Sorry to get all anal on you.  :-)</p>
