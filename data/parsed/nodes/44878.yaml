    html: <p>What about Adobe's OpenType version of ITC New Baskerville?...crisper, bigger, more contrasted, and thus more legible than the lower-contrast Baskervilles from Storm, fine as those families are. And the Adobe OT version gives you full glyph coverage, including OSFs, and better kerning, on the whole. I've always preferred the more contrasted Baskervilles over the less contrasted ones...just wears better for reading.</p>
