    html: <p>I actually think the BQ version's emdash is shorter than Adobe's. If you're shopping for Baskervilles, I recommend taking a serious look at Stormtype's <a href="http://www.stormtype.com/typefaces-fonts-shop/families-22-baskerville-original" rel="nofollow">Baskerville</a> and <a href="http://www.stormtype.com/typefaces-fonts-shop/families-77-baskerville-10-cyrillics" rel="nofollow">Baskerville 10</a>.</p>
