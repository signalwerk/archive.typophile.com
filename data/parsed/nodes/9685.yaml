  - id: 61795
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I have tried all of the font managers for OSX and decided MasterJuggler was it.  <br> <br>MJ works very much like the old ATM Deluxe. You activate and deactivate fonts from anywhere on your system. It does not copy or create a database, it just turns on and off fonts. You can create sets, you can browse the various Unicode ranges, and you don't have to keep it running in the background all the time. <br> <br>There is no auto-activation, but I was told by Altsys theat that was something they were going to include in a future version. <br> <br>Unfortunately they don't offer a downloadable trial version. <br> <br>But they did have me listed as a registered user from back in the System 7 days, and they gave me the upgrade price.</p>
