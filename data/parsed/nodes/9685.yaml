    html: <p>I use suitcase on a PC (bleh) and it's kind of buggy.  Usually it gets the job done, but don't spend too much time creating font lists and categorizing fonts in Suitcase as inevitably your list will get corrupt and you'll have to redo all the work over again.  It's a common problem according to Extensis, I found after my first tech support call.  So now I keep the fonts themselves in categorized folders and try to let the software do little more than turn fonts on and off. <br> <br>I'm sure it works flawlessly on a Mac though. <br> <br>How is Reserve superior to Suitcase?</p>
