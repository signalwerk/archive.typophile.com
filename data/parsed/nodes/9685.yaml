    html: <p>I want to put in a good word for Font Agent Pro. I'm a new voice on this list but over the last 15 years I have used a variety of font management tools. <br> <br>I'm macBased and was quite content with Adobe's solution. I'd previously purchased and struggled through using Juggler and Suitcase.  <br> <br>When Adobe stopped supporting ATM I switched to Font Reserve.  It worked fine but after Extensis purchased the software it apparently wasn't supported as it should have been. I had problems with it after upgrading my Mac operating system to Panther. Customer support was excellent but in the end they couldn't resolve the problem. <br> <br>I switched to FontAgent Pro a couple of months ago and it's running well. I hope it continues to do so.  <br> <br>Eunice</p>
