    html: <p>All of the font managers out there leave something running as an application (with FontReserve it's the "FontReserve Database", with FAP it's the "FontAgent Activator"). The main difference with Suitcase is that it's visibly running, and the browser and the activator are the same application. It's only really annoying when you, like a friend of mine, are unable to get Suitcase to quit when you shut down the machine or log out. <br> <br>James, why do you like MasterJuggler? WAY back when it was my favorite font manager (we're talking 1990 here), and I was intrigued to see that it was brought back from the grave, but it's been frustratingly difficult to dig up information on it.</p>
