  html: |-
    <p>Hi all</p>
    <p>I'm working on a project which collaborates with and promotes the many different cultures of Europe, and trying to identify a typeface that can embody this.</p>
    <p>A universal sans face would be the most obvious, like Helvetica, but I'm thinking a traditional Roman serif face would be more suitable to convey the history of Europe. I quite like Fournier, Sabon and Transitional.</p>
    <p>Any thoughts?</p>
