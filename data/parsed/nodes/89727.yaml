    html: |-
      <p>A different approach could be a sans serif version of Trajan.<br>
      Or Novecento, which is inspired by european cities’ historical lettering (<a href="http://typography.synthview.com/" title="http://typography.synthview.com/">http://typography.synthview.com/</a>).<br>
      If you want/need something which references a period in-between those two, you will need at least some hint of blackletter.<br>
      Or, finally, you could go the Typedia route (<a href="http://typedia.com/blog/post/behind-the-typedia-logo-design/" title="http://typedia.com/blog/post/behind-the-typedia-logo-design/">http://typedia.com/blog/post/behind-the-typedia-logo-design/</a>).</p>
