    html: |-
      <p>This is a tough call. And if you try too hard it's sure to backfire.</p>
      <p>A generic sans would be too weak, but a traditional serif isn't<br>
      right either because it would be too local to Ancient Italy.</p>
      <p>I think what might work is a contemporary, funky serif font<br>
      with a strong Roman undercurrent, and fringe influences like<br>
      from Greece and Eastern Europe. Not perfect, but what about<br>
      Quadraat Italic?</p>
      <p><a href="http://www.fontfont.com/staticcontent/downloads/FF_Quadraat_Specimen_2012.pdf" title="www.fontfont.com/staticcontent/downloads/FF_Quadraat_Specimen_2012.pdf">www.fontfont.com/staticcontent/downloads/FF_Quadraat_Specimen_2012.pdf</a></p>
      <p>--</p>
      <p>BTW, I love the door in your logo!</p>
      <p>hhp</p>
