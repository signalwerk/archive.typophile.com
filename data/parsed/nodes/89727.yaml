      <p>Thank you hrant! My logo was a labour of love. Your points are exactly what I felt, only expressed more articulately! I'll have a look at Quadraat, it certainly seems like a good contender.</p>
      <p>riccard0 - I think I'd looked at Novocento; I'm a big fan of geometric fonts, and love the big, round circular characters. However I'm a bit worried that this font might date a bit quickly if used for a logo, or that I'm using it because it's a personal favourite! That's a great back-story to the Typedia logo and something I might consider.</p>
      <p>Thanks for all the advice, it's been really helpful. Although I'm an experienced designer, proper typography is an area I'm still working on and a tool I find fascinating. Cheers guys!</p>
