    html: |-
      <p>I know you don't want to be too literal, but that is one thick piece of paper! I think the you need to bring down the contrast between the thick and thin parts of your "e". Also, the perspective is too severe. You are forcing the viewer to imagine a rolled up piece of paper held from something like a 60 degree angle above their head and then read the text at no angle. It's not harmonious.</p>
      <p>Get some tape and roll up a piece of paper into the shape of an e. Take some digital pictures at different angles and then use them as references while you sketch. For instance, I see a lowercase e with horizontal lines flowing left.</p>
      <p>Also, Gil Sans feels to cold and corporate compared to the style of drawing you have shown. A nice serif would probably serve the mark better.</p>
    html_clean: |-
