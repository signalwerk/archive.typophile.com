      <p>The mark looks haphazardly put together. The sloppy curves of the "papers" really distract from a potentially good mark. It has potential as I see what you were getting to, but work on simplifying the mark, taking the balance of the strokes and how they look together into consideration. Also, consider the role of positive to negative space play together. These paper overlap each other and create minor distracting negative spaces. </p>
      <p>I think you should sharpen that up first, then resubmit it for review. The forum functions much better when everyone thinks you put some effort into it.</p>
