      <p>I agree with Chris and blackbirdsings, it's a good start but needs work.</p>
      <p>Keep refining the paper. It doesn't read as paper. Maybe that is not important, and it is just supposed to look interesting and abstract, but the paper crosses over itself, which makes the design confusing. Paper cannot pass through itself like that. It looks more like wood or metal shavings than paper. Also, the books use the flat side of the paper sheets, not the edges, so that adds to the confusion.</p>
      <p>Keep playing with the paper design. You've got an interesting start.</p>
    html_clean: |-
