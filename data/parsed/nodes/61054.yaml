  html: |-
    <p>Hi,</p>
    <p>i would like some suggestions from you experts about some good typefaces i can consider for the blog of a journalist.</p>
    <p>I think will go with a classic grid/typographic style (eg. shauninman.com, subtraction.com) but i want to avoid a newspaper look.</p>
    <p>The blog need to be authoritative but modern (not trendy) but i'd like a little injection of a classic feeling (maybe the coupling of a  serif and a sans-serif?).</p>
    <p>I am open to all your suggestions, if you feel you need more details to help me let me know, and I will try to provide.</p>
    <p>Thanks in advance,<br>
    Giuliano</p>
