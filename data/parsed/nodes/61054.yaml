    html: <p>I think all Feliciano's typefaces are of very high quality, Morgan included. All its variants, weights and widths make for a very interesting type family. It might perhaps not be the best choice for copious amounts of small text. And you need an OpenType font, I don't know Morgan is converted yet. Send an e-mail and ask, and ask for an extensive specimen, too.</p>
