    html: |-
      <p>I will try to keep it short:</p>
      <p>I work as front-end developer and also a bit as designer for the web from 5 years.</p>
      <p>From this autumn I will go freelance to cultivate my other old passion: writing &amp; journalism.</p>
      <p>I will collaborate professionally with a newspaper and a magazine but I want to have a blog too, where writing freely about themes I care.</p>
      <p>The blog will host posts about my interests: sociology, philosophy, politics &amp; literature. Mainly editorials, opinions and some reviews of books I read.</p>
      <p>I want to give the site a very minimal and effective design with usability &amp; legibility in mind, BUT i don't want the blog to feel too classic or newspaper-like (a thing that often happens when going to the grid&amp;typography classic look on the web).</p>
      <p>I would like the site to look modern BUT not trendy (not something that could feel outdated a year or two from now).</p>
      <p>Other weblogs i like are: <a href="www.wilsonminer.com" rel="nofollow">wilsonminer</a> and <a href="http://informationarchitects.jp/" rel="nofollow">informationarchitects</a>.</p>
      <p>Maybe (not sure still) I will go for very big type (16px) for article body copy (only on the page of the single post), in this case a serif font will be needed for the body copy (again only on the single post page).</p>
      <p>I hope i gave you enoguh information.</p>
      <p>Giuliano</p>
