    html: <p>Farnham is a very good suggestion, but perhaps a little overused these days? I'd take a look at <a class="freelinking external" href="http://www.felicianotypefoundry.com/main/?page_id=88" rel="nofollow">Eudald</a>, which is distantly related (Farnham is loosely based on the types of Johann Fleischmann, while Eudald is a revival of his Spanish imitator Eudald Pradell's types. The web page doesn't mention OT versions of the typefaces, but I know Mário Feliciano started working on them more than a year ago. They're probably finished long ago now).</p>
