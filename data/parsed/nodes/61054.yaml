  - id: 362864
    user: 2021
    date: 2009-08-20T15:19:00
    date_raw: 20 Aug 2009 — 3:19pm
    votes: null
    html: |-
      <p>Base your decision on how the face looks in an online type tester, for reasons such as the fact that sifr does not support kerning or tracking.</p>
      <p>So the display styles of <a href="http://www.shinntype.com/brown.html" rel="nofollow">Brown Gothic</a> might be good for a sans headline, as they are tightly fitted.</p>
      <p>Other Shinntype news faces with display styles: Nicholas, Pratt, Walburn, Worldwide.</p>
      <p>And I would say, make your headlines big, using display faces, because it will create a more sophisticated quality than what people are used to when they see default web faces blown up.</p>
