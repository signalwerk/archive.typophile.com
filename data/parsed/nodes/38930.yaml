    html: |-
      <p>Nah I was just posting that for anyone who comes along later. I should’ve said, “Even with freeware be sure to ’Read the EULA’ because you will be surprised how many foundries offering freeware/shareware fonts actually have restrictions applied to them.” Blambot for instance. </p>
      <p>Quote: “This font is freeware for independent comic book creation and<br>
      non-profit use ONLY. ( This excludes use by “mainstream” publishers,<br>
      (Marvel, DC, Dark Horse, Oni, Image, SLG, Top Cow, Crossgen and their<br>
      subsidiaries) without a license fee. Use by a “mainstream” publisher<br>
      (or it’s employee), and use for commercial non-comic book production<br>
      (eg. magazine ads, merchandise lables etc.) incurs a license fee<br>
      be paid to the designer, Nate Piekos. “</p>
