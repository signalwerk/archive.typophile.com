    <p>Hello,</p>
    <p>After generating my font I try it in MS Word and all of descenders and ascenders of font are cut off.<br>
    This strange effect have place in big sizes as 72pt etc.<br>
    As I understand the problem goes to font info but... settings is standart. Maybe the cause is font unicase and something wrong with value of Cap-height or x-height?..</p>
    <p>Best regards,<br>
    R.</p>
