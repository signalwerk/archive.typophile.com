    <p>I haven't seen this posted...it's Obama's Nobel Prize.<br>
    Beautiful calligraphy, I assume hand-lettered.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/0nobelprize09_4835.jpg"></div><p></p>
    <p>I wonder how I could simulate something like this, if I don't have the skill to do it with pen and ink. Maybe with Canada Type's <a class="freelinking external" href="http://new.myfonts.com/fonts/canadatype/maestro/" rel="nofollow">Maestro?</a>?</p>
