      <p>First of all, thank you, guys!</p>
      <p>anhng: The overall idea is to create a cheerful text face, for magazines and newspapers, with loosing it's seriousness and robustness. In order to do that, I wanted to create a slightly calligraphic typeface, smooth and idiosyncratic.</p>
      <p>kentlew: Maybe it should. how can I move it over there?</p>
      <p>chronicle: I wanted to make a horizontal bar on the "a", I recognise that it isn't tuned with the e. Do you think that small caps are to tiny?</p>
      <p>Cheers!</p>
