    html: |-
      <p>I think this is a fantastic start. I agree that the counters in the "a" and "e" seem to not be balanced in relationship to each other. I'd suggest making the bowl of the "a" larger to more closely resemble the "e".</p>
      <p>I really like the x-height though. I think that you're working it into a good direction if your goal is for a solid typeface set in small sizes. I would be careful though, of having the x-height too close to your uppercase height, they could potentially bleed together. I'd also watch the height of your small caps. Having them between your x-height and uppercase height would make them more traditional and set apart from your other characters.</p>
    html_clean: |-
