    html: <p>0x0020 is the word space character. In many fonts, esp CFF OpenType fonts following Adobe's practice, this will be the lowest character code in the font, and hence will be the entry for the OS/2 usFirstCharIndex field. In fonts that follow Microsoft's <a href="http://www.microsoft.com/typography/otspec/recom.htm" rel="nofollow">recommendations</a>, the second glyph in the font will be /NULL/ which will be encoded at 0x0000, which is then the lowest character code in the font. I make all my fonts following the MS recommendations for the first four glyphs (which in turn is based on Apple's original TrueType spec), even CSS fonts, since that means I can maintain a single source independent of output format; obviously I make an exception to this practice when I am making fonts for Adobe.</p>
