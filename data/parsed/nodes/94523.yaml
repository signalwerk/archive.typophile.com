    html: |-
      <p>Arial is an old font, whose OS/2 and name table settings predate the bit 8 and IDs 21 and 22 settings. Since it is an MS core font, there may be compatibility concerns in updating such settings in the font, and MS also have the option of providing special handling for it in their apps if necessary to make it behave correctly in DWrite environments. Remember, the WWS settings in the OS/2 and name tables are designed to improve processing times by giving the DWrite (previously WPF) system explicit information that it otherwise has to produce via heuristics.</p>
      <p>When I was building Gabriola, which is a single style display type, I had to ask MS where in the DWrite font environment such a font should be classified. After some thought, they determined that a single-font 'family' fitted within the weight/width/slope family model, hence the bit 8 setting in Gabriola.</p>
      <p>The bit 8 setting indicates to DWrite that a font is a member of a family that conforms to <a href="http://blogs.msdn.com/b/text/archive/2009/04/15/introducing-the-directwrite-font-system.aspx" rel="nofollow">the weight/width/slope model</a>, i.e. that each member of the family is differentiated from others only with regard to these three properties.</p>
