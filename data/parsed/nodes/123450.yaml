  html: |-
    <p>Hello,<br>
    I'm currently attempting to hand letter a logo based off of some faint visual memories of some mid-century modern lettering I've seen through my travels. I'm hoping someone out there can look at what I have so far and point me to some existing typefaces or lettering that evoke this "style" so I may reference them to perfect the whole thing!<br>
    I would also love some general feedback and guidance if people are willing to share it!<br>
    Thanks!<br>
    James</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fiftyfifty_6028.png"></div><p></p>
