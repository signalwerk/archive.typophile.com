    html: <p>If this person wants it to be readable, and suggested Arial, they don't know much about text and readability. With its relatively closed counterforms, Arial tends to be harder to read by those with poor eyesight than, well, lots of things. If you and he are convinced that a sans serif is the way to go, use a more humanist sans with more open counterforms. Frutiger and Myriad come to mind, but there are many other choices. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>If this person wants it to be readable, and suggested Arial, they don't know much about text and readability. With its relatively closed counterforms, Arial tends to be harder to read by those with poor eyesight than, well, lots of things. If you and he are convinced that a sans serif is the way to go, use a more humanist sans with more open counterforms. Frutiger and Myriad come to mind, but there are many other choices. <br> <br>Regards, <br> <br>T</p>
