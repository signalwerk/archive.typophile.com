    html: <p><i>and it's due to the confounding of legibility/deliberative_reading versus readability/immersive_reading.</i> <br> <br>No, Hrant, it�s not. Arial is simply not a very legible typeface, whatever conditions you test it under. Even with familarity (because it�s on everybody�s computer) on its side, it would test badly against a lot of other faces, given the same conditions. It is obvious that it�ll look better at 9pt on screen than Times. But that doesn�t mean Times is a bad typeface, nor does it mean that Arial is a good one. If you compared Arial on screen to Lucida or Verdana or a few other, well-hinted Sans faces, they would come out miles ahead. And then you see some of the test pages, and they�re testing white-out-of-blue lines of 140 characters! In the end they tell us that users prefer reading wider lines to narrow columns. Of course they would, if the choice is straining your eyes along a long line or scrolling down to the floor. If these people had only the slightest idea that typography is an integrated application, and that you cannot separate type from space from contrast from colour, they would find out that things people find easy to read haven�t changed very much since the 1400s.</p>
