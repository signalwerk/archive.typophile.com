    html: "<p>A couple of things came to mind as I read your post: <br> <br>- Arial is not a great choice for body copy. For the kind of longish stories that a newspaper typically carries, a serif typeface is generally considered a better (more readable) choice. Times New Roman started life as a newspaper \"font\" -- if your type options are limited, pick Times over Arial. <br> <br>- If the senior paper is also a tabloid, then a 3-column layout may yield columns that are too wide for comfortable, quick reading. Even with the larger type size you're proposing, a 4-, 5- or even 6-column approach might work better. <br> <br>- Are you familiar with the Society of Newspaper Designers? Among other things, they publish a design annual that might be a good source for inspiration. <br><a href=\"http://www.snd.org\" target=\"_blank\">http://www.snd.org</a> <br> <br>- Mario Garcia is a well-known newspaper designer who recently published a book on the topic called \"Pure Design.\" Lots of basic, useful information. <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0972469605/qid=1098684488/sr=1-1/ref=sr_1_1/104-0823421-5853518?v=glance&amp;s=books\" target=\"_blank\">http://www.amazon.com/exec/obidos/tg/detail/-/0972469605/qid=1098684488/sr=1-1/ref=sr_1_1/104-0823421-5853518?v=glance&amp;s=books</a> <br> <br>- Workflow tips: Before you start production on the first issue set up style sheets and master pages for the publication. Consider having all of your text (heads, decks, etc.) use leading that is a multiple of the body copy's leading, and have everything snap to the baseline grid. (This can be set up as part of the style sheet.) <br> <br>Hopefully some of the other publication designers that frequent these parts will chime in with more suggestions. Good luck!</p>"
    html_clean: "<p>A couple of things came to mind as I read your post: <br> <br>- Arial is not a great choice for body copy. For the kind of longish stories that a newspaper typically carries, a serif typeface is generally considered a better (more readable) choice. Times New Roman started life as a newspaper \"font\" -- if your type options are limited, pick Times over Arial. <br> <br>- If the senior paper is also a tabloid, then a 3-column layout may yield columns that are too wide for comfortable, quick reading. Even with the larger type size you're proposing, a 4-, 5- or even 6-column approach might work better. <br> <br>- Are you familiar with the Society of Newspaper Designers? Among other things, they publish a design annual that might be a good source for inspiration. <br><a href=\"http://www.snd.org\" target=\"_blank\" class=\"link-external\">http://www.snd.org</a> <br> <br>- Mario Garcia is a well-known newspaper designer who recently published a book on the topic called \"Pure Design.\" Lots of basic, useful information. <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0972469605/qid=1098684488/sr=1-1/ref=sr_1_1/104-0823421-5853518?v=glance&amp;s=books\" target=\"_blank\" class=\"link-external\">http://www.amazon.com/exec/obidos/tg/detail/-/0972469605/qid=1098684488/sr=1-1/ref=sr_1_1/104-0823421-5853518?v=glance&amp;s=books</a> <br> <br>- Workflow tips: Before you start production on the first issue set up style sheets and master pages for the publication. Consider having all of your text (heads, decks, etc.) use leading that is a multiple of the body copy's leading, and have everything snap to the baseline grid. (This can be set up as part of the style sheet.) <br> <br>Hopefully some of the other publication designers that frequent these parts will chime in with more suggestions. Good luck!</p>"
