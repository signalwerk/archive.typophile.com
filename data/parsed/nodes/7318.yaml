    html: <p>The "official" Arial recommendations are indeed not surprising, and it's due to the confounding of legibility/deliberative_reading versus readability/immersive_reading. And although typographic practioners don't [seem to] have enough answers either, one thing they can certainly do is alert the field scientists that something is very wrong. These two worlds are what some of us have been trying to reconcile, to fuse together what they know best; the best attempt so far was this year's Thessaloniki conference. <br> <br>hhp</p>
