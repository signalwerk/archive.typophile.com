  html: <p>Hi all new to the forums here looks like a great resource!  I will tell you all a little about myself. <br> <br>I just got started doing layout for a small town newspaper.  Its tabloid size paper and it runs 20 pages.  I am fairly new to newspaper layout and I am into my fifth issue now but I am loving the learning process.   <br> <br>So now I have a contract with a non-profit organization to do a monthly senior paper. "Supposedly" I am working with a man that will deliver all of the copy and pictures to me at or near the end of the month and then all I do is the layout.  Seeing the will be the first issue that remains to be seen. <br> <br>So when we had a meeting he mentioned that he would like to see a 3 column format.  Instead of a 4.  I also suggested arial font because old people will need to easily read it. I was thinking something larger like 12 point. He also said he would like to run at least 26 pages. <br> <br>So I guess I am looking for some work flow tips, maybe some suggestions on paper layout anything really. <br> <br>This is my first post here so if I left anything out please dont hestiate to respond. <br> <br>Oh ya I use InDesign CS for my layout program.</p>
  html_clean: <p>Hi all new to the forums here looks like a great resource!  I will tell you all a little about myself. <br> <br>I just got started doing layout for a small town newspaper.  Its tabloid size paper and it runs 20 pages.  I am fairly new to newspaper layout and I am into my fifth issue now but I am loving the learning process.   <br> <br>So now I have a contract with a non-profit organization to do a monthly senior paper. "Supposedly" I am working with a man that will deliver all of the copy and pictures to me at or near the end of the month and then all I do is the layout.  Seeing the will be the first issue that remains to be seen. <br> <br>So when we had a meeting he mentioned that he would like to see a 3 column format.  Instead of a 4.  I also suggested arial font because old people will need to easily read it. I was thinking something larger like 12 point. He also said he would like to run at least 26 pages. <br> <br>So I guess I am looking for some work flow tips, maybe some suggestions on paper layout anything really. <br> <br>This is my first post here so if I left anything out please dont hestiate to respond. <br> <br>Oh ya I use InDesign CS for my layout program.</p>
