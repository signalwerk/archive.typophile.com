    html: <p><i>he would like to run at least 26 pages</i> <br> <br>How would you do that? Unless you can print single, 2-sided sheets, newspapers, especially tabloids, are made up of spreads printed front and back and folded in the middle. The total page number does therefore have to be a multiple of 4. If the printing press can print 2 of those signatures at the same time, they would be folded in the middle and trimmed in the press (it you�re printing web rather than sheet offset), making 8 pages the minimum book. 3 of those books would make 24 pages, etc.</p>
