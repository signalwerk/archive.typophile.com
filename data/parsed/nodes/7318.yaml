    html: "<p><i>surprisingly, the RNIB recommends Arial</i> <br> <br>Not surprisingly. That is all they know, just like most of the recent testers. As long as legibility tests keep comparing Arial to Times, the poor readers won�t be any better off. Don�t forget: you are comparing shite against shite. Times was good for newspaper printed letterpress, 70 years ago. Arial has the birth defect of being Helvetica�s illegitimate twin (same widths, different face). The last decade or so has brought many amazing new typefaces which have all benefited from both better technology and improved understanding of legibility on our side (the type designers, that is). If the Royal National Institute for the Blind (not everybody may know the abbreviation) would do their work properly, they would ask experts from outside the narrow world of Window-nerds.</p>"
