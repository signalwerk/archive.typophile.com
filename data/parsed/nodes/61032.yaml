    <p>Hi,</p>
    <p>Has anyone succeeded in defining the fields for sample text (ID 19) in the name table and have it successfully validated by Font Validator?</p>
    <p>It appears that when any arbitrary string is defined in the Macintosh part of that field (19 1 0 0), Font Validator will give the following error: "E2015 The sample string contains a character that is not mapped in the font name string(1, 0, 0x0000, 19), character at index 0 is not mapped."</p>
    <p>Looking at this error I get the impression that Font Validator expects the sample string to be identical to the font name? But this contradicts what the name table spec at <a href="http://www.microsoft.com/Typography/otspec/name.htm" title="http://www.microsoft.com/Typography/otspec/name.htm">http://www.microsoft.com/Typography/otspec/name.htm</a> says: "ID 19 Sample text; This can be the font name, or any other text that the designer thinks is the best sample to display the font in."</p>
    <p>I checked the name table of the generated font file with spot to see if something else strange has happened during the generation of the font -- specifically the first character of that field -- but nothing...</p>
    <p>Thanks in advance,</p>
    <p>-Paul van der Laan</p>
    <p><a href="http://www.type-invaders.com" title="www.type-invaders.com">www.type-invaders.com</a></p>
