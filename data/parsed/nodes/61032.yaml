      <p><cite>I’ll make some extra dumps from the tables to check this. But it seems strange that this error already occurs with a sample string of “abc” in a fully functional font, right?</cite></p>
      <p>Yes, that's what I'm getting at.</p>
      <p>But just to be clear: the rule that Validator purports to be following is to check that the characters in that string are mapped <em>in the cmap subtable corresponding to the string's platformID and encodingID</em>. So simply having the glyphs present in the font is not enough; for a Mac (platformID 1, encodingID 0) name string, they need to be mapped in a cmap subtable with platformID 1, encodingID 0. So if such a cmap subtable were not present or did not map those glyphs with the character codes in the 'name' string, that error could occur (and <strong>not</strong> be considered a bug in Validator).</p>
      <p>But assuming you do have an appropriate cmap subtable that corresponds to the 'name' entry, I suspect the nature of the Validator issue might be something like an error in converting text encodings between the name string to the cmap or something like that (e.g. assuming Unicode/UTF-16 but finding MacRoman,single-byte). That is really just a guess though. There are probably lots of ways that could get messed up :-)</p>
