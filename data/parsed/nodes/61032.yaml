      <p>We don't normally define name ID 19 strings for any platform, but I just tried a test and was able to make a font with a Mac name ID 19 string, which successfully validated.</p>
      <p><cite>Looking at this error I get the impression that Font Validator expects the sample string to be identical to the font name?</cite><br>
      I am pretty sure that's <em>not</em> what it means. My understanding is that FontValidator expects all of the characters in sample text string to be mapped in the 'cmap' of the font, as I think the original idea for the sample text string was to render the string using the font where said string resides.</p>
