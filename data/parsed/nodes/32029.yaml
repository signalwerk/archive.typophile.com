      <p>Hrant:</p>
      <p>I really cannot recall just what it was that made me stop and LOOK at Monticello. I was not at 14 altogether ignorant of type, but nearly so. I had been given a cheap toy cylinder press when I was about 7, and I used its cheesy rubber type through junior high school, printing billheads for my "Newark Evening News" paper route. &amp; I used to pore over my aunt's Heritage Club books, paying special attention to the little folders she kept with them, fascinated by colophonic nuggets about typefaces, printers, and papers. &amp; I had been in enough printing shops to have been captivated by the siren sounds of Linotypes and printing presses. Those were my favorite industrial places.</p>
      <p>But this Monticello face stopped me dead. I guess by that time about a dozen volumes of Jefferson's papers had been printed, and I encountered the face in one of them, as I read for a history project. Perhaps it was the design of the Princeton volumes, more sedate than those in Heritage Club books, that also attracted me. Or better presswork than was common in books a bookish boy might read back then. Who knows? Those days are long ago and misty. I know that I saw something good. I recall the sensation as strongly as I recall the first Duane Eddy records. &amp; the first Ornette Coleman records a few years later.</p>
      <p>&amp; Monticello seems to have pre-figured something of my taste in type. As soon as I became an apprentice compositor I discovered Bell and Baskerville, and, when given a bit of rein to make type choices I gravitated in those directions. Bulmer, too, attracted me, but a bit less. Scotch Roman never caught my eye until M Carter's Miller, which is now nearly my "house type."</p>
      <p>Or maybe it is in the blood. My mother's family came to these shores early, from Scotland, and indeed settled near to where Jefferson made his home at Monticello. When I first went to college that was in Scotland County.</p>
      <p>&amp; I do think of myself as a rather down-to-earth guy. I started this reply Friday afternoon, but the weather was so good I left work early to work in my garden: a rather Jeffersonian pursuit.</p>
      <p>That's all I know about it.</p>
      <p>powers</p>
