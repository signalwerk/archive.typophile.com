      <p>I don't know about the rest of you, but I weekly offer thanks to Creesy, Carter, et al for giving Monticello to us again. This is the type that started me thinking about letters when I was about 14, many years ago. When I saw the Linotype version I knew I was seeing something different than what I had been reading before. The face "spoke" to something in me, something beyond the voracious reader I was then. It opened my eyes so I could begin to see what words and lines were made of. &amp; here I am today. &amp; to this day I find it an admirable type.</p>
      <p>powers</p>
    html_clean: |-
