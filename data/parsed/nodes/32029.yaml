  html: "<p>Chuck Creesy has an article  \"Monticello: The History of a Typeface\" in <cite>Printing History</cite> 49 (Volume 25, No. 1). It is a nice write up on the several revivals of a font family from Binny &amp; Ronaldson, America's first (successful) type foundry. Also some of the story about C. H. Griffith's and P. J. Conkwright's collaboration of bringing out Linotype Monticello, and the latest revival by Matthew Carter.</p>"
  html_clean: "<p>Chuck Creesy has an article  \"Monticello: The History of a Typeface\" in <cite>Printing History</cite> 49 (Volume 25, No. 1). It is a nice write up on the several revivals of a font family from Binny &amp; Ronaldson, America's first (successful) type foundry. Also some of the story about C. H. Griffith's and P. J. Conkwright's collaboration of bringing out Linotype Monticello, and the latest revival by Matthew Carter.</p>"
