      <p>I recently got my hands on the article, and am almost finished reading it, but had a question that I couldn't wait to ask: on page 18 there's mention of a face used by John Bell called "English Roman", and it sounds fascinating. But I wonder if this is this the Bell typeface that we know, or something else?</p>
      <p>hhp</p>
