      <p>I'm going to second Hrant's suggestion that a more formal education setting will benefit you more than an internship, and the MA at Reading would be your best option in terms of the Indic expertise of faculty members and the extensive non-Latin archive. You might also look into their two-week Type Design Intensive summer programme as a taster.</p>
      <p>With regard to your Devanagari design, I think it displays a number of problems with letter proportions and weight displacements. While you would likely learn some things about curve quality and technical processes in an internship, you'd be unlikely to get training of specific relevance to Devanagari.</p>
