    html: |-
      <p>Oh boy. Can't ignore a direct question...</p>
      <p>I think the most gracious way I can put it is this: if you want to quickly become qualified to make fonts in their style then the KABK program seems to work like magic. It's just that to me personally that sort of goal in life seems too formulaic; if you're young and influentiable you might never be able to get out of that groove... I prefer a more ideologically "errant" educational style, one that doesn't assume one year is enough. That style seems to be present at Reading - I regularly hear how the teachers try very hard not to direct the students <em>too</em> much, and you can see it in the eclectic set of fonts that come out of their program. I guess I value the process more than the results, because to me a <em>student</em> is supposed to have new worlds opened up for him, as opposed to merely making nice things. Another thing I value is non-Latin design, and KABK is pretty weak in that area, at least compared to Reading.</p>
      <p>Caveat: Except for a guest lecture I gave at Reading last year my only real exposure to their program or the one at KABK has been through observation of the resultant fonts, but also many years of discussion with their respective teachers and students.</p>
      <p>hhp</p>
