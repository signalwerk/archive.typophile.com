  html: "<p>Another faux-japanese face.  <br> <br>&gt;&gt; I saw a magazine that used a 'faux-japanese' face in its heds, but I can't remember the name. Fader? Vice? Anyone spot anything like this? <br> <br>&gt;&gt; I would like to humbly submit a prediction that these types of faces (done better than this!) will become de rigeur in 2002. Can anyone point me to a font for sale in this category? <br>&gt;&gt; I'm going to try to perfect a family of faces in this category. Maybe 'complete' is a better word. Any suggestions? <br> <br>bj <br> <br> <br><!---Attachment: japanorama.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/attachment_icon.gif\" align=\"LEFT\" alt=\"application/x-macbinary\">japanorama.swf<br><a href=\"http://www.typophile.com/forums/messages/29/japanorama.swf\"><b>japanorama.swf</b></a> (25 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
