    <p>Hi there,</p>
    <p>I guess if someone in the forum could send me a scan of the cyrillic equivalent of the Johnston's "Fundational" hand or a similar humanistic model. You know, one if those pages showing each stroke with numbers... I have mostly typographic examples or ancient manuscripts photos. I need something to practice at home.<br>
    If you can recommend me an good an available cyrillic calligraphy book, it would be also very nice.</p>
    <p>Cheers.</p>
    <p>Ramiro.</p>
