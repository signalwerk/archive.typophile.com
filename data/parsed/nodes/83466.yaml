      <p>Thanks Andrijko and Hrant for the good stuff you shared.</p>
      <p>I also would like to share the samples Vera Evstafieva just sent me. I think they are great and fill a gap. It is difficult to come back to calligraphy trying to use **modern** post Civil Reform letters because they were quite 'artificial' and broke connection with written forms.<br>
      But Vera developed a very didactic and consistent model to teach her students. I find it also very beautiful.</p>
      <p>She allowed me to share it here, but please, mention the author if you use it in any way. If you want to reproduce it also ask Vera.</p>
