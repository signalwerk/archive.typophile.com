    html: |-
      <p>Ramiro, ‘Cyrillic equivalents of the Johnston’s “Foundational” hand or a similar humanistic model’ do exist. However, to me, and to many other users of Cyrillic, most of them look and feel decidedly <a href="http://www.callig.ru/img/samples/bogdesko/bogdesco-foundational.jpg" rel="nofollow">unauthentic</a>. It’s just that the revival of italic handwriting, the way it is known in the West, never took root in the Cyrillic-using lands. After all, there was nothing to revive: Cyrillic italic emerged only in 1730s as a <em>printing type</em>, complementary to roman—not as a formal, or informal, writing style. In the 20th century there have been quite a few attempts to acculturate the Cyrillic-based broad-nib calligraphy at a steady stress angle. Among its proponents were Villu Toots, Hildegard Korger, Ilya Bogdesco, Jovica Veljović, and many others. <a href="http://www.scribd.com/doc/54037599/Russian-Calligraphy" rel="nofollow">Leonid Pronenko</a> and <a href="http://calligraphy-expo.com/rus/about/Reports/VideoLessons.aspx" rel="nofollow">Petro Chobyťko</a> are still working very hard on that. You can also find some interesting examples on <a href="http://tipometar.org/kolumne/IndexEng.html" rel="nofollow">tipometar.org</a>.</p>
      <p>I find it significant that the samples you’ve posted here are in fact showings of the conventional <em>typographic</em>, not flowing, cursive forms—just rendered with the broad- and pointed-nib pens. </p>
      <p>Speaking of the real-life pointed-pen handwriting. The style that was indeed dominant in Cyrillic penmanship, and taught in all schools, is this:</p>
      <p><img src="http://pics.livejournal.com/m_zhukov/pic/0004wqz9"></p>
      <p>Incidentally, Yuri Gordon’s book is not about calligraphy or handwriting.</p>
