      <p>first, i would say NOT to have a resume be longer than two pages, for the design fields it can look a bit amateurish. also, picking a typeface isn't just about what you think looks nice, it is about what typeface best reflects you and your work. for example, what type of work do you want to do (corporate, fun, bands, movies, etc...)? i don't think anyone can tell you what typeface to use because its very personal.</p>
      <p>secondly, although i'll go as far as saying i think its too much to use more than ONE typeface...some will say its okay to use more than that. i personally stick with one typeface and go with different weights and variations of the same face (ie, frutiger bold, frutiger roman, frutiger light, frutiger italic).</p>
      <p>really there are no rules, just make it look right.</p>
