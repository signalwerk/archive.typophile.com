    <p>Hi there. Since i'll soon be done with my BA hons Multimedia Arts in a few months, its time for me to start floating my resume around :D.</p>
    <p>Being relativey new to typography, I'd love to have some of your opinions and suggestions on choosing fonts for a 2 page resume for a guy with a year's experience, type which is humble, non-submissive and truthful :).</p>
    <p>I really don't know much about typography so please pardon me if I do say something silly :o!</p>
    <p>As of now I'm considering Helvetica Black, Shannon Book, Stone Sans, Myriad Pro, Cochin,   Stempel Garamond Roman and even Frutiger 55 Roman.</p>
    <p>Is it ok to have three fonts for the heading, sub-heading and the text or should I just stick to two?</p>
    <p>Looking forward to your suggestions and opinions :D.</p>
