    html: <p>Your problem isn't about how your résumé looks, its about content. Use something as bland as Times Roman. Keep it short and have your portfolio on-line with a link to it in the text. You have to think about the hiring process. Their is a screener to kill the first 100 applicants and narrow it down to a few. No design will affect these type of people.</p>
