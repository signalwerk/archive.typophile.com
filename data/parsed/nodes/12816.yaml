      <p>From my experience at work..I'm allowed to use 2 fonts in 3 sizes total per design. For a resume I would use the same font (different weights like suggested in previous post) I cant use two different serifs or san serifs in the same design. I mix a fancy original serif or script with a more plain serif like futura. I usually allow about 3-4 pts of size in between titles,subtitles and info like addresses on business cards or letterhead. For a resume you could use 10pt for info 12 for subtitles and 14 for your name. I would suggest exploring all the different weights in Frutigar..it's a great font with allot of options. My best advice is to keep it clean and simple and maybee put a nice logo at the top to represent yourself. Some people say a logo is even too much but I think it's helped me find work and gives it an original touch without having to spend too much time with fancy type. Good Luck</p>
      <p>***Shannon looks like a conservative comic text, its the most original looking to me out of all the ones you listed.****</p>
