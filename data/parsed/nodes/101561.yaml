    <p>For about 30 years, I researched the original design that was imitated and popularized by Mr Eliyahu Koren (may he rest in peace). See <a href="http://en.wikipedia.org/wiki/Eliyahu_Koren" title="http://en.wikipedia.org/wiki/Eliyahu_Koren">http://en.wikipedia.org/wiki/Eliyahu_Koren</a> for detail about his life.</p>
    <p>Koren (Hebrew: אליהו קורן; July 23, 1907 — February 17, 2001), of the original Koren Publishing House, was a noted Israeli type designer in the fifties and sixties. But he did not produce many original typeface designs. As such, Koren really was not "a master typographer", although he definitely was a great type technician. I don't even feel that he was an outstanding graphic artist, the likes of the late wonderful graphic designer, Mr. Tzvi Narkiss, or the late phenomenal Mr. Isamar David. David, and less so, Narkiss, were great Jewish type designers. But the greatest, in my professional view was Mr. Henri Friedlander, who Ifotunate to be taught from.</p>
    <p>Koren studied in Nuremberg, Germany. He later immigrated to Palestine in 1933. Koren was employed as the director of the graphics department of Keren Kayemet, the Jewish National Fund, from 1936 to 1957. Please post his works from that period, as I am only familiar with classic Koren typeface, originally long before he was born, and the mediocre design he create for his Jewish prayer book. Each time I see it, I cringe, and can not believe a great person as he created it. Perhaps, Koren is larger than life.</p>
    <p>Koren founded Koren Publishers Jerusalem in 1961. His company published the Koren Bible in 1962. "He published the Koren Siddur in 1981, and various religious texts until his death."</p>
    <p>Koren really was a poor designer, but an outstanding researcher. Mr. xxx Guttman's version of the reflects brilliance and originality, but Guttman was a humble religious and didn't pursue his greatness in the Israeli courts against the inheritors of the Koren Publishers Jerusalem, Had he acted as Narkiss, and brought a massive suit against KPJ, there would be word today by them to dishonor Guttman's memory.</p>
    <p>For that token, I releasing Kesser(TM) which is a derivative of my older design called Crown. I decided to incorporate Guttman's brilliant innovations in his version of the same design that Koren used as the basis of his cloned design. In addition, Kesser contains other innovations, and is subject to US Copyright (I registered it at the Library of Congress in Washington, signed by the State of Israel in the International  Convention (see <a href="http://www.wipo.int/wipolex/en/text.jsp?file_id=128063" title="http://www.wipo.int/wipolex/en/text.jsp?file_id=128063">http://www.wipo.int/wipolex/en/text.jsp?file_id=128063</a>). If there is a lawsuit, I will countersue in US Federal Court in Brooklyn, and cite as a precedence the case of Adobe versus Swifte, which Adobe won, citing my correspondence with the US Copyright Office, which I won. </p>
    <p>What are the remarkable innovations?</p>
