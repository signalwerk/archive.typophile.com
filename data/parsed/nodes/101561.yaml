      <p>Let's look at the letter Aleph of Koren, Guttman's version, and my Kesser.</p>
      <p>Koren<br>
      See <a href="http://en.wikipedia.org/wiki/Koren_Type" title="http://en.wikipedia.org/wiki/Koren_Type">http://en.wikipedia.org/wiki/Koren_Type</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/aleph_4291.jpg"></div><p></p>
      <p>Guttman's</p>
      <p>See <a href="http://www.typophile.com/node/76489" title="http://www.typophile.com/node/76489">http://www.typophile.com/node/76489</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/aleph_g_5989.jpg"></div><p></p>
      <p>They look alike, right?<br>
      But there are some subtle differences between them.</p>
      <p>Look at middle diagonal bar.<br>
      The top and bottom have very important improvements, which is lacking.</p>
      <p>The top is better curved, with a smoother transition from the curve at the top to the body of the middle stroke. Look at the bottom! The eye gently reaches the bottom, in Guttman's design, but ends abruptly on the top tip of the bottom.</p>
      <p>Now, look at the bottom or third lower piece of the aleph.</p>
      <p>Koren's ends again poorly, abruptly, and inconsiderate of the viewer's eye. Do you see that?</p>
      <p>I decided to incorporate Guttman's great improvements in the lower two strokes, and introduce another advantage in the top stroke as well.</p>
