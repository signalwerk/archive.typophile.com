    <p>SUDTIPOS /// NEWS /// 03.08</p>
    <p>We are proud to announce the release of Calgary Script<br>
    <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000326" title="http://www.veer.com/products/typedetail.aspx?image=UMT0000326">http://www.veer.com/products/typedetail.aspx?image=UMT0000326</a></p>
    <p>About Calgary Script</p>
    <p>It was inspired by the brush script on a “Welcome To Calgary” sign located in, you guessed it, Calgary, Canada. Now that the typeface is finished, it’s evident that Calgary Script was highly influenced by the many books on American sign painting I have absorbed over the years. The overall effect feels graphically slick, like something out of the early 1980s, but still hearkens back to a few decades earlier. Impressive caps and a free-flowing lowercase make for a speedy, determined, and instinctively organized typeface. Foremost a packaging font with a true supermarket spin, Calgary Script is chock full of OpenType features including ligatures, alternates, and ordinals designed specifically to follow numbers.</p>
    <p><a href="//www.sudtipos.com" title="//www.sudtipos.com">Http://www.sudtipos.com</a></p>
