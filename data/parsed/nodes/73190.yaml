      <p>I did those Avant Garde variations for W Magazine. </p>
      <p>Following the AD's direction some glyphs were redesigned, the lowercase was re-proportioned, additional weights were added and all of those old uppercase ligatures were redesigned.</p>
      <p>James</p>
