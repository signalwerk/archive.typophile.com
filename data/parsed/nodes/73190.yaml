      <p>Not Avant Garde. None of the various published versions of Avant Garde have a closed R at this weight. However, Mostardesign has recently published Sofia, a family by Olivier Gourvat which, on first look, seems to be a revival of Avant Garde with certain characteristic changes; for example, the Sofia R has a closed counter throughout. Comparing PREMATURELY PLASTIC in Sofia Extralight or Thin appears to match your sample here.</p>
      <p><a href="http://new.myfonts.com/fonts/mostardesign/sofia/" title="http://new.myfonts.com/fonts/mostardesign/sofia/">http://new.myfonts.com/fonts/mostardesign/sofia/</a></p>
      <p>-NJ</p>
