    html: "<p>There IS a gap in the line up of available AvantGarde-like geometric sanses: I just did an Identity Programme where the client wanted something like AG with some Century Gothic sensiblities. I ended up adapting a Chalet-version -- thickening it, new t, new ij diphtong, and a lot of other fiddling around. For 14 glyphs…</p>"
