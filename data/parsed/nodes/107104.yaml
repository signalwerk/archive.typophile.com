    <p><strong>A rare Zapf masterpiece, newly digitized</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/orbis_sample_3708.png"></div><p></p>
    <p>Hello, typophiles! I'm proud to share a project that I've been working on for over a year, with the assistance of Hermann Zapf and Philip A. Metzger. I've digitized a somewhat obscure work of Zapf's, a collection of elaborate letterpress broadsides that serve as type specimens, and made them available for online viewing and as high-res, press-quality images for download. Please check out the website and let me know what you think. The press release is below.</p>
    <p>— Josh</p>
    <p><strong>ORBIS TYPOGRAPHICUS: A Complete Digital Facsimile</strong><br>
    A project by Joshua Langman<br>
    <a href="http://www.orbistypographicus.com" title="www.orbistypographicus.com">www.orbistypographicus.com</a></p>
    <p>A rare Zapf masterpiece can now be seen online, just in time for his 95th birthday.</p>
    <p>Orbis Typographicus is a rare set of letterpress broadsides created by world-renowned type designer Hermann Zapf, in collaboration with Philip L. Metzger of Crabgrass Press, between 1970 and 1980. The entire set has now been published digitally by Joshua Langman, representing the first time the collection has been reproduced — in any medium — since the original edition of nintey-nine copies.</p>
    <p>With Professor Zapf's encouragement, Langman has scanned the entire set of twenty-nine broadsides and made the images available for free on a dedicated website, where the pages may be viewed and downloaded as press-quality 1200 dpi images. This rare work from a widely acclaimed master in the field can now be seen for the first time by those who may not be lucky enough to have access to a hard copy.</p>
    <p><a href="http://www.orbistypographicus.com" title="www.orbistypographicus.com">www.orbistypographicus.com</a></p>
    <p><strong>About the Broadsides</strong><br>
    Orbis Typographicus&nbsp;(“The Typographic World”) is a set of twenty-nine 9 × 12 letterpress broadsides, designed by Hermann Zapf and printed by Philip Metzger of Crabgrass Press between 1970 and 1980. The broadsides feature quotations on art, science, nature, faith, and the human condition, from authors ancient and contemporary. The text includes poetry, prose, anagrams, and palindromes, in English, German, Spanish, French and Japanese. Hand set by Philip Metzger, the set pays tribute to worthy “Thoughts, words and phrases on the Arts and Sciences” through Zapf’s unconventional and ingenious use of typography. Orbis Typographicus&nbsp;functions both as a work of literary wall art and as an elaborate type specimen, showcasing many of Zapf’s own faces, as well as those of his wife, Gudrun Zapf von Hesse.</p>
    <p><strong>About the Website</strong><br>
    Langman's new digital home for Orbis Typographicus features high-resolution scans, available for download, and a complete computer-searchable transcript. The website also features a specially written essay by Philip A. Metzger, the son of the printer, in which he shares his recollections of his father working on the project. The site will officially launch on 6 November 2013, the week of Zapf's 95th birthday.</p>
    <p><strong>About Joshua Langman</strong><br>
    Joshua Langman is a freelance graphic designer and typographer based in New York. He discovered Orbis Typographicus by accident four years ago, fell in love with the collection of typographic broadsides, and wanted to share them with others. He built <a href="http://www.orbistypographicus.com" title="www.orbistypographicus.com">www.orbistypographicus.com</a>, with Hermann Zapf's encouragement, to make his work more accessible to typophiles, calligraphers, letterpress enthusiasts, and anyone with a passion for the printed word.</p>
