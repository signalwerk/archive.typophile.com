    html: <p>Just resurrecting this thread to note that the Orbis Typographicus site (<a class="freelinking external" href="http://www.orbistypographicus.com" rel="nofollow">orbistypographicus.com</a>) now supports Retina displays and other similar high-resolution (&gt; 72 ppi) monitors. Each of the images on the site has been exported anew from the original scans, and the extra pixels (c. 220 ppi) make a big difference in capturing the sharpness of the printing on screen. And of course the press-quality 1200 dpi files are still available for download in case even Retina resolution doesn't cut it.</p>
