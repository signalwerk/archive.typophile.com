      <p><em>No, you said something like “a new aeshetic” has been forced, same thing.</em></p>
      <p>Nope. I don't think I said that either. What I do remember saying, and what one can find me saying if one bothers to search, is that the MS ClearType Font Collection represents the approaches of several different type designers to the briefing to design fonts specifically to work with ClearType. I also said that I didn't consider any of them to be the last word on the subject.</p>
      <p><em>(I don’t have a typographic term for it, because no one else has decided on cramming more “points” into an inch, what do you call this?</em></p>
      <p>Yes, I got that, I'm just wondering to what specific action of Microsoft's you are referring, i.e. what did they do and when?</p>
      <p>You wrote above that you know your 10pt Concert on the Mac is within half a pixel of actual 10pt size, but I'm not sure how important that is. But maybe that's just because I've spent almost my whole computing life on Windows machines. I tend to think of point size as a specification for size of type on paper, and I have long since ceased to expect text on screen to be 1:1 size with type on paper when both are e.g. nominally 10pt. A half pixel rounding difference at 10pt is also a variation between screen and print.</p>
      <p>I was pleased to see my email app specifying screen text sizes in pixels and allowing me to set my display resolution, i.e. to see an application from which I am almost never going to print anything treat type as a screen medium and not make any reference to point size. This is much preferable to the many applications that force an integer point size choice that skips the ppem size I actually want to use. But lack of support for fractional point sizes is another issue...</p>
