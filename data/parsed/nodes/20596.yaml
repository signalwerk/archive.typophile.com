    html: |-
      <p>M. Duggan Spanketh: "...that is a seriously bad looking font, "</p>
      <p>For those of you who might wonder at Mike's post, he's pissed at me for telling another forum (a MS one at that), that he called them "all morons" for questioning the wisdom of converting the once nearly standard points-per-inch into a "variable", (and one MS has not described). But, I apologize, I'm sorry, and I give Mike free reign to start a smear and bad-type witch-hunt. I can handle it, completely. Can you?</p>
      <p>On my post the individual pixels of this precious font are exactly where I and the client want(ed) them, sorry. The leading is mine and reflects my reading skills (the client got more). But Mike, those are all "tree" issues only "appreciated" in zoom. Maybe they are even "leaf" issues, but that... depends on the scale factor. ;)</p>
      <p>You, Mike-rosoft, have forest issues you are politically and intellectually prevented from facing. Canadra e.g., is a beautiful outline, stunning even, probably the one I'd most likely use in print, if it were made for that. But the x-ht. region (9 p @ 17 a pixel em according to John's post-it-note, sans-zoom), is so ham-fistedly flattened by your (?) hints, (to the same 2 pixels as my wee font's 5 pixel x-ht....!?), that I wonder if you're trying to emulate smeared 1980's dot matrix printers. Are you?</p>
      <p>The outline shows consistent strokes and spaces, the branches of pdbqnmru, e.g., all nice and sweet, but by the time it's in John's specimen...they're just like Robert E. Lee's brother, Ug. The aerst, a substantial subset of our Latin use, are all poorly rendered from nice outlines, and the dot on the i is so low, (how low; it looks up to a snake) it's el-ing...</p>
      <p>Leaves, I know, but these are all Screen Typography 101. Maybe, Kevin can do a study: does a human see an i with no or distant dot better than an i with-dot-too close (in context only please, no tricks)? And, since leaves are your specially, so while you're at it, why not tighten up the hyphen so two will look more like an em dash when windows users need one?</p>
    html_clean: |-
