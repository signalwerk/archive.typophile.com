  html: <p>I used to use Arial (default) and then Helvetica Neue but since it's bad for copy I'm wondering what everyone else uses for an interesting font for emails. Also is their any particular reason you use that specific font? (is it just versatile, is that font significant to you for some special reason, etc.) Discuss!</p>
