      <p>Once again David also speaketh, in the usual cryptic language. Dave I am not pissed off, I just thought the font looked bad, hinting is supposed at its simplest level take care of symmetry issues such as the lowercase w and the shape of the y. You can tell me whatever you like in the most cryptic terms, you can tell me you wanted the w that way, ok. but I as an observer can disagree that I think it’s a good font for reading, I don’t like it, and I wouldn’t use it ever, and my criticisms of it still stand. I don’t understand any of your comments on Candara, possibly John might? When I compare Candara in CT to your font I see that the game is finally over. I mean come on, who is finally going to say, hey look the king David has nothing on....<br>
      It might be good for us to meet up sometime to discuss, as the forum here doesn’t help us progress methinks.</p>
