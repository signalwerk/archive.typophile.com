      <p>Prescript. This is a long post. If you get your type kicks from Jelly bean sized nuggets, this might be too much, so it's rated L. </p>
      <p>John, MS changed the definition of pts. per inch , according to Mr. Greg Hitchcock, in 1986. This did not have practical effect 'till MS went to outlines in the '89 TT adoption. It began to surface as a global issue in 1992, with the advent of the Internet, where the world-wide requirement for scaleable digital outlines became central to its rapid spread. It's effect on MS typography, and the Windows font spec for developers, began with Verdana, (2000?) where MS demonstrated the wisdom of piecewise non-linear scaling (what we call optical scaling), which helped greatly with MS' "other scaling" issue. The rest, (and I suggest you reread everything I've written in this, the CT Spec thread and MS CT collection release thread), is history-in-the-making. But, when one says, "I have to set it differently from the Mac to be the same size on the PC", you're lookin' at its most expensive chapter. When you look at the CT fonts, with their 6-8 pt mastering for 10-12 pt use, you're looking at a 100 million dollar(?) solution to a problem of MS's own cause. Once you're through recalibrating maybe you'll see that identical CT results, (just outlines of a slightly different philosophy, and users ***using actual points (1/2 pts. too) to select the size They like, usually from 10 or 12 pt masters made for the purpose***, and that this is all possible in a 72 pt. per inch Windows environment, no tricks...</p>
      <p>I don't know where you've been, actually, Mr. Tom Rickner and I have had conversations for, 15 years (?), trying to improve screen fonts on Windows (though we didn't much use Windows, we're conscientious to a degree... that, well it's an unexplainable Wisconsin thing). Those conversations all end with, "oh dang, you can't do that 'cause windows doesn't know point size from...ppppft". Ask 'im, he'll tell you, it goes just like that... So, the only two options I've "seen" are to get variations adopted, (and I know now, even though such an axis-of-e-swell's already been created once, if points are a problem to understand, a variation axis with values along it where.... "what this font Should look like @ a particular point size and resolution" are  occurring, as maybe way beyond discussing.</p>
      <p>The other solution, cajolery, I stopped trying after Prague atypi when the aforementioned Mr. Hitchcock, in the presence of Mr. Rickner, told me MS WAS using 72 points per inch in Longhorn. Maybe he meant it like a 6'2" person standing on a 12" box saying "I'm 7'2", I swear!", maybe HE doesn't understand that scaling the reported device resolution IS scaling points per inch. Maybe, he thought I said points per jinx, or lynx or prawns per finch. Who knows, but when "the white knight is talking backwards", well, Drastic methods, yawn, are called for...Slow Motion Public Discussion. IT matters, because — although the EM can be scaled linearly, because type does not fundamentally scale linearly, if you require it to do so for optimization of a Particular Thing in a particular range, you do so at the peril of other functionality — And, I told him so. </p>
      <p>So, while I would be thrilled to see Constantia being used for both the print and electronic versions of a publication, I would not recommend it. And, until recently, it has not been possible to use the same typefaces in print and electronic media without compromising either the readability or the attractiveness of one or the other, and I think, aside from the kind of clients mentioned above, that still goes. I've been through servicing the whole spectrum of this issue, from fonts that are smaller than those on windows, to fonts bigger than those that windows can host, and I'm not saying that the CT font collection is not great! It is! And, I'm not saying to make optimized text fonts for Windows is a bad idea. And, I'm not saying that if you want to make optimized text fonts for Windows screens you should "have to" make optimized Display fonts for Windows screens too, or that you should be forced to make fonts optimized for print text, or print display. I'm asking  — you guys have dug yourselves into this rabbit hole and you don't even know it?</p>
      <p>We Latin folk, we don't even have the smallest x-ht-like-thingy, (or the most complex demand for optical scaling!). And, the way things are now, you can't make an optimized Latin screen font for Mac &amp; Windows without a huge amount of BS, (if it is even possible?). You can't make a single master for web site text and print text on a single platform unless one or the other 1/2 of your client is a typopottiehead, and it goes on from there ad infinitum typonautica sans progresso until scaleable outlines are allowed to do what they were designed to do in the very first place, "know thyne own point size at all times." Then there is my fall fall fall fall fall fall back position, my Dunkirk, if you will as you may now understand things, which is to get MS to make one truly comprehensive mother-of-all type tuners for Windows users, ideally, without a variable for Points Per Inch, anywhere, but...</p>
      <p>*I do not wander around some infinitely complex typographic universe thinking this s__t up. I am building a screen font family (1997-pres.), along the lines of people's uses (formal, casual, harried, etc.), as opposed to along the lines for print text, (e.g. Ro. It. Bo. and B.I.), and it came time to sizing the whole thing to the em. When I was finished doing exactly what I wanted, the font was too small to compete on the Mac, (don't ask why I thought I'd put in swashes). So I made it Bigger. What this means in greater detail, is that I raised the caps on the em, giving less room for ascenders and other stuff above that I did really want, and I boosted the l.c. up essentially to my font Concert's height. Then, I looked around and found it WAS STILL TINY, compared to Verdana...Enter Concert.</p>
