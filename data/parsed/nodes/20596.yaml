      <p>Sorry to take so, and be so, long. Summer came. I went out. It was nice. I’m back. Not for long.  </p>
      <p>John’s in quotes.<br>
      “I can show you Candara at 10 ppem on Windows, but that makes the x-height smaller than your Concert. In order to match them one would need to go for 12 ppem. “</p>
      <p>No john, you don’t get a match for Concert 10 at 12ppm, it doesn’t work that way. Ironic... on my Mac, there are five sizes for email type in “Entourage”. Smallest, Smaller, Medium, Larger and Largest, although I think these actually can be represented by numbers that represent points. On Windows, in Entourage, are there names for the sizes? or numbers?</p>
      <p>“If you push the curve connections lower on the stems at that size, it stops looking like Candara.”</p>
      <p>Unless it’s about the outline, and not the typeface, it stops looking like Canadra with a 2:1 ratio of stem to hairline i.e. From 12 to 25, (reading range!), should’a made a Gothic. The point (at this late stage in the game), of your kind of sub pixel rendering in an inflated density-of-points-per-inch universe, I’d think... is to jump to a reading range where more or less than two pixel stems exist, as fast as possible...In fact, if you were cramming points and l.c. body building with that goal in mind...I’ll tell Mike in a minute...*</p>
      <p>“That stray black pixel is impossible to miss even when the pixels are as small as they are on my screen.”</p>
      <p>My little diagram (at “100%” ;) (Which I can’t attach because this crappy forum’s like that), shows how Verdana performs on the Mac (it doesn’t). If this were my product, I’d reject it before it got out the door. So, I adopted Concert, because ***it was the only face I know, or have seen anywhere... that matches Verdana as Verdana appears on a Windows machine***, which I like. Pause, look, and consider the qualities I had to reject. Y and y, (Verdana), look pretty good in the outline, but (at 9, 10 and 11 ppm), turn into a radiation symbol, and a u oganek (for the world)... And you’re worried about my wee pixels (just for me)? John, your typographic judgment, which I summarize below as “get used to it”, when looking at the broad needs of users or email users, is in a believe system I do not understand.  </p>
      <p>“Off white background colours, like off white paper stock, allowed me to keep up the brightness without the glare.”</p>
      <p>Back up dude, or get a better monitor. Mine adjusts minutely and by switching users as darkness grows, or when lightness comes, you have “options” that don’t involve experiments on your rods and cones. By options, I mean that type and user become more fluid than one hack after another to land in some spot...the screen is not just a book/note book — its a TV, a jukebox, a weather station, a telephone, a vending machine, a million different vending machines, a comic book and a house of worship. You gonna carry around little yellow tissues to stand on in all those places where CT goes?</p>
      <p>Then (and it’s a good thing I have a secret twin) Mike:<br>
      “David you like black and white bitmaps to read, and you like to have your characters badly shaped onscreen, what can be bad for you about that, you have everything you want.”</p>
      <p>I know, slam the man’s wart after giving him leprosy, I axed for it. See Verdana. See Verdana poop on the Mac? :) </p>
      <p>Mike, you could have done the same magnificent job on these and the CT fonts if you/MS had allowed you/ATR to do it without tricks. These fonts greatness begin where 2 pixel stems (of any color) begin, and lasts to where the xht. has become too big on the body. See, users prefer Verdana and Georgia! (that early study), ((((until they prefer Arial and Times at...14? 16? pt.)))) (what ever “pt.” means). That says a lot ya’ know — here are print fonts, beating screen fonts on the screen!      So, scaling the body has great effect, but as you know, or maybe not, you can’t tug on one end of This rug without moving the other. So, Verdana functions best in print as a small point size, not as a match of the use on screen, (or do you scale printed points too ˜˜#01(!*?). Arial and Times (and their genuine italics) are superior in print for their compactness in composition, for their better proportioned heights, and more favorably chosen contrasts. So, scaling the body (and other optical tricks for screen fonts), leads to a diminishment of the functional range. Adding the fact that CT does not deal in B&amp;W, you have a range of positive effect from 10 ppm till, who knows, but it’s finite beyond your wildest claims.</p>
      <p>Density is the second trick. (I don’t have a typographic term for it, because no one else has decided on cramming more “points” into an inch, what do you call this?). By adding significantly to the usual 72 points per inch, you almost insist on scaling the body larger to be successful at screen text sizes, you shift the location of the 1-2 pixel barrier down the point-size range, though not quite far enough*, and as screen resolution climbs the 1-2 barrier shifts even farther... then pffft what happens?)†.  Good Job. Now we can make text OR display faces for the screen. Or, we can cop an attitude like John’s, (which I highly disrespect), that users will “get used to” huge bodies, like they’ll “get used to” his mismatched companion italics in print? NOT my clients, sorry.</p>
      <p>There are lots of possible ways forward. But let me tell you “the one”, because I’ve seen it from MS before —Nothing will be said outside of the official party channels. I.E. There was no public help whatsoever when MS decided to change the name of Helvetica to Arial, with all the kluge work that represented. There was no guide-to, definition of, or disclaimer when MS redefined the point, with all the kluge work that represented... And now...CT fonts, will be endlessly distributed for free, and no one will ever know outside of “this room” where the rug went, and what “those nasty little designers did this time”, unless...</p>
      <p>My ideas (of general progress for all screen font users) are: variation technology, higher resolution and bigger screens, 2 kinds of distant users, and bigger fonts, based upon a 72 point per inch system that allows integer and non-integer spacing, color and b &amp; w rendering, and a tuner that covers the needs of all users. Personally, I’d also like 7 kinds of font encryption, one of which would be reserved for companies in the type industry.</p>
      <p>MS has ruled variation technology out, created its own definition of resolution outside of broad standards, defined the distance users should be from the screen (literally, once-and-for-all), opposes distant links of fonts to users on de web, shrinks fonts then grows fonts, uses integer metrics vertically - not horizontally, and has the b&amp;w rendering just about right but believes only in color rendering. </p>
      <p>I am obligated, as small as I am, to stick to an infinitely more hopeful definition of progress than your dark and typographically twisted scenario. The fonts scale. They do, really, you don’t have to do it for them. The users, they know how to change point sizes too, really, they do, you don’t have to do it for them. Your way, I’ll try progress (just right now!)* See if you can slam a few more points into an inch, i.e. get that friggin x-ht. up to 17 pixels at 12 pt 144 dpi,  because when I hear “...and square shapes work better than round ones” and I see no Old Style in your CT Collection, I know we have not gotten to “solving the screen font problem on windows.”  Also, as resolution climbs further, tell me when your redefinition of the points per inch is no longer a good thing (wasn’t that just ‘cause early windoze monitors were &lt; 72?)†. I know 72 points per inch is an option buried somewhere in the user’s choice, and I’ll need to figure out how to manipulate that if I want to play.</p>
      <p>In the mean time, I’ll use a Mac. And I hope if your products of your quality definition arrive here again, and as you can see, they suck, maybe they’ll get better. But I’m mostly interested in sizing, instructing, and pressure testing my email fonts to work on the Mac. Second, my print clients use the Mac, and we only gaze into your typographic Tartarus as files fly through in PS production, above your OS we miss your kluges. Third, since you guys got into the fonts online business, print readability fonts have become all the rage, keep it up. Finally, I must stand clear of your progress because someone’s gonna have clean this mess up, and I bet you will not be there. If you are, then start cleaning up now: publish a specification for “CT on Windows” from the beginning of the “em” to the rasterizer’s decision string per pixel, x and y if they are different. If you can do that, honestly, then “it” wasn’t an insult,honestly, if you can’t then “it” also wasn’t an insult, honestly.</p>
      <p>All the best.</p>
      <p>P.S. Mr. or Ms. Typophile, when you accept .pdf files, Email me, and I’ll be back. Until then, I’m out of here.</p>
