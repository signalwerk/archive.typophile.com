      <p><strong>It takes less than one generation for readers to get used to a particular or limited set of type styles, or to the output of particular typesetting technologies which may have significant technical limitations, and then to mistakenly cling to these as being ‘correct’, in the process abandoning huge swathes of the history, evolution and variety of their writing system.</strong></p>
