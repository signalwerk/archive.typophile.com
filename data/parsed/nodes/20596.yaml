      <p>David, the Candara hinting was done by Tom Rickner. It's relatively flat in the x-height <em>because so is the outline design.</em> If you compare the screen rendering to the printed type, side-by-side, it is pretty obvious why Tom made the decisions he did, because any other decisions would be distortions of the design. We all know that black and white bitmaps can be highly readable; the goal with ClearType is to not only make type readable but actually make it look like the individual typeface at the same time. Your black and white bitmaps for Concert, regardless of whether one likes them or finds them readable, give me no idea at all about what the actual typeface design looks like.</p>
      <p>As I see it, we have:</p>
      <p>Black and white aliased bitmaps: good readability, bad typeface differentiation.</p>
      <p>Greyscale antialiasing: poor readability, better typeface differentiation.</p>
      <p>CLearType rendering: good readability, much better typeface differentiation.</p>
      <p>I'm sorry, but I'm with Mike: the Candara example simply looks way better than yours. Is there seriously some deliberate reason for this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ConcW_4435.gif"></div><p></p>
