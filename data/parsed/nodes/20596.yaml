      <p>John, MS changed the definition of pts. per inch , according to Mr. Greg Hitchcock, in 1986. This did not have practical effect 'till MS went to outlines in the '89 TT adoption. It began to surface as a global issue in 1992, with the advent of the Internet, where the world-wide requirement for scaleable digital outlines became central to its rapid spread. It's effect on MS typography, and the Windows font spec for developers, began with Verdana, (2000?) where MS demonstrated the wisdom of piecewise non-linear scaling (what we call optical scaling), which helped greatly with MS' "other scaling" issue. The rest, (and I suggest you reread everything I've written in this, the CT Spec thread and MS CT collection release thread), is history-in-the-making. But, when one says, "I have to set it differently from the Mac to be the same size on the PC", you're lookin' at its most expensive chapter. When you look at the CT fonts, with their 6-8 pt mastering for 10-12 pt use, you're looking at a 100 million dollar(?) solution to a problem of MS's own cause. Once you're through recalibrating maybe you'll see that identical CT results, (just outlines of a slightly different philosophy, and users ***using actual points (1/2 pts. too) to select the size They like, usually from 10 or 12 pt masters made for the purpose***, and that this is all possible in a 72 pt. per inch Windows environment, no tricks...</p>
