      <p>- And, I’d take you up on the drink, -</p>
      <p>I didnt say anything about a drink ;-) David you like black and white bitmaps to read, and you like to have your characters badly shaped onscreen, what can be bad for you about that, you have everything you want. Just so you know the CT font collection was my idea originally. I proposed it because I thought that with the advent of ClearType, we could make the screen an even better place to read, and so we designed some typeface that take advantage of the new technology. I think it worked, in fact I  benifit from it every day, as does JH. I use the CT fonts on my system everyday, and we have heard from many other how they also do. The CT font collection are not the only fonts however that benifit from CT. Verdana and Georgia, and Trebuchet for instance all look great in CT. Any font that is well hinted and has a good weight for onscreen rendering will also look great. There is no way forward if we stick to black and white rendering. You just cant make beuatiful pages that way, type needs to look &amp; read like type. You mentioned earlier that I was both intellectually and politically challenged,(is the first part of that an insult? ;-)  and that you didnt see any point in meeting afterall as you saw no progress. Its a shame, as there clearly is progress, but you just dont see it yet. The offer still stands, and sure ok I will buy you a drink. :-)</p>
