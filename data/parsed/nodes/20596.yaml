      <p>The difference between the two w's is that the 'M&amp;M' colours are not apparent at actual size. That stray black pixel is impossible to miss even when the pixels are as small as they are on my screen.</p>
      <p>By the way, I use an off white background in my e-mail client because I happen to like it. I got into the habit when using CRT screens, because the brightness and contrast settings always seemed to force a choice between violently glaring white and dull grey. Off white background colours, like off white paper stock, allowed me to keep up the brightness without the glare.</p>
