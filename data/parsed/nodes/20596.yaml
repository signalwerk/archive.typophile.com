      <p>Flying w's, take this pile of m&amp;m's and shove it! :) </p><div class="imageWrap"><img src="http://typophile.com/files/W_4685.grab.jpg"></div><p></p>
      <p>Like I said, nothing to hide. I'm sure every pixel of Canadra is perfect at 10 pixels per em. So, if you want to make that comparison, fine. I was asked what I read. Someone came along and said "wow, that's bad type you read there" I answered that bad type is a relative term...e.g. look at this yellow thing. Now, can you fellas show me Canadra at 10 pixels on a Mac or not? ;) 10 pixels at all? or are apples and oranges comparisons, studies, tests and fonts, all you ever do to arrive at the 1 "true" answer?</p>
      <p>And, I'm sure Tom did the best job he could with the staggering amount of complexity needed to make and hint these fonts. I tip my glass to him. But the x-ht. region (9 p @ 17 a pixel em according to yellow type), is ham-fistedly flattened by his hints, and still I wonder if you’re trying to emulate smeared 1980’s dot matrix printers. Are you?</p>
      <p>"hey look the king David has nothing on…." King? I was never so anointed, but as it only took your co. $30 million (or so), and 17 years to get where you imagine me to be, I'm glad for you. And, I'd take you up on the drink, but I hear no room for progress, and I see less. There is no default for 72 points per inch right, The rendering will only be done based on the assumption that CT outlines have been designed, There will be no variations, There will be no CT with integer spacing. Your operating system is done forever, isn't it?</p>
