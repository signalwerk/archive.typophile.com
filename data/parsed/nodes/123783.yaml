    <p>Most likely a custom font.  Am looking only for the one they use for the numbers on this shot at the bottom and the "page 1/3" in the image located here: <a href="http://games.gamepressure.com/view_screen.asp?ID=295460" title="http://games.gamepressure.com/view_screen.asp?ID=295460">http://games.gamepressure.com/view_screen.asp?ID=295460</a></p>
    <p>Other image here: <a href="http://games.gamepressure.com/view_screen.asp?ID=295461" title="http://games.gamepressure.com/view_screen.asp?ID=295461">http://games.gamepressure.com/view_screen.asp?ID=295461</a> - note the uniqueness of the comma on the bottom right area.  </p>
    <p>Pretty sure this is custom but I love the way this font looks and would love to find it somewhere if it's available.</p>
