      <p>Yesterday I was just talking with a friend calligrapher about what identify Italy, graphically. She suggested me that outside Italy, for example for food packaging, we are identified by smooth, curvaceous scripts, etc., and not by the sharpness of futurism (we are living a futurism revival for the 100th anniversary of the futurism manifesto, and everything become irritating when is coupled with the quasi-fascist social decline of our country).</p>
      <p>Then I suggest to look at some late 19th century typeface and, if you have the opportunity, at the actual packaging of the period.</p>
      <p>@Mark<br>
      I wish I could laugh</p>
