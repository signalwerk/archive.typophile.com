    html: <p>I'm a  Sicilian-American, not an Italian. I don't think Giacomo is particularly Italian. I do think that it is particularly me. The design of the Crema label does follow a particular vague Italian style, but it wasn't done by an Italian. Eurostyle, Microgramma, Egiziano were done by Novarese. Are they particularly Italian? Perhaps. The fonts shown on the Progetto-Italic site don't strike me as particularly Italian either.</p>
