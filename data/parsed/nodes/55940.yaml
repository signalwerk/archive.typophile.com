    html: |-
      <p>Looking at Mostra and Giacomo, they seem to be quite different. Mostra is very sharp and geometric, where Giacomo is soft and warm.<br>
      I think the hard part is if you try to define a certain style that covers a few centuries. Perhaps we should narrow it down to the last 40 years? </p>
      <p>Ok, let me make a kick-off (and I'm surely not an expert on Italian style fonts). Italian style fonts:<br>
      - are quite often 'fat' like Extra Bold or Black<br>
      - quite often have a slightly rotated backwards 'e', giving it a diagonal cross bar<br>
      - are mainly serif fonts<br>
      - can ofcourse be sans serif and then often have soft endings</p>
      <p>How far am I off?  ;-)<br>
      Now it's your turn.</p>
      <p>®</p>
