  html: <p>I'm planning on going. Provided I don't need a root canal or heart transplant or encounter some other money-draining emergency between now and then. Since my travel budget for this year is rapidly dwindling, I'm staying at the Global Backpackers Hostel. (If anyone else is strapped for hotel cash, I've stayed at the GBH in Toronto and, while it's not 4-star by any stretch, it's decent and only $25 a night :-) I'm actually planning on staying for a few days after the conference, since it falls right on my Fall holidays. If there are any Vancouver natives who know of interesting ways to kill time, I'd be grateful for the knowledge.</p>
