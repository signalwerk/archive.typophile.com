    html: "<p>I've only been to one gala dinner (not that I've been to a dozen conferences or something), and I only went to that one because somebody sold me their ticket for half-price. It's not that it's too expensive (plus the money really helps ATypI), it's that I personally enjoy wandering around strange towns at night. Except that one time I decided to give it a shot (especially since the venue seemed pretty unique), and it wasn't bad: my table had a mixture of old-school pros and sharp young techies. <br> <br>I guess for Vancouver you'd have to figure out if it's different enough from where you already live to justify a night on the town versus spending social time with type folks you'd otherwise rarely meet [in person]. <br> <br>hhp <br></p>"
