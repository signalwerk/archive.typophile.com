    html: <p>Meredith and David, yes we’re aware that the conference is scheduled during Rosh Hashanah. This is very unfortunate but was unavoidable due to the availability of the conference venue. The next available dates were well into October, and there was nothing available earlier. A decision was made, on this basis, by the former <span class="caps">AT</span>ypI executive director; I think she made the right decision, despite that fact that it has made it impossible for some people to attend, including a couple of prospective speakers. The only options — rescheduling the conferences later than usual or opting for a less suitable venue — would have inconvenienced a greater number of people. I should note that one Jewish speaker, Martin Mendelsberg, will still be attending and speaking because I have scheduled him on the Sunday afternoon (which is also when my own presentation on Hebrew type design takes place). I’ve provided Martin with a list of Vancouver synagogues, so he can spend Saturday in observance of Rosh Hashanah, and would be happy to provide similar information to anyone else. <br><br><span class="caps">AT</span>ypI is very much aware that this needs to be avoided in future. We were not expecting conference space in Vancouver to be so heavily booked so far in&nbsp;advance.</p>
