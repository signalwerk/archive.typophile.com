    html: <p>After sundown there is a "breaking the fast," and it's a happy event, but "party" is really pushing it -- it's really not "a reason to party". (There's probably a Hebrew word or phrase for breaking the fast, but I'm not a good enough Jew to know it.) <br> <br>A better occasion would be Purim, which is all about partying. Chanukah (a minor Jewish holiday, despite how it's treated in the stores &amp; media) would also be a partying holiday.</p>
