    html: "<p><i>Best I was at was definitely Barcelona.. remember Se�or Maricon? Service was unreal...</i> <br> <br>Wasn't it! Something amused me about every restaurant in Barcelona: when you arrived every place setting already had a dinner plate on it, so the tables looked incredibly inviting, but as soon as you sat down a waiter would appear and remove the plate. Which is a perfectly reasonable thing to do, but which never failed to amuse me. So 300+ people arrive at the gala dinner, have a couple of drinks, and then go into this fabulous dining room overlooking the city where every place setting has a dinner plate sitting invitingly. As soon as everyone is seated, the kitchen door opens and out files an army of waiters -- probably about 50 of them -- and go around and remove all the dinner plates. Delightful.</p>"
