    <p>Hello happy people,</p>
    <p>I'm working with a font that's delivered to us (don't know the source). It's called "A2 Happiness Bold" and it looks like:http://users.pandora.be/xinavane/hffont.png (more on coke.be)</p>
    <p>It doesn't have a lot of extra characters included, so I was wondering if this font were based on some other font. An 'original' which could include more characters and wheights.</p>
    <p>thanks</p>
