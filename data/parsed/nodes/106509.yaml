    <p>Hey, I know I'm new to Typophile but, I was wondering if anybody else was having a problem with the web site lately?<br>
    I just found Typophile about 4 weeks ago and while I lurked for a week I didn't have any problems loading the site whenever I wanted.<br>
    The first week after I signed up for membership I didn't have any trouble.<br>
    Except for only one day last week, I have had nothing but problems loading and navigating the Typophile web site.<br>
    I keep getting time out messages saying something about site availability or that it may be down for maintenance.<br>
    Is this the case or is it all on my end?<br>
    I know my computer is not the newest but, I never have trouble like this anywhere else I go.<br>
    I was assuming it was google trying to punish me for not switching to crome....<br>
    Either way it is getting irritating to say the least.<br>
    Any thoughts?<br>
    Thanks.<br>
    Merl</p>
