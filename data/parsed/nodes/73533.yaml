      <p>Looks like they are free for most uses, although the EULA is quite... opaque. </p>
      <p>I think it's okay to use them for print and for print and preview PDFs, at least that's how I understand this clause:</p>
      <p>"This licence is applicable only in those cases where the finished product(s) are in hard copy<br>
      or a digital medium endowed with the specific feature of preventing extraction of the<br>
      fonts or font elements (“only printing and display” preferences for pdf format) by a third party that<br>
      might use the fonts for applications other than those for which they are sold."</p>
      <p>Notwithstanding this phrase, which follows it:</p>
      <p>"Use of the fonts on servers accessible via the Internet or similar networks, and the redistribution of documents or<br>
      commercially-available software incorporating these fonts to third parties is forbidden. Any use by<br>
      the End-user on digital products allowing extraction of the fonts or font elements as defined above<br>
      by a third party will render the End-user liable de facto."</p>
      <p>Anyone else see it differently?</p>
