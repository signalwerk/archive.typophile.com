      <p>Hi Rohini,</p>
      <p>I like the idea of the project, but if I'm honest, without the photos and explanation, I wouldn't have sensed anything 'Indian' about any of those Latin initial sketches. That could be that I have the wrong perception of what is 'Indian', but I think it's more that they just look like decorated or oddly shaped Latin letters. </p>
      <p>I think with type you may be better off drawing your influences from type. What I mean is, it might be possible to do a Latin alphabet that has the feel of some of the forms of Hindi glyphs, as opposed to trying to decorate a Latin alphabet with 'Indian' things. </p>
      <p>If that doesn't work, maybe dirtcastle's idea makes sense:</p>
      <p>"Personally, I think it would be more interesting to see meaningful comparisons or combined uses of English and Hindi. Maybe you could create pieces with side-by-side English and Hindi."</p>
      <p>I think you could do a wonderful piece with combining the two. It would very representative of 'Hinglish' to find two typefaces that can be read in the same line, so that just as Hinglish flows back and fourth between Hindi and English, maybe so could the text. </p>
      <p>It could be interesting to see some Hinglish dialogue written with the English words with the Latin Alphabet, and Hindi words with the Hindi alphabet.</p>
      <p>Just an idea - the initial sketches don't really seem to match up with the brief for me, though. Sorry!</p>
