      <p>My feeling is that a Latin alphabet is a Latin alphabet. You can decorate and distort it, but it will always be fundamentally Latin, particularly typographically. Trying to Hindi-anize it is like putting lipstick on a pig (sorry, bad metaphor ;-)</p>
      <p>OK... a better metaphor... take a random non-Indian, put stereotypically Indian clothing on them and ask them to speak with an "Indian" accent. I would not find that meaningful or interesting.</p>
      <p>Personally, I think it would be more interesting to see meaningful comparisons or combined uses of English and Hindi. Maybe you could create pieces with side-by-side English and Hindi. You could craete visual metaphors for single words, and then alternate between showing the word in Hindi and English.</p>
      <p>I think one of the most interesting a meaningful things about language is when a word has no exact equivalent in another language. Or maybe the concept is just not as widely understood. Some examples would be Juche, Zen, Karma, etc.</p>
      <p>Anyway, I hope that is good feedback. I do think the project has a lot of potential, especially if you are well versed in "Hinglish". That is something people want to learn about and experience, but in a more meaningful way than type decoration.</p>
