    <p>Probably an easy one, but just can't seem to find it.</p>
    <p>How to let InDesign display this order:</p>
    <p>Regular<br>
    Italic<br>
    Bold<br>
    Bold Italic</p>
    <p>Instead of</p>
    <p>Italic<br>
    Regular<br>
    Bold<br>
    Bold Italic</p>
    <p>Thanks in advance,<br>
    Artur</p>
