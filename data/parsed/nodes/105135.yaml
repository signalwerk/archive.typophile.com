    html: |-
      <p>I would structure the project around “skeletal” paths.<br>
      In FontLab, these can be thickened best by Contour &gt; Paths &gt; Make Parallel Paths.<br>
      That will create the solid versions.<br>
      In Illustrator, Window &gt; Stroke &gt; Dashed Line.<br>
      You will then have to import the Illustrator work into FontLab.<br>
      AFAIK, there is no way to stroke paths with dashes in FontLab.</p>
