    html: "<p>If your Solid font is already done, it will be faster to edit the glyphs yourself than to set up anything to make a dashed pattern for you. Dragging a line with the knife tool across both sides of a stroke, as long as nothing else is in the way, will chop it into pieces. For some reason the slice does not always follow your line exactly, so the best way is to place four nodes on the contour (also with the knife tool; this is its less intuitive purpose) right where you want the ends of the gap to be, slice between them, and then select and delete the nodes that your slice made. If you need help making consistent lengths, try Tools: Action: Effects: Add Nodes, but keep in mind that the nodes aren't necessarily going to be lined up on either side for you.</p>"
