    <p>Greetings from the Land Down Under!</p>
    <p>First of: Thank you for all the great posters here, you have gotten me out of trouble many times, and have been a great source of information. Hopefully in the future I can give back to the community.</p>
    <p>I am using FontLab Studio 5.</p>
    <p>Here is what I have: A Cursive hand written font that teaches students how to write the State Specific Cursive style. I have a Solid font, which can be used for demonstration so the students can see each glyph clearly. And also have an outlined version where students can trace inside the lines to form the letters and practice their style and technique.<br>
    The font has 10-15 (depending on the state) sets of glyphs each containing different sets of joins, and logic which tells which glyph to use so that the letters join correctly. (Example, typing ab will turn into a/b.c2 . b.c2 being the glyph which contains the correct join to the class one letters, of which a is one).</p>
    <p>Here is what I want to do: The Cursive has be done in Solid, Outlined, and Dashed. And the Dashed font is where I am running into trouble. I need a way (Which doesn't involve redoing all the art with dashes) to convert my solid font into a dashed font. </p>
    <p>Is there a way that I can easily (And preferable make this an automated task) manipulate the Solid Glyphs so that every so often in the lines of the glyph it creates a space so that the font looks Dashed.</p>
    <p><a href="http://www.fontspace.com/blue-vinyl/print-clearly" title="http://www.fontspace.com/blue-vinyl/print-clearly">http://www.fontspace.com/blue-vinyl/print-clearly</a> &lt; There is a link which contains a "Dashed" font which is similar to what I would want (In case you didn't understand what I meant by 'dashed')</p>
    <p>Any Feedback and suggestions are more then welcome. No information is wasted information</p>
