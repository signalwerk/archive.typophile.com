    <p>Hi... what started out as a novice attempt to organize a publishing firm computer network and design assets (from art scraps to fonts), I have personally been intrigued by how difficult it is to accurately categorize the Sans-serifs. Various forums have pointed to the 'g' as a defining marker... but this seems to be not always the case... </p>
    <p>As an example, the line between 'grotesk/grotesque' and 'neo-grotesk' seems blurry, specifically in modern designs of even historical typefaces (with optical kerning, etc.). So, here is how my first take on drawing the line between grotesk and neo grot (and between neo-grot and humanist, not included in this list). The Humanist and Geometric are also another kettle of fish. But is this correct, so far ?</p>
    <p>Thanks...</p>
    <p>Grotesk</p>
    <p>[Berthold] Akzidenz Grotesk<br>
    [OurType] Parry Grotesque Pro<br>
    [FontFont] Good Pro<br>
    [Paratype] News Gothic BT<br>
    [ITC] Franklin Gothic<br>
    [Storm Type] DynaGrotesk Pro<br>
    [Linotype] Trade Gothic<br>
    [URW] Grotesk<br>
    [Optimo] Theinhardt</p>
    <p>NeoGrotesk (minus DINs)</p>
    <p>[Adobe] Antique Olive Std<br>
    [Linotype] Neue Haas Grotesk Pro<br>
    [Bitstream] Zurich BT<br>
    [Linotype] Univers Next<br>
    [Font Bureau] Antenna<br>
    [Mark Simonson] Proxima Nova<br>
    [Font Bureau] Benton Sans<br>
    [Monotype-Ascender] Endurance Pro<br>
    [Font Bureau] Scout<br>
    [Monotype] Azbuka Pro<br>
    [Font Bureau] Titling Gothic<br>
    [Monotype] Slate Pro<br>
    [FontFont] Sero Pro<br>
    [OurType] Fakt Pro<br>
    [ITC] Avant Garde Gothic<br>
    [Paratype] Pragmatica<br>
    [Klim] Calibre<br>
    [Positype] Air<br>
    [Linotype] Helvetica Neue LT Pro<br>
    [Process Type] Colfax</p>
    <p>-----</p>
    <p>Humanist &amp; Geometric (later)</p>
