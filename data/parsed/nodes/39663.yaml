    <p>Hi all,</p>
    <p>Don't know if this is the right board to be posting this – it isn't strictly a 'Type ID' question, but others seem to have started similar topics here so I guess I'm in the clear.</p>
    <p>I'm working on a book cover which takes (adapts, really) its title from an old, pulpy/poorly printed boys adventure book called "Tom in the Andamans".</p>
    <p>I'm looking to set the title for the book in a similar face, but it looks to be a hand-lettered job.</p>
    <p>So could anyone suggest equivalents or near-matches for the type in the attached sample? I'm more concerned with the parts of the title in caps, less so the italics. The off-centre O and swash on the S are of particular interest.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/andamans-typesample_4704.jpg"></div><p></p>
    <p>A little worried that not much like this will have been digitised to be honest, but it's worth a try...</p>
    <p>Cheers,<br>
    pat</p>
