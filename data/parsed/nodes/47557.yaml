    <p><cite>Aprovecho este espacio para citar textualmente la crítica que Ignacio Martinez-Villalba, jurado por Colombia, hiciera de mi fuente experimental Tepuy en la versión Argentina del catálogo de Tipos Latinos 2008, esta letra estará pronto a la venta en Sudtipos.<cite></cite></cite></p>
    <p>"Las formas modulares que componen Tepuy creada por el diseñador venezolano John Moore nos remiten a los nostálgicos diseños producidos a finales de los años 60, época en la cual las imágenes y las letras se apropiaron de las ilusiones ópticas.<br>
    A partir de una línea de grueso generoso se van perfilando las letras que lo componen para lograr un conjunto de mayúsculas, minúsculas y cifras bien proporcionadas. Una línea de contorno, que a manera de juego óptico se interrumpe en alguna de las letras y que, de forma calculada, hace que el ojo de quien la lee la complete e identifique rápidamente sin perder por esto el impulso visual de la lectura. Este efecto lo podemos ver en las mayúsculas de una manera muy acertada: en la letra B, haciéndola una de las más atrayentes de todo el conjunto, y en la E,F,M,N y la W.<br>
    Las minúsculas poseen una buena altura de equis, por esto se resuelven ampliamente sin apartarse del diseño de la mayúsculas. Es interesante observar el cuidado que se tuvo de diferenciar los diseños de la letra g con los de la p y la q. De igual manera la u con la v logran que estas letras no pierdan su esencia y mantengan sus características. Acertado es también dejar los puntos de la i y la j con lo que alcanza una mayor identificación de ellas. Finalmente se destaca la letra x por la novedosa manera como se resolvió.<br>
    En las cifras sobresale el 3 y en los signos @ que a pesar de su atrevido diseño no se aparta de las pautas generales.<br>
    Tepuy es una tipografía que nace de lo experimental para desarrollar sus formas pero sin descuidar los parámetros de legibilidad. Por su expresividad, al ser utilizada en cuerpos grandes, es útil para titulares. Su diseño es de alta recordación lo cual lo hace apta también para ser aplicada en trabajo de imagen corporativa."</p>
    <p><a href="http://issuu.com/tiposlatinos/docs/argentina?mode=embed&amp;documentId=080709235935-005874b529754d2a95d756ee9e91e74e&amp;layout=grey" title="http://issuu.com/tiposlatinos/docs/argentina?mode=embed&amp;documentId=080709235935-005874b529754d2a95d756ee9e91e74e&amp;layout=grey">http://issuu.com/tiposlatinos/docs/argentina?mode=embed&amp;documentId=08070...</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tepuy-Moore_6312.jpg"></div><p></p>
