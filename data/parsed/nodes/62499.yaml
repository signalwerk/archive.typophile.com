    <p>Hello, I've been trying to find scans of or online sources for how the script handwriting was taught in Finnish schools at some point during the last 50 years or so...</p>
    <p>I'm not based in Finland so if anyone from there could help me out with where I could find this, I'd be very greatful...</p>
    <p>Or something looking similar too the rounded bottom one of these possibly? </p><div class="imageWrap"><img src="http://typophile.com/files/Finnland13_3614.jpg"></div><p></p>
    <p>Thanks!</p>
