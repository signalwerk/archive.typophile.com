      <p>You could try a more rounded form of X (like the two Cs back to back script form) with the central 'serif' style applied. I find the angles and lightness of stroke jarring next to the other characters.<br>
      The México line is a bit light/small for some uses and the Brodyesque É is out of character, you could try it without the vertical serifs.<br>
      Tim</p>
