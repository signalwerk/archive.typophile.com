    <div class="info">Submitted by <a href="/user/3" title="View user profile.">Jared Benson</a> : 23.Jan.2004 5.50pm </div>
      <p><b>Earn fonts and a chance to win a trip to Germany, simply by keywording fonts!</b> <br> <br>Keywording fonts for sale online seems to have become a necessity now-a-days. How else does anybody but a handful of typomaniacs find their way around all that's on offer? Customers ask us all the time to please let them search by keywords. There are obviously people who want  <br>to look for a correspondence font in Cyrillic or a headline for a rave magazine without any idea of what's available. We need to accommodate them, whether we like that approach or not. As we are busy working on a new site, it would be nice to have this feature available at the time of the relaunch.  <br> <br>No mean task with more than 25,000 individual fonts in the FontShop database. Who would consider that fun?  <br> <br>Well: after having followed the conversations on typophile.com, we realized that I may not be the only mad person who enjoys reading proofs for the FontBook. Typophile.com must be the most type dedicated and knowledgeable of all the type sites. Then perhaps there are some of you out there who want to help us with this mammoth task? We offer <b>font rewards</b> and a draw for a grand prize which we're sure you'll like.  <br> <br>If you're interested in finding out more, read below.  <br> <br>Erik Spiekermann  <br> <br> <br><b>Information</b>  <br> <br>- You will receive random single fonts from our database accessed with your own individual code number.  <br>- There are 12 fields: 2/3 are supplied by the database, 7 fields require you to click one or more pre-selected radio buttons in each field to describe the font, the last 2 fields are filled in manually only if you are able.  <br> <br>Selected participants will be required to register, agree to a non-disclosure and keyword a minimum of 50 single fonts (fifty). Once you have completed 50 fonts, decide if you've had enough or want to go onto the next 50 and so on until the database is complete.  <br> <br> <br><b>Rewards</b>  <br>For keywording the following number of fonts you can choose from our FontFont library accordingly:  <br> <br>50 single fonts (the minimum): you will receive <b>I free font of your choice</b> from the FontFont library  (value $40)  <br> <br>100 single fonts: choose <b>3 single FontFonts or package costing up to $129</b> from the FontFont library  <br> <br>150 single fonts: choose <b>5 single FontFonts or package up to $179</b> <br> <br>200 single fonts: choose <b>8 single FontFonts or package up to $249 </b> <br> <br>You can do more, if you like for the same rewards. For example keywording 400 fonts will get you twice the rewards as 200. FontFont designers will, of course, receive their usual royalties on the fonts you choose.  <br> <br><b>Grand Prize: </b> <br>Everyone who completes keywords for the minimum of 50 fonts will be entered into THE GRAND DRAW!  <br> <br><b>A trip to Berlin Germany in May 2004, flight (economy) for one person, one ticket to FontShop Germany's 3 day Berlin Typo04 conference where this year's theme is "Schrift" (translation type/the written word) plus 5 days /4 nights accommodation. </b> <br> <br>And a <b>roundtrip flight from Berlin to Antwerp, Belgium, 2 nights.</b> Visit to the famous Plantijn-Moretus museum with Fred Smeijers and Rudy Geerarts. Dinner with Rudy and Fred. Fred is well known for many type designs including FF Quadraat and Fresco. Fred's latest book is entitled "Type Now and work so far". Rudy Geearts is the founder of FontShop Benelux and the energy behind Druk, Undercover and now 96 - all great publications by FontShop Benelux.  <br> <br>The random draw will be by Typophile, supervised by Jared Benson.  <br> <br>If you want to join in, point your browser at <a href="http://kw.fontshop.com/" target="_blank">http://kw.fontshop.com/</a> and click "Create a new account". Only serious applicants <b>who know type</b> need apply.  <br> <br>Thank you and happy keywording!</p>
