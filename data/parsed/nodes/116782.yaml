    html: |-
      <p>The closest I can find is <strong>FA Herrick Sign Writers</strong><br>
      The copyright says:</p>
      <blockquote><p>French Alphabets. Designed by F C Herrick for the use of the signwriters and letterers at the British  Empire Exhibition, 1923.  (c) Mindofone Fonts. 2011.</p></blockquote>
      <p>According to LucDevroy this is a free font digitized by Dick Pape:</p>
      <blockquote><p>In 2011-2012, Dick Pape created a number of free fonts based on designs pointed out to him by Mindofone, and he calls them his Mindofone collection, 86 files strong. They include French Alphabets (FA) and French Advertising Alphabets (FAA). The French Advertising Alphabets were designed by M. Moullet in Brussels in 1946.</p></blockquote>
      <p>You can download the font from LucDevroy pages:<br>
      <a href="http://luc.devroye.org/pape/French%20Alphabets/French%20Alphabets-Mindofone/" title="http://luc.devroye.org/pape/French%20Alphabets/French%20Alphabets-Mindofone/">http://luc.devroye.org/pape/French%20Alphabets/French%20Alphabets-Mindof...</a></p>
      <p>Check the image bellow. Not a perfect match (no numerals also) but I think it could serve as a good substitute.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Herrick-Sign-Writers_5757.jpg"></div><p></p>
