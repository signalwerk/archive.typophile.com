      <p>Hi guys!</p>
      <p>Ok I try in English. Only I thought my problem would be so simple that I would have some results even from the small German comunity! :-)<br>
      Anyway, I did succeed in resolving the problem with the help of some html sites. I didn’t notice that all we do in the blog here is just as programming html.<br>
      Thanks anyway!!</p>
      <p>The next problem that I wonder about is how it is possible to keep a certain blog entry on the first place above the others always (kind of introducing text) and not that it is pushed down by the new ones that I post. But maybe it is an also silly idea.</p>
      <p>Comments welcome. And, yes, this excellent site is mainly for typographic purposes.<br>
      So I will be a good guy and go on drawing my typefaces now...</p>
      <p>all the best<br>
      Stefan</p>
