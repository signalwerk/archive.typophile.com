    <p>Hallo,</p>
    <p>kann mir mal einer helfen?<br>
    Ich versuche in meinem blog einen Text zu erstellen, innerhalb dessen man Wörter anklicken kann, die dann die Ansicht eines entsprechenden Bildes (mit dem Titel des Wortes) erlauben.</p>
    <p>Also zum Beispiel:<br>
    „auf dem Bild blabla sieht man…“<br>
    blabla soll blau markiert sein und das attachement blabla.jpg öffnen.<br>
    (also eines von den attachements die man unten sieht, nicht auf einer anderen Seite)</p>
    <p>Kann ja so schwer nicht sein, aber ich kriegs nicht hin :-(</p>
    <p>Danke Euch!</p>
    <p>Stefan</p>
