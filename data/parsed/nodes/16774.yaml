    html: |-
      <p>I think your instincts are right-on ... Optima (as well as its bastard cousin, Zapf Humanist - both technically sans serifs, btw) is way too close to Panorama to use them together .. a serif would be a MUCH better choice. I wouldn't get too fancy .. since this is a cookbook, and readability is paramount (like when is it not .. lol) .. try to picture folks running back and forth .. pantry to cookbook .. they need to be able to focus back where they left off quickly and comfortably ..</p>
      <p>Maybe Life from Adobe .. <a href="http://www.myfonts.com/fonts/adobe/life/" title="http://www.myfonts.com/fonts/adobe/life/">http://www.myfonts.com/fonts/adobe/life/</a></p>
      <p>Personally, I always thought Caslon (maybe 224) worked well with Optima, ergo should match with Panorama .. basically a "chiseled" sans serif with a "chiseled" serif ..</p>
      <p>-fQ-</p>
