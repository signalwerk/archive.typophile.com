  html: |-
    <p>Hi all! I'm designing a cookbook for vegan soups and the author/illustrator wants to use <a href="http://www.myfonts.com/fonts/spiecegraphics/panorama-sg/Panorama" rel="nofollow">Panorama</a> for the titles and would like some suggestions for a body type "that's kind of like Optima but a little more contemporary."</p>
    <p>I feel like Optima's a bit close to Panorama, and would make more sense to go with serif, but I'm open to suggestions...</p>
    <p>(said in your best Linda Richmond voice)...<em>Optima is neither a serif or a sans-serif...discuss </em>...</p>
