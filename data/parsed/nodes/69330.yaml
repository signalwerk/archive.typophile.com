      <p><cite>My tutors don’t really share my interest in typography.</cite></p>
      <p><strong>Fück your tutors.</strong> They probably want students to do trendy conceptual thesis projects that will show well in the show at the end of the semester, get written about in design blogs, and boost enrollment. But that’s not your problem. It’s your project so if you want to design type and a specimen then design type and a specimen.</p>
      <p>My thesis adviser didn’t want me doing type design and a specimen. So I planned a big show display about typography with wall hangings and posters to pull out during meetings about my thesis. Then I spent all my time on type design, had 1,000 eight-page specimens printed offset, never produced the rest of my project, and took a B for the class. I still graduated with honors and don’t think about that project any more.</p>
