      <p>Thanks for your responses guys!</p>
      <p>I think you are probably right – the best way to showcase the design would be in a proper specimen. There really is no point in shoe-horning my project to please everyone.</p>
      <p>Besides, getting the anamorphic images perfect could easily become as time consuming as the actual type design itself… Although it does look very cool.</p>
      <p>I suppose for the exhibition I could print vinyl letters onto the wall to attract attention, and place a bunch of specimens right next to it. </p>
      <p>Iain</p>
