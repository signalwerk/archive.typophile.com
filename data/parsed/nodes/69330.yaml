    <p>Hi, this is my first post on typophile. You definitely seem like a knowledgeable bunch, so here goes:</p>
    <p>I am in the process of designing a typeface for my final project at college. My course is in Art &amp; Design and at the end of the year there is a show to display all the students completed work.</p>
    <p>My tutors don’t really share my interest in typography. For the show I was thinking of trying a few words in <a class="freelinking external" href="http://de-war.de/eurekacarpark.html" rel="nofollow">anamorphic type</a> to showcase my finished font, mainly because it is more interesting than a font specimen, which I had originally planned to do.</p>
    <p>I’m wondering what the best way to go about this would be? I found <a class="freelinking external" href="http://www.georgemichaelbrower.com/work/anamorphic-type/" rel="nofollow"> a interesting little program (see video)</a> to help do this, but it’s not available to buy or download. Also what medium would suit it best? I’m thinking vinyl, but without exact plans for printing I don’t think it would be much use.</p>
    <p>Thanks very much in advance.</p>
    <p>Iain</p>
