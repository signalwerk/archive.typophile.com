    <p></p><div class="imageWrap"><img src="http://typophile.com/files/janathorkbold-fl_6530.gif"></div><p></p>
    <p>Hi there,</p>
    <p>In November 2007 we released a type family called <a href="http://www.outrasfontes.com/janathork.htm" rel="nofollow">Jana Thork</a>. Since that time that fonts received a very good exposition all over the world, being selected for <a href="http://www.tiposlatinos.com" rel="nofollow">Tipos Latinos 2008</a> — the most important type design contest in Latin America.</p>
    <p>Now we release <a href="http://www.outrasfontes.com/janathork.htm" rel="nofollow">Jana Thork Bold &amp; Jana Thok Pro Bold</a> — a complement to this font family that can be used in graphic designs that need more complex hierarchic relations or greater visual impact.</p>
    <p>The Bold packages are already avaliable for immediate download after purchase at <a href="http://www.myfonts.com/fonts/outras/jana-thork/" rel="nofollow">MyFonts</a>.</p>
    <p>Cheers,</p>
    <p>--<br>
    Ricardo Esteves Gomes<br>
    <a href="http://www.outrasfontes.com" title="http://www.outrasfontes.com">http://www.outrasfontes.com</a></p>
