    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PitcherandPressmarks_3804.jpg"></div><p></p>
    <p>The pewter pitcher that inspired much of Dwiggins’ most creative work disappeared in the 1990s and was feared lost forever, but it recently came up for auction. Two Boston book artists bought it to save it from going into a private collection. Please help with fundraising so it can have a place of honor in the Dwiggins Collection at the Boston Public Library.</p>
    <p>From 1913 until WAD’s death in 1956, this pitcher served as the emblem for many of his personal publishing activities. It also represented WAD’s fictitious alter ego Hermann Püterschein, the opinionated and often pompous expert who wrote many articles on graphic arts and printing, and even a book of fiction published by Knopf in 1928. (All of these written by Dwiggins, of course.)</p>
    <p>A full account of the pitcher’s history can be found in <a href="http://cl.ly/IbCy" rel="nofollow">“Making the Pewter Shine”</a>, the recent article written by Stephen Heller for Imprint online.</p>
    <p>Please give generously to help put this pitcher in its rightful place. All contributions welcome, from $10 to $500 and beyond. See <a href="http://cl.ly/IcNX" rel="nofollow">this attached PDF</a> for details on how to contribute.</p>
