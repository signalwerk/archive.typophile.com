    <p>Spawned from here:<br>
    <a href="http://typophile.com/node/18685" title="http://typophile.com/node/18685">http://typophile.com/node/18685</a></p>
    <p>So along the journey on the eternal quest of making a font<br>
    look good (but to me at least never “the same”) both in print<br>
    and on screen, I have a question:</p>
    <p>What’s the relative effort involved in getting this<br>
    outline “g” (slightly modified from Patria) to render<br>
    out this bitmap “g”, preferably robustly on as many<br>
    platforms and applications as possible.</p>
    <p></p><div class="imageWrap"><img src="/files/render_g.gif"></div><p></p>
    <p>One way is to make two separate fonts, one outline, one pixelfont*.<br>
    Another is to superhint, like the previous generation of MS core fonts,<br>
    but with the difference that grayscaling is enabled. A third is to -come<br>
    close, and in some ways exceed- using CT, using some level of hinting<br>
    (which I’m not clear on). For the purposes of this discussion I will add<br>
    that -if it makes a big difference- you can assume the top of the lower<br>
    bowl of that outline “g” to be flat -and even uniform in weight- instead.</p>
    <p>* Or a raw bitmap font, in special situations.</p>
    <p>So I’m wondering what are the relative efforts, as well as<br>
    the relative technical impediments in terms of delivery,<br>
    of the various methods. Thank you.</p>
    <p>hhp</p>
