      <p>Spec? Wazzat?</p>
      <p>Maybe this: a TT font populated with “normal” outlines (leftmost “g”), but that renders out specific grayscale bitmaps (righthand “g”s) at certain PPEMs. My sample bitmap “g” is from an existing (but still in development) 14* PPEM serif pixelfont, which however has quite “abnormal” outlines (because without hinting that’s the only way to get specific grayscale bitmaps).</p>
      <p>* Or 15 if you want to include a blank topmost row (although that’s a<br>
      gracious sacrifice of apparent size that’s been unfashionable for years).</p>
      <p>So how painful would it be to superhint a normal outline font to render out bitmaps like that? One reason I ask is because I wonder why it’s never been done (AFAIK). Although maybe the Next Big Thing became ClearType so superhinting* was exiled from the Republic. And speaking of CT, would that be any better in terms of reducing effort? I’m assuming CT can render out “normal” (full-pixel), non-colorized bitmaps.</p>
      <p>* Which interestingly however is not mutually exclusive with CT, so...</p>
      <p>As for the cross-platform, cross-app wish, that might actually be pretty hopeless, seeing as how OSX mostly ignores hints. On the other hand, CT-style fonts might actually work when OSX’s subpixel rendering is enabled? What’s funny BTW is that the existing format of my pixelfont actually ensures consistent rendering across platforms! The only other way to do that these days seems to be to settle for Fabulous Full Fuzz on both platforms!  :-/</p>
      <p>hhp</p>
