    votes: null
    html: |-
      <p>It only occurs if the image is the first element in the content. So, in this particular post, the initial line of text provides an adequate buffer.</p>
      <p>The issue has to do with the way various elements at the head of the post are floated. If an image of a certain size occurs directly after the title and posted-by meta info, then because of the float, it gets pushed over. </p>
      <p>Either the .content or the .imageWrap needs to get cleared. </p>
      <p>I’m not sure why it only seems to have started at the same time as the image-scrolling was put back in. The two should be separate issues.</p>
      <p>I sent Jared a screenshot a couple days ago. I’ll talk to him again about it.</p>
