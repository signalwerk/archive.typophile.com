      <p>Thanks for the replies.</p>
      <p>I was afraid you would say that – and deep down, I think you're right. How about if I was to only use two combinations at a time? Which I suppose is not what I was looking for, but it's a start. Unfortunately, I don't think I could suddenly swap out LFT Etica ... from the broadsheet, anyway.</p>
      <p>For instance, I just spotted <a class="freelinking external" href="http://www.type-together.com/index.php?action=portal/viewContent&amp;cntId_content=3029" rel="nofollow">this from Type Together's "Type in Use" section</a>.</p>
      <p>They use Coranto 2 and LFT Etica in the main section, and Bree and Adelle in the other section. I'd like a font with some more flair to use with Coranto 2 in the newspaper's supplements, and I wouldn't use LFT Etica in them then. But I'd like it to feel like it was in the same "extended family", if you know what I mean. I don't think Telefon is the right fit, although I do love it.</p>
