    html: |-
      <p>Thanks for the kind words, Edmund.<br>
      Yes, Pratt was custom for the Globe.<br>
      I originally published it commercially in 2009, but in a subsequent redesign we made substantial changes and additions (hence the “Nova” apellation), which I have not yet updated in the commercial release.</p>
      <p>Yes, I do think that a third style can complement a sans+serif main combo, and a slab can do the trick.<br>
      But these days, I see no reason not to use something more exotic, a rounded style or a script for instance, perhaps distressed.</p>
      <p>Of course, the key is to provide sufﬁcient contrast in style (caps – lower case – italic), size, weight and even colour, between the typefaces.</p>
