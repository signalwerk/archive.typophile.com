      <p>A bold slab could be useful.<br>
      I went bold in two directions with Pratt Nova, both high contrast and slab, which gave the Globe designers lots of options.<br>
      <a href="http://webmedia.newseum.org/newseum-multimedia/dfp/pdf4/CAN_TGAM.pdf" title="http://webmedia.newseum.org/newseum-multimedia/dfp/pdf4/CAN_TGAM.pdf">http://webmedia.newseum.org/newseum-multimedia/dfp/pdf4/CAN_TGAM.pdf</a></p>
      <p>I will be releasing that later in the year.<br>
      In the meantime, I would say look for a somewhat condensed slab face, especially one with some thin weights that would be useful at large display size in the supplements. Perhaps you might also persuade TT to do an ultra-fine version of Coranto for that kind of usage.</p>
