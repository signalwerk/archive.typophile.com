      <p>Nick, those words were more honest than "kind" – the typography in the Globe really makes me envious.</p>
      <p>I think you give some fantastic advice there: I am searching for good rounded and slab matches. Any suggestions would be appreciated. I think a script would be a bit too much for me to take, although I agree the consideration has some merit.</p>
      <p>The most important bit is the sufficient contrast – that really is key.</p>
      <p>Reading your earlier post above again, I was surprised your mention of an "ultra fine" Coranto commission didn't bring our own custom work to my mind. While it may not be ultra fine, we did a lighter version in house of Coranto for some of our section heads:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/customexample_3650.jpg"></div><p></p>
      <p>I am sure though you may not be impressed with some of the aspects like the kerning and our quick-turnaround custom job (it was done in a few days just before we launched our redesign), because I haven't been back to fix some of the problems that irk me since, but it has served us well.</p>
      <p>Once again, thanks everyone for your help!</p>
