  html: |-
    <p>I’ve done a ton of individual kerning in Fontographer on a couple of fonts. We now have FontLab. Can anyone tell me a method of importing those kerning combinations from Fontographer into FontLab?</p>
    <p>If this isn’t the right forum for this type of question, can someone point me to the right place to find this info?</p>
    <p>Thanks,</p>
    <p>Kristin</p>
