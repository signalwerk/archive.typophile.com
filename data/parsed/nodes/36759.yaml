    <p>Hey this is my first time posting anything here and i hope i did everything right. Not much of a forum user normally. </p>
    <p>Anyway, can anyone help me with this? I was looking for something very similar to this last week, and came across this the other day on a recipe card at Starbucks. I scanned it in and searched WhatTheFont, the closest thing it came up with was Wingate JL, but with my limited knowledge of type, the only thing that i notice to be different immediately was the leg of the R. Any help would be greatly appreciated.</p>
