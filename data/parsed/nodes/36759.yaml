      <p>Thank you both for your help. In case you were curious, I think I found it. I realized that I had recognized this font from a piece that came across my desk the other day. It was a proof that I received from another designer asking what I thought. I was able to open it up in Illustrator and find out the fonts I didn’t have on my system. If I’m right, it looks to be a combination of Chalet Comprime 1960 and Chalet Comprime 1970 from House Industries. Thank god for the Lettersetter and other designers not outlining their fonts. Now I can rest. Thanks again for your help.</p>
      <p>Seth</p>
