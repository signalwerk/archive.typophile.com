    html: <p>you're right. it doesn't seem a 100% match -  the "f".  <br> <br>try - (but what are you looking for - script or swash?) - <br> <br>* Admiral script  <br> <br>* Champion, Derby (designed by Gunter Gerhard Lange.  by the way - he designed el greco) <br> <br> <br> <br> <br>David Hamuel</p>
