    date_raw: null
    votes: null
    html: <p>You're right that it's not an exact match, because the A has been modified. Casaday &amp; Greene has a font they called "Calligraphy" which has that modification. That in turn was 'borrowed' by SSi for something they called "Daniela" (see sample of El Greco and Calligraphy at <a href="http://bowfinprintworks.com/Script02Pg1.html" target="_blank">http://bowfinprintworks.com/Script02Pg1.html</a>). You might be able to use Fontseek to locate a copy of Daniela at a free site.</p>
    html_clean: <p>You're right that it's not an exact match, because the A has been modified. Casaday &amp; Greene has a font they called "Calligraphy" which has that modification. That in turn was 'borrowed' by SSi for something they called "Daniela" (see sample of El Greco and Calligraphy at <a href="http://bowfinprintworks.com/Script02Pg1.html" target="_blank" class="link-external">http://bowfinprintworks.com/Script02Pg1.html</a>). You might be able to use Fontseek to locate a copy of Daniela at a free site.</p>
