    date: 2011-02-15T00:53:00
    votes: null
    html: <p>Wow! That looks like its going to be a great typefamily when its released. I suppose you made the two extremes and used MM to make the in-betweens, right? At least thats what I would do. I think that optical weights need more refinement in a serif typeface. All I have to do is thin all horizontals, thicken verticals slightly and make the inktraps really small. I think I will just call them Sensato A - C as they can all be used at display sizes depending on what kind of look the typographer/designer wants to achieve.</p>
