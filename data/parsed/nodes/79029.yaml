    html: |-
      <p>I'm working on a four-size optical expansion of my designs (Stickley Text), it gives me a chance to refine the design and explore the optical effects of the shapes at different sizes. Yours can easily be made to do the same things based on the work you've done so far.</p>
      <p>The changes are in the curvature of the stems and details, overall contrast, x-height, widths, and side-bearings—all adjust as you go through the sizes from caption to display. The caption being more stumpy, weighty and spaced apart, the display having the most delicacy, contrast, and more tightly spaced (the sizes are the same in this example). Everything is based off the text weight (2nd down).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stf-norst_5591.png"></div><p></p>
      <p>When used together they balance out and look to have the same visual weight because of the changes, not in spite. This example is based on 6 pt, 10 pt, 18, pt, and 56 pt usage.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stf-multiple_5430.png"></div><p></p>
      <p>When set at just the text weight:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stf-multiple-2_4909.png"></div><p></p>
      <p>Optical families take a lot of work to get all the pieces to fit over all the sizes, but are great if you really want the look and balance they can provide.</p>
      <p>Mcs</p>
