      <p>I uploaded an update above. The high contrast grade is now much more refined (Does anything look "wrong" to you?) and optically balanced to the low contrast grade. I'm working on the uppercase and will soon upload a pdf with all three grades. I left out the middle grade because if the two extremes are designed correctly, the middle grade won't need any manual refinements. Hope you like it!</p>
