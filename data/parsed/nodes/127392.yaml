    <p>Has this ever happened to you? The more you stare at the state of your design, the more you hate it? (<a href="https://indd.adobe.com/view/077e9522-9765-4ac6-8bcd-41d685e715d6">https://indd.adobe.com/view/077e9522-9765-4ac6-8bcd-41d685e715d6</a>) I'm designing a periodical for a non-profit and absolutely stuck. 8.5x11" page, Chaparral Pro body, Lato Bold headlines, Lato Medium captions. The more I look at it the more I hate it. And the more I look at good newsletter design (<a href="https://www.pinterest.com/nickelphillips/editorial-pages/">https://www.pinterest.com/nickelphillips/editorial-pages/</a>) the more bleak my design looks. I need to start over. If I start with Chaparral Pro, what serif and sans should I check out? Not looking for anything revolutionary, just looking for tried-and-true options (Trade Gothic, Proxima Nova, etc.).</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/Screen%20Shot%202017-12-19%20at%204.42.46%20PM.png" width="837" height="1018" alt="Periodical Page" title="Periodical page">
