      <p>My two cents:</p>
      <p>1. Forget about harmonical porportions for page layout in periodicals, that is great for books but for the pragmatic needs of something like this you have to build a modular grid.<br>
      2. Layout certainly lacks tension; symmetrical 3 or 4 column layouts are boring. Try using a larger odd or prime number like 7, 11, 13, 17, 19 or 21. Of course you are not going to use columns that narrow but you can use two or three for a regular text column and have an assymetric and dynamic 4 or 5 column layout; maybe a wider first column from time to time.<br>
      3. The alleys between columns are huge, they can be as narrow as the leading if you want.<br>
      4. Leading is still a bit too open by the way.<br>
      5. Let headlines break the grid on the right side.<br>
      6. Maybe you could trim a tiny bit of the letter sized page to make it more interesting.<br>
      7. Stick call outs between columns, they don't have to fit quite in the center of the two columns either. They can cut the last column only by the left or the first by the right.<br>
      8. Make the bottom margin larger than the top and the external margins slightly larger than the innner one.</p>
      <p>For periodicals this is a better book:<br><a href="http://amzn.to/2CpQIWg">http://amzn.to/2CpQIWg</a></p>
      <p>Good luck!</p>
