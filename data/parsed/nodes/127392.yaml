      <p>Thank you for the excellent feedback; and the detailed advice. </p>
      <p>Subject matter: Charitable projects in different countries: educational, fine art, scientific. There's also a sizable Activities section which includes all the get-togethers the local chapters have (social occasions such as picnics). Overall it's more serious than creative. (Obviously serious doesn't have to mean boring.) </p>
      <p>Readers: Disproportionately older, but some of the major charitable projects are related to K-12 education, so there are some young people and middle-aged parents with a keen interest. Slab serif (Chaparral) is an attempt to maintain readability for those who are a little older (in print and online—half of our readers just read the periodical on-screen as a PDF) while feeling a little fresher than our previous typefaces (Minion, ITC Berkeley).</p>
      <p>Leading: Fantastic observation! I think I might've tinkered with the Character Style for some reason at some point and reduced the original point size of the body text. I thought I might have to revisit it but thought I might be splitting hairs--your observation gives me a solid answer that I need to revisit.</p>
      <p>Gutters: Gutters are at 18 points. Would you agree that they are too wide?</p>
      <p>Alignment: This is where I'm really struggling to have layouts with more tension, effective white space, etc. I think I may need to redo my grid (which is currently a 12-column modular grid on 8.5x11" paper, which is far too many columns, I'm finding) to a 5-column grid and leave one column empty or partially empty at times. I've tinkered with it and so far the effect has been still very blocky and static. </p>
      <p>Here are some attempts to break out of the static blockiness the design currently suffers from. Unfortunately they rely too heavily on high-quality images. We don't have a lot of those, so I'm trying to redesign in such a way as to rely less on images and more on typography.</p>
