      <p>Nick, what is the subject matter of your newsletter? Serious subject, or one that can be a bit creative? Age of readers (a slab like Adelle or Chaparral as you are using adds to easier reading for older readers... or more of a transitional type for younger readers)... I just did an economic/political case study book set in Jeremy Tankard's Enigma typeface... came out quite serious, but certainly not boring...</p>
      <p>As far as the layout itself... again, depending on the seriousness of the subject matter, you don't HAVE to have everything block aligned... pics don't necessarily have to align with columns... just be somewhat consistent in your choices...</p>
      <p>And even the size of the font could, in theory be "hipster-ish" .... meaning use something in the neighborhood of 20 to 24pt font... serif or sans serif as the body text... for a newsletter, you are not bound to use serif for body text...</p>
      <p>BTW, though, just at a glance, the leading (line spacing) seems slightly too open... either make the font fit the leading you have, or decrease the leading just a bit...<br>
      Let us know your progress...</p>
