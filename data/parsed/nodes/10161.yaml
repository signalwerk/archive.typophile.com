    html: <p>This is a nice idea. It's interesting that arrows are being used as both negative and positive shapes. But I think you need to consider working on consistency.  <br> <br>Some letters seem to have angular serifs, while some have squared serifs. Also, the use of the arrows needs to be considered. Some have arrows coming from the black, positive areas while others do not. Like, the "E" for example does not have an black arrow while the "B" does. Maybe these forms only need the negative or only need the positive arrows, perhaps not both.   <br> <br>Also, the width of the negative white arrows needs attention. Some are wider than others. <br> <br>Again, good ideas, it just needs a little more work and constant use of the shapes.</p>
