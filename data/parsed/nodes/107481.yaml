    <p>In the 1960s Georg Salden designed an opening advert for an hat shop in Dusseldorf. With a broad-nib pen he wrote a bold italic with large swashes. From this written text he later developed <a class="freelinking external" href="http://www.typemanufactur.com/eng/fonts/daphne/overview.html" rel="nofollow">Daphne</a>, a strong and sharp-edged typeface which includes a large number of separate swashes. These calligraphic swashes can be added to the letters in any order, which provides hundreds of possibilities.</p>
    <p>Now, many years later, Salden decided to develop a script version of his Daphne typeface. Again, written with a broad-nib pen, Salden created an elegant and vital script with luscious swashes and numerous alternate characters.</p>
    <p>See more of the typeface at <a class="freelinking external" href="http://www.typemanufactur.com/eng/fonts/daphnescript/overview.html" rel="nofollow">TypeManufactur</a> or check out this <a class="freelinking external" href="http://daphnescript.typemanufactur.com" rel="nofollow">Micropage</a>.</p>
    <p>There is an 50% off introduction offer at <a class="freelinking external" href="http://www.typemanufactur.com/eng/fonts/daphnescript/overview.html" rel="nofollow">TypeManufactur</a> and at <a class="freelinking external" href="http://www.myfonts.com/fonts/ludwiguebele/daphne-script/" rel="nofollow">MyFonts</a>.</p>
