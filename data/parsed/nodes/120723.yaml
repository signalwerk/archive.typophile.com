  html: |-
    <p>Hey there,</p>
    <p>So... I've no idea why, but whenever I type "/" on my keyboard, when trying the font I'm designing, the slash doesn't appear. But then when I type "/" again, and it appears. So, every time I type "/" 2 times, only 1 "/" appears on my screen.</p>
    <p>It happens in both FontLab preview and Illustrator. Any thoughts?</p>
    <p>PS:<br>
    Sorry if somebody already posted this, I looked for another post with a solution but couldn't find anything.</p>
    <p>Thanks!</p>
