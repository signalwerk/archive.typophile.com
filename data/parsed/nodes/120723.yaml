    html: <p>To preview glyphs that aren't on your keyboard, the slash is a delimiter to indicate a glyph name. For instance, "r/eacute sum/eacute" in the plaintext field gives you "résumé". This necessitates "//" to mean "this is not a delimiter, the following is not a glyph name, just put a slash here." Nothing is wrong with your font. I didn't know there was a similar feature in Illustrator, but there must be.</p>
