      <p>I'm at least glad that when I followed the link given, I found a link in that discussion to <a href="/wiki/Typeface%20Pairing" class="freelinking" rel="nofollow">Typeface Pairing</a> which gave a link to</p>
      <p><a class="freelinking external" href="http://typophile.com/node/45613" rel="nofollow">http://typophile.com/node/45613</a></p>
      <p>which shows that I was not imagining things when I said that a strong contrast is the "safe, boring" recommendation.</p>
      <p>However, you don't need to use a sans-serif for titles if you are intending to use a different face from the serif type used for body copy. An Egyptian will do. A Clarendon will do. Even the contrast between Bodoni for headings and a serif Roman which is not a modern will do. (Although, to be safe, one likely will use a bold weight for the headings for a little extra contrast.)</p>
      <p>However, while contrast is good, another one of the safe rules of thumb, I saw from that thread, is not to combine two faces with a strong personality. So one doesn't use two display faces at once. No mixing Papyrus with Hobo, or Cooper Black with Comic Sans, or even Amelia with Albertus.</p>
