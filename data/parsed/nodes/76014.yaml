      <p>It's not really a matter of having an "eye" for it. If it were, there would be no pointers anyone could offer seeming as how you don't have the "eye".</p>
      <p>If you just want a basic understanding I would say it's simply a technical matter, and you don't need to invest tonnes of time to have a fundamental understanding of how different types contrast. The two most helpful starting books for me were <em>Design With Type</em> by Carl Dair and <em>The Elements of Typographic Style</em> by Robert Bringhurst. Either is a great read and good to have around as a reference if you plan to do work with type.</p>
