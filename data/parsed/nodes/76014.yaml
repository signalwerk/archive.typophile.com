      <p>My understanding is that one rule of thumb is not to combine two faces in the <em>same</em> category.</p>
      <p>Thus, mixing Franklin Gothic and Times Roman is not so bad, because there is a strong contrast between them, one a bold sans-serif, and one a normal serif, but mixing faces that are similar (yet definitely different, and thus not matching), such as Caslon and Times Roman is what one isn't supposed to do.</p>
      <p>I'm fairly sure that this has been given as a rule of thumb to beginning typographers in a number of textbooks on the subject.</p>
