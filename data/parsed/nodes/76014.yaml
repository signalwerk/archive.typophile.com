    html: |-
      <p>This <a class="freelinking external" href="http://www.typography.com/email/2010_03/index.htm" rel="nofollow">newsletter</a> from Hoefler &amp; Frere-Jones (prominent type designers) does a nice job of explaining some combinations for (their) typefaces.</p>
      <p>This <a class="freelinking external" href="http://www.typophile.com/node/32056" rel="nofollow">listing</a> shows various Typophile posts on pairing fonts.</p>
      <p>What do you mean exactly about not mixing categories? Surely, using a sans font for display/larger text and a serif for text/smaller text is a fairly traditional method of pairing.</p>
      <p>The qualities to observe can vary. For example, say you want to use Helvetica. Simply relying on boldness/weight to provide contrast can allow you to use a regular version and a bold version of the same typeface. They complement each other because they share the same shapes/forms/style but differ in the thickness/weight.</p>
      <p>On the topic of Papyrus, I would classify it as a distressed (roughened/textured) script. Something can be a script without looking like cursive; Papyrus is closer to calligraphy. You needn't swear off Papyrus forever, because I'm guessing you don't have any other fonts like it (if interested, <a class="freelinking external" href="http://www.fontshop.com/fontlist/alternatives/papyrus/" rel="nofollow">this</a> is a helpful list). Just know that Papyrus is very widespread in its use. Many designers consider it amateurish due to its misuse and overuse.</p>
      <p>If you truly want to develop a greater sense for these things, I encourage you to read Typophile regularly. I have found it invaluable. Also, experiment and practice can only help.</p>
      <p>Apologies for the long response.</p>
