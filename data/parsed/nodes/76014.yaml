    <p>Hi everyone...I'm not at all lazy, but I'm sad to say that I don't have a natural eye for design.  My best friend does and I've noticed over the years that she has helped me "develop" my eye.  When I created a logo for my company (she was swamped at the time) and asked for her opinion, I thought she was going to reach through the phone and strangle me...I'd used what I now know is the much-typophile-hated font, Papyrus.  Anyway, I digress...</p>
    <p>I'm often trying to pair fonts, and I've learned a lot over the last year about fonts, but I'm still not confident about my pairing ability.  Can you guys offer me some rules or guidelines for choosing complementary fonts?  Most of the time I'm using them for print, although if there are different rules for the web (other than understanding what fonts will be picked up by browsers) I'd like to read your thoughts on that too.</p>
    <p>My girlfriend is out of town at the moment, but I can tell you that I have many times put two together only to have her tell me I was totally wrong...still I don't think I'm hopeless.  Just slow to develop.</p>
