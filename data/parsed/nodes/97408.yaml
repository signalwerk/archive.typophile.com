    html: "<p>Proto-Elamite seems unrelated to Linear Elamite, and it is quite possible that the term is a misnomer. There also tends to be a bias against the idea that Susa was crucial to the development of writing (if not a bias against the idea, that Susa was just a colony of Uruk).  As you mention writing may have evolved in parallel through Mesopotamia.  Proto-Elamite dates to only 100 years after Sumerian. Such a difference is close enough to be explained by contamination, or limited sampling. And it is difficult to understand, as this article points out, why a civilization (Susa) would not just adopt the Sumerian script, and decide to re-invent writing, so to speak. For that reason alone, it may be more likely that the development of writing occured in Susa, and at some early phase of it's development, the ideographical form of writing made it's way to Sumer. We have evidence for the development of writing in Susa: The earliest proto-elamite is ideagraphical, and almost immediately afterwards, appears to take a more syllabic form. One would expect if the relationship was reverse, if writing was invented in 'Sumer' (assuming Susa wasn't part of Sumer), than the transition to syllabic form would not occur so shortly afterwards - especially among a random, preliterate, population. But if we assume that Susanian's were experimenting with writing, than the transition can be explained a lot easier. It is also important to note that the oldest counting tokens and cylindrical seals to date, which were crucial to the development of writing, were found at Susa.</p>"
    html_clean: "<p>Proto-Elamite seems unrelated to Linear Elamite, and it is quite possible that the term is a misnomer. There also tends to be a bias against the idea that Susa was crucial to the development of writing (if not a bias against the idea, that Susa was just a colony of Uruk).  As you mention writing may have evolved in parallel through Mesopotamia.  Proto-Elamite dates to only 100 years after Sumerian. Such a difference is close enough to be explained by contamination, or limited sampling. And it is difficult to understand, as this article points out, why a civilization (Susa) would not just adopt the Sumerian script, and decide to re-invent writing, so to speak. For that reason alone, it may be more likely that the development of writing occured in Susa, and at some early phase of it's development, the ideographical form of writing made it's way to Sumer. We have evidence for the development of writing in Susa: The earliest proto-elamite is ideagraphical, and almost immediately afterwards, appears to take a more syllabic form. One would expect if the relationship was reverse, if writing was invented in 'Sumer' (assuming Susa wasn't part of Sumer), than the transition to syllabic form would not occur so shortly afterwards - especially among a random, preliterate, population. But if we assume that Susanian's were experimenting with writing, than the transition can be explained a lot easier. It is also important to note that the oldest counting tokens and cylindrical seals to date, which were crucial to the development of writing, were found at Susa.</p>"
