    html: <p>Although Mesopotamia means 'between the rivers', it refers to entire river system and its valleys, which formed an agricultural region. I presume Zada's 'lowland Iran' refers to the area to the southwest of the Zagros mountains and to the Iranian river systems that feed into the lower Mesopotamian system. The area of southwestern Iran around Ahvaz is geographically within the broader Mesopotamian region.</p>
