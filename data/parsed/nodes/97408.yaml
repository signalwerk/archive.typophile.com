    html: "<p>It's also worth noting that it is completely misleading, if not completely wrong, to say that lowland Iran (in addition to Susa), is not generally considered part of Mesopotamia. The ongoing perception among scholars is that because Western Iran was in the sphere of influence of Ubaid culture (which lead to the Sumerian civilization), it just an extension of Mesopotamia (See: Beyond the Ubaid, <a href=\"http://oi.uchicago.edu/pdf/saoc63.pdf\" title=\"http://oi.uchicago.edu/pdf/saoc63.pdf\">http://oi.uchicago.edu/pdf/saoc63.pdf</a>).</p>"
