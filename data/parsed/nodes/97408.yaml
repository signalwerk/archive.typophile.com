      <p>Very good point. These receipts and invoices were probably meant to be read by only two people, the writer and a known recipient. That kind of system can tolerate a lot of idiosyncratic variation.</p>
      <p>And just to add a more typographic element to the thread, Denise Schmandt-Besserat has argued that the numeral system that formed the original core of both proto-cuneiform and proto-Elamite originated from pressing counting tokens into clay. For example, you would indicate "4 sheep" by pressing a "sheep" token into the clay four times. If conveying written information by stamping an object repeatedly counts as typography in some very general sense, you could then argue that writing is derived from typography just as much as the other way around :)</p>
