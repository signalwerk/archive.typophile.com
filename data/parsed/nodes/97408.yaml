      <p>When I saw the part about a big black dome with flashing lights, I felt trepidation, because computers are only shaped like domes in bad science-fiction, and front-panel lights are out in the computer world today.</p>
      <p>But it wasn't a monster computer that deciphered the language; it was a specialized camera that captured elusive features of the relief inscriptions.</p>
      <p>So there's nothing in the article to set off any alarm bells.</p>
      <p>The other link in this thread, though, essentially says that proto-Elamite inscriptions are understood, but they aren't really representative of an actual language - pictures of things accompanied by a count of how many are being receipted for. So that does make me suspicious.</p>
