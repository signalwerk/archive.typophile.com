      <p>These are just my opinions, and I'm not an expert, but here are some things in the article that seemed a bit off. </p>
      <blockquote><p>Breakthrough in world's oldest undeciphered writing</p></blockquote>
      <p>The headline is misleading, even in relation to the article itself. As the body of the article makes clear, there hasn't been a breakthrough; rather, there has been a pile of money spent on an imaging system that the researcher hopes may lead to a breakthrough (cf. <a class="freelinking external" href="http://www.ashmolean.org/departments/antiquities/research/research/rtisad/" rel="nofollow">http://www.ashmolean.org/departments/antiquities/research/research/rtisad/</a>. If you read more closely, the only real announcement here is that the main group of tablets in Paris will be imaged and then these images will be put online. This is nice and undoubtedly useful, but hardly amazing – they've been published on paper, albeit long ago and not up to modern standards. Whether it leads to any breakthrough remains to be seen. But apart from the device itself, there's very little here that couldn't have been said ten years ago: <a class="freelinking external" href="http://www.mpiwg-berlin.mpg.de/Preprints/P183.PDF" rel="nofollow">http://www.mpiwg-berlin.mpg.de/Preprints/P183.PDF</a></p>
      <blockquote><p>So far Dr Dahl has deciphered 1,200 separate signs</p></blockquote>
      <p>Um, no. I'm sure he didn't say that. He has been updating Meriggi's catalogue listing all the distinct signs used in Proto-Elamite script, of which there are about 1000 to 1200 in all. Some of these have been understood for quite a while; many more remain obscure.</p>
      <blockquote><p>This first case of educational underinvestment proved fatal for the writing system, which was corrupted and then completely disappeared after only a couple of hundred years.</p></blockquote>
      <p>This part is a little bizarre, but I'm not sure whether it was the journalist or Dahl spinning an observation about glyph variation a little too far. The system appears to be less standardized than proto-cuneiform, which itself shows quite a bit of instability, but people weren't writing these tablets for fun. They're basically bookkeeping detritus. The script was used for several generations over a large area because it was useful, and if there were problems of consistency, people generally react to that by simplifying or standardizing. With proto-cuneiform, between 3100 and 2700 they simplified, standardized, and "syntacticized" (made the writing system correspond more to spoken language). If proto-Elamite writers instead abandoned the system – which is not certain, because there is a hypothesis that the Linear Elamite script is a radically simplified descendant of proto-Elamite – it would suggest that the whole notion of writing in general ceased to be needed for a while, which does happen now and then.</p>
      <blockquote><p>Making it even harder to decode is the fact that it's unlike any other ancient writing style. There are no bi-lingual texts and few helpful overlaps to provide a key to these otherwise arbitrary looking dashes and circles and symbols.</p></blockquote>
      <p>It's not very different from proto-cuneiform, except for the key difference that proto-cuneiform has a well-understood descendant script. The relationship with proto-cuneiform numerals has been very useful for figuring out what is known of proto-Elamite, actually. There are ancient scripts with much worse problems of lack of bilinguals and short texts that provide little to work with, such as Linear A and Harappan.</p>
      <blockquote><p>This is a writing system - and not a spoken language - so there's no way of knowing how words sounded, which might have provided some phonetic clues.</p></blockquote>
      <p>This appears to have been badly garbled somehow. I think the point being made probably had something to do with how proto-Elamite script, apart from the possible syllabic uses that Dahl thinks he can identify, appears to be entirely logographic, so there's no phonetic structure to provide clues to meaning. (Not that phonetic clues would help much unless the language were closely related to later Elamite or something else that can be read.) </p>
      <blockquote><p>But infuriatingly for the codebreakers, when these proto-Elamites borrowed the concept of writing from the Mesopotamians, they made up an entirely different set of symbols.</p>
      <p>Why they should make the intellectual leap to embrace writing and then at the same time re-invent it in a different local form remains a puzzle. </p></blockquote>
      <p>Sort of, not exactly. It looks like what happened is that the numeral system, which had some limited semantics about what was being counted embedded in it, developed first, in Mesopotamia. The proto-Elamite script borrowed this, but it looks like both Mesopotamia and western Iran developed this into something more like a writing system in parallel, using some similar elements but mostly independently. The numeral system appears to have been borrowed at a time fairly early in the process of developing a fuller proto-cuneiform writing system.</p>
      <p>Egypt appears to be a more puzzling case of borrowing the idea but reinventing the entire system, unless Egyptian script is older than currently known.</p>
      <blockquote><p>It's possible to work out the rations given to these farm labourers.</p></blockquote>
      <p>Yes, with some reservations given that so much of the informational content remains unclear. However, what isn't known is the relationship between the portion of the economy that was recorded on tablets and the portion that was not. The society was undoubtedly quite unequal, but it is not known whether these are fully dependent laborers receiving all of their food from a bureaucratic system or temporary corvée laborers being paid (poorly) in kind, or more likely some mixture.</p>
