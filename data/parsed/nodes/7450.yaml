    html: <p>Thanks Shawn, <br>I just noticed that "leg" missing from the mark also. I would love to work on some abstract marks, but unfortunately the previous design firm has seared this mark into their corporate identity. I just hope I can "sell" this redesign. <br> <br>So far Bembo Small Caps has been the only type to catch my eye. I'm looking for a conservative established type face and this seemed to be most "solid". Coming from an illustrative background, my type face knowledge is sophomoric at best (compared to some people on this board :o) <br> <br>Right now I'm not 100% certain about the treatment and letter-spacing. I need some typophilic eyes. <br><img src="http://www.typophile.com/forums/messages/29/52566.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/52567.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/52568.gif" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/29/52569.gif" alt=""></p>
