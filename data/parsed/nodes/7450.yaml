    html: <p>Because "W" mark is so complex, I think you need to focus on keeping your type treatment simple. <br> <br>Every differentiation you introduce within the type (italic to Small Caps, small type to large to small, different alignments) adds a component that the person interacting with the logo has to deal with. The immediacy of the entire name is compromised when the viewer is confronted with too many variations/elements in addition to the leap you are asking them to make from the "W" mark to the logotype.  <br> <br>I like your move to center the "W" mark above the name (the mark on the left reveals the awkward W W moment), and I would try "the Winter Group" all the same size, on the same line, small caps with the W and the G regular caps, with a little word spacing.</p>
    html_clean: <p>Because "W" mark is so complex, I think you need to focus on keeping your type treatment simple. <br> <br>Every differentiation you introduce within the type (italic to Small Caps, small type to large to small, different alignments) adds a component that the person interacting with the logo has to deal with. The immediacy of the entire name is compromised when the viewer is confronted with too many variations/elements in addition to the leap you are asking them to make from the "W" mark to the logotype.  <br> <br>I like your move to center the "W" mark above the name (the mark on the left reveals the awkward W W moment), and I would try "the Winter Group" all the same size, on the same line, small caps with the W and the G regular caps, with a little word spacing.</p>
