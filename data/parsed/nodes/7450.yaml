    date_raw: 10 Nov 2004 — 7:17am
    votes: null
    html: <p>Thank you all for the input, I'm glad to see there's a forum like this.  <br> <br>Justin - You're right, I was trying too hard to veer away from the current logo's vertical layout (just to avoid any similarity), which was a mistake. The other layout/type treatments try too hard to work and I realize a vertical layout probably is the best solution for maximum legibiltiy. The centering of the elements eliminates the WW effect and also gives a better placement for "the".  <br> <br>Oscar - I'm still campaigning fiercely to get the go-ahead to propose a replacement for the "W" mark; stating that it does not scale and reproduce well, etc. I've always been fond of the saying "A good logo should be so structurally clean that it can be drawn in the sand", which doesn't really hold true for the "W". <br> <br>I would love to take a crack at a new mark, but with our new office being completed in January and signage and collateral scheduled to be produced, I would have to try to find the time to crank out some concepts. <br> <br><img src="http://www.typophile.com/forums/messages/29/53254.gif" alt=""></p>
