    html: "<p>Here's a regional engineering firm from my area that took a  <br>similar approach: <a href=\"http://www.ctlt.com\" target=\"_blank\">http://www.ctlt.com</a> <br> <br>I suspect that those 'toothpicks' used to create the 'T' represent <br>the marks a tractor makes when digging into the earth. I've seen <br>the vinyl version on one of their trucks and it's made of crisp lines. <br>I don't think this breaking down on screen is ideal but nor is it <br>fatal for the design since they are in the business of moving dirt. <br>Do you plan on using the W at smaller sizes on screen?</p>"
