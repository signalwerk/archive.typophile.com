    html: "<p>Hello! <br>This looks good! <br> <br>I think with some work on the kerning, #4 could come to look very good (right now I think it looks a little bit too spaced). <br>But of course, it depends on how you want people to read the name. Each one gives a different tone to the reading. #4 is my personal favorite because the caps separates the words so that it doesn't look like the company's name is \"wintergroup\". Maybe you could also try a variation on #3 with a (small) space between Winter and Group. Maybe put the title a little more to the right, to separate it from the big W mark, and then add the space between the words, so that \"Group\" won't feel lost from the rest.  <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
