      <p>Oh, dear lord, please don't produce yet another pixelated logo for a web development company. It's just so overdone. The concept you have could work with some refinement. Don't muck it up with cliches from the 90's. </p>
      <p>Print it out, in black ink only, at multiple sizes from a half inch to three inches high; just trust me on that. I know it seems like a useless exercise, but elegance truly does reveal itself in print. </p>
      <p>All the letters are tracked too tightly, and the k needs special attention. The legs are too close to the stem, first of all. Second of all, there's no need to upscale the curly bracket to make it stand out -- doing so gives it a sore thumb quality. Part of the problem is the thickness of the bracket doesn't optically balance with the rest of the letters. Not good. Also -- the space where the bracket connects to the stem is awkward. It's either too short or too long, I'm unsure (too thin?), but it needs adjusting. </p>
      <p>For this to work, remember; you're done when there's nothing left to take away and your message is still clear. That's the trick to great design, IMO. So, take away the "oversize" feature of the bracket because it's just not adding anything other than a quizzical reaction. That's not what you want....unless you sell puzzles. :)</p>
