    <p>Hi, </p>
    <p>first post/first critique!</p>
    <p>I am starting a web development company Called JeekMedia.</p>
    <p>Dealing with all things in web development. From iphone/android apps to static html pages.</p>
    <p>I wanted to go with a real elegant sleek yet a small hint of geekiness. so after a week of locking in and getting things done this is what i came up with.</p>
    <p>How I came up with the design is for simplicity I went with the Futura typeface with the "K" being and curly bracket used in many programming languages.</p>
    <p>Please throw in your complete 2cents! thanks!</p>
