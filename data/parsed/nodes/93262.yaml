    <p>Dear Typophiles,</p>
    <p>I snapped this old Michelin sign last weekend at an old-timer show. It is very close to Gill Sans, but the 'M' for example is like nothing i've ever seen. Could this be a modified Gill, or a vintage alternate cut? I'm very curious.</p>
    <p>regards,<br>
    Daniel</p>
