      <p>Adam,</p>
      <p>charles_e asks a good question.<br>
      And I'm very glad to see this move in pricing - even though it's limited to student/faculty.</p>
      <p>Which brings me to this:</p>
      <p>In light of the spark of interest in fonts lately - I'm sure largely due to @font-face and the incredible number of new font users entering the market - are there any plans to re-evaluate the positioning of Fontlab's product line and make some pricing changes?<br>
      What was once strictly a "pro" market has become a "pro-am" market.</p>
      <p>(I really can't see where TypeTool fits in today's market. And having become familiar with Fontographer through proofreading David Bergsland's book, I think it has a lot of potential but it's feature set is odd and in need of work. (Perhaps it should become a module of sorts of FLS, not a stand-alone product. If such a thing is feasible.)<br>
      And BTW - I don't know about the Mac version, but the way the Generate font feature in FOG interfaces with Windows - with no provision for choice of filename other than the automatic default or easy output to a folder without having to drill down through directory trees is absolutely maddening. And time wasting in the extreme. Especially if your interest is in previewing fonts in browsers, as mine and many other developers is or has become. I had to write a command-line script for renaming just to keep sane.)</p>
      <p>Just thinking out loud....</p>
