    <p>Fontlab Ltd. has just announced a new, more affordable, licensing program for students. Students (or faculty) at colleges and universities can now purchase licenses for our font editing applications valid for one year (renewable) at less than 25% of the retail price. Specifically, the prices of the 1-year student licenses are: FontLab Studio: <strong>US$119</strong>, Fontographer: <strong>US$79</strong>, TypeTool: <strong>US$23</strong>. </p>
    <p>“Given that there is now a broader range of font editing tools available on the market, we believe that we should offer students an opportunity to purchase licenses for our products at an even more affordable price than before. We believe that during the course of one year, students should be able to learn to work with the tool(s) of their choice and finally pick the tool that will best serve their specific needs.” — Adam Twardoch, Fontlab Ltd.</p>
    <p>More on the <a href="http://www.fontlab.com/academic-purchases/" rel="nofollow">Fontlab Ltd. academic purchases</a> page.</p>
