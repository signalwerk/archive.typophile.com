      <p>Richard, </p>
      <p>more than two years ago, we started developing a completely new codebase for our products. We do realize that the current products do not fullfil all of the market's requirements of today. We will still do some development on the current products because there is a large number of current users who are interested in having the products improved. But we're working on new products at the same time — it takes time, though! </p>
      <p>Best,<br>
      Adam</p>
