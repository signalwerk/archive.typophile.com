    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/History" class="freelinking" rel="nofollow">History</a> : <a href="/wiki/Chronology" class="freelinking" rel="nofollow">Chronology</a> : 15th Century CE</strong></p>
    <p><a href="/wiki/1400s" class="freelinking" rel="nofollow">1400s</a><br>
    <a href="/wiki/1410s" class="freelinking" rel="nofollow">1410s</a><br>
    <a href="/wiki/1420s" class="freelinking" rel="nofollow">1420s</a><br>
    <a href="/wiki/1430s" class="freelinking" rel="nofollow">1430s</a><br>
    <strong><a href="/wiki/1436" class="freelinking" rel="nofollow">1436</a> </strong><a href="/wiki/Johannes%20Gutenberg" class="freelinking" rel="nofollow">Johannes Gutenberg</a> began experimenting with movable type designs.<br>
    <strong><a href="/wiki/1438" class="freelinking" rel="nofollow">1438</a> </strong>Gutenberg designed his first <a href="/wiki/printing%20press" class="freelinking" rel="nofollow">printing press</a>.<br>
    <a href="/wiki/1440s" class="freelinking" rel="nofollow">1440s</a><br>
    <a href="/wiki/1450s" class="freelinking" rel="nofollow">1450s</a><br>
    <strong><a href="/wiki/1455" class="freelinking" rel="nofollow">1455</a> </strong>Gutenberg produced the 42-line bible, the first book printed with movable type. Shortly afterward his financier foreclosed, sold the bibles, and became the first commercially successful printer.<br>
    <strong><a href="/wiki/1458" class="freelinking" rel="nofollow">1458</a> </strong><a href="/wiki/Nicholas%20Jenson" class="freelinking" rel="nofollow">Nicholas Jenson</a> went to Mainz, <a href="/wiki/Germany" class="freelinking" rel="nofollow">Germany</a> to study type-casting.<br>
    <a href="/wiki/1460s" class="freelinking" rel="nofollow">1460s</a><br>
    <strong><a href="/wiki/1462" class="freelinking" rel="nofollow">1462</a> </strong> Rebellion in the city of Mainz causes many of the typefounders their to flee (or be expelled). Gutenberg moves downriver to Eltville. <a href="/wiki/Conrad%20Sweynheym" class="freelinking" rel="nofollow">Conrad Sweynheym</a>, <a href="/wiki/Arnold%20Pannartz" class="freelinking" rel="nofollow">Arnold Pannartz</a>, and Nicholas Jenson move to Italy.<br>
    <strong><a href="/wiki/1465" class="freelinking" rel="nofollow">1465</a> </strong><a href="/wiki/Conrad%20Sweynheym" class="freelinking" rel="nofollow">Conrad Sweynheym</a> and <a href="/wiki/Arnold%20Pannartz" class="freelinking" rel="nofollow">Arnold Pannartz</a> are hired by a monastery in Subiaco, Italy. Seeking to find a more Italian alphabet for their new employers (as opposed to the Teutonic blackletter type of their homeland), the two sought to research classical Roman literature. However they unknowingly were reading ninth-century transcriptions in Carolingian Minuscule and falsely assumed that this was actually an Ancient Roman invention, just like "capital" monumental letters. The two combined the two alphabet forms in text—upper and lowercase—just like we do today (actually, we only do it because they started it…). The first italian "Roman" typefaces (like Nicholas Jenson's later work in Venice), borrowed this two-case innovation from the scribes.<br>
    <strong><a href="/wiki/1469" class="freelinking" rel="nofollow">1469</a> </strong><a href="/wiki/Johannes%20da%20Spira" class="freelinking" rel="nofollow">Johannes da Spira</a> established the first press in <a href="/wiki/Venice" class="freelinking" rel="nofollow">Venice</a>.<br>
    <a href="/wiki/1470s" class="freelinking" rel="nofollow">1470s</a><br>
    <strong><a href="/wiki/1470" class="freelinking" rel="nofollow">1470</a> </strong>Johannes da Spira died and Nicholas Jenson took over the press.<br>
    <a href="/wiki/1480s" class="freelinking" rel="nofollow">1480s</a><br>
    <a href="/wiki/1490s" class="freelinking" rel="nofollow">1490s</a></p>
