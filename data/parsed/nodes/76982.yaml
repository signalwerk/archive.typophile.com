      <p>That typeface looks like an emaciated <a href="http://www.fontshop.com/fonts/downloads/monotype/plantin_std_complete_pack/?&amp;sample_text=SATURDAY&amp;sample_size=74&amp;update=0&amp;affid=99346" rel="nofollow">Plantin</a>.</p>
      <p>There's a list of <a href="http://www.fontshop.com/fontlist/genres/extra_bold_high_contrast_serifs/?affid=99346" rel="nofollow">high contrast serifs</a> at FontShop, but these are much bolder than your sample which is really not that high contrast, it's just very light. So see their <a href="http://www.fontshop.com/fontlist/genres/extra_light_serifs/?affid=99346" rel="nofollow">extra light serifs</a> as well. <a href="http://www.fontshop.com/fonts/downloads/bp_type_foundry/sangbleu_family_pack_ot_bp/?affid=99346" rel="nofollow">SangBleu</a> seems to be the closest to what you're after.</p>
