    <p>hey all,</p>
    <p>last days i always came across high contrast serif fonts.<br>
    spezial in the field of fashion and magazines.</p>
    <p>is there any category name for those fonts or does anyone know where there came from or what background they have?</p>
    <p>even a few names from similary ones would help!!!!!</p>
    <p><a href="http://industriemagazine.com" title="http://industriemagazine.com">http://industriemagazine.com</a><br>
    <a href="http://www.saturday-group.com" title="http://www.saturday-group.com">http://www.saturday-group.com</a><br>
    i am sure the font from saturday for industrie magazine is custom made but there are so many out there right now there must be some mainstream version :)</p>
    <p>i am not looking for slabserif or egyptienne.<br>
    and i am aware that bodoni does have a good contrast in the line width :)</p>
    <p>thanks so much!</p>
