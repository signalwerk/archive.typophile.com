      <p>"HOPS" must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Elsner%2BFlake&amp;ffam=EgyptienneEF%20Cond%20-%20Medium&amp;fid=32a3eb62a267b6a40e9e534a718907cd&amp;fsize=60&amp;text=HOPS&amp;fit=1" rel="nofollow">Egyptienne</a></strong> by Elsner+Flake<br>
