      <p>"TOP" &amp; "BEER":<br>
      Similar style: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Bitstream&amp;ffam=Santiago%20BTN%20Condensed%20Light%20-%20Regular&amp;fid=7af72279458234e9277a201af2539bcf&amp;fsize=60&amp;text=TOP%20BEER&amp;fit=1" rel="nofollow">Santiago BTN Condensed Light</a></strong><br>
      ...but it could be also a modified <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=ITC%20American%20Typewriter%20LT%20Ligh%20-%20Cond&amp;fid=6f066ce3fd998e76280336536554be51&amp;fsize=60&amp;text=TOP%20BEER&amp;fit=1" rel="nofollow">American Typewriter</a></strong></p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
