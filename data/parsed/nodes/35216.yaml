  html: |-
    <p><a href="/wiki/Frank%20Martinez" class="freelinking" rel="nofollow">Frank Martinez</a>, an expert in copyright law, and one of the only lawyers qualified to serve the font industry, is teaching a workshop and a breakout session at TypeCon this year. I am excited to be able to sit down and hear about these processes directly from the horses mouth. It seems to me that in this day and age with all of the piracy that is going on something like this can only help us arm ourselves with the needed information to protect our work. I personally can't wait. Who else is attending these two sessions?</p>
    <p>FYI, here's the info for those who weren't aware!</p>
    <p>Workshop:<br>
    Copyright Protection for Graphic Designers and Font Foundries: Myth and Reality<br>
    Presented by Frank Martinez (The Martinez Group)<br>
    Thursday, August 2 | 9:00 am–12:30 pm | Cost: $50<br>
    <a href="http://www.typecon.com/workshops.html" title="http://www.typecon.com/workshops.html">http://www.typecon.com/workshops.html</a></p>
    <p>Education Forum:<br>
    Licensing Fonts and Software in an Educational Environment<br>
    Thursday, August 2 | 11:00 am–6:00 pm | Cost: $50<br>
    <a href="http://www.typecon.com/education.html" title="http://www.typecon.com/education.html">http://www.typecon.com/education.html</a></p>
