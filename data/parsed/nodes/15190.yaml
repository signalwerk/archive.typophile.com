      <p>That looks good. It is doing everything you said it should do. The fusion of a house shape and the perspective of the speakers works well, and it feels both a little fun and serious. </p>
      <p>The only thing that bugs me is the concentric rings for the speakers in your black and white version. The line weights are so thin and so close together that it creates a lot of tension. This is especially true for the top group of circles.</p>
      <p>The tension doesn’t happen in your color version because 1) you have less rings, 2) the line weight is heavier, and 3) it is grey instead of stark black and white. </p>
      <p>Maybe use less circles in your black and white version?</p>
