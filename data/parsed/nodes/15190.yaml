  html: |-
    <p>Hello everybody. </p>
    <p>Could you please tell me your opionions and critiques about this logo?<br>
    It is made for a Bulgarian organization, which is focused on house music.<br>
    Their site has a forum, a lot of information about parties and articles about the mucis.<br>
    You could say that they are sort of lika a serious fan club…<br>
    I decided that this is (so far) my best idea for this project, but I am interested to know your opinions as well.</p>
    <p>In a general outline of a house (word-play), I’ve drawn a prespective view of a music speaker, in order to establish a connection with the music. On the other panel of the speaker I’ve drawn the bold letter “H”, to “suggest” the name of the “House” music.<br>
    The logo has to be both serious to a certain degree, and fun. This is why I’ve used triangular element as well as a square.</p>
    <p>Thank you in advance for your help!<br>
    Cheers.</p>
