      <p>Depends on the font. If the alternate characters have Unicode values, you may access them with the Windows/MacOS character map. Otherwise they are not accessible from outside the application. </p>
      <p>(In Corel apps you can only access the standard 256 glyphs, or has this changed in the recent versions?)</p>
      <p>Ralf</p>
