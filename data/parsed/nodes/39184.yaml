      <p>Looking under "Private Use Characters" within Priva Pro, I find small caps, old style numerals, and small caps with accents (or whatever they're called). But if I look at the same within Bryant Pro, I get almost nothing. How are small caps and alternates stored within opentype fonts, or is that too much to go into?</p>
      <p>I'm on Windows Vista, by the way.</p>
      <p>Thanks,<br>
      Addison</p>
