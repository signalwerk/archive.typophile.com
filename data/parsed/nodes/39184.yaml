      <p>Well, it really does me know good to understand this, but I'm curious. Looking at Adobe Garamond Pro with Font Explorer (on Mac), I see that the ffj ligature has a Glyph ID of 615, but no other value. On Vista within BabelMap it has a value of U+E088. Is there an easy way to explain what that means and why they're different?</p>
      <p>Mark, that's why I'm glad you still provide a version of your fonts for non-opentype savvy apps. Thanks for the explanation.</p>
