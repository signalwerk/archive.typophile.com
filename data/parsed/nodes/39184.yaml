    date: 2007-11-17T17:17:00
    date_raw: 17 Nov 2007 — 5:17pm
    votes: null
    html: <p>If you don't see them under the Private Use Area or anywhere else, they are unencoded and only accessible via OpenType features. A developer can assign PUA codes, but there is no standard for them (by definition) so you may get a surprise if you change fonts. Even so, some developers do it to give users at least some access to non-standard characters with apps that lack full OT support.</p>
