  html: |-
    <p>I'm really curious about this -- is there any way possible to access an opentype font's alternate 'a' or other characters (like swashes) using the Windows Character Map? I'm trying to see how far I can push using opentype with apps like Microsoft Word and CorelDraw. I can find small caps and such, but no luck on the alternate glyphs. Any thoughts?</p>
    <p>Thanks,<br>
    Addison</p>
