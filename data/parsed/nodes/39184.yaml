      <p>Looking in Font Explorer on the Mac, I don't see a Unicode value on the alternate characters, but I didn't see them on the small caps either (I can access those). The small caps were all under the "Private Use Characters" so I figured the alternates should be there, too. Font Explorer shows glyph IDs, but no Unicode values.</p>
      <p>CorelDraw supports Unicode as of version 12, but I still can't get to every character with their "Insert Character" palette. I'm curious about that, too.</p>
