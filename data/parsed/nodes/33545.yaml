    html: |-
      <p>Look for Penguins published 1948-9, in second-hand markets.<br>
      In Ruari McLean's "Jan Tschicold, typographer", there is a reproduction of the "Penguin Composition Rules", 1947, which was composed as if it were (4) pages from a Penguin, according to the rules. Nice bit of self-reference.</p>
      <p>However, although he left Penguin in 49, the book interiors continued to follow his Rules for many years.</p>
      <p>Anybody know when they stopped?</p>
    html_clean: |-
