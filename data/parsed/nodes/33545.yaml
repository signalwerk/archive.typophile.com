    html: <p>Yes, the McLean book is good, as well as, although the text is in German, "Leben und Werk des Typographen Jan Tschichold" by Werner Klemke, includes a bibliography, published by Verlag der Kunst in Dresden, 1988. With some info on the Penguin books, but also illustrations of many projects, type and design. Worth having, if you can find it.</p>
