      <p>I second Mclean's book: Mclean was Tschichold's under-study at Penguin - I'm not sure who left first? However, I would definitely not recommend 'The Penguin Years' by Richard B. Doubleday: the book has an incredible amount of inconsistencies and inaccuracies; furthermore, Phil Baines gave the book a scathing review in Eye Magazine:</p>
      <p><a href="http://www.eyemagazine.com/print/review.php?id=134&amp;rid=677" title="http://www.eyemagazine.com/print/review.php?id=134&amp;rid=677">http://www.eyemagazine.com/print/review.php?id=134&amp;rid=677</a> </p>
      <p>I would try 'Jan Tschichold: A Life in Typography'; 'Jan Tschichold, Typographer'; 'True to Type by Ruari Mclean; and then email St Bride library in London to see what they have in the way of books and advice.</p>
    html_clean: |-
