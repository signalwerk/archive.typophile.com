    <p>Hi all,</p>
    <p>I'm looking for examples of the books designed by Jan Tschichold for Penguin.</p>
    <p>I am specifically looking for examples from the inside of the books, the type I mean.</p>
    <p>If anybody could point me in the direction of a list of books too, designed by him, then I can head to the library to check them out for myself.</p>
    <p>Hope you can help</p>
    <p>Tom</p>
