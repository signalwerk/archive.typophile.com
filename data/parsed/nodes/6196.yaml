    html: <p>&gt; the greatest influence would be the economic and mechanical limitations of the kind <br>&gt; of machinery available at the time that movable type spread across the globe. <br> <br>It depends on the script. Some scripts (like Arabic) were made to give up more authenticity to foster material gain. Other scripts (like Armenian) have no problem with the mechanics, and become Latinized purely through misguided cultural idolatry. <br> <br>&gt; That has to count for something, doesn't it? <br> <br>Sure, I for one think so. <br>It's just that different cultures are at a different point (and they can learn from the past mistakes of others). For example, Greek type suffered rapine in the 70s (mostly at the hands of its own people, if not always directly), but now it's coming into its own. Armenian type on the other hand went into "degenerative Latinization" about 10-15 years ago, and is still stuck there. <br> <br>hhp <br></p>
