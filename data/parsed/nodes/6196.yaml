    html: <p>The Microsoft Typography Group shipped with Windows 2000 the first high-quality Unicode fonts for a number of complex scripts.  <br>  <br>In addition, the <a href="http://www.sil.org">Summer Institute of Linguistics</a> develops and distributes fonts for complex script minority languages as well as the tools to build, render and create documents with them, all inside the framework of the currently established TrueType file format. (It uses its own data tables separate from any OpenType feature tables.)  <br>  <br>While it is tempting to surrender logic to identity politics and blame Western cultural ignorance or indifference for the degradation of non-Latin scripts, I would argue that the greatest  influence would be the economic and mechanical limitations of the kind of machinery available at the time that movable type spread across the globe.  <br>  <br>The great hope-affirming irony here is that computer programs written in languages based on the Latin script are being used to resurrect and reinvigorate non-Latin scripts. That has to count for something, doesn't it?</p>
