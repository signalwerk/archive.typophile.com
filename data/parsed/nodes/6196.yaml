    html: "<p>I have a French Secam VHS video from French TV where they ask people on the streets what they associate with some particularly fonts composed always with same word George: fonts are Arepo, Champion (one from Boltana, a Copperplate), Kosmik, Skia, Le Monde masterhead font (the only black letter I have at hand). <br> <br>The answer has been (various but the main idea is there by the majority): Grec yogurt, Men fashion/perfum, Camembert, Trash/fun young, and I miss the last one? Just try to put right font to right stuff as people in Paris streets. <br> <br>*** <br> <br>Anyway, about country/typefaces, I will say that its more culture/typeface than anything else, and less and less possible to see anything, because the world became very small (from 20th). And also until recently, most of fonts we fond on computers came from US-German-English companies with strong technical restrictions. <br> <br>*** <br> <br>To answer to miguel, the best to him, depending from where he came is to take some traditionnal typefaces from his country as starting point to do a revival. More fun and culturally interesting for him and us. <br></p>"
