    html: "<p>&gt; do you Think that Garamond is French because you know it was Produced in France? <br> <br>Good question. And of course I can't really know the answer: a system can never understand itself. <br> <br>I think there are two levels of knowledge, conscious and subconscious, with the latter being more shallow and inconstant, but more forceful. The fact that I consciously know that Garamond is of French origin ruins any possible subconscious appreciation. Fortunately for laymen (readers) they don't know the background, so the type can have a deeper association with social/national/ethnic context. Do laymen associate Garamond with French culture? My point is that they do, if only to a limited extent. What about Peignot? Very much. <br> <br>&gt; Even the most neutral typefaces have something to say. <br> <br>What does FF Kievit have to say? <br> <br>hhp <br></p>"
