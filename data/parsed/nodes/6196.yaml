    html: <p>In Ireland the blame for the initial latinisation and eventual disappearence of Gaelic type lies squarely on the shoulders of the printers. Using Gaelic type wasn't technically complicated. Unfortunately it represented an extra cost. <br> <br>To increase their margins they put pressure on the government to do away with Gaelic type and make roman standard. The Government wanted the votes and, Bob's your uncle, no more Gaelic type.  <br> <br>Now that money is no longer a valid excuse, the printers claim that the reading public wouldn't be able to handle the exotic letterforms. <br> <br>Maybe one day the use of Gaelic fonts all over the world in texts about all things Irish might actually catch on in Ireland too. <br> <br>M <br> <br></p>
