    html: <p>In regards to the "do laymen associate Garamond with France?" <br> <br>While I am aware of Garamond originating in France, in comparison to you all, I'm probably more a layman than not. However, Garamond does not scream vive France to me...  <br> <br>This topic is fascinating... I am aware of typefaces countries of origin and I have made some possibly stereotypical connections -- those Scandanavians and their clean, lovely sans serifs!!!  And maybe, just maybe, I thought Europeans were a bit more fond of sans serifs than Americans. <br> <br>But most of all, I thought there was a pantheon of great typefaces that stood up over time and popular the world over, Garamond among them along with Goudy, Helvetica, Times...  maybe type is better at conveying a time as opposed to a place...</p>
