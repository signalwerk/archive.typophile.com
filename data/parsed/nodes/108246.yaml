      <p>HUNGER THIRST: most probably custom and possibly hand-drawn from scratch as <a class="freelinking external" href="http://dribbble.com/shots/608462-Hunger-N-Thirst-Identity" rel="nofollow">Derek Hollister</a>, one of the designers in charge of this identity at <a class="freelinking external" href="http://www.theinfantree.com/work/hunger-n-thirst" rel="nofollow">The Infantree</a> has a type work on his dribbble called '<a class="freelinking external" href="http://dribbble.com/shots/986127-Absolute-Finest-Type" rel="nofollow">Absolute Finest Type</a> which looks pretty close to the one for 'HUNGER N THIRST'. For what it's worth, if I have to recreate it, I'd probably start with some font like <a class="freelinking external" href="http://www.myfonts.com/fonts/ef/diamante" rel="nofollow">Diamante EF</a> adding those latin (triangle) serifs.<br>
      More 'Diamante': <a class="freelinking external" href="http://www.myfonts.com/fonts/solotype/five-star-final" rel="nofollow">Five Star Final</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/herald-gothic" rel="nofollow">Herald Gothic FB</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/chamfer-gothic-rr" rel="nofollow">Chamfer Gothic RR</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/uncle-sam-slim-nf" rel="nofollow">Uncle Sam Slim NF</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/loshaj-foundry/pillar" rel="nofollow">Pillar</a>, <a class="freelinking external" href="http://elibrumbaugh.com/Dayta-Typeface" rel="nofollow">Dayta</a><br>
      "Out-of-the-box" alternatives but still some customization needed: <a class="freelinking external" href="http://www.myfonts.com/fonts/btn/supremaganda-btn" rel="nofollow">Supremaganda BTN</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hold-fast-foundry/bourbon" rel="nofollow">Bourbon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/sheepman" rel="nofollow">Sheepman</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/yeoman-gothic-rr" rel="nofollow">Yeoman Gothic RR</a><br>
      Starting with a slab and (mainly) reworking serifs to latin ones: <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/player" rel="nofollow">Player</a></p>
