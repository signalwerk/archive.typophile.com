    html: "<p>Really don't know what to say about 'Kues'. Your best chance is probably to directly ask <a href=\"/wiki/https%3A/%252Fwww.behance.net/gallery/The-Logo-Volume-II/13601081\" class=\"freelinking\" rel=\"nofollow\">Yossi Belkin</a> (and if he answer, drop the answer here :). To me, it feels \"custom from a commercial typeface\" (meaning \"not drawn from scratch\"). Reminds me of <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/adobe/caslon/semibold-italic/glyphs.html#glyphs/511579/346\" rel=\"nofollow\">Caslon Italic /K</a> (and /<a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/adobe/caslon/semibold-italic/glyphs.html#glyphs/511579/353\" rel=\"nofollow\">R</a> for the top swash). Some more tracks: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/okay-type/harriet\" rel=\"nofollow\">Harriet</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/fontbureau/miller\" rel=\"nofollow\">Miller FB</a> Display Italic, <a class=\"freelinking external\" href=\"http://www.typography.com/fonts/chronicle-display/overview\" rel=\"nofollow\">Chronicle Display</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/berthold/mikaway-bq\" rel=\"nofollow\">Mikaway</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/berthold/chasseur-bq\" rel=\"nofollow\">Chasseur</a>, <a href=\"/wiki/https%3A/%252Fcommercialtype.com/typefaces/austin\" class=\"freelinking\" rel=\"nofollow\">Austin</a></p>"
