      <p>Good find Fivos. God of War (2010) seems to be a creative and highly edited pastiche of Miller (1997) <a href="http://www.myfonts.com/fonts/fontbureau/miller/" title="http://www.myfonts.com/fonts/fontbureau/miller/">http://www.myfonts.com/fonts/fontbureau/miller/</a> or a similar Scotch Roman, for most of the letters and other fonts, such as Bodoni for the Q.<br>
      Don</p>
