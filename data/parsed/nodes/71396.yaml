      <p>I've managed to identify the other two fonts on the button (Alternate Gothic and Mandate), so I believe that this one is most likely a font, too. And I'm sure I've seen that "G" before..</p>
      <p>Here's the whole button with three others designs from the same era: <a href="http://cgi.ebay.com/BEATLES-Set-of-Four-3-5-Pinbacks-USA-1965-on-curl_W0QQitemZ370392181922QQcategoryZ104654QQcmdZViewItem" title="http://cgi.ebay.com/BEATLES-Set-of-Four-3-5-Pinbacks-USA-1965-on-curl_W0QQitemZ370392181922QQcategoryZ104654QQcmdZViewItem">http://cgi.ebay.com/BEATLES-Set-of-Four-3-5-Pinbacks-USA-1965-on-curl_W0...</a><br>
      might be replicas, but the design is authentic. I've seen an original at a museum.</p>
