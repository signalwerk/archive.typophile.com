    <p>Hello Typophiles.</p>
    <p>I'm currently finishing up the International Studies part of a Visual Communication/International Studies double degree, and have been living &amp; studying in Bordeaux, France for the past 9 months or so.</p>
    <p>The deadline for my final research project -- a 5000-word research project on an aspect of France or French society, of your choosing -- is a few months away now, and what I've decided to do is explore/investigate the links between traditional Basque lettering styles  (mentioned <a href="http://typophile.com/node/19079" rel="nofollow">here</a> on Typophile, and here's a <a href="http://flickr.com/photos/neregauzak/5738933/" rel="nofollow">cursory</a> <a href="http://flickr.com/photos/neregauzak/5768745/" rel="nofollow">flickr</a> <a href="http://flickr.com/photos/adamrice/272394970/" rel="nofollow">search</a>) and concepts of Basque nationalism.</p>
    <p>While there's a wealth of stuff on Basque identity and nationalism in its various guises, I've struggled to find information on the Basque lettering/type in journal databases and magazine archives and <a href="http://backspace.com/notes/2004/10/10/x.html" rel="nofollow">this post on Social Design Notes</a> was almost all Google would give me). So if anyone could point me in the direction of books, journal articles, or even people that might be able to shed some light on this, that would be great. I'm open to resources in French and English (and I have some very basic Spanish).</p>
    <p>And an aside, while I've got you here:</p>
    <p>I'm hoping to maybe do a few comparisons -- any tips on other contemporary or historical connections between type and national identity? I ordered a copy of Shaw &amp; Bain's "Blackletter: Type and National Identity" the other day -- a contemporary Basque country/WWII Germany comparison seems like it could be quite interesting both visually and ideologically, but off the top of my head that's all I've got so far, and it's been written about so many times before in theses etc.</p>
    <p>Anyway. This is getting a little longwinded. Love to hear your thoughts/ideas!<br>
    And I've attached one of the flickr photos I linked to above, just in case you're unfamiliar with the style (although there can be quite a bit of variation).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/272394970_e9bad05ed9_3941.jpg"></div><p></p>
