      <p>Thanks for your replies everyone.</p>
      <p>Jean-Baptiste: that link looks interesting. I might try and get in touch with the guy who runs that site.</p>
      <p>Hrant &amp; Sii, I think you're both right here: the Germany/blackletter thing was just the first thing that came to mind when I started thinking about type &amp; nationalism. I might still mention it in passing though.</p>
      <p>The Uncial/Gaelic script options do seem like better ideas.</p>
      <p>Wondering though: has a lot been written on Gaelic script? This could turn very niche very quickly -- especially since I'm writing this for an arts/sociology-type degree, not my design one. Also wondering if the political associations are as strong here? This is all pretty uncharted territory for me.</p>
      <p>All this said, I'm not sure how big the "comparative" part of my piece is going to be, given that the whole thing is relatively short.</p>
