    date_raw: 24 Jan 2005 — 10:22am
    votes: null
    html: <p>Hrandt is right about loosening the "udio". I also think the "b-a" can be tightened just a hair. I prefer the positioning of "ARCHITETTURE" aligned with the bottom of the "p", but the "E" is hanging out just a little too far. I'd bring it in so that the "E" lines up to the outside of the "O" optically, rather than mathmatically. <br> <br>Aloha! <br>Scott</p>
