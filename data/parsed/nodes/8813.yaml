    html: "<p>The letters in \"ARCHITETTURE\" are so far apart that spacing tweaks are nearly irrelevant. But I think there's a bigger problem: the word is not sitting comfortably under \"pbastudio\". I might align the bottom with the bottom of the \"p\", but a bigger issue is the lateral placement, like how the terminal \"E\" doesn't know where it's supposed to be compared to the \"o\". <br> <br>hhp</p>"
