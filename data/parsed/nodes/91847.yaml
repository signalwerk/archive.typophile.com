      <p>I think the swash alternates are the weakest part, and I would even consider dropping the roman swashes. They seem forced.</p>
      <p>Did you try non-horizontal tops to the bolder roman /M/ (given the angled terminals of letters like /V/v/)?</p>
      <p>FWIW I think the extender lengths seem fine, but I do agree about checking weights of letters like /w/ (and not only in the extra bold).</p>
