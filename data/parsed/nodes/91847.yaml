    <p>Hey folks,</p>
    <p>I have made Sensato into a family with a range of weights and real italics. The character set is still very basic. Please feel free to share your critique as harshly and honestly as possible. Ohh and, spacing/kerning is indesign's 'optical' job. </p>
    <p>Cheers! jasper</p>
