      <p>@hrant: I don't want my g to look cramped. Sensato is not made for space efficiency. Making the descenders appear as long as the ascenders gives the most 'natural' look, imo.<br>
      @J Weltin: I'll have a look at those :-)<br>
      @Craig: I don't mind them looking a bit forced, if that's what it takes to draw the attention. The /M/ actually has slightly angled terminals on the top. If I make it more angled it looks forced, which, in this case, is not desirable.</p>
