      <p>I think you are very close. My concern is mainly with some of the rounded letters: O Q C G S, and lc like o and c. I think, comparing especially the O to the E, you'll find that E appears to be have a little more contrast, where O seems to feel nearly monoline. Looking again, it may not be as much of a problem as I imagined. It's all evened out in heavier weights.</p>
      <p>T: I thought there were just screen rendering issues, but the top is actually quite wobbly. I imagine this either must be a glitch or an accident. :) This seems to only be plaguing the small cap T in the regular weight.</p>
      <p>Anyway, lovely family you got going there. ;)</p>
