  - id: 504177
    user: 1250
    date: 2012-04-06T08:33:00
    date_raw: 6 Apr 2012 — 8:33am
    votes: null
    html: |-
      <p>This is quite polished! Good job. It's reminiscent of a few things (like Beorcana) but I think it has enough individuality to survive.</p>
      <p>My main gripe -as before*- is the vertical proportions: you're clearly vying for text setting, and when the descenders are too long compared to the ascenders (yours seem to be exactly equal**) you're basically wasting "space potential" because in Latin-using languages ascenders are much more common. Although the descenders, being more complex, need more room to elaborate themselves, they still can't be given all that room to waste. The reference point I've personally arrived at is this: the "g" must look slightly cramped.</p>
      <p>* <a href="http://typophile.com/node/85355#comment-502929" title="http://typophile.com/node/85355#comment-502929">http://typophile.com/node/85355#comment-502929</a></p>
      <p>** Gerrit Noordzij's Ruse does this, and that's its biggest flaw.</p>
      <p>One other thing: with six weights (BTW, I personally like seeing a large number) you have to think clearly about what you want their relationships to be, and then do a good deal of testing at various sizes (and non-ideal printing conditions) while intermixing the weights, inline. Every type design class should have a full lesson on squinting!  :-)</p>
      <p>Oh, and that "Q"... it's trying too hard. It's the only glyph that I think needs to be re-thought.</p>
      <p>hhp</p>
