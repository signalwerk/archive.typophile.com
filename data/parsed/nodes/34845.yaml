      <p>&gt; Like William, from what I know it was based (at least in part) on the lettering of the Renaissance painter Mantegna. </p>
      <p>This is what is said explicitly in the link I gave. More precisely, if I cut and paste the text in the Font bureau link, we can read:</p>
      <p><cite>Mantinia, designed by Matthew Carter, is a titling face inspired by the letterforms painted and engraved by Andrea Mantegna, artist of the Italian Renaissance and one of the first to study and revive the monumental lettering of imperial Rome. Mantinia contains several distinctive ligatures more commonly found in stone than in type, a set of raised small capitals, and a few tall capitals that are also inscriptional in origin; C&amp;C 1993</cite></p>
      <p>Michel</p>
