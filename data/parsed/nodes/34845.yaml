      <p>If you mean things like the raised "O"s, that comes from the practice of lettering (typically in stone) where funny things were done to letters in order to fit the lines well, or save space/effort, or get fancy. As for the bullets between letters, the Ancient Romans did that between words, instead of using a blank space. But here it seems to be motivated by a desire to fill out the line.</p>
      <p>hhp</p>
