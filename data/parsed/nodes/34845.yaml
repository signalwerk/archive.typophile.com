    html: |-
      <p>The superscript lowercase "o" with either dot or underscore below were also part of special mercantile and accounting symbols and characters, like the @ and #.<br>
      Typically used to save space on tabular settings the word <em>Number</em> was frequently abbreviated to "No." and to save even more space the dot or underscore was placed under the raised "o".</p>
      <p>I might be able to find samples of old mercantile pi characters, but not quickly.</p>
