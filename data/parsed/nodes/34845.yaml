    html: <p>The use of dots as word separators can be dated back at least to the Mesha selle, about 842BC (written in Moabite, a language closely related to Phoenician and Hebrew). As for Mantinia, the <a href="http://www.fontbureau.com/fonts/Mantinia" rel="nofollow">Font Bureau Mantinia link</a> clearly establishes that it was inspired by the monumental lettering of imperial Rome. However, when I look more closely at the letters K and N in the word "Kingdom" above, I seem to get a closer match with <a href="http://www.fontshop.com/fonts/singles/carter_cone/itc_galliard_roman_cc/&amp;sample_text=KINGDoM&amp;sample_size=60" rel="nofollow">Galliard</a> than with <a href="http://www.fontshop.com/search/?q=mantinia&amp;x=0&amp;y=0&amp;sample_text=KINGDoM&amp;sample_size=60" rel="nofollow">Mantinia</a>.  I feel there is still some unresolved mystery.</p>
