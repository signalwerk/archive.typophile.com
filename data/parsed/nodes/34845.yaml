      <p>&gt; As for Mantinia, the Font Bureau Mantinia link clearly establishes<br>
      &gt; that it was inspired by the monumental lettering of imperial Rome.</p>
      <p>Like William, from what I know it was based (at least in part) on the lettering of the Renaissance painter Mantegna. The Roman lettering connection can be said to be inherent in pretty much any Latin caps.  :-)</p>
      <p>&gt; The word spaces were introduced into Latin and<br>
      &gt; Greek by Irish scribes in the seventh century.</p>
      <p>In "normal text" yes*, but the Romans did use dots<br>
      between words, at least in monumental lettering.</p>
      <p>* See P Saenger's treatise.</p>
      <p>hhp</p>
