      <p>On the dots as word separators.</p>
      <p>I believe the story is that in Semitic languages, which were the first to use the alphabet, they used dots and then spaces to separate words. In these, generally only the consonants were written. In Latin and Greek, which included symbols for vowel sounds, there were generally no word spaces. The word spaces were introduced into Latin and Greek by Irish scribes in the seventh century. </p>
      <p>Matthew Carter says that Mantinia is based on Andrea Mantegna's paintings and engravings of ancient Roman inscriptions. These evidently owe something to both the Roman stone carvers, and to Mantegna's own style. And then Carter is a third author.</p>
    html_clean: |-
