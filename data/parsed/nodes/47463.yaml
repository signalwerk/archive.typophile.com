    <p>A number of year ago I inherited about 80 lbs of type and a small hand press (needs new ink rolls).  My mother used all of this along with a large 1800’s press (now gone) to create stationary, flyer’s, etc. in the 60’s before PCs. She purchased all of the type and equipment by going to auctions (many small town news papers going out of business auctions) in northern Missouri.  I now need to dispose of it but find that a problem.  I don’t really want to destroy it I would like to find someone that might use it.  Other than the ink, which has dried out, I think everything necessary is there. Spacers, etc.  I remember her settig pages.  However finding someone that wants it and shipping is an issue.</p>
    <p>Any suggestions?</p>
    <p>Thanks.</p>
