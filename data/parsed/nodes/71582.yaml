    <p>There are some type rasterizing options on Photoshop.<br>
    And it is usually for anti-aliasing(smoothing), and it makes a difference between hinted result and smoothed result.</p>
    <p>Does Photoshop do anti-aliasing with TTF hinting result if the font has hinting instructions?<br>
    Or does it reject all the TTF hinting?</p>
    <p>Though I have tried searching it in the web, I couldn't find it at all;<br>
    Is there any helpful topic for it? If so, please let me know it.<br>
    Or if there's anyone who knows the relation between TTF hinting and Photoshop's smoothing, please let me know it.</p>
