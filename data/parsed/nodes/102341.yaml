      <p>Depend on the format. TrueType requires certain tables, and if your font has too many pairs, many apps won't read it <em>at all </em>(Word, I'm looking at you). PostScript fonts work similarly, but I don't know if there is a limit to the pairs.</p>
      <p>OpenType is another critter altogether. It supports the kern table, but it also has a kern feature which is infinitely more powerful (class-based kerning is just the beginning), but only in certain ways. Combine these with these two formats with the two font formats (TrueType and PostScript), and you've got lots of ways to lose. TT-flavored OT can use the kern feature, but apps have to be built to see it: InDesign can, but Word can't. PS-flavored OT interacts differently. If all you use if the kern feature, everything can read it just fine, even apps which aren't coded to do so -- the OS creates tables automagically for the default (Latin 1? English, really) language, so even Word works well enough. You can even add the old-style TT kerning tables to a PS OT font, but many apps choke and can't see the kern feature -- I once built things that way, and while Word could read the kerning, InDesign couldn't. Here's a handy table:</p>
      <p>TT + kern table: everything works, as long as you have few pairs<br>
      TT + kern feature: Word gets confused, InDesign works<br>
      TT + both: everything is groovy, as long as you have few pairs, but<br>
      PS + table: works in Word (broken as designed?), seems to work nowhere else<br>
      PS + feature: everything works, and you get those nice PS curves<br>
      PS + both: works in Word (broken as designed?), seems to work nowhere else</p>
      <p>As the lady said, <em>I love standards; there are so many to choose from...</em></p>
      <p>Your best bet is to use PS-flavored OT with the kern feature but not the table, and use the autohint from Adobe's AFDKO. You'll have fewer headaches that way. Or if you can get away with fewer pairs, go with TT and the smaller kerning table.</p>
