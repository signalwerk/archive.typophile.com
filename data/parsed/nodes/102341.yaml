    <p>Hello!</p>
    <p>I am trying to generate my new font I have created, but am having serious trouble with the kerning.  I have tried a plethora of different options, but nothing seems to be working.  Basically, I export my font, but the kerning rarely shows up in applications.  I know there is a kerning table, though, because the font works correctly in TextEdit (mac).  </p>
    <p>I am using Fontlab Studio.  When I try the font in Photoshop and Microsoft Word, it does not kern.  Are there any ideas as to why this would be?  Thank you very much in advanced.</p>
