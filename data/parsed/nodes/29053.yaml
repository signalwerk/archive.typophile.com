      <p><em>I think 98% of equally qualified type designers would have been more than happy with the rates paid for this work.</em></p>
      <p>"Thankee massah."</p>
      <p><em>but that’s incredibly naive</em></p>
      <p>Nonsense, it's just a different perspective.<br>
      The MRSP I was referring to is retail font price, not the cost of Vista. The idea that people actually buy font licences may seem somewhat bizarre at MS, but indulge me please, it's the reality for most type designers.<br>
      Say an OpenType font family of four styles retails for $100.<br>
      When an independent foundry sells a licence for that, the type designer makes $30 - $90, depending on whether the sale is "foundry direct" or through a distributor.<br>
      However, when the same designer's OT family is bundled with Vista, the designer will end up making what, a couple of cents per installed family?<br>
      Munch et al are great philanthropists :-)</p>
