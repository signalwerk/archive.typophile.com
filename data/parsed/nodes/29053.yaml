    html: |-
      <p><em>a penny for every Nokia phone sold?</em></p>
      <p>There is a difference between a bundled font and an OEM font.</p>
      <p><em>does anyone do royalties on custom font work?</em></p>
      <p>It's not about royalties, but about fair value.<br>
      One of the financial considerations made by corporations (and governments) that commission custom fonts is to compare the cost of licensing a retail font for their multiple workstations, with the cost of commissioning a proprietary design.</p>
      <p><em>it’s kind of like me dreaming of winning the lottery when I never buy a ticket.</em></p>
      <p>Sure, contracted talent doesn't get OEM "points" in this business, but that is the result of corporate concentration, nothing to do with gambling. One can still imagine how things might be without the virtual monopoly exercised by a handful of computer companies.</p>
    html_clean: |-
