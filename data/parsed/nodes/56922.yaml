    <p>In <a class="freelinking external" href="http://typophile.com/node/54942" rel="nofollow">my previous thread <strong>(Beginning with/Besides the "g")</strong></a> I obtained an unsuspected result in shaping an individual character, that obvioulsy influenced the rest of the typeface: </p><div class="imageWrap"><img src="http://typophile.com/files/g-force_6019.png"></div><br>
    Being the basic structure is almost done, now it's time to make some subtle adjustments.<br>
    This is the current uppercase alphabet: <div class="imageWrap"><img src="http://typophile.com/files/Picture1_5992.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Picture2_6068.png"></div><br>
    And these are some samples of what I'm starting to do about trap (BTW, thanks to <a class="freelinking external" href="http://themicrofoundry.com/ss_trapping1.html" rel="nofollow">Hrant Papazian's technique guidance</a>): <div class="imageWrap"><img src="http://typophile.com/files/Picture3_5975.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Picture4_5616.png"></div><br>
    [I'll post a PDF for best viewing, beyond the lack of hinting]<br>
    I'd like to hear some critique, the harder, the better.<br>
    Thank you.<p></p>
