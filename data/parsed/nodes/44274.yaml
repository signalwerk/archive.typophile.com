  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schedule_board_3859.JPG"></div><p></p>
    <p>Anyone know of a font set that looks exactly like the letters used on an old-school airport flight arrivals/departures board?  </p>
    <p>Features white letters on black boxes with rounded corners, a slight crease running across middle of each letter where each letter folds in half, etc...</p>
    <p>(I wouldn't be surprised if it's called "rolodex" or "boxscore" font)</p>
    <p>Thanks for your help.</p>
    <p>ps. awesome Drupal site!</p>
