      <p>Thank you for all for the replies. I am really new to this field and I am very interested to find as much a possible about font design. </p>
      <p>I like very much Helvetica (and Nimbus Sans) and for some reason I dislike Arial so I wanted to kind of understand how a type designer looks at similar fonts, and what are the critical elements one would consider when differentiating between very close designs, besides the aesthetic element. </p>
      <p>For instance there are fonts that technically are very close in design but the overall impression, the optical effect is totally different - at least that's how I look at Arial vs. Helvetica.  </p>
      <p>Another reason I am interested in this topic is that I recently decided to learn font design. Sans serif's are my preferred types, because of their clean appearance, readability and wide potential usage. As an exercise I decided to attempt to draw a simple sans serif font (for my own use) to replace Arial. Of course the font looks almost identical to Helvetica at this point... and it is more like a sketch at this stage. </p>
      <p>I posted the early results in another forum (Critique) and I would be very interested in your feedback. Besides working on curve smoothing and making sure that the stems have equal weights I am now trying to give the font a more distinct appearance without<br>
      losing the elements that I like in   fonts like Helvetica. One of the things that I tried so far is to give some fonts a more squarish appearance - as much as possible without altering readabillity.</p>
      <p>Please look at this post and let me know what you think. Thanks</p>
      <p><a href="http://www.typophile.com/node/49228" title="http://www.typophile.com/node/49228">http://www.typophile.com/node/49228</a></p>
