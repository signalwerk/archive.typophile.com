    <p>Hello everybody, </p>
    <p>I would be really curious to know whether there are any differences between Helvetica and Nimbus Sans. Are there any features that would allow one to clearly differentiate between the two? I like Helvetica and I personally find Nimbus sans essentially a clone of Helvetica. I could not tell the difference if I would see a text and I would be asked which of the two types was used.</p>
    <p>Thanks in advance for the input</p>
