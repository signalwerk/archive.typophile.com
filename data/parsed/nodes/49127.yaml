      <p>In Robert Norton's wonderful book 'Types Best Remembered/Types Best Forgotten', Dr Peter Karow of URW explains that the many errors in Helvetica were first fixed by Berthold, then by Linotype with Helvetica Neue, and finally by URW in Nimbus, which some would argue was the best version, as it took advantage of all the preceding work. Karow also makes a persuasive case for Max Miedinger as the designer of Helvetica, and pours scorn on Linotype for minting money on Helvetica while letting its designer die a pauper. </p>
      <p>An interesting sidelight Karow points out is that when Adobe first developed ATM, they couldn't get any of their versions of Helvetica to work with it. They had to come to URW for completely fresh data.</p>
      <p>James of course is right: your clients will never know.</p>
