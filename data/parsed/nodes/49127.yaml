      <p>In my previous post I relied on memory without checking the facts first. Going back to what Dr Karow actually wrote, there are some slight differences (i.e. Neue came after Nimbus; Miedinger was complaining about Stempel (later absorbed into Lino). Here it is, a great little nugget of typeface history from one of the great participants:</p>
      <p><em>I started the IKARUS program late in 1972. In February 1973 we had completed the digitizing and plotting parts, so we could produce the first typefaces. My first customer was Walter Florenz Brendel from Dusseldorf. He had prepared the master characters for digitizing in a large size. As we do it today: 6 inches for bodysize. It was the typeface Olympia. I asked him whether he drew the characters himself: 'No, my designer did it.' They were inked and black/white. Later we used just pencil drawn contours. Then he added after severe questioning: 'Yes, the typeface is very close to Helvetica of the Stempel AG.' (formerly part of today's Linotype-Hell AG) In 1976, I met with Max Miedinger. He said, 'I am the designer of the famous Helvetica. I did it in 1957. Now, Stempel earns lots of money with it, but I am out of the game. I feel cheated.' In 1977, we digitized the Helvetica originals with IKARUS from large friskettes.... We got that service contract from Stempel AG in Frankfurt. In 1978, we digitized Holsatia, a Helvetica-clone made by the Hell company. In 1980 we digitized SANS for IBM. They never used it. In 1981, we helped the Typoart company in the DDR to digitize their Maxima, another clone of Helvetica. I guess this was the best data we ever made. One font (800 char.) included also Greek and Cyrillic and lots of accented characters. In 1982, we digitzed the Akzidenz Grotesk Buch for the Berthold company; I viewed it as another clone of Helvetica, as did Rene Kerfante, manager of the Stempel AG. In 1983, Hermann Zapf started the design of our typeface URW Grotesk because a very big publishing company (Axel Springer) wanted to have a sans serif alternative typeface. In 1985 we did our Nimbus Sans tyepface, a merger out of Helvetica, AG Buch, Hosatia, and others. We tried to avoid some of the mistakes with the old Helvetica. In 1986/87, the Stempel AG produced the Neue (New) Helvetica. They cloned themselves, but called it a new and innovative design. In 1987, we digitized the Arial typeface for Monotype, another clone. This time, Rene Kerfante, being manager at Monotype convinced me that Arial is very different from Helvetica. In 1990, we delivered new data of Helvetica to Adobe because they could not handle their old data of Helvetica with ATM. They wanted a clean start. In 1992, we made our URW TypeWorks product (500 masters +Inline, Outline, Relief, Shadow and Round). Now, one can have Nimbus Sans as a 'sixpack'. In 1993, Stefan Rogener (a typograph living in Hamburg) made statistics on the use of typefaces in the advertising branch. He came out with: 'By more than 90%, the creatives use Helvetica, Futura, Garamond, and Baskerville. They are stupid. Give me a pistol.' He is still alive. But Max Miedinger died in the late seventies, poor and without glory. I can't forget Helvetica.</em></p>
    html_clean: |-
