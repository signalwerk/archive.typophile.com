      <p>1./ In Nimbus Sans, not all terminals are perfectly horizontal or vertical - a, c, G, 5 and many more.<br>
      2./ The counter of “a” (the tear drop) has a slight notch at the bottom right (see the <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/nimbus-sans/bold-3/" rel="nofollow">Bold weight</a>).<br>
      3./ Nimbus Sans has a set of fonts for text setting and a distinct set for display setting.</p>
      <p>Despite of points 1 &amp; 2, I personally like Nimbus Sans; it stays loyal to the original design. I wish URW++ cleaned this up, and became competition to “Helvetica” or neue or whatever.</p>
      <p>(ps. There’s also Christian Schwartz’ Neue Haas Grotesk - quite promising. I wish there were a “45 Light” in the Text set as well.)</p>
