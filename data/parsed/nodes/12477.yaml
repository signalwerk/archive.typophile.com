      <p>So, I ended up using Hiragino Mincho (which the client liked), since I don't seem to have Heisei (is it part of an extras package?) It seemed to go well because one of my Japanese coworkers helped me make sure the type was the right size and she wrote: are you sure you don't speak Japanese? So I guess that's a sign that it's at least legible and readable.</p>
      <p>Thanks again for the help and advice. I'm sure my typesetting is still pretty rough, but it works. For the next time (next month) I'm going to apply your suggestions more carefully. There are a few English numbers and one or two email addresses sprinkled in the Japanse text, so that will complicate matters a bit.</p>
      <p>The most interesting part (aside from the obvious character differences) was the difference in acceptable point sizes. The smaller numbers were a bit disorienting. The other interesting part is the extra-smooth, rags that come from setting a series of individual glyphs, rather than grouped ones. Much of the text appeared fully justified. Is this acceptable? Should I be fully justifying? Or is allowing the slight variation in the rag OK? I suppose the left-to-right and horizontal layout makes many Japanese typographic conventions harder to achieve, either way.</p>
      <p>By the way, what is 'Romanji'?</p>
