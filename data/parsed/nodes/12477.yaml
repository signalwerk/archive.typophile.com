      <p>Glad to know it helped.</p>
      <p>Concerning H&amp;Js, there are some special text formatting functions that you may have to consider in addition to the usual H&amp;J values. There is a rule called Prohibited Character Processing which strictly limits the use of certain characters in beginning or ending lines. To keep this rule, word processing applications automatically adjust lines according to the types of hyphenation options a user chooses.</p>
      <p>Another thing that might interest you is that CJK are designed monospaced. It is actually typesetting systems that space Kana or Hangul (Korean script) proportionally. The soft ragged look is partially because of this and the above hyphenation algorithm. If you want to justify the spacing between every letter, you have to consider the fact that Japanese require no space between words. So it may affect the readability. The full justification is usually used in a table listing names and so on.</p>
      <p>Also, as you set both English and Japanese horizontally, you have to be careful in setting the baseline grid for Japanese. CJK use different letter alignment systems and if you try both languages on the same baseline, they won't read comfortably. Depending on the font size that you choose for Hiragino, you might have to fiddle with a different grid system for the Japanese text to have them appear on the optically same baseline.</p>
      <p>Yes, Romanji is just the Japanese equivalent to Roman or Latin characters (Romaja in Korean). Just as Hanji (Chinese), Kanji (Japanese), Hanja (Korean), Hantu (Vietnamese) refer all to Chinese characters or Han characters.</p>
      <p>If you are further interested in CJK processing systems, there is an excellent reference site of Ken Lunde at <a href="http://www.praxagora.com/lunde/" title="http://www.praxagora.com/lunde/">http://www.praxagora.com/lunde/</a>.</p>
