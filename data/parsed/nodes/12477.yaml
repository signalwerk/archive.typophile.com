      <p>Hi,</p>
      <p>Romanji is the use of Roman characters to phonetically spell out Japanese (along the same lines as Pinyin for Chinese.) Some refer to any use of Roman characters in Japanese text as ‘Romanji’ even if it is not expressly used to spell out Japanese.</p>
