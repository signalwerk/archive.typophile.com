    <p>So, tomorrow I'm going to be typesetting the Japanese version of an English document I designed. I've never done this before, and don't have any Japanese character typefaces other than the ones that come with OS X. I'll be using InDesign CS. I really have no idea what to expect.</p>
    <p>Can anyone give me any tips/advice/warnings/recommendations before I dive in head first? Anything is appreciated.</p>
    <p>Oh, just as an FYI: the English was set in <a href="http://kentlew.com/Type.html" rel="nofollow">Whitman</a>.</p>
