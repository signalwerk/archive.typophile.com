      <p>Hi,</p>
      <p>May I presume that you know how to turn on the Kotoeri input method in the international control panel in System Preferences? Also I guess that you are not going to mix English and Japanese next to each other in a text. If not, it can be trickier than the simple tips that are suggested below:</p>
      <p>1. Fonts<br>
      OS X comes with Hiragino fonts that you can set with. Osaka is the Japanese system font for menus. </p>
      <p>2. Styles<br>
      If you select Hiragino, it will provide you with three different styles with different weights. Mincho can be regarded as a Japanese counterpart of a serifed style, Gothic, a sans-serif, Maru, a sort of rounded sans-serif. Select a style that you want to set with Whitman. But consider that you may want to change the style of your choice after you actually set the text with different character sets of Japanese.</p>
      <p>3. Size, Weight<br>
      When you compare the size of Whitman and the latin alphabet in Hiragino fonts, Hiragino is about 15% bigger than Whitman. Adjust the size to find the Hiragana and Katagana still appear about 10% bigger than the latin alphabet, which is normal for CJK fonts. There are several reasons for this, such as inter-stroke space considerations and the basic letter design space of CJK and so on, but this might help you to find the right font size to go well with Whitman. You may consider reducing Hiragino again about 3% if the Japanese text will not contain any Romanji, but please remember that whenever you reduce the size, the overall grayness--thickness of strokes--can get lightened so you should keep that in mind.</p>
      <p>4. Kanji<br>
      If you are to use Kanji as well, choose one Kanji character--better to pick a relatively complex looking one--which can feel like about as much bigger as the ratio between Kana and the latin alphabet depending on the glyph that you have chosen. This is tricky, as Kanji characters can have only one stroke to tens of them. I would keep the size the same as Kana, but, if your choice is Mincho, you may realize the strokes of Kanji are quite different from those of Hiragana and Katagana and the high contrast between thick and thin may ruin the compatibility of Whitman and Mincho style. But it is up to your decision and the text that you are going to set.</p>
      <p>I only hope that this helps you a bit.<br>
      I am looking forward to hearing some more advice on this subject.</p>
      <p>Seonil</p>
