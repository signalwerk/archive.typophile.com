      <p>Also keep in mind that InDesign has many features for setting text in Japanese, but they're poorly documented and are there mostly to support the Japanese version of InDesign, which is a much different (and more expensive) beast than its Western counterpart. Try to keep your first layout simple, and don't try to get everything right (i.e. setting the text vertically and right to left) unless you're asked to do so.</p>
      <p>If you want to match Whitman, your best choices are probably Heisei Mincho or Hiragino Mincho. The Heisei family is bundled with Adobe CS. I think it might be a slightly better fit than Hiragino, which is more of a Times equivalent for Japanese.</p>
      <p>Good luck!</p>
