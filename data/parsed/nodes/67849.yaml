  html: |-
    <p>Good Morning Typophile,</p>
    <p>I'm usually pretty good at identifying typefaces but I've spent a long time searching for this face and I'm stumped. It's very similar to Eloquent from Veer and ITC Century Bold but there are subtle differences to note in the capital R, S, O, W and A among others. Also, this face is wider and slightly heavier than Eloquent and ITC Century Bold.</p>
    <p>Those fonts just don't set as nicely in capitals as this face does. Does anyone know what it is?</p>
    <p>Thanks for your help!</p>
    <p>Lauren</p>
    <p><img src="/sites/default/files/old-images/18446_1372073298971_1145913165_1131419_2915560_n_4406.jpg"></p>
