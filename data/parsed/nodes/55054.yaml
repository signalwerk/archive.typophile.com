    html: |-
      <p>If you want to give a "personal touch" with originality use your own handwriting. The question is: Is your handwriting legible?<br>
      Here it is some excellent Type Foundries specialized in handwriting/lettering:<br>
      - Sudtipos<br>
      - Borges Lettering</p>
      <p>- DStype has the great Ventura (Dino is not a specialist in handwriting but Ventura is worthwhile to see)</p>
      <p>Cheers</p>
