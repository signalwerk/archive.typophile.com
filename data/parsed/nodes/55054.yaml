  html: |-
    <p>I am looking for a good handwriting font to use on a personal website. Not cursive and something that can be easily read (even at smaller sizes).</p>
    <p>I'm trying to add to the unique, hand drawn feel that the site will have. The site is for my graphic design portfolio and will have watercolor paint and paper as the background texture.</p>
    <p>Any suggestions would be much appreciated! Also, if there's anyone who thinks that their own font might work, please let me know:)</p>
    <p>Thanks!!</p>
