    html: <p>See this <a href="http://courses.dce.harvard.edu/~humae105/fall97/twest/time.htm" target="_blank">Harvard article</a> for some information on Medieval Scripts. Since you are pre-dating printing with type, I think this is the sort of writing you will need to re-create. The <a href="http://www.ragnarokpress.com/scriptorium/" target="_blank">Scriptorium</a> is a place whre you may find fonts based on early scripts.</p>
