  html: "<p>I'm on the process os starting a new multimedia CD-ROM for a XII century subject. It will be about the Templarios(Knights Templar) presence in Portugal on the XII century.  <br> <br>Does anyone Know any good references on articles &amp; the typography used on those days? Is there any font inspired on that century/subject? <br> <br>Check this info source: <br>http://www.templarhistory.com/ <br> <br>Thanks in advance <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">   <br>adriano <br> <br>{please move this topic to the Design forum... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">}</p>"
