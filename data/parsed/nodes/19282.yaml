      <p>I know I’ll never get a perfect match, David, between metal and digital. But I was just hoping there might be a closer match than Vilna, though I agree it’s pretty close in some respects. The yud, the bet, and a few others give it away, to me. But I think it might be the best there is out there. Vilna is by far the best so far.</p>
      <p>What I am trying to do, you see, is add a couple of paragraphs to a book I am resetting. I have used scans of the old book for most of the text in Hebrew, but there’s a few new sections I need to set, and I had hoped I could use a digital font. Do you think I will get away with Vilna for this?</p>
      <p>Thanks Miguel. I’ve seen loads of Hebrew fonts looking for this match, including all the ones at that link. But somehow the perfect match has yet to be found.</p>
      <p>Maybe I am being too fussy, I know. I have sometimes hoped to commission a digital version of this font. Maybe one day.</p>
