    <p>Hi there.</p>
    <p>Excited to find this website and forum.</p>
    <p>Can anybody help me—I am trying to find a digital match for this Hebrew font. A close match would be good, but idealy I am looking for an actual digital version of this font.</p>
    <p>Sample is here: <a href="http://www.sacerdoti.com/Resources/sample.gif" title="http://www.sacerdoti.com/Resources/sample.gif">http://www.sacerdoti.com/Resources/sample.gif</a></p>
    <p>The sample is from a prayer book printed by Vivian Ridler, printer to the Oxford University Press many years ago. Obviously back then it was not a digital font, and I now need to match it.</p>
    <p>Please do help if you can.</p>
    <p>Thanks!</p>
    <p>Jonathan</p>
