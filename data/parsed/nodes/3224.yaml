    html: <p>I'm old enough to remember Letragraphica, too, but I've never seen this typeface before (if it is a typeface). The caps are similar to the old Letraset face <a href="http://www.myfonts.com/fonts/linotype/plaza-ef/" target="_blank">Plaza</a>, but it has no lowercase and it was released in 1975, a year later than the album. Perhaps Plaza was inspired by the typeface from the album? <br> <br>One other thing. In your sample, there are inconsistencies among some of the characters which suggests it may have been done by hand (and not very well). This doesn't rule out the existence of a font, though.</p>
