  html: |-
    <p>Hi People; I'm working on a CD reissue of Deep Purple's EMI UK album Burn, issued in 1974. That year someone used a commercial typeface for a band logo for posters, tour prog etc. (though it didn't appear on the LP). The logo was then used on the next album Stormbringer (1974) and a live album Made In Europe (1976) - which also used the font extensively for the credits etc. <br>I thought it was a Letragraphica font (yes I'm old enough to remember them!) but enquiries there have drawn a blank (though whether anyone there now was there 30 years ago is unlikely!). I'll add a copy of the logo but I've seen it used in body copy without the outline, so this may have been added by the ad agency responsible. I appreciate any help anyone can give me. Simon</p>
