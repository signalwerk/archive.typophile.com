    html: <p>When you say 'typographers', do you mean type designers?  There is a book called 'Rookledge's International Handbook of type Designers - A Biographical Directory'  by Ron Eason &amp; Sarah Rookledge. There is another one called 'Twentieth Century Type Designers' by Sebastian Carter. Both would be excellent resources if you want to know about type designers. Of course, these are not 'autobiographical', because they were not written by the designers, but I presumed that maybe your assignment didn't require more than biographical information. Your other course of action is to use <a href="http://www.myfonts.com/person/index.html" target="_blank">Designer links</a> at MyFonts.com, and to use Google to search for biographical information about well-known designers. </p>
