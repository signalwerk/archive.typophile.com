    html: "<p>&gt;&gt; does anyone know where i can find information on where Neuzit S was first used? <br> <br>The font is actualy called Neuzeit Grotesk ('New Age Grotesque') and was designed by Wilhelm Pischner for the Stempel foundry in 1928. It's an integral part of the ancestry of the popular DIN Schriften fonts. <br> <br>As for your question, well, Google is your pal: <br> <br>Linotype Font Lounge - <a href=\"http://www.linotype.com/7-540-7/wilhelmpischner.html\" target=\"_blank\">http://www.linotype.com/7-540-7/wilhelmpischner.html</a> <br> <br>Klingspor Museum - <a href=\"http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Pischner/WPischner.pdf\" target=\"_blank\">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Pischner/WPischner.pdf</a> <br> <br>History of the Stempel foundry - <a href=\"http://cgm.cs.mcgill.ca/~luc/stempel/stempelhistory.html\" target=\"_blank\">http://cgm.cs.mcgill.ca/~luc/stempel/stempelhistory.html</a></p>"
    html_clean: "<p>&gt;&gt; does anyone know where i can find information on where Neuzit S was first used? <br> <br>The font is actualy called Neuzeit Grotesk ('New Age Grotesque') and was designed by Wilhelm Pischner for the Stempel foundry in 1928. It's an integral part of the ancestry of the popular DIN Schriften fonts. <br> <br>As for your question, well, Google is your pal: <br> <br>Linotype Font Lounge - <a href=\"http://www.linotype.com/7-540-7/wilhelmpischner.html\" target=\"_blank\" class=\"link-external\">http://www.linotype.com/7-540-7/wilhelmpischner.html</a> <br> <br>Klingspor Museum - <a href=\"http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Pischner/WPischner.pdf\" target=\"_blank\" class=\"link-external\">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Pischner/WPischner.pdf</a> <br> <br>History of the Stempel foundry - <a href=\"http://cgm.cs.mcgill.ca/~luc/stempel/stempelhistory.html\" target=\"_blank\" class=\"link-external\">http://cgm.cs.mcgill.ca/~luc/stempel/stempelhistory.html</a></p>"
