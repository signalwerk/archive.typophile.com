      <p>Thanks for the prompt ID. Matches Perpetua Titling MT in style &amp; weight. Makes sense;  a British Publisher, Oxford University Press, used a font by a British designer, Eric Gill. Very appropriate font choice to caption an almost 1400 page historical survey -- the elegant carved look suggests monuments and a measured assessment of topics.</p>
      <p>Don</p>
