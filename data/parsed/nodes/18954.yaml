      <p>The typographer of old is no more. Desktop publishing killed off that skilled profession. Typography still reigns because it deals with the use and arrangement of matters typographical and design. Hermann Zapf was skilled in both typography and type design.<br>
      The German schools taught the importance of functional type design as part of the courses in typography. Many of the lessons were done in hand drawn layouts that gave a feel for a type design and in this process new type designs were evolved.<br>
      I think I'll have another beer!</p>
