      <p>Where a type designer is also art director, or works closely with an art director, it's difficult to say which is the chicken or the egg -- the type design or the art direction.</p>
      <p>That would rule out Brody and Lubalin (type designers/art directors whose types advanced their notions of what typography could be) and also Berlow and Black, or Licko and Vanderlans (type designer + art director, where the art director immediately presented a certain way of using the new types). But the Emigre fonts could still be seen as influencing Carson.</p>
      <p>Frutiger's "Univers" face, because of its systematized family, might the bill, in that it enabled a complex, single-face kind of typography to emerge in the 1960s (ironically, whether or not Univers was the face used). But perhaps this was a direction already presaged by the proliferation of Helvetica styles, and its use by the Swiss school.</p>
      <p>Univers, as pictured in the famous style chart, defined an aspect of design theory, similar in function to an axiom or an equation. Similarly, Dead History defines post-structuralism, and Beowolf defines random computer generative art. It seems that type designs can be intellectual touchstones for the way one thinks about design, independent of their actual usage.</p>
