      <p>"Who are the typographers responsible for helping to evolve the art of typography?"</p>
      <p>"...my impression that things havent changed alot in type design for a long time...."</p>
      <p>Confusion between typographer (one who composes type), typography (which is type when composed, e.g.), and type designer (who designs type), is common. Nearly all type designers are typographers, by requirement, at least in the testing of fonts, which require composition to be worth calling a font. Many type designers are also typographers, composing things with other people's fonts too. Typographers have become type designers, but most do not. </p>
      <p>The technology of type design has changed several times in the last 75 years, and quite dramatically in the last 15. The art, has changed profoundly as type design tools and font formats associated with these technologies have opened a way to whomever has the will. The whole history of the craft that survives in physical form, is becoming available in digital form, and the waves of new designers, are creating new forms every day.</p>
      <p>The only "things haven't changed a lot" in my opinion, are the letters, but even there, more need to made now than ever.</p>
