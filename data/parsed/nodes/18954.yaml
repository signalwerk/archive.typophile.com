      <p>&gt; <em>What is the typographic visual language evolving into now? Will we see more digital age vernacular or a rebellion against it?</em></p>
      <p>Hmmmm... valid questions, but in a way do our answers or responses matter? </p>
      <p>Since we are now virtually connected with anyone and everyone globally at this time, and since anyone who can access the web can potentially "publish" literature or post images, and because trained graphic designers and typographers represents a small fraction of 1% of that population, IMHO the key influences and influencers of visual language may be "home-grown" grassroots non-professional uses of type.</p>
      <p>During the age of Pre-Desktop Publishing, printed visual matter, motion/film/animation/video, signage, architectural graphics and wayfinding systems were generally designed, produced and distributed/displayed by "professionals". Access to the equipment and cost of development kept most laypeople away from venturing into graphic design and publishing. In other words, the world of visual material was designed and produced by a small population.</p>
      <p>I am both deeply interested and concerned about our visual future, yet at the same time I find the time exciting and ripe for change be it for better or worse, evolving or regressing, but more than likely a time of new directions and expressions.</p>
      <p>The affects of globally connectivity can often (and already has) lead to producing highly regional communities and micro-cultures.</p>
      <p>Take beer for instance (Mmmmm!). Though we are living with major beverage conglomerates who can produce and ship almost anywhere on earth, the rise of microbreweries and the diversity and quality of beverage is heartening. I think it is part of our human needs to NOT have everything immediately accessible and to enjoy what it takes some effort to get to, experience or attain.</p>
      <p>In short, what I am sensing is that some incredibly exciting or innovative ventures using typography or designing letterform/glyph systems will happen (or are already) in the smallest of communities (geographic or culturally). The rest of the world will keep seeing re-hashed re-fried visuals. <em>Would you like to add a side of serifs to your order? Or Super-size your regular?</em> :-)</p>
    html_clean: |-
