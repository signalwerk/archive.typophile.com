      <p>Martin,</p>
      <p>your question regarding influential contemporary typographers intrigues me. It is completely understandable that many people, laymen and even design professionals see little distinction between <em>typographers</em> and <em>type designers</em> nowadays.</p>
      <p>Up until and through the formative years of "Desktop Publishing" being a <em>typographer</em> was more than just a loose term... it was an actual profession, a real job with specific responsibilities related to the selection, specification, proofing, editing, refinement of typographic matter and took place from the initial design phase of printed material through the final proofing of printing. </p>
      <p>Prior to the demise of typesetting suppliers (shops that would set type as a business), typographers would work in such professions helping to prepare, proof and QC (quality control) typesetting before it was delivered to the client. Many typographers and type directors would also work at design studios and ad agencies, book publishers, magazine and newspaper publishers, and for printers that owned their own typesetting equipment. </p>
      <p>In many cases, typographers and type directors would critically examine and adjust ink flow and plate/blanket pressure during press proofing before signing-off on print runs.</p>
      <p>So in essence, a typographer was responsible for the production and aesthetic control on the <em>USE</em> of type and quality of printed reproduction. </p>
      <p>That was one of several chief responsibilities while I worked for Agfa's Type Division during the eighties (I also headed the Type Design department for several years but had never actually designed my own typeface). I had to oversee all phases of preparation and reproduction of all printed material coming out of the division, and since we were a major developer of typefaces as well as a major distributor of licensed type designs, that meant that if it didn't reflect high quality, no one would buy the fonts.</p>
      <p>As you can see, being a typographer has little association with the actual <em>designing</em> of typefaces, though many typographers are type designers and vice versa. Oddly enough, a good typographer could make a lousy type designer as with the other way around. Think of it as a good composer would can play an instrument but only fairly compared to a great musician would can't write music for beans.</p>
      <p>Now, back to your question -- what is your chief interest?<br>
      &gt; In those who impact and influence the look of type or those who influence the way we use it? Maybe a little of both?</p>
