      <p>Martin, the first bezier tool for the Mac was Fontographer in 1985 (2 years prior to Illustrator).<br>
      By 1995, the digital workflow had become the norm for the graphics industry.<br>
      Those ten years were the heyday of radical change in graphic design, and typography and type design were leading (vectors came first). One word: Raygun. (Carson: typographer)<br>
      "Graphis Digital Fonts" (1996) will give you an inkling of the crazy type design that was going on. Also check out the Emigre catalog with font design dates and note that Ms Licko's "Mrs Eaves" marks the end of the era, and type design started to get boring, technical, and marginal again. (Licko: type designer)</p>
