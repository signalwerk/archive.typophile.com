      <p>For your discussion above when it comes to news in typedesign its in part true that its is not really much going on in my eyes. I`d like to see more of the work in the type catalogues like Raph, Hrant and other people here seem to do at that moment. The type catalogues by FontShop and so on for me are a bit depressing. It is all so liveless, rounded sharp at the edges, litte charming. Don’t if I explain me right. It is true that we are missing brakethroughs, no? Mrs Eaves was quite good for example but only the italic to my eyes. For me many type designs lack charm, some kind of personal treatment. That will hold on for more than 5 months. New classics if you want. But I am expressing only some kind of personal impression, un non so che? like the Italians say. ;-)<br>
      Maybe its digital age that ruins everything. Too fast too easy exchange everything.<br>
      Do we need some personality like Morris again (for Gods sake not his characters!;-)?</p>
      <p>Stefan</p>
