    <p>Hi all,</p>
    <p>Has anybody else out there ever been paid font royalties from Fontworks (<a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a>)? I am finding them diabolically difficult to communicate with and, despite me having been with them for a year, am yet to receive any royalty payments.</p>
    <p>Just wondering what the experiences of others has been...</p>
    <p>ATF</p>
