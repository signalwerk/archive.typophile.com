    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Mark van Bronkhorst</strong></p>
    <p>Mark van Bronkhorst is principle of <a href="/wiki/MvB%20Design" class="freelinking" rel="nofollow">MvB Design</a>, <a href="/wiki/MvB%20Fonts" class="freelinking" rel="nofollow">MvB Fonts</a> and <a href="/wiki/TypoBrand" class="freelinking" rel="nofollow">TypoBrand</a>. Through his firm, MvB Design, he has served clients <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> and <a href="/wiki/FontHaus" class="freelinking" rel="nofollow">FontHaus</a> among others.</p>
    <p>Mark art directed the first three issues of <em><a href="/wiki/Font_Magazine" class="freelinking" rel="nofollow">font magazine</a></em>.</p>
    <p>Mark has had great success with the commercial release of the quirky, DIN-like typeface ITC Conduit. His more recent <a href="/wiki/garamond" class="freelinking" rel="nofollow">garamond</a> style font, Verdigris, is also well liked.</p>
