    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Mark van&nbsp;Bronkhorst</strong></p>
    <p>Mark van Bronkhorst is principle of <a href="/node/12437" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MvB Design</a>, <a href="/node/13432" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MvB Fonts</a> and <a href="/node/13433" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypoBrand</a>. Through his firm, MvB Design, he has served clients <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a> and <a href="/node/13426" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontHaus</a> among&nbsp;others.</p>
    <p>Mark art directed the first three issues of <em><a href="/node/add/wiki?edit%5Btitle%5D=Font_Magazine" title="Create node &quot;Font_Magazine&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">font magazine</a></em>.</p>
    <p>Mark has had great success with the commercial release of the quirky, <span class="caps">DIN</span>-like typeface <span class="caps">ITC</span> Conduit. His more recent <a href="/node/12481" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Garamond</a> style font, Verdigris, is also well&nbsp;liked.</p>
