    html: |-
      <p>Released in 1948 in the era of great show-card lettering.<br>
      Compare your first image with this style sample for lettering artists:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LoadedBrushScript2_4959.jpg"></div><br>
      There are quite a few digitized brush script fonts but none is a perfect match. The closest I was able to find to the tone and general feel of your first image is Signalist by Mike Melvas:<br>
      <a href="http://www.myfonts.com/fonts/mika-melvas/signalist/" title="http://www.myfonts.com/fonts/mika-melvas/signalist/">http://www.myfonts.com/fonts/mika-melvas/signalist/</a><br>
      There are also two fairly close fonts from Filmotype:<br>
      Filmotype Lakeside:<br>
      <a href="http://www.myfonts.com/fonts/filmotype/lakeside/" title="http://www.myfonts.com/fonts/filmotype/lakeside/">http://www.myfonts.com/fonts/filmotype/lakeside/</a><br>
      and<br>
      Filmotype Lasalle:<br>
      <a href="http://www.myfonts.com/fonts/filmotype/lasalle/" title="http://www.myfonts.com/fonts/filmotype/lasalle/">http://www.myfonts.com/fonts/filmotype/lasalle/</a><br>
      Lasalle is also available from Scangraphic and Elsner+Flake.<br>
      BTW the lettering artists for Unfaithfully Yours were busy. They also produced a third version of the movie title:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/UnfaithfullyYours1948_4_4669.jpg"></div><br>
      Don<p></p>
