    html: |-
      <p>FYI...just in case anyone else runs into the issue of trying to find ClearviewOne, this is what I found out from the foundry, Terminal Design:</p>
      <p>"ClearviewText is the replacement for ClearviewOne. The metrics and kerning in ClearviewText have been improved and may not match exactly the metrics in the Old ClearviewOne. ClearviewText is also an OpenType font so it contains small caps, and various numeral styles."</p>
      <p>Thanks Pieter for directing me to the foundry where I was able to find the answer I needed :)</p>
