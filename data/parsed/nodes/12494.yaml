    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Futura</strong></p>
    <p>Probably the most important <a href="/node/add/wiki?edit%5Btitle%5D=geometric%20sans" title="Create node &quot;geometric sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">geometric sans</a> typeface, often imitated but never (quite) excelled. Designed by <a href="/node/12191" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Paul Renner</a> for the old German <a href="/node/add/wiki?edit%5Btitle%5D=Bauer" title="Create node &quot;Bauer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bauer</a> foundry (today the <a href="/node/add/wiki?edit%5Btitle%5D=Fundici%C3%B3n%20Tipogr%C3%A1fica%20Bauer" title="Create node &quot;Fundición Tipográfica Bauer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fundición Tipográfica Bauer</a> in Spain) between 1927 and 1930. Strongly influenced by the Weimar-era minimalist spirit that also played a role in the <a href="/node/13713" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bauhaus</a> school (Renner himself was not a member of the Bauhaus). The large Futura family comprises one of the earliest <a href="/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sans serif</a> <a href="/node/12495" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">type system</a>s, and has grown over the years to include a complementary condensed family, a wide range of weights, and&nbsp;obliques.</p>
    <p>Almost 80 years later, Futura’s popularity as a crisp, clean sans serif typeface has not waned, and versions of the family are available from almost every major vendor. The original designs owned by Fundición Tipográfica Bauer are distributed via the Spanish foundry <a href="/node/add/wiki?edit%5Btitle%5D=Neufville%20Digital" title="Create node &quot;Neufville Digital&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Neufville Digital</a>, who offer a superior version of the family with old style figures and small caps. Futura as Renner originally conceived it was definitely a product of the experimental spirit of the times, and included a wide variety of radically diverse alternate forms for various letters. While not offered by Bauer with the original metal version of the typeface, and then left unavailable for many years, these alternate forms were included by <a href="/node/15968" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">The Foundry</a> in their issue of Architype&nbsp;Renner.</p>
    <p>In the 1980s, <a href="/node/12118" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adrian Frutiger</a> took inspiration from Futura in his design of <a href="/node/12462" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir</a>, and later <a href="/node/12461" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir Next</a> (with <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a>, 2004). These are less new typefaces than revisions of Futura to match Frutiger’s model of how the sans serif typeface should&nbsp;work.</p>
    <p><strong>Discussion:</strong><br><a href="http://www.typophile.com/node/18710">“Best” digital version of&nbsp;Futura</a></p>
    <p>See also <a href="/node/31372" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Steile Futura</a>.</p>
