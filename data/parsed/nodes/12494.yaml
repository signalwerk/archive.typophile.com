    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Futura</strong></p>
    <p>Probably the most important <a href="/wiki/geometric%20sans" class="freelinking" rel="nofollow">geometric sans</a> typeface, often imitated but never (quite) excelled. Designed by <a href="/wiki/Paul%20Renner" class="freelinking" rel="nofollow">Paul Renner</a> for the old German <a href="/wiki/Bauer" class="freelinking" rel="nofollow">Bauer</a> foundry (today the <a href="/wiki/Fundici%C3%B3n%20Tipogr%C3%A1fica%20Bauer" class="freelinking" rel="nofollow">Fundición Tipográfica Bauer</a> in Spain) between 1927 and 1930. Strongly influenced by the Weimar-era minimalist spirit that also played a role in the <a href="/wiki/Bauhaus" class="freelinking" rel="nofollow">Bauhaus</a> school (Renner himself was not a member of the Bauhaus). The large Futura family comprises one of the earliest <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> <a href="/wiki/type%20system" class="freelinking" rel="nofollow">type system</a>s, and has grown over the years to include a complementary condensed family, a wide range of weights, and obliques.</p>
    <p>Almost 80 years later, Futura's popularity as a crisp, clean sans serif typeface has not waned, and versions of the family are available from almost every major vendor. The original designs owned by Fundición Tipográfica Bauer are distributed via the Spanish foundry <a href="/wiki/Neufville%20Digital" class="freelinking" rel="nofollow">Neufville Digital</a>, who offer a superior version of the family with old style figures and small caps. Futura as Renner originally conceived it was definitely a product of the experimental spirit of the times, and included a wide variety of radically diverse alternate forms for various letters. While not offered by Bauer with the original metal version of the typeface, and then left unavailable for many years, these alternate forms were included by <a href="/wiki/The%20Foundry" class="freelinking" rel="nofollow">The Foundry</a> in their issue of Architype Renner.</p>
    <p>In the 1980s, <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> took inspiration from Futura in his design of <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a>, and later <a href="/wiki/Avenir%20Next" class="freelinking" rel="nofollow">Avenir Next</a> (with <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a>, 2004). These are less new typefaces than revisions of Futura to match Frutiger's model of how the sans serif typeface should work.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://www.typophile.com/node/18710" rel="nofollow">"Best" digital version of Futura</a></p>
    <p>See also <a href="/wiki/Steile%20Futura" class="freelinking" rel="nofollow">Steile Futura</a>.</p>
