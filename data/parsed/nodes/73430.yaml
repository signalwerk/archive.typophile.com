    <p>Hey everybody,</p>
    <p>There are a lot of topics about hinting on typophile, but I couldn't find an answer to this.<br>
    I have done manual hinting for my typeface (expletus), but when I generate an Opentype PS font the hinting doesn't seem to have any effect. If I generate an Win TrueType/Opentype TT font it does work. </p>
    <p>This may sound a bit weird so to clarify: When genrating a font in TypeTool it gives me five options. These are: Win TrueType/Opentype TT, Opentype PS, Windows Type 1, ASCII/UNIX Type 1, Fontlab. To be honest I don't really get all these options, but untill now opentype ps always worked fine for me.</p>
    <p>Does Opentype PS simply not support hinting or does it need a different kind of hinting or am I doing something else wrong?</p>
    <p>sample 2 is with the Opentype PS font, so without functioning hinting.<br>
    sample 3 is with the Win TrueType/Opentype TT font, so with functioning hinting.</p>
    <p>Thanks in advance,</p>
    <p>Jasper de Waard</p>
