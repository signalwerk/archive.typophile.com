      <p>The differences you got are from screen tests with Acrobat/Reader or from prints?</p>
      <p>I also got generally better on screen results with non-hinted versions. But non-hinted complex glyphs, like ampersand or section mark, sometimes render horribly –while the hinted version keeps a reasonable (although suboptimal) result.</p>
      <p>With print tests, hinted fonts are definitively better, especially at sizes smaller than 14pt. PS hinting excels for printing but achieves limited results on screen. If your font is designed mainly for screen usage, TT hinting is a better choice.</p>
      <p>I compared your PDF files on screen (Windows Vista, Acrobat 9). At 50%, the non-hinted reads better. At 100% the only noticeable difference is a pixel up/down in H bar, with very subtle changes in curves –but both reads well. At 150% they are rigorously equal, except for g –but, again, both are good.</p>
      <p>Proper alignment zones (this is, zones which coincides with main stems/curves of your glyphs) helps to get better on screen result. But I don't know if this feature is available in TypeTool (I use FontLab).</p>
