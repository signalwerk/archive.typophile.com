    html: |-
      <p>Both PS and TT hinting acts on screen and on printing. PS is simpler and focused on printing. TT is far more complex and targets screen results.</p>
      <p>OpenType format could be generated in two "flavors", OpenType PS (also called OT CFF) or OpenType TT. Both are mainly equal, the hinting system is their main difference.</p>
      <p>You must use the hinting system according to the kind of OT file you plan to generate. Please note you also must set you UPM size differently to one or other format (PS default is 1000 UPM while TT default is 2048).</p>
      <p>The vast majority of OpenType fonts are OT PS. One of the few exceptions is Vesper Pro.</p>
      <p>Suggestion: does not forget about hinting. Set hints manually as you're already doing and rely on print tests more than screen ones. Keep going with OT PS and put your focus on producing a good and consistent design. In the future, you can use this PS font to produce an OT TT for screen/web use if this is necessary.</p>
