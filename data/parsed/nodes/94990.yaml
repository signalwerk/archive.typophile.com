    <p>My yet-to-be-named typeface has changed a lot since I <a class="freelinking external" href="http://typophile.com/node/89999" rel="nofollow">posted my first drafts here</a>, so I decided to star another topic.</p>
    <p>I dropped most of the serifs, and left only those of them which enhance readability. The idea behind that was to "trap" each glyph in some sort of rectangular box  and thus  separate it from the rest in order for it to be processed more easily.<br>
    I also made the widths of the glyphs close to equal, to enhance this effect.</p>
    <p>Click to open the thumbnails in a biggers size:<br>
    <a href="https://dl.dropbox.com/u/46459223/rounded%20slab/version%202/03.png" target="_blank" rel="nofollow"><br>
    <img src="https://dl.dropbox.com/u/46459223/rounded%20slab/version%202/03.png" width="550px"><br>
    </a></p>
    <p><a href="https://dl.dropbox.com/u/46459223/rounded%20slab/version%202/04.png" target="_blank" rel="nofollow"><br>
    <img src="https://dl.dropbox.com/u/46459223/rounded%20slab/version%202/04.png" width="550px"><br>
    </a></p>
    <p>Right now I am on a quest of making it render properly in small sizes (not much success, so far):<br>
    <a href="https://dl.dropbox.com/u/46459223/rounded%20slab/version%202/01.png" target="_blank" rel="nofollow"><br>
    <img src="https://dl.dropbox.com/u/46459223/rounded%20slab/version%202/01.png" width="550px"><br>
    </a><br>
