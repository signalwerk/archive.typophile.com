     I also plan to add cyrillic support(this is the first draft):<br>
    <a href="https://dl.dropbox.com/u/46459223/rounded%20slab/version%202/05.png" target="_blank" rel="nofollow"><br>
    <img src="https://dl.dropbox.com/u/46459223/rounded%20slab/version%202/05.png" width="550px"><br>
    </a></p>
