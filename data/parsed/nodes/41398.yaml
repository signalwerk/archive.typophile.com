      <p>I don’t know if it had changed by version 6, but “way back when” QuarkXPress 3 and 4 only supported ligatures in the Mac version, not on Windows. This led to some interesting compatibility issues between the Mac and Windows versions.</p>
      <p>Cheers,</p>
      <p>T</p>
