      <p>Shailesh, </p>
      <p>QuarkXPress 7 supports ligatures in OpenType and Type 1 fonts. QuarkXPress 6 only supports the standard ligatures in Type 1 fonts, but I don’t know how :P</p>
      <p>A.</p>
