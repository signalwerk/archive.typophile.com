    <p>Need some help. </p>
    <p>I’m a newbie when it comes to PCs. The question is can you utilise ligatures using Quark 6.0 for Windows? I’ve read somewhere that Windows does not support ligatures. Is this correct?<br>
    Using Quark 6.0 with Windows. Fonts: Fontbureau Miller. </p>
    <p>Thanks, Shailesh</p>
