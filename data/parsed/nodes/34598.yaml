      <p>I am still unconvinced hat you MUST be favoring the black when doing calligraphy - or put better maybe that Calligraphy has this problem in a way that is special or unique to it. I am convinced that working in the black rather than Notan is what 99% of practitioners do. But I also think that what 99% of all ’makers of letters’ in all techniques/process’ do. Going to Notan is an very expert shift not easily done.  While I am open to hearing more about the ’rhythmic bond of the white forms’ I have to admit to remaining skeptical of that as well. It isn’t that I don’t see that there is something to what GN is saying. It’s just that I think it’s a very incomplete way of looking at it.</p>
      <p>Also re: the actual topic of the thread. I think that it is reasonable to show your image as long as you don’t make great claims to precise historical accuracy simply because lots of scribes used multiple styles and the style they used was related to content and the desire of their patron. The problem with writing about calligraphic styles over time is that the actual complexity is extremely hard to wrap your head around and harder still to explain so less than accurate generalizations are made. The tendency to write in authoritative modern style ’ This is how it was ’ vs a postmodern more scientific ’These are my observations - these are my sources’ further compounds the problem. But as I say. There is no reason to present the thing as a modernist.</p>
