    html: '<p>Probably a custom font from a Fraktur style. See some example here : <a href="http://www.myfonts.com/search/fraktur/fonts/" title="http://www.myfonts.com/search/fraktur/fonts/">http://www.myfonts.com/search/fraktur/fonts/</a></p>'
