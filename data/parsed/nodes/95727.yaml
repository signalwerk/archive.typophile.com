    date_raw: 21 Aug 2012 — 11:24am
    votes: null
    html: <p>Probably not a font at all. Like most newspaper nameplates, this is a custom design, loosely based (as are some other newspaper nameplates) on the general forms found in <a class="freelinking external" href="http://typoface.blogspot.com/2008/10/newspaper-titles-what-on-earth-is-this.html" rel="nofollow">Engravers Old English</a>.   It's possible that someone has created a font based on those few letters, much as Carter has created and used "Fraktur Six"  for internal use at the New York Times.</p>
    html_clean: <p>Probably not a font at all. Like most newspaper nameplates, this is a custom design, loosely based (as are some other newspaper nameplates) on the general forms found in <a class="freelinking external link-external" href="http://typoface.blogspot.com/2008/10/newspaper-titles-what-on-earth-is-this.html" rel="nofollow">Engravers Old English</a>.   It's possible that someone has created a font based on those few letters, much as Carter has created and used "Fraktur Six"  for internal use at the New York Times.</p>
