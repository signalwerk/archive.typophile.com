      <p><a class="freelinking external" href="http://www.zecraft.com/lettering/le-monde" rel="nofollow">Custom logotype and bespoke typography</a> by Jean-François Porchez.<br>
      Some very loosely similars: <a class="freelinking external" href="http://www.dafont.com/germanica-family.font" rel="nofollow">Germanica</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/parkinson/cabazon/" rel="nofollow">Cabazon</a>, <a class="freelinking external" href="http://www.myfonts.com/search/old+english" rel="nofollow">Old English</a>, <a class="freelinking external" href="http://www.dafont.com/old-london.font" rel="nofollow">Old London</a> (have also a look to <a class="freelinking external" href="http://moorstation.org/typoasis/designers/steffmann/index.htm" rel="nofollow">Fraktur and Blackletter fonts by Dieter Steffmann</a>)</p>
