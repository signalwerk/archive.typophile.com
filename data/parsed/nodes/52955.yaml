    <p>New Container Icon Set from antrepo, another 40 icons about colorful big metal box.<br>
    It's compatible with any Mac Os system, also compatible with Windows XP and Windows Vista.<br>
    It is freeware. Download it, share it, use it !</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/591191230120882_3963.jpg"></div><p></p>
    <p>Mac icons is include at least the 16x16, 32x32, 128x128, and 512x512 pixel resources for each icon. The 512x512 size is for use with Mac OS X 10.5 Leopard and later.<br>
    <a href="http://rapidshare.com/files/176578195/a2591Mac2.zip" rel="nofollow">Download container Mac OS icon set 2</a></p>
    <p>Windows Icons is include at least the 16x16, 32x32, 128x128, and 256x256 pixel resources for each icon.<br>
    <a href="http://rapidshare.com/files/176325342/a2591Win2.zip" rel="nofollow">Download container Windows icon set 2</a></p>
    <p>The Full icon set preview is <a href="http://antrepo4.com/image/iconfull.jpg" rel="nofollow">here.</a><br>
    The First Container Icon set is <a href="http://a2591.blogspot.com/2008/11/container-icons.html" rel="nofollow">here.</a></p>
