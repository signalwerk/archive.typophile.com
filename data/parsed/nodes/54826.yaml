    html: <p>I can't say for sure, but I think Kinchius either cut his own fonts or had somebody cut them for him. Somebody here would likely know for sure. Most of the roman fonts in use at that time look something like Garamonds, but there were a number of different ones. The largest sizes on that title page, however, don't look like any Garamond I've ever seen, so I am quite sure they are by someone else. The text font could very well be a Garamond.</p>
