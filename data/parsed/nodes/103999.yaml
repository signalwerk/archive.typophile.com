    html: |-
      <p>When i have a look at this it appears to be a phototype version of the Akzidenz Grotesk. This means, that i don’t think it’s possible to reproduce it with a vector font. Probably it was done with a “duck-shooter” or  Diatype (1960) from Berthold. That would explain why the letters don’t look like todays Akzidenz.</p>
      <p>It is not likely to be a “Shelter Grotesk NF” because it is not that geometric and the /C doesn’t close that much. With “Hass Grotesk” i believe you refer to the “Alte Haas Grotesk”, if so, that is highly unlikely because the “Alte Haas Grotesk” later redesigned and known as Helvetica always ends its strokes with horizontal endings. The “Royal Grotesk” would be entirely possible but it is just an alternated Akzidenz released in 2009, probably made by an older copy of the Akzidenz Grotesk.</p>
      <p>hope that helped you solving your problem</p>
      <p>best regards</p>
