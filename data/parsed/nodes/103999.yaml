      <p>In some cases the Starsettograph / Starograph / Staromat-Versions of Berthold typefaces differ from the Diatype version.<br>
      According to Wikipedia, the film <a href="/wiki/https%3A/%252Fen.wikipedia.org/wiki/To_Kill_a_Mockingbird_%28film%29" class="freelinking" rel="nofollow">To Kill a Mockingbird</a> is from 1962 and it has been produced in the US. The first Diatype was sold in 1960 but I wonder if Berthold had been selling these in the US as early as 1962. The first Starsettograph, as produced by Film-Klischee GmbH before they were bought by Berthold is from 1961.<br>
      My conclusion: Akzidenz Grotesk: yes, Diatype: no, Starsettograph: unlikely …</p>
