      <p>Believe me, I agree that Gentium could use some enhanced typographic features. :-) We're working on it, but balancing it with other projects has been difficult. I can tell you, however, that the small caps are done for the regular and italic - not a small undertaking when you have literally hundreds of capitals to turn into small caps. There are a lot of other new things, but no old style figures. We hope to have a final release out mid-year, with betas before then. We're getting close!</p>
      <p>(BTW - this is only for Gentium Regular and Gentium Italic, not the additional book and bold weights.)</p>
