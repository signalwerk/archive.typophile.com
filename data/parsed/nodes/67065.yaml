      <p>As someone who only sets books, printed offset at 2400+ dpi using direct-to-plate workflow, I really lament the lack of work on Gentium Book. Gentium Regular is fine for laser printers, but a bit too light for bookwork.</p>
      <p>In contrast, I did cut oldstyle figures for Charis, and am using it for some projects. For those who need a neutral font with a tremendous number of special characters (but not Greek), Charis is a very useful font.</p>
