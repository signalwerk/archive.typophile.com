    html: <p> To defend my interest in type and seeming interest in sports, specifically baseball; I love type and I really don't get into sports at all. I do however, work at a screenprinting company that produces a lot of NCAA licensed apparel. In fact most of the designers I work with don't like sports, even though it's a major component of our business. Go figure. <br> <br>I am a little surprised with some of the judgemental/stereotypical respones. Who knew type geeks could be so catty! </p>
