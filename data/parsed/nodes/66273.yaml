      <p>I think it's fascinating how similar Chappell's typeface is to this one "Stahl". It wouldn't be the first time a foundry was 'inspired' by work from another foundry. According to Jaspert's Encyclopaedia Lydian was done for ATF between 1938 and 1946, not Monotype, as I had thought. McGrew's book says Lydian Bold Condensed was the last one designed. No mention is made in either book of "Stahl" as being similar.</p>
      <p>From what I could find looking at the Klingspor Museum site, Stahl is not a Rudolf Koch design. In fact, on <a class="freelinking external" href="http://www.linotype.com/49-14024/19331962.html" rel="nofollow">Linotype's page on the Klingspor Foundry's typeface collection</a> it lists Stahl as the work of H. Kühne, in 1939, a year after Chappell's design of Lydian.</p>
      <p>- Mike Yanega</p>
