      <p>This is what I found on a German freefont site:</p>
      <p><cite>Die Großbuchstaben der Stahl hat Rudolf Koch 1933 aus seiner Offenbach abgeleitet. Leider konnte er den Entwurf nicht mehr selbst vollenden. Die Fertigstellung übernahm sein Schüler Hans Kühne, der die Minuskeln entwickelte.</cite><br>
      [Rudolf Koch has derived the capital letters for Stahl in 1933 from his Offenbach. Unfortunately, he couldn’t accomplish the design himself. The completion was taken over by his student Hans Kühne, who developed the lowercase.]<br>
      — <a href="http://www.moorstation.org/Koch_Memorial/type/stahl.htm" rel="nofollow">Moorstation.org</a></p>
      <p>From 1931 to 1932, <a href="http://www.linotype.com/344/warrenchappell.html" rel="nofollow">Warren Chappell</a>, the designer of Lydian, was a student of Rudolf Koch in Offenbach.</p>
