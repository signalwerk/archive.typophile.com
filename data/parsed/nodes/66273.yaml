      <p>This is Steel, a revival of <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>’s Stahl, by <a href="http://www.hit-studio.co.uk/index.php?/ongoing/steel/" rel="nofollow">HIT</a>. It has been used for <a href="http://www.spectorbooks.com/" rel="nofollow">Liner Notes</a> by Spector Books, Leipzig. Not released/publicly available.<br>
      There’s also a digitization of Stahl by <a href="http://www.romana-hamburg.de/antiqua.htm" rel="nofollow">Gerhard Helzel</a>. I don’t know if it is any good – the website isn’t.<br>
      F</p>
