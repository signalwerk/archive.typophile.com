    <p>I know this isn't to the taste of most of the august members of this forum- such is life. </p>
    <p>The related copy....</p>
    <p>More than a century ago, Frank H. Atkinson presented this hand lettered style as Broken Poster. It was one of a hundred styles he demonstrated in his manual on sign painting. Even before his book was published (and certainly after), Broken Poster was a favorite with sign painters and letterers. It has graced show cards and movie posters, signs and windows displays, and advertisements of all varieties. We presented the our first digital revival of this classic in 2000. It is long overdue for an upgrade.</p>
    <p>Broken Gothic expands the basic Broken Poster to four weights, two specialty formats and some cool layed effects. The language base includes Greek, Cyrillic, Latin A, and some of Latin B and Latin Extended. There are also some nice alternates and ligatures. All weights are quite suited to posters, headlines, display copy, web headers, etc.</p>
    <p>At first glance, Broken Gothic may seem to have limited uses. Give it a chance and it will surprise you. Broken shouts out that there is a sale, a giant monster or the end of the world. Broken Gothic is comfortable in a wide range of themes and applications from zombie movie titles to salsa jar labels. While I can't recommend it for text, Broken is great for headers, banners, signs, titles, product presentation and other display applications. When you need a rough customer, Broken Gothic fills the bill.</p>
    <p>Okay, so copywriting was never my strong suit. You try coming up this stuff with wife, dog and teenage son interrupting at regular intervals. </p>
    <p>The Posters...<br>
    I like this poster and I don't care what anyone says...<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Vintage sign and dispay font_4100.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Vintage Sign Font Broken Gothic 1_3810.png"></div><p></p>
    <p>There is a layered version of Busted with like eight different fonts to be stacked one on top of the other.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Vintage Sign Font Broken Gothic 2_4952.png"></div><p></p>
    <p>The samples....<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Vintage Hand Lettered Advertising Font_4259.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Vintage Headline Banner Font_5724.png"></div><p></p>
    <p>And something a little more modern...<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Zombie A Romantic Comedy Font_5833.png"></div><p></p>
    <p>And should you get the urge to buy...<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/fontry-west/fha-broken-gothic/" rel="nofollow">http://www.myfonts.com/fonts/fontry-west/fha-broken-gothic/</a></p>
    <p>Still working on the spec book and the test drive version.<br>
    JLS</p>
