      <p>I still have some more ideas for sample posters for Broken Gothic. I thought the font would look really cool on a vintage burlap potato sack. I've seen it used on posters and signs. Atkinson demonstrated the poster weight. A painter would simply have used a narrower brush. The lighter weights I added expand Broken Gothic's usefulness to graphics in the digital age. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Vintage sign poster potato sack font_6240.png"></div><p></p>
