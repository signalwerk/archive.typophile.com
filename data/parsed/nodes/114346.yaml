    html: |-
      <p>First, I truly disagree with Hrant's assessment of the the three Gs  I posted a couple of days ago. In my view each is a "good" G in the context of the font in which they appear -- unambiguously a G even in the black sans, which would be used only at titling/display sizes.<br>
      Second, I do have a G to offer that I consider to be a "bad" G. Unless one is an expert in this particular style of typography -- Fraktur -- there is little to guide the reader to recognize which letter is a G, rather than an E, S or C:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FetteFrakturSGFC_6425.jpg"></div><br>
      So dear reader, I invite you to play the game of "find the G." Also, for that matter, the E, S, and C.<br>
      BTW I clearly recall this problem from when I was learning to read Fraktur -- I had to tell them apart mainly by context.<br>
      Don<p></p>
