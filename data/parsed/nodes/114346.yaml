    html: |-
      <p>Because that makes it less a "C".</p>
      <p>Let's look at each one of those four:<br>
      - The first looks like a Devanagari "s" with an exotic accent. Nice logo for a yoga studio in Szczecin...<br>
      - The second is pretty much a "C" in smaller sizes.<br>
      - The third is fine, if ugly.<br>
      - The fourth is totally unfamiliar to many people. And hopefully will be to everybody eventually.</p>
      <p>Of course context make a lot of difference, but the basis remains. </p>
      <p>All that said however, it was probably better to say "better" instead of "good".</p>
      <p>hhp</p>
