    html: |-
      <p>---start quote---<br>
      A good "G" has a strong horizontal bar.<br>
      ---end quote---<br>
      Why?<br>
      Here are three Gs I recently made, shown in context. Each meets a different need, only one  has a strong horizontal bar.<br><img src="/sites/default/files/old-images/ThirdManInGodWeTrust_4093.jpg"><br>
      A sans based on the lettering on the  Criterion DVD cover for THE THIRD MAN. Clearly it does not say that we trust in a codfish.<br><img src="/sites/default/files/old-images/UnderwoodChampionGroves_3531.jpg"><br>
      Millions of words were typed in this font on the Underwood Champion Typewriter in WWII. A thin monoline Roman with unambiguous letters that remain quite legible even when read in the blurred fifth carbon copy page. Comments I have seen say the font looks more attractive than other typewriter fonts.<br><img src="/sites/default/files/old-images/PalmerRevised_5416.jpg"><br>
      Millions of North American schoolchildren were taught cursive writing based on variations of the Palmer System of handwriting. This one is standardized to enable consistent linking of the letters.<br>
      I doubt that middle G the only one that is a candidate for being a "good" G.<br>
      Don</p>
