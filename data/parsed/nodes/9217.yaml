    html: "<p>Michael,  <br>  <br>Congratulations on getting this far. I'm confident you'll get some good feedback here.  <br>  <br>I can offer a few basic tips:  <br>  <br>1. Try not to \"frankenstein\" your letters. I'm noticing that you're flipping \"n\" to make \"u\", \"p\" to make \"q\", \"m\" to make \"w\", and \"b\" to make \"d\" - You're better off drawing a custom letter for each, and you'll get more life out of a typeface by doing so.  <br>  <br>2. The transition between large swooping arc to straight line feels awkward- try less contrast.  <br>  <br>3. Try to create consistencies in where you use a broad stroke versus a thin stroke. Here's a good example: <a href=\"http://www.typography.com/catalog/didot/charset.html\" target=\"_blank\">http://www.typography.com/catalog/didot/charset.html</a>  <br>  <br>4. Don't beat the samurai shape to death - Every letter doesn't have to have it to make a successful typeface. Look for other shapes to complement it.  <br>  <br>5. Finally, a word on baselines and x-heights. Create some rules in your design document for consistent  sizes. Right now it looks like the letters vary up and down, and setting some rules will help the overall design hold together. See some of the lowercase examples in our Type 101 course  (Under \"Courses\")  <br>  <br></p>"
