  html: <p>Ok I'm brand new at this, and yes this is my first typeface ever.  I know it's rough around the edges and needs work, but I've been looking at it for so long that I need other opinions now.   <br> <br>It's just a fun display type that I sketched in my sketchbook about a month ago.  I don't know why it turned out the way it did, but the main shape looked like a samurai sword so I went from there. <br> <br>There probably already is a font named Samurai, but I haven't seen it yet so I wouldn't know. <br> <br>Thank you so much for the input. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/6520.jpg" alt="Typeface Samurai"></p>
