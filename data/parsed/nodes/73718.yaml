    <p></p><div class="imageWrap"><img src="http://typophile.com/files/awconqueror_launch_5774.gif"></div><p></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com//profile/profilejfp" rel="nofollow">Jean François Porchez</a> was approached at the end of 2009 by <a class="freelinking external" href="http://www.reflexgroup.com/" rel="nofollow">Reflex Image</a> to create a set of typefaces to relaunch the Conqueror papers collection. An important website and various others communications material was created by the agency. The designer <a class="freelinking external" href="http://www.seblester.co.uk/" rel="nofollow">Seb Lester</a> and the photographer <a class="freelinking external" href="http://www.thomasbrown.info/" rel="nofollow">Thomas Brown</a> have been hired to created various visuals using Conqueror fonts.</p>
    <p>Launched in 2010, <a class="freelinking external" href="http://conqueror.com/#/en/typography/types" rel="nofollow">AW Conqueror is a family of Free fonts available at Conqueror.com website.</a> This family include 5 variations with great potential: Small glyph sets, mostly all caps, but based on same structure, with some connection between them (width for example), to offer a great &amp; easy titling toolbox to any designers, from skillful to beginner.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/awconqueror_launch2_6322.png"></div><p></p>
    <p>We should recall that a <a class="freelinking external" href="http://conqueror.com" rel="nofollow">paper collection</a>is generally based on similar roots, with various “flavors,” colors. A collection of typefaces should reflect this similar mood, even the style of papers should be reflected into the fonts. The typefaces style built all together the brand. Each of the members try their best to be different from the others because of their features. They should work harmoniously in contrast.</p>
    <p>-- Fonts preview and download: <a href="http://www.conqueror.com/#/en/typography/types" title="http://www.conqueror.com/#/en/typography/types">http://www.conqueror.com/#/en/typography/types</a><br>
    -- AW Conqueror at Typofonderie: <a href="http://www.typofonderie.com/alphabets/view/AWConqueror" title="http://www.typofonderie.com/alphabets/view/AWConqueror">http://www.typofonderie.com/alphabets/view/AWConqueror</a><br>
    -- Full pdf specimen: <a href="http://www.typofonderie.com/icono/alphabets/pdf/AWConqueror_pdf.pdf" title="http://www.typofonderie.com/icono/alphabets/pdf/AWConqueror_pdf.pdf">http://www.typofonderie.com/icono/alphabets/pdf/AWConqueror_pdf.pdf</a><br>
    -- Typofonderie hot news featuring examples of use: <a href="http://www.typofonderie.com/gazette/hot_news/?id=467" title="http://www.typofonderie.com/gazette/hot_news/?id=467">http://www.typofonderie.com/gazette/hot_news/?id=467</a><br>
    -- Youtube channel: <a href="http://www.youtube.com/user/ArjoCreativePapers" title="http://www.youtube.com/user/ArjoCreativePapers">http://www.youtube.com/user/ArjoCreativePapers</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/awconqueror_specimen_6483.png"></div><p></p>
