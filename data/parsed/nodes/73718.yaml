    <p><img src="/sites/default/files/old-images/awconqueror_launch_5774.gif"></p>
    <p><a href="http://www.typofonderie.com//profile/profilejfp" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Jean François Porchez</a> was approached at the end of 2009 by <a href="http://www.reflexgroup.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Reflex Image</a> to create a set of typefaces to relaunch the Conqueror papers collection. An important website and various others communications material was created by the agency. The designer <a href="http://www.seblester.co.uk/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Seb Lester</a> and the photographer <a href="http://www.thomasbrown.info/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Thomas Brown</a> have been hired to created various visuals using Conqueror fonts.</p>
    <p>Launched in 2010, <a href="http://conqueror.com/#/en/typography/types" title="Click to visit an external URL." class="freelink freelink-external freelink-external">AW Conqueror is a family of Free fonts available at Conqueror.com website.</a> This family include 5 variations with great potential: Small glyph sets, mostly all caps, but based on same structure, with some connection between them (width for example), to offer a great &amp; easy titling toolbox to any designers, from skillful to beginner.</p>
    <p><img src="/sites/default/files/old-images/awconqueror_launch2_6322.png"></p>
    <p>We should recall that a <a href="http://conqueror.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">paper collection</a>is generally based on similar roots, with various “flavors,” colors. A collection of typefaces should reflect this similar mood, even the style of papers should be reflected into the fonts. The typefaces style built all together the brand. Each of the members try their best to be different from the others because of their features. They should work harmoniously in contrast.</p>
    <p>-- Fonts preview and download: <a href="http://www.conqueror.com/#/en/typography/types">http://www.conqueror.com/#/en/typography/types</a><br>
    -- AW Conqueror at Typofonderie: <a href="http://www.typofonderie.com/alphabets/view/AWConqueror">http://www.typofonderie.com/alphabets/view/AWConqueror</a><br>
    -- Full pdf specimen: <a href="http://www.typofonderie.com/icono/alphabets/pdf/AWConqueror_pdf.pdf">http://www.typofonderie.com/icono/alphabets/pdf/AWConqueror_pdf.pdf</a><br>
    -- Typofonderie hot news featuring examples of use: <a href="http://www.typofonderie.com/gazette/hot_news/?id=467">http://www.typofonderie.com/gazette/hot_news/?id=467</a><br>
    -- Youtube channel: <a href="http://www.youtube.com/user/ArjoCreativePapers">http://www.youtube.com/user/ArjoCreativePapers</a></p>
    <p><img src="/sites/default/files/old-images/awconqueror_specimen_6483.png"></p>
