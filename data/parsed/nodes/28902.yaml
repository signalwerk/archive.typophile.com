      <p>Here's one of mine that I particularly like:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hyphen_4050.png"></div><br>
      I just chopped the upper-left and lower-right corners a little so they look rounded at large sizes (though you can't tell at text sizes) and stuck actual semiserifs on the other two. When it's small it seems to slant. When it's big it just looks like it has a funny shape. And it seems a little too heavy now, but I think it has charm.<p></p>
