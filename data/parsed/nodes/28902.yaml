      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Braganza_4253.jpg"></div><br>
      Here's my Braganza example I mentioned but didn't depict. The letters obviously have rather limited application, but I am enchanted by the asymmetrical hyphen.<p></p>
      <p>I'm not deadly serious with this thread, but my interest in your thoughts is genuine. Here's what led to the question: I am considering a wordmark design for a company that has a prefix as its entire name. I was thinking of using a crisp sans for the letters, but something more lively than a rectangle for the hyphen (which then might also serve by itself as a logo). This got me looking through the fonts on my computer, and I was surprised to find so few that were interesting. </p>
      <p>@WurdBendur: I like it.</p>
