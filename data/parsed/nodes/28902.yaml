    html: |-
      <p>The proportions and spacing of hyphens are more critical than the plainness of their shape.<br>
      Here's a thought (for OT font developers), and it could also be applied to the spacing of punctuation:<br>
      Have two identical-glyph hyphen characters, but kern them differently.<br>
      That way you can use one for regular combinations, and the other for problem combinations such as Y-T, in the case feature perhaps.</p>
