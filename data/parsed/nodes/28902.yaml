      <p>It's definitely nerdy. What else is new around here?</p>
      <p>But maybe one actually useful thing that can (more like might, eventually) come out of this thread is the realization that we don't use the hyphen enough; we're obsessed with fusing words - we think we're being efficient and/or modern - but in reality we're often reducing readability. Favorite example: readjust.</p>
      <p>And once we realize that, this thread might then become more relevant!  :-)<br>
      But really, in any case, half our story is minding the details.</p>
      <p>hhp</p>
