    <p>An exhibition on typeface design has been opened tonight at the city centre of Leipzig.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schriftausstellung_mtt_03_5143.jpg"></div><br>
    .<br>
    The show focuses on recent type design trends and the younger folks associated with the typedesign class at the local HGB art academy. Of the more established designers F. Smeijers, E. Kaiser and A. Stötzner are featured. <p></p>
    <p>The selection of works is complemented by a small but exquisite choice of type specimen of the area’s former foundries, from around 1890 to 1930.<br>
    Typographic projects are presented by an array of artefacts: from sketches to type specimen, from books to posters; much of it can be physically handled by the visitor.</p>
    <p>Don’t miss it if you happen to be in the area. <a class="freelinking external" href="http://www.kunstvereinleipzig.de" rel="nofollow">More about the exhibition</a> which runs until April 24.<br>
    .<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/schriftausstellung_mtt_09_5341.jpg"></div><br>
    .<br>
    <div class="imageWrap"><img src="http://typophile.com/files/schriftausstellung_mtt_15_5966.jpg"></div><br>
    .<br>
    <div class="imageWrap"><img src="http://typophile.com/files/schriftausstellung_mtt_17_5297.jpg"></div><br>
    .<br>
    <div class="imageWrap"><img src="http://typophile.com/files/schriftausstellung_mtt_12_5180.jpg"></div><p></p>
