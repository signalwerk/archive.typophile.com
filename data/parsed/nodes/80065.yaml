      <p>Nikki, you can enjoy an equivalent of sorts, though the fonts aren't newly minted, in 'Typography - An Encyclopedic survey of type design and techniques throughout history (with 2000 illustrations)' by Friedrich Friedl, Nicolaus Ott and Bernard Stein, Black Dog and Leventhal Publishers, 1998.</p>
      <p>This splendid book will keep you off the streets and out of the pool halls for hours on end.</p>
