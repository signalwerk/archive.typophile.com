      <p>I usually underline the ordinal a and o on the grounds that superior a and o can be used instead if someone doesn't want the underline. That does mean variant encodings can result, but that's already the case. There are three different potential ways to encode numeral+ordinal sequences, and all of these are found in text, as Google searches in Portuguese attest:</p>
      <p>2a 8o (simple letter, with or without superscript styling)<br>
      2ª 8º (ordinal characters)<br>
      2ᵃ 8ᵒ (modifier superior characters)</p>
