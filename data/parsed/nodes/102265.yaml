      <p>Both Portuguese and Spanish had a handwritten tradition to use underlined ordinals. Through 20th Century, it seems Portugal slowly put this aside (maybe due to new technologies and European typographical inffluence) while in Brazil the underline still remained usual (maybe due to the delay in adopt new technologies and the lack of further typographical inffluences).</p>
      <p>There is also two another variations in Brazilian Portuguese: (1) to use a dot under the ordinal. In this case, the dot is aligned with the baseline while the numeral is kept raised. And, less common, (2) to have underlined ordinal with a dot at the baseline. As computers did not offer an easy way to set ordinals in these traditional forms, the "nude" ªº became common and acceptable. But it is always nice to find fonts and publishers taking care of underlined ordinals.</p>
      <p>In other hand, type designers interested in address these local issues (and who do not feel overburdened) could consider the problem regarding plurals. There is no easy way to write <strong>as</strong> and <strong>os</strong> as ordinals, and they are quite common in Portuguese. One need to know about OT superiors, have a font with them and use an appplication with this feature. It would be very good to have fonts with an OT substitution command to change ªs and ºs to superiors when using Portuguese.</p>
      <p>Not sure about how modern Spanish or Italian use this.</p>
