    html: "<p>Well, here in Portugal the abbreviations should always have a dot in front of the ordinal: 1.º; n.º; Prof.ª. However, 90 % of the Portuguese don't know this; even newspapers use Profª, or even Profª., with the dot behind, which is totally wrong. However, underlining them is not necessary, as established in the orthographic reform 1940 (<a href=\"http://www.ciberduvidas.pt/perguntas/get/345441\">http://www.ciberduvidas.pt/perguntas/get/345441</a>). The Portuguese language does not only contain º and ª, but also other letters: (I will use modifier superior characters): L.ᵈᵃ; S.ᵗᵒ; Ex.ᵃˢ, etc. But these abbreviations are slowly disappearing, as all can be written in normal characters, and is still grammatically correct: Lda., Sto., Exmas. (note that the dot is indispensable). In fact, there’s no limit to the words which can be shortened like this; the rule is simply to write the beginning, put a dot, and write the end in superscript: Portugal: Port.ᵃᶫ (used on maps). Personally, I prefer using ordinals, and, if possible, underlined. But sometimes it does get a bit weird, like in the short form of sexta-feira (imagine a line under the superscript): 6.ª-feira. It looks very strange, especially if the underscore is on the same hight as the hyphen...</p>"
