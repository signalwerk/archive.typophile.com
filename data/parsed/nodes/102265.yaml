      <p>I agree with charles ellertson's affirmation that it would be easier if the designers included those characters with the fonts. </p>
      <p>As to Albert Jan Pool's affirmation, I get the point, but there are limits. German typewriters had an ß available for them. Every language or country has its idiosyncrasies. Whether it's a question of "taste", "design", you name it, I am of the opinion that neither "design" or readability (or legibility, I don't care about Anglo-Saxon preciosity carried too far away) apply here. It's just a matter of choice or "norms".</p>
      <p>If Spanish and Portuguese have a handwritten tradition of writing underlined ordinals, for me it would be logical that some culture-sensitive designer would just come up with a underlined as and os (with plurals), even if as an alternate set.</p>
      <p>Even if it's not actually required, it does look better -- and surprisingly I'm seeing more and more of it now that Calibri and Cambria are default in MS Word...</p>
