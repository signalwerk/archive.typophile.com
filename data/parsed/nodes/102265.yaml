      <p>A couple years ago, I was contacted by the art director of <cite>O Globo</cite> in Rio de Janeiro to customize the ordinals in several styles of Whitman for the newpaper’s use. He explained: “To write correctly the ordinals in Portuguese they must have an hyphen behind the &lt;o&gt; and &lt;a&gt;” [by which he meant an underline beneath]. Their style guide, at the very least, demands these forms.</p>
      <p>It seems reasonable to me to have underlined ordinals as alternates to be deployed through language localization. </p>
      <p>It also seems reasonable instead to have default underlined forms of ª and º for the glyphs which are thus encoded (i.e., when input directly into the text stream as U+00AA and U+00BA), and to have separate “plain,” raised forms of <em>a</em> and <em>o</em> to combine with <em>e i l m n r s t</em> and to be deployed through the {ordn} feature.</p>
