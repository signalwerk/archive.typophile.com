      <p>Good point. The solution I included on my project is to have underlined ªº as alternates. When the language is Spanish or Portuguese, an OT command trigger the alternates automatically. I also included ordinal plurals 'as' and 'os', which do not exist in Unicode but are also needed.</p>
      <p>A small note: in OT and Unicode we have room to differentiate ªº as ordinals and ‘aeilmnorst’ as superscript and scientific superiors. In a proper OT enviroment, we could use one or another, without mixing. Unhappily, proper OT and Unicode applications are still barely available and type designers need to work around this.</p>
