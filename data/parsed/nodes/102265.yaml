      <p>Youssef, I don't think that underlined ªº are actually required in Portuguese. It appears to be a typographical tradition widely adopted in Brazil and Portugual –like the double bar in $– but not a mandatory rule. You can note that Publico, a font developed specially to a newspaper from Portugal, does not include underlined ªº. Dino dos Santos, a Portuguese type designer, also does not include them in most of his works. Anyway, I prefer to have underlined ªº,  maybe because I saw this since my childhood.</p>
