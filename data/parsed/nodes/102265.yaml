      <p>Abbreviations were always very common in Latin and a small horizontal stroke was used as an abbreviation mark in several situations. Initially, it was used to shorten "que" (that), which was wrote just as q, and to cut the suffixes -um and -am. Latter, it also marked vowel nasalization and originated the tilde.</p>
      <p>Maybe this horizontal stroke was also used to clearly mark ª and º as abbreviations. This is just a speculation, I have no concrete data about it. Anyway, Italian, Spanish and Portuguese are the Latin-derivated languages with more resemblance to late Latin (while French, Romanian, Catalan and Provençal have a more distinct structure). Thus this idea makes some sense.</p>
      <p>I tend to design № using the same criteria used to ª and º. But it seems the № used in Cyrillic is a bit different, with the stroke at the baseline (further info is very welcome on this).</p>
