    <p>I'd like to know if there is any list of fonts that contain the ª º underlined, as used in some languages (Italian, Spanish, Portuguese) to indicate ordinal numbers (such as in "1ª, 2º" etc).</p>
    <p>There are way too many fonts that do not have those underlined superscript symbols, so I'd also like to know what is the recommended typographical practice in such cases. It seems that the practice of underlining such superscripts is slowly disappearing, but mainly because so many fonts don't have them.</p>
    <p>I have been able to identify some fonts that have the characters -- Cambria, Calibri, Profile, Constantia, EB Garamond, High Tower Text, Palatino Linotype.</p>
