      <p>&gt; <em>But it seems the № used in Cyrillic is a bit different, with the stroke at the baseline (further info is very welcome on this).</em></p>
      <p>I think one should not forget that (IIRC) the overwhelming majority of № in Russian was in documents produced on typewritters.  So it is the typewriter fonts which one should examine.</p>
      <p>Unfortunately, when I had access to Russian typewriters, I would not have realized that different manufacturers may have used different fonts on them — for me all the typed documents looked the same.  And I have no clue how to find examples, e.g., Optima- or Erika-fonts nowadays.  (And [without consulting Wikipedia] I do not recollect any brand-name of Soviet typewriters — it could not have been that every one was German/Čech/etc…)</p>
      <p>Anyway, all I remember is the №s with the tops of N and º aligned.</p>
      <p><strong>Update:</strong> <a href="http://katyn.ru/forums/viewtopic.php?id=422">http://katyn.ru/forums/viewtopic.php?id=422</a> discusses some changes in typewriter's fonts in 30s–40s.  I did not inspect the originals they discuss…</p>
      <p>This <a href="http://ru.wikipedia.org/wiki/%D0%A4%D0%B0%D0%B9%D0%BB:%D0%9C%D0%B0%D1%88%D0%B8%D0%BD%D0%BA%D0%B0_%D0%9B%D1%8E%D0%B1%D0%B0%D0%B2%D0%B0_%D0%9F%D0%9F-305-01_%D0%BA%D0%BB%D0%B0%D0%B2%D0%B8%D0%B0%D1%82%D1%83%D1%80%D0%B0_%D1%81_%D0%BC%D0%B5%D1%82%D0%BA%D0%B0%D0%BC%D0%B8.JPG" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Wikipedia image of a clone of Erika</a> shows the keycap with № which matches what I discussed above.  But the actually produced symbol might have been different…</p>
      <p><strong>Update²:</strong> <a href="http://katynfiles.com/content/romanov-rp-1.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">these photocopies of 30s 40s</a> illustrate a style of typewriter's № I mentioned above; but they also have the type with “_ aligned at bottom” on most (all?) of the letterheads, and one of the used typewriters also uses this style!</p>
