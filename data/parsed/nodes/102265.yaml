      <p>When it comes to typography, I wouldn’t listen that long to what teachers in primary schools say. In primary school, I was taught to underline anything important. It was not before the age of 12 that I heard about the meaning of ‘italics’ from my English teacher. She told me that ‘italics’ had nothing to do with Italy though, it was merely ‘printed another way’. When we made a mistake in handwritten texts we were told not to strike through, but to put the mistakes ‘between dots’. Unnecessary to say that the teachers frequently overlooked our corrections … Also I was taught that words are only words when all letters are being connected. At school I learned to „quote” like this. My typography teacher at the Academy of Arts told me that the publishers he worked for insisted on the ‘english’ way, and so did he. Another Dutch publishing house prefers «French» quotes though (but in the German way, i.e. without the word spaces). Typewriters are a questionable source too, I think. My parent’s typewriter had an italic beta instead of an ß. A typewritten ellipsis was three characters wide. All of this may be very interesting, but when it comes to design, it is the designer that has to make up his mind on wether that what the laymen advocates is really worth considering. Sometimes a cigar is just a cigar.</p>
      <p>One disadvantage of underlining ª and º in a typeface is that they can only combined with the rest of the superior letters ‘aeilmnorst’ when these are being underlined too. These may be used in countries such as France, Great Britain, Belgium and the Netherlands. Just to name a few. Many typographers and graphic designers from these countries might like that (in display typography), because the underscore might provide an additional interesting element, but on the other hand (in documents), many of them will not like to see them underlined because they perceive the underscore as visual pollution or as an archaic element. To me it is a matter of design, legibility, you name it, even of taste if you prefer, but not of ‘laymen’s law’</p>
