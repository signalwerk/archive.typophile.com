      <p>andy Thanks for the reply - I just worked out how to do.</p>
      <p>I did it slightly differently from the way you said to make it easier to read.</p>
      <p><code><br>
      #Kerning---------------<br>
      #<br>
      from robofab.world import CurrentFont<br>
      f = CurrentFont()<br>
      kerning = f.kerning<br>
      #<br>
      OA = kerning[('O','A')]<br>
      AO = kerning[('A','O')]<br>
      OV = kerning[('O','V')]<br>
      VO = kerning[('V','O')]<br>
      OW = kerning[('O','W')]<br>
      WO = kerning[('W','O')]<br>
      OY = kerning[('O','Y')]<br>
      YO = kerning[('Y','O')]<br>
      OX = kerning[('O','X')]<br>
      XO = kerning[('X','O')]<br>
      OT = kerning[('O','T')]<br>
      TO = kerning[('T','O')]<br>
      KO = kerning[('K','O')]<br>
      #<br>
      #<br>
      kerning[('A','C')] = kerning[('A','G')] = kerning[('A','Q')] = kerning[('A','OE')] = AO<br>
      kerning[('D','A')] = kerning[('Q','A')] = OA<br>
      #<br>
      kerning[('V','C')] = kerning[('V','G')] = kerning[('V','Q')] = kerning[('V','OE')] = VO<br>
      kerning[('D','V')] = kerning[('Q','V')] = OV<br>
      #<br>
      kerning[('W','C')] = kerning[('W','G')] = kerning[('W','Q')] = kerning[('W','OE')] = WO<br>
      kerning[('D','W')] = kerning[('Q','W')] = OW<br>
      #<br>
      kerning[('Y','C')] = kerning[('Y','G')] = kerning[('Y','Q')] = kerning[('Y','OE')] = YO<br>
      kerning[('D','Y')] = kerning[('Q','Y')] = OY<br>
      #<br>
      kerning[('X','C')] = kerning[('X','G')] = kerning[('X','Q')] = kerning[('X','OE')] = XO<br>
      kerning[('D','X')] = kerning[('Q','X')] = OX<br>
      #<br>
      kerning[('T','C')] = kerning[('T','G')] = kerning[('T','Q')] = kerning[('T','OE')] = TO<br>
      kerning[('D','T')] = kerning[('Q','T')] = OT<br>
      #<br>
      kerning[('K','C')] = kerning[('K','K')] = kerning[('K','Q')] = kerning[('K','OE')] = KO<br>
      #√ç<br>
      #<br>
      f.update()<br>
      </code></p>
