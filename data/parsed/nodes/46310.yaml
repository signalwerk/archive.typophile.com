    html: |-
      <p>Since the kerning object works like a standard Python dictionary you don't have to use get(), you can call a value out like this:</p>
      <p><code>AO = kerning[('A', 'O')]<br>
      </code></p>
      <p>...or even better, combine that with making a new dictionary entry:</p>
      <p><code>kerning[('A', 'C')] = kerning[('A', 'O')]<br>
      </code></p>
      <p>If an entry already existed for <code>('A', 'C')</code> then it would now be replaced, or if there wasn't an entry yet a new one would have been created. Then, check your work to see if it did what you wanted:</p>
      <p><code>print kerning[('A', 'C')]<br>
      print kerning[('A', 'O')]<br>
      </code></p>
      <p>...the two of those should now be the same. </p>
      <p>Hope that helps,<br>
      Andy</p>
