      <p>Have you checked the RoboFab site? The RoboFab documentation at <a href="http://www.robofab.com/objects/index.html" title="http://www.robofab.com/objects/index.html">http://www.robofab.com/objects/index.html</a> is pretty good.<br>
      As regards kerning, see especially <a href="http://www.robofab.com/objects/font.html" title="http://www.robofab.com/objects/font.html">http://www.robofab.com/objects/font.html</a> and <a href="http://robofab.com/objects/kerning.html" title="http://robofab.com/objects/kerning.html">http://robofab.com/objects/kerning.html</a><br>
      I haven't used it for some time now, but in a RoboFab font object, kerning is a dictionary which you access like this</p>
      <p><code># import the font class:<br>
      from robofab import CurrentFont<br>
      # turn the current FLS font into a RoboFab font object:<br>
      f = CurrentFont()<br>
      # get at kerning in the current font:<br>
      kerning = f.kerning</code></p>
      <p>and then you should be able to either directly add kerning to this kerning object/dict like</p>
      <p><code># note that the key is a tuple:<br>
      kerning[ ('glyphA','glyphB') ] = 10</code></p>
      <p>or, alternatively, create a new temporary kerning dictionary which you feed with additional kerning pairs, and finally update the font's kerning dictionary with the new one</p>
      <p><code>newKerning = {}<br>
      newKerning[ ('glyphA','glyphB') ] = 10<br>
      kerning.update(newKerning)</code></p>
      <p>and don't forget to update the font</p>
      <p><code>f.update()</code></p>
