      <p>I think you have to pick a script or other style of typeface with far more sympathy to Neutraface, you should also consider when positioning the heads that it should work with any copy. Obviously I don't know the full case but with the colourways and scale you seem to be dwarfing the parent logo, I would have thought the new copy is actually subservient to the logo or at least shouldn't have the emphasis you have placed on them.<br>
      Tim</p>
