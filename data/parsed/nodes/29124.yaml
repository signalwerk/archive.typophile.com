      <p>Why not another weight of Neutraface? It would be difficult to match another Art Deco geometric face so you could look at a script, for example<br>
      <a href="http://www.myfonts.com/fonts/marksimonson/coquette/" title="http://www.myfonts.com/fonts/marksimonson/coquette/">http://www.myfonts.com/fonts/marksimonson/coquette/</a></p>
      <p>Why steal the show?</p>
      <p>It seems to me your current concepts, especially the upper and lower case version, will need to be kept above a certain size for the mark to remain printable, I would be tempted to use colour or alignment to make the logo.</p>
      <p>Tim</p>
