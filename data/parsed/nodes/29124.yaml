    html: |-
      <p>Tiffany, that banner for Coquette that appeared on Typographica is what made me buy Coquette a few years ago.</p>
      <p>However, I do agree that all Neutraface is probably the way to go. I just can't see the suits approving "Corporate Office" set in Coquette--it's too girly.</p>
      <p>I do think that Innovation Park shouldn't be in U&amp;lc. It creates awkward spaces when stacked underneath another line of type and a horizontal rule. I would go with the top text in U&amp;lc and Innovation Park set in all caps or perhaps small caps.</p>
      <p>Don't rule out using the Condensed weights of Neutraface, if you purchased them.</p>
      <p>One last thing, I remember working on a project using Neutraface and asking about a companion serif. Somehow word got around and I received an email from Christian Schwartz (who designed Neutraface for those napping during class) and he recommended Sabon (but not Sabon Next)or Whitman. I ended up choosing Whitman, but admittedly, it was for text use with Neutraface serving as the display, not a logo project.</p>
