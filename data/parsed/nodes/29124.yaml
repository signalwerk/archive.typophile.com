  html: <p>I've been working on a logo for Large development group called Innovation Park and they have already chosen a simple type treatment with Neutra Light for the name Innovation Park. But now this is going to be the subhead to everything that's actually going to be built at the site. (new info to me) Luxury Hotels @ Innovation Park.. Corporate Offices @ Innovatin Park.. What's a good font that can work we'll with Neutra Display Light but steal the show.. Please help!  here's a sample of what im working with.. please ignore kerning since this is still in early stages of development.</p>
