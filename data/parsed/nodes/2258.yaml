    html: <p>I think your idea for an organization of designers against hate is a wonderful idea. However, this name for your organization is a terrible mistake. Let me explain why.  <br> <br>It shows a misunderstanding of the psychology of hate, and will be counter-productive. <br> <br>Psychologist Alfred Adler pointed out that the first step to anti-social behavior is to divide 'us' and 'them'. The next step is that 'they' are less than human and it is ok to hate them and use violence against them. <br> <br>Recently psychologist Steven Stosney - <a href="http://compassionpower.com" target="_blank">http://compassionpower.com</a> - who has been one of the most successful in treating wife beaters and road rage, has pointed out that compassion and anger are opposites - and anger is a key component of hatred. Hatred and the accompanying anger impair a person's thinking, so that they no longer think in terms of problem-solving, but only us vs them, and whether to attack, defend, or withdraw. Compassion motivates you to understand the other person and act appropriately. When you understand the other person you can act much more effectively, whether it is to cooperate or oppose them.  <br> <br>This is why 'hate the hate' is a terrible idea. It falls into the trap of perpetuating the stupidity that hate causes, instead of providing the understanding that leads to its cure. <br> <br>Ecclesiastes said there is a 'time for love and a time for hate', and I do think that hatred is functional physical self defence. It blocks the compassion that would make you hesitate to harm the other person, and as a resulkt you may be killed yourself. Aside from battle, I see no benefit in real hate. <br> <br>Hrant's views on this matter are in my opinion completely wrong, and would lead to a much worse world.  <br> <br>I think that your chances of being effective will be greatly if you contact and accept guidance from existing organizations fighting hate groups, such as the Southern Poverty Law Center - <a href="http://www.tolerance.org/" target="_blank">http://www.tolerance.org/</a> - and the Anti-Defamation League - <a href="http://www.adl.org/adl.asp" target="_blank">http://www.adl.org/adl.asp</a> . <br> <br>These have long experience in fighting hate groups, and have had notable successes. I am not saying you should simply be a wing of one of these, but you should certainly talk to them and get benefit of their experience before going forward.  <br> <br>By the way, note the logo for Tolerance.org - not great but not bad. <br></p>
