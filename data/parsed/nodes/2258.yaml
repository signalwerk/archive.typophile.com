  html: <p>What are your first impressions? <br> <br>What do you like about it? <br> <br>What do you not like about it? <br> <br>What would you change? <br> <br>HateTheHate is a personal project that I have been kicking around my head now for about a year and a half. <br> <br>What I intend it to be is a website (hatethehate.org) that will be on ongoing image series of anti hate group propaganda submitted by designers. <br> <br>The idea behind it is that it is a hate group targeted at hate groups. So for the design I wanted something that looked deep south white trash hate group design. <br> <br>One of my friends suggested that hate and hating hate were different in that one the end result is bad and the other is good. I am not sure how this translants into design so if you have any ideas let me know. <br> <br>1st Draft <br><img src="http://www.typophile.com/forums/messages/29/21530.gif" alt="1st Draft"> <br> <br>2nd Draft <br><img src="http://www.typophile.com/forums/messages/29/21531.gif" alt="2nd Draft"></p>
  html_clean: <p>What are your first impressions? <br> <br>What do you like about it? <br> <br>What do you not like about it? <br> <br>What would you change? <br> <br>HateTheHate is a personal project that I have been kicking around my head now for about a year and a half. <br> <br>What I intend it to be is a website (hatethehate.org) that will be on ongoing image series of anti hate group propaganda submitted by designers. <br> <br>The idea behind it is that it is a hate group targeted at hate groups. So for the design I wanted something that looked deep south white trash hate group design. <br> <br>One of my friends suggested that hate and hating hate were different in that one the end result is bad and the other is good. I am not sure how this translants into design so if you have any ideas let me know. <br> <br>1st Draft <br><img src="http://www.typophile.com/forums/messages/29/21530.gif" alt="1st Draft"> <br> <br>2nd Draft <br><img src="http://www.typophile.com/forums/messages/29/21531.gif" alt="2nd Draft"></p>
