    html: "<p>&lt;font class=\"dontLookLikeCrap\"&gt;Both anger and hatred are Godly qualities. <br> <br>Paul writes: For what I am doing, I do not understand; for I am not practicing what I would like to do, but I am doing the very thing I hate. <br> <br>That is, he hates doing evil. <br> <br>And in Rev. 2: <br>`Yet this you do have, that you hate the deeds of the Nicolaitans, which I also hate. <br> <br>God speaking to one of the 7 churches, commending them for their 'hatred' of wrongdoings. <br> <br>As for anger, Jesus was angry at the moneychangers he found in the temple. Rather than making it a house of prayer, it was turned into an arena for profit. <br> <br>As Hrant stated and as the Bible shows, it's a matter of how you deal with your hatred and anger. It is a righteous quality to hate what is evil. The key after that though, is to not take vengeance into your own hands, which is what most people do. Rather, \"be at peace with all men, as much as it is possible.\" <br> <br>Two other quick notes. Hatred of a person is not the same as hating what someone has done or does. Also, because most people deal incorrectly with their anger and hatred, it makes anger and hatred seem wrong. If the anger can be used to start something good, then that is the correct kind of anger. <br> <br>But with that said, the logo &amp;/or name itself seems too ironic for me.  I think a possible problem with a logo against something that it very closely associates with is the initial confusion, and even confusion after people find out what it means. It's smart to be able to find similarities with your opposition, but maybe this is too close? Ultimately, it's your call. However, it's not a logo I would be proud of displaying, if I were in the group, no matter how well it's aesthetically designed. It has lots of baggage that you probably won't be able to overcome. <br> <br> <br> <br>  <br>&lt;/font&gt;</p>"
