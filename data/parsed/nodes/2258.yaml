    html: <p>Hi Ben <br>I like the idea of the Victorian type -- it looks kind of like a tattoo --not sure if you were consciously trying for that, but it's an interesting direction. It seems like everything I see in magazines about hate groups, skinheads, etc. always has some version of distressed heavy manual typewriter type, so it's nice that you avoided that. <br> <br>I think the style of the type is good / appropriate but I feel like the type needs to be bolder and stronger -- it seems a little too delicate / feminine now.  <br> <br>Since you already have a vaguely tattoo look happening, what about drawing the type by hand (in the same basic style) so that it's obviously hand-drawn?  <br> <br>I really like the swirly barbed wire -- you have to look twice to figure out what it is... that's nice. <br> <br>Good luck! <br> <br></p>
