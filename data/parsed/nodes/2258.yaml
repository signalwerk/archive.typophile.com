    html: "<p>William, apparently you have no idea what I'm saying (wow, that's a first). <br> <br>The trap is to make hate an Evil thing. It is human. By coming to grips with it, we can control it, and make those whose hate is out of control more human, like us. In this way of showing compassion to them, we have a better chance of converting them to a \"control mode\". So basically you're saying: I hate the fact that you're like that, and that makes us the same - but I'm in control of myself - you can be too. <br> <br>Your view is entirely too orthodox and rigid, and is leading the world down this path of destruction we're seeing more of every day. Because it's religious, as opposed to pragmatic and human. <br> <br>hhp <br></p>"
