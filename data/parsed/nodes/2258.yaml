    html: <p>Is it not all down to a matter of opinion? <br> <br>"Hitler would be an example of an unjust hatred" <br> <br>In your opinion (and I'm sure many others), but in his own mind, I'm sure Hitler believed his hatred to be wholly justified, as did many of his followers. <br> <br>Just as, in a more contemporary arena, I'm certain many millions of the followers of Islam believe their hatred for America and Western values is justified. <br> <br>I don't think it's black and white, but equally, I don't think citing examples of 'just' hatred and 'unjust' hatred does anything to further the argument. As Tanya alludes to, it merely serves to highlight the similarities between people who hate -- 'justly' or 'unjustly'. <br> <br>Jordan</p>
