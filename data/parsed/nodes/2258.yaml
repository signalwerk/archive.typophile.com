    html: <p>I see a couple people don't see the strength of the concept. A favorite tactic of bigots is to claim they are being discriminated against. When you ask them to behave themselves, they say you're being intolerant of their intolerance and cry "hypocrite!" What we see here is a mockery of that fallacy, disarming its effectiveness and outright <i>daring</i> fools to level the accusation seriously and make themselves look all the more foolish. I applaud the idea, and I think it will go places.</p>
