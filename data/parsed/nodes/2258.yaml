    html: <p>Hmmm�To be honest, I'm not certain that Hitler did hate the jews or anyone else, and I'm even less convinced that he truly felt his actions were justified. He definitely imposed "hate crimes" and promoted them as justified, but I believe he new what he was doing to be wrong and that his actions were a passionate effort to satisfy his egocentric arrogance, obsessive greed and lust for power, and overly compensated insecurities. <br> <br>Having said that, Hitler was a leader and an instigator, while I believe others who are followers can be misled to believe that their "hate crimes" are justified. <br> <br>To hate something is not wrong. <br>To hate someone is wrong. <br>To wrong someone because of hate for something or someone is wrong. <br>To promote hate of someone is wrong. <br>To promote hate of something is not wrong, unless it encourages others to wrong someone (Hitler). <br> <br>That's my take�for whatever it's worth. <br> <br>Aloha! <br>Scott</p>
