    html: <p>&lt;font class="dontLookLikeCrap"&gt;Your marks certainly do look real. Too real, I think. I see those and I think "run!" not, oh what's that text say? Designers against hate? <br> <br>I feel like this mark could benefit from some more exploration into what makes it look like a fascist/supremacist symbol. This is an identity, so I could see the current symbols interacting with more contemporary typography (as opposed to the expected circle badge). I think that this would more clearly portray the concept (as I understand it) and the body of people who will presumably fall in and support it. <br> <br>And support it they will, if it's done well. True hate is a terrible thing, and never ends well. People hating sin can be just as bad for humanity as people hating minorities. "Hate the hate" to me takes advantage of today's ironic culture. I say hate on a regular basis; "I HATE it when they don't have Swiss cheese!" I'm not deeply angered and full of animosity towards the sub shop. In this case I feel like it can be a great call to action. I don't see the purpose of this as attacking groups of people violently, but reaching people in a way that both says "hating is not acceptable by your peers" and also "here's what we can do."  <br> <br>I think assuming off the cuff that Ben's hate group will be burning things and hunting people is a bit hasty. I support the notion. I support the design. Make sure it's accessible and shows its self honestly.  <br>And good luck. <br> <br>Aaron <br>&lt;/font&gt;</p>
