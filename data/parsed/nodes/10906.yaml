    html: <p>To my great shame, though I did not design the original "For Dummies" letters or the letters on the first couple of books, "Macs..." and "PCs..." I was hired to create the rest of the alphabet, plus some punctuation, since the titles of the first books were all done in the chalkboard lettering. I don't know if the letters were ever developed into a font, but I still have my original Illustrator file, which needs a lot of work on the compound paths. What can I say -- it was ten years ago. <br> <br>I'm happy to send you what I've got, and you can do whatever you like with it. If you turn it into a font, I'd like it if you'd call it Condescend. If you feel like waiting a month or so, I'll fix the bad compound paths before I send it. Otherwise I can just email you the file as it stands now.</p>
