    I'm developing a script for interpolate nodes &amp; I'm having problem at accessing a specific master, I've tried using fl.layer, but as this is read only I cannot specify the layer to apply my changes, e.g.</p>
    <p>fl.layer = fl.layer<br>
    fl.SetUndo()<br>
    g = fl.glyph </p>
    <p>Is there an updated Fontlab API documentation? does anyone knows how to access a specific master?</p>
    <p>thank you in advance, cheers!</p>
