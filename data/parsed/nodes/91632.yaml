      <p>Hello,<br>
      you can do something like this:<br>
      <code></code></p>
      <pre>glyph = fl.glyph
      for node in glyph.Layer(1):
      	node.Shift(Point(0,50))
      fl.UpdateGlyph(fl.iglyph)
      </pre><p><br>
      Best<br>
      Eigi</p>
