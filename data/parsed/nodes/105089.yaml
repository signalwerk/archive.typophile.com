    <p>Cleaning up the huge image library I'm amassing and ran across these typographic inlays we've done.</p>
    <p>"DIABLO" in P22 Posada:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/typo_diablo_4067.jpg"></div><p></p>
    <p>"Alexandria" in a custom calligraphy:<br>
     </p><div class="imageWrap"><img src="http://typophile.com/files/typo_alexandria_6217.jpg"></div><p></p>
    <p>"PT" in Psy-Ops Alembic slightly modified to match the vibe of the other fingerboard inlays:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/typo_psyops-alembic_6229.jpg"></div><p></p>
    <p>These are all hand cut with a jeweller's saw by some amazing artisans.</p>
