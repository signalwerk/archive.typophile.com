    html: |-
      <p>I haven't looked with regards to this particular book, but the idea that, today, a p-book gets published without a web page/site/blog of some kind to go along with it is, nuts.</p>
      <p>That's where errata can and should be posted and debate can take place that can actually enhance the sales of the book.</p>
      <p>Even better, an e-book is easily corrected and an update issued. Designer/educator David Bergsland takes this approach with <em>Practical Font Design</em> and his new <em>Fontographer</em> book. </p>
      <p>BTW - I got the book some days ago and finally got a chance to rip through it quickly during a lengthy wait at a doctor's office. I've enjoyed it so far.</p>
      <p>I need to go back and read Paul's review and refresh myself on exactly what his beef is.</p>
