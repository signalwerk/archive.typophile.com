      <p>I'll probably get this out of the library, as I'm cheap and it doesn't look like something I'd want to keep around for reference. It sounds like it has both the virtues and the vices of much contemporary journalism. I agree with Matthew that we should appreciate the virtues, namely that it is extremely well written, in the sense of being easy and fun to read. I know this is no easy feat, and one which I as a writer respect and admire.  </p>
      <p>But while good and entertaining writing is a great achievement, it to my mind doesn't excuse the vices which this book has, judging by Paul Shaw's review, and knowing that Paul is an extraordinarily knowledgeable scholar of type. Some journalists have thought it was important to get it right. In fact, for many was a matter of principle, a first duty. </p>
      <p>I think it is really regrettable that this ethic of journalism has been abandoned by many, including evidently Mr. Garfield. It is evident to me that neither he nor his publisher bothered to have this vetted by an expert such as Shaw. Then he could have easily avoided outright blunders. If it was vetted and the reviewer didn't catch the blunders, then my apologies to Mr. Garfield and his publisher. But this does seem a case of abandoning the best traditions of journalism, which I am sad to see.</p>
