      <p>I read Garfield's book last night. Yes, there are a few groaners and boners. But overall I think Shaw's criticisms are a bit sour and persnickety. </p>
      <p>As Shaw concedes, "This is a book that the uninitiated will find enthralling and entertaining." There you have it. It may be true that someone "who actually know[s] something about type design … will find it maddening." But the book wasn't written for them. It's hardly sporting to criticize Garfield for satisfying his target audience — readers with a casual interest in typography —&nbsp;at the expense of sophisticated readers. No book can be all things to all people. Nobody criticizes Angry Birds for its unrealistic physics.</p>
      <p>To me, any book that introduces readers to the pleasures of typography is a good book, and ultimately makes life better for every professional typographer and type designer. Garfield's book was reviewed by Janet Maslin in the New York Times. He wrote an opinion piece for the Wall Street Journal. So it's getting a lot of good press and selling a lot of copies. You may think that's extrinsic to the merits of the book. I don't. I think that's a compliment to Garfield specifically, and a ratification generally of how far typography has come in the public consciousness.</p>
      <p>In the book, Matthew Carter says jokingly that 20 years ago, he still preferred to tell people he was a brain surgeon to avoid explaining type design for the umpteenth time. But these days, people know that type and type designers exist. Of course, you often hear "You do typography? That's so cool! I love Helvetica!" (or "I love <em>Helvetica</em>!") But you've got to start somewhere. I'd rather start there, than with brain surgery.</p>
      <p>I agree with Shaw's point that the book doesn't do much to tie together its anecdotes. I'll go a step further and say that it's editorially haphazard. In the first 30 pages, Garfield's main topic is Steve Jobs, then Comic Sans, then Gutenberg. It keeps jumping around from there. (Though maybe that's the intended gist of the title —&nbsp;by "Just My Type," Garfield means "Just The Things About Type That I, Simon Garfield, Am Interested In")</p>
      <p>Similar problem with level of detail. Garfield doesn't achieve a consistent tone —&nbsp;one page he's conducting a breezy tour of typography, the next he's on a detailed digression into some microtopic.  This book —&nbsp;and this is true of most nonfiction books —&nbsp;would've benefited from one more round of editing and rewriting.</p>
      <p>But would I recommend the book to casual readers? Sure. In the end I don't think these criticisms are showstoppers because the book doesn't ask to be read start to finish. You're supposed to take what interests you and leave the rest, and then pass it along to a friend. Whether Garfield's book recruits another 50 people or 50,000 people into the typography army, that's great for typography.</p>
