    html: |-
      <p>I'm glad someone was able to articulate what was wrong with this book. But there was also stuff right with it.</p>
      <p>I enjoyed it as entertainment; it seemed to me that the brief of the book was to popularise type design — an arcane abstraction to most people, and a funky hobby for dilettantes. Personally I think it's a good thing to bring type design into the consciousness of the masses, as it's a massively invisible industry. I'd even say it's slightly worth sacrificing factual accuracy to make it tangible to those who've never stopped to consider that every fullstop they've ever seen has been shaped by a real person.</p>
      <p>At the same time, I did find the book irritating in glossing over/joking about type designers' valid perspectives. I wrote to the editor with factual corrections, which I've never done before. Mixing up Haas Unica and Helvetica is just careless.</p>
      <p>There was some event here a while back where Simon Garfield was doing readings from the book — it seemed very much an «amuse-bouche» — for people who knew enough to laugh at Comic Sans, but not enough to get over it. For me it's an oversimplified view of a select few issues, and I'm glad it didn't pretend to be a serious essay. </p>
      <p>There's a whole lot more to the story than Simon uncovered, but I think on balance I'm glad it exists to pique people's interest in an undiscovered topic. I sort of hope there won't be a sequel, though.</p>
