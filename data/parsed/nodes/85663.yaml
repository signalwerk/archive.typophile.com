      <p>+1 to butterick's comment</p>
      <p>Look, any book with blatant inaccuracies - innacuracies easily spotted and fixed, too - hasn't earned its purchase price. And any reviewer would be obligated to point them out.</p>
      <p>What's significant is that a book with "fonts" in the title would sell pretty well. At least from what I hear.</p>
      <p>The idea that what around here usually gets called a typeface but the rest of the world calls a font has penetrated the consciousness of the average person is kind of revolutionary in the sense that a page in history has turned.<br>
      If Butterick's book is selling decently - and I certainly hope so - it's a piggy-back ride on the same social development.</p>
      <p> ◊ A couple of years ago, while watching an episode of the TV<br>
        series <em>House</em>, there was a scene between House and his oncologist<br>
        friend (the 'Watson' character - his name is escaping me)<br>
        which included a snappy comeback line in response to something<br>
        House said:"What did you do? Use a different font?"</p>
      <p>  A line like that in a hit TV series was unthinkable<br>
        until recently. If the line was "What did you do? Change the<br>
        typeface?" no viewer would have had a frame of reference for it.</p>
      <p>There's clearly a change in meaning and perception regarding type and typography that is unprecedented.</p>
