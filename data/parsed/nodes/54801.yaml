    html: |-
      <p>The top samples look like Chaim Shamen, with some Ahoni aspects. </p>
      <p>Otherwise, except for the second design, the designs are effective.</p>
      <p>Another great design of Hebrew wood type was Yitchak Ginsbourg. Unfortunately, none of his designs were preserved.</p>
      <p>A great collection of Hebrew wood designs were in the pocession of Lili Wonker, of New York. About 18 years ago, I learned about the collection from Ari Davidow, who visited her. She was an old lady then; so I don't know if she is deceased or in old age home.</p>
