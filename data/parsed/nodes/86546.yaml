    html: |-
      <p>Well. Thank you!<br>
      The name just somehow "pop up", when I was unable to find out a good name. The time was pressure and I was asking myself, why this name, why that name...<br>
      And I didn't have a good reason, why it should be named after the names I invented.<br>
      "Because" ("preto" in slovak language) was the only reasonable answer I could get. :)<br>
      So the typeface name came from the answer.</p>
