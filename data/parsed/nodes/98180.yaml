    html: |-
      <p>I created the logo for the UEFA corporate body. </p>
      <p>Ryuk is correct it was custom drawn from a sketch, with the modification of the E reflecting the U curve. The letter forms were very generic to start with, and whilst is was easier to create the straight version, the curved versions (which are the primary versions) involved a bit of optical correction. The F was modified later on the development to help harmonise the letterforms on the curve.</p>
      <p>The Euro 2012 logomark and guidelines was created by another branding agency. All the fonts mentioned above do look as though they fit the style though.</p>
