      <p>Custom job to me. Only 4 letters so could be easily reproduced using any generic sans (you could even start with Helvetica).<br>
      Some similars: <a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-beau-sans-pro/" rel="nofollow">Beau Sans</a> (officially used during UEFA Euro 2012, very easy job with this one, only needs to recreate /U using the Beau Sans /U left half part and mirroring it then cutting /A horizontal bar and making /E top left corner squared), <a class="freelinking external" href="http://www.myfonts.com/fonts/layarbahtera/layar-bahtera-doomsday/" rel="nofollow">Doomsday</a> (almost same work plus making all finials squared), <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/ashemore/" rel="nofollow">Ashmore</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/ars_type/ars_district_ot/" rel="nofollow">Ars District</a>, <a class="freelinking external" href="http://www.fontshop.com/search/?q=Sansa" rel="nofollow">Sansa</a>, <a class="freelinking external" href="http://www.houseind.com/fonts/chalet" rel="nofollow">Chalet New York 1970</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/domyouji/" rel="nofollow">Domyouji</a></p>
