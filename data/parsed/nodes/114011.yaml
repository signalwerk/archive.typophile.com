      <p>And there is a store devoted to selling railroad fonts<br>
      <a href="http://www.railfonts.com/" title="http://www.railfonts.com/">http://www.railfonts.com/</a> They don't have N &amp; W but you might find a reasonable substitute in their wide variety of choices. It would take some time to go through them. A quick run though them turned up Pennsylvania 1930s, which is based on lettering once used by the Pennsylvania Railroad for coach names in the 1930's. Reasonable price.<br>
      Don</p>
