      <p>There could also be a list of common features that could be selected from a menu in the language of the designer. These common names could then be translated via lookup tables to the default language of the user's computer. This may not be perfect but it sure breats the hell out of vague stylistic set numbers which communicate nothing. There could even be a script to look at what is in the OTF feature code and give a rough translation into the host language. If class names were standardized, this would be much simpler.</p>
