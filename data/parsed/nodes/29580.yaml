      <p>Christopher, as one of my pet peeves is the conflation of argument and quarrelling, please allow me some some definitional clarification:</p>
      <p>conversation = talk about any topic, often for the pleasure of it, changing topics at will. </p>
      <p>discussion = conversation that sticks to one topic</p>
      <p>argument = 1. a reason given for or against a claim concerning a particular topic. 2. a discussion containing such reasons. </p>
      <p>quarrel = a personal dispute involving the alleging faults or wrongdoing of the other person.</p>
      <p>insult = attack on the other person's character. </p>
      <p>To me Hrant's arguing is a positive feature of his participation, as it is thought-provoking and interesting. He often has interesting points to make. And that is a valuable contribution even when they are mistaken points--which I think they are half the time. </p>
      <p>In my view, what makes Hrant's manners barbarous is that instead of sticking to argument proper, he regularly resorts to insults and turns the argument into a quarrel.</p>
      <p>This is to the point where I am resolved to avoid discussion with Hrant.     </p>
      <p>Hrant is a thoughtful and interesting fellow who is often the life of the party on Typophile. But he is also so relentlessly quarrelsome that he regularly spoils the party. An unusual combination--the one and only hhp.</p>
