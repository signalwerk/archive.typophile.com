      <p>Currently, no names for any features are encoded in the font; only the four-letter code is. Because the features have static meanings, the application developer can translate them into whatever languages they need, along with the rest of their user interface.</p>
      <p>I don't have any particular objection to a system that would supplement the existing four-letter codes for stylistic sets with desriptive text. The 'name' table is in fact designed to do a range of strange things that would easily encompass this. It would be the responsibility of the font designer to decide how many languages to translate this descriptive text into, and if they didn't cover a given language, it would be up to the application to determine a fallback or simply display something generic like "stylistic set #4" - which is no worse than what we have today.</p>
      <p>If somebody wants to go to the work of creating a formal proposal in the appropriate language for the OpenType and/or Open Font Format specs, they should feel free. That's your next step, if you want to do something about what you see as a problem....</p>
      <p>Cheers,</p>
      <p>T</p>
