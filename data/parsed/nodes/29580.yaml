      <p>To respond to something Dezcom posted above: font families' tabular figures should all have the same tabular width in all weights. This is very important when setting financials in annual reports, where font weights, underlines, and alignments are actually dictated by SEC standards. So, to simply use a smaller point size would result in a narrower setting, breaking the tabularity. (Also useful in timetables, listings, etc, etc.)</p>
      <p>In my experience, it's a challenge to get an OsF "2" looking good. The other glyphs are all pretty self-evident.</p>
      <p>FWIW, the Apex New family has small cap lining numerals which are turned on with the small caps, in both proportional and tabular versions.</p>
