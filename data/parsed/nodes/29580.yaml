      <p><cite>I wouldn’t privilege the functionality of a UI over typographic functionality.</cite></p>
      <p>Sorry, I didn't mean to say that -- and I wasn't thinking of any particular UI (e.g. InDesign). I only meant that it made more sense to me to have numbers which are designed to match the small caps <em>in</em> both small caps features, and that that would benefit the interface by being a natural place for the user to look for them (since there is not a feature specifically for such numbers). So, in other words, putting glyphs in the appropriate feature should make finding and using them easier.</p>
      <p>Having such numbers in <em>both</em> smcp and c2sc doesn't seem so important to me (maybe just c2sc is enough), but I wouldn't want to put one kind of number in c2sc and another in smcp. I think that would be getting a little complicated.</p>
      <p>Notice, by the way, that in my suggestion, if you had some text to which you had already applied old style figures, applying small caps to some text containing numbers would get you small caps and old style figures (because the onum feature would be superceding smcp).</p>
      <p>In any case, I am still not so sure it's a good idea in general to have number substitutions happening in small caps features. (And by "not so sure," I mean that I think there are decent arguments on both sides of the issue.)</p>
