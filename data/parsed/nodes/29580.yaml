      <p>Hrant, you're like one of those people who listens to a radio station they hate and then complains about it. If you're not interested in anything which originates with Robert, then just skip the post.</p>
      <p>Here's the deal: I've worked with Robert quite a while. He shares some of his ideas with me, and sometimes they make an impression. Since Robert is not one to participate in Typophile threads and the like, I occasionally will pass on something I've learned or observed from him if I think it's relevant. I can tell that you're not interested in hearing about it, but it's not going to stop, so what's the point of being a grouch about it?</p>
      <p>Anyway, back to the topic at hand:</p>
      <p><cite>Maybe he's found what he wanted to find? Just like with his non-trapping. The numeral one does not work well in a tabular scheme, period.</cite></p>
      <p>Duh. The point was that, if one has a font in which tabular numbers will be included, it saves time and effort to design them on tabular widths first, and then make adjustments for proportional versions, rather than the other way around. Obviously the 'one' will always be problematic, so the choice in solving that problem becomes either to not make tabular figures at all, or consider better ways to design them.</p>
      <p><cite>Anyway, now that we know what Robert Robert Robert thinks, what do you think?</cite></p>
      <p>Robert has far more experience with designing fonts than I do, so it seemed to me that his approach might be more valuable -- but since you asked, it makes sense to me. It's not that it's such an original or ingenious idea, but I find it interesting that one can become so accustomed to this notion that old style figures are inherently proportional, and exacerbate the challenge of fitting them to tabular widths. By changing one's habits, one can save some labor by approaching them from a different direction.</p>
