      <p>Christopher, </p>
      <p>by no means I'd say my view is the only one valid -- of course I do consider my view a very good one ;) The design of OpenType Layout features involves both technical and usability considerations. My personal view is always to optimize/maximize usability (which is a subjective criterion, of course) without invalidating the technical considerations. So while I'm against "hacking" features, I'm all for pushing the boundaries to the greatest extent. </p>
      <p>The case conversion features are usually more accessible in application UIs (e.g. in InDesign "all caps" and "small caps" are right in the Character palette rather than in the OpenType submenu) and more comprehensible to users, while the figure style selection features are much more specialty-oriented. Things like "all caps" or "small caps" are understandable to a large number of users while "oldstyle tabular" is not necessarily so. I think upon selecting the letter case, the typeface should present itself in the "most optimal" way to the user, including selecting the best figure style. The user should always have the ability to override that preset. </p>
      <p>If case conversion lookups (case, smcp, c2sc, pcap, c2pc) are placed earlier in the font than the discretionary figure style selection lookups (lnum, onum, pnum, tnum), the user always will have the ability to override the "case-default" figure style. But I think it's still useful to have different figure styles become default depending on the letter case. This is basically where my "treatise" leads. </p>
      <p>Best,<br>
      Adam</p>
