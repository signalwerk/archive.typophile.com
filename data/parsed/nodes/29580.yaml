  html: |-
    <p>Can anyone tell me why so many of the new "all inclusive" pro <a href="/wiki/opentype" class="freelinking" rel="nofollow">opentype</a> faces from a variety of foundries are being released with <a href="/wiki/text%20figures" class="freelinking" rel="nofollow">old-style numerals</a> as part of the <a href="/wiki/small%20capitals" class="freelinking" rel="nofollow">small-caps</a> set?</p>
    <p>I understand that there is a certain stylistic flair to using non-lining numerals with old style caps on title pages and in other decorative settings. However, it seems to me that small-cap heigh lining numerals are far more useful as part of the sc set/selection; 9 times out of 10, those will be what a typesetter wants when he or she is setting small cap text.</p>
    <p>The most ironic part is that a few of these faces HAVE such numerals in the font, but just not assigned to the small cap set!</p>
    <p>I assume I am missing something and everybody else in the world works very differently than I or any of the typesetters and designers I know. That's the only explanation I can come up with.</p>
    <p>JLT</p>
  html_clean: |-
    <p>Can anyone tell me why so many of the new "all inclusive" pro <a href="/wiki/opentype" class="freelinking link-lost" rel="nofollow">opentype</a> faces from a variety of foundries are being released with <a href="/wiki/text%20figures" class="freelinking link-lost" rel="nofollow">old-style numerals</a> as part of the <a href="/wiki/small%20capitals" class="freelinking link-lost" rel="nofollow">small-caps</a> set?</p>
    <p>I understand that there is a certain stylistic flair to using non-lining numerals with old style caps on title pages and in other decorative settings. However, it seems to me that small-cap heigh lining numerals are far more useful as part of the sc set/selection; 9 times out of 10, those will be what a typesetter wants when he or she is setting small cap text.</p>
    <p>The most ironic part is that a few of these faces HAVE such numerals in the font, but just not assigned to the small cap set!</p>
    <p>I assume I am missing something and everybody else in the world works very differently than I or any of the typesetters and designers I know. That's the only explanation I can come up with.</p>
    <p>JLT</p>
