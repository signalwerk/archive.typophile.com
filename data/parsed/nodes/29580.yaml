      <p>To fixate on the problems of a particular number is a valid discussion to have, but a distraction from my original point. Numbers are a set, and I am talking about considering the success of the set overall -- just like deciding whether an alphabet works "quite well" without fixating on some particular letter, the shape of which one is stuck with. "Quite well" is relative and subjective, so despite 'one' being problematic, one can consider the overall set of tabular numbers successful to some degree or another and fairly apply that description, I believe. If you don't agree, that's fine.</p>
