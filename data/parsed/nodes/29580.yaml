      <p><cite>Whatever is the default will already be showing. So for a standard font, “Lining” will be checked, and “Tabular” underneath it.</cite></p>
      <p>But the app isn't going to know what the default is (unless it's picking something for itself). The so-called default figures are whatever glyph is named "one," "two," etc. If a font has proportional old style figures with these names, the app will see these as "default," but has no way of knowing if they are tabular, proportional, or whatever. It has to apply a layout feature before it can "know" what it has.</p>
