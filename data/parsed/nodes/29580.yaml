      -- feature pnum { sub three.lnum_tnum by three.lnum_pnum; } pnum;</p>
      <p>three.onum_pnum (proportional oldstyle) -- gets inserted in the features: "onum" and "pnum":<br>
      -- feature onum { sub three.lnum_pnum by three.onum_pnum; } onum;<br>
      -- feature pnum { sub three.onum_tnum by three.onum_pnum; } pnum;</p>
      <p>* TWO SETS OF SCF: </p>
      <p>three.lnum_smcp (smallcap lining) -- gets inserted in the features: "lnum" and "c2sc":<br>
      -- feature lnum { sub three.onum_smcp by three.lnum_smcp; } lnum;<br>
      -- feature c2sc { sub [three.lnum_tnum three.lnum_pnum three.onum_tnum three.onum_pnum] by three.lnum_smcp; } c2sc;</p>
      <p>three.onum_smcp (smallcap oldstyle) -- gets inserted in the features: "onum" and "smcp":<br>
      -- feature onum { sub three.lnum_smcp by three.onum_smcp; } onum;<br>
      -- feature smcp { sub [three.lnum_tnum three.lnum_pnum three.onum_tnum three.onum_pnum] by three.onum_smcp; } smcp;</p>
      <p>* ONE SET OF UCF: </p>
      <p>three.case (uppercase) -- gets inserted in the feature "case", replacing most or all other figure kinds</p>
      <p>* TWO SETS OF MTF: </p>
      <p>three.lnum_tnum (monospaced lining) -- gets inserted in the features: "lnum" and "tnum":<br>
      -- feature lnum { sub three.onum_tnum by three.lnum_tnum; } lnum;<br>
      -- feature tnum { sub three.lnum_pnum by three.lnum_tnum; } tnum;</p>
      <p>three.onum_tnum (monospaced oldstyle) -- gets inserted in the features: "onum" and "tnum":<br>
      -- feature onum { sub three.lnum_tnum by three.onum_tnum; } onum;<br>
      -- feature tnum { sub three.onum_pnum by three.onum_tnum; } tnum;</p>
      <p>Now, it is up to you to decide if you want to rationalize some of the sets away. For example, you could decide not to have monospaced oldstyle figures (three.onum_tnum). You could decide not to have oldstyle smallcap figures (three.onum_smcp). This leaves you with: </p>
      <p>three.lnum_pnum (proportional lining) -- gets inserted in the features: "lnum" and "pnum"<br>
      three.onum_pnum (proportional oldstyle) -- gets inserted in the feature "onum" only<br>
      three.lnum_smcp (smallcap lining) -- gets inserted in the features: "c2sc" and "smcp"<br>
      three.case (uppercase) -- gets inserted in the feature "case"<br>
      three.lnum_tnum (monospaced lining) -- gets inserted in the features: "lnum" and "tnum"</p>
      <p>Further on, you could decide that you don't need an extra set of smallcap figures but instead, smallcap settings will always be associated with your proportional oldstyle LCF. This does away with three.lnum_smcp. You could also decide that your proportional lining LCF are good enough to serve as UCF. This leaves you with: </p>
