      <p>William: I am constantly called upon to use numerals with small caps in technical manuals, textbooks and government documents. I would say that I need them perhaps 50% as often as I need OsF, and just as often as I need full-height lining numerals.</p>
      <p>I do not think they are necessarily a new invention, as some of the first Italian faces to have small caps as part of the metal family included them (as far as I remember; I think several cuts of Bodoni included them). They are fantastically useful, imho, but even more than that, not having them when you need them is tremendously disruptive.</p>
