      <p><img src="/sites/default/files/old-images/smcp3_3564.png"><br>
      Chris, I wouldn't privilege the functionality of a UI over typographic functionality. What you are proposing as a default for 'smcp' (centre example) is not very useful.</p>
      <p>With regards to Joshua's and Tiffany's assessments of what the standard figures for use with small caps should be, based on usage situations, it's debatable but certainly varied. IMO the primary usage of small caps, across the board, is in Caps-with-small-caps settings. This applies to what I consider to be the two main instances: (i) With extended U&amp;lc text, either for paragraph lead-ins (see example), or for highlighted names. Personally, I prefer all small caps in these situations, but my taste is somewhat old-fashioned and probably in the minority. In these mixed settings, OSF is surely the norm -- although I would be interested in seeing some of Joshua's typography.  (ii) A complete setting in Caps-with-small caps, such as a subheading on a package; again, OSF seem to harmonize better in this more "decorative" situation. </p>
      <p>In the second place, on a purely empirical analysis, surely caps-with-small-caps has a visual similarity with OSF -- both mainly occupy an "x-height", with the occasional extender. This is why I believe the centre setting above doesn't look as good as the other two, because the figures lack presence. So, to keep it simple for the user, it makes sense to pair the figure and SC styles on the basis of formal harmony, rather than arbitrarily assign one figure style to both SC variants. </p>
      <p>In the third place, both the OpenType feature code, smcp, and Adobe's UI implementation of it, "small caps" are incorrect and misleading, They would be more accurately named as "cwsc" and "caps with small caps". By the same token c2sc should be "alsc" (all small caps). </p>
      <p>Also, Adobe's UI implementation of the four OT figure styles (lnum, pnum, onum, tnum) is problematic, presupposing a set of four combinations of these. But what if a font has only lining figures? The OSF options still appear in the OT menu. (Quark does a more logical job of implementing figure styles in its UI.) So again, it's not a good idea to put a less than perfect UI in the driver's seat. And I hope that Thomas will agree, as his philosophy of "the fonts will survive" is part of my reasoning here.</p>
