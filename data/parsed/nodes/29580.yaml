      <p><em>But this would be absurd: I check on the “smallcap figures” switch and all my text (including numbers) turns into smallcaps.</em></p>
      <p>Well, if you are going to use small cap figures, you probably intend to use them with small caps! Surely the absurdity would be to use small cap figures with upper or lower case.</p>
      <p>In any event, "special behaviour" (selecting only the characters you want changed, not the entire text block) is not as you say an anomaly within OpenType, as many figure features require it -- fractions and superiors/inferiors for instance. And the Ordinals feature does in fact require "artificial intelligence", in the form of contextual rules, to make it apply correctly.</p>
      <p><em>This means that both “smcp” and “c2sc” should convert lowercase numerals into numerals suitable for smallcaps setting.</em></p>
      <p>Right. I like the way you have assigned "Small cap lining figures" to the "c2sc" feature, a brilliant solution to the problem! It depends on the application applying both c2sc and smcp to implement "all small caps", which is quite logical.</p>
      <p><em>In an OpenType font, one could imagine having a yet separate set of lining figures, taller than the text lining figures and truly aligned to the top of uppercase letters.</em></p>
      <p>That's what I've done in Austin. Here are the figure sets, as per your scheme, Adam. One day I may yet finish the typeface and release it...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/figs_6304.png"></div><p></p>
