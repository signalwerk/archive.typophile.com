      <p>I just got around to reading this thread. I thought I would mention one more thing about tabular old style figures: One thing that has been interesting to watch is Robert Slimbach's evolving "design strategy" (to coin a phrase) for these glyphs.</p>
      <p>When we began to convert our fonts to OpenType, the Adobe Originals which had old style figures to begin with (which then typically had tabular lining and proportional old style figures) all were upgraded to the full set of four number styles (adding fitted lining and tabular old style figures). We struggled for a while to adapt the existing old style figures to the tabular widths, and Robert or someone else would tweak a number or two to improve their looks. Robert, along with everyone else, would think of old style figures as "naturally" proportional. It seemed strange and awkward to try to shoehorn them into tabular widths.</p>
      <p>Today, Robert simply designs all the figures in his new typefaces to be tabular. He's found that the numbers, both lining and old style, work with tabular widths quite well if they're conceived that way to begin with. It's much easier to design them that way and then re-fit them for their proportionally-spaced companions, rather than going the other direction.</p>
