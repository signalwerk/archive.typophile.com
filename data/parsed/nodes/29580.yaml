      <p><em>upon selecting the letter case, the typeface should present itself in the “most optimal” way</em></p>
      <p>Yes, because, the optimality of any figure style for a particular feature depends to an extent on the typeface. One key factor in this suitability is the role of "x"-height. Consider that the height of small caps varies with typeface; usually it is slightly larger than lower case x-height, sometimes the same size or quite a bit larger. Between the different x-heights of Sc and lc, the old-style figures may correspond to either, which certainly affects how they perform in an all-small cap setting. In some faces where there is a noticeable difference between Sc height and OSF x-height, such as Caslon (above), that creates a quaint effect which may be desirable in the type designer's opinion, or perhaps not, which has a bearing on what is considered to be the best choice for default SC figures--OSF or lining. At any rate, that kind of decision should, I feel, reside with the foundry.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/casjen_3929.png"></div><p></p>
