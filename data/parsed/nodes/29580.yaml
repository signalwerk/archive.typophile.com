      <p>Here's the Adobe insight on this one:<br>
      -- (You're right that) oldstyle figures are the traditional form to be used with small caps, and that's what Adobe does in our fonts' small-cap layout features.<br>
      -- Any font developer who wishes to can easily add lining figures of small-cap height to their fonts' small-cap layout features<br>
      -- Font developers can also add such figures as a stand-alone feature (a stylistic set)*. Both approaches are well-supported in InDesign &amp; Illustrator.</p>
      <p>* or "hook" the glyphs directly to the features 'smcp' and 'c2sc'</p>
