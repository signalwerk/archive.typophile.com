      <p><cite>What exactly are the arguments against [putting figure substitutions in small cap features]?</cite></p>
      <p>Here's one: Both lining and old style figures have a history of being used with small caps. One can argue for one's own preferences, but I don't think that any particular style can be considered objectively correct. Since there are a number of OpenType features to handle (popular) figure styles, one could say that a user can use one of those features to access the figure style they want, rather than having the small cap feature do it for them. (Smallcap-style punctuation is a little different, since there is no separate layout feature for it -- so it seems appropriate to include these non-alphabetic glyphs along with the letters.)</p>
      <p>What vexes me about the small cap figure style is that the above argument doesn't apply so convincingly. Still, I am left with the overarching idea that figure style, whatever it might be, should be handled as a separate choice.</p>
      <p>For Garamond Premier Pro, we changed our approach a little from preceding fonts and drifted slightly toward this idea. Only alphabetic substitutions are made in 'smcp', whereas 'c2sc' changes letters, punctuation, and numbers (to old style). The idea with this is that in mixed-case settings (e.g. 'smcp'), old style figures do not necessarily work better, and smallcap punctuation (e.g. questiondown.sc, ampersand.sc) can actually look strange. Of course there's nothing preventing a user from applying old style figures to a mixed-case setting if that's what they want.</p>
      <p>Adam, I think your treatise makes a convincing case for its position, and at the very least is a thorough illustration of its ideas. It doesn't yet convince me that there are no alternative philosophies.</p>
      <p>One of the things I like about OpenType features is that they allow much latitude for a designer to express their ideas and preferences through the choices they make in the features while still remaining "legal" in the OpenType sense. I think this thread is exposing a lot of choices that many might not have been thinking about, so I am glad we're talking about it!</p>
