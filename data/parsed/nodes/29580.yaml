      <p>Hrant, I know you've been through all this with practically everyone else here, but just for the record, I don't think your approach enhances or enriches the discussion here. I do not understand why you choose to be gratuitously argumentative when the meaning is reasonably clear. For example:</p>
      <p><cite>I'm sorry, I didn't realize you originate with Robert.</cite></p>
      <p>I don't. Obviously, the idea I was describing originated with Robert.</p>
      <p><cite>The numeral one (you know, the most frequently occurring numeral) does NOT end up working "quite well" tabularly, no matter where you start...</cite></p>
      <p>To fixate on the problems of a particular number is a valid discussion to have, but a distraction from my original point. Numbers are a set, and I am talking about considering the success of the set overall -- just like deciding whether an alphabet works "quite well" without fixating on some particular letter, the shape of which one is stuck with. "Quite well" is relative and subjective, so despite 'one' being problematic, one can consider the overall set of tabular numbers successful to some degree or another and fairly apply that description, I believe. If you don't agree, that's fine.</p>
      <p><cite>So now I'm not sure: what does Robert -really- think again?</cite></p>
      <p>As I said, I believe Robert is happier with tabular numbers when they are designed first for tabular widths and adapted for proportional spacing. "Quite well" is my characterization, but I believe it's fair to say he's "satisfied" and considers it an improvement over the previous practice of designing the old style numerals proportionally to start. I am not interested in becoming a middleman for Robert on this board, so I kindly ask that you consider the overall idea, which I believe is pretty clear without analyzing every word.</p>
      <p><cite>... it's kind of annoying when it's presented as authoritative.</cite></p>
      <p>I don't see how it's presented as more "authoritative" than anything else anyone says here. Really, I'm just trying to pitch in and contribute an interesting idea or two here. That you find this all so provocative is far beyond my intention, and also tiring.</p>
      <p><cite>Again, you’re here, and that’s valuable.</cite></p>
      <p>What I suppose will continue to be a problem for you is that I have spent the last nine years working here directly with Robert. It will be difficult for me to talk about type without occasionally referring to things he's said or done. If you are getting the impression that Robert is somehow hiding behind me or using me as a mouthpiece, I assure it's not so. I'm just sharing my experience.</p>
