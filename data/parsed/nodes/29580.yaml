      <p>2. I think "Caps with small caps" can be shortened to "Small caps", and that's what Adobe did. Linguistically, "caps with small caps" sounds awkward, especially if translated into other languages (German: "Großbuchstaben mit Kapitälchen" or "Versalien mit Kapitälchen"). This becomes far too long for a UI entry. </p>
      <p>3. I do sympathize with the complaint regarding the UI for the basic figure styles. In Apple's UI, the alignment and the proportion are separated. On the other hand, having multiple selections always introduces complexity to the flow. Your UI is two-tier -- Adobe certainly did not want to produce a "tree structure". I for my part think Adobe did a reasonable job in compromising flexibility and usability. </p>
      <p>4. Your UI sketch seems to have extra checkboxes next to the categories and checkboxes next to the entries in the categories. What is supposed to happen if a user clicks on the box "Lining"? Will "Tabular" be automatically selected? What will happen if the user selects "Tabular" in the "Lining" group? Why are there two ways of selecting "Tabular Lining" -- through "Lining" and through "Tabular" in the "Lining" group. Or is "Lining" not a clickable item? If so, why does it have a checkbox? </p>
      <p>In my work as FontLab product manager, I get to discuss and optimize user interfaces a lot, and have spent some time studying usability issues. I must admit that your menu is not so good, usability-wise. Sometimes, it's necessary to step out of the "designer's mind" or the "engineer's mind" and to adopt a "user's mind". I believe this is what Adobe did in the Creative Suite apps. </p>
      <p>A.</p>
