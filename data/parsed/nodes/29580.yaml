    <p>Can anyone tell me why so many of the new "all inclusive" pro <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> faces from a variety of foundries are being released with <a href="/node/13897" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">old-style numerals</a> as part of the <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small-caps</a> set?</p>
    <p>I understand that there is a certain stylistic flair to using non-lining numerals with old style caps on title pages and in other decorative settings. However, it seems to me that small-cap heigh lining numerals are far more useful as part of the sc set/selection; 9 times out of 10, those will be what a typesetter wants when he or she is setting small cap text.</p>
    <p>The most ironic part is that a few of these faces HAVE such numerals in the font, but just not assigned to the small cap set!</p>
    <p>I assume I am missing something and everybody else in the world works very differently than I or any of the typesetters and designers I know. That's the only explanation I can come up with.</p>
    <p>JLT</p>
  html_clean: |-
    <p>Can anyone tell me why so many of the new "all inclusive" pro <a href="/node/12420/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">OpenType</a> faces from a variety of foundries are being released with <a href="/node/13897/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">old-style numerals</a> as part of the <a href="/node/12027/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">small-caps</a> set?</p>
    <p>I understand that there is a certain stylistic flair to using non-lining numerals with old style caps on title pages and in other decorative settings. However, it seems to me that small-cap heigh lining numerals are far more useful as part of the sc set/selection; 9 times out of 10, those will be what a typesetter wants when he or she is setting small cap text.</p>
    <p>The most ironic part is that a few of these faces HAVE such numerals in the font, but just not assigned to the small cap set!</p>
    <p>I assume I am missing something and everybody else in the world works very differently than I or any of the typesetters and designers I know. That's the only explanation I can come up with.</p>
    <p>JLT</p>
