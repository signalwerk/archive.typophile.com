      <p><em>1. A separate “small caps lining” switch for figures would presume that there is a separate feature for small caps figures. </em></p>
      <p>Not necessarily. This would simply activate the smcp feature, and presumably the foundry would have placed lining small cap figures in the feature. If they had not put any figures in the feature, the default figures, or whatever other figures had been previously specified, would remain, and no change would occur. There are many precedents for clicking on a feature and nothing happening. However, if the foundry had put OSF in the small caps feature, it wouldn't work properly -- but why would they, if they were familiar with a UI implementation like this? </p>
      <p>But a separate feature for small cap lining figures is a great idea, and would probably please Joshua, Tiffany, et al.</p>
      <p><em>2. I think “Caps with small caps” can be shortened to “Small caps”,</em></p>
      <p>Sure, the full "Caps with small caps" is cumbersome, but it is correct, and makes perfect sense as the alternative to "All small caps".</p>
      <p><em>Your UI is two-tier — Adobe certainly did not want to produce a “tree structure”.</em></p>
      <p>I don't think having a two-tier implementation is bad, in fact, it exposes the logic behind the choices the user can make. Anyway, both tiers are visible on the same palette, and the default would be "pre-selected", which I don't show in my diagram.</p>
      <p><em>What is supposed to happen if a user clicks on the box “Lining”? Will “Tabular” be automatically selected? </em></p>
      <p>Whatever is the default will already be showing. So for a standard font, "Lining" will be checked, and "Tabular" underneath it. Then if the user wants proportional OSF, click on Old Style, and Proportional under that, and the previous selections toggle off.</p>
      <p><em>Sometimes, it’s necessary to step out of the “designer’s mind” or the “engineer’s mind” and to adopt a “user’s mind”. I believe this is what Adobe did in the Creative Suite apps. </em></p>
      <p>Adam, I know it's hard to imagine how an interface works from a static diagram, but my scheme is perfectly viable, usability-wise. As an art director who has been a page-layout application user for 18 years, both Quark and now InDesign for 4 years, I would say I qualify for "user's mind".</p>
      <p>I agree with you that the CS apps are in general user-friendly, but with the exception of OpenType implementation, which is a dog's breakfast -- inconsistent across applications, and split between two buried levels of palette in InDesign. Consider that on the first level there are both "small caps" and "superscript" -- one implements the correct OT feature if it's in the font (but doesn't let you know whether or not), the other gives you faux, and also doesn't tell you. By trying to please too hard, the UI design is compromised. </p>
      <p>Really, a warning should pop up when users click on faux effects. You know, like the ones in FontLab that say "You are trying to apply a dangerous operation..." in bold face every time I import metrics into a font.</p>
      <p>"Warning: you are attempting to apply a faux typographic effect that may cause discerning readers to wince."</p>
