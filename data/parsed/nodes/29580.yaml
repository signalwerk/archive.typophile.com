      <p>There are two separate OpenType features:</p>
      <p>c2sc -- this is in the "third level" InDesign menu, and only works for OT fonts.<br>
      smcp -- this in in the "second level" InD menu, and produces faux small caps if there are no true small caps in the font, and proper (caps-with-)small-caps if there is the smcp feature in the OT font.</p>
      <p>So if the foundry doesn't include  any figures in the smcp feature, the user will get the default figures; however, the foundry may have lining figures as default, and include OSF figures in the smcp feature. Whatever, if the foundry includes small-cap-height lining figures in the c2sc feature, then the user will get the 3rd style I showed above.</p>
