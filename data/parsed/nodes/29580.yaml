    html: |-
      <p>I think it's ridiculous that SC has OsF as default. We only think it makes sense, I think, because they've been packaged that way for so long - many decades. But I think that was a marketing decision; certainly, even the metal typesetters I know pick those numerals and the SC apart when they distribute the type into a case, and don't use them side by side very often - especially not at text sizes.</p>
      <p>I'm assuming that the current custom to attach OsF to SC is simply a carryover from this, and from here it seems somewhat ridiculous - OTF sets should be organized around use, not arbitrary convention.</p>
