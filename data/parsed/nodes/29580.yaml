      <p>A couple of things:</p>
      <p>- people do use tabular OsF. I've used them in real work. They're not as common as the other permutations. More importantly, hijacking a feature for some other usage is generally a dubious choice, IMO. </p>
      <p>- although InDesign supports stylistic sets, AFAIK neither Illustrator nor QuarkXPress does, as yet.</p>
      <p>- jlt: No stylistic sets are on by default. The way you override a stylistic set is to turn it (back) off. Stylistic sets are a group of 20 features, numbered 1-20. Small caps are not a stylistic set (unless you wish to make them so, but I can't see why).</p>
      <p>Oops, gotta run and go get some stitches out. Maybe somebody else can explain stylistic sets better to Joshua. Or maybe just reading the right section of the OpenType spec will help: <a href="http://www.microsoft.com/typography/OTSPEC/features_pt.htm#ssxx">http://www.microsoft.com/typography/OTSPEC/features_pt.htm#ssxx</a></p>
      <p>Cheers,</p>
      <p>T</p>
