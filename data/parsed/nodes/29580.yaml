      <p>Nick, </p>
      <p>"c2sc" is *NOT* all small caps. "c2sc" is small caps from capitals. It only transforms uppercase to small caps, leaving the lowercase untouched. The Adobe UI checkbox "All small caps" turns on "c2sc" and "smcp" at the same time. </p>
      <p>OpenType Layout features can specify what gets substituted but they cannot necessarily specify what does NOT get substituted by the means of other features being applied at the same time. Therefore, a name such as "cwsc" ("caps with small caps") would promise something it couldn't deliver. It would promise the user that he gets both caps and small caps. However, if the user applies "c2sc" and "smcp"/"cwsc" at the same time (as the Adobe UI element "All small caps" does), then the result would be all small caps. So the caps wouldn't be there anymore though one of the feature names would suggest that they are there. </p>
      <p>Short: each feature should mind its own field. </p>
      <p>The only reasonable alternative for "smcp" would be "l2sc" (lowercase to small caps), but it doesn't really matter much since the four-letter OpenType Layout feature codes are not actually designed to be exposed in user interfaces. </p>
      <p>A.</p>
