    user: 1133
    date: 2006-11-28T07:46:00
    date_raw: 28 Nov 2006 — 7:46am
    votes: null
    html: |-
      <p>Nick, </p>
      <p>&gt; Not necessarily. This would simply activate the smcp<br>
      &gt; feature, and presumably the foundry would have<br>
      &gt; placed lining smallcap figures in the feature. </p>
      <p>But this would be absurd: I check on the "smallcap figures" switch and all my text (including numbers) turns into smallcaps. Since this is how the feature typically works, its place is under "smallcaps" and not "smallcap figures". </p>
      <p>However, for the Latin or Default languagesystems, the principle of OpenType is that lookups associated with a certain feature are executed on the entire portion of text that is in the scope of the operation, period (e.g. on the entire selection or on all the text covered by a style that employs a feature). </p>
      <p>This is why the format is simple and successful, and why there are many implementations of it. If you start asking for special behaviors, guessing around and artificial intelligence being applied, you're asking for trouble. </p>
      <p>Christopher, </p>
      <p>&gt; In any case, I am still not so sure it’s a good idea in<br>
      &gt; general to have number substitutions happening in small<br>
      &gt; caps features. (And by “not so sure,” I mean that<br>
      &gt; I think there are decent arguments on both sides of the<br>
      &gt; issue.)</p>
      <p>What exactly are the arguments against? </p>
      <p>Glyph case conversion features ("case", "smcp", "c2sc", "pcap", "c2pc") have their own specifics. The general idea is to allow conversion between different cases of letters and supporting glyphs. The cases envisioned by OpenType are: lowercase, uppercase, smallcaps, petite caps. </p>
      <p>There are several kinds of glyphs that are subject to case conversion. They all exist in various scripts, such as Latin, Cyrillic, Greek and other writing systems that differentiate letter cases. </p>
      <p>There are four classes of letters: </p>
      <p>* LC: "text letters", i.e. lowercase letters (including accented letters of various kinds),<br>
      * UC: uppercase letters,<br>
      * SC: smallcap letters,<br>
      * PC: petite cap letters (rather uncommon, of course), </p>
      <p>There are also -- at least potentially -- other kinds of supplementary characters that may have different glyph forms depending on which letter case they are used with:</p>
      <p>* punctuation characters (hyphens, parantheses, brackets, dashes, exclamation marks, question marks, apostrophes, quotation marks etc.),<br>
      * free-standing diacritic marks (spacing and combining),<br>
      * numerals,<br>
      * currency symbols,<br>
      * mathematical operators and other characters. </p>
      <p>Each of the supplementary characters can, potentially, have separate glyph forms (or at least positioning) that correspond to each of the aforementioned case classes (LC, UC, SC, PC). </p>
      <p>For lowercase-to-uppercase conversion, the general agreement is that the conversion of *letter* case should be done by the application itself, based on Unicode case conversion information. </p>
      <p>Therefore, the "case" feature should only involve supplementary glyphs that differ in appearance depending on whether they're used in uppercase-only or in mixed-case (i.e. primarily lowercase) text. However, it is up to the type designer to include or not include specific glyphs in that conversion. In other words, an "All uppercase" or "All capitals" UI operation should perform the Unicode case conversion (on the visual level) *and* should apply the "case" feature -- this is in fact what happens in Adobe InDesign. </p>
      <p>In most fonts, the default type of numbers (numerals, figures), associated with the Unicode codepoints for European numerals, is lining. Usually, lining numerals are suitable for setting UC, and to some extent, LC. Traditionally, "oldstyle" numerals were used for LC setting but these days, it is no longer so. Therefore, the "onum" feature allows the user to switch from the default (typically lining) figures to oldstyle numerals. </p>
      <p>However, in some fonts such as the Microsoft ClearType fonts (e.g. Constantia), the default form of the numerals is oldstyle. These numerals go well with the default text case (which is LC) but don't work at all with UC text. Of course there is an "lnum" feature that allows the user to switch from oldstyle numerals to lining numerals on a discretionary basis, but in a well-made font, switching the case from lowercase to uppercase should also automatically trigger the switch of numerals to corresponding forms (just like it would for parantheses, hyphens, dashes, currency symbols etc.) Therefore, a substitution of the default (oldstyle) numerals with uppercase (lining) numerals should happen not only in the "lnum" feature (which is for the user's *discretionary* choice) but also in the "case" feature (which governs the more general case change). Microsoft has not done it and when I pointed this out to John Hudson and Geraldine Wade, they agreed that this is something at least to be considered in a revision. </p>
      <p>oldstyle and lining figures are both two kinds of text figures that go along lowercase or mixed-case text. We agree on that. To choose between these two kinds of figures, we have "onum" and "lnum". Fine. The lining figures *may happen* to be a suitable set to go along all-caps setting, but do not necessarily have to. In most typefaces, lining numerals are shorter than caps. In an OpenType font, one could imagine having a yet separate set of lining figures, taller than the text lining figures and truly aligned to the top of uppercase letters. This set would be inserted through the "case" feature. Even a typeface like Matthew Carter's Georgia that only has one set of unified hybrid (semi-oldstyle) text figures could use a second set of uppercase figures. These would be substituted using the "case" feature, just like other case-sensitive supplementary characters.  </p>
      <p>I firmly believe that visual case conversion *must* involve numerals as well -- there is no reason to exclude them, just like you wouldn't exclude the endash, the parantheses or the dollar sign. </p>
      <p>For the two cases: smallcaps and petite caps, the case conversion is only performed on the glyph level and there is no external reference material (such as the Unicode case conversion rules). Therefore, both the conversion of letters and the supplementary characters must happen in the font. In the "smcp" and "pcap" features, only the lowercase letters should be converted to the small or petite caps, respectively, while uppercase letters should be left untouched. Conversely, in the "c2sc" and "p2sc" features, only uppercase letters should be converted while the lowercase letters should be untouched. </p>
      <p>But what about the supplementary characters? Of course, all of them (punctuation, currency symbols, *and* numerals) should be covered if they are designed, and that regardless of whether the feature converts lowercase or uppercase into the smallcaps or petite caps. This means that both "smcp" and "c2sc" should convert lowercase numerals into numerals suitable for smallcaps setting. </p>
      <p>Here, we come to the conclusion. The type designer should not think in terms "Do I include hybrid or lining or oldstyle numerals in my font?" This is the wrong question to ask yourself. The right question is: what kinds of numerals (and other supplementary characters) do I need to include in my font *depending on their function*? The visual appearance of the figures is a secondary question, and a design question only. </p>
      <p>I would classify figures into five *functional* categories:<br>
      * LCF: Text / lowercase figures -- figures to be used in running text, i.e. typically appearing in all-lowercase or mixed-case context.<br>
      * UCF: All-caps / Uppercase figures -- figures to be used in all-caps settings such as headlines.<br>
      * SCF: (If your font contains smallcaps) smallcaps figures -- figures to be used in smallcaps settings.<br>
      * PCF: (If your font contains petite caps) Petite-caps figures -- figures to be used in petite-caps settings.<br>
      * MTF: Mathematical and tabular figures -- figures to be used in mathematical / scientific / financial context, without letters. </p>
      <p>*Each* of these groups may have one or several stylistic variants. All figures to be used in text can be proportional. There can be two sets of LCF (lining and oldstyle) or just one (hybrid). SCF and PCF can also come in two kinds, lining and oldstyle (lining for all-smallcaps setting while oldstyle for caps-and-smallcaps setting), or just in one kind (either hybrid or lining). MTF are usually monospace but can be just lining or also have an oldstyle set. Finally, UCF are typically lining and proportional. </p>
      <p>The actual question of how many figure sets do I need to design for my font only comes after this analysis. Leaving PCF aside for the time being, let's concentrate on the four functional categories of figures: LCF, UCF, SCF and MTF. Let's imagine that you want to have both lining and oldstyle flavors of proportional LCF. And let's imagine that for SCF you want two kinds of figures, one that works in all-smallcap settings (lining) and the other that works in mixed caps-and-smallcaps settings (oldstyle). For MTF, you want a lining and an oldstyle set. </p>
      <p>So you might end up having: </p>
      <p>* TWO SETS OF LCF: </p>
      <p>three.lnum_tnum (monospaced lining) -- gets inserted in the features: "lnum" and "tnum":<br>
      -- feature lnum { sub three.onum_pnum by three.lnum_pnum; } lnum;<br>
      -- feature pnum { sub three.lnum_tnum by three.lnum_pnum; } pnum;</p>
      <p>three.onum_pnum (proportional oldstyle) -- gets inserted in the features: "onum" and "pnum":<br>
      -- feature onum { sub three.lnum_pnum by three.onum_pnum; } onum;<br>
      -- feature pnum { sub three.onum_tnum by three.onum_pnum; } pnum;</p>
      <p>* TWO SETS OF SCF: </p>
      <p>three.lnum_smcp (smallcap lining) -- gets inserted in the features: "lnum" and "c2sc":<br>
      -- feature lnum { sub three.onum_smcp by three.lnum_smcp; } lnum;<br>
      -- feature c2sc { sub [three.lnum_tnum three.lnum_pnum three.onum_tnum three.onum_pnum] by three.lnum_smcp; } c2sc;</p>
      <p>three.onum_smcp (smallcap oldstyle) -- gets inserted in the features: "onum" and "smcp":<br>
      -- feature onum { sub three.lnum_smcp by three.onum_smcp; } onum;<br>
      -- feature smcp { sub [three.lnum_tnum three.lnum_pnum three.onum_tnum three.onum_pnum] by three.onum_smcp; } smcp;</p>
      <p>* ONE SET OF UCF: </p>
      <p>three.case (uppercase) -- gets inserted in the feature "case", replacing most or all other figure kinds</p>
      <p>* TWO SETS OF MTF: </p>
      <p>three.lnum_tnum (monospaced lining) -- gets inserted in the features: "lnum" and "tnum":<br>
      -- feature lnum { sub three.onum_tnum by three.lnum_tnum; } lnum;<br>
      -- feature tnum { sub three.lnum_pnum by three.lnum_tnum; } tnum;</p>
      <p>three.onum_tnum (monospaced oldstyle) -- gets inserted in the features: "onum" and "tnum":<br>
      -- feature onum { sub three.lnum_tnum by three.onum_tnum; } onum;<br>
      -- feature tnum { sub three.onum_pnum by three.onum_tnum; } tnum;</p>
      <p>Now, it is up to you to decide if you want to rationalize some of the sets away. For example, you could decide not to have monospaced oldstyle figures (three.onum_tnum). You could decide not to have oldstyle smallcap figures (three.onum_smcp). This leaves you with: </p>
      <p>three.lnum_pnum (proportional lining) -- gets inserted in the features: "lnum" and "pnum"<br>
      three.onum_pnum (proportional oldstyle) -- gets inserted in the feature "onum" only<br>
      three.lnum_smcp (smallcap lining) -- gets inserted in the features: "c2sc" and "smcp"<br>
      three.case (uppercase) -- gets inserted in the feature "case"<br>
      three.lnum_tnum (monospaced lining) -- gets inserted in the features: "lnum" and "tnum"</p>
      <p>Further on, you could decide that you don't need an extra set of smallcap figures but instead, smallcap settings will always be associated with your proportional oldstyle LCF. This does away with three.lnum_smcp. You could also decide that your proportional lining LCF are good enough to serve as UCF. This leaves you with: </p>
      <p>three.lnum_pnum (proportional lining) -- gets inserted in the features: "lnum", "pnum" and "case"<br>
      three.onum_pnum (proportional oldstyle) -- gets inserted in the features: "onum", "c2sc" and "smcp"<br>
      three.lnum_tnum (monospaced lining) -- gets inserted in the features: "lnum" and "tnum"</p>
      <p>You might also decide that you only need two sets of figures: lining tabular (that serve as lining LCF, as UCF and as MTF) and proportional oldstyle (that serve as oldstyle LCF and as SCF). Hence: </p>
      <p>three.onum_pnum (proportional oldstyle) -- gets inserted in the features: "onum", "pnum", "c2sc" and "smcp"<br>
      three.lnum_tnum (monospaced lining) -- gets inserted in the features: "lnum", "tnum" and "case"</p>
      <p>Finally, you could decide to have just one set of figures only, monospaced hybrid, and use them everywhere: LCF, UCF, SCF and MTF. But regardless of which degree of the design simplification you choose, you should always be aware of the various *functions* that your figures should serve. The more different kinds of figures you include in your font, the more their design can be custom-tailored to those specific functions. The less figure sets you include, the more compromise you need to work into your design. </p>
      <p>Of course, in the cases elaborated above, "three" is only used as an example, I'm talking about the whole zero-nine set. Also, one of the sets (typically lnum_tnum or onum_tnum or onum_pnum or lnum_pnum) would serve as the default set of glyphs for the European figures. That particular set would not use any glyphname suffix, i.e. it'd be just "three", and would be associated with the appropriate Unicode codepoints). </p>
      <p>The bottomline is, figures should be associated with both the figure style selection features (lnum, onum, pnum, tnum), as well as with case conversion features (case, c2sc, smcp, pcap, p2sc), appropriately. </p>
      <p>Regards,<br>
      Adam</p>
