      <p><em>I believe the thinking on this is that it is impractical to expect this to make any more sense to non-English users, unless the type designer interprets these descriptions into every language which the font might be used in.</em></p>
      <p>Really? I assumed it was an mistake. Since "Stylistic Set 1" doesn't mean anything in any language other than English, nor does "Default Ligatures", I'm not buying it.  The inability to custom-name custom-use fields is probably my very least favorite aspect of OpenType. It makes no sense. English is the most international language, and there is other components of a font that support that.There are not specific fields for for every language for every other aspect of a font file's data (although there are some, which are customizable and optional). Additionally, not only is English used for the default names of existing explicit OT features, it is used for the standard glyph names, as well other aspects of fontery.</p>
      <p>I think it would be a lot better idea to make the sets named (perhaps with a "Stylistic Set #:" prefix) and let the designers do the designing and naming in the file.  A stylistic set being named in non-English would still assist me, speaking English, as I would learn to recognize foreign words if I really came across them a lot, and to speed up recognition of already known features of a font. Its a far more workable solution than expecting designers to put out a lengthy guide to each feature-rich font's intracacies. Then, what, translate that into several dozen tongues? And make the consumer track that added separate file? Yucky.</p>
      <p>I think more likely, this was an oversight, low priority at creation, out-of-budget or a mistake. Since the current folk explanation are dubious, I hope when OT grows up, this will be one of several small refinements. So, here's my suggestion to the logical successor in today's technology trends, back-compatible ExtensibleOpenType. Or .XOT for short. :)</p>
      <p><a href="http://www.chozcunningham.com">Choz Cunningham</a><br><a href="http://www.exclamchine.com">!Exclamachine Type Foundry</a><br><a href="http://www.exclamachine.com/snark">The Snark</a></p>
    html_clean: |-
