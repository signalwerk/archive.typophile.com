    <p>Welcome to our 4th newsletter! :)</p>
    <p>In this newsletter we celebrate two big landmarks: there are now 50 fonts on the site, and it is our 1 year anniversary! :D<br>
    That's one new font reworked and released almost every week throughout 2008!</p>
    <p>In this news release I present 12 fonts:<br>
    - 2 from Derek Vogelpohl<br>
    - 2 from Ray Larabie<br>
    - 2 from Kevin King<br>
    - 2 from Brian Kent<br>
    - 1 from Nick Curtis<br>
    - 1 from Ronna Penner<br>
    - 2 from Jim Lyles - and they're free! :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CheapProFonts-NEWS-08-Q4_6537.gif"></div><p></p>
    <p>I cannot promise too keep up this speed, but I'll do my very best... ;)</p>
    <p>CheapProFonts is dedicated to supplying high-quality OpenType and TrueType fonts for setting "foreign" languages (languages requiring more than the basic A-Z characters) for professional Mac and Windows users.<br>
    Check our site for constant new releases, and see you in the next newsletter!</p>
    <p>Roger S. Nelsson<br>
    —<br>
    <a href="http://www.CheapProFonts.com" title="http://www.CheapProFonts.com">http://www.CheapProFonts.com</a><br>
    High quality multilingual fonts at a low price - for professional (non-english) designers with a small budget!</p>
