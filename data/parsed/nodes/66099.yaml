      <p>&gt; Easy to say, harder to prove.</p>
      <p>Nearly impossible to prove in fact. Fortunately humans don't live their lives based on formal proof. It is however quite easy to believe. The alternatives are harder to believe. Some of them (like the Emigre codswallop) are plain laughable.</p>
      <p>Optima: actually many people -including me- feel it's too gray, and that give it low readability. Remember, information comes from contrast.</p>
