      <p>Optima nova. The best sans serif ever (after the hot-metal Optima, of course).</p>
      <p>While it is true that, in most cases, sans serifs are harder to read, this is not the case with Optima nova. This font is made of such subtle tapers and curves that they play the part of serifs, creating a kind of subtle variance that the brain likes to see in nature. In effect, the serifs are "within" the characters, spreading into their entire bodies.</p>
      <p>In fact, the design is so subtle that the original Optima (hot-metal font) has proven to be very hard to digitize. The first digitization attempt, also called Optima, had to sacrifice too much in order to avoid the stair-stepping effect at the low resolution of computer monitor. Optima nova is the second, somewhat more successful attempt.</p>
      <p>IMHO, Optima nova easier to read than most, if not all, serif fonts.</p>
      <p>Leo</p>
