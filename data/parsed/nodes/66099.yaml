    <p>hi,<br>
    i would really need some suggestions for<br>
    a flexible sans-serif font for the body text<br>
    of a student magazine. i decided to go with<br>
    different fonts for almost every article title,<br>
    because i think it's not wrong for such an<br>
    audience, but now i need a legible and not<br>
    boring font for the body. i think serifs wouldn't<br>
    go with it, or else?</p>
    <p>thanks so much,b.</p>
