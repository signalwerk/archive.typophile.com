    html: |-
      <p>AFIK, if the Roman characters are named correctly in your .afm file, you can use the Import Metrics function in FontLab to add to current kerning pairs in the font.</p>
      <p>One way (although probably not the easiset way) to accomplish this would be:</p>
      <ul>
      <li>export kerning from your Roman font</li>
      <li>open the .afm file in a simple text editor</li>
      <li>CUT the kerning pairs info and paste them into a new text file</li>
      <li>manually delete any cap/lowercase and lowercase/lowercase pairs</li>
      <li>search and replace A with A.Roman, etc.</li>
      <li>search and replace K.RomanP.RomanX.Roman with KPX</li>
      <li>CUT and paste back into original .afm and save</li>
      <li>import metrics into your new font with "Add pairs" option selected</li>

      </ul>
