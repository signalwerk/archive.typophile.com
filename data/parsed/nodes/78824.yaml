  html: |-
    <p>Hi all,</p>
    <p>I'm working on a font family that is a script with four different styles of the script plus a Pro version that will contain ALL the glyphs from the original four. One of the font versions of the family has more ROMAN style caps that can be used for ALL CAPS text. I now need to kern those CAPS in the Pro version to be identical to the kerning in the original font. In this situation, using KERNING CLASSES won't work, as the Roman style uppercase forms are so different from the original Script uppercase. </p>
    <p>The PRO version of the script family will contain the ROMAN style glyphs as alternate characters (A.Roman B.Roman C.Roman, etc) . Rather than trying to manually duplicate the kerning pairs in question, I would like to be able to import the kerning of ONLY those characters from the Roman Style font into the PRO font (assigning the kerning to the alternate glyphs). </p>
    <p>Is what I wish to do (to avoid a whole lot of work and headache) even possible?</p>
    <p>Thanks,<br>
    Rob</p>
