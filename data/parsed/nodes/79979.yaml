    html: |-
      <p>Hi Nick,</p>
      <p>For applications, I would recommend <a class="freelinking external" href="http://www.amazon.com/Fonts-Encodings-Yannis-Haralambous/dp/0596102429/ref=sr_1_1?ie=UTF8&amp;qid=1300021768&amp;sr=8-1" rel="nofollow">Fonts &amp; Encodings</a>. It covers most of the major applications, including a number of free ones (good for when you are just starting up). It includes all of the gory details, which are difficult to get elsewhere.</p>
      <p>There are some <a class="freelinking external" href="http://typophile.com/node/28627" rel="nofollow">debates</a> about the best books to use, but I liked <a class="freelinking external" href="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509/ref=sr_1_1?s=books&amp;ie=UTF8&amp;qid=1300022221&amp;sr=1-1" rel="nofollow">Karen Cheng</a>.</p>
      <p>Finally, you may want to check out <a class="freelinking external" href="http://www.typeradio.org/loudblog/index.php?loc=news" rel="nofollow">Type Radio</a>. It will give you a good feel of the life of a type designer. I think the most telling interview so far was with <a class="freelinking external" href="http://www.typeradio.org/loudblog/index.php?cat=Buivenga,Jos" rel="nofollow">Jos Buivenga</a>, the number one seller on MyFonts. Even he has a difficult time supporting himself exclusively on type design.</p>
      <p>You should listen to Jean - post your designs here and have some fun. The last thing you want to do right now is worry about the money!</p>
      <p>-Neil</p>
