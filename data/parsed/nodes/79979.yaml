    html: |-
      <p>Hi Nick,<br>
      Creating a type face is a question of just doing it - in my case anyway, I'm an amateur myself. I used to design type in Illustrator too, but found that creating it in FontLab Studio makes it a lot easier. Things like spacing and kerning can be instantly created, viewed and modified where as in Illustrator you can only draw. Making money on a font is not easy I gather. You'll put many an hour into the design, so if you're thinking you can get paid for that time you spend on it, you can forget it ;-) Exceptions aside of course. You might consider puttting your font up for sale at sites like myfonts.com.<br>
      But, first of all, we would really like to see your design so we might help you make the best of it!<br>
      Good luck!</p>
