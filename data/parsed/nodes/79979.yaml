    <p>Hey guys,</p>
    <p>im a graphic artist with an interest in creating a type face.</p>
    <p>can anyone provide me with some info on this? Once i've finished my font, where do i go from there? How does one go about making money on a font? Lastly, are there any recommended applications to use aside from illustrator?</p>
    <p>Any help would be much appreciated.</p>
    <p>Thanks!</p>
    <p>-nick</p>
