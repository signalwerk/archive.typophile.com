    html: <p>&gt; Is there a way in FontLab to move  <br>&gt; selected points other than using  <br>&gt; the arrow keys? <br> <br>Pretty easy. Select some nodes, open Window / Transformation Panel, click on the first button on the panel (Shift), enter the distance and click on Apply.  <br> <br>Adam</p>
