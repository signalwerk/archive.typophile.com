    html: "<p>1. transform selected parts of outlines transformation in the glyphwindow <br> <br>&gt; transform seems to move all the points in the glyph, whether selected &gt; or not. <br> <br>this won't happen if you use the 'little' Transform-palette (open it via menu : Windows -&gt; Transform) there you find several operations wich will work for the only selectet parts of your glyph or for the whole if no points are selected. <br> <br> 2. transformation in the fontwindow <br> <br>you can get your shorter dash without the width changed by Tools -&gt; transform (or apple-T) -say: 75% -unclick: proportional -unclick: scale metrics -choose: center of selection you will get the same result with the 'little' Transform-palette (you can use it also in the FontWindow for several glyphs) <br> <br>have fun</p>"
    html_clean: "<p>1. transform selected parts of outlines transformation in the glyphwindow <br> <br>&gt; transform seems to move all the points in the glyph, whether selected &gt; or not. <br> <br>this won't happen if you use the 'little' Transform-palette (open it via menu : Windows -&gt; Transform) there you find several operations wich will work for the only selectet parts of your glyph or for the whole if no points are selected. <br> <br> 2. transformation in the fontwindow <br> <br>you can get your shorter dash without the width changed by Tools -&gt; transform (or apple-T) -say: 75% -unclick: proportional -unclick: scale metrics -choose: center of selection you will get the same result with the 'little' Transform-palette (you can use it also in the FontWindow for several glyphs) <br> <br>have fun</p>"
