  html: <p><img src="http://www.typophile.com/forums/messages/29/199.gif" alt="fontclaire_sample.gif"> <br> <br>FontClaire started with a sketch of the lower case g and turned into a student BFA project. It's still incomplete, lacking numerals and full punctuation, but I'm very happy with it's progress, so far--even though I haven't touched it in years. <br> <br>I really like the upper case, but still feel like the lower case needs more unity. Any thoughts? <br> <br>//joe</p>
