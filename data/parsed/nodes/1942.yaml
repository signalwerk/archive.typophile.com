    html: <p> Joe. I said it once and I'll said it again. Beautiful. I agree with Christian. The 'S' seems to be falling backwards. Maybe tapering the bottom and ending it a bit sooner would resolve the top issue. Have you set a whole page? Our language isn't hampered with the usage of too many capital letters (in body set type) so perhaps your concern with the lower and the upper isn't of such great import? How about your little trick on the 'k'? Perhaps incorporating that trick somehow in the 'x'? Because of the narrowness of the letters you might tighten up the over all word spacing as well. The 'r' seems to want a little more curve into the stem? <br> <br>Beautiful. </p>
