    html: <p> very very cool. an interesting combination of the geometric and organic. I'm debating with myself about the uc S. It is a little wider than the other letters, and makes the texture a bit uneven. However, I think the imperfection adds to the character of the face. I would definitely loose the taper on the top end, though. I'm with simon on the lc. i really like. I would loose the kink on the upper arm of the k (it works on the uc)-- it feels like it could be simplified. The x's kind of bug me. it seems the curved geometry is justified on the other letters, but feels forced on the x. <br> <br>are you planning on publishing it any time soon? <br> <br>cr </p>
