      <p>Hi Sebastian,<br>
      Probably a bit on the self promo side here, but I just released a script last week that might serve that purpose. The weights are similar and it also has a very low x-height like Satisfaction. Satisfaction is probably a bit more retro looking since it stems from old mid 20th century cigarette ad lettering. Mine is not from a historical source, I just do a lot of lettering. Might be worth looking at for you.<br>
      <a href="http://www.myfonts.com/fonts/stephen-rapp/baghadeer/" title="http://www.myfonts.com/fonts/stephen-rapp/baghadeer/">http://www.myfonts.com/fonts/stephen-rapp/baghadeer/</a><br>
      Stephen</p>
