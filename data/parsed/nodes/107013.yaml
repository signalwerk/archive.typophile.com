    <p>Hello!</p>
    <p>looking for some recommendations for a suitable alternative to Satisfaction <a class="freelinking external" href="http://www.myfonts.com/fonts/ephemera/satisfaction-pro/" rel="nofollow">http://www.myfonts.com/fonts/ephemera/satisfaction-pro/</a> - I like the overall energy,  but I am put off by the overall quality which seems quite sloppy. </p>
    <p>Any suggestions? </p>
    <p>Tia.</p>
    <p>Sebastian</p>
