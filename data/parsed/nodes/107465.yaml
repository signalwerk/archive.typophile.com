    html: |-
      <p>Slab serif lettering perhaps inspired by Rockwell, designed by Frank Hinman Pierpoint in 1934 for Monotype as an updating of Inland's Litho Antique of 1910. Rockwell's G matches the lettering, but the leg on R has only a half serif.<br>
      <a href="http://www.myfonts.com/fonts/mti/rockwell/" title="http://www.myfonts.com/fonts/mti/rockwell/">http://www.myfonts.com/fonts/mti/rockwell/</a><br>
      Don</p>
