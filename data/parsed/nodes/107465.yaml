    html: "<p>Don't know it but here are some you may like: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/itc/lubalin-graph\" rel=\"nofollow\">Lubalin Graph ITC</a> (possibly the closest in term of overall design approach, main difference being top unserifed /A), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/mti/rockwell\" rel=\"nofollow\">Rockwell</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/northernblock/teletex\" rel=\"nofollow\">Teletex</a> (artificially emboldened by adding a thick outline stroke might work?), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/synthview/novecento-slab\" rel=\"nofollow\">Novocento Slab</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/artill-typs/sketch-block\" rel=\"nofollow\">Sketch Block</a> (keeping only outlines), <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/intellecta/figgins-brute\" rel=\"nofollow\">Figgins Brute</a> (very different mainly because of /R but I like its vintage feeling),  <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/Stymie\" rel=\"nofollow\">Stymie</a> (see Teletex), <a class=\"freelinking external\" href=\"http://www.fontsquirrel.com/fonts/arvo\" rel=\"nofollow\">Arvo</a>, <a class=\"freelinking external\" href=\"http://www.fontsquirrel.com/fonts/rokkitt\" rel=\"nofollow\">Rokkitt</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/search/Kettering\" rel=\"nofollow\">Kettering</a> 105 and 205</p>"
