      <p>Kent: <em>...you could probably make a case under Fair Use for a right to open up a font and examine the outlines purely for the purposes of learning and research.</em></p>
      <p>This would depend, I think, on factors 1 and 4 of the balancing test, i.e. what are you intending to do with the knowledge you gain from studying the decompiled font software. The common prohibition against decompiling software is that you will be able to see how it is made and this will give you an unfair advantage in producing a competing product (in that you will not have invested in the original creative development).</p>
