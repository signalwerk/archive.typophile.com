      <p>Since John has already taken his stab at question no. 1, let me stay on just that topic.</p>
      <p>I will state that I am not a lawyer (even if I begin to sound like one) and none of my comments should be construed as legal advice. Also, I am not offering any official interpretation of licenses for any foundries that I might work with. I am just giving my personal opinions.</p>
      <p>I will assume, as John has, that for the sake of this discussion we are talking about the U.S. Copyright Law, which is contained in Title 17 of the United States Code. </p>
      <p>Anyone is welcome to read it for themselves. The full text of the law can be found here: <a href="http://www.copyright.gov/title17/index.html" title="http://www.copyright.gov/title17/index.html">http://www.copyright.gov/title17/index.html</a> and can be downloaded as Circular 92.</p>
      <p>The doctrine of "fair use" is outlined in §107 -- Limitations on Exclusive Rights: Fair Use. It gives the principles for possible exceptions to the rights stated in §106.</p>
      <p>So, before we delve into fair use let's just review that §106 of the Copyright Code secures to the owner of copyright the exclusive right to do (and to authorize others to do) a couple different things: [I'm paraphrasing here]</p>
      <p>(1) Reproduce the work in copies;<br>
      (2) Prepare derivative works based upon the copyrighted work;<br>
      (3) Distribute copies of the work by sale or other transfer of ownership, or by rental, lease, or lending;<br>
      (plus a few others that pertain only to other media, primarily visual and performing arts, so I'm not going to enumerate them here).</p>
      <p>§107 then outlines a "fair use exception" to the exclusivity of those rights "for purposes such as criticism, comment, news reporting, teaching, scholarship, or research."</p>
      <p>John is right that the Fair Use Exception is usually an affirmative defense against claims of infringement. It would be up case law to determine what uses would actually constitute fair use. Since the statutes were written primarily from the perspective of visual art, written works, and musical works, it's a little hard to say where things would come down in relation to font software.</p>
      <p>I will go out on a limb and give my opinion -- contrary to the opinion John expressed above --  that despite most EULAs' prohibition against "decompiling, reverse engineering, and disassembling" you could probably make a case under Fair Use for a right to open up a font and examine the outlines purely for the purposes of learning and research. </p>
      <p>I'm not sure what application the doctrine of fair use might have in the specific case of Cufón here. But if you see an argument, feel free to posit it.</p>
      <p>Keep in mind, the statute gives four factors to be used in the consideration of whether a particular case is fair use or not: [I'm quoting in full this time]</p>
      <p>(1) the purpose and character of the use, including whether such use is of a commercial nature or is for nonprofit educational purposes;<br>
      (2) the nature of the copyrighted work;<br>
      (3) the amount and substantiality of the portion used in relation to the copyrighted work as a whole; and<br>
      (4) the effect of the use upon the potential market for or value of the copyrighted work.</p>
      <p>This is the balancing test that John referred to.</p>
