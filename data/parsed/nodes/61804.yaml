      <p>The Adobe lawyers were never okay with Cufón stripping the copyright notice. It was only just brought to their attention. And I'm told that Adobe requires the copyright to be preserved because it's otherwise a DMCA violation -- so it's not so much a legal judgement call as an established legal requirement.</p>
      <p>My point in contacting Simo was to (helpfully!) tell him that Cufón was likely violating the DMCA. Of course this also a problem for Adobe, so I asked that he remove the notice on his site that Adobe fonts are okay to convert until he fixed the generator (which he did immediately).</p>
      <p>Simo told me he's very interested in more feedback, so I suspect he just needs to be asked to also preserve trademark. (I'll ask him.) Of course, Adobe's happy to have more of that info preserved and visible to end users -- it just didn't have the legal urgency of the copyright notice (in the opinion of Adobe legal).</p>
      <p>Si, don't know what to tell you about the copyright/trademark disagreement. Maybe my lawyer can call your lawyer. :)</p>
