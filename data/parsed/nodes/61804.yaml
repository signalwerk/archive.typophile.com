    <p>Hi, </p>
    <p>For fun I used this tool - <a href="http://cufon.shoqolate.com/generate/" title="http://cufon.shoqolate.com/generate/">http://cufon.shoqolate.com/generate/</a> to create a <a href="/wiki/Cufon" class="freelinking" rel="nofollow">Cufon</a> format font. Upon opening the resulting .js file in a text editor I noticed that the font's (c) and trademark strings didn't come across. Anyone know if that's a limitation on the font format or if it's possible to paste in these strings?</p>
    <p>Cheers, Si</p>
  html_clean: |-
