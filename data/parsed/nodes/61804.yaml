      <p><cite> &gt; I mean, what do you think goes on when someone opens up one of FB’s fonts in Photoshop and a minute later there’s a gif based on it posted on a web site somewhere?</cite></p>
      <p>With all due respect, Rich, that's a different case.</p>
      <p>In your Photoshop example, the font data has been utilized (not "opened up" btw), as provided, to perform as it was licensed to do: to render letterforms. The user is then free to do as he wishes with the fixed, rendered form; just like printing.</p>
      <p>In the "Cufón" example (I'm using this as representative, not to pick on Cufón specifically), the font data itself is being materially modified to perform differently. Such a modification of the software data itself is a derivation under copyright and one needs permission from the intellectual property owner to do so.</p>
      <p>Currently, the general license of most foundries does not grant this permission off-the-shelf. So, developers need to ask first. Some foundries may grant that permission, some may not. That's their right. Some may want additional fees, some may not. That's also their right.</p>
      <p>If you can't come to terms, then you'll take your business elsewhere. I realize you hate having to jump through that hoop. The technologies and markets are still emerging. It will take a while to sort out.</p>
      <p>There may come a day when the permission to make these modifications becomes incorporated as a de facto part of a standard license. I get that that's what you'd like to see happen. But we aren't there yet.</p>
