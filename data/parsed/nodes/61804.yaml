      <p>Rich, re. fair use:</p>
      <p><em>What fair use rights do I have with regards to font files? By law I have to have some regardless of what any EULA might say and I was just wondering what you thought those might be.</em></p>
      <p>In US law, as I understand it, fair use rights are determined by a balancing test, which is a judicial process. So rather than the usual disclaimer that I'm not a lawyer, in this case I should point out that I'm not a jurist.</p>
      <p>With explicit judicial ruling regarding fair use of font files, you have to look at fair use for similar copyright material. Since fonts are copyrighted as software, the most obvious place to start looking is fair use of copyrighted and commercially licensed software. Now, a lot of software licenses explicitly forbid decompiling the software, which applied to fonts would prevent font format conversions or any tinkering inside the font as a font; even opening such a font in FontLab to take a look at it would constitute license infringement. Frankly, I would be surprised if you could make a case that decompiling software is fair use if the license disallows it, even if you do not do anything more with the software, but I'm not aware of case law relating to this.</p>
      <p>If we presume a font license does not explicitly disallow decompiling the font binary, what fair use rights might exist? Given that distributing a derivative work is contrary to the whole purpose of copyright, I doubt if any balancing test would permit that. So the question is probably whether you have a fair use right to modify the font for your own purposes, and to use the resulting derivative work but not to distribute it or use it beyond the scope of the original license. There are, of course, plenty of font licenses that explicitly <em>permit</em> such modification of fonts; but there are others that explicitly disallow it, that require you to go back to the font maker if you want a custom version even for your own use. So I read your question as 'Are such license prohibitions enforceable, or is that a fair use right to modify fonts?' Again, you'd have to look at the general state of software copyright first, and then more specific case law and, for a final decision, get a judicial balancing test decision on fonts per se.</p>
