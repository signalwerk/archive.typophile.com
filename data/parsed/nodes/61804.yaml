      <p>What I have been told is that copyright is more legally important; the DMCA requires that it be preserved. Not so for trademark. (Apparently. IANAL.)</p>
      <p>Simo and I discussed the choice of putting the copyright statement in JS comments versus the binary data. The former is more accessible, but could (in theory, I guess) get stripped by "some Javascript optimizers". So, while I speculated that it might be more bulletproof to embed the copyright in the binary, Simo chose to put it in text comments, and observed that any other software that chose to strip it would probably be violating the DMCA or some other law. Seems okay to me.</p>
