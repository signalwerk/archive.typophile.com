      And the discussion is, in some ways, a precursor to the issues that will arise with SVG fonts, should that technology come to be widely deployed.</p>
      <p>@kent</p>
      <p><em>"In your Photoshop example, the font data has been utilized (not “opened up” btw), as provided, to perform as it was licensed to do: to render letterforms. The user is then free to do as he wishes with the fixed, rendered form; just like printing."</em></p>
      <p>Oooh, let's not travel too far down "Copyright Road" but what the heck, let's fence a little.<br>
      Please answer me these questions:</p>
      <p>1) What fair use rights do I have with regards to font files? By law I have to have <strong>some</strong> regardless of what any EULA might say and I was just wondering what you thought those might be.</p>
      <p>2) Do you consider a contractual obligation - with regards to a work protected by copyright - to not create derivative works to include sub-setting that work into parts?</p>
      <p>3) Lastly - and this is a real world scenario I recently ran into:</p>
      <p>A font is obtained under a totally free and open license. (No doubt about this. Unequivocal EULA included and the source verified.) But in order to use it as a web font, you need to convert it into an EOT. However the EOT converter software won't convert a file that has the embedding bit set to restricted. And, it seems, the embedding bit on said font has been set to Restricted by mistake.<br>
      Is it then OK to just change the embedding bit, and think no more about it?</p>
      <p>BTW - As I've noted elsewhere on Typophile, Cufón does not make use of or rely on hinting data. A font like Whitman, used decoratively or for headings, would probably look outstanding. But the Cufón converter will have to "utilize" the font so that it can appear, in the browser, in it's ultimate "fixed, rendered form".</p>
      <p>Regards,</p>
      <p>rich</p>
