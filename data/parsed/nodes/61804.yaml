      <p>@jh and kent:</p>
      <p>Copyright law is, indeed, a rabbit hole. And discussions about property rights, in general, tend to descend into back-biting and eye-gouging rather quickly.<br>
      But hey, this is Typophile where "don't punch, pun" is the order of the day.</p>
      <p>The reason I asked was because I really wanted to know how font designers see the situation.<br>
      (I should add that there are font designers who's views are not as traditional as the one's you've expressed. It runs the gamut. Also, we're moving a bit away from Simo and Cufón but, as you can see, he's pretty sensitive to IP concerns, ethically-minded, and wants Cufón to have as broad a reach as possible, so I think he'll see some relevance.)</p>
      <p>Flash, Cufón, SVG, @font-face - all these things are going to bring yet another revolution to the world of typefaces. And as far as licensing, if there isn't clarity, consistency, and up-frontness, there's going to be grief for all concerned.</p>
      <p>The ironic thing is, I think font designers are going to end up getting a fairer shake from web devs/designers than they do from the print industry, an industry filled with people who also rely on copyright and therefore know quite well when they're ignoring the terms of a license.</p>
      <p>My desire is this: if I am not redistributing your work in a form that makes it easy for others to make use of it without paying, then I'm OK. I don't have to worry about DMCA notices or any other hassles. This is - and please correct me if you see it differently, John - the compromise that was reached in regard to the use of @font-face. Meaning that a "garden fence" is the test. With @font-face it consists of a "wrapped" font file unsuitable for installation in the OS as in the WOFF and EOT specs.<br>
      But it can take other forms, as it does with Cufón. IMHO.</p>
      <p>I await your thoughts about the other dilemmas listed.</p>
      <p>Regards,</p>
      <p>Rich</p>
