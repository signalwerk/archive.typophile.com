       * ACaslonPro-Regular<br>
       *<br>
       * Designer:<br>
       * Carol Twombly<br>
       *<br>
       * Vendor URL:<br>
       * <a href="http://www.adobe.com/type" title="http://www.adobe.com/type">http://www.adobe.com/type</a><br>
       *<br>
       * License information:<br>
       * <a href="http://www.adobe.com/type/legal.html" title="http://www.adobe.com/type/legal.html">http://www.adobe.com/type/legal.html</a><br>
       */</p>
      <p>@dberlow</p>
      <p>OK, so your license does not allow your fonts to be used with Cufón, right? That's perfectly fine. But there's always going to be someone who does it anyway, and the "EULA allows this" checkbox is pretty much all we can do about it. In cases like this, would you rather not have your copyright embedded to the font files at all?</p>
      <p>What do you count as modification anyway? Even Abode Flash slightly modifies the curves of embedded fonts by converting them to quadratic ones (see "Converting TrueType fonts to SWF glyphs", page 172 of <a href="http://www.adobe.com/devnet/swf/pdf/swf_file_format_spec_v10.pdf" title="http://www.adobe.com/devnet/swf/pdf/swf_file_format_spec_v10.pdf">http://www.adobe.com/devnet/swf/pdf/swf_file_format_spec_v10.pdf</a>). Now, Cufón obviously takes things a bit further by allowing the user to scale the font down and optimize the path after that for the purpose of decreasing file size, but this functionality can be turned off. After that it's not much different from what Flash does. The curves are just converted to cubic beziers and stored in VML format.</p>
      <p>From the SWF spec:</p>
      <p>"The complete procedure for converting TrueType glyphs to SWF glyphs is as follows:</p>
      <ol>
      <li>Negate the y-coordinate. (In TrueType glyphs, the y-axis points up; in SWF glyphs, the y- axis points down.)</li>
      <li>Scale the x and y co-ordinates from the EM square of the TrueType font, to the EM square of the SWF glyph (always 1024).</li>
      <li>Insert an on-curve (anchor) point at the midpoint of each pair of off-curve points."</li>
      </ol>
      <p>So actually Flash scales things too. Both Cufón and Flash do 1. They both also do 2, although this can be turned off in Cufón. The 3rd point is different but the purpose is the same. So, they're not that much different after all.</p>
      <p>It would be interesting to find out whether PDFs also do something like this.</p>
      <p>Simo</p>
