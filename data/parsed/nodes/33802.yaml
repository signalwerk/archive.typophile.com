    <p>I've picked up a copy of the Carter book saturday (‘Typographically Speaking: The Art of Matthew Carter’) and fell in love with Galliard (again). However, there seem to been a whola lotta versions out there. </p>
    <p>The roman cut seems to no problem, the CC version is available at fontshop. Too bad it isn't opentype yet (somebody has an idea if its coming btw?).<br>
    After some reading it seems the Bitstream version (for the bolds) fits the CC roman best.It was digitised under MC’s supervision.  The ITC version (+ adobe, E+F, Linotype) has shortenend ascenders &amp; descenders (Carter's drawings we’re ‘adapted’ for jobbing purposes). </p>
    <p>So I surfed to <a href="http://www.myfonts.com/fonts/bitstream/itc-galliard/" rel="nofollow">Myfonts</a> — but to my dismay, myfonts can't sell the Bitstream version anymore due to licensing issues :-(</p>
    <p>Anybody has a clue when this issues will be resolved? Or when Bitstream Galliard will be available again? Or is there another foundry with a version that goes with the CC version?</p>
