    html: |-
      <p>You can find this font under the following names:</p>
      <p>-----------------------------------------<br>
      <strong>Paintbrush</strong><br>
      Copyright (c) 1986-1995 SWFTE International Ltd</p>
      <p><strong>Company Info:</strong><br>
      SWFTE International was a software developer based out of Miami, Florida.<br>
      SWFTE International was started by David H. Goodman as a font developer but gradually began developing games as well. They created several card games under the Bicycle logo and had plans to develop other types of games. Their <strong>font software work brought a copyright infringement lawsuit by Adobe and several others;</strong> the suit was settled with SWFTE agreeing to pay damages. Shortly after the settlement they were acquired by Expert Software, Inc in 1995.<br>
      Source: <a href="http://www.giantbomb.com/swfte-international/65-2491/" title="http://www.giantbomb.com/swfte-international/65-2491/">http://www.giantbomb.com/swfte-international/65-2491/</a></p>
      <p>----------------------------------------<br>
      <strong>Oriental</strong><br>
      <strong>OrientNouveau</strong><br>
      <strong>Painter</strong><br>
      <strong>PainterNarrow</strong><br>
      All 4 fonts copyright look like this:<br>
      Oriental Digital Typeface Data Licensed from the WSI-Font Collection.<br>
      Copyright (c) 1992 Weatherly Systems Inc</p>
      <p>=&gt; WSI is out of business since 2003: <a href="http://www.weatherlysystems.com/" title="http://www.weatherlysystems.com/">http://www.weatherlysystems.com/</a><br>
      =&gt; More info on the Company:<br>
      <strong><a class="freelinking external" href="http://www.sanskritweb.net/forgers/wsi.pdf" rel="nofollow">Font Forgeries by Weatherly Systems Inc</a></strong></p>
      <p>---------------------------------------<br>
      <strong>Pittoresk</strong><br>
      (C) 1994 Brendel Informatik GmbH<br>
      =&gt; Brendel is also known for many <strong><a class="freelinking external" href="http://www.sanskritweb.net/forgers/greenstreet.pdf" rel="nofollow">font-forgeries</a><strong></strong></strong></p>
      <p>So that leaves me wonder...<br>
      is there any legitimate source for someone to acquire this font or not?</p>
