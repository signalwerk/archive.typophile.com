      <p>Actually, I just realized that most of what I've written applies to accents placed on top of the letters. For commaaccent, cedilla and ogonek, it is, indeed, less common to include .case variants (and the standard Fontographer 5 encodings do not have slots for these). </p>
      <p>In general, I'd say, including a few superfluous glyphs does not do any harm. In OpenType PS, those will be compressed with their identical counterparts using subroutines, and in OpenType TT they will only occupy a few more bytes. I wouldn't worry about it. </p>
      <p>I'd even say: any methods used in the font for the creator's benefit (i.e. methods that improve the speed and consistency of the font creation) that do not IMPEDE or LIMIT the usability of the font for the user, are fine. </p>
      <p>Of course this depends on the font creator's priorities. If one's goal is to create a "technically ultra-perfect font", which is optimized to the point of perfection, the designer may choose to employ any optimization he or she wishes. </p>
      <p>In the end, it's a matter of decision, really.</p>
