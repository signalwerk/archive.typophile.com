      <p>The inclusion of .case accent glyphs is merely a simplification in the font development process. The designer can place the glyph outlines in the .case variants higher than in the glyphs intended for lowercase letters. I.e. the difference between the caps height and the x-height can be "hardcoded" in the accent glyphs. Then, when generating composite glyphs, the designer does not need to shift each component accent in all the composite glyphs up by the same value, but instead, all accent components can rest at the y=0 position. Then it's easier to make changes. When I move the outlines of the acute.case or dotaccent.case up or down, the changes will be immediately reflected in all the uppercase accented letters, but the lowercase letters won't change. And in general, when using the .case approach, the designer only needs to adjust the x-position (left-right) of the components in the composite letters, and does not need to worry about remembering to set the correct y-position. </p>
      <p>If we use the same accent glyph for lowercase and uppercase letters, then any change will require going through all the uppercase glyphs and making the change for each (and we need to pay attention that those changes are consistent). </p>
      <p>In addition, those .case variants can be used "ad hoc" as a "poor man's" method to create additional composites while typesetting (through the use of kerning). Finally, this simplifies hinting a bit because we can define additional alignment zones just for the .case accents. </p>
      <p>So it's merely a way to simplify the creation of composite glyphs. But of course, some designers may choose to do it differently. They can write a "mark" feature or use Python scripting to produce the correct placements, but the practice has shown that using the .case method is the simplest, and works even in font-creation tools such as Fontographer or TypeTool that do not have the more advanced features. </p>
      <p>Best,<br>
      Adam</p>
