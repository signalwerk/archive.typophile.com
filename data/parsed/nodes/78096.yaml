      <p>You can only define global alignment zones. What I mean is that you can have a alignment zone specifically for the .case glyphs, which are typically drawn way above the caps height and even ascender height, and by default don't have an alignment zone on their own. </p>
      <p>(By the way, I do think that the ability to define per-class alignment zones would be useful). </p>
      <p>Best,<br>
      Adam</p>
