    <p>I'm wondering if there are any practical reasons requiring that all members of a particular family should have the same glyph complement.</p>
    <p>As a concrete example, I have a font in which the cedilla and combining cedilla have slightly different forms for uppercase characters, but only in the most extended versions of the font. Currently, even in the condensed forms I have created distinct glyphs for cedilla/cedilla.case and uni0327/uni0327.case even though they are simple copies. I've done this primarily because it allows me to maintain a single set of class definitions and GSUB code for the entire family, but I'm wondering whether these superfluous glyphs can be removed from the more condensed versions once everything is finalized.</p>
    <p>The only compelling reason I can think of for keeping them in is that it will ensure that GIDs remain consistent throughout the family. This occurs for more glyphs than just cedilla, so even if the glyphs are placed at the end of the font there is no way to get consistent GIDs if these glyphs are removed. I'm wondering, though, if this is actually something one needs to be concerned with.</p>
    <p>I'm interested in this mainly from a theoretical standpoint since the inclusion of a handful of unneeded glyphs is hardly a big deal. I'm just trying to get a handle on what sorts of things are/aren't important to consider when trying to harmonize fonts into a family.</p>
    <p>André</p>
