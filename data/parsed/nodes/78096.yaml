      <p><em>any practical reasons requiring that all members of a particular family should have the same glyph complement.</em></p>
      <p>How about, no surprises? Assume that someone has set a project in a regular width of a font, but the amount of copy requires that the font be set in a smaller size than desired. If the author were to substitute a condensed weight of the font, he or she would expect the font to contain the same characters...</p>
