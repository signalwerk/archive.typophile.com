      <p>Thanks for all your comments.</p>
      <p>@seb: What's the protocol for McK names? Is there a hard and fast rule?</p>
      <p>@Graham: For me at least, the difference in styles between the mark and type is enough contrast (a rich, curvy Bodoni vs. a simple geometric sans). I also like the fact that there is something to tie the two together (the weight of the type and the weight of the mark's serifs). </p>
      <p>@David: I will definitely try that alignment. Sounds like it will work. I'll also look at tightening up the RT.</p>
      <p>@typerror: Ideally, I'd like to have both a vertical and horizontal version of the logo, so I will be looking into both. </p>
      <p>@chris: What about the type turns you off? Any suggestions?</p>
      <p>@penn: I see these really black Bodonis with super skinny serifs all over the place. I would also worry about having the logo fall apart at small sizes if I were to thin out the serifs. I'll give it a try, though.</p>
      <p>I'll post the results of the revisions. Thanks again to everyone who has helped out so far.</p>
