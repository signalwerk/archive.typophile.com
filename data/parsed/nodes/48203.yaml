      <p>1. Perhaps I shouldn't comment because I dislike Gotham greatly. Geometric sans are plain ugly to my eyes. I would stay with a sans face, but one with a bit more life and movement in it for my taste.<br>
      2. I think the mark is too large, however I don't know what you are trying to achieve and so I can only make comments based on my own prejudices &amp; personal preference. I believe there should be a bit more of a contrast between the two elements. Both are strong and dark and the overall feel is heavy - not that this a mad thing, it could be what you want.<br>
      3. Letter spacing is fine.</p>
