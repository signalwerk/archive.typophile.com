      <p>Hate to be a party pooper here, but I'm going to do it anyway.</p>
      <p>I don't see any reason to use Gotham with that good-looking mark. Is it an attempt to complement with little contrast? Well, you've got conflict in extra bold versus light, conflict in sans versus serif, conflict in italic versus roman, conflict in upper/lower versus all uppercase. Frankly, the name just doesn't look at all like it belongs with the mark. I'd like to see you switch out the Gotham for something a little less conflicting.</p>
