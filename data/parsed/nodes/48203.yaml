    html: |-
      <p>I'm having a hard time deciding if guiyong's post is a joke or not. I hope it is.</p>
      <p>The mark is beautiful and actually looking through all the revisions you've made, I like the very first lockup version the best. Although, I can see that there are problems with the alignment and compatibility the two elements.</p>
      <p>Have you considered that maybe the mark doesn't ever need to have your name next to it? It's strong on it's own. I think you could work it out so your name never has to be part of the logo. Your letterhead, for example, could have the mark in one corner and your name with contact info along the bottom or in another corner. That will make your mark into a beautiful icon that needs no explanation. (I mean icon in the "iconic" sense, not as in something you would click on your computer)</p>
      <p>Also, Gotham is a really wonderful typeface to use in your identity, but I think it would be beneficial if you experimented with others to see what happens. </p>
      <p>Analisa</p>
