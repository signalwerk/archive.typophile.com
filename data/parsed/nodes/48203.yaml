      <p>A few questions/thoughts that might help get the ball rolling:</p>
      <p>1. Everyone loves Gotham, and so do I. I'd like to keep the typeface for my name pretty neutral (probably a geometric sans). Do you think there's a better alternative? Is overuse of a typeface a reason to reconsider using it?</p>
      <p>2. What do you think about the size of the mark in relation to the type? Currently, the weight of the type is equivalent to the weight of the M's serifs.</p>
      <p>3. Kerning good?</p>
