      <p>One thing that bugs me is how, when a topic extends to multiple pages, the “new” flags get wiped out before you can get to the last page of the topic. My workaround has been to add “?from=0&amp;comments_per_page=500” to the link url so all the threads appear on the first (and only) page.</p>
