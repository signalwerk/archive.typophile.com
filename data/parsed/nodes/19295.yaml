    <p>I was going to add a new entry to the <a href="https://web.archive.org/web/20080906131935/http://typophile.com/node/12063">Typophile Beta Bug Report</a>, however, since this isn’t really a bug but rather a request for a new feature, I decided to start a new thread. Hopefully others will add some more ideas, and we’ll all make our beloved Typophile even better.</p>
    <p>Here’s mine:<br>
    Is it possible to add a <a href="https://web.archive.org/web/20080906131935/http://en.wikipedia.org/wiki/Permalink">permalink</a> to each post so that they can be referred directly within the thread? I know it’s already possible to do something like this <a href="https://web.archive.org/web/20080906131935/http://typophile.com/node/17011#comment-103291" title="http://typophile.com/node/17011#comment-103291">http://typophile.com/node/17011#comment-103291</a> but not everyone knows about it. In addition, one needs to loggin (or dig through the source code) to get the comment number. Thank you :^)</p>
    <p>(BTW, I noticed that this ’technique’ doesn’t work for threads with more than one page.)</p>
    <p>[Edit: <a href="https://web.archive.org/web/20080906131935/http://www.alistapart.com/comments/gettingstartedwithajax?page=3#23">A List Apart</a> does this too. Notice how the page number is included. I see now that we could do <a href="https://web.archive.org/web/20080906131935/http://typophile.com/node/17011?from=50&amp;comments_per_page=50#comment-105491" title="http://typophile.com/node/17011?from=50&amp;comments_per_page=50#comment-105491">http://typophile.com/node/17011?from=50&amp;comments_per_page=50#comment-105...</a>  but this is human-unreadable.]</p>
