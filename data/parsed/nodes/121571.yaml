  html: |-
    <p>Hi,</p>
    <p>These are home poker chips that were designed about ten years ago, with the artwork stamped on them in foil. I've gotten permission to recreate the artwork for my personal use, but the owner no longer has any art files. So while this post is mainly for the top font "CASBAH CLUB", I'm also interested in what was used for the denominations (if different) and for "LAS VEGAS" at the bottom. I'll of course create new requests for them if necessary.</p>
    <p>Huge thanks for any help you can give me!</p>
    <p>Cheers,<br>
    Mikko</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/casbah club_6485.JPG"></div><p></p>
