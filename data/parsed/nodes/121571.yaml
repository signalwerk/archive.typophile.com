      <div class="comment-spam-body"><p>A quick google run-through of "faux Arabic" and possible names like Sheik, Caravan, Aladdin, genie, magic lamp, Sultan, Shriner etc didn't produce any thing even close.<br>
      If you only need the eight letters it's perhaps as easy to make them from scratch as to search for an existing font.<br>
      But possibly someone else has found something.<br>
      Don</p>
