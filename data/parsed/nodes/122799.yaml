    html: |-
      <p>Agree with Don. As usual for this kind of artwork it's hard to define if it's hand-drawn or not. Most of fonts are now offering many alternate glyphs, ligatures and swashes intending to recreate hand-drawing. Some designers and foundries are kind of specialised in such art: <a class="freelinking external" href="http://www.myfonts.com/foundry/Magpie_Paper_Works" rel="nofollow">Magpie Paper Works</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Emily_Lime" rel="nofollow">Emily 'Lime' Conners</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Debi_Sementelli_Type_Foundry" rel="nofollow">Debi Sementelli</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Great_Lakes_Lettering" rel="nofollow">Great Lakes Lettering</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Trial_by_Cupcakes/" rel="nofollow">Trial by Cupcakes</a> or (some) <a class="freelinking external" href="http://www.myfonts.com/foundry/Eurotypo" rel="nofollow">Eurotypo</a>...<br>
      Bombshell, Carolyna, Dasha, Ondise, Dahra, Jacques and Gilles, Peoni, Cantoni, Gemmadonati, Asterism among many others...<br>
      '<a href="/wiki/https%3A/%252Fcreativemarket.com/fonts/script" class="freelinking" rel="nofollow">Script section at Creative Market</a>' is definitely a place to go and spot a good alternative with typefaces by MakeMedia Co., Seniors, Cultivated Mind, Nicky Laatz, MyCreativeLand, Artimasa, MyCandyThemes, AF Studio...</p>
