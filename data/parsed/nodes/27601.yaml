  html: |-
    <p>Hi there, </p>
    <p>I need some advice. I have a contents page and I am a little unsure whether I need full points at the end of the chapter headings. </p>
    <p>WIthin the book, the main chapters, (Set in Avenir in contents page) do not end in full points. </p>
    <p>The interviews, (set in Janson Text within contents page), do end with full points within the actual page. </p>
    <p>And then The Pink text,(set in Janson Text within contents) do not end with full points on the actual pages. </p>
    <p>My queery is whether to add full points within the contents page or follow how the book is set out and only include full points on the interview titles. </p>
    <p>Any thoughts anyone, hope that allmakes sense. </p>
    <p>M</p>
