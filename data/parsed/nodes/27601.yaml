    html: |-
      <p>I would suggest not, to include some and not others would give the impression of mistakes, however I would prefer the contents to read subject__page number, which I think would help with your indenting, if the numbers all ranged right. You could also consider using a baseline grid to keep all the lines in each of the columns aligned, and dropping the “Interview with” to make finding a particular interview easier.<br>
      btw I spotted three <em>possible</em> errors in the copy (and there may be more) – harper Collins (Harper), Ericcson (Ericsson) and Rabbit send a Little Bill (surely sends?)<br>
      Tim</p>
