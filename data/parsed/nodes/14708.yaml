    html: |-
      <p>They just needs to be legible. I usually make them as small as I can, while still being legible.</p>
      <p>In fact legally they aren't even mandatory at all, but they provide additional legal protection in case of a lawsuit. Here's a quote from the International Trademark Association:</p>
      <p>"Use of the registration symbol or other statutory notice is not mandatory, but it is important not only because it provides notice of the owner's registration of the mark, but also because it allows the owner to assert certain types of damages in lawsuits against infringers. Failure to use a registration notice limits the remedies available to a trademark owner in a lawsuit..."</p>
      <p>So in other words, the government doesn't require them, but if company X sues company Y for infringement, the lawyer for company X can say, "They should have known it was a registered trademark because we put the symbol on it."</p>
