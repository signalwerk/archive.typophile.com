  html: |-
    <p>Does anyone know of a rule for the size/scale of a registered trademark symbol in both body copy and logo design? From what I can tell, the body copy registered trademark is larger proportionally than it would be in the logo version of the same term. For example the (R) after Coca-Cola is proportionally larger when it appears in body copy (superscripted) than when it appears (subscripted) in the Coca-Cola logo. Are there universal and legal minimums/maximums for each of these applications or is it entirely up to the designer and typesetter?</p>
    <p>Also, does anyone know of a good book that deals specifically with print ad typography?</p>
    <p>Any feedback would be most appreciated.</p>
