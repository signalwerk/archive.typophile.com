    html: <p>I'm working on a logo design right now, where I'm supposed to add an registered (R). Does anyone no about any legal or typographic rules how to place the (R)? Can I place it anywhere close to the logo or does it have to be at the lower or upper right corner? Any certain rules about the size? Or is there a minimum percentage for the size in relation to the logo?</p>
