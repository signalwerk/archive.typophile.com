    html: |-
      <p>In fonts, the informal standard is that "Registered" and "Copyright" are cap-height.<br>
      "Trademark" is generally rendered as a superscript, about the same relative size as other superiors such as figures and ordinals.</p>
      <p>"Registered" and "Copyright" are cap height, even thought they will be reduced in the main text, because they are also required in reference footnotes, so it is up to the typographer to superscript and downsize them for use in running text and logos: there are defaults for this in Quark and InDesign, around 60 -70 %, IIRC, which is therefore the de facto standard.</p>
      <p>"Trademark" is not cap height, because if it were, there is the likelihood it would be read as part of the preceding word, and be too wide in footnotes. So it can look too small in some footnotes. However, it doesn't require special superscript treatment by the typographer.</p>
      <p>For logos, it's up to the discretion of the graphic designer/art director, but it's quite alright to make them very small, with the proviso, as Ben says, that if it is part of a logo that is going to be scaled, then the graphics standards for a corporation should provide different versions of the logo for use at different sizes.</p>
      <p>AFAIK, infringement has never been legally defended on the grounds that the infringer didn't see the mark because it was too small in a document, but I'm not a trademark lawyer, so perhaps it has happened!</p>
      <p>In a few typefaces (such as those of my Modern Suite), there are alternate, optically scaled glyphs for "Registered" and "Copyright", accessible through the OpenType "Superscript" feature.</p>
