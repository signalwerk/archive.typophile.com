      <p>It depends on the used type size. It should be good visible for common eyes. So its big on 9pt and very big if you set smaller text. On larger text sizes it becomes smaller. So you should choose a size for what your design best fits for - mostly body text or display. </p>
      <p>I think the R in the registered sign should have the same size (caps high) as the TM mark - but maybe it depends on personal taste. I see very often a different approach.</p>
      <p>Lots of fonts don't care much about such issues and use a standard sign and size.</p>
      <p>my suggestions to start from:<br>
      (percentage of the caps high) </p>
      <p>4-8pt: bigger<br>
      9-12pt: 55 - 47%<br>
      16-28pt: 45 - 40%</p>
      <p>--<a href="http://www.astype.de" target="_blank">astype.de</a>--</p>
