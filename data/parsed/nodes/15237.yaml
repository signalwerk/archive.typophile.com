  html: |-
    <p>I used the <a href="/wiki/language%20system%20tag" class="freelinking" rel="nofollow">languagesystem tag</a> in my OTF CFF font. In the OpenType Features preview pane in FL 4.6 I can see the script armn and the language HY, and the features work. But when I export the font and try it in InDesign, the features are not available.</p>
    <p>Am I missing something?</p>
