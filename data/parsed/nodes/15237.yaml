    date: 2005-09-21T18:33:00
    date_raw: 21 Sep 2005 — 6:33pm
    votes: null
    html: <p>InDesign does not support language system tags. Unfortunately, there are currently no shipping applications that support this feature of OpenType Layout, although I have seen demonstrations of functionality in Microsoft software. To get your Armenian lookups to work within InDesign, you may need to associate the lookups with the Latin script and dflt language tags.</p>
