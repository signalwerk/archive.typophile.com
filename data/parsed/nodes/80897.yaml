      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nameplate_4336.gif"></div><p></p>
      <p>Any typeface combination can work, if different enough.</p>
      <p>Extremes compliment each other.</p>
      <p>Simple geometric fonts work great as a contrast to blackletter.</p>
      <p>Even a really fancy script can work in combinations.</p>
      <p>Remember, the more extreme and different the two, the better.</p>
      <p>Good luck.</p>
