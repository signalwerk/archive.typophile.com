  html: |-
    <p>Hi all,</p>
    <p>I am reworking a logo I created for a local Oktoberfest celebration<br>
    and I have to choose new fonts. I am using a blackletter face but<br>
    for the other subheader text, I need to pair the blackletter with<br>
    something which complements or contrasts it and not sure outside<br>
    of a geometric typeface what will work with the blackletter. I have<br>
    yet to choose which blackletter typeface I will use. Right now,<br>
    the client needs to have several choices. </p>
    <p>Any help is greatly appreciated!</p>
    <p>Bonnie</p>
