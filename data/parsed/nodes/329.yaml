    html: "<p>Hi, Paul. <br>I am helped by your suitable support. <br> <br>&gt;but I doubt that designing a Japanese typeface requires designing every single Kanji, <br>&gt;just as designing a Latin face doesn't require us to design each word but just to consider  <br>&gt;the possible combinations.  <br> <br>Japanese character can be set also horizontally and vertically. When a text is set vertically, we read from top to bottom. When a text is set horizontally, we read from left to right. (Before WWII, when a text was set horizontally, we had the time which was being read from the right to the left.) <br>For such a feature, a Japanese typeface must be designed so that it may match, even if set in which direction. <br>Moreover, since a Chinese character is an ideographic character(For example, the character the \"east\" and \"west\" is expressed with only one character.), the proportion must be beautiful even if it is set independently.  <br> <br>&gt;Kunihiko: Don't be ashamed of using translation software.  <br> <br>thank you, Paul. <br>I must not be mistaken in translation as much as possible. <br></p>"
