    html: <p>Thanks, Hrant. <br>I was able to understand the meaning by your second post. <br> <br>&gt;But I wonder if the Latin font has enough strength to stand on its own in composing long paragraphs.  <br> <br>I think that your opinion is right. In fact, it can be said that not only Latin alphabet but also a Chinese character of the AXIS FONT is a bland design compared with many of other Japanese typefaces. It is reasonable in the AXIS FONT being a quiet design. <br> <br>The AXIS magazine has carried many photographs and illustrations. It is a very graphical magazine. In order not to break balance with a photograph, I consider a typeface as it is better to be a bland design. Therefore, it may not be omnipotent. <br>It will be easy to make it harmonize, when carrying many photographs and illustrations. There was neither a photograph nor an illustration in the AXIS magazine, and probably, it became a tedious page if it was only the AXIS FONT. <br> <br></p>
