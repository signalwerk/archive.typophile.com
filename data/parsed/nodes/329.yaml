    html: '<p>Hello, Omine. <br> <br>&gt;&gt;&gt;36 strokes???  <br>&gt;&gt;I think this is "kakesu"  <br>&gt;Yes, Paul got it right. <br> <br>"kakusu"! I understand well! 36 strokes means "36kaku". Probably, I think that the character of 36 strokes is not contained in an axis font. It will be up to at most 30 strokes.  <br> <br>A character with 30 strokes needs many devices. Since these characters must be drawn into the square of the same size as a character with few strokes, each stroke is made thin and the whole is homogenize tone. It is important point that the width of a stroke of a character with many strokes and a few character(For example, which shows "one: Japanese pronunciation is i-chi." is one stroke.) looks the same black tone.</p>'
