  html: '<p>I am glad to participate in this forum. <br>This is the news from Japan. <br>Typeface named "AXIS FONT" was put on the market in Japan last month. <br>This typeface was developed as an exclusive typeface of a Japanese design magazine "AXIS" in 2001. <br>In Japan, it is very rare that the typeface of exclusive use is developed(except newspapers), and this project can be called very epoch-making thing. Because, since no less than at least 9000 characters(Adobe-Japan 1-3) are needed per one weight, Japanese is not easy to develop an exclusive typeface. Very much time and money are needed. <br> <br>7 weights of family are contained in this typeface. In many cases, development of a Japanese typeface is performed by several persons. <br>However, Isao Suzuki who superintends this project designed most of these typefaces alone. <br> <br>Since this design magazine "AXIS" is put on the market not only Japan but overseas, Japanese and English are written together. Therefore, in order to design this typeface so that Japanese and the Latin alphabet may combine beautifully from the time of development, and to fulfill the condition, Akira Kobayashi(now he is Type director : Linotype Library GmbH) designed the alphabet. <br> <br>You can see this typefaces in the following address. <br><a href="http://www.typeproject.com/" target="_blank">http://www.typeproject.com/</a> <br>(Sorry, this site is Japanese only, but you can see the typeface GIF data in the following address .) <br>Sample page <br><a href="http://www.typeproject.com/AXIS/sample.html" target="_blank">http://www.typeproject.com/AXIS/sample.html</a> <br> <br>AXIS Magazine (English page. But no information about "AXIS" font.) <br><a href="http://www.axisinc.co.jp/English_f/E_top.html" target="_blank">http://www.axisinc.co.jp/English_f/E_top.html</a> <br> <br>Thanks. <br></p>'
