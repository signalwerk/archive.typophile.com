    html: <p>&gt;I made a mistake in spelling of your name.  <br>&gt;Please forgive me. <br> <br>Sure, not a problem. ;-) BTW, if you prefer, call me Omine (or Hiroshi, my middle name). Somehow you can consider me Japanese too, since I'm grandchild of Japanese immigrants that came here to Brazil. I have basic knowledge of Japanese language. <br> <br> <br>&gt;&gt;36 strokes???  <br>&gt;I think this is "kakesu" <br> <br>Yes, Paul got it right. See, it's already hard to design a Latin M or W (4 strokes). There's just another level of complexity on Kanji characters. What makes hard to design a CJK typeface IMHO is not the large amount of characters to be drawn, it's the complexity of the characters. <br>BTW, I think there are some kanjis with more than 36 strokes, but I can't  <br>confirm it right now... <br> <br> <br>&gt;When a short piece of Latin text is mixed within a body of Japanese, it  <br>&gt;seems very nice. But I wonder if the Latin font has enough strength to  <br>&gt;stand on its own in composing long paragraphs. <br> <br>I think it has. But I guess the Latin alphabet was actually designed to be subordinated to the Japanese. <br> <br>BTW, one of the things I can't stand these days in Japanese culture is the crescent use of English words, specially when written/printed. Sure, there are inevitable words, but there's a lot of unnecessary use of it too. <br> <br></p>
