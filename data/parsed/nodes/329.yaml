    html: <p>&gt; BTW, one of the things I can't stand these days in Japanese culture is the crescent use of English words, specially when written/printed. Sure, there are inevitable words, but there's a lot of unnecessary use of it too. <br> <br>Living in Japan, I see it all the time and it's easy to get annoyed by it. But, on second thought, it does appear pretty exotic to the Japanese eye and pleases many people. Considering that their audience is primarily Japanese who are looking for a little International flavor without actually experiencing anything foreign (like a sushi diner in America getting "California Rolls"), it is most likely working the way they want it to. Isn't that what's important? <br> <br>What annoys me most, which might not survive the above arguement, is the lack of care with Latin typography (or Japanese, for that matter) over here. And the lack of good Latin companions to Japanese faces.</p>
