    html: <p>Various ways of the setting of numerals were shown. <br>When we set chraracter vertically, in the case of the double-Arabic-figures as shown in "20", sometimes it may set horizontally.  <br>In this example text, "10000" is Chinese numerals. Therefore, it is set vertically. <br>Generally, in order to show age and the date, we don't use two kinds of methods of the setting at a time. <br>And when we set a text vertically, we use Chinese numerals. While horizontally setting, we use Arabic numerals. However, it is not a strict rule but recommendation. <br></p>
