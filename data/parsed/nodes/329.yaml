    html: "<p>Kunihiko, you're way ahead of me! I can't even <i>recognize</i> any of your wonderful Katakana, Hiragana and Kanji characters. I only know things like \"domo arigato\" and \"spider roll\". <br> <br>What I meant in my first post was that: <br>1) It's great that the Japanese and Latin components do not share alignments, like the baseline or the top line: because the way the two languages compose their characters on the page is of course very different, and aligning everything would destroy the true harmony. <br>2) When a short piece of Latin text is mixed within a body of Japanese, it seems very nice. But I wonder if the Latin font has enough strength to stand on its own in composing long paragraphs. <br> <br>hhp <br></p>"
    html_clean: "<p>Kunihiko, you're way ahead of me! I can't even <i>recognize</i> any of your wonderful Katakana, Hiragana and Kanji characters. I only know things like \"domo arigato\" and \"spider roll\". <br> <br>What I meant in my first post was that: <br>1) It's great that the Japanese and Latin components do not share alignments, like the baseline or the top line: because the way the two languages compose their characters on the page is of course very different, and aligning everything would destroy the true harmony. <br>2) When a short piece of Latin text is mixed within a body of Japanese, it seems very nice. But I wonder if the Latin font has enough strength to stand on its own in composing long paragraphs. <br> <br>hhp <br></p>"
