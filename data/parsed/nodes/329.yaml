    html: "<p>&gt;What meaning is it?  <br>&gt;I have not understood a meaning well.  <br>&gt;36 strokes??? <br> <br>I think this is \"kakesu;\" the amount of lines drawn to create a kanji character.  <br> <br>I'm sure there are kanji with 36 strokes, but my dictionary doesn't have them, and I doubt the AXIS font would include them. Although there are (I could be wrong) over 20,000 kanji in existence, I don't think a publication needs more than 8,000 or so to get its point across.  <br> <br>I know little (read: nothing) about the process of designing a Japanese typeface (are the radicals designed in some general way so that they may work aesthetically in several combinations?), but I doubt that designing a Japanese typeface requires designing every single Kanji, just as designing a Latin face doesn't require us to design each word but just to consider the possible combinations. <br> <br>I think I remember that the AXIS font took 4 years to design. I thought I had the article here at school, but to my frustration I can't find it. I will continue my search when I get home. <br> <br>Kunihiko: Don't be ashamed of using translation software. I've studied Japanese for 6 years, and have lived in Japan for 3 and a half, but I still use Babelfish (<a href=\"http://babelfish.altavista.com/\" target=\"_blank\">http://babelfish.altavista.com/</a>) to help make sense of Japanese. It works both ways, often to amusing effect!</p>"
    html_clean: "<p>&gt;What meaning is it?  <br>&gt;I have not understood a meaning well.  <br>&gt;36 strokes??? <br> <br>I think this is \"kakesu;\" the amount of lines drawn to create a kanji character.  <br> <br>I'm sure there are kanji with 36 strokes, but my dictionary doesn't have them, and I doubt the AXIS font would include them. Although there are (I could be wrong) over 20,000 kanji in existence, I don't think a publication needs more than 8,000 or so to get its point across.  <br> <br>I know little (read: nothing) about the process of designing a Japanese typeface (are the radicals designed in some general way so that they may work aesthetically in several combinations?), but I doubt that designing a Japanese typeface requires designing every single Kanji, just as designing a Latin face doesn't require us to design each word but just to consider the possible combinations. <br> <br>I think I remember that the AXIS font took 4 years to design. I thought I had the article here at school, but to my frustration I can't find it. I will continue my search when I get home. <br> <br>Kunihiko: Don't be ashamed of using translation software. I've studied Japanese for 6 years, and have lived in Japan for 3 and a half, but I still use Babelfish (<a href=\"http://babelfish.altavista.com/\" target=\"_blank\" class=\"link-external\">http://babelfish.altavista.com/</a>) to help make sense of Japanese. It works both ways, often to amusing effect!</p>"
