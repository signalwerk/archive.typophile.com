    html: "<p>Sorry, I forgot about Kunihiko's original post. He's correct. Anyway, I went there again and found some few things about the Latin companion (BTW, what a confusing website they have): <br> <br>Akira Kobayashi joined the project in April 1999 (the Axis project started in 1998), and the typeface was completed in July 2000. The 3 principles for its design were: <br>1. To make it a little less elegant than Frutiger, and a little less \"cool\" than Meta. <br>2. Big x-height. <br>3. Slightly condensed (a little less than Meta). <br> <br> <br>I guess the thing is, a Japanese typeface needs to be quite neutral to handle its inherent complexity. It's probably impossible to design a Japanese Rotis, for example. ;-) <br>So, it's natural that a Latin companion to a Japanese typeface looks neutral too. Maybe too much neutral (bland) for some people, but Axis' Latin alphabet is nice to me... <br></p>"
    html_clean: "<p>Sorry, I forgot about Kunihiko's original post. He's correct. Anyway, I went there again and found some few things about the Latin companion (BTW, what a confusing website they have): <br> <br>Akira Kobayashi joined the project in April 1999 (the Axis project started in 1998), and the typeface was completed in July 2000. The 3 principles for its design were: <br>1. To make it a little less elegant than Frutiger, and a little less \"cool\" than Meta. <br>2. Big x-height. <br>3. Slightly condensed (a little less than Meta). <br> <br> <br>I guess the thing is, a Japanese typeface needs to be quite neutral to handle its inherent complexity. It's probably impossible to design a Japanese Rotis, for example. ;-) <br>So, it's natural that a Latin companion to a Japanese typeface looks neutral too. Maybe too much neutral (bland) for some people, but Axis' Latin alphabet is nice to me... <br></p>"
