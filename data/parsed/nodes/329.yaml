    html: |-
      <p>This is <b>great</b>! This is one of the most harmoneous CJK/Latin combination I have seen! Kobayashi's Latin is a beautiful type in its own right, but it was designed to make mixed Latin/Japanese setting as painless as possible. I have great respect for Japanese type designers for paying attention to every detail, and even take great care to designing a supposedly 'subordinate' set of foreign characters. Well done. The Japanese characters are beautiful too, but I really can't see how that could be different from other Gothic typefaces... I need to see it as a block of text to really get a feeling of it. Kunihiko, do you have a sample page from the magazine, in PDF format? Also, as a Chinese, I need to see more Kanji characters! <br> <br><i>BTW, one of the things I can't stand these days in Japanese culture is the crescent use of English words, specially when written/printed. Sure, there are inevitable words, but there's a lot of unnecessary use of it too.</i> <br> <br>The same is true for Chinese, especially the Hong Kong Chinese. Chinese text dotted with large numbers of English words is a nightmare for typesetters, since the spacing and texture of the page is disturbed by the proportional spacing, sometimes completely destroyed if it gets too obsessive. That's why well-designed matching Latin character sets for CJK fonts are really important. I try to avoid using English words when I write or speak Chinese as much as possible, but it's very difficult since I live in North America. I have a better excuse than the people in Hong Kong or China though! <br> <br><i>I doubt that designing a Japanese typeface requires designing every single Kanji, just as designing a Latin face doesn't require us to design each word but just to consider the possible combinations.</i> <br> <br>Well, for Kanjis there are 8 basic strokes, or building blocks, but there are many different permutations that these stokes can appear in. Then there are radicals. Radicals can appear as single characters or combined with others to make up characters. That means they have to appear in different porportions/sizes according to the amount of space available for that radical in a particular character. Sometimes when the space is limited, the stroke widths have to be reduced so that the character doesn't look too dense. So, you can decide how you want the basic 'building blocks' to look overall, but really you have to 'design' each and every character. Not an easy task, and certainly not a task for a sigle type designer. Afterall, 9,000 characters does mean 9,000 separate glyphs that have to be designed! <br> <br>My Chinese dictionary doesn't have any characters over 36 strokes. <br> <br><i>I guess the thing is, a Japanese typeface needs to be quite neutral to handle its inherent complexity.</i> <br> <br>Not true! There are some extremely complex and intricate designs around, like an ultra-bold rounded with overlapping strokes! <br> <br>The following PDF shows some not so harmoneous Latin/Chinese matches from Monotype. <br> <br></p>
      <!--attachment: monotype_chinese3-11935.pdf*mime_pdf.gif*application/pdf*1932.5*Whacky+Latin%2fChinese+combos*monotype_chinese3%2epdf --><!--attachment: monotype_chinese3-11935.pdf*mime_pdf.gif*application/pdf*1932.5*Whacky+Latin%2fChinese+combos*monotype_chinese3%2epdf --><p></p><center><br>
