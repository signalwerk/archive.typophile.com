    <p>Hi all,</p>
    <p>My wife just asked an interesting question. We were watching Archer on Netflix, and she asked for the name of the style of the font in the opening credits. I said, "well, it's a display font." To that she said, "No, I mean, like, '60s spy font.'" So there's the question: What exactly IS the name of that style (if there is one)?</p>
