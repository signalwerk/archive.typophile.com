    html: '<p>A few other characteristics are the fact that it’s unicase, top-heavy, somewhat reverse-contrast, but mostly it has misaligned or “cut-out” counters, a feature typical of the “bouncy” typefaces of the sixties (of which the best know example is probably Ad Lib: <a href="http://www.myfonts.com/fonts/bitstream/ad-lib/" title="http://www.myfonts.com/fonts/bitstream/ad-lib/">http://www.myfonts.com/fonts/bitstream/ad-lib/</a>).</p>'
