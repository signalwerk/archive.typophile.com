      <div class="comment-spam-body"><p>The genre of unstructured bouncy lettering that looks like it was cut from cardboard with an exacto knife, often with a straight or curved ruler, avoiding exact horizontal and vertical; perhaps originated with lettering by Saul Bass in the late 1950s, particularly for the Hitchcock movies.  Also Ed Benguiat.<br>
      The idea was to express jarring disorientation with a cool jazz rhythm.<br>
      No agreed name for the style and its variations. Various attempts such as "Beatnik" did not gain wide acceptance.</p>
      <p>Don</p>
      </div>
