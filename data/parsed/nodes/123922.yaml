    html: |-
      <p>Casual, headline, display, decorative, and freestyle are descriptors that would apply here.</p>
      <p>Broadly, display typeface is the classification. Freestyle or casual would be the subset. You could even argue that this particular font is in the comic book style.</p>
      <p>The typeface is called Baveuse, and the Archer logo actually straightens/aligns all the letters on a single baseline—the original angles each letter for a “bouncy” effect:<br>
      <a href="http://www.myfonts.com/fonts/typodermic/baveuse/" title="http://www.myfonts.com/fonts/typodermic/baveuse/">http://www.myfonts.com/fonts/typodermic/baveuse/</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Archer-Logo_6656.jpg"></div><p></p>
      <p>Baveuse roughly translates from the French as “slobbery” (as in the dog from the Tom Hanks movie, Turner &amp; Hooch).</p>
