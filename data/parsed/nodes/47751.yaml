    <p>Hello,</p>
    <p>I am looking for a free font I used last year, “Inkpen2script”.  I lost my fonts in a hard disk crash and I can’t find it anywhere.  </p>
    <p>If it’s not been pulled for some type of copyright or propriety issue, I would love to have it back.  My email is <a href="mailto:typophile@lob.ws">typophile@lob.ws</a>.  </p>
    <p>It’s the font used for “The Women of Rodgers &amp; Hammerstein” in this graphic:</p>
    <p><a href="http://lob.ws/nlad-public/NLAD.html" title="http://lob.ws/nlad-public/NLAD.html">http://lob.ws/nlad-public/NLAD.html</a></p>
    <p>thanks</p>
    <p>-Stuart</p>
