      <p>The London Evening Standard newspaper uses different weights of <a href="http://commercialtype.com/typefaces/publico" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Publico</a>.<br>
      “HAMMER HORROR” looks like <a href="http://commercialtype.com/typefaces/publico/headline/black" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Publico Headline Black</a> manually condensed.</p>
