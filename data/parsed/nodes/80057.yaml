      <p>The London Evening Standard newspaper uses different weights of <a class="freelinking external" href="http://commercialtype.com/typefaces/publico" rel="nofollow">Publico</a>.<br>
      “HAMMER HORROR” looks like <a class="freelinking external" href="http://commercialtype.com/typefaces/publico/headline/black" rel="nofollow">Publico Headline Black</a> manually condensed.</p>
