    html: <p>The .eps format works well with QuarkXPress (and InDesign and PageMaker), which I expect they're using for production. GIFs and JPEGs do not provide the scaling flexibility that a vector format does. I would think a PDF file would be a smarter, and legal, workflow. <br> <br>My point had more to do with a rather large organization asking designers to violate their type licenses, and most probably will without thinking about it. We do love to see our names in lights <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
