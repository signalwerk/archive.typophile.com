  html: '<p>I just received my invitation to enter the "American Corporate Identity 20" contest. In reading the fine print for entries: "You may enter a 35mm slide, or a Macintosh .eps file along with the hard copy of the logo. Be sure to include any logo fonts on the disk, so the logo can print properly." <br> <br>Do the rest of you read that as I do? I read it as: "Send us all the fonts associated with your logo." Although, it could be they are specifically talking about a font that contains the logo. In any case, turning the fonts to outline in an eps file would eliminate the problem.</p>'
