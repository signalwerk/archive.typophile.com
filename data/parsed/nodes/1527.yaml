    html: <p>&gt;&gt;Why not a high quality GIF or JPEG <br> <br>OK, I don't want to spar either, and I agree that raster works better than vector in some cases, but I don't think there is such a thing as a high quality gif or jpeg. <br>(Well maybe that's an over-simplification, but you would need quite specific circumstances for either of these to provide as good quality as tif of png, and they could not provide better quality). <br>The problems are that gif is an 8 bit format which means that you can only have 256 colours in your image. That can be OK for some logos, but in general, the kind of logo that would be OK as a gif would be better as a vector. <br>The problem with jpgs is the compression thing - you have no control over the mess that the compression algorithm makes of your work. <br> <br>Where quality is the criteria, use tifs, unless you need alpha channel transparency, when you should use pngs. <br> <br>===== <br>I've just re-read all that, and it sounds dictatorial - that's not how it was intended. I'm not claiming to be the world's leading authority on this, just offering my opinion.</p>
