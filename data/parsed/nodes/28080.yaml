    <p>Hi guys, I’ve been playing around with Google with lots of unsuccessful keywords when I finally tried ’typography forum’ and got right here. Typophile was not the first entry, but was the first I clicked though :)</p>
    <p>It amazed me to see this thread in the forum and I realised that I am not the only one who does “what font could this be..” but instead, there are lots of like of me!</p>
    <p>Ok, now to the point. Can you please help me to identify the font which is used on the attached image, or probably find the closest font which would also make my happy. This is from the Thomas Murray website, <a href="http://www.thomasmurray.com" title="www.thomasmurray.com">www.thomasmurray.com</a>.</p>
    <p></p><div class="imageWrap"><img src="/files/tmmenuc_4081.gif"></div><p></p>
    <p>Firefox got crushed a number of times when attaching the image, but the Flash upload tool worked like a charm.</p>
