    html: |-
      <p>If you mean for it to be used as a graphic then it's perfectly fine to sell it as an illustration. One example of which is the high rez scanned woodtype from <a href="http://www.withoutwalls.com/index.htm" title="http://www.withoutwalls.com/index.htm">http://www.withoutwalls.com/index.htm</a></p>
      <p>Letterror used to sell it's <a href="http://www.letterror.com/catalog/fed/index.html" rel="nofollow">Federal typefaces</a> as an illustrator file that you could typeset online. And soon House Industries will offer the same old-school technique made new with an online version of the <a href="http://www.photo-lettering.com/" rel="nofollow">Photo-Lettering</a> catalog.</p>
