  html: <p>If a typeface is very graphic/display or contains gradients or whatnot which only ai.- format allows, leaving kerning to the customer.... Some graphic vector elements are sold that way. Would it be a good idea for a typeface?</p>
  html_clean: <p>If a typeface is very graphic/display or contains gradients or whatnot which only ai.- format allows, leaving kerning to the customer.... Some graphic vector elements are sold that way. Would it be a good idea for a typeface?</p>
