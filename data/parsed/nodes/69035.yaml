      <p>The original squared sans?<br>
      Hardly.<br>
      Morris Benton not exactly known for originality.<br>
      Most of his "original" typefaces (Hobo, Broadway, &amp;c.) were derived from lettering styles.<br>
      There were square sans faces in the 19th century, known as chamfered.</p>
