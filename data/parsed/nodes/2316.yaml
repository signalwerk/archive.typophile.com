    html: "<p> Okay, after a little thinking, I want to retro-strategize® something I said. All the analysis...that means people care and that's a good thing! <br> <br> <br>But...&gt;&gt;&gt; Tanya: \"If I just wanted a cool t-shirt then I'd suggest typophile cancel the contest altogether, hire &amp; sell some retail labels that are already determined 'cool' instead ...\" <br> <br>Besides self promotion, the Typophile Tee Shirt Contest will also provide *us* the opportunity to support Typophile when we buy the winning t-shirt design. Bandwith is not free. + All the time Joe and Jared spend on the site. Having a contest like this, as some kind of annual contest that provides Bandwith Revenue, will ensure that Typophile is around for a long time. <br> <br>Everybody wants that. <br> <br>I don't know if the judges have a mandate, but I hope that they pick a 'cool' design that typophiles will buy as opposed to an obscure design that people hate. <br> <br>Who wouldn't want that? <br> <br>Maybe we have different ideas of what the term 'cool' means. I don't mean 'trendy' or 'lowest-common denominator', I mean something people, us, would BUY. Maybe the word 'appealing' is better. (retro-strategizing® the use of the trite word 'cool') <br> <br>&gt;&gt;Tanya: This contest offers a unique opportunity to create something for a specific market. <br> <br>Exactly. Design with a purpose. Consider your audience. Because it's a contest, consider your judges. And consider the utility that your design will provide. So, somebody, anybody, knock off the current favorite designs with something amazing, something typopgraphic, something that won't need retro-strategized® in the morning. <br> <br>bj </p>"
