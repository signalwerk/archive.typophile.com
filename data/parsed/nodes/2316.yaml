  - id: 18606
    user: 990
    date: 2002-08-25T18:57:00
    date_raw: 25 Aug 2002 — 6:57pm
    votes: null
    html: <p> Hey guys and gals. <br>I was one of those dot com casualties. I thought I was going with a good thing and now I'm doing side work to stay afloat. I am working on several designs for this competition. I hope to win like everyone else. The money could come in handy too. <br>I disagree with Tim Lee who said whoever wins is not that important. Why should some one enter this competition. I saw all the designs. Some people don't care it seems if they win or lose. I would have put the names on thse inital posts. That way you would have more quality over quantity. People wouldnt put their name on some of the designs. I dont exactly know how to capture the essence of typophile. Its a forum to discuss type and design. There are a lot of those on the internet. I'm unsure about what the judges are looking for. Some of them are type designers so the type should be topnotch. NOt Arial or Times. I agree with Joe Pemberton that putting a dot com on a shirt (like www.dotcom.com) is so "three years ago" Every one three years ago was proudly wearing their dot bomb shirts on casual Fridays and weekends. It was a big joke if you ask me. People walking into the grocery store wearing their dot bomb shirts. It was like showing off. Now you wouldnt be caught dead wearing a dot bomb shirt. As for people visiting the site. I don't think non-designers give a whip. But every designer should at least stop by. That would be my target demographic. Especially a lot of these web designers who track Arial or Helvetica tight and think that is design. Then if you are at a party with other web designers then I would wear it. If it was a party with the regular population I wouldn't wear it. I think if the winning design is reeeeeely good then people would approach and say nice shirt buddy but I dont think theyd pull out a pen and write down www.typophile.com and then get home and check it out first thing. Thats a stretch. I think peoplemake fun of any shirt now that says www.something.com. Do I haaaaave to do that  I look foward to seeing my designs posted. It seems like theres a huge backlog. <br> <br>ciao, <br> <br>dave </p>
