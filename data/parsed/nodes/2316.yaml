    html: "<p> - Hrant, maybe this is rhetoric, but why must you continue to rabble rouse? If you don't like the fact that nobody has commented positively on your designs, then do something better. It seems that you are trying to harm the process, a process that doesn't care much for the designs you have submitted. Are the two related?  <br> <br>Do you care about Typophile, specifically, or is this 'just another forum' to you? <br> <br>You should care. You are the most prolific Typophile here. Millions of pixels owe their life to you. <br> <br>it's simple, this site needs funds to survive. they get thousands of hits. that eats bandwith. that costs money. they are NOT putting money in their pockets. their putting money in their IP's pockets. Of course they want new people to come. Do you really believe otherwise? <br> <br>If you want to try to hyperanalyze every pixel and find sinister motives, then that's your choice. That's what these forums are for. But don't forget what you always talk about: consequences of behavior. <br> <br>I know I could never expect to get a last word in, so I'm going to go have fun today. fyi, it's nice today in our neck of the city. maybe i'll see you at the park. <br> <br>bj </p>"
