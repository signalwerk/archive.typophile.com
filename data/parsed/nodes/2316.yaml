    html: <p>I think you guys are analyzing this too much. For what reason, I'm not sure. <br> <br>Typop is just a clever shortening of typophile, and the 'Pop' part finds echoes in Pop Culture, Sub Pop records (nirvana's original label), Yum Pop clothing (hypercute japanese flava), and of course, Pop Tarts breakfast treats. Pop is just a cool word. It pops. <br> <br>These are Tshirts, c'mon now. <br> <br>People aren't going to see a shirt with a website address printed on it and sprint to their browsers. We have a highly specialized auidence What this is more about is finding a Tshirt that *we* will REALLY ACTUALLY BUY, something we wouldn't be ashamed to wear because it is, for lack of a better word, cool. BUYING the judge's choice helps ensure that typophile is still here in five years. <br> <br>My favorite so far is 18.008/ and I like Typop, but if I was submitting it to this contest, I'd flip the 'o' and lose the little boy icon in favor of something more typographic -- remember *who* is judging. I think they are all over 30. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Also, Jared/Joe, the contestants need to know how revisions and variations are viewed by the judges. Could Typop variations and revisions have the effect of splitting his own votes? (I'm assuming 'he' because I saw the little boy icon on his website a while back.) <br> <br>Are the revisions 'swapped out' for the originals when it's time to judge? <br> <br>Are the judges under the impression that Tshirt colors are flexible, thus picking the *design* they like best, regardless of Tshirt color and design colorway? <br> <br>bj</p>
