    html: <p> Who knows what typop really means. Maybe it stands for the popularization of typography. Suppose we make up our own meaning for it. Although it lacks a clever or deep concept, people would still wear it. It's well crafted and it would promote Typophile.com better than most. Whoever designed it kept in mind the immediacy that a shirt of this kind needs and the importance of making it print friendly. The design isn't too big, nor doesn't it have a lot of important detail and it smartly uses the two or three colors afforded. There are a few other excellent designs that have also been made with these things in mind.  <br> <br>Maybe we should have a contest to guess how old Hrant is. </p>
