    html: <p> &gt; Who knows what typop really means. Maybe it <br>&gt; stands for the popularization of typography. <br>&gt; Suppose we make up our own meaning for it. <br>&gt; Although it lacks a clever or deep concept, <br>&gt; people would still wear it. It's well crafted <br>&gt; and it would promote Typophile.com better <br>&gt; than most.  <br> <br>I don't care as much for the "Typop" submissions. The "Typop" logotype looks cool, to be sure, but I don't understand what it means either. If the idea of the shirts is to promote Typophile.com (even if only among our own group), it seems to me that this approach doesn't accomplish the goal. It seems an unnatural abbreviation, void of any reason other than arbitrariness. <br> <br>If even we don't know what it means, how can we expect an everyday viewer to understand it? And if they don't understand it, I don't see how it would effectively communicate or promote Typophile.com. <br> <br>Just my opinion. I love the letterforms, but I don't think the design works. I think that several other submissions suffer the same problem, by the way -- certainly not just this one. <br> <br>What do the rest of you think? <br> <br>David </p>
