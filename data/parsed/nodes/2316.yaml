    html: <p> BJ is on the right track with his comments. <br> <br>The final shirt will be a means to support  <br>Typophile financially. And for that to happen,  <br>the shirt has to appeal to the Typophile  <br>community. And we hope people will buy it because  <br>it's cool, not merely to support our bandwidth  <br>bills. <br> <br>The shirt is absolutely not a means to generate  <br>site traffic or promote Typophile. This wouldn't  <br>be that effective a means anyway. (And it's why  <br>we haven't required the ".com" on them. It  <br>cheapens it.) </p>
