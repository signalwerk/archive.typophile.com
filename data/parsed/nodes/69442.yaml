    html: |-
      <p>OpenType cannot do many-to-many substitutions. It can to one-to-one, one-to-one-out-of-many, many-to-one and one-to-many (though the last one is not supported by some applications). </p>
      <p>To achieve what you're trying to do, you need a series of lookups, each performing a many-to-one substitution. Each lookup is executed on the glyph string produced by the previous lookup. So: </p>
      <p><code>feature calt {<br>
      lookup calt1 {<br>
      sub c' h' a' l k by c_h_a.alt;<br>
      } calt1;<br>
      lookup calt2 {<br>
      sub c_h_a.alt l' k' by l_k.alt;<br>
      } calt2;<br>
      } calt;</code></p>
      <p>Note above that I've used PDF-compatible glyphnames for ligatures. c_h_a.alt and l_k.alt will be "understood" by PDF applications while cha.alt and lk.alt will not, i.e. copy-paste or searching may not work properly. </p>
      <p>Adam</p>
