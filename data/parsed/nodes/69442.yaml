      <p>It's not really an OT order thing so much as a group-replace function.</p>
      <p>If I were to type "international" and I wanted it to force "int'l" to replace it, with each letter being an independent glyph, how could (or can I at all) do that?</p>
      <p>I want a group of letters in a particular order to be replaced by a different group of letters in a different particular order, not necessarily of the same count for each group.</p>
      <p>Can it be done?</p>
