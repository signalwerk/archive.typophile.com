    <p>I can't quite find this circumstance in the forums, manuals, or elsewhere...</p>
    <p>I want to substitute multiple glyphs with multiple alternate glyphs.</p>
    <p>For example, if I type chalk, I want it to be replaced by cha.alt and lk.alt. </p>
    <p>Can't do:<br>
    sub c' h' a' by cha.alt;</p>
    <p>because if I type champ, I don't want the .alt.</p>
    <p>I can do:<br>
    sub c' h' a' l k  by cha.alt;<br>
    sub cha.alt l' k' by lk.alt;</p>
    <p>Is that as simple as I can get, or can I make it one line of code?</p>
    <p>I'd ideally like this:<br>
    sub c h a l k by cha.alt and lk.alt;</p>
    <p>Thoughts?</p>
    <p>Thanks,</p>
    <p>Mcs</p>
