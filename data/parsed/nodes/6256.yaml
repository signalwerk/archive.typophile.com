    html: <p>What does "Le Folha" mean? <br> <br>Yeah, de Groot is very good at re-using (and interpolating), which is fine by me as long as the source is good, and his always is. And what's very refreshing is that he <i>promotes</i> that aspect of his work method, while many others hide it. BTW, the Le Monde face is called Floris (after his son). <br> <br>hhp <br></p>
