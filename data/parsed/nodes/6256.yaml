    html: "<p>Oh, I get it, you call Floris \"Le Folha\"... Funny. <br>I think Le Monde would mind any closeness more than the Brazilian predecessor, but apparently they don't. <br> <br>Unger: <br>In fact I recently saw a comparison of three of his news faces, and at the same point size and column width the linebreaks throughout a piece of a number of paragraphs were nearly totally identical! That tells me he has an \"ideal\" of individual letter-widths in his head, and for a while now. <br> <br>I think when your oeuvre has a lot of uniformity it means you're a thinking man, as opposed to being overly market-driven. <br> <br>hhp <br></p>"
