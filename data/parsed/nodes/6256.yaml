    html: <p>Well, my sense of humor needs work, but my skin is titanium. From stopping bullets with it.  ;-) <br> <br>Speaking of de Groot, I really liked how he took Folha (commissioned for the titling of a Brazilian newspaper), made it more "incised" (like the French like it), and used it to satisfy the commission from Le Monde for <i>their</i> titles. <br> <br>BTW, Parisine Plus is one of my fav JFP fonts. <br> <br>hhp <br></p>
