    date_raw: 29 August 2002 - 10:02am
    votes: null
    html: '<p> Hi, folks — <br><br>Re: Type Identiﬁcation Board; Recent questions about Treacyfaces’ <span class="caps">TF</span> Arrow and potential inspirations for the Gucci brand logo. <br><br>I agree that the <span class="caps">TF</span> Arrow A series appearance is a rather close match. But I have no idea whether the Gucci logo was drawn from scratch — although I’ll conjecture that it was — or derived from type. <br><br>The rounds in <span class="caps">TF</span> Arrow’s weights are very generously circular, retouched appropriately. <br><br>P.S.: True-cut italics for our <span class="caps">TF</span> Arrow now exist, and are of my design.  <br><br>If anyone has further questions about our <span class="caps">TF</span> Arrow, any of our other Treacyfaces/Headliners fonts or custom typefaces or logos, you’re welcome to e-mail me at the e-mail link on treacyfaces.com <br><br>Be sure to sign up for information about our upcoming catalogue, and advance announcements of our new typefaces. <br><br>Thanks for specifying Treacyfaces types! <br><br>(Joe) <br><br>Joseph Treacy <br>President <span class="amp">&amp;</span> Director of Typography <br>Treacyfaces, Inc. <br><a href="http://www.treacyfaces.com">www.treacyfaces.com</a> <br>800 800-6805&nbsp;Orders </p>'
