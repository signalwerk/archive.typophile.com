    html: "<p> Hi, folks - <br> <br>Re: Type Identification Board; Recent questions about Treacyfaces' TF Arrow and potential inspirations for the Gucci brand logo. <br> <br>I agree that the TF Arrow A series appearance is a rather close match. But I have no idea whether the Gucci logo was drawn from scratch - although I'll conjecture that it was - or derived from type. <br> <br>The rounds in TF Arrow's weights are very generously circular, retouched appropriately. <br> <br>P.S.: True-cut italics for our TF Arrow now exist, and are of my design.  <br> <br>If anyone has further questions about our TF Arrow, any of our other Treacyfaces/Headliners fonts or custom typefaces or logos, you're welcome to e-mail me at the e-mail link on treacyfaces.com <br> <br>Be sure to sign up for information about our upcoming catalogue, and advance announcements of our new typefaces. <br> <br>Thanks for specifying Treacyfaces types! <br> <br>(Joe) <br> <br>Joseph Treacy <br>President &amp; Director of Typography <br>Treacyfaces, Inc. <br>www.treacyfaces.com <br>800 800-6805 Orders </p>"
