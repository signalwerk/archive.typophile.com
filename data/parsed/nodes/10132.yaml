    html: <p>I am not sure what you are after, but Futura has  smaller x-height than most sans-serifs. Also the original (not ITC) Kabel. <br> <br>Vesta at GerardUnger.com is impressively readable for a sans. Myriad condensed is nice, as is Meta. Benton Sans from Fontbureau (related to Trade Gothic, Franklin, etc) has a number of condensed versions. No sans is as readable for text as any good text serif, in my opinion.</p>
