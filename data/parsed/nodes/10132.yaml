    html: "<p>This has turned out to be pretty difficult; it's odd to choose a font based on visual size at a certain point measure, and type samples aren't set up for that sort of comparison. <br> <br>So I dug out my copy of Adobe Font folio, to see if I have Kinnesis (I don't.) But while I was looking, I did find a PDF with a listing of all Adobe's fonts (at the time), plus their average-characters-per-pica measure. I had to do a bit of work to get it into Excel, but now I can sort by name and by measure. <br> <br>Centaur came up as an option, but it has many of the same issues as perpetua. I love Electra, but it looks wrong at 12 pt: it's just too big. I'm totally into Octavian ... but it doesn't have a bold or bold italic, which I really need. (I want to see if I can figure out some alternate font for emphasis, maybe a san-serif...) <br> <br>Anyway, in the Sans world, Bell Centennial Address came in as the smallest font I've tested, &amp; surprisingly readable. Ocean Sans &amp; Formata have condensed versions that fit a lot of characters into a given space, but I'm not sure they are going to work in this case. <br> <br>If anyone has any other suggestions, I'd love to hear them. thanks!</p>"
    html_clean: "<p>This has turned out to be pretty difficult; it's odd to choose a font based on visual size at a certain point measure, and type samples aren't set up for that sort of comparison. <br> <br>So I dug out my copy of Adobe Font folio, to see if I have Kinnesis (I don't.) But while I was looking, I did find a PDF with a listing of all Adobe's fonts (at the time), plus their average-characters-per-pica measure. I had to do a bit of work to get it into Excel, but now I can sort by name and by measure. <br> <br>Centaur came up as an option, but it has many of the same issues as perpetua. I love Electra, but it looks wrong at 12 pt: it's just too big. I'm totally into Octavian ... but it doesn't have a bold or bold italic, which I really need. (I want to see if I can figure out some alternate font for emphasis, maybe a san-serif...) <br> <br>Anyway, in the Sans world, Bell Centennial Address came in as the smallest font I've tested, &amp; surprisingly readable. Ocean Sans &amp; Formata have condensed versions that fit a lot of characters into a given space, but I'm not sure they are going to work in this case. <br> <br>If anyone has any other suggestions, I'd love to hear them. thanks!</p>"
