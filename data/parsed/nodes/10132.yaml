  html: "<p>OK, this is an odd one: I'm currently designing proposals for an engineering firm. We respond to RFPs (Request for Proposals), that often specify \"No font smaller than 12 pt.\" Since we have a lot to say, I've been forced to choose typefaces on the basis of character size. <br> <br>(I hear your sighs ... but it's a paying gig, and those are kinda hard to find in this place and time.) <br> <br>Anyway, Perpetua is my current favorite for serif font; it's so tiny that we have to ad \"This proposal formatted in 12 pt Perpetua\" on the cover letter. The problem is that any sans I use looks huge next to it.  <br> <br>I have a vague memory of tables that listed \"characters per pica\" for different typefaces at different sizes; are those still around, or did they die w/ the advent of WYSIWYG? <br> <br>Anyway, if anyone has any suggestions -- both in serif and sans -- I'd be grateful. Thx!</p>"
  html_clean: "<p>OK, this is an odd one: I'm currently designing proposals for an engineering firm. We respond to RFPs (Request for Proposals), that often specify \"No font smaller than 12 pt.\" Since we have a lot to say, I've been forced to choose typefaces on the basis of character size. <br> <br>(I hear your sighs ... but it's a paying gig, and those are kinda hard to find in this place and time.) <br> <br>Anyway, Perpetua is my current favorite for serif font; it's so tiny that we have to ad \"This proposal formatted in 12 pt Perpetua\" on the cover letter. The problem is that any sans I use looks huge next to it.  <br> <br>I have a vague memory of tables that listed \"characters per pica\" for different typefaces at different sizes; are those still around, or did they die w/ the advent of WYSIWYG? <br> <br>Anyway, if anyone has any suggestions -- both in serif and sans -- I'd be grateful. Thx!</p>"
