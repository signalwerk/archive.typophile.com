    html: "<p>You're trying to strike a balance between apparent size, economy and style. What you should note is: <br>1) A font with a smaller x-height does take up less room at a given point size, but at the expense of apparent size. <br>2) The requirement for 12 point (probably) comes from a desire for a minimum apparent size; if you \"cheat\" by using a font with a small x-height, it's going to come down to them saying \"but it's too small\" and you saying \"but it's 12 point!\" You need to try to predict which way that argument would end up going. <br>2) The larger the x-height, the more economical the face, and the more legible, but also the less readable. (Although there's certainly a lower limit to the x-height ito readability). <br> <br>It seems that one thing you can do is choose a sans with a small x-height (like Seria), but that's assuming they won't balk at the apparent size (even though it's 12 point). Another possibility is to use a sans with a \"normal\" x-height but set the Perpetua larger (but then things might not fit). <br> <br>If neither of those work, you could always just say less. <br> <br>hhp</p>"
    html_clean: "<p>You're trying to strike a balance between apparent size, economy and style. What you should note is: <br>1) A font with a smaller x-height does take up less room at a given point size, but at the expense of apparent size. <br>2) The requirement for 12 point (probably) comes from a desire for a minimum apparent size; if you \"cheat\" by using a font with a small x-height, it's going to come down to them saying \"but it's too small\" and you saying \"but it's 12 point!\" You need to try to predict which way that argument would end up going. <br>2) The larger the x-height, the more economical the face, and the more legible, but also the less readable. (Although there's certainly a lower limit to the x-height ito readability). <br> <br>It seems that one thing you can do is choose a sans with a small x-height (like Seria), but that's assuming they won't balk at the apparent size (even though it's 12 point). Another possibility is to use a sans with a \"normal\" x-height but set the Perpetua larger (but then things might not fit). <br> <br>If neither of those work, you could always just say less. <br> <br>hhp</p>"
