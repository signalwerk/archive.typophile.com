    html: <p>Well, I've been using some condensed, but they look huge (height-wise) next to perpetua. But it's not x-height; it's just that perpetua is small ... or at least this incarnation (Monotype?) is. <br> <br>These are rather long and boring texts, written by engineers for engineers. I'd like to make them as readable as possible, while breaking out of the mold. A lot of the competition use arial narrow as a text font -- sometimes further condensed(Eeeew!) in order to fit into the page limits. I want to come up w/ something that is more readable, doesn't use any more space, and is much more stylin'. <br> <br>Thx!</p>
