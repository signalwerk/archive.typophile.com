    html: "<p>&gt;If neither of those work, you could always just say less.  <br> <br>&lt;grin&gt; I've tried suggesting that; it's not a battle I'm going to win.  <br> <br>RE: \"But it's too small!\" It might not be following the intent of the law, but it's certainly following the letter. :0) I might call it cheating, but the engineers call it a creative solution ... and they are the ones who have to stand up &amp; defend the proposals. <br> <br><i>(It's funny: I don't know why, but I have an unusually difficult time expressing myself in this forum. I'm going to re-try on the description of my situation.)</i> <br> <br>I work at an engineering firm, and I'm trying to create a corp. identity, which includes proposals. Some of the \"Requests for Proposals\" include a type-size requirement, as in \"type shall be 12 points or larger.\" They also include page limits. <br> <br>In order to fit the verbage into the pages, I've been using Perpetua, which is a very small typeface. Not small in x-height, but just small for its size. (In order to make Gill Sans visually the same size as 12 pt Perpetua, you have to reduce Gill to 10 pt.) <br> <br>The problem with Perpetua is that it's a bit spindly for this application. (I create these proposals on a 4-color Xerox.) Another problem is that if I use a contrasting san serif for headlines, it looks huge next to the perpetua, even at 12 pt. <br> <br>But now that I've used it once, the engineers won't let me use a \"larger\" face. So I'm looking for a similarly \"small\" face that is more robust (thicker hairlines), plus a companion san serif, to be used in the proposals and other printed material. <br> <br>(I hope that made more sense...) <br> <br>I'll check out the suggestions already mentioned. Thanks!</p>"
