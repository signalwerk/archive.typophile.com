      <p>&gt; I blame bad design. </p>
      <p>Please don't. A lawyer might hear you and decide to start throwing designers into the class action suits they are so eager to initiate. The last thing we need is for designers to have to have their work vetted by lawyers to make sure that a law suit is not possible.</p>
      <p>Lawyer: Sorry, you are going to have to set that section in bold, and this section in all caps, and that bit over there should be underlined ... twice.</p>
      <p>Designer: Well, that will look like hell.</p>
      <p>Lawyer: Sorry, it's that way or you are open to a law suit.</p>
