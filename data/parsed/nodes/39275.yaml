    <p><cite>Over at Cedar Sinai 13 patients, including celebrity twins, have been given massive doses of an anti-coagulant because a nurse grabbed a bottle without looking at it.</cite></p>
    <p>What does it really take to make the general populace aware of how dangerous bad design can really be? The recent coverage of the new Target prescription bottle and Highway Gothic got the ball rolling, but how do designers get business to really appreciate that letting someone design better labels and containers can prevent disasters? Should we be lobbying MBA programs to teach a course in the value of design? Or would it be better taught to lawyers, who might advise their clients that this can prevent a lawsuit? Does anyone have connections at 60 Minutes?</p>
