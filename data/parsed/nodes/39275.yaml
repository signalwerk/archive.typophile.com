      <p>Oh, and getting back to the original question James posted,</p>
      <p><em>...but how do designers get business to really appreciate that letting someone design better labels and containers can prevent disasters?</em></p>
      <p>The best example I know of this comes from Jorge Frascara. He gave a talk at my university once, and told us that where he lived in Canada, collecting statistics of highway accidents made the government stop and consider a program to improve signage, its legibility, etc. Probably not an example you can apply broadly, since it happened in Canada and the government was the client... but it is still a real-life example. Look at the Clearview project... It's taken them a while to convince state authorities, but they are slowly coming around.</p>
      <p>It's clients that need convincing, since they are the ones with the power to approve these kinds of jobs.</p>
