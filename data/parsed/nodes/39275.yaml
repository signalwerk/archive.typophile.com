    html: |-
      <p>I blame bad design. Hospital staff are notoriously distracted, enough so that now and then someone gets sutured up with surgical equipment left inside. So why are the bottles of a drug sold in different strengths not obviously designed to reflect the contents? Something as simple as color-coded bottles, labels, or lids could make a big difference. So could stating important information right-side-up and upside-down, so that when a nurse or doctor flips the bottle to fill a syringe, the label can be read during the pause. </p>
      <p>It just seems like this should be so easy, but all I ever see are little glass bottles with simple labels and steel lids.</p>
