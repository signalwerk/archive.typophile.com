    html: |-
      <p>I have to agree with Ricardo; lack of education and media saturation seem to have produced an environment where people don't listen, don't try to read what's written in front of them, and to top that off, look for scapegoats to blame when someone has done something hideous like give anticoagulants to  random people. It's the fault of the nurse, shouldn't that be clear?</p>
      <p>I went to pick up a prescription, and the pharmacist looked at my drivers license 4 separate times before she actually read the letters of my name, instead of reading what she expected to see. Crossgrove isn't the same as Cosgrove, and it's not my fault, or the fault of DMV, or type designers, that she wouldn't just calm down for 3 seconds and read. There are words in every language that look similar; that's not some kind of unfair surprise. Certainly not to someone who has learned a foreign language.</p>
      <p>their is not there<br>
      tenet is not tenant<br>
      peak is not peek<br>
      discrete is not discreet<br>
      your is not you're</p>
