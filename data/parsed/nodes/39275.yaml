      <p>"I have to agree with Ricardo; lack of education and media saturation seem to have produced an environment where people don’t listen, don’t try to read what’s written in front of them, and to top that off, look for scapegoats to blame when someone has done something hideous like give anticoagulants to random people."</p>
      <p>Then what argument is there for good design? If the solution is to just get people to read everything, then why not make it an all-text world? Hell, why even bother with different fonts?</p>
      <p>Of course, an extreme argument, but I think blaming just the nurse is an extreme argument as well.</p>
      <p>Yes, nurses should pay attention. Yes, they shouldn't be so overworked. Yes, we should use design to assist them whenever we can.</p>
