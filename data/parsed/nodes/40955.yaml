  html: |-
    <p>backpacker.gr celebrates 2 years on the road with two new fonts families (a total of 37 + 1 new fonts) and numerous minor (to major) design updates!</p>
    <p>The first fonts family's name is "the ultimate dots pack" and I think it says it all ... 30 monospaced "dot" fonts in 6 alternates (round, square, diamond, plus, minus, vertical) and 2 styles (normal and unicase), together with 3 non-monospaced condensed variations (round, square, diamond). Most of the 30 monospaced fonts can be used interchangeably, since they share the same width, allowing you to create stunning layering effects. Check them out in the fonts section!</p>
    <p>The second fonts family name is BPreplay and it's a redesign of Magenta's <a href="http://www.ellak.gr/fonts/mgopen/index.en.html" rel="nofollow">MgOpenModata</a>. Small caps and old style numerals were added, while italics, bold and bold italics were designed from scratch (many thanks to Alexios Zavras for the technical review).</p>
    <p>In addition, BPmono Bold is introduced, BPmono and BPmono Italics faced some glyph and hinting corrections (many thanks to Nick Tzanos for his help and suggestions) and, finally, BPneon faced some minor changes and corrections.</p>
    <p><a href="http://www.backpacker.gr" rel="nofollow">http://www.backpacker.gr</a></p>
    <p>Enjoy!</p>
