      <p>Sorry but no solution out-of-the-box... Closest I've found are <a class="freelinking external" href="http://marketplace.veer.com/font/Periwinkle-JBT0000088" rel="nofollow">Periwinkle Fancy</a> and <a class="freelinking external" href="http://marketplace.veer.com/font/Fanfare-JBT0000066" rel="nofollow">Fanfare</a> which look too 'funky' to be considered as good substitutes...<br>
      2 ways to do the job:<br>
      - find the best sample you can and retrace it (automatically using an auto-trace tool?)<br>
      - customize an existing font: even if it's sounds weird, I'd probably start with Times New Roman or any of its digitizations by different foundries: <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/dutch-801/extra-bold-italic" rel="nofollow">Dutch 801</a> (Bitstream version of Times), <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/nimbus-roman/d-extra-bold-italic" rel="nofollow">Nimbus Roman</a> (URW version), <a class="freelinking external" href="http://www.myfonts.com/fonts/softmaker/thames-serial/heavy-italic" rel="nofollow">Thames</a> (Softmaker version); More candidates for a customization: <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/etienne" rel="nofollow">Etienne</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/modern-880" rel="nofollow">Modern 880</a> Bold and <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/moderno" rel="nofollow">Moderno</a></p>
      <p>Find <a class="freelinking external" href="http://ge.tt/6sOGWbA1/v/0" rel="nofollow">here</a> a PDF with from top to bottom:<br>
      - your sample reworked as black and white logo<br>
      - a quick auto-trace (vector) using Ai internal tracing tool<br>
      - a basic skeleton based on Times New Roman Bold<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5511.png"></div><p></p>
