    html: |-
      <p>Nice work Ryuk. Times Roman is close enough for an adaptation of the base outlines.<br>
      To get a bouncing effect for a full alphabet a good trick is to do a font with only the lower case letters, using the upper case positions for a raised lower case, and the lower case positions for a descended lower case. The capital letters can be placed in a second font, with the same raised and descended treatment. Using the two fonts together means that the user can create the bouncing effect for any words with the raised and descended letters alternating one after the other.<br>
      Don</p>
