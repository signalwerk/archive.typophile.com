      <p>This retro packaging recreates the 1960s wordmark.<br>
      The treatment of the lettering is very late 1950s when "tipsy" or "bouncy" serifs were the height of fashion. The use of color letter blocks  was often used by TV shows and stations in the 1960s to highlight color-television technology.<br>
      Here's a few fonts from Filmotype in the tipsy/bouncy style of the era:<br>
      Orlando:<br>
      <a href="http://www.myfonts.com/fonts/filmotype/orlando/" title="http://www.myfonts.com/fonts/filmotype/orlando/">http://www.myfonts.com/fonts/filmotype/orlando/</a><br>
      Panama:<br>
      <a href="http://www.myfonts.com/fonts/filmotype/panama/" title="http://www.myfonts.com/fonts/filmotype/panama/">http://www.myfonts.com/fonts/filmotype/panama/</a><br>
      Parade:<br>
      <a href="http://www.myfonts.com/fonts/filmotype/parade/" title="http://www.myfonts.com/fonts/filmotype/parade/">http://www.myfonts.com/fonts/filmotype/parade/</a><br>
      There may be a font with a free form serif that is close to Doritos. Worth checking to see if an amateur has created a font to mimic the letters in this retro package.<br>
      Don</p>
