      <p>Sorry but no solution out-of-the-box... Closest I've found are <a href="http://marketplace.veer.com/font/Periwinkle-JBT0000088" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Periwinkle Fancy</a> and <a href="http://marketplace.veer.com/font/Fanfare-JBT0000066" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Fanfare</a> which look too 'funky' to be considered as good substitutes...<br>
      2 ways to do the job:<br>
      - find the best sample you can and retrace it (automatically using an auto-trace tool?)<br>
      - customize an existing font: even if it's sounds weird, I'd probably start with Times New Roman or any of its digitizations by different foundries: <a href="http://www.myfonts.com/fonts/bitstream/dutch-801/extra-bold-italic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Dutch 801</a> (Bitstream version of Times), <a href="http://www.myfonts.com/fonts/urw/nimbus-roman/d-extra-bold-italic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nimbus Roman</a> (URW version), <a href="http://www.myfonts.com/fonts/softmaker/thames-serial/heavy-italic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Thames</a> (Softmaker version); More candidates for a customization: <a href="http://www.myfonts.com/fonts/paratype/etienne" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Etienne</a>, <a href="http://www.myfonts.com/fonts/bitstream/modern-880" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Modern 880</a> Bold and <a href="http://www.myfonts.com/fonts/fontbureau/moderno" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Moderno</a></p>
      <p>Find <a href="http://ge.tt/6sOGWbA1/v/0" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a> a PDF with from top to bottom:<br>
      - your sample reworked as black and white logo<br>
      - a quick auto-trace (vector) using Ai internal tracing tool<br>
      - a basic skeleton based on Times New Roman Bold<br><img src="/sites/default/files/old-images/Untitled-1_5511.png"></p>
