      <p>This is a font I made at college last year. We were asked to design a visual identity for Hillary Clinton to be used in the United States democratic election campaign, but I chose to design a font based on the Stars &amp; Stripes instead. I did make the font strong yet feminine so that it would fit her, but it is primarily designed using the flag as a grid. I am not finished designing the font, but given the challenge I couldn't resist posting it here.<br>
