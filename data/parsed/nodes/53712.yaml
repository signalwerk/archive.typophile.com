    <p>// THE CHALLENGE</p>
    <p>Create an alphabet using "Stars &amp; Stripes" as your inspiration.</p>
    <p>Winner take all, no holds barred. May the best designer win.</p>
    <p>// REQUIREMENTS</p>
    <p>- Image size: 550 width x 400 height. 72 dpi*<br>
    - Color: Color or Black and White<br>
    - Format: JPG or PNG (make sure there are no spaces in the name)</p>
    <p><strong>*Please try to keep your file sizes to a minimum! 50k per file max.</strong></p>
    <p>// ABOUT TYPOPHILE <a href="http://www.typophile.com/typebattles" rel="nofollow">TYPE BATTLES</a></p>
    <p>This is your chance to stretch your type muscles on a weekly basis. You have one week to create and submit your entry. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>As with any street battle, there is no panel of judges and no prize — only the ability to call yourself the best on the block.</p>
    <p>Link directly to this battle: <strong><a href="http://www.typophile.com/battle35" rel="nofollow">http://www.typophile.com/battle35</a></strong><br>
    Link to the battle directory: <a href="http://www.typophile.com/typebattles" title="http://www.typophile.com/typebattles">http://www.typophile.com/typebattles</a></p>
