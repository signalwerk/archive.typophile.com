    html: |-
      <p>You could start by inquiring about corporate licensing for three fonts from a number of font vendors. Most likely you would get prices ranging from high 4 figures to mid 5 figures per font (and sometimes more!). If this is the price your client would have to pay to license an off-the-shelf font for corporate use, you can figure out how much more to charge for a unique custom solution with similar licensing.</p>
      <p>Custom work is not cheap. Corporate licensing is not cheap.</p>
      <p>Do not give your work away.</p>
