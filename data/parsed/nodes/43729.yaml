  html: |-
    <p>hello everyone</p>
    <p>I was asked to estimate a price for a custom font, for corporate use and would like to have a closer idea of a possible price table (if there is such) for a custom font.<br>
    Can anyone light me on this.<br>
    how much would you charge for a three weight sans (no italics) western/roman default encoding?</p>
    <p>I know this can be a sensible question, I'm not asking for a rigorous budget estimate:), just need have an idea on it, since I haven't got a clue.</p>
    <p>Thanks in advanced.</p>
