  html: |-
    <p>Is there an advantage to decomposing accented glyphs  <br>derived from components? Years ago I remember a reason <br>for doing this with Fontographer as there was a snag with <br>certain Windows systems.  <br> <br>Recently I've noticed my OpenType fonts not showing their <br>accented characters on the Myfonts.com server. I decomposed <br>the accented glyphs and everything now appears. <br>Is this an OT thing? Fontlab?</p>
