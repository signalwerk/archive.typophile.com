  html: |-
    <p>The band's name is <cite>Big And Loaded</cite> and the concept is pretty self-explanatory: The 'Big' is big and the 'Loaded' is loaded.</p>
    <p>The music they are playing is some kind of 'Pop-Punk', close to Bands like <cite>Blink 182</cite> or <cite>New Found Glory.</cite><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/bal_4891.jpg"></div><em></em><br>
    Since this is for some friends of mine and there is no budget, I decided to make a Slab-Serif on my own. It's based on Akzidenz-Grotesk and very much inspired by <a href="http://www.fonts.com/DE/detail.htm?pid=201429" rel="nofollow">Memphis</a>.<br>
    <em></em><br>
    I'm a little concerned about the 'and' and that it might get lost at smaller sizes. The 'loaded' feels a little off right now, but I want to check your opinions on this before I move on. I am especially doubting the distance between 'Big And' and 'Loaded'.<br>
    <em></em><br>
    Ohh ... and the center of 'I' is the perfect center of 'BIG' -- reminds me of the <a href="http://typophile.com/node/63567" rel="nofollow">Simplease-Logo</a>.<br>
    ;)<p></p>
