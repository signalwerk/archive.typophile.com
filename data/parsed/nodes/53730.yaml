    <div class="info">Submitted by <a href="/user/17208" title="View user profile.">pvanderlaan</a> : 20.Jan.2009 2.15am </div>
      <p>We’re happy to announce a new typeface: <strong>Burgundica</strong>.</p>
    <p>Originally created in 1983, this remarkable design by Gerrit Noordzij is now generally available. It comes in the OpenType and PS Type 1 format and consists of four weights.</p>
    <p>Burgundica is a Fraktur (“broken script”) with strong calligraphic roots.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/burgundica_5002.gif"></div><p></p>
    <p>To see what the designer has to say about Burgundica, please go to <a href="http://www.teff.nl/fonts/burgundica/" title="http://www.teff.nl/fonts/burgundica/">http://www.teff.nl/fonts/burgundica/</a> and click the link 'Concept'</p>
    <p>For an overview of the Burgundica family, go to <a href="http://www.teff.nl/fonts/burgundica/" title="http://www.teff.nl/fonts/burgundica/">http://www.teff.nl/fonts/burgundica/</a><br>
    If you prefer printed samples, you can download an A3 sample page (600 dpi) at <a href="http://www.teff.nl/fonts/samplesheets.html" title="http://www.teff.nl/fonts/samplesheets.html">http://www.teff.nl/fonts/samplesheets.html</a> or make a request for (free) 1200 dpi samples at: <a href="http://www.teff.nl/fonts/vouwvel_form.html" title="http://www.teff.nl/fonts/vouwvel_form.html">http://www.teff.nl/fonts/vouwvel_form.html</a> which will be sent by regular post. Delivery may take up to three weeks.</p>
    <p>The Burgundica fonts come with:<br>
    - alternate characters for r and s, dieresis and umlaut<br>
    - with automatic selection of the correct r (optional)<br>
    - typographic features:<br>
    &nbsp; automatic ligatures<br>
    &nbsp; dieresis or umlaut<br>
    &nbsp; long or short s<br>
    - unicode support<br>
    - cross platform compatibility<br>
    Note: Technical restrictions apply to the Type 1 format.</p>
    <p>To immediate download the fonts, go to: <a href="http://store.esellerate.net/teff/store" title="http://store.esellerate.net/teff/store">http://store.esellerate.net/teff/store</a></p>
    <p>For offline orders go to: <a href="http://www.teff.nl/fonts/burgundica/fonts_form_burgundica.html" title="http://www.teff.nl/fonts/burgundica/fonts_form_burgundica.html">http://www.teff.nl/fonts/burgundica/fonts_form_burgundica.html</a> or send an email to <a href="mailto:info@teff.nl">info@teff.nl</a></p>
    <p>Burgundica® is a registered trademark of The Enschedé Font Foundry.<br>
    TEFF® is a registered trademark of The Enschedé Font Foundry.</p>
