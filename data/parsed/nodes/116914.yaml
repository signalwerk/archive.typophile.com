    <p>Hi,<br>
    I'm working on a website and would like to use Beorcana for the headings.<br>
    I can’t use it for the body text, as my Wordpress template only allows me to have custom headers.<br>
    For the body text I can use the google fonts plus a basic set including Verdana, Arian, Lucida Sans and so on.<br>
    I would prefer a sans serif for the body text.<br>
    Let me know if there is one you can recommend.<br>
    Thanks,<br>
    Antonie</p>
