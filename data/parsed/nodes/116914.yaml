      <p>Hi Antonie,</p>
      <p>I would check out Alegreya:</p>
      <p><a href="http://www.google.com/fonts/specimen/Alegreya" title="http://www.google.com/fonts/specimen/Alegreya">http://www.google.com/fonts/specimen/Alegreya</a></p>
      <p>It has a calligraphic feel to it similar to Beorcana. </p>
      <p>I really can't think of a perfect sans-serif match available on Google Fonts. Open Sans and Source Sans Pro are always good choices and could really pair decently with anything. You can see some other choices here for nice Google fonts:</p>
      <p><a href="http://www.typewolf.com/top-10-open-source-web-fonts" title="http://www.typewolf.com/top-10-open-source-web-fonts">http://www.typewolf.com/top-10-open-source-web-fonts</a></p>
      <p>Hope that helps.</p>
      <p>Jeremiah</p>
