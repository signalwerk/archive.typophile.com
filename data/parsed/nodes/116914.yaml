      <p>Thanks again hhp.<br>
      PT Sans sounds like a good suggestion for while I'm stuck with Google fonts. I'm going to play around with the different font sized on the typecast website, to see which ones fit. It does strike me that PT Sans has a much higher x-height than Beorcana - does that matter when they are used as body and header respectively?</p>
