      <p>The fact that you chose Beorcana is a clear sign that you care, so it's no surprise that you have your eye on one day enjoying real choice in a body font. If/when that happens you might consider a face mentioned here:<br>
      <a href="http://typophile.com/node/116847" title="http://typophile.com/node/116847">http://typophile.com/node/116847</a></p>
      <p>But in the meantime (and since I totally agree that Beorcana's strong flavor should be matched up with something more staid) what do you think of PT Sans?<br>
      <a href="https://www.google.com/fonts/specimen/PT+Sans" title="https://www.google.com/fonts/specimen/PT+Sans">https://www.google.com/fonts/specimen/PT+Sans</a></p>
      <p>hhp</p>
