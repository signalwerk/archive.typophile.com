    html: |-
      <p>Thanks for the replies.</p>
      <p>@Jeremiah, I like Alegreya but actually find it a bit too caligraphic, thinking I'd like something with a simpler shape to go with Beorcana. And I had a look at the suggestions on typewolf, but I don't know enough about typography to make an informed choice as to which font would be a good match, especially since I'm waiting to buy Beorcana until I have a suitable matching body font.</p>
      <p>@hhp, my wordpress template (Avada) will in the future allow for custom body text, so in a way it would also be nice to hear suggestions for a matching body type that are not in Google fonts. I'm a writer who is building  a website. I've just started learning about typography, and I read and write a lot, so I do have a sense of the importance of typography and its potential beauty - just not enough expertise to make an informed choice. That's why I'm asking here for advice. </p>
      <p>So can people help out with suggestions - either Google fonts or another font I'll be able to use once Avada allows for custom body text?</p>
