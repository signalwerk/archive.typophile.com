    <p>Good evening,</p>
    <p>last night my old good Sony Trinitron left me with words "no input signal" on its screen and its broken connector in my hands. I cannot imagine how come in my always empty room the two pins of the connector got *that* much... literally severly bent... but this is what it is.</p>
    <p>So after a night full of grief and sorrow, I have decided there might be a new monitor coming my way (it wasn't planned, no, I need money elsewhere). And I even got this shallow to think of an LCD replacement.</p>
    <p>I am currently looking at BenQ, Iiyama, EIZO (though more with envy than with intent) and, ahem, Sony. I am looking at this forum through Iiyama 19" CRT screen and should confess, it seems to be a pretty good fella. But it's way too big for my coffee table. :/ So, yes, it should be an LCD.</p>
    <p>Oh, no, I am not mistinterpreting this forum — exactly your perspective on the question has importance to me, not the CNet/ZDNet clique.</p>
    <p>Cheers,<br>
    Alexey</p>
