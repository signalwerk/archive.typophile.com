      <p>Jason, </p>
      <p>&gt; it uses the same technology as apple</p>
      <p>ROTFL. Who told you that? </p>
      <p>&gt; how much better is the apple cinema display</p>
      <p>ROTFL. Apple Cinema Display better? </p>
      <p>The marketing people from Apple surely are convincing, a pity that the technology doesn't support that. </p>
      <p>The 24-inch Dell UltraSharp 2405FPW LCD comes with 500 cd/m2 brightness, 1000:1 contrast, 12 ms response time, and a 3-year warranty at $900 (5-year warranty at $940). </p>
      <p>The 23-inch Apple Cinema HD Display M9178LL/A LCD comes with 270 cd/m2 brightness, 400:1 contrast, 16 ms response time, and a 1-year warranty at $1,300. </p>
      <p>Both have the same 1920 x 1200 native resolution, the same viewing angle. The Apple monitor is thinner and lighter (but it's also 1" smaller), and it comes with Firewire that Dell doesn't. </p>
      <p>The Dell is 30% faster, 85% brighter, has 150% more contrast and is 30% cheaper than the Apple monitor. But it doesn't come with a picture of Steve Jobs in the box. If you only work at nights or with completely closed curtains, get the Apple, otherwise get the Dell, because that actually is up-to-date technology. </p>
      <p>Of course, instead of the Dell, you can also choose the 24-inch Samsung 244T, which offers 500 cd/m2 brightness, 1000:1 contrast and an unbelievable 8 ms response time (that's twice as fast as grandpa Apple), and costs about the same as the Apple. But it also doesn't come with a picture of Steve Jobs in the box. </p>
      <p>Pick a monitor from one of the companies that understand how to manufacture LCD panels: Samsung, Dell or Eizo. Forget cheap knockoffs like BenQ or Iiyama. And forget Apple Cinema Display, which represents the state of LCD technology from three years ago. </p>
      <p>A.</p>
