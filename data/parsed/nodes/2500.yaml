    html: "<p>Choosing the right grays (2 is good, 5 is too many) is probably the single most important tangible decision you'll make. The other \"secret\" is getting in the groove of grayscale design: it has elements of both b&amp;w and (to a lesser extent) outline font creation, but it requires its own mindframe too. <br> <br>BTW, Luciano, your Flash stuff isn't coming out at 100% magnification (at least not on my end), so everything is super blurry. <br> <br>-- <br> <br>So you guys like \"grayplay\", eh?  :-) <br>The way I'd like to use it though isn't to mean just grayscale font design; \"grayplay\" is the use of gray pixels to simulate subtleties, like lightening of joins and bending of stems. <br> <br>hhp <br></p>"
    html_clean: "<p>Choosing the right grays (2 is good, 5 is too many) is probably the single most important tangible decision you'll make. The other \"secret\" is getting in the groove of grayscale design: it has elements of both b&amp;w and (to a lesser extent) outline font creation, but it requires its own mindframe too. <br> <br>BTW, Luciano, your Flash stuff isn't coming out at 100% magnification (at least not on my end), so everything is super blurry. <br> <br>-- <br> <br>So you guys like \"grayplay\", eh?  :-) <br>The way I'd like to use it though isn't to mean just grayscale font design; \"grayplay\" is the use of gray pixels to simulate subtleties, like lightening of joins and bending of stems. <br> <br>hhp <br></p>"
