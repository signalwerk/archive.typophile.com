    html: <p>Myke, take a look here <br><a href="http://www.fontsforflash.com/" target="_blank">http://www.fontsforflash.com/</a> (Super Pixel Fonts) <br>and here. <br><a href="http://www.truthindesign.com/gray-cell.html" target="_blank">http://www.truthindesign.com/gray-cell.html</a> <br> <br>I would start by painting the font you want, and try this 'greyplay' as they call it. Seek the right grey between Black and White. Photoshop or any similar program is good for this. Then build the font. <br> <br>--- <br>Whenever I drop a swf file into a browser, it enlarges to the browser window. o'higgins got all blurry. Does anyone know how to view swfs correctly without having to resize the window.</p>
    html_clean: <p>Myke, take a look here <br><a href="http://www.fontsforflash.com/" target="_blank">http://www.fontsforflash.com/</a> (Super Pixel Fonts) <br>and here. <br><a href="http://www.truthindesign.com/gray-cell.html" target="_blank">http://www.truthindesign.com/gray-cell.html</a> <br> <br>I would start by painting the font you want, and try this 'greyplay' as they call it. Seek the right grey between Black and White. Photoshop or any similar program is good for this. Then build the font. <br> <br>--- <br>Whenever I drop a swf file into a browser, it enlarges to the browser window. o'higgins got all blurry. Does anyone know how to view swfs correctly without having to resize the window.</p>
