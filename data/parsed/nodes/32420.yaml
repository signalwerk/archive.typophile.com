    <p>Greetings. I can't seem to get the typophile search function to work, or I probably would have already found the answer to my question. It also doesn't appear to be in the Fontlab 4.6 manual.</p>
    <p>Can anyone show me an example of proper implementation of the <a href="/wiki/numr" class="freelinking" rel="nofollow">numr</a> and <a href="/wiki/dnom" class="freelinking" rel="nofollow">dnom</a> OpenType features? I can get the frac feature to do basic substitutions for the standard set of fractions, but it seems that the frac feature can call the numr and dnom features, but I haven't seen anywhere a specific example of how to make that work. I'd be most grateful for some insight into that mysterious process.</p>
    <p>Below is the code I'm currently using to get the <a href="/wiki/frac" class="freelinking" rel="nofollow">frac</a> feature to work, in case it gives you some idea where I'm at.</p>
    <p>feature frac {<br>
      sub [one one.lnum] [slash fraction] [two two.lnum] by onehalf;<br>
      sub [one one.lnum] [slash fraction] [four four.lnum] by onequarter;<br>
      sub [one one.lnum] [slash fraction] [three three.lnum] by onethird;<br>
      sub [one one.lnum] [slash fraction] [eight eight.lnum] by oneeighth;<br>
      sub [two two.lnum] [slash fraction] [three three.lnum] by twothirds;<br>
      sub [three three.lnum] [slash fraction] [four four.lnum] by threequarters;<br>
      sub [three three.lnum] [slash fraction] [eight eight.lnum] by threeeighths;<br>
      sub [five five.lnum] [slash fraction] [eight eight.lnum] by fiveeighths;<br>
      sub [seven seven.lnum] [slash fraction] [eight eight.lnum] by seveneighths;<br>
    } frac;</p>
