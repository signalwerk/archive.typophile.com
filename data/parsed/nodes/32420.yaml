      <p>Here's the code I use:</p>
      <p><code>feature frac {<br>
        @numbers = [ zero one two three four five six seven eight nine ] ;<br>
        @numerators = [ zero.numr one.numr two.numr three.numr four.numr five.numr six.numr seven.numr eight.numr nine.numr ] ;<br>
        @denominators = [ zero.dnom one.dnom two.dnom three.dnom four.dnom five.dnom six.dnom seven.dnom eight.dnom nine.dnom ] ;<br>
        @predenominators = [ slash fraction onehalf onequarter threequarters<br>
        zero.dnom one.dnom two.dnom three.dnom four.dnom five.dnom six.dnom seven.dnom eight.dnom nine.dnom ] ;</code></p>
      <p>  sub one' [slash fraction]' two' by onehalf ;<br>
        sub one' [slash fraction]' four' by onequarter ;<br>
        sub three' [slash fraction]' four' by threequarters ;</p>
      <p>  sub @numbers by @numerators ;<br>
        sub @predenominators @numerators' by @denominators ;<br>
        sub slash by fraction ;<br>
      } frac;<br>
      </p>
      <p>If I recall, this was based somewhat on the code Adobe uses. I can't remember for sure.</p>
      <p>Tal Lemming has a detailed discussion about frac feature strategy here:</p>
      <p><a href="http://talleming.com/2008/04/16/fraction-fever/" title="http://talleming.com/2008/04/16/fraction-fever/">http://talleming.com/2008/04/16/fraction-fever/</a></p>
