      <p>Mark Simonson -- (about Tal's fraction feature) <cite>He admits his solution has some drawbacks and doesn't necessarily recommend it. Looks like it's still a work in progress.</cite> (about your fraction feature) <cite>Ligatures are usually on by default, so the fraction sequence would be converted indiscriminately. Thus, if the user typed "9/11/2001" they would get "9/1½001".</cite></p>
      <p>In both cases, the drawback is the same: indiscriminately applying the feature to strings that should not be touched. In case of Tal's suggestion, this drawback is easily addressed by adding a few "ignore" statements which make sure that dates and other strings following the pattern slash--digit(s)--slash are left intact. Btw, the free style of FF Dagny shows that FontShop has adopted Tal's approach including a safety belt like I mentioned, so obviously they consider this approach as safe enough, like I do too.</p>
      <p>As to the second part, it is not necessary to deal with prebuilt fractions in frac. These exist for legacy reasons, so add them to the font but then leave them alone. A frac feature can compose a ½ from numerator-one plus fraction-slash plus denominator-two, the same way it would compose any other arbitrary fraction.</p>
