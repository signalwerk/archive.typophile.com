      <p>The following is completely untested hack, but might work and deal correctly with dates. Unfortunately, the current version of FontLab doesn't support <code> rsub </code> so it isn't viable for those who would prefer not to deal with ADFKO directly (which, unfortunately, includes me or I would have tested this).</p>
      <p><code></code></p>
      <p>@Figures = [zero one two three four five six seven eight nine];<br>
      @Numerators = [zero.numr one.numr two.numr three.numr four.numr five.numr six.numr seven.numr eight.numr nine.numr];<br>
      @Denominators = [zero.dnom one.dnom two.dnom three.dnom four.dnom five.dnom six.dnom seven.dnom eight.dnom nine.dnom];</p>
      <p># perform initial substitutions</p>
      <p>sub @Figures' [slash fraction] by @Numerators;<br>
      rsub @Figures' @Numerators by @Numerators;<br>
      sub [slash fraction] @Figures' by @Denominators;<br>
      sub @Denominators @Figures' by @Denominators;</p>
      <p># fix dates</p>
      <p>sub [slash fraction] @Numerators' by @Figures;<br>
      sub @Figures @Numerators' by @Numerators;<br>
      sub @Numerators' [slash fraction] @Figures by @Figures;<br>
      rsub @Numerators' @Figures by @Figures;<br>
      sub @Figures [slash fraction] @Denominators by @Figures;<br>
      sub @Figures @Denominators' by @Figures;</p>
      <p>sub @Numerators slash' @Denominators by fraction;</p>
      <p></p>
