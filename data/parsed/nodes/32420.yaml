      <p>Tal has just posted an update to the Fractions Fever article which explains the addition: <a href="http://talleming.com/2009/10/01/fraction-fever-2/" title="http://talleming.com/2009/10/01/fraction-fever-2/">http://talleming.com/2009/10/01/fraction-fever-2/</a></p>
      <p>Trick is to catch cases with multiple slashes via <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.f.ii" target="_blank" rel="nofollow">ignore</a> (to make sure these cases are not turned into fractions), then substitute slash by fraction-slash, then substitute numerals by numerators and denominators if in context of fraction-slash.<br>
      <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.h" target="_blank" rel="nofollow">reversesub</a> would indeed save some lines of code, but better test this lookup type in a couple of applications first, including in XPress ...</p>
