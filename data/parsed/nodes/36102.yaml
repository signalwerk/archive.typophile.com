    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <span class="caps">FF</span>&nbsp;Nexus</strong></p>
    <p><a href="/node/31193" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Martin Majoor</a>,&nbsp;2004</p>
    <p><span class="caps">FF</span> Nexus is built on Martin Majoor’s “three typefaces, one form” principle. Three families — a serif, slab serif, and sans — are derived from a single design concept. The monospaced <span class="caps">FF</span> Nexus Typewriter plays well with the others, too. This breadth of options, combined with OpenType features (such as built-in small caps, alternate glyphs, and optional swashes) make <span class="caps">FF</span> Nexus an extremely versatile type&nbsp;system. </p>
    <p><strong>External Links</strong><br><a href="http://www.fontshop.com/search/?q=FF+Nexus"><span class="caps">FF</span> Nexus at FontShop</a><br><a href="http://www.fontfont.com/fonts/nexus-serif"><span class="caps">FF</span> Nexus fonts at&nbsp;FontFont</a></p>
