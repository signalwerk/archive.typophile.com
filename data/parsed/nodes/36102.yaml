    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF Nexus</strong></p>
    <p><a href="/wiki/Martin%20Majoor" class="freelinking" rel="nofollow">Martin Majoor</a>, 2004</p>
    <p>FF Nexus is built on Martin Majoor's "three typefaces, one form" principle. Three families — a serif, slab serif, and sans — are derived from a single design concept. The monospaced FF Nexus Typewriter plays well with the others, too. This breadth of options, combined with OpenType features (such as built-in small caps, alternate glyphs, and optional swashes) make FF Nexus an extremely versatile type system. </p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/search/?q=FF+Nexus" rel="nofollow">FF Nexus at FontShop</a><br>
    <a href="http://www.fontfont.com/fonts/nexus-serif" rel="nofollow">FF Nexus fonts at FontFont</a></p>
