    html: |-
      <p>Probably can't tell much without looking at the font.<br>
      Do you have all the correct default glyphs in the right places?<br>
      Are all the outlines correct (complete, correct direction, no overlaps or bad nodes)?<br>
      Unicodes correct?<br>
      OT Features correct?</p>
