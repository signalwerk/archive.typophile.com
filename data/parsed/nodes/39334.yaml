  html: |-
    <p>Im looking for some serif font inspiration for a identity job</p>
    <p>At the moment im using Amasis:<br>
    <a href="https://web.archive.org/web/20080906162147/http://www.myfonts.com/search?search%5Btext%5D=Amasis" title="http://www.myfonts.com/search?search%5Btext%5D=Amasis">http://www.myfonts.com/search?search%5Btext%5D=Amasis</a></p>
    <p>but am looking to put together about 6 different options...</p>
    <p>Does anyone know of that fantastic long forgotten serif font that<br>
    can be dragged out and used again, or have any other suggestions<br>
    on great serif typefaces ? The letter A is quite important in the identity...</p>
    <p>i also like...</p>
    <p>Goudy Old Style<br>
    <a href="https://web.archive.org/web/20080906162147/http://www.myfonts.com/fonts/bitstream/goudy-old-style/" title="http://www.myfonts.com/fonts/bitstream/goudy-old-style/">http://www.myfonts.com/fonts/bitstream/goudy-old-style/</a></p>
    <p>Silverado RR Light<br>
    <a href="https://web.archive.org/web/20080906162147/http://www.myfonts.com/fonts/redrooster/silverado-rr/" title="http://www.myfonts.com/fonts/redrooster/silverado-rr/">http://www.myfonts.com/fonts/redrooster/silverado-rr/</a></p>
    <p>Thanks</p>
