    html: <p>It is contemporary art quilts. The only thing that links all the images is that they are textile / fiber related. The layout, which I am stuck with, is a detail on the left page, a full image of the piece on the right. There is an artist's statement (One  2-5 sentence paragraph), and the heading is the artist's name and city/ state below it as a subhead. Historically that has been in Helvetica bold for the names and the rest of the copy in a basic serif - maybe Times. All the font sizes have been way too big, so it has had the look of an elementary school picture book. I think make the fonts all smaller will go a long way to creating a more contemporary and designed look, but that's as far as I have gotten.</p>
    html_clean: <p>It is contemporary art quilts. The only thing that links all the images is that they are textile / fiber related. The layout, which I am stuck with, is a detail on the left page, a full image of the piece on the right. There is an artist's statement (One  2-5 sentence paragraph), and the heading is the artist's name and city/ state below it as a subhead. Historically that has been in Helvetica bold for the names and the rest of the copy in a basic serif - maybe Times. All the font sizes have been way too big, so it has had the look of an elementary school picture book. I think make the fonts all smaller will go a long way to creating a more contemporary and designed look, but that's as far as I have gotten.</p>
