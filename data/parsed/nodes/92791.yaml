  html: "<p>I am designing a catalog for a contemporary museum and want to choose a font to use for both the heads and body copy that says: elegance, contemporary, and is readable and legible. I am thinking of both being san Serif and have considered Gotham narrow and Whitney, but I want more ideas from folks who know more than I do.</p>"
  html_clean: "<p>I am designing a catalog for a contemporary museum and want to choose a font to use for both the heads and body copy that says: elegance, contemporary, and is readable and legible. I am thinking of both being san Serif and have considered Gotham narrow and Whitney, but I want more ideas from folks who know more than I do.</p>"
