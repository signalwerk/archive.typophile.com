    html: |-
      <p>Whitney is very functional, but it's not elegant, and not too contemporary either.</p>
      <p>I might base the choice of the text font on the shape of the "a" in Gotham. And I would strongly consider a serif (maybe a slab, or sheared wedge) although that does depend on how much text you have.</p>
      <p>hhp</p>
