  html: |-
    <p>Paveline is one of Greater Albion's forthcoming new releases.  It might best be described as a ‘punctuated’-or if you like not joined up-script.  A physicist friend suggested ‘quantum script’-in the sense of coming in discrete glyphs but with thought that might be a joke to far!</p>
    <p>In any event, it derives from a stylised adaptation of our own chief designer’s handwriting and a high resolution preview can be seen <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> here on our blog.</a></p>
