    <p><strong><a href="/node/12010" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Indices</a> : <a href="/node/17745" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Designers</a> : Doyald Young</strong></p>
    <p>Doyald Young is a designer of typefaces, custom lettering, logotypes, and has been involved in the field since 1955. Not only is Young a designer, he is also a teacher, and has been teaching for many years at the <a href="/node/12596" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Art Center College of Design</a> in California. In 2001 he was honored for his contributions by being named an Inaugural Master of the School. To date he has also worked on custom lettering for a number of high profile clients such as the General Electric, Art Directors Guild, Prudential Financial, and the Grammy Awards. To date Young has designed one commercially available script typeface called Young Baroque, but has designed many other custom types for use in corporate identities such as Home Run, and Prudential Roman.</p>
    <p>Throughout his career he has published five books:</p>
    <p><a href="/node/12582" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Logotypes and Letterforms</a><br>
    Handlettered Logotypes<br>
    Typographic Considerations<br>
    <a href="/node/12581" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Fonts and Logos</a><br>
    The Art of the Letter<br>
    Dangerous Curves</p>
    <p>Logotypes &amp; Letterforms and Fonts &amp; Logos are currently available through <a href="http://www.delphipress.com" rel="nofollow">Delphi Press</a>, Young's own imprint.</p>
