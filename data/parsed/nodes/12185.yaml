    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Doyald&nbsp;Young</strong></p>
    <p>Doyald Young is a designer of typefaces, custom lettering, logotypes, and has been involved in the field since 1955. Not only is Young a designer, he is also a teacher, and has been teaching for many years at the <a href="/node/12596" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Art Center College of Design</a> in California. In 2001 he was honored for his contributions by being named an Inaugural Master of the School. To date he has also worked on custom lettering for a number of high profile clients such as the General Electric, Art Directors Guild, Prudential Financial, and the Grammy Awards. To date Young has designed one commercially available script typeface called Young Baroque, but has designed many other custom types for use in corporate identities such as Home Run, and Prudential&nbsp;Roman.</p>
    <p>Throughout his career he has published five&nbsp;books:</p>
    <p><a href="/node/12582" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Logotypes and Letterforms</a><br>
    Handlettered Logotypes<br>
    Typographic Considerations<br><a href="/node/12581" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fonts and Logos</a><br>
    The Art of the Letter<br>
    Dangerous&nbsp;Curves</p>
    <p>Logotypes <span class="amp">&amp;</span> Letterforms and Fonts <span class="amp">&amp;</span> Logos are currently available through <a href="http://www.delphipress.com">Delphi Press</a>, Young’s own&nbsp;imprint.</p>
