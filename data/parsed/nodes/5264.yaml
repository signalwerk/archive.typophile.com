    <p>Someone please help me !  <br> <br>I have tried several font managers recently . I did not like them, removed them, but the trouble is that during an uninstall process my Windows Font Viewer has lost its PFM file association. Double-click does not work any more and I can't even reassociate it still sais it's no font file . When (wherever) I write "fontview A.pfm" it works of course but I'd like to have the double-click back . If you had the same trouble and was able to solve it please help me . <br> <br>Thank you for your help in advance <br> <br>*S</p>
