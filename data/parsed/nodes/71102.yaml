  html: |-
    <p>Can anyone please ID the font used for the Swift Premium Foods logo?</p>
    <p>It looks like Aachen Bold but there are some differences. The 'S' has additional serif marks and the 'i' is square versus round.</p>
    <p>Perhaps this is just a simple modification, but I want to check to see if perhaps there is an alt to Aachen with these character sets.</p>
    <p><a href="http://www.seeklogo.com/swift-premium-logo-134610.html" title="http://www.seeklogo.com/swift-premium-logo-134610.html">http://www.seeklogo.com/swift-premium-logo-134610.html</a></p>
