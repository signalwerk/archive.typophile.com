    html: |-
      <p>I have been known to use lining and oldstyle figures together in a single text for different purposes. It can be done. I think of it as analogous to knowing when to use capitals vs. lowercase.</p>
      <p>In your example, however, you are being inconsistent, without any semantic logic. </p>
      <p>Also, in most style guides the use of the ordinals in "21st" would be incorrect. Even if one would read it as "21st," in formal writing the date should be set as simply "September 21, 1794."</p>
