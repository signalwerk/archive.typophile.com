    html: |-
      <p>&gt; practically anything might confuse a reader</p>
      <p>True, but you aim to minimize the possibilities.</p>
      <p>Although I did think of a place where I _might_ use lining numbers with OS. In a scholarly text I would have used footnote references lining, even if the text elsewhere on the page is OS. This was because with 10pt text, footnotes were set at 7 point, baseline shifted, and the light weight of the reduced OS numbers would make them too weak.</p>
      <p>I'd have to do a lot of testing (well some) first if I was still doing books, because many fonts have true superior figures that could be used without the weaking of using a reduced font. OS footnote refs might be acceptable in that case.</p>
