    html: |-
      <p>Lorem</p>
      <p>I once agreed that having lining page numbers and OS within text made sense. After all, if the rationale for OS numbers is provide smooth typographic color within the text stream, then why should they be used outside the textstream, in the running heads (particularly if the heads were in full caps).</p>
      <p>I could never get an editor to agree with me, and gradually realized that they might be right. Having two different sets of numbers _may_ inadvertently confuse a reader, and that is a cardinal sin in good typography, in my opinion.</p>
