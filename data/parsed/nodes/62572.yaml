      <p>I'd agree with Kent, your example has no rationale. Consider the following:</p>
      <p>"In 1933, Whosis developed the equation (put equation here)."</p>
      <p>I have set texts where dates &amp; non-mathematical number usage used old-style figures, but equations used lining figures. </p>
      <p>As to confusing a reader, one should always have some sense of who a reader might be. I once set a book where the designer specified the chapter opening epigraphs to be set in italic. The run-in source had the author's name also in italic, with the title in roman. Usual practice in such a situation. An editor objected; it might comfuse the reader. You know, they might think of that wonderful novel <cite>Ernest Hemingway</cite> by The Old Man and the Sea. I'd add that most anyone without at least a high school education wouldn't have understood the text of the book, filled as it was with academic jargon . . .</p>
