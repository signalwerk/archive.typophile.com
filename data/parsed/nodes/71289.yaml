      <p><em>Is there a sans-serif font that looks distinct enough, but does not clash with Caslon?</em></p>
      <p>I think a solid grotesk would do good – Franklin Gothic, News Gothic or Benton Sans (Fontbureau). Univers, too boring? </p>
      <p><em>I'm not a huge fan of Caslon at large sizes.</em></p>
      <p>I'm a huge fan of <em>Big Caslon</em> at large sizes – i mean, look at this long list of different Caslon interpretations for example. <a href="http://www.identifont.com/find?font=caslon&amp;q=Go" title="http://www.identifont.com/find?font=caslon&amp;q=Go">http://www.identifont.com/find?font=caslon&amp;q=Go</a></p>
      <p><em>I may like to use a different font for the cover page</em><br>
      You should, if it supports the cover design, the athmosphere, better than the faces you use inside the book.</p>
