    html: |-
      <p>From what I see, this is not a logo, but a commemorative coin. That means that most probably they've used something non-digital to do it, even if after 1908.<br>
      If you do need to recreate it, I think your best chance is to pick up the most similar typeface you could find (Century?) and customize the needed letters.</p>
      <p>(maybe I'll go for the typeface with the most similar Ss, because they're harder to modify)</p>
