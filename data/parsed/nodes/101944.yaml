  html: |-
    <p>Profuse THANK YOU in advance!</p>
    <p>I need to know this font. It's on the official test-prep for GRE and (most likely) on the actual GRE exam. My whole future is dependent on my GRE score, which in turn relies on me switching all prep materials into this test font for greater familiarity.</p>
    <p>I tried many Serif fonts with Microsoft Word, but to my eyes, they all seem a little chubbier and shorter than this one. I don't know if this has to do with screen resolution or anything else.</p>
    <p>Thank you again. You'll be my hero.</p>
    <p>Eric</p><div class="imageWrap"><img src="http://typophile.com/files/NEED FONT_6349.jpg"></div><p></p>
