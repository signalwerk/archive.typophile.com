      <p>If the font is more important than the content, I don't hold up much hope for you. </p>
      <p>But if you think it will help, the GRE practice general test pdf uses these fonts (all in multiple variants):<br>
        Goudy<br>
        Helvetica<br>
        New Aster<br>
        SerifGothic<br>
        Times<br>
        Universal-newswithCommPi<br>
         - Herb</p>
