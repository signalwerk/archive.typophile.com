      <p>So if we're moving past the legible/not-legible debate... There's nothing wrong with it only abstractly representing an F4 - however in that case I would start to consider the over all symmetry and consideration of every single detail in the mark. (and let me try to cut off any misunderstanding by saying that these are not intended as rhetorical or patronizing questions - I'm honestly asking...)</p>
      <p>Looking at the last A,B,C samples; A and B have top-right and bottom-left loops that are almost the same, but they're not. On C the bottom-right loop doesn't match either of the two loops. Is this intentional? Do you intend to clean that up later?</p>
      <p>In A the bottom-right-corner line pointing down doesn't quite reach as low as the bottom-left loop and the right-pointing line doesn't reach quite as far to the right as the top-right loop. Is there a reason for that?</p>
      <p>If this is truly an abstract shape, I'd consider making it highly-symmetric (top right/bottom left; top left/bottom right corners identical), then the only places that you  break that symmetry (the bar of the 'F' and the top of the '4') will seem much more intentional.</p>
