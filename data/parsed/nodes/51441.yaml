    date: 2008-11-09T20:29:00
    votes: null
    html: |-
      <p>thanks Chris, first off, I'm all down for a critique here and I'm absolutely open to anyone's opinion here, but it's more the tone of a previous comment that irked me for a second.</p>
      <p>Legibility is a secondary concern to me, this symbol will (hopefully) be seen repeatedly so many times that it will actually become more of a ⌘ or something like that where every time one would see it, they don't think 'that's the letter F and the number 4' they just say, oh thats the F4 zine logo, and if they really actually take a moment to look at the symbol they see the two forms.</p>
      <p>NOW! legibility aside, what do you guys think about the three sketches in the post above?<br>
      Bottom right loop on or off?<br>
      if off, which seems better balanced? the full vertical bottom stroke of the 4 or the shortened stroke?<br>
      I'm considering rotating the lockup very slightly to the left to keep it fresh.</p>
      <p>- Scott Sullivan<br>
