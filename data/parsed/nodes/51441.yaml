      <p><em>Seeing that the music scene here isn’t a european techno kind of thing, it just doesn’t work for Ohio.</em></p>
      <p>Yeah, I can totally see this. I think this is part of the problem with trying to judge something as 'young and cool' - it really depends on the particular subculture. Because of my own location and particular musical background, when you talk about a music magazine aimed at an edgy local music scene, I automatically associate that with something a lot more urban and dance-based (with connections to a completely different graphic style, influenced by graffiti culture, etc).</p>
      <p>Maybe it would be helpful for you to be a bit more specific about the type of music culture that this magazine will cover, and thus the audience it's aimed at?</p>
      <p>As for the most recent batch of sketches - I don't personally think the 'track line' on the second works, or adds anything to the logo. The more I look at the third one, the more I like it! I didn't really get a good feeling from it at first, but it's definitely grown on me - I like the fact that it's become a continuous line with a single flourish halfway, rather than a kind of ongoing loop with projections all round. I do think that the outer diagonal line of the four should follow the same line all the way down - not suddenly having a vertical edge where it hits the crossbar. Does this make sense? I couldn't think of a clearer way to say it!</p>
      <p>Just a final quick question - are you still using a typeface first and then 'extending' it with vector shapes? Your OP seems to suggest this, and if so this is probably why some of the sketches are a little uneven. If this is the case, it might be worth working on this in a purely geometric way, to make sure that line is a bit more even like this - a lot of the time, a geometric logo like this doesn't 'click' until it's <em>really</em> even.</p>
      <p>Sorry about the essay!</p>
      <p>Andi</p>
      <p>[<a href="http://www.semibad.com" rel="nofollow">semibad</a>]</p>
