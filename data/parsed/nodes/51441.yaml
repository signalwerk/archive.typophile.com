      <p>Hi guys,</p>
      <p>Been following this thread for a little while - I really love these crit threads, although I rarely have much to add!</p>
      <p>I've just been looking at the mark (both the originals and the later suggestions) and my personal feeling is that it would be considerably improved by losing the outer 'flourishes' altogether. I did a little mockup (which incidentally I hate doing - feels wrong changing somebody else's work) based on the suggestion istariskoda put up a few posts ago:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/f4_5144.jpg"></div><p></p>
      <p>For one thing, I think this improves the legibility of the mark a fair amount. It also leaves it much more compact, which I always think is helpful for a logo - obviously it will mainly be used on the cover, but you never know what other contexts it'll end up being used in! I also think paring it down like this might be helpful from a 'hip, cool' point of view (saying that makes me feel much older than I am) - I think it feels a bit fresher with straight edges and overtones of emoticons/faux-asian characters.</p>
      <p>Finally, it'll stop everyone referencing the apple command key! Which can only be a good thing :)</p>
      <p>Anyway, it's just an idea. For the record, I really like the idea, and think you're onto something - but it's not there yet. I sort of think the idea itself is the square with the two protrusions - the flourishes are simply decoration.</p>
      <p>Good work with this one, can't wait to see how it turns out. Keep us informed!</p>
      <p>Andi</p>
      <p>[<a href="http://www.semibad.com" rel="nofollow">semibad</a>]</p>
