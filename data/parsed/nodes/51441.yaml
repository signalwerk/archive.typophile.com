    html: |-
      <p>If it's a music zine, that's not coming across. If it needs to say "F4," that isn't coming across. I definitely picked up on the Apple "Command" symbol that some others have mentioned, but that could be because I work at a Mac all day.</p>
      <p>The other meaning I could derive from the sketches, the one I think you were going for, is a sort of futuristic (not futurist), slick, electronic attitude. If that is your aim I think you're on the right track, and you could intensify that message by drawing the next round of sketches on an even more restrictive grid.</p>
      <p>I think you could try looking deeper into the meaning you're trying to convey, too. Musically speaking, "F4" is the note F just above middle C, although why that has significance to the zine is beyond me.</p>
