    html: <p>A is the better of the latest bunch but perhaps, to make it even more apparent, remove the crossbar connecting the 4 back into the F. I think your 4 would then become more noticeable. Or perhaps think about changing the color values so the F and 4 would remain black while the connecting "pieces" would be a dark gray. Bonus if you can get the color values to blend nicely into each other.  Just some thoughts to help the F and 4 stand out a bit more while maintaining your "connected" concept.</p>
