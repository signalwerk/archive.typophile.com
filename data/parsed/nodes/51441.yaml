    html: |-
      <p>Sorry scott. Ratbaggy made a very sensible comment. I don't know why you felt offended in the first place. Sorry but your logo isn't legible at all. You have to read this thread to know it's supposed to say F4. If you don't believe us, just print it out and hand it over to strangers. Young or old, majority WON'T read it as F4. And if you wan't them to refer to the magazine as F4 magazine, they will have to read it somewhere it's an F4 magazine. Otherwise it'll just be some symbol magazine. Do you intend to use words "F4 magazine" in the headline as well?</p>
      <p>So I guess his comment is legit. If you need your magazine head to actually read F4, than you're on a completely wrong track. If legibility is not important at all (but originality is) than this is the logo to go.</p>
      <p>Any comment is welcome, even though you may see it as negative. You will have to judge whether you take some advice or not. No need to label people here as "as**oles"...</p>
      <p>And one more observation: I've seen the lines in the last batch are not straight. Maybe that's an error. And they also vary from logo to logo.</p>
      <p>And to make it look more like mac's command symbol maybe don't put the top stroke of "F" into two levels. Just keep it straight and go into the top right loop. If you intend to keep the two levels, then make the change a bit more to the right, because it interferes with the "F".<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
