    <p>Hey friends! I'm doing a little work for a local 'zine' thats going to review the local music scene, it's called F4 and I'm designing the logo.  Here I have a couple examples, I'm using MUSEO and I want to ask you guys about some legibility. I was concerned that the '4' form would not be recognizable in sketch (a) so I broke the stroke of the 4 at the top in sketch (b). How do you feel about the legibility of sketch a and the odd broken 4 of sketch b?</p>
    <p>please excuse the rough edges of these sketches.</p>
    <p>a:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/f41_6144.png"></div><br>
    b:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/f42_5948.png"></div><p></p>
    <p>Thanks!<br>
    -Scott Sullivan<br>
    <a href="http://www.trifepdgm.com" title="www.trifepdgm.com">www.trifepdgm.com</a></p>
