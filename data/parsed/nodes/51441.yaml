    date: 2008-11-09T19:37:00
    votes: null
    html: <p>Hey Scott, first off I like the icon overall in terms of how it looks, BUT, if you ask for a critique on a typophile one of the main issues will always be legibility. The logo you've designed doesn't read "F4." if that's not a concern to you I don't think you're going to get much positive feedback from this group. If you're pleased with it go with it! Personally I would encourage you to develop your idea into a form where "F4" is more legible.</p>
