      <p>It's an amalgam: the A is based on a nineteenth-century typeface called Columbian. P22's version is here...</p>
      <p><a href="http://typedia.com/explore/typeface/p22-victorian-swash/" title="http://typedia.com/explore/typeface/p22-victorian-swash/">http://typedia.com/explore/typeface/p22-victorian-swash/</a></p>
      <p>The balance of the letters are in a Latinesque face, many of which are available.</p>
