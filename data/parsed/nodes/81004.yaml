      <p>Also, from the Solopedia:</p>
      <p>"Glorietta (Solotype), Many others, including P22 Victorian Swash, Trinigan FG (Fontgrube), Goodfellow (Scriptorium), Bluegum Forest (Tris Nguyen, corrected by MEG). Originally Columbian."</p>
      <p>Neat label.</p>
