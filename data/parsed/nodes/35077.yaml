      <p>But there’s a lack of kerning in these headings. Flash supports* kern definitions for embedded font in dynamic text field but this requires “kerning” property set to “true” in StyleSheet or TextFormat, which is “false” by default. JavaScript file, which implements these “flashish” headings on Typophile does not define this property. This should be confronted with appropriate developer.</p>
      <p>* There’s one strange hack – reference says, that kerning in Flash is supported only in swfs created on Windows.</p>
