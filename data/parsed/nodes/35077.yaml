      <p>Text antialiasing improved a lot in version 8 of Flash Player.</p>
      <p>But sIFR 2 is by default set to target FP version 6. Which means: even if a more recent version of the FP is installed, text is rendered like in version 6.</p>
      <p>To get the better text rendering of FP8, it is necessary to change the Flash Version to 8 under Publish Settings, set the TextField antialiasing setting to “Anti-alias for readability”, and republish the SWF file.</p>
      <p>sIFR 3 beta is already available and targets FP8, but it seemed very buggy last time I tried it.</p>
      <p>— <a href="http://www.omine.net/">omine.net</a></p>
