      <p>This is from the <a href="http://www.typophile.com/node/35068">License Myriad Pro in CS2 Package</a> thread:</p>
      <p><strong>DanGayle</strong>:<br>
      The file that is used by sIFR is basically the digital font embedded in a .SWF Flash file. I’ve seen websites that clearly violate the spirit of the EULAs by distributing that .SWF across the internet for free, possibly just renaming the .SWF file.</p>
      <p>I know in my heart of hearts that that is wrong, but where does that stand legally?</p>
      <p><strong>sii</strong><br>
      If you take the position that in this case the .SWF is a derivative font, then for sure this would break most font EULAs. Someone would need to go after one of these guys to prove that. Obviously that ’someone’ would not be Adobe. ;-)</p>
      <p>In the past I don’t think type designers have shown any interest in testing the limits of Flash and font encapsulation. Turning a blind eye often comes back to bite you. This may be a case of that, and who wants to be bitten by a blind eye.</p>
      <p>I recall writing to the lead developer of Flash before it was even a Macromedia asset, regarding respect for embedding permissions. I don’t recall the exact answer but I don’t think it was positive. I have no idea what Flash does now.</p>
      <p>This was a loooooooong time ago, and my employer at the time was probably a temp agency. In addition I think the type community’s lack of interest in Flash extended to MS as well as everyone else. It’s been a few years since the product was aquired by Adobe so they must be doing the right thing. Anyone tried embedding a no-embedding font using Flash?</p>
      <p><strong>Miss Tiffany</strong><br>
      Unless my most recent research has a major error — Thomas please correct me! — Fonts licensed from Adobe which are from Adobe Originals, Bauer, &amp; other wholly-owned fonts by Adobe can be used embedded in things such as sIFR.</p>
