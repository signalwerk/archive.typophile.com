      <p>Life promises to get interesting over the next year or so, because you can <em>also</em> do sIFR-like stuff using Safari/Firefox Canvas (which implements cubic drawing natively), and of course the MS platform gives you a bunch of different ways of accomplishing more or less the same thing, as long as you’re willing to drink their kool-aid.</p>
      <p>Incidentally, the distortion in pre-8 Flash is not because it’s based on quadratics per se (remember, native TrueTypes are quads as well), but because that conversion is done crudely. I’d guess that they implemented conversion from Type1 a long time ago and never really had a chance to redo it right. That is, of course, until Flash 8, where they reimplemented the whole font stack from scratch. The free software communist in me doesn’t like it because it forces you to use proprietary tools, but that’s probably not as important a consideration for most of the people here.</p>
      <p>I think Adobe does a pretty good job of pushing new Flash versions. It’s probably reasonable to expect version 8 or better, especially if you can just fail to the wrong font, rather than to a totally broken page.</p>
