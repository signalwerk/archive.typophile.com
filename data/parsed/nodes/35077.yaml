      <p>Pro: It’s really the only way to switch html text to your own font on the fly.</p>
      <p>Cons: Flash is based on quadratic curves, not bezier, so there is some distortion of the letterforms that savvy folks will notice. It can also be slow to load if you have a lot of sIFR or your server is weak.</p>
      <p>It’s become more popular, with even some major corps employing it, but I don’t think it’s quite mainstream yet.</p>
