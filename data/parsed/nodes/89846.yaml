    <p>Hagel is my latest typeface. It's still in an early development stage and right now I'm focusing more on my grotesque 'Celcius'. Now and then though I work on Hagel.</p>
    <p>The concept is to develop a fairly condensed, clean and modern serif with some classical elements.</p>
    <p>Hagel v.6: <a href="http://www.fichier-pdf.fr/2012/02/12/hagel-v6/hagel-v6.pdf" title="http://www.fichier-pdf.fr/2012/02/12/hagel-v6/hagel-v6.pdf">http://www.fichier-pdf.fr/2012/02/12/hagel-v6/hagel-v6.pdf</a><br>
    Hagel v.7: <a href="http://www.fichier-pdf.fr/2012/02/12/hagel-v7/hagel-v7.pdf" title="http://www.fichier-pdf.fr/2012/02/12/hagel-v7/hagel-v7.pdf">http://www.fichier-pdf.fr/2012/02/12/hagel-v7/hagel-v7.pdf</a><br>
    Hagel v.8: <a href="http://www.fichier-pdf.fr/2012/02/12/hagel-v8/hagel-v8.pdf" title="http://www.fichier-pdf.fr/2012/02/12/hagel-v8/hagel-v8.pdf">http://www.fichier-pdf.fr/2012/02/12/hagel-v8/hagel-v8.pdf</a><br>
    Hagel v.9: <a href="http://www.fichier-pdf.fr/2012/02/12/hagel-v9/hagel-v9.pdf" title="http://www.fichier-pdf.fr/2012/02/12/hagel-v9/hagel-v9.pdf">http://www.fichier-pdf.fr/2012/02/12/hagel-v9/hagel-v9.pdf</a><br>
