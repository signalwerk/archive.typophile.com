      <p>The links should direct you to the PDF immediately. What kind of issue were you experiencing?</p>
      <p>I absolutely hate Dropbox. You have to share a folder on your computer which is my first concern. My second concern is that the whole procedure takes me too much time. Also, wouldn't I have to invite all of you before you can download any files? My biggest concern though is that it literally takes 4 times longer to upload files than at a random file sharing website. I admit that won't be an issue with these 200kb PDFs but I don't want to use a different system for different file sizes. I need a reliable all-purpose system, and so far I'm actually very satisfied with <a href="http://www.fichier-pdf.fr" title="www.fichier-pdf.fr">www.fichier-pdf.fr</a></p>
      <p>If you have other suggestions I would love to hear it, but Dropbox is really not for me.</p>
