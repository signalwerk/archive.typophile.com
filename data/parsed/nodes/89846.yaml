    html: <p>I'm having a bit of a dilemma regarding the widths of the letters. As I mentioned I want this typeface to be quite condensed. However I also like the idea of a humanist serif in a modern jacket, so I would like to at least keep the 'o' rounded and the 'H' quite wide. The 'b' could be a little more condensed I suppose. I made the 'a' slightly wider as well in v.12.</p>
