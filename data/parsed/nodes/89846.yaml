      <p>The eye of the italic /e/ should slope down more near the stem I think.</p>
      <p>Also, the direction of Hagel is not quite clear yet but I quite like to adapt a few Garamond elements. What are your thoughts about an italic /h/ like in Garamond with an inward serif on its leg? I want to keep the construction modern though.</p>
      <p>I also might have to make the italic h/n slightly wider.</p>
