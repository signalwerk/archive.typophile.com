    <p>Hinting in the x-direction have a tendency to introduce a lot of problems (rounding errors?) with the spacing. Things turn out very uneven, and unfortunately also uneven between the Standard rendering and Cleartype. </p>
    <p>From what Beat told me, the best method is to round the left sidebearing with a single link tied to the left edge of the first stem, and leave the right sidebearing free. This yields relatively good results in CT, but looks like horseshit in greyscaled or bitmapped rendering.</p>
    <p>I could always go nuts with delta’s, but they have the same effect on all rendering outputs, so <em>I’m left with no way to fix something in Standard and keep it as is in Cleartype.</em></p>
    <p>Can anyone shed some light on this? </p>
    <p>I’m hinting with Fontlab, yes. I realize VTT is the next logical step, but is FL really that bad?</p>
