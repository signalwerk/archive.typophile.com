      <p>In FontLab at least, I don't think there is a solution you could apply to the Standard rendering that wouldn't also have some affect on the ClearType. But it seems to me from your screenshots that the places where you have spacing problems in Standard rendering are also problematic in the ClearType.</p>
      <p>As you note, you can delta the right sidebearing, but if you put x hints on the stem distances too, which I thought you would be doing for Standard rendering, then you have the option of putting a rounded link from the right side of the letter to the sidebearing.</p>
