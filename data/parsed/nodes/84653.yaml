      <p><em>If you for example look at the a’s and n’s at 14 ppm, you’ll see the unconsistent results.</em></p>
      <p>Actually, I think the inconsistency is in the h's and n's; the a's look comparable. Either your CT h and n counters are too wide or your greyscale h and n counters are too narrow. So one way to fix this would be to delta the right stem to make these counters wider in the greyscale, presuming these deltas are ignored by the CT renderers.</p>
      <p><em>I would get roughly the same results if I linked it to the right edge of the right stem, no?</em></p>
      <p>You probably want to avoid hinting inwards from both sides, because this will tend to squish letters at sizes where the sidebearings round inwards. This is why I always hint from left to right across the glyph. So if you link from the right edge of the right stem to the right sidebearing, you want the stem to be the origin of that link.</p>
      <p><em>...a counteract against the thinning you tend to see in rounds and circular glyphs with greyscale rendering.</em></p>
      <p>Your smaller sizes are much greyer than what I was achieving at those sizes by adding stem hints.</p>
      <p><em>a rendering that is more similar to the real weight in other environments</em></p>
      <p>I don't usually consider 'real weight' to be a hinting goal. Hinting is a means to adjust outlines to make them size specific in crude resolutions. Stem weight is one of the factors of type design that is properly size specific, so I use hints to try to achieve the best weight in terms of legibility, stem density and contrast for each size. Subpixel rendering environments take this ability away to a considerable extent (in the x direction in CT and in both directions in Quartz at most sizes), but so long as you are trying to target XP greyscale too, I would consider x stem hints important.</p>
