      <p>The thing with the loose right edges (thank you db!) is not only a rendering that is more similar to the <em>real</em> weight in other environments (CT, Quartz), but also a counteract against the thinning you tend to see in rounds and circular glyphs with greyscale rendering. </p>
      <p>Anyway, from how I understand the rounded single/double link logic in Truetype. I would get roughly the same results if I linked it to the right edge of the right stem, no? I’ll see if I can post examples of this later when I’m on the other PC, but it does not become any better. Just worse, for CT. Btw, most of my glyphs look like your n, only without the rounding on the stems. My n however looks just the same without them, and file size is crucial for web fonts.</p>
      <p>If you for example look at the a’s and n’s at 14 ppm, you’ll see the unconsistent results.</p>
