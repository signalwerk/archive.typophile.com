    html: "<p>Re brackets. This is a grammar issue not a typographical one. <br> <br>Pace Robert Johnston, there is no rule that parens may not contain a whole sentence, or for that matter a whole paragraph. The only rule is: if the parens contain a full and separate sentence, then they enclose the concluding full stop. (I could, if you like, give an example.) If the sentence is not complete, the punctuation falls outside the parens (like this). That remains true even if the matter in parenthesis could have been a complete sentence if one chose to make it so. <br> <br>To this there is one exception: if the brackets contain a question or an explanation (do they ever? yes!) then the concluding stop falls inside the brackets, even when the sentence in which they are embedded remains to be concluded.</p>"
