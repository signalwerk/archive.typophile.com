  html: "<p>Just wondering what the conventions are for date formatting ie. separators, and text within brackets. <br> <br>For dates which is the conventional way to format a date? <br> <br>11/05/04, or 11.05.04. If the former is correct, is the latter acceptable? <br> <br>For brackets my question is in regard to capital letter usage. <br> <br>Example 1: <br>\"Please forward the information to me by mail (please tick).\" <br> <br>Should it be (Please tick)? I think the correct way is lower case, but I just want to be sure. <br> <br>Example 2: <br>\"(One complimentary ticket is included upon entry)\". <br> <br>I think the correct way here is uppercase, again not 100% sure. <br> <br>If it's how I think it is, you should only use uppercase for text inside brackets when the information within the brackets is a new sentance.</p>"
  html_clean: "<p>Just wondering what the conventions are for date formatting ie. separators, and text within brackets. <br> <br>For dates which is the conventional way to format a date? <br> <br>11/05/04, or 11.05.04. If the former is correct, is the latter acceptable? <br> <br>For brackets my question is in regard to capital letter usage. <br> <br>Example 1: <br>\"Please forward the information to me by mail (please tick).\" <br> <br>Should it be (Please tick)? I think the correct way is lower case, but I just want to be sure. <br> <br>Example 2: <br>\"(One complimentary ticket is included upon entry)\". <br> <br>I think the correct way here is uppercase, again not 100% sure. <br> <br>If it's how I think it is, you should only use uppercase for text inside brackets when the information within the brackets is a new sentance.</p>"
