    html: "<p>Dates: slashes are used more in the US and UK, periods used more in continental Europe (in my experience). Both are acceptable. You've got to watch the order though -- US is MM/DD/YY, UK/Europe is DD/MM/YY. More people these days are using YYYY at the end because of the awkward zero. <br> <br>Brackets: always lowercase. New sentences should NOT start within brackets. Parentheses are always contained withing a parent sentence. The only exception is if you're quoting, where the speaker is beginning a new sentence (which will obviously be preceded by an open quote within the open bracket). <br> <br>R</p>"
