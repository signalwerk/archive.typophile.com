    html: "<p>My bad, Paul. I'm being overprescriptive and confusing grammar with style. <br> <br>I should clarify that, while all that you say is right on the button, stylistically entire sentences within brackets are to be avoided.  <br> <br>Consider: <br> <br>Nine cases have been identified. (Six were fatal overdoses and three were non-fatal overdoses.) <br> <br>vs. <br> <br>Nine cases have been identified. Six were fatal overdoses and three were non-fatal overdoses. <br> <br>vs. <br> <br>Nine cases have been identified (six fatal overdoses and three non-fatal overdoses). <br> <br>As far as I've been taught, the first one is, as you say, grammatically unassailable -- but stylistically wack. It's effectively kind of a tautology to use both brackets and a new sentence. There are, I imagine, instances when it's necessary, but on the whole the less punctuation you can get away with the better. <br> <br>You're right on the rules -- I'm right on the style. I think. <br> <br>R</p>"
