      <p>For additional sources on this topic you may want to have a look at Pelli's and Legge's works, both of which offer most of their papers as PDFs:</p>
      <p><a href="http://www.psych.nyu.edu/pelli/papers.html" title="http://www.psych.nyu.edu/pelli/papers.html">http://www.psych.nyu.edu/pelli/papers.html</a> and<br>
      <a href="http://vision.psych.umn.edu/~legge/psychread2.htm" title="http://vision.psych.umn.edu/~legge/psychread2.htm">http://vision.psych.umn.edu/~legge/psychread2.htm</a></p>
      <p>I also found these very interesting:</p>
      <p>Anstis, SM, "Size Adaptation to Visual Texture and Print: Evidence for Spatial-Frequency Analysis", The American Journal of Psychology Vol. 87, No. 1/2, 1974, pp. 261-267</p>
      <p>Morris, RA, "Image Processing Aspects of Type", EP88 Conference on Electronic Publishing, 1988</p>
