    <p>MICR: Magnetic Ink Character Recognition</p>
    <p>The MICR typeface is <a href="/wiki/fixed-width" class="freelinking" rel="nofollow">fixed-width</a> and contains 14 characters: the numerals 0-9 and four custom symbols for use in bank processing- Transit, Amount, On-Us, and Dash.</p>
    <p><strong>External Links</strong><br>
    <a href="http://typographi.com/000539.php" rel="nofollow">Typefaces inspired by MICR</a> (Typographica)</p>
