    html: |-
      <p><a class="freelinking external" href="http://font.ubuntu.com/" rel="nofollow">Ubuntu</a> has just gained a monospaced set, too.</p>
      <p>No idea if <a class="freelinking external" href="http://cm-unicode.sourceforge.net/" rel="nofollow">CMU Typewriter</a> is to your palate.</p>
      <p>There's also <a href="/wiki/https%3A/%252Ffedorahosted.org/liberation-fonts/" class="freelinking" rel="nofollow">Liberation</a> Mono and its big sib, <a class="freelinking external" href="http://www.omgubuntu.co.uk/2010/09/download-and-use-the-new-chrome-os-fonts-in-ubuntu/" rel="nofollow">ChromeOS Cousine</a>.</p>
      <p>Hunting through the fixed-width/typewriter sections on DaFont and FontSquirrel will likely yield groans and grins.</p>
      <p>Then there's <a class="freelinking external" href="http://www.f25.cc/" rel="nofollow">F25 Digital Typeface Design</a>, which has a few monospaced faces available. Might be too specialised, though.</p>
