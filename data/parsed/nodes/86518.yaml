    <p>Hi,</p>
    <p>I'm a recent design graduate, currently in the process of putting together<br>
    my arsenal of regular fonts to do battle with, and I could do with a couple of<br>
    decent monospace fonts being added.</p>
    <p>Can anyone recommend some for me to look at. Preferably that work well<br>
    for contact details on stationery, and when coupled with a sans etc.</p>
    <p>Thanks,</p>
    <p>—B</p>
