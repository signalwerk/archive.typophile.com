    html: |-
      <p>News Gothic looks quite nice (though not as beautiful as on Adobe Typekit, but I guess that's due to different rendering techniques), but Source Sans Pro doesn't render that well here. Here's a <a class="freelinking external" href="http://i1231.photobucket.com/albums/ee503/msilvertant/Lindesvaumlrd.jpg" rel="nofollow">screenshot</a>, though it's slightly blurry, which is not how your text renders.</p>
      <p>It's not very bad though. Helvetica is much worse on the web in a Windows environment. But if you look at the /R in Source Sans Pro, I don't think it's hinted properly. The bowl of /p and /b also renders too wide I think.</p>
      <p>Rendering aside, the typefaces do work quite well together, but I'm not quite sure why it's important to have the same x-height here.</p>
