    html: |-
      <p>I'm using Chrome, but it looks the same in other browsers. I think it has to do with the differences in rendering methods of text on Mac and Windows.</p>
      <p>I think the x-height is relevant if you're going to use the typefaces at the same point size. Otherwise, I think the stronger feeling of kinship is mostly an appreciation of consistency and has no actual effect on the aesthetics. I might be wrong though.</p>
