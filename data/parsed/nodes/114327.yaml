    html: <p>Hi Martin, thanks for your input. You're right. Source Sans looks awful in the image you linked to. Hm, wonder why. What browser? In my browsers on the Mac, the page has a far better look-and-feel. Regarding similar x-height, I think it creates a stronger feeling of kinship between the two faces. Maybe not a critical issue but I do think it matters.</p>
