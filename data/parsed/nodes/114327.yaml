  html: <p>Hi, I would like som opinions on my work combining the classic News Gothic typeface with the modern face Source Sans Pro by Paul Hunt on my website. I think the two pair well together, due to e g similar x-height, but I'm sure you guys have some valuable feedback. What do you think? <a href="http://lindesvard.se" title="http://lindesvard.se">http://lindesvard.se</a></p>
