      <p>Thanks everybody for the replies. I'm attaching an in progress version of what I'm working on. </p>
      <p>In the example I have something very western looking, but the weight of the 'W' is off compared to the other characters (too light at the bottom), and so I'm looking for something else. I've tried manually creating the effect on several fonts I already have, and it just hasn't been working out. I've also been through dozens of western fonts to no avail, so I've decided to open it up beyond that. </p>
      <p>The way Boink Drop Shadow and Cameo Antique utilize the drop shadow is what I have in mind technique-wise but the characters aren't the right fit style-wise. </p>
      <p>I'm looking for something that will fit the style of the illustration, so I was thinking something that is bold, uniform, and somewhat lighthearted. It could be something really stylized like what I have in the example, or something more neutral like Prismatic, just as long as it fits with the illustration. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stl-inprogress_4851.png"></div><p></p>
