      <p>Somehow I don't think that the Conqueror family is what Elias has in mind. But what IS desired isn't particularly clear either.</p>
      <p>Wha general style are you looking for - there are display fonts like <a class="freelinking external" href="http://www.linotype.com/660993/Drop%20Shadow-product.html" rel="nofollow">Boink Drop Shadow</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/oldstock.php" rel="nofollow">Old Style wood types</a>, <a class="freelinking external" href="http://www.ffonts.net/CameoAntique.font" rel="nofollow">simpler fonts like this</a>, and many more.</p>
