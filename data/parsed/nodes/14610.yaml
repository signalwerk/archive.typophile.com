      <p>I'm sure that this is for print application but note that on screen especially under ClearType (and clones) these fonts almost dissapear. In contrast under b/w rendering with drop-out control set you always have at least one pixel stems with even the thinest of thin font. Case in point Courier New on Mac OS (on Windows OS-level tricks are used to add bulk to the rendering)</p>
