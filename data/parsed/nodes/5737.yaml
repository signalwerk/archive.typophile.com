    html: "<p>If one of the things you were looking for is 'authentic' Baskerville, that should be found in the one John just mentioned. In his description of the font in the \"Indie Fonts 2\" book, Franta Storm says: \"Until recently, the story of this typeface ended with mediocre digital versions, which did not get at the root of its inspiration. We selected as the most successful models for the digitization of this typeface its Roman and italics in the size of about today's 14 points, which Baskerville used for the printing, among other things, of his folio Bible in 1763, and Vergil's works in Latin in 1757.\"  <br> <br>Yet he also states later in the same commentary: \"Even creators of genius, however, make mistakes, sometimes, and, therefore, in spite of the fact that we officially speak about 'a transcription, ' what was involved in the case of all complementary designs was a fairly fundamental reworking. Our aim was not so much to be reverently faithful to the  original, as to preserve the spirit of the typeface and breathe new life into it.\" <br> <br>So there you have it, faithful, but reworked.  <br> <br>Isn't the point really whether you like it? This is not a question with a right answer. If you like it, and if your client likes it, who else do you want to please?</p>"
