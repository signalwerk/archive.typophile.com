  html: <p>I can only speak for the reason why I didn't try to answer.  <br> <br>It sounded like any answer we could give would be nothing more than subjective opinion. Who knows what your idea of a 'true' <i>Baskervillian</i> font would be? You said you were already familiar with most of the Baskervilles out there and found them lacking. <br> <br>This is the Type Identification Board, where we see a picture of some type and try to identify it.  <br> <br>There are other forums at Typophile that are more along the philosophizing lines your question seems to want to go. It might have been better to post it on one of those forums, although we have had our share of philosophizing here, goodness knows. <br> <br>Your criteria seemed much better defined in your mind than they were likely to be in mine, and with Baskerville dead, who could give the 'right' answer? <br> <br>I would have said Fry's Baskerville, because I am not sure that Baskerville originally had an Italic face. But that's me.</p>
