    <p>Anyone here use Speedball pens for drawing up drafts? I just got a 24-nib set, new-in-box, off Ebay and am really excited to try ’em out. I was totally in the dark about the Speedball thing, knowing only vaguely about the world of “nibs.” No idea about the whole practice of Roman and sans-serif lettering with this funky old ink-pen. Must be my age— born under the sign of Nixon...</p>
    <p>Anyway, I’d also be interested to know what other sorts of hand-drawing or other handicrafts people do when designing type, besides, you know, sketching with a pencil on a pad of paper. (One of my favorite activities in a “document design” class I teach in my department is having students design a letterform with Sculpey.)</p>
    <p>- Jay</p>
