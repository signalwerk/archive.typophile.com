    <p>Anyone know what the ContactMe logo is?:</p>
    <p><a href="http://www.contactme.com/" title="http://www.contactme.com/">http://www.contactme.com/</a></p>
    <p>It's similar to House Industries Studio Sable, but has some significant differences all the same:</p>
    <p><a href="http://www.houseind.com/fonts/studiolettering" title="http://www.houseind.com/fonts/studiolettering">http://www.houseind.com/fonts/studiolettering</a></p>
    <p>And while I'm getting an ID (cheers!) does anyone know what the MyFonts logo is?:</p>
    <p>myfonts.com</p>
    <p>Is that a bespoke jobby, or is it available as a typeface? Can anyone recommend anything similar?</p>
    <p>This is my first post on here (though I've garnered plenty of useful bits and bobs through occasional visits as a passer-by), so many thanks for any help in advance.</p>
