    html: |-
      <p>I'm with Tiffany, I go into long swoons with fonts and then deep six them for awhile. It really depends on what I'm working on.</p>
      <p>I tend to keep Gotham open, tho, along with Thesis and Today Sans and for serifs my fallbacks lately are Adobe Garamond and Filosofia.</p>
      <p>But I've got a bunch of stuff open right now from Tribute to Meta to Klavika, Caecilia, Requiem, Jigsaw, Dalliance, Abadi, and some weird agitated scripts I was looking at for a book cover.</p>
