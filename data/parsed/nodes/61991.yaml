      <p>&gt; Why is it SVG can be made to render consistently, but CFF/TTF fonts can’t?</p>
      <p>CFF/TTF fonts do render consistently (and well enough), if they are used large enough.<br>
      And my guess is that SVG fonts, (an actual web font format), will not render consistently, (or well enough) if scaled small enough.<br>
      Though this is pretty simple, it ain't been edyoukaded yet. </p>
      <p>Cheers!</p>
