  html: |-
    <p>Who saw this coming? ;-)</p>
    <p><a href="http://jayrobinson.org/2009/09/11/some-notes-on-itunes-lp/" title="http://jayrobinson.org/2009/09/11/some-notes-on-itunes-lp/">http://jayrobinson.org/2009/09/11/some-notes-on-itunes-lp/</a> </p>
    <p>Scroll down to "WebKit and iTunes LP Internal Structure"</p>
    <p><cite>The iTunes LP experience is accomplished with HTML 4.01, CSS and JS. The interface feels very Flash-like, but there is no trace of it. The CSS animations are elaborate and smooth. Font files are referenced with an @font-face declaration in the CSS but there seems to be little to no use. Most text, even long passages of lyrics, is represented visually with a PNG file. I wonder if they originally intended to use font replacement for all text, but changed their mind.</cite> </p>
    <p>Font licensing fun aside I wonder what the image-centric nature of the text does for accessibility?</p>
