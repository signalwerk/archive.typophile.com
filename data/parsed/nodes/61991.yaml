    html: |-
      <p>From Apple's "Design Best Practices" document:</p>
      <p>&nbsp; &nbsp; &nbsp; <strong>Fonts and Scrollbars</strong></p>
      <p>&nbsp; &nbsp; &nbsp; • &nbsp;<strong><em>Don’t use Open Type.</em></strong> When using fonts, use SVG fonts, which<br>
      &nbsp; &nbsp; &nbsp; are small, render quickly, and scale better. The fonts to be turned<br>
      &nbsp; &nbsp; &nbsp; into SVG fonts need to be legally cleared for use within the iTunes<br>
      &nbsp; &nbsp; &nbsp; LP or iTunes Extras, and should be distributed in the package as an<br>
      &nbsp; &nbsp; &nbsp; SVG font to restrict consumer usage of the font. </p>
      <p>&nbsp; &nbsp; &nbsp; However, it is often better to use images rather than SVG fonts.<br>
      &nbsp; &nbsp; &nbsp; See the next two suggestions.</p>
      <p>&nbsp; &nbsp; &nbsp; • &nbsp;<strong><em>Use buttons instead of live text for menus.</em></strong> Use images for menu<br>
      &nbsp; &nbsp; &nbsp; buttons, instead of an SVG font. This has a couple of advantages:</p>
      <p>&nbsp; &nbsp; &nbsp; » Rendering is the same on all platforms (Mac, Windows, Apple TV).<br>
      &nbsp; &nbsp; &nbsp; » You have more control over spacing of text since you can use kerning<br>
      &nbsp; &nbsp; &nbsp; and other ways to make the text smaller or bigger, depending on how<br>
      &nbsp; &nbsp; &nbsp; much space the design allows.<br>
      &nbsp; &nbsp; &nbsp; » No potential fonts rights issue.</p>
      <p>&nbsp; &nbsp; &nbsp; • &nbsp;<strong><em>Use a JPEG for large blocks of text.</em></strong> Instead of using live text from a<br>
      &nbsp; &nbsp; &nbsp; font for a song list or lyrics, make the list or lyrics an image.</p>
      <p>&nbsp; &nbsp; &nbsp; You have more control over sizing and spacing, which can be useful on<br>
      &nbsp; &nbsp; &nbsp; lyrics pages where space is limited or for long, one-line lyrics that<br>
      &nbsp; &nbsp; &nbsp; might not fit.</p>
      <p>&nbsp; &nbsp; &nbsp; JPEGs are smaller than fonts and compressed, so one small image gets<br>
      &nbsp; &nbsp; &nbsp; loaded into memory instead of larger-sized font elements.</p>
      <p>&nbsp; &nbsp; &nbsp; By putting lyrics in an image, the text can’t be copied and pasted (legal<br>
      &nbsp; &nbsp; &nbsp; considerations).</p>
      <p>&nbsp; &nbsp; &nbsp; Rendering is the same on all platforms.</p>
      <p>&nbsp; &nbsp; &nbsp; No fonts rights issue (if there ever would be one).</p>
