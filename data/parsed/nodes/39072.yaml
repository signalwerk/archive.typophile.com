    html: "<p>Re: 2, if advice is warranted. Having come from a similar position about a year ago, I can tell you that if you keep looking at type, you will start to get better at distinguishing the peculiar feel of each typeface. I remember that I once couldn't see the differences between Helvetica and Arial or Galliard and Adobe Garamond (not to imply that the relationship between them is equivalent), but now it's clear as day. I'd recommend looking through a particular designer's oeuvre (such as Christian Schwartz, Jeremy Tankard, or Xavier Dupre) as a way to improve your ability to pick up on how good type communicates.</p>"
