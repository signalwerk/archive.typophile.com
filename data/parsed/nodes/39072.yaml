    html: |-
      <p>Thanks!</p>
      <p>Taking hints from posts here and from other forums, I went and deleted most of the fonts I'd installed. I came across a coreldraw 5 cd, and a thousand or so quaintly named look-a like fonts sounded like a good idea at the time...<br>
      Then I went back and only added ones I really wanted, where I was already aware of the original source.  They don't quite match up with their "inspirations", but it's better than too many or no interesting fonts.<br>
      Or maybe that's a bad idea, getting used to versions with different overall sizes and perhaps inferior kerning?</p>
