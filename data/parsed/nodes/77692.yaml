  html: |-
    <p>After a painstaking search to identify just the right handwriting font, I found this one, pasted a screenshot into an e-mail and sent it to a colleague for feedback. What I *didn't* do was note the name of the font, or bookmark the site. Now, of course, I want to license it and can't remember the name/vendor/foundry.</p>
    <p>It's an OpenType font with lots of alternate characters to create a more realistic simulation of handwriting.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/script_5658.jpg"></div><p></p>
