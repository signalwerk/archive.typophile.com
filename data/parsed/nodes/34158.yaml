    html: |-
      <p>&gt; I always thought they should both add up to 1000</p>
      <p>No, you have to factor in the talus (internal leading) as well.<br>
      For example in a font I’m working on the ascenders are 704,<br>
      the descenders are 256, the upper talus is 30 and the lower<br>
      talus is 10. You typically need some talus to avoid collisions<br>
      when leading is zero. But too much talus will make your font<br>
      less efficient and look discouragingly small on the body.</p>
      <p>BTW you don’t <cite>have</cite> to use 1000, although it’s the<br>
      safest so if you have no reason not to use it, use it.</p>
      <p>hhp</p>
