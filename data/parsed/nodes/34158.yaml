    <p>Should I be using the green emerald to fill in the font diemensions?</p>
    <p>If I click the logo it gives me a Ascender of 740 and a Desender of -219 but I always thought they should both add up to 1000, so should it be 740/-260. Also if I select the Cap Height figure the small window shows the uppercase H with the red line across the top but should this red line be slightly higher so it touches the top of the uppercase O.</p>
    <p>Is it best to set the Cap height and x height in the glyph window by dragging the dotted lines that repersent the Cap and x height.</p>
