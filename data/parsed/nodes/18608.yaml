    html: <p>This was NovelFonts’ version of the (predigital) VGC typeface Modula Bold. The only digital version of this weight that I know of was created by the now defunct Casady &amp; Greene. They called it <a href="http://www.moorstation.org/typoasis/designers/casady_greene/j_p.htm" target="_blank">Kasse FLF Bold</a> (there are three weights in the download).</p>
