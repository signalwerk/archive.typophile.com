    <p>Hey everyone.  I’m new to these boards, so let me take a moment to say hi.  :)</p>
    <p>I’m having a devil of a time tracking down a font called Obbsidda.  I did find a post on these forums from a couple of years back on it, but nothing else.  I’m guessing it used to go by the name Modular Bold, but the font that comes up by that name in Google searches bears no resemblence.  It was owned by NovelFonts.</p>
    <p>Does anyone know where I can get a copy of this font these days?  Or even a relatively decent proxy?</p>
    <p>Thanks in advance,<br>
    Tom</p>
