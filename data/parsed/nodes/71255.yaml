    html: |-
      <p>Hah, not really possible.</p>
      <p>Best method: actually learn some web design. You can only know the limits of a tool if you learn the tool itself.</p>
      <p>"design with pleasure not making boring work."<br>
      What made you think design is all pleasurable?</p>
      <p>Sorry, I'm just not a fan of people wanting to get a quick fix. If you want it done right, learn how to use Wordpress, learn HTML/CSS/PHP/Javascript, or hire someone to do it.</p>
      <p>In the end, the only way to get it from a PSD to Wordpress is to split up all the components into separate images and then format the website using CSS-controlled divs.</p>
