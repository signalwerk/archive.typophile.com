      <p>Eben, those two links of your aliased text samples are not working...</p>
      <p>The one thing I would say at this point is this:<br>
      You have a lot of blur, for something that worries about the screen. Now, considering your particular design constraint -that the outline foundation be decent- that's arguably unavoidable. However, it does mean you can shoot for more letterform fidelity, less orthogonality. This ties in to Glyn's observation about the "v": there doesn't seem to be a reason to have flat sides like a "u" (since it's going to be blurry anyway), and there is reason for it not to have flat sides it (since you would want to avoid ambiguity).</p>
      <p>BTW, could you put a character set?</p>
      <p>hhp</p>
