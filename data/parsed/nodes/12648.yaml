      <p>&gt; delta hints</p>
      <p>Yes, They are *totally* needed if you care about the b/w bitmap especially with my redesigned 'Yy' &amp; 'Xx'. My old ones would have behaved better but ...</p>
      <p>Actually I found a new way to design for b/w that I wish I had known before. I only figured this out this week when I was hinting; you have to make many round trips between type 1 &amp; tt hinting mode which means going from type 1 to tt outlines over &amp; over (which bites) but you can move your points around &amp; see what they are doing unhinted in multiple ppems. As it is my outlines are between 11 &amp; 12 ppem which is maybe a good thing since they don't 'break' completely in either. Still, if I was doing this all over I would probably build some basic shapes going back &amp; forth into tt &amp; adjusting things for minimum hinting. As it was I did this for the percent symbol &amp; it really paid off. That glyph would have been hell otherwise.</p>
      <p>&gt; One other thing: conventionally, the oldstyle “4” is descending.</p>
      <p>Ohhhh, I see. One more pixel down. Thanks!</p>
