      <p>I think you have a good start. A few observations:</p>
      <p>You need to use a bit more overshoot on the curves at the tops and bottoms of the rounded characters (A, C, G, O, Q, S, etc.). </p>
      <p>I would move the vertical stem of the f one "pixel" to the right. Same with the t.</p>
      <p>I agree with Tiffany about the m. I also think the top of it is looking clogged where the two strokes meet. You need to cut into it more like the bottom of the w.</p>
      <p>I would move the crossbar on the e up one "pixel". It seems out of step with the rhythm of the rest of the font.</p>
      <p>I think the A and R are a little too similar. The lower crossbar on the A helps, but it may be difficult to tell them apart in certain cases. You could do the top of the A like the bottom of the V. Or, you could put an angled tail on the R. Or both.</p>
      <p>Check the top of the z. It seems like it's not quite up to the x-height.</p>
      <p>The word spacing seems too wide. I would make it much narrower. (Just kidding.)</p>
