      <p>Proportional spaced software text? I think not.</p>
      <p>The characters in most software languages function in a different way to the same characters used to represent human languages. In software, each character has similar weight in terms of meaning. Grouping characters into words is just for human convenience. An error in a single character is not merely a typo: the software will not compile, or will malfunction. Conventional proportional spacing aids reading groups of characters as words. This does not help when reading software text, which very often needs to be read character by character.</p>
      <p>In my opinion, a monospaced design is beneficial to character-by-character reading, and is therefore most suited to rendering software text.</p>
      <p>On the topic of character-by-character reading, I have read of a psychological test (sorry, no ref), where monospace out-performed sans and serif proportional typefaces. As I recall, the test involved finding typos. Does this mean that writers (or at least proof-readers) should use monospace?</p>
