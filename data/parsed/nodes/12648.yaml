    html: |-
      <p><strong>Harmonising shapes</strong></p>
      <p>The vertical parts of the bowls on b, d, etc are rounded, whereas the same parts on c, e, and o are straight. I think these shapes should be consistent. I prefer the rounded shapes; it humanises the design.</p>
      <p>I like the arches on h and n. Why not use the same on u (by rotating the n), instead of the smallcap style? This could help disambiguate u and v.</p>
      <p>Small s and capital S have different arm styles. The closed style works on capital S, would it work on small s, or would the counters close up too much?</p>
      <p><strong>Letter spacing and width</strong></p>
      <p>The letter spacing and width appear to be dictated by the lower case bowls and arches. I would say the spacing is tight for a monospace design. This creates problems with m and w, which would like to be wider, but cannot 'rob' any space either side. Also, the narrow letters like 'i' and 'l' cannot fill the space enough to blend with the tighter spaced 'normal' letters, so you get light patches.</p>
      <p>Perhaps try loosening the spacing a bit. The words should not fall apart, because the word space is about twice what you would have in a proportional design.</p>
      <p>I think the cap height is the same as the ascent (I have not measured it). The caps would look less squashed if they were shorter. </p>
      <p><strong>Punctuation and other disambiguation</strong></p>
      <p>A programmer's font needs strong and unambiguous punctuation. The dots in your design are too light, I feel. The comma looks right. The different styles of brackets need to be clearly differentiated. The braces have a good shape, with a clear 'dink' in the middle. However, I would widen the braces and square brackets.</p>
      <p>I would lengthen the 'nose' on the figure 1, to disambiguate it from small l. My colleague wasted hours fixing some software which had both 'startl' and 'start1' in it, which appeared to be the same thing.</p>
      <p><strong>Disclaimer</strong></p>
      <p>I am not a professional type designer. I do it for fun. Please feel free to ignore everything I have said.</p>
