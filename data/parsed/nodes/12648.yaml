      <p>Eben, sorry it took me so long to take a closer look at this. I just realized what you're trying to do: make an outline font that looks decent enlarged but renders out nice grayscale bitmaps, and is monospaced on top of it! You're really shooting very high with this - the balance of compromises will surely be a bear to keep your head wrapped around... Good luck!</p>
      <p>The two main problems I see with your first effort on top (which you might or might not have fixed - it's not possible to really know from that PDF, without a bitmap rendering):<br>
      1) Yes, make the interletter spacing two pixels.<br>
      2) It's too fuzzy. Fixing this isn't just a matter of making the forms lighter, but also controlling better what partial-pixels they render out.</p>
      <p>As I'm sure you realize, there's a limit to how nice you can make the outlines look, without sacrificing the -more important here- screen rendering. This is because outline fonts rely on <strong>continuity</strong> to conform to aesthetic expectations, while bitmap fonts rely on <strong>discontinuity</strong> to avoid blur. I guess if you simply manage to make the outlines non-disgusting (which you're doing fine) that would be enough; don't try to make your outlines conform to the conventional standards of print font quality.</p>
      <p>As for the question you're having concerning Em/pixel-block proportions, I'm not sure where the issue is: as long as you choose a nominal point size that has an integer 75% value (to accomodate the "native" Windows dpi of 96) you should be OK. And a value of 8 (resulting in a pixel-block size of 125, in an Em of 1000) does that, plus it's sort of an informal standard in pixelfonts.</p>
      <p>--</p>
      <p>&gt; Does this mean that writers (or at least proof-readers) should use monospace?</p>
      <p>Indeed, there's immersive reading, and then there's deliberative reading. For the former, an efficient, well-proportioned font helps; but for the latter -like when proofreading- those attributes actually hurt! Because you have to be forced to read inefficiently to be able to catch typos; in immersive reading your cognitive mechanisms are simply too clever.</p>
      <p>hhp</p>
