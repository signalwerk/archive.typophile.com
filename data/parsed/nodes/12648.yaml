    <p>This font now has 2 editions, the one originally commisioned ( now being hinted a bit more) &amp; an improved version with a bigger set of targets to hit. My focus is now the new version.</p>
    <p>The original font was designed :</p>
    <p>- to be used in bitmap mode at 12pt on a pc ( on &amp; off pixels only ) </p>
    <p>The new design is meant to :</p>
    <p>- look okay in print<br>
    - work as hited bitnmap ( on &amp; off pixels only )<br>
    - and work anti-aliased too ( with grey pixels created by rendering engines ).</p>
    <p>Originally I tried to shape my glyphs around the target bitmap at 12pt for PC. But I found out eventually that I was constraining the glyph designs too heavily and creating problems for the bitmaps at larger &amp; smaller sizes. This new font builds on my trial &amp; error experience as well as my new understanding about why monospaced fonts have taken the shapes they have. The latest version does as better job rendering to screen in antialised mode &amp; I think is less ugly when printed.</p>
    <p>The latest GIF graphic is simulated PC 12, 24, &amp; 48 pts.</p>
    <p>The PDF shows 12 &amp; 72 pts. The 'in typophile' link below doesn't work. <a href="http://www.eyebytes.com/softdev.v3.1.pdf">This one does.</a></p>
    <p>I have been using Lucida Sans Mono, Lucida Console, Consolas, Courier, Andale mono, Monox, Isonorm, Thordis Mono, Adaptive Mono &amp; Mono 821 as references.</p>
    <p>Thanks!</p>
