      <p>For what it's worth, I would also like to cast a vote in favor of heavier punctuation. The more I look at those single-pixel dots in the period, colon, and semicolon, the more I think that they could be deal-breakers for me.</p>
      <p>I do realize that expanding those dots to two or even four pixels would probably end up making the font look somewhat dishamonious; nevertheless, I think it would be the lesser of two evils, given the intended use. When coding, clarity is paramount.</p>
      <p>I think I should also clarify my earlier comment on the <em>0</em> (zero) looking "odd". It's not the dot that looks odd to me; the dot is a very good thing. Rather, it's the disconcertingly small size of the entire glyph. ("Hmm... is that a zero? It looks awfully small to be a zero. What <em>is</em> that? Oh, I guess it must be a zero.")</p>
      <p>In programming, it is very common to see lines of the form:</p>
      <p><code>x = 0;</code></p>
      <p>The <em>0</em> appears by itself, without any real context. Traditionally, when old-style figures are employed, they tend to be used in the context of prose, and more often than not, to represent multiple-digit numbers. This provides the context necessary to make the digits easy to identify. In code, single digits often appear without the benefit of that context, making it crucial that they be intrinsically easy to identify in isolation. I think old-style figures hinder that.</p>
      <p>On the other hand, in the <a href="http://typophile.com/system/files?file=sq9.gif">example</a> you posted later, with the text setting, I think the old-style figures look great.</p>
      <p>Perhaps you could offer your two versions of the font as follows: one with exaggerated dots and non-old-style figures (for use by coders), and one with the "normal" dots and old-style figures (for general-purpose use as a monospaced font).</p>
