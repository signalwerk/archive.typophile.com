      <p>Having a little perspective from the coder's side of things, Here are some things that are important to the utility of the font.</p>
      <p>You need bigger punctuation, like, monstrous if possible. Seeing the difference between a colon and a semicolon is important, but not as important as seeing the difference between a colon and nothing. I recommend that the diameter of a dot be somewhere between 1.5 times and twice the width of a stroke. But leave the dots on i and j as they are; they should not distract someone who is looking for punctuation marks.</p>
      <p>In some samples, your zero is reading as an eight. I suggest narrowing the mark in the center and making it taller.</p>
      <p>From a typography standpoint, example1.gif looks the most clean and impressive to me, whereas the pdf just looks awkward. So I think you should back off on the stroke modulation wherever you don't need it. b, d, p, q should look more like c, e, o, s do.</p>
