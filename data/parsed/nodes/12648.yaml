    html: |-
      <p><strong>Thanks for all the advice! </strong> - I haven't tried it all out yet, but I will this week. </p>
      <p><strong>Re: monospace </strong>- I have asked about this over &amp; over again, because I, like Segej, didn't grok why the monospace was used by programmers. The programmer who will be getting this font when it is done actually explained it to me best - despite english being a 2nd language. </p>
      <p>He said that character count is important when scanning code. Monospace let's you find patterns in code faster - dissimilar or similar code for instance - than variable spacing. The thing is programmers are not reading for comprehension like we do. It's both more &amp; less abstract than that. </p>
      <p>- More, because they are thinking in terms of how the lines interact </p>
      <p>- Less, because they are looking for small - sometimes single charcter changes in common kinds of code - not the bigger word sized changes we look for when we read a language.</p>
      <p>That my understanding anyway.</p>
      <p><strong>DeGroot</strong> - Has anybody seen anything written by Degroot on monospace? Has anybody talked with him about it or had a class?</p>
