      <p>Eben, those look blurrier than some of the stuff I saw before - is that normal?</p>
      <p>Three-pixel interletter spacing is too much at anything below like 18 pixels. Unless it's a really light and wide design or something. Two pixels is the gold standard for both one- and two-pixel weights at "normal" reading sizes (from like 11 pixels to 16), for designs of typical width. And one-pixel spacing is useful for very small sizes or where economy is much more important than readability.</p>
      <p>hhp</p>
