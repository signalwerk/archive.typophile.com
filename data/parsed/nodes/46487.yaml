  html: |-
    <p>Hey Everyone,</p>
    <p>I'm working on a personal logo for a friend. He's a part-time photography and needs a logo/identity for a gallery he will be selling some photos in. I'm not working with any real concept because I want to shy away from using a camera symbol, etc... I'm just having fun with his initials—"M" &amp; "W"—and going for some sort of monogram. This is one of the concepts I've been playing with, just something fun (I thought it was pretty trippy/interesting). Anyway, I would love to get some feedback on it.</p>
    <p>Thanks,<br>
    Mike</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mw3_6241.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/mw1_5612.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/mw2_5141.jpg"></div><p></p>
