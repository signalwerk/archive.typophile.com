      <p></p><div class="imageWrap"><img src="http://typophile.com/files/220px-AC_Invalid_Carriage_1976_6339.JPG"></div><p></p>
      <p>The fact that most of the “specially designed for those with disabilities” fonts look like crap to people with any taste at all in typography is a form of stigmatization.</p>
      <p>It’s a primitive situation, akin to that which used to exist in many countries with invalid carriages, as they were then known. Of course, those vehicles were well meant and fairly useful, but <a href="http://en.wikipedia.org/wiki/Motability" rel="nofollow">Motability</a> (in the UK from the late 1970s) is a better idea.</p>
      <p>**</p>
      <p>As I understand the issue raised by David’s question: Is dyslexia a speciﬁc condition, a variety of specific conditions, or a pathologization of those on the low end of the reading ﬂuency bell curve? And what are the implications of these different categories for type design?</p>
