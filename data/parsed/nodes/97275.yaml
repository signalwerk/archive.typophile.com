    html: |-
      <p>Yes, but there are different qualities of limits.</p>
      <p>For example if the manifestation of dyslexia does have more than one cause, we would need more than one <em>kind</em> of solution. For example if making the bottoms of glyphs heavy does help some dyslexics but not all, having 100 bottom-heavy fonts is more limiting than having a few bottom-heavy fonts and then some other fonts that help other flavors of dyslexics.</p>
      <p>And the only way to identify the cause(s) is through research.</p>
      <p>hhp</p>
