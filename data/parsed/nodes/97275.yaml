      <p>K:"What is your evidence for this?"</p>
      <p>Before the discovery of dyslexia, there was more than one font for everyone else, (though less than one per person). </p>
      <p>Do you want to visit the studies of dyslexics that have shown when something is done to type as it's used by normal readers, suspected improvement occurs for some dyslexic readers? Or... do you want to visit the studies of normal readers that have shown when something is done to type, variance occurs from the norm for dyslexic readers?</p>
