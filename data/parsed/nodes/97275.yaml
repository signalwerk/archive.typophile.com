    html: |-
      <p><em>… people with any taste at all in typography … </em>[are]<em> … seen as snobs.</em></p>
      <p>I ﬁnd that hard to believe, certainly within the font-licensing marketplace and amongst professional designers. And such designers must surely resent having to cock up their layouts with clunky fonts, and will likely not care too much about the end result, which is indeed stigmatization.</p>
      <p><em>… most people think these freakish fonts are "cool", and that makes dyslexics feel like they're getting some cool special attention!</em></p>
      <p>That may be true amongst the targeted users, but I’m not so sure that the effect of such fonts in use, as seen by normal readers, will seen as cool, because (a) designers will be using them in a desultory manner, not creating their best and most stylish work, and (b) they’re ugly and geeky (in its original meaning), like the “invalid carriage” depicted above.</p>
      <p>Don’t dyslexic readers too see them as ugly, quite apart from their functionality in immersive reading?<br>
      Or does being dyslexic mean that one has no sense of aesthetics?!</p>
      <p>I don’t have anything against the immersive-reading functionality behind these fonts, if indeed, that can be proven to be meaningful, but the lack of polish in their drawing so far is detrimental to their use in a broader context.</p>
