      <p>I've finally found an existing font that is probably suitable for helping some dyslexics...</p>
      <p><a class="freelinking external" href="http://www.identifont.com/find?font=Artistik&amp;q=Go" rel="nofollow">Artistik</a></p>
      <p>Hobo came close, but was missing some essential features.</p>
      <p>EDIT: I've found another one, this one from Mergenthaler Linotype. Oscar - but it doesn't seem to have been digitized. This only has the feature that b and d, p and q are distinctive, and not features to address other forms of dyslexia; but it is at least not too horribly violent a departure from a conventional typeface.</p>
