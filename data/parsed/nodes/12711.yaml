      <p>Just because something is discontinued, that doesn't make it free. Finding FontHopper online somewhere for free is no more legal than finding any other retail program online.</p>
      <p>Adobe didn't continue any Ares software after acquiring the company; it was bought exclusively for its "Chameleon" font compression technology, which was an option in PostScript 3 devices. Look up "Type 14 fonts" for more info.</p>
      <p>Regards,</p>
      <p>T</p>
