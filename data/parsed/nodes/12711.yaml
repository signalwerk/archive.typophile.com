      <p>Fontographer or TransType will do it. Problem with most freeware is that you may not be able to properly encode, transfer metrics, etc. You end up with a junk font. For that matter, even with commercial programs, if you don't pay attention to the proper sequences, you end up with junk.</p>
      <p>Gerald</p>
