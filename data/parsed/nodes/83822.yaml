    html: |-
      <p>I definitely see an alien, arabic form to it, and to me that's its strength!  It's very much like the music, in which familiar sounds become alien, but the harmony of all the elements keep it from alienating the listener (or registering as just plain noise).  I certainly don't want people to feel bad!  I want it to be more of an a-ha! experience that ends positively and leaves the viewer feeling a bit more clued-in.  I'm assuming from the viewer a heightened state of visual receptiveness in the same way they need to be open to new sounds as a listener.</p>
      <p>I'm also considering how people will be accessing this logo, which will, for the most part be from a spelled-out URL.  So it will be less about <em>what</em> it says and more about <em>how</em> it says what you know it is. </p>
      <p>...and I think we DO have mirrors inside our heads!  We can watch TV sideways and read AMBULANCE when it's flipped...</p>
