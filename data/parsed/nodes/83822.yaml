    html: |-
      <p>A little context:  This is for a new record label focused around ambient recordings, so it can be a little bit out there, assuming (by nature of the project) that the audience is more design literate than the average bear.  My goal is not instantly recognizable, but hopefully decipherable within 10 seconds. I have it treated on the label a bit differently to where it can only be read while the record is playing.  Quiet transmissions.</p>
      <p>It is intended to be progressively spaced out (like the music), and want to make sure that it looks like an even progression.  I also don't want to start too tight on the l-o-v nor get too loose on the d-a-y, which makes the job a bit more difficult.</p>
      <p>The reason for the upside-downness: I want the viewer to look up at it.  Like hot metal from heaven.</p>
    html_clean: |-
