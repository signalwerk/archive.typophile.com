    html: <p>In the context you are working, I do think that the initial confusion works OK.  I think you actually have too many concepts here.  The tracking increasing from left to right is too subtle, and in my opinion not a very compelling concept.  I do like the idea of meditating to find the text among what initially seems like an unknown script, and I think it could work as if we are looking up at the letters, but I think that could be accomplished without it oriented as if we are looking at the back of the letters.  Hopefully that helps!</p>
