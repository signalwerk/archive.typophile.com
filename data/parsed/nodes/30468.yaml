      <p>Charles Leonard just quoted Duke Elligton earlier. “If it looks good, it is good.” You need enough difference between the grotesques and it’s all good.</p>
      <p>For serif, almost anything goes. Since it’s a book, I don’t think the geometry of Neuzeit is very good (for body text I mean). But whatever you choose, please no ITC Garamond, Stone or Rotis. I’ve had enough of those in marketing books. ;^)</p>
