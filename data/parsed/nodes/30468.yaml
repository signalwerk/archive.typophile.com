    <p>Hi,</p>
    <p>I'm designing a corporate marketing book. The company currently uses Neuzeit S in their logos and titles. I need to pair it with a pertinent body text font. The previous design firm chose Times New Roman due to accessibility and availability in word documents, website default, etc. I want to change it, so I'm just wondering what you guys think about the use of a serif VS a san serif font. Also, any suggestions on what might go well with Neuzeit S.</p>
    <p>Thanks.</p>
