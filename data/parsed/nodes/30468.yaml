      <p>Modern/Romantic fonts like Bodoni, Didot, Walbaum, et al, are traditional companions for geometric sans-serifs. Many designers find these to be straining on the eye when used in long texts, however.</p>
      <p>Neuzeit S has the small aperture and similar body structure to Realist types like Clarendon, Century, Century Schoolbook, and the like, so these might be possibilities as well.</p>
      <p>David Thometz</p>
