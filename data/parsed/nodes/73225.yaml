  html: |-
    <p>I was enjoying my sunny Sunday afternoon doing what I love to do best: thumbing through typeface specimens.  Then I came across this one: Empire Gothic produced by Keystone Type Foundry.  It was love at first site.  What personality!</p>
    <p>I can't seem to find any additional information for it on the web, but can anybody recommend anything similar?  Even something that's not slanted would do.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/empiregothic_6099.jpg"></div><p></p>
    <p>Another incomplete specimen in this book that leaves a lot to the imagination is Tudor Medium.  Anybody have a complete specimen of this?</p>
