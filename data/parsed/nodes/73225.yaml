    html: <p>ATF sold that design as Times Gothic in the early twentieth century, the designer appears to be unknown. It shows up in the 1912 ATF book and ATF bought Keystone in 1919. Based on the design my <em>guess</em> is that it’s a nineteenth century design that was pirated and sold by Keystone as Empire Gothic. It looks like an Inland Type Foundry design, comparing the 1908 ATF book with the 1912 might shed some light on that hypothesis.</p>
