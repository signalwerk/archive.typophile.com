    html: <p>I disagree with the philosophy that one should have a stable of fonts, ready to use on whatever job comes along. <br> <br>As an art director, I was always looking for the new font for the new job. As a type designer, the one(s) I'm working on at the moment are always the most essential.  <br> <br>And bear in mind, the right font for the job in hand may not have been designed yet, and may require commissioning.</p>
