      <p>You're welcome.<br>
      As for your question "What typeface would be a common use by English printers in the beginning of the 1600's in a usable revived font today?" the answer is that there were a variety of dissimilar typefaces, some Garamondesques, others Dutch, some Venetians, etc. In the absence of an image from your book approaching the detail of the mid 17th century specimen I posted, it is not possible to recommend a specific digitized font. About all I can say is that it would be pre-Caslon with low contrast. If you don't have a more detailed image you could check the facsimiles of Shakespeare first folio 1623<br>
      <a href="http://internetshakespeare.uvic.ca/Library/facsimile/overview/book/F1.html" title="http://internetshakespeare.uvic.ca/Library/facsimile/overview/book/F1.html">http://internetshakespeare.uvic.ca/Library/facsimile/overview/book/F1.html</a><br>
      and pick something digital from the references I posted earlier.<br>
      There is a real gap in digitized typefaces for anyone wanting to recreate books from this era. Perhaps at some future date a publisher might commission a fontmaker to produce a font that would be used for a re-issue of the Shakespeare first folio 1623, complete with it's ligatures, contractions and other printer's quirks. At least that would be something.<br>
      don</p>
