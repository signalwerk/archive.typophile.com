      <p>There is very little that is suitable to reproduce these pages.<br>
      Garamond and several others based on designs of the 1500s could be a possibility but modern digital versions lack the ligatures etc then used by printers.<br>
      We have at least one text and Italic based on printing from the mid 1600s, but they also lack ligatures. Jeff Lee has created JSL Ancient and JSL Ancient Italic and has made them freely available<br>
      <a href="http://www.shipbrook.net/jeff/typograf.html" title="http://www.shipbrook.net/jeff/typograf.html">http://www.shipbrook.net/jeff/typograf.html</a><br>
      Another possibility<br>
      <a href="http://fontdeck.com/typeface/aliz" title="http://fontdeck.com/typeface/aliz">http://fontdeck.com/typeface/aliz</a><br>
      You could also wade through this selection at Myfonts<br>
      <a href="http://www.myfonts.com/search/tag%3A1600s/fonts/" title="http://www.myfonts.com/search/tag%3A1600s/fonts/">http://www.myfonts.com/search/tag%3A1600s/fonts/</a></p>
      <p>don</p>
