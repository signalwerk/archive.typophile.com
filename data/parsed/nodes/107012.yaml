    <p>Hello Typophile!</p>
    <p>This is my first post here, so I hope that I am doing this correctly, sufficiently and within the guidelines of the forum :)</p>
    <p>I am looking for the typeface used in the 1616 "The Whole Works of Homer" translated by George Chapman, which (to my knowledge — and please correct me if you know otherwise) is the first substantial English translation of Homer's The Odyssey.</p>
    <p>Now, I am guessing that it won't be possible to find an exact match of the typeface used in the images referenced further down, but I am looking for a typeface which is as close as possible to the looks, time-period and origin, in a (revived) digitized font today.</p>
    <p>So the criteria, I guess, is that it has to be a typeface which was used around the beginning of the 1600's in England (where the book is published) and is revived in a usable font today, which matches the characteristics of the typeface used in the book.</p>
    <p>Also other probable typefaces of the time can be a solution if that is the closest possible match.</p>
    <p>Thus far I have been able to find some info about the <a class="freelinking external" href="http://iginomarini.com/fell/the-revival-fonts/" rel="nofollow">Fell types</a>, but these I don't think are the ones used in the book.</p>
    <p>Anyway, here is the material for reference, and thank you all very much in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chapmanshomer_6513.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lf_5762.jpg"></div><p></p>
    <p>Also, please check <a href="/wiki/https%3A/%252Fwww.google.dk/search%3Fq%3DThe%2BWhole%2BWorks%2Bof%2BHomer%2BGeorge%2BChapman%2526espv%3D210%2526es_sm%3D91%2526source%3Dlnms%2526tbm%3Disch%2526sa%3DX%2526ei%3DexBXUs2IGuqH4ATh3IHgAg%2526ved%3D0CAkQ_AUoAQ%2526biw%3D1680%2526bih%3D929%2526dpr%3D1" class="freelinking" rel="nofollow">this Google search</a> for more material if you please</p>
