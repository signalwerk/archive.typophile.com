    html: |-
      <p>I checked the Shakespeare 1623 against modern digital typefaces and in my opinion it is printed in a Garomondesque type style. I suggest that  would be best rendered by using "Garamond Premier" designed by Robert Slimbach. After he finished Adobe Garamond, Slimbach created a more "authentic" Garamond revival that was closer to its sources than other digital Garamonds. The Pro versions include Italic swash variations and Roman alternates. It is not perfect for all of the letter variations, contractions etc.  in Shakespeare 1623, but is as close as I can find.<br>
      If your examination of Chapman shows that it seems to resemble the Shakespeare facsimiles in the link I posted, then Garamond Premier is as close, in my opinion, as you are going to get for a match to Chapman.<br>
      don</p>
