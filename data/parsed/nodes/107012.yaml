      <p>1. Link to Google search broken.<br>
      2. The first page is an engraving, not type faces.  The printer of the engraving i.e. William Hole Sculp. [i.e. engraver] is not necessarily the printer of the book.<br>
      3. So it seems that what we are searching for is is the text font &amp; italic used by an unknown printer for the body of the second image. It would be helpful if we could pin this down to a specific printer. also the scale is too small to say anything for certain.<br>
      3. Here are some images of another Chapman book from 40 years later printed by Humphrey Moseley. If you have a larger scale printed image you should be able to determine if this is the same, or at least very similar type, to the ones in it uses.<br>
        </p><div class="imageWrap"><img src="http://typophile.com/files/Chapman1_4277.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Chapman2_4467.jpg"></div><br>
      If it matches we can think about digital substitutes.<br>
      If not we can try something else.<br>
      don<p></p>
