      <p><cite>the billing which really is just as important as creative if you want to make a living in design.</cite></p>
      <p>I don’t agree, sorry. I think your priority should be learning skills at a studio or company that does work that you admire, and hopefully pick up some good portfolio pieces. Making good connections is also very important. </p>
      <p>The business side is just not that hard to learn and if you put yourself in a good position, through your talent and your contacts, you’ll figure it out as you go along. It can also vary widely depending on what kind of design you want to do. More than billing, I’d say it’s important to learn what clients expect and how to deal with them.</p>
      <p>But I’d make my first priority trying to get a foot in the door at a place you think you could do good work.</p>
