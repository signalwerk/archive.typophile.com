      <p>Well, you can start out as a freelancer, of course. The point others are making (which I agree with) is that you are only partially baked when you come out of school, and you have to have a few years experience working to be fully done. Now you can get those years as a freelancer, but is it a service to your customers to pay you to learn? </p>
      <p>And when you work with someone with more experience, you don’t have to make the same expensive mistakes. Your cohort can explain why something won’t work, and save you the aggravation (and expense, if you are freelance) of making a major error.</p>
      <p>So, while you can start as a freelancer, it makes a lot more sense to get a few years under your belt before you go on your own.</p>
