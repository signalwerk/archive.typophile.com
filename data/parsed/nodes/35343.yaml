      <p>i started out — fresh from school — as a freelancer. it was hard work, but i think you really have to have the temperment for it. one example: no matter how hard you’re working, and how much work is coming in, you never really feel like you’re off the clock. you’re watching a movie, and there’s a nagging feeling you should be making those calls or checking those invoices...</p>
      <p>anyway, i don’t think i would have made it if i had known any better. but i didn’t know anything, and i was able to pull it off. with any sense, i would have been scared witless.</p>
      <p>reminds me of an episode of “gilligan’s island”... gilligan made a pair of wings from some feathers, straps them on and starts flying over the huts. the skipper sees him and yells, “what’re you doing? you can’t fly!”  “i can’t?” says gilligan, and he falls to the ground.</p>
