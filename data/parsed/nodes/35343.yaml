      <p>Melissa, James makes a very good point. You will learn so much working for a studio, say, or an agency, or at a magazine (to name but three options).</p>
      <p>That said, a logo is not something you absolutely must have when starting out... A well-designed typographic card and letterhead might be enough. But ultimately that is up to you.</p>
      <p>As for books, beside the ones already mentioned, you might want to check out...</p>
      <p><a href="http://www.amazon.com/Starting-Freelance-Illustrator-Graphic-Designer/dp/1581151993/ref=pd_bbs_sr_1/105-4304836-8465243?ie=UTF8&amp;s=books&amp;qid=1185161700&amp;sr=1-1"><strong><em>Starting Your Career as a Freelance Illustrator or Graphic Designer</em></strong></a>, by Michael Fleishman</p>
      <p><a href="http://www.amazon.com/Talent-Not-Enough-Business-Designers/dp/0321278798/ref=pd_bbs_1/105-4304836-8465243?ie=UTF8&amp;s=books&amp;sr=1-1"><strong><em>Talent Is Not Enough: Business Secrets for Designers</em></strong></a>, by Shel Perkins</p>
      <p><a href="http://www.amazon.com/Careers-Design-Business-Graphic-Designers/dp/1581152051/ref=sr_1_3/105-4304836-8465243?ie=UTF8&amp;s=books&amp;qid=1185161166&amp;sr=1-3"><strong><em>Careers by Design: A Business Guide for Graphic Designers</em></strong></a>, by Roz Goldfarb</p>
      <p>Last but not least, don’t forget your local public library as a source of good design books.  :-)</p>
      <p>Best of luck!</p>
