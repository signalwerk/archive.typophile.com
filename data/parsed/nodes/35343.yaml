    <p>Hello,</p>
    <p>I am a graphic design college student, going into my senior year for my BFA in the fall. Just recently, I have started my first freelance job, but I feel like a lost puppy. I do not have a logo put together yet (it’s a work in progress), and I have several questions with not many people to help answer.</p>
    <p>My question is - what are some good books out there (reasonably priced, no more than $40) that I can grab at a local bookstore that gives me tips and a guide on how to start out freelance graphic design?  Certain topics that come to my mind that I would like answers for would be hourly rates, coming up with invoices, printing, etc.</p>
    <p>Much help appreciated- thank you!<br>
    -Melissa</p>
