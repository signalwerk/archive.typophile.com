    html: <p>I second James’s advice. It’s going to be awfully hard to establish a successful freelance design business with no real work experience. I recommend you figure out what sort of design work interests you most and try to a job in that field for at least a few years before you strike out on your own. You can try to do some freelance work on the side both to broaden your portfolio and to try to line up some clients for when you’re ready to launch your own business.</p>
