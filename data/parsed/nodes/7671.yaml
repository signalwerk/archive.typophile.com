    html: <p>Yeah, that's a pretty obscure one. Never noticed it before. According to Jaspert,  <br> <br>"A roman dating from c. 1790, perhaps from the Fry Foundry, but its early history is obscure. ... Linotype Georgian designed by G. W. Jones (and Victorian) are similar to the Stephenson Blake design, but there are a number of small differences...." <br> <br>It doesn't say when any of the others were done and it appears this face was only in use in England. I've never noticed it before this. It's not in any of my other books. Very interesting face.</p>
