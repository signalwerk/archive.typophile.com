    <p>Both of the books in my bookshelf which were printed in the sixties (1967 and 1968, in the UK, to be exact) are set in this face. I'm pretty sure I've seen it in other books from the library too, some PKD novels I think. <br> <br>I have linked to the scans instead of attaching them because they are quite wide (1100 pixels or so). <br> <br><a href="http://users.on.net/~dancallaghan/sample1.png" target="_blank">http://users.on.net/~dancallaghan/sample1.png</a> <br><a href="http://users.on.net/~dancallaghan/sample2.png" target="_blank">http://users.on.net/~dancallaghan/sample2.png</a> <br> <br>Thanks for your help!</p>
