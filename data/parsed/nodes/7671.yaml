    date: 2004-11-12T13:12:00
    date_raw: 12.Nov.2004 1.12pm
    votes: null
    html: <p>It's OK for us to disagree Mark. Usually I learn something when that happens. One of the other not-quite-Baskerville-ness features that set me off in the other direction is the Q in Sample 1. I couldn't find ANY Baskervilles with a Q like that. It looks like some sort of Scotch (Caledonia,  or Bruce Old Style -- but not Scotch Roman). I agree certain letters like the C and t look  more Baskervillian, so Caledonia isn't quite right, for sure. Bruce Old Style has the wrong C serifs, but has a better Q and J than any Baskerville I can find, and the t is closer than Caledonia's. <br> <br>So far, I don't feel very good about any of the suggestions. Do you have any other ideas? (here are the samples below, so we can see them more easily) <br> <br><img src="http://www.typophile.com/forums/messages/83/53508.gif" alt="Sample 1 gif"> <br><img src="http://www.typophile.com/forums/messages/83/53509.gif" alt="Sample 2 gif"></p>
