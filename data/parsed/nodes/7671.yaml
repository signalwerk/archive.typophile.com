    date: 2004-11-12T14:01:00
    date_raw: 12.Nov.2004 2.01pm
    votes: null
    html: <p>The 's' is also interesting.... no top serif sticking up, and the 'u' seems to have flat top serifs, rather than angled. <br>  <br>I think it has the gestalt of Old Style No. 7/Bruce Old Style. I know very little about metal type, but presumably if there was an Old Style No. 7 there were at least six others that didn't make the leap to digital format. Perhaps this is one of those -- retains the overall qualities of Bruce Old Style, but differs in some details?</p>
