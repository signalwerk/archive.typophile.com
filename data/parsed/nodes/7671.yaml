    html: <p>I think those samples are Caledonia, by W. A. Dwiggins, which has been around since the late 30's, and is a very popular text font. <br> <br>Bitstream's <a href="http://www.myfonts.com/fonts/bitstream/transitional-511/" target="_blank">Transitional 511</a> is their version of Caledonia.  <br> <br>There is also <a href="http://www.myfonts.com/fonts/linotype/new-caledonia/" target="_blank">New Caledonia</a>, which I suppose is a slightly modernized version that looks virtually identical.</p>
