    html: <p>This turned out to be both an educational and expensive thread for me. John's post about 'An Atlas of Typeforms' got me looking for a copy, which led to finding an old Intertype Catalog, which in turn led to finding a 1912 ATF Specimen Book (I always wanted one of these). I bought all three,  a total of about 2,000 pages of type books, for just under $200, which feels like a bargain.</p>
