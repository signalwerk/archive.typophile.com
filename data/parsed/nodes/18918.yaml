    html: |-
      <p>I think this shows that for many graphic designers working on projects for corporate clients (and maybe even some in-house designers) its far easier and quicker to use internet search engines to locate corporate font styles than it is to extract them from the client, or find them on the companies intranet or extranet. </p>
      <p>This is especially true for what in England are known as “Mickey Mouse Fonts” ;-)</p>
