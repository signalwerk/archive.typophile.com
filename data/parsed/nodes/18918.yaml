      <p>I’ve done font work for Disney in the past (mostly cleaning up and compiling glyphs done by their artists) and from the sorts of things that I learned their lawyers tell them it’s not surprising they’re so cavalier about NOT SPENDING ANY MONEY on truly original type designs. Shame.</p>
      <p>&gt; unicase x-height that allows stacking text</p>
      <p>Yeah. Can’t do that with caps.</p>
      <p>hhp</p>
