  html: <p>Saw this on <a href="http://www.boingboing.net">www.boingboing.net</a>. A hobbyist freeware font designer who copies Disney lettering has noticed that now <a href="http://flickr.com/photos/mrg/sets/49427/">Disney is copying him!</a></p>
