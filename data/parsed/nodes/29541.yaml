    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Volcano Type</strong></p>
    <p><strong>Volcano Type</strong> is a independent font foundry based in Karlsruhe, <a href="/wiki/Germany" class="freelinking" rel="nofollow">Germany</a>.</p>
    <p>The first course: a fast food youthfulness that was served for the first time in 1996. An earthy dish, created by chance, with thirteen organic fonts. Quickly whisked up and devoured. It rarely took more than a few days from sketch to use/digestion by the project. Uncouth forms, erupted from the bowels of the earth. Shattered letters, branded, stressed, humiliated. In order to produce arrogant fonts, far too expressive to last on a page of copy text. Quite indisputably from nature. Still roughly hewn. Raw. Imperfect.</p>
    <p>The second course formed a strong contrast: tight concept, linear work, disciplined preparation. In most cases the font was formed by a matrix. Digital cool, sober, reduced. Plenty of free scope, like chess: the board is always the same, the moves always different. Classic openings are followed by unfamiliar variants. Competitive games. Finely nuanced movements. Carefully thought out, one masterminded brainchild after another.</p>
    <p>Dessert: mathematical severity is rounded off and smoothed down. Fonts between digital and analogue. Straightened rivers - the surfaces of our times.</p>
    <p>Coffee &amp; Cigarettes: a journey through metropoles all around the globe and a interdisciplinary book project, reflecting the cultural sampling, crossing and mixing. Many designers contributed with experimental fonts and font families to the <a href="http://www.bastard-project.com/" target="_blank" rel="nofollow">BASTARD</a> book project.</p>
    <p>Fonts at Volcano Type have been designed by:<br>
    <a href="/wiki/Sandra%20Augstein" class="freelinking" rel="nofollow">Sandra Augstein</a><br>
    <a href="/wiki/Peter%20Brugger" class="freelinking" rel="nofollow">Peter Brugger</a><br>
    <a href="/wiki/Stefan%20Claudius" class="freelinking" rel="nofollow">Stefan Claudius</a><br>
    <a href="/wiki/Eduardo%20Escobar" class="freelinking" rel="nofollow">Eduardo Escobar</a><br>
    <a href="/wiki/Florian%20G%C3%A4rtner" class="freelinking" rel="nofollow">Florian Gärtner</a><br>
    <a href="/wiki/Sirkka%20Hammer" class="freelinking" rel="nofollow">Sirkka Hammer</a><br>
    <a href="/wiki/Lars%20Harmsen" class="freelinking" rel="nofollow">Lars Harmsen</a><br>
    <a href="/wiki/Martina%20Hartmann" class="freelinking" rel="nofollow">Martina Hartmann</a><br>
    <a href="/wiki/Sandra%20Hofacker" class="freelinking" rel="nofollow">Sandra Hofacker</a><br>
    <a href="/wiki/David%20Hubner" class="freelinking" rel="nofollow">David Hubner</a><br>
    <a href="/wiki/Boris%20Kahl" class="freelinking" rel="nofollow">Boris Kahl</a><br>
    <a href="/wiki/Matthias%20Kantereit" class="freelinking" rel="nofollow">Matthias Kantereit</a><br>
    <a href="/wiki/Ingo%20Krepinsky" class="freelinking" rel="nofollow">Ingo Krepinsky</a><br>
    <a href="/wiki/Heinrich%20Lischka" class="freelinking" rel="nofollow">Heinrich Lischka</a><br>
    <a href="/wiki/Michel%20M." class="freelinking" rel="nofollow">Michel M.</a><br>
    <a href="/wiki/Thomas%20Mettendorf" class="freelinking" rel="nofollow">Thomas Mettendorf</a><br>
    <a href="/wiki/Christoph%20Rankers" class="freelinking" rel="nofollow">Christoph Rankers</a><br>
    <a href="/wiki/Dan%20Reynolds" class="freelinking" rel="nofollow">Dan Reynolds</a><br>
    <a href="/wiki/Andre%20R%C3%B6sler" class="freelinking" rel="nofollow">Andre Rösler</a><br>
    <a href="/wiki/Christoph%20Seiler" class="freelinking" rel="nofollow">Christoph Seiler</a><br>
    <a href="/wiki/Ren%C3%A9%20Verkaart" class="freelinking" rel="nofollow">René Verkaart</a></p>
    <p>Plus some design collaborations:<br>
    Lars Harmsen, Boris Kahl<br>
    Lars Harmsen, Henri Roussier<br>
    Lars Harmsen, Boris Kahl, Ulrich Weiss, Nikolai Renger<br>
    Paul Hoppe, Boris Kahl<br>
    Heidrun Weißschädel, Alexander Kassel</p>
    <p>Fontcatalogues and a DVD with fonts free for layout, can be found within these publications:<br>
    <a href="http://www.magma-ka.de/Order/Versus" target="_blank" rel="nofollow">VERSUS</a>, published by ”die gestalten“ (2004)<br>
    <a href="http://www.bastard-project.com/" target="_blank" rel="nofollow">BASTARD</a>, published by ACTAR (2006)</p>
    <p><a href="http://www.volcano-type.de/index.html" target="_blank" rel="nofollow">Volcano Type</a> fonts are available through <a href="http://www.myfonts.com/" target="_blank" rel="nofollow">MyFonts</a></p>
