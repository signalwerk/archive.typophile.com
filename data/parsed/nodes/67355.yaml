      <p>These were fabric, iron-on letters which the t-shirt shop would layout and press on for you. I'm sure they were fairly common at the time in the US.<br>
      You need to be looking for a simple, blackletter style that would have been around in the early '80s. Quite likely something you could also have bought as vinyl stickers in a hardware store. A lot of Jeff Levine's fonts are from this kind of source material but he doesn't seem to have done this particular one yet. Probably his closest are:<br><a href="http://new.myfonts.com/fonts/jnlevine/same-old-english/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Same Old English</a><br><a href="http://new.myfonts.com/fonts/jnlevine/leathercrafter/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Leathercrafter</a></p>
      <p>I've never actually checked, but I always thought it looked like a very simplified version of Old English, with the fine lines removed and any breaks in the thicker strokes filled in.</p>
      <p>Similar fabric lettering which in closer to Old English here in the basketball scene from "Wildstyle".</p>
      <p><a href="http://" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">http://</a></p>
      <p>And from the same movie ... check out Grandmaster Flash's back 10 seconds in. I think this might be the same alphabet as the Rock Steady Crew ones you posted.</p>
      <p><a href="http://" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">http://</a></p>
