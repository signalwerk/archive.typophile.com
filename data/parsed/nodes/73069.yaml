    <p>Sometimes you just do stuff for fun and the learning process.  Here is a first cut on what will become Froggy Swash. That flying frog tongue which leaps out some great distance and snatches an unassuming bug off a lilly pad was the motivation. Also, a little fun poked at {calt} use in this day and age.</p>
    <p>ChrisL</p>
