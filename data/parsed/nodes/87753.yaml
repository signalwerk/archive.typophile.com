      <p>Hi, there are a few notes in the book »Kursiv« (Henrik Weber | Niggli) about upright and left cursives. But not a bunch of information, unfortunately. For upright italics you could research a bit in the direction of ff seria or vllg odile (there are certainly more).<br>
      Also I am currently working on a left italic semi script for gestalten fonts to be delivered by end of February.<br>
      Since i like this genre as well, i am curious what you intend to do with these?</p>
