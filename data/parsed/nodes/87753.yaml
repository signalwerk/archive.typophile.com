      <p>(Oh sorry, i am new here and missed the updates on this thread)</p>
      <p>no, this book is in german, unfortunately. There is not much information about this as well.</p>
      <p>i will try to translate in short:</p>
      <p>· they were/are rather marginally relevant<br>
      · origins from diverse applications as the need for more than one distinction<br>
      · most important ambit: cartography (mainly for river names)<br>
      · usage in advertising industry for unique effects<br>
      · from time to time still seen on posters and other advertising media</p>
      <p>· in the division of handwriting it occurs much more<br>
      this seems to be less attributable to some templates than rather a product of individual handwriting</p>
      <p>(like you told for your case)</p>
      <p>and then I remember some templates in the (spencarian (?)) penmanship books (available in the web)</p>
      <p>I hope this could help a bit</p>
