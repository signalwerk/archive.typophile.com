      <p><em>Although of course there must be a difference between "2D" saccades performed deliberatively versus lateral saccades performed unconsciously.</em></p>
      <p>The way that men's saccades generally scoped the physical features of women represented in those mid-century "Life" pictures is assumed to be as unconscious (involuntary) as reading saccades.</p>
      <p>Isn't it also possible to re-learn how to read?<br>
