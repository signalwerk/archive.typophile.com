      <p>Thanks Hrant.</p>
      <p>I was looking for #396 in the Spencer bibliography.</p>
      <p>Apparently it's the 1965 <em>Basis for Effective Reading</em>. I suspect it contains a version of “How Children and Adults Perceive Words in Reading,” which I believe is the source of Spencer’s information about Tinker’s use of the distinction between ‘total word shape,’ the bare outline of a word, and ‘total word structure’ which included internal form elements. </p>
      <p>Now I'm looking for critiques of the use Paterson and Tinker made of the Chapman-Cook Speed of Reading Test in their typographical factor's studies. Because it involved crossing out 'rogue' words it seems like an odd choice for gauging the impact of typographical factors on reading speed in continuous reading situations, which was their aim.</p>
