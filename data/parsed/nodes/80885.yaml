      <p>**</p>
      <p>Peter, I'm very interested in your historical perspective.<br>
      Speaking of perspective, it's a lot like reading, a way of using technology to order visual coding into what is assumed to be natural perception.<br>
      Erwin Panofsky established linear perspective as a subject of cultural study, Ernst Gombrich popularized it. Hugo Damisch went postmodern.</p>
      <p>Drawing a parallel (so to speak) between reading and linear perspective, in recent years we've seen a rise in the use of 3-point perspective, replacing 2-point, in media (especially virtual environments), at the same time as a rise in the use of sans serif.<br>
      These are cultural changes which condition so-called "natural" physiological processes.</p>
