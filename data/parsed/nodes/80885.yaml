      <p>&gt; word-forms or <strong>configurations</strong> constituted the units of perception in reading &lt;<br>
      &gt; tantalizing &lt;</p>
      <p>As I mentioned above I used that as my springboard in Thessaloniki.</p>
      <p>Did you know that since 2006 there’s a Configural Processing Consortium?<br>
      <a href="http://www.indiana.edu/~psymodel/CPC2010/index.html" title="http://www.indiana.edu/~psymodel/CPC2010/index.html">http://www.indiana.edu/~psymodel/CPC2010/index.html</a><br>
      They'll be in Toronto in 2013!</p>
      <p>Boumas are IMHO ordered configurations of role-units.</p>
      <p>A recent (2010) paper by two of the consortium’s key scientists is:<br>
      “Information-Processing Alternatives to Holistic Perception: Identifying the<br>
      Mechanisms of Secondary-Level Holism Within a Categorization Paradigm” by<br>
      Mario Fific, James T. Townsend, available at:<br>
      <a href="http://www.ncbi.nlm.nih.gov/pmc/articles/PMC2933083/?tool=pubmed" title="http://www.ncbi.nlm.nih.gov/pmc/articles/PMC2933083/?tool=pubmed">http://www.ncbi.nlm.nih.gov/pmc/articles/PMC2933083/?tool=pubmed</a><br>
      The domain is faces, but similar issues apply to words.</p>
      <p>The stuff is pretty advanced, but highly suggestive.</p>
      <p>Peter</p>
