      <p>The “natural form of reading" statement goes back to this:</p>
      <p>“Comparan los trazados obtenidos durante la lectura por diferentes sujetos, que revelan claramente que la forma de leer corriente, no es deletreando ni silabeando, sino captando grupos de palabras, lo que constituye la base fisiológica de la nueva metodologia de la lectura.”</p>
      <p>From: Munoz, J.M., Odoriz, J.B. and Lavazza, J. “Registro de los movimientos oculares durante la lectura”, Revista de la Sociedad Argentina de Biologia, XX, Abril de 1944 page 284.</p>
