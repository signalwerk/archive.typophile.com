      <p>Thanks Christopher. I have that paper too. But I don't think it's the one Spencer was summarizing. Hrant, I'll be much obliged if you could check.</p>
      <p>Nick, I'm trying to get the history straight because I want to know how we got to where we are. If historical researchers around Tinker's time had a holistic view in which the information that is used involved a good deal more than the outline form and encompassed internal details, a debunking of holism by attacking just the notion that the form as outline is what is used or decisive is beside the point. </p>
      <p>It is possible to hold that word wholes are normally the unit of perception in continuous reading while maintaining that word shape or the total word form — in the sense of the envelope structure of the word — hardly plays a part. Even Denis Pelli finds word shape in almost this restricted sense plays a role.</p>
      <p>The debate between Kevin et. al., and myself is: is independent letter recognition the central mediating process for recognition of word wholes, or are role units — units at the granularity of letter parts, the way they are connected snd organized across an uncrowded span — the critical mediating agents in the rapid automatic visual word-form resolution which subtends sense-following. The items that letter nodes project to in the interactive activation scheme are word wholes. So even in this scheme there is a grasping of word wholes.</p>
      <p>I'll even grant the Hrantian caveat.</p>
