      <p>&gt; <em>In what other subjects is 50-year old research relevant today?</em></p>
      <p>One of the great features of scientific experiments is that you expect that a study rerun today would have the same results as 50 or 100 years ago. I expect this to be true in chemistry and I expect this to be true in reading psychology. The interpretations of the experiment findings certainly change, but the data should not. I think all fields, certainly reading psychology cite 50 year old research. The <em>classic</em> papers tend to be older. I have had the great fortune of attending a few typography conferences. I’m quite sure I saw the occasional older piece of work referenced.</p>
