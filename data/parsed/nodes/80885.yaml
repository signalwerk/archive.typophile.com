    html: <p>Hrant, I don't think Nick should stop pointing out that the repeated claim that we ‘read by reading whole words’ has been fatally holed below the waterline by several decades of studies that set out to test that hypothesis. As you know, I'm willing to entertain the possibilities put forward by Peter and others that some recognition of feature patterns above or across individual letters may play a role in reading, but that's something quite different from the claim that we read whole words, i.e. that words are the unit of recognition rather than the outcome of recognition.</p>
