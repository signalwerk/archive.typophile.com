      <p>I don't remember. But is it not true that we see more detail laterally than vertically, deeper into the field of vision? However if I'm wrong on that it still doesn't mean we're ethereal, purely cultural beings. I think we can all agree for example that the human neck allows us to look left/right more than up/down (even though that's not very relevant to reading per se).</p>
