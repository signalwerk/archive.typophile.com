      <p>Incidentally, this relates to what was once a major political controversy in the United States. This dates back to the book "Why Johnny Can't Read".</p>
      <p>Essentially, while it is true that competent adult readers read by reading whole words, the older traditional way to teach reading, by phonics, while boring to the smarter kids who already <em>know</em> how to read, having been taught by their parents at home before starting school, at least works for every child - while sight-reading often fails to reach some children.</p>
