      <p>&gt; Isn't it also possible to re-learn how to read?</p>
      <p>To some extent, sure. But the efficiencies of how we actually read kick in on their own; we're never taught to saccade - certainly not backwards! We're taught to read one word at a time, compiling the letters sequentially; some people, and only after a certain age, are taught to read words at a time, but this is not done explicitly. True immersive reading happens pretty much in spite of how we're taught!</p>
      <p>&gt; But they are cultural, not natural.</p>
      <p>The composition of the human retina isn't cultural.<br>
      And you cannot over-ride its composition via any conditioning.</p>
      <p>&gt; There is no natural way to read.</p>
      <p>Not absolutely, but some ways are certainly more efficient than others. For example the fact that the retina's acuity is more horizontal than vertical (probably because during evolution dangers came from the side much more than from above or below) means reading vertical text is slower. As physical creatures we are simply more horizontally capable than vertically.</p>
      <p>&gt; Significant to you perhaps</p>
      <p>Significant to anybody paying attention and caring about users, as opposed to fabricating and promulgating excuses to justify self-expression.</p>
      <p>&gt; it is what I find most interesting</p>
      <p>To me the shortcomings of scientific testing of reading aren't interesting, they're just sad.</p>
      <p>hhp</p>
