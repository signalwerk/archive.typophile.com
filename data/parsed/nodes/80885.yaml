      <p>Backwards saccades do not necessarily indicate skipped information.</p>
      <p>The eye naturally has to move back and forth just in order to see - if you stare constantly at one point, you will find the scene you are looking at fading away unless you move your gaze. The nerves behind the retina lead to the eye registering changes and differences in brightness and color more effectively than static levels - even though the pigments directly react to the level of incoming light, saturation issues in the rods and cones themselves are also part of what make saccades useful, IIRC.</p>
      <p>@hrant:<br>
      <cite>BTW, Chinese typesetting has been moving towards more horizontal setting. Some of that is probably cultural influence from the West. But I suspect some of it comes from an implicit realization that horizontal is read more easily.</cite></p>
      <p>The fact that the human visual field is wider than it is high largely stems from the fact that we have two eyes. Since Chinese doesn't have hyphenation issues, the fact that the ideal line length is shorter for vertical writing than horizontal is likely not a problem.</p>
      <p>I would tend to think that Western cultural influence is the overwhelming cause of the change as far as mainland China is concerned. Remember how the Cultural Revolution sought to purge China of all traces of its traditional Confucian culture. So there was really no time for individual typographers to gradually come to decisions about what works better.</p>
      <p>Now, in the case of Japan - and to a lesser extent, Taiwan - the process could have worked as you say.</p>
      <p>My suspicion - merely a guess - is that in Taiwan, although it happened later, the switchover was nearly an all-at-once thing when certain governmental or prestigious publishers decided it was time to stop being different for the sake of being different - even if, to this day, the vertical format is used by those who want a traditional look.</p>
      <p>In Japan, though, manga to this day are published with vertical text in their word balloons, and thus a right-to-left ordering of the panels. Horizontal text is just easier to do with existing computer systems, and so what seems to be the case is merely that the Japanese still prefer vertical text, but just don't think achieving it is worth the extra trouble to handle it on computers that need to be useful for handling Western languages as well.</p>
      <p>So I think that any intrinsic superiority of horizontal text over vertical never really had a chance to have more than a negligible influence on the process - politics in mainland China, and laser printers and computer software in Japan (and probably also Korea) almost completely account for the change.</p>
    html_clean: |-
