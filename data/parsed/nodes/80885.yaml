      <p>I'll be nice and not say what I want Nick to stop doing. It's never worked before anyway. However it's still useful to plant a seed of doubt among the uninitiated.</p>
      <p>John, the idea that we read whole words at a time is as blantantly illogical as the idea that we only read letters (sequentially or not). We read as much as we can at a time; that type of efficiency is at the heart of the heuristic, non-algorithmic system that we are. The dynamic, individual unit of reading is the bouma, and it can be anything from a single letter (especially in the fovea where the resolution affords such certainty) to an entire word (hey, maybe even multiple words). DEPENDING. On a dozen things at least, including the meat of our domain, fonts.</p>
      <p>Peter's position BTW is so far ahead of the basic realization above that it's actually a disservice to state it. You teach high-schoolers Newton's Laws, not Einstein's theories. When you see an elephant charging towards your village you don't try to teach it English first so you can then explain why it shouldn't be trampling your home; you either divert it, or you shoot it.</p>
      <p>hhp</p>
