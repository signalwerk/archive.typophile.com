      <p>Rayner, K. (1998). Eye movements in reading and information processing: 20 Years of Research. <em>Psychological Bulletin, 124(3)</em>, 372–422. (pp 375).</p>
      <p>Although most saccades in reading English are made from left to right, readers do not relentlessly go forward: About 10-15% of the saccades are regressions (right-to-left movements along the line or movements back to previously read lines). Many regressions tend to be only a few letters long and could be due to the reader making too long of a saccade, in which case a short saccade to the left may be necessary for reading to proceed efficiently. Short within-word regressive saccades may also be due to problems that the reader has processing the currently fixated word. Longer regressions (more than 10 letter spaces back along the line or to another line) occur because the reader did not understand the text. In such cases, good reader are very accurate in sending their eyes to that part of text that caused them difficulty (Frazier &amp; Rayner, 1982; Kennedy, 1983; Kennedy &amp; Murray, 1987a, 1987b; Murray &amp; Kennedy, 1988), whereas poor readers engage in more backtracking through the text (Murray &amp; Kennedy, 1988).</p>
      <p>I forgot that I read this some time ago. It goes on for considerably longer and covers a lot of interesting material. Definitely worth a read if you haven’t already. One of the better papers I have  come across.</p>
