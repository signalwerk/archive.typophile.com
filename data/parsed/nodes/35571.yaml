      <p>George Shearing: I think I read somewhere about a predigital typeface which was revived by Paratype as <a href="http://www.paratype.com/pstore/fonts/New-Zelek.htm" rel="nofollow">New Zelek</a>. EDIT: Yes, it was an <a href="http://www.typophile.com/node/7548" rel="nofollow">Mecanorma-typeface</a> as Mark Simonson told here. </p>
      <p>Cristal looks like the bastard-son from <a href="http://www.myfonts.com/fonts/emigre/soda-script/" rel="nofollow">Soda Script</a> and <a href="http://www.myfonts.com/fonts/linotype/candice-lt/" rel="nofollow">Candice</a>. </p>
      <p>45 T. GEANT looks like simply Helvetica. </p>
      <p>For Mandre you could start by searching here for a typeface called »<a href="http://www.google.at/search?hl=de&amp;q=%22baby+teeth+site%3Atypophile.com&amp;btnG=Google-Suche&amp;meta=" rel="nofollow">Baby Teeth</a>" from Milton Glaser (not digitized until now, there should be lots of suggestions for alternates inside the threads).</p>
    html_clean: |-
