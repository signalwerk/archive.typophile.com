    html: <p>I like the concept a lot, actually (even if it's not incredibly original or whatever). But, it does seem a bit impractical for a logo. <br> <br>Like bj said, Hannah is a palindrome, so maybe that serif to pixel idea could be used half and half on the name hannah. Or maybe the H on each end could be capped or larger SC, with one serif and one pixel. But then again, you're entering Xerox logo territory again. <br> <br>It's tough, but there's a lot of potential with the name and the subject matter. Personally, I'd try diggin into the company's personality a bit more, especially since they're small. That may give you something to work with that hasn't been designed 400 billion times already (generic 'digital looking' web company logos).</p>
