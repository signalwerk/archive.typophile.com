    html: <p>I think the idea is plenty strong, just needs tweeking. I think the biggest reproduction problems (when it gets printed on my ghetto laser printer or faxed, etc) is going to be the fade in the shadow and the lines making the pixels. I might explore ways to say "pixelated" without the grid. I also thing the angle alone gives it the shadow flavor, no need to fade it out.  <br> <br>However, having said that, there is no reason to not have two versions, as long as you can stress their applications correctly in the standards manual.  <br> <br>Good luck, it's looking good. <br> <br>Aaron</p>
