    html: |-
      <p>And that's also the symbol for lead. But the context is about botany, where one might expect the symbols for Mars and Venus, standing for male and female flowers.</p>
      <p>So my guess would be that the plants in question are hermaphroditic.</p>
      <p>EDIT: Looking it up, I found this:</p>
      <p><a class="freelinking external" href="http://bytesizebio.net/2012/03/08/the-origin-of-gender-symbols-in-biology/" rel="nofollow">http://bytesizebio.net/2012/03/08/the-origin-of-gender-symbols-in-biology/</a></p>
      <p>so if Linnaeus is being followed, those are <em>woody</em> plants, not, as I had guessed, hermaphroditic ones.</p>
