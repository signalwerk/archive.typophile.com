    <p>I thought I had seen most of the unusual characters associated with scientific publication in the 19th century but this one has got me stumped.  It occurs several times at the end of sentences published in an 1829 issue of the Philosophical Magazine, and, as I haven't seen it before I am wondering if it has any significance to the text, or if it is merely typographical decoration.  Could you tell me what the character is called and if it has any special meaning in its context. The attached image is a picture of the character as taken from the original printed material. The OCR program has interprted it as "Tj" in one place and as "^" in another, but I doubt this has any meaning, given that the program in use cannot reliably extract the letters ae from the character æ!</p>
    <p>here is one excerpt from the text with my square brackets showing its positioning:<br>
    "oxypetalum. E. (Acute, red and white flowered) tubo longi-<br>
        4.   tudine loborum acuminatorum; floribus sessilibus,<br>
              fructibus longitudinaliter nervato-angulatis.<br>
                  Cactus oxypetalus. DeCand. Prod. Syst.Veg. 3. 4:70.<br>
                  Habitat in Mexico.             [HERE]."</p>
    <p>here is another:<br>
    "Habitat in Mexico, ubi invenit Dom. Ackermann, et<br>
    Domino Tate multis aliis communicavit : in cujus horto<br>
    nunc copiose floret.              [HERE]."</p>
    <p>The original text can be viewed at this link:<br>
    <a href="http://biodiversitylibrary.org/page/15533177" title="http://biodiversitylibrary.org/page/15533177">http://biodiversitylibrary.org/page/15533177</a></p>
    <p>I thank you in advance for any help you may be able to give,</p>
    <p>Ciao, KK.</p>
