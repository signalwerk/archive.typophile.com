      <p>&gt; <em>Or if you’re feeling adventurous, Palatino. Garamond is another great default text face that springs to mind.</em></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Helvetica_L_3452.png"></div><p></p>
      <p>I would not use an old style, let alone a calligraphic old style with Helvetica, or with Univers, or with any other neo-grotesque sans, for that matter. </p>
      <p>In my opinion, Amts-Antiqua (now available from Bitstream as Century 725) would make for a much better combination with Helvetica:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Madison-Antiqua_4028.png"></div><p></p>
      <p>In general, the Century-style moderns/ionics could work pretty well with the neo-grotesques, e.g., ITC Century:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ITC_Century_4665.png"></div><p></p>
      <p>An oval-based slab-serif, either bracketed, or unbracketed, might work nicely with Helvetica, e.g., Egyptienne F:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Egyptienne_F_4312.png"></div><p></p>
      <p>or Glypha:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Glypha_5636.png"></div><p></p>
      <p>If you absolutely insist on using an old-style, or a transitional serif, I think those whose proportions are, again, oval-based (not circle-based), might make more sense, e.g., ITC Slimbach:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Utopia_6649.png"></div><p></p>
      <p>or Utopia:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Slimbach_3499.png"></div><p></p>
      <p>or Miller:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Miller_5641.png"></div><p></p>
