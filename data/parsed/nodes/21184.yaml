    html: |-
      <p>I disagree Helvetica is dead. Quite far from it. It's just the font many love to hate.</p>
      <p>For one thing, it is a staple font in signage applications (even though other faces like Frutiger are often more suited to the purpose). Lots of government and military post signs specifically mandate its use. If they switch it will be to something more hated: Arial. Our sign company made a main entry sign for an Air Force base featuring chrome Arial Black letters.</p>
      <p>Helvetica Neue is very popular these days. I see the extended weights of it used all the time in various types of advertising.</p>
      <p>To get back to topic, what's a good serif font that goes with Helvetica? I think Berthold's version of Baskerville looks good with it. Utopia isn't bad either.</p>
    html_clean: |-
