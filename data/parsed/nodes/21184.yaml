    html: |-
      <p>The important thing in matching types is to get them looking like they are both set to the same specs.</p>
      <p>By this I mean that one should not appear more condensed than the other, or relatively tracked out. The x-height should also be considered, as should ascender-to-cap height. </p>
      <p>if you don't take care of all these correspondences, your pairing will look "off". For instance, in Maxim's selection, Egyptienne is too wide, and Slimbach too narrow. (Although these things can be fixed by applying tracking and scaling, such distortions can be problematic, hard to police in a production environment.)</p>
      <p>Don't forget figure style: your matching face should have 3/4 height tabular lining figures, like Helvetica.</p>
      <p>**</p>
      <p>As an alternative to the above, you can choose a partner that is quite different, such as Garamond. So, either have close harmony, or pointed contrast -- but avoid faces which fall between these two stools.</p>
