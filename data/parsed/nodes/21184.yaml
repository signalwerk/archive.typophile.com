    <p>Hello, my first post..</p>
    <p>I know, its written everywhere, Helvetica is dead. But im in situation where my client already got license for it, and he insist in using it. So I decided to combine it with serif font. My idea is to make the serif main, and helvetica secondary one.</p>
    <p>I would be very grateful for any advice and especially tips for serif font which will work well with helvetica. thanks in advance..</p>
