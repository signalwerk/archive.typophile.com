  html: <p><img src="http://www.typophile.com/forums/messages/29/951.jpg" alt="Digita7.5.jpg"> <br> <br>This is Digita 7.5, my first attempt at a bitmapped font, and Fontographer is obviously NOT the best tool to use for the endeavor, I discovered to my frustration. <br> <br>In any event, this size is designed at 11 points. It was designed with classical proportions in mind, more or less. The numerical suffix designates 7 pixels above the baseline, and an average width of 5 pixels per character. I'm not entirely sure that this naming system will be as useful as it first seemed, but we'll see.... <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>I really hope this displays properly. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> Your comments are welcome, and very much wanted.... <br> <br>David</p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/29/951.jpg" alt="Digita7.5.jpg"> <br> <br>This is Digita 7.5, my first attempt at a bitmapped font, and Fontographer is obviously NOT the best tool to use for the endeavor, I discovered to my frustration. <br> <br>In any event, this size is designed at 11 points. It was designed with classical proportions in mind, more or less. The numerical suffix designates 7 pixels above the baseline, and an average width of 5 pixels per character. I'm not entirely sure that this naming system will be as useful as it first seemed, but we'll see.... <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>I really hope this displays properly. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> Your comments are welcome, and very much wanted.... <br> <br>David</p>
