    date_raw: 12 Mar 2002 — 8:42pm
    votes: null
    html: "<p> You're both right about the spacing &amp; kerning, of course, especially among the UC glyphs. <br> <br>As for the ankh, it's a part of all of my fonts. (When was the last time you actually USED the infinity symbol, after all? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> I relegate that one to the alternate set). The ankh fits in so well with the dagger and double dagger that I include it in all my fonts as a potentially useful symbol or ornament. I think every font should have one. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>And I love Mars Attacks! (Narf! Narf, narf, Narf!)  <br> <br>Hrant: <br> <br>What about the UC isn't working? Is it just the spacing, or are there some other design considerations? <br> <br>As always, thanks for the input. <br> <br>David </p>"
    html_clean: "<p> You're both right about the spacing &amp; kerning, of course, especially among the UC glyphs. <br> <br>As for the ankh, it's a part of all of my fonts. (When was the last time you actually USED the infinity symbol, after all? <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> I relegate that one to the alternate set). The ankh fits in so well with the dagger and double dagger that I include it in all my fonts as a potentially useful symbol or ornament. I think every font should have one. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>And I love Mars Attacks! (Narf! Narf, narf, Narf!)  <br> <br>Hrant: <br> <br>What about the UC isn't working? Is it just the spacing, or are there some other design considerations? <br> <br>As always, thanks for the input. <br> <br>David </p>"
  - id: 150440
    user: 1203
    date: 2002-03-14T21:50:00
    date_raw: 14 Mar 2002 — 9:50pm
    votes: null
    html: "<p> Thanks for the suggestions, Hrant, Joe &amp; Tiffany. <br> <br>Hrant: You're right about the \"@\" (at), and you and Tiffany are correct on the \"0\" (zero) as well. (It seemed a good idea on paper.) I'll try an approximation of a super-ellipse. <br> <br>Wish me luck designing the lower-case figures.... <br> <br>I'll re-examine the widths of the upper case set. I really do want to try to keep the classically narrow glyphs narrow, but one more pica might be in order, especially for UC \"E\", \"F\" and maybe \"L\". I think the UC \"B\" will work at its current width, but I may have to give up on the smaller upper curve. <br> <br>Joe: As far as that tricky UC \"W\" goes, I haven't (yet) been able to make the crossings work properly with the pixels, resulting in some extremely clogged glyphs. The result that you saw posted was the least objectionable of the various options that I tried. I'll give it another look, though -- in fact, I would prefer it if I could get the double-V to work. The true solution is out there, Scully.... <br> <br>...which leads us to the alien ankh. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> <br> <br>Tiffany: your suggestion makes perfect sense, and I will incorporate it, posthaste. I also like your idea on the \"¶\" (pilcrow), and I'll adjust the various ligature widths as I fine-tune the spacing and kerning problems. (lc \"s\" seems especially troublesome in spacing &amp; kerning....) <br> <br>I'm especially glad that the lc \"g\" and UC \"Q\" and \"U\" were appreciated. Those glyphs really hold the spirit of the font that I was trying to create. <br> <br>Thanks again for all of the great suggestions. Any others will be equally appreciated. <br> <br>David </p>"
