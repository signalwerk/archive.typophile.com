    html: <p> This is nice. Agree with the comments so far, and yes Hrant you were being a bit harsh. ;-) Yes, perhaps the 'E' is too narrow, and while I appreciate the idea behind the 'B' perhaps it as well is a bit tricky. But that 'U' is wonderful. The '0' looks like a football to these old eyes. I *LOVE* the 'g' and the overall flavor. If you are attempting to show rubrication on the '¶', perhaps the thicker vertical stroke should be in the center. The 'fj' ligature is too wide as perhaps is the 'ft' lig. The idea of the  ankh is nice too. What if you lowered the cross stroke so you could elongate the opening and make it look less 'martian' like too? </p>
