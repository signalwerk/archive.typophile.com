    html: <p>I’d love to see a heart-breakingly honest revival of Metro myself, but a true Metro revival will never happen so long as Linotype own’s the rights. (I’m not rabble-rousing. Just fact stating.) They have release a new version of Metro which has some of the old details back, but the blood of Akira is running through it as well. (Again a good thing.)</p>
