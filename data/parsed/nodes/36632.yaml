    <p>Hello typophiles,<br>
    Amongst other things, I was recently passing through this small vacated town of Saguache, Colorado, and stumbled across one of four Linotype Newspaper printers in the USofA, and the only legit business operating out of the small ’downtown’ stretch of this small valley town.  I was able to have a few words with the sole proprietor, Mr. Dean Coombs, who is keeping the family business alive and true to form.  We chatted about the equipment, type addiction, the great depression, trees and the circus.  It was a very pleasant and unexpected stop on a trip through the valley.</p>
    <p>Anyhow, he gifted me a stapled print-out which pretty much represented his type library of Linotype typefaces. I noticed a couple that I haven’t seen or heard of, and some once popular but now lost ones as well.  I can write out a list of what he has on hand if anybody’s interested.  The ones I’m particularly interested are Vogue and all the varieties of Metro.</p>
    <p>I’ve seen that there was some discussion on Vogue and a little bit of history, but really, when is there going to be a digital release of this?  I cannot be the only one who would love to have it.  As a Chicagoan, I identify this face with many of the 60’s and 70’s soul and funk 45s coming out of the city, and it’s something I would love to be able to use (it’s all in the lowercase a).  Is there anything close?</p>
    <p>As for Metro—Metromedium, Metrolight, Metroblack, I see that there is a <a href="http://www.fontshop.com/fonts/singles/linotype/metrolite_no_2/">digital version</a> available, but it doesn’t look the same as in the sample I have here.  I’d like to know more about this typeface in general, and where it stands with Vogue, Futura and all the geometric sans faces being produced.</p>
    <p>Anyhow, if you’re ever in the area, I would highly recommend paying this place in Saguache a visit.  Very friendly and informative gentleman with quite an interesting shop.</p>
    <p>Cheers,<br>
    David</p>
