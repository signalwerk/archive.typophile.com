      <p>As many of you know, in a few days the type world's beloved Stephen Coles is pulling anchor and relocating to <a href="http://www.stewf.com/">Sweden</a> of all places. To show our love and support we decided to pay homage to Stephen with a <a href="http://typophile.pixeltees.com">pixeltee</a>. <br> <br></p><center> <br><img src="http://www.typophile.com/forums/messages/72/16401.gif" alt="coles-front"><img src="http://www.typophile.com/forums/messages/72/16402.gif" alt="coles-back"> <br> <br><a href="http://typophile.pixeltees.com">Click here to check out the Stewf Tee &gt;</a> <br></center> <br>Through the wonders of high-quality thermal transfer magic, you can have Stephen arrive at your door. Buy the Stewf tee so Stephen can afford to take a nice  Swedish girl out for some <a href="http://www.recipesource.com/ethnic/europe/swedish/janssons-temptation1.html">Jansson's Temptation</a>. <br> <br>Any royalties from sales go to Stephen. It's his face on there, after all; it's the least we can do. <br> <br> <br><hr width="75%" size="2"> <br>Got an idea for a Typophile Pixeltee? <a href="mailto:pixeltee@typophile.com">Send us artwork.</a> 128x128, 72dpi, web-safe palette.<p></p>
