      <p>"Unfortunately the posting on Typophile was misleading and we only offer the free fonts for a limited time. If you do not download the font while its available on FontShop.com then you must purchase a license for use.  If you do download the font while it is available from our site you may keep it indefinitely however you may never send it to anyone else or distribute it in anyway.</p>
