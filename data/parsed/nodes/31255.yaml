      <p>No problem. I think its great too. In fact its on my buy list. You should have a look at Fedra by Typotheque too. Milo looks very much inspired by Fedra. Fedra really has some quirky details: the dot over the i, the capital R, lowercase k, lowercase b. I would say its very special. Milo is much more neutral and utilitarian but it is gorgeous anyhow. Have a gander Kievit- from the same guy a Milo- Michael Abbink.</p>
      <p><a href="http://www.typotheque.com/data/specimens/pdf/FedraSansPro.pdf" title="http://www.typotheque.com/data/specimens/pdf/FedraSansPro.pdf">http://www.typotheque.com/data/specimens/pdf/FedraSansPro.pdf</a></p>
      <p>I see this is your first post- welcome to Typophile.</p>
      <p>Mike Diaz :-)</p>
