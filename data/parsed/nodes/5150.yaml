    html: "<p>Hi Scott, <br> <br>Oh man, can I relate to this! Its a tall order creating something appealing based on a mirage that has nothing to do with anything. I've done more than my fair share of these new housing development brochures. Two months ago I did one called Vintage Ranch. Predictably, it wound up having a nostalgic barn thing happening. The logo was modeled after antiquated fruit packing lables. All in all it worked out fine, but everyone knows they are being sold a bill of goods when they are selecting Floorplan 4 with the \"spanish\" detailing package.  <br> <br>All that aside, I agree that what you've got going in #2 has the most potential. It works well with the weather vane too (solid version). If you do decide to go with this, note the distortion/color issue from stretching the W (R looks ok). <br> <br>Do the flooplans have names?  <br>If so would you share them with us, just for laughs. :-) <br>They might also give you imagery ideas. <br> <br>Cheers, <br>Randy</p>"
