    html: "<p>I agree with Kirsten, however If you are going to engrave this typeface you would would most likely want a clean version of it. Or If you like the distressed look, distress it yourself. It just seems funny when the R's are distressed in the exact same way. IMPO distressed types should only be distressed when the paper or other printing medium unintentionally distresses them. There is nothing wrong with a beautiful, confident, classical, and perfectly set serif typeface.(Maybe a BEMBO) <br> <br>Also certain faces would look better in wood and certain faces would look better in stone. <br> <br>An important question would be: <br> <br>Have they developed a style guideline for the development or are homeowners going to be able to build whatever they like (modern or classic)? <br>  <br> <br></p>"
