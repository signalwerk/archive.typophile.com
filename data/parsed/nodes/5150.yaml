    html: "<p>Oh man...you're going to hate my cynical reply, but...it really doesn't matter what logo you slap on the granite sign in front of the gated community. This market is buying square footage and that's about it. ;o) <br> <br>As for your marks, 1 is nice, but rather cliche...I think I've seen more slightly distressed/handwritten logos for whispering pines/shady acres/prarie rock/etc. in front of fields of houses than not. <br> <br>I like 2 alot, though I get a 'cigarette logo' vibe from it. <br> <br>I think #3 is the one I'd go with. It's got a bit of a modern feel to it, yet it fits in with the typical McMansion development logo style (as to not scare away the jones's).  <br> <br>The bottom 3 are nice, but just not doing it for me.</p>"
