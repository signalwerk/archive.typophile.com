    votes: null
    html: |-
      <div class="comment-spam-body"><p>My best shot at IBM would have to be Class 7, Subclass 15 -- Free-Form Serif, Miscellaneous. My second choice would be to use Class 7, Subclass 1 -- Free-Form Serif, No Classification. </p>
      <p>Nothing else really fits. You could just omit the IBM classification entirely as others often do. Personally I only use Panose.</p>
      </div>
