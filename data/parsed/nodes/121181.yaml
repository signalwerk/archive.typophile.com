      <div class="comment-spam-body"><p>I would prefer to categorize it as a 9 - exaggerated, because it doesn't fit my concept of a Clarendon or Square. It really is an odd man out in the serif world.</p>
      <p>Of course, if measurements were made according to the very hard-to-find documentation, it may fall elsewhere.</p>
      </div>
