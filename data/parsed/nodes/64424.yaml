    <p>this is what my terminal shows:</p>
    <p>makeotfexe [WARNING]  feature 'dlig', referenced in aalt feature, either is not defined or had no rules which could be included in the aalt feature.<br>
    makeotfexe [NOTE] Wrote new font file 'dotsFDK.otf'.</p>
    <p>this how my features.family file looks like</p>
    <p>++<br>
    languagesystem DFLT dflt;<br>
    languagesystem latn dflt;<br>
    languagesystem cyrl dflt;<br>
    languagesystem grek dflt;<br>
