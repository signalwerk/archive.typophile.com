    html: <p>André is right in this case.. The aalt feature can use only single and multiple substitution rules. That particular message means that the logic which is building the aalt rules can't find any appropriate rules from the dlig feature. Unfortunately, the logic can't tell if the feature was never defined, or was defined, but didn't have any rules that could be used for the aalt feature.</p>
