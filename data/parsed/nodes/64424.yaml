    } aalt;</p>
    <p>#--------------------------------------<br>
    feature dlig {<br>
    	sub d o by e;<br>
    } dlig;</p>
    <p>++</p>
    <p>What is going wrong?</p>
    <p>also, when i activate my font and the name is dotsFDK for example then in illustrator in the font list it comes after the L in the list. Someone a idea how that becomes?<br>
    (i thought some time that my fonts didn't show up at all untill i saw a font that started with 'a' at the bootom of my list.</p>
