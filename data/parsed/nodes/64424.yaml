    html: |-
      <p>He is merely including the dlig feature as part of aalt. That's pretty normal to include all your features in the aalt so that you can get glyph submenus to map properly in the glyph palette of AI and other apps. I've never run into an issue with that. </p>
      <p>The warning sounds to me like its finding the dlig feature incorrect (which it is) and is catching the error in its first reference which would be the aalt feature which is typically at the top of your features list.</p>
