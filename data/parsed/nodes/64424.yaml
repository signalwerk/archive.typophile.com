      <p>Nothing is going wrong. The aalt feature can only include one-to-one substitutions, not ligature substitutions. makeotfexe is simply letting you know that this particular substitution is being stripped from the aalt feature.</p>
      <p>I can't comment on the naming issue since you haven't provided enough information. Which name field is 'dotsFDK' taken from? What's in the other fields?</p>
      <p>André</p>
