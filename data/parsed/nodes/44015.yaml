  html: |-
    <p>Hi all,</p>
    <p>newbie here.</p>
    <p>I have been asked to do a rapid redesign on a UK Spa magazine. The main thing I want to get right is the fonts. The images used will be mainly from PR’s so to make it stand out from the rest of these magazines, I need to consider my type very carefully.</p>
    <p>I was wondering if anyone had any suggestions for headline &amp; body fonts. I’m open to try both Serif and Sans Serif for both (more than likely use 2 header fonts throughout if they compliment each other).</p>
    <p>I’ve been drawn to Adobe Caslon and Arno so far (body), but any other suggestions would be most welcome.</p>
    <p>The client really liked Avant Garde as a header, but I’m aware that its been everywhere recently so would like to come up with an alternative.</p>
    <p>The magazine is aimed at (and I quote): “Yummy mummy’s, high end consumers, Harrods shopper, general managers and spa directors”. I think this translates as they want a sophisticated, luxurious feel. That’s my aim when choosing fonts.</p>
    <p>Thanks in advance</p>
