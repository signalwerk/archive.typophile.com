  html: <p>The 1960's and 1970's are the inspiration for Sugarbang! Everything from music packages, beach party movies of the 60's to cereal box art of the 1970's are reflected in the kooky style that this font evokes. Sugarbang! is built on a random baseline so letterforms bounce up and down adding to the “zany” look of the design. It is a minimal font set which includes uppercase and lowercase letterforms. Available at myfonts.com Sugarbang!- just add milk and it’s sugar frosted font goodness. </p><div class="imageWrap"><img src="http://typophile.com/files/sugarbang_5734.web.jpg"></div><p></p>
