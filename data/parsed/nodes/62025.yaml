    html: |-
      <p>The IPA Extensions, Phonetic Extensions and Latin Extended-D are not small caps proper, they just happen to have the same design as small caps proper. Or said in other words the design of these characters was appropriated from proper small caps, but the semantic link to small caps proper is broken and replaced with something else. The context of use will show which of the two they are.</p>
      <p>Proper small caps do not have Unicode code-points.</p>
