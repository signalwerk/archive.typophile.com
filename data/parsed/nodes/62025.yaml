    html: |-
      <p>Everybody but Chris is being quite succinct.</p>
      <p>What helped me understand the decision was the glyph/character distinction. A *glyph* is a particular rendering. So the glyph *A* is different in Times than in Helvetica (or in any other font), but they are the same character. A Latin *A*, is a different character than a Greek *Alpha*, but within a single font, they are often the same glyph. "Small" capitals as a stylistic variant are taken to be the same character as "regular" capitals, hence have no separate codepoint. That they are small does not change the meaning of the text -- except for "languages" such as phonetics where they have a different meaning, hence need a codepoint.</p>
