    html: |-
      <p>Small caps are a stylistic variant of the standard alphabet. They do not require a separate unicode value. Small caps refer to the base letter and are accounted for in the opentype feature code which is part of the font. The feature code spells out that the normal glyphs (usually defined in a class) are substituted by the smallcap glyphs (usually defined in another class) when the "smallcaps" feature is selected by the user.<br>
      Bold and italic have no separate unicode value either. They also just present the same letter in a different style. Bold and italic do not require feature code, however, since they reside in their own separate font.</p>
      <p>ChrisL</p>
