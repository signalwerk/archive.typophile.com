      <p>Warning: I'm not a professional designer, so do not take my notes too seriously.</p>
      <p>Generally I like the whole spirit of it, but you follow too strictly the geometrical proportions - which does make it look somehow unbalanced. Visual balance is not an exact plain geometry. </p>
      <p>C is too wide, while H is too narrow. K is quite close to H, so try to make the difference between them more obvious. M seems too wide, but maybe it's just me; same goes for U. One of the hardest ones to draw - S - looks nice, but again unproportionally narrow. Generally you get the idea, the width of some of the characters bothers the eye.</p>
      <p>The height of lowercase t is too small - no ascender at all, and looks considerably thinner than the other characters - obviously this is just an optical illusion, but you need to compensate this. Here I should repeat the width matter too - the y is too wide in comparison to v, for example.</p>
      <p>Both Z's - uppercase and lowercase - seem too rounded to be distinctive. Same goes for numbers 3 and 5, which look interesting, but do not match with the other characters.</p>
      <p>These are just my 2¢, so better wait for more qualified opinion - after all I'm still an amateur in this field.</p>
