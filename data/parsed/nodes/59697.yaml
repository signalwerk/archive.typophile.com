      <p>&gt;&gt;<cite>Any particular characters that don’t work in the circle/line structure?</cite><br>
      N and V. Maybe they should be an exception.<br>
      &gt;&gt;<cite>Are there basic type things I’m overlooking/destroying?</cite><br>
      "Offshoot" is when rounded letters (like O and C) exceed the cap line and the baseline as opposed to straight letters (like E and T and L) that sit on the baseline not below it and they do not exceed the cap line. I's not as noticeable in a lightweight like the one you have here but when you start building the bold version (which you should) you'll start noticing the C and O to be shorter than the rest if you don't pay attention to offshoot.</p>
      <p>There's a million things to fix here but start with ditching the grid and fixing the widths as mentioned above.<br>
      The fact that you have a basic character set is a great start and I really like the "a" and "q".</p>
      <p>Keep us updated.</p>
