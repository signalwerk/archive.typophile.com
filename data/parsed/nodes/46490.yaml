      <p>"Appropriate dash for a quote?"<br>
      If it's a long quote, then I suggest a 100 yard dash, if it's a short quote, then I'd do a 40. It all depends on whether you want the quote to last the entire dash, or to end the quote before or after the dash is completed. Do you have more details?</p>
      <p>Cheers!</p>
