    html: |-
      <p>I never use any kind of dash to signal an attribution, and when designers doing work for us use it, I ask them to get rid of it. There are many ways to signal the attribution without using this unnecessary sort ("form without thought," indeed). </p>
      <p>Dave and Charles mentioned alignments and spacing. Also think about changing the face, to small caps or itals or to a sans (if your quote is set in a serif face; or vice-versa). If you are working with color, change the color of the attribution.</p>
      <p>If you use enough of these tactics (face, spacing, alignment, color) in the right combinations, you'll gain the distinction you are looking for between quote and attribution. Of course, if you use too many of them, or in "wrong" combinations, you may get a dog's breakfast.</p>
      <p>It has long seemed to me that one goal of good typography might be to get rid of unnecessary characters on a page. Thus we see some typographers specify only spacing in telephone numbers, no dashes or hyphens between code elements. Thus I encourage editors to leave out the word "Chapter" and "Part" and use only numbers at the start of new chapters or parts. Let the typographers impart the signals through design, not un-needed words.</p>
      <p>powers</p>
