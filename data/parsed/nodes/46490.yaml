    html: <p>Perhaps I am not the best person to listen to, as I'm fond of, to paraphrase Robert Bringhurst, Victorian egregiousness, but I think typographic characters can be beautiful for their own sake.  I prefer the traditional right-hand side, or at least semi-centered, attribution, and a good long em-dash.  I don't know, it distances the quote from the speaker to me; makes it more like its own proper line as opposed to a talking-head of sorts.  I suppose for book reviews and the like, this could be opposite from the desired effect, and it would be more appropriate to have the name obvious and immediate.  It's usually more important who says it than what is said in these cases.</p>
