    html: |-
      <p>Well I think this "problem" can be resolved subjectively. Yes one can follow the rules as stated in numerous style guides like the Chicago Manual of Style or as stated by Robert Bringhurst. But depending on the design itself, going away from the dash and opting for a more designed approach could also be the answer. Usually if the quote is clearly set apart from the text (ie: pull quote) I tend to use it as an opportunity to think of an elegant and creative solution that works with the overall content such as making the quote attribution in a smaller bold and uppercase variation of the actual quote itself. In this way it doesn't require a dash and at the same time (depending on the actual style formatting of the quote and the main body copy) it sets another level of typographic hierarchy within the entire piece.</p>
      <p>The general rules are there to use as a guide to intelligently go away from them.</p>
