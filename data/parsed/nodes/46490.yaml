      <p>Many style guides these days don't recommend a dash at all: either put the attribution in parentheses after the quote, with an em space between; or without parentheses, right-aligned (in the same line as the quote if there's room, on the next line if there isn't).</p>
      <p>If you <em>do</em> want to use a dash though, I'd say an em dash close up to the right-aligned style of attribution...</p>
