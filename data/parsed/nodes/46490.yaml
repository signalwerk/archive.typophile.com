    <p>I'm doing some page layout for a book to be printed within the week and I need to know if there is a correct dash (en or em or something else) for quoting someone. For example:</p>
    <p>“A wonderful insight into one of the most competitive fields of photography, a must read for the aspiring photographer.”<br>
    -Marcus Bell, Wedding Photographer</p>
    <p>I know en dashes are used only for durations, and em dashes are primarily used in lieu of a colon. I've seen both used (and even hypens), but I can't figure out which os truly correct. So that's why I've come to THE source for all that is good and knowledgeable for typography.</p>
    <p>Any help is appreciated.</p>
