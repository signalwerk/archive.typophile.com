    html: |-
      <p>As Dave suggests, which dash to use is really a matter of editorial style, not typographic style.</p>
      <p>As a guess, I would imagine that the use of the dash "began" when the attribution was run in, not taken down. eg,</p>
      <p>“A wonderful insight into one of the most competitive fields of photography, a must read for the aspiring photographer.”--Marcus Bell, Wedding Photographer</p>
      <p>In that case, you would use whatever is conventional for the dash in text -- a word-spaced en-dash in the UK, a closed-up em-dash in the States.</p>
      <p>When you take the attribution down to a new line, you can either set it (on the quote block) flush left, flush right, centered, indented an em left or right, etc. Or even use a dash, though that tends to signal form without thought. So, there is no correct answer, but of course, there are "less correct" ones. If, for example, you center each line of the quote, it would be odd to set the attribution flush right.</p>
