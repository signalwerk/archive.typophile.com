    html: <p> You're welcome. I love Fast Company too -- have been a fan of Patrick Mitchell's art direction since he was at Garbage (anybody remember that publication?) years ago. <br> <br>As far as sans serifs go, I think Fast Company is  using Benton Gothic these days. Griffith Gothic was originally commissioned for the magazine, and they've gone through a bunch of them since, including DIN, Conduit(!) and Knockout. </p>
