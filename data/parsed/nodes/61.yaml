  html: <p> Several issues ago, Fast Company started using a new text face. Does anyone else here read this mag? They were using Electra (very well IMO) until several other wannabe business magazines started. I love this magazine and think the design to be one of the best current mags out there. Anyway, I really have become obsessed by the type they are using for there body text. I know the sans is Griffith Gothic by Font Bureau, so I am assuming the body type might be a privately held face also by Font Bureau. Any ideas? </p>
