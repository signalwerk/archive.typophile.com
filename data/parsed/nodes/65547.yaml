    votes: null
    html: |-
      <p>Kursivschrift is a great choice. Considering the context, I would make the "s" lc (which might give [more] reason to make the subhead all-caps - see below). However without a tall cap "S" the heights of "t" and "el" become more sensitive; I might make them [optically] equal.</p>
      <p>The cupped terminals should be sheared flat (possibly at an angle, but still flat); the cupping there is actually intended for lo-fi rendering (it keeps the ends sharp-looking).</p>
      <p>The "t" isn't asserting itself enough; I'm not sure how to improve it though.</p>
      <p>The "yl" gap should be increased.</p>
      <p>The subhead font: None of the fonts you've tried so far do it for me. I think it should either be a dark, contrasty sans, or a wide monoline. Especially if you choose the latter I think all-caps might work best.</p>
      <p>BTW, there an elephant in this room: what's the mag's text font?</p>
      <p>hhp</p>
