    <p>Hey guys,<br>
    I'd like to ask for some input. I'm designing the cover of an indie mag and have gone with Kursivschrift for the masthead. So I've put it to the paper size as it's in the jpg attached, basically just the font type for now. I'd like to know if the spacings between the letters are alright, or basically any input that you guys might have.</p>
    <p>The mag is targeted for women aged 20-35, into the indie fashion and arts scene. Keywords that may describe are feminine, whimsical, pastel, artsy, illustrative.</p>
    <p>I appreciate any thoughts on it. Thanks so much in advance.</p>
    <p>Riz</p>
