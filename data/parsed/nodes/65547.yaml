      <p>In all, the cups are removed from the head, and "yl" gap increased, though I will keep the S a high case. So then I went to try several other types for the sub. The first is the same as previous, for comparisons sake. Second is a little playful perhaps to better suggest "indie style". Third would be to try wide monoline in all caps. Fourth is the same as first, trying in all caps.</p>
