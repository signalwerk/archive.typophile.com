      <p>Mycorp-</p>
      <p>The Chalet family (Chalet, Comprimé, Chalet Book) does include both the ’ç’ and the ’ã’, along with a whole host of CE characters (and Cyrillic for Chalet 1960 and 1980) for most European languages. Our lettersetter sometimes has trouble displaying some CE characters (an issue that is being resolved shortly), sorry for the confusion. If you need further information, please do not hesitate to contact us: <a href="http://www.houseind.com/index.php?page=contact" title="http://www.houseind.com/index.php?page=contact">http://www.houseind.com/index.php?page=contact</a></p>
