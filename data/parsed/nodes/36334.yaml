    <p>First post for me, so I'm just gonna state that after stalking these forums for a couple weeks it feels really good that I can finally post something. Anywho, down to business.</p>
    <p><strong>Does anyone know the font for the Business Week Logo?</strong> I think it's something like Lucida Bright, but the S's are slightly different. This seems like such a basic font I feel like bit silly for not being able to figure it out myself.</p>
