    html: |-
      <p>Before doing a whole font of any of them, I'd think you'd want to prototype all of them —&nbsp;perhaps just converting the current samples to individual digital letters — to see which best tolerate the limitations of the font environment. </p>
      <p>#4 may have the simplest shapes, but it has the most complex surface treatment (looks like it was created with an ink roller?) You will inevitably find there's a tradeoff between simplicity of drawing &amp; the visual character of the result.</p>
