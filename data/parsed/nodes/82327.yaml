  html: |-
    <p>I working with Tim Botts <a class="freelinking external" href="http://en.wikipedia.org/wiki/Timothy_Botts" rel="nofollow">http://en.wikipedia.org/wiki/Timothy_Botts</a> on converting some of his calligraphy to fonts.</p>
    <p>Initially, we're going to take one font through the creation process just to get a feel for the process. So, I'd like to start with a good one. Beyond the initial posting, this will help to give me an idea of what to create next as well.</p>
    <p>Here are the options that I'm selecting from. The image below is a composite of Tim's calligraphy and Barry Smith's <a class="freelinking external" href="http://studiosmith.blogspot.com/" rel="nofollow">http://studiosmith.blogspot.com/</a> design work.</p>
    <p>If you care to vote, I'd be interested in hearing on the following...<br>
    - which is your favorite<br>
    - what font would you be most likely to buy, and why</p>
    <p>Thanks for you help!</p>
    <p><img src="http://www.pedestrianmedia.com/tim/tim_vote_all.jpg"></p>
