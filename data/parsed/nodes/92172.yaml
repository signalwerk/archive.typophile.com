      <p>Next week will only be my fourth year, but I've had a lot of entertainment already. For some reason unknown this thread, for example, appears in my "Recent activity" list: <a href="http://typophile.com/node/67877" rel="nofollow">Where do I get Neo Sans Family?</a>.</p>
      <p>As with all older threads -- dug up deliberately by some Johnny-come-lately, risen from the ashes because of a misdirected Google search, or brought back to life by a mischievous spammer -- I cannot help wondering if this guy ever found his personal Holy Grail o'Fonts, or just went ahead and became an accountant, woodworker, or Adobe Helpdesk operator, got married, fathered two children, and never thought back on his whimsical post on a Typophile's hangout. (Probably not the part about marrying as that thread is just 2 years old.)</p>
