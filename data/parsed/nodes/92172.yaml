    html: |-
      <p>Happy birthday Typophile!</p>
      <p>Three life-changing Typophile experiences—so far. Here's the first one. </p>
      <p>In discussing Caslon back in 2003 with Kent Lew, John Hudson, Gerald Giampa (alas no longer with us), and Hrant, <a class="freelinking external" href="http://typophile.com/node/436#comment-2774" rel="nofollow">John Hudson pointed out that Adobe Caslon</a> is "Sadly, Adobe Caslon is the only version that is suited to a wide range of typographic application, but it doesn't look like Caslon, so what's the point?"</p>
      <p>Being already a "typomaniac," but not a designer, I remembered reading Einstein's Autobiography in the Schilpp volumes, and remembered with fondness its letter press Linotype Caslon Old Face. And I thought "Wait a minute, I know what Caslon looks like. I think I could do that right."</p>
      <p>Eventually I bought FontLab, and started drawing type. And among many other activities in my life, I kept drawing, and kept drawing, and kept drawing. </p>
      <p>Fast forward to today. My <em>Williams Caslon Text</em> (Font Bureau) is one of the fonts chosen to be in the 10-year retrospective exhibition of graphic design at the Cooper-Hewitt National Design Museum in New York City, <a class="freelinking external" href="http://www.cooperhewitt.org/exhibitions/now-in-production" rel="nofollow">Now in Production</a>, starting May 26 in New York City. It looks like there will be a 'type night' when several type designers will be talking, including me, but a date is not yet set.</p>
