    <p>I'm looking for more information on French wood type foundries.<br>
    I'm working on a revival of a very interesting bold condensed Clarendon that I believe was made by a French foundry.</p>
    <p>I've found a complete uppercase sample, and have finished the rest of the font in a similar style. For accuracy's sake, I would love to find an example of the lowercase or numbers.</p>
    <p>The type has markings: AUDERBAUD BRESSURE (2 SEVRES)<br>
    Anyone have any insight on this or know what it means? </p>
    <p>It would be nice to see if anyone has any other information on this particular font or the history of French wood type in general.<br>
    I know Clarendon was an English design, and this French one is a copy, but it is unique and I haven't seen one like it in all my years of type catalog absorbing.</p>
    <p>Thanks,<br>
    Matt</p>
