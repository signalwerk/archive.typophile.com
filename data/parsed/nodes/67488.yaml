      <p>It pays to think globally. </p>
      <p>WorldCat (<a href="http://www.worldcat.org/" title="http://www.worldcat.org/">http://www.worldcat.org/</a>) has these:</p>
      <p>C. Audebaud, <em>Spécimen de lettres en bois pour affiches.</em> Bressuire (Deux-Sèvres): C. Audebaud, Graveur, Successeur de L. Moreau, [ca. 1880]</p>
      <p>Specimen of wood letter for printing posters. It's in the ATF collection at Columbia University, New York.</p>
      <p>And also a couple of similar items, apparently without a title, one of which was issued by Constant Audebaud, G. Chauvin and Louis Moreau, and the printer at Tours was the Imprimerie E. Arrault et Cie, 1886. They are at the University Library at Amsterdam (Bibliotheek Universiteit van Amsterdam, Amsterdam, 1012 WP, Netherlands).</p>
