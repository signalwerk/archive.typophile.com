      <p><em>Is it possible that the markings are Audebaud rather than Auderbaud and Bressuire rather than Bressure?</em></p>
      <p>I agree that this might be the name – hadn't seen your post. But the reference in Ebay does also have ‘Auderbaud’ so presumably this was on the type. There are several Audebauds listed as authors in the French union catalogue, including one writing about a part of France that is not far away, so maybe it’s a regional name. But alas no type specimens under this name.</p>
