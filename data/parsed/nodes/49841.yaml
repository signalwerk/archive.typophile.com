    <p>We've just finished the first phase of a redesign of the Scriptorium Fonts site.  We've increased the level of dynamic content and totally redone the layout and basic appearance of the site.  It's a bit more modern and a lot less clunky.</p>
    <p>Right now the revisions apply to the main entry page and most of the editorial and new release information material.  We're going to continue to gradually implement the same format changes on the rest of the site until it's all integrated.</p>
    <p>Stop by and check it out.  Comments and suggestions are welcome.</p>
    <p>It's all at <a href="http://www.fontcraft.com" title="www.fontcraft.com">www.fontcraft.com</a></p>
    <p>Dave</p>
