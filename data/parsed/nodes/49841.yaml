      <p>It's great to have a site dedicated to this area of typography, so all speed to you Dave.  The only thing about the site that spoils it for me is the main banner.  Whoever's done it has basically not heard of antialiasing.  The main name 'The Fontorium' is all jagged and rough.  It could be so much cleaner than this (assuming this is what you want to achieve).  I think you should also reconsider the use of the 'outer glow' effect on the name.</p>
      <p>Good luck with the site though.</p>
      <p>JH</p>
