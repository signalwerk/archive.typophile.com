    <p>Hi Folks, </p>
    <p>Someone sent me this logo for a swim team, wanting to know what font was used. It seems familiar to me, but I searched all over and have had no luck pinning it down. It has a retro feel, but I don't know how far back we are going - Art Nouveau? Deco? Arts &amp; Crafts?</p>
    <p>It's doubly frustrating, because it looks so familiar that I think I may have this font, but I can't think where to look.</p>
    <p>Help.</p>
    <p>- Mike</p><div class="imageWrap"><img src="http://typophile.com/files/MAKOSlogo_5093.gif"></div><p></p>
