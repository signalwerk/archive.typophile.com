      <p>Thanks Nick. I still have a very strong idea that this is a font I have seen before. I checked German (and/or) Expressionism and found something vaguely similar, but without the uneven weight. To me there seems to be a design style here, not just crude lettering, and given what it was used for, I'd not expect it to be custom work.</p>
      <p>Anybody other ideas?</p>
      <p>- Mike Yanega</p>
