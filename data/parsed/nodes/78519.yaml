      <p>In desperation I looked at Dafont in the Retro category and found <a href="http://www.dafont.com/broken-poster.font?fpp=50&amp;text=makos" rel="nofollow">Broken Poster</a> which is based on the work of Frank Atkinson. The resemblance is too much to be a coincidence, even though the 'makos' lettering seems to have been re-styled to make it less jagged.</p>
      <p>Perhaps someone else made another font based on this lettering, but at least this could be a starting point for them.</p>
      <p>- Mike Yanega</p>
