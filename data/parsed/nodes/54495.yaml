      <p>As much as i try to stay away from applying this geometric form to the logo I find myself coming back to it, although my original sketches did find this to work well. I created this example just using the circle and pen tool. It does have a certain pleasing aesthetic look about it but I'm not totally sold. One can find suggestions of the pulse waves that display on the product, on the contours outlining the logo.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture10_4887.png"></div><p></p>
      <p>This is the product the logo will also be displayed on.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture11_5160.png"></div><p></p>
      <p>Patrick; I haven't got serif black but it seemed to remind me of (PMN Caecilia) even tho thats a slab! I'll get a mock up of that and see how it looks.</p>
      <p>Thanks for your input so far guys!</p>
