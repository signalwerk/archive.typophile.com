    <p>First time I've posted anything like this before, so here goes.</p>
    <p>Just got this new job in to re-design a logo for a Medical Care product. The name is going to be (PEC) (Premier Electromedical Care)<br>
    Due to the nature of the product the client doesn't want anything to complex, so we have agreed to apply just typographic treatment to the name.</p>
    <p>I wanted to get your views on any appropriate typefaces that in your opinion would suit this? in particular a face that has a certain unique stance in uppercase? I'm thinking Sans Serif will be better suited for this job but am open to suggestions otherwise.</p>
    <p>I've done a bit of leg work on this already, Initial sketches found me to be leaning towards the geometric form with the letters sitting well in lowercase, but this style used way to often.</p>
    <p>For those interested you can get some background info on the product from this link.<br>
    <a href="http://www.pec-equipment.com/" title="http://www.pec-equipment.com/">http://www.pec-equipment.com/</a>  (and yes I'm in talks to design the website too :)</p>
    <p>I will be posting the progress of this design through out course.</p>
    <p>Here's a quick Myriad visual of what lettering is involved.</p>
    <p>Cheers.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture8_4298.png"></div><p></p>
