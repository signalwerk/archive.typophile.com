    html: |-
      <p>I can’t help but notice Jayyy speaks from Florida.  Native art is very much a part of northwestern (and southwestern) culture, and I don’t think the reference will be lost at all.</p>
      <p>That said, I don’t think the logo is quite there yet. The top two are my favorites in this last set, but I think you need more organic, woodcut-style lines like the salmon has. The top left one is interesting, but it’s getting dangerously close to an 80’s paisley.</p>
      <p>The middle two logos look like a cat’s head to me, and now I can’t see anything else. They’re just too symmetrical and sleek to look like Native art.</p>
      <p>Oh, and not to sound hyper-pc, but I thought the label “Indian” was banished decades ago!? Where I grew up, it was just as bad as the horrific n-word!</p>
