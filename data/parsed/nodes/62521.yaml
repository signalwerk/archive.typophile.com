    html: <p>It's okay. The "modern" leaf motif (your colored bit) is a bit overused by now though. And it kind of reads like a block with a spot of color in the upper right corner. I think more height differentiation between the letters (a real upper and lower case) would help it to scan better but you are probably constrained by your type. Because you didn't elaborate on what this design is for, I can't speak to how effective it is to the target audience. Hope this helps.</p>
