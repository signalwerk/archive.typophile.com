      <p>I think having an uppercase "A" and "E" would definitely help you getting a more balanced negative space but I have no idea how an uppercase "T" would look like. </p>
      <p>Right now I would really like to see "t's" arm beeing on the same vertical position as the one of "f". Maybe verticaly flip it and you would have a geometrical shape formed by the two initial letters. Allthough I'm not sure this is desired -- but at least it would be possible.</p>
      <p>I agree on bemerx25 that this kind of style is a bit overused but I think you've done a nice job on designing the type and that it has got something special to it.</p>
