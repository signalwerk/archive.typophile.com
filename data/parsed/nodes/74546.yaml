  html: <p>Does anyone know if Lucida Grande (which resembles Helvetica Standard) comes in a rounded version? I desperately need Lucida Grande Round because the periods are looking like square boxes with the Lucida Grande. I can't have those square periods. I've built a video around Lucida Grande and will have to change everything because of these periods. Please can anyone help me find the rounded version of Lucida Grande or suggest some substitutes that hopefully won't mess up my video presentation? Thank you.</p>
