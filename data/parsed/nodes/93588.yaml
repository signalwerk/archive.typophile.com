      <p>Their opening page is a flash file. It is possible to interpret a flash file (.swf) to determine its components. In this case, it includes the font, embedded.  </p>
      <p>The rest of the site seems to indicate that they use this font and a lighter version for all of their client design work. Doesn't make sense to me, but that's how I read it!</p>
      <p>Do move this to the Type ID Board as suggested by Riccardo. You  originally posted in the 'solved ID' section. Not your fault, the site layout is very confusing! But  only you can move the thread to where it belongs, because you originated it.</p>
      <p> - Herb</p>
