      <p>From <a href="http://tundrablog.com/wp-content/uploads/Picture-52.png" title="http://tundrablog.com/wp-content/uploads/Picture-52.png">http://tundrablog.com/wp-content/uploads/Picture-52.png</a>, one can conclude that Atipo sans exists (at least) in light, regular and bold</p>
      <p>If you download <a href="http://issuu.com/corondel/docs/elcorondel_52#download" title="http://issuu.com/corondel/docs/elcorondel_52#download">http://issuu.com/corondel/docs/elcorondel_52#download</a> (in Spanish) and have a look you will find in an article concerning their font Calendas (on page 22) the following sentence:</p>
      <blockquote><p>
      diseñaron la familia Atipo sans para su propio estudio aplicada en logotipo, papelería, web, etcétera.
      </p></blockquote>
      <p>It thus seems rather clear that Atipo sans is  for their own use only.</p>
