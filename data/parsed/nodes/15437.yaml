  html: "<p>I was wondering if anyone had any biographical/background into on <strong>Samuel Welo</strong>, author of <em>The Studio Handbook: Letter and Design</em>? And, while I'm at it, any info on his publisher, <strong>Frederick Drake &amp; Co.</strong>, and its possible heirs and or assigns?</p>"
