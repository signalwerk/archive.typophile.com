    <p>Hello all, I was just curious what some of your favourite typography and design(layout, colour, etc) books are or titles that you would consider being essential. <br> <br>I am in the process of starting a little library of my own and I am always looking to check out new titles. <br> <br>So far: <br> <br>Grid Systems in Graphic Design by Muller-Brockmann <br>Typographie by Emil Ruder <br>Typography - Macro+Microaesthetics by Willi Kunz <br>My Way to Typography by Wolfgang Weingart <br> <br>A friend also lent me Itten's Elements of Color which I am just starting to read. <br> <br>I am thinking about picking up Armin Hoffmans "Graphic Design Manual" and Wili Kunz's new type book. <br></p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081014000724/http://typophile.com/node/4918" class="topic-previous" title="Go to previous forum topic">‹ Arial rounded?</a> <a href="/web/20081014000724/http://typophile.com/node/4907" class="topic-next" title="Go to next forum topic">Does anyone know where I can buy this font? ›</a></div>
