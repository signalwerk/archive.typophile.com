    <p>I need a very particular swashed V. Allow me to describe:</p>
    <p>The attachment (Adobe Caslon Pro, semibold italic) gets very close, but the bowl of the V is too soft and ends up looking too much like a "U" for the purposes of my project. Can anyone think of a typeface that contains a V with a similar character, but a sharper bowl? Something a little more angular (but still retaining the sexy-curviness of the V shape itself?)</p>
    <p>Thank you so much for your help!</p>
