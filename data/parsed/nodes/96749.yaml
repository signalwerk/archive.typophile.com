      <p>Muj, your cellphone bill is unusually low (which I'm sure you realize). Good for you!</p>
      <blockquote><p>Your rants don't contribute much to the issue.</p></blockquote>
      <p>I disagree. You might have no idea how much advantage people take of the "font scene" just to save a few bucks. Like on Typophile we get so many requests for a font identification that's clearly meant to help track down a pirated copy... This isn't that kind of site - quite the contrary. Unlike cellphone service and food for example, fonts are easy to be a cheapskate on. BTW, I wouldn't say I'm "frustrated" (especially since I'm not big on the retail market) it's more a matter of defending something I value, which is not a useless endeavor.</p>
      <p>And Jens is right: you're effectively paying more now (time is money) to fix a problem you could have avoided by spending a modest amount of money in advance (even if your client refuses to pay for it). Does Omnibus Type appreciate the free testing you're doing for  them? Of course. But your client isn't paying for that either!</p>
      <p>Your client is quite probably a cheapskate. I certainly appreciate that saying "no" to a client is tricky business. But don't blame people like me for pointing out that you've placed yourself in an unenviable situation.</p>
      <blockquote><p>Asking for some quick advice online (my initial post) can be very valuable</p></blockquote>
