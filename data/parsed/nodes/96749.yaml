    html: |-
      <blockquote><p>Using CS4</p></blockquote>
      <p>I have just moved to CS6 and so I do not know how representative it will be. The fonts show up in the font menu but separated, the bold, bold italic and regular weights/styles appearing under "Archivo Narrow" and the italic appearing separately as "ArchivoNarrow-Italic".</p>
      <p>Looking at the font files this appears to be the result of the naming conventions for the OT Family Name (TTX: nameID="16") field, which varies as follows for the four weights/styles:</p>
      <p>Regular = Archivo Narrow<br>
      Italic = Archivo Narrow Italic<br>
      Bold = Archivo Narrow<br>
      Bold Italic = (none)</p>
      <p>It should be a simple matter of updating the naming metadata to fix the above and have them all appear together in the font menu but if you are experiencing an issue with missing characters I can replicate the problem or see what might be causing it.</p>
