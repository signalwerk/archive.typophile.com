    html: |-
      <p>The left screenshot shows Archivo Narrow with its glyphs sorted by Glyph Index, not by Unicode (which ought to have been the only setting for Illustrator).</p>
      <p>I find something strange in v1.002, quite possible related, or the immediate cause. The <code>cmap</code> table, determining the mapping between Unicode and font glyphs, seems correct for Platform 0 (Unicode) and Platform 3 (Windows). A snippet:</p>
      <p>U+003E = greater   U+003F = question   U+0040 = at   U+0041 = A<br>
      U+0042 = B   U+0043 = C   U+0044 = D   U+0045 = E<br>
      U+0046 = F   U+0047 = G   U+0048 = H   U+0049 = I</p>
      <p>However, for Platform 1 (Macintosh encoding), I see this:</p>
      <p>U+0005 = B   U+0006 = C   U+0007 = D   U+0008 = E<br>
      U+0009 = F   U+000A = G   U+000B = H   U+000C = I<br>
      U+000D = J   U+000E = K   U+000F = L   U+0010 = M</p>
      <p>As you can see, totally the wrong Unicodes. Most surprising of this is that Illustrator CS4 prefers a Macintosh encoding, even on a Windows system :^)</p>
      <p>This problem cannot be fixed by a font user, it's up to the designer to repair it.</p>
