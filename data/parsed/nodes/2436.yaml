  html: <p>Hello all. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Can anyone help me identify the typeface Burton Snowboards uses in their logo? It's a relativley simple sans, but the "n" is a bit unique in that it doesn't have a "tail" (sorry, not sure of the correct term) on it's left side. It's effectivley an upside-down "u". <br> <br>Thanks in advance! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Jeff Croft <br>http;//jeffcroft.com<img src="http://www.typophile.com/forums/messages/83/22522.jpg" alt="Burton Logo"></p>
  html_clean: <p>Hello all. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Can anyone help me identify the typeface Burton Snowboards uses in their logo? It's a relativley simple sans, but the "n" is a bit unique in that it doesn't have a "tail" (sorry, not sure of the correct term) on it's left side. It's effectivley an upside-down "u". <br> <br>Thanks in advance! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Jeff Croft <br>http;//jeffcroft.com<img src="http://www.typophile.com/forums/messages/83/22522.jpg" alt="Burton Logo"></p>
