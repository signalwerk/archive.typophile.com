    <p>I’ve only been playing with type for a short amount of time, but am already utterly hooked on it.  However, my knowledge is still incredibly limited, so I was wondering if anyone could offer some suggestions regarding a font for a logo.</p>
    <p>The company is called ’exocet’ and is to be depicted in lowercase characters, and I want to be able to use a font that somehow resembles or evokes the same kind of feeling as the typefaces used in old penguin books, and the like.</p>
    <p>So: a serif font that’s not too clean and tidy, and could translate well enough at various sizes.  The only thing I’ve come across that’s close, as an example, is <a class="freelinking-external" href="http://www.myfonts.com/fonts/itfmecanorma/milton/">Milton MN Demi Bold</a>.  I know it’s not one that would’ve been used as body, but it’s just an idea as to the sort of thing that i’m after.</p>
    <p>Does this even make any sense?</p>
    <p>Hope it does...</p>
