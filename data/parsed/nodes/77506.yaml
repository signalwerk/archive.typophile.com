      <p>Just save it as a bitmap tiff in photoshop.<br>
      IMAGE&gt;MODE&gt;GRAYSCALE<br>
      IMAGE&gt;MODE&gt;BITMAP<br>
      Save as &gt; TIFF</p>
      <p>Now drop this file into illustrator,<br>
      you can change the color easily and enlarge it to any scale.</p>
