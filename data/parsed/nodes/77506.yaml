    html: <p>Coreldraw has the best auto tracer ever.  You'd be able to fine tune how big of specs you would like in it, as well as how much or little smoothing you'd like, and a host of other things.  I've never really seen anything else that comes close to it, if only it had an option for making certain line segments straight when they are close enought already being straight (handy when tracing the flat parts of letters) I would never use anything else.  I believe Coreldraw 12 and earlier versions are free now.</p>
