    html: |-
      <p>Hi! I would do it in illustrator CS.<br>
      Go to Object&gt;Live trace and then make. You can do some experiment to achieve what you want. Note: You can clean it up in Photoshop  by adjusting the contrast so that you don't have the in between gray stuff . Photoshop&gt;Image&gt;adjustments&gt;brightness/contrasts.<br>
      Good luck</p>
