    <p>Here's your chance to stretch your type muscles on a weekly basis. You have one week to create and submit your entry. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>As with any street battle, there is no panel of judges and no prize — only the ability to call yourself the best on the block.</p>
    <p>Link directly to this thread: <a href="http://www.typophile.com/battle22" title="http://www.typophile.com/battle22">http://www.typophile.com/battle22</a></p>
    <p>// REQUIREMENTS</p>
    <p>- Image size: 550 width x 400 height. 72 dpi<br>
    - Color: Full color or BW -- you decide!<br>
    - Format: Please save your graphics as PNG or JPG</p>
    <p> <strong>// THIS WEEK'S CHALLENGE:</strong></p>
    <p>It is time to leave the comforts of digital technology (at least partially) and get back to the basics. Utilizing the tool of your choice, scratch the following word into an object or surface:</p>
    <p>Epigraphy</p>
    <p>- Tools might include: a knife, a stick or your fingernails.<br>
    - Objects may be: an apple, a stone or your arm.<br>
    - Photograph or scan the results and submit to the battle.<br>
    <br>
    <cite>There is no photoshoppery or digital manipulation of any kind allowed! </cite></p>
    <p>Winner take all, no holds barred. May be the best designer win.</p>
