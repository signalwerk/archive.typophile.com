      <p>Eben, I was hoping it would mean something to someone… I was also waiting for someone to go OMG I CAN'T BELIEVE YOU DID THAT TO THAT BOOK only to reveal I had to make a copy of the cover because I couldn't bring myself to do that to the original. :P</p>
