      <p>I guess I was hoping for some clever and meaningful idea (beside the fact that we're carving out the word "epigraphy", of course), but oh well… I'll just carve out something nice. But when you were trained as a designer, just making pretty things for the beauty of it always seems a bit random… is that what you're aiming for, Eben? Where's yours? I'm curious… the clock's ticking! :P<br>
      Anyways, here they are, a lot less lazy and a bit more interesting for Chipman and myself:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/epigraphy_italic_2_4188.jpg"></div><br>
