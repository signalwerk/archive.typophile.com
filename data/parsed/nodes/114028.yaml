    html: |-
      <p>Hi Don,<br>
      It does look like, especially Peignot Demi. Yes, hehe, very French ;)<br>
      It's still different, though, as the middle bar of the E is not in the middle (but higher) in "Pégase" and is shorter and the loop in the P doesn't end in the middle either, but goes lower. Also, the bar in the G goes down rather than being 'rounded'. Finally, there's that slight Art Deco look (for example, the middle part of the S and the G).<br>
      See what I mean? (I'm sorry I don't exactly have the right terminology..)<br>
      Have a nice week end!<br>
      Ben</p>
