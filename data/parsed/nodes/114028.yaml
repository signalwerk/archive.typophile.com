      <p>Thick and thin sans lettering has had some popularity since the 1890s. Early examples of such fonts include Taylor/Globe Gothic and Studley [not digitized]. It is quite possible that the similarities to Peignot &amp; Chambord are the result of independent evolution of lettering styles.<br>
      Don</p>
