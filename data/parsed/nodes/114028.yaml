    html: <p>Thanks for mentioning Chambord, Don. It caused me to investigate further. <a href="http://typophile.com/node/75590" target="_blank" rel="nofollow">Here</a> is an old Typophile thread that yields a link to a PDF showing Chambord's variants (I rather like the condensed). Also, an interesting assertion from Hrant. If true - and Chambord <em>does</em> look very derivative of Peignot - it might explain why nobody has been eager to digitize it. Or maybe it's just licensing issues ...</p>
