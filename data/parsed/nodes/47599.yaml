      <p>“so then would we say that this is ok?”</p>
      <p>No, it is not ok, it is also not  criminal. It is just not what a professional should do. A professional should know their client’s company, their products and services, and their position in the market. They also should know their competitions position and image. The idea is to position your clients brand to be, distinctive, desirable, and easy to work with. This means doing due-dilligence in seeing what they are up against and steering them away from potential law suits due to your work with them.</p>
      <p> ChrisL</p>
