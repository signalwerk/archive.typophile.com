      <p>I think it’s silly to assume ’unique’ is a prerequisite to good design. Plagiarism is bad, yes, but so it forcing uniqueness when it’s not needed.</p>
      <p>Plumber = pipe wrench = best solution for probably a majority of plumbers that need a simple icon to show up on the side of their van. It’s great to come up with that one unique solution, but sometimes it’s not needed, and is even a bad thing.</p>
      <p>In terms of student work, the issue compounds itself when a professor tends to use the same project over and over again each semester. It can quickly saturate a market’s young portfolios with a lot of the sameness.</p>
      <p>These days you post a logo online and within an hour you’ll have 10 people pointing out similar concepts. That’s not plagiarism. That’s just coincidence.</p>
