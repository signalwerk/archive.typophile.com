      <p>I think Nick and Si are both right. We all have an idea of the Frutiger a, but to recreate a facsimile as faithful as . . . name your clone . . . . I wouldn’t want to try it out of the air. On the other hand, it’s Downer’s profession to be able to do this. He might be able to do it with Helvetica, after a lot of practice, but not with for example Syntax — or with Fontesque to take it to an extreme. In any case: he’s trained to be able to replicate these faces fairly accurately - - the rest of us aren’t — perhaps not even our own. Jeff Level used to get quite a charge out of repeating an encounter with Zapf during which Zapf proved — it was considered an exceptional feat — that he could draw Palatino accurately, from memory, at 12 points. He prefaced this with the immortal remark, ’I vill now draw for you ze Palatino!’</p>
      <p>I do think that a lot of us could draw from scratch a nice Frutiger-ish a, and use it as the basis for a nice new sans serif. But the people whose Frutiger clones are nearly indistinguishable from Frutiger have, I think obviously, gone a lot further than that.</p>
