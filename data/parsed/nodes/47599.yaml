      <p>more often than not I think polygenesis becomes plagiarism when a designer makes a choice to end their creative process before reaching a unique viewpoint. </p>
      <p>It seems more rare that someone would blatantly plagiarize a work. Although, that negative conclusion is the first we usually come to when similarities are spotted. </p>
      <p>I once designed a logo that we failed trademark before putting into use and later found a competitor had adopted a very similar mark with an additional “t” in the name and an uglier typeface for a similar product. The date on their trademark was listed before our first use, so it would have been difficult to press plagiarism, but the process we went through to create the logo made it difficult for us to think it could have been polygenesis. I do my best to try and think they didn’t deliberately copy our mark and lie about the trademark date, but the thought gets the better of me sometimes.</p>
