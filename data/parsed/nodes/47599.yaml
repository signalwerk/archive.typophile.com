    <p>Just a thought...that will hopefully initiate a good discussion and get these cobweb-covered minds thinking on a Monday morning, after a long hot humid weekend. ;)</p>
    <p>As creative individuals, we can come up with unlimited ideas, at least in theory. So when two designers on different sides of globe are given an similar project (i.e., an identity for a plumbing company), and they just happen to come up with identical solutions......then what do we consider the outcome?</p>
    <p>Is it...<br>
    A. Plagiarism with intent? I don’t think this needs to be explained since we all know what plagiarism is.<br>
    B. A project with a predisposed outcome? Let’s face it: regardless of our individual creativity, there are solutions that are destined for specific projects. For the example above (plumbing company identity) how many of us would try to use an image of a tool that a plumber uses, or use a certain image of existing plumbing, or fabricating the type to look like pipes?</p>
    <p>So can it really be called plagiarism if two different designers come up with very similar solutions for a project that has a similar concept, or rather, potential for a similar solution? And if two projects are similar in their brief/requirements, will the solutions always be similar, or should we strive (as uniquely creative people) to come up with really distinct solutions? Or are some outcomes so predictable that there is no other choice?</p>
