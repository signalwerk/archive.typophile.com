      <p>Similarity of independedent outcomes = polygenesis.</p>
      <p>Plagiarism = not acknowledging known sources.</p>
      <p>**</p>
      <p>With simple execution, it’s more likely that polygenesis will occur, and be apparent.</p>
      <p>Therefore, simplicity is in danger of banality, and, ironically, vague distinction.</p>
      <p>**</p>
      <p>Ignorance is not really an excuse for either polygenesis or plagiarism—for the true professional—who should know what’s “out there”.<br>
      Searching is more and more fruitful, with powerful recognition analysis tools such as MyFonts’ “What the font?”.</p>
