      <p>Plagiarism is knowingly taking another person’s design and willfully copying it with or without minimal changes. Some solutions are heavily odds-on favorites to be done by coincidence. If two different paperclip companies end up with a logo that looks like a paperclip, I am not a bit surprised. It is a designer’s duty to at least suggest a search be done before a new logo is put into service. Branding or logo design is not just a matter of drawing skills and a quick idea-hatching session. Granted, this is done every day by bargain so-called design firms. If an idea comes too easily, chances are that someone else also thought of it. Branding is about finding what is unique about the client company and portraying it in a memorable way while maintaining brand separation from competitors. That is not to say that 3 car rental firms can’t all have a car-like image as a brand. Each one should have enough unique about it to identify the parent company easily, though.</p>
      <p>ChrisL</p>
