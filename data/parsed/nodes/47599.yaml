      <p>The question was,</p>
      <p>&gt;... is it plagiarism (w/ or w/o intent) ... when two designers on different sides of globe are given an similar project (i.e., an identity for a plumbing company), and they just happen to come up with identical solutions......then what do we consider the outcome?&lt;</p>
      <p>the answer is, in 9 cases out of 10, the ’identity’ will be a new font identical to Frutiger. </p>
      <p>So yes, it’s plagiarism, yet not of each other but of Frutiger. </p>
      <p>OK, it’s plagiarism. The next question is, is it intentional or unintentional?</p>
      <p>There are two answers. Every designer who has ever copped Frutiger tells you they came up with nearly the identical design by chance. The other answer . . . . . </p>
      <p>So what’s interesting is the extent to which Helvetica is the only vernacular sans recognized by most business people who still, forty or so years later, find something wonderfully forward and original in Frutiger. </p>
      <p>So then the question becomes, why, if you need an entirely ’fresh’ look for goons, is Frutiger still the only safe way to deliver it? </p>
      <p>And let’s just remember that ’goons’ isn’t just businessmen with zero design &amp; technology experience. Both Adobe and Microsoft have fallen into this popular trap. </p>
      <p>The peculiar thing is how terribly limited the trusted typographic vernacular is.</p>
