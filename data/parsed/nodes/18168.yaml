    <p>I've had a hard time IDing this for a friend. It's from People Magazine. It looks like Neuraface Condensed or Relay but its not. I realize it could be custom but I'm hoping for a simpler explanation. By the way, note the Georgia italic with the custom "y." Any help appreciated as always.</p>
