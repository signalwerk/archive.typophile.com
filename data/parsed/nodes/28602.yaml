      <p>This isn’t a joke, ahh:</p>
      <p>“How will the world know and recognize Newfoundland and Labrador? It will know us for our pride and passion. Our unique way of looking at the world. And our creativity. Creativity that runs deep within our culture and in our DNA. That helps us adapt in a harsh and unforgiving environment, through the wind and the rain, the sleet and fog. It’s our fierce determination and tenacity that give us the strength to rise above it all, facing the sun and the future with youthful optimism.<br>
