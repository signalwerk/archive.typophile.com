  html: |-
    <p>Recently the government of the Canadian province in which I live, Newfoundland and Labrador, came out with a new million-dollar branding scheme. The new logo features our provincial flower, the pitcher plant, and what I consider to be a debaucherous bit of type design which is, I guess, supposed to emulate the pitcher plant. I keep picturing the three flowers as space weapons poised to zap the repugnant f into oblivion.<br>
    What does everyone think?</p>
