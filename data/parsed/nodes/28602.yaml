      <p>Now, now. every once in a while, step back, take a deep breath and put yourself in the shoes of the target audience.</p>
      <p>I’m not sure who that is in this case, but I’ll try to do it anyway. I’ve got an elastic-bound candy necklace around my neck, and I’m inching the first candy link up my chin via the miracle of stretchiness to take that  delicious bite. I’m feeling closer to this logo. I’m doing this while I’m speeding along in the back seat of my parents Quebec registered car…I’m feeling closer. I see the sign through the streaming red hair of my dolly, who’s hanging out the window, and it hits me, she’s so lucky she doesn’t have to wear a seat belt. I’m feeling it for sure now. I can see the sign! and I shout in my shrill little voice, “MOMMY! DADDY! Can we go da New Found Land and Laber Door!?” And Mommy says, “We’re almost there Barbie dear!”</p>
