    <p>I've always enjoyed both Bodoni and Scotch style faces. I wanted to introduce some ‘fashion sense’ into the ‘work horse’, and get something unique. I think there's some potential to make it into a text face, eventually expand it, but I wanted to get some feedback here first. I honestly have no idea what I'm doing, folks. It just sounded like a worthwhile idea to entertain.</p>
    <p>I've been looking at Monticello quite a bit, and referencing a generic Bodoni for logic and proportion. For what it's worth.</p>
    <p>What do y'all think of that |Q|? and<br>
    I realize the teardrop is missing from the |g|. Bear with me.<br>
    Thanks to raph for the <a class="freelinking external" href="http://typophile.com/node/14710#comment-84480" rel="nofollow">Monticello Specimens.</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WrenlochSpec1_5033.jpg"></div><br>
    I've attached a PDF so folks could see this without the display disintegrating the stroke.<p></p>
