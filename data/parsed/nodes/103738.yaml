      <p>Thanks everyone for the great feedback. I'll get to work on refining this with all the critiques in one.</p>
      <p>Hrant - I was amazed too about the Baskerville spirit hiding in the hybrid. It wasn't what I was expecting, but I'm really happy that it creates something recognizable, but unexpected. I'll work on the wonkiness as things get ironed out.</p>
      <p>Briän - Thanks for all the nit-picks. It's just what I needed. All the things you're talking about were unintended. The caps being condensed, the spacing overall (not nearly done and considered), and the everything else. The funny part is that it started as a slightly condensed design, but then I decided to normalize it. I guess it wasn't quite enough.</p>
      <p>Joshua - Thanks for the insight on the Didone construction. That'll help decrease the wonkiness Hrant was mentioning.</p>
      <p>I'm fairly new to this whole process, and I'll try anything that y'all have said. I'll report back by the end of the week. Thanks to all three, so much.</p>
