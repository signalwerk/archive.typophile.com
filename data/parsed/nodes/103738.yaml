      <p>A good start but needs refining. I have a bunch of nitpicks, please don't take them without a grain of salt.</p>
      <p>--&gt; The |s| looks to me to be a little off compared to the |S|.<br>
      --&gt; I don't think the tail of the |Q| is quite working. Perhaps move it over to the center instead of having it drop off the left side?<br>
      --&gt; The caps overall seem condensed compared to the lc. Was that intended?<br>
      --&gt; The spacing, especially the lower case, seems a tad off. Maybe tighten it just a tad?<br>
      --&gt; I would consider making the word spaces a thinner.<br>
      --&gt; The right bottom serif of the |l| is shorter than the left, was that intended?<br>
      --&gt; The |j| seems spaced a little tight on the right side compared to the rest.<br>
      --&gt; The |r| has an especially large gap to it's right, maybe try something to fix that? You could: (a) condense it a little, (b) make the join a little lower, (c) lengthen the right bottom serif a tad. A combination of all three wouldn't hurt, depending on what you're going for.<br>
      --&gt; The lower loop of the |g| is a wee bit off. Maybe a little too much towards a Garamond look. You might try looking at interesting type samples from near that era. Does anyone have some enticing examples? :-)<br>
      --&gt; The tail of the |R| and the |g| missing an ear might be off.</p>
      <p>It would be good to mention that every single part of each glyph can be manipulated to your benefit. Don't ever be afraid to think outside the box.</p>
      <p>Don't give up! Love to see you continue with this.</p>
