      <p>A good start! I would encourage you to work on the consistency of the hairlines and serifs and stroke endings. </p>
      <p>For the hairlines (especially on a Didone) they must all be the same thickness. From the crossbar on the "f" to the legs of the "N" and the top and bottom of rounded characters like the "O", go for a consistent thickness throughout.</p>
      <p>The serifs and stroke endings should also be consistently rounded (like on the "E") or have the chiseled, straight-edged appearance of the rest of the serifs. Also, make sure the serifs appear to be about the same thickness as the hairlines. Right now they're a lot thinner looking.</p>
