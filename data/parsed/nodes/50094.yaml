  html: |-
    <p>If I choose one typeface for a logo should the typeface used for all the print materials like brochures for eg.(bodytext and headlines)be from a different typeface family or it doesn’t matter? If it matters, why is that so?</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081121143829/http://typophile.com/node/49924" class="topic-previous" title="Go to previous forum topic">‹ Lucida Grande and Optima for web</a> <a href="/web/20081121143829/http://typophile.com/node/50119" class="topic-next" title="Go to next forum topic">Vista sans with Garamond or Minion? ›</a></div>
  html_clean: |-
    <p>If I choose one typeface for a logo should the typeface used for all the print materials like brochures for eg.(bodytext and headlines)be from a different typeface family or it doesn’t matter? If it matters, why is that so?</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20081121143829/http://typophile.com/node/49924" class="topic-previous" title="Go to previous forum topic">‹ Lucida Grande and Optima for web</a> <a href="/web/20081121143829/http://typophile.com/node/50119" class="topic-next" title="Go to next forum topic">Vista sans with Garamond or Minion? ›</a></div>
