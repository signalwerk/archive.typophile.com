    html: |-
      <p>It is all about context. If the typeface you’ve chose for the logotype is very strong then using something different is a good way to balance and not overpower. If the typeface is subtle it is ok to use the same typeface. Or, you can really mix it up and do the opposite. It all depends upon the message you are trying to convey.</p>
