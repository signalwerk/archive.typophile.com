      <p>Mark—</p>
      <p>The ridiculous amounts of money which people are willing to spend on cellphone service makes it abundantly clear that font subscription services as a reliable revenue stream is the wave of the now, to which Monotype’s SkyFonts service attests. As I envision it, a subscription-based font service—costing as little as $1 per session—ought to let you to install the font on your local machine, for use in an application which you are comfortable using, for the duration of one work session.</p>
      <p>As I understand it, Windows writes fonts directly to the Registry, which entails giving explicit permission to do so, anytime a font is installed or <strong>uninstalled</strong>. People often get nervous about giving such permission—as well they ought, given the abundance of malware which masquerades as legitimate software. Also, people of less than stellar moral character might simply choose not to uninstall the font. My proposed workaround would be to write directly to the Font Cache, so that the font was immediately available, but would be cleared from the Cache at the end of the working session—assuming that the same level of permissions would not be required, and that the task could be easily accomplished</p>
