    html: <p>When I have to do this sort of thing. I use a Windows program called "Do it again" from spacetornado.com. It lets you record a series of mouse clicks and keyboard activity and then repeats it as many times as you like. It's a little bit Chitty chitty Bang Bang/Wallace &amp; Gromit but when you have to repeat the same tasks on a zillion fonts, it does the trick.  You can regulate the speed of each event but don't set it too fast. In the middle of the night, Windows might decide to do some task that causes a brief slowdown and the whole thing goes out of sync. Slow and steady. It's a great excuse to get away from the computer for a day while it's running. Make a backup because sometimes, things go very, very wrong. Once it escaped the Fontlab window and deleted family photos.</p>
