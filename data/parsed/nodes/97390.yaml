      <p>Janek—</p>
      <p>Yeah: that nuisance is a nuisance, especially since a lot of younger, self-styled designers appear to have serious reading comprehension problems. The “Convert to Outlines” was always envisioned as the primary “Save Your Work” option—with “Convert to Bitmap” and “Save as PDFx File”—assuming that the PDF generator actually creates a non-editable and wholly reliable character-subset document.</p>
      <p>It probably wouldn’t work in CorelDraw 9, either—at least, not with OTF fonts. With v10 and beyond, Draw relied on Windows native Postscript support, added with Windows 2000/NT4.</p>
