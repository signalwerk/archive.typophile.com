    html: |-
      <p>Ray—</p>
      <p>Thanks for the tip: the program sounds like a Mad Macro Recorder. I recorded and used my first macros working on a Chyron IV character generator at KXAS-TV in 1982. Later (three years or so), I made extensive use of them when I operated a Compugraphic 8400 dedicated typesetting machine.</p>
      <p>In Ye Olden Days, macros were usually limited to 256 characters. You could get around this restriction by nesting macros within macros—I seem to recall using as many as seven to make typesetting business cards simply a matter of typing the name, then hitting the right arrow key, where the program would pause for additional input, then lather, rinse and repeat…figuratively speaking, that is.</p>
