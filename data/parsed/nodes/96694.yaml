      <p>There's an obvious sense in which @font-face involves a kind of 'redistribution' in that the font file, in whatever format, is served from one place and ends up being cached some place else. But I don't think this broad use of 'redistribution' is very helpful to discussion, since it misses the point about which someone who wishes to restrict redistribution is most likely to be concerned, i.e. the use to which the font is put. Font makers and vendors are right to be concerned about @font-face, both in terms of web served fonts and as part of epub packages, in that the font files are out-and-about and are exposed to various kinds of unlicensed use. But the purpose for which they are served or packaged is not to redistribute them for use -- creating new documents, setting new text --, whether licensed or unlicensed, but to make them available <em>to be read.</em> Distribution of the font file is a by product of that intention.</p>
      <p>If someone sends me an email asking is he can redistribute one of my fonts, I know what kind of question that is and while details may vary I know, generally speaking, what it implies: making the font available to some third party for use. If someone is wondering if he is able to serve the font as a web font, that is what he asks. He doesn't ask if he can redistribute the font, because there's a common sense use in which that term doesn't include web font serving any more than it included PDF embedding. We can and should have sensible discussions in such terms, mindful, yes, of both the legal specificity of license agreements and the technical obviousness of a file being copied to some remote location via @font-face, but not ignoring common sense understandings.</p>
