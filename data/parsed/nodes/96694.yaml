      <p><em>That's misleading because you're not really redistributing the fonts, and some font houses -like Adobe- do allow you to modify their fonts.</em></p>
      <p>I firmly believe that @font-face <em>really is</em> redistributing fonts. </p>
      <p><em>Also, if you commission a font (the ultimate in "proprietary" :-) you can decide to do anything you want with it (like happened when I was commissioned to make Arasan back in the day).</em></p>
      <p>John Hudson pointed out to me years ago that there is a namespace slash around the word 'proprietary' in the software and typographic communities. </p>
      <p>"Proprietary" in typography means 'bespoke' </p>
      <p>"Proprietary" in software means 'not respecting the 4 software freedoms' </p>
      <p>This can obviously be rather confusing, since if you can decide to do anything you want with it, its very much a libre font, that software and type freedom is about the users, and there is not requirement to make libre works public, although since @font-face makes readers into users, private libre type is unlikely.</p>
