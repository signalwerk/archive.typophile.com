    <p>A news item on Typophile* claims that "the latest introductions of web based typography allows for layering and transparency". This is really juicy if it is in fact robust and widespread. And it might be the nail in the coffin of Photofonts.</p>
    <p>* <a href="http://typophile.com/node/96691" title="http://typophile.com/node/96691">http://typophile.com/node/96691</a></p>
    <p>So my question is: For real reals?</p>
    <p>hhp</p>
