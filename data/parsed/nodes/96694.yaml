      <p>Dave, I don't think we're disagreeing on too many points, but for some reason I am failing to explain my original complaint... Let me try this:</p>
      <p>You want to do layered type. You can't use virtually any retail font because you're not allowed to redistribute* a modified font (but more below). So you figure to use a libre font. Sure. But there's another way: pay somebody to make a font for you which you can do anything you want with. Why would you spend money when you technically don't have to? The usual reasons: design quality (there's still a difference there between free and not) and exclusivity.</p>
      <p>* For the sake of argument working with the "@font-face implies distribution" stance.</p>
      <p>BTW if @font-face does imply redistribution, then you're breaking the EULA even if you don't modify it, right? What I mean is: if a font house doesn't mind @font-face they won't mind @font-face used for a modified version*. So using an imaginary impediment as an endorsement for libre fonts isn't sincere.</p>
      <p>* Assuming a house like Adobe that allows modification.</p>
      <p>Libre fonts do have a role to play, especially concerning this layering business. But "proprietary fonts always forbid redistributing modified versions" remains misleading, exaggerating the centrality of libre fonts. There is another way.</p>
      <p>hhp</p>
