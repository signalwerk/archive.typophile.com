    html: |-
      <p><em>frode frank</em><br>
      Well sure it's not as simple as applying a background-image but it's certainly not as difficult as applying a border-image. But then again, I guess it depends on the knowledge one has with CSS.</p>
      <p>Syntax:<br>
      <code>@font-face {<br>
      	font-family: 'MyFontFamily';<br>
      	src: url('myfont-webfont.eot?#iefix') format('embedded-opentype'),<br>
      	     url('myfont-webfont.woff') format('woff'),<br>
      	     url('myfont-webfont.ttf')  format('truetype'),<br>
      	     url('myfont-webfont.svg#svgFontName') format('svg');<br>
      }</code></p>
    html_clean: |-
