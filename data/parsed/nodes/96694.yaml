    html: |-
      <p>It's not a terribly semantic nor accessible technique, though. </p>
      <p>For instance, to make a headline:</p>
      <p>"This is a Headline!"</p>
      <p>An '8 layered font' using this technique would actually have this for markup:</p>
      <p>This is a Headline!<br>
      This is a Headline!<br>
      This is a Headline!<br>
      This is a Headline!<br>
      This is a Headline!<br>
      This is a Headline!<br>
      This is a Headline!<br>
      This is a Headline!</p>
      <p>Kind of annoying especially if you are using something like a screen reader.</p>
      <p>Granted, at least for this type of typeface one would only be using it for display text, and there's certainly arguments for using it at times. But it's definitely a 'hacky' solution (and is by no means a 'new' solution, either).</p>
