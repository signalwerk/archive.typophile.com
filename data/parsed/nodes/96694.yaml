      <p>No not HTML5. Those offset light brown numerals were created with lettering.js. So was this, <a href="http://trentwalton.com/2011/11/18/workspace" title="http://trentwalton.com/2011/11/18/workspace">http://trentwalton.com/2011/11/18/workspace</a>. If you highlight the hanging letters, you will see they actually highlight. Not what you see when trying to highlight an image. So it's actual characters manipulated via javascript. You can also put background images in the shape of the letter.</p>
      <p>We are also able to use ligatures and swashes with CSS.<br>
      <a href="http://elliotjaystocks.com/blog/the-fine-flourish-of-the-ligature" title="http://elliotjaystocks.com/blog/the-fine-flourish-of-the-ligature">http://elliotjaystocks.com/blog/the-fine-flourish-of-the-ligature</a><br>
