    <p>Is it still worthwhile to print a good-looking portfolio and mail it to a design firm? When I first went into school I heard people talk about this, but the last time I remember it coming up was at least two years ago. When I talk to people about jobs now, or see a job listing online, everyone wants to see an online portfolio or get a PDF via email; nobody has ever asked for anything else. </p>
    <p>I ask because I have been thinking about doing a nice, simple piece to mail out to a few places, but it occurred to me that 1) it might be a waste of time better spent sending emails or redesigning my web site and 2) people might think I’m a moron for inconveniencing them with snail mail in 2008.</p>
