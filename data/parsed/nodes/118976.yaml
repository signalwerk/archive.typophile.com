  html: |-
    <p>Hi all!<br>
    What would you suggest to replace Lobster on a blog? It is currently used for the site name and all headers and while I don't mind it for the site name, I think it is messy and difficult to read in the headings and sub-headings in the posts. The main text font is Helvetica Neue, sans-serif, and the sidebar headings are Montserrat sans-serif. I'm looking for something that's clean and modern without being too stern.</p>
    <p>This is the site:<br>
     <a class="freelinking external" href="http://andmykitchensink.com/" rel="nofollow">http://andmykitchensink.com/</a></p>
    <p>Any ideas are greatly appreciated!</p>
