    <p>Hi, everyone. I’m new to Typophile and I’m hoping some of you can shed some light on a problem I’m having.</p>
    <p>I recently purchased a comprehensive OpenType font family that includes a wide range of weights and styles. The problem is that the font designer has not style-linked the font family, so I now have over 40 individual weights and styles that appear in the font menu. Additionally, I can’t take advantage of keyboard shortcuts for bold or italic, and typical OpenType features such as automatic ligatures or alternative sets are not supported.</p>
    <p>The font family is beautiful and well-designed, but the absence of style-linking and the lack of OpenType tyographic features makes production a nightmare. It’s incredibly time consuming to change weights, insert special characters or switch between old style and lining figures.</p>
    <p>I’m wondering if anyone has experienced this same issue and if there’s anything I can do on my end to make the fonts more manageable. Are there any font management utilities for the Mac that can style-link fonts? I am working primarily in Pages and Keynote, if that has any bearing on the issue. </p>
    <p>Thanks in advance for your help.</p>
