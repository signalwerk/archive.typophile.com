      <p>&gt; <em>Are there any font management utilities for the Mac that can style-link fonts?</em></p>
      <p>AFAIK, the fonts have to be built in a certain way in order for style-linking to work on the application’s side. I’m not sure that you can achieve that with a font management utility.</p>
