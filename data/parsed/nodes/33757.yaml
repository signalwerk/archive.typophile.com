    html: |-
      <p>OpenType-savvy applications would not need style linking to group members of the same family — a family’s styles will be automatically grouped in the font menu as long as they share the same ’name’ table entry for name-ID16, or name-ID1/Mac in case of Apple’s OSX apps.<br>
      (As to bold/italic shortcuts, it is really better to use style sheets and assign shortcuts to them, in case that this is possible in Pages.)</p>
