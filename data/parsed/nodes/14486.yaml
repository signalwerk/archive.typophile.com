      <p>Thanks to all for sticking with me on my quest for a good logo!</p>
      <p>One thing I think I may not have made clear is the concept of clean and simple. I think that was too short a description, so I will try to explain my idea more clearly. It's not that I want to do simple design like Jakob Nielson's <a href="http://useit.com/" rel="nofollow">useit.com</a>. While it is simple and clean, I also find it visually horrid. I find typophile.com to be simple and clean while also being visually pleasing and to me it is what "designy" <em>should</em> mean! So I think that my real goal might be to change the meaning, at least for some.</p>
      <p>That said, type is one area where I am no master. But I am certainly willing to be persistent in my pursuit of a visually appealing mark. :)</p>
