      <p>I think the son-of-my-idea, #3, works best. The "d": at first I was going to suggest trimming its ascender, but then I realized it gives a nice character to the mark; and you could shorten it (hey, maybe even lengthen it!) as needed, maybe even using the vertical line as a "flexible" part of your identity. One thing I <strong>would</strong> change though is make the descenders of the "g" and the "y" the same, probably by trimming the former and lengthening the latter, maybe even making both end horizontally (no up-curve).</p>
      <p>Here's another idea, if you wanted more whimsy/complexity:<br>
      make the righthand stem of the "n" a slight diagonal, and use a<br>
      parallel diagonal arm in the "y" (instead of the "u" component).<br>
      Or what about joining the "n" and "y" by sharing a stem?</p>
      <p>hhp</p>
