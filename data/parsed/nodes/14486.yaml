      <p>&gt; try the same style with the roman weight</p>
      <p>If you want an ironic effect, I think this is right. The difficulty in pulling of an ironic design can be higher... The question is what effect are you gunning for? I don't want suggest that one effect or the other is right. Whatever effect is desired it should be a delibertate and historically aware decision.</p>
      <p>&gt; The context of the logo should also be addressed</p>
      <p>Yes. Totally!</p>
      <p>Jeffery, there is alot of carry-over mid century modernism in graphic design for the architecture/retail trade. Lighting, pens, furniture. It's a kind of 'safe' othodoxy. It's seems like one of the things that emigre magazine was in opposition to. It's a kind of retro style. It also remains very popular. This isn't bad ( or good ) per se - it's just that there is a history &amp; you should probably be aware of it. Do you know what I am talking about? If so, is this history something you want to tap? Or is you intended direction different? You might have something quite different in mind.</p>
      <p>here are some urls that trade in the sensibility I am refering to<br>
      <a href="http://www.cassina.com/index_ok.html" title="http://www.cassina.com/index_ok.html">http://www.cassina.com/index_ok.html</a><br>
      <a href="http://www.petermiller.com/" title="http://www.petermiller.com/">http://www.petermiller.com/</a></p>
      <p>Given that you are a web developer the direction I have described makes sense to me in that you can be seen as an un-fussy &amp; reliable source of services. But to be seen as more than 'simple' the design will have to be sophiticated. The power of the identity will come from the context or way that that your mark is used in as much as or ideally more than the logo itself.</p>
      <p>I think that's why Tim is quite rightly bringing up context. </p>
      <p>One thing I am not completely clear on is, is yours a technical service in the main, or primarily a design service? I thought I knew &amp; then I re-read the posts &amp; I realized that i was making an assumption that you were mainly offering design. Now I think I may have mis-understood. If I have - that would be part of the context too.</p>
