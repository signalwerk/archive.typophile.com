    <p>I am from a cartoon background, no typography skills compared to what I have seen just browsing this forum. I have become a decent web site developer and am trying to create my logo. I want to do simple, clean websites. So I wanted a simple logo. But how simple is too simple? That is my problem. So far the one I came up with is just straight helvetica neue bold. In an attempt to not be too dull, I came up with the not so unique idea of reversing the last letter and giving it a different color. Not the most brilliant idea, but now I sort of like it. Any suggestions are greatly appreciated.</p>
