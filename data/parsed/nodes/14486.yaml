      <p>I agree that 3a is the most promising direction. The direction represented by 3c and 3d is certainly more graphical, but it gets lost between the typographical and the graphical. By that I mean: it's not far enough one way or the other, and ends up coming across as 'clever'.</p>
      <p>As such, it takes me out of the mental state of percieving the brand the logo represents, and makes me think of how clever the designer is, what he might be reaching for, and whether or not he succeeded.</p>
      <p>So: I vote for a less obtrusive direction, probably typographic, and let the notion of the word 'designy' speak your message, without any graphical wizardry to reinforce that message (notice I could have used the word 'sans' there, but resisted and used 'without' instead).</p>
      <p>Taking that train of thought to your 3f series, while I like the fact that the 'e' takes your eye to the dot in the 'i', I think the treatment is largely unnecessary, and even slightly destructive to the delivery of the brand.</p>
