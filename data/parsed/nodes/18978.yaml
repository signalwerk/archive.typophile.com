    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Andreu Balius</strong></p>
    <p>Andreu Balius is a graphic and (type) designer based in Barcelona. He was the creator of the experimental type project Garcia fonts &amp; Co. (1993), and founder of the Typerware studio (1996-2001) in Santa Maria de Martorelles, a little village near Barcelona. At present he runs <a href="/wiki/Typerepublic" class="freelinking" rel="nofollow">Typerepublic</a>, which is specialized in designing and producing typefaces.<br>
    He combines his work at the studio with teaching graphic design and typography. He is presently an associate professor at Pompeu Fabra University in Barcelona. Andreu has received various prizes for his typographical projects and given lectures on this subject. Some of his typefaces were released by ITC and FontFont.<br>
    Apart from his type affairs, he also loves riding on his mountain bike.</p>
    <p><a href="http://www.andreubalius.com" title="www.andreubalius.com">www.andreubalius.com</a></p>
