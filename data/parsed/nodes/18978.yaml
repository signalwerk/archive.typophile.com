    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Andreu&nbsp;Balius</strong></p>
    <p>Andreu Balius is a graphic and (type) designer based in Barcelona. He was the creator of the experimental type project Garcia fonts <span class="amp">&amp;</span> Co. (1993), and founder of the Typerware studio (1996-2001) in Santa Maria de Martorelles, a little village near Barcelona. At present he runs <a href="/node/18977" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typerepublic</a>, which is specialized in designing and producing typefaces.<br>
    He combines his work at the studio with teaching graphic design and typography. He is presently an associate professor at Pompeu Fabra University in Barcelona. Andreu has received various prizes for his typographical projects and given lectures on this subject. Some of his typefaces were released by <span class="caps">ITC</span> and FontFont.<br>
    Apart from his type affairs, he also loves riding on his mountain&nbsp;bike.</p>
    <p><a href="http://www.andreubalius.com">www.andreubalius.com</a></p>
