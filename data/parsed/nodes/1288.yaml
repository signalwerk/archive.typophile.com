    html: <p>I think just looking at the g in most samples of Carolingian Minuscule will give you a good idea on how to shift between the diﬀerent g-forms back and forth in history. The more you’ll get, anyway, the most complete the picture will be. Gill’s example may be misdirecting, since the samples are all redrawn by himself. (Hi, Nathan, anyway! Hope you’re <span class="caps">OK</span>! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> )</p>
