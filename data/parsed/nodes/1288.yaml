  html: <p>I'm not precisely a historian of type, and so this question has been irking me lately... Where did the binocular g come from?  It looks to me like it evolved from a cursive letterform, but it's not accompanied by other cursivised forms, in most cases (such as the 3-like z and delta-curved d).  (Which is unfortunate, because I'd love to see a face influenced by those forms.)</p>
