    html: |-
      <p>Re-reading Gill's <i>Essay on Typography</i> I just found this: <br> <br><br>
      </p><blockquote>¶Again, take the letter G. The evolution of our modern small g is seen to be chiefly due to the prevalence of &amp; consequent familiarity with hastily scribbled forms (see fig. 3). [below] Nevertheless, in no case does the scribe imagine he is inventing a new form; he is only concerned to make well or ill the form with which he is familiar. <br>¶By the sixth century a form of writing obviously more natural to penmanship (see British Museum Harl. MS. 1775) had been evolved. And the process continued until all resemblance to the Roman original was hidden (see B. M. Add. MS. 24585). <br>¶I am not concerned to describe in detail the history of the process in its technical and economic significance. The point that chiefly concerns me is that, with whatever tools or materials or economic circumstance (that is hurry &amp; expense), the artist, the letter-maker, has always thought of himself as making existing forms, &amp; not inventing new ones.</blockquote><p></p>
      <p> <br> <br><img src="http://www.typophile.com/forums/messages/29/18117.gif" alt=""></p>
