    html: |-
      <p>Re-reading Gill’s <i>Essay on Typography</i> I just found this: <br><br><br></p><blockquote>¶Again, take the letter G. The evolution of our modern small g is seen to be chieﬂy due to the prevalence of <span class="amp">&amp;</span> consequent familiarity with hastily scribbled forms (see ﬁg. 3). [below] Nevertheless, in no case does the scribe imagine he is inventing a new form; he is only concerned to make well or ill the form with which he is familiar. <br>¶By the sixth century a form of writing obviously more natural to penmanship (see British Museum Harl. <span class="caps">MS</span>. 1775) had been evolved. And the process continued until all resemblance to the Roman original was hidden (see <span class="caps">B. M.</span> Add. <span class="caps">MS</span>. 24585). <br>¶I am not concerned to describe in detail the history of the process in its technical and economic signiﬁcance. The point that chieﬂy concerns me is that, with whatever tools or materials or economic circumstance (that is hurry <span class="amp">&amp;</span> expense), the artist, the letter-maker, has always thought of himself as making existing forms, <span class="amp">&amp;</span> not inventing new ones.</blockquote>
      <p> <br><br><img src="http://www.typophile.com/forums/messages/29/18117.gif" alt=""></p>
