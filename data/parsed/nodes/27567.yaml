    html: <p>If you have InDesign and Illustrator CS, you’re bound to have Minion Pro and other large Adobe type families. Open the OpenType files in FontLab and follow the same naming conventions — just substitute the name of your face where appropriate. Works like a charm.</p>
    html_clean: <p>If you have InDesign and Illustrator CS, you’re bound to have Minion Pro and other large Adobe type families. Open the OpenType files in FontLab and follow the same naming conventions — just substitute the name of your face where appropriate. Works like a charm.</p>
