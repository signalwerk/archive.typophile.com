    <p>Hi all,</p>
    <p>I’m sure this topic has been covered before, but the typophile search field isn’t working for me, don’t know if it’s the browser or the site but any search returns ’Your search yielded no results.’.</p>
    <p>Anyway I have 8 Opentype Fonts that I want to name so they appear as a family in application menus</p>
    <p>Duckhill Light<br>
    Duckhill Light Italic</p>
    <p>Duckhill Regular<br>
    Duckhill Regular Italic</p>
    <p>Duckhill Medium<br>
    Duckhill Medium Italic</p>
    <p>Duckhill Bold<br>
    Duckhill Bold Italic</p>
    <p>I have ’Learn fontlab fast, Leslie Cabarge’, which explains this subject, but I still carn’t get it to work. In applications like Indesign and Illustrator CS, I get random results were some of the fonts are avaiable and some aren’t.</p>
    <p>I have also followed the tutorial at<br>
    <a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2843" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2843">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a><br>
    which again gets random results.</p>
    <p>I’m using OSX with FL 4.5 and Siutcase X1 to activate the fonts.<br>
    Could someone please help with an expalination or tutorial.</p>
    <p>Much appreicated.</p>
    <p>c.</p>
