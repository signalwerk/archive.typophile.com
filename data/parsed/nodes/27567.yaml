    html: <p>Also, take out spaces in the names between Medium and Italic; some of these programs see those names as identical, and if the style name is MediumItalic, it shows up as unique.</p>
    html_clean: <p>Also, take out spaces in the names between Medium and Italic; some of these programs see those names as identical, and if the style name is MediumItalic, it shows up as unique.</p>
