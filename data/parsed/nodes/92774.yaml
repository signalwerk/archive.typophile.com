    <p>I have a font I am offering and have a single mirror imaged(horizontally)  Uppercase Q in the set.</p>
    <p>I quite like it personally, but realize this will ruin its potential use for organizations whose name begins with Q.  </p>
    <p>I would like to offer an easy to use alternate proper Q, but can not use opentype.</p>
    <p>I was thinking of creating a font family, having the regular version be with the proper Q, and have the "italic" version with the backwards Q.  There will be no REAL italics in the family, and I thought this would be a nice and neat way of solving the problem.</p>
    <p>advice?</p>
