    html: |-
      <p>If you want the character to be searchable/sortable as 'Q', then it needs to be encoded as 'Q' and not as some other character. Hijacking standard codepoints of other characters for such a purpose would be particularly frowned upon; using a Private Use Area codepoint would be cleaner, but still would mean that the glyph is encoded as something other than 'Q'.</p>
      <p>OpenType is the obvious way to handle this, because OpenType Layout is specifically designed to resolve this issue: to allow more than one glyph to represent a single character.</p>
    html_clean: |-
