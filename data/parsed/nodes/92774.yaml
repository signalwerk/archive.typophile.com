    html: |-
      <p>I agree with JamesT -- a separate font (display or alternate or whatever) is probably preferable. Apart from a general aversion to misleading style naming, you face two potential problems with using italid or bold:</p>
      <p>(1) If the user 'italicizes' or 'bolds' a passage which contains no Q, and thus sees no change, they may come to think the font is defective or that it is not installed.</p>
      <p>(2) If you ever do decide to design an italic or bold weight, you face all sorts of backwards compatibility issues.</p>
      <p>André</p>
