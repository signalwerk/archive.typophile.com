      <p>Hola, busco informacion de Clarview Fonts en Español...</p>
      <p>Estimado Ricardo, como podrás ver, soy un ignorante en el tema, además no me dedico a ser un "pirata", si es tu impresión respeto sobre manera vuestro punto de vista...</p>
      <p>Más, han pasado mas de veinte semanas y en el poco tiempo que tengo, logre entender de que se trataba el tema, es decir yo esperaba una respuesta como esta:</p>
      <p>"Estimado "pirata" (amigo), que te parece si lees algo como esto: <a href="http://www.terra.es/tecnologia/articulo/html/tec9945.htm" title="http://www.terra.es/tecnologia/articulo/html/tec9945.htm">http://www.terra.es/tecnologia/articulo/html/tec9945.htm</a><br>
      y aclaras tus dudas..."</p>
      <p>Pero, no... yo mismo investigue y no fue fácil por que en este mundo al existir personas como Ud y yo, le da el brillo y continuidad a la vida, para poder llenar mi pensamiento y decir: "otra vez yo mismo lo hice" y en verdad se lo agradezco por permitirme dar ese gusto de ser como soy y a la vez saber que puedo compartir mi esfuerzo a todos sin pensar en recibir nada a cambio.</p>
      <p>Respeto las leyes y normas establecidas, pero vamos un pequeño detalle como recibir una simple dirección no me lleva a decir que Ud sea un "noble" y yo un "pirata", espero que no guarde resentimientos y creame que estoy a sus gratas ordenes..</p>
      <p>Saludos</p>
      <p>wilson</p>
