      <p>Don't forget the <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=8&amp;displayfontid=FF.11126.0.0&amp;fontRendererText=Typophile" rel="nofollow">FontFont Backstage</a> bundle: <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11126.1.5&amp;attributes.sampleSize=144&amp;sampleText=Typophile&amp;sampleSize=96" rel="nofollow">FF Chernobyl</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11126.2.7&amp;attributes.sampleSize=96&amp;sampleText=Typophile&amp;sampleSize=74" rel="nofollow">FF Container</a> and <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11126.3.9&amp;attributes.sampleSize=96&amp;sampleText=Typophile&amp;sampleSize=74" rel="nofollow">FF Watertower</a>. I found myself admiring these the other day.</p>
      <p>Oh, and you gotta check out <a href="http://www.typography.com/catalog/giant/index.html" rel="nofollow">Giant</a> by <a href="/wiki/hoefler_frerejones" class="freelinking" rel="nofollow">H&amp;FJ</a>. Be sure to check out their <a href="http://www.typography.com/catalog/giant/more.html" rel="nofollow">More Examples</a> pages. Since it's a <a href="/wiki/shaded" class="freelinking" rel="nofollow">shaded</a> font, you actually get a <a href="http://www.typography.com/catalog/shades/features.html" rel="nofollow">composed, background, and highlight</a> version. Any one of them could stand on their own.</p>
