    html: |-
      <p>"Numerals" is the authentic moniker for these things. Strange people from another planet like me call them "Numberals, you moron! What's wrong with you?"</p>
      <p>Some of my favorite numberals are the units I drew for Sibyl, and the other one I'm not allowed to talk about, but can show:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/numberals_4058.gif"></div><p></p>
      <p>I have other favorite numberals in Other People's Fonts (OPFs). But really, as if I've got time to round them all up. My criterion for good numberals is, Do they look good enuff to eat? They look like candy or peaches? Right, I'll have 'em.</p>
      <p>My favorite number is 425.</p>
      <p><em>so, let me also pose another question - can you guys think of any more “experimental” fonts with interesting numberforms?</em></p>
      <p>Sibyl's numberals are experimental (or interesting, depending on how you look at it), being old style and cursive, which is somewhat unusual for a blackletter font. Most blackletter fonts have lining figures that look like they belong in another font.</p>
      <p>If you want something more experimental or unusual tho, try these:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tuscan_numbers_6329.gif"></div><p></p>
      <p><em>Honestly? I’m in love with Mrs. Eaves’ numerals.</em></p>
      <p>You're having an affair with them? Scandalous!</p>
      <p>j a m e s</p>
