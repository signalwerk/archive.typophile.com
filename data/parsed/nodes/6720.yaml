    html: "<p>On the issue of the effect of international corporations in poor countries, which a number of posters have expressed concerns about: <br> <br>The demand from poor countries themselves is to open up freer trade. The heavy agriculture subsidies are killers, as they undercut farmers in poor countries. Contrary to his express free trade words, Bush hypocritically re-imposed hugh subsidies to US agriculture, which will break farmers in poor countries. Europe is even worse in its protectionism, cruelly opressing its neighbors by such policies.  <br> <br>Similarly, textiles are historically the first item in industrialization, and the first step up for a poor country. There is no excuse for the abominable working conditions that often take place in poor countries, but this is no excuse for the trade barriers that rich countries have put up.  <br> <br>The WTO, in other words, is not the enemy of progress toward a more prosperous and just world. It is rather the rich countries imposing trade barriers, and the bandit governments of very many poor countries, who are the main forces keeping them poor.  <br> <br>&gt;I only attack you for one reason: being anti-humanity.  <br> <br>Hrant, I expressed no animus against any person or people. I only disagreed with you, which doesn't make me either against you or against humanity. You owe me an apology.</p>"
