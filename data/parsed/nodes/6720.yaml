    html: <p>a late post to this discussion, but trying to claw it back on track... <br> <br>first i totally agree with what jared posted above -- i share a a lot of what he had to say <br> <br>i remember when i was an undergraduate at <a href="http://www.reading.ac.uk/typography">reading</a> and we had a lecture from michael twyman. he asked us 'who wouldn't you work for?'. out of the 25 students in the year, only about 5 of us had thought about this issue already and engaged in a discussion. the rest of the group just sat there -- their concern was getting a job and not what their personal ethics were. this has always stuck with me. <br> <br>at my first job (<a href="http://www.textmatters.com">text matters</a>) i found a place that had ethics rather than just looking for a quick buck. at one point, before i started working there, the staff decided that they didn't want to pitch for a project as they didn't believe that the organisation was just. pro-bono work was common place. <br> <br>now runing my own studio, i try (with my partner) to take on pro-bono work where possible. we have a 'charity' day rate for those organisations that would benefit from our skills but cannot afford our normal rate. we do work for 'big business' on occasions. but not for the likes of mcdonalds, gap, nike etc. we only do it where we can make a difference (and it allows us to still eat and keep a roof over our heads while we help out charities and not-for-profit groups. <br> <br>just my 2p...</p>
