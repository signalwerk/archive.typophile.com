    html: "<p>William, what you consistently and conveniently ignore is that most people don't have the will nor the ability to consider macroeconomic issues - they're simply trying to eke out a living. They have the sense not to trust the powers that be to look after them. And they're not qualified to consider matters of state anyway (they're qualified to repair shoes or serve food), and most of them have the sense to know that. It is mostly in the West that the illusion of individual relevance to society is so strikingly enforced. Why? Because a watertight system has been built, and when you give people the illusion of power they're a lot less likely to overturn it. Voting, freedom of speech, mandatory public education of children, television, the whole thing is rigged to produce and maintain servile, oblivious peons. <br> <br>What the oppressed masses of people want in this world is something very basic they don't have: being treated decently. Your system is making things worse for most people, not better. And the few that it makes things better for, it shields from a realization of its inhumanity, lest their sense of decency causes problems. <br> <br>Back off from destroying the world, otherwise you'll get your due in the end, one way or another. You cannot overpower Nature, including the nature of the human spirit. <br> <br>&gt; And who will tell me (please) which of them is/are right? <br> <br>Only one person: you. <br> <br>&gt; appreciating an individual for his/her own worth is superior to judging <br>&gt; the individual based on his/her ethnic or geopolitical background.  <br> <br>Indeed. Discriminating against an <i>individual</i> is racism, which is unfair and damaging. But making observations about groups of people (for example that Armenians are more conservative than the French), and even acting on them, is not racism. In fact, it's natural, and the only way forward. Otherwise you're stuck in a relativist world where nobody is responsible for their actions. <br> <br>Cultures create and maintain values, and these can be conducive to the health of humanity as a whole, or not. Fear of pointing out problems in certain cultures (like the American gluttony) is exactly what the system wants you to feel. And just in case you're a brave person, you'll never get your views aired in the mainstream anyway. And you can't even complain about that, because you have no Formal Proof (a requirement for credibility in western culture) of media bias (and even if you did you could never publicize it), and because anyway you have freedom of speech, right?... Anybody can say anything they want, and they feel better, reducing the chances for <i>action</i>. Nevermind that you can only ever say it to a few hundred people at most. When you think about it, dissent is essentially undemocratic. <br> <br>&gt; nature selected them for extinction <br> <br>Nature? Democracy is the most unnatural of systems. <br> <br>All that is old will be new again. But of course the masses will continue the think that the dormant systems are \"extinct\", that their society is always gradually improving (nevermind that the 20th century was the worst in humankind), that their system is the best there ever was. Why? Because people believe what you tell them, and through the media the system conveys self-aggrandizement, to maintain stability. <br> <br>When you vote in the US, you're part of the problem - it's that simple. The absolute least I can do for humanity is not vote - not to go through the motions of this murderous juggernaut. <br> <br>hhp</p>"
