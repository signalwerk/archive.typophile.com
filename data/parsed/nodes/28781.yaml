      <p>I'm not going to comment on the letterforms, because I know nothing about how to write graffiti properly.</p>
      <p>It seems as though your pen nib has no thickness whatsoever. I'm not sure how you made this font, or how to fix this issue, but I'd suggest thinking of the pen nib as a rectangle rather than a line.</p>
