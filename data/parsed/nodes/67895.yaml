    html: |-
      <p>Nick,</p>
      <p>Pefectly true that Greater Albion is considering a typeface based on the Upstairs Downtairs credits-depending whether such a typeface already exists.  Our searches haven't managed to turn up a typeface on whci they're based, which is encouraging for the the project being worth pursuing, but it occurred to us that one way of seeing if we'd simply missed an already existing face was to ask the question on here.</p>
      <p>As to next week-sorry not that fast, as I say we're still considering the project and haven't actually started yet, and we do currently have several projects on the go.  The name 'Eaton Place' is a good thought, which hadn't occurred to us-thanks very much for that.</p>
      <p>I do indeed remember the doings of Messrs Cohen and Kelly, though personally I'm not sure that their credits are lettered in a very inspiring design:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/riwumd_6033.jpg"></div><p></p>
      <p>The 'Q' is an interesting thought, however...</p>
