    <p>Hi, all<br>
    I was making a qurani font.... and here i have put all marks in only one position. How ever for some marks like, superscript alef are placed slightly differently, so they cannot be put at the same point as fatha and dammatan.....</p>
    <p>Thats wht i want to copy anchor; attach1 to a new anchor; attach3 and I want to preserve all its anchor data.</p>
