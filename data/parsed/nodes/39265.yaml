    <p>Hi there,</p>
    <p>I was directed here because it appears that the members here are already familiar with the Olduvai font. </p>
    <p>I've just purchased a Mac version from Veer, and I'm having problems creating the banners using the Ornaments. When I type in the keys to create the banner ligatures, the characters don't appear properly. (The specified keys to create the ligature are " and '. I've attached a jpeg to illustrate what I mean.) </p>
    <p>I feel foolish about asking for help, as I'm sure the answer is pretty obvious - but I'm at my wit's end. Any thoughts?</p>
    <p>Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Olduvai_4713.jpg"></div><p></p>
