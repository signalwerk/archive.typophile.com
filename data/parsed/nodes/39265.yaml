    html: |-
      <p>Tiffany: thanks for sharing that. First time I've seen Olduvai used by a non-family member (haha! merry christmas, here's a font). Veer often presents the font by setting the ornamented initials as words instead of drop caps. It always strikes me as funny since I never intended it that way. Looking good in your hands despite the fact that letterspacing drop caps is explicitly forbidden in the EULA.</p>
      <p>Paul: Tiff owes a small part of her layout to you... The Pineapple! If I recall a raven flew up to me and mentioned you were planning to set some POEtry in olduvai. Is that nevermore?</p>
      <p>Marc: The in-use thing has come up before, but I think it gets shot down because of the potential for bragging and bashing. I really enjoy seeing the laborious fruit of longtime typophile regulars. It gives you just a bit more of a picture of who they are. I think it could work though. The format I'd like to see is by font in more of a blog-style. So each entry in the post would be an image example, with comments attached to each image (but hidden a click away).</p>
      <p>Kind of like this site:  <a href="http://www.TheSuperest.com" title="www.TheSuperest.com">www.TheSuperest.com</a><br>
      Which is most excellent, and features regularly the exceptionally-lettered illustrations of Kevin Cornell (<a href="http://www.bearskinrug.co.uk" title="www.bearskinrug.co.uk">www.bearskinrug.co.uk</a>).</p>
