  html: "<p>Hi everyone, <br> <br>This might sound like a very basic question, but there goes: <br>I have designed a custom lettering for a logo project and I would like to present it in 2 more weights- light and medium (the current one being bold as I see it). What is the easiest way to modify the exisiting outlines into lighter versions?</p>"
