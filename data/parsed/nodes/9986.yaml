    html: <p>Andre, <br>Chris Rugen is right. I meant to draw it in the same way that he drew the heavier weight using it as a visual guide. He seems to have used Illustrator as a tool.  My only suggestion would be to put the original weight on a different layer and lock it so you can see it underneath.  Sometimes you turn the tracing layer off when it distracts you.</p>
