  html: |-
    <p>I am doing a product design and packaging project in my Communication Design 1 class, and i chose to make up a new sparkling fruit drink company to design a bottle for as well as the 6 pack cardboard holder.</p>
    <p>So my main question is, does anyone have any idea how to print a logo and some text onto a  clear glass bottle? I am kind of stumped on this one. I am guessing they normally screen print onto the bottle, but i am only going to be making a couple of bottles, not a ton, does anyone have any ideas for the next best thing? I was thinking maybe printing onto some acetate, and running it through one of those adhesive machines that puts sticky stuff on the other side, but i don't know how professional that will look.</p>
    <p>Any advice is greatly appreciated.</p>
    <p>-Josh</p>
