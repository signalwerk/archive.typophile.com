      <p>An alternative might be to get some rubdowns done, this is a UK company<br>
      <a href="http://www.clearestcolourworks.co.uk/transfers_rubdowns_films.php" title="http://www.clearestcolourworks.co.uk/transfers_rubdowns_films.php">http://www.clearestcolourworks.co.uk/transfers_rubdowns_films.php</a></p>
      <p>Google returned mainly massage parlours in the US, so perhaps an alternative term is used there :)</p>
      <p>A more DIY approach if you have access to an inkjet printer, a water slip transfer might attach better than a dry rubdown.<br>
      <a href="http://www.craftycomputerpaper.co.uk/clear%20water-slip%20decals.htm" title="http://www.craftycomputerpaper.co.uk/clear%20water-slip%20decals.htm">http://www.craftycomputerpaper.co.uk/clear%20water-slip%20decals.htm</a></p>
      <p><a href="http://www.craftycomputerpaper.co.uk/Dry%20Decals%20product%20page.htm" title="http://www.craftycomputerpaper.co.uk/Dry%20Decals%20product%20page.htm">http://www.craftycomputerpaper.co.uk/Dry%20Decals%20product%20page.htm</a></p>
      <p>If you use the acetate method trim it down to go round the bottle with a slight overlap at the back and then use double sided tape to attach it, most adhesives will be apparent and spoil the effect, so try to use as little as possible.</p>
      <p>Tim</p>
