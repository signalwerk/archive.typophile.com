    <p>Pollen by Eduardo Berliner</p>
    <p>This typeface finds a perfect balance between technical excellence, careful design of letter forms for extended reading, and a measured dose of charm and personality. Its informal feel allows for successfully typesetting a wide range of applications, from magazines and fiction books to advertising and websites.<br>
    Calligraphy, be it done with the broad-edge pen, brush, or other tools, has been fundamental in the development of Pollen. Its influence is clearly visible in the construction of the top serifs contrasting the curved bottom serifs and the fluid aspect of terminals and tails, such as on “g” and “r”. The shapes of the diagonal letters are based on a less formal calligraphic model, but still uses the broad edge pen. ­The letters were then subject to a further process of pencil drawing and digital re-interpretation, which gave them the final shape.<br>
    The designs of “e” and “c” are derived from drawings made with only one continuous line, with the pencil always touching the paper. The letters “g” and “y” express the intention to bring informal elements to a typeface intended for long text reading, usually characteristic of casual writing, .<br>
    Pollen consists of 3 basic styles with an extended OpenType Pro character set and large language support, perfectly serving the most common typographic needs.</p>
