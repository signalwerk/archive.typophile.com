    html: |-
      <p>&gt; <cite>i just don’t get some designers... this is nice, but why use antique olive for this job?</cite></p>
      <p>good question. </p>
      <p>the logo was designed in the early 80s. Below is a version from ~1984.</p>
      <p>Odwalla was originally based in Half Moon Bay. (population then, guessing less than 10,000)</p>
      <p><cite>Odwalla began in Santa Cruz in 1980 with three friends, a used $200 hand juicer and a few boxes of oranges. Greg Steltenpohl, Gerry Percy and Bonnie Bassett squeezed the juice in a shed behind their home then delivered it to local restaurants. One box of oranges was used the first day. Profits from that day bought two boxes of oranges the next day marking the beginning of Odwalla.</cite></p>
      <p>so some factors to consider:</p>
      <p>1) there wasn't DTP</p>
      <p>2) tight tracking of typefaces was probably still considered <cite>happening.</cite></p>
      <p>3) the three founders were probably moving at a fast pace, and took something from a local designer without much thought. </p>
      <p>just speculating. :D</p>
      <p>but i think the logo has stood up well over time. </p>
      <p>As for the gloss and stuff, it could be any current designer working for Coca Cola. And for some reason, they haven't redesigned, even after some deadly <cite>E.coli</cite>  outbreaks and other bad PR.</p>
      <p><a href="http://en.wikipedia.org/wiki/Odwalla">http://en.wikipedia.org/wiki/Odwalla</a></p>
      <p><img src="/sites/default/files/old-images/ImageAgentProxy_4444.gif"></p>
