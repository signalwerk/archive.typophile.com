    html: <p>Dude, with regard to font problems. . .  If you really think a simple clean font library will save you the horrors of Mac OS X and fonts, you're in for a ride.  Fonts on Mac OS X are Hell.  Atleast until you clean out the many multiple font locations and get to a state of control.  Then your clean adobe folio will work really well. <b><a href="http://software-robotics.com/docs/PDF-X-Robot_Font_Management.html" target="_blank">*Font Management Issues on Mac OS X Here!</a></b> <br> <br>Another VERY important read, when you are done with that is to really get accomodated to <b><a href="http://software-robotics.com/docs/PDF-X-Robot_OS_X_Maintenance.html" target="_blank">*Disk and File System Maintenance on Mac OS X Here!</a></b> Mac OS X should not be crashing out like that, in case it's not a font conflict or problem, be sure you understand proper maintenance, like using some of the old stand by utilities will send you endless doom.  Good luck!</p>
