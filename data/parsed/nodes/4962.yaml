    html: <p>Hi everybody, <br> <br>I have just upgraded my system to OSX 10.3 and quark to version 6.1. The thing is that the program has become very unstable and while I am working it keeps shutting down without any specific reason. I work for a publisher and usually pages are quite full of images and formulas. However I never experienced anything similar using Xpress 4 for OS9. <br>Fonts should not be the issue as we are working with an origilan adobe font folio 10 package and apparently there are no conflicts. Has anyone experienced the same problem? Any solutions? <br> <br> <br> <br>Thanks to everyone</p>
