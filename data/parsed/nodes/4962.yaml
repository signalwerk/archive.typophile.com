  html: <p>QUARK 6.1  <br>MAC OS X  <br>--------------  <br> <br>Okay, new problem.  <br> <br>One of the girls in the creative department has been getting an error after a couple times pdf-ing an ad.  <br> <br>The error has something to do with "itc franklin gothic med cd" and she can't get rid of this error until she closes out of quark completely.  <br> <br>Then when she opens it back up, does a couple more pdf's and BAM... there is the same error again.  <br> <br>And she just keeps doing that repetitive loop.  <br> <br>Any idea whats going on?  Anyone else have this problem?</p>
