    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/FAQs" class="freelinking" rel="nofollow">FAQs</a> : Where can I get free fonts?</strong><br>
    Legit free fonts. As always, please respect the <a href="wiki/EULA" class="wiki" rel="nofollow">EULA</a> when using free fonts:<br>
    “Some are licensed for unlimited use, some only for private use but not for commercial jobs. You don’t want to take advantage of the kindness and generosity of the people who designed them; it’s really bad for your karma. And you don’t want to risk that, do you?” —<a href="wiki/Yves Peters" class="wiki" rel="nofollow">Yves Peters</a></p>
    <p><strong>Why doesn't this page list freeware font websites?</strong><br>
    Most of the sites below are run by type designers or foundries, and they tend to offer a few dozen fonts at most. Why doesn't this page list the huge freeware websites? Take a quick look at those sites and you'll see that the fonts there are of variable quality, with not many that are good for professional design work. But even more important, many of the type designs are clearly copied from other people's work. To be fair, mixed in with the knockoffs are thousands of original fonts made by amateurs who just love type. But the lack of oversight—anyone can upload—and the confusing way that those sites mix the bad with the good, makes it hard for us to recommend them. (In the end, those sites need no help; a Google search quickly turns them up.) Below, legitimate free fonts offered by the people who created them. </p>
    <p><strong>Individual Fonts</strong><br>
    <a href="http://www.dardenstudio.com/typefaces/birra_stout" rel="nofollow">Birra Stout</a> from Darden Studio<br>
    <a href="http://typophile.com/node/51198" rel="nofollow">Aller Sans</a> from DaMa<br>
    <a href="http://www.stormtype.com/free.html" rel="nofollow">Lido</a> by <a href="wiki/Storm Type Foundry" class="wiki" rel="nofollow">Storm Type Foundry</a>. Modification of Times.<br>
    <a href="http://www.underware.nl/site2/index.php3?id1=unibody&amp;id2=overview" rel="nofollow">Unibody</a> by <a href="/wiki/Underware" class="freelinking" rel="nofollow">Underware</a>. Pixel font for Flash.<br>
    <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" rel="nofollow">Gentium</a> by <a href="/wiki/Victor%20Gaultney" class="freelinking" rel="nofollow">Victor Gaultney</a>. Multilingual font with extended character set.<br>
    <a href="http://www.ms-studio.com/FontSales/anonymous.html" rel="nofollow">Anonymous</a> by <a href="wiki/Mark Simonson" class="wiki" rel="nofollow">Mark Simonson</a>. Monospace.<br>
    <a href="http://www.archivetype.com/FreeStuff.htm" rel="nofollow">Type Mix I</a> by <a href="wiki/Archive Type" class="wiki-create" rel="nofollow">Archive Type</a>. “Ransom note” font made from period typefaces.<br>
    <a href="http://www.kontrapunkt.com/news/ddprize_typeface_of_the_year_2004#downloads" rel="nofollow">Kontrapunkt Light &amp; Bold</a> by Kontrapunkt. Danish typeface of the year, 2004.<br>
    <a href="http://www.vllg.com/Thirstype/Pixella/mudTyper+Weights/" rel="nofollow">Pixella</a>, <a href="http://www.vllg.com/Thirstype/Freedumb/mudTyper+Weights/" rel="nofollow">Freedumb</a> and <a href="http://www.vllg.com/Thirstype/SatchelPaige/mudTyper+Weights/" rel="nofollow">Satchel Paige</a>, all by Thirstype. Pixel, Egyptian, slab serif.<br>
    <a href="http://www.p22.com/products/freefont.html" rel="nofollow">Sinel</a> by P22. Art deco display face. Registration required.<br>
    <a href="http://www.selfbuildtype.co.uk/" rel="nofollow">SB Basement</a> by Selfbuildtype. Machine.<br>
    <a href="http://www.typeco.com/" rel="nofollow">Cypher7</a> by Typeco. Techno. Registration required.<br>
    <a href="http://www.philsfonts.com/freefont.html" rel="nofollow">Free Font</a> by Phil's Fonts. Quality single font; selection changes.<br>
    <a href="http://typo3.org/teams/design/style-guide/downloads/" rel="nofollow">Share</a> by Typ03. Sans text and monospace.<br>
    <a href="http://www.psyops.com/html/library_crash.html" rel="nofollow">Crash Numbering</a> by PsyOps. Machine numbers.<br>
    <a href="http://www.devicefonts.co.uk/" rel="nofollow">Free Font</a> by Device. Selection changes.<br>
    <a href="http://www.showstudio.com/projects/031/031_typeface.html" rel="nofollow">Pagan Poetry</a> by ShowStudio. Display face used in Bjork packaging.<br>
    <a href="http://www.atf.com.au/free_font.asp" rel="nofollow">Free Font</a> by Australian Type Foundry. Selection changes. Registration required.<br>
    <a href="http://www.kennmunk.com/main.html" rel="nofollow">Dummytapes</a> by Kenn Munk. Mimics Dymo label machine.<br>
    <a href="http://www.noedesign.com/2005/index.html" rel="nofollow">Noe</a> by Dan Noe. Techno.<br>
    <a href="http://www.adjarabet.com/sylfaen.htm" rel="nofollow">Sylfaen</a> from Adjara Bet. English character set is distinctive slab serif.<br>
    <a href="http://freefont.de/us/index.htm" rel="nofollow">Free Font</a> by Softmaker. Selection changes.<br>
    <a href="http://www.ourtype.be/" rel="nofollow">Bonus Font of the Month</a> by Ourtype. Selection changes. Click “About,” then “Bonus Font.”<br>
    <a href="http://www.typies.blogspot.com/" rel="nofollow">Romeral</a> &amp; <a href="http://letritas.blogspot.com/2006/05/chcara-una-tipografa-econmica.html" rel="nofollow">Chucara</a> by J.P. De Gregorio. Egyptian, bracketed slab. E-mail designer for files.</p>
    <p><strong>Free Font Collections</strong><br>
    <a href="http://www.alvit.de/blog/article/20-best-license-free-official-fonts" rel="nofollow">25 Best Free Fonts</a> compiled by Vitaly Friedman. Discriminating list includes good serif text.<br>
    <a href="http://www.smashingmagazine.com/2006/10/11/17-more-free-quality-fonts/" rel="nofollow">19 More Free Quality Fonts</a>, Vitaly's follow-up, includes full-featured Opentype serif text faces.<br>
    <a href="http://www.iginomarini.com/fell.html" rel="nofollow">The Fell Types</a> by Igino Marini. Historical revivals.<br>
    <a href="http://www.identifont.com/free-fonts.html" rel="nofollow">Free Fonts</a> from Identifont. Good range of text, display, pixel, others.<br>
    <a href="http://www.ultimatefontdownload.com/" rel="nofollow">Ultimate Font Download</a> by Jason Nolan of 1001freefonts.com. Although not free, it is a legitimate distribution of 10,000 fonts that gives some money back to the font designers. Downloading them all at once will save the trouble of picking them up individually.<br>
    <a href="http://moorstation.org/typoasis/designers/klein/index.htm" rel="nofollow">Fonteria</a> by Manfred Klein. Art-inspired display faces, blackletter, text sans, dingbats.<br>
    <a href="http://www.moorstation.org/typoasis/designers/curtis/pages/a.htm" rel="nofollow">Fabulous Free Fonts</a> by <a href="wiki/Nick Curtis" class="wiki" rel="nofollow">Nick Curtis</a>. Period display, especially 1920s-50s.<br>
    <a href="http://moorstation.org/typoasis/allfonts.htm" rel="nofollow">Typoasis</a> at Moorstation.org. Library of designers includes the two standouts directly above.<br>
    <a href="http://www.glashaus-design.com/site/glashaus.html" rel="nofollow">Free Fonts</a> by Glashaus. Quality text sans.<br>
    <a href="http://www.shamrocking.com/fonts.html" rel="nofollow">Free Fonts</a> by Shamrocking. Range of display fonts, especially animated and casual.<br>
    <a href="http://www.fontoville.com/" rel="nofollow">Free Fonts</a> by Fontoville. Casual display.<br>
    <a href="http://www.nerfect.com/typefree.html" rel="nofollow">Free Fonts</a> by Nerfect, aka Britton Walters. Mostly grunge, distressed, machine.<br>
    <a href="http://www.fontdiner.com/silver.html" rel="nofollow">Free Silverware</a> by <a href="wiki/Font Diner" class="wiki" rel="nofollow">Font Diner</a>. Display and novelty.<br>
    <a href="http://new.myfonts.com/search/lowest_price%3A0/fonts/" rel="nofollow">Free Fonts</a> by MyFonts. Click “purchase options,” then checkout for free.<br>
    <a href="http://www.core.nu/fonts.html" rel="nofollow">Fonts</a> by Core. Casual, serif display, condensed gothic, pixel, more.<br>
    <a href="http://www.typemotion.de/_typographie/freefonts.php" rel="nofollow">Free Fonts</a> from Typemotion. Machine, techno and sans.<br>
    <a href="http://www.fontfont.com/downloads_right.html" rel="nofollow">Free Downloads</a> from FontFont. Selection changes.<br>
    <a href="http://www.fountain.nu/catalogue/probono.asp" rel="nofollow">Pro Bono Fonts</a> by <a href="wiki/Fountain" class="wiki" rel="nofollow">Fountain</a>. Range of display, pixel and dingbat fonts.<br>
    <a href="http://koenhachmang.com/" rel="nofollow">Free Fonts</a> by Koen Hachmang. Sans, calligraphic sans, techno, machine.<br>
    <a href="http://www.misprintedtype.com/v3/fonts.php" rel="nofollow">Misprinted Type</a> by <a href="wiki/Eduardo Recife" class="wiki" rel="nofollow">Eduardo Recife</a>. Grunge, distressed, machine and penmanship.<br>
    <a href="http://www.chank.com/freefonts.php" rel="nofollow">Free Fonts</a> from Chank. Range of display types; quality varies.<br>
    <a href="http://www.macrhino.com/" rel="nofollow">Typefaces For Free</a> by <a href="wiki/MacRhino" class="wiki" rel="nofollow">MacRhino</a>. Semiserif, unicase, others.<br>
    <a href="http://www.typedifferent.com/2005/index.html" rel="nofollow">Free Samples</a> by <a href="wiki/buro destruct" class="wiki-create" rel="nofollow">büro destruct</a>. Range of display, techno, handwriting, Japanese.<br>
    <a href="https://www.fontshop.com/features/free.cfm" title="download fonts" rel="nofollow">Free Fonts</a> from <a href="wiki/FontShop" class="wiki" rel="nofollow">FontShop</a>. Selection changes.<br>
    <a href="http://www.cape-arcona.com" rel="nofollow">Free Fonts</a> by <a href="wiki/Cape Arcona" class="wiki-create" rel="nofollow">Cape Arcona</a>. Grunge and distressed, machine, period, others.<br>
    <a href="http://www.houseind.com/index.php?page=freefonts" rel="nofollow">Free Fonts</a> by <a href="wiki/House Industries" class="wiki" rel="nofollow">House Industries</a>. Selection changes.<br>
    <a href="http://www.fontsite.com/Pages/FFDownloads.html" rel="nofollow">Free Downloads</a> by Fontsite. Serif text, dingbats, pixel, others.<br>
    <a href="http://www.letterheadfonts.com/downloads/index.shtml" rel="nofollow">Downloads</a> by <a href="wiki/Letterhead Fonts" class="wiki" rel="nofollow">Letterhead Fonts</a>. Period display.<br>
    <a href="http://www.haroldsfonts.com/frontpage.html" rel="nofollow">Free Fonts</a> by Harold's Fonts. Display, penmanship, historical recreations.<br>
    <a href="http://www.interq.or.jp/ox/gau/gau_pra/font/simple/index.html" rel="nofollow">Free fonts</a> by Graphic Arts Unit. Pixel, techno, striped triline, more.<br>
    <a href="http://www.k-type.com/freebies.html" rel="nofollow">Freebies</a> by K-Type. Novelty, machine, punk dingbats.<br>
    <a href="http://www.04.jp.org/" rel="nofollow">Extra</a> by 04.jp.org. Bitmap fonts for web design.<br>
    <a href="http://www.fontboutique.de/" rel="nofollow">Free Fonts</a> by Fontboutique. Display.<br>
    <a href="http://www.smeltery.net/" rel="nofollow">Free Fonts</a> by Smeltery. Unusual scripts and techno.<br>
    <a href="http://floodfonts.com/freefont/freefont.html" rel="nofollow">Free Fonts</a> by Floodfonts. Mostly techno.<br>
    <a href="http://www.milkwort.org/fontscape.html" rel="nofollow">Fontscape</a> by Milkwort. Pixel, techno, machine.<br>
    <a href="http://www.petitboys.com/fonts/index.html" rel="nofollow">Fonts</a> by Petitboys. Techno, machine.<br>
    <a href="http://www.junkohanhero.com/fontit.htm" rel="nofollow">Free Fonts</a> by painter Junkohanhero. Quality punk.<br>
    <a href="http://www.blambot.com/fonts.shtml" rel="nofollow">Comic Book Fonts</a> by Blambot. Comic book lettering of all types.<br>
    <a href="http://www.rotodesign.com/fonts/index.html" rel="nofollow">Free Fonts</a> by Roto Design. Casual, animated, gothic sans.<br>
    <a href="http://www.9031.com/p-font/" rel="nofollow">Free Fonts</a> by P-Font. Techno, grunge, sans.<br>
    <a href="http://www.typebox.com/" rel="nofollow">Free Fonts</a> by Typebox. Humorous dingbats, techno, Japanese.<br>
    <a href="http://typo.lomo.jp/index2.html" rel="nofollow">Free Fonts</a> by Tomoyuke Watanabe. Click “font,” then “download?” Grunge, machine, techno.<br>
    <a href="http://pixelfonts.style-force.net/" rel="nofollow">Pixel Fonts</a> by Style-Force. Pixel.<br>
    <a href="http://pixelyn.com/typography.html" rel="nofollow">Typography</a> by Pixelyn. Pixel.<br>
    <a href="http://www.habitat7.de/update21/index.htm" rel="nofollow">Free fonts</a> by Habitat 7. Pixel. Drag trash into woodchipper.<br>
    <a href="http://www.miniml.com/" rel="nofollow">Free Fonts</a> by Miniml. Pixel. Scroll to bottom.<br>
    <a href="http://www.feltron.com/" rel="nofollow">Typefaces</a> by Feltron. Pixel, techno, stencil, machine gothic.<br>
    <a href="http://add.jp.org/index3.html" rel="nofollow">Fonts</a> by Add. Pixel, techno, machine, casual display.<br>
    <a href="http://www.din.or.jp/~liar/enter.html" rel="nofollow">Free Fonts</a> by Sucharaka. Pixel, techno, pictorial letterforms.<br>
    <a href="http://www.designerinaction.de/fonts/show.php?art=fonts" rel="nofollow">Downloads</a> by Designer in Action. Range of display, pixel, penmanship; quality varies.<br>
    <a href="http://www.aenigmafonts.com/index.html" rel="nofollow">Free Fonts</a> by Aenigma Fonts. Techno display fonts.<br>
    <a href="http://www.astigmatic.com/freeware.html" rel="nofollow">Free Fonts</a> by Astigmatic. Display, novelty, pictorial letterforms.<br>
    <a href="http://www.speakeasy.org/~ecf/alphabet.htm" rel="nofollow">Free Fonts</a> by Emerald City Fontwerks. Penmanship, grunge, others.<br>
    <a href="http://thedevilinjasonramirez.com/fonts.html" rel="nofollow">Free Fonts</a> by Jason Ramirez, formerly at pennyzine.com. Punk.<br>
    <a href="http://www.eutypoce.com/top.html" rel="nofollow">Freeware Fonts</a> by Eutypoce. Techno, pixel.<br>
    <a href="http://www.die-gestalten.de/fonts/freefonts/archive" rel="nofollow">Free Fonts</a> by Die Gestalten. Techno. Selection changes.<br>
    <a href="http://www.hvdfonts.de/hvdframes.html" rel="nofollow">Free Fonts</a> by Hannes von Dohren. Grunge, penmanship.<br>
    <a href="http://www.fontenvironment.com/" rel="nofollow">Free Fonts</a> by FontEnvironment. Novelty, dingbats.<br>
    <a href="http://www.beaufonts.com/archive/v1/index.html" rel="nofollow">Free Fonts</a> by Beaufont. Techno, machine.<br>
    <a href="http://www.clavis.ne.jp/~sonic/segasonic/act5/font.htm" rel="nofollow">Segasonic</a>. Mimics screen fonts from Sega arcade games.<br>
    <a href="http://fonthead.com/freeware.php" rel="nofollow">Freeware</a> by Fonthead. Penmanship, novelty, dingbats.<br>
    <a href="http://www.iai-jp.com/font/font_main.html" rel="nofollow">Free Fonts</a> by IAI-JP. Display, novelty, Japanese, pictorial dingbats.<br>
    <a href="http://www.roast-horse.com/type/index.html" rel="nofollow">Free Fonts</a> by RoastHorse Type Foundry. Pixel, stencil.<br>
    <a class="freelinking external" href="http://www.fontsquirrel.com/" rel="nofollow">Font Squirrel</a> Handpicked free fonts for graphic designers with commercial-use licenses<br>
    <a href="http://www.cthulhulives.org/toybox/propdocs/FreeFonts.html" rel="nofollow">HPLHS free fonts</a> from the H. P. Lovecraft Historical Society<br>
    <a href="http://com4t-fff.seesaa.net/category/1275930-1.html" rel="nofollow">Free fonts</a> from Com4t. Fashion, stressed sans, quality display serif, more.</p>
    <p><strong>Greek</strong><br>
    <a href="http://www.backpacker.gr" rel="nofollow">Free Greek Fonts</a> and more by George Triantafyllakos<br>
    <a href="http://www.greekfontsociety.org/pages/en_typefaces.html" rel="nofollow">Free Greek Fonts</a> and more by <a href="wiki/Greek Font Society" class="wiki-create" rel="nofollow">Greek Font Society</a><br>
