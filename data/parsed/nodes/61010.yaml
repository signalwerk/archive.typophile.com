    <p>I just found out that my article for HOW magazine's upcoming typography issue has been seriously upsized - my paqge count has doubled. That means I can feature more indie foundries (that's my topic this time around)! I'm looking to spotlight designers/foundries who have not been featured in HOW or PRINT in the recent past. You can be a solo designer, a duo, a team, or even an interesting distributorship of indie type designers. Those I will feature need to have at least 3 different designs on the market (or 3 that will be on the market or at least finished by January). Types can be revivals, completely unique, or a combination thereof. Text, display, script, dingbats - any and all are welcome. You can be self-publishing everything or going through a third party for distribution - that's not an issue.</p>
    <p>I will need fonts, images, text, Q&amp;A answers, etc., quickly from new people featured, as the deadline is still super tight to make the type issue. When you make contact, please include a link to a website showing your type designs, or a PDF showing your latest types.</p>
    <p>When you contact me, please let me know why you think your foundry is truly unique and should be featured. I'm looking for diversity, interesting collaborations, ingenious revivals, brand new designs that are aimed at new technologies, and/or just plain beautiful work. Spirit, personality, and passion also count for a lot.</p>
    <p>Anyone interested, please email me directly: tamye |at| typelife.com. Follow on twitter: @tamye</p>
