    html: <p>If you mean 'foiled' because I listed an alias version, I would bet that the FontBank font predates the DTP one in digital form. The FontBank fonts were done in 1990-92. MyFonts says that DTP 'designed' Pretorian in 1992. The actual typeface was designed by 'P.M. Shanks &amp; Sons, Ltd' in London, probably 100 years before either digital version.</p>
