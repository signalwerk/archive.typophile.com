      <p>This is indeed a troubling issue, when you mentioned this I went and did a quick search on popular bit-torrent sites (I do not use them at all FYI) and found Adobe Font Folio 10 available for download to all. This is not a good sign, however I wonder who downloads from these bit-torrent sites. Are they professional graphic designers or just random bit-torrent leechers looking for something to play with? Either way it’s unacceptable.</p>
      <p>What can Adobe (and other Type foundries) do to eliminate this? or is there anything we as a type community help this issue?</p>
