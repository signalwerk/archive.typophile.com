    html: "<p><i>We both think they're the same when it matters: long-duration, necessity-driven reading.</i> <br> <br>No, they are not the <i>same</i>. That is just sloppy language. Same means identity. <br> <br>Speed and comfort are very closely related -- regardless of the kind of reading -- and one (speed) is not possible without the other (comfort). One is a necessary condition of the other. This is not the same thing as saying that speed and comfort are the <i>same thing</i>. <br> <br>If we're going to talk about these things, let's at least try to be precise in our use of language.</p>"
