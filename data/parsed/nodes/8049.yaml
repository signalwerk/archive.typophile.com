    html: <p>Another Hrant FAQ entry, it seems... <br> <br>&gt; cognitive psychologists studying reading do not generally <br>&gt; make a distinction between legibility and readability. <br> <br>And that of course is the biggest clue that they don't know what they're talking about!  :-) <br> <br>It's notable that the cognitive psychologists in Thessaloniki did nothing to change Richard Southall's mind, a person who is certainly not anti-empirical. The bulk of empirical research into readability is essentially flawed. If the scientists want to make a dent into reality, they have to explain various things, such as the importance of serifs, tight letterspacing, etc. They have not. And if they keep following this course, they never will. <br> <br>The difference between readability and legibility is parallel to the difference between a type designer who makes real text fonts versus versus a designer who is simply very good at faking it. <br> <br>hhp</p>
    html_clean: <p>Another Hrant FAQ entry, it seems... <br> <br>&gt; cognitive psychologists studying reading do not generally <br>&gt; make a distinction between legibility and readability. <br> <br>And that of course is the biggest clue that they don't know what they're talking about!  :-) <br> <br>It's notable that the cognitive psychologists in Thessaloniki did nothing to change Richard Southall's mind, a person who is certainly not anti-empirical. The bulk of empirical research into readability is essentially flawed. If the scientists want to make a dent into reality, they have to explain various things, such as the importance of serifs, tight letterspacing, etc. They have not. And if they keep following this course, they never will. <br> <br>The difference between readability and legibility is parallel to the difference between a type designer who makes real text fonts versus versus a designer who is simply very good at faking it. <br> <br>hhp</p>
