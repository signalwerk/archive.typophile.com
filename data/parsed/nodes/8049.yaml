    html: "<p>Hrant, don't move the goalpost: you were talking, as you frequently do, about 'human nature', not about human cognition. You cite 'human nature' in almost any context to dismiss opposing arguments -- i.e. anything you say is based on an accurate interpretation of human nature, while your opponents, to a man it seems, ignore human nature. It is one of your most frequent dodges (recently seen in the Typographica discussion on type design education). <br> <br>And I did not use the adjective 'peculiar'. I said particular. <br> <br>And I never said that people should make decisions such as choosing a wife on the basis of formal proof. In fact, I never made any mention of formal logic. What I said is that I think it is foolish to choose a wife on a romantic basis, since romanticism tends toward the delusional. I said that one should use reason when deciding whether to marry someone. And my wife agrees.</p>"
