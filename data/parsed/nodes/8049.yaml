    html: <p>John, idealism is great, but ignoring human nature is not. Data is <i>always</i> open to interpretation, and <i>how</i> you test something necessarily determines the results. Kevin and Mary make assumptions just like any other human - they <i>have</i> to. It's just a different kind of assumption than people like me have to make... But at least I admit the inescapable subjectivity which results. <br> <br>&gt; most valuable in determining what to test and how to test it. <br> <br>And with Kevin's venture into letterspacing we seem to be finally making a dent into the former. Critically though without also making a dent in the latter (which I have tried but so far failed to do) all we'll get is just more data pointing to the parallel letterwise model.  :-/ <br> <br>-- <br> <br>42nd I think you're on the right track with a lot of what you wrote. And it is possible to define legibility and readability "scientifically" (if not measure them as precisely as formalists might like). To put it simply, to me legibility relates to how easy it is to decipher individual symbols when looking deliberatively (with no real time constraint), while readability pertains to the reliability with which boumas (clusters of letters* which are sufficiently frequent and distinctive) can be <i>quickly</i> mapped to words, as deep as possible into the parafovea. <br> <br>* Noting that the cluster can be one letter, thus nicely covering the letterwise model. <br> <br>hhp</p>
