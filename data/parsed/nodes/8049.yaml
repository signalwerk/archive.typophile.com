    html: <p>Today I had an eyetest and though I expected to need glasses, I was told that I had excellent vision. I wondered if the fact that I spend a lot of time looking at letterforms made it easy for me to recognise the blurred letters on the chart and made for an inaccurate assesment. <br> <br>I guess what I am getting at, is that legibility and readability differ from person to person....</p>
