    html: "<p>Leading totally overpowers and any line-forming ability that serifs have*. Serifs help bouma bonding; they actually help letters become less themselves in order to promote good notan. <br> <br>* Maybe if you use too-little leading then serifs (if they're long enough) can help out a little, but I think by then you'd have totally trashed decent readability anyway, because word spaces (which have to be a certain minimum size themselves, serifs or no) will overpower the leading. <br> <br>Coming back to \"my\" model, I just wanted to add this: <br>It's the model that assimilates everything I've encountered since starting this research in '98, including all the empirical data I've seen (in the context of validity), all the anecdotal evidence, plus beliefs about human thought. What choice do I have but to believe it? Just ask yourselves, what is more probable: that the empirical data that points to the PL model is essentially limited to deliberation (or very light immersion), or that virtually all the anecdotal evidence (that a book set in sans is a more laborious read, that there's such a thing as a too-big x-height, etc.) is totally wrong? A big problem with Formal Science is its tendency to treat anecdotal evidence as Old Wives Tales. There has to be more give-and-take, on both sides. Hey, like marriage again! <br> <br>hhp</p>"
