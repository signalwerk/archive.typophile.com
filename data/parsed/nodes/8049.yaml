    html: <p>Jim <br> <br>That's the funniest thing I've heard all day. <br> <br>If only, in the days before Lasik, this information was available to all those boys and girls who would have chopped their arms off to avoid wearing the dreaded ocular devices. You'd have to dissuade children from being typographers there'd be such a mountain of them. <br> <br>Daniel <br> <br>I'd like to suggest focusing on the differences between the way we write and what we read. Most are taught not to use the two-story 'a' etc. Cursives are even more extreme in their differences. <br> <br>If what we read often affects our ability to read then how we write must also hold some bearing. Typography has been a largely male dominated business, but women--in my experience--have much better handwriting. Of course that doesn't have much to do with why it's male dominated, but does the ability to write well influence reading? If you have horrible handwriting, it stands that you'd have an easier time reading badly kerned or misshapen type. <br> <br>Just something I've been pondering. I don't know of any studies.</p>
