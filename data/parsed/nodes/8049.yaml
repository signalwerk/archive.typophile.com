    html: "<p>William, thanks for the Lieberman quotes. I had not realised that the typographic distinction between legibility versus readability dates back that far, but it doesn't surprise me. Yes, the distinction is widespread in the type world: I'm questioning whether it should be, and to what degree it represents an a priori assumption about how we read. <br> <br>As I noted earlier, many languages do not provide vocabulary for such a distinction. When Gerard Unger writes or lectures about what we would term 'readability' in type design, according to Lieberman's definition and common typographic distinction, he calls it 'legibility' since this is the common translation of the Dutch word he uses. <br> <br>And as I discovered in Thessaloniki, our friends in cognitive psychology simply do not make the distinction. The majority of what we would be obliged, following Lieberman's definition, to call readability studies, are conducted and published as legibility studies.</p>"
    html_clean: "<p>William, thanks for the Lieberman quotes. I had not realised that the typographic distinction between legibility versus readability dates back that far, but it doesn't surprise me. Yes, the distinction is widespread in the type world: I'm questioning whether it should be, and to what degree it represents an a priori assumption about how we read. <br> <br>As I noted earlier, many languages do not provide vocabulary for such a distinction. When Gerard Unger writes or lectures about what we would term 'readability' in type design, according to Lieberman's definition and common typographic distinction, he calls it 'legibility' since this is the common translation of the Dutch word he uses. <br> <br>And as I discovered in Thessaloniki, our friends in cognitive psychology simply do not make the distinction. The majority of what we would be obliged, following Lieberman's definition, to call readability studies, are conducted and published as legibility studies.</p>"
