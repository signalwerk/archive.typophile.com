    html: <p>William, I am not currently investigating differences between serif and san serif fonts. Old Lund reviewed the many studies investigating performance differences between the two font styles, and did not find compelling evidence to support that case. Clearly the different font styles carry emotional differences which are independently valuable. I am involved in investigating performance differences with different amounts of spacing between letters. The work is quite slow going. I believe that you proposed that the optimal letter spacing should be in porportion to the amount of counterspace - this is also the view that Robert Bringhurst has supported in the past. <br> <br>Cheers, Kevin</p>
