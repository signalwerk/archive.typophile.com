    html: <p>I may be idealistic, but what attracts me about science is the idea that science is testing hypotheses, not trying to build a case for a particular bias. So what appeals about the attitude of people like Kevin Larson and Mary Dyson -- who disagree with each other in a number of areas -- to the relationship of letter recogntion and word recognition is that they seem to be avoiding assumptions and want to test things. I think the interaction between the experience and anecdotal evidence of typographers and the empirical methodology of cognitive psychologists will be most valuable in determining <i>what</i> to test and <i>how</i> to test it.</p>
