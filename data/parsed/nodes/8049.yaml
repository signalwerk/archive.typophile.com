    html: "<p><i>What kind of relationship does your arrow indicate? You are conceding that there is more to readibility than letter recognition. That estabilishes the distinction. The question is, then, how important is the distinction?</i> <br> <br>The arrow indicates that role of letter recognition in word recognition, according to the parallel letter recognition model: letter recognition underlies word recognition. So, yes, there is a distinction between letter recognition and word recognition, but proponents of the parallel letter recognition model would consider this to be a distinction of a part from a whole. The way the terms legibility and readability are used by many typographers suggests an unproven distinction of kind: that letter recognition and word recognition are separate activities.</p>"
