  html: <p>Hello everyone, i am a graphic design student in my 3rd and final year, and currently writing my dissertation. <br>My dissertation is on the current trend of hand rendered typography over more traditional typefaces and looking into how well this style communicates.  <br>I hear there is an article in raygun composed by mr Carson which has been set entirely in webdings. I have been searching for this article for a long time now, and wonder if anyone could tell me if indeed it does exist, and if so in which edition.  <br>This would be most helpful in one of my chapters on how the motivation of the audience helps in determining the readability of a piece. <br>any help would be greatfully recieved.</p>
  html_clean: <p>Hello everyone, i am a graphic design student in my 3rd and final year, and currently writing my dissertation. <br>My dissertation is on the current trend of hand rendered typography over more traditional typefaces and looking into how well this style communicates.  <br>I hear there is an article in raygun composed by mr Carson which has been set entirely in webdings. I have been searching for this article for a long time now, and wonder if anyone could tell me if indeed it does exist, and if so in which edition.  <br>This would be most helpful in one of my chapters on how the motivation of the audience helps in determining the readability of a piece. <br>any help would be greatfully recieved.</p>
