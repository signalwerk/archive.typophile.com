    html: "<p>&gt;The way the terms legibility and readability are used by many typographers suggests an unproven distinction of kind: that letter recognition and word recognition are separate activities. <br> <br>John, you seem to be assuming that the distinction is based on the extreme view that 'bouma' or word shape is everything, which has been refuted by the examples recently discussed of mixing letters within words.  <br> <br>But your understanding on the usage of these terms I think is not correct, at least historically. For example, here is the distinction as explained in my late Uncle J. Ben Lieberman's book 'Types of Typefaces' (1967): <br> <br>*** <br>\"Legibility\" is based on the ease with which one letter can be told from another.  <br>[Here follows a graphic with b's and h's, including the old style italic h, which can be confused with a b].  <br> <br>\"Readibility\" is the ease with which the eye can absorb the message and move along the line. The choice of typeface is not the only thing that determines readibility. The size of the letter, the spacing between letters, the amount of \"leading\" (spacing) between lines, the width of the line itself, the size of the margins around the type block, the quality of inking, the effect of the process used - including the amound of \"sock\" [in letterpress] the texture or finish of the paper stock, the color of the paper and ink - all these are involved, both in affecting the appearance of the particular typefaced used and in the resulting readibility. <br>*** <br> <br>I should add that Ben Lieberman was in contact with the leading lights of his day in the type world, so this definition almost certainly reflects widespread practice in the type world. So we are talking about usage that probably dates back to at least the 1930s.  <br> <br>This definition does not make any prejudgments about the relative importance and exact role of disciphering individual letters verses whole words. It just says that there is more to readibility than distinguishing quickly individual letters.  <br> <br>Furthermore, it does seem to me from the discussions here on Typophile - I don't know the literature - that psychological research on these additional factors beyond letter discipherment has been rather neglected.  <br> <br>As irritating as I find Hrant's extreme and insulting way of putting it, I think he has a sound point that a lot of research remains to be done to enlighten us on these additional factors. I do agree with you, and not with Hrant, in thinking that in the end these results are not likely to affect normal typographic practice or speed of comprehension very much.  <br> <br>By the way, I would like to split further readibility as defined by Lieberman. There is one aspect of readibility which is reading speed and comprehension, and another which is comfort. I may be able to read a paragraph on screen as fast and with as much comprehension as a printed version. But it is common knowledge that it is more fatiguing to read low resolution screens, and that if you want to proof read something, you'd better print it out. The degree to which a setting is welcoming and comfortable to read it seems to me is extremely important to typography, beyond legibility or readibility. And it, too, could be studied scientifically.</p>"
