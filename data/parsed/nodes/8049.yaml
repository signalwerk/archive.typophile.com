    votes: null
    html: "<p>Hrant, I'm just reporting, as correctly as I'm able, the opposing viewpoint. I'm not concerned with how people make their decisions, but I am concerned that people make assumptions and encode those assumptions into their language. Making a distinction between legibility and readability along the lines we have done so in recent years now seems to me presumptuous. Sure, it may be useful and it may even turn out to be correct, but you can't expect any scientist to accept such an a priori assumption. Science is slow and takes a long time to come to a conclusion. Jumping to conclusions is obviously quicker. When we have to select a typeface for a project and decide whether it is appropriately spaced, we <i>must</i> jump to a conclusion, based on intuition, experience, etc. But this is a different process from accurately determining how we read. I wouldn't base a decision about typeface use on partial empirical understanding of how we read, but nor would I base a theory of how we read on intuition and anecdotal typographic evidence. <br> <br><i>...humans are not algorithmic</i> <br> <br>This seems to relate to something I said to Peter Enneson in Thessaloniki. The parallel letter recognition model seems to offend some people because it seems algorithmic; certainly, it doesn't seem holistic. And we like to think that we're oh so holistic, because that is how we experience thought. But all evidence of brain activity points to a crude, algorithmic device that gets by on sheer processing power: leaving us with the uncomfortable notion that what we experience as holistic may actually be the product of a massively complex algorithmic machine. The holistic appearance of thought may, in fact, be a function of the complexity. This is to what I was referring in my chess game metaphor at Thessaloniki: the experience of reading differs from the mechanics of reading. This raises all sorts of interesting questions. To what degree is the experience of reading directly addressable via the mechanics of reading? <br> <br>Imagine, for example, that you changed the rules of chess to insert an element of chance into the game. For instance, the players would flip a coin that would determine which of them would miss his third move. Suddenly, chess would no longer be a function: it would become a game. But since we don't experience chess as a function anyway -- we experience it as a game --, such mechanical tinkering doesn't significantly affect our experience. <br> <br>Likewise, it seems to me, that whether one accepts the parallel letter recognition or Hrant's bouma theory of reading -- or produces evidence of some other mechanism -- it isn't obvious that this choice, <i>or type design practices arising from it,</i> will significantly affect the experience of reading. And it is this, I think, that Richard Southall was acknowledging. Type designers and typographers are predominantly interested in the experience of reading. So when Richard told Kevin that he would not necessarily adapt his design practices to empirical evidence suggesting that loose letterspacing improved readability, one must also assume that he would not necessarily adapt his design practices to Hrant's recommendations based upon the bouma theory.</p>"
