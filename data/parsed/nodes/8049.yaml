    html: <p>Sorry I'm so late to the party, this has been an excellent and lively conversation. <br> <br>William, I envy the excellent conversations that you must have had with Sir Karl Popper. I admire him greatly. It seems worthwhile to mention one of his more important contributions to the philosophy of science. Popper proposed that every good theory should be falsifiable. Basically, that it's possible to run an empirical test that could show the theory to be wrong. For example the parallel letter recognition model predicts that longer words (words with more letters) will take longer to recognize than shorter words because of the additional computation of putting together more letters. If we ran a test and found that long words are recognized faster, then the parallel letter recognition model would be proven false. A theory like creationism is a poor one because there is no test that can ever demonstrate the theory to be wrong. I would likewise put many of Freud's theories into the same category. <br> <br>What tests can we run that would falsify the bouma model? <br> <br>Cheers, Kevin</p>
