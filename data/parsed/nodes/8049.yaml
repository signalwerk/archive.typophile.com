    html: <p>Hrant, now we're getting somewhere. <br> <br>&gt; then if you get enough data about reading  <br>&gt; times, you'll see all the boumas come out of  <br>&gt; the woodwork, like little spirits lurking on  <br>&gt; the page, waiting for people not to look. I  <br>&gt; promise.  <br> <br>The first phrase is a hedge. If I don't find what you expect then it sounds like you'll say that I didn't look long enough. This is exactly the kind of statement that makes a theory unfalsifiable. <br> <br>The rest of it is in the direction of making your theory a legitimate falsifiable scientific theory. But it's not there yet. You should say exactly what it is that I will find. Will people suddenly start fixating only once per line? Will people stop making regressive saccades? In the boundary study, will people read matching word shapes in the parafovea as fast as the actual word? <br> <br>Cheers, Kevin</p>
