    html: "<p>&gt; It is one of your most frequent dodges <br> <br>While I think accusing me of moving the goalposts is one of yours!  :-) <br>There are no goalposts. The field is the whole scope of Life, and nobody can win. Just play. <br> <br>&gt; I never said that people should make decisions such <br>&gt; as choosing a wife on the basis of formal proof. <br> <br>I've asked you before if you chose your wife based on Proof. You said yes. No way. Reason, even <i>evidence</i>, of course I couldn't agree more*. But that's <i>exactly</i> what makes me disbelieve the LP model and believe the bouma one, in spite of lack of Proof. <br> <br>* And OF COURSE emotion too! <br> <br>If the two models were women (and I weren't already married) I'd chase Bouma to the ends of the earth; and I'd get a restraining order on that damn control-freak chic. <br> <br>-- <br> <br>&gt; What tests can we run that would falsify the bouma model? <br> <br>That's a very good angle, I think. Because <i>as</i> you're trying to disprove something you will learn more about what <i>is</i> happening. I couldn't reasonably ask more than for you to assume boumas exist simply to try to prove they don't. <br> <br>The big obstacle -and I really don't mean to give anybody an impossible task, I really like empircism, if only for what it can do- is that the scientific methods used (not just by you) simply can't get there from here. Like I said it's great that you're looking into the effects of letterspacing, but as long as you're not promoting deep immersion you're never going to get any data that refutes your model, because your model is sound for deliberative reading. All you'll see is little blips of strangeness like short and frequent words being skipped more or less - not enough to shake you from your position, not enough to give Doubt real steam. <br> <br>-- <br> <br>&gt; Hrant has not suggested anything himself. <br> <br>It's hard. I've always said that. It's the PL people claiming they've \"arrived\", thanks to their shiny computers. <br> <br>I can think of a few things though, but the basic thing -again- is implementing a fundamental change in the way data is collected. As I suggested to Kevin in Thessaloniki (and people like Kinross have always maintained this) you can't really measure reading by attaching devices to people at some exact distance from some exact screen, and tell them they're guinea pigs. They'll never read naturally that way. That's why Kevin's data shows such low reading speeds for example. <br> <br>What I've suggested to Kevin is this: get avid readers in their 40s or so, pay them to sign a consent form allowing you to: provide them with reading material*, and secretly observe their reading at any time during let's say a one year span; then if you get enough data about reading times, you'll see all the boumas come out of the woodwork, like little spirits lurking on the page, waiting for people not to look. I promise. <br> <br>* Maybe books of their choice but re-typeset in certain ways. Like a string of chapters with tight spacing and a string with loose. <br> <br>The big problem is that entails a <i>lot</i> of funding. The good news -and the final piece of the puzzle which makes me excited to have Kevin around- is that MS is filthy rich. <br> <br>-- <br> <br>&gt; Our feelings are submitted to rational judgement <br> <br>John, you can't seriously think that everybody feels this way. There's something called Intuition, and it's not the same thing as Reason. Or maybe you could say it's a Reason of the Subconscious. But that's totally different than Logic. <br> <br>-- <br> <br>William, that was a great post. <br> <br>To try to clarify what the bouma model in <i>my</i> head is, it certainly doesn't say we read whole-word shapes all the time. That's nuts. It simply says that the brain uses as much as it can as fast as it can. So for example when it sees some totally clear letters in the fovea, it compiles them in parallel into words. This is Kevin's stuff. Here boumas are single letters. But it also says that the brain takes \"educated guesses\" about blurry clusters of letters some way off to the right of fixation (notably where individual letters are undecipherable, even if you give a reader extra time to consider the shape consciously - in fact consciousness might actually be an <i>obstacle</i> there). It can do this if the cluster (maybe a word, maybe a part of a word) is crisp, frequent and distinctive enough for the given experience of the reader at hand to have enough faith (never certainty) to consider it read. This is why typos are missed so much. This is heuristics. And yes, it makes empiricists quiver. <br> <br>hhp</p>"
    html_clean: "<p>&gt; It is one of your most frequent dodges <br> <br>While I think accusing me of moving the goalposts is one of yours!  :-) <br>There are no goalposts. The field is the whole scope of Life, and nobody can win. Just play. <br> <br>&gt; I never said that people should make decisions such <br>&gt; as choosing a wife on the basis of formal proof. <br> <br>I've asked you before if you chose your wife based on Proof. You said yes. No way. Reason, even <i>evidence</i>, of course I couldn't agree more*. But that's <i>exactly</i> what makes me disbelieve the LP model and believe the bouma one, in spite of lack of Proof. <br> <br>* And OF COURSE emotion too! <br> <br>If the two models were women (and I weren't already married) I'd chase Bouma to the ends of the earth; and I'd get a restraining order on that damn control-freak chic. <br> <br>-- <br> <br>&gt; What tests can we run that would falsify the bouma model? <br> <br>That's a very good angle, I think. Because <i>as</i> you're trying to disprove something you will learn more about what <i>is</i> happening. I couldn't reasonably ask more than for you to assume boumas exist simply to try to prove they don't. <br> <br>The big obstacle -and I really don't mean to give anybody an impossible task, I really like empircism, if only for what it can do- is that the scientific methods used (not just by you) simply can't get there from here. Like I said it's great that you're looking into the effects of letterspacing, but as long as you're not promoting deep immersion you're never going to get any data that refutes your model, because your model is sound for deliberative reading. All you'll see is little blips of strangeness like short and frequent words being skipped more or less - not enough to shake you from your position, not enough to give Doubt real steam. <br> <br>-- <br> <br>&gt; Hrant has not suggested anything himself. <br> <br>It's hard. I've always said that. It's the PL people claiming they've \"arrived\", thanks to their shiny computers. <br> <br>I can think of a few things though, but the basic thing -again- is implementing a fundamental change in the way data is collected. As I suggested to Kevin in Thessaloniki (and people like Kinross have always maintained this) you can't really measure reading by attaching devices to people at some exact distance from some exact screen, and tell them they're guinea pigs. They'll never read naturally that way. That's why Kevin's data shows such low reading speeds for example. <br> <br>What I've suggested to Kevin is this: get avid readers in their 40s or so, pay them to sign a consent form allowing you to: provide them with reading material*, and secretly observe their reading at any time during let's say a one year span; then if you get enough data about reading times, you'll see all the boumas come out of the woodwork, like little spirits lurking on the page, waiting for people not to look. I promise. <br> <br>* Maybe books of their choice but re-typeset in certain ways. Like a string of chapters with tight spacing and a string with loose. <br> <br>The big problem is that entails a <i>lot</i> of funding. The good news -and the final piece of the puzzle which makes me excited to have Kevin around- is that MS is filthy rich. <br> <br>-- <br> <br>&gt; Our feelings are submitted to rational judgement <br> <br>John, you can't seriously think that everybody feels this way. There's something called Intuition, and it's not the same thing as Reason. Or maybe you could say it's a Reason of the Subconscious. But that's totally different than Logic. <br> <br>-- <br> <br>William, that was a great post. <br> <br>To try to clarify what the bouma model in <i>my</i> head is, it certainly doesn't say we read whole-word shapes all the time. That's nuts. It simply says that the brain uses as much as it can as fast as it can. So for example when it sees some totally clear letters in the fovea, it compiles them in parallel into words. This is Kevin's stuff. Here boumas are single letters. But it also says that the brain takes \"educated guesses\" about blurry clusters of letters some way off to the right of fixation (notably where individual letters are undecipherable, even if you give a reader extra time to consider the shape consciously - in fact consciousness might actually be an <i>obstacle</i> there). It can do this if the cluster (maybe a word, maybe a part of a word) is crisp, frequent and distinctive enough for the given experience of the reader at hand to have enough faith (never certainty) to consider it read. This is why typos are missed so much. This is heuristics. And yes, it makes empiricists quiver. <br> <br>hhp</p>"
