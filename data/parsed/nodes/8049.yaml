    html: <p><i>I don't see any need to make a simple binary choice between reason and romance in deciding whether to get married. Personally, I considered both emotional and rational factors in getting married.</i> <br> <br>Of course. But recognising what is called, with some justification, 'true love' requires some amount of reason in itself. Our feelings are submitted to rational judgement, unless we're adolescents (of whatever age). I don't even remember when or in what context the original exchange with Hrant took place, but my recollection is that I simply asserted the importance of reason in choosing whom to marry. What I likely said, because it is a construction I have used at other times, is that love is a necessary but not a sufficient condition in marriage. And note that I say <i>in</i> marriage, not for marriage; I think there is sufficient evidence of success in arranged marriages to suggest that love may develop within a marriage rather than before it. Which is not to say that I think marrying someone you have never met is generally a good idea! <br> <br>Anyway, back to the legibility...</p>
