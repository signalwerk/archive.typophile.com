    html: <p>&gt;I'm questioning whether it should be, and to what degree it represents an a priori assumption about how we read.  <br> <br>As a rule of thumb, when a distinction is widespread, it represents something real. People may be wrong about what exactly it represents, but I don't think language evolves distinction-without-difference concepts, except perhaps in the realm of persuasive speech, where all kinds of crazy things happen.  <br> <br>Furthermore, the affect of spacing on reading speed shows that quickness of identifying individual letters is not the only factor, so that the distinction is valid at least this far.  <br> <br>&gt;our friends in cognitive psychology simply do not make the distinction <br> <br>That is not necessarily due to greater wisdom. There are competing research programs in science, and they are full of all sorts of biases about what research is going to be fruiful. It is the positivist's mistake to elevate whatever are the current biases into a substitute religion.   <br> <br>It is healthy to have competing research programs, as this sharpens research. So it would be bad to dismiss either assuming that word recognition is an insignificant problem or assuming that it is of overwhelming importance. The thing is to develop both models into testable theories, and test them against each other. That is the way we can really learn from experiment. <br> <br>What words we use - "legibility," "readability" - is not important. The idea that there is more to help the reader read than clear letters is important, and worthy of scientific study.</p>
