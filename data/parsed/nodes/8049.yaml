    html: <p>Hi Daniel <br> <br>The RayGun artcle you mentioned was at least eight years ago (so Iam not sure how relevant it is to current design trends). It seemed a pretty pointless exercise at the time, speaking as a reader of the magazine. <br> <br>But that article in RayGun is probably a good example of why legible type is in no danger of being written off. Ask yourself why was the whole magazine not set in webdings, every month! <br> <br>Because as a consumer you would go up to the magazine stand and say, I am not paying $8 for some pictures and some text which doesn't mean anything, even if it is designed by David Carson.  <br> <br>Design is all about communication, and while a hard to read display font, or piece of hand lettering may be funky for a magazine headline, the body text has to communicate with the reader clearly.  <br> <br>I'd suggest that you research th other side of the arguement, for example... if distressed looking type is so popular and trendy, why are the classic fonts the most popular (looking at sales figures). Why are companies like Sea Design ( <a href="http://www.seadesign.co.uk" target="_blank">http://www.seadesign.co.uk</a> ) and Browns ( <a href="http://www.brownsdesign.co.uk" target="_blank">http://www.brownsdesign.co.uk</a> ) in design magazines every month, and winning all the top awards (in the UK where I see you are) with clean helvetica based work if this isn't popular, and why are newspaper typefaces so conservative if readers love hard to read text? <br> <br>Please keep us posted on your progress, as I am sure lots of us would love to read the finished thing. <br> <br>Jim <br>===</p>
