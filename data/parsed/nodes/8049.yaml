    html: <p>&gt;avoiding assumptions  <br> <br>I agree, a beautiful thing in science is the willingness to test hypotheses, rather than just dogmatically push biases. <br> <br>My late teacher, philosopher of science Karl Popper, argued that science grows with bold hypotheses and severe empirical tests of them. He said that we cannot avoid assumptions and biases, and the scientific way to deal with them is to articulate them, develop them into testable hypotheses, and test them, to see whether they stand or fall. So I think that 'avoiding assumptions' is somewhat misleading. It is more a matter of articularing what they are, and testing them.</p>
