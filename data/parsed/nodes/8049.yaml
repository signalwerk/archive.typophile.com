    html: <p>Would most people consider a script font such as Zapfino legible?  Readable?  IMO it's not terribly readable, and I would be loath to read a book written in it.  I do think it's quite legible in that individual letters and even words are easily decoded, and I am confident it <i>would</i> become readable with practice.  (And Zapfino would be more readable than, say, P22 Cezanne, but I don't find either one illegible.) <br> <br>Double ditto with Comic Sans MS, which has been used by far too many half-crazed office weasels to encode lengthy memos.  It is entirely legible, but not eminently readable--especially when printed at 75dpi without antialiasing.  (Despite plenty of practice I never did become entirely comfortable reading it.) <br> <br>I believe there is a useful distinction between the two terms, but I also strongly agree they need to be scientifically defined. Such studies will add value to typography, if for no other reason than to better describe the limits of art versus practical usability.  (And if it helps to suppress lousy office memos, I'm all for it.) <br> <br>I would go so far as to say that illegibility does not preclude readability!  I suspect many of us have known husbands and wives where the husband could <i>read</i> his wife's writing so long as he "knew what it said", but the writing was so inherently illegible that it precluded reading unfamiliar words, telephone numbers, etc. <br> <br>That's an extreme example, and not everyone would agree with that particular definition; yet I feel that is still a useful distinction to be made.  Other examples might include bad bitmap fonts, low-resolution LED/LCD displays, or printouts from 8-pin dot-matrix printers.  All of these may be easily "decodable" (which may be a better term than legible) but not necessarily easily read.  Any of these may become more readable with practice, but that's equally useful information to know. <br> <br>I can imagine situations which might necessitate an unreadable but legible font, like when many similar figures are being displayed and it's important that each one is distinctly noted and checked. <br> <br>So, here's a bold definition with testable hypotheses.  Legibility is how quickly an individual letter or word may be decoded; readability is the amount of practice required to learn to "read at full speed" without strain, and may include a herd of relevant factors such as type size and spacing.  Both of these can be measured, although the latter is enormously more difficult than the former to quantify.  (Those dratted test subjects have a nasty habit of learning without telling you.) <br> <br>As far as I can tell, the cognitive psychologists can't even definitively state there are different modes of reading or what the distinctions are--let alone determine if glyph-level or word-level legibility is a separate issue from ease of reading.</p>
