    html: <p>&gt;this doesn't imply that the  <br>letter-recognition -&gt; word-recognition model is inadequate <br> <br>What kind of relationship does your arrow indicate? You are conceding that there is more to readibility than letter recognition. That estabilishes the distinction. The question is, then, how important is the distinction?  <br> <br>The model of parallel processing sounds right, but it does not contradict the importance of additional factors in reading beyond legibility of individual letters. For example the masking stuff you refer to and the spacing both have to do with we recognize words, how words are recognized apart from simply being able to quickly identify individual letters.  <br> <br>So I think the new research you cite - and it looks like Larson has learned of the importance of new problems from type designers - seems to support the importance of the distinction that typographers have long made.</p>
