    html: <p>William, the model of word recognition that Kevin Larson describes is one in which word-identity is guessed at in the brain based on all available information and, particularly, the simultaneous identification of the letters in the word. Obviously, if you fragment words by excessive or inconsistent letterspacing, then you break whatever model of word recognition you are working with, but this doesn't imply that the letter-recognition -&gt; word-recognition model is inadequate, because obviously the key to word-recognition would be <i>letters in a word</i>. If you can't easily tell where a word begins or ends, letter recognition isn't going to function as it should as part of word recognition. <br> <br>Studies on the phenomenon of lateral masking on letter recognition are interesting in this regard, because they suggest how letter spacing -- and form -- affect the ability to recognise individual letters. The basic phenomenon is that letters in the parafovea are easier to recognise in isolation than when sandwiched between other letters; the effect of the other letters is called lateral masking. What is interesting is that there is a totally unintuitive improvement in letter recognition when parts of the letters actually touch, which Peter Enneson, for one, thinks may contribute to an understanding of the value of serifs, as elements that make connections between letters. <br> <br>One of the results of the legibility panel in Thessaloniki is that Kevin is now very interested in the matter of letter spacing, and is beginning to test specifically in this area. I've talked with him a little bit about his initial results, but I don't want to steal his thunder so will let him make his findings public when he is ready.</p>
