    html: <p>&gt; obviously the key to word-recognition would be letters in a word. <br> <br>But not individually, not necessarily, not immersively. Obviously. <br> <br>BTW, I think you're overplaying the lateral masking issue. Not least because it actually seems to <i>help</i> parafoveal recognition sometimes! <br> <br>As for Kevin's research "evolution", it certainly is encouraging that he's open to suggestions from practitioners. However this can instead turn to [further] false assurance that the letterwise model is valid if he never even approaches deep immersive reading, for example by using deficient test subjects, or Arial, or... ClearType!  :-/ <br> <br>As long as you're not promoting deep immersion, all the data will still point to letterwise decipherment; because in that realm (slow, fovea-centric, shallow immersive) the letterwise model is indeed totally valid. Just not for real reading. <br> <br>When Kevin asked Richard Southall if he would change his practice if his tests showed that tight letterspacing is irrelevant, he candidly said No. And I'm with him. And so are many others. But not because we reject empiricism; it's because we reject <i>deficient instances</i> of empiricism, or at least false interpretations of data. It's very hard to measure real reading, in a wise typographic context. <br> <br>hhp</p>
