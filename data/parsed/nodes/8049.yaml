    html: "<p>Daniel, about the Carson thing, here's something: <br>That dingbats article certainly does exist. Over the years there have been many explanations, some romantic, some pedestrian, about why that happened. I've heard two that are believable: one that Carson didn't agree with the content so he made it unreadable; the other that that was only a first draft, they never got the final version in time, they didn't have time to make an intelligent decision (it's hard for Patrick after all), so he made it unreadable. The stuff about making a point about legibility seems like the typical post-rationalized designer claptrap to me. <br> <br>hhp</p>"
