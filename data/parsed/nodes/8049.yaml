    html: "<p>Kevin, yes it was a gratifying and unforgetable experience being around a truly great thinker. In my highly biassed opinion the best book on Popper's relevance to cognitive psychology is 'Learning from Error', which I wrote with John Wettersten. The first half, which mainly I wrote, is on Popper and cognitive psychology.  <br> <br>Thinking back on those days brings back to mind one of the many things he said that stuck in my mind at the time - 'file for later reflection' - that may be relevant to your work. He said he thought that the periodic reversal in the necker cube optical illusion was due to the mind raplidly trying out hypotheses to interpret the incoming data, and then refuting them and trying another, and refuting it. The necker cube causes an unusual 'loop' in the process. I'm sure Popper would say that some kind of rapid testing process is involved in identifying words. <br> <br>The bouma model in its more extreme form - that word shape is much more important than individual letters is refutable and refuted. As I mentioned earlier, the research mentioned in the letter reversal discussion here showed that: you can mix letters in a word and still read quickly. So the more extreme form is dead.  <br> <br>It is important to understand here, I think, that models in the vague sense of an idea that guides research are not testable. For example the continuous vs atomic views of reality are still vying with one another after several hundred years. As Popper emphasized, what are testable are theories. <br> <br>A model that is a heuristic idea like 'you can explain reading in terms of word shapes' is too vague to be testable, even though it can inspire testable theories. Some of Popper's followers, such as Agassi (whom I was also a student of) made clear that both research programs, inspired by 'models' and other things, and testable theories are important in the growth of science. But when it comes to evaluation you can only empirically evaluate theories, and only indirectly research programs, by whether they are fruitful or not of new discoveries.  <br> <br>As Thomas mentions, the most informative tests are 'crucial experiments' that will discriminate between two competing theories. But both theories must be testable to be so tested.  <br> <br>As Agassi pointed out, there is a danger in not distinguishing between research programs and theories. You can always cite confirmations of research programs, but experiements are only scientifically significant when they are potential refutation of theories.  <br> <br>On the 'bouma' model, those who are partisans of that research program should come up with theories to test. But no, it is better for anyone researching to come up with testable versions of theories they disagree with, as well as agree with, so they can do crucial experiments.  <br> <br>Personally, I think there is more to word recognition than letter recognition, but the challenge is to put forward alternative theories on what that 'more' is, and then to test them.  <br> <br>The discussion on emotion vs reason and marriage decisions is something I have written about, but I really don't want to get into it as I will be hours writing out the whole issue - and not exactly relevant here.  <br> <br>I will just mention though that a lot of the evolution debate is muddied by a failure to distinguish between testable theories and research programs - evolution 'theory' involves both.</p>"
