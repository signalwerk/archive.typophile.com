    html: "<p>Point of information: while some people, especially native English-speaking typographers it seems, have taken to distinguishing between legibility and readability, this seems an anomaly, both professionally and linguistically. As I discovered when moderating the legibility panel discussion in Thessaloniki this summer, cognitive psychologists studying reading do not generally make a distinction between legibility and readability. If they do make a distinction, it is not the same as that made by typographers. So while we, as typographers, might use 'legibility' to refer to letter decipherment and 'readability' to refer to word recognition, a cognitive psychologist might make no distinction, or might reserve the term readability to refer to document-level phenomena such as page layout, structure and even prose style. Many languages do not offer even a vocabulary distinction for legibility versus readability. <br> <br>I think it would be a good thing for typographers to recognise that the distinction we've taken to making between legibility and readability is really begging the question: the distinction itself assumes that letter decipherment and word recognition are somehow separate and only the latter constitutes reading. No cognitive scientist is going to accept such a loaded distinction, since empirical studies are at best inconclusive and tend, in fact, to link letter recognition and word recognition very closely.</p>"
    html_clean: "<p>Point of information: while some people, especially native English-speaking typographers it seems, have taken to distinguishing between legibility and readability, this seems an anomaly, both professionally and linguistically. As I discovered when moderating the legibility panel discussion in Thessaloniki this summer, cognitive psychologists studying reading do not generally make a distinction between legibility and readability. If they do make a distinction, it is not the same as that made by typographers. So while we, as typographers, might use 'legibility' to refer to letter decipherment and 'readability' to refer to word recognition, a cognitive psychologist might make no distinction, or might reserve the term readability to refer to document-level phenomena such as page layout, structure and even prose style. Many languages do not offer even a vocabulary distinction for legibility versus readability. <br> <br>I think it would be a good thing for typographers to recognise that the distinction we've taken to making between legibility and readability is really begging the question: the distinction itself assumes that letter decipherment and word recognition are somehow separate and only the latter constitutes reading. No cognitive scientist is going to accept such a loaded distinction, since empirical studies are at best inconclusive and tend, in fact, to link letter recognition and word recognition very closely.</p>"
