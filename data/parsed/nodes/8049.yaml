e theories, and only indirectly research programs, by whether they are fruitful or not of new discoveries.  <br> <br>As Thomas mentions, the most informative tests are 'crucial experiments' that will discriminate between two competing theories. But both theories must be testable to be so tested.  <br> <br>As Agassi pointed out, there is a danger in not distinguishing between research programs and theories. You can always cite confirmations of research programs, but experiements are only scientifically significant when they are potential refutation of theories.  <br> <br>On the 'bouma' model, those who are partisans of that research program should come up with theories to test. But no, it is better for anyone researching to come up with testable versions of theories they disagree with, as well as agree with, so they can do crucial experiments.  <br> <br>Personally, I think there is more to word recognition than letter recognition, but the challenge is to put forward alternative theories on what that 'more' is, and then to test them.  <br> <br>The discussion on emotion vs reason and marriage decisions is something I have written about, but I really don't want to get into it as I will be hours writing out the whole issue - and not exactly relevant here.  <br> <br>I will just mention though that a lot of the evolution debate is muddied by a failure to distinguish between testable theories and research programs - evolution 'theory' involves both.</p>"
