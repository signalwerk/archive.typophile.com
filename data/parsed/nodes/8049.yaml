    html: "<p>Carson spoke about the dingbat-set article at the ATypI conference in The Hague in 1996. He said that the article was crap. <br> <br>Erik Spiekermann was standing next to me at the time, voiced my own view: Carson's attitude reversed the traditional role of the typographer as servant of the text. The text was now the servant of the ego of the designer. Of course, it was an untenable reversal, and like all whom the gods would bring low, they first made Carson fashionable.</p>"
