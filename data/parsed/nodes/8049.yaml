    html: "<p>I don't hedge. I want to learn (and I want to teach/convey truth). When I first found out about Javal's discovery, I was in total shock! It opened a pandora's box. But the phantasms only made me smile in awe... and then jump <i>into</i> the box! <br> <br>If you convince me, you convince me. Then I'll be the loudest anti-typographic-anecdotalist out there. And I personally will stop making serif text fonts (unless somebody pays me to :-). \"My\" theory is very much falsifiable, I know that for sure. <br> <br>I have no problem admitting I am/was wrong. If I am wrong, I had very good reason to be - I didn't know enough, and not through lack of trying. And hey, people still admire Tschichold.  :-) <br> <br>&gt; You should say exactly what it is that I will find. <br> <br>Well, I'm willing to try that. <br> <br>Some things you'll see: <br>- Longer saccades. <br>- Skipping over words (and not just the \"Taylor 60\"). <br>- Fixations on the <i>latter</i> parts of words. Maybe. <br>- MORE regressions. <br> <br>Most notably, the first two have already shown up in your hard data, just very very faintly. You've noted saccades that are \"too long\" (like 15!), or words like \"and\" being totally skipped. That's the tip of the iceberg. <br> <br>&gt; Old Lund reviewed the many studies investigating performance <br>&gt; differences between the two font styles, and did not find compelling <br>&gt; evidence to support that case <br> <br>Come on, dude, he said more than that. He said it's inconclusive because the crushing majority of empricial testing has been fatally flawed! <br> <br>&gt; the optimal letter spacing should be in porportion to the amount of counterspace <br> <br>Yes, because we read notan. <br> <br>hhp</p>"
