      <p>Got it:<br>
      The word "Tiger" is a manual modification of<br>
      Kabel fett<br>
      Rudolf Koch<br>
      Gebr. Klingspor<br>
      1929<br>
      The designer changed the types to improve the rolls of the tank, I guess. (is "improve" correct? Don't know yet..)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_3588.png"></div><p></p>
      <p>And the Sütterlin is<br>
      Koch Kurrent from 1935</p>
      <p>Georg</p>
      <p>This is the tank "Tiger".<br>
      Used from 1943 in the tank battle of Kursk/Orel.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_6098.gif"></div><p></p>
