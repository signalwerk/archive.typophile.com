    html: <p>Sütterlin is a blackletter-script. So in 1941 it was forbade by the Nazis to use the Sütterlin like all the other blackletter-types. After the Worldwar 2 Sütterlin was only teached by a few schools but not as the basid handwriting till the 70s. Nowadays, no young German is able to read it. Also its not in use anymore.</p>
