      <p>The script is a Sütterlin-Script. I dont think that there is any digitalization of exactly that script. There are not much Suetterlin-Fonts because nobody can read it. The red word above Tiger for example means "Der" The letters are totally unrecognisable. It would be mere chance that exactly that script got digitalized. </p>
      <p>best wishes:</p>
      <p>Steven</p>
