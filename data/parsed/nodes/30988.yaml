    html: |-
      <p>The text means:</p>
      <p>"Der Tiger - Mensch, sooo ein Schlitten."</p>
      <p>The Tiger was a tank of the Wehrmacht.<br>
      "Schlitten" is a slang word in Germany for a kind of "great car" or so.. Do you know these Puerto Rico cars bumping the streets up and down? This would a german call a "heisser (hot) Schlitten".</p>
      <p>So you can translate it with "What a hottie" or so..</p>
      <p>Suetterlin is still available as a font in different versions:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_4875.gif"></div><p></p>
      <p>The reason:<br>
      Any german who is investigating his family needs "translations" of original letters, written in Suetterlin. </p>
      <p>Regards,<br>
      Georg</p>
