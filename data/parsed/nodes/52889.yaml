    html: <p>The B and S are beautiful. Do not change them if you can help it. The rigid W just doesn't go. Remove it and draw a new one that is <em>curvy</em> and fits comfortably into the spaces. If you can, make the side arms of the new W reach up and curl over the top; this would help it seem more like it could be first.</p>
