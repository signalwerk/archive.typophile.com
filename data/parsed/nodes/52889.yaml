  html: |-
    <p>The attached monogram was done for a client over a month ago. They were happy with it, though they are currently exploring conventional logos and marks.</p>
    <p>It is possible they will come back this. But either way, I am not quite satisfied with it and would love the assistance of some expert eyes and feedback on how I might make this a stronger mark.</p>
    <p>It began as a hand-drawn sketch in outlines. I then filled in the letterforms and cleaned up. It's a fairly odd and cramped intersection of shapes, but while it feels a little imbalanced now, I think it has potential. My own eye tells me that it's the W (in part) that is throwing it off…</p>
    <p>It is supposed to read WBS, though I'm not sure the hierarchy matters all that much.</p>
    <p>Thank you,</p>
    <p>—Matthew</p>
