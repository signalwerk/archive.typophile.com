    html: |-
      <p>Rui,</p>
      <p>This is a really nice one!. Just a few things that "pop out" from the overall good flow and rhythm of this typeface.</p>
      <p>I agree on the comment made for the number 3. The ampersand is great but more as a alternate rather that a regular ampersand to me. The Euro sign could also have thin "ball serifs" like the other currency signs. The upper case R is also to "alternate" for me.<br>
      Apart form that I like what I see. Gives me a sort of a "funky Bodoni" feeling. Good luck with the finalisation of your typeface.</p>
      <p>PS. The posters for TypeCon 2008, that Peter Bruhn made with your typeface on the front page made a success!</p>
