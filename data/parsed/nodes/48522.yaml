    <p>Hi everyone. I'm working on this serifed font. I am still not sure if I'm going a make a text family from this, but the idea is to make a typographic companion for my previous font Orbe <a href="http://www.fountain.nu/catalogue/orbe.asp" title="http://www.fountain.nu/catalogue/orbe.asp">http://www.fountain.nu/catalogue/orbe.asp</a></p>
    <p>I would love to have your opinion on this. thanks in advanced.</p><div class="imageWrap"><img src="http://typophile.com/files/spec_4953.jpg"></div><p></p>
