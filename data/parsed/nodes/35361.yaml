    <p>Looking for advice on this.</p>
    <p>Audience: Big wigs, business people, rich, serious no BS people.</p>
    <p>Purpose: Command respect, appear established, professional and intelligent.</p>
    <p>Message: "We are trustworthy and reliable"</p>
    <p>Client description: Atcan is [i]the[/i] distribution company for new-brunswick Canada and a leader in the maritime provinces-they have one competitor at their level. They also do high end routing, demographics reports and sales and marketing consultation. They are presently undergoing a shift. Their main client Aliant has transfered the task of directory distribution to yellow pages. Atcan wishes to use this opportunity to revamp their corporate identity to better reflect who they truly are.</p>
    <p>Atcan, a company name which stands for Atlantic Canada, has many decades experience in the field. They use the most current software to accomplish their task and their methods are cutting edge. The also use these tools and skills to offer demographics reports to retailers in the area and they sell their experience through consulting services. They are not a typical service but for the clients they do cater to they are absolutely essential. A meeting with them quickly revealed the culture of professionalism that reigns at the Atcan office. </p>
    <p>Atcan's priority with the design is to shed the fly-by-night look of their existing ID while making it clear what they offer.</p>
    <p>To see the full creative process you can view the thread on HOW.  </p>
    <p><a class="freelinking external" href="http://forum.howdesign.com/tm.aspx?m=275135" rel="nofollow">click here</a></p>
    <p>Here is the favored finalist.</p>
    <p><a class="freelinking external" href="http://i110.photobucket.com/albums/n94/ulysses01/Picture1-3.png" rel="nofollow">click here</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture-1_5603.jpg"></div><p></p>
