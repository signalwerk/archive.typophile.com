      <p><cite>Complex gradients are a pain in the butt to stick on the side of a truck with cut vinyl (and consequently much more expensive when other means are used). It seems this would be an important consideration.</cite></p>
      <p>Take a lesson from the concept here. If not the side of a truck then some other low-end repro method is going to come along. The mark should be simple enough for about any application. Flexo and many offset printers can't work with a dot lighter than 5%. A gradient that cuts off in a hard line is not attractive. The shape of the letters and the fit will make your point best.</p>
