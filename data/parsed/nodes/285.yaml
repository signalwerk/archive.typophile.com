    html: <p>I think there's a basic problem. As soon as you start categorising fonts by "creative concept", you are in effect stereotyping the use of the font. Anyone who used such a system as a way of selecting fonts would be stuck with cliches, because the system would be (in effect) a giant cliche reproduction machine ... which is not what anyone needs. <br> <br>You can go only so far with reasonably "objective" categories (serif, sans serif, text, display etc). They end up being too large to be really useful. As soon as you start trying to sub-divide them into specific "styles" or "uses", you enter the realm of subjective judgement. Nothing wrong with that. But a system that tries to allow you to make choices like that by relying on the crutch of how others use or see type is not really going to produce "creativity", but bland uniformity. <br> <br>It's tempting to think this would work because it works in some other areas (like choosing books or restaurants or whatever). There is some value in those fields to being guided by what other people think. But they are about consumption not production. Once "creativity" becomes the replication of what is generally accepted it is going to be stale.</p>
