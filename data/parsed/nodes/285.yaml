  html: <p>For my thesis i intend to create a typeface library on the web in which users can search for fonts (free, commercial, not really sure yet) by entering a keyword or creative concept (as well and name, style, designer etc). <br>I guess it would function like the stock photography sites (imagebank, photonica). <br> <br>I believe this is a more effective and more relevant way to search for fonts and would remove the need to scroll through screed of alphabetised pages.  This process would also be accompanied with a new waay to browse through the search results - this is omething i am currently working on. <br> <br>I'm just gonna put my idea out there. <br>What do guys think?   <br>Do you reckon a tool like this is needed for the type community? <br>Any feedback would be great!</p>
