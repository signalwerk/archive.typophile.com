    html: <p>Some people like cliches. What one has to look at is the use for the engine. If I need to identify a typeface, then cliches are <i>good</i> in that they can help me identify a particular font. <br> <br>But what about for a new font selection. The world of type is immensely large, just like music - it is unlikely that someone will listen to every album on earth in the hope of finding new music to listen to. <br> <br>To beat that similie into a bit more shape, look at Amazon. If I have a look for a Crass CD on amazon, I'll also get peer recommendations for other bands - some of these will be close in style, some will be close in politics, some will be close merely in that the people who like that band may be more <i>inclined</i> to like other completely unrelated bands, but of a similar <i>statue</i>. <br> <br>Back to a font example - if I did a search for a 30s typeface, in with all that chaff of art deco nonsense, I might come across Gill Sans. Further exploration could tell em that other people who liked this also liked Perpetua (which is a 30s font, but does not necessarily look like the cliche of one, at least, not to Joe Bloggs). Suddenly, because of the use of human beings in all this, I have a few items presented to me that may be fitting, but do not extend the cliche. <br> <br>Just a thought.</p>
