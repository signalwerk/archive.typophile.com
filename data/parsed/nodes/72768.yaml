      <p>archive.org has hundreds of great texts on (or showcasing) typography.<br>
      The trick is to track it all down.</p>
      <p>Some starting points:<br>
      <a href="http://www.archive.org/details/typographyadver00trezgoog" title="http://www.archive.org/details/typographyadver00trezgoog">http://www.archive.org/details/typographyadver00trezgoog</a><br>
      <a href="http://www.archive.org/details/ThePracticeOfTypography" title="http://www.archive.org/details/ThePracticeOfTypography">http://www.archive.org/details/ThePracticeOfTypography</a> (I'm reading this now-very good)<br>
      Type specimens:<br>
      <a href="http://www.archive.org/details/cu31924014559730" title="http://www.archive.org/details/cu31924014559730">http://www.archive.org/details/cu31924014559730</a><br>
      <a href="http://www.archive.org/details/convenientbookof00allirich" title="http://www.archive.org/details/convenientbookof00allirich">http://www.archive.org/details/convenientbookof00allirich</a><br>
      <a href="http://www.archive.org/details/cataloguebookofs00clevrich" title="http://www.archive.org/details/cataloguebookofs00clevrich">http://www.archive.org/details/cataloguebookofs00clevrich</a><br>
      <a href="http://www.archive.org/details/specimensandpri00incgoog" title="http://www.archive.org/details/specimensandpri00incgoog">http://www.archive.org/details/specimensandpri00incgoog</a><br>
      <a href="http://www.archive.org/details/printingtypespec00millrich" title="http://www.archive.org/details/printingtypespec00millrich">http://www.archive.org/details/printingtypespec00millrich</a><br>
      <a href="http://www.archive.org/details/pacificcoastblue00amerrich" title="http://www.archive.org/details/pacificcoastblue00amerrich">http://www.archive.org/details/pacificcoastblue00amerrich</a><br>
      <a href="http://www.archive.org/details/alphabeticalinde00daviuoft" title="http://www.archive.org/details/alphabeticalinde00daviuoft">http://www.archive.org/details/alphabeticalinde00daviuoft</a><br>
      <a href="http://www.archive.org/details/typographicspec00cogoog" title="http://www.archive.org/details/typographicspec00cogoog">http://www.archive.org/details/typographicspec00cogoog</a><br>
      <a href="http://www.archive.org/details/specimensofprint00amerrich" title="http://www.archive.org/details/specimensofprint00amerrich">http://www.archive.org/details/specimensofprint00amerrich</a><br>
      <a href="http://www.archive.org/details/fifteenthbookofs00cincrich" title="http://www.archive.org/details/fifteenthbookofs00cincrich">http://www.archive.org/details/fifteenthbookofs00cincrich</a><br>
      <a href="http://www.archive.org/details/specimensoflinot00trowrich" title="http://www.archive.org/details/specimensoflinot00trowrich">http://www.archive.org/details/specimensoflinot00trowrich</a></p>
      <p>And if that isn't enough:<br>
      <a href="http://www.archive.org/details/floralfantasyino00cranrich" title="http://www.archive.org/details/floralfantasyino00cranrich">http://www.archive.org/details/floralfantasyino00cranrich</a><br>
      Some lovely art deco illustration with hand lettering</p>
      <p>I've been searching through this archive for years and still find new treasures every time I visit.</p>
