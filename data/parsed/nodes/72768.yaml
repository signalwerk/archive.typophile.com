      <p>I am rather fond of the page I have from a missal, printed in Venice in 1525. And two leaves from “The Canterbury Tales” from about the same time. And a couple of leaves from “De Boecken genaemt Apocryphe,” Dordeccht, 1618-1619.</p>
      <p>Of course, my autographs of four of the five original Rolling Stones (Brian Jones didn't sign) is pretty cool, too…</p>
