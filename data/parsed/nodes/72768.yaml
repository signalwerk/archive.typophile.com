    <p><strong>Hi everybody!</strong><br>
    I know you have some links, <strong>Share them! :)</strong></p>
    <p><strong>1.</strong> This page is from the University of Strasbourg they have a lot of digitalized old books, with awesome resolution!</p>
    <p><a href="http://num-scd-ulp.u-strasbg.fr:8080/view/century/" title="http://num-scd-ulp.u-strasbg.fr:8080/view/century/">http://num-scd-ulp.u-strasbg.fr:8080/view/century/</a></p>
    <p><strong>2.</strong> Rarebook room, they have a original bodoni specimen!</p>
    <p><a href="http://www.rarebookroom.org/indexA.html" title="http://www.rarebookroom.org/indexA.html">http://www.rarebookroom.org/indexA.html</a></p>
    <p><strong>3.</strong> This are all of Penmanship, very interesting PDF's!!!</p>
    <p><a href="http://onlinebooks.library.upenn.edu/webbin/book/browse?type=lcsubc&amp;key=Penmanship" title="http://onlinebooks.library.upenn.edu/webbin/book/browse?type=lcsubc&amp;key=Penmanship">http://onlinebooks.library.upenn.edu/webbin/book/browse?type=lcsubc&amp;key=...</a></p>
    <p><strong>4.</strong> This link has some old borders and initials</p>
    <p><a href="http://www.fromoldbooks.org/" title="http://www.fromoldbooks.org/">http://www.fromoldbooks.org/</a></p>
    <p><strong>5.</strong> This link has the best PDF's of calligraphy and penmanship ready to download</p>
    <p><a href="http://www.iampeth.com/books.php" title="http://www.iampeth.com/books.php">http://www.iampeth.com/books.php</a></p>
    <p>This are a great source of inspiration for me,<br>
    Hope they'll be for you too!<br>
    Best regards,</p>
    <p>Fernando</p>
