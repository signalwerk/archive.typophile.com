    html: |-
      <p>I suppose a non-exclusive license on a custom commission would have a substantial discount. By what percent I would defer to someone else's opinion, but the relatively high price of the exclusive license is as it is because it precludes further sales. </p>
      <p>It's kind of a little small bit like winning the lottery, and they offer you the choice of collecting the prize in 20 annual installments or giving up half to collect the other half of it all at once. It's not exactly analogous, since long-term sales of a font are not guaranteed, but I think my meaning isn't completely murky.</p>
