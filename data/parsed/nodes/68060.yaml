      <p>Aaron: <em>Latin-9, 192 Glyph, Regular weight Sans-serif typeface.</em></p>
      <p>$7,680 for design. $5,760 for TrueType hinting. $480 per diem for other work (e.g. OpenType Layout, mastering and testing).</p>
