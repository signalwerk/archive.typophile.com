      <p>One thing about P-Shop is that there are usually many paths to the same result. Traditionally fast film produces a grain like this on its own.</p>
      <p>Not knowing the source of the image makes it largely impossible to give one formula. You may also find one formula will give a certain result on a specific image and not another.</p>
      <p><a href="http://www.google.com/search?q=Fast+Film+Grain+Photoshop&amp;sourceid=mozilla-search&amp;start=0&amp;start=0&amp;ie=utf-8&amp;oe=utf-8&amp;client=firefox-a&amp;rls=org.mozilla:en-US:official" title="http://www.google.com/search?q=Fast+Film+Grain+Photoshop&amp;sourceid=mozilla-search&amp;start=0&amp;start=0&amp;ie=utf-8&amp;oe=utf-8&amp;client=firefox-a&amp;rls=org.mozilla:en-US:official">http://www.google.com/search?q=Fast+Film+Grain+Photoshop&amp;sourceid=mozill...</a></p>
      <p>Also Polaroid tansfer technique.</p>
      <p><a href="http://www.google.com/search?q=Polaroid+Transfer&amp;sourceid=mozilla-search&amp;start=0&amp;start=0&amp;ie=utf-8&amp;oe=utf-8&amp;client=firefox-a&amp;rls=org.mozilla:en-US:official" title="http://www.google.com/search?q=Polaroid+Transfer&amp;sourceid=mozilla-search&amp;start=0&amp;start=0&amp;ie=utf-8&amp;oe=utf-8&amp;client=firefox-a&amp;rls=org.mozilla:en-US:official">http://www.google.com/search?q=Polaroid+Transfer&amp;sourceid=mozilla-search...</a></p>
