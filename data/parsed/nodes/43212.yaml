    html: |-
      <p>I spent around ten minutes in Photoshop transforming <a href="http://www.photoshopstar.com/tutorials/35/stock.jpg">this stock photo</a> (found via Google Image Search) into <a href="http://typophile.com/files/stock_grainy_4557.jpg">this</a>.</p>
      <p>Is that sort of what you had in mind? Here’s a quick summary of how I did it:</p>
      <p>I converted the image to CYMK, then copied each CMYK channel into a separate new grayscale document.</p>
      <p>For each of the four new documents, I added two 50%-gray layers and set them both to Overlay mode. Then I used Add Noise on each of the 50%-gray layers followed by Gaussian Blur. I used a different amount of Gaussian Blur on each of the two layers: a 1.5-pixel radius for the first one and 0.75 pixel for the second. The idea was to get two levels of grain: one coarse, and one finer.</p>
      <p>Then I flattened all four of the CYMK gray documents and copied each one back into the appropriate channel in the original document.</p>
      <p>I converted back the image to RGB, then added a Hue/Saturation layer to bring down the saturation. Finally, I added a Curves layer to boost the center of the red channel and depress the center of the blue channel.</p>
    html_clean: |-
      <p>I spent around ten minutes in Photoshop transforming <a href="http://www.photoshopstar.com/tutorials/35/stock.jpg" class="link-external">this stock photo</a> (found via Google Image Search) into <a href="http://typophile.com/files/stock_grainy_4557.jpg" class="link-lost">this</a>.</p>
      <p>Is that sort of what you had in mind? Here’s a quick summary of how I did it:</p>
      <p>I converted the image to CYMK, then copied each CMYK channel into a separate new grayscale document.</p>
      <p>For each of the four new documents, I added two 50%-gray layers and set them both to Overlay mode. Then I used Add Noise on each of the 50%-gray layers followed by Gaussian Blur. I used a different amount of Gaussian Blur on each of the two layers: a 1.5-pixel radius for the first one and 0.75 pixel for the second. The idea was to get two levels of grain: one coarse, and one finer.</p>
      <p>Then I flattened all four of the CYMK gray documents and copied each one back into the appropriate channel in the original document.</p>
      <p>I converted back the image to RGB, then added a Hue/Saturation layer to bring down the saturation. Finally, I added a Curves layer to boost the center of the red channel and depress the center of the blue channel.</p>
