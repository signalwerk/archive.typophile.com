    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CoDependentNewsletter_5523.png"></div><p></p>
    <p>P22 type foundry proudly announces CoDependent, a set of two fonts, designed by Terry Wudenbachs for the International House of Fonts.</p>
    <p>P22 CoDependent is a revival of the Independant typeface from 1930 created by Dutch designer Johannes Nicolaas Coenraad Collette along with Jos Dufour from Belgium. Independant was released in metal by the Belgian division of the Amsterdam Type Foundry in commemoration of the 100th anniversary of the independence of Belgium from the Netherlands.</p>
    <p>Despite the name, the two fonts contained in the set, Regular and Shadow, are not codependent upon each other. They can be used alone, but together they can create a dynamic two-color option. There have been other fonts inspired by and revived directly from Independant, but this version adheres the original design with the added consideration of how the shadow version will overlap. P22 CoDependent is perfect for a wide array of design uses. </p>
    <p>For more information: <a href="http://www.p22.com/ihof/codependent.html" title="http://www.p22.com/ihof/codependent.html">http://www.p22.com/ihof/codependent.html</a></p>
