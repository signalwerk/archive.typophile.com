    votes: null
    html: <p>What about 'lox' - the font has a slightly fish oriented style to it. It's a tasty font so far.  I agree about the 't' it is a bit shy. I like the g but it seems out of place. What about a bigger bowl on top? Or maybe just a wider one? The k isn't completely convincing in it's current form. Not the way a-f are. Something about the binary 'this style on this side &amp; that style over here' treatment of the legs seems too simple. Too formula. The v, x &amp; y also seem less finnished &amp; less beautiful than the others. I really like the font though &amp; I usually don't like scottish looking fonts like this - so I hope you keep refining it!</p>
