    html: <p>Well this type has a kind of slight Cheltenham air to my eye, but fortunately it is way nicer. <br> <br>Check the weight of the stems in the lower case h, m and n. The lower case a looks big and the g small in relation to the other letters. Try a less shy "t". <br> <br>Maybe it would not be a decent move, but it would certainly put some eyes in your type if you called it "Not Cheltenham". <br> <br> <br></p>
