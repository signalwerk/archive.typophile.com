  html: |-
    <p>We’re building a web page using Dreamweaver CS3/Fireworks and using Unicode MS as the main font. In both the Firefox and Windows browsers (in fact all we’ve tested) the bold version looks pretty bad. They don’t give you a true bold font so you have to achieve it using the “Bold” style setting in Dreamweaver.</p>
    <p>Anyone out there have experience with this?</p>
    <p>I’m also trying to figure a way to set the font at a variable width but no luck.</p>
    <p>Thanks in advance :)</p>
    <p>molly</p>
