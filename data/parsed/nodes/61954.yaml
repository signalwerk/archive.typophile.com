      <p>I did try an fi ligature but it ended up hurting the perception of the t. the f ligature rotated 180 degrees is hard to see as 'i t'</p>
      <p>the strengthening of the y tail is also something i tried but it made the initial i look less like an i</p>
      <p>i like the idea of the uppercase I in the 2nd and 3rd i. I might try it out.</p>
