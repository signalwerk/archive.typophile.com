    html: |-
      <p>In an ambigram its natural that legibility is slightly compromised, but I have some issues with this. The "in" that flips to become "y" is not reading clearly as either one. </p>
      <p>Also the "N" I realize is uppercase because it needs to flip, but it stands out a lot. Is it a smallcap or is it a shrunken uppercase N? Its stroke seems thin to me.</p>
      <p>At the moment I see an "N" encased in characters. I piece together the "infinity" afterwards because I have previous knowledge that its an ambigram and thats the word to look for.</p>
      <p>I think the various stroke widths and the many serifs are throwing me off most.</p>
