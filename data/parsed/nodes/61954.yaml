  html: |-
    <p>This ambigram didn't have any specific purpose, more of a personal challenge.</p>
    <p>I used Bodoni as the basis. I wanted to make a different amibgram than a blackletter or script, since they seem to be the most forgiving to the form. I thought a modern serif could work &amp; look somewhat unique.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tumblr_kptql4Mv2a1qz4tq8o1_500_5509.jpg.jpeg"></div><p></p>
