      <p>I definitely don't think it's a Helvetica knockoff, or that it looks like any of the Android fonts.</p>
      <p>What it reminded me of was DIN, but moderated in the direction of a conventional sans-serif like Univers or Helvetica. Roboto may have some DIN influence too in its upper-case, but not to the same extent; by comparison, Roboto is close to News Gothic.</p>
      <p>Akkurat? Not even close.</p>
      <p>So to me, the question is: will the straight sides taken from DIN really improve the appearance of this typeface on dot-matrix displays, which is presumably the intent? Or, given the prevalence of high-resolution displays on mobile devices, was this an unfortunate step at the wrong time?</p>
