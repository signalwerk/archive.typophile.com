      <p>I have never seen a single typeface whose Chinese characters bore any resemblance of character at all to its Roman letters, because the two bear no/little common ground historically or linguistically. In SimSun for instance, while said characters and letters bear comparable weights and serifs (if the Chinese call them that), because the two systems function differently, a reader wouldn't generally draw the comparison.  Therefore I would draw the conclusion that there is no benefit to the reader or appearance of design cohesion whatsoever to designing typefaces with asian and western capabilities. However in forcing Roman letters to conform to Chinese formatting, the letter 'i' becomes barely comparable to 'm'.</p>
