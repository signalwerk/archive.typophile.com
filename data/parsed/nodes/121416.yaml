      <p>@hrant:<br>
      <cite>BTW it's funny how certain people accuse Android of ripping off FF DIN, without even bothering to learn where that comes from.</cite></p>
      <p>To me, DIN means Deutsches Institut für Normung; they specified a style of lettering for use in drafting. (The Russians tended to use this style of lettering as well; in the U.S., Keuffel &amp; Esser's Leroy lettering guides were more influential - being a richer country, such luxuries were more affordable, and hand lettering was looked down on in drafting.) That it was FontFont that made a font called DIN based on this lettering style is, to me at least, secondary.</p>
      <p>While San Francisco isn't similar enough to DIN to be called a copy, it comes closer to DIN than it does to several of the other typefaces of which it has been accused of being a copy.</p>
      <p>@Nick Shinn:<br>
      <cite>But there are typographic means other than the mid-century modern International Style, to present information on such devices.</cite></p>
      <p>Looking at information presented on the high-resolution screen of my smartphone, I can well believe that it is not strictly necessary to use a sans-serif typeface in order to maintain the illusion of infinite-resolution print.</p>
      <p>For branding reasons, though, no doubt designers at both Google and Apple want their devices to fairly shout <em>Modernity!</em>, and for that, a sans-serif face is more appropriate.</p>
      <p>As to your illustration, however, the use of narrow italics, a change of font to upper-case/small capitals instead of boldface, a typeface with a small x-height, and oldstyle figures... represents a direction in which they will not go for <em>good</em> reason.</p>
      <p>If they use a serif face, it would be something more like, say, Corona.</p>
