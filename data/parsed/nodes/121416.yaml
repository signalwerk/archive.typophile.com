    html: |-
      <p>"How can that affect rendering?"</p>
      <p>The resolution of the fonts is around 3 times the resolution of the watch face, so the units per em of this font file would not likely effect rendering on this device. The reason 984 was chosen for this font is likely to be found in the combination of divisibility and file size reduction. </p>
      <p>If this is a 1 x 1.25 inch device with a 384 dpi display, (which BTW, is 4.555 pixels per point), it's likely that a 984 unit font would work faster, and take up less space than a 2048 per em font, without any visual degradation. This would also save untold byte space in a font with an extensive glyph repertoire. </p>
      <p>It is that extensive glyph repertoire, and previous hints of Apple not keeping much in residence on future devices, and knowing just how precious every single bit of space and processing power is in a wearable, that leads me to believe this font is going places. ;)</p>
