      <p>This kind of thing is clearly not graspable by all, but I see the idea of internationalizing Latin without much notice. One could also call it an Asianization of Latin. The monolining of Latin for low resolution just about finished bouncing out to the ends of Unicode, for better and worse, and now the monowidth thing of kanji is reflecting onto Latin UI design.</p>
      <p>So, while 'everybody' is reaching just about the same lowest common, international, cross platform, device independent, type design solution, denominator— yawn deceptively;), another whole totally related thing is that this kind of simple typographic identity requires a range of weights and size masters, to accomplish. Telling to anyone who wants to accurately present a typographic identity on a single device, much less for those seeking accurate multidevice multi-font family typographic identities.</p>
