      <p>However, just as Bell Gothic was useful in letting I, 1, and l be distinguishable, a more reasonable alternative they might consider, if one needs a monoline face to disguise resolution limits, would be an Egyptian like Memphis or Stymie.</p>
      <p>As for the Asianization of Latin script - San Francisco is not a typewriter-like monospace font, and so I don't immediately see how that could be a factor here, at least in a simple and direct manner.</p>
