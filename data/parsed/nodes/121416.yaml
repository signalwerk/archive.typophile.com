      <blockquote><p> all the "good" stuff appears designed for an auto body repair shop</p></blockquote>
      <p>That's just evidence of your blindness. But you can't admit any failing; for example not that an Armenian typeface delivered to a client a few years ago had a couple of entirely defective letters, even though the client was charged an arm and a leg. I know people who do better work for free.</p>
      <p>Latinization is a real problem, and I'm not remotely the only one saying it. Only cultural chauvinism (perhaps stemming from not having a single cultural, nevermind multi-cultural, bone in one's body) prevents the admission of that. This is something I was sad to realize many years ago, when reading a talk synopsis, which I will one day dig up. It was basically an ineloquent version of the following by Morison:</p>
      <p>"The Roman alphabet is not merely in possession, but it is in possession by right of conquest. The conquest was not made possible, or even expedited, by external authority; the victory of the Roman letter was due to its inherent flexibility and rationalism."</p>
      <p>Will Latin one day start shifting to look more like Chinese? That's entirely plausible, considering the world's probable economic future. But there is no evidence at all that it has already started down that path. And anyway, for the short term, instead of using voodoo math as blinders to actual design, come to Granshan in July to open your eyes to the broader world of type.</p>
      <p>hhp</p>
