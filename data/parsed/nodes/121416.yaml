      <p>San Francisco fonts are pre-release and full of problems by now. Avoid using them, especially considering them become the system font upon installation on Yosemite.</p>
      <p>The display set uses proportional figures as default, what disrupts alignment on date or size columns (and also some menubar apps). Its huge x-height may work in very small displays with a minimum of text, like Apple Watch, but soon becomes very annoying in other scenarios — like Mac OS menus and dialogs.</p>
      <p>Although better, the text set shares a number of  problems with the display one:<br>
      – error on dollar symbol;<br>
      – bad interpolated heavy Œ;<br>
      – breve accent misplaced in every occurrence;<br>
      – grave/acute bad positioning, especially with i;<br>
      – poor tilde and caron design.</p>
      <p>The fonts also support only Latin extended, without Cyrillic, Greek and phonetic sets (Mac OS will invoke another font for these). Note that San Francisco is part of Apple Watch SDK, aimed to developers. So, this is not a beta testing initiative by Apple to improve font quality. It is simply an incomplete, unpolished typeface which may or may not be corrected upon Watch release.</p>
