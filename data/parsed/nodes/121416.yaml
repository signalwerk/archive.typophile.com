      <p>"– you really have little clue beyond Latin. [] – just look at the Armenian that comes with OS X!"</p>
      <p>I know, so why send me to look!? The way I see Armenian, all the "good" stuff appears designed for an auto body repair shop, and all the "bad" stuff looks like it was designed by the auto body repair shop.</p>
      <p>"Mr Berlow, why do you think it’s impossible to go deeper than typeface pairing?"</p>
      <p>Well, I’ll be killing two birds with one stone, which won’t sit well. There’s this IP running loose, saying every light font in the universe is: “Anorexic!”, (or even more entertainingly, Apple Computer’s way of promoting anorexia). Laughable, I know — I do constantly. That same, loose-running IP says: “The Latin Script” killed the world’s other scripts, including his beloved auto body shop script.</p>
      <p>But if you are concerned about UI font design and specification, as oppposed to the typical fear and anger of the future, do this simple math, you’ll see neither of those are really true and/or unavoidable: The average Latin word is 5 glyphs, the average Latin glyph has 2 strokes (conservatively), for an average of 10 strokes per Latin word. The average Latin stroke in a Latin readability font is 1/10th of the em, and... the average Latin word has as much space horizontally, as it takes, to present that word. </p>
      <p>The average Chinese glyph is two words and has as much space horizontally as all other Chinese glyphs. Two words with a conservative Latin stroke count, is already 20 Chinese glyph strokes (not at all uncommon among Chinese glyphs). If one is lucky ;) 1/2 half of those average average average Chinese glyph strokes are vertical and 1/2 horizontal. But if the Chinese design has the same weight as a readable Latin, the em is full of strokes in both directions, with 0 white space. Nothing is too important to leave out entirely, so something’s got to give, and that is the ideal reading weight of the Latin. </p>
      <p>This is all just rule of thumb, unless one has fonts fully dictionaried with a 1:1 contour to stroke ratio, and python, it’s hard to be more precise, (and I have a lot of NDAs). But anyone with a brain can tell you for sure, even before seeing Chinese on the watch, Some of Apple’s Latin system fonts are lighter than Latin’s ideal weight. And this little talk is only about strokes and space, leaving out the other 6 parts of the universal mantra from nothing (space), to ideas (glyph or string of glyphs), which is also full of compromises by each script. </p>
      <p>It is a very small world we are looking at here. So, no room yet for serifs, hinting, script wars, or complete residence, i.e. “these fonts are going places” was not a fan reaction?, it was a technical specification, duh.;)</p>
