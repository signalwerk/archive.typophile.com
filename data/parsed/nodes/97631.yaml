    date: 2012-10-29T12:02:00
    date_raw: 29 Oct 2012 — 12:02pm
    votes: null
    html: <p>I don’t use SVG fonts myself (it is a very limited font format when it comes to fonts for complex scripts. which is what I generally work on), but FontForge can be scripted and called from regular Python scripts (unlike FontLab which I’m told you have to run the scripts inside its GUI), which is almost certainly how Font Squirrel is calling it. There is also a “native” FontForge scripting language that I often use for quick stuff, so to convert any font format that FontForge can read to SVG from command line, I’d use something like this <code>fontforge -lang=ff -c 'Open($1); Generate($1:r+".svg")' fontname.ttf</code>, which should create a <code>fontname.svg</code> file in the current directory.</p>
    html_clean: <p>I don’t use SVG fonts myself (it is a very limited font format when it comes to fonts for complex scripts. which is what I generally work on), but FontForge can be scripted and called from regular Python scripts (unlike FontLab which I’m told you have to run the scripts inside its GUI), which is almost certainly how Font Squirrel is calling it. There is also a “native” FontForge scripting language that I often use for quick stuff, so to convert any font format that FontForge can read to SVG from command line, I’d use something like this <code>fontforge -lang=ff -c 'Open($1); Generate($1:r+".svg")' fontname.ttf</code>, which should create a <code>fontname.svg</code> file in the current directory.</p>
