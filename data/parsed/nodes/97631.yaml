    <p>Hello,</p>
    <p>I am trying to generate clean SVG fonts.<br>
    I was using the batik font converter (<a href="http://xmlgraphics.apache.org/batik/tools/font-converter.html" title="http://xmlgraphics.apache.org/batik/tools/font-converter.html">http://xmlgraphics.apache.org/batik/tools/font-converter.html</a>)…<br>
    But for some reason it seems to skip some glyphs. Can't manage to get the euro sign for example.</p>
    <p>Tried with FontForge as well, no success at all.<br>
    What are you guys using? At best not fontsquirrel… ?</p>
    <p>Again, it seems our favorite tools are lacking quite important functions.<br>
    Not really happy about relying on some command line found through browsing the internet.</p>
