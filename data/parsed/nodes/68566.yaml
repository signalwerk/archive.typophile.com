    <p>LETRA is  a creative approach to the Typography world.</p>
    <p>After have noticed the gap on this discipline in the city of Madrid (Spain), the Mediodía Chica association got in touch with designers and illustrators who came from different perspectives on this interesting world and offered them to deliver a series of workshops that show their personal approach to typographic creation. Subcoolture give one of these workshops with names like Stereoplastika, Pablo Abad, Luís B and La Galga. The appointment will be a weekend once a month since March to July.</p>
    <p>More info here:</p>
    <p><a href="http://www.mediodiachica.com/blog/?p=373" title="http://www.mediodiachica.com/blog/?p=373">http://www.mediodiachica.com/blog/?p=373</a></p>
