    html: |-
      <p>My <a href="http://www.shinntype.com/paradigm.html" rel="nofollow">Paradigm Standard</a> family is $59 for seven fonts.<br>
      It has no OpenType features, but the figures are proportional old style.<br>
      If you use the Light weight for text, then you can use the Regular for small caps.</p>
      <p>In fact, if you don't have small caps in a font, it is possible to make them by using the "fake" small cap feature in InDesign, and adding a minute stroke value, plus a tad extra tracking (and maybe even a bit of horizontal scaling). I used to do that all the time in the days when the only digital fonts with small caps were Adobe Garamond and Scala.</p>
    html_clean: |-
