    <p>Hello,</p>
    <p>I am doing a magazine re-design and have been looking for a typeface family on a budget.</p>
    <p>The typefaces I have looked into are:</p>
    <p>- Farnham<br>
    - Whitman<br>
    - Chaparral<br>
    - PF Centro Serif</p>
    <p>Can anyone suggest an ALTERNATIVE typeface family (of similar nature to the above listed) that is available in a PRO version (of at least 4-5 fonts including regular, bold, italic and small caps) that sells for under $50?</p>
    <p>This also may not be possible... but one must hope.</p>
    <p>T H A N K S !</p>
    <p>- Jaz</p>
