      <p>I think a font your looking for at under 50 bucks is unrealistic. You could have a look though at the Photina Expert Volume over at Fonts.com, which sells for only € 46,- (without tax). This has oldstyle figeres and fractions and smallcaps, but no lining figures. And they are all in seperate fonts, no Open Type. You might find some inexpensive fonts at <a href="http://www.fontmarketplace.com" title="http://www.fontmarketplace.com">http://www.fontmarketplace.com</a> but they usually don't have the pro features you are looking for. You can get the Dante family + smallcaps for under 25 dollar. </p>
      <p>You could try contacting Sumner Stone, he has use based licensing for several of his typefaces like Cycles and Magma. This might be a priceworthy option.</p>
      <p>You could also see this as an investment that will pay back in the long run and buy something you could use over a long stretch of time.</p>
