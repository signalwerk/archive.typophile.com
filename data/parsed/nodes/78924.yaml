    html: |-
      <p>Still think it's leaning towards Imprint. Too many indicators to that font to ignore. </p>
      <p>The softness of some serifs can be caused by reproduction or printing process. For example, if the dictionary was a reprint or resized from a from a smaller or larger original (shot to film), this could cause some softening of the image. Again if set in metal, a flong and rotary drum may have been made for large print volumes which would cause slight changes to the type image. Even an original printed from metal could effect this.</p>
      <p>I don't think it's a Caslon because of the large overshoot on the apex of the cap A. Also cap C in Calson usually (not always) has double terminating serifs. Lowercase italic g in Caslon is usually a little more idiosyncratic also.</p>
      <p>Look for the lowercase roman k. If the upper arm appears to curve somewhat, that may identify it as Imprint. Caslon usually has this as being straighter.</p>
      <p>Perhaps look at the imprint page of the dictionary also. What impression or edition is it etc.? This might help give further clues.</p>
