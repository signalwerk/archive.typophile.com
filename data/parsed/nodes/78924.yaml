    html: <p>I think Michael has it right. But frankly, the digitized versions of Imprint may disappoint, as they have a high contrast, and so will not have the feel of the letter press book. I'm prejudiced, but I think <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText" rel="nofollow">Williams Caslon</a> captures the feel of letter press better. It is more true to Caslon proportions, but the alternative style with short descenders will get you closer.</p>
