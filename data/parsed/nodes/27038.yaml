  html: '<p>The programming details and schedule for the <b>ATypI Type Tech Forum and FontLab Workshop</b> have been posted as of this morning. These seminars are associated with the ATypI Prague conference, and run immediately prior to the conference, September 29-30, 2004. One admission fee entitles attendees to mix and match sessions between these two tracks. <br> <br>For more information about these two events please visit: <a href="http://www.atypi.org/08_Prague/30_program/30_other_events/10_typetech" target="_blank">http://www.atypi.org/08_Prague/30_program/30_other_events/10_typetech</a></p>'
