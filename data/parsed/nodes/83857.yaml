    <p>I have enjoyed learing from this website since finding it. Mucho kudos to all the intel you've given me!  </p>
    <p>My first post.....I have a nightclub/restaurant named The Grotto and looking for a font that has a stone-like feel.  The interior will have weeping water walls, other water features and have a cave-like feel.  I need a logo that channels this.  Suggestions?</p>
    <p>fishetti</p>
