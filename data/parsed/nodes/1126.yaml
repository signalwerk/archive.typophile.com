    html: <p>hhp, how did you calculate the angle on the slope? I'm really a lousy mathematicion. I failed big time in highschool on that subject. <br>Is there a formula that I could use in situations like this? Or do you perhaps have a url where I can read more on this topic? <br> <br>Thanks, <br>Ren</p>
