  - id: 8766
    user: 1250
    date: 2003-09-05T10:15:00
    date_raw: 5 Sep 2003 — 10:15am
    votes: null
    html: "<p>If you have an integer-ratio slope (like 2/3) in mind and want to get the angle: <br>Just take its arc-tangent. ATAN(0.666) = ~33.69 degrees <br> <br>If you have a degree angle (like 33) in mind and want to find the closet integer-ratio slope: <br>Take its tangent, and do a 1-over to make it easier to read. 1/TAN(33) = ~1.54 <br>Then you [generally] have to decide how to round it to get a nice ratio - in this case probably 1.5 is best. <br> <br>hhp <br></p>"
    html_clean: "<p>If you have an integer-ratio slope (like 2/3) in mind and want to get the angle: <br>Just take its arc-tangent. ATAN(0.666) = ~33.69 degrees <br> <br>If you have a degree angle (like 33) in mind and want to find the closet integer-ratio slope: <br>Take its tangent, and do a 1-over to make it easier to read. 1/TAN(33) = ~1.54 <br>Then you [generally] have to decide how to round it to get a nice ratio - in this case probably 1.5 is best. <br> <br>hhp <br></p>"
