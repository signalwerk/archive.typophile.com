    html: <p>Hmmm, I see what you mean, Neil. Do you have any suggestions perhaps on how to spice the Y/y up?  <br>And yes, I'll definately make a set of lining figures. I want the original type to have the OSF figures because that gives it a little bit flair.  <br>You really think the V is to wide? I agree about the M, N, W. I'll correct them. <br>I'm also thinking about some icons/pictograms or numerals. But I first need some topics on what icons would be sencefull to have in a type like this. Something for later. <br> <br>The font has a 33 degree angle in the diagonals. Would it be a problem if, by creating the other widths, this angle would change? Because if I stretch the type the angle changes with it. If I correct this the openings in some characters (a, e, p) will become to small, because the endpoint of the angle moved to the right. <br> <br>Perhaps it's me that I want to be more than perfect and can't see that it's finished. I have that problem more often, so... <br> <br>Thanks, <br>Ren</p>
