    <p>I am part of a small studio called <a class="freelinking external" href="http://www.peoplecollective.com.au" rel="nofollow">People Collective</a> and we are starting a new project/experiment in the creation and distribution of type. We have written a blog post that details our plans <a class="freelinking external" href="http://peoplecollective.tumblr.com/post/1197076526/kickstarter-typeface-project" rel="nofollow">here</a> but in short, hope to fund the creation of a typeface through KickStarter. We'd really like to hear your thoughts on both the creation/distribution concept and the specific design options we post to the blog over the coming weeks, thanks!</p>
    <p>-Colin &amp; Aaron</p>
