    date: 2010-09-28T09:36:00
    votes: null
    html: |-
      <p>I could see Kickstarter working for an established type designer, if say Nick, Zapf, Chank or Carter were to set something up. The resulting font could even be given away, with donators perhaps getting a special edition version or signed specimen or something. But for newbies the traditional routes of myfonts or dafont seem more appropriate. </p>
      <p>It could work for a type design newbie if they have followers in other areas - perhaps a musician or minor celebrity (Balloon Boy or Jerrod from Subway) might attract enough curiosity to attract a couple of $K.</p>
