    html: |-
      <p>Thank you all for your comments, I think that Aaron &amp; I fell victim to that scenario where you talk about something for so long that when you go to share it you forget that not everyone has been around the whole time. Thank you especially riccardo0, you've pretty much hit the nail on the head. To clarify what might have been missed in my initial post, or the blog entry we made I'll lay it out as quickly &amp; clearly as I can.</p>
      <p>•We are looking at creating a display typeface.<br>
      •We are looking at funding the creation of this typeface through KickStarter donations.<br>
      •We (People Collective) will be handling the creation of the typeface.<br>
      •We will, over the next few weeks, post 3 type sketches/directions to our blog.<br>
      •We will create the typeface which garners the most interest/discussion.<br>
      •We chose to fund the creation through KickStarter so that we can distribute the typeface for free. </p>
      <p>We haven't put a KickStarter page up yet, that will appear once a typeface has been chosen to create. </p>
      <p>I'm hoping this clarifies things a bit, again, thank you for contributing and stay tuned!</p>
      <p>-Aaron &amp; Colin</p>
