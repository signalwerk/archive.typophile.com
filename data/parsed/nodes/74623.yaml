    html: |-
      <p>Thanks for your commets guys. Nick, the route we are looking at is more along the lines of Diaspora and This American Life, those who can contribute do so that the rest of the population can enjoy the product. When Kickstarter say "Creators keep 100% ownership" they are referring to Kickstarter themselves not owning any part of the funded project. If we fund the development of a typeface through Kickstarter, then that typeface is ours to do as we wish, which would be to make it freely available. </p>
      <p>As we mentioned on our blog post, there will be other benefits and rewards for contributors, as there is with other Kickstarter projects.</p>
