    html: |-
      <p><em>We chose to fund the creation through KickStarter so that we can distribute the typeface for free.</em></p>
      <p>Will people only contribute to your project if they will get the font for free?<br>
      That seems to run against the intent of KickStarter.<br>
      It will give the investors a R.O.I. and free fonts for non-investors, while reducing creators' remuneration -- all of which run counter to the intent of KickStarter, which states that:</p>
      <p>"Creators keep 100% ownership. Kickstarter is a new form of commerce and patronage, not a place for investment or lending."</p>
