    <p>Hello,</p>
    <p>I am setting a 300 pages long reference book. I have to admit that Im doing it for the first time, and I came across some difficulties. First one is the chose of type. The book is translation, and original was set in Times New Roman. My publisher insists on using the same font for text, however, I am free to change at least chapter header font.</p>
    <p>What sanserif would you advise to use as a display font with <a href="/wiki/Times%20New%20Roman" class="freelinking" rel="nofollow">Times New Roman</a>? It should be set at about 18pt, while Times text is set at 11pt.</p>
    <p>Considering the book character (reference/study book for social workers), i was thinking of something close to Gill Sans or "friendly" fonts from Erik Spiekermann, but that is rather arbitrary idea. However, font should have central european glyphs.</p>
    <p>Thanks for reply in advance,<br>
    Ondrej</p>
