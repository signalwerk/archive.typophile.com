    html: |-
      <p>Well it all depends on how long your line of text is. The idea of adding leading is to allow enough space when you go from one line to the other. If the leading is too tight then you have a chance of losing your place on the page. Have you ever read a line, gotten to the end and then read the same line or skipped up to the previous one? Not a big deal in a short text, but if you are doing it constantly over 300 pages, then you are putting a large burden on the reader. As for the track/letter spacing, it is a matter of taste, but I find some opening of the track too give the text some air. I think fonts like TNR set too close and since the kerning tables are usually imperfect, it leads to uneven letterspacing. I've put together a quick sample. With a version of Baskerville just for comparison. Notice how much easier it is to pick up the next line after opening the lead and and notice how much more even the letterspacing is even with a relatively small  track of 10.<br>
      <a href="http://xs.to/xs.php?h=xs314&amp;d=07144&amp;f=TNRsample.jpg" target="_blank" rel="nofollow">SAMPLE</a> The first one is the default, the second is Baskerville, then TNR with more lead, then more lead with opened track.</p>
