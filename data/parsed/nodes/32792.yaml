      <p>You are setting TNR at 11? Could you at least drop it down to 10 and just open up the track and lead? As far as a good sans for TNR I like to pair a sans with a two story a and a similar x-height to cap ratio. Some suggestions would be:<br>
      Trade Gothic<br>
      News Gothic<br>
      Meta Sans<br>
      Bell Gothic</p>
