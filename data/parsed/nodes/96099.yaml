  html: |-
    <p>Andrew,</p>
    <p>If $3.50 per unit sold were the case, these numbers do not add up:</p>
    <p>&gt; Subject: Re: Business Proposal<br>
    &gt; From: <a href="mailto:sales@belightsoft.com">sales@belightsoft.com</a><br>
    &gt; Date: Fri, 6 Jan 2012 15:07:48 +0200<br>
    &gt; To: <a href="mailto:kipnick@msn.com">kipnick@msn.com</a><br>
    &gt;<br>
    &gt; Hi Nick,<br>
    &gt;<br>
    &gt; &gt; First, the font project. Things are going a little slower than I anticipated because the "algorithmic" variants aren't always so reliable. At the moment, I have 475 fonts complete and, realistically, am still a week or two away from finishing.<br>
    &gt; No problem, take your time.<br>
    &gt;<br>
    &gt; &gt; Second, Steven Litton of iCreate Magazine contacted me yesterday, inquiring about the possibility of including a few of my fonts in an upcoming issue. It seems to me that this might be a perfect opportunity to get a little free promotion for the fontpack, if we work together on the submission. Let me know what you think.<br>
    &gt; I think this can be an interesting idea. We can prepare a smaller package that can be offered to iCreate readers free of charge, in exchange they mention availability of the paid package. Do you know how many fonts they want?<br>
    &gt;<br>
    &gt; &gt; Third, it's annual royalty payment time. 'Nuff said.<br>
    &gt; We shipped 9,933 copies of software with your fonts, I will arrange $3,476 payment as soon as you confirm your PayPal address.<br>
    &gt;<br>
    &gt; Regards,<br>
    &gt; Andrew<br>
    &gt;</p>
    <p>============================================</p>
    <p><strong>9,933 × $3.50 = $34,765.50, not $3,476. You owe me some serious money.</strong></p>
    <p>Nick</p>
