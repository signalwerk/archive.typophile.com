      <p>Actually taking something like this public can put the necessary pressure on the people who need to come clean. I remember many years ago a client owed me $6,000 and would not reply to my emails, and I knew they knew people on the ATypI list, so... The client immediately got in touch, threatened to sue me for breach of NDA, but we settled (for a lot more than the $0 I had gotten from them up to that point).</p>
