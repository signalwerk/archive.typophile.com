      <p>Thank you abattis. FontPrep  from fontprep.com is nicely designed and creates a neat folder with all the css,  svg and html files necessary with just one click.<br>
      At first nothing worked until I added encoding declaration to the html </p>
      <p>A test page displayed my chosen font correctly in both Arabic and Latin in:<br>
      Chrome (Win7 and OSX)  , Safari (OSX)<br>
      It did not display my font, only a generic one in:<br>
      The latest Firefox (Win7 and OSX), IE 11 (Win7)<br>
      The svg file did not display anything in Illustrator - what is its function in a webfont?</p>
      <p>Any help with this will be appreciated.</p>
