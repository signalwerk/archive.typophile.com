  html: |-
    <p>Hello. I tried searching Typophile to learn how to convert my fonts and use them as webfonts. Alas only  one topic turned up with outdated links. Webfonts are interesting and topical, and may deserve a special Typophile Section devoted to them.<br>
    Meanwhile I would appreciate any how-tos, cautions, and accounts of experiences with online embedding of one's fonts. For example are those online services that convert one's font to a webfont reliable? What about security, copyright etc.?<br>
    Thanks!</p>
