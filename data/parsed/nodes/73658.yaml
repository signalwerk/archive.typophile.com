      <p>Jean Paul --<br>
      An elegant face in the lighter weights -- but two things hit me right off:</p>
      <p>One - the /G/ seems to list to the left (Aubaine Extra Light). I think the shape of the bottom curve as it relates to the baseline may be responsible for this.</p>
      <p>Two - the bowl of the /P/ may be too large (or the stem too short! :)</p>
      <p>I saw these two "issues" immediately in your first showing at the top of the thread, and both are still there now in the light version. The problem with the /G/ disappears in the heavier versions, but the /P/ issue remains. In your regular weight posted on the 20th, the /P/ almost seems to be riding above the baseline.</p>
      <p>These are *minor* points of note in this very clean and relaxed face.</p>
      <p>It's still fascinating to me to sense the change of feel in a typeface as it goes from light to extra bold. Really different animals at the extremes.</p>
      <p>Thanks for this.<br>
      Clair</p>
