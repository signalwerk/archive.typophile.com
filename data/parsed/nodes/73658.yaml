      <p>Lovely. Really beautiful stuff. Proportions and shapes are really polished. </p>
      <p>Observations:<br>
      Black g needs more help. To me it looks quite bottom-heavy. I've found that open-tailed design almost impossible in black weights before. I think taking weight of the top of the tail will allow more space under the bowl, and possibly also allow the bowl to be taller, but you'll need to try every imaginable way of distributing the weight until it clicks. </p>
      <p>x may be a bit wide across the weights. k also perhaps in the light and medium. And it looks slightly too curvy to my eye. Black k looks a bit high-waisted and possibly too narrow.</p>
      <p>Angled foot of K and R doesn't seem to match other perpendicular-cut terminals, would you reconsider that?</p>
      <p>Black U looks a tiny bit light. Making it wider may allow more weight on the stems without disrupting the balance.</p>
      <p>There's lots of good stuff going on here. I'm enjoying this one.</p>
    html_clean: |-
