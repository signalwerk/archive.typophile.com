    html: |-
      <p>Jean Paul<br>
      That interpolation from two extreme masters "tip" is well known and been well used since MultipleMasters and since FontLab/Fontographer existed. But I think that's an excellent way of generating all the extra weights out of your design. I'm not sure it's the best way to start *Designing* your typeface though (there might be some exceptions). For example, it could be a good idea to put this outline aside for awhile and start with an heavier weight, or even the other heavy extreme if you wish, and see the possibilities and how it can mature and develop. Maybe a middle weight to bring you further. That way it will be easier for you to later see where the faults are and to tweak accordingly. It shouldn't be the interpolation that leads the design, you know what I mean? In the "old days", the outline/hairline/whatever weights were created much later after it was clear what the design or typeface was, and if it *could* use an hairline anyway. An hairline has become very popular nowadays for headlines, but in most cases it reflects the bare minimum of a typeface (really the skeleton), rather than defining it.</p>
      <p>@Freiberger<br>
      I wasn't trying to criticize the design here. It's much to early to tell where it's going to, since all I see is (as you call it, and it's a good word-choice) a "skeleton". It really can go many ways and yes be quite pretty, but as I see it now, it looks like I've seen it before and recently in similar ways. Of course I think Jean paul should do his own research, but to me it's somewhere between the old Goudy Sans drawings, to Underware's Sauna, To the new Typejockeys' Aniuk, to Porchez's Parisine Plus, to Jeremy Tankard's drawings.. to...<br>
      there's nothing wrong in being inspired by other work, but it's usually in the details and problem-solving where people tend to copy the most.</p>
      <p>But again, "originality" isn't the point I'm trying to make here. It's the process of the design and thought of a typeface and it's nature and character, rather than the technic to generate a whole family. It seems many designers rely too much on the software shortcuts and adapting their design process to make the software generation workflow easier, while I would almost say it should be the other way around.</p>
      <p>I hope I make sense.</p>
    html_clean: |-
      <p>Jean Paul<br>
      That interpolation from two extreme masters "tip" is well known and been well used since MultipleMasters and since FontLab/Fontographer existed. But I think that's an excellent way of generating all the extra weights out of your design. I'm not sure it's the best way to start *Designing* your typeface though (there might be some exceptions). For example, it could be a good idea to put this outline aside for awhile and start with an heavier weight, or even the other heavy extreme if you wish, and see the possibilities and how it can mature and develop. Maybe a middle weight to bring you further. That way it will be easier for you to later see where the faults are and to tweak accordingly. It shouldn't be the interpolation that leads the design, you know what I mean? In the "old days", the outline/hairline/whatever weights were created much later after it was clear what the design or typeface was, and if it *could* use an hairline anyway. An hairline has become very popular nowadays for headlines, but in most cases it reflects the bare minimum of a typeface (really the skeleton), rather than defining it.</p>
      <p>@Freiberger<br>
      I wasn't trying to criticize the design here. It's much to early to tell where it's going to, since all I see is (as you call it, and it's a good word-choice) a "skeleton". It really can go many ways and yes be quite pretty, but as I see it now, it looks like I've seen it before and recently in similar ways. Of course I think Jean paul should do his own research, but to me it's somewhere between the old Goudy Sans drawings, to Underware's Sauna, To the new Typejockeys' Aniuk, to Porchez's Parisine Plus, to Jeremy Tankard's drawings.. to...<br>
      there's nothing wrong in being inspired by other work, but it's usually in the details and problem-solving where people tend to copy the most.</p>
      <p>But again, "originality" isn't the point I'm trying to make here. It's the process of the design and thought of a typeface and it's nature and character, rather than the technic to generate a whole family. It seems many designers rely too much on the software shortcuts and adapting their design process to make the software generation workflow easier, while I would almost say it should be the other way around.</p>
      <p>I hope I make sense.</p>
