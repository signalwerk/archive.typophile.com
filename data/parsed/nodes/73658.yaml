      <p>Thanks Roland, you've made my evening!<br>
      I've already prepared a small article about this design:</p>
      <p>Aubaine - pure wellness for stressed-out typographers­­­</p>
      <p>Lots of magazines and companies in the self-proclaimed field of mental and fysical wellness adore Helvetica, especially in light weights. Somehow it seems to be the one and only typeface with the right look and feel, possibly to do with width and roundness, but it lacks openness­­­­. The over-use of Helvetica in wellness magazines and packaging has a great disadvantage - they all look alike. It made me decide it was time for an alternative, a counter-movement if you will.</p>
      <p>I'll post another PDF with the altered /M/ soon.</p>
