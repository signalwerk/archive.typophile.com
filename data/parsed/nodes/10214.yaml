  html: '<p>Hi everyone, <br> <br>The inspiration for this one came after seeing a scan in the Type Identification Board: <br><a href="https://web.archive.org/web/20150123123318/http://www.typophile.com/forums/messages/83/69176.jpg" target="_blank">http://www.typophile.com/forums/messages/83/69176.jpg</a> <br> <br>Here is a draft of the lowercase + the letter H to set the cap height: <br><a href="https://web.archive.org/web/20150123123318/http://www.hackum.com/fonts/test1.gif"> sample1</a> <br> <br>As usual, the "s" is no good (yet) and there are "rough" looking characters, so any comments appreciated. <br> <br>Thanks,</p>'
  html_clean: '<p>Hi everyone, <br> <br>The inspiration for this one came after seeing a scan in the Type Identification Board: <br><a href="https://web.archive.org/web/20150123123318/http://www.typophile.com/forums/messages/83/69176.jpg" target="_blank">http://www.typophile.com/forums/messages/83/69176.jpg</a> <br> <br>Here is a draft of the lowercase + the letter H to set the cap height: <br><a href="https://web.archive.org/web/20150123123318/http://www.hackum.com/fonts/test1.gif"> sample1</a> <br> <br>As usual, the "s" is no good (yet) and there are "rough" looking characters, so any comments appreciated. <br> <br>Thanks,</p>'
