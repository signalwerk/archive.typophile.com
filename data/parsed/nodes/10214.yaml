    html: <p>Stephen, I just noticed the "t" and fixed it, thanks. As for the Didot's "g" ... well, I thought it might work in a font like this one and give it some character. <br> <br>Dav, I am not quite happy with the "a" either, there are some variations with smaller counters, which I am still considering. And the "s" is always hard for me. I will probably get back to it afer the capitals. <br> <br>My idea was to draw one more weight apart from this one - (25% thinner) and another one with shorter serifs.</p>
