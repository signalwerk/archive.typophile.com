    <p>I don’t consider myself a typographer, but I’ve designed a few simple typefaces, and I do love to read and study everything type related.</p>
    <p>I am now in a bit of a dilemma:<br>
    A company has contacted me, because they want to use one of my handwritten fonts for their marketing materials. For this, they need support for hungarian, czech, and polish characters, which should not be too hard a problem to add to my font.<br>
    However, they also want support for cyrillic characters.</p>
    <p>I’m afraid of getting in over my head trying to accomodate this last request, as I really know nothing about Cyrillic.</p>
    <p>Do you think this is doable for a novice typographer? I’m willing to put in study and effort, but can I get good results with reasonable effort?  Or is it better to refer them to someone who can do a more professional job of it?</p>
