    user: 2942
    date: 2005-12-08T17:17:00
    date_raw: 8 Dec 2005 — 5:17pm
    votes: null
    html: "<p>Hand drawn logos are really common - Coca-cola was done by hand. But logos that look as if they were hand drawn because they look rough are less common. Still, less common could mean stading out. Fashion has a large # of hand drawn logos because signatures are used a great deal. Given the picture I think something funky &amp; hand drawn is a good match to your bag's feeling. There is alot of variety &amp; expressiveness in hand drawing. Think about how you want the stroke to feel. Think or thin? Elegant or rough?</p>"
