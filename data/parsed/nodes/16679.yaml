    html: "<p>My problem is not with the design but with the marketing. You have to have a name with a label or it has no substance. As it stands now it has no creadibility. Its like saying: A baseball team by design (the baseball meetings were this week). Its never a baseball team by design, its the Yankees, the Red Sox etc. You need to establish a brand or you will fail, because its too generic.</p>"
