    html: |-
      <p>From the specimen that was issued when Columbus was released, I learn that Patricia Saunders joined the Monotype Type Drawing office in 1951, and that she worked on "adapting Spectrum for Monotype composition and also on producing...Castellar....She has also been involved in making several adaptations...such as Bell, Centaur, Felix Titling, Waubaum and Van Dijck for digital typesetting."</p>
      <p>Columbus was issued in 1992, the quincentenary of, well, of 1492. The specimen tells me it was based on a type used by Jorge Coci, active in Saragossa in the early 1500's.</p>
      <p>It's a shame the recent Ascender OpenType release of the face didn't include any of the goodies: no smallcaps, no OsFs, no ornaments or borders.</p>
