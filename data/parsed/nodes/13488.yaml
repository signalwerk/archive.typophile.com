    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Salto</strong></p>
    <p><a href="http://www.linotype.com/1438/salto-family.html" rel="nofollow">Salto</a> was designed in 1952 by <a href="/wiki/Karlgeorg%20Hoefer" class="freelinking" rel="nofollow">Karlgeorg Hoefer</a> for the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry. It was his first typeface, and one of the Klingspors' last. The calligraphic face has small lowercase letters, and large, flourishing capitals.</p>
