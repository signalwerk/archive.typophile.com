      <p><strong>Source for vernacular Portuguese</strong></p>
      <p>James, <a class="freelinking external" href="http://nossotipo.wordpress.com/tag/vernacular/" rel="nofollow">here</a> you can find examples and even vernacular fonts based on Brazilian Portuguese. Hope it helps.</p>
      <p>BTW, this is an interesting thread.<br>
      .</p>
      <p><strong>Portuguese tilde</strong></p>
      <p>Florian, what you call a habit (to dislocate the tilde to the right in Portuguese) is actually an error with interesting historical roots. Let me explain.</p>
      <p>The origin of tilde is medieval Latin. It was an abbreviation to n/m (as "cũ" meaning "cum"). Later, tilde become used to indicate various vowel nasalization cases before finally being limited to four situations:</p>
      <p>– short nasal "a" at the end of a word (lã). The sound needs ã because there is no final n in Portuguese, except for loan words.</p>
      <p>– deep nasal diphtongs "ão", "ãe" and "õe", which resembles to late Latin aun, æn and œn.</p>
      <p>Portuguese linguists discussed during 17th and 18th Centuries if tilde must be put over the first or the second vowel of these diphtongs. Between ~1700 and ~1820 the standard was to write "aõ" instead of "ão". This was later changed to the way it is used nowadays, but some people (mostly poorly educated ones) kept the old usage.</p>
      <p>It's an uncommon error, but still found in rural zones or old street displays, as these you indicated. But it's plainly wrong, an error due to poor alphabetization.</p>
      <p>This information is valid to Portugal and Brazil. I believe this was never an issue in other Portuguese-speaking countries as their colonisation was consolidated during 19th-20th Century (Angola, Moçambique, Cabo Verde) or got frozen since 16th (as Goa, Cantão and East Timor).</p>
      <p>You can find book samples of aõ usage <a class="freelinking external" href="http://www.google.com.br/search?tbm=bks&amp;tbo=1&amp;q=a%C3%B5&amp;btnG=" rel="nofollow">here</a>.<br>
      .</p>
      <p><strong>Spanish tilde</strong></p>
      <p>Tilde is not changed to a less curved shape in vernacular Spanish. What you probably saw were situations where the writer chose to add some "style" to the diacritic or just did not put much attention to it.</p>
      <p>This is somewhat common both with Spanish tilde and Portuguese cedilla because they are unique diacritics in their classes.</p>
      <p>In Spanish, ñ is the only tilde possibility. The other diacritic found in this language is acute. As they are quite different and there is no n+acute, people can write tilde even as a straight line and it remains easily recognizable as tilde.</p>
      <p>The same with cedilla: ç is the only "under" diacritic used in Portuguese. So, even if you write cedilla as a vertical line or an unconnected comma, everybody will read it still as ç.</p>
