      <p>This sounds more or less like the topic I approached in my thesis, see<br>
      <a href="http://florian.hardwig.com/manuscribe/" title="http://florian.hardwig.com/manuscribe/">http://florian.hardwig.com/manuscribe/</a><br>
      Parts of my research, together with the work of others, were used by Ken Barber for the culture-specific stylistic sets in his Studio Lettering Collection:<br>
      <a href="http://www.houseind.com/fonts/studiolettering/fontfeatures" title="http://www.houseind.com/fonts/studiolettering/fontfeatures">http://www.houseind.com/fonts/studiolettering/fontfeatures</a></p>
      <p>Regarding the diacritical marks, these fonts feature a form that looks like ó for ø (Danish), a <a href="http://www.flickr.com/photos/fountaineer/1079101663/in/pool-779590@N22/" rel="nofollow">tilde-like mark for the dieresis</a> (Swedish, Finnish; also for doubles), a <a href="http://www.flickr.com/photos/hardwig/5865605457/" rel="nofollow">steeper accent</a> for ć, ń, ó, ś, ź etc.  (Polish; kreska, not acute), flat tildes (Spanish), a less angular, more breve-like caron for  č, š, ž (Czech; háček) – among other things. They also have a proper <a href="http://www.twardoch.com/download/polishhowto/stroke.html" rel="nofollow">double ew</a>, and a <a href="http://www.flickr.com/photos/tags/udistinguisher/" rel="nofollow">‘German u’</a> with hook: not exactly a diacritic, but a distinguishing mark (from the ‘n’) – a courtesy to the reader, as Ken put it.</p>
      <p>Patterns that I have observed and that have not been incorporated in this font set include the <a href="http://www.flickr.com/photos/hardwig/5846129213/in/pool-779590@N22/" rel="nofollow">‘Swiss umlaut’</a> (horizontal bar instead of two dots), and the <a href="http://www.flickr.com/photos/tipografiaregional/5536425399/in/pool-779590@N22/" rel="nofollow">Portuguese habit</a> to sometimes place the tilde more to the right.</p>
      <p>Keep in mind that these preferences are all but set in stone. Some are true for handwriting only, others for lettering. Just because some letterforms (or accent placements) can be found repeatedly – in some scope of application, place and period – does not make them the default. They can help adding a local and vernacular flavour, but just as easily may look dated or odd, even to natives.</p>
