      <p><cite> In Spanish, ñ is the only tilde possibility. The other diacritic found in this language is acute.</cite></p>
      <p>We use ü as well, but not very often (<em>vergüenza, pingüino, lingüística</em>). The dieresis indicates that the u must be pronounced (otherwise it is omitted, as in <em>guitarra</em> or <em>guerra</em>).</p>
