      <p>Thanks for your ideas all!</p>
      <p>Locator, Gotham Rounded, Bryant, Alright Sans and Replica are beautiful, but too regular looking.</p>
      <p>I like Orbit from Village and love /A/ in it, but it is too technical.</p>
      <p>Gravur Condensed I do like very much and is certainly on my shortlist.</p>
      <p>I guess when I'm looking at Nick's diagram, it could be nearer to the far right and/or lower right corner rather then the upper right corner.</p>
      <p>The logo is set totally in caps and should last for at least three years.</p>
      <p>kind regards,<br>
      Jean Paul</p>
