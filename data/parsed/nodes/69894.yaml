      <p>Whoops, too slow! Lucky for you regret is a useful emotion.<br>
      BTW, three years is a mere blip.</p>
      <p>Sorry, I don't see anything wrong with Lato (or your recommendation of it).* Although there <em>is</em> a correlation between quality and price (and it's relatively strong in the field of type design) being open-source does not <em>guarantee</em> low quality... Especially when it comes from the person who made FF Pitu:<br>
      <a href="http://typographica.org/typeface-reviews/ff-pitu/" title="http://typographica.org/typeface-reviews/ff-pitu/">http://typographica.org/typeface-reviews/ff-pitu/</a></p>
      <p>* And in case you think I'm changing my tune as needed, here's what I wrote in that thread <em>you</em> linked to: <a href="http://typophile.com/node/77283#comment-487496" title="http://typophile.com/node/77283#comment-487496">http://typophile.com/node/77283#comment-487496</a></p>
      <p>What bugs me is that you <em>know</em> I don't automatically damn open-source efforts (because of our recent exchange concerning Source Sans Pro) but you still take advantage and attack somebody who says <em>anything</em> bad about open-source fonts, even if it's clearly true (for example that they're generally poorly spaced). This is not behavior I consider honorable.</p>
      <p>Neither, BTW is deleting self-incriminating posts... And now I'm starting to doubt the story of why you removed the "2,000+" the other day...</p>
      <p>hhp</p>
