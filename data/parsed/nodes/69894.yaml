  html: |-
    <p>I'm working on a logo for an outdoor sculpture route in a small city. The logo is completely typographical and consists of good ol' Franklin Gothic. My client is due back next week and I'd like to show him some alternatives to Franklin Gothic. I'm looking for something that says: </p>
    <p>modern,<br>
    21st century,<br>
    city,<br>
    serious,<br>
    legible,<br>
    not too quirky. </p>
    <p>Sans and<br>
    different weights are required.</p>
    <p>For the moment I'm through with TheSans and Unit.</p>
    <p>Any takers?</p>
