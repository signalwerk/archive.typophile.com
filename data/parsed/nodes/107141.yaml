  html: |-
    <p>When saving a family font s OTF or TTF in Fontlab Studio5 they work fine in all my MAC applications, but the same family does not fully show on the PC.<br>
    Some of the fonts are showing on the PC even though they've been uploaded, and it shows some of the other members of the family.</p>
    <p>Is there any setting that I should change on Fontlab so they are compatible across both platforms?</p>
