 bounce, then it would probably be safe to say that it wasn't designed properly. <br> <br>Even in faces like our TF Vignette, or another mentioned example, Linotype Banjoman, it's a matter of testing to see how high or low the join ought to be to look most pleasing (most innocuous, really) to the eye. <br> <br>I think it can be a very useful affectation. <br> <br>However, it seems to me that what the technique can contribute to the lower left corner of b is a more thorny issue.  <br> <br>Much more often, if it's not handled well in that very delicate spot, it's easy to permanently wound an entire typeface. <br> <br>Joe <br> <br> <br> <br></p>"
