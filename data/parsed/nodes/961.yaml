  - id: 7054
    user: 1976
    date: 2003-08-18T09:35:00
    date_raw: 18 Aug 2003 — 9:35am
    votes: null
    html: "<p>Eric Olson wrote, <br> <br>&gt;I'm researching typefaces that  <br>&gt;contain lowercase d's and p's without  <br>&gt;main stroke terminations.  <br> <br>&gt;In the case of the d it wouldn't end on  <br>&gt;the baseline but would continue  <br>&gt;into the bowl stroke and in the case of the p  <br>&gt;it wouldn't end on the x height but  <br>&gt;would again continue into the bowl stroke.  <br> <br> <br>A first question, of course, is how 'blended' into the bowl stroke are you meaning? <br> <br>Such an intersection can run the gamut from a hard turn to a smooth radius (with the Banjoman non-terminating example being somewhere midway in the range of possibilities). <br> <br>A stencil-like break at the top d intersection - or at the baseline with p - adds more balancing complexity. <br> <br>Here's a list of our Treacyfaces fonts with non-terminating main strokes on both d and p, or one of those characters: <br> <br>TF Alambic (d only) <br>TF Avian (p only, although a close call) <br>TF Burko (both) <br>TF Foxfire (both) <br>TF Gary (both) <br>TF Roux (both) <br>TF Vignette (both, although a close call) <br> <br> <br>All can be seen at  <br><a href=\"http://www.treacyfaces.com/sample.html\" target=\"_blank\">http://www.treacyfaces.com/sample.html</a> <br> <br> <br>&gt;(...)I'm interested in this practice  <br>&gt;but remain skeptical because to my eye  <br>&gt;the d tends to float along the baseline  <br>&gt;without the termination stroke. <br> <br> <br>I always find that it's a design balancing act. But one that can be achieved if one proceeds very carefully. <br> <br>Of course, the interaction with other characters in the design is highly important.  <br> <br>That's not to say that it's more crucial than in faces where there are more 'usual' stem terminations. <br> <br>The interaction just needs to be watched carefully, to avoid the optical bounce. In general, if it's not a non-aligning face, and it appears to have noticable bounce, then it would probably be safe to say that it wasn't designed properly. <br> <br>Even in faces like our TF Vignette, or another mentioned example, Linotype Banjoman, it's a matter of testing to see how high or low the join ought to be to look most pleasing (most innocuous, really) to the eye. <br> <br>I think it can be a very useful affectation. <br> <br>However, it seems to me that what the technique can contribute to the lower left corner of b is a more thorny issue.  <br> <br>Much more often, if it's not handled well in that very delicate spot, it's easy to permanently wound an entire typeface. <br> <br>Joe <br> <br> <br> <br></p>"
