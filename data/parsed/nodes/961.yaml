    html: "<p>&gt;Bernhard Gothic: was this the first? <br> <br> <br>Well, so far, it would seem so.  <br>(Bernhard Gothic being introduced by 1930). <br> <br>Influencers of Mr. Bernhard for those particular shape decisions, earlier on, might have been these: <br> <br>Quentell, 1895, ATF <br>Dormer (later 'Pekin'), 1888, Great Western <br>Buddy (later 'Roycroft'), 1898, M. F. Benton <br>Authors Oldstyle, 1902, BB&amp;S <br>Bullfinch Oldstyle, 1903, for Curtis Publishing <br>Hobo, 1910, ATF <br>The 'b', inverted, from ATF's Souvenir, 1914, M. F. Benton. <br>Advertiser's Gothic, 1917, BB&amp;S <br>Greeting Monotone, 1927, ATF <br>Ultra Modern Italic (just the 'd'), Ludlow Typograph, somewhere between 1928 and 1931 <br> <br>...and in the case of the 'd', the lower right quadrant shaping of various uncials. <br> <br>Joe <br> <br> <br></p>"
