  html: <p>I'm researching typefaces that contain lowercase d's and p's without main stroke terminations. <br> <br>In the case of the d it wouldn't end on the baseline but would continue into the bowl stroke and in the case of the p it wouldn't end on the x height but would again continue into the bowl stroke.  <br> <br>Gill Sans light and roman and Jeremy Tankard's Bliss come to mind. Are there others? <br>(I'm excluding faces like Dax and Prokyon as they employ a different approach all together) <br> <br>I'm interested in this practice but remain skeptical because to my eye the d tends to float along the baseline without the termination stroke. <br> <br>Any help would be greatly appreciated. <br> <br>Best, <br>Eric O.</p>
  html_clean: <p>I'm researching typefaces that contain lowercase d's and p's without main stroke terminations. <br> <br>In the case of the d it wouldn't end on the baseline but would continue into the bowl stroke and in the case of the p it wouldn't end on the x height but would again continue into the bowl stroke.  <br> <br>Gill Sans light and roman and Jeremy Tankard's Bliss come to mind. Are there others? <br>(I'm excluding faces like Dax and Prokyon as they employ a different approach all together) <br> <br>I'm interested in this practice but remain skeptical because to my eye the d tends to float along the baseline without the termination stroke. <br> <br>Any help would be greatly appreciated. <br> <br>Best, <br>Eric O.</p>
