    date_raw: 18 Aug 2003 — 7:12pm
    votes: null
    html: "<p>You know, I completely neglected to mention one of my favorites: <br> <br>Ozwald Bruce Cooper's aparently unnamed brush letter (1930), the roman of which is shown on pp.158-159 of 'The Book of Oz Cooper', The Society of Typographic Arts, Chicago, 1949.  <br> <br>Done originally just for a 1930 Harper &amp; Brothers book called 'American Alphabets', by Paul Hollister. <br> <br>What's especially fascinating about this is how Cooper devised the completely different way of terminal joining.  <br> <br>I don't know if there was ever a name assigned to the technique (which seems to be all Cooper's).  <br> <br>But it's rather like a negative terminal, or a low terminal. Ending flat (effectively), but with the bowl joining very low away from the x-height.  <br> <br>Without sacrificing the round of the bowl (round as in Bernhard Gothic's) at all. Rather, accentuating it. <br> <br>Astonishing, really. <br> <br>Talk about a set of drawings that'll make your eyes roll back! <br> <br>I know that A*I revived it as A*I Oz Brush about 1990. But it appears to be somewhat different from what I can tell from Font Book specimens. Perhaps it's a little haphazard? Hard to tell whether it was fully true to the brushed spontaneity of Cooper's masterpiece. <br> <br>I wonder if anyone knows whether Hollister's publishing of his book introducing Cooper's letter predated the release of Bernhard Gothic?  <br> <br>Joe <br> <br> <br></p>"
