  html: |-
    <p>Just a quick note to any Dutch-speaking Typophiles who might be interested. I'm being interviewed this afternoon between 3 and 4 pm for <a href="http://www.radio1.be/radio1_master/programmas/neo/r1_neo_home/index.html" rel="nofollow">Neon</a>, a program on <a href="http://www.radio1.be/" rel="nofollow">Radio 1</a> (Belgian national radio), about 50 years of Helvetica.</p>
    <p>I hope I don't screw up! :^P</p>
    <p>BTW I'll be proudly wearing my "Who needs Helvetica?" Hattenbach T-shirt. Figures...</p>
