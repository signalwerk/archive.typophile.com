    html: |-
      <p>Good question. I suspect that Adobe's layout engine is not doing substitutions on the space glyph. If that's the case, and you don't want to kern it, I'm not sure I have any other suggestions.</p>
      <p>I will note that a more appropriate glyph name would be "space.arabic"; the glyph name "arabic_space" suggests that it is a ligature of the "arabic" glyph and the "space" glyph. There are some paths to PDF creation where this naming could cause problems for later text recovery.</p>
      <p>Cheers,</p>
      <p>T</p>
