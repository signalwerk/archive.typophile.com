      <p>Thank you sir!<br>
      Btw, if i do use kern, exactly where its table should be added? On latin script or arabic? My last tests shows that adding kern.space on latin script isnt recognized on microsoft products. However, adobe indesign is handling it fine.<br>
      Another option could be; not adding any latin glyphs in the font. But that might trigger many problems when applying underline, bold etc, later... :)</p>
