  html: |-
    <p>Hi, I am developing a nastaliq font, which requires two individual spaces: one for arabic script, other for latin. So questions is, how do I do it in ms volt? I have already tried substituting space -&gt; arabic_space and placed it in ccmp. This solution works fine for MS products, but not for adobe cs5 me.<br>
    Any alternatives? Also tried kerning space, but that is not the good solution... :)</p>
