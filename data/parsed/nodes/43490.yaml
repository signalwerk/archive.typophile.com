  - id: 267882
    user: 5039
    date: 2008-03-22T20:22:00
    date_raw: 22.Mar.2008 8.22pm
    votes: null
    html: <p>For vintage inspiration and ideas, look at magazines of the era. Most of the 20th century is certainly represented well with sans serif, but what you’re probably missing is the differences in how type was set, spaced, arranged or accented in previous decades. Helvetica used in the 1950s is recognizably different from how Helvetica is used in 2008.</p>
