    <p>i guess at some point i fell in love with adobe garamond, and have been using it far too much along with bembo and a few other serifs. problem? i have to do an identity for a vintage clothing store and i’m trying to use a sans serif, although after about 50 tries and a few oddball fonts they all feel far too modern. any suggestions?</p>
