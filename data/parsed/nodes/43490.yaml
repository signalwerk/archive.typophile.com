    html: <p>im using a wide range. 40’s-80’s. i have a ton of old life magazines, but im looking for new sources of inspiration. there are a few boutiques in soho that just specialize in vintage but they have the same aesthetic as any other modern clothing store. it all looks nice but im getting bored of wood floors , white walls, and little else. this is for a school assignment i probably should have clarified that.</p>
