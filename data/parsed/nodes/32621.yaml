      <p>I think, this is waht basically I am used to. I don't remember having some special file management software or even backups routines going on constantly (which is bad, of course).<br>
      I was thinking of setting up a pc with all data I have for the brand/product and fixing up a share folder/drive, so we can swap files easily. Plus weekly updates of the every new file edited or created during this week?... No tapes, just dvds.<br>
      I am no fan of reporting either, but I am looking into something like Studiometry <a href="http://www.oranged.net/studiometry/" title="http://www.oranged.net/studiometry/">http://www.oranged.net/studiometry/</a> for keeping records of things done. I have to test it first on my own, though.<br>
      Version Cue and Bridge are not your devices of choice, are they? :)</p>
      <p>Cheers,<br>
      A</p>
