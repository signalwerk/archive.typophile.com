      <p>I've worked in a handful of small and large firms.</p>
      <p>For the most part, our system was fairly basic. File server where all files are stored for a project in folders adhering to some logical naming system. File servers backed up nightly to tape, rotated off-site and/or into a fire safe. Finished jobs archived off onto CD/DVD with at least two copies, one being stored off-site.</p>
      <p>Unless you have a fixing for middle management, I'd stay skip routine meetings and writing up reports.</p>
