    <p>Hello,</p>
    <p>it was quite a bit since I've posted anything on typophile. It's time to get back to The Source.</p>
    <p>My one-man show finally gets promoted to a two-men show, where I am supposed to get the direction. It should seem like a good news and it is. But I do miss the things on  managing a team. Now, after you rofled for sometime and got back to the monitor - the team will only get bigger now, so I've thought I'd better learn how to manage things (from data assets to the hardware to the team) itself before I lose the credentials and trust from the Top, which happens easily here.</p>
    <p>So where do I start? My particular interest lies in readings and software I would eventually need.</p>
    <p>Anyone uses Bridge and Version Cue here from the CS?<br>
    How do you handle data, when three designers, a copywriter and an art director work on one project?<br>
    How do you use servers?<br>
    How often do you back up the data?<br>
    Do you meet on weekly basis to discuss stuff or do you let it out on a daily basis at a cig break?<br>
    Do you write/require reports? Which ones?<br>
    ... [and so on]</p>
    <p>Any feedback is hugely welcome here.<br>
    (and while you are writing, I'll get the eight_hours_delayed lunch)</p>
