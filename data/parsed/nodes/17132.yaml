      <p>Thanks for the help, guys. Malvern does appear to be a perfect match -- and quite a bargain, too.</p>
      <p>As Mike has mentioned, there are many small differences between Kynges X NF and Malvern. Aside from the more glaring variations in form (such as the <cite>n</cite> that Thomas has pointed out), Malvern is on the whole more uniform and harmonious, while Kynges X NF is relatively uneven and idiosyncratic.</p>
      <p>BTW, Thomas, you probably already know this, but just in case you were wondering about the <em>other </em> face used heavily in <cite>Puerto Rico</cite>, it's <a href="http://www.bertholdtypes.com/bq_library/90092.html" rel="nofollow">Post-Antiqua</a> from <a href="http://www.bertholdtypes.com/" rel="nofollow">Berthold</a>.</p>
      <p>It's a great game indeed. And now that I know what faces to use, I'll be able to make my own authentic-looking custom building, resource, and even role pieces.</p>
