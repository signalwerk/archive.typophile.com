    <p>I am trying to identify one of the typefaces used in the board game <a href="http://www.boardgamegeek.com/game/3076" rel="nofollow"><cite>Puerto Rico<cite></cite></cite></a>. I've attached an image that contains examples that I've scanned in from various playing pieces and the game manual.</p>
    <p>The best match I've been able to find so far is <a href="http://www.myfonts.com/fonts/nicksfonts/kynges-x-nf/." rel="nofollow">Kynges X NF</a> from <a href="http://www.nicksfonts.com/" rel="nofollow">Nick's Fonts</a>. It's close, but not exactly the same.</p>
    <p>According to that MyFonts page, Kynges X NF was "inspired by an offering in the 1938 classic, <cite>Letters and Lettering</cite> by Paul Carlyle and Gus Oring". Perhaps the face I'm looking for was digitized from the same source?</p>
