      <p>I too see lots of little differences.</p>
      <p>The typeface appears in the Solotype Catalog as Yucca. Dan Solo created a digital version under a different name, for some reason: Malvern. It can only be had from the <a href="http://store.doverpublications.com/0486999602.html" target="_blank" rel="nofollow">24 Celtic and Medieval Display Fonts CD</a> from Dover. I have Malvern and it is a perfect match.</p>
