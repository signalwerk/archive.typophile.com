    html: |-
      <p>Eben, that fuzzy area is precisely driving home the point. =)</p>
      <p>Yeah, none of the articles seem to define exactly what the photographers' setting was. Also, as Andyclymer pointed out on Flickr, it's odd that the subject of the photograph is suing, not the photographer himself. Seems like they could include the photographer in the suit since it's he who did not get a model release for his subjects.</p>
      <p>The lesson is: don't use Flickr for sourcing images unless you're ready to do legwork with the photographers yourself.</p>
