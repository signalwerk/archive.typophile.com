      <p>Yeah, odd that none of the articles say anything about the restrictions. If the photographer set it to commercial use allowed without the need for persmission, for example, I wonder if they have a leg to stand on in court.</p>
      <p>Still, I guess it would be somewhat <em>common</em> sense if you really want to use a photo on Flickr, to just contact and ask the person who made it, even if it says you don't have to. I know I would.</p>
