  html: |-
    <p><a href="http://www.flickr.com/photos/joepemberton/1438687193/" title="Photo Sharing"><img src="http://farm2.static.flickr.com/1105/1438687193_cf9360b7f0_o.jpg" width="315" height="314" alt="Creative Commons = Creative Confusion?"></a></p>
    <p><a href="http://ap.google.com/article/ALeqM5hY4qGm1zcwVgM74krLbd4eMB3Shg">Virgin Australia uses teen's Flickr photo for commercial use?</a> Nuts.</p>
    <p>As much as I like what CC is doing, it certainly hasn't helped add clarity when (possibly irresponsible) creatives think they can a) use something for commercial use and b) merely give a vague attribution to Flickr, (rather than the content creater/owner). </p>
    <p>By the, way this logo I've faked here is called parody, an area of copyright law that covers my mock of their logo. (And, I'm not an IP lawer, so don't treat my commentary as legal advice.) </p>
    <p>Now, when I'm creating a parody, do I retain full copyright? Dang.</p>
