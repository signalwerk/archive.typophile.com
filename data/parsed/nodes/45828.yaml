    <p>Hi,</p>
    <p>I’m redesigning the art section of the newspaper I’m working for and I’m looking for a fresh looking type for the headlines. I really like SoHo from Sebastian Lester. But I’m not 100% sure. What do you think? Do you have some alternatives or suggestions?</p>
    <p>Thank you very much</p>
    <p>——</p>
    <p>alainch</p>
