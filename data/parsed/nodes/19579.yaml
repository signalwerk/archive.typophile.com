      <p>Welcome Kristin,</p>
      <p>I think there is some really nice stuff going on here, and you said it could be for anything, correct? I think with what you have, as I was told when I first joined this community, is to find a purpose for it. Something I am still trying to grasp as well is how function, form and style cohabitate. Finding a function should be your next step. IMHO, it's hard to crit/judge the appropriateness of something without context.</p>
      <p>p.s. - Where are you in grad school?</p>
