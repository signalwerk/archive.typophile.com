      <p>They’re showing it in Seattle this week, and I’ve thought about going again. But I probably won’t. It’s weird, because now all of the trendy “designers” have caught on to the film and think they are hip and “into” fonts because they’ve seen the film.</p>
      <p>Really, it’s quite sad. The movie was good, and the guys involved in it were good, but I don’t know if it’s a “second time on the big screen” movie. Maybe I’ll go just to network.</p>
