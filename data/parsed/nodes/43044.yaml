    html: |-
      <p>I saw it at NWFF in Seattle this week, after seeing it on DVD. The audience seemed to be pretty into it, although I’d guess probably 50% were designers. The head of our local AIGA chapter even gave away a Helvetica poster to the first person who could produce something from their pocket with Helvetica on it — it took about 5 seconds for a winner to pop up.</p>
      <p>My non-designer friend I saw it with liked the interviews, particularly with the more cantankerous designers like Massimo Vignelli and Erik Spiekermann, but felt the ending kind of fell apart. I’d have to agree with that. I was expecting something more poignant at the end, and it kind of fell flat. There was this build-up to show Helvetica as a microcosm of 20th century western thinking, but it never came full circle.</p>
    html_clean: |-
