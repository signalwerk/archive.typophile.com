    <p>I have just seen the Gary Hustwit’s Helvetica Documentary.<br>
    Quite late, but I guess it is better late than never.</p>
    <p>I felt very disappointed and did not enjoy it as much as I was told I would.<br>
    Same faces, same stories, same work...</p>
    <p>What did you guys feel about it?</p>
