  html: <p>Since the above-linked prior Typophile thread about Too Much, I came across a copy of the only version I'm aware of of Too Much (solid) and Too Much Outline. This is from WSI, a firm that sells lots of mostly knock-off-clone fonts to software companies which, in turn, bundle them with their applications. <br> <br>The fonts were named Chubby by WSI and, since this is apparently not available from anyone else, I'm linking to the solid <a href="http://fonts.ontheweb.com/fonts/chubby__1.html" target="_blank"> Chubby</a> � sold under the Fonts On The Web banner. <br><br></p>
