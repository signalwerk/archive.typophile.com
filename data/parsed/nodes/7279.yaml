    html: <p>Thanks Dan. I really missed being part of this group, so I'm looking forward to getting back into it.  <br> <br>(Southern Italy was a fun tour, and we had a great time, but I had to resist saying the names of typefaces I saw on signs and posters. They used Belwe, Revue, B�cklin and Bauhaus in a lot of shop signs and roadside advertising. I was struck by how little custom lettering I saw used -- except for things that were hand-lettered by obvious amateurs. It was like a typographic tour of the late 80's and early 90's. Probably 90% of the fonts could have been from the Adobe Portfolio.)</p>
