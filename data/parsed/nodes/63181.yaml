      <p>Hi, </p>
      <p>I have to say this: Well done on the initiative / self-practice!</p>
      <p>The logo has the right amount of simplicity and fun relating to kids. The incorporating of the dinosaur image is good. </p>
      <p>Suggestions:<br>
      1.The dinosaur's head seems to be a tad too awkward with the mouth.<br>
      2. You would need to choose whether to place the tagline eschewed to the right with the brandname 'dino' in an upward curve OR a more traditional centrally-aligned under 'dino'.</p>
      <p>This may come as a surprise, but I've just recently completed a similar design:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dinosaur4_4679.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/dinosaur3_5689.jpg"></div><p></p>
      <p>nagfa</p>
