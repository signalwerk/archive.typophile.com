    <p>Below is an attempt at a whimsical logo for an imaginary children's graphic design company. I am designing the logo as practice, to develop my design "skills", and I recognize that criticism plays a crucial role in my improvement. So, here it is. I welcome any and all feedback you can provide.</p>
    <p>Thanks-</p><div class="imageWrap"><img src="http://typophile.com/files/dino_3825.png"></div><p></p>
