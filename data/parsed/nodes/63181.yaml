      <p>I think it’s great that you do these kind of exercises! </p>
      <p>I like how the letters in dino are so playful, though the dinosaur d is not obvious enough yet. You need to play more with the head. Especially the mouth.<br>
      I think the tagline typeface is to serious, to straight, to work with the wordmark. I’d look for something a little more playful.</p>
