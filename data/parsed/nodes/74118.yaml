    <p>Hey guys...</p>
    <p>Been trying to find a tattoo (full arm) what would contain all the letters of the alphabet mixed up, been researching this for months, but no luck, would anyone on here have any idea???...</p>
    <p>The idea of the tatto was mixed cases (upper and lower) in complet ramdon order, running down the arm onto the forearm and around the arm, Im a graphic designer, so wanted to have something like this....and help would be appreciated....</p>
    <p>Drop me a mail at <a href="mailto:info@ray.ie">info@ray.ie</a></p>
    <p>Thanks</p>
    <p>Ray</p>
