  html: <p>i'm looking for a comprehensive resource/tutorial/book on how to get fonts from photoshop into fontlab/fontographer/etc and would like some recommendations. <br> <br>also, what's the learning curve for fontlab for a type newbie?  i want my work to be professional, but i don't want to wade through piles of documentation for a font application that has tons of features i'll never use. <br> <br>thanks in advance for input.</p>
