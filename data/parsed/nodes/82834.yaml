    html: <p>I think it's just a result of writing with a brush. As you lift the brush, particularly when changing direction, the stroke width thins and can break entirely. So writing a glyph like き (ki), the last stroke can either be continuous, or thin/break at the bottom of the first segment, and you'll see variations of that in fonts.</p>
