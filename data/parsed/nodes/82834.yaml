  html: |-
    <p>Many Japanese typefaces have areas in which the stroke width reduces to literally nothing in certain areas of certain characters. I don’t have an example handy right this instant, but I can probably come up with some if no one knows what I’m talking about.</p>
    <p>Just out of curiosity, can someone explain why this is?</p>
