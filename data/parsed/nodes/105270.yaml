    <p>Hi all,</p>
    <p>I'm designing a UI for a kids video game and I had chosen House Industries CoopBlack display face to do some of the titling.</p>
    <p>We've been doing some testing with an early years education centre, and they have raised the issue that kids in the game's age group (2-4) have not yet been taught to read capital letters. Unfortunately CoopBlack is caps only!</p>
    <p>There is a lower case version of the face which was created by Christian Schwarz for Toys R Us, but it's not publicly available: <a href="http://www.orangeitalic.com/coop.shtml" title="http://www.orangeitalic.com/coop.shtml">http://www.orangeitalic.com/coop.shtml</a></p>
    <p>Can anyone recommend a similar fun and chunky display face with a lower case?</p>
    <p>All suggestions greatly appreciated!</p>
