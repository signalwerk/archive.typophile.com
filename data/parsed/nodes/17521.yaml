      <p>Knowing most of the bukva:raz! judges very well, I find it highly improbable that they were motivated by any desire other than to make the best selection of types from the entries before them. Actually, it is a laughable suggestion. But the question of whether ATypI board members and officers should have been elligible to enter in the first place is a legitimate one. If ATypI were organising a competition now, I would certainly be making to case to the board that we should be excluded from entering. Not because I wouldn't trust the judges to be impartial, but simply because it avoids the kind of insinuation -- unproveable and hence also impossible to defend against -- that Hrant has voiced. The TDC policy that James describes makes a lot of sense to me, and had I been involved in planning bukva:raz! I would have recommended the same.</p>
      <p>I've no idea how the judging was conducted for the Creative Review competition, but it can't help but look sleazy when the judges appear to have declared themselves the winners in two categories. That's just stupid, especially since it is the first time this competition has run, and it should be trying to establish credibility. One thing I will note about the Creative Review competition though, is that Fiona Ross was identified as a judge in the call for entries and earlier publicity surrounding the contest, and had been asked to judge non-Latin entries. In the event, this was considered unnecessary as there were not a significant number of non-Latin types entered, so Fiona was not involved in the judging. If the reputation of the competition is tarnished because of the judging, Fiona's certainly should not be.</p>
      <p>Like Jean-François, I have judged a couple of competitions, and found it necessary sometimes to abstain from discussion or voting on specific entries because I felt there was a conflict of interest. This seems to me fairer than withdrawing the entry from competition: better to let the other judges make a decision about it.</p>
