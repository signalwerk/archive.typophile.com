      <p>&gt; You hint that ...</p>
      <p>Well, it's true. I remember at least two people<br>
      on the T-D list, although at least one of them<br>
      I can dismiss as motivated by vindictiveness.</p>
      <p>But even if nobody complains (in public) I think<br>
      there really is a potential problem there - and<br>
      that's why the TDC decided to change (see below).</p>
      <p>&gt; What you are hinting at is that the judges would compromise their<br>
      &gt; standing by favouring the designs of people they know, over those<br>
      &gt; they could not guess the authorship of.</p>
      <p>Actually, no - in the case of Bukvaraz I was saying that there<br>
      were submissions by people who shouldn't have submitted; and<br>
      you could say that was the real problem, putting the judges in a<br>
      position very difficult to balance. On the other hand, I have a<br>
      suspicion that -at least some of them- were encouraged to submit<br>
      by the organizers, who perhaps panicked in the face of an initially<br>
      low submission count (and perhaps entries of low quality). And once<br>
      a submission is made the organizers couldn't ask the person to withdraw<br>
      it (once the competition did get enough entries), and the person<br>
      submitting would have to be quite exceptionally gracious to withdraw<br>
      it without being asked, so... What you have is a very human mess.<br>
      And one of my points was that this seems to happen more often with<br>
      first-time competitions.</p>
      <p>So I don't blame the judges of Bukvaraz (or the TDC) for<br>
      anything (except maybe being human) - especially since<br>
      submissions were anonymous. Mostly I'm trying to explain<br>
      a phenomenon. </p>
      <p>&gt; But should not all submissions be judged equally on a level field?</p>
      <p>Yes, but is that 100% possible? All I'm saying is that we<br>
      should take the answer to that into account when deciding<br>
      what to think of certain results.</p>
      <p>&gt; Have another look at the names of the judges, and consider<br>
      &gt; if you would repeat these suggestion to their face.</p>
      <p>If that causes me to be less candid (and it would) then that<br>
      is my own weakness. Maybe the facelessness of online discussion<br>
      allows for greater candor? And maybe we should embrace that as<br>
      a means to improve ourselves?</p>
      <p>&gt; the TDC now prohibits all board members of<br>
      &gt; entering work in the type design competition. </p>
      <p>A wise if painful decision.<br>
      Not everybody is a pragmatist.  :-)</p>
      <p>I have noticed the TDC paying more attention<br>
      since squeaky public wheels started grinding,<br>
      and that makes the TDC a better organization.</p>
      <p>&gt; had to be created in 2005.</p>
      <p>The form I filled out said "any typeface<br>
      designed, first sold or first used between<br>
