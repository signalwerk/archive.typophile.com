      <p>John is very gracious most of the time. But if you're willing and<br>
      able to read between and lines, and put things in the perspective<br>
      of our "particular" relationship, you should be able to see various<br>
      <cite>insinuations</cite>, including some outside the relevance of this discussion.<br>
      For example the particular details he provided in elaborating on<br>
      Fiona's role had one clear purpose in my mind, and a purpose<br>
      unfitting an otherwise gracious person. The only relevance that<br>
      Fiona had here is that she didn't participate in a judging that<br>
      some people might consider suspect; but even pointing that out<br>
      harbors various insinuations, and was done because John likes<br>
      Fiona, and not the other ones. That's favoritism. I know because I<br>
      do it to. But I admit it. I admit that I'm human, and feel obligated<br>
      to remember, and sometimes point out, that my friends are too.</p>
      <p>As I said above: egos get hurt, but we must<br>
