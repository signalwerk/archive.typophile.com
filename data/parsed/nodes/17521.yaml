      <p>Judges are (almost) always named with the call for entries; it is a selling point of a competition to have high-profile judges. Since judges know that they're going to be judging the competition, they shouldn't enter their own work; which is a clear conflict of interest. If you want to enter work in an competition, then don't accept an invitation to judge it.</p>
