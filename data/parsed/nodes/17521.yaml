      <p>Some telling "formal proof"* that judges can sometimes indeed be "motivated by [a] desire other than to make the best selection of types from the entries before them" is what Fred Smeijer's revealed in the TDC's Typography 19**: that he chose the Armenian entry because it was for a marginal writing system. A formalist might call this Wrong, a pragmatist might call it Admirable, but the point is it happens, including with people of nearly unimpeachable reputation and rock solid ethics, and sometimes people have the balls to even put it in writing.</p>
      <p>* Something some people [claim to] require, if only when it's opportune.</p>
      <p>** Tellingly, the <cite>first time</cite> the TDC held a type design competition.</p>
      <p>hhp</p>
