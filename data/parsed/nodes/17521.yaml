      <p>Alex White was not a judge of the competition the year his work won. He was on the board, but the judges did their work anonymously. Aknowledging that perception sometimes trumps facts the TDC now prohibits all board members of entering work in the type design competition. I have been a member of the TDC Board for over ten years now, and have never entered work in the competition.</p>
      <p>On another note, it appears that the work judged in the Creative Review competition had to be created in 2005. I seem to remember Hrant offering his winning entries for a few years now. New Design?</p>
      <p>James</p>
