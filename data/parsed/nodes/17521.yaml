  - id: 107558
    user: 1551
    date: 2006-02-07T06:43:00
    date_raw: 7 Feb 2006 — 6:43am
    votes: null
    html: <p>I trust that all the judges acted honorably. However, the submission of judges' work in a contest, particularly as authorship of a judge's work is likely to be known to other judges, is I think not a good policy. The knowledge of the other judge, who is likely to come from a group of people who are known to each other, and may well be friends, makes it difficult to be objective, however much a judge sincerely tries to be fair. Thus the awards, though merited, will, as we see, have a cloud of suspicion cast over them. And this is not fair either to the judges or the participants. Thus the policy now evidently followed by other contests, of excluding submissions from judges, seems the wiser one.</p>
