      <p>Hrant, I normally don't bother commenting on flippant remarks, but as one of the judges of that event I am annoyed at the shallowness of your comments. You hint that "someone, not me" suggests that Bukva:raz was improperly run because "a number of ATypI board members (including the VP) got a bunch of awards". </p>
      <p>What you are hinting at is that the judges would compromise their standing by favouring the designs of people they know, over those they could not guess the authorship of. But should not all submissions be judged equally on a level field? Or should we have exercised some form of reverse favouritism, penalising typefaces the provenance of which we recognised? Have another look at the names of the judges, and consider if you would repeat these suggestion to their face. </p>
      <p>Using one competition where you may, probably reasonably, make some pointed remark as a stepping stone to smear another is really lax logic. You should aim higher than that.</p>
