      <p>This sort of thing does seem to happen, like when Alex White<br>
      won at the TDC a few years ago, and with an entry (or was it<br>
      two?) that was deemed inferior by people who know a lot about<br>
      Eastern European type. This seems to happen especially when it's<br>
      the first time a contest is judged - remember what happened at<br>
      Bukvaraz, when a number of ATypI board members (including<br>
      the VP) got a bunch of awards. In the case of first-time awards I<br>
      have this suspicion that it's partly due to a fear of not having<br>
      enough entries, and asking people you personally know to submit.<br>
      The categories with "no winner" might attest to that, although<br>
      otherwise refusing to grant a first place because you think no<br>
      entry deserves it is certainly admirable in my book. Morisawa<br>
      used to do that too.</p>
      <p>Personally, being a pragmatic, I would give the benefit<br>
      of the doubt that a judge stepped out when it came to<br>
      his own entry (I even remember this being a clause in<br>
      one other recent event) and I will reserve judgement<br>
      until I see the fonts in question, to see if there was a<br>
      strong chance of undue bias. To me type design is too<br>
      much like "family" to be too absolute about preventing<br>
      some people from entering at all.</p>
      <p>That said, I certainly am glad I didn't get second place<br>
      to an entry from a judge! In such a case I would doubt<br>
      my OWN objectivity in arriving at a proper reaction...</p>
      <p>hhp</p>
