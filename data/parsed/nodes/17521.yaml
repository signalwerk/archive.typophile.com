    html: |-
      <p>OK, as the chairman of the judges I think I should comment, too:</p>
      <p>The type world is small and many people know one another, if not in person then at least via email. We certainly know of each others work. It is therefore near impossible not to be tainted when judging a type competition.</p>
      <p>However, suggesting that the panel of judges may have behaved with impropriety is insulting to my professionality and integrity. Winning a category with one of our typefaces, or Jason Smith with one of his is because the work stood up against the other entries, not because we were rubbing each others back. It is also grossly insulting to Dave Wakefield, who proved to be an invaluable umpire and neither Jason or I would have dared suggesting that our type should win simply because we were the judges.</p>
      <p>It was unfortunate that both Domenic Lippa and Nick Hayes were not able to participate. Such is life, we have businesses to run. In the end this turned out to be a blessing in disguise as we were able to spend more time on in depth discussion on individual entries. None of our desicions came easy, precisely because we know how much time and effort goes into creating a good typeface. In many cases we compared the quality of drawing of individual characters, compared the quality of spacing, how the font family works etc to finally favour one design over the other.</p>
      <p>It is debatable whether judges should be excluded from entering work. I certainly have come accross my own work when judging D&amp;AD entries and it has not impaired my facilities to be objective. I have been designing type for long enough to recognise that there are others who are better than me, and when comparing my work with theirs I will say so. </p>
      <p>In the end you will have to take my word for it that the judging process was indeed conducted properly. If you think otherwise, I'll see you at dawn...</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
