    <p>- - - - - - - </p>
    <p>The Creative Review Type Design Awards were set up to honour excellence in type design from around the world. Any typeface first released in the year up to October 2005 was eligible to be entered. The entries were judged by Bruno Maag of Dalton Maag, David Wakefield and Jason Smith of FontSmith, who were asked to base their selections on the follwing criteria: originality, quality of execution and fitness for purpose. </p>
    <p>The winners are:</p>
    <p><strong>Display Single</strong><br>
    <em>Winner: Bello designed by Underware, The Netherlands</em><br>
    Commendation: Monitor designed by Rian Hughes, Device, UK<br>
    Honourable Mention: Landing Strip designed by Adam Graveley, UK</p>
    <p><strong>Display Family</strong><br>
    <em>Winner: Plume designed by Bruno Maag &amp; Ron Carpenter, Dalton Maag , London</em><br>
    Commendation: Kari designed by Neil Summerour, Positype, USA</p>
    <p><strong>Text Single</strong><br>
    <em>No winners</em></p>
    <p><strong>Text Family</strong><br>
    <em>Winner: FF Nexus designed by Martin Majoor, The Netherlands</em><br>
    Commendation: FF Maiola designed Veronika Burian, London<br>
    Commendation: Auto designed by Underware, The Netherlands<br>
    Commendation: Calibri designed by Lucas De Groot, Fontfabrik, Berlin\<br>
    Commendation: Ficus designed by Malou Verlomme, Paris<br>
    Honourable Mention: Arlt designed by Alejandro Lo Celso, PampaType, Mexico</p>
    <p><strong>Custom Single</strong><br>
    <em>No winners</em><br>
    Honourable Mention: UOS Titling designed by Shelley Winters and Blast, London</p>
    <p><strong>Custom Family</strong><br>
    <em>Winner: Channel 4 designed by Jason Smith, Fontsmith, UK</em><br>
    Commendation: Sheffield Sans designed by John Powner, Atelier Works and Jeremy Tankard, UK<br>
    Commendation: Deréon designed by Jean Francois Porchez, Porchez Typofonderie, France<br>
    Commendation: Mencken designed by Jean Francois Porchez, Porchez Typofonderie, France<br>
    Commendation: Dream designed by Veronika Burian for Dalton Maag, London</p>
    <p><strong>Revival/Extension Single</strong><br>
    <em>No winners</em><br>
    Commendation: Super Veloz designed by Andreu Balius and Alex Trochut Barcelona, Spain</p>
    <p><strong>Revival/Extension Family</strong><br>
    <em>Winner: Andrade designed by Dino dos Santos, DSType, Portugal</em><br>
    Commendation: Lapture designed by Tim Ahrens, Just Another Foundry, UK</p>
    <p><strong>Non-Latin Single</strong><br>
    <em>No Winners</em></p>
    <p><strong>Non-Latin Family</strong><br>
    <em>Winner: Nour &amp; Patria designed by Hrant H Papazian, The Microfoundry, USA</em></p>
    <p><strong>Ornamental</strong><br>
    <em>No Winners</em><br>
    Honourable Mention: Trust Me 97 designed by Stuart Price and Chris Jeffreys, The Chase, UK</p>
    <p>- - - - - - -</p>
    <p>For more details of the winners and judges’ comments see the February issue of Creative Review, <a href="http://www.creativereview.co.uk" title="www.creativereview.co.uk">www.creativereview.co.uk</a></p>
