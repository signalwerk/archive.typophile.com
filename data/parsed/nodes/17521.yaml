      <p>Hrant, I'm a little surprised to read that you're demanding an apology from John Hudson! If there is one thing that John Hudson is, it is gracious. Look at the volume of helpful posting he has done in the tecnhical strings of this site and you will probably have to agree with me.</p>
      <p>John was aiming to shed light on Fiona Ross's involvement (or not) in the CR judging because he knows what that situation was, and does not know what was going on with Messrs Hayes and Lippa.</p>
      <p>It's insulting to ask "established" designers to refrain from entereing contests (that they're not any way involved in judging); they have just as much right to win prizes as the "newbies" and "up-n-comers" are.</p>
      <p>I don't know what won at bukva:raz!, and I'mnot going to spend time tracking that information down. If judges awarded themselves, that's a shame because they should have refrained from entering the competition in the first place. But if "established" designers won, it is almost certainly not through cronyism but through sheer talent. I recall that the competition was aimed at typefaces which dealt with multiple languages and writing systems; which is the kind of work that is and was typically engaged in - especially before the ease of OpenType development, when bukva:raz! was held - by established designers.</p>
