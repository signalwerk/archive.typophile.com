    date: 2006-02-07T02:08:00
    date_raw: 7 Feb 2006 — 2:08am
    votes: null
    html: <p>As the editor of Creative Review I thought I’d better clarify a few things about our Type Awards. As is made perfectly clear in the current issue of the magazine, no judge was allowed to vote on or to lobby for their own work. A member of Creative Review staff was in the judging room at all times. The reasons for each decision are recorded in the judges’ comments in the issue but, simply put, if a typeface won a category it did so because it was the best entry in that category, pure and simple. To suggest otherwise is a wholly unwarranted slur on the professional reputation of our judges. Regarding the judging panel, Domenic had a diary clash and so couldn’t attend while Nick was delayed in his return from Los Angeles and so also didn’t make it. Fiona kindly agreed to join us and offer her expertise for the non-Latin categories. However, because the entry for those categories was low, we agreed with her some days beforehand that the expertise of the other judges would be adequate to assess those entries.</p>
