      <p>Why are type design competitions held after all?</p>
      <p>Is it to promote our craft in general? Is it in order to fill some pages for the next issue and make money? Is it to help people choose/find good fonts? Or is it to honour good designers simply because they deserve it?</p>
      <p>What are your answers to this? I am sure they are quite different.</p>
      <p>Tim</p>
