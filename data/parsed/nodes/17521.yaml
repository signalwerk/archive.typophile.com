      <p>&gt; we were able to spend more time on in depth discussion on individual entries.</p>
      <p>In fact reading "It is our intention to allow the jury to<br>
      give proper and careful consideration to all aspects of a<br>
      typeface’s design and its success in fulfilling its intended<br>
      aims. Any material which helps the jury make its assessment<br>
      should be included with the entry." on the entry form is one<br>
      of the big reasons I decided to spend the money and submit.</p>
      <p>I think any merit my work has tends to be below the surface<br>
      (although some people still won't like what they'd see there!)<br>
      and when people are given 5 seconds to form an opinion they<br>
      usually think "this is a mess" or "it's unnecessarily complex".<br>
      I submitted my essay from Spatium (and now Hyphen) as well<br>
      as Emily's actual book (it helped that she's in London :-) and if<br>
      this were a competition that had taken a fraction of a minute per<br>
      submission to form an initial opinion (and thereby axe most of the<br>
      entries) I wouldn't have stood a chance. Unfortunately, most com-<br>
      petitions, including the most prominent one, are exactly like that.</p>
      <p>I think the best thing a competition can do is Go Slow.<br>
      To me Critique magazine really did it exceptionally well...<br>
      and I'm not saying that just because I won there too!  :-)</p>
      <p>--</p>
      <p>&gt; Why are type design competitions held after all?</p>
      <p>I think the core reason is: people like to watch.</p>
      <p>hhp</p>
