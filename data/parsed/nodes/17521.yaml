      <p>Well, I certainly agree that this case is harder to justify than what<br>
      happened at Bukvaraz (which does not necessarily mean anything<br>
      "funny" actually happened). Bukvaraz however can [also] be held<br>
      up by some people (not me) as an example of cronyism - and for<br>
      better or worse, on the ground that's the problem, more than an<br>
      abstract concept of Fairness.* Contests, after all, are mostly an<br>
      issue of perception - at least I think so.</p>
      <p>* Is it "fair" for example for some talented people to be excluded<br>
      from winning at the TDC or this competition because they simply<br>
      can't afford to enter? And isn't it "fair" what ATypI did a couple of<br>
      years ago: lowering membership fees for people from non-affluent<br>
      countries? That was a great moment... but as rare as it was great.</p>
      <p>hhp</p>
