      <p>I meant license from others, as in the OP’s “…purchase [licences] from…”, not licence to.</p>
      <p>So I have changed from licensing fonts <em>from</em> others, which I did in the early days of digital, when I was working as an art director and graphic designer, to licensing fonts <em>to</em> others, since I have been publishing fonts full time.</p>
