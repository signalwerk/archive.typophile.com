    <p><strong>¶ Find the ritual question concerning the foundries that you admire and purchase from.</strong></p>
    <p>Back in the 1990's, the first foundry that I was hooked on was<br>
    <a class="freelinking external" href="http://www.houseind.com" rel="nofollow">House Industries</a>.<br>
    I discovered it by reading a newspaper in which I noticed <a class="freelinking external" href="http://www.houseind.com/fonts/housegothic23" rel="nofollow"><em>House Gothic</em></a>.</p>
    <p>Let's hear from you…</p>
