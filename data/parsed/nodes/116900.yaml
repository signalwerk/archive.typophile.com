    <p><strong>¶ Find the ritual question concerning the foundries that you admire and purchase from.</strong></p>
    <p>Back in the 1990's, the first foundry that I was hooked on was<br><a href="http://www.houseind.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">House Industries</a>.<br>
    I discovered it by reading a newspaper in which I noticed <a href="http://www.houseind.com/fonts/housegothic23" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;em&gt;House Gothic&lt;/em&gt;</a>.</p>
    <p>Let's hear from you…</p>
