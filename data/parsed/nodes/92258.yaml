    html: |-
      <p>Cum grano salis:</p>
      <p>Specially your «&amp;» needs more overshoot, but in general the entire lowercase lacks of it.<br>
      «v»,«w», «y», etc. need <em>optical</em> correction, and that is, making the right stem a bit thinner than the opposing left stem to make them <em>look</em> equally thick.<br>
      The crossbars in «t» and «f» could be a tad thinner.<br>
      «c» is too wide.<br>
      I'd take Option D for that «Q», but the tail could be shorter.<br>
      Option A for the sake of «k»!</p>
      <p>Keep on polishing that letters! :-)</p>
