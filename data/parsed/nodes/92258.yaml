      <p>If you want this to be more texty, shorten the descenders (or raise the ascenders, but then also probably the cap height).</p>
      <p>The "Q" is too brutish.</p>
      <p>The "S" and "s" need more weight in the spine than the rest.</p>
      <p>The "g" is too heavy at the bottom.</p>
      <p>I like the "?", but the "&amp;" is malformed.</p>
      <p>hhp</p>
