      <p>Well, Microgramma/Eurostile and its sibling Handel Gothic seem to be the favorite fonts of sci-fi filmmakers. Although it takes quite a leap of faith to believe that the other 12 human tribes developed the same alphabet and typefaces as we did during the eons we were divided &amp; yet — managed to get the form factor of books, paper and screens completely wrong, with these cut-off corners… ; )</p>
      <p>I refer to Battlestar Galactica, of course.</p>
      <p>___<br>
      Bert Vanderveen BNO</p>
