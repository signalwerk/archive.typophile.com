      <p>Yes. I think you are right.<br>
      looking again at some youtube extracts that show different characters I'd say it looks like microgramma.<br>
      (even though eurostile is similar, microgramma has a more rounded junction within its joins, which are evident.)</p>
      <p>thanks Geoff.</p>
