    <p>Hi all,</p>
    <p>A very obscure topic I know...<br>
    But It's a question that I've wondered ever since I saw Bladerunner, the R.Scott sci fi movie<br>
    Has anyone noticed that Bladerunner uses a similar 3 character screen motif in some gui mock-ups very similar to the HAL 9000 screens in 2001?</p>
    <p>I'd always thought that Eurostyle would be a good approximation for the HAL typeface in bold (possibly extended? - I'm not that familiar with eurostyle)<br>
    does anyone know what the actual typeface used was?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HAL_6499.gif"></div><p></p>
    <p>should I post this to font ident forum?<br>
    I hesitate, because I have such a poor screenshot.</p>
