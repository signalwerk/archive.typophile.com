    <p>Hello there,<br>
    In VOLT, I try to add a substitution lookup which is supposed to substitute the glyphs of one group by those of another. However, it doesn’t replace, let’s say, the nth glyph of one with the nth glyph of the other, although the order of the glyph groups is right. Everything gets scrambled when it gets through this particular lookup. Any ideas?</p>
