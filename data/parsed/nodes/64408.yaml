      <p>Because logos are special. They go on every single thing a client does. You don’t get a great logo by using cheap type.</p>
      <p>And a LOT of designers are letting the font designer do most of the work in creating a wordmark. In some agencies a workmark design is 90% done after a name is dumped into a stock document with find/replace. If your client wants a great logo, they need to pay for great lettering. If you can’t draw great letters, and you’re not willing to hire someone who can, you SHOULD have to pay extra for great letters. If you think that you’re so good you should not have to pay extra to use fonts in logos, then you need to draw your own letters.</p>
