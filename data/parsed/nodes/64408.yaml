      <p><a href="http://www.typetrust.com/info/eulafaq.php" rel="nofollow">Most of your questions regarding the licensing for Recovery are covered in the TypeTrust EULA FAQ.</a> As for use in the logo, if it includes other elements you might not need to. Branding stuff gets negotiated with TypeTrust. I realize that isn’t especially convenient, but it’s not exactly killing an art director to send someone an email asking for clarification and pricing.</p>
      <p><cite>So am I correct in interpreting that the license allows me to create those vectors and then edit them to meet my client’s aesthetic goals?</cite></p>
      <p>Correct. AFAIK most type EULAs prohibition on derivative works is there to keep someone from changing the outlines around a little and reselling them.</p>
