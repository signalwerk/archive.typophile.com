      <p>So help me understand your position better. Your very handsome font RECOVERY is for sale at TypeTrust for $20. Which of the following uses would require me to obtain what the EULA defines as a commercial license and what would the additional license cost:</p>
      <ul>• Use as title text on CD/DVD packaging or on a book cover<br>
      • Use as title text on a poster or other collaterals for an event<br>
      • Use as text in advertising in a magazine or newspaper<br>
      • Non-editable use on a website<br>
      • Use as a wordmark logo<br>
      • Use as a component of a logo that also includes other graphic elements</ul>
      <p>Also, the EULA specifies derivative work as font software and not anything involving the manipulation of vector letterforms created with use of the licensed font software. So am I correct in interpreting that the license allows me to create those vectors and then edit them to meet my client's aesthetic goals?</p>
