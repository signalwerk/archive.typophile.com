    <p>In my ongoing quest to understand font software EULAs, I have a new question:</p>
    <p><strong>Why do some font designers or foundries prohibit or require an additional license fee to use a font for a logo?</strong></p>
    <p>In understand wanting a different kind of fee for adding the actual software (or some subset thereof) to a product that will be sold, be it interactive (a design program) or even static (a set of alphabetic rubber stamps). I don't understand the reason for additional fees when it comes to (relatively) static use such as logos, where the software never leaves the designer's office.</p>
    <p>Your thoughts?</p>
