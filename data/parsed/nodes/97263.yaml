    html: |-
      <p>Glyph names are mapped to Unicode values using the .nam files stored in  the FontLan/Shared/Mapping folder. By default, FontLab's 'Standard Table' is used, which is based on the Adobe Glyph List and uniXXXX algorithm. It is possible to create custom .nam files, which are helpful if you want to employ custom mnemonic names during development instead of uniXXXX names for scripts not covered in the Adobe list. If Unicodes are not being automatically assigned to newly created glyphs, it is an indicator that there is a mismatch between the current .nam file being referenced by FontLab and the glyph names you are using. Select 'Generate Unicode' from the Glyph\Glyph Names menu to activate an appropriate .nam file.</p>
      <p>[Note that if using custom .nam files, every once in a while FontLab will revert to is Standard Table. I've never figured out what triggers this.]</p>
