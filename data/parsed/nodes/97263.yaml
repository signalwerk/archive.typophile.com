    <p>Hey guys<br>
    I am working on a font in fontlab studio v5 and suddenly a glyph of mine stopped getting displayed in the preview window. And it happens such that if i keep a / before it, then it gets previewed. Also I had noticed that when i change the display properties of the glyph cells in the glyph page from name to unicode.. nothing happens. None of the glyphs  have unicode assigned to them. Now to preview any character, i have to use a / character before it. What happened?</p>
