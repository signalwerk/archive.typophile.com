    html: <p> Tanya brings up a good point in terms of feasability. 43.001 is astonishing, sure -- in fact, easily my favorite so far -- but will cost something like three times as much to produce as _ten_ colors printed on a blank  tee shirt. A t-shirt with a bleed is called  a "cut &amp; sew" and is printed on separate  material and then assembled. Tricky, careful, expensive. Normal tee shirt printing takes  into account the cheapness, multiple sizes, and random variation of t-shirt blanks, so involves something of a "margin." <br> <br>Which isn't to say these designs with bleeds shouldn't be considered, but that their production expense should be taken into account, and that we should expect Jared and Joe to pass that expense on to we, the potential buyers. </p>
