    html: "<p>Generate OTFs instead of Type 1 (identical functionality, smaller file size, cross platform). Use the OpenType prefered sub family names, which are recognised by Adobe apps. Note that you cannot directly control the ordering of sub-family names in the Adobe menus: the ordering is controlled by weight class and then alphabetised.</p>"
