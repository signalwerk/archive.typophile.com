    <p>More naming issues! I’m generating type one fonts for a family with eight styles. These styles are not your standard reg, ital, bold, bold ital etc. They are as follows.</p>
    <p>Regular OSF<br>
    Regular Tab<br>
    Italic<br>
    Bold<br>
    Smallcaps<br>
    Display Caps<br>
    Inline Caps<br>
    Ornaments</p>
    <p>Questions:</p>
    <p>1. How do I make them show up in this order in the Adobe Apps?</p>
    <p>2. Should I:<br>
    a) make two suitcases of 4 styles each, and mark them reg, ital, bold, bold ital even though they are not?<br>
    b) Or should I make individual suitcases for each of the odd ones (ie smallcaps, ornament, display, inline etc) calling them “regular”? Does it matter?</p>
    <p>3. Ignoring Dezcom’s warning, I try to test with Suitcase X1 also. Suitcase is telling me that all the weights are the same font and will only activate one style (this is with a 2b settup)?</p>
    <p>Any thoughts would be appreciated.</p>
    <p>Randy</p>
