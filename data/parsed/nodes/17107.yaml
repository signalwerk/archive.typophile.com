      <p>Randy, I’m afraid I can’t help with your specific question, as I’ve never bothered with trying to get styles to appear in a specific order.</p>
      <p>I’ve always made Type 1 suitcases correspond to retail packages — that makes sense for font management, whether it’s being done by distributors or end users. So if this typeface will be sold as one package, I would make it one suitcase. </p>
      <p>Suitcase contents don’t have to be style-linked.</p>
      <p>*** </p>
      <p>I have a couple of comments about your family.</p>
      <p>Firstly, if you are offering a choice of figure styles for the Regular, what is the figure style for the Italic and Bold? Why is there no corresponding choice? This is a question that end users would wonder upon seeing the menu contents — they may not have support material such as PDFs or printed specimens available which would let them know, and besides, shouldn’t it be evident from the menu?</p>
      <p>Secondly, your family, which will nonetheless provide a lot of “expert” typographic functionality, is missing the very basic Bold Italic. If this typeface is to be a success in the publishing market (magazines, newspapers), for which it seems suited (thanks to gumshoe PH for the tip), then a bold italic is very important. The reason is that art directors would then have the ability to specify sidebar text as bold face, and keep editors, who wish to italicize occasional words according to their style guide, happy.</p>
