      <p>I’m afraid I can’t help you with the suitcase questions. I always let someone else take care of Mac Type 1 fonts, even when we produced them. Windows Type 1 files were enough of a headache, without trying to make sense of the Mac packaging stuff.</p>
      <p><em>Is there any reason why I shouldn’t asign different “weights” to the different styles even though they are not different weights per se</em></p>
      <p>Apart from the fact that lying is a sin? :)  I can’ think of a reason off-hand, but I would ask Tom Phinney since he’ll have a better idea of exactly what Adobe is doing in its menus and what the issues might be. Also, I can’t remember exactly how weight works in Type 1 fonts: in TT and OT, the weight class is set as a number value in the OS/2 table, which means you can assign weights that do not correspond to style names (very handy for the kind of thing you want to do).</p>
