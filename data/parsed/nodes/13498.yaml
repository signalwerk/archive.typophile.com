    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Walter Tracy</strong></p>
    <p>1914–1995<br>
    English</p>
    <p>Typesetter, typographer, designer, author, and typeface designer. Wrote <a href="/wiki/Letters%20of%20Credit" class="freelinking" rel="nofollow">Letters of Credit</a> in 1986.</p>
    <p>From 1948 through 1978, he worked at <a href="/wiki/Linotype%20and%20Machinery" class="freelinking" rel="nofollow">Linotype and Machinery</a>, the English Linotype company. There, he designed the following typefaces: <a href="/wiki/Jubilee" class="freelinking" rel="nofollow">Jubilee</a>, Adsans, Maximus, Telegraph Modern, Times Europa, and Doric.</p>
    <p>After retiring, he worked on Telegraph Newface Bold, <a href="/wiki/Qadi" class="freelinking" rel="nofollow">Qadi</a>, <a href="/wiki/Kufics" class="freelinking" rel="nofollow">Kufics</a>, Oasis, <a href="/wiki/Sharif" class="freelinking" rel="nofollow">Sharif</a>, <a href="/wiki/Malik" class="freelinking" rel="nofollow">Malik</a>, and Medina (most of these are Arabic typefaces). Tracy became something of an expert on Arabic typeface design.</p>
