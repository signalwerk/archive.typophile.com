  html: |-
    <p>Typophiles of the world: Have you seen this Sans Serif before? Do you know its name?</p>
    <p>Have a look at the lower case "L" and the lower case "A". Does that ring a bell?</p>
    <p>The (poor) scan is from a Phaidon Press book. Published in 1998, the book design was done by Stephen Wolstenholme.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font_1b_6247.jpg"></div><p></p>
    <p>Thanks in advance for giving me information on the font!</p>
