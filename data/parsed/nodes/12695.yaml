    html: <p>A couple of points you are right to want to get rid of the gradient. Just pointing out the production problems in print applications should of convinced your in-house client. My problems with your first attempts at a TM combination is I don't see the M. I think most of your clients aren't designers and won't get it. Try this keep your original idea, and make two more that are more and more obvious TM combination and test the 3 versions with an informal focus group of clients. This way you will get feedback so you aren't working in alone.</p>
