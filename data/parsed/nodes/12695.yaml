    html: <p>It seems a healthy start, but I would try to push it a bit more.If alerted and properly marketed to, your existing customer base will follow right along. You have to ask - would we lose any customers that we currently have if our logo was different versus, would we gain any customers if our logo was better/clearer? Imgine most of your current customer's reaction. We honestly delude ourselves somewhat thinking that our current customers lie awake thinking about our logos. For the vast majority - if it is relatively simple and clear - their thoughts willbe "it is what it is." Those that caputer the new look will more than likely be excited by it. A small few won't like it - regardless. There are just some people who no matter what you change they won't accept it and they tend to like to make phone calls and send emails. I don't think many companies have gone belly up because of a bad logo design if the rest of teh company was working. What you do have to worry about is capturing new market share. That's when the logo becomes your ambassador. Then you have to ask how do new customers and potential customers see us. and Will a new logo help that. Having worked on several rebranding projects and a few renaming ones, I have found that dedication and excitement of the company are key elements to a rebranding's success. If they support it and make a big deal out of it - it will have a great chance of success. I don't think that rebranding is always something you want to try and "sneak" by your customers. Sure we all get the jitters for trying something different, but sometimes it is necessary. I would maybe keep a couple that are close like you are,but try a few that are slightly more radical departures (just keep it within the same vein versus an updated retelling of the same logo). OK I know that wandered a bit,but you get hat I am saying - good start - try something a little further out.</p>
