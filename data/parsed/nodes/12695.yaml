    <p>Hey Everyone,</p>
    <p>I'm currently the only in-house graphic designer at T-Metrics, Inc., a small telecommunications software company. This summer they want me to re-design their entire identity. At first they refused to let me touch the logo, in fear of losing connection with the loyal customer base they've had for the 15 years it has been in use. But I wrote a 4 page document explaining why they should change their logo to better compete in the contemporary market. After all, they are a software company...they shouldn't look dated.</p>
    <p>So now they are open to the idea, but understandably, they don't want their customers to have to re-learn the mark entirely. So I need to keep some elements of the existing logo that are worth working with. It currently has a gradient motion trail or something like that, which I would just love to drop altogether. The interaction between the T and M letters seem to be it's strongest point...to me.</p>
    <p>My first shot at this simplifies the mark, while hopefully keeping the letters recognizable. What I currently have seems to work a bit, but overall I think it looks a little stocky and not quite as elegant as I would like it to be. Some embellishment would probably help. The type in the new logo is Myriad, but that will change as soon as I bring my fonts over from my other computer...I think keeping it thin though will give it a more contemporary look.</p>
    <p>What do you guys like about the old logo? Any direction?</p>
    <p>Thanks for any help...glad to be on Typophile!</p>
