      <p>Not sure if this is still being worked on, but I prefer the '1' version over all of the others. Perhaps making the gap between the two forms thinner will help the 'M' read more quickly. Also, get rid of the Myriad as soon as possible. A geometric, constructivist sans would be more harmonious with the logo than something with the relatively humanist and consistently modulated strokes of Myriad.</p>
      <p>I don't like the slab serifs. They don't feel contemporary or clean enough for a telcom software company. Unless they're going for something heavier, with a construction feel to it.</p>
      <p>Good luck.</p>
