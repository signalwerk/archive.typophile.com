    <p>No Bodoni Typography releases the TinmanPro OpenType font family</p>
    <p>Glenview, Illinois  July 11, 2011</p>
    <p>George E. Thompson, chief designer and dishwasher for No Bodoni Typography has completed the company’s first OpenType font family, TinmanPro.</p>
    <p>TinmanPro is a mildly stressed humanist sans serif type based on the University of California Oldstyle type designed by Frederick Goudy. The design captures the warmth and friendly character of Goudy’s original in a monotone sans. Broad Latin support along with small caps, fraction support and other typographic niceties are included in the ten font family. Weight range includes Regular, Medium, DemiBold, Bold and ExtraBold with matching italics for each.</p>
    <p>Tinman can be seen at <a class="freelinking external" href="http://nobodoni.com/tinman.html" rel="nofollow">http://nobodoni.com/tinman.html</a> and is available through MyFonts.com.</p>
    <p>No Bodoni Typography is also converting its entire font catalog to OpenType format and plans on adding language support for Cyrillic and Greek to Tinman and its other fonts.</p>
    <p>No Bodoni is a small, independent type design company, inspired by Giambattista Bodoni's dedication and drive to create unique types for his time. The company’s goal is to design typefaces that are unique tools for getting information on a page.</p>
