  html: |-
    <p>I started an invitation using Adios Script (Sudtipos), and began looking for a Hebrew script font to match. I then found Egotrip (Fontbit), and through the evolution of the invitation, I'm now looking for a new English script to better match the Hebrew.</p>
    <p>I'd like to mimic the strokes in the Hebrew (some thickness variation, but thin and smooth; handwriting-based; alternates to make the name unique). I hate to say that the overused Zapfino is close, but I won't use it.</p>
    <p><a href="http://new.myfonts.com/fonts/argentina-lian-types/quijote-sauvage/pro"></a> Quijote Sauvage may be close, but I'm not sure.  I looked through a bunch of scripts on MyFonts. As you can see, I only need to set the name.</p>
    <p>Any help would be appreciated.</p>
    <p>Thanks!</p>
    <p>Steve</p>
