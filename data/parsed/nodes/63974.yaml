    html: |-
      <p>I would add that this seems to be a dispute between descriptions based on <em>appearance</em> (hook) and on <em>function</em> (retroflex). If the possibility exists, I’d always prefer a functional description, but I don’t run the place, and there’s a lot of history involved.</p>
      <p>I know we love our computers, but I would strongly advise buying a used copy of <cite><a href="http://www.librarything.com/work/133047" title="LibraryThing entry">Phonetic Symbol Guide</a></cite> by Pullum et al.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
