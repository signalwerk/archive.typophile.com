    html: |-
      <p>They're both used to represent <a class="freelinking external" href="http://en.wikipedia.org/wiki/Retroflex">retroflex</a> consonants in IPA.The old name of <a class="freelinking external" href="http://www.fileformat.info/info/unicode/char/0256/index.htm">ɖ</a> was "LATIN SMALL LETTER D RETROFLEX HOOK". I guess it was changed to "tail" to avoid confusion with <a class="freelinking external" href="http://www.fileformat.info/info/unicode/char/0257/index.htm">ɗ</a>, "LATIN SMALL LETTER D WITH HOOK".</p>
      <p>ETA: too slow :)</p>
    html_clean: |-
