    html: |-
      <p>As far as I can tell, the proper name of the attachment is 'hook'. 'Tail' is a description, just like "i-bar", "h with stroke", "turned h", "small capital R", "turned y", and lots of others, rather than the mouthful "ulveolar front labial trill" they describe. Font creators are not that good in phonetics.</p>
      <p>(On the other hand, I suspect the guys at IPA sometimes just make up characters as they write. "Anyone got dibs on a <em>mirrored</em> small capital upside down R? No? Okay, it's mine!")</p>
