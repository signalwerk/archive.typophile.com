  html: |-
    <p>Many characters in IPA, apparently, have the same terminals, but the terminals have different names.<br>
    For example:</p>
    <p>LATIN SMALL LETTER D WITH TAIL<br>
    LATIN SMALL LETTER N WITH RETROFLEX HOOK<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/hooktail_4915.jpg"></div><p></p>
    <p>My question is: is there any difference in their aspect, proportions or design that should be considered in a new typography design? Or they are really the same with another name?</p>
