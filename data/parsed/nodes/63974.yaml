    html: |-
      <p>You might be interested in <a class="freelinking external" href="http://en.wikipedia.org/wiki/Naming_conventions_of_the_International_Phonetic_Alphabet">this Wikipedia article on IPA naming conventions</a>.  The Unicode Consortium's name for a given character or feature doesn't always agree with the IPA's name.</p>
      <p>The "tail" and "hook" are indeed the same thing (the feature that indicates retroflexion); you will probably need at least two versions, one for letters like ɖ and ɳ where the tail is an extension of a stem or leg, and another for ʂ and ʐ where the tail is an appendage to a horizontal stroke.  If you need more fonts with IPA characters for reference, you could also look at Gentium, Charis SIL, Doulos SIL, and Andika Basic, all available from <a class="freelinking external" href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;cat_id=FontDownloads">SIL</a>.</p>
      <p>Nice to hear you're putting IPA characters in your font!</p>
