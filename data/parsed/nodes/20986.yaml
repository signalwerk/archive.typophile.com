    <p>Hi, </p>
    <p>Is anyone here familiar with the book ABOUT FACE by David Jury? See below<br>
    </p><div class="imageWrap"><img src="/files/2880466776_4481.01.LZZZZZZZ.jpg"></div><p></p>
    <p>I really wanted to find out exactly the main typefaces used throughout this book.<br>
    And also the vendor I could purchase these typefaces from. </p>
    <p>Also I am after an entire family of Helvitica in its purist form, as in closest digital version<br>
    to the original and best family. I have “bit and pieces” of helvetica laying around but nothing<br>
    in its entirety (family etc). </p>
    <p>I hope I made sense here. Any help would be much appreciated.</p>
