    <p>I'm working on a script font with <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> characters and in perusing existing scripts I've noticed that some letters don't use the Cyrillic letterform / glyph shape and instead have a Latin form. Is this just a convention created by type foundries because they couldn't figure out how to make the Cyrillic glyph correctly in a script or is there an underlying reason that I'm not seeing? It doesn't seem that difficult to have a script version of the Cyrillic glyphs. </p>
    <p>The most blatent example is uni0414 which is a stacked form in Cyrillic and in script fonts is frequently a Latin D instead. If the Latin form is acceptable why have a different Cyrillic form then? Anyone know?</p>
    <p>George<br>
    I felt bad because I had no shoes until I met a man who had no Bodoni.</p>
