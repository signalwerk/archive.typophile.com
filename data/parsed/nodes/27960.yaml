      <p>I recommend getting Yuri Gordon's "Book of Letters From Аа to Яя". The text is in Russian only, but the book is richly illustrated. </p>
      <p>I've seen it, and I love it. Its concept is somewhat similar to Karen Cheng's book, but Gordon analyzes each Cyrillic letter one-by-one in different styles, and he also includes samples from various Russian logos and calligraphic creations. This gives you a very fair overview of the extent to which you can experiment with Cyrillic forms while staying within the boundaries of what the Russian reader considers "normal". You can order the book at:<br>
      <a href="http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/" title="http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/">http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/</a></p>
      <p>Adam</p>
