      <p><em> If the Latin form is acceptable why have a different Cyrillic form then? ?</em></p>
      <p>The "upright" de is not a happy cursive form. In that respect, it's similar to the roman double-bowl "g", which is a lot of business to attend to if you're wrting it. So in the script form,  shapes which are easier and faster to write will be preferred to the more elaborate forms of the upright alphabet.</p>
