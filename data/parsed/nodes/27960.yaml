      <p><em>The “upright” de is not a happy cursive form. In that respect, it’s similar to the roman double-bowl “g”, which is a lot of business to attend to if you’re wrting it. So in the script form, shapes which are easier and faster to write will be preferred to the more elaborate forms of the upright alphabet.</em></p>
      <p>Well, I'm sitting here making script letters and other Cyrillic characters which are more difficult to write don't revert to a Latin form so why the de? And I disagree that a script double-bowl 'g' is more work since I sign my name with one (easier than that convoluted thing they taught me in school) and the font I'm working on already has that form for the Roman 'G'.  And if easier is the reason why wouldn't the same apply to the upright? The Latin form is easier to write than the Cyrillic.</p>
      <p><em>Take a look at any of ParaType’s script fonts and you’ll find the same things.</em></p>
      <p>Yes, but why? That's what I want to know. Compare PT Betina Script with PT Birch -- similar non joining scripts -- and Betina uses the Latin 'D' and Birch a Cyrillic. It would seem to make more sense to change to the Latin form for a flowing scirpt, but PT Adventure does several odd things: Teh (U0422) for instance, which is more complicated. Is the choice merely based historical precedence or what? Is there a rule of some sort?</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
