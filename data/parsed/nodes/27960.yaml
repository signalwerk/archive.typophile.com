    html: |-
      <p><em>Betina uses the Latin ‘D’ and Birch a Cyrillic</em></p>
      <p>They are both cyrillic, just as two different script shapes of d are. Betina's designer (Alexander Tarbeev) made the upper "serif" of D longer and tilted the vertical stem slightly to the right so it resembles a traditional cyrillic script D, but can also work as latin D (for which these features are acceptable but not critical). Why use the same shape for both, while it was easier to make two different ones? I guess some people like a challenge. </p>
      <p>Birch's uppercase, strictly speaking, is not a script alphabet - it has no specific script forms. Its D is a "printed" shape made with multiple strokes and no circular motion, while script D is made with one stroke - down/left and counterclockwise.</p>
