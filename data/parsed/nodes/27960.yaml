      <p>Cyrillic script forms have their own history and logic, parallel to latin in some respects, different in others. Some shapes which are easy to write may have close resemblance to latin shapes (sometimes belonging to completely unrelated letters); there are also many distinct historical variations (3-4 per letter).</p>
