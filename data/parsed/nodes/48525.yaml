    <p>What can be done to this to make it a<br>
    typographic logo truly worthy of a<br>
    national type society? </p>
    <p></p><div class="imageWrap"><img src="/files/ATC_logo_5435.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/ATC_logo_sm_5528.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/ATC_logo_xsm_4759.gif"></div><p></p>
    <p>The red-orange color is meant to evoke the “red center” of Australia with <a href="http://en.wikipedia.org/wiki/Uluru">——&gt;the rock Uluru&lt;——</a> being our national icon.</p>
    <p>It’s probably very fortunate that the profile of the rock happens to resemble the profile of the Sydney Opera House as well as the Sydney Harbour Bridge. I also designed a typeface known as <a href="http://www.flickr.com/photos/arboghast/2467911416/in/set-72157604893392854/">The Angel of the Odd (ultrabold version below Jellybrush in this sample)</a> a number of years ago. It has an extreme shape in it which happens to look a lot like the Opera House. Should we consider using the Angel for ATC? Or would that amount to grandstanding and proprietizing the ATC with my own personal typo motif too strongly?</p>
    <p>About this current logo attempt: Should the letter outlines be tighter? Give them a high-tension effect?</p>
    <p>Oh the ink traps on the t! Well, you see, Evert Bloemsma invented that. I love it because look, <em>look at that</em>, look at the tiny 150 x 150 pixel and 100 x 100 pixel small versions. Those traps are only about 12 units wide on 1000 unit per em characters. But they keep working even at tiny reproduction sizes. I love that effect because it proves how powerful the design principles Evert was working on really are. A triumph for Dutch type design.</p>
    <p>What else?</p>
    <p>What else would you do to it? </p>
    <p>Anything else?</p>
    <p>That’s all I could come up with in three hours.</p>
    <p>[Edit: I just removed “ghosts that sell memories” from the thread title. Had to get your attention somehow ;^)]</p>
    <p>j a m e s</p>
