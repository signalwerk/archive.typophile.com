      <p>A minor thing: the ‘ra’ combination in Australian looks unfortunate and could be fixed in a logo.</p>
      <p>The <a href="http://www.typographischegesellschaft.at/tga_logo.html">TGA logo</a> (Typographic Society of Austria) comes to my mind: it has also three lowercase letters. They comment on it as follows:</p>
      <p><cite>t — Thesis (state of the art in the founding year of tga)<br>
      g — Garamond (historic, timeless)<br>
      a — Herbert Bayer (Austria’s only noteworthy contribution to the history of type design)<br>
      The metal type impression is anachronistic detail and reminiscence.<br>
      </cite></p>
      <p>Quite interesting, no?</p>
