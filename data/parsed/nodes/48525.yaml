      <p>Yes folks the kerning of the tagline is very ruff :^) Hee, moo, etcetera. I neglected to explain too that the whole typeface I’m using for this is quite ruff ’n ready. It’s a quickie bold made using a fotnlab’s bold filter. I only put traps on the t to begin with. The type needs refinement.</p>
      <p>Yes, the proportional ratio of the mark to the left margin is a problem. Its bite has been deemed uncertain.</p>
      <p>Darrel—-I’ve experimented with the tagline benath the box and felt it reduced the simplicity. The advantage of doing that way, the tagline ends up larger and the logo will reproduce even smaller. Another thing I experimented with was a tagline going the whole width of the box but still inside it, and letterspaced. Letterspacing the tagline I thought could be a way of evoking the vast opens spaces and distances between population centers characteristic of Oz. Unfortunately the letterspaced versions look like crap at small sizes and I don’t even want to post them.</p>
      <p>Another reference for the cruciform t—-the Southern Cross constellation. That’s handy.</p>
