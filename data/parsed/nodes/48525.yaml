      <p>James, I like it. That in-your-face trapping will be a great conversation-starter, and alludes nicely to the fact that type design is a craft. Minor: you might make the top-left trap a little bit smaller since the original angle is larger than the other three.</p>
      <p>The only thing that jumps at me is that the “a” has a nice wonkiness, but the “t” and especially the “c” are a bit too tame in comparison.</p>
      <p>One other thing: “australian type club” isn’t properly centered under “atc”.</p>
      <p>&gt; Evert Bloemsma invented that.</p>
      <p>Evert was a singularly inventive designer*, but I don’t think we can give him credit for inventing trapping, even in the special case I suspect you mean: showing off trapping.</p>
      <p>* Legato is the most significant font in centuries.</p>
      <p>hhp</p>
