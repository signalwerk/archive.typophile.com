      <p>Florian—-the ra is ruff and I need to tidy that area up.</p>
      <p><em>The t with ink traps – is that the Crux australis? ;-) Like it.</em></p>
      <p>I actually call that a “cruciform” joint. If you examine the 100 x 100 bitmap at 3x zoom —- amazing how those things translate to aliased pixels at tiny size.</p>
      <p>The tga logo I hadn’t seen before. Thanks for that. Um, the forms I built for this were Thesis-influenced, yes. De Goot is kind-of unavoidable, so influential on so many of us.</p>
      <p>Garamond, yes, there is an element Garamond-like bending in the hood of the a and the cursiveness in the t and c.</p>
      <p>Bayer I’m not greatly influenced by, altho I do love what I was able to do to Bayer Universal / Bauhaus and get away with it : ^ ) Benguiat is probably more influential on the sentinel design canon. I’ve used the principle of the quarter round in a few faces now. The original was Midnight Kernboy. The thesis / signature version is known as the Angel, and Amity is the commercial version, a “soft” angel.</p>
      <p>There are cross-cultural design connections everywhere and I gues a lot of those things are put there specially for us to find.</p>
