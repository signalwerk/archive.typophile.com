      <p>Hrant —- I suppose I should call them “white spots”. They’re ink traps yes, and Evert can no more be credited with having invented such things than anyone else. But he was inventive in the way he deployed them on things like lower t’s and other kinds of cruciform joints by using exaggerated or high-concept traps to replicate the functions of serifs but in reverse, functioning as whitespots.</p>
      <p>I’ll send you a sample of the kind of thing I’ve been working on for Linda Cunningham. Itemulates the gaps in the bowls of Vincent Connare’s Magpie with exaggerated taper on bowl joints.</p>
      <p>Legzto, yes, I think you are accurate in characterizing it as Legato is the single-most significant font in centuries. </p>
      <p>j a m e s</p>
