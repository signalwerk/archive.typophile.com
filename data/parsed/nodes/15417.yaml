  html: |-
    <p>Does this term exist?</p>
    <p>Is there an official term that summarizes erratic, wrong, dirty, broken, eroded,<br>
    grungy type?</p>
    <p>I ve been researching quite a bit on that for my diploma but I havent<br>
    found one clear description for it.</p>
    <p>Something that summarizes the phenomenon of **** type up,<br>
    whether itd be in fine art, gebrauchsgrafik or typedesign.</p>
    <p>so what do you think?</p>
