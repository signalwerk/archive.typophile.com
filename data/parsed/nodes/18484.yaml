      <p>Typographically, the face choice is nice. But to make it really awesome use a more humanistic means. Is one shy than the other? Taller? Use this kind of expression in your calligraphy. They both dont have to be the same.<br>
      Not a fan of the rest of the txt. Needs a lot of composition works. Your hierarchy is off. You need to work with scale more but keep it subtle because its still a formal subject. I would lose the ALL CAPS. To  me thats very annoying for a body copy. Change your page format too from the standard 8.5x11-ish look. Experiment a bit more with the way a page opens and information is read. Do you have to repeat "AA" again at the top?<br>
      And I dont think the vectorized flower is doing anything for me, scale wise (very robotic looking flower). Scale that down and try hand-drawing it in as supposed to a digital medium. Colors are nice.</p>
