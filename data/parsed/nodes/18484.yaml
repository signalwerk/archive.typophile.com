    html: |-
      <p>Resist the urge to add a lot of extra leading to your blocks of copy. Although this may seem "designy" it actually erodes legibility by introducing, what I call, "rivers" of white space between the lines of copy. This visually breaks your blocks of copy into stripes, a highly graphic approach that seems out of place in an invitation. Remember this is an invitation, and I assume you would want the type to be inviting. The effect becomes worse when you set body copy in ALL CAPS because due to its visual regularity. </p>
      <p>I might try tightening up the leading a bit overall and remove the All Caps from your body copy. </p>
      <p>Otherwise, I like your color choices. Should be very nice letterpressed.</p>
      <p>MB</p>
