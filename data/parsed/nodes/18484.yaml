      <p>Ok Typophiles, I completely agree with your critique and thanks Prakash for being so honest, I like that. I think I ‘m frightened when beginning to design for myself and don’t even see what’s wrong on it, plus I was pushing the flower thing too far.<br>
      So on my next attempt I realize it was too hard to match my own calligraphy with another typeface. On the type exploration I picked from top to bottom “FF Clifford” (same as previous comp, “Origami MT” and “Vendeta”. The last two have a bit more humanistic side but still don’t think quite did it for me. I really don’t want this to look too classic so I went back to the typefaces I had before; Mrs Eaves, Filosofia, Sloop and Brickham.<br>
      I gave it a lot more negative space and since I have to use both of our parents full names (yes two last names) and even the priest name, I decided to go horizontal. All this names and addresses made this  so text heavy as opposed to some invites I’ve seen in the States but I think the horizontal helped.<br>
      Another thing is a loosed the bold flower and just kept the more simple one, it seems to distract less but still maintains the little meaning I found on it.<br>
      Hope you guys are having as much fun as I am, and I will surely post pictures of the final printed piece for all of those who helped.<br>
      Let’s keep this critique going!</p>
      <p>Thanks all</p>
