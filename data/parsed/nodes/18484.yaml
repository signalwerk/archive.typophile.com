      <p>The more formal script of version C seems to work better with the informal illustrations, the justified copy needs some work on it the first line is very loose, you could bring the date back up by reducing the point size or increase the measure, leaving the month on line 2*, this might bring the whole church name back on to line 2, This will leave line 3 really loose so you could make that left aligned and leave line 4 a separate line. There is no fullstop on line 4 and there is colon before the names which doesn't seem required. I might look at raising the y in the names a touch. Finally I would check the lightness of the blue in print, chocolate and blue make a good pallette though. I hope I have read the Spanish correctly.<br>
      Tim<br>
      * alternatively you could look at pulling the whole date to the left of the lefthand margin.</p>
