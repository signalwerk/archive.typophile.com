    <p>Anybody know the typefaces used on this gas pump globe? This closest I could come for the Magic Benzol line was Lydian. I'm guessing that Refrigerator by Mark Simonson would be the closest thing for THONI OIL CO. and JET POWER. I have no idea about the 90.</p>
    <p>Anybody care to lend a helping hand?</p>
    <p>Thanks.</p><div class="imageWrap"><img src="http://typophile.com/files/thoni902_4341.jpg"></div><p></p>
