    html: |-
      <p>This sort of thing was always hand-lettered, not set in type, or based on specific typefaces. By hand-lettered, I don't mean each globe was painted by hand. It would have been silkscreened (or something similar), but based on hand-drawn original art. </p>
      <p>Refrigerator was inspired by things like this. I did it precisely because no existing typefaces looked quite like hand-drawn styles like this.</p>
      <p>The small line does look like Lydian and is small enough that it probably was set from type on the original art.</p>
