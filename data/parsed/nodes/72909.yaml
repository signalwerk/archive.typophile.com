    <p>Can anyone suggest what might the longest lettergroups — sequences of connected letters -- in Arabic? I'm looking for test cases and to determine maximum context length for some OpenType lookups.</p>
    <p>If anyone has similar information for Persian and Urdu, what would also be appreciated.</p>
