    html: |-
      <p>The kind folk on the Persian Computing mailing list came up with some great examples in use in a variety of languages:</p>
      <p>Arabic:<br>
      ليستخلفنهم ‎(Perhaps the longest such sequence in the Koran. From 24:55.)<br>
      الفلسطينيين (The Palestinians)<br>
      القسطنطينية  (Constantinople)</p>
      <p>Persian (Farsi):<br>
      منمشتعلعشقعلیمچهکنم (a famous conjoined version of the phrase من مشتعل عشق علیم چه کنم which nastaliq calligraphers write in this way to display their virtuosity)<br>
      مستضعفینی<br>
      فیلیپینیها (Filipinos)</p>
      <p>Urdu:<br>
      اسپیسیفیکیشنز (specifications)<br>
      کمپیٹیبیلیٹی (compatibility)</p>
      <p>Uighur:<br>
      بىسىمئىشلىتىشىدە<br>
      يىغىننىڭيېپىلىش</p>
      <p>Azeri:<br>
      آلتمیشینجیسی (sixtieth)</p>
