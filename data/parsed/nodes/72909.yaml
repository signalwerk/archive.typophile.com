      <p>Azeri/Ottoman with one more syllable آلتمیشینجیسینی / آلتمیشینجیسیكی altmışıncısını (his/her/its sixtieth - definite accusative).</p>
      <p>In case you need a Latin equvalent, here's the longest Turkish phrase ever attested:</p>
      <p>Avrupalılaştırılmıyanlardanmısınız? "Are you one of those people who oppose the adoption of European manners?"</p>
