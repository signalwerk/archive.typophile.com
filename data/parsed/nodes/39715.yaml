    <p>As I've been researching the project of designing<br><a href="http://www.typophile.com/node/39537">my father's gravestone,</a> I've become fascinated with the gravestones of designers, typographers, stone carvers/lettering artists etc. Many are beyond gorgeous, all are of extraordinary quality.</p>
    <p>I've found William Morris's tombstone, but I've been unable to find Josef Hoffman. I suspect I'm googling in the wrong language to find it? If anybody has a picture of Josef Hoffman's gravestone, or any other legendary designers, I'd love to see them. </p>
    <p><img src="/sites/default/files/old-images/a_morris_william2_gb_5809.jpg"></p>
    <p><img src="/sites/default/files/old-images/WilliamMorrisTombstone_6241.jpg"></p>
