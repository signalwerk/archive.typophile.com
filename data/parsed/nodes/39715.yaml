      <p>I worked as an in-house designer for a large group of funeral homes here in Toronto. I've always been interested in the craftsmanship that goes into some headstones (mostly older). </p>
      <p>Paul Rand's tombstone is pretty stunning. Not only is it not your standard tombstone shape, but it uses two different types of stone.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CLRykq3wuc1ho8cs4G0WiQnX_500_6531.jpg"></div><p></p>
