      <p>One typographic notable had his headstone already cut except for the last date, long before he died. It stood ready in the barn at his New Hampshire home.</p>
      <p>Not many folks any longer recall Professor Ray Nash. He was a long-time teacher of art (maybe art history, actually) at Dartmouth College, and he wrote often about handwriting, calligraphy, &amp; printing. He ran a teaching press at Dartmouth where he taught such folks as printer Rocky Stinehour and letterer extraordinaire Stephen Harvard. I spent the summer of 1975 (?) at his farm, with about 6 other young printing and type enthusiasts, working on iron hand presses in that barn.</p>
      <p>&amp; there in the corner stood the black stone, rounded top and all. I believe Stephen Harvard had cut the letters. I assume he finished the job when Ray died in 1982. Maybe I'll go find his last resting place when I'm in New England in June and see if I can get a photo. &amp; post it here.</p>
      <p>powers</p>
