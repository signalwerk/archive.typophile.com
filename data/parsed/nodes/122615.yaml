      <div class="comment-spam-body"><p>The years around 1900 were marked by the the popularity of display fonts that imitated hand lettering. These would have been copied by sign painters.<br>
      Perhaps one of the most successful was the style that became familiar with _The Saturday Evening Post_ name plate. This was produced as Post Old Style. This was a "rugged" font -- a style that today we see as distressed or grunge. Smoothed digital versions are available. Consider Saturday Morning Toast NF <a href="http://www.myfonts.com/fonts/nicksfonts/saturday-morning-toast/" title="http://www.myfonts.com/fonts/nicksfonts/saturday-morning-toast/">http://www.myfonts.com/fonts/nicksfonts/saturday-morning-toast/</a> and Lamp Post <a href="http://www.myfonts.com/fonts/jnlevine/lamp-post/" title="http://www.myfonts.com/fonts/jnlevine/lamp-post/">http://www.myfonts.com/fonts/jnlevine/lamp-post/</a><br>
      Don</p>
      </div>
