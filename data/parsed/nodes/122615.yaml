      <div class="comment-spam-body"><p>I agree that De Vinne was the height of fashion for display type circa 1900. There was a full range of  variations from condensed to expanded.<br>
      I believe sign painters modeled some of their lettered signs on De Vinne. For a digital version <a href="http://www.myfonts.com/fonts/woodentypefonts/de-vinne/" title="http://www.myfonts.com/fonts/woodentypefonts/de-vinne/">http://www.myfonts.com/fonts/woodentypefonts/de-vinne/</a><br>
      Note that for many years the name De Vinne has been appropriated for a font that bears no resemblance to the circa 1900 De Vinne.<br>
      The 1900 era De Vinne is very similar to Hawthorn <a href="http://www.myfonts.com/fonts/linotype/hawthorn-lt/" title="http://www.myfonts.com/fonts/linotype/hawthorn-lt/">http://www.myfonts.com/fonts/linotype/hawthorn-lt/</a><br>
      Don</p>
      </div>
