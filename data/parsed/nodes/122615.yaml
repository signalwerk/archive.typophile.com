      <p>I take it that the cliche you want to avoid  when you say "western" is (what used to be called) French Clarendon, the usual style identified with the Gay '90s - think Wendy's.</p>
      <p>But avoiding cliches and seeking true authenticity may go over the heads of a typographically unsophisticated public.</p>
      <p>However, something authentic probably will be recognized as old because people will remember stuff from old movies, old books, and so on - thus one really shouldn't be afraid of doing it right.</p>
      <p>Also, the other important thing to consider is that the restaurant is intended to suggest a very high-class and expensive restaurant of that time period, not just an ordinary restaurant. That eliminates some of the styles of lettering used in that period - limiting one to more tasteful ones, less likely to be as obviously dated.</p>
