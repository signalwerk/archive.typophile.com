      <div class="comment-spam-body"><p>I would check with the New York Public Library. They have a photo collection of NYC for that period. Any signage most likely was sign-painter's styles although many would be based on some metal designs.</p>
      <p>[EDIT]<br>
      Curious about John D., I looked up his history and found an interesting fact about him:<br>
      "John D. Rockefeller abstained from alcohol and tobacco all his life. He saved most of his income and spent it on philanthropy. For this, he thanked his mother who taught him that “willful waste makes woeful want”."</p>
      <p>So that restaurant might want to replace John D. with another as their inspiration.</p>
      </div>
