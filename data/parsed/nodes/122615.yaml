    <p>So, I have a ton of vintage type specimen books and wood type references, but I'm looking for some particular knowledge/advice. I'm working on the brand for a restaurant that is described as "John D. Rockefeller and Theodore Roosevelt enjoying a whiskey together."<br>
    Obviously, there is a ton of reference to Victorian and Art Nouveau which would come right before and Bauhaus / De stijl which would come right after, but I'm trying to pinpoint if there is a typographic "style" that would have appeared in New York City in the year 1900. I'm trying to avoid "western" (wood type) and european (overly ornamental)...</p>
    <p>any thoughts and resources/examples would be very much appreciated! Thank you!</p>
  html_clean: |-
