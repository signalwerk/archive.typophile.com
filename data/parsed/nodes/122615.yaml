      <p>Thanks everybody for the thoughts! As I've continued to do research myself I've found some examples the exude that exude the feeling I'm looking for... what it is is Old fashioned, American sophistication... not overly ornate victorian wood type or wavy curvy art Art Nouveau. Good examples I have found are turn of the century stamps. I think the most common font (that I find to be extremely overused) that exemplifies this time period is Copperplate Gothic. Another font that I've actually used quite a bit is Columbia Titling...<a class="freelinking external" href="http://www.myfonts.com/fonts/typetanic-fonts/columbia-titling/" rel="nofollow">http://www.myfonts.com/fonts/typetanic-fonts/columbia-titling/</a></p>
      <p>Anyway, any other thoughts or examples?... I would love a resource with ephemera featuring a cleaning more sophisticated style.</p>
