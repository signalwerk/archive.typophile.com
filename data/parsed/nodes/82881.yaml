    <p>hey everyone,<br>
    I am always uncertain about the correct offset and weight of an underline, I realise that every case is unique depending on font, size, weight etc but i was wondering if there are any general rules of thumb or if it comes down to purely personal aesthetic choice?<br>
    thanks!<br>
    Neill</p>
