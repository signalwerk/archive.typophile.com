    <p>Hi I'm researching the crossover between architecture and typography and one of the areas I'm keen to learn more about, that's currently unclear to me, is Humane Modernism… does anyone know what this means in typographic terms? </p>
    <p>Also, does anyone know if certain serif typefaces were used by practitioners of "the international style"? I'm guessing it was all sans serif, but some sans typefaces have humanist qualities that could make them good for long text settings, when it comes to typesetting my report?</p>
