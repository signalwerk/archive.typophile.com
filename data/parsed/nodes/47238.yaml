      <p>It's not kerning, it's rounding. Although Tahoma is designed with a pixel grid in mind, there is no way all spacing can be taken into account for all pixel sizes.</p>
      <p>Although I must add that your screen shot is especially bad looking ... On my machine, even a size of 7 points displays nicer text. Mind, that's an 1280x1024 TTF screen with ClearType on. It sure helps with the small sizes.</p>
      <p>See these fountains -- 7, 8, 9, 10, 11 pts. Note the difference in <em>length</em> between 9 and 10 points -- also due to rounding, but this time it appears to preserve character form instead of character width (courtesy of Microsoft, I guess).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tahoma_3912.PNG"></div><p></p>
      <p>Any special reason your measurements are in pixels, rather than points? What program did you use?</p>
      <p>[Edit:] Oh, CS3. Well, it's still a lousy display. Do you have the highest possible setting for text in your preferences? (I.e., anything better than "lowest"?)</p>
