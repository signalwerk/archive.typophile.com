    html: |-
      <p>On a slightly different note, "CS3" is not a program. Is this Illustrator, Photoshop (as Si and Jason assume), InDesign (as I was thinking)?</p>
      <p>I <em>do</em> get this ugly small text in InDesign (CS1), <strong>if and only if</strong> I set the text real small -- 7 pts, on a medium sized page -- A5, zoomed out to show the entire page, and <em>then only</em> if I force InDesign's display performance to really really low: "Optimized", which turns off anti-aliasing on the screen.</p>
      <p>That "screen anti-aliasing" is another important point. If this is text from Illustrator or InDesign, you don't have to worry about the screen quality. If you print it, it will look great. (Oh, okay, only if your printer has a reasonable quality as well!) If you zoom in onto it, it will not look great (because you will still see aliasing), but at least the characters will separate. And if you set the view quality to better than the worst possible, it'll look much better, even in small sizes.</p>
      <p>If this is text in Photoshop, you have a totally different set of problems. If this is meant to be printed at, say, a reasonably 200 dpi (and "print quality" images should at least be 300 dpi), your tiny 9 pixel text will be about 0.045 inch tall, or in the metric system, about 1 millimeter.<br>
      If it's intended for the screen (as in: a web page), try selecting one of the other rendering modes for text. Photoshop allows a number of quality settings, and again you seem to have chosen the worst one possible.</p>
      <p>(What Jason is suggesting is also possible: Photoshop needs a few more colours to be able to draw the text antialiased.)</p>
