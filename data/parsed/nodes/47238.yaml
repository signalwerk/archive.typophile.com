    html: |-
      <p>Well, the OP mentions "it was fixed for a while, but now its doing it again", which suggests <em>something else</em> than mere local software settings.</p>
      <p>The difference between Single Line and Multi-Line Composer is that the former fills a line of text, adjusts for space settings, looks for possible hyphenation to the previous line(s) (to count the number of successive hyphens), then moves on to the next.<br>
      The Multi-Line Composer does the same, but also takes into account the <em>average space width</em> in each separate line. It then averages the space widths over the entire paragraph, rather than taking them for granted. To appreciate the difference, compare InDesign's formatting to that of WordPerfect, PageMaker, Quark, and Word. ID's text spacing is by far more consistent.</p>
      <p>"Non-integer or integer" could apply to the internal calculations of character and space widths, but I'd expect (and certainly hope!) calculations are done with as high as possible precision. Referring back to Word: it appears to me it bases its spacing and character positioning on the resolution of the printer, which means documents will re-flow if you change to another (and hey, so it does). InDesign does not have that flaw.</p>
      <p>Be it kerning, rounding, or integer-based maths, the OP has had this problem on and off for presumably the same InDesign/Photoshop settings, the same OS, and the same font file.</p>
