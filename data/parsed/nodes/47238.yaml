      <p>" Although Tahoma is designed with a pixel grid in mind, there is no way all spacing can be taken into account for all pixel sizes."</p>
      <p>Actually, it was, at least for these sizes. But that was done for the Win rasterizer. IN CS3, unless I'm mistaken you're using the Adobe rasterizer, and I'm not sure what it's doing to get quality, whether it's doing some sort of oversampling as the Mac rasterizer, or something else all together. </p>
      <p>As Theunis noted, it's not a kerning issue. This would be a really small size to show large kerning values. However it's also not a simple rounding issue either. In the 11pix sample it looks like that, but note that in the 13 pix sample, you're not only seeing strokes crash, but overlap. see the word "in", where the "i" and left stroke of the "n" actually overlap. Normal rounding issues wouldn't explain that. This is some miscalculation of the advance widths, is my guess.</p>
      <p>Hmm, although aside form describing the issue, I can't help more, as I don't have a Mac with CS right now. Perhaps the other Adobe experts will fill in the gaps? </p>
      <p>Jason c</p>
