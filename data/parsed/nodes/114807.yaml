      <p>Real perseverance Mike!<br>
      My interest in the Walden WWII poster font collection arose from Ryuk's posting of a link to Nelda WF. I still find it a puzzle. Very similar to Balloon but with differences and it has a lowercase. I was able to assemble a character set:<br><img src="/sites/default/files/old-images/NeldaWF_3772.jpg"><br>
      Compiled from a series of images at <a href="http://www.whatfontis.com/WALDENFONT_NeldaWF.font">http://www.whatfontis.com/WALDENFONT_NeldaWF.font</a><br>
      Perhaps an Alf Becker or Speedball alphabet?<br>
      Don</p>
