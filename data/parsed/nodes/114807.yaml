      <p>Bleeker is obviously <a href="http://old.myfonts.com/search?search%5Btext%5D=agency&amp;PREFS_SET%5Bipp%5D=96" target="_blank">Agency</a>. Morris Fuller Benton (barely beats out Goudy as my all-time favorite typeface designer). ATF, 1932.</p>
      <p>Odd (I'll refrain from saying suspicious) that several typefaces in this collection are also offered in Jason Castle's fairly small catalog ...</p>
      <p>Hackett is Cubist Bold By John Zimmerman for BBS, 1929. I only know this because it's in the ReadMe file for Nick Curtis's <a href="http://moorstation.org/typoasis/designers/curtis/pages/b.htm" target="_blank">Bric-A-Braque</a>. It was shown (and used on the cover) of <a href="http://www.amazon.com/Deco-Type-Stylish-Alphabets-Design/dp/0811811352/ref=sr_1_1?s=books&amp;ie=UTF8&amp;qid=1394265184&amp;sr=1-1&amp;keywords=Deco+Type%3A+Stylish+Alphabets" target="_blank">Deco Type: Stylish Alphabets from the '20s and '30s (Art Deco Design)</a> (I just ordered a copy).</p>
