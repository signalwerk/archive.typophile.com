      <p>Hardwick is condensed <a href="http://old.myfonts.com/fonts/bitstream/bank-gothic/familytree.html" target="_blank">Bank Gothic</a> (Morris Fuller Benton, ATF, 1930).</p>
      <p>Huntley is Gothic Wood Black by the incredible George Nesbitt, 1838 (used in WW2??). The Solotype Catalog shows a sample of this a Chikamauga. Dennis Ortiz-Lopez (Rolling Stone Magazine type master) digitized this as <a href="http://old.myfonts.com/fonts/ortizlopez/ol-smokler/" target="_blank">OL Smokler Bold</a>. See also Jeff Levine's <a href="http://old.myfonts.com/fonts/jnlevine/public-notice/" target="_blank">Public Notice JNL</a>.</p>
