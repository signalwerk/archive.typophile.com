    html: <p>Now that I have the time, I'll back up and give attribution to the fonts in my first post. Ashley Crawford was designed by Ashley Havinden, 1930. Cartoon by Howard Trafton, 1936 (available legitimately - but only bundled with software - as Corel's Cancun. Lots of knockoffs exist). Nubian by Howard Sniffin, ATF, 1928.</p>
