      <p>Lacar Script is Howard Trafton's Quick, 1933 for Bauer. Rallph Unger digitized it as <a href="http://old.myfonts.com/fonts/rmu/parfum/" target="_blank">Parfum</a>.</p>
      <p>Maximo - bear with me-  is very similar to Nick Curtis's digitization of (again from a Nick Curtis ReadMe file) a typeface shown in a Dover clipart book called Art Deco Initials. Apparently , the editor presented an extrapolation of several incomplete typefaces of the era to show a complete alphabet. Nick's version of that can be had as <a href="http://moorstation.org/typoasis/designers/curtis/pages/b.htm" target="_blank">Big Apple</a>. Walden's version is slightly different, so perhaps the resource was different ... ? I dunno.</p>
      <p>Nuisance appears to be a version of a face that David Rakowski did an early digitization of as Hartin 2. Prior versions included Hartin and <a href="http://moorstation.org/typoasis/designers/rakowski/dr3/davy_f3.htm" target="_blank">Harting</a>. The Solotype Catalogue (prre-digital) gives a showing as Ribbonfaced Typewriter. No idea what the original was.</p>
