    <p>In <a href="http://typophile.com/node/114793">http://typophile.com/node/114793</a> Ryuk posted a link to "American Poster Fonts of World War II" by Walden Fonts. <a href="http://www.waldenfont.com/product.asp?productid=16">http://www.waldenfont.com/product.asp?productid=16</a><br>
    Now this is a real challenge to font detectives. The Walden images show fonts that are hauntingly familiar but Walden gives them names that completely different from the real ones. For example Dragoo WF matches Metropolis Shaded by W. Schwerdtner for Stempel [1932]. See the digital version by Castle Type <a href="http://www.myfonts.com/fonts/castletype/metropolis-ct/">http://www.myfonts.com/fonts/castletype/metropolis-ct/</a><br>
    So is there a font detective who can identify some of the mystery fonts?<br>
    Don</p>
