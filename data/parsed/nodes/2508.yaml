    html: <p>jh, <br><br>I’ve already tried to contact the good folks at Revelare, in an eﬀort to purchase the metaphor in question. Several times. They haven’t replied. <br><br>I makes me think that they’re only interested in enterprise clients, but that’s only my take on their unresponsiveness. <br><br>Those sites that you’ve linked to are beautiful. I wouldn’t say that they use the metaphor in question though. You say they use a similar metaphor. That’s a true statement. To say they use this metaphor with similar and therefore original designs is not a true statement. <br><br>They give up too much of the overall beauty of Revelare’s metaphor. They’re simply linear zooms. No grid. They give no idea as to how much content is on the site at a glance, nor where that info is in relation the everything else. They do not operate on a grid, and do not give the overall impression of diﬀerent sized pixels, which is the whole pixel font reinforcement thing. <br><br>I like the idea of matte colors because they assist in the overall navigation feedback. This could be where I’m stumbling big-time. I’ve always taken the simplistic color treatment to be an integral part of Revelare’s navigation metaphor. This due to the section ques they oﬀer. <br><br>I could achieve the same thing I suppose by sticking more titles up there in each square, or putting icons in there, but that wouldn’t be 1/10 as intuitive. <br><br>That’s my whole take on the Revelare metaphor. Intuitiveness. <br><br>As for the size of the squares, not to worry. I’ll be changing many things over time, as I can generate revenues to continue development on the site. <br><br>As it stands now, I’m pretty locked in to what’s been developed thus far. Sure, I could change the squares to rectangles, I change the color of the font to black, and I could use a pixel font that is too wide to ﬁt in the size of each square given the possibility that future titles will be longer than others, but all of that strikes me as a pretty weak stab at making it all unique. <br><br>I didn’t change the color of the type because white looks the best. I didn’t change the size of the squares because I don’t have enough content yet to build the site on a smaller grid. As for the font treatment, it’s my own pixel font. <br><br>Also, when you posted your graphic of Revelare, why didn’t you take a shot  of their entire site, showing how they present their content? As methodical you have been in presenting your proof that I’m a rip oﬀ artist, you have misrepresented your evidence. <br><br>So far, at least under the name jh, you’ve posted ﬁve times. All ﬁve have been to me, and none of those posts have been to oﬀer critisism to my type, or anyone else’s. I welcome your critical eye, but so far, despite the fact that you’ve seen at least ﬁve original fonts of mine ( between the <span class="caps">TYC</span> site and the fonts on this board ), you’ve only seen ﬁt to call me bad because you’ve seen a link to a font that’s similar to one of mine. <br><br>How about some of that critical eye going to the font I have up for&nbsp;review?</p>
