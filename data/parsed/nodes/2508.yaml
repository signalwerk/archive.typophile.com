    html: '<p>Tanya, yeah, the top of the B is cut oﬀ. It’s a stylistic thing born of the need to make the letterform as recognizable as possible while maintaining the 4 pixel height. I’ll deﬁnately look further into your suggestion for the q. <br><br>Christian, thank you for your reply. Having a litte more text to read this time around gives me a much better idea of your overall message. <br><br>I realize that there are going to be many who disagree with me on many issues. All I can say is that the fonts I’ve used on <span class="caps">TYC</span> come from months of hard work and experimentation, as is evident from the body of work there, from the photography to the journalism. I have a love of storytelling, and the typefaces are just one element in that. <br><br>As my argument regarding Revelare, which part is bogus? Revelare <span class="caps">IS</span> selling its zooming metaphore as a navigation/content delivery solution. It’s not bogus, it’s real. It’s also a valid interpretation of that to say that they recognize the beauty of that system as a navigation system rather than a singular instance of a page/site design. <br><br>It may not be the only interpretation, granted, but it surely is not a bogus one. <br><br>As for navigation systems being proprietary, can you tell me a few that are? I’ve never seen one. The Apple/Windows thing being one easy example. <br><br>As for the overall reaction of plagarism: oh well. As I said before, I’ve delayed the release of my fonts to some amount of peril ( as illustrated by your questioning my font Ram ) for the sake of going forward with a superior navigation system that not only has never been used as a commerce store, but doubles a pixel metaphor, while also zooming further and further into the world of the small, reinforcing the theme of pixel fonts. <br><br>I made my choice a year ago to put the site experience ﬁrst and my “I wanna be a star designer/creative” second. That meant going with a system that reinforced the pixel font motif and was easy to use. <br><br>The pixel fonts I’m trying to market are the creatives, here. The site design is solely intended to show them in their best possible light. I believe this design does that. I’ve used the best possible design elements to present my product. <br><br>I think those principles apply to every commercial designer. <br><br>Even though this board isn’t about my site design, I’ll post a few graphics displaying <span class="caps">MT</span> as it is now. It’s as unique as I could make it considering my budget constraints and time constraints. <br><br>The site recolors itself randomly ( from a predetermined list of color sets ) every visit, which explains the diﬀerent graphics. <br><br><img src="http://www.typophile.com/forums/messages/29/23158.gif" alt=""><br><br><img src="http://www.typophile.com/forums/messages/29/23159.gif" alt=""></p>'
