  html: <p>Some experimentation I’ve been doing with aliased pixel fonts. The majority of my energy has been going into the launch of Mean Tangerine ( very soon, I hope ), so the gradients of gray can be improved I’m sure. I’ve only been tinkering with the technique. <br><br>My main question is how the grays look in relation to the black. Due to the bold quality of the font, I’m not sure that the grays really work as elegantly as a font one pixel wide. <br><br>Any thoughts would be welcomed. <br><br><img src="http://www.typophile.com/forums/messages/29/22858.gif" alt=""></p>
  html_clean: <p>Some experimentation I’ve been doing with aliased pixel fonts. The majority of my energy has been going into the launch of Mean Tangerine ( very soon, I hope ), so the gradients of gray can be improved I’m sure. I’ve only been tinkering with the technique. <br><br>My main question is how the grays look in relation to the black. Due to the bold quality of the font, I’m not sure that the grays really work as elegantly as a font one pixel wide. <br><br>Any thoughts would be welcomed. <br><br><img src="http://www.typophile.com/forums/messages/29/22858.gif" alt=""></p>
