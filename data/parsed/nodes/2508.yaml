ture ) is completely diﬀerent, and my presentation of content is also diﬀerent. <br><br>Take a closer look at Revelare. You’ll see they sell their whole site as a site navigation solution. I mention this because it is highly indicative of what the revelare site really is, as recognized by its creators. <br><br>A superiour navigation system. Is it graphical? Yes. Is it beautiful to look at? I think so. They are actually marketing it the same way Flash Loaded is marketing their Ultimate Scroller. A method of presenting and navigating large amounts of information. <br><br>I’m curious to know what you think of all these sites ripping each other oﬀ with menu bars, animated masks, and scrolling lists? <br><br>Perhaps next time you could comment on the font I’ve posted, thereby fulﬁlling the purpose of this particular message&nbsp;board?</p>
