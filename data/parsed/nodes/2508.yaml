    html: <p>Christian, take a stroll through these forums and you’ll ﬁnd both pixel fonts and outline fonts that are alarmingly simimilar in some or even all of their characters. I won’t even bother to include links to these unless you persist in your assertion that every font reviewed on this site is original in every way. <br><br>Ironically, I say this in regards to the Revelare site, as I didn’t even know about the message boards here until some time after my font Ram ( which is the one I assume you’re referring to ) was built. <br><br>Many of my fonts are as much as two years old, which is when I began building them for my now defunct web magazine Champfactory. Mean Tangerine was supposed to launch almost exactly one year ago. <br><br>It was then that I changed the site design from the ﬁrst one I’d built ( have you looked at that one? ) to the one you don’t approve of now, and it has taken way, way too long to build, and cost too much to change now. <br><br>What you’re failing to take into account is that many of the same letterforms can be reached by any number of pixel font designers entirely independantly simply by the limitations of the traditional pixel grid size. <br><br>When I did see that post, I was bummed that someone else had produced a similar font. However, many of my characters are entirely diﬀerent, and are smoother as a set. Am I going to delete my work because someone else has created something similar? <br><br>Of course not. Take a look around before you make despairing accusations. <br><br>As for the Revelare site, I have in fact used their zooming metaphor. As i’ve described in a previous post, that metaphor is so elegantly simple and eﬀective, I can’t think of a way to change it without breaking it. <br><br>The navigation metaphor is all I’ve used. It just so happens that squares look like squares no matter what kind of background you put them against. At any rate, my button assisted navigation is unique, my layout ( entire site structure ) is completely diﬀerent, and my presentation of content is also diﬀerent. <br><br>Take a closer look at Revelare. You’ll see they sell their whole site as a site navigation solution. I mention this because it is highly indicative of what the revelare site really is, as recognized by its creators. <br><br>A superiour navigation system. Is it graphical? Yes. Is it beautiful to look at? I think so. They are actually marketing it the same way Flash Loaded is marketing their Ultimate Scroller. A method of presenting and navigating large amounts of information. <br><br>I’m curious to know what you think of all these sites ripping each other oﬀ with menu bars, animated masks, and scrolling lists? <br><br>Perhaps next time you could comment on the font I’ve posted, thereby fulﬁlling the purpose of this particular message&nbsp;board?</p>
