    html: <p>Chris, thanks for your input. I’m not releasing any deluxe versions initially. I’m having  problems with them rendering in the published Flash environment. They work great in the authoring environment, but not where it counts. <br><br>My main objective is ﬁnishing the store application. You bring up a good idea about a depth gage. <span class="caps">MT</span> actually already employs a bit of this idea, and is one of the departures from Revelare’s. <br><br>As you drill down, the site lessens in opacity until at great depths, the color approaches white. This is a subtle but eﬀective psychological indication of depth. In fact, looking at the graphics, you’ll notice that the squares with the greatest color saturation are the font specimen squares. This is where the greatest depths are reached. You see the relationship there. <br><br>As for implementing better thought-out features and overall posishing of the site, I deﬁnately have plans on the board to do just that. But for now, budgets demand I release the site with the assets I have right now. <br><br>Can I email you personally to discuss your “grey” pixel font technology? <br><br>Tanya, your observations are spot on in my opinion. However, to my chagrin, I’ve tried that letter b in about 37 diﬀerent encarnations. It didn’t look right to me with the bottom missing because then it looked too much like an A or R. However, I’ll revisit that and see what else I can do. <br><br>Your point that it looks like a screen error is a good point&nbsp;indeed.</p>
