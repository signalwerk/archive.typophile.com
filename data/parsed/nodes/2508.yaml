    html: <p>Chris, thanks for your input, even if its a bit on the abrupt side. Can you tell me what kind of monitor you’re using? I’ve heard that older monitors actually blur the pixel fonts that employ this technique. <br><br>I ask this because the letters do not run into each other. I’m not sure how literally you meant that. Can you send me a screen shot of how the graphic shows up on your screen? <br><br>Now that I think about it, since this is a graphic and not the actualy pixel fonts, the letterforms should stay in tact. <br><br>Can you give me a bit more to go on here? I’m afraid your input has come across as more of a put-down than anything I can use to make the font better.  <br><br>Do the grays make each letter look blurry, and because they are placed one pixel apart from one another, they give an overally appearance of running together? <br><br>Also, how does the non-aliased version of Rolos strike you? Do its letters run together as well? <br><br>Perhaps it’s the design as a whole that you dislike? <br><br>Any greater detail on your feedback would be&nbsp;great.</p>
