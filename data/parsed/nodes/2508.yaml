    html: <p>tanya, I think the cutoﬀ B is intentional. you don’t really need the top, right?&nbsp;;) <br><br>Relevare means ‘to relieve’, to lift a weight. <br><br>So they did, by stapling a few graphic rules together with a timeline and a database. Bravo! Now we can all copy it, unless they’ve got some kind of patent. Better to improve on it. tyler’s only sin is aping it 1:1. <br><br>As for the font, go ﬁsh. Bitmap pixel space is a small country and simultaneous evolution happens all the time. Again, the only sin is 1:1 copies.  <br><br>Good luck bringing up meantangerine tyler. Before you release the deluxe versions, read <a href="http://www.truthindesign.com/gray-cell.html" target="_blank">http://www.truthindesign.com/gray-cell.html</a> .</p>
