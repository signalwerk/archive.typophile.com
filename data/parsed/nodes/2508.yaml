    html: <p>Chris, thanks for your added input. It is quite helpful. I’ve added an extra pixel to the space keystroke, and it brings out the words far better than before. <br><br>Having spent so much time on so many diﬀerent faces for the launch of <span class="caps">MT</span>, I’m afraid I lose perspective on things. <br><br>I know that Rolos is a squat, specialty face, and that’s all it’s intended to be. More than anything, it is one example of my desire to push the boundaries of each letterform to their limits in ways that other pixel font designers haven’t explored already. <br><br>Despite the fact that this font is only four pixels high, it’s intended to be used as a ( very small ) titling font, for burst useage. <br><br>The other font is Nerve, a narrow face also intended for titling. The two little ones in the logo belong to the Toto family. <br><br>Thanks again. I’m glad to have had your help. <br><br><br><br><img src="http://www.typophile.com/forums/messages/29/22892.gif" alt=""></p>
