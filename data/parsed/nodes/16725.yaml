    <p>Hi Typophiles,</p>
    <p>I’m a design student who’s come to the realization that I am just BAD at type.  I don’t know if anyone could recommend a book that would help me get better?  I’m trying to get through The Elements of Typographic Styles, and I have a few other books.  But please let me know if there’s another book that I should check out.</p>
    <p>Thanks!</p>
