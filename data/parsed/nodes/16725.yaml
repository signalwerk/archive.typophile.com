      <p>One good technique for learning type usage and combination is documenting what is around you. Take pictures of things that work. thats what it is all about; what works. Photograph a magazine layout that is striking, or a book that reads easily, or signage that clearly communicates. When the time comes for you to solve a type problem you will have a reference library. It is good to have work not to copy but to emulate. Observe what the artist did in terms of combination of type styles, proportion, spacing.</p>
      <p>It is good to know what the masters think about type usage and combinations. It is also important, in my opinion, to see what others are doing; type in action. What does/doesn’t work.</p>
