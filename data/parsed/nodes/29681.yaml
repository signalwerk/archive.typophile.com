  html: |-
    <p>I’ve been working on my own portfolio and I’ve been eyeing for Sauna italic from Underware to use as heading or captions in my portfolio. As you know, Sauna only comes in package not in single weight. Although, I love the whole package, I can’t afford to buy them. Since I am currently a student. So far, I’ve been using Palatino for the body copy. I hope somebody could give me suggestion a similar typeface like Sauna italic in regular weight for heading.</p>
    <p>I like Klavika italic from Process Type Foundry too, but I founded they are too geometric and bit cold. It is not suitable to pair it with my work, because I wanted the overall look of my portfolio as warmth and elegant but also contemporary.</p>
    <p>(Palatino as body copy is not final and I also prefer the normal Sauna italic to swash version)</p>
    <p>Any suggestions?</p>
    <p>thanks</p>
