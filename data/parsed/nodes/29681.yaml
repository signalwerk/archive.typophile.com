    html: |-
      <p>Well, I haven't tried to contact them yet but I read from previous post before that someone was looking to buy single cuts of Sauna. It looks likely that he got no luck since Village confirmed that Underware have chosen to license for their full families, except Bello. Even though Village have asked several times to Underware if they consider selling single weights of their fonts.</p>
      <p>So far, Oz intrigues me the most. But I am still not sure to go with it. It still not there yet. Oz has the similar rounded feel like Sauna but it lack of the geometric side, very feminine. I guess I am being too picky, it is impossible to found the exactly the same one. </p>
      <p>I might give it a try to contact Underware tell them how desperately I need the font.</p>
      <p>Thanks for all the suggestion… but I am still optimistic to find something similar.  There must be something more similar out there…</p>
      <p>- Dian</p>
