      <p>Thank you for your concern. I had similar worries about @font-face, but I've found that most web site publishers seem to be able to work out what they can and can't do with our fonts, and the hosting services have done a good job of helping guide site owners along the right path. </p>
      <p>The inclusion of OpenType  features in the web fonts will help web site designers understand what OpenType can bring to their content and inevitably they'll seek out providers like The Font Bureau to provide alternates above and beyond the web safe options.</p>
