    <p>Hi, everybody. It seems that Windows 8 not only updated Segoe UI. As you may guessed, Microsoft updated Times New Roman and Arial. But, to my surprise, Comic Sans MS also gets a big update! It now supports Italic and Swash...</p>
    <p>Well, the Italic typeface actually just looks like an oblique one. But the Italic Swash part is just crazy...</p>
