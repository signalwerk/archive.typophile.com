      <p>&gt;Can't wait! So, these new fonts have licensing allowing any user to host and link to them<br>
      &gt;And there are WOFF versions available from MS or do we convert them ourselves?</p>
      <p>Sorry conversion to WOFF isn't currently allowed under the Windows EULA. On the plus side most of these fonts (or equivalents) should be available via our licensing arrangement with Ascender/Monotype, if not now, then in the near future (once enough browsers support OT). </p>
