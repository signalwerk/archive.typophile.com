      <p>SD: "...We posted demos..." </p>
      <p>I know, and we are are happy to support OT features even if we(btype), need to write a per-feature line of CSS for each browser <em>and! </em> put a different font file on the stack to suit each browser/OS combination, <em>and! </em> put a different naming structure on font families to suit each browser, and &amp;tc.</p>
      <p>But, I'm imagining millions of windows users happily working along in the integrated world of windows and the web 'til finding a web publishing barrier with the dandy new features of the fonts they are accustomed to doing with whatever they like. </p>
      <p>So, and this is not the first time I've thought this even though it's not my problem — I'm concerned for the safety of Comic Sans.</p>
