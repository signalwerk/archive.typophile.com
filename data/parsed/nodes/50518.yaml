    html: |-
      <p>I’m in LA, but please feed the cupcake to<br>
      a deserving Brit instead. I’m sure you can<br>
      find one.  ;-)</p>
      <p>I’ll send you the photo (you might need a higher-quality one, which we can talk about) and I’ll try to get permission to pass along a jaw-dropping hi-res macro of an original punch (it’s the “G”) for your use as well. Also, I have [my own] decent macro shots of the Monotype and ATF cuts (text sizes). In case it matters, how are the rights to such submissions considered?</p>
      <p>BTW, this<br>
      <a href="http://www.flickr.com/photos/73042013@N00/2895427251/in/pool-847442@N25" title="http://www.flickr.com/photos/73042013@N00/2895427251/in/pool-847442@N25">http://www.flickr.com/photos/73042013@N00/2895427251/in/pool-847442@N25</a><br>
      of course is not a Baskerville; it’s a De Vinne.</p>
      <p>One other thing - the official logo of Canada is in a Fry’s cut:<br>
      <a href="http://upload.wikimedia.org/wikipedia/en/thumb/8/83/Canada_wordmark.svg/250px-Canada_wordmark.svg.png" title="http://upload.wikimedia.org/wikipedia/en/thumb/8/83/Canada_wordmark.svg/250px-Canada_wordmark.svg.png">http://upload.wikimedia.org/wikipedia/en/thumb/8/83/Canada_wordmark.svg/...</a></p>
      <p>Which makes me add: you might want to distinguish between the two versions in your project (especially in the “identification help” part) since they’re so different.</p>
      <p>Oh, one last thing: would you like JB’s family tree, going back about 5 generations?</p>
      <p>hhp</p>
