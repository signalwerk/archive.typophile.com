    <p>The Baskerville Project is searching high and low, near and far, crossing oceans around the globe and surfing the information superhighway, for beautiful examples of John Baskerville’s most elegant and sublime typeface.</p>
    <p>From your local street sign, to your favorite body copy set in Baskerville, we are looking for exciting and captivating images of Baskerville, to include in the closing scenes of the short animated film: Baskerville.</p>
    <p>Join the hunt for Baskerville and post your contributions to our Baskerville Project Flickr group:</p>
    <p><a href="http://www.flickr.com/groups/847442@N25/" title="http://www.flickr.com/groups/847442@N25/">http://www.flickr.com/groups/847442@N25/</a></p>
    <p>Alternatively you can email your high resolution photos to us here at <a href="mailto:info@baskervilleproject.com">info@baskervilleproject.com</a></p>
    <p>If you are looking for some pointers in how to identify John Baskerville’s timeless typeface, visit our introductory guide:</p>
    <p><a href="http://www.baskervilleproject.com/image/tid/42" title="http://www.baskervilleproject.com/image/tid/42">http://www.baskervilleproject.com/image/tid/42</a></p>
    <p>VISIT US AT <a href="http://WWW.BASKERVILLEPROJECT.COM" title="WWW.BASKERVILLEPROJECT.COM">WWW.BASKERVILLEPROJECT.COM</a></p>
