    html: <p>There was a foundry called Tarm Saft and they were from Sweden. Apparently they had a concept of fonts as a form of computer virus. <br> <br>So they created a ton of fonts, some really quite nice and original and named them absolutely vulgar names is Swedish so all the hip NYC art directors were specing out fonts names after genetalia etc . . . <br> <br>Funky? I'd say . . .  <br> <br>:D</p>
