    html: "<p>These are great! I'm afraid to even comment on the Jesus Loves Your Sister or the Swedish font name-prank. (Research your font selections!) I went to Font Diner.. saw Square Deal. Reminds me of a joke my grandmother tells me every time we ride past a cow pasture where the hay is rolled up into circular bales: <br>\"Know why those cows complain about the hay rolled up like that? They don't feel like they're getting a square meal!\" <br>(Every time! I'm proud of myself for still never ruining the joke by answering for her.) <br> <br>John, what are some of the names (or should I just not ask?)</p>"
