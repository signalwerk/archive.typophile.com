    html: |-
      <p>I think KOLO is more Arts-and-Crafts than Art Nouveau. To me, it's not organic enough to be Art Nouveau.  It feels more C.R. Mackintosh/ craftsman than Mucha/Studio/Paris. </p>
      <p>ELPHINSTONE is too ... too ... calligraphy.</p>
      <p>BELWE has potential for content, and <strong><a href="http://www.myfonts.com/fonts/linotype/arnold-boecklin/" rel="nofollow">arnold-boecklin</a></strong> may work for display?</p>
      <p>But -- I don't think anyone does it better than <strong><a href="http://www.myfonts.com/fonts/p22/art-nouveau/" rel="nofollow">P22 Art Nouveau</a></strong></p>
