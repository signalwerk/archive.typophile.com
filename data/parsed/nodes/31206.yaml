      <p>I'm liking Auriol too.<br>
      However, I think that for a menu, ya gotta have some of those lovely borders as in the sample you show, so it's really a question of integrating the type with the style of the border.</p>
      <p>Windsor (Light is very classy), Korinna, and Souvenir have that "triangulating the circle" art nouveau shape.</p>
      <p>For another tack, Advertiser's Gothic.</p>
