    html: |-
      <p>Look up Alphonse Mucha, the king of Art Nouveau, for colors, styles, etc. Lots of flowery stuff and colors that came back into vogue in the 1970s. Also look up Vienna Secession and Jugendstil.</p>
      <p>A couple of "art nouveau" fonts I can think of: Auriol, Desdemona, etc... </p>
      <p>Don't confuse Art Nouveau with Art Deco.</p>
