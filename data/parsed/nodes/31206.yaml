      <p>I found a font called KOLO LP, which has a clean nouveau look. It feels a bit hand drawn. The text side of the menu will have a frame, similar to the one in the picture that I have uploaded. The other side of the menu will be decorated with an rather typical nouveau illustration (inspired by Alphonse Mucha).</p>
      <p>Is KOLO LP a good choice? If so, what would be a nice typface match? Should go with a face like BELWE or perhaps JENSON, SOUVENIR, LTC FORUM TITLE or ELPHINSTONE. Hmm, I´ll think I need some guidance.</p><div class="imageWrap"><img src="http://typophile.com/files/kolo_lp_5090.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/frame_6223.jpg"></div><p></p>
