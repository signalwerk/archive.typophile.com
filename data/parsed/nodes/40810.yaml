  html: |-
    <p>hi people,</p>
    <p>i am searching for a typesface or a combination of typefaces that, if well set, can communicate a premium experience. it's a bit difficult to explain, i am working on a wordmark for a premium brand in the real estate sector -</p>
    <p>the design elements would be the brand itself + a corresponding travel destination (like toscana or bretagne, et cetera..). a two part wordmark basically -</p>
    <p>any suggestions would be great - currently i am working with a combination of something like bodoni/didot with trade/smth. comparable (but a face less classical and more contemporary (younger faces) would be interesting, too -</p>
    <p>any suggestion? time to write some down?</p>
    <p>best + kind regards,</p>
    <p>steffen :)</p>
