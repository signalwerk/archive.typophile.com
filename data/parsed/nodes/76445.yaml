    <p>The "happy typographic families" is available!<br>
    Learn, understand, revise typography and its families with fun and with friends!<br>
    74 cards 5,8 x 9,3 cm in a plexiglass box.<br>
    60 fonts from the most famous foundries are presented.<br>
    In French or in English.<br>
    Published by Éditions Deux-Cent-Cinq: <a href="http://www.editions205.fr" title="http://www.editions205.fr">http://www.editions205.fr</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JeuCartes_Typophile_6046.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/JeuCartes2_Typophile_3826.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/JeuCartes3_Typophile_3768.jpg"></div><p></p>
    <p>It's a really "serious" game to understand, learn or revise typography and families.<br>
    You can play with friends (and even with your children, I played with my children and they liked it!) like with a "happy families" game.<br>
    But because typography is not so simple, rules are a bit more difficult with 2 large families (10 cards) that count 2 "normal" families (a familie has 6 cards), with a superfamilie (4 cards) that allows you to catch a other player's familie (only if you can recite all fonts in his family). A real pleasant time, be sure!<br>
    These cards are also real specimens to present 60 fonts – classics or recents from worldwilde foundries (Linotype, Underware, 256tm, 205, B&amp;P Typefoundry, FF, OurType, etc.)</p>
