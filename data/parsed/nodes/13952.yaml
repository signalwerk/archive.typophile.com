  html: |-
    <p>PageMaker was the first major desktop publishing application for personal computers, first released in 1985 by <a href="/wiki/Aldus" class="freelinking" rel="nofollow">Aldus</a>. With the advent of <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a>, users were able to create their own multi-page documents that combined text and graphics. Though PageMaker was overtaken by <a href="/wiki/QuarkXPress" class="freelinking" rel="nofollow">QuarkXPress</a> in the early 1990s as the industry standard, <a href="/wiki/Adobe%20Type" class="freelinking" rel="nofollow">Adobe</a> took over PageMaker when it bought Aldus in 1995. Though Adobe's primary page-layout application is now <a href="/wiki/Adobe%20InDesign" class="freelinking" rel="nofollow">InDesign</a>, PageMaker is still part of Adobe's product line.</p>
    <p>URL: <a href="http://www.adobe.com/products/pagemaker/main.html" rel="nofollow">http://www.adobe.com/products/pagemaker/</a></p>
