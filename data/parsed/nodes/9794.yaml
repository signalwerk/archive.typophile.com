    html: <p>It seems to match Bitstream's <a href="http://www.myfonts.com/fonts/bitstream/aldine-401/">Aldine 401</a>, which is their Bembo ripoff. It's also possible that it's a real Bembo with an alt R with a shorter tail. <br> <br>And yes, the <a href="http://www.myfonts.com/fonts/agfa/bembo/italic/testdrive.html?s=by+Chuck+Byrne+and+Martha+Witte+1&amp;p=24">Italic</a> of the same family also seems to match.</p>
