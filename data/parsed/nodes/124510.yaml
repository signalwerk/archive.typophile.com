    html: |-
      <p>Each of the repeated letters 'i' and 'e' are different. That usually means that it is not a font, but hand-drawn. </p>
      <p>This style is similar to a number of popular new script fonts like <a class="freelinking external" href="http://www.myfonts.com/fonts/emily-lime/bombshell-pro/?refby=bowfin" rel="nofollow">Bombshell Pro</a> from Emily Lime. The foundry has several others with a similar feel. Also Eurotypo, and Trial by Cupcakes (see <a class="freelinking external" href="http://www.myfonts.com/fonts/trial-by-cupcakes/anna-clara/?refby=bowfin" rel="nofollow">Anna Clara</a>).</p>
      <p>- Mike Yanega</p>
