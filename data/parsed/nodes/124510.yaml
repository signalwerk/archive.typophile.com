    html: "<p>Wasn't able to spot a match but I'm clearly not convinced I couldn't be a font. 2 more foundries with fonts in the same vein: <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Magpie_Paper_Works\" rel=\"nofollow\">Magpie Paper Works</a> and <a class=\"freelinking external\" href=\"http://www.myfonts.com/foundry/Great_Lakes_Lettering\" rel=\"nofollow\">Great Lakes Lettering</a>. You could also have a look to the <a href=\"/wiki/https%3A/%252Fcreativemarket.com/fonts/script\" class=\"freelinking\" rel=\"nofollow\">Creative Market Script section</a> if you need more alternatives.</p>"
