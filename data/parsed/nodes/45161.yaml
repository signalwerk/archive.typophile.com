      <p>They’re nice and clean, but I don’t know if you pushed your ideas as far as they could go. I don’t really read security in the top 2, the chain I kinda get, and the eye not so much. Have you considered a lock and chain perhaps or a shield? </p>
      <p>The type is clean, but some of the letters need tweaked in the curved layouts. Specifically the M.</p>
