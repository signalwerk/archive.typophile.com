    <p>Hi,<br>
    I’m looking for the name of an old chunky typeface.<br>
    My investigation leaded me to Zubilo Black from ParaType (sample here: <a href="http://www.myfonts.com/fonts/paratype/zubilo-black/" title="http://www.myfonts.com/fonts/paratype/zubilo-black/">http://www.myfonts.com/fonts/paratype/zubilo-black/</a>), which is the same exactly font I’m looking for.<br>
    The reason for I’m posting here is that I’m quite sure an older font than the one digitalized by ParaType exists, but I can’t find its name (maybe it has never been digitalized before).<br>
    Anyone has a clue?<br>
    Thank you all,<br>
    bye</p>
