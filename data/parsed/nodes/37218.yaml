    date: 2007-09-19T09:30:00
    votes: null
    html: <p>You may be looking at a different version Mike. The caps only from ComixHeavy <a href="http://www.abstractfonts.com/font/62?text=AaBbCcDdEeFfGg" rel="nofollow">here</a> do match the caps in Zubilo. Pat Snyder's <a href="http://www.patsnyderartist.com/patsnyder_fonts.html" rel="nofollow">website</a> has a showing of Comics Cartoon II too. The lowercase from Zubilo may be original, don't really know about that.</p>
