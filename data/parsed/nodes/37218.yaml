      <p>Is it possible that the font you remember was just similar to Zubilo? The bouncy, irregular, blocky shape style is not really a new thing, if you go back to <a href="http://www.myfonts.com/fonts/agfa/artistik/" rel="nofollow">Artistik</a>, and Harquil (which has been digitized as "Harlequin", and is shown in Solotype and Petzendorfer books, and very similar to <a href="http://www.myfonts.com/fonts/hihretrofonts/gaiety-girl/" rel="nofollow">Gaiety Girl</a>), which are both Art Nouveau era (over 110 years old). There are others, including <a href="http://www.myfonts.com/fonts/tailspinstudio/softie/" rel="nofollow">Softie</a>, that MyFonts Uses all over its site.</p>
      <p> - Mike Yanega</p>
