    <p>Hi Guys and Gals,</p>
    <p>I am trying to identify the font used on the Miles Davis Bitches Brew album cover and have had no luck so far either on the line or the few Letraset catalogues i've browsed.</p>
    <p>I'd be most greatful for any help or hints!</p>
    <p>Best</p>
    <p>Ant</p>
