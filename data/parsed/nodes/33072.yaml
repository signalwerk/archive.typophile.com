    html: <p>Hi Guys thanks for your responses. I eventually with a lot of hard work found the font. Its a freeware font called Tricorne Display using all the uppercase letters.</p>
  - id: 197381
    user_id: 103
    user_name: Stephen Coles
    user_path: null
    date_raw: 17 Apr 2007 — 8:42am
    date: 2007-04-17T08:42:00
    votes: null
    html: <p>Tricorne might look like the font that was used on the album art, but keep it mind this was designed before digital fonts existed, so it's only an emulation of the original, and might not be a good one if it's free.</p>
  - id: 197409
    user_id: 3368
    user_name: Mike F
    user_path: null
    date_raw: 17 Apr 2007 — 9:59am
    date: 2007-04-17T09:59:00
    votes: null
    html: <p>Tricorne was Southern Software's "version" of Novel Gothic (see Angel71's post above). If SSi was true to form, the font was a renamed ripoff of someone else's font.</p>
