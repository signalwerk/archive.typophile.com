    html: |-
      <p><cite>A lot of typophiles organize by foundry - this wouldn’t work for me.</cite></p>
      <p>I do both:<br>
      I have two superordinate folders (in Linotype FEX, that is):<br>
      ‘by source’ and ‘by style’</p>
      <ul>
      <li>First of all, all new fonts <em>always</em> go into their group within the former, according to their origin:<br>
      ‘Adobe CS2 (bundled)’, ‘House Industries’, ‘xyz.com (freebie)’ &amp;c.<br>
      This reflects the naturally developing Finder structure (purchases, downloads) – and thus, it’s no extra work.</li>
      <li>these groups then get labeled with a colour: Green for ‘commercial license, no restrictions’, yellow for ‘only non-commercial use’, blue for ‘freebie’ &amp;c.</li>
      </ul>
      <p>That way, I always know where I got them from and what I am allowed to do with them.</p>
      <p>In a second step, I sort them by style:</p>
      <ul>
      <li>I copy selected fonts into categories, similar to those mentioned by David or Patty above</li>
      </ul>
      <p>The advantage is: while a font always has only <strong>one</strong> origin, it can have multiple styles; e.g. it can be ‘Display’ <em>and</em> ‘Retro’ <em>and</em> ‘Mecane’ <em>and</em> ‘Very fat’ …<br>
      No problem, just do multiple copies in the ‘Style’ folder!</p>
      <p><cite>I do it alphabetically, by typeface name.</cite></p>
      <p>This is a thing I never understood (they did it in University too, ordered even like a telephone book, grouping fonts that have nothing in common: ‘A–C’, ‘D–F’, …): This is a something the application additionally offers anyway, isn’t it?<br>
      If I am looking for a font starting with ‘Soft…’, I’d type ‘soft’ into the search field.</p>
      <p>F</p>
