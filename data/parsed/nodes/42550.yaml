    html: |-
      <p>I never needed a classification, I also put them altogether alphabetically. in my researches and my thoughts, I always use the categories / hierarchy based on the historical classification of maximilien vox, with a subdivision of the Lineale family (sans serif) as proposed by lewis blackwell. it is as follows:</p>
      <p>- manuaires (types which imitates the early ucial monks handwriting, where each letter is separated)<br>
      - humanes (early types of Jenson et al, strongly influenced by calligraphy)<br>
      - garaldes (classic types of Garamond et al, with an inclined axis)<br>
      - reales (transitional types, baskerville etc, vertical axis)<br>
      - didones (Bodoni style, strong contrast, horizontal serif, vertical axis)<br>
      - mecanes (slab serif, sometimes wrongly called egyptian, very bold)<br>
      - incises (flare types such as optima or penumbra)<br>
      - lineales grotesques (early sans serif, akzidenz et al)<br>
      - lineales humanistiques (sans serif with roman proportions and structure, gill sans etc)<br>
      - lineales geometriques (geometric sans, futura etc)<br>
      - lineales modernes (swiss rebirth of sans serif in the sixties, helvetica, univers etc)<br>
      - lineales contemporaines (contemporary works in the sans serif theme, vista, ff cocon, etc)<br>
      - fraktures (british and german types wrongly called gothic)<br>
      - scriptes (imitating the linked calligraphy)</p>
      <p>this classification bears the advantage of being validated by Atypi in 1962, and it is widely used and quite useful.</p>
      <p>dr</p>
