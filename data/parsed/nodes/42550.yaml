    html: |-
      <p>Notice how many people have replied that essentially their system has to make sense to them. With this as background, how would an industry standard work? What would the categories be based on, who would decide the tags? Would you go along with someone else's system?</p>
      <p>For instance, fonts that straddle categories would need to belong to both (or all). What is the standard "first place to look" if a design is a geometric sans AND a script at the same time? This is not a rhetorical question, look at Mark Simonson's Coquette.</p>
      <p>If you disagree with my, or anyone's classifications, then that kind of wrecks the idea of a standard; everyone has their own perceptions and ways of associating typefaces with each other or with concepts like "elegant", or "casual" or "square". We see the differences of opinion here every day. One person's "square" is another person's "geometric".</p>
      <p>The tag cloud in Flickr gives an interesting way to conceive of different but related items. FontShop also put out a poster showing their types all arranged in a sort of cloud, with proximity based on similarity. In this way they are unlinked from "classifications" and linked instead to associations, either conceptual or visual.</p>
