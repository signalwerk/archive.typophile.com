      <p>Yeah, Paul, that’s my dream, too. ;°)<br>
      Actually, you <em>can</em> do it: FEX’s ‘information’ window takes multiple comments. One could go through all fonts and tag them that way: ‘baroque, script, bold, language-coverage:ce, x-height:xl, client:XYZ, osf’.<br>
      But of course, that’s a PITA, as you cannot export/exchange those self-made tags.<br>
      I’d love the Linotype people to integrate a simpler tagging functionality, and then one would be able to download and assign tag sets from the foundries, or from Typophile.</p>
