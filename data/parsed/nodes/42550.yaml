    <p>I'm always curious about how other graphic and type designers categorize their fonts within their type management apps. I have worked with people in the past who organize sets by client or project. That always seemed like a pain to me. I use basic set categories:</p>
    <p>- Graphic<br>
    - Handwriting<br>
    - Serif<br>
    - San Serif<br>
    - Script<br>
    - Vintage</p>
    <p>If I wanted to to take it to the next step are there any additional categories that I could include? What do you do?</p>
    <p>Basic question I know...but I thought I would throw it out there.</p>
