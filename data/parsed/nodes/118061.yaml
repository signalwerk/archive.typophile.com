      <p>Without knowing the date of the tag (airline was founded in 1955, tag could date as late as '70s, by the look of it), this appears to be a bastardized version of Avant Garde. Didn't find anything with the curiously square-off R and P, but the following may be helpful:</p>
      <p><a href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-bold/" title="http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-bold/">http://www.myfonts.com/fonts/itc/avant-garde-gothic/std-bold/</a><br>
