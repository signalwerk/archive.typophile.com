      <p>I don't think this is a font, it's probably a Frankenstein construction of different fonts (not only the style but also the weight of the letters is different).<br>
      If you insist to construct something similar, you can take "GO" of <strong><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code></strong> (cut a bit the upper end of /G) and add to the recipe "RUP" from <strong><code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code></strong> free font by Grandoplex Productions [2009] - you probably need to embolden the later.</p>
