      <p>Well, it's been a while, but here is a 6 page pdf showing the various weights of the finished family.</p>
      <p>Houschka Rounded is pretty comprehensive with over 830 characters. It covers East and Central European, Turkish and Cyrillic. It has a standard character set, contextual and stylistic alternates, lining and old-style numbers, both proportional and tabular, small caps, and 3 extra stylistic sets (as shown on the pdf). The top example is the standard set (with small caps).<br>
      Set 1 is modernish, set 2 is Art Decoish and set 3 has unicase characters.</p>
      <p>Please see new: HRtest2.pdf</p>
      <p>Nick Cooke</p>
