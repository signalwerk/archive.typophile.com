    <p>I've been working on a rounded style of Houschka for a while now. It's now OpenType as I have included some new features. Some people were put off the original Houschka because of the rounded shape of the A, W and w, (although a lot of others liked it for that very reason). So I have included contextual alternates of these characters in the new rounded version, as well as small caps (also with alternate A and W), lining and non-lining and tabular figures, and discretionary ligatures ct, sp and st.</p>
    <p>Any other discretionary ligature suggestions?</p>
    <p>Thanks,</p>
    <p>Nick Gooke, G-Type</p>
