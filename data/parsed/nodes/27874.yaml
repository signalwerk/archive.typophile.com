      <p>Thanks for mentioning this, and I did know about it - it's the only may to blend certain characters between the two weight extremes, and will be rectified for the finished typefaces. You're right – this is a work in progress.</p>
      <p>I actually prefer the round style to the original Houschka, plus I have improved the shapes in some characters.</p>
      <p>The good thing about OpenType is that you can choose between the different styles of A and W's.</p>
      <p>Nick Cooke</p>
