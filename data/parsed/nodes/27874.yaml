    html: |-
      <p>This would make a great addition to the surprisingly hit and miss category of rounded fonts. </p>
      <p>the p, q, b have the same corner treatment where the strokes moves from straight to curve, yet the d is a right angle, I rather enjoy the treatment of the p, q, b. you might even make the angle begin early in the vertical stroke. </p>
      <p>also, the rounds in the lowercase seem a bit inconsistent, the o, c, e seem to be based on a perfect circle while the g, p, d, b, q, have more robust curves. I feel perfect circles tend to have points on the upper and outermost extremes.</p>
      <p>I dig it!</p>
