    <p>It’s time to replace the street number on our house, So I’m going to carve a new sign. Woohoo. </p>
    <p>Material will be left over harwood flooring in birch and/or some dark tropical wood. </p>
    <p>The street number is 19, so I want to know about fonts that you think have really <cite>nice </cite>looking numbers 1 and 9, that will work well together (the rest of the font can be kaka :o) ). I want something a little - uh, fluid. And old style. </p>
    <p>Thanks.</p>
