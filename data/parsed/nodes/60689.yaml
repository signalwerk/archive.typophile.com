      <p>Now we’re talkin! :o)</p>
      <p>nice work, Frank.</p>
      <p>I don’t really <cite>do </cite>calligraphy, but I draw well, and by drawing the same glyphs over and over again, I can end up with something LIKE calligraphy. :o) In the end, what ever I do will be hand drawn, though likely based on or at least, “inspired” by an existing font, though I’ve been looking at Bickman’s Universal Penman. The carved shapes need to be fatter than most calligraphic figures I’ve seen. </p>
      <p>-=®=-</p>
