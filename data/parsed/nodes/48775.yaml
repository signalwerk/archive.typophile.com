    <p>Hey guys,</p>
    <p>I know you all have at least one font that you absolutely hate and refuse to use, so I thought it would be fun to start a list. The rules are as follows:</p>
    <p>1) Name the ONE font you'd kill. (Arial)<br>
    2) Explain why you chose it. (it's a knockoff)<br>
    3) Suggest an alternative. (Helvetica)</p>
    <p>Enjoy,<br>
    Matt</p>
