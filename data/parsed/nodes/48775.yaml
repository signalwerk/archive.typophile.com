    html: |-
      <p>Tiffany, Hrant, Eden — what I wrote isn't a personal attack, but a call for tolerance. Albeit inflammatory in style. While it may look as if I am taking the topic of this one too seriously, when I see typophiles revving up the hate juggernaut I wonder who is poo-pooing who and what. Perhaps you guys can tell me; is a thread like this anything other than poo-hanging session?</p>
      <p>Hate is a corrosive word. Look at where hatred got the guy who stated the Ban Comic Sans campaign. Nowhere. My point—hating what you dislike rarely makes that thing go away, and we're better off tolerating it. Nobody here will engage in any actual killing, and the life of no living thing is under threat. But "kill" is still dangerous corrosive word, I think best reserved for living things that actually threaten us and cannot be tolerated. The national socialists in Germany hated the Jews and killed between 9 and 11 million of them. The Jews weren't threatening anybody, but when the axis powers took control of what was left of Germany we found it neccessary to execute the murderers who had tried to exterminate an entire race of people. Only in extreme circumstances like that is killing anybody neccessary. Why the Nazis had to hate the Jews. Well, clearly it was the Nazis projecting their fears and insecurities onto a convenient social / cultural group.</p>
      <p><strong>He who saves one life saves the entire world.</strong></p>
      <p>Will hating certain fonts we dislike (can't bring ourselves to tolerate) make them disappear? Not likely. So where does hating them get us?</p>
      <p><strong>He who hates one font hates all of typography</strong> Don't take it literally. I'm speaking figuratively.</p>
      <p><em>Wouldn't your time be better spent on days to come<br>
      Not the ones that went?</em><br>
      —words by Ron Sexsmith.</p>
      <p>Tiffany—I'm not out of control, not doing a Bill Troop trip here, but having you step in and remind me why I joined this community in the first place is a good thing. We all need to keep a grip on the things that really count.</p>
      <p>j a m e s</p>
