      <p>1. digitized versions of distressed type</p>
      <p>2. the premise is that the type has existed in place for a while and has eroded or been distressed by the elements. However, each letter is distressed exactly the same. Every E is the same. Every S is the same. So a headline with repeated letters looks goofy.</p>
      <p>3. there are better ways of distressing type than purchasing a pre-distressed font. Photoshop works. Or the old-fashioned method of outputting the type and beating the crap out of it, then scanning it back in, offers great satisfaction.</p>
