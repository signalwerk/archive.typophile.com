      <p>@Joshua – The standard letter format in Europe (and, yes, I <em>am</em> a Native European) is A4. One scant-noticed thing about the A formats is that is that you can cut one A(<em>n</em>) sheet into exactly two A(<em>n</em>+1) sheets since the ratio between height and width is sqrt(2).</p>
