    html: |-
      <p>Caspari and Kievit are interesting to compare to eachother.  At about 10 point (which is what all the texts are set at), to me they look fairly similar and seem to almost even have the same "mood."  But when you blow them up and look at them in 200 point or so, you notice they are very different.  Caspari is close to being mono-line, and all it's curve look pretty polished, whereas Kievit is not mono-line at all, and all it's lines and curves looks, well I can't come up with a better term than "hand drawn."  Yet again, to me, at long text size, they feel remarkably similar to one another.</p>
      <p>The Scala Sans sample I find the most interesting, however.  It has such an "official," almost "clinical" appearance.  Might be a bit too "formal" looking for casual reading (long text reading for pleasure, as opposed to research, education, etc...), but there is something very pleasing and "right looking" about it for body text, for say, a new prescription drug brochure.</p>
      <p>Legato seems to take on very stoic, serious tones when set in long copy.  I would love to see a copy of the bible set in Legato.  As with Scala Sans, though, might be a bit too formal for long pleasure reading.</p>
