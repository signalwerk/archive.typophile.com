      <p>What's wrong here? Where to begin ...</p>
      <p>A: There is neither a premise nor an indicated purpose.</p>
      <p>B: As a research project/experiment, there are absolutely no controls.</p>
      <p>C: There are built-in biases:<br>
          1) Any given physical format such as the 8½ x 11 that you arrogantly call 'letter size' biases against those that don't have access to that size. For most of the rest of the world, A4 is 'letter size'.<br>
         2) Each story in its own font? The content will have more of an impact than the font selection, and there may be a question of appropriateness of a given font to a given narrative.<br>
         3) Sampling bias: You're asking people to PRINT OUT this material? Only those willing and able to do so would therefore be counted; in other words, interested parties with time on their hands and a willingness to spend money on ink and paper.<br>
         4) Sample size. For any results to be meaningful, there would have to be an adequate sample size.</p>
      <p>And more.</p>
