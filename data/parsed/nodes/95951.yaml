    html: <p>Yes, but the readability of it depends on the relationship of the content of the text to the typeface, as well as the layout of the page. Does the text have a lot of capitals or numbers or italics or paragraph breaks? What is the subject matter? How wide is the column? What is the leading? And, since all the typefaces you've chosen are indeed serious, readable faces that could be used for substantial texts, the more important question becomes whether it's appropriate to the tone and content of whatever you're typesetting. What I'm trying to say is that I don't think tests of "readability" have much relevance or interest outside of a specific project. All these faces are readable enough that what is more likely to have an effect on the reader is their appropriateness — which depends on artistry and history, not science.</p>
