      <p>Ryan,</p>
      <p>Set up your pages half-size of whatever "standard" you want, because the finished page will be closer to "ideal" book size. Then, generate a PDF file.</p>
      <p>Next, use a very useful program like Quite Imposing to set up a print run which will allow you simply to chop the finished output in half, then place one half on top of the other. Bind same in a manner you see fit. Nothing could be simpler…really.</p>
      <p>I have a commercial proposal for a franchise operation called Bibliophile Junction, which allows for on-demand printing from a rights-managed library, or as an adjunct service for eBook authors. Some of us old-timers simply do not like eReaders. OTOH, we will probably all be dead soon enough, and thus will millions of trees be saved…</p>
