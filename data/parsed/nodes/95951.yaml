    <p>I have the following fonts at my disposal:</p>
    <p>Amira (regular)<br>
    Bliss (light)<br>
    Caspari<br>
    Finnegan (regular)<br>
    GillSans (book)<br>
    Kievit (book)<br>
    LeagacySans (book)<br>
    Leagto (light)<br>
    Legato (regular)<br>
    QuadraatSans (regular)<br>
    ScalaSans (regular)</p>
    <p>I propose through voting to narrow this list down to 4 top candidates.</p>
    <p>Then find four entertaining public domain stories, create four pdfs and distribute them to all.  All are expected to PRINT OUT and read these pdfs (thus pdfs should be designed for 8.5 by 11 inches, 'letter,' format.  After having read all four stories, or texts, one would report on which font they found the most comfortable to read.</p>
    <p>I will need help for this.  At least a willing type setter.</p>
    <p>note: there are 2 legato weights because neither of them really look right to me, nonetheless none better were available.  Legato light seems too light to me for a book weight, and Legato regular seems too dark.</p>
