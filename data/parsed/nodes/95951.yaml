      <p>How many works of fiction have you ever read in your life that were set 13pt on letter size paper? If the point of this test is to look at sans serif types in the context of long texts of the kind normally set in serif types, surely the first thing to control are all the other aspects of typography normally associated with such texts. That means either a smaller format akin to a book or a two-column layout akin to a magazine, and it definitely means a smaller type size than you suggest.</p>
      <p>Why voting on a shortlist? That isn't even remotely scientific. If you want to limit the number of types considered, you need to come up with reasons for the selection that are meaningful to the exercise, e.g. types with particular different characteristics.</p>
      <p>With regard to the problem of the text itself influencing readability, this may be a real issue given your proposed text selection method. If using different texts, one wants to be able to ensure similar levels of syntactical complexity, vocabulary, etc., which is difficult unless one has a source for rated texts. Picking random 'entertaining public domain stories' won't provide good controls. Here's a better idea, I think: pick a single story of reasonable length and use a different font on each page. Produce a set of numbered PDFs with different fonts used on different pages, and ask participants to pick one at random (or assign them one at random) and record which they read. The idea here is that you avoid e.g. the same font always being used for the most exciting and riveting part of the story.</p>
    html_clean: |-
