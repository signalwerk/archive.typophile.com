    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Sol Hess</strong></p>
    <p>Manager of the <a href="/wiki/Lanston%20Type%20Co." class="freelinking" rel="nofollow">Lanston library</a> from the early until the mid 20th century. He designed many of the faces himself, but more importantly commissioned many important faces from <a href="/wiki/frederic_w_goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a>.</p>
    <p><strong>Typefaces by Sol Hess:</strong><br>
    <a href="http://www.p22.com/lanston/products/artscript.html" rel="nofollow">Artscript</a><br>
    <a href="http://www.p22.com/lanston/products/bodoni.html" rel="nofollow">Bodoni 175</a><br>
    Broadway Engraved<br>
    Goudy Handtooled Cursive<br>
    <a href="http://www.p22.com/lanston/products/hmonoblack.html" rel="nofollow">Hess Monoblack</a><br>
    <a href="http://www.p22.com/lanston/products/JeffersonGothic.html" rel="nofollow">Jefferson Gothic</a><br>
    <a href="http://www.p22.com/lanston/products/spire.html" rel="nofollow">Spire</a><br>
    <a href="http://www.p22.com/lanston/products/squareface.html" rel="nofollow">Squareface</a><br>
    Swing Bold<br>
    <a href="http://www.p22.com/lanston/products/touristgothic.html" rel="nofollow">Tourist Gothic</a><br>
    Twentieth Century Med</p>
