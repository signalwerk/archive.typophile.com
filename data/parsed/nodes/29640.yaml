    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Sol Hess</strong></p>
    <p>Manager of the <a href="/wiki/Lanston%20Type%20Co." class="freelinking" rel="nofollow">Lanston library</a> from the early until the mid 20th century. He designed many of the faces himself, but more importantly commissioned many important faces from <a href="/wiki/frederic_w_goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a>.</p>
