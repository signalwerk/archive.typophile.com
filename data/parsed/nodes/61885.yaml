      <p>Interesting suggestion. Perhaps a bit "industrial" for something you're going to be putting into your body? And feels a touch retro too. This squares with the designer's statement that his inspiration was "architectural geometry of cast iron and brickwork in nineteenth- century American cityscape".</p>
