      <p>I ran across something really different the other day that is very clean and distinctive. It doesn't fit the italic slab serif specification but boy is it dynamic.</p>
      <p>Feisar from Type Invaders<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Feisar_5868.gif"></div><br>
      <a href="http://www.type-invaders.com/feisar/" title="http://www.type-invaders.com/feisar/">http://www.type-invaders.com/feisar/</a><p></p>
      <p>"Feisar strikes a balance between two worlds. From a superficial point of view it’s a modern display typeface, but at closer inspection the construction and spacing reveal the influences of traditional type design. This makes Feisar instantly recognizable, but still very readable at smaller sizes as well."</p>
      <p>For an even wilder ride check out:<br>
      <a href="http://www.type-invaders.com/feisar-express/" title="http://www.type-invaders.com/feisar-express/">http://www.type-invaders.com/feisar-express/</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Feisar-Express_3421.gif"></div><br>
      Probably won't work but had to throw out a curve ball that has completely captivated my imagination for finding a way to use this in a project. ;)<p></p>
