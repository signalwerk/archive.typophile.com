    <p>Stumptown. Rip City. Beervana. PDX.</p>
    <p>The <a href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> (SOTA) is pleased to announce that Portland, Oregon, has been selected as host city for TypeCon2013. Thanks to the top notch crew of local typophiles who have been instrumental in helping us bring TypeCon to <a href="http://www.portlandonline.com/" rel="nofollow">The City of Roses</a>.</p>
    <p>TypeCon2013 will take place August 21st – 25th at the <a href="http://www3.hilton.com/en/hotels/oregon/hilton-portland-and-executive-tower-PDXPHHH/" rel="nofollow">Hilton Portland &amp; Executive Tower</a>. A discounted room rate will once again be available to TypeCon attendees. Details regarding conference registration and hotel reservations will be posted as they become available.</p>
    <p><strong>Town Hall Meeting</strong></p>
    <p>Interested in helping with TypeCon2013 preparations and planning? We’re looking for plenty of volunteers who love type and design as much as we do and will be holding a town hall meeting hosted by the good folks at <a href="http://www.extensis.com/" rel="nofollow">Extensis</a>.</p>
    <p><strong>When:</strong><br>
    Tuesday, November 27th at 7:00 pm</p>
    <p><strong>Where:</strong><br>
    Art Institute Portland<br>
    1122 NW Davis Street<br>
    Portland, OR 97209</p>
    <p>All are welcome to attend, but space is limited. RSVP to <a href="mailto:info@typesociety.org" rel="nofollow">info@typesociety.org</a> so that we know you’re coming. If you can’t make it to this meeting but would still like to participate, please contact us.</p>
    <p>Additional information and updates will be published on the <a href="http://www.typecon.com/" rel="nofollow">TypeCon</a> site, via our <a href="https://twitter.com/typecon/" rel="nofollow">Twitter stream</a>, as well as in our <a href="http://www.typecon.com/newsletter/" rel="nofollow">email newsletter</a>.</p>
