    <div class="node-spam-content"><p>_Secret Of The Incas_ a Paramount movie released in 1954 has a main title lettered in 3-D faux building stones that evoke the spirit of the Inca monumental buildings. </p><div class="imageWrap"><img src="http://typophile.com/files/SecretOfTheIncasSM_5111.jpg"></div><br>
    I wonder if a fan, or anyone else, has used this as model for a font, either flat or 3-D.<br>
    I can't recall any similar fonts that are particularly close. I would be interested to learn what might exist in this rather unusual genre.<br>
    A larger scale image is attached.<br>
    Thanks for your attention.<br>
    Don<p></p>
