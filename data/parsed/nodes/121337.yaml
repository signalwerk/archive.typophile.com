      <p>I would bet somewhere in one of Dan X. Solo’s exotic alphabets there is something like that.<br>
      In my cursory search, decorative typefaces visually inspired by stone tend to presents each letter as carved from a single piece (albeit often crumbling) instead of composed by blocks, while those composed by bricks tend to have a very flat and clean cut.<br>
      Regarding the 3D aspect, one I found, not at all similar, but somewhat as much monumental, is <a href="http://www.fontspace.com/manfred-klein/mk-typobricks-rough" title="http://www.fontspace.com/manfred-klein/mk-typobricks-rough">http://www.fontspace.com/manfred-klein/mk-typobricks-rough</a><br>
      Another search term could be “block”, example: <a href="http://www.fontspace.com/crolrene/wodenbloks" title="http://www.fontspace.com/crolrene/wodenbloks">http://www.fontspace.com/crolrene/wodenbloks</a><br>
      Lastly, a place where the concept has been explored is certainly Fontstruct. Unfortunately its content isn’t easy to navigate and filter.<br>
      Two samples which could or could not be of interest to you:<br>
      <a href="http://fontstruct.com/fontstructions/show/levelrebel" title="http://fontstruct.com/fontstructions/show/levelrebel">http://fontstruct.com/fontstructions/show/levelrebel</a><br>
      <a href="http://fontstruct.com/fontstructions/show/brickybrickbold" title="http://fontstruct.com/fontstructions/show/brickybrickbold">http://fontstruct.com/fontstructions/show/brickybrickbold</a></p>
