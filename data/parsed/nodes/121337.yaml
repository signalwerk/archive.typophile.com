    html: |-
      <div class="comment-spam-body"><p>Thanks Riccardo and Ryuk for the interesting answers.<br>
      The concrete blocks photos are good. Could be the basis of an interesting font.<br>
      Same for The Incredible Hulk lettering.<br>
      As for the existing scalable fonts:<br>
      Rock Steady by the excellent comic book lettering artist,  Nate Piekos,  has an appropriate treatment for the face. Could be applied to other face designs, including the polygonal stones used by the Incas. Could be extended to the 3D treatment. I agree that his company, Blambot, and the other comic book company, ComicCraft are the most likely places for finding something in this genre. Perhaps also PizzaDude.<br>
      Megalithic has some promise. Unfortunately the author, Daniel Ortega, did not refine the Dan Zadorozny's Hulkbuster design so that the structure works as well in basic black and white as it does in the version showing shades of grey.<br>
      The other suggested fonts also give hints as to what is feasible. For example MAWNS Rock shows what can be done with a simplified graphic treatment of wear and tear, but would be much more useful in a version without all the loose rubble.<br>
      You have both been most helpful. Shows its worth digging further.<br>
      Don</p>
      </div>
