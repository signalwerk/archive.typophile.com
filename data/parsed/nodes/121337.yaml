    <p>_Secret Of The Incas_ a Paramount movie released in 1954 has a main title lettered in 3-D faux building stones that evoke the spirit of the Inca monumental buildings. <img src="/sites/default/files/old-images/SecretOfTheIncasSM_5111.jpg"><br>
    I wonder if a fan, or anyone else, has used this as model for a font, either flat or 3-D.<br>
    I can't recall any similar fonts that are particularly close. I would be interested to learn what might exist in this rather unusual genre.<br>
    A larger scale image is attached.<br>
    Thanks for your attention.<br>
    Don</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/SecretOfTheIncasMED.jpg" width="1111" height="769" alt="">
