      <p>@ etahchen</p>
      <p>Are you using faked small capitals (downsized versal letters)?</p>
      <p>Don’t use block text for the lines ‘KING | OF THE | JUNGLE’.</p>
      <p>None of the examples with the (small) capitals does work.</p>
      <p>The crown is missplaced in all examples.</p>
      <p>The margin kerning needs to be corrected.</p>
      <p>And the leading is not harmonically balanced likewise.</p>
      <p>In your third example he is too tight now.</p>
      <p>And somehow you arbitrary choose the point sizes and the capital and small letters in the beginning of the words.</p>
