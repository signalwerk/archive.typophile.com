    html: <p>I don’t know about possible legal restrictions, but I would advise against using a brand name that is already taken for your typeface, simply for reasons of practicality. When, as a potential customer, you search the internet for ‘Maiola’, ‘Gentium’ or ‘Grotext’, the typefaces come up as the first or one of the first results (at least for me on google.com). For ‘More’, ‘Scala’ or ‘Utopia’, that’s not the case. I’m not saying that the latter are bad typeface names (because you can always add ‘font’ to your query and get to what you want). I just think that it’s an added benefit if your typeface can have a name that’s both memorable, easy to pronounce in many languages and (relatively) unique. Before settling for something suboptimal, I would first try to explore if you can find a name that satisfies these requirements.</p>
