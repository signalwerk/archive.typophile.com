      <p>A common name like apple can co-exist as a Beatles record company and a Steve Jobs computer company. But for a name with strong established associations you might have problems. For example I would avoid a font name like Disney. The safest course is a neologism like the ones that flood corporate identities, such as Exxon -- create your own, don't use this one. Or do a compound that differentiates your product from an established coffee brand, like VerdeBlueMountain. Try to stand out and be memorable, like VerdeJavaJolt or Verdeccino -- a wordplay on cappuccino.<br>
      Don</p>
