    html: |-
      <p>Picking a name is hard, sometimes very hard. Pick an interesting and perhaps unusual word, then try variations on it as a possibility. Look at the typeface and think about it; does it bring an image to mind that would be useful in naming it, a word or words that kind of describe the feel of it? Sometimes it can take days or even weeks to come up with a name you are happy with.</p>
      <p>Just try to make sure it doesn't mean something ridiculous or offensive in another language. It also doesn't help much if it sounds like a medication or medical condition. Avoid words that can be associated with historical figures or places that have a very bad reputation; Hitler Bold, for instance.</p>
      <p>Your example of Prius is something to think about. Prius is a Latin word meaning "before". Since you are not building cars and offering them for sale to the public I believe that since it is a normal word you could use it as it is for fonts. </p>
      <p>You could call it a name like "Impala", for instance, and General Motors wouldn't likely complain because an impala is also an animal. Whatever you call it, if it is or sounds like a known trademark then tack on a descriptor such as Regular to it to make it more unique. </p>
      <p>Unless you are a large company with a lot of money the most trouble you would get into is receiving a letter from Toyota's law firm demanding that you stop using the name "Prius Regular" for your fonts. They will not appear in person at your door to put you in handcuffs.</p>
      <p>All that being said, I am not a lawyer, merely someone like you who has to come up with good names to use. Also like you, I don't go out of my way to invite trouble. Just use common sense and you'll be fine.</p>
