    <p>Hello everyone! I'm trying to come up with a good name for a typeface and in fact I was kinda set with one which I checked there was no released font using it. BUT, the name exists for an instant-coffee brand. I'm unsure if I can or cannot use this name in a typeface design. Trying to think about it using car names, I tend to think it's not allowed (like, releasing Prius sans, for example) but I couldn't find any precise info about this.</p>
    <p>What do you think?</p>
    <p>Gabriel</p>
  html_clean: |-
    <p>Hello everyone! I'm trying to come up with a good name for a typeface and in fact I was kinda set with one which I checked there was no released font using it. BUT, the name exists for an instant-coffee brand. I'm unsure if I can or cannot use this name in a typeface design. Trying to think about it using car names, I tend to think it's not allowed (like, releasing Prius sans, for example) but I couldn't find any precise info about this.</p>
    <p>What do you think?</p>
    <p>Gabriel</p>
