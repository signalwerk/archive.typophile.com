    html: |-
      <div class="comment-spam-body"><p>Thanks for sharing the info on Mads Freund Brunse. I find his custom typeface fits together well and is more attractive than most reverse contrast fonts. I don't know whether it was intended to evoke the rhythms of boogie-woogie music but the letters seem to suggest a bouncy theme without resorting to an irregular baseline.<br>
      Are any more letters available for viewing?<br>
      Don</p>
      </div>
