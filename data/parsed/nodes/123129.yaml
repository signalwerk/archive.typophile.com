      <div class="comment-spam-body"><p>This is "inverted contrast" or "reverse contrast" lettering.<br>
      Didn't find this as a font but still looking.<br>
      A less extreme similar font: Signo <a href="http://www.myfonts.com/fonts/r-type/signo/" title="http://www.myfonts.com/fonts/r-type/signo/">http://www.myfonts.com/fonts/r-type/signo/</a><br>
      The best known reverse contrast font is Antique Olive <a href="http://www.myfonts.com/fonts/linotype/antique-olive/" title="http://www.myfonts.com/fonts/linotype/antique-olive/">http://www.myfonts.com/fonts/linotype/antique-olive/</a><br>
      Some that are more extreme: ITC Zipper <a href="http://www.myfonts.com/fonts/itc/zipper/" title="http://www.myfonts.com/fonts/itc/zipper/">http://www.myfonts.com/fonts/itc/zipper/</a><br>
      Stretto <a href="http://www.myfonts.com/fonts/canadatype/stretto/" title="http://www.myfonts.com/fonts/canadatype/stretto/">http://www.myfonts.com/fonts/canadatype/stretto/</a><br>
      Don</p>
      </div>
