    <p>Born: Schorndorf, 1968. </p>
    <p>Education<br>
    He studied Graphic Design at the Staatliche Akademie der Bildenden Künste in Stuttgart. </p>
    <p>Career<br>
    February 1994: Founded the group “Lahm” dedicated to experimental book design.<br>
    1995: Published FF Trombo with FontFont.</p>
