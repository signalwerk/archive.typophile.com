    html: |-
      <p>Initially, we had hoped that Apple's announcement of Lion "available in Summer" would mean late August. So far, no Mac OS X version was released in July and <a href="http://en.wikipedia.org/wiki/Mac_OS_X#Versions" title="http://en.wikipedia.org/wiki/Mac_OS_X#Versions">http://en.wikipedia.org/wiki/Mac_OS_X#Versions</a> shows that "Summer" in the past was indeed late August. But as you know, even weeks before release, Apple only said "in July". No precise release date announced. I hope you'll understand that we could not predict that date either, and if even Apple doesn't fix their release dates, same can apply to independent developers such as Fontlab Ltd. </p>
      <p>But please be assured that we're seriously committed to releasing FontLab Studio 5.1 as soon as possible. Given the conditions, I can say that it's likely that we'll post a beta build publicly as soon as it's stable enough for people to run. </p>
      <p>Even now with the current beta 1 (build 4204), the most testers are generally happy with the application, and they say it's more stable than 5.0.4. However, there are still a few open issues where the actual functionally doesn't work at all as intended. Those are being actively worked on, so it's very likely that next week or the week after, all the users who need a workable version of FontLab Studio running on Lion will have one. It will be initially branded "beta" because some (rarely used) aspects may not work as they should, but the vast majority of the functionality will be working as good as in 5.0.4 or actually better. </p>
      <p>So — it's true that we missed our intended deadline of July with the public release, but at least there is a build right now which is "mostly workable" and my expectations are that next week we'll have a version that is workable. Further builds will follow, and after the initial 5.1.0 release I'm sure there will be several bugfix releases. So in a way, one could say that FontLab Studio 5.1 has sort of arrived in July 2011, but not quite yet. :/</p>
      <p>The ultimate goal is that in a few months, we'll have a "final final" FontLab Studio 5.x for Mac OS X which will not only be "Lion compatible" but will actually be significantly better than the current 5.0.4 version. It'll be a free update to all FontLab Studio 5 users, and, apart from lots of bugfixes, it'll have several noteworthy feature improvements: </p>
      <p>* First of all, the application is, in general, much faster. Action Sets run approx. 2.5 times faster in 5.1 than in 5.0.4, running on Mac OS 10.6.8. </p>
      <p>* FontLab Studio 5.1 has no longer the 6,400 glyph limit. It allows you to open, save and generate fonts with up to 65,535 glyphs.</p>
      <p>* Adobe FDK for OpenType version 2.5 is integrated in 5.1 (as opposed to 1.6 in 5.0.4). This means that you can use mark attachment or "sub fi by f i" type of statements, as well as "script DFLT" etc. Due to this change, you need to add the "languagesystem" statements in the lower-right portion of the OpenType panel, as in:<br>
      <code>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br>
      languagesystem latn TRK;<br>
      languagesystem cyrl dflt;<br>
      languagesystem cyrl SRB;</code></p>
      <p>* "Clean up paths" algorithm from Fontographer is integrated. In beta 1 (build 4204) it's only available through the Action / Action Set dialogs (in the Contour group of the dialogs as "CleanUp"). This algorithm is not MM-compatible, unlike "Optimize". For single-master fonts, however, it will deliver different, sometimes better, results, from "Optimize". We plan to add it directly into the Contour menu in a later build.</p>
      <p>* In the TrueType Hinting / TrueType Preview panel, the little chequer icon lets you switch between additional rasterizers. The list of those rasterizers is subject to change, but one highlight is the addition of the native Microsoft rasterizers. The MS B&amp;W rasterizer is the same as used in the black-and-white Windows rendering mode. The MS Grayscale rasterizer is the same as used in the grayscale rendering mode. Note that those rasterization modes are not yet sensitive to the "gasp" table settings in Font Info, though this may change. The rasterizers (especially the MS ones) run much faster so any changes to the manual TrueType hinting are instantly visible.</p>
      <p>Regarding Python integration, there are some improvements but also caveats: </p>
      <p>* Build 4204 integrates with Python 2.5 (on Mac OS X 10.5, 10.6, 10.7). FLS 5.0.4 integrated with Python 2.3. Therefore, some of your macros may not work if they relied on Python packages installed into /Library/Python/2.3/site-packages. Please re-install them into /Library/Python/2.3/site-packages. However, this is likely to change. Future builds of FLS 5.1 will probably link to the "Current" Python framework on each OS, which is 2.5 on OS X 10.5, 2.6 on 10.6, 2.7 on 10.7.</p>
      <p>* Python packages that rely on extensions written in C (such as RMX tools version 1.6 or the macros that ship with standalone AFDKO 2.5) will or may not currently work because they were built for an older Python version, and possibly were compiled only for PPC, while FLS 5.1 is 32-bit Intel (i386 architecture). This will need to be addressed by authors of the packages. </p>
      <p>Regards,<br>
      Adam</p>
