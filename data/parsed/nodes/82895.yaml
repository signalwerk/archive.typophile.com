post:
  id: 82895
  user: 1133
  date: 2011-06-08T13:27:00
  date_raw: 8 Jun 2011 — 1:27pm
  votes: null
  html: |-
    <p>We are pleased to announce that Fontlab Ltd. will release an <em>Intel-native</em> <strong>FontLab Studio 5.1</strong> for Mac OS X in <strong>July 2011</strong>. Currently, the application is undergoing internal testing, and beta versions will be issued to selected testers within the next week. </p>
    <p>FontLab Studio 5.1 will be mainly a bugfix release and will be available <strong>free of charge</strong> to all users of FontLab Studio 5. It will not introduce new features but because it's <strong>Intel-native</strong>, users on Intel Macs will experience a significant increase in speed (up to 2.5x faster) and stability. Users who upgrade to Mac OS X 10.7 Lion will secure an uninterrupted workflow. </p>
    <p>Following the release of FontLab Studio 5.1, Fontlab Ltd. will publish <strong>TypeTool 3.1</strong> for Mac OS X, a free update for all users of the popular TypeTool 3 font editor. This update will also make the application Intel-native. </p>
    <p>Later this year, Fontlab Ltd. will introduce <strong>FontLab Studio 6</strong> (for both Mac OS X and Windows) which will include a number of further improvements and several interesting new features.</p>
    <p>Below is a small screenshot showing a development build of FontLab Studio 5.1 running as a Intel-native Mac application:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/fls51scr_6008.png"></div><p></p>
    <p>Stay tuned for more news from Fontlab Ltd.!</p>
    <p>Best regards,<br>
    Adam Twardoch<br>
    Fontlab Ltd.</p>
