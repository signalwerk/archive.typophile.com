    html: |-
      <p>San Serif<br>
      You may find this hard to believe - but I could not live without Helvetica. All weights, condensed, extended... I just couldn't.<br>
      I love Today, Formata and Fruitger. Lately, I've been impressed what DIN can do. And I tend to you a lot of Classico URW (It has more weights then what the big manufacturers sell for Optima - and you can get 3 to 5 more characters on the line in the same point size.)</p>
      <p>Serif<br>
      Tough call - there are so many beautiful ones - but my #1 will always be Goudy. I just love that face and it's design. Love the little diamond bullets and punctuation (the real stuff guys - not what Linotype, Adobe. etc. did to it). It's old but always so fresh.<br>
      One's I need for the Westerns I do - are Slab Serifs mostly. Lubalin, Memphis but also Claredon and oh my, Cheltenham and Garamond. None of those are my favorites, but I'd lose a lot of work if I didn't have them. (Also Eurostile, but that's san serif - and as you can see - I won't mention it as one I can't live without.)</p>
      <p>Scripts<br>
      I have really come to love the American Script-type that Rob Leuschke has developed. They are beautiful. I wish I could afford them all. I even entered his contest to name the latest one last year... hoping... lol. Because of Leuschke - I then became familiar with Sudtipos - and they have some very interesting scripts as well - especially Ministry. For invitation to a wedding - Stuyvesant still holds up. (It was my favorite engraving face when I worked in fine stationery and engraving, too many years ago.) I am not fond of formal scripts, because I tend not to need any in the design work I receive. However, if I were to keep a few around - I'd use Edwardian, BIckham and Snells. (Park, Murray Hill, Commercial -- even French - they just don't appeal</p>
      <p>Display faces<br>
      House Industries - I want the entire library -- LOL -- okay, for this year and probably next. Great fun faces -<br>
      There are many others - but I was always taught to keep an open mind and make sure to "marry" the type to the artwork. So I wouldn't want to limit myself to a few...</p>
      <p>Thank you for letting me go on -- of course, these are my personal preferences, along with some work ethics -- and... only my opinion.</p>
      <p>Like your wardrobe - it depend on how you feel when you get up, or what the occasion is to dress for - before you decide on your clothes. Same holds true for type.</p>
