    <p>It is quite clear that one can go quite insane over typefaces...all these interpretations and re-interpretations...does it ever end? </p>
    <p>So, in the light of all this., her is my own, personal, definitive list of faces. I am screwing my eyes wide shut for responses.....</p>
    <p>Sans serif<br>
    Highlander. Legacy Sans. Gill Sans. Bernhard Gothic. Futura. Optima</p>
    <p>Serif</p>
    <p>Garamond (Augereau). Galliard CC. LTC Goudy Oldstyle. LTC Kennerley.Plantin. Bembo Book (that new version of the abortive early digitization, hopefully consigned to the dustbin or the Museum of Horror Faces), Zapf Renaissance, Baskerville 1757. Walbaum (Storm).</p>
    <p>Yes, of course, I love others, but these are the ones I feel I have to have in my library.</p>
