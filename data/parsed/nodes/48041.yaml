    <p>I am working on this logo, and I am having a bit of a hard time.  I looked at fonts for inspiration, and Alleghieri had some interesting swashes, that inspired the box look.  I used that font for the first three, but it looks too amateurish and dirty to me, especially for a photographer (since one would hope to convey crisp clean imagery).</p>
    <p>I still liked the idea of the “L” and “k” making a box, so I modified Bernhard Fashion.  I started to really like where it was going at that point.  This is a chronologically numbered grid of where I am currently at, with the last one being my final attempt thus far.</p>
    <p>To add insult to injury, the client likes the first three, which I now can’t stand.</p>
    <p>Ugh.  Any helpful comments appreciated. </p><div class="imageWrap"><img src="/files/LS_Logo_5070.jpg"></div><p></p>
