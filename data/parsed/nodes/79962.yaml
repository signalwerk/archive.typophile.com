      <p>Dear Chiranit,</p>
      <p>The font you are looking for is <a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?productid=669040" rel="nofollow">Neo Sans Intel</a>, a customized version of <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/neo-sans/" rel="nofollow">Neo Sans</a> which is was designed by <a class="freelinking external" href="http://www.seblester.co.uk/" rel="nofollow">Sebastian Lester</a> for the Intel Corporation. </p>
      <p>Regards,<br>
      SB</p>
