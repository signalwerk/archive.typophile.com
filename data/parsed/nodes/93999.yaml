    html: |-
      <p>While that could be a typeface, it could also have been drawn. You could just create it yourself in Illustrator using art brushes if you don't need a lot of characters. I whipped one up in about 10 minutes using some nice shapes I found on deviantart.com. I then converted a few of them to art brushes and simply changed the stroke size of each stroke where necessary.</p>
      <p>Here it is for you to download from my personal server:<br>
      <a href="https://s3.amazonaws.com/scottdarispublic/live-color-fully-brushes.eps.zip" title="https://s3.amazonaws.com/scottdarispublic/live-color-fully-brushes.eps.zip">https://s3.amazonaws.com/scottdarispublic/live-color-fully-brushes.eps.zip</a></p>
      <p>Enjoy :)</p>
