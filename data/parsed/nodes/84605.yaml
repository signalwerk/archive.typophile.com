    html: <p>It's a bit too modular/linear and not styled enough for my liking. The letters need to be individual and unified somehow. Here they seem to be using repeated parts in unharmonious arrangements. For instance the counters of /a/ seem wide next to the /b/ because it's a different shape and needs compensation as the counter isn't as tall.</p>
