    html: |-
      <p>Hi!<br>
      The FontLab grid corresponds directly to the grid in Illustrator. It is a good start to set up an Illustrator document measuring at least 1000 × 1000 pt, and setting the origin point on the bottom left.<br>
      Then you can paste with predictable results.</p>
      <p>Your problem: the glyph you’re drawing in AI might either be too small for FL, or just way below the baseline (as originally, the origin in AI is on the top left.)</p>
