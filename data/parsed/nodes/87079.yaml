    html: <p>Déborah, você não está colando/editando a máscara? Experimenta trocar entre as camadas de contorno e máscara com Ctrl+H. A máscara não é exibida na janela da fonte porque funciona apenas como referência para a edição. Já a tarja preta sinaliza que aquele caractere foi editado desde o último salvamento.</p>
