    date: 2012-09-10T15:08:00
    date_raw: 10 Sep 2012 — 3:08pm
    votes: null
    html: "<p>I’m not familiar with VTT, but if you hint the x-direction in Fontlab (perhaps since it only operates with full pixels) you’re putting serious constraints on the Cleartype rendering, not to mention adding a lot of weight to the file size. Cleartype can use the subpixels, but won’t if you lock the stem edge to pixel edge and hint its width to a rounded # of pixels. In effect: huge uncomfortable jumps from one to two to three pixel stems, whereas with only y-direction hinting the weight gain is more fluid.</p>"
