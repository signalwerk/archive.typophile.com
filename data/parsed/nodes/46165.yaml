    <p>Hi everyone.</p>
    <p>I'm designing a poster for an upcoming play which takes place in New York. I came up with something that was an homage to Saul Bass. The director liked it, but he was worried that it looked too old-school since the play is set in modern-day New York.</p>
    <p>So my question - do you have any examples of designs or styles that would convey "modern-day New York"?</p>
    <p> - Lex</p>
