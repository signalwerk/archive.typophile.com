    date_raw: 7 Jun 2008 — 11:00am
    votes: null
    html: <p>I don't live in New York, and the most time I have spent there was 4 months. But, I can say the thing about New York, from my outsider's perspective, is that it will probably always have old world charm. I mean, think about Woody Allen. He makes movies based on that mystique. No?</p>
  - id: 282985
