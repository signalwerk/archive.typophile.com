    votes: null
    html: |-
      <p>That's interesting Miss Tiff...the Windsor Light Condensed (now available from Bitstream) Woody Allen has used since the 1970s has become iconic because he used them, it seems to me; at the time the choice seemed to us rather arbitrary, just a popular typositor display face that went with the Dixieland soundtrack with him playing on it.</p>
      <p>We don't know more about the subject matter here, so let me note three ways to go, depending on that subject matter:</p>
      <p>--distressed or grunge type, suggesting graffiti or faded wall ads; there are tons of those about, many of them free downloads (just put "free fonts" in this site's search window and you'll get a fabulous vetted list of free download sites). Among the pay fonts are DF Forge and Battery Park, both from Veer</p>
      <p>--deco or moderne fonts like Mostra, Binner Gothic, Romeo, Huxley Vertical, Bernhard Gothic (best from Spiece Graphics), various takes on Johnston, Neutraface, and Burin Sans. Nick Curtis has marvelous deco/moderne faces for little or no money; check them at MyFonts or the Nick Curtis download site listed on our free fonts resource page.</p>
      <p>--Donald Trump piss-elegant, like Trajan and related high-society Charlotte York looks</p>
