    <p><a href="http://www.peterb.sk/content_items/euroface.html" title="http://www.peterb.sk/content_items/euroface.html">http://www.peterb.sk/content_items/euroface.html</a></p>
    <p>“<em> In 1994, the members of European Parliament urged the creation of a new comprehensive road typeface system, the development of a ‘general high recognition and perception font’, and recommended adoption of uniform design practices. Now, after five years of extensive research, the European Committee for Uniformity of Type Design and Type Safety completed the research and presented legible-for-all-purposes-suitable-typeface. The typeface, named Euroface, was developed and studied through extensive design exercises, laboratory investigation and road tests. The result is convincing: Euroface is 42% more legible than Helvetica</em>”</p>
    <p>42% More legible than Helvetica? Oh my. </p>
    <p>I’d like to find a sample of it.</p>
    <p>That may not be so easy though.</p>
    <p><a href="http://www.a-g-i.org/magazine/news_detail.php?id=252&amp;cat=" title="http://www.a-g-i.org/magazine/news_detail.php?id=252&amp;cat=">http://www.a-g-i.org/magazine/news_detail.php?id=252&amp;cat=</a></p>
    <p>“<em>A German attempt to create one ’Euroface’ for the European road signs scored astonishingly high in legibility tests. However, until today the typeface has remained hidden in bureaucratic drawers despite its supposedly magical qualities.</em>”</p>
    <p>Russ</p>
