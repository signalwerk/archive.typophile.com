  html: |-
    <p>We've just released our latest (Ok, months overdue!) edition of SlowPrint: the nEwsletter!<br>
    Please scoot on over to <a href="http://slowprint.com" title="http://slowprint.com">http://slowprint.com</a> and click on the 'sign-up' link!<br>
    This issue discusses the production of some recent work, updates to the SlowPrint Studio toy box, and gives a short opinion on the web fonts discussion (well, not like you haven't heard enough about that ;-)</p>
    <p>Slow Print Studio (nee Exquisite Letterpress) is a typographic letterpress shop, dedicated to the finest possible impression of the typographic letter. We're completely digital, but also hand-tune every PDF* for perfect letterpress reproduction, adding stroke weight to glyphs, adjusting spacing of mouse-type, etc. *(in consultation with the designer of course!)</p>
    <p>Thanks for great designs, comments and ideas from Typophilistas!<br>
    Keep them coming!</p>
    <p>Peter</p>
