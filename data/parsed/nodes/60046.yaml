      <p>Hi TIffany!</p>
      <p>How's this!?<br>
      The final folded size of this cover is about 3x5 inches.<br>
      These shots are straight from the press sheet, of course ;-)<br>
      Printed on Hahnemuhle Copperplate Etching Warm White 300gsm, on the 10x15 Heidelberg Windmill.</p>
      <p>Adobe Caslon flowers (arranged by yrs truly) with a illustrated "E" from an ex officina Plantiniana edition of <a href="http://openlibrary.org/b/OL17989416M/C.-Cornelii-Taciti-Opera-qvae-exstant" rel="nofollow">"C. Cornelii Taciti Opera qvae exstant" </a>in our library.</p>
