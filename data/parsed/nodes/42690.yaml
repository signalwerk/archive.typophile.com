  html: |-
    <p>Finally got some photos developed. These were taken in a small Northern English town.</p>
    <p>This first one puzzles me, how can an old street be unadopted? The street sign was on a wall of a pretty old building. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/unadopted_l_4345.jpg"></div><p></p>
    <p>This old shop sign was on a wall of a side street building. Got some funny looks when I took the photo.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Emu_1_5476.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Emu_2_5661.jpg"></div><p></p>
    <p>This one is from Milan: Fonts galore in Corso Buenos Aires</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/signs_Milan_5104.jpg"></div><p></p>
