    <p><strong>A Calligrapher's Journey<br>
    A Lecture presented by The Society of Scribes</strong></p>
    <p><strong>Tuesday, October 16th, 2007<br>
    6:00 pm<br>
    Donnell Library Center (NYPL)<br>
    20 West 53rd Street, 2nd Floor<br>
    New York, NY 10019-6185</strong></p>
    <p>Bob Boyajian, a prominent New York calligrapher for forty years, discusses his career in calligraphy. A sampling of his work can be seen at <a href="http://bobboyajian.com/" rel="nofollow">www.bobboyajian.com</a>. The lecture is in conjuction with the Society of Scribes exhibit, on display at Donnell from September 5th to October 31st.</p>
    <p>All New York Public Library programs are free of charge.</p>
    <p>More info:</p>
    <p><a href="http://www.societyofscribes.org/upcoming.htm#07members" rel="nofollow">The Society of Scribes</a><br>
    <a href="http://www.nypl.org/branch/central/dlc/" rel="nofollow">New York Public Library: Donnell Library Center</a></p>
    <p>(P.S. I submitted this item to General Discussions because I was not allowed to post in the News section.)</p>
