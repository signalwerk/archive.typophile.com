    html: |-
      <p>In my experience, this is simply a stupid FontLab trick. To fix it, simply make sure that the Ascender and Descender (as a positive number) values equal 1,000. I am not certain, but I think that this bit of Wizard Math is one of the few things that DTL OTMaster actually does.</p>
      <p>Speaking of DTL, any word on Kernmaster 2012? Not that it matters, but I do have a FREE upgrade coming…</p>
