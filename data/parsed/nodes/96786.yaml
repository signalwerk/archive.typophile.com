      <p>Dear typographers and designers,</p>
      <p>I have a problem when I generate my designed fonts as (Open Type: OTF) from the FontLab Version 5.0 I do have this message:<br>
      "WARNING: The feature file OS/2 overrides TypoAscender and TypoDescender do not sum to the font bbox size!" The photo of this warning is attached.<br>
      What could be the reasons behind this message and how could I solve this problem and get rid of it?</p>
      <p>Thank you ..</p>
