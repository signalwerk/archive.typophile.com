    html: "<p>I think that mono weight 'stroke types' are fun. The real trick is when you start to optically adjust the strokes. Forrest mentioned the thick joins on the M and the W, which are good examples of letters where you need some optical trickery to make it feel even. You will need to adjust most of the other joins as well before you'll be done. One good exercise is to make some bold characters, and start to play with how the letters wear the extra weight. As the strokes get wider, some of the optical problems will become more apparent. <br> <br>Of course, the spacing needs work. It looks like you've got too much tracking in there to compensate for the uneven spacing. The best way to figure it out is to look at the spacing in other similar types, and plain old trial and error, but here are some things I've figured out: The more open the side of a letter, the less space it gets. For example, the right side-bearing of the 'r' gets very little (almost none). The left side-bearing of the h, should have more. The right side-bearing of the c, in this type is very open, so it should have more space. Curved sides (like o's) should have a smaller space than straight sides (like h's). Etc, etc.</p>"
