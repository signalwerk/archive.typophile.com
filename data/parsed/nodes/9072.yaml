    html: "<p>Not so much a crit, but a general comment: I like it. It's very stripped down but has just enough character that it isn't dull or blunt. From an on-screen glance, it looks very even.</p>"
    html_clean: "<p>Not so much a crit, but a general comment: I like it. It's very stripped down but has just enough character that it isn't dull or blunt. From an on-screen glance, it looks very even.</p>"
  - id: 59125
    user: 5605
    date: 2005-02-05T00:51:00
    date_raw: 5 Feb 2005 — 12:51am
    votes: null
    html: <p>The M and the W are interesting but the middle join feels too wide. <br> <br>The bowl of the g feels disproportionately large next to the tail. <br> <br>I like the curved leg of the k. I also like the chiseled tops on A, N, and Z. <br> <br>Right now the ratio of letter spacing to word spacing makes the text a little hard to follow. This may be a function of the face being light; I don't know. <br> <br>Overall, I like its simplicity, but it needs tweaking to harmonize the whole alphabet (the Q, which I otherwise like, sticks out of the face, as does the k). With a little work, it would be characterless enough to make a good sans body text.</p>
