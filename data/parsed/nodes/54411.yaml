    html: |-
      <p>The one thing he neglects is the series of five or more dots alone in a word balloon, sometimes accompanied by punctuation or a breath syllable. It is not an ellipsis, which he does cover. This is more of a tradition in Japanese comics, indicating a speechless hesitation with ambiguous meaning. Since this is a guide for comic letterers, this might be an important addition, considering the volume of translations that are published these days (and the domestic writers that are influenced by them) that they might be called to work on.</p>
      <p>He makes a good point about the use of the crossbar "I", which is something to consider in developing a comic lettering font.</p>
