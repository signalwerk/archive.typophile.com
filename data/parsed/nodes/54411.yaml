  html: <p>Blambot (apparently a member here; <a href="http://typophile.com/node/21084" rel="nofollow">previous discussion</a>) published an entire guide to <a href="http://www.blambot.com/grammar.shtml" rel="nofollow">Comics Grammar &amp; Tradition</a> that seems almost as rigorous as the BMW style manual. (Actual author credit is Nate Piekos.) Who knew there were so many rules about italics (actually obliques)?</p>
  html_clean: <p>Blambot (apparently a member here; <a href="/node/21084/" rel="nofollow" class="link-kept">previous discussion</a>) published an entire guide to <a href="http://www.blambot.com/grammar.shtml" rel="nofollow" class="link-external">Comics Grammar &amp; Tradition</a> that seems almost as rigorous as the BMW style manual. (Actual author credit is Nate Piekos.) Who knew there were so many rules about italics (actually obliques)?</p>
