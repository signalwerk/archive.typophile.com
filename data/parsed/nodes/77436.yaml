      <p>It does look good, but you might (also) make a version with slightly softer shapes. Sommet has quite warm comfortable shapes, and Sommet serif is really sharp and agressive. The contrast might work when used properly, but it takes more typographic skills. Could upload a picture of Sommet and Sommet Serif next to each other?</p>
      <p>Don't take my comments to seriously. I'm only a starting typedesigner and on itself, this looks awesome!</p>
      <p>For text use I think the ear of the g might be a little to small and the eye a little to large. Your pdf's always look stunning btw!</p>
      <p>A bit off topic, but did you design all the different eagles for the Aviano family yourself? They are really beautiful!</p>
      <p>Cheers, Jasper</p>
