      <p>Even more of a complete amateur here (a mere enthusiast), so feel free to completely disregard this.</p>
      <p>I think it looks good, but I looked at this a couple of days ago, and the /a/ really stood out to me. I came back, and still noticed it straight away. To me, compared to Sommet Slab the /a/ seems a bit aggressive, especially in bold. In the slab it seems softer. That may be what you're going for anyway, or it may just be the way I perceive it - but as it stuck with me I thought I'd mention it, for what it's worth!</p>
