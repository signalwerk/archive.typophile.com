    <p>27.1.14<br>
    <strong>New release by G-Type: Precious Sans Two.</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PrecSans2_600px_5336.png"></div><p></p>
    <p>G-Type’s first new font release of 2014 is actually a major reworking of an old one, Precious Sans, which originally appeared back in 2002. The new family is called Precious Sans Two, available from <a href="http://www.g-type.com" title="www.g-type.com">www.g-type.com</a> with a 50% discount until the end of January, then with 25% off the standard price until Feb 28th 2014.</p>
    <p>Over a decade after it’s first appearance G-Type’s Nick Cooke decided the time was right to re-appraise the typeface, scrutinise the old letterforms and make some important enhancements. </p>
    <p>Make no mistake though, <a class="freelinking external" href="http://www.g-type.com/precious-sans-two-font" rel="nofollow">Precious Sans Two</a> is no rudimentary re-release; nearly every character has been redrawn, re-proportioned, respaced and generally improved.</p>
    <p><strong>Improvements:</strong></p>
    <p>The original Precious Sans was well received at the time but certain quirkier characteristics, the extended lower case ‘f’ for instance, or the binocular ‘g’, were perhaps too prominent and a little distracting. Short terminals on the ‘a’ and ‘s’ also made the first Precious incarnation less appealing when used as body text. Second time around the major overhaul has not only addressed the shortcomings of the original but made huge improvements right across the board:</p>
    <p>• enhanced legibility and suitability for text use<br>
    • more streamlined range of 6 weights; Thin to Black plus matching italics<br>
    • cross platform compatible OpenType OTF format<br>
    • proportional and tabular figures<br>
    • extended language support<br>
    • small caps, accented small caps &amp; related case sensitive forms<br>
    • extra stylistic set containing the original quirkier I, f &amp; g alternate glyphs<br>
    • extensive suite of discretionary ligatures<br>
    • 20 directional single and double arrows in each of the six weights </p>
    <p><a class="freelinking external" href="http://www.g-type.com/precious-sans-two-font" rel="nofollow">Precious Sans Two</a> is a crisp and distinctively modern typeface, well equipped for advanced typographic use in print, web and digital publishing environments. </p>
    <p>Visit <a href="http://www.g-type.com/precious-sans-two-font" title="www.g-type.com/precious-sans-two-font">www.g-type.com/precious-sans-two-font</a> to test drive &amp; buy the fonts, or email <a href="mailto:info@g-type.com">info@g-type.com</a> to discuss specific licensing terms.</p>
