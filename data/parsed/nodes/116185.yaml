    html: <p>Hi Tannathan! I think you made the right choice by including your name in the logotype. A logo's most important quality is that is has to be legible, and your first logo you showed us acted more as an abstract logomark. I would suggest making the logotype larger since the type is always more important than the mark for communication unless you're a major brand like McDonalds or Starbucks. I think the mark would look nice if it was 1/3 to 1/2 the size of the type.</p>
