    html: |-
      <p>This is a phenomenon called stitching and can often be seen in Acrobat if you have smoothing turned on in Preferences. Even with a PDF X1-A. Turn off smoothing, it goes away. I have heard of very few instances of these lines printing…<br>
      peace</p>
    html_clean: |-
      <p>This is a phenomenon called stitching and can often be seen in Acrobat if you have smoothing turned on in Preferences. Even with a PDF X1-A. Turn off smoothing, it goes away. I have heard of very few instances of these lines printing…<br>
      peace</p>
