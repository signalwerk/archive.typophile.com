    html: <p>I would use Gotham. Although Leviathan is a gothic, and Gotham is more of a geometric, I really think that Gotham would compliment it. This is breaking my own rules, but you only live once. And besides, they are both by <a href="http://www.typography.com/" target="_blank">Hoefler Type Foundry</a> so how could you go wrong?</p>
