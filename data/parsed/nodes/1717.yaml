    date: 2003-10-23T16:37:00
    date_raw: 23 Oct 2003 — 4:37pm
    votes: null
    html: <p>Wow -- some really great suggestions here. Not only have I been exposed to some fantastic new faces and foundries, but I'm reconsidering the Leviathan pairing all together. <br> <br>Daniel -- John Sans is BRILLIANT, as are the faces from Terminal. Their quality is immediately evident upon viewing. <br> <br>I also found a face called Lux Sans at Thirstype which has a nice feel. Feedback on this faces' quality would be appreciated. <br> <br>So my shortlist is as follows (in no particular order), but funnily I'm still hanging on to Base 12 Sans (my first instinct) because of it's character and small caps as well  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Base 12,    Emigre <br>John Sans,    Storm <br>ClearviewOne,    Terminal <br>Giacamo,    Terminal <br>TheSans*,    Fontfabrik <br>Lux Sans,    Thirstype <br> <br>I've ruled out Tarzana and Fedra Sans due to certain idiosyncrasies. <br> <br>*Is there anywhere online where one can actually set/testdrive Fontfabrik typefaces with one's own text sample? I'm able to do this will all the other faces above at various sites. It's nice to be able to see the same words in context when comparing faces. <br> <br> -t</p>
    html_clean: <p>Wow -- some really great suggestions here. Not only have I been exposed to some fantastic new faces and foundries, but I'm reconsidering the Leviathan pairing all together. <br> <br>Daniel -- John Sans is BRILLIANT, as are the faces from Terminal. Their quality is immediately evident upon viewing. <br> <br>I also found a face called Lux Sans at Thirstype which has a nice feel. Feedback on this faces' quality would be appreciated. <br> <br>So my shortlist is as follows (in no particular order), but funnily I'm still hanging on to Base 12 Sans (my first instinct) because of it's character and small caps as well  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Base 12,    Emigre <br>John Sans,    Storm <br>ClearviewOne,    Terminal <br>Giacamo,    Terminal <br>TheSans*,    Fontfabrik <br>Lux Sans,    Thirstype <br> <br>I've ruled out Tarzana and Fedra Sans due to certain idiosyncrasies. <br> <br>*Is there anywhere online where one can actually set/testdrive Fontfabrik typefaces with one's own text sample? I'm able to do this will all the other faces above at various sites. It's nice to be able to see the same words in context when comparing faces. <br> <br> -t</p>
