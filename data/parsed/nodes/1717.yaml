  html: <p>Reposting (slightly modified) here as I had no response in General Discusions. <br> <br>I'm designing an identity and web site for a company who does downhill (cruiser) bicycle tours. I'm considering Leviathan Black Italic for the logotype and looking for some suggestions in regards to a face to pair with it. The personality should be friendly, fun, exciting, and somewhat informal yet professional. <br> <br>Initial thoughts are Base Twelve Sans or Optima.</p>
  html_clean: <p>Reposting (slightly modified) here as I had no response in General Discusions. <br> <br>I'm designing an identity and web site for a company who does downhill (cruiser) bicycle tours. I'm considering Leviathan Black Italic for the logotype and looking for some suggestions in regards to a face to pair with it. The personality should be friendly, fun, exciting, and somewhat informal yet professional. <br> <br>Initial thoughts are Base Twelve Sans or Optima.</p>
