    votes: null
    html: "<p>So the list grows... <br> <br>Daniel - I like Tarzana, it has many of the attributes I suggested. I also briefly looked at Triplex, but the italic (which I'll need) is a little too funky. <br> <br>Tiffany - Gotham is (of course) brilliant, but I feel it's too geometric for this gig. While it would pair nicely with Leviathan, it's personality is not quite right. <br> <br>I have the follwing in contention at present: Base 9 or 12 Sans, Optima, Tarzana, TheSans.  <br> <br>I'm going to check out some of Nick's offerings at <a href=\"http://www.shinntype.com/\">ShinnType</a> as well as Rian H's (<a href=\"http://devicefonts.co.uk\">Device</a>). More face and foundry suggestions are <i>more</i> than welcome. <br> <br></p>"
