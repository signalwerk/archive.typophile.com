    html: |-
      <p>It's most likely a freeware or reverse-engineered copy of Albertus mimicking the font used in the 60s TV show the Prisoner. From the <a href="http://www.faqs.org/faqs/tv/the-prisoner/part1/" rel="nofollow">Prisoner FAQ</a>:</p>
      <p><cite>The font used in _The Prisoner_ is a modified version of<br>
          "Albertus" (dots removed from "i" and "j", loop of "e" opened).</cite><br>
      ...</p>
      <p><cite> There are two freeware Albertus derivatives, both of which have<br>
          been modified Prisoner-style.  One is by Glenn Fleishman and is<br>
          called "Furioso"; the other is by Mark Heiman and is called<br>
          "Village".  Both are available via anonymous FTP from<br>
          dworkin.wustl.edu:/dist/prisoner.</cite></p>
