  html: <p>I know this has been done before, but this is my (second) attempt at a font that is all ligatures. <br> <br>Oh -- it's based on my Equanimity Stencil font except not stencillated. <br> <br><img src="http://www.typophile.com/forums/messages/29/1419.jpg" alt="equan"> <br> <br>It is, as you can see, in its earliest stages. So, do you guys think I'm wasting my time or is there something here worth pursuing?</p>
