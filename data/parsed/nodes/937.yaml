    date_raw: 28 May 2002 — 8:41am
    votes: null
    html: <p> If there's one lesson I've learned in fontmaking it's that imposing ONE schtick on your typeface -- whether it's a repeating shape or, in this case requiring every letter to be a ligature -- just guarantees failure. As the Arby's ad goes, sometimes you just have to break the rules, including self-imposed ones. <br> <br>I think for me, having this font work will require that the ligatures be optional, not recommended -- an added bonus, not a dreary requirement. By having three different connections I'd hoped to achieve something in that direction, but I don't think it worked. </p>
