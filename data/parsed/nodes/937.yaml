    html: <p>I did a similar experiment with a font called Motorcar Atlas. <a href="http://fontdiner.com/fdlbfont07.gif" target="_top">http://fontdiner.com/fdlbfont07.gif</a> <br> <br>I was overall pretty happy about the face until I began setting copy in it. I designed the face with connectors on BOTH sides of the lowercase so I doubled my pain when I was creating it. <br> <br>It was a good excersise and I do intend on reworking the face further to totally trouble shoot the workings of the ligature system and overall letterspacing of the font which will give to you most hassel as you can see with the IT ligature. It'll technically work properly, but visually have some odd moments. <br> <br>Can't wait to see the lowercase! Good Luck! <br>Stuart :D</p>
    html_clean: <p>I did a similar experiment with a font called Motorcar Atlas. <a href="http://fontdiner.com/fdlbfont07.gif" target="_top" class="link-external">http://fontdiner.com/fdlbfont07.gif</a> <br> <br>I was overall pretty happy about the face until I began setting copy in it. I designed the face with connectors on BOTH sides of the lowercase so I doubled my pain when I was creating it. <br> <br>It was a good excersise and I do intend on reworking the face further to totally trouble shoot the workings of the ligature system and overall letterspacing of the font which will give to you most hassel as you can see with the IT ligature. It'll technically work properly, but visually have some odd moments. <br> <br>Can't wait to see the lowercase! Good Luck! <br>Stuart :D</p>
  - id: 6917
