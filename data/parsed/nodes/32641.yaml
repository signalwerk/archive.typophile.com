    <p>Hi,</p>
    <p>I am looking for a typeface matching or similar in style to this record sleeve (the “Tomita” logo). I can’t really classify this, but think late 70s - early 80s sci-fi/pop, early electronic music...</p>
    <p>It must not necessarily be a 100% match, just in the same “mood” as this one.</p>
    <p>Cheers chaps!</p>
