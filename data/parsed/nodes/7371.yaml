  html: <p>Ok, here goes... <br> <br>I have an OT font with the "kern" feature defined and <br>class based kerning. The font and all of its related <br>kerning works fine in OSX. When I try to install <br>the font into ATM Deluxe 4.6 under Classic I receive <br>an error message saying the font cannot be activated. <br>If I delete the "kern" feature the font activates fine but <br>of course doesn't have kerning for any of my classes. <br> <br>What gives? <br>Clearly there is a work around as my Adobe OT fonts <br>activate and work under Classic. <br> <br>(The font in question was generated under OSX 10.3.5 with FL 4.6 <br>The "kern" feature contents are the result of using the "Apply <br>and Save" button under the OpenType Kerning Assistance) <br> <br>Thanks</p>
