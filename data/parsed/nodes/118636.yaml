      <p>I’m not angry, just a bit surprised :) Personally I think this could have been even more.<br>
      Spacing: What made me wonder is that in the sample above, the “o” looks like it’s shifted left – too tight on the left and/or loose on the right. And maybe the arches are a little loose? On MyFonts, it looks better, but even a “nnnnonnnn” or “nnninnnonnn” string looks still not entirely evenly spaced to me... And in the  specimen images, the smaller text (in the address of the solicitors) has a bunch of really strange pairs (“ng” loose, “il” tight…) Words like “Building” do not look great to me in the preview, either. I’m not sure if that can be the rendering, or maybe I’m misunderstanding something.</p>
