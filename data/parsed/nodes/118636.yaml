  - id: 586366
    user: 17347
    date: 2014-08-22T00:52:00
    date_raw: 22 Aug 2014 — 12:52am
    votes: null
    html: |-
      <p>no – not too vague. I see your point with the u. The general rule here is that a stroke flares towards the top. But the left side of the u (and the t!) have a bottom bow which usually is a place for a stress, too. A contradiction, sort of. I left it as it was because I think it works that way. I think the disturbance is minimal.</p>
      <p>Similar with a and g. Yes they are slightly overdone, a calculated twist within the framework of the whole set. Also the z is a bit overdone … I like it and, again, in testing with text those details did not seem to disturb readability.<br>
      Sorry to say that, but for now it’s too late for more changes. <a class="freelinking external" href="http://typophile.com/node/118915" rel="nofollow">It’s out.</a></p>
    html_clean: |-
