    html: |-
      <p>I use TextEdit for setting the examples, because it does very good and even font rendering (much better than InDesign!). But it has one shortcoming: in small sizes it does not always reproduce the spacing very good. Maybe I neglected this a bit … therefore some parts in the smaller lines appear to be a little odd. However, I would not say that there are really severe faults here, I would have seen them.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lindau_nom1_4357.png"></div><p></p>
      <p>This shows TextEdit (top) and Firefox (bottom). When viewed at such a size, I’d say this is OK. Nevertheless, at a closer look there is some unevenness in the spacing, but for some good reason:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lindau_nom2_4614.png"></div><p></p>
      <p>Because of the more narrow area at top right (of the o, red) there is a matching slight constriction on the left side. This should balance the wider parts around the o, which are distributet reversely.</p>
