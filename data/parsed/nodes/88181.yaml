    <p>I have teamed up with rummik (rummik.com) to make an online font editor called <a href="http://www.fontclod.com" rel="nofollow">Fontclod</a> (with a purposed typo of 'cloud'). Alpha 0 was released earlier today as a proof-of-concept, and includes placing, deleting, moving points, and basic save/load (copy/paste in the upper-right text-box).</p>
    <p><img src="http://www.fontclod.com/screenshots/alpha0.png"></p>
    <p>We want to develop it into a fully featured font editor, with optimization for mobile platforms like iPad. But to do so in a relatively short time frame, we need financial backing. At present, higher sums = higher priority on feature requests, but you can pledge any amount. Those who are willing to pledge sums of 150+ USD will also get free access for unlimited font hosting when this feature is implemented. There is a support button on the bottom right.</p>
    <p>To make the best editor possible, we need your input! If you have any features you would really like to see, or any misgivings about other font editors, please list them here! Also please feel free to use this as much as you can for testing, just let us know when you spot bugs! Feel free to discuss here.</p>
    <p>We plan on trying to have at least one release in any given work-week.</p>
    <p><strong>Some planned features of Fontclod:</strong><br>
    We plan to keep all the basic editing functions free<br>
    Multiple font editing<br>
    Interpolated editing tool (like interpolated nudge or Fontlab's interpolate function)<br>
    Importing and exporting to UFO<br>
    Most functions supported by UFO</p>
    <p><strong>What we don't plan on doing at this point:</strong><br>
    Non-cubic contours<br>
    Hinting<br>
    Bitmap fonts</p>
    <p>Right now we want to focus on basic editing functions, so we wont be doing importing or exporting to standard formats yet. The format is just a JSON representation of the internal data structure. If you would like to tackle a simple converter, please contact us.</p>
    <p>Soon we will be having some surveys to help us decide the best interface layouts. (You can tell us your opinion right now if you want.)</p>
    <p>If you would like to recieve updates on Fontclod, <a href="https://profiles.google.com/artistenator/" rel="nofollow">circle me on Google+</a>, I will be making announcements there. <a href="http://www.fontclod.com/text/changelog" rel="nofollow">A changelog</a> is available by clicking the version number at the top. (Which also includes known bugs, and contact information.)</p>
    <p><strong>Links:</strong><br>
    <a href="http://www.fontclod.com" rel="nofollow">Fontclod</a><br>
    <a href="https://profiles.google.com/artistenator/" rel="nofollow">Updates on Google+</a><br>
    <a href="http://www.fontclod.com/text/changelog" rel="nofollow">Changelog</a><br>
    <a href="http://www.fontclod.com/text/helpintro" rel="nofollow">Introduction to editing</a></p>
