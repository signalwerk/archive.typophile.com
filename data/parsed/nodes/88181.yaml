    html: |-
      <p>&gt; you guys should totally merge your project with Raph’s</p>
      <p>There is one problem with merging Fontclog and Fontly: licencing. Part of the framework Fontclog is using is closed source, and Fontly will be presumably released under the GPL license. The viral nature of GPL prevents us from using it. I did contact Raph, though he hasn't gotten back to me. Fontly does appear to be dead right now.</p>
      <p>The font format, and almost all of our drawing and editing functions will be available free (libre) in libraries, probably under either the LGPL or BSD license. We'd like to release a stand-alone version using XULRunner eventually, allowing anyone to contribute to the codebase. All the libraries would be shared, so most of the functions on the web will be available open-source, on your own computer (without the use of PHP).</p>
      <p>Touching Spiros: We very much would like to use Spiro splines eventually. There really needs to be a better Spiro implementation than fontforge's. To move font editing along further, we also need to get beyond beziers. To do this, unless Raph releases part of Fontly (there's a pseudo-working online Spiro example here: <a href="http://fontly.com/sandbox/spiro.html" title="http://fontly.com/sandbox/spiro.html">http://fontly.com/sandbox/spiro.html</a>) in a more friendly license, like LGPL or BSD, we'll have to write our own Spiro interpreter completely from scratch. There's no reason the two projects shouldn't be able to share code, though.</p>
      <p>&gt; What I'm getting at is, this type of activity seems too "casual" to<br>
      typically lead to an entire font; it's hard to see anybody who makes<br>
      fonts be seriously opposed to installing an editor on his computer.</p>
      <p>I can see your point, but I would beg to differ. For those of us who use multiple computers day-in-day-out, not having our software on every system is frustrating, and there are times that we can't install the software on every system because of licensing issues, build problems because of OS, or inability because of outside restrictions. An online font editor (coupled with cloud hosting for fonts) would allow you to edit fonts from <em>anywhere</em> I would take this very seriously. And this would allow use, out-of-the-box, of editing on mobile platforms like iPad and Zoom. This also removes cross-platform development woes all together.</p>
      <p>Imagine this: A man works on his font project before work, on his Mac, then continues work on his iPad riding on the sub, at work he's able to continue during his break on Windows. All the while he doesn't have to worry about copying font files between devices. While most of us probably don't want to drink type in the way, the possibilities are all there.</p>
      <p>What I mean is, there's no reason to call this a toy. :)</p>
      <p>&gt; Difficult to work with it on Mac</p>
      <p>A fix for this will be in the next version. :) I do have a Mac, but mainly I'm using Linux now.</p>
      <p>&gt; Nice but, uhm, no undo?</p>
      <p>We're going to try and squeeze this into the next release also.</p>
      <p>The main reason we've posted it this early in development was in order to get some alpha funding to help pay for development, but so far no one's taken the bait! Our time isn't free here. :)</p>
    html_clean: |-
