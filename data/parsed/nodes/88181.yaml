      <p>I'm working on the interface for <a href="http://fontclod.com/" rel="nofollow">Fontclod</a>. Would anyone mind giving some input here?</p>
      <p><img src="http://21326.info/fontclod/mockup-b.png"></p>
      <p>I decided to go with a more "minimal" styling which I thinks work better for most webapps. I also decided to go with a more traditional menu structure because of the nature of a font editor. Both the tool palette and palettes on the right are quite WIP. I haven't decided on a default set of tools or palettes yet. The glyph chooser at the bottom will be expandable, and be subset with filters.</p>
      <p>Anyway, thoughts on this mockup would be highly appreciated. :)</p>
      <p>Brian</p>
