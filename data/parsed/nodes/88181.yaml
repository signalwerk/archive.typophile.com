      <p><img src="http://21326.info/work/alpha1.png"></p>
      <p>Released alpha 1! Most of the bugs from the last release are fixed. Rendering of the glyph being edited is rewritten, so it's a lot faster. The ability to select multiple handles, and nudging has been added! You can remove handles by selecting them and pressing backspace. Press space to move the view. Also: preliminaries for multiple glyphs (no UI yet), and undo. Read the changelog for everything else. Note: point adding is missing from this version, it'll be back next week! :)</p>
      <p><img src="http://21326.info/work/alpha1-1.png"><br>
      Moving multiple handles at once.</p>
