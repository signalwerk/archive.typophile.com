      <p>Thanks for the links everyone, but I'm afraid some of you are not quite getting my point. Jackie, your CMYK charts are the ones I've seen before (as mentioned in my original post), but it's really about getting àll possible combinations in òne (supersized obviously) chart that allows you to read 4 different values (the percentages of CMYK) without having any doubles. It's the idea behind the diagram what it's really about. In every CMYK chart I've seen so far, there's always one fixed percentage (usually Y), but in my chart all percentages of all colours are variable. I have found a way to unfold a 3D-model to a userfriendly 2D-diagram &amp; I'm just trying to find out if this kind of thing has been done before. It may seem implausible &amp; even quite arrogant of me to think that I might be the first one to come up with this diagram, but until now all Google sessions &amp; links here seem to imply that indeed this kind of thing hasn't been made yet. Maybe nobody ever bothered to do so &amp; everybody was quite happy with the colour charts spread over several pages &amp; diagrams or maybe -and I might come off a little arrogant again here- I'm the first one to succesfully do it.<br>
      It started off as a colour chart, but it is now really about the diagram and not the colours. All diagrams that I've seen so far have two axes (X &amp; Y) &amp; only display two values for each element. Mine displays 4 different values for each element &amp; that's what I'm hoping is something new. It's very hard to explain without the diagram itself to illustrate what I'm talking about, but since I'm hoping this might be a discovery, I'm trying to "protect" my copyrights and what not before giving it away. As soon as my rights have been assured, I'll post an example here to illustrate my point with a brief explanation of how it came about.</p>
