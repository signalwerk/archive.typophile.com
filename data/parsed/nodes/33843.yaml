      <p>I have to be honest &amp; admit that I got bored with trying to find where to go to with this idea &amp; kind of forgot about the whole thing until I was recently going through my archives. Since I don't really see myself picking up on that search I figured I might as well let you all in on my 'secret' (you've been patient enough ;-)).</p>
      <p>Here's what the Quadrigram looks like with percentages of 25:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/quadrigram_4687.gif"></div><p></p>
      <p>As you can (hopefully) see in the quadrigram the values for black, cyan, magenta &amp; yellow are read respectively on the left, top, bottom &amp; right side.</p>
      <p>Here's how it's done:</p>
      <p>To put 4 variables into one chart you need to create 4 axes to read your values from. Average diagrams use only one X-axis &amp; one Y-axis making no use of the top &amp; right space as far as value input goes.<br>
      Having 2 horizontal (X1 &amp; X2) &amp; 2 vertical (Y1 &amp; Y2) axes creates the need for different calibrations. This can be achieved by making use of small &amp; big 'squares' for values for both axes (horizontally as well as vertically). The first thing you need to do is figure out the top value of one of your axes (for percentages it's obvious, but in this example I will use a top value of 4).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/figure1_6163.gif"></div><p></p>
      <p>For the second axis we need to divide each seperate value into these 4 steps; in this case creating 5 blocks (0,1,2,3 &amp; 4) of paired values 0-4.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/figure2_4071.gif"></div><p></p>
      <p>Now we do the same with the vertical axes to create a raster of big squares &amp; one of small squares merged together &amp; we'll thus be able to read 4 different values for each point (in the example the values for the coloured square are 3 for X1, 1 for X2, 3 for Y1 &amp; 2 for Y2).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/figure3_5133.gif"></div><p></p>
      <p>This method can be used for any kind of chart that needs to combine 4 different variables although for other charts it will lose the 'flowing' line that gives a first good impression of what to expect when reading the chart. Still it can be used to compress all information into one userfriendly chart.</p>
    html_clean: |-
      <p>I have to be honest &amp; admit that I got bored with trying to find where to go to with this idea &amp; kind of forgot about the whole thing until I was recently going through my archives. Since I don't really see myself picking up on that search I figured I might as well let you all in on my 'secret' (you've been patient enough ;-)).</p>
      <p>Here's what the Quadrigram looks like with percentages of 25:</p>
      <p></p><div class="imageWrap"><img src="/files/quadrigram_4687.gif"></div><p></p>
      <p>As you can (hopefully) see in the quadrigram the values for black, cyan, magenta &amp; yellow are read respectively on the left, top, bottom &amp; right side.</p>
      <p>Here's how it's done:</p>
      <p>To put 4 variables into one chart you need to create 4 axes to read your values from. Average diagrams use only one X-axis &amp; one Y-axis making no use of the top &amp; right space as far as value input goes.<br>
      Having 2 horizontal (X1 &amp; X2) &amp; 2 vertical (Y1 &amp; Y2) axes creates the need for different calibrations. This can be achieved by making use of small &amp; big 'squares' for values for both axes (horizontally as well as vertically). The first thing you need to do is figure out the top value of one of your axes (for percentages it's obvious, but in this example I will use a top value of 4).</p>
      <p></p><div class="imageWrap"><img src="/files/figure1_6163.gif"></div><p></p>
      <p>For the second axis we need to divide each seperate value into these 4 steps; in this case creating 5 blocks (0,1,2,3 &amp; 4) of paired values 0-4.</p>
      <p></p><div class="imageWrap"><img src="/files/figure2_4071.gif"></div><p></p>
      <p>Now we do the same with the vertical axes to create a raster of big squares &amp; one of small squares merged together &amp; we'll thus be able to read 4 different values for each point (in the example the values for the coloured square are 3 for X1, 1 for X2, 3 for Y1 &amp; 2 for Y2).</p>
      <p></p><div class="imageWrap"><img src="/files/figure3_5133.gif"></div><p></p>
      <p>This method can be used for any kind of chart that needs to combine 4 different variables although for other charts it will lose the 'flowing' line that gives a first good impression of what to expect when reading the chart. Still it can be used to compress all information into one userfriendly chart.</p>
