      <p><cite>It’s not really the colour chart itself that I’m trying to “protect” for now, but the idea of the diagram itself.</cite></p>
      <p>I'm hate to disappoint you, but <em>ideas</em> or <em>concepts</em> cannot be copyrighted. You can only copyright the specific expression of an idea or concept in tangible form. So you can get a copyright on your chart (once it is produced and published), but you can't copyright the idea, and not in advance.</p>
      <p>You may be able to get some limited <em>patent</em> protection for your idea, if you can present it as an invention. The term of protection is more limited and the application process will be more difficult.</p>
      <p>Good luck.</p>
      <p>-- Kent.</p>
