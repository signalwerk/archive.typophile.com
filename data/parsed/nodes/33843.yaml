    html: |-
      <p>I have explored this kind of thing and I found that the only way to get a reasonble idea of what a color would look like would be to print a huge sheet or many smaller ones - the reason being that you need about an inch x and inch of color to see what your getting ( okay maybe a bit smaller...); and you need steps of 5%. Sometimes you need to dial things more tightly still. That adds up to a hell of a lot of squares. </p>
      <p>There are companies that specialize in color management that sell sheets that are meant to help in a process that callibrates your documents to a given printing response. I actually built one for a VERY screwy color laser. It was a nightmare but an interesting one. </p>
      <p>Why do you want this one sheet to rule them all anyway?</p>
