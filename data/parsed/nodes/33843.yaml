  html: <p>CMYK colour charts always seem to be spread over several diagrams with one colour's percentage fixed (eg. C horizontally, M vertically &amp; Y fixed). Is there a reason for that? Does anyone know if there has already been a full userfriendly chart made that displays all possible variations in one diagram?</p>
  html_clean: <p>CMYK colour charts always seem to be spread over several diagrams with one colour's percentage fixed (eg. C horizontally, M vertically &amp; Y fixed). Is there a reason for that? Does anyone know if there has already been a full userfriendly chart made that displays all possible variations in one diagram?</p>
