    html: |-
      <p>Interesting, so I wrote an Illustrator CS4 Javascript (save as "CmykSpread.jsx") that draws the above :-)<br>
      Select any four-pointed object (not limited to <em>rectangles</em>!) and run the script. It should create something like the above, or -- it took me two days to get the linear interpolation working -- something like this from a free-form four-point object:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cmykspread_5384.png"></div><p></p>
      <p>I added Oprion's ink limit warning because that's a real good idea.</p>
      <p>---- (snip script below) ----<br>
      <code>//DESCRIPTION:Convert Rectangle to CMYK Spread<br>
      // Jongware, 15-Jul-2010<br>
      if (app.documents.length &gt; 0 &amp;&amp; app.selection.length == 1 &amp;&amp; app.selection[0].constructor.name=="PathItem" &amp;&amp; app.selection[0].pathPoints.length == 4)<br>
      {<br>
      	sel = app.selection[0];<br>
      	steps = prompt ("Number of steps (1..100)", 5);<br>
      	if (steps != null)<br>
      	{<br>
      		inklimit = prompt ("Ink limit (percentage)", 260);<br>
      		if (inklimit != null)<br>
      		{<br>
      			inklimit = Number(inklimit);<br>
      			steps = Number(steps);<br>
      			if (steps &gt;= 1 &amp;&amp; steps &lt; 100)<br>
      			{<br>
      				doc = app.activeDocument;<br>
      				p0 = app.selection[0].pathPoints[0].anchor;<br>
      				p1 = app.selection[0].pathPoints[1].anchor;<br>
      				p2 = app.selection[0].pathPoints[2].anchor;<br>
      				p3 = app.selection[0].pathPoints[3].anchor;<br>
      				dx = (p1[0] - p0[0])/(steps*steps);<br>
      				dy = (p1[1] - p0[1])/(steps*steps);<br>
      				dlx = (p3[0] - p0[0])/(steps*steps);<br>
      				dly = (p3[1] - p0[1])/(steps*steps);<br>
      				drx = (p2[0] - p1[0])/(steps*steps);<br>
      				dry = (p2[1] - p1[1])/(steps*steps);<br>
      				xl = p0[0];<br>
      				yl = p0[1];<br>
      				xr = p1[0];<br>
      				yr = p1[1];<br>
      				white = new GrayColor();<br>
      				white.gray = 0;<br>
      				allpts = new Array();<br>
      				for (v=0; v&lt;=steps*steps; v++)<br>
      				{<br>
      					xp = xl;<br>
      					yp = yl;<br>
      					dx = (xr-xl)/(steps*steps);<br>
      					dy = (yr-yl)/(steps*steps);<br>
      					ln = new Array();<br>
      					for (h=0; h&lt;=steps*steps; h++)<br>
      					{<br>
      						ln.push (Array(xp,yp));<br>
      						xp += dx;<br>
      						yp += dy;<br>
      					}<br>
      					allpts.push (ln);<br>
      					xl += dlx;<br>
      					yl += dly;<br>
      					xr += drx;<br>
      					yr += dry;<br>
      				}<br>
      				c = 0;<br>
      				m = 0;<br>
      				y = 0;<br>
      				k = 0;<br>
      				for (v=0; v&lt;steps*steps; v++)<br>
      				{<br>
      					c = 100*(v % steps)/(steps-1);<br>
      					m = 100*Math.floor(v / steps)/(steps-1);<br>
      					for (h=0; h&lt;steps*steps; h++)<br>
      					{<br>
      						y = 100*(h % steps)/(steps-1);<br>
      						k = 100*Math.floor(h / steps)/(steps-1);<br>
      						myPath = Array (<br>
      							allpts[v][h],<br>
      							allpts[v][h+1],<br>
      							allpts[v+1][h+1],<br>
      							allpts[v+1][h]<br>
      						);<br>
      						p = doc.pathItems.add();<br>
      						p.setEntirePath (myPath);<br>
      						p.closed = true;<br>
      						p.filled = true;<br>
      						p.stroked = false;<br>
      						color = new CMYKColor();<br>
      						color.cyan = c;<br>
      						color.magenta = m;<br>
      						color.yellow = y;<br>
      						color.black = k;<br>
      						p.fillColor = color;<br>
      						if (c + m + y + k &gt; inklimit)<br>
      						{<br>
      							p.stroked = true;<br>
      							p.strokeColor = white;<br>
      							p.strokeWidth = 0.5;<br>
      							p = doc.pathItems.add();<br>
      							p.setEntirePath (Array(allpts[v][h], allpts[v+1][h+1]));<br>
      							p.closed = false;<br>
      							p.filled = false;<br>
      							p.stroked = true;<br>
      							p.strokeColor = white;<br>
      							p.strokeWidth = 0.5;<br>
      							p = doc.pathItems.add();<br>
      							p.setEntirePath (Array(allpts[v+1][h], allpts[v][h+1]));<br>
      							p.closed = false;<br>
      							p.filled = false;<br>
      							p.stroked = true;<br>
      							p.strokeColor = white;<br>
      							p.strokeWidth = 0.5;<br>
      						}<br>
      					}<br>
      				}<br>
      			} else<br>
      				alert ("Invalid number of steps -- please use between 1 (few) and 100 (lots)");<br>
      		}<br>
      	}<br>
      } else<br>
      {<br>
      	alert ("Please select a template rectangle");<br>
      }<br>
      }</code></p>
