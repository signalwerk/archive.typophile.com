    html: |-
      <p>Okay, already needs a fix :-(</p>
      <p>Change the CMYK calculation lines to this order</p>
      <p>m = 100*(v % steps)/(steps-1);<br>
      y = 100*Math.floor(v / steps)/(steps-1);<br>
      (...)<br>
      c = 100*(h % steps)/(steps-1);<br>
      k = 100*Math.floor(h / steps)/(steps-1);</p>
      <p>to get the classical cyan/magenta block in the 'white' corner. To get increments of 20%, use a step value of 6 (0%, 20%, 40%, 60%, 80%, and 100% is <em>six</em> steps). The default '5' will show 25% increments.</p>
