      <p>&gt; <em>I’ve yet to see any OpenType Cyrillic fonts. Do they exist?</em></p>
      <p>Sure, Adobe has a few, some of which are bundled with the CS suites.<br>
      <a href="http://www.adobe.com/type/browser/C/C_cyrillic.html" title="http://www.adobe.com/type/browser/C/C_cyrillic.html">http://www.adobe.com/type/browser/C/C_cyrillic.html</a></p>
      <p>&gt; <em>This font was lent to us by the originator but it seems to be corrupt. [...] What I am concerned about is whether I will be able to select my text and switch from RusHelvetica-Bold to the new font without any issues.</em></p>
      <p>Probably not. From what you say, I suspect that the font you have is _not_ Unicode-compliant. If that’s so, then you will have problems when using an Unicode-compliant font, like OpenType fonts tend to be. You can, however, make your text Unicode-savvy, by using this tool: <a href="http://www.2cyr.com/decode/?lang=en" title="http://www.2cyr.com/decode/?lang=en">http://www.2cyr.com/decode/?lang=en</a></p>
