    <p>Hello everybody,<br>
    I just discovered this lovely forum and I’m hoping you can help me with an issue.</p>
    <p>We do packaging here using Adobe Illustrator v10 through to CS2 (more often than not CS2) on the Mac. A lot of our work is multilingual and often involves non-roman typefaces.</p>
    <p>I am looking to buy a really good set of Helvetica Cyrillic to help overcome some of our Cyrillic issues. I had this in mind:</p>
    <p><a href="http://www.fonts.com/findfonts/detail.htm?pid=438768&amp;grab_id=0&amp;page_id=4731&amp;query=helvetica%20cyrillic&amp;SCOPE=Fonts" title="http://www.fonts.com/findfonts/detail.htm?pid=438768&amp;grab_id=0&amp;page_id=4731&amp;query=helvetica%20cyrillic&amp;SCOPE=Fonts">http://www.fonts.com/findfonts/detail.htm?pid=438768&amp;grab_id=0&amp;page_id=4...</a></p>
    <p>I’d love to know if anybody has purchased this, what they think of it etc, whether there are any other comprehensive sets that people can recommend.</p>
    <p>My other issue is that we have some files that have text that has been set in RusHelvetica-Bold. This font was lent to us by the originator but it seems to be corrupt. We were going to buy the Helvetica Russian family but it seems to be an ancient font and impossible to buy now. So this is another reason why I find myself looking for a good Cyrillic Helvetica. What I am concerned about is whether I will be able to select my text and switch from RusHelvetica-Bold to the new font without any issues. Can anybody advise me on this?</p>
    <p>Thanks</p>
