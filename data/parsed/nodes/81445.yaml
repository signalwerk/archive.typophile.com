    html: |-
      <p>I think this is custom lettering, but my suggestions for alternatives would be the heaviest weights of one of the following: <a href="http://new.myfonts.com/fonts/linotype/itc-newtext-2/">ITC Newtext</a>; <a href="http://new.myfonts.com/fonts/redrooster/alexon-rr/">Alexon</a>; <a href="http://new.myfonts.com/fonts/adobe/itc-symbol/">ITC Symbol</a>; or Nick Shinn's <a href="http://new.myfonts.com/fonts/shinn/beaufort-pro/">Beaufort Pro</a>.</p>
      <p>You would need to layer gray copies of the lettering to make the shadow effect.</p>
      <p>- Mike Yanega</p>
