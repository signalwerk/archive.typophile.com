    html: |-
      <p>Nice work and good rendering. That takes some skill and experience. The designs are good and knowing the mechanics of a 3d program does not substitute for that. (Especially good is the "C") Trying to do this thing outside of a real 3d program is an exercise in frustration. The only exception is zaxwerks in after effects. The cheats in proanimator are easy and look pretty good.</p>
      <p>Btw, for those wanting good enough without learning any 3d, <a href="http://m.youtube.com/watch?v=CvtluKm6P-0" title="http://m.youtube.com/watch?v=CvtluKm6P-0">http://m.youtube.com/watch?v=CvtluKm6P-0</a> is not bad. It will not give final gathering, bump, displacements, advanced materials, advanced control of bevels, area lighting, etc, but it is good for a commonly owned program.</p>
