      <p>IsleofGough is right, that can be done in any 3d program really.</p>
      <p>For my example, I used C4D and render using Vray. As both IsleofGough and 5star said, it's a step effector applied to a cloner — the step effector allows me to change the size of the A, along with rotating it a little with each clone.</p>
