    html: <p>You are showing your age. FWIW, pretty much all the 3D programs will create equivalent output for this sort of thing (Autodesk programs, Modo, Lightwave, Houdini, Xara, and so on). If you learn the techniques in one, the ability to learn another is not that hard. It is only on higher end issues where programming is needed or one is dealing with animating millions of objects that there are substantial differences in what one can do. After one learns the theory, it is mostly just figuring out where the commands or menus are to do what one wants.</p>
