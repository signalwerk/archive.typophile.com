    date_raw: 14 Jan 2011 — 2:08pm
    date: 2011-01-14T14:08:00
    votes: null
    html: "<p>Definitely better stacked. Think you have over played idea and lost clarity: choice of typeface with lopped off corners instead of curves fights and breaks down the nice idea of echoing the shape of the play pieces in the 'O's. As you haven't copied the proportions of either of the actual pieces in those 'O's they do not obviously read as the play shapes (especially with that extra confusion of the lopped off corners). Why not use one or the other piece shape accurately? Pull them out in colour? Photograph of piece version? Possibly only one 'O' not two? Some other condensed, blocky face good idea but would also close the letter spacing up v tight to emphasise those 'bites' out the 'O' and let them stand out.</p>"
