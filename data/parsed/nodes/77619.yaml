    html: |-
      <p>&gt; TIMBER<br>
      &gt; WORKS<br>
      &gt; TOYS</p>
      <p>I'd definitely explore that 3-line approach. I'd probably add a hyphen. The cutout in the "O" vaguely looks like a reversed-out hyphen anyway, so an actual hyphen might not look out of place after Timber.</p>
      <p>Another approach to lessen the length would be to wrap the name into a shape. For example, make Timberworks an arch with Toys centered beneath it. Or wrap the name around 3 sides of a square or diamond shaped (reversed out of the shape, I mean).</p>
