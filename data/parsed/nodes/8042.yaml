    html: <p>I have long been a fan of schematics and the lack of conscious design inherent in most, the form of text instead arising from requirement and contrast with the technical illustrations. Some very interesting older documents (manuals, articles and schematics) can be found on the <a class="freelinking external" href="http://www.one-electron.com/Misc_Docs.html" rel="nofollow">one electron site</a>.</p>
