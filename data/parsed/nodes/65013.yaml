      <p>People are not disgusted by spiders - they are afraid of them, but they respect them too. They admire their fastidious, diligent nature, not to mention their beautiful but incredibly strong webs. Tarantulas might be visually unappealing, but something like a Black Widow is incredibly elegant. I myself have no problem squashing a cockroach, but I will do my darndest to avoid killing a spider.</p>
      <p>HOWEVER:<br>
      1) It should definitely be a representational, not a realistic rendering.<br>
      And maybe something faceted, like this: <a href="http://typophile.com/node/64559" title="http://typophile.com/node/64559">http://typophile.com/node/64559</a><br>
      2) No gradients, please. One or two solid colors.<br>
      3) That font has to go.</p>
      <p>hhp</p>
