    html: |-
      <p>Thank you all for your comments.</p>
      <p>The spider is my idea, not the graphics designer.  I have had the spider logo since 2004, and I am still OK with it.  Partly my argumentative nature I guess, because everyone says "most people are scared of spiders, so don't use it", just makes me want to use it more LOL.<br>
      May I point out that Alfa Romeo has a snake, Lacoste has a croc. Scorpion sports moto-x gear, Balmain tigers, etc etc, so the scared of spiders argument doesn't convince me.<br>
      There is a definite "viral" advantage to the spider - the ladies who work at the various Council Offices we deal with all remember the spider, so when I need help they often know me by name, likewise with many of the sales reps, Engineers etc, all of whom we require to complete a job.</p>
      <p>So seriously, how offputting to the typical civilian is a spider name/logo?</p>
