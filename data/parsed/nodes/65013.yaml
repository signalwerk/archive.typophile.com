      <p>I'd say that's pretty much the opposite direction that an architecture logo should go in. </p>
      <p>"I have had the spider logo since 2004, and I am still OK with it. Partly my argumentative nature"</p>
      <p>Poisonous spiders and argumentative nature seem to be the last two things you'd want to communicate about your business. </p>
      <p>Now, that said, Katipo is a great word. Looking at your work, you appear to design sleek modern houses. I think the logo should reflect that aesthetic.</p>
      <p>Focus on simplicity, stability, geometry. If the name of the company is 'katipo' there's no real reason to have a literal spider be a part of the logo. That's overkill. </p>
      <p>Now, don't take this the wrong way, but, in general I've found architects to be wannabe graphic designers and graphic designers to be wannabe architects. While there is definite overlap, I don't think the skillsets are interchangeable. I'd love to design my own house some day but know that an architect would do a much better job than I would.</p>
