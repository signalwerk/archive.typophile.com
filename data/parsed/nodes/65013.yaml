    <p>Hi All</p>
    <p>I have employed a friend's graphic design company to re-design my company logo. He has come up with the following, and I was interested in other opinions.  For what it is worth, my web-designer who does not know the graphic designer, hates the new logo, my company name, and my old logo!<br>
    You may also need to know that we design houses, shop &amp; restaurant interiors, small buildings, etc.  Architectural design. See <a href="http://www.katipodesign.co.nz" title="www.katipodesign.co.nz">www.katipodesign.co.nz</a> (the old website)</p>
    <p>Thanks in advance. Mat</p>
