      <p>Reading up on the spider, I'd consider going a bit more abstract if you really want to have a image based logo:</p>
      <p> - The common name, katipo, is a Māori name<br>
       - is only found near the seashore living among sand dunes<br>
       - Spiders inhabiting dune grasses construct their webs in open spaces between the grass tufts<br>
       - Spin an irregular tangled web </p>
      <p>However, I'd also consider explorer type only solutions. For an architect, your brand image is really more about your portfolio than the logo itself.</p>
