      <p>Thanks fvilanakis, looks like you got it exactly right with Century Gothic. This makes sense considering that Microsoft paid Monotype to develop Levenim MT, so they must have included the Latin characters from Century Gothic.  </p>
      <p>And I hadn't seen findmyfont.com, so that's a useful resource. Much appreciated.</p>
      <p>Also, thanks hrant for clarifying the ways that multi-script fonts include character sets. It does appear to my eyes that the stylistic match between Levenim MT's Hebrew characters and Century Gothic is mediocre at best.</p>
      <p>Well done folks.</p>
