    html: |-
      <p>Most multi-script fonts fall into one of two categories: either the non-Latin is derived directly from a pre-existing Latin (typically resulting in an ugly and dysfunctional charicature) or a sort-of-compatible Latin is thrown in with a decent non-Latin (which is of course non-ideal as well). In either case outline theft could be involved.</p>
      <p>The case with Levenim MT is clearly the latter, and since it's from a legitimate source one could feel safe that no outline theft was involved. The Latin seems to be a cross between Futura and Avant Garde - it doesn't match the Hebrew in style. Ideally you might find a Latin font that has the look &amp; feel of the Hebrew - but it's going to be hard to match the color (for starters). The top-tier solution would be having just the right Latin custom-made (but that's not cheap).</p>
      <blockquote><p>what's the best way to identify the family of the Latin glyphs?</p></blockquote>
      <p>Ask on Typophile.  :-)</p>
      <p>hhp</p>
