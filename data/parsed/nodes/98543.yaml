    <p>So the short story here is that I've inherited this logotype on a project and the designer used Levenim MT to set the Latin characters. However, that's a Hebrew font:<br>
    <a href="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1889" title="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1889">http://www.microsoft.com/typography/fonts/font.aspx?FMID=1889</a></p>
    <p>What's the best way to approach this?<br>
    - Should I attempt to find and substitute a Latin font with identical glyphs? If so, which one?<br>
    0r<br>
    - Should I just accept that Levenim MT was chosen for its Latin character set?</p>
    <p>It's a geometric sans serif and I don't believe the Latin characters are from Futura, because the lower case 'c' has terminals cut radially rather than vertically-sheared.</p>
    <p>I've run into this problem occasionally and the more general question I have is:<br>
    Are the Latin characters displayed in non-Latin fonts:<br>
    a) drawn specifically for that non-Latin font,<br>
    b) borrowed glyphs from another family,<br>
    c) substituted by the OS (Windows in the Levenim MT case)<br>
    or<br>
    d) one of the above depending on the font?</p>
    <p>The follow-up question is, when this happens, a designer uses a non-Latin font for Latin characters, what's the best way to identify the family of the Latin glyphs?</p>
    <p>Thanks for your help.</p>
