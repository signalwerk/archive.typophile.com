      <p>Just to clarify, I have am posting part of Pascal's post to ATypi list here:</p>
      <p>"after this debate about the dates i have changed the title of the article from</p>
      <p>The First Arabic printing press in Lebanon &amp; The Middle East</p>
      <p>to</p>
      <p>The First Arabic printing press in Lebanon</p>
      <p>referring to pages 65-67 in the "Arabic Typography" book.</p>
      <p>1702 Aleppo press</p>
      <p>1706 first book printed in Aleppo by "AL Zakher"</p>
      <p>1727 turkish arabic press in Istanbul</p>
      <p>1733 "Al Zakher" printing press in lebanon, who moved from aleppo and came to found the press ..."</p>
      <p>-Saad</p>
