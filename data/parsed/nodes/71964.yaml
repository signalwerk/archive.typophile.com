  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TypeTalks-Plakat_4405.jpg"></div><br>
    <a href="http://typetalks.com/Symposium2010/index.html" rel="nofollow">TypeTalks</a> was a one-day symposium about type and typography in Brno, Czech Republic (<a href="http://typophile.com/node/69564" rel="nofollow">announcement on Typophile</a>). The event that took place two weeks ago in the Brno House of Arts was organized by <a href="http://typophile.com/user/7019" rel="nofollow">David Březina</a> and some of his students.<p></p>
    <p>For those who couldn’t make it to Brno, there are several write-ups online now:<br>
    <a href="http://www.typeoff.de/?p=1102" rel="nofollow">Dan Reynolds @ typeoff.de</a> [English]<br>
    <a href="http://www.typejockeys.com/blog/TypeTalks-2010-in-Brno" rel="nofollow">Michael Hochleitner @ typejockeys.com</a> [English]<br>
    <a href="http://www.myfonts.de/2010/06/typetalks-brno-1/" rel="nofollow">Florian Hardwig @ MyFonts.de, part 1</a> and <a href="http://www.myfonts.de/2010/07/typetalks-brno-2/" rel="nofollow">part 2</a> [German, but with lots of pictures. You can try Google Translate to get the basic idea: <a href="http://bit.ly/9d81Yh" rel="nofollow">part 1</a>, <a href="http://bit.ly/bJS9Fn" rel="nofollow">part 2</a>]</p>
    <p>Furthermore, there are a few photos up on Flickr, <a href="http://www.flickr.com/photos/tags/typetalks/" rel="nofollow">tagged with ‘TypeTalks’</a>.</p>
