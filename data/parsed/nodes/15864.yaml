    html: |-
      <p>I love the typography. It’s extremely lovely. The squeezy juicy thing is a great idea, but something’s not quite right. First thing I thought of was the Cingular Wireless symbol. Maybe it’s the 3-D illustrative effect of the mark that’s making it not adhere to the style the type sets forth. </p>
      <p>Also, marmalade is more gel-like not so much juice. This may be something to think about.</p>
      <p>I think it needs worked further, it’s a great path and direction though, keep pushing or should i say squeezing.</p>
      <p>Joseph Szala<br>
      Vigor Graphic Design, LLC.<br>
      <a href="http://www.vigorgraphics.net">www.vigorgraphics.net</a></p>
