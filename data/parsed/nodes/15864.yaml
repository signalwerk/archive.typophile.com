    html: |-
      <p>Hmmmm, i’m not sure about ‘sexy’. I think it reminds me too much of a kids birthday party with yellow and orange ballons. I dont think it has that sophistication you would probably desire in a restaurant logo. </p>
      <p>It also reminds me of the tongue from the Rolling Stones ‘forty licks’, and the little ‘balloons’ give a feeling of ‘lip smackin’ tastyness which (though does tie in with food) seems to convey the wrong message. It’s more fast food than ‘sexy natural’.</p>
      <p>I dont have any problems with the type, though changing the image may affect this. </p>
      <p>Hope this helps?</p>
