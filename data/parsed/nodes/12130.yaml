    <p><strong><a href="/web/20190728051124/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/web/20190728051124/http://www.typophile.com/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a>&nbsp;:&nbsp;Schaftstiefelgrotesk</strong></p>
    <p>A style of <a href="/web/20190728051124/http://www.typophile.com/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> type popularized in the <a href="/web/20190728051124/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=20th%20century" title="Create node &quot;20th century&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">20th century</a> that split the distance between the heavy industrial grotesques popular in the West (such as <a href="/web/20190728051124/http://www.typophile.com/node/17655" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akzidenz Grotesk</a>) and the <a href="/web/20190728051124/http://www.typophile.com/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> types predominant in the Teutonic world. Hitler, who had a preference for classic Roman imperial inscriptional letters, was one of the chief exponents of this style of type, which became explicitly identified with Nazi ideas of <a href="/web/20190728051124/http://www.typophile.com/node/12205" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">German nationalism</a>. The names of the typefaces – <a href="/web/20190728051124/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Deutschland" title="Create node &quot;Deutschland&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Deutschland</a>, National, <a href="/web/20190728051124/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Tannenberg" title="Create node &quot;Tannenberg&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Tannenberg</a> – reveal this connection. Schaftstiefelgrotesks bear the same relationship to traditional German blackletters that <a href="/web/20190728051124/http://www.typophile.com/node/19193" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Grotesque</a> <a href="/web/20190728051124/http://www.typophile.com/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sans serif</a> types do to traditional serifed Latin type: they are simplified, weighted versions of the forms, sturdier and less refined. The name, given to the style by typesetters, is ironic. Of all the types sullied by association with the Nazis, they are the most&nbsp;problematic.</p>
