    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> : Schaftstiefelgrotesk</strong></p>
    <p>A style of <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> type popularized in the <a href="/wiki/20th%20century" class="freelinking" rel="nofollow">20th century</a> that split the distance between the heavy industrial grotesques popular in the West (such as <a href="/wiki/Akzidenz%20Grotesk" class="freelinking" rel="nofollow">Akzidenz Grotesk</a>) and the <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> types predominant in the Teutonic world. Hitler, who had a preference for classic Roman imperial inscriptional letters, was one of the chief exponents of this style of type, which became explicitly identified with Nazi ideas of <a href="/wiki/German%20nationalism" class="freelinking" rel="nofollow">German nationalism</a>. The names of the typefaces -- <a href="/wiki/Deutschland" class="freelinking" rel="nofollow">Deutschland</a>, National, <a href="/wiki/Tannenberg" class="freelinking" rel="nofollow">Tannenberg</a> -- reveal this connection. Schaftstiefelgrotesks bear the same relationship to traditional German blackletters that <a href="/wiki/grotesque" class="freelinking" rel="nofollow">grotesque</a> <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> types do to traditional serifed Latin type: they are simplified, weighted versions of the forms, sturdier and less refined. The name, given to the style by typesetters, is ironic. Of all the types sullied by association with the Nazis, they are the most problematic.</p>
