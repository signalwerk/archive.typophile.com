    <p>100 Hackford Road, London <span class="caps">SW9</span> <span class="caps">0QU</span></p>
    <p>Holdings include a large amount a material from the Stephenson Blake and Co., Wood type from Robert DeLittle, York and hot metal from the Monotype Corporation as well as the working papers of Walter&nbsp;Tracy.</p>
    <p><a href="http://www.typemuseum.org/index.htm">http://www.typemuseum.org/index.htm</a></p>
    <p>In May 2006 this Museum was closed due to lack of funding. A campaign and supporting Type Museum Society has been launched which you are invited to&nbsp;join.</p>
    <p><a href="http://www.typemuseumsociety.org/">http://www.typemuseumsociety.org/</a></p>
    <p>July 2008 After two years of closure and no public discussion the <span class="caps">NMSI</span> has apparently proposed a plan to the trustees to put some or all of the Type Museum’s collections into storage at the <span class="caps">NMSI</span> facility at Wroughton in Wiltshire. Supporters of the museum are campaigning against this in the belief that this will spell the end of hopes for a full development of the educational potential of this incomparable type&nbsp;collection.</p>
    <p>Sue Shaw (a Museum Trustee, the Founder and first Director) launched a petition and  comments in a local newsletter article downloadable from <a href="http://www.stockwellpark.com/pdf/spark-2008-05.pdf">http://www.stockwellpark.com/pdf/spark-2008-05.pdf</a></p>
    <p>In addition there are two online petitions running against these developments please support them&nbsp;both:</p>
    <p>On the Number 10&nbsp;website:</p>
    <p>    <a href="http://petitions.pm.gov.uk/typemuseum/">http://petitions.pm.gov.uk/typemuseum/</a></p>
    <p>“We the undersigned petition the Prime Minister to stop the<br>
        proposed move into storage of the Type Archive, from its<br>
        present home at the Type Museum,&nbsp;London</p>
    <p>The Type Museum has successfuly collected a large proportion of<br>
        all the definitive historical materials relating to the art,<br>
        design <span class="amp">&amp;</span> manufacturing production in Britain of the typefaces<br>
        in which the world’s languages are communicated and recorded.<br>
        This collection has been closed for two years and needs<br>
        re-opening to public access, educational and scholarly use –<br>
        not broken up or put into storage as is curently being<br>
        proposed. The Type Museum’s  collections need exhibiting,<br>
        curatorial <span class="amp">&amp;</span> conservation development and educational workshops<br>
        - not storage. This legacy is vital for the quality of<br>
        education of future generations of communicators in which<br>
        Britain has frequently led the world. We appeal for resources<br>
        to restore and safeguard educational access to these<br>
        collections.”</p>
    <p>There is of course the pre-existing online petition to the Trustees which has gathered upward of 680&nbsp;signatures:</p>
    <p><a href="http://www.ipetitions.com/petition/typemuseum/">http://www.ipetitions.com/petition/typemuseum/</a></p>
    <p>“The London Type Museum is the most comprehensive type museum in the world. Its collections are vast, representing nearly all of the world’s written languages in their historic printed form. It is a timeline in letters, a record of printed history from the earliest days through the present. It is also the last place where Monotype technicians continue to manually cut&nbsp;typefaces.</p>
    <p>Visitors to this unique working museum have been able to watch as type is cast, view presses in action and engage in hands-on workshops. The importance of the museum as an educational resource and source of inspiration for today’s designers is&nbsp;immeasurable.</p>
    <p>These valuable collections are now in danger of being broken up and dispersed to the Science Museum and the <span class="caps">V&amp;A</span>, where they will likely be placed in&nbsp;storage.</p>
    <p>This petition will be presented to the Trustees of the Type Museum as evidence that the public does not want to see this unique museum&nbsp;closed.</p>
    <p>Please show your&nbsp;support!”</p>
    <p>December 2008<br>
    A Freedom of Information Request to <span class="caps">DCMS</span> reveals 2006 Consultants Report for <span class="caps">NMSI</span> entitled <a href="http://www.culture.gov.uk/reference_library/foi_requests/5529.aspx" title="Click to visit an external URL." class="freelink freelink-external freelink-external">‘Type Museum Otions Appraisal’</a> Delineates many of the Type Museum Society’s supporters fears. <span class="caps">DCMS</span> points out it is out of date and implies <span class="caps">NMSI</span> has to be approached to find out what is currently planned. But it remains as one of the most detailed documents discussing the options being considered for the Museum - That it needed in 2006 a gift of a £1M and an £8M Endowment to secure a future but that this would probably require an enhanced trust&nbsp;management.</p>
    <p>The report vindicated the value of the collections. It is particularly noted that the authors suggest an intensive documentation project option. To be conducted before any shutdown, removal or dispersal of the collections - and in particular emphasises the need for some sort of documentary/oral/process history approach to record the skill and knowledge embodied and still practised by the Monotype engineers who continue to work on&nbsp;site.</p>
    <p>“It is museological, culturally, and professionally unethical to allow these intellectual assets to be lost, even if the museum has to&nbsp;close.”</p>
