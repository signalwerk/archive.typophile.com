      <p>The definitions I use are: </p>
      <p><strong><a href="/wiki/Typeface" class="freelinking" rel="nofollow">Typeface</a></strong> is a collection of all typographic characters that share the same design characteristics such as weight, width, inclination, optical size, stroke modulation or treatment of serifs. Helvetica Bold is one typeface, Times Roman is another typeface, Times Bold is yet another typeface. </p>
      <p><strong><a href="/wiki/Font" class="freelinking" rel="nofollow">Font</a></strong> is a certain physical form in which a typeface with a certain character set is released by a certain vendor under a certain trade name — for example a set of metal type sorts, a digital font in the Type 1 format, a digital font in the OpenType PS format etc. Times Roman by Linotype in Type 1 format is one font, Times Cyrillic Regular by Linotype in Type 1 format is another font, Times Roman Std by Adobe in OpenType format is another font, Dutch 801 Roman by Bitstream in Type 1 format is another font — all of the same typeface Times Roman. </p>
      <p><strong><a href="/wiki/family" class="freelinking" rel="nofollow">Typeface family</a></strong> is a set of typefaces released under a common trade name that differ in weight, width, inclination, optical size and character sets, but belong to the same stylistic class because of some common design characteristics such as stroke modulation and treatment of serifs. Helvetica, Times, Palatino, ITC Stone Sans, ITC Stone Serif, ITC Stone Informal and ITC Stone Humanist are all different families. </p>
      <p><strong><a href="/wiki/superfamily" class="freelinking" rel="nofollow">Typeface superfamily</a></strong> is a set of typefaces released under a common trade name that combines several families across stylistic classes. Members of a typeface superfamily differ not only in weight, width, inclination, optical size and character sets, but also in other design characteristics such as stroke modulation and treatment of serifs — but still share certain other characteristics such as proportions, which allows them to work together. ITC Stone Sans, ITC Stone Serif, ITC Stone Informal and ITC Stone Humanist are four families that form a superfamily. </p>
      <p>(I think the issue of the common trade name is important. There are often serif and sans families that share stylistic features and work together well, but they are designed by different people and released under different trade names. Those do not form a superfamily.)</p>
      <p>I also like another term: </p>
      <p><strong><a href="/wiki/series" class="freelinking" rel="nofollow">Typeface series</a></strong> is a set of typefaces that form a family, a superfamily or even have a looser connection, for example are designed by the same designer with a common thought in mind. So, any family or superfamily is a series, but also Verdana, Tahoma, Nina and Meiryo form a series, though not a family nor a superfamily. Another example of a series are Arepo, Stone Print, SFPL, and Cycles by Sumner Stone. </p>
      <p>Regards,<br>
      Adam</p>
