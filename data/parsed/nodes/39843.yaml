      <p>Thanks for the kind words — indeed, I like coming up with definitions, plus I've recently completed editing the <a href="http://www.d2d.pl/" rel="nofollow">Polish edition of Bringhurst's "Elements"</a>, which gave me sufficient opportunity to think about these things lately :) </p>
      <p>As for the term "series", it was new to me a few years ago, but I heard many designers who worked at Mergenthaler Linotype (e.g. Matthew Carter, Larry Oppenberg and Dennis Pasternak) used it. I somehow like the concept that a series would be more general than a family, because <em>family</em> implies the same name (as in <em>family name</em>) while <em>series</em> does not. </p>
      <p>For me, the distinction between a family and a superfamily is whether members of the particular series belong to different stylistic categories (superfamily) or just the same (family). The concept of a "stylistic category" or "class" is vague enough to leave some room for intepretation, which I think is fine. </p>
      <p>A.</p>
