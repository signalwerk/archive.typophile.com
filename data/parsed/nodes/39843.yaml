      <p>From reading the various threads that are relevant on Typophile the prospect that we can develop a really solid consensus meaning seems distant. In seems like in type there are relatively few terms that are not a bit or even very amorphous. That said, I am utterly happy to abide by whatever consensus can be acheived. Paul, you have made a very good start on a case for one way to do it. I applaud your effort!</p>
      <p>Alternatively perhaps for the purposes of the Wiki the thing to do is to choose terms System, Super familily  etc; and then define them in some way; and then list the fonts that fit the supplied definitions. Then even if somebody has semantic differences with the Typophile Wiki they can still use the info.</p>
