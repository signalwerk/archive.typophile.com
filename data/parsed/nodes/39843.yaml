    <p>in relation to discussions <a href="http://typophile.com/node/31592" rel="nofollow">here</a> and <a href="http://typophile.com/node/29942" rel="nofollow">here</a>, and bearing consequences for articles <a href="http://typophile.com/node/29924" rel="nofollow">here</a> and <a href="http://typophile.com/node/39833" rel="nofollow">here</a>, can we try to pin down some terminology just for clarification of the wiki articles.</p>
    <p>Do the following mean anything to you as typographic terms?</p>
    <p>Family<br>
    Super Family (Superfamily)<br>
    System<br>
    Suite</p>
