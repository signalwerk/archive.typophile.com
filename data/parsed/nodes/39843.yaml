      <p>in previous posts and in the wiki articles that i have authored, i have used "super family" to mean a set of related fonts that contain at least a serifed and an unserifed counterpart, but may also include other sytles inluding an "informal" or a "someserifs" style. i believe there is precedence in this kind of usage, as <a href="/wiki/Ilene%20Strizver" class="freelinking" rel="nofollow">Ilene Strizver</a> uses the term this way in <a href="http://www.fonts.com/AboutFonts/Articles/FineTypography/Super+Families.htm" rel="nofollow">her article on super families</a> for the fonts.com website.</p>
      <p>however, the unscientific poll i put together (which is linked to above) seemed to indicate that typophiles might prefer another term with "suite" and "type system" being offered as alternates. somehow i think of a "type system" as something different: i think of a system as including a range of weights and optical sizes, which may or may not be included in my concept of a super family. i have similar reservations about the term suite: to me it is a more inclusive concept.</p>
      <p>is it silly to try to find a term that refers specifically to types families which come in both serifed and unserifed flavors? maybe so, but i don't know...</p>
