      <p>My definition of Family is narrower than James's - I'd say a family is all the various weights and special features of a single font, such as ligatures, ornaments, condensed, etc. But only of one font. I'd put Univers here, not in superfamily. </p>
      <p>Superfamily: I'd agree that it should be more extensive - sans + serif, for example. Thesis, Freight, families like that. And yes Rotis (ugh)</p>
      <p>Suite: This is what I'd call a group of fonts that work together, with a single theme or idea, but they could be disparate in appearance. House Industries collections belong here, to me.</p>
      <p>System: I think of my Mac OS, not fonts when I hear this term. Or of the mildly annoying Univers/Helvetica Neue way of numbering the different weights, that never really caught on.</p>
