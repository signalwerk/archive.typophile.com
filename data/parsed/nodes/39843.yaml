      <p>I'd like to echo what Adam described about family vs. superfamily. The ITC Stone typefaces are the classic example and immediately came to my mind also when I read the initial post.</p>
      <p>I'll add that "type system" suggests to me a selection of typefaces designated to work together for a given purpose, and has more to do with an overall design program rather than the design or marketing of the types themselves. For instance, when I revised the brand for my former publisher, I chose for them three typefaces (for marketing, not publishing) -- Iowan Old Style for working text, Vectora for supplementary sans, and PMN Caecilia for occasional flavor. This then constituted our "type system." So I think of this as more of a design term than a typographic term, if that makes any sense to anyone.</p>
      <p>I have to admit that I've never used or even contemplated the term "suite" in a typographic context.</p>
      <p>Adam's notion of "series" is new to me, but seems quite useful. Another example might be Palatino, Aldus, and Michelangelo.</p>
      <p>-- K.</p>
