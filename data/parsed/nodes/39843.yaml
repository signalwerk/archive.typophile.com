      <p>I like that Adam's definition is thoughtful, explicit ( not vague) and lacks internal contradictions. It is also no-less arbitrary than another one might be. But as I said before, that's not a slight or criticism. </p>
      <p>Thinking further, what I think is also useful is the way he has defined Superfamily outside of a serif centric model. </p>
      <p>If a family of fonts has optical variations, italics, Small Caps, more than 2 kinds of figures and small caps you quickly get enough fonts in pure numbers to qualify for super family status I think. Arno Pro is the example I am thinking of. That family is huge. That is the only issue that I think is left still unresolved. eg Does anybody think of Arno Pro as outside of  Superfamily status because it lacks a Sans? </p>
      <p>Also I think including a semi-serif should definitely not be the defining characteristic even if there is some historical basis for that position. I say this because in part because I don't think our terms should be encouraging or discouraging design choices in order to "qualify". And I think it would be mistake for instance to deny Meta as a Superfamily.</p>
