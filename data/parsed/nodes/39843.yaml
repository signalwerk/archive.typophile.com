      <p>Family: A collection of related typefaces and fonts. In some cases a family is sort of a marketing gimmick, eg. some of the families sold by House Industries, or collections of old typefaces marketed together, like Akzidenz and MT Grot. There is a subtle distinction between family and typeface; I think that is because a family can be comprised of multiple typefaces whereas a typeface cannot.</p>
      <p>Superfamily: A very large family of fonts that applies to a wide variety of applications. Adrien Frutiger generally gets credit for inventing the superfamily when he designed Univers. I think that to get to superfamily status a family should include two or more widths in multiple weights. </p>
      <p>System: Synonymous with family. </p>
      <p>Suite: I do not think that I have ever seen this term used outside of marketing materials, so it has no technical meaning to me.</p>
