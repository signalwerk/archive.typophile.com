      <p>Katja, you have to understand that the numbers and letters on licence plates are not fonts, but alphabets that were specifically designed for the stamping machines that make those plates. This means these alphabets are specific to the manufacturing method they were designed for. There are no equivalents that exist as (digital) typefaces for general use.</p>
      <p>Some of these licence plate alphabets were digitised and made into fonts, but not all of them. Apart from the aforementionned Lineto versions of the Italian, Swiss, Belgian and French licence plate fonts, both <a href="/web/20191004234828/http://www.typophile.com/node/14102" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lineto</a> and <a href="/web/20191004234828/http://www.typophile.com/node/12045" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fountain</a> digitised the German plates (but Fountain did <a href="https://web.archive.org/web/20191004234828/http://www.fountain.nu/catalogue/sauerkrauto.asp">a far better job</a> than Lineto IMHO), <a href="/web/20191004234828/http://www.typophile.com/node/13636" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Christian Schwartz</a> did the <a href="https://web.archive.org/web/20191004234828/http://christianschwartz.com/pennsylvania.shtml">Pennsylvanian one</a>. <a href="/web/20191004234828/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Conor%20Mangat" title="Create node &quot;Conor Mangat&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Conor Mangat</a>'s <a href="https://web.archive.org/web/20191004234828/http://www.emigre.com/EFfeature.php?di=115">Platelet</a> is loosely based on the Californian licence plates. And <a href="https://web.archive.org/web/20191004234828/http://www.identifont.com/find?font=carplates&amp;q=Go">ACME Carplates</a> brought the British plates into the digital realm (Lineto had that one as well, but Mitsubishi Motors Europe acquired exclusive license for the Alpha Headline fonts for the duration of ten years, expiring at the end of 2012).</p>
    html_clean: |-
