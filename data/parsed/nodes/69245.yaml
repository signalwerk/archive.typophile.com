  html: |-
    <p>I’ve spent days browsing my type bookmarks in search of a display typeface for the magazine I’m redesigning, but so far nothing feels quite right. The magazine writes about pop culture, and the readers are mostly students (18+). </p>
    <p>I’m excited to finally find a good project for Feijoa, and I think pairing it with this sans of my own works quite good. I also intend to use the sans for pull quotes and some (smaller) display as well, but for headlines I’m afraid it doesn’t have the necessary punch. Unfortunately Feijoa’s own display cut is way to feminine for this project.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/text_3964.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/display_6590.png"></div><p></p>
    <p>I’m having a hard time explaining just what I’m looking for, but I’ll give it a go:<br>
    • It needs to relate to the other typefaces somehow. (Not overly humanist, not too geometric)<br>
    • Stylistic alternates is a plus.<br>
    • I think a heavy weight would be useful. (Until now, the main display font have been The Mix Black.)<br>
    • They write a lot of serious articles on philosophy and ethics in addition to the cultural stuff, so it can’t be too funky or childish.</p>
    <p>Any suggestions?</p>
