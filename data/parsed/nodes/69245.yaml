      <p>National could maybe work. I'm thinking it should be a good match to Feijoa, being by the same designer (I thought I'd seen them successfully paired somewhere, but can't find that again – and I don't have Feijoa, so I can't say for sure). It's pretty similar to yours in feeling and seems to fit your description quite nicely – it has all the things you mention (like an alternate "g", which has saved me at least once).<br>
      But that would probably mean not using your font, as they're sort of close from what I can tell.</p>
