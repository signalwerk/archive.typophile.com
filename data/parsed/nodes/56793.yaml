    <p>Hooray!</p>
    <p>Finally, <a href="http://markbattypublisher.com/books/typography-monographs-volume-2-size-specific-adjustments-to-type-designs-an-investigation-of-the-principles-guiding-the-design-of-optical-sizes/" rel="nofollow">my book on optical sizes</a> has been published.</p>
    <p>It is very type designer-centric so I guess it may be of interest for many people here.</p>
    <p>On the ATypI website you can see my <a href="http://atypi.org/eventfiles/StPetersburg_Ahrens_OpticalSizes_paper.pdf" rel="nofollow">paper for the St Petersburg conference</a>, which gives you a foretaste.</p>
