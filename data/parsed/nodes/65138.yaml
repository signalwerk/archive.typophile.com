      <p>I just had to get this in the hands of the communication department, so it's out of my hands. I'd love to keep the conversation up so I can get better for the future, though! Thanks again for all the help you've been giving me so far. It's my first typesetting project, so I really need it.</p>
      <p>--</p>
      <p>Jabez,</p>
      <p>Thanks so much for taking the time to comment.</p>
      <p>-Nav: My hope was that the bottom next to the page numbers would be enough assistance. Do you feel I just need more prominent placement of this, or additional navigation?</p>
      <p>-Spaces: The idea is that they'll write in their own journal rather than in the book to encourage them to use more space.</p>
      <p>-Breaks: Great call on this p. 32 break. I totally missed that.</p>
      <p>-Format: print</p>
      <p>-Folio: I'm not sure I follow here. Each page will be printed independently, one-sided, no left-and-right setup. What do you mean by "the folio on the left page?"</p>
      <p>--</p>
      <p>Frode, great suggestion on Gloriola. Can't switch away from Ratio at this point, though. I've marked the font to come back from it, it's really nice. I also updated the coloring and switched the cover font to Ratio as well. I think getting rid of Klavika certainly helps some. </p>
      <p>See an updated version here: <a href="http://drp.ly/2E01O" title="http://drp.ly/2E01O">http://drp.ly/2E01O</a></p>
