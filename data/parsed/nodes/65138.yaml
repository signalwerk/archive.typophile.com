    html: <p>Is that ps. Ratio you are using? I just saw it, and it looks great. What concerns me is that both that one, and Klavika on the frontpage are very techy designs. (I’m currently considering both for a technology firm.) They’re not really something I’d use for an organization primarly concerned with humans. Also, mixing two sans serifs with a very different structure looks really messy. You should look for a serif and a sans with similar structure/skeleton, or perhaps just make better use of the different weights/widths in a single font family.</p>
