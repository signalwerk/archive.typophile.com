    <p>I was recently tasked with designing a manual for a Christian missions organization. With no style guide, no brand guidelines and no solid precedent, I had near-complete freedom.</p>
    <p>I'd love to hear what you think of the layout, typeface-selection, and heck, even cover design. I've never done a project this long and in-depth before (in terms of amount of information and page length), so I'd love to hear how I can do better in the future.</p>
    <p>I made a couple of decisions that were strange, and I look forward to allowing you to critique my reasoning in follow-up comments, but I hope to hear how it strikes you without first hearing my justifications.</p>
    <p>It's a hair over 1 MB, so you can visit the .pdf in a browser at: <a href="http://drp.ly/2D08V" title="http://drp.ly/2D08V">http://drp.ly/2D08V</a></p>
    <p>Thanks in advance for your thoughts, typophiles!</p>
