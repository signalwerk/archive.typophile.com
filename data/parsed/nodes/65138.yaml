      <p>Some quick thoughts on the layout:</p>
      <p>- Navigational elements<br>
      What's really lacking for me are elements that assist the reader in quick referencing, as well as identify which section he/she is currently reading. I find myself getting lost quite easily.</p>
      <p>- Look out for awkward breaks<br>
      Example: Pg 32: I'd probably move the whole paragraph over.</p>
      <p>- Space for writing<br>
      Is there a reason why you have decided not to have writing space for reflections and/or personal notes? Is the manual is meant to be passed on or reused?</p>
      <p>- Format: Digital or print?<br>
      If this is for digital distribution, that would answer my question about writing space.</p>
      <p>- Folio<br>
      In print, the folio on the left page will end up pretty near the page gutter.</p>
