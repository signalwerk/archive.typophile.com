    html: |-
      <p>@frode and @riccard0, thanks so much for the feedback. It really means a lot that you'd take time to give me feedback on this.</p>
      <p>It is ps Ratio.</p>
      <p>I wanted to go with a clean sans for this to convey simplicity, and I likely over-reacted to a certain extent against the tendency to make all non-profit materials feel "rough" or "grungy." I loved the clean readability of both Klavika and ps Ratio.</p>
      <p>Originally, I was going to go with Klavika for headers and Museo for body copy, but the Klavika felt too cold and the Museo felt too quirky. So in the end, I went with Ratio. I thought it conveyed a human, approachable quality with its heavy weights (specifically the downward serif on the upper end of the "C" and the low mean line on the "A" and "E")  I stayed with Klavika for the cover, as Ratio felt a little *too* quirky and unprofessional to be the face of the entire manual.</p>
      <p>--</p>
      <p>What are some clean and professional, yet human, pairs you guys would suggest in lieu of the ones I chose?</p>
      <p>--</p>
      <p>As far as the dress code, I should clarify that this isn't for a church or for the right to show up on Sundays :) It's for high school students who will be visiting foreign countries (principally South America and Africa), so it's much more an issue of being extra careful to not violate their mores and offend them.</p>
