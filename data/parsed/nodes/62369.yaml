    <div class="info">Submitted by <a href="/user/48528" title="View user profile.">caitlindover</a> : 24.Sep.2009 12.41pm </div>
      <p>Finding the best way to implement type on the web is no simple task. The options for good-looking, functional online fonts are limited, and issues of licensing are complicated. But as more and more design is created for the web, the importance of great type online—and the need for it—is only growing.</p>
    <p>In this presentation, type designer Christian Schwartz will address the pressing problem of type for the web. He’ll look at the pros and cons of the different ways to implement non-standard type choices on the web, and discuss why @font-face still isn’t ready for prime time. And he’ll offer a peek at the future of type on the web.</p>
    <p>To register to attend this presentation, follow this link:</p>
    <p><a href="http://www.printmag.com/Article/September-29-Fonts-that-click" title="http://www.printmag.com/Article/September-29-Fonts-that-click">http://www.printmag.com/Article/September-29-Fonts-that-click</a> </p><div class="imageWrap"><img src="/files/Sept29_Print_image_200_6340.jpg"></div><p></p>
