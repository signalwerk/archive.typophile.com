      <p>You could try ITC Officina Sans -- this passes the 1/I/l test, and it's been expressly designed to save space and hold up well under poor printing conditions while simultaneously being easy to read at small sizes.</p>
      <p>Axel is also very similar to -- albeit narrower than -- Officina.</p>
