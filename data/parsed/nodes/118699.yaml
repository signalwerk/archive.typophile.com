      <p>An often overlooked factor is the is the confusion between _1_, _l_ and _I_ in many sans-serif fonts. I would suggest that for body copy you avoid fonts where you cannot tell them apart except by context.<br>
      I find Tang to be very readable as, even at very small point sizes, perhaps partly because of the use of ink traps as a design feature. Seven weights 22 variants.  Check particularly the book and book small caps. <a href="http://www.myfonts.com/fonts/suomi/tang/" title="http://www.myfonts.com/fonts/suomi/tang/">http://www.myfonts.com/fonts/suomi/tang/</a><br>
      Don</p>
