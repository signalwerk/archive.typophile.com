    <p>I've been tasked with unifying a bunch of different products into one large book. </p>
    <p>Problem #1: The body copy on most of the products is sans-serif so the boss wants to keep all of the body copy as sans-serif. I've tried Trade Gothic, Frutiger, Avant Garde, Franklin Gothic, Futuri, Avenir Next, and Univers and they are all difficult to read in my opinion.</p>
    <p>Problem #2: There are some pages that have plenty of space and not that much text, but there are also pages that are FULL of text so I need a typeface that I can set at small sizes and tight leading and still be readable. Maybe a typeface with a condensed option in addition to the normal weight?</p>
    <p>Problem #3: This product is also "reproduceable" so I need a typeface that is still readable on black and white copies.</p>
    <p>Is this is even feasible? If I can get my company to pay for them, what do you think about using FF Legato, Sensibility, or Whitney?</p>
    <p>Thanks!</p>
