      <blockquote><p>"I've tried Trade Gothic, Frutiger, Avant Garde, Franklin Gothic, Futuri, Avenir Next, and Univers and they are all difficult to read in my opinion."</p></blockquote>
      <p>You named some typefaces that are highly readable as text, and you've listed some that are less so. I suspect that you might think that sans-serif text, in general, is less legible than serif text, which can be debated from both pro and con points of view.</p>
      <p>Still, unless you're designing something for yourself, your opinions on readability should take a back seat to the target audience's opinions. Of course you can't really survey them all to find their preferences, but people tend to think that the typefaces they're most familiar with are most readable. So if you want to play it safe, you might consider using a common, all-purpose, generic sans-serif, like Helvetica or Myriad.</p>
