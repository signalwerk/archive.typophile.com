  html: |-
    <p>STEP Inside Design is a magazine that explores the impact of design on all facets of our lives; how we work, learn, move, communicate, and play. STEP takes readers behind the scenes to meet the creative problem-solvers that make it possible for us to move through the world in brilliant and dynamic ways.</p>
    <p>Type issue is usually May/June.</p>
