    <p>This is a logo I created for a new online biz of mine. Please let me know how you feel about its layout and personality. What do you feel when you look at the logo? Do you feel it has a relationship with something else other than photography? Is it readable? Does it have potential to be a popular logo? Thank you for your feedback!</p>
    <p>Here is the link: <a href="http://picgenic.com/" title="http://picgenic.com/">http://picgenic.com/</a></p>
