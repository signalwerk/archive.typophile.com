      <p>To me the logo looks a little dated; reminds me of some logos from a few decades ago. Don't know if others would react the same way or not.  </p>
      <p>And I find my eye drawn to the "en" (I agree with riccard0's comment) and to the dots on the two "i" characters (since they rise above everything else), but there's nothing very interesting about them as focal points. Perhaps creating something else as a focal point would help. A cap "P" maybe, or putting "Pic" in a different color or weight.</p>
