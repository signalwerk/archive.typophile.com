      <p>A nice series of British ones are the <a class="freelinking external" href="http://www.robertopiecollection.com/application/products/opie/books1GB.asp" rel="nofollow">Robert Opie scrapbooks</a>. His Museum of Brands, Packaging and Advertising is well worth a visit if you are ever in London.</p>
      <p>For late 1800's US there are reprints of the old Sears Roebuck catalogs.<br>
      <a class="freelinking external" href="http://www.google.co.uk/images?q=walker+evans&amp;oe=utf-8&amp;rls=org.mozilla:en-US:official&amp;client=firefox-a&amp;um=1&amp;ie=UTF-8&amp;source=univ&amp;sa=X&amp;ei=oc1uTeTwAtGr8APX58nzDg&amp;ved=0CCwQsAQ&amp;biw=1013&amp;bih=583" rel="nofollow">Walker Evans</a> photographs are great for Depression-era vernacular advertising and signage. There are plenty of books of those.</p>
      <p>I'll add some more once I've had a chance to dig through my shelves and boxes.</p>
