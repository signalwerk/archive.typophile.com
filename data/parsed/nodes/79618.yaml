      <p>This book is amazing: <em>L'affiche dans le monde</em> by Alain Weill. </p>
      <p>It has a lot of advertising design, mainly posters, from product,<br>
      to art to politics from the type-focused beginning in th pre 19th<br>
      century time, and the development of graphic design throughout<br>
      the late 19th and 20th century, up until the 1990s a bit as well.<br>
      It gives not only a more detailed account over many designs from<br>
      up until mid 20th century, but as well a selected and sound over-<br>
      view over advertising in Russia, China, Cuba, Japan, and other<br>
      places of the world, as well as an overview over the second half of<br>
      the 20th century. </p>
      <p>It is not produced anymore, was published in the late 1990s and<br>
      one can still find plenty of used copies on amazon.fr or ebay or<br>
      with a simple google search.</p>
