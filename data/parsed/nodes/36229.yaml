      <p>The AFDKO is a kit containing a set of tools for OpenType font development. The most notable of those tools is MakeOTF, which is the one that, provided with the necessary files, generates OpenType CFF fonts (.otf). I believe this is the code that FontLab and FontMaster carry under the hood.<br>
      In addition to MakeOTF, there are several other tools for tasks such as hinting, testing, and a few macros for FontLab. Here's a small list of some of the other tools included in the AFDKO:</p>
      <p>Autohint — for hinting PFA (Type 1) files. (It is also able to operate on OTF files, but it's not recommended as the resulting font won't be subroutinized, and thus will have a bigger file size)<br>
      CheckOutlines — reports outline-construction errors. Can operate in PFA and OTF files.<br>
      CompareFamily — reports problems found across a family of fonts (OTFs), and in each font individually. (AFAIK, this is the only font development tool in the world that checks the consistency of a font family).<br>
      spot — reports the font’s OpenType data. OT tables can be dumped to a text file, or shown graphically by generating a PostScript file.<br>
      tx — for analyzing and converting the glyph-outline data of TrueType fonts and all OpenType font formats. It can output the results in several formats, including PDF.</p>
      <p>Brief explanation and usage examples of these tools is provided here:<br>
      <a href="https://web.archive.org/web/20150414001834/http://blogs.adobe.com/typblography/typotechnica2007/TypoTechnica2007_FontProduction_at_Adobe.pdf" title="http://blogs.adobe.com/typblography/typotechnica2007/TypoTechnica2007_FontProduction_at_Adobe.pdf">http://blogs.adobe.com/typblography/typotechnica2007/TypoTechnica2007_Fo...</a><br>
      <a href="https://web.archive.org/web/20150414001834/http://blogs.adobe.com/typblography/typotechnica2007/TypoTechnica2007_StateOfTheArt_Font_QE.pdf" title="http://blogs.adobe.com/typblography/typotechnica2007/TypoTechnica2007_StateOfTheArt_Font_QE.pdf">http://blogs.adobe.com/typblography/typotechnica2007/TypoTechnica2007_St...</a><br>
      <a href="https://web.archive.org/web/20150414001834/http://blogs.adobe.com/typblography/typotechnica2007/QE_Outputs.pdf" title="http://blogs.adobe.com/typblography/typotechnica2007/QE_Outputs.pdf">http://blogs.adobe.com/typblography/typotechnica2007/QE_Outputs.pdf</a></p>
