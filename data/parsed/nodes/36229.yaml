      <p>"If it’s possible to install the macro’s in FontLab, it should be able to install it in FontForge"</p>
      <p>Not without work. FontForge's python interface is not identical to FontLab's (I don't know how different they are, but George Williams generally avoids even looking at FontLab for intellectual property reasons). I've considered porting the AFDKO macros to FontForge, but it isn't particularly interesting work, and I don't need it myself (and I haven't heard of anyone else who would be interested until now).</p>
      <p>Another issue for me is that the autohinting module (probably the most interesting part of the AFDKO) is contained in a Windows DLL (presumably the Mac version has the Mac equivalent), which I can't use in Linux, anyway, so the incentive is reduced.</p>
