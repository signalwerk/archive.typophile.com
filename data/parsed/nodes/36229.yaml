    html: |-
      <p>'[...] I believe this is the code that FontLab and FontMaster carry under the hood. [...]'</p>
      <p>Yes, the DTL FontMaster OpenType functionality is based on the SDK. A major difference with FontLab (you must correct me if I am wrong) is that the GSUB and GPOS features listed in the used features file(s) don't have to match the glyph set(s) for generating OT fonts. Features that are not covered by the characters in the outputted font are simply removed during generation. This way it is possible to use features files globally, i.e. for a complete library. New features can be added to a central features file and by generating all applicable OT fonts in batch, subsequently all these fonts will contain the new defined features. Or glyphs can be added to the databases and when covered by the features file re-generating the fonts will result in new features also.</p>
      <p>The features files can also be used locally, i.e. per font and contain the necessary naming and metrics info for a particular font. When used globally in batch this info is taken from the UFM files belonging to the glyph databases (these are connected by file name). The kern info is taken then from an attached AFM or kern.fea file. Switching between the naming and metrics info in the features file and the information in the UFM and kern files can be done by adding a few lines at the end of the features files and subsequently activating or de-activating these.</p>
