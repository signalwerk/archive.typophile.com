      <p>&gt; <em>Better? More industry-standard/compliant?</em></p>
      <p>Through the AFDKO, Adobe makes publicly available the exact same tools that are used in-house for building and testing its fonts. What you or other parties eventually do with it won't necessarily be better or worse. The only guarantee is that whoever uses the AFDKO tools has the potential to make fonts as good as Adobe's (technically at least).<br>
      Deciding for one tool or another will also depend on your workflow, platform, preferences, computer skills, needs, etc.</p>
