      <p>As to your quote from the Installation Guide, the non-bolded and the bolded sections refer to different parts of AFDKO.<br>
      The first: to the AFDKO which is an independent set of tools (MakeOTF, compareFamily, etc).<br>
      The second: to the (additional) macros for FontLab which must be run from within FontLab Studio and rely on FLS's own Python API and are supposed to modify FLS's font files -- so it is rather unlikely that these will work in FontForge.</p>
