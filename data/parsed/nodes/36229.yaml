      <p><cite>Is there any difference (technically) in the fonts generated by the two programms?</cite></p>
      <p>You could use TTX to convert both FontForge- and AFDKO-generated OTFs into the .ttx format (xml representation of OTFs) and compare the tables' content. Ideally, you would use a FontForge-generated OTF as input for AFDKO, so you can compare what both tools do with 'the same font'.</p>
      <p>Karsten</p>
