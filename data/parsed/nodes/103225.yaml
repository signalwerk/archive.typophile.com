      <p>Helvetica or Arial as text fonts on screen and in print are two different animals. I like the late Paul Rand's view, who told an assistant not to use Helvetica in text. When asked, "Why?" He replied "because it looks like dogshit in text." </p>
      <p>In general, I think it is clear that serifs are better for extended text in print, even though there is no scientific proof of it. Certainly, the vote of publishers and readers has gone that way, even though sans have been fully accepted in headings. </p>
      <p>Aside from the question of the aesthetic look you want, Adobe Garamond in my opinion has problems at smaller sizes. Garamond Premier, which has optical sizes, has a beautiful text size. </p>
      <p>It you want something fresher in the same general line as Garamond, look at the wonderful new <a class="freelinking external" href="http://typographica.org/typeface-reviews/agmena/" rel="nofollow">Agmena</a> </p>
      <p>I admit Paul Rand's view has to be modified somewhat now because of <a class="freelinking external" href="http://www.fontbureau.com/nhg/" rel="nofollow">Neue Haas Grotesk</a>. Christian Schwartz did a text size, which can work nicely in short texts at relatively small sizes. But as I say, I don't think any sans is appropriate for extended text. </p>
      <p>The problem here is that the notion of 'readability' is confused. I think the appropriate notion is in terms of ease or comfort in reading, and there I think in extended text, a very good serif will win the race.</p>
