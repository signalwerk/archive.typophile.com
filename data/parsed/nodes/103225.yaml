      <p>Young people have to read too. It has little to do with failing eyesight. Readability is not essentially determined by familiarity. Helvetica has low readability (mostly due to its overly-tight spacing, but also for the paucity of its extenders). Plus it's overused, especially by mega-corporations (that don't even like religion :-). It's the first font you should totally avoid. Well, after Arial.  :-)</p>
      <p>Garamond is indeed too old-fashioned (here and in general) but don't blame the serifs. If you want a sans that's highly readable, use Legato. But probably the wife won't let you, so look for a contemporary serif font - there are tons of them.</p>
      <p>And anecdotal wisdom trumps poorly conceived and executed field testing any day.</p>
      <p>hhp</p>
