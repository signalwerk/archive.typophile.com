    <p>So I've just redesigned a publication of ours where I work and opted to use Helvetica for the body text as it looks so much smoother and, in my opinion, much more contemporary than their current use of Adobe Garamond Pro.  </p>
    <p>However, I was approached today by my superior who told me that his wife (whom is a copy editor) "had a lot of issues with using Helvetica and not a serif font for print."</p>
    <p>While serifs ARE easier for readability sake on print media, I'm a bit surprised that she seems to be unaware with how many people are using Helvetica to reach out to a plethora of audiences.  Our publication would reach mostly (but not only) those in their 40's-50's, and I can understand if this is where she's frustrated, but neither of those age groups are so old that they couldn't read a SOO commonly used font.  </p>
    <p>What are your guys' thoughts?  Why are so many publications using Helvetica, Akzidenz, etc, if studies show readability for printed media is best when found in serif?  I wonder what the greater percentage of readability is for a serif?  I'd like to have an informed answer for her.</p>
    <p>Thanks!</p>
