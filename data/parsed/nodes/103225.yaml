      <p>Helvetica is more recently designed than Garamond, but it is still a 19th century grot.<br>
      Both Helvetica and Adobe Garamond have currency, acquired through reputation, bundling, and subsequent heavy usage.<br>
      The downside of their success—they have become bland and generic.<br>
      Why not use a truly contemporary serif design?</p>
      <p><em>neither of those age groups are so old that they couldn't read a SOO commonly used font.</em></p>
      <p>The issue is not familiarity, but failing eyesight.<br>
      Helvetica’s tight ﬁt and similarity of shapes (e.g. a, e and s) make it hard to read if a bit out of focus.</p>
