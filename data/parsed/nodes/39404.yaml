      <p>Yet another possibility:</p>
      <p>When reading Adam's post, I thought: Why not add a (FontMaster) BE format reader/writer to RoboFab? That way, RoboFab rather than FLS or FM themselves would serve as bridges between FLS and FM. My impression is that BE and UFO have more in common than either BE or UFO with VFB. The BE--UFO conversion could work outside of FLS,* the VFB--UFO and 'direct' VFB--BE conversion would require that scripts which read UFO/BE files are used from within FLS.</p>
      <p>* After all, as Mr Blokland said, the BE format is an 'open' format in that it is fully documented in Peter Karow's books, so anybody actually can read/write it.</p>
      <p>Using RoboFab and its UFO as mediator would raise interesting questions: Which information are essential for fonts, regardless of the font editor? Is it possible at all to draw a line between font info and an application's options?<br>
      The available font info (names, metrics, the way font-wide hinting information are provided, etc) slightly differ in FLS and FM.<br>
      Looking at font names, as one example, these differ a bit with both applications since each of them has its own approach to, and mechanisms for, filling in the 'name' table from user-defined font names. (Speaking of OT fonts.) This means, what appears to be 'mere' font info actually interact with what the font editor does with them upon generating fonts.<br>
      This raises the question which data a 'meta' font format needs to provide. In my own attempts to 'externalize' some FLS font info to text files (trying to be able to reproduce font generation exactly any time later) I found that this requires not only font info themselves but certain options too which are, strictly speaking, not font but application dependent. UFO as a 'meta' format had to deal with the same question. Last time I checked (some time ago), its font info did not cover every data that I needed to generate a font. (Put differently, whenever a RoboFab-based script uses '.naked()' this means that it touches RoboFab's limits -- and relies on FLS.) How should UFO deal with font info that are specific to either FLS or FM? Currently this is not a real problem since, in real world use, RF/UFO serves merely as an FLS add-on: the existing FoboFab/UFO based stand-alone applications help modifying font data, but to generate PST1, TT or OT fonts one needs to import them back to FLS.<br>
      Other aspects: masters, anchors, hints, etc.</p>
      <p>Still I plan to make a more detailed comparison of certain aspects of FLS and FM (which may be useful for RF/UFO as a mediator too) ...</p>
      <p>Since I used abbreviations:<br>
      FLS &amp; VFB: <em>FontLab Studio &amp; its font format</em><br>
      FM &amp; BE: <em>DTL FontMaster &amp; its font format</em><br>
      RF &amp; UFO: <em>Letterror RoboFab &amp; its font format</em></p>
      <p>Karsten</p>
