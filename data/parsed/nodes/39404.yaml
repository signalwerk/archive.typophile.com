    <p>Hi all,</p>
    <p>What I trying to do here is find a quicker way to position the accents on italic glyphs. </p>
    <p>The process I'm usng at the moment - </p>
    <p>1. With the base glyph and accent in place - Glyph &gt; create glyphs (Picture 1)<br>
    2. In the glyph window I select the accent and use center. (Picture 2)</p>
    <p>This seems to work fine as a starting point, but it's really repeative, I was looking for a quicker method possible using a python script.</p>
    <p>I've had experience with other languages such as ActionScript and PHP, I'm comfortable with the idea of scripting but I've only just started looking at RoboFab and Python so I could have this completely wrong.</p>
    <p>I wrote this code today in an effect to speed up the process, thinking if I had a value for the aacute I could then use it for the eacute etc. </p>
    <p><code><br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()<br>
    acute = 20<br>
    upperShift = 80<br>
    upperAcc = 164<br>
    grave = 45<br>
    circumflex = 0<br>
    dieresis = 10<br>
    aring = 70<br>
    tilde = 15<br>
    macron = 30<br>
    breve = 22<br>
    f['aacute'].components[1].offset = (acute,0)<br>
    f['agrave'].components[1].offset = (grave,0)<br>
    f['acircumflex'].components[1].offset = (circumflex,0)<br>
    f['adieresis'].components[1].offset = (dieresis,0)<br>
    f['atilde'].components[1].offset = (tilde,0)<br>
    f['aring'].components[1].offset = (aring,0)<br>
    f['amacron'].components[1].offset = (macron,0)<br>
    f['abreve'].components[1].offset = (breve,0)<br>
    #<br>
    f['ccedilla'].components[1].offset = (0,0)<br>
    f['cacute'].components[1].offset = (acute,0)<br>
    f['ccircumflex'].components[1].offset = (circumflex,0)<br>
    f['cdotaccent'].components[1].offset = (aring,0)<br>
    f['ccaron'].components[1].offset = (circumflex,0)<br></code></p>
    <p>It works to a point but it would be quicker to go to each glyph and use the center method. What I thought would be useful is a center method to use within the code, something like - </p>
    <p><code><br>
    f['aacute'].components[1].offset = (center,0)<br>
    f['agrave'].components[1].offset = (center,0)<br>
    f['acircumflex'].components[1].offset = (center,0)<br></code></p>
    <p>So my question is, is this possible</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Picture%201_36.jpg" width="260" height="376" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Picture%202_7.jpg" width="308" height="403" alt="">
