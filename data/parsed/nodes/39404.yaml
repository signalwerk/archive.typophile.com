      <p>placing accents is easier and faster if you use anchors. you could write code to center the accent to the base-glyph's width... but for accent placement what matters it the optical center, not the mathematical one. with anchors you can mark the alignment points optically.</p>
      <p>robofab comes with an accent building tool – have you read <a href="http://www.robofab.org/howto/buildingaccents.html">this page</a>?</p>
      <p>you might also want to take a look at ben kiel's <a href="http://www.benkiel.com/typeDesign/">accentTools</a>.</p>
      <p>good luck,<br>
      - gustavo.</p>
