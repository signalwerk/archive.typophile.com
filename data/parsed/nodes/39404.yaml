      <p><em>I don’t use anchors at the moment cos I found it quicker and easier to select all the emtpy accent glyph windows and then use Glyph &gt; Create glyph.</em></p>
      <p>anchors and the create glyphs functions work together. what you do is set up your anchors on your base characters using a name such as “anchor” and then set them on your diacritics using a name such as “_anchor,” so that they are the same except for the underscore before the diacritic anchor names. Once you have these set up, you run the create glyphs action and all your diacritics snap into place. it’s a great time saver.</p>
