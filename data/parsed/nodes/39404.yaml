      <p>Update:</p>
      <p>I tried the Anchors method but found it more time consuming than my orginal method.</p>
      <p>So this is the method I came up with:</p>
      <p>1. I generated the Accent glyphs using the Glyph &gt; Create Gylph which results in the accent being in the wrong position over to the left   <img src="/sites/default/files/old-images/Picture-1_4889.gif"></p>
      <p>2. With experiments it looks like the distance the accent has to move over to the left to be somewhere in the correct position can be applied to all the lowercase accent glyphs. <img src="/sites/default/files/old-images/Picture-2_4765.gif"></p>
      <p>I wrote this script to move all the accents over by a set amount</p>
      <p><code><br>
      from robofab.world import CurrentFont<br>
      f = CurrentFont()<br>
      shift = 90<br>
      UppShift = 132<br>
      #<br>
      #LowerAccents---------------<br>
      #<br>
      aacute = f['aacute'].components[1]<br>
      agrave = f['agrave'].components[1]<br>
      acircumflex = f['acircumflex'].components[1]<br>
      adieresis = f['adieresis'].components[1]<br>
      atilde = f['atilde'].components[1]<br>
      aring = f['aring'].components[1]<br>
      amacron = f['amacron'].components[1]<br>
      abreve = f['abreve'].components[1]<br>
      #<br>
      aacute.move((shift,0))<br>
      agrave.move((shift,0))<br>
      acircumflex.move((shift,0))<br>
      adieresis.move((shift,0))<br>
      atilde.move((shift,0))<br>
      aring.move((shift,0))<br>
      amacron.move((shift,0))<br>
      abreve.move((shift,0))<br>
      #<br></code></p>
      <p>The code seems verbose to me, I'm sure the use of an array with a loop would streamline it down.<br>
      I've just started with Robofab/Python so i wouldn't know if that's possible or the syntax</p>
      <p>Anyway the code seems to work for me.</p>
      <p>Rr.</p>
