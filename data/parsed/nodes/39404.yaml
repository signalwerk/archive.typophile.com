      <p>[Thank you! Change the link. And the order of posts too ...]</p>
      <p>Regarding the method of using Anchors and “Glyph &gt; Generate Glyphs ...”, you can also use the “Glyph Generator” script from <a href="http://www.kltf.de/kltf_otproduction.htm">here</a>. The script does the same thing as the “Generate Glyphs ...” panel but more automatically: it generates all composite glyphs defined in the alias.dat if both base glyph and accent glyph are present in the font. This requires that you adjust the alias.dat file to match your desired glyph set. (Make a backup of the original!) For the syntax of alias.dat, see the little help button in the “Generate Glyphs ...” panel.</p>
      <p>Yesterday’s thought:<br>
      Anchors are helpful, but placing them correctly needs visual control which Anchors themselves do not provide. They are just dots. A visual check of the positioning requires a “real” diacritic glyph (with base glyph and accent).<br>
      What about combining Rachel Roberts’ and the Anchor/”Glyph &gt; Generate Glyphs ...” methods? This could work like this:<br>
      Add a special ’ACCENT’ glyph (and ’ACCENT.uc’ and ’ACCENT.sc’ if you use uppercase &amp; lowercase variants) to the font. Take the outline of an accent which is easy to position. And add, for every base glyph (’a’), a pseudo-diacritic glyph (’a_DIACRITIC’, made of the components ’a’ and ’ACCENT’).<br>
      [If you desparately want to use Anchors, a script may grab the Anchor position from the placement of these default accents in the pseudo-diacritic glyph. Then standard scripts like Ben’s or the one mentioned above can be used to create diacritic glyphs. But the more direct way would do this:]<br>
      Finally, a glyph generator script reads the position of the ’ACCENT’ component in every pseudo-diacritic gl</p>
