      <p>Frank, </p>
      <p>I think those "reinventions" are quite common in most industries. The interesting thing is that whenever a 3rd party comes to look at an existing solution, they usually take some aspects from it, and then it mixes if with new ideas of their own. For example, it is quite obvious that FontLab 4, compared to version 3, was heavily influenced by Fontographer, and then FontLab Studio 5 was somewhat influenced by FontStudio. A shareware font editor FontCreator was recently influenced by FontLab Studio a lot, and FontLab Studio has adopted a few of their ideas as well. </p>
      <p>Also, sometimes these reinventions happen completely independently -- especially if there are some mathematical, "objective" solutions to certain problems, then it is quite likely that different people arrive at the same conclusions independently of each other. </p>
      <p>I don't know if it is a good or bad thing, but I believe the influence of Ikarus and DTL FontMaster of FontLab Studio and other Fontlab Ltd. products has been rather small. For example, I have never worked with Ikarus nor FontMaster, and never owned a license of either product. But I guess some influence went in, often because users of FontLab Studio suggested features that they have previously seen in Ikarus. </p>
      <p>I must admit that I was particularly thrilled to meet Dr Peter Karow this year at the typographic conference in Thessaloniki. I've spent many hours on discussions and exchanging ideas with him, and was very impressed (I had known some of his work through his writings previously, but there were major parts that I was not aware of). </p>
      <p>Since you have spoken of a certain primary aspect of FontMaster, let me say that in my opinion, one of the unique and important aspects of FontLab Studio, which has always been a focal point in Yuri's development, was the "roundtrip interactive" aspect of the tool. This means that in FontLab Studio, you can take an existing font or start a new one, and then make some changes to an existing glyph or draw a new one, then do some spacing, then do some hinting, then go back to drawing, then do some hinting again and some spacing, and then perhaps some more drawing -- all in just one tool. And during all of that, FontLab Studio maintains as much as possible of the other data. For example, if I open an existing hand-hinted TrueType font and add just one glyph, all of the font's tables, hand hinting, OpenType code etc. remains intact. </p>
      <p>This aspect of the tool was developed especially because Yuri did not want to make a hard separation between source files and final files. In a sense, he arrived at the conclusion that the final files are often the best source files. </p>
      <p>I guess that is also one of the main differences, especially when comparing older versions of FontLab and FontMaster. FontLab was in the past highly interactive but had limited batch abilities, while I was under the impression that FontMaster excelled in batch functionalities but was rather limited in the "roundtrip interactivity" aspect. This made the original FontLab a great tool for smaller foundries and original designers while FontMaster was I guess a great tool for very large font libraries. </p>
      <p>But I guess in the more recent years, the applications started gaining what they lacked before -- FontLab and later FontLab Studio developed many batch abilities, since Python support was added in version 4, while I am under the impression that FontMaster added some interactive features not present before. </p>
      <p>I guess both DTL and Fontlab Ltd. are -- in their own way -- trying to make tools suitable for all possible scenarios. I guess some users would be interested in using both FontLab's and DTL's tools, but it's somewhat unfortunate that there are hardly any practical ways to exchange data between those applications. </p>
      <p>Perhaps both Fontlab Ltd. and DTL should consider adding native support for the UFO and GLIF formats developed by the RoboFab group? Those files use XML, which is pretty much a prerequisite in today's data exchange, and they are already used by FontForge, the third player on the market. Fontlab Ltd. purchased a license for RoboFab from its developers some time ago, and we are working on better integrating it with our applications -- I wonder if DTL would be interested to do that as well? </p>
      <p>Regards,<br>
      Adam</p>
