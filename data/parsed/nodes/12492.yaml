    html: <p>Yes, they can certainly be <em>found</em> there, but good luck getting The Foundry to actually <em>sell</em> any of them to you. I came across Architype Renner myself, after reading about the design of <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a> in <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Robert Bringhurst</a>'s <a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Elements of Typographic Style</a> and trying to see if I could find the original, more radical letter forms Bauer had opted to omit from the typeface as they issued it. Unfortunately, the folks at the Foundry are sometimes unresponsive to queries. Let us know if you get ahold of them. It would be nice to know how much they want for the Architype collections.</p>
    html_clean: <p>Yes, they can certainly be <em>found</em> there, but good luck getting The Foundry to actually <em>sell</em> any of them to you. I came across Architype Renner myself, after reading about the design of <a href="/wiki/Futura" class="freelinking link-lost" rel="nofollow">Futura</a> in <a href="/wiki/Robert%20Bringhurst" class="freelinking link-lost" rel="nofollow">Robert Bringhurst</a>'s <a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking link-lost" rel="nofollow">Elements of Typographic Style</a> and trying to see if I could find the original, more radical letter forms Bauer had opted to omit from the typeface as they issued it. Unfortunately, the folks at the Foundry are sometimes unresponsive to queries. Let us know if you get ahold of them. It would be nice to know how much they want for the Architype collections.</p>
