  html: |-
    <p>I was searching for a font called Architype Renner, part of a series that includes Architype Van Doesburg, Architype Tschichold, Architype Bayer, Architype Van Der Leck and Architype Bill.<br>
    These fonts were formerly sold through Fonthaus.<br>
    The collection can now be purchased from Foundry in the UK ((Freda Sack and David Quay's company, home of Gridnik).<br>
    <a href="http://www.foundrytypes.co.uk" title="http://www.foundrytypes.co.uk">http://www.foundrytypes.co.uk</a><br>
    (Architype 2, which they also sell, includes Architype Renner Bold, Architype Albers, Architype Bayer-Type, Architype Ballmer, Architype Schwitters, Architype Aubette).</p>
