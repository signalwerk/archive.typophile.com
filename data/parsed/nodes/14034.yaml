    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : <a href="/wiki/Design%20Applications" class="freelinking" rel="nofollow">Design Applications</a> : TeX</strong></p>
    <p>TeX, written as TeX in plain text, is a typesetting system created by <a href="/wiki/Donald%20Knuth" class="freelinking" rel="nofollow">Donald Knuth</a>. It is popular in academia, especially in the mathematics, physics and computer science communities. </p>
    <p>TeX is generally considered to be the best way to typeset complex mathematical formulas, but, especially in the form of <a href="/wiki/LaTeX" class="freelinking" rel="nofollow">LaTeX</a> and other template packages, is now also being used for many other typesetting tasks.</p>
    <p><a href="/wiki/ConTeXt" class="freelinking" rel="nofollow">ConTeXt</a> and <a href="/wiki/XeTeX" class="freelinking" rel="nofollow">XeTeX</a> are other macro-packages of TeX and is used for <a href="/wiki/Desktop%20Publishing" class="freelinking" rel="nofollow">Desktop Publishing</a>.</p>
