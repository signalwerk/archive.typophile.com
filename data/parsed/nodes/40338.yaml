      <p>As I learn German since 2006, I've encountered some things that disturbed my eyes in German texts : the lack of NECESSARY ligatures that makes the text pleasant to read. Just like Florian Hardwig explained it very well above in the thread : the glyphs (f+umlaut) are often in collision. Since the beginning of the metal type, the type designers have created special ligatures in order to avoid these problems. Unfortunately this scheme applies only for a few languages today. Since a long time, I was asking to myself : Has a designer created a typeface with such ligatures already ?</p>
      <p>Today I discovered Ingeborg, by Typejockeys. It has won the TDC awards in 2010. And it has those special ligatures.<br>
      I was amazed !</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DA-Fas1_4474.gif"></div><p></p>
      <p>better image <a class="freelinking external" href="http://img851.imageshack.us/img851/6230/ingeborgfligs.jpg" rel="nofollow">http://img851.imageshack.us/img851/6230/ingeborgfligs.jpg</a></p>
      <p>Anyone knows other typefaces with those specifications ?</p>
      <p>carlos</p>
