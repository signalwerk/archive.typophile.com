      <p>Hi Stuart,<br>
      I always think of common pairings like Th, th, tt, and certainly ff. The extended f ligs used mostly in other languages fj ffj fh ffh fk ffk and fb ffb are more often seen now with opentype. I have done some goofy ones in my Froggy typeface including gg, ggy, gy, and gh but they are discretionary to say the least :-)</p>
      <p>ChrisL</p>
