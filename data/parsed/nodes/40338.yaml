    <p>Being that it's the holidays and there may be more than a few of us trolling around looking for topics to dig into, I thought up a juicy topic that may or may not have already been covered but I think it's worth further discussion regardless . . .</p>
    <p>As OpenType gives us the auto ligature feature, it occurred to me, what are the MOST useful ligatures that I could add to my fonts . . .</p>
    <p>Now, before I throw this out there, I'm already throwing out the common ffl ffi ae oe deal because how often can one eat a waffle while reading an encyclopaedia?</p>
    <p>And to further up the ante, I'm thinking this in reference to more display oriented designs rather than text faces . . .</p>
    <p>I'm looking for good common substitutive ligatures that can give the effect of non-repeating forms such as oo, ll, ee, and ss, etc . . .</p>
    <p>Ideally, I'd like to come up with a top 10-20 that would be a standard for most fonts . . .</p>
    <p>At worst, any fonts you can point to that may feature a thoughtful approach would also make for good fodder . . .</p>
    <p>Cast away . . .</p>
    <p>Stuart :D</p>
