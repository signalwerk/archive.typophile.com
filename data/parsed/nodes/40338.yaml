      <p>I would echo what was said about intent being key. If you want to make a silly/fun/expressive/threatening/(insert your display description here) font more so then what you choose to ligate &amp; why is completely different than if you are making a text face. </p>
      <p>So I guess I am saying that building a laundry list isn't what I would suggest. </p>
      <p>Also contextual substitution might be a better route in some cases because it leaves the fonts free to be rough ridden more evenly by designers ( take that! ya!).  Whereas a ligature will just break the word when they track it out at 200 or whatever they decide is needed. And a contextual sub can be made to build a ligature if it's really needed.</p>
