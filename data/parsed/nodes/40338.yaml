      <p>Sorry. I didn't realize how opaque some of this was. I will do my best. </p>
      <p>In the case of backwards compatibility I am saying that a text can be hard-encoded to include the glyph for ff or fi for instance. And if you had a text like that you could loose the meaning of the text if you didn't include the single unicode glyphs 'ff' or 'fi' in your font. </p>
      <p>On the other hand, if you had a common sort of text - the sort we set 99.9 % of the time - with fand i or fandf indicated as separate glyphs you could allow the ff &amp; fi to interpreted into the visual appearance/shape of a classic ff or fi ligature but using coding to make two glyphs overlap. </p>
      <p>And as far as why you would want to - a regular one glyph ligature often looks quite wrong with only fairly minor tracking. </p>
      <p>So.. one solution to that ( apart from not tracking a font )  is that as a font designer you could contrive a design that let the shapes ( within a tight range probably ) to flex in tracking right along with the other letters. Then inter letter spacing wold be consistent. </p>
      <p>Probably the best thing to do is to make a visual reference! I have been meaning to make a stab at one for some time in order to see what results were possible. And to see what the practical limitations might be.</p>
