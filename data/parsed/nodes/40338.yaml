      <p>Don't forget, æ and œ are counted as distinct letters in certain languages' orthographies rather than simple ligatures. They're hardly ever used in modern English, true, but are a requirement in others, like French or Icelandic (which has a few other noteworthy extensions too).</p>
      <p>As for suggestions on novel ligatures, look for combinations where ordinary letters would collide, particularly in the descenders, g_j, g_y, g_g, j_j, and almost anything preceding j.</p>
