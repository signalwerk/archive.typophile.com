    html: "<p>&gt; Why not ? May be with BitFonter ?  <br> <br>As far as I know contemporary MacOS only supports outline fonts, and furthermore ignores any bitmaps TT fonts might have embedded. But maybe I'm wrong? <br> <br>As for the nominal-dpi difference between platforms, there's not much you can do: a 16 PPEM font will be seen in [default] Windows as \"12 point\". But Photoshop in Windows will see it as 16 point <i>if</i> the document you're working has its dpi set to 72. <br> <br>hhp <br></p>"
