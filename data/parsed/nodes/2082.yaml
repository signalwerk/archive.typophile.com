    html: "<p>&gt;16 pt on Mac are now in 12 pt on PC <br> <br>Christophe, you may be running into the 96ppi vs 72ppi display difference on the two platforms. Essentially because Windows use 96ppi to figure out how to draw stuff, things come out looking smaller than on a Mac. How to get past this problem in producing a font like this is beyomd me. Hrant may have some good insight into the size difference and how to compensate / allow for it in your production. <br> <br>I like this face - it's quite nice, and I think that Hrant may be right: useful for text at high resolutions. <br> <br>Jon</p>"
    html_clean: "<p>&gt;16 pt on Mac are now in 12 pt on PC <br> <br>Christophe, you may be running into the 96ppi vs 72ppi display difference on the two platforms. Essentially because Windows use 96ppi to figure out how to draw stuff, things come out looking smaller than on a Mac. How to get past this problem in producing a font like this is beyomd me. Hrant may have some good insight into the size difference and how to compensate / allow for it in your production. <br> <br>I like this face - it's quite nice, and I think that Hrant may be right: useful for text at high resolutions. <br> <br>Jon</p>"
