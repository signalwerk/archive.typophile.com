  - id: 16479
    user: 2046
    date: 2003-11-30T02:26:00
    date_raw: 30 Nov 2003 — 2:26am
    votes: null
    html: <p>Bonsoir Christophe ettoutlemonde, <br> <br>TRUTH in Design will sort out how to use grayscale bitmap fonts all over MacOS. Until then, as reported, they work great in Flash and Photoshop. <br> <br>The trouble is, there is no cross-platform bitmap font standard except TrueType and OpenType pixel fonts. Even MacOS which gave us brilliant post-PARC typography (<a href="http://www.kare.com/MakePortfolioPage.cgi?page=4" target="_blank">http://www.kare.com/MakePortfolioPage.cgi?page=4</a>) has now abandoned its bitmap font heritage. shame. Upside is, if they support pixel sizes, they have to support pixel fonts. Details to be posted to this board. As far as bitmap&lt;-&gt;outline correlation, it may have to be handled by the designer, not insensitive operating systems and apps. <br> <br>TiD wants to publish MR. PIXEL. Qu'en pensezvous M. Badani?</p>
    html_clean: <p>Bonsoir Christophe ettoutlemonde, <br> <br>TRUTH in Design will sort out how to use grayscale bitmap fonts all over MacOS. Until then, as reported, they work great in Flash and Photoshop. <br> <br>The trouble is, there is no cross-platform bitmap font standard except TrueType and OpenType pixel fonts. Even MacOS which gave us brilliant post-PARC typography (<a href="http://www.kare.com/MakePortfolioPage.cgi?page=4" target="_blank" class="link-external">http://www.kare.com/MakePortfolioPage.cgi?page=4</a>) has now abandoned its bitmap font heritage. shame. Upside is, if they support pixel sizes, they have to support pixel fonts. Details to be posted to this board. As far as bitmap&lt;-&gt;outline correlation, it may have to be handled by the designer, not insensitive operating systems and apps. <br> <br>TiD wants to publish MR. PIXEL. Qu'en pensezvous M. Badani?</p>
