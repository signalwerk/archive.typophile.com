    votes: null
    html: "<p>Hrant: I generate a PC version &amp; I send you. <br> <br>This font are designed in only one size (16 pt or pixel) with bitmap and PS contour. This is a screen font, bitmap font, no grayscale. I made this for the new version of my website (not visible at this moment), I wanted a special typography for the titles of sections. <br>For the moment, this font is Postscript version (Mac and Win). Use it as usual. But, on Photoshop, on font specifications, set in 16 pt and select \"No smothing\" or \"Net\" (I don't know how it is in english version, but I put a screen shoot). Of course, Zoom must be set at 100 %. This font are well on Flash too. <br>I have a question: I want generate TrueType or OpenType version. But for that, I must embed bitmap infos into font. How can I do that ? I know BitFonter, but I don't have this soft (it's too expensive for me for the moment). Do you know a free utility able to do that ? or a tips ? I work on Mac (OS9 and X), on PC (wind XP), I have Fontographer &amp; Fontlab 4.6. <br><img src=\"http://www.typophile.com/forums/messages/29/20699.gif\" alt=\"ecran1\"> <br> <br>Stephen: Thanks for your remark, I try something to change 'v' &amp; 'w'. <br>---------------- <br> <br>I think that designing this kind of font are very cool (educational) for those who want learn type design. <br> <br></p>"
    html_clean: "<p>Hrant: I generate a PC version &amp; I send you. <br> <br>This font are designed in only one size (16 pt or pixel) with bitmap and PS contour. This is a screen font, bitmap font, no grayscale. I made this for the new version of my website (not visible at this moment), I wanted a special typography for the titles of sections. <br>For the moment, this font is Postscript version (Mac and Win). Use it as usual. But, on Photoshop, on font specifications, set in 16 pt and select \"No smothing\" or \"Net\" (I don't know how it is in english version, but I put a screen shoot). Of course, Zoom must be set at 100 %. This font are well on Flash too. <br>I have a question: I want generate TrueType or OpenType version. But for that, I must embed bitmap infos into font. How can I do that ? I know BitFonter, but I don't have this soft (it's too expensive for me for the moment). Do you know a free utility able to do that ? or a tips ? I work on Mac (OS9 and X), on PC (wind XP), I have Fontographer &amp; Fontlab 4.6. <br><img src=\"http://www.typophile.com/forums/messages/29/20699.gif\" alt=\"ecran1\"> <br> <br>Stephen: Thanks for your remark, I try something to change 'v' &amp; 'w'. <br>---------------- <br> <br>I think that designing this kind of font are very cool (educational) for those who want learn type design. <br> <br></p>"
