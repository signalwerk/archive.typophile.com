    html: '<p>&gt; This is a screen font, bitmap font, no grayscale. <br><br><span class="caps">FYI</span>: Truth in Design now has a way to deliver grayscale <i>bitmap</i> fonts reliably and portably. <br><br>If you want to make embedded (true) bitmap fonts: <br>1) For MacOS you can’t any more. <br>2) For Windows you don’t absolutely need BitFonter (unless you’re making grayscale bitmaps), all you need is a free <span class="caps">MS</span> utility called <span class="caps">SBIT</span>. <br><br>&gt; designing this kind of font are very cool (educational) for those who want learn type design.  <br><br>I agree — although many “classical” designers don’t — some of them even think you have to be right-handed, if you know what I mean… My ﬁrst fonts were 8x8 bitmaps for Armenian and Arabic on a <span class="caps">C64</span>. <br><br>hhp <br></p>'
