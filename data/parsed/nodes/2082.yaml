    html: "<p>Thanks for the oﬀer! What format would you send it though? I’m [generally] on Windows. <br><br>Anyway, what I’m mostly wondering is this: Since this is a large design, but with good weight and spacing, how does it function as a <i>text</i> font for hi-res displays? I’m hoping John Hudson will chime in. <br><br>And the main reason I’m curious is that I’ve been working on a similar font since ‘98, but mine uses grayscaling, so it requires special treatmen/usage. It will be released soon. <br><br>hhp <br></p>"
