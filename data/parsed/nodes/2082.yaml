    html: '<p>&gt; Why not&nbsp;? May be with BitFonter&nbsp;?  <br><br>As far as I know contemporary MacOS only supports outline fonts, and furthermore ignores any bitmaps <span class="caps">TT</span> fonts might have embedded. But maybe I’m wrong? <br><br>As for the nominal-dpi diﬀerence between platforms, there’s not much you can do: a 16 <span class="caps">PPEM</span> font will be seen in [default] Windows as “12 point”. But Photoshop in Windows will see it as 16 point <i>if</i> the document you’re working has its dpi set to 72. <br><br>hhp <br></p>'
