    html: '<p>&gt;16 pt on Mac are now in 12 pt on <span class="caps">PC</span> <br><br>Christophe, you may be running into the 96ppi vs 72ppi display diﬀerence on the two platforms. Essentially because Windows use 96ppi to ﬁgure out how to draw stuﬀ, things come out looking smaller than on a Mac. How to get past this problem in producing a font like this is beyomd me. Hrant may have some good insight into the size diﬀerence and how to compensate / allow for it in your production. <br><br>I like this face — it’s quite nice, and I think that Hrant may be right: useful for text at high resolutions. <br><br>Jon</p>'
    html_clean: '<p>&gt;16 pt on Mac are now in 12 pt on <span class="caps">PC</span> <br><br>Christophe, you may be running into the 96ppi vs 72ppi display diﬀerence on the two platforms. Essentially because Windows use 96ppi to ﬁgure out how to draw stuﬀ, things come out looking smaller than on a Mac. How to get past this problem in producing a font like this is beyomd me. Hrant may have some good insight into the size diﬀerence and how to compensate / allow for it in your production. <br><br>I like this face — it’s quite nice, and I think that Hrant may be right: useful for text at high resolutions. <br><br>Jon</p>'
