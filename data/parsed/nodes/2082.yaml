    html_clean: "<p>&gt; 1) For MacOS you can't any more. <br>Why not ? May be with BitFonter ? <br> <br>&gt; 2) For Windows you don't absolutely need BitFonter (unless you're making grayscale bitmaps), all you need is a free MS utility called SBIT.  <br>Thanks for the info. <br> <br>&gt; I agree - although many \"classical\" designers don't - some of them even think you have to be right-handed, if you know what I mean... <br>I know, but I never said it was the only thing to do to learn type design. <br> <br>Here is new image with new design of v, w, x in lc and cap. <br><img src=\"http://www.typophile.com/forums/messages/29/20730.gif\" alt=\"Mr_pixel_v2b\"> <br> <br>About my PC Type1 version, there is something of strange: when I open my Fog file (native Mac) on PC, the bitmap which I had generated into 16 pt on Mac are now in 12 pt on PC. But all seems ok when I set in 16 Pt in photoshop for example. Idea ? <br> <br></p>"
