    html: <p>I'm on a 15inch Powerbook at 1280x845. I don't know what <br>that is in PPI, but it looks great to me. Too large for body <br>text, though. Maybe not on John's fancy display. <br> <br>The only glyphs that distract are the 'v' and 'w'. Where they <br>get to be 1 pixel stroke widths it looks like a gradient to a <br>lighter gray. Perhaps you can avoid this with by getting <br>creative with their shapes. <br> <br>But as Hrant will tell you, 2-pixel stem widths make for <br>good pixel font readability, so nice job!</p>
