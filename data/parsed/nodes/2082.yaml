    html: "<p>&gt; This is a screen font, bitmap font, no grayscale. <br> <br>FYI: Truth in Design now has a way to deliver grayscale <i>bitmap</i> fonts reliably and portably. <br> <br>If you want to make embedded (true) bitmap fonts: <br>1) For MacOS you can't any more. <br>2) For Windows you don't absolutely need BitFonter (unless you're making grayscale bitmaps), all you need is a free MS utility called SBIT. <br> <br>&gt; designing this kind of font are very cool (educational) for those who want learn type design.  <br> <br>I agree - although many \"classical\" designers don't - some of them even think you have to be right-handed, if you know what I mean... My first fonts were 8x8 bitmaps for Armenian and Arabic on a C64. <br> <br>hhp <br></p>"
