    html: |-
      <p>The site used to be pretty useful, but since it started including dubious clones like <a href="http://www.fontsquirrel.com/fonts/Sapir" rel="nofollow">Sapir</a>*, to name but one example, I can’t buy the “hand-picked, high-quality, commercial-use” claim anymore.</p>
      <p>*) The blurb states “Sapir was designed as a stop gap, while waiting for better, professionally designed fonts for linguiustics. But Sapir is different in that it combines the International Phonetic Alphabet with symbols for syntax and phonology.”</p>
      <p>This is lame. No design involved. It’s just a bad clone of <a href="http://new.myfonts.com/fonts/adobe/itc-stone-sans/stone-sans-medium/characters.htm" rel="nofollow">Stone Sans</a> by <a href="/wiki/Sumner%20Stone" class="freelinking" rel="nofollow">Sumner Stone</a>. And there <strong>is</strong> an <a href="http://new.myfonts.com/fonts/adobe/itc-stone-sans/phonetic-ipa/characters.html" rel="nofollow">IPA version of Stone Sans</a>.</p>
      <p>I hope Fontsquirrel gets rid off all the cheesy stuff.</p>
