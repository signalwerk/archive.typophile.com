      <p>&gt; Would going to someone who can do hand (rather<br>
      &gt; than machine) engraving be the best option? </p>
      <p>According to Tiffany's website, hand engraving lasts longer (I presume because it's deeper), which might be an important consideration on a wedding band. They say:</p>
      <p>Machine Engraving — This method employs a computer-controlled tool to displace the metal... Over time, machine engraving may fade on items that are worn frequently</p>
      <p>Hand Engraving — Hand engraving is the art of removing metal to create lettering through the use of manual tools. Tiffany engravers handcraft unique designs that will last a lifetime.</p>
