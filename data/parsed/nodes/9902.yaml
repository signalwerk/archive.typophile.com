    html: <p>Fredrik <br> <br>Print never goes away. We did a book back in '86 with the Plantin, The Compleat Melancholick. Still in print, both the letterpress and the offset editions (the latter reproduced from the letterpress proofs). I guess that should tell you something about how successful a publisher I am!!!! (nothing worse than not putting a title into OP status).  <br> <br>But if you are interested, I pop the offset version up on eBay from time to time (currently up), and they are both always for sale on Amazon. Obviously, just another compositional exercise (but, I always liked the book).</p>
