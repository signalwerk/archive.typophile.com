  html: <p>I'm doing some research for a typographic project which hopefully will result in a typeface to be used in small sizes. <br>Right now I'm looking for type specimens of 6 pt Plantin and Fleischmann. Specifically the italics, but if possible the entire family. <br> <br>Does anyone have samples to share, and/or know where I should search for them? <br> <br>Kind regards, <br> <br>�redrik</p>
