    html: <p>What's 6pt Plantin? <br> <br>As for the Fleischman (I'm still unsure to spell it with one "n" or two...) I have the glorious 1908 Enschede specimen book on hand - arguably the best source for anything Fleischman. I can get you good 600dpi scans, or 1200dpi macro photo images (which however will be focused adequately only on a few letters at a time). I could also do 2000dpi photos but those would require a tripod (which I have, it's just more work). But I can't do this for free, sorry. Please let me know. <br> <br>hhp</p>
