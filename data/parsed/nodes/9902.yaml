    html: <p>Oh, <b>Goody</b>, that sounds truly glorious! <br>As soon as I've managed to meet my three deadlines (all work and no eggs makes Fredrik a dull boy) I'll mail ya � privately. <br> <br>BTW � Fleischmann can be spelled both ways, he was from Germany, where they spelled it with two <i>n</i>:s, whereas in the Netherlands it's spelled with one. <br> <br>A 6 pt Plantin is, well, a good font for small type says ole 'Arry Carter. <i>Or so I thought</i>. Looking in my issue of the <i>Printing Historical Society Bulletin</i> reprint of his article on Optical Scale I realize he was referring to <b>8</b> point Plantin. <i>And</i> Fleischman(n). <br>So, 8 pt it is and I'll get back to you. <br> <br>Happy easter everywhere! <br> <br> <br>�</p>
