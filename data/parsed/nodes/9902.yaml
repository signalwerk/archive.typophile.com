    html: "<p>Plantin is a man among boys. The anal-historicists who obsess about the \"wrong\" lc \"a\" piss me off so... Gerald, doesn't Archetype have it? I'll be coming in this Tuesday - maybe I can do a print for you, Fredrik. My trademark effeminately light touch on the press would reveal the forms quite well I hope (on good paper, which I have on hand). <br> <br>BTW, I just dug up my copy of that Carter article (always a pleasure to gaze upon such technical eloquence), and I think there's a plausible reason why all the samples bottom-out at 8 point: foundries start behaving quite strange below that - some, like ATF, go nuts (but to me at least in the best meaning of the word), while others (like the Imprimerie Nationale) are too tentative. This causes any design analysis to start venturing into human psychology - always treacherous ground. <br> <br>hhp</p>"
