    <p>SUDTIPOS NEWS :: FEBRUARY 2011 :: DELIGHT SCRIPT<br>
    ____________________________________________________</p>
    <p><strong><a href="http://new.myfonts.com/fonts/sudtipos/delight-script/" rel="nofollow">Delight Script</a></strong> is a fresh and original Angel Koziupa design that takes its cue from post-WWII advertising scripts.</p>
    <p>Casual, bouncy and playful, this upright script is built and engineered by Alejandro Paul with tons of alternates that can make every word look like real hand lettering. It covers all Latin-based languages.<br>
    ____________________________________________________</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/trio420_6521.jpg"></div><br>
