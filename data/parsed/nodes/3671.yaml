  html: <p>A community of letters formed together differentiating the level of privacy amongst their neighbors.  <br> <br>This is the base font. There are more versions of this typeface which move in closer and the letterforms become intertwined within one another becoming unreadable establishing a sense of privacy for the writer and the letters they write. <br><img src="http://www.typophile.com/forums/messages/29/28848.jpg" alt=""></p>
