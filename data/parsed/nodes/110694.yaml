    html: |-
      <p>Tapatio looks like the same font as Slasa Picante -- note for example the open bowl P -- but with the A modified to echo the stroke on the P.<br>
      There are fonts with the open P, mini-serifs and other features in your image. Including Pompei <a href="http://www.myfonts.com/fonts/mti/pompei/">http://www.myfonts.com/fonts/mti/pompei/</a><br>
      and Pona <a href="http://www.myfonts.com/fonts/tipografies/pona-display/">http://www.myfonts.com/fonts/tipografies/pona-display/</a><br>
      Don</p>
