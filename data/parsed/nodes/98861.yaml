      <p>Maybe my built-in gestalt processor isn't working properly, but all I see initially is a B with some stripes through it. It took me a long while to see the 'K' in those versions of the logo. And when I do finally see the K, the B disappears. I agree with hhp's comments about the counter shapes, and his bottom-most design, with somewhat wider stripes, makes both the B and the K more obvious. My personal preference was for the more angular versions of the B-K combo - they were clearer if less artistic.</p>
      <p> - Herb</p>
