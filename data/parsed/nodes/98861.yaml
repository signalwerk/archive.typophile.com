      <p>&gt; all I see initially is a B with some stripes through it</p>
      <p>Me too.</p>
      <p>&gt; Or make it more rakish</p>
      <p>I'd be cautious about an approach like that. I used to do design work for a large corporation that had an angled logo and it often caused problems because optically it sometimes looked "crooked". Or to be more specific, the elements in it that were actually horizontal (like the white stripes in yours) would look slightly off, even though they weren't.</p>
