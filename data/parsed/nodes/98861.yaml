      <p>Thank you all for your feedback. And special thanks to hrant for the visual inspiration :)</p>
      <p>Basically what I did was to combine hrant's second and third version. I took the counters of number 2 and the wider strokes of number 3 and tried to be very careful about the negative shape so the B does not end up looking strange.</p>
      <p>I am pretty satisfied with what I have right now and would love to hear your opinions about it:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/horizontal-description_3733.gif"></div><p></p>
      <p>Comparison of the negative shapes:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/compare_4331.gif"></div><p></p>
      <p>It feels to me like the K is way more obvious now and switching between perceiving it as B or K became a lot easier.</p>
