      <p>The market determines pricing, not the “goodness” of a product.</p>
      <p>Quite simply, Kennerley is out of fashion right now.<br>
      However, given that it was the most popular face of the teens and twenties, I wouldn’t be surprised if it came back into fashion at some point in the future, if and when historicism displaces modernism as the preferred retro vogue.<br>
      But then, new cuts would be required, with size-speciﬁc versions no doubt.</p>
