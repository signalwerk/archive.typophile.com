    html: |-
      <p>As I understand it, the P22 EULA only requires special licensing for things like logos, packaging, identities, movie/TV use, etc. The wording appears to be slightly ungrammatical, but it seems that designing a book with a P22 font, regardless of print run, does not ordinarily require anything but the basic license. But in the attempt to catch all possible high-value uses they can extract money from, they worded that part in such an open-ended manner that reading the EULA doesn't make this entirely clear. I think it was partially clarified by Richard Kegler in a post here a few years ago.</p>
      <p>On the other hand, I would note that the rest of the license is both clearer than usual and quite reasonable. In particular, they allow modifications (for internal use, as usual), which is really important, so they're one of the relatively few foundries I am inclined to license fonts from. I'm not a Goudy fan, but I've even licensed Kennerley.</p>
