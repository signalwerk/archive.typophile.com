      <p>It's graceful, delicate, and organic--all attributes that in a less enlightened time we classified as feminine. Your logo should be consistent with the work you do (and the tastes of the clients you hope to attract). If graceful, delicate, and organic are adjectives that describe the work you do and want to do, then this is not "too feminine."</p>
      <p>When I look at this logo, I see <em>SSS</em>. I wouldn't have guessed <em>DLS</em>, and even after I read your post I had to strain to pick out the <strong>d</strong> and the <strong>l</strong>.</p>
