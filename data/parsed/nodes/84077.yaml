    html: <p>After looking at your work and reading the above, I wonder if the latest round of ideas are too minimal and too geometric.  I don't get those themes from your work.  Perhaps something less abstract would be fitting, as I don't see a lot of abstraction in your portfolio.  A monogram is already abstracted from the names it represents, and if you want people to get to your URL, you might need to emphasize your name.  Designing a personal brand is one of the hardest tasks a designer does, so good luck!</p>
