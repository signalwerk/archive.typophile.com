    <p>Hi everyone!</p>
    <p>Thanks to Typophile, I was able to make great strides on my personal logo last year to better brand myself as a designer. As someone who has always had an affinity for typography, I wanted to incorporate my initials D L S into it as letters. I like it, but I still get criticism that it's a little too "out there" and too feminine to represent me as a designer. Any ideas how to improve it? Where do I go from here? I've tried so many variations that I'm a little burn out, which is why I'm branching out to you guys.</p>
    <p>Thanks for your help!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/7_3_3618.png"></div><p></p>
