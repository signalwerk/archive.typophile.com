    html: |-
      <p>Hi Luma! Thanks for your comment. So I suppose three keywords that would set me apart from others would be ADAPTABLE, INNOVATIVE, STYLISTIC. I have strong style, but design for a lot of different venues from solar energy corporations to baby books, and want to emphasize that in a logo. Mostly the work I do myself is more fun and "youthful" as I'm still in college. So I say adaptable in that I can design for what one needs me to design for. I'm innovative because I address whatever media in a way that will be most efficient while maximizing the third keyword, style. I have styles, not just one: I can design in a variety of ways. In short: versatility? I don't want my logo to be too rigid, too absent, but I also don't want it to be too graceful or too weak.</p>
      <p>Here's a link to my outdated portfolio: <a href="http://davidlernerschwartz.com/portfolio.html" target="new" rel="nofollow">DLS</a>. Thanks in advance for the help!</p>
