    <p>I'm looking for a typeface similar in nature to Quicksand (<a href="http://www.fontsquirrel.com/fonts/quicksand" title="http://www.fontsquirrel.com/fonts/quicksand">http://www.fontsquirrel.com/fonts/quicksand</a>), but I need it to not be free. </p>
    <p>Really, any very rounded sans serif with various weights would be great. The closest I've found is Sofia Pro Rounded, but if you have any other suggestions, it'd be greatly appreciated!</p>
