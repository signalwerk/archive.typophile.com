    html: |-
      <p>Audrey</p>
      <p>The digital fonts used are UConnCondensed and UConnExtended. They are proprietary bespoke fonts created for the exclusive use of the University of Connecticut's athletics department.</p>
      <p>If you're looking for examples of the rest of the letters (to decorate a cake, for example),  you might try their two websites, uconn.edu and uconnhuskies.com.  It might also be possible for you to obtain authorization directly from the University.</p>
      <p>Note that the fonts themselves are basic and do not include things like outlining or the multi-color effects seen in the logo.</p>
      <p> - Herb</p>
