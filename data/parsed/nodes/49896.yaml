    <p>You’ve probably seen this font before. Work for <a class="freelinking-external" href="http://www.arenastage.org">Arena Stage</a> theater in D.C. has been featured in design annuals for several years. The same typeface used in the Arena Restaged logo (I believe) is used in this logo for Invitrogen, a biotech company.</p>
    <p>Can anyone help me ID this font?<br>
    </p><div class="imageWrap"><img src="/files/arena-restaged_6350.gif"></div><br>
