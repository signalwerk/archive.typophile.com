    <p>There are a few places available for the workshops being offered at Cooper Union this spring. These courses are electives within the Type@Cooper program but some places are available to non-participants. For more information visit <a href="http://coopertype.org/extended/" title="http://coopertype.org/extended/">http://coopertype.org/extended/</a></p>
