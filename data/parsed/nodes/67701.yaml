    <p>Hi everyone,</p>
    <p>I was wondering if there are any resources available for CorelDraw users trying to learn Adobe Illustrator. Google has proven fruitless, as it just returns a list of debates about the merits of both pieces of software. I don't care which one is better - I use Draw and want to learn Illustrator too in case I need to use it in the future.</p>
    <p>Ideally, I'd like to find a chart along the lines of "INSTEAD OF THIS -&gt; DO THIS". Quick and simple.</p>
    <p> - Lex</p>
