    <p>Yuri Gordon (Юрий Гордон) is a <a href="/node/29424" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Russian</a> designer and author of «<a href="http://store.artlebedev.com/catalog/books/design/kniga_pro_bykvy/">Книга про буквы от Аа до Яя</a>» (<em><a href="/node/add/wiki?edit%5Btitle%5D=Book%20of%20Letters%20From%20%D0%90%D0%B0%20to%20%D0%AF%D1%8F" title="Create node &quot;Book of Letters From Аа to Яя&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Book of Letters From Аа to Яя</a></em>. Yuri is also principal of the Moscow-based <a href="/node/add/wiki?edit%5Btitle%5D=Letterhead%20Studio" title="Create node &quot;Letterhead Studio&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Letterhead Studio</a>.</p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.paratype.com/help/designers/designer.asp?code=AD_GY">Paratype Designer Bio: Yuri&nbsp;Gordon</a></p>
