    html: |-
      <p><a href="http://www.kltf.de/kltf_otproduction.htm" title="http://www.kltf.de/kltf_otproduction.htm">http://www.kltf.de/kltf_otproduction.htm</a></p>
      <p>The Glyph Tweaker tool allows you to distort existing outlines in a number of controlled ways, such that you can e.g. make glyphs wider while retaining stem weights. It doesn't do it terribly elegantly like Tim Ahrens' RMX tools, but unlike them it doesn't require an MM font. It works best for very small adjustments, but even these will usually need some manual clean-up if you are trying to produce nicely finished details. But I'm finding the brute force approach useful, even with the distortions to terminals and joins, for looking at what is revealed about the basic structures of letters if, for example, one starts with a high contrast design like Didot and reduce the contrast so that the stroke are more monolinear, or with a low contrast design like Helvetica and increases the contrast to that of a Romantic typeface.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GTtransformations_6481.gif"></div><p></p>
      <p>[More of this sort of thing will probably feature in my lecture at St Bride's next month.]</p>
    html_clean: |-
