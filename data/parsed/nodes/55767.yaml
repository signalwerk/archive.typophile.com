      <p><em>Are you saying that this happens MORE OFTEN than we realize?</em></p>
      <p>I expect so, if my experience is anything to go by.<br>
      For instance, I have benchmarked several faces commissioned for newspaper redesigns against the faces they were to replace, in terms of color, apparent size, and copyfitting. Brown Extra Bold is matched against Franklin Gothic Condensed in those respects.<br>
      I didn't copy any of its parameters per se, but tweaked Brown until it was a touch tighter and a touch darker. So if you were to superimpose the two faces, no doubt there would be a similar overlap to your example.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/target_4999.jpg"></div><p></p>
