      <p>Another funny creature is "Helvetica LT Standard Oblique" (filename: HelveticaLTStd-Obl.otf). Who thinks that quality typography requires that letters with accents should have the same matching set width as the letters without accents will have to learn that this is not true for Helvetica:</p>
      <p><a href="http://www.sanskritweb.net/temporary/Helvetica-crap.jpg" title="www.sanskritweb.net/temporary/Helvetica-crap.jpg">www.sanskritweb.net/temporary/Helvetica-crap.jpg</a></p>
      <p>I never use Helvetica, so that the crappy set widths of Helvetica do not bother me, but since there are some people around here who use Helvetica, I think that Gary Hustwit should have mentioned this "set width hallmark" of Helvetica in his promotional film.</p>
