    <p>I simply pasted the outlines of Univers onto Utopia in Fontlab. ZERO adjustment. Stem widths, glyph widths, x-height, cap-height, they all match up perfectly.</p>
    <p>That being said, Slimbach did a superb job. Nearly faultless.</p>
