    html: |-
      <p><em>... if the advance widths are [identical]...</em></p>
      <p>They're quite different, but the lower case stem widths are almost identical (though somewhat warped), and so is the x-height and ascender height. </p>
      <p><em>“this happens all the time without intent”</em></p>
      <p>I can't speak for other type designers, but in this case I had already designed a serif type for the paper, which they were using with Franklin Gothic, and they asked me to design a replacement sans which matched that serif in style, and Franklin Gothic in weight and copy fitting. So my intent was quite clear. Of course, I would have rather designed something more original (and I did get that opportunity later with the same client), but the challenge here was to do something close yet with a different personality, and without point piracy.</p>
