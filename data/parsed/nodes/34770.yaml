    html: |-
      <p><cite>Condensed = Narrow<br>
      Compressed = Narrower</cite></p>
      <p>This is certainly true of fonts such as Interstate. Are "compressed" fonts just a recent phenomenon resulting from the need to describe two degrees of condensation? Are there any fonts with a compressed version for which there is no condensed variant?</p>
