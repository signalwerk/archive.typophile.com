      <p>The ’bakermat’ (dutch for ’cradle’ or ’birth-place’) of such swashes is the mannerist cancellerescian majuscule. The reference majuscules throughout page 63-69 of my <a href="http://www.enneson.com/public_downloads/pe/HKs_RIs.pdf">Raffia Intials presentation</a> are drawn from a book whose title and author escapes me at the moment, but the book shows as many variations for each letter of the alphabet. I might be able to dig out bibliographic particulars on the source on the weekend if it would be of use.</p>
      <p>But do you really want to send your student down a chirographic detour?</p><div class="imageWrap"><img src="/files/][img:"></div><p></p>
