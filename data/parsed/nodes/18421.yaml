      <p>You’ve reminded me of the particular “swash factor” in Baskerville.<br>
      Because the original italic caps had a strange “swash distribution”,<br>
      in that some glyphs were very “straight” while others were overly<br>
      swashy, revivers of Baskerville have elected to either preserve the<br>
      original scheme or do away with the swashes entirely. One elegant<br>
      solution can be found in ATF’s metal Baskerville: non-swashy main<br>
      sorts, but swashy, in fact extra-swashy, alternates. Here’s a scan<br>
      from a print I did at Archetype last year:</p>
      <p></p><div class="imageWrap"><img src="/files/BvilleATF_SwashCaps.gif"></div><p></p>
      <p>hhp</p>
