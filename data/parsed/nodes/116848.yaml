    html: |-
      <p>The technical term in the days of hot metal for a font that had no extra space for descenders (they tended to be all-caps fonts; since some lower-case letters have ascenders, I'm not sure how one could have just the x-height on the type slug unless the font was specialized) is 'titling' as in Times Titling.</p>
      <p>But with the flexibility of digital typography, separate titling fonts, as far as I know, wouldn't make sense, and thus are not offered as such. Since Times Titling is stylistically different from the upper-case of regular Times, it could be available as a font, but the baseline would not move - digital font standards handle type alignment differently from hot metal, so you don't have to tell your word processor to move text in an 'art line' face down and text in a 'titling face' up. That would be imposing extra work for no reason.</p>
      <p>What I think the word processors do is this - different faces do still have the baseline in different places on the body, because some faces have shorter descenders than others - so if you mix such faces on the line, the line is forced to take up more space than your point size, even if you have specified no extra space. Fancier DTP programs may give you more control.</p>
