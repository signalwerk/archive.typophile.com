  html: |-
    <p>Hello,</p>
    <p>I am looking for a sans serif font without spacing for ascendents and descendents. I tried all caps fonts but the ones I found still have some vertical space.</p>
    <p>I will be using this font for its digits (so it could be a digit-only font) which will need to be readable (similar to, say, Droid Sans). they will be large and I do not want them to take more vertical space than needed. The problem I am having is visible on this screenshot: <a href="http://i.stack.imgur.com/Na2e1.png" title="http://i.stack.imgur.com/Na2e1.png">http://i.stack.imgur.com/Na2e1.png</a> -- there is space wasted above and below the numbers.</p>
    <p>Would you have a recommendation for such a "tightly fit" font?</p>
    <p>Thank you for any suggestions,<br>
    WoJ</p>
