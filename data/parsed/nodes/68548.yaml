    html: <p>If you're interested in a typeface designer's take on this same topic, you might look at Fiona Ross' diagram in her book <em>The Printed Bengali Character and its Evolution</em>. Although the diagram is of the Bengali script, there are several common features between Devanagari and Bengali.</p>
