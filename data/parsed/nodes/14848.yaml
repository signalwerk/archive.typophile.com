      <p>National Geographic has had one of the highest standards for photography, editorial, layout, typography and print reproduction for DECADES!</p>
      <p>I haven't dissected one (meaning close detailed examination) for a few years, but if you take the time you will discover their superb attention to typography. According to friends who were employed there, National Geographic adheres to strictly established "house" standards (style guides) for all phases of pre-press, printing and finishing.</p>
      <p>It is no wonder that for this important "SPECIAL (map of Africa) ISSUE" they went all type with a subordinate graphic (but high-recognizable shape). I haven't seen this issue yet, but from the cover alone, you can immediately tell that this ain't you mom's version of a colorful travelog but a journalistic wake-up call.</p>
      <p>As stated on their <a href="http://www7.nationalgeographic.com/ngm/0509/editor.html" target="new" rel="nofollow">web site</a>:<br>
      <em>They are stories whose time has come. With that in mind, National Geographic Editor Chris Johns led the production of a special edition on Africa. In this issue we look at the impact of humans on the environment and the fate of Africa's great animals. We examine the consequences of oil wealth in impoverished Chad and the plight of the Democratic Republic of  the Congo's Mbuti Pygmies as outsiders invade their forest home. We contemplate the relationship between people and wildlife through the eyes of an African writer returning to Zambia. We take the pulse of life in Kenya's bustling capital of Nairobi and ponder the future of HIV-positive South Africans, who tell their stories in their own words. Listen to the Editor remark on why, at this particular time in history, Africa is so important to the rest of the world and how we can help as it forges ahead.</em></p>
    html_clean: |-
