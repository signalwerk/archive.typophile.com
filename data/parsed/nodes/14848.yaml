    <p>Just got the latest National Geographic in the mail last night, and was suprised to see the cover not adorned in a photograph, but rather, typography.</p>
    <p>Now, I don't know how frequently the NG does this, but for me, it was a nice shot in the arm--everyone knows how the NG and its cover are synonymous with photography.</p>
    <p>So right away, I'm thinking that this issue is something special. The designer's use of type has let me know this, and in the moment, I'm really into the play on design here, to communicate a unique message.</p>
    <p>And then they go and kill it by declaring 'special issue' at the bottom. Elegant design, great type, followed by a 'just in case you don't get it' disclaimer. Ah, well.</p>
