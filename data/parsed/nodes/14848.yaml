      <p>&gt;A strickly typographic cover, in recent years, is a change then :)</p>
      <p>Absolutely :0)</p>
      <p>Several years ago I bought "100 years of National Geographic" on CD. They scanned all the magazines -- including ads -- and put them out as a 40-CD set. Unfortunately, trying to fit ~30 magazines into each CD forced them to compress the hell out of the scans ... which totally destroyed the typography &amp; the photography. It was often hard to tell what the photos were all about, and the type was barely readable.</p>
      <p>But for all that, it was a wonderful resource during an extended tour of Latin America. A search on San Blas, Mexico, turned up an article dating back to the 1920s -- when the author had to ride for weeks on the back of a burro to get there.</p>
      <p>I'd love to see an enhanced edition, possibly put out on DVDs. I wonder if they saved the original, non-compressed scans...</p>
      <p>Jay</p>
