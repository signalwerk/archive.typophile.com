      <p>&gt; "National Geographic has had one of the highest standards for photography, editorial, layout, typography and print reproduction for DECADES!"</p>
      <p>Highest standards for photography: Agreed (the best)<br>
      Highest standards for&nbsp;editorial: Agreed<br>
      Highest standards for print: Agreed&nbsp;</p>
      <p>Highest standards for layout and typography: ???</p>
      <p>Sorry I may be the only one here but I find the layouts in NG at best average at worst&nbsp;ugly. Spaced out kerning, justified text, ranged left text, contoured text, ranged right captions, ranged left captions.&nbsp;Too many font styles, miss matched font styles,&nbsp;ugly graphic devises (like those little yellow triangles), it's just a mess!&nbsp;</p>
      <p>I totally understand that the 'noisiness' of NG is it's aesthetic and has been forever, though I think generally it could be handled with a little more&nbsp;finesse and visual&nbsp;consistency.</p>
      <p>I LOVE NG, but every time I view a copy I lament at how poor the design is in comparison to the photography and editorial. In saying all that I agree the typographic cover is refreshing.</p>
      <p>(I'll climb down from my desk now)</p>
