    <p>Hi all,</p>
    <p>Anyone purchased or used any fonts from a site called Fonts For Flash, fontsforflash.com? They appear to be connected to FlashLoaded because the latter's popup appears on their site. Anyhow I purchased FFF Calypso, a $15 bitmap font set at 8px, and some of the characters are corrupted, the attached images shows the upper line set with the live font and the Y is corrupted, that's the correct font size. The lower line is made of letters cut up from their specimen sheet.</p>
    <p>I tried mailing them but got an error message saying "Mail Inbox quota full". They're retailing fonts that are corrupted and not taking emails?</p><div class="imageWrap"><img src="http://typophile.com/files/FFF_Calypso_problem_4143.jpg"></div><p></p>
