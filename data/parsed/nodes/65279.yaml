      <p>&gt; Personally I’ve never heard of a bitmap font that can<br>
      &gt; only be used on one application, a font is a font.</p>
      <p>There are some very tricky aspects to grayscale pixelfont design, involving how an application decides exactly what shade of gray a pixel should be. Photoshop and Flash do it differently, and it's quite difficult to figure out a scheme that yields the same results in both apps.</p>
      <p>Until they pulled the plug I worked with a company called Ultrafonts. Unlike others, they had figured out the technical issues, and Mana* was one of the resultant fonts; it works identically in both Photoshop and Flash. I actually have the source code to the Ultrafonts software, but I've never tried firing it up.</p>
      <p>* <a href="http://www.themicrofoundry.com/manademo/" title="http://www.themicrofoundry.com/manademo/">http://www.themicrofoundry.com/manademo/</a></p>
      <p>hhp</p>
