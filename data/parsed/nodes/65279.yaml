    html: |-
      <p>Sorry for the triple post. Fontsforflash.com contacted me directly following this post and told me that the fonts are not intended for use in Photoshop and offered a refund. Personally I've never heard of a bitmap font that can only be used on one application, a font is a font. Incidentally, I checked the font in a trial FontLab against one of the 04b bitmapped classics and found discrepancies.</p>
      <p>The 04b fonts are accurately lined up to the guides and grids in the glyph window with only positive values in the metrics. FFF Calypso was not lined up to the grid or guides and had a small negative value of -7 on the left hand side of each glyph.</p>
      <p>Most importantly, each pixel of the 04b font is a multiple of 150 or 125 units, in FFF Calypso its the same but the problem characters had at least one point that didn't add up to round multiples of 125. I think its easy to correct but it looks like Photoshop is showing the errors and Flash doesn't detect them.</p>
      <p>Overall as fontsforflash say, guaranteed to work as expected in Flash only.</p>
