  - id: 383601
    user: 13487
    date: 2009-12-12T11:31:00
    date_raw: 12 Dec 2009 — 11:31am
    votes: null
    html: <p>I remember a few years ago there were issues in Flash with «normal» bitmap fonts that would fit pixels perfectly – the counters would fill up. Flash couldn't interpret the outlines correctly. That led to special bitmap fonts for Flash where the bitmap «dots» were a bit smaller (or larger?) than the actual screen pixels; with antialiasing switched off, they would still display as full pixels, but the counters were saved. Something like that. I don't know if this is actually still an issue in Flash today, and I wasn't aware that these fonts don't work right in other apps, but maybe that's what's behind this curious story.</p>
