  html: |-
    <p>Hello,have a question about text orientation on binding of roman-script books. </p>
    <p>As I understand, it's a convention in certain countries to put the title top-to-bottom (Wikipedia: "In the United States, the United Kingdom and Scandinavia, titles are usually written top-to-bottom, and this practice is reflected in an industry standard;[18] when the book is placed on a table with the front cover upwards, the title is correctly oriented left-to-right on the spine. In most of continental Europe, the general convention is to print titles bottom-to-top on the spine."). </p>
    <p>Well, I got my answer there, but I am actually wondering about the reason for putting the title the opposite way, because I am from Croatia, so books that I do do not fit in the countries mentioned above. I know that most things in book design and typography have some justification in history of type and bookmaking, so if anyone has an answer to this one, I would really appreciate it.</p>
    <p>Thank you very much!</p>
