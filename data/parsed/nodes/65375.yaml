      <p>Bottom to top in Russia</p>
      <p>One explanation I've heard, was that a book placed on the table with the front cover up, can be easily identified from the cover itself, while the one laying face-down can only be told by the spine.</p>
      <p>This explanation seems rather sketchy, as back when the convention was established , most books didn't carry writing on the covers, and the spine was a primary identifier.<br>
