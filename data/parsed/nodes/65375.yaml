      <p>In Italy you will see both. I think it's a clash of conventions: the readability of the title if the book is placed on a table versus the graphic design convention that says that, if a text is placed vertically, it should read from the bottom.<br>
      If you need to set a book spine I think you should look for book similar to the one you need to set and see what solution they adopt. Then deciding accordingly.</p>
