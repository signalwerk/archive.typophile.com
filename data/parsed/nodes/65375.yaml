      <p>Hmmm! Perhaps there is a browser problem. I'm seeing it with Mozilla and Chrome, but haven't checked with IE. This is too bad! :(<br>
      I sent you the text on the mail, np!</p>
      <p>For other people with the same problem - I am posting here my hypothesis in a nutshell - if you want to see the rationale or some supporting data, you have to check my page with Mozilla or Chrome browsers (and perhaps others will also do the job).</p>
      <p>"...This string of reasoning leads to the simplistic conclusion that in Great Britain and USA (plus the Netherlands) people read more pragmatic books – textbooks, science, manuals, guides, encyclopedias, how-to books. On the Continent people read more literature. Pragmatic books are read in a problem-oriented way, with more sources at a time; literature is read in a content-oriented way, one book at a time. In the first case it is more important to be able to read the spine text when the book is in a pile with others, face up. In the second – it is more important for the spine text to enable book recognition in all positions – alone..."</p>
      <p>Regards,<br>
      Nikolay</p>
