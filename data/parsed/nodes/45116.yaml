    <p>Anyone here know the keystroke for the (p) publisher symbol?<br>
    In the past I have always "created" the symbol, but I know there is a keystroke for it..<br>
    similar to...<br>
    alt+0169 is ©<br>
    alt+ 0153 is T<br>
    alt+ 0174 is ®<br>
    etc.,</p>
    <p>What should have been a quick find has now turned into a 2 day delay...<br>
    eric<br>
    (my first post)</p>
