      <p><cite>Seems a bit silly - it’s not in most fonts because most people don’t need it</cite></p>
      <p>Not to be too sarcastic, but we're in a bad situation if we depend on the foundry to determine what we (the end user) will need. I suppose when we need characters not in a font, we should just set those in Ariel?</p>
      <p>For example, ours is a small shop, but at least once a month, I need characters not in most foundry releases. Not sexy things like swash small caps, but regular Latin characters with non-European diacriticals -- or even just all the combining diacriticals &amp; space modifying characters.</p>
