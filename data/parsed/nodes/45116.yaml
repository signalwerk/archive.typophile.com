      <p>You're probably on a Mac. But if it is a PC, select the font that has the character -- Ariel Unicode seems to be about the only one. Make sure the *num lock* toggle is on. Hold down the *alt* key, then using the numeric keypad, press *plus* &amp; the digits (2117). If an alpha character is needed (as with *24DF* for the lower-case circled p), use the regular keyboard for the alphas, but the number must be from the keypad. When you've entered the Unicode string, let go of the *alt* key.</p>
      <p>There is probably a similar way on a Mac, but I don't know it.</p><div class="imageWrap"><img src="http://typophile.com/files/circp_4021.gif"></div><p></p>
