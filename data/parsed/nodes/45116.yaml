      <p><cite> I still don’t know how to access the ⓟ ouside of this cut-and-paste method.</cite></p>
      <p>According to <a href="http://www.fileformat.info/info/unicode/char/24df/index.htm" title="http://www.fileformat.info/info/unicode/char/24df/index.htm">http://www.fileformat.info/info/unicode/char/24df/index.htm</a> you type Alt +24DF but they also say (if you follow the link giving the shortcut which gets you <a href="http://www.fileformat.info/tip/microsoft/enter_unicode.htm" target="_blank" rel="nofollow">here</a>) that you need to have your numeric keypad set to hexadecimal (HKEY_Current_User/Control Panel/Input Method, set EnableHexNumpad to "1"). Since your examples above (copyright etc) are in decimal, I would try  Alt +9439 (because the number that writes 24DF in hexadecimal notation is nothing but the decimal integer 9439).</p>
