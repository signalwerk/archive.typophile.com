      <p><cite>another annoying issue:</cite></p>
      <p>As Charles says, if you want satisfaction, you most probably need to use the character 0x2117 and moreover, if you want everything to be nicely aligned, you need both the copyright and 0x2117  to be taken from the same font (and  also from the font with the + and/or the &amp;). Here are two examples (a grab in Microsoft Word 2008 for Mac).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/elusivecirclep_4802.jpg"></div><p></p>
      <p>In my opinion, if you don't have a font containing a glyph for 0x2117,  the easiest thing to do is either to buy one or to choose a font whose EULA allows you to modify it and add to it the glyph for 0x2117. </p>
      <p>Michel</p>
