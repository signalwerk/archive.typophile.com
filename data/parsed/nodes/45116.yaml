      <p>To tackle the comment "I still don’t know how to access the ⓟ ouside of this cut-and-paste method.": In more recent versions of Word, you can get a character by typing its 4-digit Unicode, er, code and then hitting Alt+X immediately after; so in this case I type 2117 and then hit Alt+X. I'd left the font at the default TNR. Word switched to MS Mincho and dropped in the character. Setting the font to Trebuchet and trying the same thing resulted in Word switching to MS Gothic and dropping in the correct character. Dunno if this helps. </p>
