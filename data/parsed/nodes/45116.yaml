    html: <p>Well, you can probably fool around with the size &amp; position in InDesign to get them close, but I think the core of your problem is your insistence on using the lower-case p. The lower-case circled-p (Unicode 24DF) come from a different set, namely, circled alpha characters. There may a circled capital C in that set (U+24__); you could look for it. But the Sound Recording copyright symbol has always been the circled capital P -- Unicode 2117. Now if that is sized differently than the copyright symbol (circled capital C), you'd have a legitimate complaint.</p>
