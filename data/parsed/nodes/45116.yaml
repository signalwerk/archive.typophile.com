      <p>" - it’s (the p in a circle) not in most fonts because most people don’t need it - "</p>
      <p>Laugh to self. But when one wants to set p in a circle, one should not have to wait for it to snow at the equator.</p>
      <p>re: I put it in the Pi slot like Font Bureau — "um, what does that mean exactly?"</p>
      <p>It means that we @ FB understand how users work, and so we put the p in a circle, a "must-have" glyph that is very difficult for a user to make on the fly, in the slot of a glyph (math pi) that most people <em> really don't need </em>(because even if they do,  it's in the symbol font on every single computer on earth).</p>
      <p>Considering the fact that there are applications out there now that simply will not allow the inclusion of un-encoded glyphs in the document, we might be forced, by the overwhelming desire to please our users, to keep doing that.</p>
      <p>Cheers!</p>
