      <p>aia if this is redundant. I found this info elsewhere when stumped by the problem under discussion.</p>
      <p>Mac Menu Bar &gt; Flag near clock &gt; Show Character Palette (can be enabled in System Preferences)</p>
      <p>In the palette there is a search field at the bottom. Type in unicode - 2117</p>
      <p>In the Collections area: select "Containing selected character" - it returns all the active fonts in your system containing the glyph.</p>
      <p>hth</p>
