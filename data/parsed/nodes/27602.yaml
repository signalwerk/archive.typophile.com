    <p>Dear typophile members,</p>
    <p>I am new at OpenType, so if my question is  a little basic, sorry in advance.</p>
    <p>I am working on a OsF version from a font. Looking which characters<br>
    use to change from one style to the other I found in Adobe Jenson the next ones:</p>
    <p>numbersign dollar percent zero one two three four five six seven eight nine cent sterling yen florin perthousand colonmonetary Euro</p>
    <p>But I thought that probably there are some more characters<br>
    that should change at least in the vertical position, for example:</p>
    <p>Minus multiply less greater etc.</p>
    <p>My questions are:<br>
    . which is the recommended characters you should change in form or position<br>
    to make a complete OsF font style?<br>
    . is there any recommended link or tutorial for the correct way to write the otf replacement?</p>
    <p>thanks in advance for your answers. </p>
    <p>Best regards,<br>
    Darío</p>
