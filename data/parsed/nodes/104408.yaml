    html: <p>The <a href="http://www.microsoft.com/typography/developers/fdsspec/punc.aspx" rel="nofollow">Microsoft character design standards</a> are probably a good starting point. But your best bet is to check what other quality typefaces do, and then decide for yourself.</p>
