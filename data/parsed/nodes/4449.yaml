    html: <p>You did that in two days?! Wow. Very polished already. <br> <br>It sort of looks familiar (although I'm not saying you swiped anything) - I guess it reminds me of Caecilia, although it's less humanist (which I think is working great). <br> <br>The "g" is really nice! I do see a bit too much humanism in it though (compared to the rest), so maybe make the joins (especially between the head and bottom) more rigid. <br> <br>For the "t", try making the curve two straight segments instead. And maybe cut the finial like the "e". <br> <br>The "s" seems to be leaning a hair forward. <br> <br>&gt; I have found a (subtle) slab very fulfilling to make, don't quite know why. <br> <br>Probably because you feel surrounded by hipocrisy, and straight lines &amp; abrupt shifts are more "honest" - if also less interesting. Wedge serifs can be a great compromise. <br> <br>hhp <br></p>
