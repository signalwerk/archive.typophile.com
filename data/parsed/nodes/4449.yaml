    html: |-
      <p>HI Kris. <br> <br>Nicely done. I've got a slab in the cooker too. I like what you  <br>have started! <br> <br>Here are some thoughts: <br>The width seems inconsistent to me. The glyph that first drew  <br>my attention was the n. Looks wide. Then maybe the m a little  <br>too. Maybe the u a hair, b mabe a little narrow. Ok, enough of that! <br> <br>The bracketing in the top of the t is out of character. <br> <br>Keep an eye on your serifs. Many of them look equal on left and  <br>right. This is sometimes best, but often not. Consider your n.  <br>Part the width issue is that the inward halfs of the serifs equal  <br>the outer halfs. You can shave the insiders down, maintaing the  <br>white space and while allowing you to narrow the glyph. Also  <br>check your v. It's like the n in reverse. The inner halfs can afford  <br>to be longer, but the outer halfs need to be as short as you can  <br>manage. Otherwise the spacing will be a nightmare. Some of this  <br>will become more evident as you begin spacing. <br> <br>Old Style Figures: <br>Do they have serifs? Where? <br>Does a four sit on the baseline? <br>Does a four descend to the depth of a five? How close? <br>Do the top of the five and seven line up? <br>Is a nine a rotated six? <br> <br>These are all questions to ask. I think the answers are: it  <br>depends. OSF are a weird animal. Look at a wide gamut of OSF.  <br>Attached are 6/9 comparisons for a handfull of fonts. In Caecilia  <br>the 6 is exactly a rotated 9. In other cases, the only adjustment  <br>is for ascender descender height (Sauna). Sometimes it is vastly  <br>different. It seems the more upright the stance, the less  <br>adjusting is needed. All of that said, I think yours look pretty  <br>good. (Maybe snip back the tail on the nine and round out the  <br>tail curve a bit more.) <br> <br>More please! <br> <br>Randy <br></p>
