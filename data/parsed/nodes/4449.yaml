    html: <p>In your shoes I would not worry about making a "humanist slab-serif" "too similar" to your models. <br>There are such a few being good, the best thing probably is stopping looking at them (if not for spacing) from this point on. <br> <br>I'm not enough qualified to comment a lot, but I would try to make the tail of your lc "y" thicker instead of thinner. <br> <br>The numerals (my cup of tea) you used in the setting seem unbalanced. If you wish to keep them non-lining someway, I'd reduce the "short" ones (0, 1, 2) and adjust the others' position accordingly. Otherwise, if you wish them to be more lining, keep the ascending and descending ones subtler. And condense that zero. <br> <br>Best luck!</p>
    html_clean: <p>In your shoes I would not worry about making a "humanist slab-serif" "too similar" to your models. <br>There are such a few being good, the best thing probably is stopping looking at them (if not for spacing) from this point on. <br> <br>I'm not enough qualified to comment a lot, but I would try to make the tail of your lc "y" thicker instead of thinner. <br> <br>The numerals (my cup of tea) you used in the setting seem unbalanced. If you wish to keep them non-lining someway, I'd reduce the "short" ones (0, 1, 2) and adjust the others' position accordingly. Otherwise, if you wish them to be more lining, keep the ascending and descending ones subtler. And condense that zero. <br> <br>Best luck!</p>
