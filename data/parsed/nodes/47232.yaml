    html: |-
      <p>It turns out that the ultimate "evil" behind this egregious example of design behaving badly was purely impulsive indecision – someone wanting something so quickly (a website using it) and so badly (new business development as a result) that sane reasoning and sound judgment were both sent packing.</p>
      <p>Nothing, repeat NOTHING has been produced (thank God!) to this point, and we're (I say "we" as if I'm somehow actually involved in the process – it still hasn't been handed over to me for fixing as yet) going round and round with faint variations of it, asking everyone under the sun if they like it with blue swooshes and any of sixteen more typefaces from which to choose.</p>
      <p>I'm hoping to have the opportunity to unceremoniously burn all copies, discs, and printouts of it in a huge bonfire on the front lawn of our business complex, dancing shirtless and chanting barely intelligible names of typefaces that should join the inferno ("Souvenir!" "Brush Script!" "The entire Korinna family!"). Hope springs eternal.</p>
      <p>If something redeeming comes out of it, I'll share it with all of you for truly valued critique and worthily appreciated commentary...</p>
      <p>Martin Bentley Krebs<br>
      Designosaur since 1980</p>
