    <p>I'm sure this has happened to others, but here's the back story: This was "concepted" by some co-workers on a day that I was attending a software seminar, and "executed" by a pre-college intern while I was away on a 25th anniversary trip with my wife.</p>
    <p>Sadly, it is our "new" corporate logo.</p>
    <p>Please respond truthfully, since I might need the "ammo" to make someone see the light.</p>
    <p>Thanks in advance!</p>
