      <p>I think you might want to capitalize on what Eileen said in her first paragraph:</p>
      <p><cite>If you shrank this on to a business card, the tagline would be nothing but a choppy white blur. Furthermore, the M in Miller becomes two oddly spaced Ls because the connecting strokes are too thin. If you convert it to black and white, you’ll lose most of the first two words and I suspect the whole logo would look like it’s drowning.<br>
      </cite></p>
      <p>This seems to be a clear argument against it which the the people who approved it could accept, while saving face. If you highlighted all the poor design ideas, you might put them on the defensive.</p>
      <p>As I see it, the logo is unusable in most instances. Obviously it doesn't work at all in black and white, and would be difficult in grayscale too. Beyond that, if you sized it to use on business cards, stationery, envelopes, nearly any handheld sized printing application, the tag line would be too small to notice or read.<br>
      But when you blow the logo up to a sensible size to read the tagline, the "H" M" and "A" become so large as to be distracting, and they separate from the rest of the name.</p>
      <p>I'd go with that argument rather than pointing out the poor overall design, it'll be easier to get everyone to see your point and agree with you.</p>
      <p>Jason C</p>
