      <p>Well I'm sure you'll get more than enough ammo here, because for starters, design execution aside, this "logo" says nothing to me about marketing. And the only reason it is saying 'sustainable' is because it is throwing every cliche in the book out there (not that cliches are necessarily bad, after all they are immediately understood cultural elements, that, if used correctly and cleverly, can be wonderful springboards of communication). If I were to look at the logo, words aside, I would not know what the company does.</p>
      <p>Secondly, it looks very amatuerish. The weights of the type, the "lettered" 'H' 'M' 'A', the number of similar yet different elements, it's all too much. WAY too much. </p>
      <p>That said, if it is something they are attached to, I could see similar elements and "inspiration" being used to create a more evolved, more refined evolution of this mark.</p>
      <p>Lastly, this mark would not inspire confidence in me to do business with this company. Especially to handle my marketing when it appears they cannot even market themselves properly.</p>
