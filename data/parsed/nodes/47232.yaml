      <p>If you shrank this on to a business card, the tagline would be nothing but a choppy white blur. Furthermore, the M in Miller becomes two oddly spaced Ls because the connecting strokes are too thin. If you convert it to black and white, you'll lose most of the first two words and I suspect the whole logo would look like it's drowning.</p>
      <p>Worst of all, it's just garish. Too busy, too many colors, too many fonts that don't match, too much scale between the letters, too many bad curves. Too much! </p>
      <p>I work with environmental organizations all the time. It's a market full of extremists. I know instantly from a company identity if they're true professionals or just a bunch of idealists looking to earn enough money to buy pot and gas for their next week-long music festival. This logo says you're not even gonna make it to the festival across town, even stone-cold sober.</p>
      <p>Please work hard to convince them to change this. There are far too many unprofessional hacks who want to be professional environmentalists to risk your company on a amateur logo. With a lame identity package, you'll be dismissed MUCH faster than in any other industry. </p>
      <p>Eileen</p>
