      <p>This whole topic of discussion is deeply disturbing to me. I myself have been in a similar situation as a Web Developer/Graphic Designer. I am no longer with the company. Think of it this way. Would a company who hired an accountant or a production manager or an editor trust those people's duties to an intern? I would certainly hope not. People should be (in a RESPONSIBLE company) hired for a reason and given a clear description of job duties- which are not to be shared with others hired for separate reasons. </p>
      <p>You were hired in as the expert in your area, and if you need "help" designing a logo, it should be left to YOU ALONE to delegate that assignment to someone YOU trust to help with YOUR job. If you are not allowed the responsibility to delegate your own work to those which you (as the expert) trust, then you are obviously not valued as the expert and your company should question why they hired you, if they cannot trust you as the expert to delegate your own work. You need to make them realize this. Let them know how important it is to allow department experts to delegate work from their own departments. Explain to them that nobody is an expert in everything, and the company NEEDS specialized experts in all fields in order to succeed. And in order for those experts to do the best jobs they can do - they NEED to be trusted. </p>
      <p>The advice you should give this company you work for should be: "Do not hire anyone you do not trust more than yourself in the area they are being hired into." </p>
      <p>Not everyone is trained to think critically about design, and how the way things look affect a company's image - and in what ways. Anyone can have an opinion, but designers look beyond what "looks good" because designing is a strategic process, to achieve what a company, or a client is trying to achieve.</p>
      <p>I'd definitely give them a chance to "change their ways", but if they don't understand the simple concept of job specialization by now, chances are, they never will. GET OUT of that place - It's going to go down in flames!</p>
