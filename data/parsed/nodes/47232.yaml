      <p>Well, I am happy to report that indecision has led to a situation in which a new identity needs to be rolled out prior to a trip overseas to meet with new clients. I took the liberty (and the timely advice of some contributors here) to make changes and improvements to the most recent round of logos and created a workable logo and color palette. It's not what would have developed through a more "normal" course of action, but I think the end result (considering the constraints, and we've all had to deal with those!) is a vast improvement over what was going to be the "final" version I showed earlier.</p>
      <p>I'd greatly appreciate your feedback, and thanks for all of your support! </p>
