      <p>Dear Artboy</p>
      <p>After reading every post I felt like I needed to comment but for the first time I found myself totally out of words. But returning today, I have a few. Thank you for stepping up to your job as a creative director. I felt your posts was kinda joking with the whole concept and that sort of pissed me off a little. You should have forced your way into this with a pencil in every hand and set people straight - as your jobtitle would demand. I'm sure you could have made 10 new logo sketches in one day that would have been better... a lot better! Your companys profile would have taken a beating and eventually your own job would be threaten. The owner of your company hired you because you knew something about graphic design that he himself didn't and the fact that he didn't even take his own companys profile so serious - just scares the hell out of me. I'm leaning towards the cries for you to leave this company ASAP... You coming here shows you care.</p>
      <p>You certainly made a better logo for the company but I agree with the other post that it's webish and the word Associates is disturbed by the graphics. </p>
      <p>In scandinavian design we have a saying "keep it simple"... I would suggest you try that. Remove what are not important and go ahead and save the day!</p>
      <p>You can do it - because you care</p>
      <p>Mark<br>
      <a href="http://www.enterthemark.com" title="http://www.enterthemark.com">http://www.enterthemark.com</a></p>
