      <p><em>“In the good old days, there was only one font format…”</em></p>
      <p>I'm from those good old days - and even in the beginning - there was more than one format for MAC (I cannot speak about IBM and IBM Clones [Dell, Gateway, etc.[) but from Adobe we had Type 1 and from Bitstream and most others Type 3, or as some called it Type C. When Adobe allowed others to use their Type 1 method - it was a little easier. Some manufacturers took back their Type 3s and replaced them for us as Type 1s. Others were out of business. Every now and then I do a job and a Type 3 (or C) font emerges and cannot rip -- out comes Fontographer to change it to a Type 1 and therefore usable.</p>
      <p>Meanwhile back to "flatten out the type" -- I was asking the manufacturers of their own type to do this for their initial PDFs when showing a new face. It is amazing that when a manufacturer wants to release the new designs, they put out "embedded" fonts in their PDF -- and the Russians jump on this and immediately extract it. Right now there are so many bad versions going around -- in some ways it is quite funny. And I always hope that if anyone picks up one of these and wants to use it -- they will go and buy the original. (Less points per letter and kerning pairs worked out!)</p>
