    html: |-
      <p>Like most anything, you both can &amp; can't "steal" a front from a PDF. Early on, there was no protection. Later, around the time of Acrobat 5, protection became better. I assume it's gotten even better with later versions. I tried it just for the hell of it back in the late 1990s, extracting a font I already owned. Aside from the "no metrics," I probably spent an hour figuring out what to write off. Metrics add a day, right? Maybe a high school kid will do it for fun -- but they'll likely get the metrics wrong. For anybody else, it costs over twice as much to steal it as to buy. BTW, I tried this after Acrobat 5 or so (with protection) &amp; couldn't extract it, but all that probably shows is my level of programming skill, which isn't very high. If you can break into a high-security computer, you can probably steal a font -- in fact, you can probably break into a foundry's computers &amp; steal the whole library.</p>
      <p>BTW, not being allowed to embed a font stops it's use for bookwork.</p>
