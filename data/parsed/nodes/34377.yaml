      <p>Mr. Cordoba:</p>
      <p><cite>"Sir, yours is the first eyewitness report I have ever read… So it’s not just a paranoid theory."</cite></p>
      <p>Extraction of fonts from PDF files is not a mare's nest. For example, I extracted fonts from PDF files using my own extraction tools specifically designed for the purpose of documenting inhouse font forgeries not available on the market and made by big companies (e.g. UPS). However, at Typophile, for reasons of censorship, it is not allowed to describe the techniques of extracting fonts from PDF files.</p>
      <p>Mr. Twardoch:</p>
      <p><cite>"if you can see it, you can copy it".</cite></p>
      <p>Correct. We can go a step ahead and say: Seeing a font proves that Adobe Acrobat extracted the font from the PDF file. What is regarded as illegal by Adobe, namely to extract fonts, is done by Adobe with its own font extracting tool Adobe Acrobat.</p>
      <p>For example, by the German copyright act, it is illegal to make a "permanent or temporary reproduction of a computer program by any means and in any form, in part or in whole" (see § 69c UrhG). If fonts were software (Adobe says so. I don't), then the sale of Adobe Acrobat would be illegal, since it is a font extracting tool.</p>
      <p>Adobe Acrobat would be entirely useless, if it did not extract the fonts from PDF files, because this would mean that you could not see the embedded fonts. Since you would have to use substitute fonts such as "Courier" for reading PDF files with the consequence that Adobe would not sell any longer its big money-making Acrobat cash cow, if it did not extract the fonts, Adobe does what it calls illegal and extracts them from PDF files.</p>
