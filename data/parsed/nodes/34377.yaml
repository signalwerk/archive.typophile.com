      <p>There is a certain breed (I know, I used to be one), somewhat like the Elvis obsessed meter maid recently busted in England, that has a font addiction. They have to have every font that exists. Right and wrong can be rationalized with only a little effort.</p>
      <p>The fonts I have seen extracted, were missing so much, I wasn't really attracted. But what I would worry about if I were a fontmaker is that these files aren't always labeled, and there are stripped copies of commercial fonts floating around that might make people question the work quality of a designer.</p>
      <p>But a person can get a pristine version of almost any font that has been out for a while through normal addict channels, if one is dedicated. So I think the main issue with the .pdf extracts is the quality reflection on the artist.</p>
