    html: |-
      <p>In theory, it is possible. In practice, it's like stealing. At least it seems like that to me.</p>
      <p>Because it is entirely possible to pull fonts from pdfs (granted, without kerning pairs and other important features) it is causing more and more foundries to forbid us designers from embedding fonts when we send our files off to printers. One foundry, Letterhead Fonts, has even built in copy protection that prevents such embedding. This creates a world of extra work, and is unfortunate. Understandable, though.</p>
      <p>Anyway, in my personal opinion, this is the last place in the world I would look for information on how to extract fonts from pdfs.</p>
