      <p>"In the good old days, there was only one font format..."</p>
      <p>Uli</p>
      <p>That would have been Bitstream's, correct? There was a time when only certain fonts could work on certain computers/printers (as someone postulated here as a solution). Proprietary economics is actually how type had been sold since the beginning of the stand alone foundry. And by foundry I mean REAL foundry, ca 16th century.</p>
      <p>Adobe's unlicensing of the PS1 format was unprecedented (and killed off traditional protection schemes—and Bitstream's competitive format, which was the idea). The problems of copying, theft, extracting, etc., are a natural extension of the fact that the software tools (Fontographer, FontLab) used for type design rely on unlicensed font formats.</p>
      <p>Has any digital type foundry ever paid one cent in tribute to Adobe, Apple, or Microsoft for piggy-backing on their free font formating? Hell no. And why would they? It's free. Still, when you opt into the system, you have to live by its rules. That, or come up with your own system.</p>
      <p>Gerald</p>
