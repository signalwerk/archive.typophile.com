      <p><cite>I am curious to know whether it is possible to ‘extract’ fonts from pdf documents. I can’t remember where I heard it, but I seem to remember it may be. Sorry, I can’t be any vaguer than that!</cite></p>
      <p>Whenever you open a PDF file, the Adobe Acrobat reader (or any other PDF viewer) "extracts" or "copies" the fonts embedded into this PDF file and uses these fonts, as if these fonts had been installed beforehand.</p>
      <p>If fonts were protected by "copy"-right and if it were illegal to "copy" fonts, then by opening a PDF file with Adobe Acrobat you would make an illegal "copy" of the fonts embedded into this PDF file.</p>
      <p>The Adobe reader may be regarded as a "font extracting hacker tool": Any font embedded into a PDF is automatically extracted -- with no questions asked.</p>
