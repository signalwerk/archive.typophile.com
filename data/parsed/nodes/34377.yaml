      <p>Hi folks,<br>
      No harm meant, nor did I mean to imply that anyone here was actually going to steal a font by ripping it from a PDF. </p>
      <p>aluminum, I happen to agree that it's kind of a desperate and self-delusional act to think that EULAs that forbid font embedding do any good. For a lively discussion on this subject, check out the lengthy thread here about Letterhead Fonts copy protection scheme. Then go to Letterhead Fonts and see what Chuck, the proprietor, has to say on the issue. He's written a rather good explanation for his thinking, and one can just feel his pain.</p>
