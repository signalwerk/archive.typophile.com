      <p>&gt; "The fonts are being extracted more and more. It’s actually surprisingly easy."</p>
      <p>Mrs. Cotorobai:</p>
      <p>What makes you think so? I can't confirm that it is "actually surprisingly easy".</p>
      <p>In the good old days, there was only one font format and one PS and one PDF file format, but today, there are different types of font formats and hence different types of PS and PDF formats, which makes things very tricky.</p>
      <p>For example, extracting all 22 Akzidenz Grotesk fonts from this "stone-age" file</p>
      <p><a href="http://www.sanskritweb.net/fontdocs/ag1992ps.zip" title="http://www.sanskritweb.net/fontdocs/ag1992ps.zip">http://www.sanskritweb.net/fontdocs/ag1992ps.zip</a></p>
      <p>is "actually surprisingly easy" even for "bloody laymen", since no programming skill at all is needed here.</p>
      <p>But today's PostScript and PDF files are much trickier so that a high degree of proficiency in computer programming is required.</p>
