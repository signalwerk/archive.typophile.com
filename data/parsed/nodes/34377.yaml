      <p>Well, every "DRM" system is breakable, in worst case using analog tools. With music, the principle is "if you can hear it, you can copy it". That's obvious. The simplest way is to attach a digital recorder to the Audio Out port of your computer. </p>
      <p>With fonts, the same principle applies, by the way of "if you can see it, you can copy it". The most brute-force method is scan and autotrace, a bit more refined method would be convert to outlines and dissect into a font again. </p>
      <p>There are some legal implications of that. I hope that I will be able to collect some data and talk about it, perhaps at ATypI TypeTech. </p>
      <p>A.</p>
