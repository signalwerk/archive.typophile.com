      <p>“In the good old days, there was only one font format…”</p>
      <p>“That would have been Bitstream’s, correct?”</p>
      <p>Mr. Lange:</p>
      <p>Since the topic of this thread is “PDF font extraction”, I was only thinking of the oldest versions of Adobe Acrobat Distiller which generated PDF files embedding entire Type 1 PFB files as complete and unmodified PFA files (which may be directly opened with Fontlab and similar programs) in the same manner as the PostScript files generated by the old PS drivers used at that time (e.g. QMS 800).</p>
      <p>Bitstream’s format could not be embedded into PDF files.</p>
      <p>You will most certainly know that Peter Karow’s interesting 455-page book “Digital Schriften” describes in detail the oldest font formats, e.g. Ikarus, Intellifont etc., but unfortunately it only mentions the Bitstream format incidenter (i.e. without technical details).</p>
