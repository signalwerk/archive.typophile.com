    html: <p> Hello Marcox. Well there is a story behind this. <br>Back in 1998 I created this logo in a horizontal and vertical format for the a cafe called Lux in <br>the hip part of Seattle called Belltown. There was a neon sign as well as vinyl window sign fabricated. This establishment was sold in 2000 to a couple who sold again a year later, but kept he logo and brought it back to Phoenix, Arizona when they sold the Seattle location. I reprinted the businesscards and this promo with the new address on it in december 2001. I have not ever been to Phoenix or seen the new location, so I find it interesting that someone in the typophile community drives by there all the time. thanks for the info. Ole  <br> <br> The owners Felicia and Daniel purchased a cafe usy streets in in the hip part of Seattle called Belltown a few years ago. The cafe already had the logo you see above in a horizontal format in Neon signage. The </p>
