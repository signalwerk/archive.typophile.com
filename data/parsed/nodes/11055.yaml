  html: <p>This is a typographic logo / flyer for Lux, an upscale coffeehouse in Phoenix, Arizona. <br>It was printed on a 5.25 x 5.25 cmyk / bw water and tear resistant matte laminated stock.  <br> <br>typeface used is slightly modified  Beta by Joshua Distler (shiftype) <br> <br><img src="http://www.typophile.com/forums/messages/29/915.jpg" alt="Lux Typographic Logo.jpg"></p>
