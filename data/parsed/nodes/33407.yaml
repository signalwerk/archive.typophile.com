    <p>Sorry I don’t have an example. I’m pulling from the collective pool here. I’m looking for a Sans Serif where the standard e is styled like an italicized <em>e</em>. I’ve seen examples around, the most recent was the text on the back of the Arrested Development DVD case. I don’t have it, or I’d scan and post (Google only had front covers and everything is in UPPERCASE). </p>
    <p>Any suggestions would be helpful.</p>
