    <p>Just added to the series of events for Typecon is a Typographic tour of the historic Forest Lawn Cemetery in Buffalo NY:<br>
    Thursday July 17, 2008 10:00 AM</p>
    <p><em>Forest Lawn Cemetery located in the heart of Buffalo, opened in 1849 and is 269 acres of incomparable beauty that invites guests to walk the grounds, admire the funerary art, and commune with nature. </em></p>
    <p>Join Forest Lawns Interpretive Program Director, Sandy Starks on a 1 1/2hour walk through the cemetery looking at some of the outstanding monuments and their varied typography, many of which were created during the Victorian time period. </p>
    <p>Also view work such as Frank Lloyd Wrights Blue Sky Mausoleum and the Blocher Memorial. Hear stories about the movers and shakers that made up this great city (From Chief Red Jacket to Rick James) as you discover unique type designs and stone cutting craftsmanship.</p>
    <p>tickets can be booked via:<br>
    <a href="http://www.brownpapertickets.com/event/37514" title="http://www.brownpapertickets.com/event/37514">http://www.brownpapertickets.com/event/37514</a></p>
