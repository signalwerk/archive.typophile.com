  html: "<p>See the newsletter as its meant to be seen - in a web browser: <br> <br>- <a href=\"http://www.myfonts.com/images/email-content/iyf-200409/iyf-200409.html\" target=\"_blank\">http://www.myfonts.com/images/email-content/iyf-200409/iyf-200409.html</a> <br> <br> <br>============================================================ <br> <br>IN THIS ISSUE <br> <br>1. Rob Leuschke <br>2. Improved Test Drive <br>3. Ten new foundries <br> - DSType - TypeArt Foundry - HamburgerFonts - GeoBoFonts -  <br> - Martin L'Allier Graphiste - Transkrypt - Suitcase Type Foundry -  <br> - Canada Type - Kenn Munk - Rob Leuschke <br>4. More Fonts <br>5. MyFonts RSS feeds <br>6. ATypI 2004 <br>7. Regulars <br> <br>LETTER FROM THE EDITOR <br> <br>Many thanks to all of you who completed our survey, put out by our sister <br>newsletter Rising Stars. We heard loud and clear that one of your favorite <br>features is Test Drive, so we made it made it easier to use and much more <br>powerful! <br> <br>As usual we've had lots of new foundries signing up since the last <br>newsletter, and our current foundries continue to bring out great new <br>fonts. Please scroll down to check out the highlights. And to keep really <br>up-to-date, do try out our new RSS feeds. <br> <br>Happy font finding! <br> <br>-- Laurence Penney, In Your Face Editor <br> <br> <br>============================================================ <br> <br>TYPESETIT.COM SCRIPT FONTS BY ROB LEUSCHKE <br> <br>- <a href=\"http://www.myfonts.com/foundry/gideon/\" target=\"_blank\">http://www.myfonts.com/foundry/gideon/</a> <br> <br>TypeSETit.com is the latest venture from one of the modern masters of <br>calligraphic fonts, Rob Leuschke. Rob, who hails from St Charles, <br>Missouri, showed design talent at an early age, and worked alongside some <br>of the world's best lettering artists at Hallmark Cards (where else?). In <br>1987 he went solo and has been designing type - well, type that looks just <br>like inspired calligraphy - ever since. Looking through the TypeSETit.com <br>collection, we can't help but be struck both by the remarkable rhythm Rob <br>shows, and by the diversity of styles with which he seems totally at ease. <br>Formal, light-hearted, brush-drawn, pen-drawn, Rob's nailed 'em all! <br> <br>Rob's current tally stands at 250 typefaces. You may recall we've featured <br>his designs before - he's designed fonts for Bitstream, ITC and IHOF/P22. <br>But we're absolutely delighted to be selling direct the output of his <br>latest venture. <br> <br>Of the latest set, we particularly like Love Light, surely the closest <br>anyone will ever get to distilling the typographic essence from a bunch of <br>red roses! Check out its Love ligature. Also, Kolker Brush (just look at <br>its sublime B) showed us that the brilliant dynamism of Japanese <br>calligraphy may have been attained in a Western font for the first time. <br>Set Kolker in the right color, and you'll almost savor the aromatic ink as <br>it glides off the brush... <br>- <a href=\"http://www.myfonts.com/person/leuschke/rob/\" target=\"_blank\">http://www.myfonts.com/person/leuschke/rob/</a> <br>- <a href=\"http://www.myfonts.com/fonts/gideon/love-light/\" target=\"_blank\">http://www.myfonts.com/fonts/gideon/love-light/</a> <br>- <a href=\"http://www.myfonts.com/fonts/gideon/kolker-brush/\" target=\"_blank\">http://www.myfonts.com/fonts/gideon/kolker-brush/</a> <br> <br> <br>============================================================ <br> <br>TEST DRIVE ANYWHERE! <br> <br>One of your very favorite MyFonts features, as hundreds of you told us in <br>our 2004 Survey, is Test Drive, where you get to see what your own text <br>looks like it the font of your choice. We decided that meant we should <br>spend some effort making it even better. So, we decided to allow Test <br>Drive from nearly every page on the site! You'll notice the new Test Drive <br>bar near the top of the page. Simply type any text you like, and from then <br>on, all your browsing will use that text rather than AaBbCc. <br> <br> <br>============================================================ <br> <br>TEN NEW FOUNDRIES JOIN MYFONTS <br> <br>DSTYPE. Dino dos Santos, from Oporto, Portugal, has been designing custom <br>typefaces for magazines and corporations since 1994. We love his Anubis, a <br>punchy, contemporary unicase design that's confident enough to quote from <br>historical sources. Dino tells us that Kartago is inspired by Roman <br>inscriptions in ancient Carthage - we look at it as a delicate, playful <br>alternative to the senatorial sternness of Trajan. Instead of usual <br>symbols in the character set, it provides a delightful set of ligatures. <br>Aquila is an elegant and legible text face with unusual serif treatment. <br>Its italic is cursive and narrow, making the whole face reminiscent of <br>Gill's Joanna. Finally, Monox is a large super-family of monospace fonts - <br>sans and serif versions, each in 5 weights, with italic and smallcaps. <br>Total of 78 styles. <br>- <a href=\"http://www.myfonts.com/foundry/dstype/\" target=\"_blank\">http://www.myfonts.com/foundry/dstype/</a> <br>- <a href=\"http://www.myfonts.com/person/dos-santos/dino/\" target=\"_blank\">http://www.myfonts.com/person/dos-santos/dino/</a> <br>- <a href=\"http://www.myfonts.com/fonts/dstype/anubis/\" target=\"_blank\">http://www.myfonts.com/fonts/dstype/anubis/</a> <br>- <a href=\"http://www.myfonts.com/fonts/dstype/kartago/\" target=\"_blank\">http://www.myfonts.com/fonts/dstype/kartago/</a> <br>- <a href=\"http://www.myfonts.com/fonts/dstype/aquila/\" target=\"_blank\">http://www.myfonts.com/fonts/dstype/aquila/</a> <br> <br>TYPEART FOUNDRY. Lloyd Springer has been running the TypeArt foundry out <br>of Vancouver since the mid-1990s. He displays great flair for varying <br>decorative styles. Of the 106 styles on offer in this first batch we <br>particularly liked the Art Deco feel of Eucaliptus and Tolstoy; the good <br>ol' days of Eastside's cowboy wood type (perfect for Buffalo Bill or <br>Moulin Rouge posters); the casual scripts Falcon Casual and Falcon <br>Brushscript; Liteweit, a handsomely drawn family of light sans-serifs with <br>classic, generous proportions; and Silverscreen's a great super-narrow <br>sans-serif that we'd like to see used in movie posters. When we saw how <br>well he handled the grungy types (Tapeworm, Keystoned, Deviant Strain) <br>alongside the self-assured and the bold (Eastside, Dream Lover, Liteweit), <br>we asked him if he might be related to that other well-known Springer. He <br>paused before giving us something he called Lloyd's Final Thought: \"When <br>you send us cash for fonts, don't think of it as helping a corporation (or <br>even a struggling artist) make lots of money, think of it as a simple way <br>to make your writing face the world with a renewed confidence. Look after <br>yourselves... and each other.\" <br>- <a href=\"http://www.myfonts.com/foundry/typeart/\" target=\"_blank\">http://www.myfonts.com/foundry/typeart/</a> <br>- <a href=\"http://www.myfonts.com/person/springer/lloyd/\" target=\"_blank\">http://www.myfonts.com/person/springer/lloyd/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/tolstoy/\" target=\"_blank\">http://www.myfonts.com/fonts/typeart/tolstoy/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/silverscreen/\" target=\"_blank\">http://www.myfonts.com/fonts/typeart/silverscreen/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/eastside/\" target=\"_blank\">http://www.myfonts.com/fonts/typeart/eastside/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/dream-lover/\" target=\"_blank\">http://www.myfonts.com/fonts/typeart/dream-lover/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/liteweit/\" target=\"_blank\">http://www.myfonts.com/fonts/typeart/liteweit/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/tapeworm/\" target=\"_blank\">http://www.myfonts.com/fonts/typeart/tapeworm/</a> <br> <br>HAMBURGERFONTS are from Stuart Brown from Halifax, Yorkshire, England - <br>he's been creating digital typefaces since his art college days in the <br>mid-nineties. The initial offering is his Neutraliser: 24 variations on <br>one geometric theme in sans and serif, regular and italic, and multiple <br>weights. So why call your foundry \"HamburgerFonts\" then? Well, that's the <br>strange sample word you'd see when browsing old font catalogs from the <br>1970s, pages and pages of font samples, all reading Hamburgerfonts - <br>supposedly a more interesting set of letters than ABC! <br>- <a href=\"http://www.myfonts.com/foundry/hamburger/\" target=\"_blank\">http://www.myfonts.com/foundry/hamburger/</a> <br>- <a href=\"http://www.myfonts.com/fonts/hamburger/neutraliser-sans/\" target=\"_blank\">http://www.myfonts.com/fonts/hamburger/neutraliser-sans/</a> <br> <br>GEOBOFONTS. Designer G.R. Bourne from San Diego has come up with <br>friendly Daisy, which seems to be made almost entirely from curves. The <br>font's punctuation is in the form of, yes, daisies - is it my imagination <br>or are they taking shelter under the bendy capitals? <br>- <a href=\"http://www.myfonts.com/foundry/geobofonts/\" target=\"_blank\">http://www.myfonts.com/foundry/geobofonts/</a> <br>- <a href=\"http://www.myfonts.com/fonts/geobofonts/daisy/\" target=\"_blank\">http://www.myfonts.com/fonts/geobofonts/daisy/</a> <br> <br>MARTIN L'ALLIER GRAPHISTE. Martin L'Allier is still a graphic design <br>student at the University of Quebec in Montreal. His grid-based, unicase, <br>experimental font, Kg Stuttgart 1930, is based on German lettering from <br>1930. Martin has completed the alphabet and releases the font 74 years <br>later. <br>- <a href=\"http://www.myfonts.com/foundry/martinlallier/\" target=\"_blank\">http://www.myfonts.com/foundry/martinlallier/</a> <br>- <a href=\"http://www.myfonts.com/person/lallier/martin/\" target=\"_blank\">http://www.myfonts.com/person/lallier/martin/</a> <br>- <a href=\"http://www.myfonts.com/fonts/martinlallier/kg-stuttgart-1930/\" target=\"_blank\">http://www.myfonts.com/fonts/martinlallier/kg-stuttgart-1930/</a> <br> <br>TRANSKRYPT. Frank Baranowski, of Neuenkirchen in northern Germany, runs <br>the Transkrypt foundry and has been designing typefaces since 1990. Our <br>favorite is Kaleido, a very bold but also very playful design - ideal for <br>children's book covers, a poster for a kids' play, or toy packaging. We <br>love the way he handles diagonals, and the E and F crossbars. The <br>complementary shaded and outline styles mean you can make fun, colorful <br>designs with ease. Clayborn's block-like and roughly shaped characters <br>make this font also very useful for building walls of text, notes Frank. <br>And Silverblade is a decorative 5-style font, with multiple styles <br>suitable for layering with different colors. A natural for drop-caps at <br>the beginning of chapters, we reckon. <br>- <a href=\"http://www.myfonts.com/foundry/transkrypt/\" target=\"_blank\">http://www.myfonts.com/foundry/transkrypt/</a> <br>- <a href=\"http://www.myfonts.com/fonts/transkrypt/kaleido/\" target=\"_blank\">http://www.myfonts.com/fonts/transkrypt/kaleido/</a> <br>- <a href=\"http://www.myfonts.com/fonts/transkrypt/clayborn/\" target=\"_blank\">http://www.myfonts.com/fonts/transkrypt/clayborn/</a> <br> <br>SUITCASE TYPE FOUNDRY. The two major font families from the Suitcase <br>Type Foundry (Prague, Czech Republic) show that the foundry has a <br>dedication to making its designs supremely useful, rather than coming out <br>with as many designs as possible. With the 30-style Atrament family, <br>Suitcase sets out a serious alternative to the narrow grotesques - News <br>Gothic etc. - one might usually choose. In Light, Medium and Bold weights, <br>with small-caps, true italics, and some funky curvy alternates, this <br>balanced, round-cornered design is strikingly contemporary, despite being <br>inspired by title lettering from a 1922 journal. Fishmonger, a functional <br>sans-serif completely devoid of all flourish and ornament, presents a full <br>range of 50 hand-tuned weight and width variants. <br>- <a href=\"http://www.myfonts.com/foundry/suitcase/\" target=\"_blank\">http://www.myfonts.com/foundry/suitcase/</a> <br>- <a href=\"http://www.myfonts.com/fonts/suitcase/atrament/\" target=\"_blank\">http://www.myfonts.com/fonts/suitcase/atrament/</a> <br>- <a href=\"http://www.myfonts.com/fonts/suitcase/fishmonger/\" target=\"_blank\">http://www.myfonts.com/fonts/suitcase/fishmonger/</a> <br> <br>CANADA TYPE is the typefoundry of Rebecca Alaccari of Toronto. She <br>interned in two design companies with a focus on typography, before <br>releasing her own fonts. All scripts and decoratives, they cover many <br>different styles: techno, olde-worlde, grunge, psychedelic, childish. We <br>love Bluebeard: just the thing for fairy tales, and its own capitals work <br>as superb drop-caps. Secret Scrypt is how your elegant Victorian <br>great-great-grandmother may have written: perfect for ghostly messages! <br>Fore would suit a techno album cover, while the Bolero script (with its <br>many ligatures) would work well for fashion branding. <br>- <a href=\"http://www.myfonts.com/foundry/canadatype/\" target=\"_blank\">http://www.myfonts.com/foundry/canadatype/</a> <br>- <a href=\"http://www.myfonts.com/fonts/canadatype/bluebeard/\" target=\"_blank\">http://www.myfonts.com/fonts/canadatype/bluebeard/</a> <br>- <a href=\"http://www.myfonts.com/fonts/canadatype/secret-scrypt/\" target=\"_blank\">http://www.myfonts.com/fonts/canadatype/secret-scrypt/</a> <br>- <a href=\"http://www.myfonts.com/fonts/canadatype/bolero/\" target=\"_blank\">http://www.myfonts.com/fonts/canadatype/bolero/</a> <br> <br>KENN MUNK is based in Aarhus, Denmark where he's been making alternative <br>fonts and dingbats since 2000. He designs most of his fonts to be used as <br>\"construction kits\", each having an underlying system that allows the user <br>to build words and images. (Ideal for logos, we say!) He attributes this <br>to the many hours spent playing with LEGO bricks in his childhood. <br>Arkudius is constructed from circles, while Linemap is a bitmap font <br>that's almost a connecting script. Contamination is a dingbat font that <br>reminds me of some of the alien skeletons I've come across. And - we never <br>expected to put on sale any build-your-own bitmap-effect aristocratic <br>crest fonts, but Wappenbee certainly has a strange appeal! Read more about <br>Kenn Munk here. Total of 20 styles. <br>- <a href=\"http://www.myfonts.com/foundry/kennmunk/\" target=\"_blank\">http://www.myfonts.com/foundry/kennmunk/</a> <br>- <a href=\"http://www.myfonts.com/fonts/kennmunk/arkudius/\" target=\"_blank\">http://www.myfonts.com/fonts/kennmunk/arkudius/</a> <br>- <a href=\"http://www.myfonts.com/fonts/kennmunk/linemap/\" target=\"_blank\">http://www.myfonts.com/fonts/kennmunk/linemap/</a> <br>- <a href=\"http://www.myfonts.com/fonts/kennmunk/wappenbee/\" target=\"_blank\">http://www.myfonts.com/fonts/kennmunk/wappenbee/</a> <br> <br> <br>============================================================ <br> <br>MORE FONTS FROM OUR CURRENT FOUNDRIES <br> <br>ASTYPE. To accompany his spendid Ornaments Thanksgiving font, Andreas <br>Seidel has released the gorgeous Ornaments Wine Grape, a beautiful way to <br>decorate your pages. The font is designed to work in layers of color. <br>- <a href=\"http://www.myfonts.com/fonts/astype/ornaments-wine-grape-a/\" target=\"_blank\">http://www.myfonts.com/fonts/astype/ornaments-wine-grape-a/</a> <br> <br>BITSTREAM. Originally released in 1987, Matthew Carter's Charter <br>incorporated three important features: compact set width to give <br>economical copyfit; generous x-height to give readability at small point <br>sizes; and sturdy open letterforms to give reliable reproduction at both <br>typesetter and laser printer resolutions. The family has now been <br>comprehensively upgraded to the OpenType format and re-released as Charter <br>BT Pro. Packaged as 6 fonts (roman, italic, bold, bold italic, black, and <br>black italic), the OpenType fonts include characters originally developed <br>for expert sets, such as ligatures, ornaments, old style figures, small <br>caps, and superiors. The Pro Pack fonts support Western, Central European, <br>and Eastern European languages and, being OpenType, the same package works <br>on Windows and Mac. <br>- <a href=\"http://www.myfonts.com/fonts/bitstream/charter-bt-pro/\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/charter-bt-pro/</a> <br>- <a href=\"http://www.myfonts.com/info/opentype/\" target=\"_blank\">http://www.myfonts.com/info/opentype/</a> <br> <br>Bitstream's New Font Collection continues to grow: 10 new font families so <br>far in 2004. For a fist full of dollars, Hombre BT can be yours, and for a <br>few dollars more, you can stake a claim to Hombre Extra, which has a few <br>illustrations in it. Good, bad or ugly, whichever way you see it, just <br>saddle up and ride this pony. Robert Bell's Ecliptica BT has a Sans, a <br>Semi-Serif, a Serif and a single Cursive that can be used with any of the <br>other three styles. As an added bonus, Robert also designed a modern <br>Blackletter companion. <br>- <a href=\"http://www.myfonts.com/fonts/bitstream/hombre-bt/\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/hombre-bt/</a> <br>- <a href=\"http://www.myfonts.com/fonts/bitstream/ecliptica-bt/\" target=\"_blank\">http://www.myfonts.com/fonts/bitstream/ecliptica-bt/</a> <br>- <a href=\"http://www.myfonts.com/WhatsNew?foundryid=6&amp;startdate=20040501\" target=\"_blank\">http://www.myfonts.com/WhatsNew?foundryid=6&amp;startdate=20040501</a> <br> <br>NICK'S FONTS has completed more wonderful retro fonts for us. Magic <br>Twanger NF is a funky narrow design that brings back the 1950s. We love <br>the retro cartoons of Kartoon Kutz NF. These charming guys, gals and <br>critters, known in the printing trade as \"midgets\", added a little extra <br>oomph to everything from business cards to matchbook covers from the 1920s <br>to the 1950s. <br>- <a href=\"http://www.myfonts.com/fonts/nicksfonts/magic-twanger-nf/\" target=\"_blank\">http://www.myfonts.com/fonts/nicksfonts/magic-twanger-nf/</a> <br>- <a href=\"http://www.myfonts.com/fonts/nicksfonts/kartoon-kutz-nf/\" target=\"_blank\">http://www.myfonts.com/fonts/nicksfonts/kartoon-kutz-nf/</a> <br>- <a href=\"http://www.myfonts.com/WhatsNew?foundryid=223&amp;startdate=20040501\" target=\"_blank\">http://www.myfonts.com/WhatsNew?foundryid=223&amp;startdate=20040501</a> <br> <br>VIRUS. Olympukes is the pithy commentary by British designer <br>Jonathan Barnbrook and Marcus McCallion on the \"true spirit of the <br>Olympics\". It's FREE to download! <br>- <a href=\"http://www.myfonts.com/fonts/virusfonts/olympukes/\" target=\"_blank\">http://www.myfonts.com/fonts/virusfonts/olympukes/</a> <br> <br>WIESCHER DESIGN has come out with Ela, a useful new sans family. And <br>their popular script font Scriptissimo now has a bold: Scriptissimo Forte. <br>- <a href=\"http://www.myfonts.com/fonts/wiescherdesign/ela/\" target=\"_blank\">http://www.myfonts.com/fonts/wiescherdesign/ela/</a> <br>- <a href=\"http://www.myfonts.com/fonts/wiescherdesign/scriptissimo-forte/\" target=\"_blank\">http://www.myfonts.com/fonts/wiescherdesign/scriptissimo-forte/</a> <br> <br>LINOTYPE. The new TakeType 5 library is amazing value: 204 fonts at just <br>$127! The collection is organized according to the popular TakeType <br>concept with the typefaces divided into four categories: Text, Display, <br>Fun and Symbol. Find such fonts as Anasdair, a decorative blackletter by <br>Richard Yeend and Balega, a script of bold, scything strokes by Juergen <br>Weltin. Lomo is a really complete pixelfont solution of 37 styles by Fidel <br>Peugeot. He's a consultant for gadget manufacturers, so really knows his <br>stuff when it comes to tiny text! Finally here's Siseriff, a fine <br>slab-serif family in 5 weights suitable for corporate identities, by the <br>prolific Swedish designer Bo Berndal. <br>- <a href=\"http://www.myfonts.com/fonts/linotype/anasdair/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/anasdair/</a> <br>- <a href=\"http://www.myfonts.com/fonts/linotype/balega/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/balega/</a> <br>- <a href=\"http://www.myfonts.com/fonts/linotype/siseriff/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/siseriff/</a> <br>- <a href=\"http://www.myfonts.com/fonts/linotype/lomo/\" target=\"_blank\">http://www.myfonts.com/fonts/linotype/lomo/</a> <br> <br>PREUSSTYPE's Fleischmann Gotisch PT is a splendid revival of the <br>18th century blackletter of Johann Michael Fleischmann, by Ingo Preuss. <br>Ingo uses the OpenType format to help users exploit 520 glyphs of <br>typographic richness. An elegant booklet in PDF format is included. <br>- <a href=\"http://www.myfonts.com/fonts/preusstype/fleischmann-gotisch-pt/\" target=\"_blank\">http://www.myfonts.com/fonts/preusstype/fleischmann-gotisch-pt/</a> <br> <br>SOLOTYPE. Of Cabaret, Dan Solo tells us \"We've always liked Art Gothic <br>(you've seen it on the titles and credits for TV's Murder She Wrote) but <br>felt it was far too animated for most uses. Here is our super-simplified <br>version, a calmer font that will fit many display uses.\". Also check out <br>Contract Banner, Filmstar and some revivals of the typefaces of Peter <br>Behrens, the German architect and graphic artist from the early 1900s. <br>- <a href=\"http://www.myfonts.com/fonts/solotype/cabaret/\" target=\"_blank\">http://www.myfonts.com/fonts/solotype/cabaret/</a> <br>- <a href=\"http://www.myfonts.com/fonts/solotype/filmstar/\" target=\"_blank\">http://www.myfonts.com/fonts/solotype/filmstar/</a> <br> <br>TAIL SPIN STUDIO. Designers Steve and Sue Zafarana tell us of their <br>new face Rostra: \"It was during a visit to the Roman Forum that we were <br>inspired by a seemingly unique style of lettering on a tablet among the <br>ruins. The Latin message was chiseled in a condensed, free-style manner, <br>almost as if it were intended as a personal note. While the stone showed <br>only the capital letter forms of the period, we felt the creation of a <br>lowercase would help extend the font's usability and also add a whimsical <br>feel to the design.\" <br>- <a href=\"http://www.myfonts.com/fonts/tailspinstudio/rostra/\" target=\"_blank\">http://www.myfonts.com/fonts/tailspinstudio/rostra/</a> <br> <br>ELEMENO. Whiffle is a spindly narrow letterform surrounded by clouds.  <br>Express your dreams! <br>- <a href=\"http://www.myfonts.com/fonts/elemeno/whiffle/\" target=\"_blank\">http://www.myfonts.com/fonts/elemeno/whiffle/</a> <br> <br>MASTERFONT. More than 170 new Hebrew fonts. <br>- <a href=\"http://www.myfonts.com/WhatsNew?foundryid=195&amp;startdate=20040501\" target=\"_blank\">http://www.myfonts.com/WhatsNew?foundryid=195&amp;startdate=20040501</a> <br> <br> <br>============================================================ <br> <br>RSS NEWS FEEDS <br> <br>RSS is a great method for you to keep up to date with all your favorite web sites. Thousands of participating sites - such as the BBC, Microsoft, and Apple iTunes - offer their updates in this new streamlined way. Instead of you having to check each site in turn, just open your RSS news reader and you'll be instantly alerted to what's new at all your selected sites. <br> <br>MyFonts offers two feeds: <br>- What's New at MyFonts: <a href=\"http://www.myfonts.com/rss/whatsnew.xml\" target=\"_blank\">http://www.myfonts.com/rss/whatsnew.xml</a> <br>- Best Sellers at MyFonts: <a href=\"http://www.myfonts.com/rss/bestsellers.xml\" target=\"_blank\">http://www.myfonts.com/rss/bestsellers.xml</a> <br> <br>Read more at the MyFonts RSS page: <br>- <a href=\"http://www.myfonts.com/info/rss-news-feed/\" target=\"_blank\">http://www.myfonts.com/info/rss-news-feed/</a> <br> <br> <br>============================================================  <br> <br>ATYPI 2004 CONFERENCE, PRAGUE <br> <br>This September 30 to October 3 the font crowd is heading to Prague in the <br>Czech Republic. Association Typographique Internationale (ATypI) has its <br>annual conference in the beautiful city of one hundred spires located in <br>the heart of the newly enlarged European Union. Over 50 speakers will hold <br>more than 40 talks and workshops - all about type design and typography. <br>The conference motto: Crossroads of Civilizations. We will be there, too! <br>Read more at the ATypI Prague 2004 official site. <br>- <a href=\"http://www.atypi.org/08_Prague/\" target=\"_blank\">http://www.atypi.org/08_Prague/</a> <br> <br> <br>============================================================ <br> <br>REGULARS <br> <br>Check our What's New and Special Offers pages for live updates of all the <br>new fonts that go on sale, and the great promotions we run! <br>- <a href=\"http://www.myfonts.com/WhatsNew\" target=\"_blank\">http://www.myfonts.com/WhatsNew</a> <br>- <a href=\"http://www.myfonts.com/Promotion\" target=\"_blank\">http://www.myfonts.com/Promotion</a> <br> <br>We always like to hear of good and bad experiences you have at MyFonts. <br>Just e-mail us at &lt;<a href=\"mailto:comments@myfonts.com\">comments@myfonts.com</a>&gt; and we'll get back to you! <br> <br>In Your Face is sent out every couple of months to MyFonts users. It <br>announces every new foundry signing up with MyFonts, new fonts from <br>current foundries, and introduces all the useful and fun new features on <br>the site. <br> <br>To unsubscribe or manage your subscriptions, go here: <br>- <a href=\"http://www.myfonts.com/MailingList\" target=\"_blank\">http://www.myfonts.com/MailingList</a> <br> <br> <br>MyFonts.com, Inc. <br>245 First Street, <br>17th floor <br>Cambridge <br>MA 02142 <br>USA <br> <br>Copyright (c) 2004 MyFonts.com, Inc.</p>"
  html_clean: "<p>See the newsletter as its meant to be seen - in a web browser: <br> <br>- <a href=\"http://www.myfonts.com/images/email-content/iyf-200409/iyf-200409.html\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/images/email-content/iyf-200409/iyf-200409.html</a> <br> <br> <br>============================================================ <br> <br>IN THIS ISSUE <br> <br>1. Rob Leuschke <br>2. Improved Test Drive <br>3. Ten new foundries <br> - DSType - TypeArt Foundry - HamburgerFonts - GeoBoFonts -  <br> - Martin L'Allier Graphiste - Transkrypt - Suitcase Type Foundry -  <br> - Canada Type - Kenn Munk - Rob Leuschke <br>4. More Fonts <br>5. MyFonts RSS feeds <br>6. ATypI 2004 <br>7. Regulars <br> <br>LETTER FROM THE EDITOR <br> <br>Many thanks to all of you who completed our survey, put out by our sister <br>newsletter Rising Stars. We heard loud and clear that one of your favorite <br>features is Test Drive, so we made it made it easier to use and much more <br>powerful! <br> <br>As usual we've had lots of new foundries signing up since the last <br>newsletter, and our current foundries continue to bring out great new <br>fonts. Please scroll down to check out the highlights. And to keep really <br>up-to-date, do try out our new RSS feeds. <br> <br>Happy font finding! <br> <br>-- Laurence Penney, In Your Face Editor <br> <br> <br>============================================================ <br> <br>TYPESETIT.COM SCRIPT FONTS BY ROB LEUSCHKE <br> <br>- <a href=\"http://www.myfonts.com/foundry/gideon/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/gideon/</a> <br> <br>TypeSETit.com is the latest venture from one of the modern masters of <br>calligraphic fonts, Rob Leuschke. Rob, who hails from St Charles, <br>Missouri, showed design talent at an early age, and worked alongside some <br>of the world's best lettering artists at Hallmark Cards (where else?). In <br>1987 he went solo and has been designing type - well, type that looks just <br>like inspired calligraphy - ever since. Looking through the TypeSETit.com <br>collection, we can't help but be struck both by the remarkable rhythm Rob <br>shows, and by the diversity of styles with which he seems totally at ease. <br>Formal, light-hearted, brush-drawn, pen-drawn, Rob's nailed 'em all! <br> <br>Rob's current tally stands at 250 typefaces. You may recall we've featured <br>his designs before - he's designed fonts for Bitstream, ITC and IHOF/P22. <br>But we're absolutely delighted to be selling direct the output of his <br>latest venture. <br> <br>Of the latest set, we particularly like Love Light, surely the closest <br>anyone will ever get to distilling the typographic essence from a bunch of <br>red roses! Check out its Love ligature. Also, Kolker Brush (just look at <br>its sublime B) showed us that the brilliant dynamism of Japanese <br>calligraphy may have been attained in a Western font for the first time. <br>Set Kolker in the right color, and you'll almost savor the aromatic ink as <br>it glides off the brush... <br>- <a href=\"http://www.myfonts.com/person/leuschke/rob/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/person/leuschke/rob/</a> <br>- <a href=\"http://www.myfonts.com/fonts/gideon/love-light/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/gideon/love-light/</a> <br>- <a href=\"http://www.myfonts.com/fonts/gideon/kolker-brush/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/gideon/kolker-brush/</a> <br> <br> <br>============================================================ <br> <br>TEST DRIVE ANYWHERE! <br> <br>One of your very favorite MyFonts features, as hundreds of you told us in <br>our 2004 Survey, is Test Drive, where you get to see what your own text <br>looks like it the font of your choice. We decided that meant we should <br>spend some effort making it even better. So, we decided to allow Test <br>Drive from nearly every page on the site! You'll notice the new Test Drive <br>bar near the top of the page. Simply type any text you like, and from then <br>on, all your browsing will use that text rather than AaBbCc. <br> <br> <br>============================================================ <br> <br>TEN NEW FOUNDRIES JOIN MYFONTS <br> <br>DSTYPE. Dino dos Santos, from Oporto, Portugal, has been designing custom <br>typefaces for magazines and corporations since 1994. We love his Anubis, a <br>punchy, contemporary unicase design that's confident enough to quote from <br>historical sources. Dino tells us that Kartago is inspired by Roman <br>inscriptions in ancient Carthage - we look at it as a delicate, playful <br>alternative to the senatorial sternness of Trajan. Instead of usual <br>symbols in the character set, it provides a delightful set of ligatures. <br>Aquila is an elegant and legible text face with unusual serif treatment. <br>Its italic is cursive and narrow, making the whole face reminiscent of <br>Gill's Joanna. Finally, Monox is a large super-family of monospace fonts - <br>sans and serif versions, each in 5 weights, with italic and smallcaps. <br>Total of 78 styles. <br>- <a href=\"http://www.myfonts.com/foundry/dstype/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/dstype/</a> <br>- <a href=\"http://www.myfonts.com/person/dos-santos/dino/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/person/dos-santos/dino/</a> <br>- <a href=\"http://www.myfonts.com/fonts/dstype/anubis/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/dstype/anubis/</a> <br>- <a href=\"http://www.myfonts.com/fonts/dstype/kartago/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/dstype/kartago/</a> <br>- <a href=\"http://www.myfonts.com/fonts/dstype/aquila/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/dstype/aquila/</a> <br> <br>TYPEART FOUNDRY. Lloyd Springer has been running the TypeArt foundry out <br>of Vancouver since the mid-1990s. He displays great flair for varying <br>decorative styles. Of the 106 styles on offer in this first batch we <br>particularly liked the Art Deco feel of Eucaliptus and Tolstoy; the good <br>ol' days of Eastside's cowboy wood type (perfect for Buffalo Bill or <br>Moulin Rouge posters); the casual scripts Falcon Casual and Falcon <br>Brushscript; Liteweit, a handsomely drawn family of light sans-serifs with <br>classic, generous proportions; and Silverscreen's a great super-narrow <br>sans-serif that we'd like to see used in movie posters. When we saw how <br>well he handled the grungy types (Tapeworm, Keystoned, Deviant Strain) <br>alongside the self-assured and the bold (Eastside, Dream Lover, Liteweit), <br>we asked him if he might be related to that other well-known Springer. He <br>paused before giving us something he called Lloyd's Final Thought: \"When <br>you send us cash for fonts, don't think of it as helping a corporation (or <br>even a struggling artist) make lots of money, think of it as a simple way <br>to make your writing face the world with a renewed confidence. Look after <br>yourselves... and each other.\" <br>- <a href=\"http://www.myfonts.com/foundry/typeart/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/typeart/</a> <br>- <a href=\"http://www.myfonts.com/person/springer/lloyd/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/person/springer/lloyd/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/tolstoy/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/typeart/tolstoy/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/silverscreen/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/typeart/silverscreen/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/eastside/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/typeart/eastside/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/dream-lover/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/typeart/dream-lover/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/liteweit/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/typeart/liteweit/</a> <br>- <a href=\"http://www.myfonts.com/fonts/typeart/tapeworm/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/typeart/tapeworm/</a> <br> <br>HAMBURGERFONTS are from Stuart Brown from Halifax, Yorkshire, England - <br>he's been creating digital typefaces since his art college days in the <br>mid-nineties. The initial offering is his Neutraliser: 24 variations on <br>one geometric theme in sans and serif, regular and italic, and multiple <br>weights. So why call your foundry \"HamburgerFonts\" then? Well, that's the <br>strange sample word you'd see when browsing old font catalogs from the <br>1970s, pages and pages of font samples, all reading Hamburgerfonts - <br>supposedly a more interesting set of letters than ABC! <br>- <a href=\"http://www.myfonts.com/foundry/hamburger/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/hamburger/</a> <br>- <a href=\"http://www.myfonts.com/fonts/hamburger/neutraliser-sans/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/hamburger/neutraliser-sans/</a> <br> <br>GEOBOFONTS. Designer G.R. Bourne from San Diego has come up with <br>friendly Daisy, which seems to be made almost entirely from curves. The <br>font's punctuation is in the form of, yes, daisies - is it my imagination <br>or are they taking shelter under the bendy capitals? <br>- <a href=\"http://www.myfonts.com/foundry/geobofonts/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/geobofonts/</a> <br>- <a href=\"http://www.myfonts.com/fonts/geobofonts/daisy/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/geobofonts/daisy/</a> <br> <br>MARTIN L'ALLIER GRAPHISTE. Martin L'Allier is still a graphic design <br>student at the University of Quebec in Montreal. His grid-based, unicase, <br>experimental font, Kg Stuttgart 1930, is based on German lettering from <br>1930. Martin has completed the alphabet and releases the font 74 years <br>later. <br>- <a href=\"http://www.myfonts.com/foundry/martinlallier/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/martinlallier/</a> <br>- <a href=\"http://www.myfonts.com/person/lallier/martin/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/person/lallier/martin/</a> <br>- <a href=\"http://www.myfonts.com/fonts/martinlallier/kg-stuttgart-1930/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/martinlallier/kg-stuttgart-1930/</a> <br> <br>TRANSKRYPT. Frank Baranowski, of Neuenkirchen in northern Germany, runs <br>the Transkrypt foundry and has been designing typefaces since 1990. Our <br>favorite is Kaleido, a very bold but also very playful design - ideal for <br>children's book covers, a poster for a kids' play, or toy packaging. We <br>love the way he handles diagonals, and the E and F crossbars. The <br>complementary shaded and outline styles mean you can make fun, colorful <br>designs with ease. Clayborn's block-like and roughly shaped characters <br>make this font also very useful for building walls of text, notes Frank. <br>And Silverblade is a decorative 5-style font, with multiple styles <br>suitable for layering with different colors. A natural for drop-caps at <br>the beginning of chapters, we reckon. <br>- <a href=\"http://www.myfonts.com/foundry/transkrypt/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/transkrypt/</a> <br>- <a href=\"http://www.myfonts.com/fonts/transkrypt/kaleido/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/transkrypt/kaleido/</a> <br>- <a href=\"http://www.myfonts.com/fonts/transkrypt/clayborn/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/transkrypt/clayborn/</a> <br> <br>SUITCASE TYPE FOUNDRY. The two major font families from the Suitcase <br>Type Foundry (Prague, Czech Republic) show that the foundry has a <br>dedication to making its designs supremely useful, rather than coming out <br>with as many designs as possible. With the 30-style Atrament family, <br>Suitcase sets out a serious alternative to the narrow grotesques - News <br>Gothic etc. - one might usually choose. In Light, Medium and Bold weights, <br>with small-caps, true italics, and some funky curvy alternates, this <br>balanced, round-cornered design is strikingly contemporary, despite being <br>inspired by title lettering from a 1922 journal. Fishmonger, a functional <br>sans-serif completely devoid of all flourish and ornament, presents a full <br>range of 50 hand-tuned weight and width variants. <br>- <a href=\"http://www.myfonts.com/foundry/suitcase/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/suitcase/</a> <br>- <a href=\"http://www.myfonts.com/fonts/suitcase/atrament/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/suitcase/atrament/</a> <br>- <a href=\"http://www.myfonts.com/fonts/suitcase/fishmonger/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/suitcase/fishmonger/</a> <br> <br>CANADA TYPE is the typefoundry of Rebecca Alaccari of Toronto. She <br>interned in two design companies with a focus on typography, before <br>releasing her own fonts. All scripts and decoratives, they cover many <br>different styles: techno, olde-worlde, grunge, psychedelic, childish. We <br>love Bluebeard: just the thing for fairy tales, and its own capitals work <br>as superb drop-caps. Secret Scrypt is how your elegant Victorian <br>great-great-grandmother may have written: perfect for ghostly messages! <br>Fore would suit a techno album cover, while the Bolero script (with its <br>many ligatures) would work well for fashion branding. <br>- <a href=\"http://www.myfonts.com/foundry/canadatype/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/canadatype/</a> <br>- <a href=\"http://www.myfonts.com/fonts/canadatype/bluebeard/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/canadatype/bluebeard/</a> <br>- <a href=\"http://www.myfonts.com/fonts/canadatype/secret-scrypt/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/canadatype/secret-scrypt/</a> <br>- <a href=\"http://www.myfonts.com/fonts/canadatype/bolero/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/canadatype/bolero/</a> <br> <br>KENN MUNK is based in Aarhus, Denmark where he's been making alternative <br>fonts and dingbats since 2000. He designs most of his fonts to be used as <br>\"construction kits\", each having an underlying system that allows the user <br>to build words and images. (Ideal for logos, we say!) He attributes this <br>to the many hours spent playing with LEGO bricks in his childhood. <br>Arkudius is constructed from circles, while Linemap is a bitmap font <br>that's almost a connecting script. Contamination is a dingbat font that <br>reminds me of some of the alien skeletons I've come across. And - we never <br>expected to put on sale any build-your-own bitmap-effect aristocratic <br>crest fonts, but Wappenbee certainly has a strange appeal! Read more about <br>Kenn Munk here. Total of 20 styles. <br>- <a href=\"http://www.myfonts.com/foundry/kennmunk/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/foundry/kennmunk/</a> <br>- <a href=\"http://www.myfonts.com/fonts/kennmunk/arkudius/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/kennmunk/arkudius/</a> <br>- <a href=\"http://www.myfonts.com/fonts/kennmunk/linemap/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/kennmunk/linemap/</a> <br>- <a href=\"http://www.myfonts.com/fonts/kennmunk/wappenbee/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/kennmunk/wappenbee/</a> <br> <br> <br>============================================================ <br> <br>MORE FONTS FROM OUR CURRENT FOUNDRIES <br> <br>ASTYPE. To accompany his spendid Ornaments Thanksgiving font, Andreas <br>Seidel has released the gorgeous Ornaments Wine Grape, a beautiful way to <br>decorate your pages. The font is designed to work in layers of color. <br>- <a href=\"http://www.myfonts.com/fonts/astype/ornaments-wine-grape-a/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/astype/ornaments-wine-grape-a/</a> <br> <br>BITSTREAM. Originally released in 1987, Matthew Carter's Charter <br>incorporated three important features: compact set width to give <br>economical copyfit; generous x-height to give readability at small point <br>sizes; and sturdy open letterforms to give reliable reproduction at both <br>typesetter and laser printer resolutions. The family has now been <br>comprehensively upgraded to the OpenType format and re-released as Charter <br>BT Pro. Packaged as 6 fonts (roman, italic, bold, bold italic, black, and <br>black italic), the OpenType fonts include characters originally developed <br>for expert sets, such as ligatures, ornaments, old style figures, small <br>caps, and superiors. The Pro Pack fonts support Western, Central European, <br>and Eastern European languages and, being OpenType, the same package works <br>on Windows and Mac. <br>- <a href=\"http://www.myfonts.com/fonts/bitstream/charter-bt-pro/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/bitstream/charter-bt-pro/</a> <br>- <a href=\"http://www.myfonts.com/info/opentype/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/info/opentype/</a> <br> <br>Bitstream's New Font Collection continues to grow: 10 new font families so <br>far in 2004. For a fist full of dollars, Hombre BT can be yours, and for a <br>few dollars more, you can stake a claim to Hombre Extra, which has a few <br>illustrations in it. Good, bad or ugly, whichever way you see it, just <br>saddle up and ride this pony. Robert Bell's Ecliptica BT has a Sans, a <br>Semi-Serif, a Serif and a single Cursive that can be used with any of the <br>other three styles. As an added bonus, Robert also designed a modern <br>Blackletter companion. <br>- <a href=\"http://www.myfonts.com/fonts/bitstream/hombre-bt/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/bitstream/hombre-bt/</a> <br>- <a href=\"http://www.myfonts.com/fonts/bitstream/ecliptica-bt/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/bitstream/ecliptica-bt/</a> <br>- <a href=\"http://www.myfonts.com/WhatsNew?foundryid=6&amp;startdate=20040501\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/WhatsNew?foundryid=6&amp;startdate=20040501</a> <br> <br>NICK'S FONTS has completed more wonderful retro fonts for us. Magic <br>Twanger NF is a funky narrow design that brings back the 1950s. We love <br>the retro cartoons of Kartoon Kutz NF. These charming guys, gals and <br>critters, known in the printing trade as \"midgets\", added a little extra <br>oomph to everything from business cards to matchbook covers from the 1920s <br>to the 1950s. <br>- <a href=\"http://www.myfonts.com/fonts/nicksfonts/magic-twanger-nf/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/nicksfonts/magic-twanger-nf/</a> <br>- <a href=\"http://www.myfonts.com/fonts/nicksfonts/kartoon-kutz-nf/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/nicksfonts/kartoon-kutz-nf/</a> <br>- <a href=\"http://www.myfonts.com/WhatsNew?foundryid=223&amp;startdate=20040501\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/WhatsNew?foundryid=223&amp;startdate=20040501</a> <br> <br>VIRUS. Olympukes is the pithy commentary by British designer <br>Jonathan Barnbrook and Marcus McCallion on the \"true spirit of the <br>Olympics\". It's FREE to download! <br>- <a href=\"http://www.myfonts.com/fonts/virusfonts/olympukes/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/virusfonts/olympukes/</a> <br> <br>WIESCHER DESIGN has come out with Ela, a useful new sans family. And <br>their popular script font Scriptissimo now has a bold: Scriptissimo Forte. <br>- <a href=\"http://www.myfonts.com/fonts/wiescherdesign/ela/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/wiescherdesign/ela/</a> <br>- <a href=\"http://www.myfonts.com/fonts/wiescherdesign/scriptissimo-forte/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/wiescherdesign/scriptissimo-forte/</a> <br> <br>LINOTYPE. The new TakeType 5 library is amazing value: 204 fonts at just <br>$127! The collection is organized according to the popular TakeType <br>concept with the typefaces divided into four categories: Text, Display, <br>Fun and Symbol. Find such fonts as Anasdair, a decorative blackletter by <br>Richard Yeend and Balega, a script of bold, scything strokes by Juergen <br>Weltin. Lomo is a really complete pixelfont solution of 37 styles by Fidel <br>Peugeot. He's a consultant for gadget manufacturers, so really knows his <br>stuff when it comes to tiny text! Finally here's Siseriff, a fine <br>slab-serif family in 5 weights suitable for corporate identities, by the <br>prolific Swedish designer Bo Berndal. <br>- <a href=\"http://www.myfonts.com/fonts/linotype/anasdair/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/linotype/anasdair/</a> <br>- <a href=\"http://www.myfonts.com/fonts/linotype/balega/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/linotype/balega/</a> <br>- <a href=\"http://www.myfonts.com/fonts/linotype/siseriff/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/linotype/siseriff/</a> <br>- <a href=\"http://www.myfonts.com/fonts/linotype/lomo/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/linotype/lomo/</a> <br> <br>PREUSSTYPE's Fleischmann Gotisch PT is a splendid revival of the <br>18th century blackletter of Johann Michael Fleischmann, by Ingo Preuss. <br>Ingo uses the OpenType format to help users exploit 520 glyphs of <br>typographic richness. An elegant booklet in PDF format is included. <br>- <a href=\"http://www.myfonts.com/fonts/preusstype/fleischmann-gotisch-pt/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/preusstype/fleischmann-gotisch-pt/</a> <br> <br>SOLOTYPE. Of Cabaret, Dan Solo tells us \"We've always liked Art Gothic <br>(you've seen it on the titles and credits for TV's Murder She Wrote) but <br>felt it was far too animated for most uses. Here is our super-simplified <br>version, a calmer font that will fit many display uses.\". Also check out <br>Contract Banner, Filmstar and some revivals of the typefaces of Peter <br>Behrens, the German architect and graphic artist from the early 1900s. <br>- <a href=\"http://www.myfonts.com/fonts/solotype/cabaret/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/solotype/cabaret/</a> <br>- <a href=\"http://www.myfonts.com/fonts/solotype/filmstar/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/solotype/filmstar/</a> <br> <br>TAIL SPIN STUDIO. Designers Steve and Sue Zafarana tell us of their <br>new face Rostra: \"It was during a visit to the Roman Forum that we were <br>inspired by a seemingly unique style of lettering on a tablet among the <br>ruins. The Latin message was chiseled in a condensed, free-style manner, <br>almost as if it were intended as a personal note. While the stone showed <br>only the capital letter forms of the period, we felt the creation of a <br>lowercase would help extend the font's usability and also add a whimsical <br>feel to the design.\" <br>- <a href=\"http://www.myfonts.com/fonts/tailspinstudio/rostra/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/tailspinstudio/rostra/</a> <br> <br>ELEMENO. Whiffle is a spindly narrow letterform surrounded by clouds.  <br>Express your dreams! <br>- <a href=\"http://www.myfonts.com/fonts/elemeno/whiffle/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/elemeno/whiffle/</a> <br> <br>MASTERFONT. More than 170 new Hebrew fonts. <br>- <a href=\"http://www.myfonts.com/WhatsNew?foundryid=195&amp;startdate=20040501\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/WhatsNew?foundryid=195&amp;startdate=20040501</a> <br> <br> <br>============================================================ <br> <br>RSS NEWS FEEDS <br> <br>RSS is a great method for you to keep up to date with all your favorite web sites. Thousands of participating sites - such as the BBC, Microsoft, and Apple iTunes - offer their updates in this new streamlined way. Instead of you having to check each site in turn, just open your RSS news reader and you'll be instantly alerted to what's new at all your selected sites. <br> <br>MyFonts offers two feeds: <br>- What's New at MyFonts: <a href=\"http://www.myfonts.com/rss/whatsnew.xml\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/rss/whatsnew.xml</a> <br>- Best Sellers at MyFonts: <a href=\"http://www.myfonts.com/rss/bestsellers.xml\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/rss/bestsellers.xml</a> <br> <br>Read more at the MyFonts RSS page: <br>- <a href=\"http://www.myfonts.com/info/rss-news-feed/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/info/rss-news-feed/</a> <br> <br> <br>============================================================  <br> <br>ATYPI 2004 CONFERENCE, PRAGUE <br> <br>This September 30 to October 3 the font crowd is heading to Prague in the <br>Czech Republic. Association Typographique Internationale (ATypI) has its <br>annual conference in the beautiful city of one hundred spires located in <br>the heart of the newly enlarged European Union. Over 50 speakers will hold <br>more than 40 talks and workshops - all about type design and typography. <br>The conference motto: Crossroads of Civilizations. We will be there, too! <br>Read more at the ATypI Prague 2004 official site. <br>- <a href=\"http://www.atypi.org/08_Prague/\" target=\"_blank\" class=\"link-external\">http://www.atypi.org/08_Prague/</a> <br> <br> <br>============================================================ <br> <br>REGULARS <br> <br>Check our What's New and Special Offers pages for live updates of all the <br>new fonts that go on sale, and the great promotions we run! <br>- <a href=\"http://www.myfonts.com/WhatsNew\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/WhatsNew</a> <br>- <a href=\"http://www.myfonts.com/Promotion\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/Promotion</a> <br> <br>We always like to hear of good and bad experiences you have at MyFonts. <br>Just e-mail us at &lt;<a href=\"mailto:comments@myfonts.com\">comments@myfonts.com</a>&gt; and we'll get back to you! <br> <br>In Your Face is sent out every couple of months to MyFonts users. It <br>announces every new foundry signing up with MyFonts, new fonts from <br>current foundries, and introduces all the useful and fun new features on <br>the site. <br> <br>To unsubscribe or manage your subscriptions, go here: <br>- <a href=\"http://www.myfonts.com/MailingList\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/MailingList</a> <br> <br> <br>MyFonts.com, Inc. <br>245 First Street, <br>17th floor <br>Cambridge <br>MA 02142 <br>USA <br> <br>Copyright (c) 2004 MyFonts.com, Inc.</p>"
