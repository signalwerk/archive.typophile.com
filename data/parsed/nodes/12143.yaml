    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Victor Hammer</strong></p>
    <p>Austrian, 1882--1967.</p>
    <p>Victor Hammer was a portraitist and type designer who is known to contemporary typographers for his lifelong dedication to <a href="/wiki/uncial" class="freelinking" rel="nofollow">uncial</a> script. An accomplished painter who turned to type desiign later in life, his most famous design is <a href="/wiki/American%20Uncial" class="freelinking" rel="nofollow">American Uncial</a>, perhaps the most well-known <a href="/wiki/uncial" class="freelinking" rel="nofollow">uncial</a> type in semi-common use. According to <a href="/wiki/Robert%20Bringhurst" class="freelinking" rel="nofollow">Robert Bringhurst</a>, the typeface sold today as "American Uncial" is actually another of Hammer's types, <a href="/wiki/Samson" class="freelinking" rel="nofollow">Samson</a>, and the typeface issued by <a href="/wiki/Stempel" class="freelinking" rel="nofollow">Stempel</a> as <a href="/wiki/Neue%20Hammer%20Unziale" class="freelinking" rel="nofollow">Neue Hammer Unziale</a> is in reality <a href="/wiki/American%20Uncial" class="freelinking" rel="nofollow">American Uncial</a>. It is unclear what Bringhurst's source for this assertion, found in <cite><a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Elements of Typographic Style</a></cite>, could be.</p>
    <p>Hammer shared much in common with his contemporaries, <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a> and <a href="/wiki/Paul%20Koch" class="freelinking" rel="nofollow">Paul Koch</a>, the latter of whom cut one of his uncial types. Like them, he was totally dedicated to his art and craftsmanship, and like Rudolf, he was an intensely religious man who found spirituality in his constant efforts to perfect his uncial types. Due to the influence of the <a href="/wiki/Arts%20%2526amp%3B%20Crafts" class="freelinking" rel="nofollow">Arts &amp; Crafts</a> movement, <a href="/wiki/uncial" class="freelinking" rel="nofollow">uncial</a> types saw periodic revivals throughout the <a href="/wiki/20th%20Century" class="freelinking" rel="nofollow">20th Century</a>, but none of them are as elegantly incised as Hammer's types. His typefaces include the aforementioned <a href="/wiki/Samson" class="freelinking" rel="nofollow">Samson</a>, <a href="/wiki/American%20Uncial" class="freelinking" rel="nofollow">American Uncial</a>, and <a href="/wiki/Neue%20Hammer%20Unziale" class="freelinking" rel="nofollow">Neue Hammer Unziale</a>, as well as <a href="/wiki/Andromaque" class="freelinking" rel="nofollow">Andromaque</a>, a "cursive uncial".</p>
    <p>More on Hammer can be found in <a href="/wiki/Sebastian%20Carter" class="freelinking" rel="nofollow">Sebastian Carter</a>'s <cite><a href="/wiki/20th%20Century%20Type%20Designers" class="freelinking" rel="nofollow">20th Century Type Designers</a></cite>, from which some of the facts in this entry were taken.</p>
    <p><a href="/wiki/Neue%20Hammer%20Unziale" class="freelinking" rel="nofollow">Neue Hammer Unziale</a>, <a href="/wiki/Hammer%20Unziale" class="freelinking" rel="nofollow">Hammer Unziale</a> (an older version of Neue Hammer Unziale) and <a href="/wiki/Hammerschrift" class="freelinking" rel="nofollow">Hammerschrift</a> are original <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> typefaces.</p>
