    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Victor&nbsp;Hammer</strong></p>
    <p>Austrian,&nbsp;1882–1967.</p>
    <p>Victor Hammer was a portraitist and type designer who is known to contemporary typographers for his lifelong dedication to <a href="/node/13703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uncial</a> script. An accomplished painter who turned to type desiign later in life, his most famous design is <a href="/node/add/wiki?edit%5Btitle%5D=American%20Uncial" title="Create node &quot;American Uncial&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">American Uncial</a>, perhaps the most well-known <a href="/node/13703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uncial</a> type in semi-common use. According to <a href="/node/12144" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Robert Bringhurst</a>, the typeface sold today as “American Uncial” is actually another of Hammer’s types, <a href="/node/add/wiki?edit%5Btitle%5D=Samson" title="Create node &quot;Samson&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Samson</a>, and the typeface issued by <a href="/node/add/wiki?edit%5Btitle%5D=Stempel" title="Create node &quot;Stempel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Stempel</a> as <a href="/node/add/wiki?edit%5Btitle%5D=Neue%20Hammer%20Unziale" title="Create node &quot;Neue Hammer Unziale&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Neue Hammer Unziale</a> is in reality <a href="/node/add/wiki?edit%5Btitle%5D=American%20Uncial" title="Create node &quot;American Uncial&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">American Uncial</a>. It is unclear what Bringhurst’s source for this assertion, found in <cite><a href="/node/12145" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Elements of Typographic Style</a></cite>, could&nbsp;be.</p>
    <p>Hammer shared much in common with his contemporaries, <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Paul%20Koch" title="Create node &quot;Paul Koch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Paul Koch</a>, the latter of whom cut one of his uncial types. Like them, he was totally dedicated to his art and craftsmanship, and like Rudolf, he was an intensely religious man who found spirituality in his constant efforts to perfect his uncial types. Due to the influence of the <a href="/node/add/wiki?edit%5Btitle%5D=Arts%20%26amp%3B%20Crafts" title="Create node &quot;Arts &amp;amp; Crafts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Arts <span class="amp">&amp;</span> Crafts</a> movement, <a href="/node/13703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uncial</a> types saw periodic revivals throughout the <a href="/node/add/wiki?edit%5Btitle%5D=20th%20Century" title="Create node &quot;20th Century&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">20th Century</a>, but none of them are as elegantly incised as Hammer’s types. His typefaces include the aforementioned <a href="/node/add/wiki?edit%5Btitle%5D=Samson" title="Create node &quot;Samson&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Samson</a>, <a href="/node/add/wiki?edit%5Btitle%5D=American%20Uncial" title="Create node &quot;American Uncial&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">American Uncial</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Neue%20Hammer%20Unziale" title="Create node &quot;Neue Hammer Unziale&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Neue Hammer Unziale</a>, as well as <a href="/node/add/wiki?edit%5Btitle%5D=Andromaque" title="Create node &quot;Andromaque&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Andromaque</a>, a “cursive&nbsp;uncial”.</p>
    <p>More on Hammer can be found in <a href="/node/add/wiki?edit%5Btitle%5D=Sebastian%20Carter" title="Create node &quot;Sebastian Carter&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Sebastian Carter</a>’s <cite><a href="/node/add/wiki?edit%5Btitle%5D=20th%20Century%20Type%20Designers" title="Create node &quot;20th Century Type Designers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">20th Century Type Designers</a></cite>, from which some of the facts in this entry were&nbsp;taken.</p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=Neue%20Hammer%20Unziale" title="Create node &quot;Neue Hammer Unziale&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Neue Hammer Unziale</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Hammer%20Unziale" title="Create node &quot;Hammer Unziale&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hammer Unziale</a> (an older version of Neue Hammer Unziale) and <a href="/node/add/wiki?edit%5Btitle%5D=Hammerschrift" title="Create node &quot;Hammerschrift&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hammerschrift</a> are original <a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a> typefaces.</p>
