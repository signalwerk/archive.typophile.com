      <p>I may try to load up Illustrator 8 on my Mac and run it in classic mode, if I really need to create an outlined version.  It’s my understanding that this logo was created in the early days of this company by a designer(?) that they no longer do business with. Essentially, the only version of this logo that exists at all is the one that has been kicking around their website for a while.  I have done some web work for them and I offered to create a vector version of the logo so they wouldn’t have to keep blowing up the gif file to obscene proportions every time they run a print ad, or forego using their logo entirely.</p>
      <p>My plan is to recreate the logo with a different, more viable font, and if they really NEED me to exactly duplicate the old one, go into Illustrator and hand-manipulate the outline until it looks like the old font.  I am starting with some variations on Bookman and/or Book Antiqua (sp?) that I think may serve nicely.</p>
