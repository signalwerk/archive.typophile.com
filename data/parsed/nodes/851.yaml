    html: <p>&gt;I see one I like, I buy it. <br> <br>All my typefaces can be bought as single fonts or family packages (a much better deal) at MyFonts. Most of them are not out-and-out display fonts. There is a high proportion of single-font sales. I don't believe these are necessarily to graphic designers who need one font for a logo. I would also expect professionals to buy the family. So my conclusion is that there are a fair number of "amateur" sales there, in the single font purchases. </p>
