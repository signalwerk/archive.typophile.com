    html: "<p>My first best customer still a non professional (non graphic designer at all), who bought the complete PTF collection in 2000 or so? and buy all new typefaces since. I asked to him what he doing with the fonts. He answered just that he like typefaces and buy them for his own pleasure. A real amateur in all sences. <br> <br>This experience let me conclude: <br>I don't think we can set up a clear definition on such subject, because of the web, you've got all this earth as potential customer or pirates.</p>"
