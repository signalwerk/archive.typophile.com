  votes: null
  html: "<p>A friend of mine who is not a professional in any field that you'd buy fonts for ran across my Typographica article today and said to me: <br> <br>\"I was reading your font article. I like the Snell Roundhand Script combined with Stempel Garamond Roman used in Font of the Week [on the Linotype Library web site]. I'll have to think of something to use it for. I used to buy fonts now and then for my web designs but because I lack organisation, I lose them on old hard drives.  Thus, I gave up looking. I'm afraid to start up again ... it would be just like [buying books you like even though you don't intend to read them right away]!\" <br> <br>She also said: <br>\"I consider myself the average user.  I would say the average user purchases fonts, especially if they are say in the 25+ bracket. I buy them one at a time. I see one I like, I buy it.\" <br> <br>I wonder what the ratio of people like this to font pirates is.</p>"
