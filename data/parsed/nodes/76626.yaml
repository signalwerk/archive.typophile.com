      <p>Right font, wrong cut. This is Berthold's "Standard" version vs. your sample:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/banodep_4136.png"></div><p></p>
      <p>The "difference" in the a--as well as the overall weight and sharpness--can be attributed to ink gain, either on the press or from linecast repros. Unless your purpose is out-and-out forgery, I doubt that you'll get any closer with digital type.</p>
