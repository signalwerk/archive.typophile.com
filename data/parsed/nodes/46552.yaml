      <p>I'm pretty sure it is the same typeface as FF Magda. Perhaps the original typewriter after which Magda was modelled.</p>
      <p>FWIW, the clean version of FF Magda was drawn after the rough version, so the different M on both may be a (mis)interpretation by the designer.</p>
