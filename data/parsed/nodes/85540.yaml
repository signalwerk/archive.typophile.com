      <p>I just had to do the alternate italic x. I have never especially liked the traditional double-c italic x in fat faces because it is often illegible outside of familiar words. I spotted the x in <a href="http://new.myfonts.com/fonts/bitstream/allegro/">Allegro by Hans Bohn</a> when I was reading through Mac MacGrew’s <em>American Metal Types</em> and decided to draw something similar. But then I noticed how well the double-c x worked in Matthew Carter’s Big Figgins, and that inspired me to stop being lazy and work out a double-c x that I was happy with. </p>
      <p>I did think about playing around more with the alternates, but that kind of thing can snowball out of control, especially if there are accented versions. When I researched contemporary usage of fat faces I found that designers rarely use swash caps, so I decided it was not worth the stress or time. And there are real limits to what I can do with the swash caps because the overall style of Sybarite is intentionally stiff. You can see this in the swash V, W, and Y; the ball almost seems tacked on at small sizes. To really make the swashes work Sybarite would need to be a curvy fat face with bracketed serifs. This is why the historical swash K and X did not make it into the final version.</p>
      <p><cite>Your fatface pipe (|) made me smile!</cite></p>
      <p>I try to make all the oddball characters useful in every font. Things like pipes, daggers, and pilcrows are rarely used outside of regular and bold fonts. So I exaggerate them into ornamental versions of themselves.</p>
