    <p><img src="/sites/default/files/old-images/shoggoth_gallery_5549.bw1.png"></p>
    <p>Sybarite is a fat face that works at any size. Capitals with sweeping curves and sharp unbracketed serifs command attention while charming minuscules expose the amiable side of its demeanor.</p>
    <p>Sybarite is James Puckett's revival of the fat face type that appears in the 1829 specimen of Alonzo W. Kinsley's Franklin Letter Foundry. Kinsley's was a very short-lived and unprofitable business. It opened in 1825 (some sources say 1829) and ended in 1832 upon Kinsley's death.</p>
    <p>High-contrast typefaces like Sybarite have thin hairlines that translate poorly to scalable digital type. A hairline thin enough to remain a hairline at large sizes disappears at smaller sizes. And a hairline serif drawn for small sizes turns into a slab serif at large sizes. Solving this problem requires the creation of optical weights; fonts tuned for a certain size range, just as they existed in the era of metal type.</p>
    <p>Thanks to James Montalbano, who advised on the design of the Roman during a class at the School of Visual Arts.</p>
    <p><a href="http://www.dunwichtype.com/?page_id=1623">Read and see more at ﻿﻿http://www.dunwichtype.com/?page_id=1623</a><br><a href="http://dunwichtype.com/pdfs/Sybarite_Specimen.pdf">And here is a link to the PDF specimen.</a></p>
