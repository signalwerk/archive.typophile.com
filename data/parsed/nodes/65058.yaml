    <p>Hi, im currently involved in a graphics project at uni where i have designed a typeface and now have been asked to design a type specimen poster.<br>
    When designing the typeface it was required that we link the it to a theme and I chose the title ’motion’ i explored body motion and related letters to the shapes in which the human body makes when in movement.<br>
    Its required that the type specimen poster has some sort of connection to the theme, full set of characters and a supporting typeface.<br>
    I have done a few mock ups, and would really appreciate some feedback! note, one poster is required to be printed onto A2.<br>
    Tell me they are good, average or absolutely rubbish, just please say why :)</p>
    <p>thanks</p>
