      <p>A type specimen must be well designed, of course, but it also has to serve as a reference for designers to study the letterforms and see how the typeface looks in various applications. Your posters have a lot of white space, but not a lot of type on view. It would be useful to show text paragraphs in multiple sizes. (I am, of course, a pigheaded American who had to Google A2 to find out how big that is, but now that I know, it appears the only text on your poster is about 12 pt.) I also recommend you make the text paragraphs black-on-white, which gives better contrast than color-on-color.</p>
      <p>It appears the weight of your lowercase is too heavy for the weight of your caps, but it's hard to be sure at the size on my screen. And lose the little feet on the capital <strong>I</strong>. They won't print properly except in very large sizes, and even then, they're a little precious.</p>
