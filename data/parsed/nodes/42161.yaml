    html: |-
      <p>Johnson, in <em>One Hundred Title Pages,</em> notes G.G. Trissino as being a proponent of Latin alphabet reform -- introducing the U and J to disambiguate from V and I (and also proposing "borrowing" omega to disambiguate long and short "o").</p>
      <p>However, his Wiki page doesn't mention this aspect of his career.</p>
      <p>This page is from 1529, with the types of Lodovico Vicentino.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/trissino_4193.jpg"></div><p></p>
      <p>It looks like, during the time that Trissino's reforms were making their way into general usage, printers would improvise, borrowing the "new" roman characters from Greek or Italic sorts. Or perhaps, as with a titling W, cobbling it together from a couple of Vs.</p>
