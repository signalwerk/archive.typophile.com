  html: |-
    <p>I'm searching for information on historic characters sets, that means: which characters were present at a certain time at a printers office - e.g. Hans Lufft in Wittenberg for the bible prints in the 16th century.</p>
    <p>Information in this special details (based on a printers available set) would be fine,<br>
    but even a more generic table would help, e.g.<br>
    When did a versal (capital) U join the character set besides the capital V used for "U"?</p>
    <p>I already did some research on this, but couldn't find any information online.</p>
    <p>My interest results from a special case:</p>
    <p>I'm interested in the Schwabacher which Hans Lufft used for the german bible prints between 1534 and 1545.<br>
    As far as I can see he hadn't a capital U ("rounded" form) but used everywhere capital V (as used at that time). On the other hand small u and v are present and used alternatively.<br>
    Looking on specimens I have available (e.g. Muzika, Die schöne Schrift) there isn't a capital U but "... T V W ...", but at the same time there seems to be U already in Fraktur.<br>
    In later specimens of Schwabacher U is present.</p>
    <p>So there should be any information when certain glyphs were introduced into the character set of fonts.</p>
    <p>I know an essay listing "The supply of types in the sixteenth century" by "A. F. Johnson", but it does only list the fonts a printer had available and doesn't mention nor show the character sets.</p>
    <p>Maybe someone can help me to find out more.<br>
    Thanks in advance for every hint.</p>
    <p>Michael Schlierbach</p>
