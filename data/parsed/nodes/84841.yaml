      <p><a href="http://www.fontmaster.nl/english/OTMaster_rdrct.html" rel="nofollow">DTL OTMaster</a></p>
      <p>But you should be aware that what is presented to you as metadata in font management tools is drawn from various places in the font tables. Also note that data in some table, including the name table -- which contains most of the data you are likely to want to edit --, is likely to have multiple platform encodings and possibly language-specific versions. You'll need to identify which to edit in order to affect your own system.</p>
