  html: |-
    <p>What is the easiest way to edit a set of metadata in a font? For instance, when I look at the information of a font in fontexplorer, the name/copyright/description/etc? I want to be able to easily enter data into a font, for my own purposes, such as adding the proper designer to a font that linotype/monotype/whoever has graciously stripped out.</p>
    <p>I don't want to load Fontlab or anything, I want to be able to edit the metadata similarly to how I can edit meta data of MP3 files in iTunes.</p>
    <p>Thoughts?</p>
