  html: |-
    <p>We are in a right state here.<br>
    Having just won a pitch for a Art Gallery Programme.<br>
    We used ITC Avant Garde Gothic in the material we put forward.<br>
    only to then notice a city wide advertising campaign for a nightclub!<br>
    using on type and its set in...ITC Avant Garde Gothic<br>
    Can anyone out there recommend something similar but modern.<br>
    We chose ITC Avant Garde Gothic because the new Art building is very square so the roundness of the typeface worked well against the building.</p>
    <p>please help</p>
    <p>Yours peed-off</p>
    <p>Mr Brown</p>
