  html: <p>the anime, Neon Genesis Evangelion, had some very recognizable typography design.  <br> <br>Can anyone identify the fonts used for the English characters and the Japanese? They are probably the same font, which is some kind of "Mincho" (although i'm not sure what that means, and it's close, but not identical to Hiragino Mincho Pro included with OSX). <br> <br>Thanks! there is also a bigger example <a href="http://www.gainaxpages.com/octoanime/NGE_-_Cassette_cover_4.jpg">here</a>. <br> <br><img src="http://www.typophile.com/forums/messages/83/55339.jpg" alt=""></p>
