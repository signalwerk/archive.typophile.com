  html: "<p>Hello community <br>I started this logo two days ago and it is about a studio which sets up exhibition kiosks. They do both the design and the production and are neither the small office that will be eclectic and produce high quality design, nor the big one with mass production and low costs. Actually those are their competitors, so they are trying to define themselves among them. <br>The most taugh task it's their name (which is rather difficult and long -so not clear and easily eye-catching), so my efforts focused most at this point: it has to be the most legible it can be. At this direction the most effective solution  <br>seemed to be the braking of the two consisting words of the name. <br>Also if you have to recommend a subtitle (like \"expo experts\" or smthng at this manner) would be great. <br> <br>Thanks for reading, Have a nice day. <br> <br>christos  <br> <br><img src=\"http://www.typophile.com/forums/messages/29/35775.gif\" alt=\"logo1\"></p>"
