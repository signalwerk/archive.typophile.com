    html: "<p>Color: E or D <br>Shape: C2 <br>Subtlety: I <br>Potential: C2, D or I <br> <br>I agree that this word is perhaps dependant upon reading it entirely and so to break it apart is probably not a good choice. So C2, while the most interesting shape, doesn't work (well not completely. I'm a rebel. What if ARCHI was the lighter weight typeface? Or can they overlap more or not touch?)  <br> <br>For D, I'm seeing Paula Scher (not accusing you of anything, I'm reading her book right now). What if the word never broke apart, but from use to use the bars could form different shapes? Or what if the could attach differently or even detach (such as B1)? <br> <br>I think my favorite is 'I' ... so simple. The lines could perhaps be shades of the same color, they could move. I can even see motion and vibration happening (kiosk tv display promo thingy). <br> <br> </p>"
