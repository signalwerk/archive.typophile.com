    html: <p>D is alright but don't use any of those alternatives - placing words at 90degrees for varying circumstances isin't a good strategy nor would I say breaking up the logo just to fit a panel. Changing the entire shape you'll have a hard time proving public recall - which is the point of a logo in the first place. If it was for wrapping paper fine, use angels but not when its going to be 6x2feet. <br> <br>I'm also liking B2. <br>E and I are interesting and have potential I think. <br>A I'd throw out.</p>
