    html: <p>This is interesting. Logos are something I struggle with frequently--especially when dealing with service-based companies. These concepts are very nice, but none conjure up images of kiosk development or touch screens or whatever. Should this be a concern, or is this one of those cases where "suggestion" is as far as you can go? For example, what would separate this from a structural engineering firm? Just curious of what everyone's thoughts are (especially you, Christos). <br> <br>I'm drawn to C2 and E, and I like the flexibility of D. I would imagine that the panels in version E could fold and turn to create variations as well. C2 has great "interaction." Great stuff. <br> <br>-Addison</p>
