    html: "<p>Hello everybody <br> <br>First of all thank you for the immediate feedback and the interest you all showed to the critic. <br> <br>I appologize for the delay of the response and i admit that the concept is not very clear. <br> <br>My main object -as i mentioned before-was to make this difficult name the most legible and i worked on it in this two directions: a/ to separate (subtly but clear) the two words that the name comes from and b/ to design a simple form which would work rather to support the legibility than to describe the occupation. Of cource the result has to have reference to the activity of the company but in a generic -and not descriptive- way. Now if this can happen in an intersting way (as i believe happens in C2 and H) that would be welcome.  <br> <br>Let's say the concept is immediate legibility (imagine that the main exposition of the logo will be on trucks and while in traffic the \"audience\" has to \"catch\" the name in a very short time), plus anything \"intersting\" implies setting things in a space (that's why D).  <br> <br>Also a bold solution (G) -showing that they are considerable competitor- and a sophisticated one (I) should be basic players of the team. <br> <br>Have a nice day <br> <br>christos</p>"
