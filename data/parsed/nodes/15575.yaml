      <p>I may sound <em>( too )</em> harsh again, but what about just 'slightly' customizing <em>( a, b, g, m, n, q, r, y )</em> 'Century Gothic' instead of building a 'new' custom typeface, from scratch.? :) <em>( Because the logo itself sure could be based on 'Century Gothic'.. )</em></p>
      <p>Otherwise I may add that I quite like it, but it still looks a bit uneven.. <em>( Especially where the curves 'meet' the stems.. And you are right about the 's', it may seem too narrow and it doesnt really fit in there.. )</em></p>
      <p>Dav, <a href="http://www.formlos.net" target="_blank" rel="nofollow">formlos</a></p>
