    <p>My employer recently got themselves a new logo (<a href="http://www.cimex.com/images/logo.gif" rel="nofollow">gif here</a>) and while I had no input on that (it was designed before my time here), I've been asked to design a companion display face -- for use in the company magazine etc.</p>
    <p>My first draft is attached, I'm not sure about:</p>
    <ul>
    <li>The '2' -- mainly the bowl at the top.</li>
    <li>The 's' -- apart from the fact that it looks as though it's falling backwards, I can't bring myself to make it wholly geometric (and thus very thin), but it looks flattened otherwise. Any suggestions?</li>
    </ul>
    <p>Any comments on these glyphs, or anything else about the face, would be most appreciated everybody.</p>
    <p>Thanks.</p>
