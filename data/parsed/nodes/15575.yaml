    html: |-
      <p>Well, and then there is the question of if you would want to dilute the brand by using a font for text or headlines that too similar too the logo's own face. I think that what you are on track to do is bad marketing practice. Which is a pain in the a** thing to say if that meant that I thought you should abandon your font. But I don't. I think it's a cool project. So I suggest</p>
      <p>You make a font that relates too the logo but isn't *so* close. Then it might be wonderful. But what you are making right now does seem way too close to me.</p>
      <p>It might be good for inspiration for your new font in faces which use a really round looking O. </p>
      <p>What about Mark Simonson's Proxima Nova? <a href="http://www.ms-studio.com/FontSales/proximanova.html" title="http://www.ms-studio.com/FontSales/proximanova.html">http://www.ms-studio.com/FontSales/proximanova.html</a></p>
      <p>What about a Gil Sans?</p>
      <p>Now to  be a real buzzkill: you could use the fonts I mentioned. But that would be less fun I suppose. Proxima Nova is awefully nice....</p>
