    html: |-
      <p>Thanks for the reply Dav (and 'too harsh' should not be in the vocabularly of a critic!).</p>
      <p>Why not just customise a cut of CG? Well, aside from the dubious ethics ;), mainly because I didn't want to just build a customised century gothic. I even forced myself to not look at any samples of it while designing this :)</p>
      <p>I wanted to create something with a <em>little</em> originality (and I think a number of letterforms in cimex bold -- including those you mentioned and more -- are distinct enough from CG to make this more than just a customised version of it). In addition, I'm also building a cursive (with no oblique-ing) version that I think will definitely add something unique.</p>
      <p>---</p>
      <p>I've never been entirely sure (on a technical level) what the best way of sorting out the curve--&gt;straight transition in a geometric typeface is. Any pointers would be most appreciated.</p>
      <p>And I'm still totally stumped about how to handle a geometric 's' without making it absurdly thin or too flat. I'm at the point of thinking of going for something completely radical, like a descender ...</p>
