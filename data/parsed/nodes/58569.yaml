      <p><img src="/sites/default/files/old-images/bing-logo_4373.gif"></p>
      <p>Still ugly, but I've produced a mock version that cleaned up the curves somewhat. Original above, my version below. This is really for the benefit of non-Typophiles who have trouble expressing or perceiving why the logo is ugly. Quite apart from the shapes and proportions themselves, mathematical ellipses just look bad without optical correction. The pointier ends need to be rounded a bit. It's one of the reasons why squooshing without optical adjustment yields such ugly results.</p>
