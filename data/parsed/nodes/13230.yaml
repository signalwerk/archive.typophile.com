  html: |-
    <p>The arts space <a href="http://www.tramway.org" rel="nofollow">Tramway</a> here in Glasgow is hosting a show of recent work by Barbara Kruger later this year (opens start of September I think). They'll be doing a discussion/talk type of event towards the end of the show (late Sept) and are looking for someone to speak about Kruger's practice from the point of view of graphic design (rather than from an art history point of view). The audience will most likely be artists rather than designers, so an awareness of contemporary art would be a help. There would be some kind of smallish fee and reasonable expenses (negotiable).</p>
    <p>Sorry this is vague, but that's Tramway. Anybody interested?</p>
    <p>Robert</p>
