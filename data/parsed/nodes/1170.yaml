  html: <p>The Society of Typographic Aficionados (SOTA) will bring a major exhibition of type and design to ATypI this year. TypeGallery2003 will be on display throughout the conference, at the Emily Carr Institute of Art and Design. <br> <br>TypeGallery2003 features an unjuried showcase of 75 new type designs from around the globe. The exhibition will also include Letras Latinas, a juried selection of 20 typeface designs from South America. Letras Latinas was curated for TypeCon2003 by Rub</p>
  html_clean: <p>The Society of Typographic Aficionados (SOTA) will bring a major exhibition of type and design to ATypI this year. TypeGallery2003 will be on display throughout the conference, at the Emily Carr Institute of Art and Design. <br> <br>TypeGallery2003 features an unjuried showcase of 75 new type designs from around the globe. The exhibition will also include Letras Latinas, a juried selection of 20 typeface designs from South America. Letras Latinas was curated for TypeCon2003 by Rub</p>
