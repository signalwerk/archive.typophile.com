    <p>Hey everybody !</p>
    <p>My request may sound a little awkward : I’m looking for Art Directors / Graphic Designers currently living and working in <a href="/web/20080706223418/http://www.typophile.com/wiki/London" class="wiki-create">London</a>. I’m considering moving there, and I have a few work related questions that I would like to ask to a “local”. Plz contact me at <a href="https://web.archive.org/web/20080706223418/mailto:virginie@drduckling.com">virginie@drduckling.com</a> or on skype : drduckling. Or just via <a href="https://web.archive.org/web/20080706223418/http://www.typophile.com/" title="www.typophile.com">www.typophile.com</a> if you prefer.<br>
    Thanks in advance for the sense of community !</p>
    <p>Virginie</p>
