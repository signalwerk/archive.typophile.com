  html: |-
    <p>I am happy to announce Dezen, my new release!</p>
    <p>Dezen is a contemporary, mechanical grotesque typeface. Its letters were first constructed from individual modules and then optically refined to enhance its rhythm. Its tight letter spacing and narrow proportions make the typeface particularly well suited for display sizes and headlines. When you add spacing, font can be used for shorter amount of text, bigger than 12 points.</p>
    <p>The Dezen type family consists of a wide variety of styles – solid and stencil. The Dezen Pro subfamily combines all 4 styles (Solid, Stencil 01, Stencil 02, Stencil 03) in a specific sequence, which originates a “pattern” for the alphabet (or dezen, in Slovak).</p>
    <p>Dezen Pro Regular is for free!</p>
    <p>Buying information:<br>
    <a href="http://dizajndesign.sk/index.php?category=&amp;page=fonts_dezen_buy" title="http://dizajndesign.sk/index.php?category=&amp;page=fonts_dezen_buy">http://dizajndesign.sk/index.php?category=&amp;page=fonts_dezen_buy</a></p>
    <p>Dezen pdf specimen:<br>
    <a href="http://dizajndesign.sk/subory/fonts/dezen/Dezen_specimen.pdf" title="http://dizajndesign.sk/subory/fonts/dezen/Dezen_specimen.pdf">http://dizajndesign.sk/subory/fonts/dezen/Dezen_specimen.pdf</a></p>
    <p>Enjoy!<br>
    Jan Filipek<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Dezen-590_4106.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Dezen-590-styles_6595.png"></div><br>
