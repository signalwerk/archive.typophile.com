    html: |-
      <p>BTW, alternatively to InDesign's provided expression on the "Find what:" field, you can use this one: <code>(\d{3})-(\d{3})-(\d{4})</code></p>
      <p>I think this one is more intuitive* and does exactly(?) what you want. Translating it to English it means:<br>
      — Find a group of 3 digits;<br>
      — followed by a hyphen;<br>
      — followed by another group of 3 digits;<br>
      — followed by a hyphen;<br>
      — followed by group of 4 digits.</p>
      <p>Then the expression in the field "Change to" means:<br>
      — What was found in group 1;<br>
      — follow it by a period;<br>
      — follow it by what was found in group 2;<br>
      — follow it by a period;<br>
      — follow it by what was found in group 3.</p>
      <p>Simple, eh? ;^)</p>
      <p>* The expression that comes with InDesign will match more cases, though; it will find and replace occurrences that have a hyphen, a period, a space, or nothing, between the groups of digits.</p>
