      <p>As far as I've seen, all the US phone numbers follow the format 3-3-4, but what if that's not always true? Then you can use this expression: <code>(\d+)-(\d+)-(\d+)</code></p>
      <p>The plus sign (+) means "Find one or more of the previous". So in this case it's matching one or more digits.</p>
      <p>(I'll stop now :^)</p>
