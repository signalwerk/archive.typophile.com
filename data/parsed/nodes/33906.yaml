    <p>So, we've gotten our upgrade to CS3 and there are many improvements.</p>
    <p>However, one thing I was looking forward to in the new ID find/change doesn't seem to behave as the manual advertises.</p>
    <p>I am using the great new grep tool to find situational changes - in this case, a hyphen between numerals, so that I can change the telephone numbers' style to period-separation. So far, so good.</p>
    <p>If I then make the change to period, the found numerals surrounding the hyphen are changed too. Not so good. Manual says to insert the found text variables there, which is basically a stop-change order; I try that, and the actual "found text" string, automatically inserted by the program, is inserted into the text ($01, $02, etc). Not so good either.</p>
    <p>If anyone here can guide me as to how to correctly use this tool, I would be much obliged. An illustration is included so that you can see my mistake.</p>
