    <p>I'm in my third year Graphic Design at the Royal Academy of Art (the Hague) where we also get lessons in constructing typefaces. This year we had to make our first complete typeface (capitals, lowercase and limited interpunction)<br>
    I already have all the capitals and lowercase characters on paper, but I just recently started to digitize them. Haven't gotten very far yet, but I was curious about your opinions, so I'll just post what I've got so far.</p>
    <p>I'll post more when I've got some</p>
    <p>-- Update --</p>
    <p>I replaced the image with a PDF containing all caps except for the T,Z and Y. I didn't pay d=that much attention to the spacing so please forgive me of it's crooked.</p>
    <p>-- Update --</p>
    <p>Ok, new update. </p>
    <p>I've digitized all my characters. Only the capital T and lowercase F are missing. Had some second thoughts about those. The new file is Quick.pdf</p>
