      <p>The round forms have an awkwardness to them. The curves are not a fluid as they could be. The proportions of the uppercase appear random and should be attended to. THe N is too wide the K too narrow, the H does not appear to function as an H. The weights are oddly place and the tops seem too heavy to me.</p>
      <p>The lowercase is more successful although the m and n appear too wide. The word space is enormous.</p>
