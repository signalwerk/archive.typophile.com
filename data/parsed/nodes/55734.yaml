    html: |-
      <p>Thanx for the comments. I can see what you mean with the O. It get's a bit messy maybe.<br>
      When I started this typeface I had a couple of rules wich I based all the characters on. The most important one was that I wanted all characters to look like they could be drawn in one fluent motion with just one line without the line crossing itself.<br>
      Obviously I had to make a few concessions. But maybe I have to make a few more. The capital and lowercase 'T' don't work with my concept in mind (which you'll see soon hopefully).</p>
      <p>I'll try levelling the bar on the H a bit so it doesn't look as much like a mirrored N. Also agree that the X K could use a tiny bit more contrast.</p>
    html_clean: |-
