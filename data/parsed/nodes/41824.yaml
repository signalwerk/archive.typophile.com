    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 7.Feb.2008 2.01pm </div>
      <p>Seriously,</p>
    <p>When ink gets pushed deep into the fibers of paper, as is the case with letterpress printing, it unlocks up to three ounces of a special pheromone called REALNESS. Once you breath in the REALNESS, you can’t help but caress the paper with eyes and fingers alike and suddenly, oh god, you think about the people who actually printed the thing, by hand. Mixing inks, carefully feeding paper, checking each print.THE REALNESS, you gasp. THE REALNESS! </p>
    <p>So what is this? Huh? Some arts and crafts William Morris Olde Tyme Printerie kind of hippie bulls**t? No way! It’s THE REALNESS! </p>
    <p>* * scene * *</p>
    <p>The work I did while illustrator-in-residence at Pantry Press is now up for sale. I made drawings, they printed them. It was holy. </p>
    <p>Check it all out at: <a href="http://www.etsy.com/shop.php?user_id=5587410" title="http://www.etsy.com/shop.php?user_id=5587410">http://www.etsy.com/shop.php?user_id=5587410</a></p>
    <p>There are prints, pattern posters, coasters and notecards, and most of them use the overprinting of two colours to nice effect, making a third colour. They’re practically soaked in REALNESS. They just reek of it.   </p>
    <p>So please, take a look, and buy something, if you like what you see. Or if you have a blog, give us a shout out! That’d be nice.  </p>
    <p>Oh, and here’s some more info on the whole residency:</p>
    <p>-  A diary of the first five days, in The National Post. Wraps up tomorrow. I totally sound like an crybaby.<br>
    Do a search for Ray Fenwick at the following url:<br>
    <a href="http://digital.nationalpost.com/epaper/viewer.aspx" title="http://digital.nationalpost.com/epaper/viewer.aspx">http://digital.nationalpost.com/epaper/viewer.aspx</a></p>
    <p>- Christian talks about the process<br>
    <a href="http://inkinourveins.blogspot.com/2008/02/few-words-about-process.html" title="http://inkinourveins.blogspot.com/2008/02/few-words-about-process.html">http://inkinourveins.blogspot.com/2008/02/few-words-about-process.html</a></p>
    <p>Thanks as always! </p>
    <p>Yours in REALNESS,<br>
    Ray</p>
