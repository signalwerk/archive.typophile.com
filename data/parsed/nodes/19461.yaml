    <p>Does anyone recognize this? I’ve been looking for a font that has the presence of Foundry’s Gridnik without the hard angles. I’m a magazine art director and my editors absolutely hate Gridnik and fonts like it. I’m curious about this one and am open to any other suggestions.  Thanks in advance!</p>
