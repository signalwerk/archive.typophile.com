  - id: 97721
    user_id: 1043
    user_name: Mark Simonson
    user_path: null
    date_raw: 29 Nov 2005 — 12:33pm
    date: 2005-11-29T12:33:00
    votes: null
    html: "<p>I think I found the other one, too: If you have a copy of the book <em>Alphabets &amp; Other Signs,</em> edited by Julian Rothenstein and Mel Gooding, check out the constructed alphabet on page 105 made from brass rules. Except for the v and a small modification on the first a, it's a very good match.</p>"
