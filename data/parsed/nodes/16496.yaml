    html: |-
      <p>According to the author of the logo:</p>
      <p>“The logotype is custom and was inspired by two typefaces. The letterforms in Avalon are based on sketches that Paul Renner did for an alternate version of Futura. Hotel is set in Japan Script which was digitized from the Solotype archive.”</p>
      <p>So it's not my Kg Stuttgart :)</p>
