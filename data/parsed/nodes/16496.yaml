    date: 2005-11-29T16:02:00
    votes: null
    html: "<p>\"ABZ: More Alphabets &amp; Other Signs,\" by the same authors, is one of my favorite type books. My fantasy career as a type designer often starts with that constructed alphabet as a training exercise. Then I knock out a few of the modular faces Leslie Cabarga illustrates in his \"Logo, Font &amp; Lettering Bible\" right as a wave of early '90s nostalgia crests, which I ride to fame and riches. ;)</p>"
