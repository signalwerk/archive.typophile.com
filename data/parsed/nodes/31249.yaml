    <p>Hi</p>
    <p>I’m running the new dual intel G5 with Creative Suite 2 (version 4.04), with 2Gb of ram. I’m experiencing regular crashes, when I go to export, print, click on the gradient box, select different tools etc. By process of elimination I’ve worked out that the font Optima (given a clean bill of health by Font Doctor) is causing crashes. In all probability other fonts are causing problems as well.</p>
    <p>Has anyone experience the same problems? And is there a fix??</p>
    <p>We’re considering buying in the adobe font library and deleting all our fonts but it’s not certain to fix the problem?</p>
    <p>Can anyone help?</p>
    <p>Also I can’t seem to post this on the adobe site, even though I’m registered - I’m denied access. Could someone explain how I post? or do it for me??</p>
    <p>Thanks for any help on this matter.</p>
