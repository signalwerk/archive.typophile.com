      <p>I ran into similar issues recently with a TT font that checked out and worked fine everywhere else, but Indesign was listing it with the Chinese fonts and crashed any time I tried to print. Even though it checked out fine I’m pretty sure that this was actually font corruption as it was from a collection of six TT fonts and was the only one of the six causing the problem. </p>
      <p>Try nuking the OS install and start over, this time managing fonts from a software-created library and only load what you need for projects you’re using. If it keeps happening, it could be that your fonts are just old and cruddy and you’ll have to buy them again. But this time make a backup disc and keep the original where it can’t get lost!</p>
