      <p>“A <a href="/wiki/hybrid%252Bfont" class="wiki-create">hybrid font</a> is a font program that contains two sets of outlines. One set of outlines is chosen according to the resolution of the device on which the font is being used. Hybrid font programs are typically used for typeface designs with subtle curves that are beyond the Flex mechanism’s capabilities. At high resolutions a set of outlines with full fidelity to the design is used; at low resolutions a set of outlines with straighter edges is used. An example of a hybrid font program in the Adobe Type Library is Optima.”</p>
      <p>In <a href="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF">Adobe Type 1 Font Format</a> (PDF file)</p>
