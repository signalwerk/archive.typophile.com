      <p>I’ve also had problems using Optima with CS and CS2 as well. Frequently, the file looks fine as an .indd, but when I export it as a pdf, I get gibberish where the Optima was. The only solution I’ve found so far is to make sure I’m only running one flavour — either T1 or TT, doesn’t matter which, although TT is easier — and not try to mix them.</p>
      <p>(On the flip side, I’ve been having strangeness with Futura and Word 2004 Mac: when double-clicking a Word document and Word firing up, I get a message that Futura is corrupt and that I need to disable it. Then Word promptly hangs, and I can’t delete the offending document because it is “busy” — even though I have no applications open.  </p>
      <p>Rebooting lets me drop-open the Word doc with TextEdit, but there are a few things, such as documents from clients, for example that I really do want to fire up Word with.</p>
      <p>Thoughts?)</p>
