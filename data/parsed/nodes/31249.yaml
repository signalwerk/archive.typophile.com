      <p>I found this in the new InDesign Mag trial issue, I wonder if it might help with this problem, too.</p>
      <p> InDesign Fonts Folder<br>
      Can’t get a troublesome font to load properly on your system and appear in the InDesign font menu? Don’t panic. Try placing the problem font in the InDesign Fonts folder, located in the InDesign CS2 application folder. Any fonts in this folder are managed from within InDesign rather than from an outside application or through the operating system. Fonts that don’t load properly through the operating system (such as multiple master fonts or Windows fonts on an OS X system) may work in InDesign if you put them in the application Fonts folder.—Ted Locascio</p>
