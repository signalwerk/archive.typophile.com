      <p>Since I’ve got a client about to drop a 30-page Word document on me, I spent a good part of last evening messing around with it — my first boot attempt got me the “(font name) is corrupt and you should turn it off” for probably 85% of the fonts I have loaded.  (At least it booted up this time, which was an improvement.) Clicking OK turned them off: well, that’s not a reasonable option!</p>
      <p>Just for laughs, I ran the most recent update for Office 2004.</p>
      <p>Turned the fonts all back on, tried opening Word again.  Got the message again, and did a Cmd-. so it skipped to the next font.  Only had to do it for maybe ten fonts, and then it opened properly, with all my fonts listed, but not in their style.  OK, that’s a compromise I can live with.</p>
