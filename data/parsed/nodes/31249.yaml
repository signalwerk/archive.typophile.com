      <p>Just to make sure all your options are listed — some foundries, such as Adobe, permit you, the end user, to make an OpenType version of an older Type 1 or TT font.</p>
      <p>I don’t particularly recommend you do this. If your time is worth anything, it would likely be cheaper to re-purchase the fonts. And to do such a conversion, you need some software. Trans-Type or FontLab cost some money, but can make the process easier, once you figure them out.</p>
      <p>As a for-instance, I had long ago made database fonts of all out Type 1 fonts — we ran TeX out of a DOS-box, and could encode fonts on the fly. I often had more glyphs in a font than are available in the “new” OpenType versions, so repackaging them in an OpenType wrapper saves both money and time. This is an odd situation, &amp; if something similar isn’t at play (or your time is worth nothing), better to rebuy.</p>
    html_clean: |-
