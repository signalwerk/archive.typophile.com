      <p>Craig, only in the old school sense of someone free-handing the look of one. We are so spoiled today with a pop-up menu containing 1000 fonts that we forget what the world was like in the 19th century when the technology used to make the above door signs came about. Everything was done by hand and reproduced with crude molds.</p>
      <p>ChrisL</p>
