      <p>BTW, have you contacted Mark Caneso? You might try to convince him to sell you a “beta” version of Fovea. You could pay full price but be entitled to the final version upon completion. And Mark might appreciate the feedback from real-world usage, which would help improve the final product. I’ve actually done this myself as a type designer.</p>
      <p>hhp</p>
