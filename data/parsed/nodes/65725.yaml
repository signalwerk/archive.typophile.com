      <p>It’s an odd mix of many different things so it’s tough to find recommendation for you. It will help of you tell us more about what you like in Fovea.</p>
      <p>Some of its serifs are like those mentioned above, but it’s skeleton is more <a href="http://www.fontshop.com/fonts/singles/fontfont/ff_milo_serif_ot_medium/">FF Milo</a>.</p>
