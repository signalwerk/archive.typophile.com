    html: <p>FF Milo is nice Stephen but the x height seems really tall (maybe it’s just me, but the caps seem really small when paired with lower case letters, i guess for legibility?), I guess it’s hard for me to pinpoint exactly what i like about Fovea. Let me think about it i guess. Thanks for the help!!!</p>
