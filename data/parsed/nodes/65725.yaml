    <p>Hey everyone,</p>
    <p>I was just wondering if anyone could possibly suggest a typeface similar to this one...</p>
    <p>It’s a typefaqce called PS Fovea by a designer named Mark Caneso, and it isn’t released yet so I thought I would see if anyone had any suggestions on some similar fonts that are currently available.</p>
    <p>thanks!</p>
    <p>josh</p>
