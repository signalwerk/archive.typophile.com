    <p>Hi everyone,</p>
    <p>This is my first post and I hope it's in the right place. I am trying to identify the typefaces used in "The Sun" (NYC: 1835-196), the daily newspaper in which "Yes Virginia there is a Santa Claus" first appeared in 1897. I am specifically looking for the body and headlines....school project here at <a class="freelinking external" href="http://www.cca.edu" rel="nofollow">California College of the Arts</a>.</p>
    <p>Here is an example a standard page, as preserved by Chronicling America:<br>
    <a class="freelinking external" href="http://chroniclingamerica.loc.gov/lccn/sn83030272/1904-11-27/ed-1/seq-23.pdf" rel="nofollow">http://chroniclingamerica.loc.gov/lccn/sn83030272/1904-11-27/ed-1/seq-23.pdf</a></p>
    <p>An explanatory article of the "new" Sun's typography<br>
    <a class="freelinking external" href="http://www.themorningnews.org/archives/new_york_new_york/typography_in_the_sun.php" rel="nofollow">http://www.themorningnews.org/archives/new_york_new_york/typography_in_the_sun.php</a></p>
    <p>And the wiki article about the paper:<br>
    <a class="freelinking external" href="http://en.wikipedia.org/wiki/The_Sun_(New_York)" rel="nofollow">http://en.wikipedia.org/wiki/The_Sun_(New_York)</a></p>
    <p>The body text to be close to Bookman Oldstyle or even Clarendon, but I am TOTALLY stumped on the headlines.</p>
    <p>Thanks everyone!<br>
    Max</p>
