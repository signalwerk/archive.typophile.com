    html: <p>The large headline and subhead are cuts of Caslon. The middle headline is Encore and the bottom headline is Laureate. These are old metal typefaces and I don't know if there are digital versions. I can't tell what the body text face is, but it's some sort of newspaper face (something like Ionic, but older).</p>
