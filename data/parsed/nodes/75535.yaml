      <p>All books I designed and/or set up to now were unjustified, is that something so exceptional?<br>
      Most important: what language will it be set it? Cos in German you really have to work on good (and generous) hyphenation whereas in English some suggest to rather not have any at all.<br>
      Second most importantly: mind the paragraph composer or Indesign in general. Good for fast graphic design, but if you have a clear idea of how you want your lines to break and hyphenation it drives you nuts.<br>
      Well, don't get me started—I am very passionate about »Umbruch machen«, line breaks, hyphenation, avoidance of »staircases« and other unintended forms of your »Satzkante« (seems we should move this discussion to a German speaking playground, I am missing the important English terms).</p>
