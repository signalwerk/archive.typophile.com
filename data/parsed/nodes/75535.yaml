      <p><em>is that something so exceptional?</em></p>
      <p>It seems so. Hans Andree calls justified text ‘the last relic of Gutenberg’; see his article in <a href="http://www.his-online.de/zeitschrift/lieferbare-ausgaben/detailseite0/publikationen/mittelweg-36-32002.html?sms_his_publikationen%5BbackPID%5D=21&amp;cHash=4529cd79cb" rel="nofollow">Mittelweg 36, 3/2002</a> [German].</p>
      <p><em>single-line-composer, though even he won't do what you want</em><br>
      Of course, something that doesn’t do what you want <em>has</em> to be male! ;-)</p>
      <p>FWIW:<br>
      In German, <em>rivers</em> are <em> Gießbäche/Gießbächlein</em> [streamlets] or, more commonly, <em>Gassen</em> [alleyways]<br>
      <em>Satzkante</em> is the <em>(optical) margin</em>, <em>den Umbruch machen</em> is <em>making-up (the type/text) into pages</em>.</p>
