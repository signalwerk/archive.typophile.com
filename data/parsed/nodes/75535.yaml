      <p>And, yes, it will be German. Actually Swiss orthography (which probably means extra caution about the «li»! :-). I'm quite into working on a nice rag too (just haven't done it in <em>books</em>, where I am extra-wondering about things like the see-through effect, and extra-worrying that it has to look really nice). I like it to «oscillate» nicely (and I would back an introduction of certain German terms into English! Like «Flattersatz»). BTW, I do expect this will probably take more time than setting nice justified text.</p>
