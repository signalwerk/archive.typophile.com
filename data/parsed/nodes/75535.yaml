    <p>It looks like I have a little book coming up, at least parts of which I will be able to set unjustified (flush left, ragged right). That does make sense from the context of what it is; the texts it concerns are short, one to max four pages, interspersed with poetry too; and it's a small book where we're deliberately taking a few liberties with the layout.</p>
    <p>So now I'm on the lookout for examples of books where such a setting was solved successfully. There are some potential pitfalls to this (and surely more than I can anticipate now, too), so I'd like to study how others have solved this <em>en détail</em>. So if you can think of good examples for this, I'd be grateful for pointers! I'm preferably looking for recommendations of books that would be accessible via libraries etc., so I could see things like the show-through effect [which was briefly touched upon in <a href="http://typophile.com/node/75096" rel="nofollow">this previous discussion</a>] in action.<br>
    Thanks.</p>
