      <p>Being a Swiss national, I am sure you have already seen the many Swiss books published by the likes of Niggly in Europe during the big modernist heyday and even older MIT Press books on design and architecture.  I don't know of any novels in that arena but many, what we call in America, "coffee table books". Of course the Dutch have a bunch in the typography vein including Unger's "While you Were Reading", Middendorp's  "Dutch Type",  and Smeijers "Counterpunch".</p>
      <p>I tend to read non-fiction mostly so I rarely see a never setting these days.</p>
