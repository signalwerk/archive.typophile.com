      <p>Not sure whether the “staircases” I meant are called rivers in English (we call accumulating huge word spaces in justified text rivers, or rather creeks). I was referring to the form of the ragged right edge. I like to avoid any kind of strange, distracting shapes forming there, like staircases, triangle, holes and peaks etc. </p>
      <p>Also try toprevent small words, or hyphenated parts from falling down at the end of a line. If there is no word under it in the line below, take it down into the next one. Best work with non-breaking word spaces here so that the line break vanishes when the text shall flows differently after a correction or something. Better not hyphenate after or before just two letters, at least not automatically. You can add those manually at places where you need them to elude a big hole.<br>
      And last not least my favourite: avoid what (I think) Hochuli once called the swiss-erization of set text—hyphenation after ...li-</p>
