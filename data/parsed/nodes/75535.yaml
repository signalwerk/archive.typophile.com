      <p>Absolutely no worries, Nina. It doesn't take more time, nor do you have to be concerned about see-through issues unless you have really thin paper (what you probably won't have in a novel or the like). Just make sure you set the text registerhaltig (see, another one ... maybe I should switch to English in my layout programs to teach me) and that there isn't a major Flatterzone. If you want to have like a 10 mm margin left and right you should set the ragging right one to a smaller measure to optically fit. But it depends on how good you succeed in making the edge harmonious and even.</p>
      <p>But, to save time, you should work with automated hyphenation switched on (take care of the settings!) and yes, single-line-composer, though even he won't do what you want in many annoying instances. Then go along the edge and check the hyphenations and manually adjust for better breaks (no hard hyphens), undo unpleasant ones, wrap small words or parts to the next line etc.<br>
      Working manually is possible also, but really time consuming for longer text, and you have to read a good part of it to hyphenate appropriately.</p>
