      <p>Well, the margin thing depends on how big they are in general and how much you adjust them. It's more for the optical evening out so you shouldn't have whole words hanging over. But otherwise the hard line from the other side could look quite far away. I just do it like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/margins_5658.png"></div><p></p>
      <p>Still I don't think this is going to me a major issue, the paper won't be that thin. Also people are used to see things shine through a bit from the other side, they won't hate the book just because of that. Not meeting the baseline grid is far far more disturbing.<br>
      And keep in mind that the printer still can spoil every noch so carefully thought out positioning :)</p>
      <p>((Ah, books: Well, I did a lot of text-heavy books for Rowohlt et al you don't want to know about (baby care, popular science, lifestyle crap, sports, song books :) It's hard to come up with some titles—the architecture books and artist catalogues I do don't really have long columns of text, Helvetica Forever I didn't typeset and my type-book has an asymmetric layout, the Puutikkala book will be impossible to find for you, so will be Dein Land macht Kunst and Decorum I’m afraid.))</p>
