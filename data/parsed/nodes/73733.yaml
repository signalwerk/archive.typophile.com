  html: |-
    <p>I am looking for some assistance in building a list of brands.  This will be an A-Z list of brands but the kicker is that the type face for each brand needs to be a known type face and the idea is to have as compelling of a brand and type face as possible.<br>
    I am starting the list with</p>
    <p>A - American Airlines - Helvetica</p>
    <p>I have created a google spreadsheet that I am keeping the list on and have left the privileges open in case anyone is so inclined to add directly to the spread sheet.</p>
    <p><a href="http://bit.ly/b2ViK2" title="http://bit.ly/b2ViK2">http://bit.ly/b2ViK2</a></p>
