      <p>I worry that your subheads ("UNDERSTANDING THE CONSUMER" and "CREATING DEMAND" are pulling too much attention from the start of the text... my eye goes to the second column first. The All caps first line just looks like a weak attempt to distract me at that point. </p>
      <p>Could you possibly put all this text in one column? Maybe reduce the subheads' size?</p>
