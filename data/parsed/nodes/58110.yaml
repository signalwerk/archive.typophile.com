    <p>Hi,</p>
    <p>I'm in my fourth and final year of my design degree and currently working on my graduation project.</p>
    <p>I'm won't bore you with all the details of the whole project*, but at this point I'm creating an A5 product guide for The Consumer™ (that ubiquitous and equally mysterious individual that we are always hearing about). The final product will be mostly viewed as a PDF document on a website, with a limited run of printed copies.</p>
    <p>I have all my content and images sorted and now I'm trying to get grid and type choices right:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Post4_12_5331.jpg"></div><p></p>
    <p>Because of work already completed, the headings must be in ChaletComprime CologneSixty (House), but the rest can be changed..</p>
    <p>Would love some criticism, suggestion, etc,</p>
    <p>Cheers</p>
    <p>Dan Flan</p>
    <p>*If you are really keen to learn said details, I have been running a blog (<a class="freelinking external" href="http://danflan.com.au/madisonave" rel="nofollow">http://danflan.com.au/madisonave</a>) to track the progress of the project which has everything on it—feedback on the work posted there would also be greatly appreciated</p>
