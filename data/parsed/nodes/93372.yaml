    <p>**  Original Post **</p>
    <p>Hey all,</p>
    <p>I'm trying to figure out the font that was used on my United States Military Academy t-shirt, printed in 1998.</p>
    <p>I know that the t-shirt comes from Unicor.gov, a federal clothing and textile factory used to rehabilitate inmates.</p>
    <p>The shirt is pretty old, and has been washed a bunch... </p>
    <p>Please help!</p>
    <p>Derek</p>
