      <p>I think that architecture firm needs more robust/stable/technical logo. Their current logo is nice, stable, square, firm...</p>
      <p>To me 2B and 1A seem the most promising. Especially 2B. 1A has too strong an emphasized  type and should be loosened a bit. While changing type to normal weight, you could also widen character spacing when using all caps. It could make it even more "posh", because you can afford space. Anyway. I don't think too organic logos will be well accepted by your strictly technical clients.</p>
