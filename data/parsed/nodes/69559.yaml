    html: |-
      <p>Thank you all for your input. I definitely think I have too many options on the table because even in 5 responses there is direct opposite views, but I guess that's what makes design so interesting, it's all in the eye of the beholder. </p>
      <p>penn &amp; ink, thank you for the directness of what you thought about the mark in 1/1a/1b. Their company tag line is "Imagine. Create. Live." The 3 petals or leaflets were meant to represent each of these in the case that they want to use the mark/icon with just the tag line. Sometimes I find myself getting too caught up in satisfying these types of things and then when all is said and done I stand back and look at the logo and think "what the hell was I thinking?" </p>
      <p>As for the client's eye, they are attracted to the horizontal layout of the text in 2b but think "Landscape Architects" is too long to be sharing a single line with "southwick". They also feel like that text arrangement is all too common among architects as well. While they like the horizontal feel in 2b they also dislike the icon in 2b the most of any. They feel it looks like something that represents a hotel/resort or would be found on a complimentary bar of soap...haha, I can't argue that!</p>
      <p>They are most attracted to the idea of Agave1c but aren't sold on stacking "landscape" over "architects" on one side like that. They also have concerns about the square fighting for attention with the free flow of the agave plant. Here are some other options on Agave1c that may help resolve those issues.</p><div class="imageWrap"><img src="http://typophile.com/files/Agave1c-rnd2_6303.gif"></div><p></p>
    html_clean: |-
