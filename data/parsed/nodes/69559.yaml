    <p>Background - I usually don't have this kind of difficulty coming up with concepts but I have a client that has given a lot of things to deal with on this one. This is a re-brand of an architecture firm that has a current logo that they are not happy with for a number of reasons:</p>
    <p>1. Their current logo is outdated and they are finding themselves bound to the "square" in all uses and many times it leaves the company name too small to even be legible. They find that they often blow the "square" up so large it is ridiculous just to see the company name.</p>
    <p>2. They would like carry over some element of the current logo to make it identifiable.</p>
    <p>3. They are hesitant to introduce a plant or leaf because they don't want to be mistaken for a landscape contractor and fear the line is thin to slip into something not professional enough. They are willing to explore a plant element if it is "artistic" or "architectural" in nature (their words).</p>
    <p>4. Since they are in the design industry they probably could design their own logo like many architects do so they are going to be more particular</p>
    <p>5. They would like an icon as part of their new logo, something they can use in presentation material or as a watermark</p>
    <p>So you can see that the creative box is a bit smaller than usual and I am going nuts with this one. Any comments or direction is greatly appreciated! Here are some initial quick concepts:</p>
