      <p>Some ideas that comes to mind.<br>
      Type: maybe something a bit more geometric could help.<br>
      When I think of "landscape", I think something mostly horizontal with some vertical elements. Their original logo is too vertical.<br>
      They should give you some visuals of their work you could use as inspiration.<br>
      If you rotate the k in your last attempt (Box1c) 90° counterclockwise, you have an horizontal landscape with a very abstract (dare I say, architectural) tree in it.</p>
