  - id: 63121
    user: 2942
    date: 2005-04-01T23:20:00
    date_raw: 1 Apr 2005 — 11:20pm
    votes: null
    html: <p>Ricardo, <br> <br>Thanks for the feedback! <br> <br>I will think about the M. It is sort of the odd one out now.  <br> <br>There is a new V. It has a spike at the bottom. The new V is how they have it at the pool. I still like the 2 old ones but they are not as good &amp; the 1st one doesn't fit in this font.  <br> <br>For a while guess I thought I would try some trajan/myriad style in some of the caps to try to make the Officer style more roman &amp; less boringly military - if that makes sense. If I had gone whole hog I would have needed a more circular O. :-) <br> <br>But I don't think it worked &amp; I don't think you did either so...  <br> <br>About modularity. I have been trying to avoid an overly modular look in the font. Alot of my interest in bitmapped &amp; other particle based fonts has to do with the eccentric ways that characters are made when they are forced into limited circumstances. I think the *really* modular looking stuff just seems lazy/boring looking. It's when you try to make something that is more readable &amp; break the regularity a bit that things get interesting. I was looking a really quirky 7 today on a parking ticket. It isn't that I think this stuff is really *fine* type either. I just like it. The vibe is interesting to me. Don't know why. <br> <br>In the meantime I have been rounding the edges of the squares - like the tiles. Now I have to decide whether to leave all the parts rounded or to make the cuts as sharp as they are at the pool. Probably the later.  <br> <br>And there are 2-3 other things &amp; then I think I will release this. <br> <br>I'll post what I have in another day or two. <br> <br>Regarding the A &amp; the V - I don't think it is a good idea for them to mirror each other in this case. The counter of the A gets too small. Especially now that the V has the spike. <br> <br>Now that I look at it I think I have a new idea for the Z to bring it into line. This soulution is inelegant but I hadn't seen another way. <br> <br>The N is asymetical but I actually hate the one at the pool. Too bone headed even for this font. I think this one is okay. <br> <br>Maybe I'll make a font of altrenates too. A set where the angled glyphs are boxy instead - I think the enlisted will be more like a bitmap &amp; no cuts. <br> <br>I'll post stuff Monday I think.</p>
    html_clean: <p>Ricardo, <br> <br>Thanks for the feedback! <br> <br>I will think about the M. It is sort of the odd one out now.  <br> <br>There is a new V. It has a spike at the bottom. The new V is how they have it at the pool. I still like the 2 old ones but they are not as good &amp; the 1st one doesn't fit in this font.  <br> <br>For a while guess I thought I would try some trajan/myriad style in some of the caps to try to make the Officer style more roman &amp; less boringly military - if that makes sense. If I had gone whole hog I would have needed a more circular O. :-) <br> <br>But I don't think it worked &amp; I don't think you did either so...  <br> <br>About modularity. I have been trying to avoid an overly modular look in the font. Alot of my interest in bitmapped &amp; other particle based fonts has to do with the eccentric ways that characters are made when they are forced into limited circumstances. I think the *really* modular looking stuff just seems lazy/boring looking. It's when you try to make something that is more readable &amp; break the regularity a bit that things get interesting. I was looking a really quirky 7 today on a parking ticket. It isn't that I think this stuff is really *fine* type either. I just like it. The vibe is interesting to me. Don't know why. <br> <br>In the meantime I have been rounding the edges of the squares - like the tiles. Now I have to decide whether to leave all the parts rounded or to make the cuts as sharp as they are at the pool. Probably the later.  <br> <br>And there are 2-3 other things &amp; then I think I will release this. <br> <br>I'll post what I have in another day or two. <br> <br>Regarding the A &amp; the V - I don't think it is a good idea for them to mirror each other in this case. The counter of the A gets too small. Especially now that the V has the spike. <br> <br>Now that I look at it I think I have a new idea for the Z to bring it into line. This soulution is inelegant but I hadn't seen another way. <br> <br>The N is asymetical but I actually hate the one at the pool. Too bone headed even for this font. I think this one is okay. <br> <br>Maybe I'll make a font of altrenates too. A set where the angled glyphs are boxy instead - I think the enlisted will be more like a bitmap &amp; no cuts. <br> <br>I'll post stuff Monday I think.</p>
