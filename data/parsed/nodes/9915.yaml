    html: "<p>Hi, Eben. <br> <br>Maybe I am missing something, but I am wondering: what is the idea behind your font? It seems as if some of your characters are part of a modular idea, in which you use a minimum of modules (i.e., a square and a triangle derived from that square) to create a set of characters, all of this with an underlying grid to enforce some consistency. Examples of this are your lower case <b>o</b> and <b>n</b>. But with other characters it seems as if you are adapting your modules to the shape of the letter, instead of the other way around. Your upper case <b>V</b> is an example of this: lots of differently-shaped triangle modules. <br> <br>I know you hint at a stricter enforcement of a modular structure in your proposed </p>"
    html_clean: "<p>Hi, Eben. <br> <br>Maybe I am missing something, but I am wondering: what is the idea behind your font? It seems as if some of your characters are part of a modular idea, in which you use a minimum of modules (i.e., a square and a triangle derived from that square) to create a set of characters, all of this with an underlying grid to enforce some consistency. Examples of this are your lower case <b>o</b> and <b>n</b>. But with other characters it seems as if you are adapting your modules to the shape of the letter, instead of the other way around. Your upper case <b>V</b> is an example of this: lots of differently-shaped triangle modules. <br> <br>I know you hint at a stricter enforcement of a modular structure in your proposed </p>"
  - id: 63113
    user: 2942
    date: 2005-03-25T18:49:00
    date_raw: 25 Mar 2005 — 6:49pm
    votes: null
    html: "<p>I do have an awareness that it seems like some letters are really worked &amp; others not. I do feel that tension. I should explain that what I found when I was observing the letters at the pool was that when they made the letters from tiles they looked for a solution that didn't require extra cuts. Just whole tiles. Like the T . When no solution was apparent with whole tiles they made anged cuts in the tiles. The V is a copy of what they did with the tiles at the pool. So I could say it's the tension of tiles. <br> <br>There isn't a whole alphabet to refer to, incomplete numbers &amp; no lowercase at all so I am extrapolating...  <br> <br>Both the officer &amp; enlisted are speculation but based on observation. I actually built the font around squares &amp; trangles initially &amp; then when I was swimming I noticed the half cuts used on the 3 &amp; the angled cuts used on the 'V'. So I thought: With these new rules avaialble - what can I improve using the new diagonal? The half tile? <br> <br>At some point I may have to change the font because being true to my concept may not give me the results I am looking for. <br> <br> I want the font to be resonable for a longish title &amp; not just 1,2 or 3 words at at time. Actually the lowercase n has a special cut I invented to make it read better. It isn't a trangle. The lower case a too. <br> <br>I changed a few characters too.  <br> <br>Have a look, there is a new 4, G, &amp; @. <br> <br><img src=\"https://web.archive.org/web/20140724023741im_/http://www.typophile.com/forums/messages/29/68168.gif\" alt=\"\"> <br> <br>Better or worse? Why?   <br> <br>BTW - AndrZ's '4' is thoretically fine &amp; looks fine in many ways but it isn't what they have at the pool. The new one is closer to what is there than my old one. <br> <br>It may be that when the other background tiles can be seen it will make more sense too. I'm working on that 2nd font, the other tiles, now.</p>"
    html_clean: "<p>I do have an awareness that it seems like some letters are really worked &amp; others not. I do feel that tension. I should explain that what I found when I was observing the letters at the pool was that when they made the letters from tiles they looked for a solution that didn't require extra cuts. Just whole tiles. Like the T . When no solution was apparent with whole tiles they made anged cuts in the tiles. The V is a copy of what they did with the tiles at the pool. So I could say it's the tension of tiles. <br> <br>There isn't a whole alphabet to refer to, incomplete numbers &amp; no lowercase at all so I am extrapolating...  <br> <br>Both the officer &amp; enlisted are speculation but based on observation. I actually built the font around squares &amp; trangles initially &amp; then when I was swimming I noticed the half cuts used on the 3 &amp; the angled cuts used on the 'V'. So I thought: With these new rules avaialble - what can I improve using the new diagonal? The half tile? <br> <br>At some point I may have to change the font because being true to my concept may not give me the results I am looking for. <br> <br> I want the font to be resonable for a longish title &amp; not just 1,2 or 3 words at at time. Actually the lowercase n has a special cut I invented to make it read better. It isn't a trangle. The lower case a too. <br> <br>I changed a few characters too.  <br> <br>Have a look, there is a new 4, G, &amp; @. <br> <br><img src=\"https://web.archive.org/web/20140724023741im_/http://www.typophile.com/forums/messages/29/68168.gif\" alt=\"\"> <br> <br>Better or worse? Why?   <br> <br>BTW - AndrZ's '4' is thoretically fine &amp; looks fine in many ways but it isn't what they have at the pool. The new one is closer to what is there than my old one. <br> <br>It may be that when the other background tiles can be seen it will make more sense too. I'm working on that 2nd font, the other tiles, now.</p>"
