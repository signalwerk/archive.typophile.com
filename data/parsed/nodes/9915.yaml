    date: 2005-04-04T11:43:00
    date_raw: 4 Apr 2005 — 11:43am
    votes: null
    html: "<p>I'm not a huge fan of modular stuff, but I have to say that this design is showing great promise as applied in that \"Let's get cool in the pool\" image. Something about a cool, watery atmosphere really seems to click with it (even though most pool lettering is nothing like that). <br> <br>I wish I had the time to get into a micro, glyph-level <br>analysis, but let me just make these two macro observations: <br>1) Let go of the actual pool lettering you first saw. It served as great inspiration, but clinging to it too literally (like some flotation device :-) will limit the functionality of your end result (it will impede learning to swim:-). So can obsessing over structural rules: make the letters what they need to be, not what the Rules want - we don't read rules, we read letters. <br>2) The most important element of this design is the gaps. And as with any delicate feature, they can get lost, aliased, blurry, etc. at smaller sizes. So I would recommend (at least) two cuts of the font, with different size gaps. You might even make a multiple-master axis for the gap size. <br> <br>hhp</p>"
    html_clean: "<p>I'm not a huge fan of modular stuff, but I have to say that this design is showing great promise as applied in that \"Let's get cool in the pool\" image. Something about a cool, watery atmosphere really seems to click with it (even though most pool lettering is nothing like that). <br> <br>I wish I had the time to get into a micro, glyph-level <br>analysis, but let me just make these two macro observations: <br>1) Let go of the actual pool lettering you first saw. It served as great inspiration, but clinging to it too literally (like some flotation device :-) will limit the functionality of your end result (it will impede learning to swim:-). So can obsessing over structural rules: make the letters what they need to be, not what the Rules want - we don't read rules, we read letters. <br>2) The most important element of this design is the gaps. And as with any delicate feature, they can get lost, aliased, blurry, etc. at smaller sizes. So I would recommend (at least) two cuts of the font, with different size gaps. You might even make a multiple-master axis for the gap size. <br> <br>hhp</p>"
  - id: 63124
    user: 2942
    date: 2005-04-04T13:44:00
    date_raw: 4 Apr 2005 — 1:44pm
    votes: null
    html: "<p>Thanks for the advice Ricardo &amp; Hrant! <br> <br>Most Pool lettering is all caps no? <br> <br>Hrant, I agree with you about the the gaps both from the point of view of needing multiple gaps widths &amp; also with reagrd to the design. The new design is more open &amp; will probably blur more on screen. Maybe thats not *such* a big issue since I am interested in a display purpose.  <br> <br>I haven't been getting a pool/tile vibe enough &amp; so I rounded the tiles &amp; then got rid of the rounding again where the cuts are. It looks like this : ( with &amp; without phtoshop enhancement ...) <br> <br> <br><img src=\"https://web.archive.org/web/20140724023741im_/http://www.typophile.com/forums/messages/29/68749.jpg\" alt=\"\"> <br><img src=\"https://web.archive.org/web/20140724023741im_/http://www.typophile.com/forums/messages/29/68750.gif\" alt=\"\"> <br> <br>Ricardo, thanks for checking out Bahn. I hope to sort out the last issues with that one this summer &amp; get it out in the world. I hope to apply some of my own advice about quirkyness (&amp; others) to that font before it goes out too. I think that for this font (&amp; Bahn) the best way to create value in the font may be to create one or more fonts of variations in shapes since many letters/characters can be done differently.</p>"
    html_clean: "<p>Thanks for the advice Ricardo &amp; Hrant! <br> <br>Most Pool lettering is all caps no? <br> <br>Hrant, I agree with you about the the gaps both from the point of view of needing multiple gaps widths &amp; also with reagrd to the design. The new design is more open &amp; will probably blur more on screen. Maybe thats not *such* a big issue since I am interested in a display purpose.  <br> <br>I haven't been getting a pool/tile vibe enough &amp; so I rounded the tiles &amp; then got rid of the rounding again where the cuts are. It looks like this : ( with &amp; without phtoshop enhancement ...) <br> <br> <br><img src=\"https://web.archive.org/web/20140724023741im_/http://www.typophile.com/forums/messages/29/68749.jpg\" alt=\"\"> <br><img src=\"https://web.archive.org/web/20140724023741im_/http://www.typophile.com/forums/messages/29/68750.gif\" alt=\"\"> <br> <br>Ricardo, thanks for checking out Bahn. I hope to sort out the last issues with that one this summer &amp; get it out in the world. I hope to apply some of my own advice about quirkyness (&amp; others) to that font before it goes out too. I think that for this font (&amp; Bahn) the best way to create value in the font may be to create one or more fonts of variations in shapes since many letters/characters can be done differently.</p>"
