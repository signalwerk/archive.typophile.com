    votes: null
    html: <p>Eben, really nice work on your typeface!  Great modular font that is modern yet could be found in some mosaic from 100 years ago.  It's great at big sizes, and at small sizes it looks like a pixel font. <br> <br>I was browsing some magazines at Barnes and Noble and I noticed that Web Designer magazine had a very similar tiled font as the headline font for one article.  Check it out if you have the chance... it's issue 104.  Unfortunately I can't remember the page number, and I don't have any scans since I didn't get the magazine.  Good luck!</p>
