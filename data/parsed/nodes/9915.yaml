  date_raw: 23 Mar 2005 — 12:44pm
  votes: null
  html: <p>I'd love a crit <br> <br><img src="https://web.archive.org/web/20140724023741im_/http://www.typophile.com/forums/messages/29/67958.gif" alt=""> <br> <br>Proposed Styles 2 - Officer &amp; Enlisted <br> <br>I am not sure that weights are relevant here because this <br>font is based on the depth markings made with tiles on the side  <br>of the pool I use here at at the local Army base.  <br> <br>The Officer Style &amp; proposed Enlisted style is not based on strict  <br>observation per se.  There is no officer or enlisted pool here in AK.  Instead the 'Officer' is what I imagined you might do with tile if you had the time/money/inclination.  The 'Enlisted' will use fewer fancy cuts and will be more blocky &amp; maybe shorter.   <br> <br>I have also been thinking of adding the missing tiles for an overlay 2 tile color look &amp; maybe doing a reverse version so the completed set would be 4 or 6 fonts total. <br> <br>I have hinted &amp; kerned this font too.</p>
  html_clean: <p>I'd love a crit <br> <br><img src="https://web.archive.org/web/20140724023741im_/http://www.typophile.com/forums/messages/29/67958.gif" alt=""> <br> <br>Proposed Styles 2 - Officer &amp; Enlisted <br> <br>I am not sure that weights are relevant here because this <br>font is based on the depth markings made with tiles on the side  <br>of the pool I use here at at the local Army base.  <br> <br>The Officer Style &amp; proposed Enlisted style is not based on strict  <br>observation per se.  There is no officer or enlisted pool here in AK.  Instead the 'Officer' is what I imagined you might do with tile if you had the time/money/inclination.  The 'Enlisted' will use fewer fancy cuts and will be more blocky &amp; maybe shorter.   <br> <br>I have also been thinking of adding the missing tiles for an overlay 2 tile color look &amp; maybe doing a reverse version so the completed set would be 4 or 6 fonts total. <br> <br>I have hinted &amp; kerned this font too.</p>
