  html: "<p>Does anybody know why when I drop individual bought versions of Stone Sans into Suitcase or simply in a fonts folder I get different versions depending on the application? (i.e. Plain / Medium / Regular). <br> <br>All other fonts have been removed to ensure only one version exists on the machine (or on Suitcase Server). <br> <br>StoneSans in Illustrator 10 in OSX gives: <br>Medium / Italic / SemiBold / SemiBold Italic  <br> <br>StoneSans in Illustrator 8 in Classic mode gives <br>Regular / Italic / SemiBold / SemiBold Italic / Bold / Bold Italic  <br> <br>StoneSans in Photoshop 7 in OSX gives  <br>Medium / Italic / SemiBold / SemiBold Italic  <br> <br>StoneSans in Apple TextEdit\tin OSX gives  <br>Plain / Italic / SemiBold SemiBold Italic / Bold / Bold Italic  <br> <br>StoneSans in Apple Mail in OSX gives <br>Plain / Italic / SemiBold SemiBold Italic / Bold / Bold Italic  <br> <br>Artpro 7 in OSX gives:\t <br>Plain / Italic / SemiBold SemiBold Italic / Bold / Bold Italic  <br> <br>Microsoft Word (Office X) in OSX gives:\t <br>Regular / Italic / Bold / Bold Italic  <br> <br>This problem causes text re-flowing issues; see attached for example screen grabs. <br> <br>Whilst researching this issue I noticed a similar problem was posted on another forum, but got no response</p>"
