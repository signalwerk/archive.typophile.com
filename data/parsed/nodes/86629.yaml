      <p>They must be:</p>
      <p>"Locally..." =&gt; <strong>ITC Tiepolo Bold Italic</strong><br>
      "Rogersville" =&gt; <strong>ITC Tiepolo Black</strong><br>
      <a href="http://new.myfonts.com/fonts/agfa/itc-tiepolo/" title="http://new.myfonts.com/fonts/agfa/itc-tiepolo/">http://new.myfonts.com/fonts/agfa/itc-tiepolo/</a></p>
