  html: |-
    <p>We are proud to announce the <strong><a href="http://new.myfonts.com/fonts/sudtipos/coche/" rel="nofollow">release</a></strong> of a new Koziupa &amp; Paul font.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilecoche_5956.jpg"></div><p></p>
    <p><strong><a href="http://new.myfonts.com/fonts/sudtipos/coche/" rel="nofollow">Coche</a></strong> is a different kind of work from Koziupa and Paul. It is a connected script with a strong corporate feeling that aims to fill a gap in modern product branding. Coche means automobile, and one can easily envision a car's logo set with this font. <strong><a href="http://sudtipos.com/fonts/150" rel="nofollow">Coche</a></strong> comes loaded with alternates and a complete set of small caps that nicely complement the caps and lowercase.</p>
    <p>This is the font for the modern designer-as-jockey who loves mix-and-play typography. <strong><a href="http://sudtipos.com/fonts/150" rel="nofollow">Coche</a></strong> covers all Latin-based languages.</p>
    <p>More fonts &gt; Visit <strong><a href="http://sudtipos.com" rel="nofollow">Sudtipos</a></strong></p>
