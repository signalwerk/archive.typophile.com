      <p>I would emphasize what the Jameses said (jupiter &amp; terminal). With magazines, typically the advertising grid is determined first. Your editorial grid should in some way reflect (or harmonize with) the ad grid. </p>
      <p>I also like using grids with odd numbered columns. I've used both, but to my mind odd-numbered column grids are a little easier to use and aesthetically a little more pleasing to the eye. Hey, but that's just me.</p>
      <p>I also like using a 13-column grid. But you should experiment.</p>
      <p>A grid is a helpful tool. Especially in magazines.</p>
