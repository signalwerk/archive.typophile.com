      <p>What jayyy and dzobel said.</p>
      <p>The grid, and the number of columns, should be dictated by the content of your publication. For example, you wouldn't usually split fiction into six columns, just as you wouldn't usually use one column for the section with letters from your readers... But then again, there are always exceptions.</p>
      <p>In short, form should follow function. :-)</p>
