    <p>Hi there,</p>
    <p>I wanted to ask about grids with magazine layouts. The reason being I have just been asked to quote on a job to do a layout for magazine that will need a 2 and 3 column template as well as a spread.</p>
    <p>I have been reading books by Timothy Samara (Making and breaking the grid) and Kristin Cullen (Layout workbook) though what I am looking for is more of an explanation on what grid to use and to understand better why grids may contain up too 8 - 12 columns though the layout will then group (3 - 5) columns and use as one column.</p>
    <p>example here:<br>
    <a class="freelinking external" href="http://www.puidokas.com/wp-content/uploads/2007/08/subtraction-grid.jpg" rel="nofollow">http://www.puidokas.com/wp-content/uploads/2007/08/subtraction-grid.jpg</a></p>
    <p>There must be some rules to setting up grids or is it a visual thing?</p>
