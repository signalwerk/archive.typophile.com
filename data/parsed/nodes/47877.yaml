    html: |-
      <p>when a grid system has 8-12 columns it is giving the designer a more versatile way of laying out the design. It is also usually used when you have more complex information that needs more areas to lay it out. </p>
      <p>The reason that many columns are sometimes grouped into less is to give the designer flexibility. You are still conforming to the grid, but it give you the ability to layout a lot of information and many different ways you can layout a single page. The lower the number of columns in your design the least number of ways you can arrange the information.</p>
      <p>there really are not any rules, just depends on the amount of information and the type of information that you have.  </p>
      <p>Usually in a magazine there are many different grids layouts, usually about 3 or 4. main articles, secondary articles and maybe the reoccurring features (i.e editors note, etc)</p>
      <p>hope this helps</p>
      <p>david</p>
