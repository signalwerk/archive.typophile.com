      <p>Monsta - in response to your question, from the little formal theory and historic examples I know of grids, I think it is a visual thing. By developing a rock-solid grid for your magazine this will give it a visual hierarchy and consistency throughout.<br>
      In your posted example they use many columns so they can alter the layout depending on what the content is. In the context of a magazine or similar publication you ideally would establish a width for your minimum text column and adding in gutters and margins, work that into a full two-page spread. In certain layouts you may then decide to run text over 2 columns for a feature or more for heads etc.</p>
      <p>Having a template like this will give you the freedom to chop and change your layouts to suit the amount of copy, open pages, ads, etc.</p>
      <p>Hope that makes sense.</p>
