    html: <p>Having spent years in the magazine business in a former life, I would recommend an odd number grid approach. 13 columns is quite a flexible grid. you can have three columns of four with an extra column for white space that can be inserted either on the outside, inside or between the columns. You can have 4 columns of three with that extra space, Two columns of six, again with that extra space to use as a layout element.  Willi Kuntz was a big advocate of the 13 column grid, as is Will Hopkins of Hopkins/Baumann who worked with Kuntz.</p>
