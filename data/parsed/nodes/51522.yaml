      <p>It is indeed the most disgusting thing I have ever came across- I didn't know what Typodermic was talking about and so many reacted, so I decided to Googled it... I for one regret like anything after seeing that piece... (at the same time, thank God for Google- nothing is impossible...) </p>
      <p>Curiosity does kill the cat... That's the problem with visuals. Once they get into your mind it stays forever, and make such a lasting impression that no clever software on earth can thrash it...</p>
      <p>As the old saying goes, "The eye is the light of the body. If your eye is good, your whole body would be full of light."</p>
      <p>It's wise to guard what you see... </p>
      <p>As Graphic Designer, I am sometime thrilled by the fact that I am being entrusted with the giftedness of handling one of the most powerful thing on earth- the VISUALS- it can either "break" or "build"- just look at all the propaganda posters during the WWII, or the woodblocks of communist China during the cold war - those are great designs to be admired, at the same time it brings chill down my spine when I think of how many millions of young people have lost their lives as the result of these posters...</p>
      <p>In one of the interviews, Bill Gates confessed that he discouraged his sons from playing too much computer games for he sees the damages it can bring to them... Even the guy realised he have created a moster that can be untamable...</p>
