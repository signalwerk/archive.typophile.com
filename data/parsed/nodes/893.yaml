    html: "<p> I believe that the Fair Use exemption for educational purposes usually applies specifically to a classroom situation, not just general edification. <br> <br>Section 107 of the Copyright Code lists four factors that are weighed in determining whether an instance constitutes fair use:  <br>(1) the purpose and character of the use, including whether such use is of a commercial nature or is for nonprofit educational purposes; <br>(2) the nature of the copyrighted work; <br>(3) the amount and substantiality of the portion used in relation to the copyrighted work as a whole; and <br>(4) the effect of the use upon the potential market for or value of the copyrighted work. <br> <br>It is a subjective standard. That Hrant's intentions are clearly noncommercial and the fact that the work in question has long been out of print stand in favor of fair use with regard to points 1) and 4), and to some extent perhaps 2).  <br> <br>Posting on a publicly accessible website could be construed as \"publishing,\" which is a slightly different circumstance than mere copying. If you wish to make the article available to those who are interested, Hrant, I would recommend offering to send individual copies via e-mail rather than publishing to your site. This would be more defensible as fair use, in my opinion. <br> <br>-- Kent. <br> <br>Disclaimer: As I've said before, I am not an intellectual property rights attorney. My opinions should not be construed as legal counsel. </p>"
