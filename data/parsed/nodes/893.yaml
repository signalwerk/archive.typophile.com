      <p>I see that I am waking up an old thread. Interesting! Unfortunately, here in Montreal, it seems that Typographica #12 (1956) is  accessible only at the McGill university library, from 9 to 5, week days. I'll have a look when I go there.</p>
      <p>Concerning digitization, in France, <a href="http://www.numdam.org/?lang=en " rel="nofollow">NUMDAM</a> (Numérisation de documents anciens mathématiques - digitization of old mathematical documents) offers an open access to 34 journals, 29 seminars and 4 memoirs up to year 2000. For instance  all the issues of the <a href="http://www.numdam.org/numdam-bin/feuilleter?j=BSMF" rel="nofollow">Bulletin de la Société Mathématique de France</a>  (Bulletin of the French Mathematical Society) from 1872 to 2000 are freely accessible. The Operations Research Journal <a href="http://www.numdam.org/numdam-bin/feuilleter?j=RO" rel="nofollow">RAIRO</a> is freely accessible up to year 2006 (and to subscribers after that) so that "old" is not that old. And they even got the <a href="http://www.numdam.org/numdam-bin/feuilleter?j=ASNSP" rel="nofollow">Annali della Scuola Normale Superiore di Pisa - Classe di Scienze</a> from 1871 to 2005.</p>
      <p>Maybe things have changed in the last 10 years...  This thread is from 2002.</p>
