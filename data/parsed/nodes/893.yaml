    html: <p>I read it yesterday. Interesting indeed but in your comment in the end about Mistral, you cheated a bit when you translated "calquée" by "calculated" (in the main text, you wrote "directly copied"). I agree with your conclusion that he was a gifted artist but unafraid to <em>think</em>, but why "calculated" ? In «L'absence d'alignement ne pouvait être calquée sur l'écriture authentique » I see no calculation, just the fact that it was not possible to reproduce actual writing in lead.</p>
