    html: "<p> &gt; many up us cannot see due to potential copyright issues <br> <br>Well, if you have access to the ILL service at a library (possibly through a student friend), you can always request that issue of Herbert Spencer's Typographica: #12 ('56) of the *old* series. <br> <br>But I'll try my hand at some highlights/excerpts, sure. <br> <br>- Excoffon wanted to \"introduce some life\" into typography. <br> <br>- He started with a long-drawn process of figuring out how handwriting could work in type, trying to \"forget all the forms which typefounding had rendered traditional\", and wanting to render the \"handwriting of the man of the 20th century. ... perfectly free, uncodified, and spirited.\" <br> <br>- He notes that the technical requirements were naturally opposed to letterform variety, and resolution seemed impossible at first. <br> <br>- \"I consulted and studied hundreds of autographs of important men of our century\", and he also \"consulted the most eminent graphologists.\" But graphology turned out to be entirely \"analytical\", with no hope of \"sythesizing\" anything from it. <br> <br>- He turned to his own handwriting, since \"any other method would be marked as artificial\". <br> <br>- \"The absence of alignment {typical of handwriting} could not be calculated from the authentic handwriting .... in order to obtain a greater certitude in the average irregular alignment, a careful study of the data* supplied by cryptography on the frequency of juxtaposition of characters (in the French language) enabled me to eliminate, or to foresee in most cases, sequences of disharmonious combinations.\" <br> <br>* This is what makes Excoffon truly great: a gifted artist, but unafraid to *think*. <br> <br>- He implemented \"frequent variations in the inclinations of the main strokes ... [which further] enabled me to adjust as far as necessary the characters menaced by kerning** (mainly the l and the p). By adding some logotypes (qu, st, ll, on) I could increase the impression of freedom.***\" <br> <br>** There are no kerning characters in Mistral, noting that it was born as a foundry metal face. <br> <br>*** OpenType, anyone? <br> <br>- He points out that having all the glyphs attach at the same height was a major problem in terms of authenticity. Fortunately, \"the roughness given to the outlines of the strokes ... [confuses] the repeated regularity of these strokes\". <br> <br>- In order to increase variety, he varied the \"base glyph\" of the accented characters. <br> <br>The article includes initial trial sketches, and the best thing about them is that they show a great variety of ideas - there's a lot in them thar mines! There's also an enlargement of a lc \"a\" from one of the smaller sizes of Mistral, showing how much stronger the outline irregularity is, because it needs to be, to maintain character. And this is why so many \"rough\" digital fonts essentially fail: they need to have different versions for different sizes, with roughness inversely proportional to size - or ideally an MM axis to that effect. <br> <br>Further notes: <br>1. The piece includes the original article in French. <br>2. It is followed by a review of Mistral (as well as Ashley) by Stuart Hayes. In the review Hayes says that \"it is a remarkable technical achievement\", but also points out an interesting problem: because Mistral was optimized for French, some common English sequences (noting \"ft\", \"fl\" and \"fo\") tend to \"stumble\". To me the fix would be to incorporate non-French languages into the \"solution\", and/or have different versions for each language (maybe through OpenType). This language-specificity also applies to spacing/kerning, btw. Like in French, round-round adjacency is much less frequent than in English, and that directly affects the validity of the sidebearings of the lc \"o\" for example. <br> <br>hhp </p>"
