d increase the impression of freedom.***\" <br> <br>** There are no kerning characters in Mistral, noting that it was born as a foundry metal face. <br> <br>*** OpenType, anyone? <br> <br>- He points out that having all the glyphs attach at the same height was a major problem in terms of authenticity. Fortunately, \"the roughness given to the outlines of the strokes ... [confuses] the repeated regularity of these strokes\". <br> <br>- In order to increase variety, he varied the \"base glyph\" of the accented characters. <br> <br>The article includes initial trial sketches, and the best thing about them is that they show a great variety of ideas - there's a lot in them thar mines! There's also an enlargement of a lc \"a\" from one of the smaller sizes of Mistral, showing how much stronger the outline irregularity is, because it needs to be, to maintain character. And this is why so many \"rough\" digital fonts essentially fail: they need to have different versions for different sizes, with roughness inversely proportional to size - or ideally an MM axis to that effect. <br> <br>Further notes: <br>1. The piece includes the original article in French. <br>2. It is followed by a review of Mistral (as well as Ashley) by Stuart Hayes. In the review Hayes says that \"it is a remarkable technical achievement\", but also points out an interesting problem: because Mistral was optimized for French, some common English sequences (noting \"ft\", \"fl\" and \"fo\") tend to \"stumble\". To me the fix would be to incorporate non-French languages into the \"solution\", and/or have different versions for each language (maybe through OpenType). This language-specificity also applies to spacing/kerning, btw. Like in French, round-round adjacency is much less frequent than in English, and that directly affects the validity of the sidebearings of the lc \"o\" for example. <br> <br>hhp </p>"
