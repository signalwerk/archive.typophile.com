    <p>I was wondering if any San Francisco locals could suggest some good graphic design studios in SF.&nbsp;</p>
    <p>I have done extensive research on the web, books and through the AIGA, put a list together, then thought it may be worth asking the San Francisco Typophiles as well.</p>
    <p>My list so far&nbsp;includes SF standards like: Cahan, Chen, Character, Howry, Paper Plane, Tolleson, Stone Yamashita, Volume,&nbsp;UDN, Pentagram, Wolf Olins and Landor.</p>
    <p>Any help would be much appreciated.</p>
