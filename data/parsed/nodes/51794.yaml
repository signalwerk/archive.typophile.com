      <p>I think we have to watch the art world a bit on this. The whole "Post" tag is a bit problematic in a way because it is so presumptive. How could art be created in contemporary culture that is not post-modern? I guess the answer is authentic primitivism, which given the current economic situation may be the hot new thing, but then we would have to completely lose the thread of history to get there.</p>
      <p>We also flirt with the idea that artists no longer have to produce an object of commerce. Simple actions or perceptions can be art. Do they then have to be documented? What are the rules? Maybe this is post-art? If we conclude that artists are held up as great primarily to feed institutions that perpetuate the elevated value of the individual rather than on the basis of some super esoteric measure of skill that requires an expert to define, then the act of making art becomes naive, or simply no more revered than any other act. I'm totally wanking so I'll stop.</p>
