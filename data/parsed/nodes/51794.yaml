      <p><cite>I don’t believe I’m the only person that has found the oddity in the post-modern tag.</cite></p>
      <p>You're not alone! I made a comment about that over <a class="freelinking external" href="http://typophile.com/node/52083" rel="nofollow">here</a>.</p>
      <p>Words denoting a time period are fine, but when their meaning is synonymous with "the present" the term is immediately obsolete as time moves on, and then gets silly when appended to make it mean "after the present" (but isn't "futurism" which was a subset of "modernism" from nearly a century ago). </p>
      <p>What do we do when now becomes then and we need to describe the next now?<br>
      Without indicating a guiding design feature or more general philosophy these words are nothing more than calendar markers, and ambiguous ones at that.</p>
