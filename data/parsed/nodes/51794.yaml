      <p>My humble opinion is that we are too close in time, to the period that we call "postmodern design", to give a name to what came afterwards. However, there is an excellent essay/interview with Rob Giampietro that appeared in Emigre 65 (or was it 64?), "Default Systems in Graphic Design," which you can find <a href="http://www.studio-gs.com/writing/index.html" rel="nofollow">here</a>.</p>
