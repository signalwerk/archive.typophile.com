      <p>Postmodernism emerged before digital culture.<br>
      As something that is more related to the technology of the present era, perhaps Populism--meaning that whereas before, design was the preserve of a professional minority, now it is something that anyone can do.<br>
      Perhaps not in every field of design, but certainly in graphic design and typography.</p>
      <p>Related to this, and the idea of Defaultism, is that as with any technological revolution that makes a previously professional skill do-able by anyone, automation is a feature of Digitalism, so amateur practitioners will stick with the pre-sets, and this most basic mode will be adopted by professionals, as they shift their attention to meta-levels of design.</p>
      <p>Not to say that Populism wasn't around before--the Last Whole Earth Catalogue (1970) advocated a grassroots socio-political revolution riding the technology of photocopiers and IBM Selectrix (golf ball strike-on) typesetting. Punk-rock zines followed through on that.</p>
      <p>(Fontism.com is presently under construction, as the making of fonts is getting in the way of making that a movement. But perhaps it already is.)</p>
