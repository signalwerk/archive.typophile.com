      <p>What about the Aesthetics Age (Style and design)?</p>
      <p>I was reading the essay written by Mr.Keedy for Emigre No.67 (I had it in my notes...cant find it online anymore) the name is 'STYLE IS NOT A FOUR LETTER WORD'</p>
