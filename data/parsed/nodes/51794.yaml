      <p>Well, I'm no expert, but I think that a part of the post-modernism movement was pluralism in society, the acceptance of multiple concurrent styles in varying directions.</p>
      <p>I don't see that ending, and I certainly see it in the world around me.  There will always be certain Milestones in design, be it good or bad, that all of the styles have to endure and survive through.</p>
      <p>'Web 2.0' and whatever the heck that means anyway, is certainly purported to be a 'design style' that people want and misapply.  I'm sure this will be remembered as a failed sidenote of design history in the future.</p>
      <p>Hope that at least gives you some idea that might help you spring off and find some information that could be valuable to you.</p>
      <p>Best of luck on your search!</p>
