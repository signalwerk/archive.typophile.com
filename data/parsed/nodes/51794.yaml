      <p>Laura, I did not mention the term "post-modern" as an actually viable or reliable expression. Nick is right by saying changes happen on different levels, and often the formal and artistic movement express ideas which are also independent from them.<br>
      I like Innovati's answer, since he sees what are the positive elements following the many ideologies we could call "modernity". Although it could be misleading, it's maybe useful to relate modernity with the industrial revolution, but the idea of a fascination with "modern" is prone to emerge in any moment in history, so I would simply say I use "post-modern" to indicate a span of time where previous ideas are discussed, while looking for a balance renewal.</p>
      <p><cite> I’m totally wanking so I’ll stop. </cite><br>
      I agree… :LOL:</p>
