  html: |-
    <p>I'm working on a brochure for a corporation that uses Arial as their corporate font. Yes, I know Arial sucks, but I'm stuck with it. The brochure will contain a cartoon character (one of their products turned into a character). </p>
    <p>I have very little experience with cartoon fonts. Does anyone have any recommendations? Nothing too zany as the cartoon character will be talking about a serious subject (a medical condition).  I'd prefer to keep the cost under $50 if possible. Thanks.</p>
