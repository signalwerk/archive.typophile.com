      <p>If, for example, you were using the direct selection tool before using the type tool, holding down the command key will give you the direct selection tool back, click the mouse wherever your cursor is and hit the letter to activate the new tool. I don't know if this works on PCs but I imagine so. If you want to zoom or move the workarea you can use command+space or option (alt) respectively, releasing them will return you to the text tool.<br>
      No more trips to the pesky menu, until you forget what the shortcut is:)<br>
      Tim</p>
