  html: <p>So I'm doing my first ever project with InDesign and there's one thing that is bugging me. When I'm active in a text box/frame, whatever you call it, and I input my copy I can't seem to find a way to exit 'Text entry' mode. ESC, Enter, Return...none of those work. I have to go over to the toolbar and manually click on a different tool. I'd much rather just hit a button and go about my business. Does this make sense? I'm sure there has to be a way to do this.</p>
