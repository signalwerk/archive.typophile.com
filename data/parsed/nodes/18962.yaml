    html: |-
      <p>The more time you spend in there, the easier it'll get. </p>
      <p>A few random tips/shortcuts which you may already know;</p>
      <p>* If you're fussy like me, set your ideal workspace (onscreen layout of tools and panels) and save it under the windows tab so when things get a bit messy, you can load your saved workspace. I wish I'd learned this earlier.<br>
      * Hit W to toggle between preview (hides grid/guides/bleeds etc.) and working spaces.<br>
      * Make sure your colour profiles are synchronised between all suite programs (Illustratior/InDesign/Photoshop) so you don't get any surprises when you throw something in. In CS2, there is a suite colour sync feature that is very useful.</p>
      <p>I hope this helps.</p>
      <p>:-)</p>
