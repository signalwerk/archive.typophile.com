      <p>"So I’m doing my first ever project with InDesign and there’s one thing that is bugging me."</p>
      <p>Well, just give it time, it's a great, big application.</p>
      <p>Because my use tends towards type, I've become happier thAN EVER with a type tool that lets you out*, when you want to stay with the type tool, (forever on most of my documents).</p>
      <p>* (cmd = select, move, resize objects, cmd-opt = interactive copy,  cmd-op-sh= type tool sans function, (but pan and zoom with care).</p>
      <p>I wish I'd started out knowing: to set my default document to a 13" square, and then each time I create a new document , change the format from portrait to landscape to make sure nothing happens.</p>
      <p>Also, the controls on the underscore are phenomenal. defining the underscore as a squiggly line, for example, can be done to avoid those nasty descenders, and it is now a breeze.<br>
      :)</p>
