    html: |-
      <p>Ever needed to switch to the Selection tool while you’re working inside a text frame? Or what if you want to draw a new frame somewhere else on the page. You can’t tap the shortcut V for the Selection tool or F for the Rectangle Frame tool while you’re working inside a text frame or you will wind up adding the letters V and F to your text. Yes, you can deselect and then press those keys, but the savvy InDesign user can do the following:</p>
      <p>Choose Edit Keyboard Shortcuts and switch the Product Area to Tools. Then scroll down to find the tool you need a new shortcut for. Click inside the New Shortcut field and with the Context as Text, type the shortcut you want. Make sure you use a modifier key such as Cmd (Mac) or Ctrl (Windows) and then a letter. For instance, I use Cmd-Opt-Shift-V for the Selection tool. Then, you will have two different shortcuts. The single letter can be used when you’re outside a text frame, and the longer one when you’re inside the frame.</p>
      <p><em>— This week's tip was provided by Jamie McKee.</em></p>
      <p>From <a href="http://www.theindesignconference.com/" rel="nofollow">The Indesign Conference</a> Tip of the Week.</p>
