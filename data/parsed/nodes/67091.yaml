    html: |-
      <p>1. Its a Government Magazine with a different theme each publication.<br>
      2. It is printed on a Heidelberg web press with Aqueous coating.<br>
      3. 60# Utopia dull No2 grade.<br>
      4. Geared towards a diverse resident base covering major departments such as Environmental, Transportation, Public Health etc. Each has a Page and/or a spread dedicated to them but they all have to fit within a theme. This issue is all about how their tax dollars are spent. It usually has a "Newsweek" feel for content and a "Wired" style for layout and graphics with a size similar to the "T magazine"</p>
      <p>I don't dislike Minion I just want a modern version. Currently Minion is paired with Din and Titling. I have explored the use of FF Yoga as a good all round super family, Brioni because of its suitability for magazines and Premiera for its X height. Would these substitute well?</p>
      <p>Thanks</p>
