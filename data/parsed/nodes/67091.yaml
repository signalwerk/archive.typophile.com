    html: |-
      <p>1. What kind of magazine?<br>
      2. How is it printed?<br>
      3. What is it printed on?<br>
      4. Who are the readers?</p>
      <p>There's dozens of choices. Answering a few simple questions regarding context makes the task far easier and removes aesthetic guesswork. Garamond and Sabon are pretty good fallbacks. <a href="http://typophile.com/user/2021" rel="nofollow">Nick Shinn</a> would be a good person to ask.</p>
