      <p><cite>One way to measure complexity is good ol’ topology:</cite></p>
      <p>Excuse me, but that's preposterous. By this metric, 'm' is simpler than 'o'. Try to make your argument again with a complexity metric that I can take seriously.</p>
      <p><cite>Let’s see it.</cite></p>
      <p>Flash player 8 for Linux isn't out yet, so a <a href="http://raph.levien.com/tmp/ggg.png" rel="nofollow">link</a> instead of an "insert image".</p>
      <p><cite>How could it, when there’s no data?</cite></p>
      <p>Ok, then I take back what I first said. It sounds like an empirical claim with no data to support it.</p>
      <p><cite>What font is that?</cite></p>
      <p>The one that Bertram Grosvenor Goodhue in 1896 for the Cheltenham press. I'm just trying to assign the blame to Goodhue rather than to my role model Benton, as I can't bring myself to believe that my hero would be capable of creating such a thing from whole cloth.</p>
      <p><cite>BTW, if I remember correctly, the original ATF Clearface -a design which Bullen claimed was the first font designed “scientifically” for high legibility mind you- had an open “g”…</cite></p>
      <p>Yes, a plain monocular one, which I'm sure we'd all agree is simpler than both the binocular and sesquiocular forms.</p>
      <p>Laura Ruggeri wrote:</p>
      <p><cite>In 1989 i had the opportunity to design an antology exhibition about Giovanni Mardersteig (1872-1977) and during that period i had the opportunity to view his archive… see how he designed fonts… sketches, notes, letters to other type-designers, etc.</cite></p>
      <p>Wow, that sounds like an incredible opportunity. I'm very interested in Mardersteig's Zeno font, for which there is currently no digitization. Could you possible be able to help me out with my queries from <a href="http://www.typophile.com/node/12226" rel="nofollow">this thread on Zeno</a>?</p>
