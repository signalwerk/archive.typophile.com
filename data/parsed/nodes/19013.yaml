      <p>Ciao Gio!<br>
      At the museum you can find all of sort of things... When my school took us there i remember my professor of typography explaining how much "particular" Soncino was in the details. He wanted everything perfect. He chose Griffo as the best punchcutter. He had to have the best inks and the best paper, etc. The research confirms that because of his high quality today we can still admire his work.<br>
      My father was a typographer handsetting for almost 40 years... so i have ink of my hands since i was 5... Thanks to that i had the opportunity to know many stories in the typography world in Italy, especially north of Italy.<br>
      In 1989 i had the opportunity to design an antology exhibition about Giovanni Mardersteig  (1872-1977) and during that period i had the opportunity to view his archive... see how he designed fonts... sketches, notes, letters to other type-designers, etc. I also discovered that when he was designing the font Dante at some point he get sick and he could not go to Milano (from Verona) to view the progress of the work. The typography was the one where my father worked! and becuase my father was also a good designer, Mardersteig sent a letter asking to my father to design the letter "e" for him... to not stop the work in the foundary.<br>
      At the archive of Mardersteig i also could see many protopyes (in pear wood) of letters designed by Bodoni.</p>
      <p>Thanks for the suggestion you gave me, i will go to look for Jannon.</p>
