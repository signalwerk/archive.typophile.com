      <p>hrant ranted:</p>
      <p><cite>I’ve come to believe that there is: it’s much more harmonious with the “spirit” of the Latin lowercase as a whole; the conventional (closed) form is really too complex; especially when it’s doubled it can cause a distracting spike in the texture.</cite></p>
      <p>This evaluation seems a bit subjective to me. I'm not sure if there's any good literature on measuring complexity (Peter Enneson's "role architecture" concepts are the only thing that come immediately to mind), but in my seat-of-the-pants count, a Baskerville style lachrymal  lower g bowl has one more thing to count than a traditional garalde: in the latter, you have the 'T' join where the bowl closes, and in the former you have both the lachrymal terminal and the gap between that terminal and the main stroke.</p>
      <p>An open 'g' in a sharp lineale such as Meta is even worse (by my rough counting scheme), because now you've got two sharp corners on the terminal, and they don't register as symmetrical because their role is so different.</p>
      <p><cite>Do we really think laymen (as opposed to type designers who mostly naturally enjoy getting used to explicit features) are so -consciously no less- familiar with and satisfied by the closed form...</cite></p>
      <p>I tested both the binocular and the sesquiocular (Meta-like) 'g' forms in Inconsolata on a bunch of laypersons, and latter always stood out as one of the first things they'd complain about. I was tempted by the sesquiocular form because I felt that the requirements of a monospace font exert a lot of pressure to take away black in the 'g' to avoid unevenness of color, and that the join of the lower bowl was one such place. Ultimately, I decided that the binocular form worked better, and now it's one of my favorite glyphs from the whole font - and something of a signature character for the font because so many of the glyphs are pretty vanilla.</p>
      <p>As for whether the Baskervillian sesquiocular form is superior in immersive reading, that sounds like an empirical claim, and I'm going to want to see empirical evidence before I really believe it. I'm not saying that tradition is always good, but you had a lot of really brilliant type designers (and type design engineers, I would say, who sought practical readability as the primary goal as opposed to a merely aesthetic impression) over the last few hundred years, and there's a pretty strong consensus. Of course, Mr. Eaves himself definitely qualifies as a brilliant type design engineer, but maybe he's the exception that proves the rule.</p>
      <p>Among the ATF designs from the Benton era, a very few used a sesquiocular g - Cheltenham, which was an adaptation of an earlier, somewhat bletcherous font; the ATF Baskerville of course; Souvenir (which isn't <em>exactly</em> sesquiocular, but isn't standardly monocular either), and some oddballs such as Hobo. (I don't have the catalogs in front of me to flip through, otherwise I'd probably find one or two classic Art Nouveau faces with interesting 'g' shapes).</p>
