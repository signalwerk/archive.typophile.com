      <p>Ciao!<br>
      I was born in a town close to Soncino the town where Soncino family lived and worked.<br>
      Soncino family printed the first bible in jewish.<br>
      <a href="http://www.storiadellastampa.unibo.it/noframes/soncino.html" title="http://www.storiadellastampa.unibo.it/noframes/soncino.html">http://www.storiadellastampa.unibo.it/noframes/soncino.html</a><br>
      If you go to Italy go and visit the museum and the press of Soncino... in Soncino close to Cremona (north of Italy)</p>
      <p>My favorite typeface of the renaissance was the one designed by Luca Pacioli. He designed it using the golden section.<br>
      From that font Garamond designed the "Garamond" typeface and from that one Simoncini re-designed the "Simoncini Garamond" (which as a beautiful italic)</p>
      <p>Ciao again</p>
