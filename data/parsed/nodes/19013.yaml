      Oh wait, I know what it is: the sceen's coarseness.</p>
      <p>&gt; the requirements of a monospace font exert a lot of pressure to take away black</p>
      <p>On the other hand, especially in mono fonts the "g" tends to look smallish (because making it look nice gives is it a small head) and making it darkish can help.</p>
