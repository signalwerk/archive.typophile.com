      <p>A tangential note to George's comment earlier in the thread about Griffo's 1516 italic beating Pierre Haultin for the "niche-interest record" of making nonpareil-size type: Although Fred Smeijers writes in <em>Counterpunch</em> that Haultin was the first to make such small type, H.D.L. Vervliet in his 2000 paper "Printing Types of Pierre Haultin (ca. 1510-87). Part I: Roman Types" (<em>Quaerendo</em> 30/2) and in the revised version in <em>The Paleotypography of the French Renaissance</em> seems to indicate that his was not the first (unless by a hair) but was, more importantly, the first to be widely used. </p>
      <p>"The Haultin Nonpareil roman and italic found their way into the main stock of the major European typefoundries. They were available until the end of the eighteenth century and, in that type size, for most printers the only choice on the market." (From the 2000 paper, page 90)</p>
      <p>"A Nonpareil type size was a rarity in early sixteenth-century typography and only owned by the better equiped printers. In France, I noted early uses by Estienne (1534) and Colines (1538). Haultin’s type is a bit smaller (though its capitals are bigger) than the second 42 mm Nonpareil which Robert I Estienne used from about 1543 on in his octavo bibles." (page 97)</p>
    html_clean: |-
