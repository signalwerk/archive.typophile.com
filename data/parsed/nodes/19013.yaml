      <p>I have just read this fascinating discussion. IMVHO, the only good g which opens on the right is in Jean-François Porchez's Ambroise.</p>
      <p><a href="http://new.myfonts.com/search/ambroise/fonts/" title="http://new.myfonts.com/search/ambroise/fonts/">http://new.myfonts.com/search/ambroise/fonts/</a><br>
      <a href="http://typofonderie.com" title="http://typofonderie.com">http://typofonderie.com</a></p>
      <p>His Retiro's g is great too but more difficult to see on the samples etc.</p>
      <p>Also, the best revival of Francesco's types may well be Frank Jalleau's Francesco</p>
      <p><a href="http://beta.batfoundry.com/catalogue_4_francesco_.html" title="http://beta.batfoundry.com/catalogue_4_francesco_.html">http://beta.batfoundry.com/catalogue_4_francesco_.html</a></p>
      <p>As for the g, my preference would go to a monocameral g or a sesquiocular g, provided there is a reduction of the top storey size. This is, imvho, the only thing that makes the g stand out from other letters, especially if one considers that the eye will be looking at the top third of each character for identification. Once the top storey is reduced, the shape of the tail is partly irrelevant (cf Minuscule) &amp; I would favour the simplest design; the one that matches the way people currently write their g; more often than not, they do a monocameral g, with a closed loop so a monocameral g with an open loop should be easy to read.</p>
