      <p><cite>what you are looking at is not what he “made”, but what “survived”.</cite><br>
      True, and more of your type scat info would be really helpful; but what survives contains information sufficient for us to determine the printed impresions Griffo could, with perfect knowledge of his craft, have expected his types to make, within a normally small but at any specific point unknowable range of error.<br>
      There's an element of global warming in "one’s eventual feelings about what actually exists are always more reliable than those about what might exist - which is a reason for literal revivals" but, since I care about making a good photopolymer version rather more than making a good offset version, I don't think there's any proven reason to get fundamentalist about this. I don't count scat as essential to the value of letterpress, it irritates me.<br>
      <cite>Oh good, that means you have the punches and/or the type, and receipts for their purchase, sale or creation?</cite><br>
      Correct me if I'm wrong, but I didn't think any of that survives from before De Colines.</p>
