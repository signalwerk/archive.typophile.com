  html: |-
    <p>In 1516, at the impressive age of 66, Griffo made his last type for his own press in Bologna. This tiny italic, in which four line increments vertically occupy almost exactly 1 cm, has an enormous x-height and fat counters, making these 32º books surprisingly readable. Is it the first such type made? Does anyone know about other early experiments with monster x-height?<br>
    George</p><div class="imageWrap"><img src="http://typophile.com/files/x-height2.jpg"></div><p></p>
