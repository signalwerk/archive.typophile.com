    html: |-
      <p>&gt; have always disapproved of open gs in text<br>
      &gt; faces - is there any reason to prefer them?</p>
      <p>I've come to believe that there is: it's much more harmonious with the "spirit" of the Latin lowercase as a whole; the conventional (closed) form is really too complex; especially when it's doubled it can cause a distracting spike in the texture. The way I see it, the only really valid reason to use the conventional form is: if you want the font to be as conservative as possible; or if you believe Familiarity takes a very very long time to settle down, and readers are almost inherently used to the closed form even if it has a "belonging" problem.</p>
      <p>In any case, the open form couldn't be as bad as the narrowness of<br>
      that "h" that you favor. :-&gt;  (That there is a display font though.)</p>
      <p>BTW, just to be clear: I'm not talking about the monocameral open form,<br>
      but the bi. The mono form is way too homogenous (in terms of readability).</p>
      <p>&gt; might be a solution to maintaining an adequate counter</p>
      <p>Yes, that might be it.</p>
      <p>hhp</p>
