      <p>George:<br>
      "the effort to accept whatever Griffo made has consistently been rewarded by a new or strengthened perception of its excellence"</p>
      <p>But remember, what you are looking at is not what he "made", but what "survived".</p>
      <p>" And one’s eventual feelings about what actually exists are always more reliable than those about what might exist - which is a reason for literal revivals."</p>
      <p>This statement makes total and complete sense, if your revival is metal. Otherwise, it's a slight increase in global warming.</p>
      <p>"The evidence that the 1516er was designed all of a piece is as good as you’re going to find in this period."</p>
      <p>Oh good, that means you have the punches and/or the type, and receipts for their purchase, sale or creation?</p>
