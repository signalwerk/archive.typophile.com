      <p>&gt; This evaluation seems a bit subjective to me.</p>
      <p>Well, a bit (i.e. in part) sure - I'm human too. But it's also based on reasoning. One way to measure complexity is good ol' topology: only the "B" is as complex as the traditional "g", and at least it has its two counters abutting. Another way to evaluate -if not measure- complexity is to just look at the thing. It almost looks like a Chinese logograph.</p>
