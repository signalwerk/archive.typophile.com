    html: <p>Although "the 1516 type would have been designed all of a piece," is it possible that Griffo did not start from scratch but employed existing counter punches on a smaller body? The only problematic lower case character in that scenario would have been the 'g,' and the open loop—I admit I'm stretching here—might be a solution to maintaining an adequate counter in the diminished space available for the descender.</p>
  - id: 116419
    user_id: 9356
    user_name: George Horton
    user_path: null
    user_image: null
    date_raw: 4 Apr 2006 — 3:03pm
    date: 2006-04-04T15:03:00
    votes: null
    html: <p>No, Griffo didn't use counterpunches. No counter is repeated perfectly in a font - even the counters on ligatured versions of letters are different from the standard forms, and the two halves of an m likewise. Part of Griffo's interest is that, like the makers of Venetians, he believed in divergence, but his proportions and modelling are typographic rather than calligraphic - much more sophisticatedly so, indeed, than Garamond's.</p>
  - id: 116433
