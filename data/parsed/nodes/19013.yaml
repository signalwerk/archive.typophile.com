      <p>George,<br>
      The beauty of going to a grad school situation, and a fine one like Reading, is the community interaction of your peers there as much as the faculty. You bring your passion and love for the craft and that value will be available to your colleagues there as much as any other. Don't be afraid to question everything you hear--not to be argumentative but to get the speaker to clarify and bring support to what they say. Dialogue is the most precious commodity in school. Drink it in and pour some of your own for others. You are not going to Reading to be fixed, you are not broken. You are going there to participate in everyone's growth including your own.</p>
      <p>I am sorry to sound like a verbose old man. Go there as a partner in learning and be who you are.</p>
      <p>ChrisL</p>
