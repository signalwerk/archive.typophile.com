    html: |-
      <p>&gt; I have a feeling they wouldn’t stir as much interest</p>
      <p>If they don't stir much interest here and now, with the<br>
      communicative power of the internet to boot, how can they<br>
      stir interest in the broader world, centuries or even just<br>
      decades down the line? If they don't stir interest, maybe<br>
      it's because they're not interesting. And I posit that the<br>
      great bulk of typefaces are not interesting because they're<br>
      mostly expressions of the designer's personal preferences,<br>
      something nobody cares about, or really needs to. When a<br>
      typeface is interesting, I feel it's because it transcends<br>
      the designer and becomes evocative of something that's<br>
      actually important.</p>
      <p>Think for example of all the times Legato comes up and<br>
      generates such great discourse. I think it's because it<br>
      tries to answer a question that has been consistently<br>
      posed but just as consistently given mere lip service:<br>
      the central role of notan in type.</p>
      <p>&gt; so much is being in the right place at the right time</p>
      <p>Very true. But so much more is what different<br>
      people believe, with the candid confrontation<br>
      between them being the fuel of cultural progress.</p>
      <p>hhp</p>
  - id: 116540
