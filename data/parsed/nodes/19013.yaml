      <p>I had to gallop through this thread, so may have missed some things (I'll return to it), but the operative question about the binocular 'g' has to be--to my mind at least--what has criterial cue-value toward visual wordform resolution here: closure, or the presence of a counter. I'll bet it's the latter. Perfect closure is probably secondary, but more than the typical monocular 'g' might be beneficial. </p>
      <p>The problem with the binocular 'g' is managing the saliencies around the closure point of the lower bowl so the right things (the counters) have a proper and properly coordinated cue or pop-out value / aren't compromised by the density of black action between the monocles. Or is the 'disturbed expressedness' in that area one of the things we depend on in visual wordform resolution?</p>
      <p>(Not an answer, but a playing field for addressing the issue)</p>
