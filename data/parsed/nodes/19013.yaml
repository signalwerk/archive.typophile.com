    html: <p>Gershom Soncino was the most technically capable printer of the early C16th, and he issued excellent editions of the classics and of Jewish material. He worked from the little town of Fano, and had his first types (Hebrew and italic) cut by Griffo, after the latter fell out with Aldus Manutius. This is Petrarch's 'Opere Volgari', the first book, I think, printed from the new italic.</p>
