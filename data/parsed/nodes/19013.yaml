      <p>Hi David, I've enjoyed gambolling around this pasture for several months, and have found that the effort to accept whatever Griffo made has consistently been rewarded by a new or strengthened perception of its excellence. And one's eventual feelings about what actually exists are always more reliable than those about what might exist - which is a reason for literal revivals. </p>
      <p>The evidence that the 1516er was designed all of a piece is as good as you're going to find in this period. There was certainly a press, Griffo's first; and he would have had no opportunity to use type made beforehand, and so no motive to make it (rather than, say, imagine it in detail, or even draw it). </p>
      <p>Chris, Reading's not a magic bullet, but criticism there should greatly accelerate the learning process. I'd have made this revival privately had Reading not existed, but I expect I'd have needed to take it through two or three generations and several years of trial and error before it became satisfactory.</p>
