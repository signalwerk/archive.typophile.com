      <p>As for the g, my preference would go to a monocameral g or a sesquiocular g, provided there is a reduction of the top storey size. This is, imvho, the only thing that makes the g stand out from other letters, especially if one considers that the eye will be looking at the top third of each character for identification. Once the top storey is reduced, the shape of the tail is partly irrelevant (cf Minuscule) &amp; I would favour the simplest design; the one that matches the way people currently write their g; more often than not, they do a monocameral g, with a closed loop so a monocameral g with an open loop should be easy to read.</p>
