      <p>&gt; the familiar and satisfying</p>
      <p>Do we really think laymen (as opposed to type designers who mostly naturally enjoy getting used to explicit features) are so -consciously no less- familiar with and satisfied by the closed form that they can't start reaping the benefits of the open form within an hour or whatever of first encountering it in a given text? It seems implausible to me. For example, when I show Patria to non--type-designers, nobody ever says anything about the "g". Most of them actually get embarassed because they have <cite>nothing</cite> to say about the face, good or bad - it's just another Times to them - but of course that "transparency" is the first hurdle for a text face.</p>
      <p>hhp</p>
