      <p>So that means the top counter of the (binocular) "a" should be closed too? After all, it <cite>used</cite> to be (think blackletter). But we got over it. Let's do it for the "g" too.</p>
      <p>BTW, yesterday I realized another way the open-bottom "g" can get better integrated into the whole of a face is that it has a terminal, whose shape can be like other terminal shapes (like in the "s"). I think this is significant.</p>
      <p>--</p>
      <p>Some people prefer the conventional binocular "g" because they're conservative. But other people who don't have that problem who nonetheles prefer it I think are discouraged by all the cruddy open-bottom binocular "g"s out there; type design is in large part about imitation, and there are simply far fewer good examples to emulate. It's easier to make a good closed-bottom "g" because there are already good ones out there. But its birth defect will not allow it to run the marathon. At least not without coffee breaks.</p>
      <p>hhp</p>
