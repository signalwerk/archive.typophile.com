    date_raw: 5 Apr 2006 — 5:06am
    date: 2006-04-05T05:06:00
    votes: null
    html: <p>For old-timers, impersonal greatness is the best goal, but I think the route to it lies through competence and the accurate knowledge of one's personality within the specific field. I am, at the moment, an incompetent type designer, but producing a revival at Reading should change that; it'll also help me pin down exactly what I think great and also personally resonant in Griffo's stuff - which has never been accurately revived and which deserves a numble servant to give it an honest representation to the world now. If greatness is Futura - lovely caps, pitiful lowercase - and Palatino - nicely modelled but really the opposite of civilised - then I'm not very interested.</p>
