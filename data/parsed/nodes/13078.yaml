    <p>Hey everyone,</p>
    <p>I'm working on a somewhat complex project, because it involves a large variety of alphabets with which I have no previous experience. The gist of the project involves the typesetting the phrase "I Love You" in the following languages:</p>
    <p>Afrikaans, Arabic, Basque, Bengali, Cantonese, Cherokee, Croatian, Czech, Danish, Dutch, English, Esperanto, Finnish, French, German, Greek, Hebrew, Hindi, Hungarian, Indonesian, Italian, Japanese, Javanese, Klingon, Korean, Latin, Malay, Mandarin, Mongolian, Morse Code, Norwegian, Persian, Pig Latin, Polish, Portuguese, Romanian, Russian, Sign Language, Sioux, Spanish, Swahili, Swedish, Tagalog, Thai, Tibetan, Turkish, Vietnamese, Welsh, Wolof, Zulu.</p>
    <p>I'm facing a few problems:</p>
    <p>1) For the latin face, I need a condensed sans serif. The studio I am working for is currently using Arial ( I didn't choose it), because the unicode version supported a ton of extra alphabets. I can't let that slide. At worst, I'd like it to at least be Helvetica, but if there are any other faces that also have Cyrillic, Greek and/or other alphabets, I'd like some options. Again, it needs to be condensed sans-serif.</p>
    <p>2) For the non-latin alphabets, how do I go about choosing typefaces that will go well with the latin? I don't have experience working with anything other than the latin alphabet, so I am not familiar with faces from other alphabets.</p>
    <p>Hopefully the collective wisdom of the typophile community can help me. I know a lot of you out there work with non-latin alphabets!</p>
    <p>thanks</p>
    <p>eric</p>
