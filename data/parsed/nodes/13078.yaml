      <p>&gt; something’s gotta give.</p>
      <p>I figured, but a wide 5-point font would work better<br>
      than a narrow 6-point (economy being the same).</p>
      <p>Armenian is a separate branch of the IndoEuropean family; for a long time people thought it was a dialect of Farsi (since we <strong>have</strong> borrowed a lot of words from there) but Armenian's linguistic singularity has been established for long time now. As for our script, we use a "custom" alphabet (which some claim was derived from the Greek) designed by a priest in 401 AD.</p>
      <p>hhp</p>
