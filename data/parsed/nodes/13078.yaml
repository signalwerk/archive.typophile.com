      <p>Myriad Condensed Pro will support all of the Latin-based alphabets, Cyrillic, and Greek. I think it will probably support Vietnamese, but I could be wrong. For some of the Native American languages, you may be in trouble. I'm not aware of many sans serif faces (period) that support them. I'm sure John Hudson will know better than me. The squared-off ideographic typefaces (what Japanese call "kaku" typefaces) will match reasonably well with Myriad -- Hiragino Kaku, for example.</p>
      <p>As an aside, most Klingon fonts suck horribly. I'm pretty sure Klingon has a Unicode plane (ah, no, but it does have a private use area), but I don't know of any professional designers who are depraved enough to include it in their designs. In general, you probably just want to make sure the general weight and proportions match, but good luck doing that with things like Tibetan.</p>
      <p>And to forestall Hrant, you probably ought to tack Armenian onto your list.</p>
