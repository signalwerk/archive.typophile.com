      <p>Hi Eric,</p>
      <p>For Korean, try AppleGothic that comes with OS X or Dotumche with Windows. I would not recommend Arial Unicode MS in setting the language. Also try the following sites for some other Unicode fonts:</p>
      <p>1.<br>
      David McCreedy's Gallery of Unicode Fonts <a href="http://www.travelphrases.info/fonts.html" title="www.travelphrases.info/fonts.html">www.travelphrases.info/fonts.html</a> would allow you to view some of Unicode fonts that are available. It might confuse you more as some of those fonts enlisted could be pretty ugly for the eyes of native typographers, but still very useful and helpful.</p>
      <p>2.<br>
      Alan Wood's Unicode Resources <a href="http://www.alanwood.net/unicode/fonts.html" title="www.alanwood.net/unicode/fonts.html">www.alanwood.net/unicode/fonts.html</a> is a very good compendium page for Unicode fonts. However, there is no sampling.</p>
      <p><cite>Helps me understand how the general population views typefaces.</cite></p>
      <p>Isn't it wonderful... It would be also very interesting if you could list all those names of typefaces that you carefully choose for all those different languages as an end note...</p>
      <p>Have fun.</p>
