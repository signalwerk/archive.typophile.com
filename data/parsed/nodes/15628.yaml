      <p>Don't know if adding to this four years later makes sense, but I just came upon it, and Mark's on the mark. I used to work a few doors down from OptiFonts (officially Type Films of Chicago) when their office was downtown (later moved to Chicago suburb, still operating at the second location many years later, if not still now). They sold everything from metal to film to digital fonts back then, virtually all pirated. One story I heard decades ago was how they went about pirating Headliners fonts, discovered by employees of the local Headliners franchise (The Chicago Franchise Co.). They'd order headlines set as if they were a legitimate type shop customer. One day, while setting one of the fonts stored as single character films, they realized they had used EVERY character and alternate. So they (Opti) were cut off, generally to try to continue as another customer, in Chicago or elsewhere.</p>
      <p>As to their digital copies, many are quite badly constructed fonts, rescanned and renamed to get around lax US legal restrictions. Regardless of how they LOOK, open in a font editor and see that most characters have dozens to hundreds of extra points in their outlines, some so bad they'll crash hi res RIPs. If you're unfamiliar with the original, the underlying outline drawing is probably the best way to determine, barring exact digital dupes, whether you're dealing with a pirate or an original foundry or designer. And in the case of OptiFonts, another giveaway for some is to be suspicious of font names of locations or stuff related to India &amp; S. Asia.</p>
