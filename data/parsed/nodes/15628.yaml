      <p>"Go Erik!!! :-)"</p>
      <p>thank you, and thanks to Jürgen Siebert for alerting me to this thread.</p>
      <p>I am surprised – nay: apalled – at the lack of initiative by some of the designers out there. How difficult can it be in the age of Google or myfonts.com to find out the name of the original designer? And then write to me directly to get proper facts rather than all sorts of hearsay? Not all type designers are dead and you don’t even have to go to the library or the bookshelf, like I have to when I do my research for the upcoming new edition of the FontBook. It is so easy to find at least the first traces, but you cannot rely onn the web entirely, not even on wiki. There’s too much copy-and-pasting going on. And mistakes are just as easily copied as true facts. Get a lead, then do you own fact checking. Never rely on the first source that comes along. Even Myfonts.com just publishes what they come by, and that is not necessarily always true. Nobody can double- and treble check all the 30,000 plus fonts out there, but at least we try.</p>
