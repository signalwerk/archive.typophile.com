    <p>Dear Typohiles,</p>
    <p>We have been working with a UK Insurance company over the last couple years assisting them with  their new brand.  Up until last week, they had more or less decided that they were going to implement FF Meta on a corporate wide basis.  One of their Marketing team was then sent a TrueType font called Lexus Opti.  We compared Lexus Opti with FF Meta, and the resemblance bewtween the two typefaces was uncanny. Now I became very suspicious that someone had just basically saved Meta and renamed it as Lexus Opti and passed it off as their own design!</p>
    <p>I have since learnt that Opti fonts are in fact valid commercial fonts, but they have not been updated in the last 15 years, and would not be supported.</p>
    <p>I need to come up with some further argument points for our customer, not to go with Lexus, but<br>
    embrace FF Meta.</p>
    <p>Can anyone please help me with this, with regards to the technical unsuitability of the Opti fonts and provide a history of this range of Opti typefaces.</p>
    <p>Look forward to hearing from you</p>
    <p>Kind regards<br>
    Neil<br>
    Terrapin Solutions</p>
