      <p><em>Funny. They appear to be the remnants of an old compnay that used to do type casting here in Chicago. </em></p>
      <p>That company has a legacy of font piracy going way back before digital type. "Type Films of Chicago," part of the same company, offered a huge library of duplicated and renamed ("similar to") film fonts which they sold to type houses. If you look at one of their old catalogs, you can even spot a character here and there that is backwards or upside down or the wrong weight. The originators of some fonts did this to determine who, among their customers, were pirates.</p>
