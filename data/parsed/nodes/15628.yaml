      <p>Neil was asking for good arguments to encourage his people to NOT use the cheapo font. I think its fabulous that Erik can give him immediate feedback in such strident language. Our type team keeps trying to fight the good fight here at MegaCorporation, but we often run into just exactly what Neil is running into from people way higher on the corporate totem pole than us minions.</p>
      <p>In fact, I just got a job in from a not-to-be-named outside vendor that used OPTIDianna, which is a rip-off of Elsner+Flakes Ballantines faces. We were able to stop that one in its tracks. We ordered Ballantines for ourselves and forced our vendor to do the same. Score one for the font police.</p>
      <p>kristin</p>
      <p>P.S.: there IS a website that has an order form to purchase these font on-line or via phone but I'm not posting the URL here!</p>
