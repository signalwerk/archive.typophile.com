      <p>Lexus Opti is probably FF Meta, just renamed. Meta is the corporate font for the Lexus brand, and about 18 months ago i made special kerning pairs on behalf of the agency's art director in LA. I suppose they paid a license to FSI which gives them the right to rename the font. It does not, however, give anyone the right to sell the font under this new name. The copy you have is thus a double rip-off: someone stole it from Lexus or their agency who have signed a contract which only licenses it to them. So Lexus could get sued by FSI, and whoever copied the font could be sued both by Lexus and by FSI. </p>
      <p>Anyway: how could you even consider using a font for business whose legal provenance you cannot ensure? “One of their Marketing team was then sent a TrueType font” - what sort of procurement is that? Tell you client to stay away from illegal software, as it’ll cost them. Especially now that i know about it.</p>
