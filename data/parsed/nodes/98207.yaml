    html: |-
      <p>I had that Letraset catalog. I don't remember printers having anything against Letraset. It was very popular with designers who didn't have a big enough budget to work with a type house (that was me almost always before desktop publishing came along). The quality was very good, and with a little skill you could do better setting than a commercial type house. That said, Letraset was not considered cheap. A sheet of Letraset in 1979 cost about $9, almost $30 in 2012 dollars. And unlike a modern digital font, you ran out of letters pretty quickly and only got one point size per sheet.</p>
      <p>Letraset advertised in graphic design magazines, as did most typesetting houses and manufacturers. I don't believe type advertising has ever been directed at the general public. Seems like it would be total a waste of time and money, even nowadays, when anyone with a computer is technically a type user.</p>
