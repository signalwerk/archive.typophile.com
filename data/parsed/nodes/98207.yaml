      <p>Nice, Nick.  I'm old enough to remember using the Selectric, it was a great typewriter and the interchangeable fonts was nice.</p>
      <p>&gt; The mainstream demographic aren't interested in fonts</p>
      <p>Well I think many folks are interested to some degree, but since a selection of basic fonts comes preinstalled on their computer and tons of novelty fonts are available for free downloads, they probably just don't see the need to actually buy one.</p>
      <p>Even if a particular commercial font became a hot item with the general public, similar-looking knockoffs would be available for free download within a few days.</p>
