    html: |-
      <p>"THE BEST OF BLONDIE": confirming <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/quest-rr/" rel="nofollow">Quest</a><br>
      First sample song titles and text: possibly <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/optima" rel="nofollow">Optima</a><br>
      Second sample song titles: <a class="freelinking external" href="http://www.myfonts.com/fonts/softmaker/adelon-serial" rel="nofollow">Adelon</a> is Softmaker version of <a class="freelinking external" href="http://www.myfonts.com/search/albertus" rel="nofollow">Albertus</a> (see <a class="freelinking external" href="http://typophile.com/node/93218#comment-510520" rel="nofollow">here</a> for more implementors of it). Bitstream version <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/flareserif-821" rel="nofollow">Flareserif 821</a> is another option to get such boldness. There are also <a class="freelinking external" href="http://typophile.com/node/27712" rel="nofollow">some extra-bold versions of Albertus</a> (Alaska) shipped by HP and Brother with their laser printers.</p>
    html_clean: |-
