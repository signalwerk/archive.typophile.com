    html: <p>I have been to establishments where reading glasses were provided, and may I recommend that you have your waiters carry quality styles, such as <a href="http://www.readinstyle.com/catalog/Eyebobs.aspx" rel="nofollow">EyeBobs</a>. There is nothing like getting ready to order a $45 entree and a $200 dollar bottle of wine, only to have the waiter pull out a pair of cheap dollar store readers to help me see the menu. Now, if the waiter presents me with a nice pair of glasses to assist me, I feel like royalty. And isn't that what you want in an upscale restaurant, to have your customers feel like royalty?</p>
