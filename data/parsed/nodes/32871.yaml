    <p>Hello all.. I would like to know your thoughts on this dinner menu layout for an upscale, white tablecloth, quaint, 20 table restaurant that is housed in a structure built in 1848. The building almost feels castlesque with it's large stone walls and arch in the main dining room which is one of the focal points of the architecture. Pictures of the building can be found here <a href="http://www.gumbosroundrock.com/home" target="_blank" rel="nofollow">Gumbo's</a> and throughout the site. To give you a little more input, silverware is placed for each course of the dining experience.</p>
    <p>About my layout: I decided on Poetica because the styling of the face enhances the experience by playing off the ambiance of the building. The renaissance styling is a hit and this restaurant is rather elegant with amazing dishes. I also thought I remembered reading that this typeface was based off an old face from France.</p>
    <p>This is my first time setting Poetica, so I don't know the hard and fast rules concerning mixing the different versions of Chancery, and how much is too many swirls and swooshes? I'm sure there are errors all over these pages, but please let me know what someone more experienced would have done in my situation. </p>
    <p>There are still a couple of kinks to be worked out.. ie margins, and food descriptions/wording. </p>
    <p>Thanks in advance.<br>
    dolch</p>
