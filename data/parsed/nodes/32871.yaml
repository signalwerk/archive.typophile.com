      <p><cite>† indicates a premium [dead fish?]</cite> (of course, the asparagus will be dead when served)<br>
      No offence intended (I just couldn't resist), but perhaps you should change the footnote mark for something different (* or + or § or something the like). I agree that the dish titles are hard to read, but you could as well leave them as is because noone will recognise them (if you read the menu then you'll probably get the idea yourself that a tenderloin might be a steak and don't need this information). But perhaps it would be good to ask some potential (or even existing) customers for a test (if they complain, there is evidence that there has to be a better way to do it).</p>
