      <p>My only suggestion would be to take a mock up of the menu into the actual restaurant and try to read it in the available light, especially at night, when most restaurants do the bulk of their business. In many cases the light is fairly low, which can make reading difficult, particularly for older viewers. I'm only on my 40s, but I've had trouble reading menus in some restaurants. So, often larger type is better in this setting. Something to consider anyhow. Best wishes.</p>
      <p>Paul Nini<br>
      Dept of Design<br>
      Ohio State Univ</p>
