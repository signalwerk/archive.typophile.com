      <p>I'll second all of the comments that have been made -- I'd never be able to read this in a restaurant because it's just too darned small.  (good thing I keep a small flashlight in my purse!)</p>
      <p>Stephen's idea of running a focus group is brilliant: if they've got a few regulars, the resto should bring them in (maybe on a Saturday afternoon), sit them down with some appetizers, and let them look at several different mock-ups.  </p>
      <p>My experiences in doing this is that you get a much more accurate menu (since most people want (edit: to know) what the food is, not a bunch of touchy-feely descriptions), and happy patrons -- good word-of-mouth beats any other kind of PR anyday....</p>
