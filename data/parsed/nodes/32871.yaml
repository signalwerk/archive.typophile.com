      <p>Very classy yet unique.</p>
      <p>This might be heretical for the tone, but I wonder if a bold humanist sans might work better for the dish titles. Now, the page looks somewhat gray, and my eye flits around too much without settling on the important bits.</p>
      <p>Give some though to line breaks. Especially in menus, you might want to have, say, "creamy" and "garlic" on the same line. It all depends on the emphasis; menu design is a bit like poetry in that way.</p>
      <p>I'd tone down the swashes. Maybe use them only at the start &amp; end of each phrase? And I'd avoid the swashy g, s and e -- to me, they look too much like they've got misplaced accents.</p>
      <p>The prices get a bit lost.  Perhaps an em space before them instead of just a word space?  These, too, could be in the same sans, although that might be too much, and *too* much emphasis on the prices. Worth a try, though.</p>
      <p>You use at least two dingbats, all of which are a tad large and complex for their purpose as a separator. I suggest using a single small but graceful dingbat.</p>
      <p>Also, make sure you do a spelling check.  Avocado, at least, is spelled wrong.</p>
      <p>Hope this helps!</p>
      <p>--John</p>
