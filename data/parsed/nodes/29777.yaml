    <p>Hello everybody,</p>
    <p>wow, it has been a long time since my last post here.<br>
    I am back to you with quite an easy question for the ones, who do this. Just look over your shoulder: what books do you recommend for those, working on the concept, both visual and business, of a magazine?</p>
    <p>To this moment I have purchased:<br>
    "How Now to Start a Magazine" by B.Ann Bell (already read)<br>
    "Starting and Running a Successful Newsletter or Magazine" by Cheryl Woodard (now reading)<br>
    "Merz to Emigre and beyond" by Steven Heller</p>
    <p>From me summer reading I will most probably re-read "The Education of an Art Director" by Steven Heller. "Exercises in Style" by Raymond Queneau will probably also be purchased on the nearest occasion.</p>
    <p>But I guess, there are more, which are worth investing in. Or are there?</p>
    <p>Thanks a lot!</p>
    <p>Cheers,<br>
    Alexey</p>
