      <p>For some creative inspiration, check out "Magazine Design That Works"  and "Publication Design Workbook," both published by Rockport. Timothy Samara wrote "Publication Desing Workbook" and you seem to be a fan of his work ("Making and Breaking the Grid" was by him), so maybe that's a good fit.</p>
