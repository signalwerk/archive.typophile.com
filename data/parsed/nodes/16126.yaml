      <p>one reality is that you simply do not need to license new type for every project. it is possible to use the same group of well chosen (and properly licensed) type families for many projects. any designer who thinks they can't possibly do this needs to stop and start again. </p>
      <p>it is understandable, however, that one might want to experiment. that said, it shouldn't be at the expense of the type designers. </p>
      <p>the best thing you can do is allot a certain amount of money in a given time period specifically for licensing type. make a list of fonts you would like to -- albeit slowly -- license. budgeting is key. (if not you'll end up like me, so much type and very little credit.)</p>
      <p>mason, if you think hrant was mean, be glad that yves or myself didn't answer the call first. =^&gt; in the grand scheme of things, typefaces aren't expensive. sure, there are foundries whose type i can but covet from afar as i'll never have (well perhaps someday) a budget for them. but think of it this way:</p>
      <p>if you started a logo project for a client. and they suddenly disappeared after only haven given you a deposit and yet weeks later you see a truck driving down the road with one of your ideas for them on it. how would you feel? typefaces are less expensive than logos. </p>
      <p>we are in a business that requires certain tools. yes, we have to pay rent and buy food and pay utilities. but we chose our career and so we chose the expenses that go along with it.</p>
