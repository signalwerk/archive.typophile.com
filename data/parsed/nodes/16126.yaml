      <p>as i speak german, i can give you a bit of help. gerrit writes essays about fonts, named "type of the day". mostly they're free fonts (i mean really free, no ripoffs or something), and he always writes something about the law-aspect of it. how you may use it and not, etc. </p>
      <p>union was built by Morten Rostgaard Olsen who also designed - right, you guessed it - FF Olsen. this was a "spin-off" designed (or released?) for the danish ministry of culture.</p>
      <p>apparently, this ministry had this font as a download on its page, with the EULA only in danish. so he assumed it was free (yes, i know.. he shouldnt..). then, someone got him an english version of this eula, and there is the sentence "these fonts may be used in projects related with the danish ministry of culture. for other uses, please contact M.R. Olsen. Adress: [...]". </p>
      <p>after a while, the site was updated and there was just a notice to contact mr. olsen directly if you would want to use it.</p>
