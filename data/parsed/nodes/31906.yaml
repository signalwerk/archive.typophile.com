    <p>Hi peeps, I've put together a small TextMate bundle (<a href="http://macromates.com/" rel="nofollow">TextMate</a> is a text editor for Mac OSX). This should give some syntax highlighting and a couple of snippets to make editing .fea files a bit more pleasurable.</p>
    <p>You can grab it here: <a href="http://www.lowest-common-denominator.com/2007/03/typeface_development_bundle_fo.php" rel="nofollow">Typeface development Bundle for TextMate</a></p>
    <p>Let me know if it makes your computer explode or if I've missed something obvious.</p>
