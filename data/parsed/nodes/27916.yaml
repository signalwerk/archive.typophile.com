      <p>Geometric 415 is Metro by another name. I think a lot of these fonts are inspired by it.</p>
      <p><a href="http://www.myfonts.com/fonts/bitstream/geometric-415/" title="http://www.myfonts.com/fonts/bitstream/geometric-415/">http://www.myfonts.com/fonts/bitstream/geometric-415/</a></p>
      <p>It lacks the double story 'a' of Verlag, tho.</p>
      <p>Here's Nobel - it was my longstanding crush but I think it's been replaced by Verlag.</p>
      <p><a href="http://www.fontbureau.com/fonts/Nobel" title="http://www.fontbureau.com/fonts/Nobel">http://www.fontbureau.com/fonts/Nobel</a></p>
