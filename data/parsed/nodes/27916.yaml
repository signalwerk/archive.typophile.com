  html: <p>Looking for sans recommendations. I like the friendliness of Neutra. Love the Los Angeles magazine font (name?). Or the one Vanity Fair uses in rubrics and elsewhere (again, name?). My favorite pick so far with a similar vibe is Verlag. Which fonts am I overlooking?</p>
