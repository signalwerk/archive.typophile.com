      <p>Hi Mindy. There was this post recently about Neutra; <a href="http://typophile.com/node/21343" title="http://typophile.com/node/21343">http://typophile.com/node/21343</a></p>
      <p>Paul's already mentioned Proxima Sans, but in context of 'a lookalike to Neutra' I would recommend <a href="http://www.ms-studio.com/FontSales/mostra.html#" rel="nofollow">Mostra</a> by the very same, very talented Mark Simonsen.</p>
