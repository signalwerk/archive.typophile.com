  html: |-
    <p>Hello! </p>
    <p>A newbie question: How do I make guidelines appear in all glyph windows at the same time? Currently, when I add a guideline, that guideline is only visible to the current glyph I'm working on. I need to add certain guidelines to mark certain common points across all my glyphs, let's say the height of stress marks/accents and so on... I haven't figured yet how to do this )</p>
    <p>Thanks a lot!</p>
