    <p>I am working on a project that requires some 1950s/60s typefaces (or something that looks very similar). The project relates to jazz music of the era so any retro and/or jazzy typeface recommendations are welcome.</p>
    <p>I have this image with some type I'd like to imitate. Especially the "Sound Magic" in the third row. Can anyone id any of these faces?</p>
    <p>Thanks.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jazzlofttapeboxesfull_3415.jpg"></div><p></p>
