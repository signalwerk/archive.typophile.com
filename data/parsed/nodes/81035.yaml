      <p>Most of these scripts and display typography are hand lettering, not type. If you want to emulate it with fonts, Aaron has a good suggestion. Also:<br>
      <a href="http://www.houseind.com/fonts/styles/script" rel="nofollow">Script</a> and <a href="http://www.houseind.com/fonts/styles/brush" rel="nofollow">Brush</a> styles from House Industries<br>
      <a href="http://www.fontshop.com/fontlist/periods/fifties/?affid=99346" rel="nofollow">1950s</a>, <a href="http://www.fontshop.com/fontlist/genres/casual_brush_script/?affid=99346" rel="nofollow">Brush Scripts</a>, and <a href="http://www.fontshop.com/fontlist/genres/casual_brush_sans/?affid=99346" rel="nofollow">Brush Sans</a> at FontShop<br>
      <a href="http://www.fontshop.com/fonts/downloads/sudtipos/bluemlein_complete_collection/?affid=99346" rel="nofollow">Bluemlein</a> and <a href="http://www.fontshop.com/fonts/downloads/sudtipos/retro_scripts/?affid=99346" rel="nofollow">Retro Scripts</a> from Sudtipos</p>
