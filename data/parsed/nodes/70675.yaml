    html: |-
      <p>More Baker Sans stuff... There were three styles: Fineline, Display and Monoline. Notice that the Monoline is practically identical to Helvetica. The other two differ in the amount of stroke contrast. It's an interesting concept, but I've rarely seen any of them in use. Not too common in type specimen catalogs, either. At least the ones I have. I think the designer may have been Ray Baker. Probably not Arthur Baker, but I really don't know. I don't think any of them have been digitized.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bakersans002_3466.jpg"></div><p></p>
    html_clean: |-
