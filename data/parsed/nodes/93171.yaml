    html: |-
      <p>If Wisdom Script is not itself derived from another source then you should have no trouble getting Thirsty Script removed from MyFonts (although it would certainly help your case if Wisdom were on MyFonts). We saw that sort of thing happen recently (in fact due to "activism" here on Typophile).</p>
      <p>However, since Thirsty is -by your own gracious admission- an improvement on Wisdom there might be another way to both reward at least that part of the effort, and acquire proceeds that you're entitled to: get Yellow to pass along maybe 50% of the sales. BTW if such an amicable resolution does work out make sure it becomes public information (although the percentage can remain private).</p>
      <p>Speaking of things like karma, even if you might not care too much about the money (as indicated by your Honorware* sales model) there's one very good reason to not let this slide: promoting ethical behavior in type design as a whole.</p>
      <p>* <a href="http://typophile.com/node/10206" title="http://typophile.com/node/10206">http://typophile.com/node/10206</a></p>
      <p>hhp</p>
