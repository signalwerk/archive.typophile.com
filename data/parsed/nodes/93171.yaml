      <p>Hi- I'm a little late to the discussion, but I'd like to throw my 2 cents in anyway. I'm the designer of Thirsty Script.</p>
      <p>I have to admit I've made some mistakes in this process and definitely should have handled things differently. James and I have worked out an agreement and Thirsty Script is back up on MyFonts and Fontspring. </p>
      <p>I'd just like to say my intentions with Thirsty Script were absolutely not to "rip off" Wisdom Script, or to make a quick buck on his efforts, etc. Originally my thought was to try and marry the edginess of Wisdom with the roundness and approachability of Lobster and mix in my own sensibilities and innovation to create something new and unique. </p>
      <p>On its release I felt like I was successful in doing this, although in hind-sight I admit to being a little myopic. The hostility that Thirsty Script garnered definitely took me by surprise, and I think this is a tribute to James' passionate following. Truth be told I'm a bit offended when Thirsty is referred to as a "plain rip-off", and I think if someone takes the time to really compare the fonts and their shapes and their differences they wouldn't feel this way. </p>
      <p>That being said, at the same time I do understand James' objection, as maybe the finished product is too close for comfort, and I'm happy we've reached an agreement as Wisdom Script certainly did provide much of the inspiration for Thirsty Script.</p>
