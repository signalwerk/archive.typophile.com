    html: |-
      <p>Hi guys, thanks for the thoughtful discussion around this topic.</p>
      <p>It's true, I'm working on putting more information out there about the design and process behind each of my fonts, and Wisdom Script was my first release. </p>
      <p>I am a little bit unsure of what action to take (if any) on this typeface. I emailed the designer a bit, and he admits that Wisdom Script was the primary inspiration. It's obvious to me that he just set out to improve upon my design. Which he did, I admit that. </p>
      <p>I wasn't referencing anything in particular when i was drawing it, I just wanted it to work well on an incline, and because I was <a class="freelinking external" href="http://woodsofwisdom.info/" rel="nofollow">cutting all the shapes out of balsa wood with an exacto knife</a>, the sides of each lowercase letter were straight (it's easier to cut straight, going with the grain of the wood, than to cut a curve). The capitals in Wisdom are a sort of geometric interpretation of my handwriting, which is influenced by any number of different typefaces, lettering styles, signs, and logos.</p>
      <p>Most of the letters in Thirsty Script are rooted in Wisdom's design. I've heard that if more than 30% of a piece of work is referencing another work, then that is stealing. About 75% of Thirsty Script seems to reference Wisdom, if I were to make a wild guess.</p>
      <p>He did not credit Wisdom at all, or ask for permission. Is it worth the effort/ bad karma to go after Thirsty? Or is it actually good karma because I'm taking a stand for my work? These are questions that I have not made up my mind about. Any opinions you guys have to offer would be sincerely appreciated. Thanks again for posting this. It's an honor to be part of a community that values creativity, and artists' rights.</p>
