    <p>This <a class="freelinking external" href="http://www.myfonts.com/fonts/yellow-design/thirsty-script/" rel="nofollow">font</a> has just been offered on MyFonts. Now I like their Veneer typeface, but you can't tell me, this is not a plain rip-off of <a class="freelinking external" href="http://www.losttype.com/font/?name=wisdom%20script" rel="nofollow">Wisdom Script</a>... </p>
