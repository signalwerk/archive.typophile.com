      <p>Thanks James for commenting</p>
      <p>I certainly think that the least you should get is a percentage, and otherwise have it taken down. And you should also demand to be credited for the design. IMHO the work done on the design might make it better (language support, complete character set) but the design is very much yours. The weights are automatically interpolated, without much optical refinement, so there is not much original design in there. I don't think it is kosher to go about this way by Yellow, making money with your design.</p>
      <p>Even if the design is improved, there are still other ways to do this, for instance Roger Nelsson has Cheap Pro Fonts (hate the name...but still) which creates improved and expanded versions of free fonts (I know yours is not free in this sense), but always does so with permission, with all credit to the original designer, under the original name (I don't know if the designers get a percentage, but others here should be able to provide info on this, (Oldnick?))</p>
      <p>I hope there is a way to resolve this without removing Thirsty, it's up to you, but I think you should at least take action, even if only for ethical reasons...</p>
