      <p><em>(I don't know if the designers get a percentage, but others here should be able to provide info on this, (Oldnick?))</em></p>
      <p>Roger splits the proceeds fifty/fifty, which is eminently fair and an additional—if relatively small—revenue stream I would not otherwise have.</p>
      <p>As to the design dispute: MyFonts.com usually acts on complaints about design infringement, no questions asked. The gentlemanly thing to do would be to try to resolve the problem with Yellow Design before lodging a complaint; if he/she/they are cooperative, you may be able to devise a win-win scenario. If you meet resistance, then you can ask MyFonts to pull the plug.</p>
