    html: <p>Right, but what I was saying in my first reply is that you can avoid the whole problem with adding figure variants to the fraction code by putting the frac feature before features like onum, etc. That way, the frac feature only has to deal with the default figures. Adding all the different figure styles to the frac feature would add some unnecessary complexity to the feature code (unless maybe you have fractions with old style figures or something, which I don't think is the case, right?).</p>
