    html: |-
      <p>The order makes a difference, and you can use it to your advantage (or at least need to be aware of the implications). You can change the order (in FontLab) by dragging the features up and down in the list on the left side of the OpenType Panel. </p>
      <p>BTW, when you add a new feature, it gets placed just before (above) the currently selected feature. If you know where you want it to go in the list, you can use this to save the step of moving it. Note: You need to hit the "compile" button to get it to stay in this initial spot, otherwise it will get moved to the end when you save. I have no idea why, but that's how it works.</p>
    html_clean: |-
      <p>The order makes a difference, and you can use it to your advantage (or at least need to be aware of the implications). You can change the order (in FontLab) by dragging the features up and down in the list on the left side of the OpenType Panel. </p>
