    html: |-
      <p>@ frode frank</p>
      <p>I think, it is a bad idea to substitute "numr fraction dnom" by prebuilt fractions, because the user can’t change the kerning to the fraction anymore.</p>
      <p>My code:</p>
      <p><code>@lnum=[zero.fitted one.fitted two.fitted three.fitted four.fitted five.fitted six.fitted seven.fitted eight.fitted nine.fitted];<br>
      @t_lnum=[zero.tab one.tab two.tab three.tab four.tab five.tab six.tab seven.tab eight.tab nine.tab];<br>
      @onum=[zero one two three four five six seven eight nine];<br>
      @t_onum=[zero.taboldstyle one.taboldstyle two.taboldstyle three.taboldstyle four.taboldstyle five.taboldstyle six.taboldstyle seven.taboldstyle eight.taboldstyle nine.taboldstyle];</code></p>
      <p><code>@numr=[zero.numerator one.numerator two.numerator three.numerator four.numerator five.numerator six.numerator seven.numerator eight.numerator nine.numerator];<br>
      @dnom=[zero.denominator one.denominator two.denominator three.denominator four.denominator five.denominator six.denominator seven.denominator eight.denominator nine.denominator];</code></p>
      <p><code>@prebuilt_frac = [onequarter onehalf threequarters];</code></p>
      <p><code>feature numr {#G_S_U_B-Tag<br>
      	lookup NUMR {<br>
      		sub @onum by @numr;<br>
      		sub @lnum by @numr;<br>
      		sub @t_onum by @numr;<br>
      		sub @t_lnum by @numr;<br>
      	} NUMR;<br>
      } numr;<br>
      #---Numerators</code></p>
      <p><code>feature dnom {#G_S_U_B-Tag<br>
      	lookup DNOM {<br>
      		sub @onum by @dnom;<br>
      		sub @lnum by @dnom;<br>
      		sub @t_onum by @dnom;<br>
      		sub @t_lnum by @dnom;<br>
      	} DNOM;<br>
      } dnom;<br>
      #---Denominators</code></p>
      <p><code>feature frac {#G_S_U_B-Tag<br>
      	lookup NUMR;<br>
      	sub slash by fraction;<br>
      	#Alternatively to sub slash by fraction<br>
      	#ignore sub [one.numerator two.numerator three.numerator four.numerator five.numerator six.numerator seven.numerator eight.numerator nine.numerator] slash' zero.numerator;<br>
      	#sub slash' by fraction;<br>
      	#sub slash zero.numerator' by question;<br>
      	sub zero.numerator fraction zero.numerator zero.numerator by perthousand;<br>
      	sub zero.numerator fraction zero.numerator by percent;<br>
      	sub [fraction @dnom @prebuilt_frac] @numr' by @dnom;<br>
      } frac;<br>
      #---Fractions</code></p>
