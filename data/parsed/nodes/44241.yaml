  html: |-
    <p>i have a stylized bicycle <a class="freelinking external" href="http://img512.imageshack.us/img512/8021/bikeanavx0.gif" rel="nofollow">http://img512.imageshack.us/img512/8021/bikeanavx0.gif</a> to which i will be adding text reading "city express".</p>
    <p>the bike's so girly i think i need a script font (catholic schoolgirl comes to mind) whose lines blend well with the design. at the same time, "city express" should reflect the idea of fast movement, like a courier service would want to convey. to express this angle of the idea, i'm tempted to use a font that can be italicized/slanted (to convey movement), but script fonts aren't well suited to italics, as far as i know.</p>
    <p>any suggestions? a script that works to convey movement, or a girlier font that can be italicized.</p>
    <p>thank you in advance. i don't come to this board often but i'm always impressed by the level of discussion here.</p>
