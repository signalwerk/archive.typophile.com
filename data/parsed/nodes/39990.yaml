      <p>I don't mean to overstep my bounds, because I am by all rites a noob here. However, I worked in a production studio basically owned/operated by the ad agency responsible for Marlboro Racing, Outdoor, Print and the like. I was always under the impression that the font was custom made for Marlboro. The names of the fonts are: Marlboro and Marlboro CBC Display.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Marlboro_4609.jpg"></div><p></p>
