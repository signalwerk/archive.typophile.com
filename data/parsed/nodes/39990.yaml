  - id: 246060
    user: 1085
    date: null
    date_raw: null
    votes: null
    html: <p>Neo Contact is an old ATF face, from at least the 1950s. It existed before digital type, and Marlboro must have used it before digital type, too. I suspect that Marlboro's fonts are branded, i.e., they are Neo Contact with minimal changes, different interletter spacing, especially for size considerations, etc, and above all, a name change. This make people feel better when they are using the font. But its the same face… everyone and their parents may not be able to get a hold of the fonts with "Marlboro" in their names, but for 20-odd bucks, they can get as close as branding guidelines'll allow.</p>
    html_clean: <p>Neo Contact is an old ATF face, from at least the 1950s. It existed before digital type, and Marlboro must have used it before digital type, too. I suspect that Marlboro's fonts are branded, i.e., they are Neo Contact with minimal changes, different interletter spacing, especially for size considerations, etc, and above all, a name change. This make people feel better when they are using the font. But its the same face… everyone and their parents may not be able to get a hold of the fonts with "Marlboro" in their names, but for 20-odd bucks, they can get as close as branding guidelines'll allow.</p>
