  - id: 47050
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>I don't know much about resources for learning those specific languages, but one piece of general advice I can give is that <i>sound</i> is where it is. Unless you're only going to use a language to read stuff (which is valid for Latin though) lean more towards hearing and speaking, rather than learning rules. Trust your brain to sort things out over time, \"naturally\". For one thing, that will help your accent a lot. So after you lay a basic foundation (like getting familiar with the elemental sounds of the language, and understanding some basic words and phrases) jump right in: find a local community who speaks the language (restaurants are always a good starting point) and strike up conversations. Don't be self-conscious, people generally love it when you want to learn their language, especially when you do it with gusto, as opposed to using a \"clinical\" approach. <br> <br>For history, culture and art though, books and websites can be much more helpful. <br> <br>For type, lettering and calligraphy, the LCT book is a must, and then there's these specific works: <br> <br>Arabic: \"Arabic Script\" by G M Khan. <br> <br>Hebrew: \"The Book of Hebrew Script\" by A Yardeni. <br> <br>Greek: Nothing like the two above that I know of, but \"Greek Letters: from tablets to pixels\" is chock-full of great insight. <br> <br>Russian: I don't know of any, but I suspect there must be something decent. Adam Twardoch once pointed out a great 4-part web resource about Cyrillic type design, but I forget where it is. It was in Russian however - although an automatic online translation managed to make it 90% intelligible to me... and 100% entertaining! <br> <br>Latin: I don't think there are any.  ;-&gt; <br> <br>hhp</p>"
    html_clean: "<p>I don't know much about resources for learning those specific languages, but one piece of general advice I can give is that <i>sound</i> is where it is. Unless you're only going to use a language to read stuff (which is valid for Latin though) lean more towards hearing and speaking, rather than learning rules. Trust your brain to sort things out over time, \"naturally\". For one thing, that will help your accent a lot. So after you lay a basic foundation (like getting familiar with the elemental sounds of the language, and understanding some basic words and phrases) jump right in: find a local community who speaks the language (restaurants are always a good starting point) and strike up conversations. Don't be self-conscious, people generally love it when you want to learn their language, especially when you do it with gusto, as opposed to using a \"clinical\" approach. <br> <br>For history, culture and art though, books and websites can be much more helpful. <br> <br>For type, lettering and calligraphy, the LCT book is a must, and then there's these specific works: <br> <br>Arabic: \"Arabic Script\" by G M Khan. <br> <br>Hebrew: \"The Book of Hebrew Script\" by A Yardeni. <br> <br>Greek: Nothing like the two above that I know of, but \"Greek Letters: from tablets to pixels\" is chock-full of great insight. <br> <br>Russian: I don't know of any, but I suspect there must be something decent. Adam Twardoch once pointed out a great 4-part web resource about Cyrillic type design, but I forget where it is. It was in Russian however - although an automatic online translation managed to make it 90% intelligible to me... and 100% entertaining! <br> <br>Latin: I don't think there are any.  ;-&gt; <br> <br>hhp</p>"
