    html: <p>sorry for bing such a jackdonkey, but that's how i learned what russian i know and the little spanish i have command of.  <br> <br>For Russian and Arabic, you can probably find decent books like <a href="http://www.amazon.com/exec/obidos/ASIN/0071396748/qid=1095805481/sr=ka-1/ref=pd_ka_1/104-0239347-4615163" target="_blank"> this one</a> in the Teach Yourself series. I have the Polish and Hindi books from this series, but haven't been that diligent in studying them. But they seem to take a good approach. I dunno where to start for Hebrew, Latin &amp; Greek , though. I'm sure there are some good books out there for those ones too, but I couldn't make any recommendations.  <br> <br>hope that's of some help at least! <br> <br>oh, and nothing helped my russian more than living in St. Petersburg for 3 months, but if you don't wanna pack yer bags i guess that's outta the question.</p>
