    html: <p>I would think about where your customers are likely to be. If you are expecting most of your sales to come from wealthy nations, you can probably stick with Opentype. But if you expect to sell type in places where people have less to spend and are still getting by with old computers, old operating systems, and old software, also selling Type 1 seems worthwhile.</p>
