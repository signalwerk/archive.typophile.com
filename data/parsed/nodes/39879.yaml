  - id: 245227
    user: 1844
    date: 2007-12-07T17:22:00
    date_raw: 7.Dec.2007 5.22pm
    votes: null
    html: <p>It also depends on the scripts and languages your typeface covers. I wouldn’t generate Type 1 fonts that go outside the <a href="https://web.archive.org/web/20080821152220/http://en.wikipedia.org/wiki/ISO_8859-1">Latin-1 encoding</a>, simply because the Type 1 format only allows you to encode 256 characters and ISO_8859-1 (a.k.a. Latin-1) matches exactly the first two Unicode blocks (Basic Latin and Latin-1 Supplement).</p>
    html_clean: <p>It also depends on the scripts and languages your typeface covers. I wouldn’t generate Type 1 fonts that go outside the <a href="https://web.archive.org/web/20080821152220/http://en.wikipedia.org/wiki/ISO_8859-1" class="link-external">Latin-1 encoding</a>, simply because the Type 1 format only allows you to encode 256 characters and ISO_8859-1 (a.k.a. Latin-1) matches exactly the first two Unicode blocks (Basic Latin and Latin-1 Supplement).</p>
