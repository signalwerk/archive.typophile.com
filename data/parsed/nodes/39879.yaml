    <p>Hi,<br>
    When generating and publishing a typeface family is it a “Must-Do” to also generate PS type-1 fonts? Or is it sufficient to publish OT-fonts only since thats the future anyway. I have noticed that Adobe only sells their fonts as OT. So why should anyone else do it? Is there a large group of customers that need type-1 or do they only buy them because they don’t know the difference or because that’s what they have always bought?</p>
    <p>Regards,<br>
    Henning</p>
