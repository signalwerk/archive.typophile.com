    html: |-
      <p><em>People who have older systems in place and are getting good results or need to set up clients to use a font when they don’t have the right applications might want a Type 1 option.</em></p>
      <p>And then one day a client comes along who wants them to use a specific typeface, or a custom typeface, that is only available in OpenType and requires use of Unicode text and OpenType Layout, and suddenly the whole workflow becomes untenable. I’ve seen this recently in the particularly problematic case of a design agency using hack encoded Type 1 fonts for Hindi with proprietary InDesign plug-ins. Their entire workflow is based around this system, and it is a major obstacle to use of new typefaces. Needless to say, it is also an obstacle to text interchange, since the hack encoding is completely non-standard, recognised only by this plug-in, and not cross-platform compatible.</p>
