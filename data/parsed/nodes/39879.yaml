      <p>Type 1 has inertia.<br>
      Adobe can afford to not sell that format (in fact, it’s in their interests to migrate users to OpenType), but foundries would be foolish to turn their noses up at customers who want it.<br>
      So we make new fonts available in the legacy format, and people keep buying.</p>
      <p>Type 1 has legs, economically.<br>
      OpenType has introduced a price differential into the market—Type 1 licences cost less than OpenType.<br>
      They may not be such good value for money, but if you don’t need all the bells and whistle...</p>
