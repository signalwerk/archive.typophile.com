    html: |-
      <p>&gt; <em>Adobe can afford to not sell that format</em></p>
      <p>Actually, users can still license Type 1 fonts through Adobe’s Type Store; they’re just a little bit harder to find*. They’re still made available mainly for legacy reasons, i.e. if a user really needs those old versions for whatever reason, he can still get them.</p>
      <p>*and some families don’t have Type 1 versions at all</p>
      <p>&gt; <em>in fact, it’s in their interests to migrate users to OpenType</em></p>
      <p>Adobe finished converting its whole library to OpenType in 2003, and stopped developing Type 1 fonts in 1999. The Type 1 format is almost 25 years old and is unsuitable for today’s typographic and technological needs. That said, migrating to OpenType should, in fact, be of *everyone’s* interest.</p>
