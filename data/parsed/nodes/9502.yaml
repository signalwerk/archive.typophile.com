    html: "<p><i>HUMANIST = This type family is usually used to portray blah, blah, blah feeling/message. </i> <br> <br>Yeah, that's the way I feel about humanist typefaces sometimes. <br> <br>I don't know if any of these are what you're looking for, but here are some links: <br> <br><a href=\"http://www.typography-1st.com/typo/classtyp.shtml\" target=\"_blank\">http://www.typography-1st.com/typo/classtyp.shtml</a> <br> <br><a href=\"http://www.graphic-design.com/Type/voice/\" target=\"_blank\">http://www.graphic-design.com/Type/voice/</a> <br> <br>Also, many books on typography and/or design have lists like the one you remember.</p>"
