  html: "<p>A few years ago i found a document online that noted the type classifications and situations/meanings they may be related to. <br> <br>Example:  <br> <br>HUMANIST  =  This type family is usually used to portray blah, blah, blah feeling/message. <br> <br>I can't seem to locate anything like this anymore, anyone familiar with this or something similiar to this?  thanks.</p>"
