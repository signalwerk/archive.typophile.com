    html: <p>The second of Mark's links seems to address Randall's question better, but what it seems to be basically saying is to trust your judgment about what kind of type seems appropriate for a given purpose, because there are no simple rules. <br> <br>I like that advice.  <br> <br>Unfortunately, when many of us try to follow the described process of putting six versions up on the wall and picking the one that looks right for the job, the clich�s win most of the time. At least that's what you could conclude looking at a lot of the ways typefaces are used.  I suspect it is because too many people are trying to use rules, instead of judgment, or are too busy imitating 'looks' as if they are the Rosetta Stone that let their target audience understand the message. <br> <br>I guess maybe my point is that typography isn't a substitute for having things to say that people want to read. <br> <br>I know, nobody said that here, I guess I was just feeling philisophical this morning<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
