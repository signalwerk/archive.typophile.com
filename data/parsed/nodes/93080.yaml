    html: |-
      <p>Sure Ryan, and every time the text re-flows you can start all over again. Manually breaking words by inserting 'hard' hyphens is <em>not</em> a good idea.</p>
      <p>One that <em>is</em> good (well--better than Ryan's) is that, much to my surprise, in InDesign you can apply a GREP style to ... the discretionary hyphen!</p>
      <p>It <em>does</em> mean that you have to replace InDesign's own breaking points with (uh) manually inserted discretionary ones, because it seems the one that ID inserts is seen as "something else" (and on pure technical grounds one could argue that's a bug). But the advantage is that (1) if the discretionary hyphen is <em>not</em> used, the GREP style is not applied either, and (2) if it <em>is</em> used, you can style it however you want:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/grepstyle_6454.png"></div><p></p>
