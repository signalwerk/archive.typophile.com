  html: |-
    <p>The text I've set in Baskerville appears, to my eye and in this layout, to have a hyphen slightly too thick and long. This is the automatic paragraph hyphen I'm refer referring to. I think it might be be less disruptive in the instances it occurs if reduced in size by 15% and tracked closer to the last character. How to even try this, or is this 'typeface crime'?</p>
    <p>Thank you,<br>
    Luca</p>
