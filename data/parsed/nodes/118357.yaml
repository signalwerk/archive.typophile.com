      <p>No need to edit the _s_ from Old English.<br>
      This is the _s_ from Notre Dame with width compressed to about 65%,<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NotreDame_s_Width65Percent_3546.gif"></div><br>
