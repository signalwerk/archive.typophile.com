    html: |-
      <p>This is indeed Old English, with<br>
      1. width compressed to about 65%,<br>
      2. made thicker by a parallel line technique,<br>
      3. the letters packed together so that they overlap<br>
      4. the _s_ simplified and edited, particularly so that the lower lhs would line up with the tail on _a_.<img src="/sites/default/files/old-images/OldEnglishWidthAt65Percent_4194.jpg"><a href="http://www.myfonts.com/fonts/mti/old-english-text/">http://www.myfonts.com/fonts/mti/old-english-text/</a><br>
      Don</p>
