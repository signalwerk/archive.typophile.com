      <p>It's calligraphic blackletter--the kind of writing found in manuscripts/books before the advent of movable type--and most likely hand-drawn.</p>
      <p>There are dozens of digital versions out there (Old English being one, but it is more ornamented than your sample). These get you close:</p>
      <p><a href="http://www.myfonts.com/fonts/fontmesa/bella-rose/" title="http://www.myfonts.com/fonts/fontmesa/bella-rose/">http://www.myfonts.com/fonts/fontmesa/bella-rose/</a><br>
      <a href="http://www.myfonts.com/fonts/lamatas/liturgisch/" title="http://www.myfonts.com/fonts/lamatas/liturgisch/">http://www.myfonts.com/fonts/lamatas/liturgisch/</a></p>
