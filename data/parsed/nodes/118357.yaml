      <p>No need to edit the _s_ from Old English.<br>
      This is the _s_ from Notre Dame with width compressed to about 65%,<br><img src="/sites/default/files/old-images/NotreDame_s_Width65Percent_3546.gif"><br><a href="http://www.myfonts.com/fonts/linotype/notre-dame/">http://www.myfonts.com/fonts/linotype/notre-dame/</a> You merely need to make it thicker by a parallel line technique.<br>
      Don</p>
