  html: <p>I see many graphic designer talk about <a class="freelinking external" href="http://tiff.herokuapp.com/" rel="nofollow">this new tool</a> which lets you compare two fonts and I'd like to see what professional type designers and typophiles think about it. Is there a need for an app like this?</p>
