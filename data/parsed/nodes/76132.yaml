      <p>It's a beautiful font and I wish I knew what it was. That said, if no one is able to identify it and noting that it's obviously a rubber stamp, you might want to search through some of the most popular rubber stamp companies to see if you can find the stamp. The companies are usually very good about replying and letting you know if it's an actual font or just hand lettering turned into a font.</p>
      <p>Best of luck to you and post what it is if you are able to identify it outside this forum.</p>
      <p>PS Just a bit of searching, you might find something acceptable:<br>
