    html: "<p>ATM Deluxe was never <i>that</i> great. From what I remember, you had to double click to view a font, which it then brought up in a new window. So to compare 3 fonts, you would have 4 windows open. It did, however, always auto-activate without problem. The current Suitcase is better than ATMD ever was. <br> <br>Somewhat related: If you Illustrator 10/OS X users uncheck all of the options when saving native files, Suitcase will not auto-activate the fonts in that file the next time you open it. I figured this out after almost a year. Extensis still may have no clue.</p>"
