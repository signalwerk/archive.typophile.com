    html: <p>&gt; Font Book is a disappointment for sure <br> <br>I didn't set my expectations too high, so I'm neither blown <br>away nor disappointed. This seems true to Apple's pattern.  <br>iTunes, Mail, iChat, iPhoto and Safari all started as fairly  <br>bare bones, but stable, apps (except for Final Cut which was  <br>solid from the start). I'm going to give Font Book until  <br>version 2.0 to prove itself.  <br> <br>That said, I'm having fun seeing if I can make my OS work  <br>without Suitcase. (It would save me a $120 upgrade to X11.) <br> <br>Having used Font Book for three days now, the thing that I  <br>like least is that when 'adding' fonts, it copies them into a  <br>user/library/fonts directory (as with iTunes 'consolidate  <br>library' feature). This negates my anal organization of all my  <br>fonts by foundry (but doesn't offer the robust organization/ <br>categorization of iTunes). <br> <br>In the meantime, all Stephen's drum beating for FontAgent  <br>makes me wish I'd selected more carefully. (Maybe there's a  <br>competitive upgrade?)</p>
