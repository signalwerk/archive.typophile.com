  - id: 14218
    user: 1832
    date: 2003-10-26T10:33:00
    date_raw: 26.Oct.2003 10.33am
    votes: null
    html: "<p>More from <a href=\"https://web.archive.org/web/20080423012425/http://www.macintouch.com/panreader04.html\" target=\"_blank\">MacInTouch</a>: <br> <br>Font Book limits   <br> <br>William Kyngesburye <br> Well, looks like Font Book is NOT font management for graphic artists. Not only  is there a limit on the number of fonts that can be activated (understandable),  but there is a limit on the number of fonts that Font Book can MANAGE.   <br> <br>It's not just font families, but individual font styles - when I was near the  limit (I had 124 families, including Apple stuff and Classic fonts) and added  another font family, it only added a few of the styles. Deleted a family, and  I was able to add all of the incomplete family (so it's not corrupt fonts).   <br> <br>Also, some font names are strange - a small number, the family name, two asterisks,  the style and a BIG number, ie \"8 BauerBodoni** Black 09033\". These  names show up in any application that uses the OS X font panel for font selection.  Apps that use internal font handling (Illustrator) show expected font names, no  matter what Font Book says.   <br> <br>There seems to be random problems adding fonts as well - sometimes it won't.   <br> <br>You can't install and manage duplicate fonts, such as different versions (some  clients are picky about versions). Probably has something to do with the PS font  file names - while you can keep different suitcase names, PS file names are fixed,  so you can't have two copies of the PS files in the font folder. No sub folder  organization to work around this, unless you manually copy fonts to the fonts  folder.   <br> <br>Back to SuitCase.   <br> <br> <br> Adam Yellin <br> I tried using the Font Book instead of Suitcase and my fonts all came out jumbled,  so went back to using Suitcase for now. There is nowhere I can find that even  tells us how to use Font Book properly. Like how to remove fonts from it without  deleting them from the drive entirely.  <br> <br>Are these reports useful here? If it's just clutter, let me know &amp; I'll stop.</p>"
