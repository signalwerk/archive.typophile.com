    html: <p>first post, just wanted to share some notes on the nasty little beast called FontBook <br> <br>By default, FontBook MOVES fonts into your user/library/fonts folder - meaning, if you have a nice little organized folder of fonts divided up into categories or whatnot - it moves your fonts out of there. <br>Guess what happens if you remove one of these fonts from FontBook? <br>Does it put them back where it got 'em?  <br>Oh no no! <br>It TRASHES them. <br>Granted, you just gotta drag stuff back off your CD/archive or whatnot - but this is really annoying. <br>It took me awhile to figure out why my fonts were disappearing. <br> <br>To solve this - open FontBook prefs and check 'Always copy fonts when adding' <br> <br>another thing - I can't get Univers to work. Period. It works fine in OS9, and in Jaguar - but in Fontbook it turns it to all caps garbled junk with nice little accents above all the letters. Doesn't explort in flash correctly. <br> <br>Also, in flash, i have several perfectly fine fonts displaying with random distorted triangles instead of spaces and one letter in DIN had a corner blown out clear across the screen. <br>It's just a display bug - they exported correctly - but it's just another example of some nasty display problems. <br> <br> <br>Oh, and Suitcase is apparently broken in Panther. <br>They're aware of the issue and are working to correct it. <br>Why they didn't iron this out BEFORE Panther was released, I don't know. <br> <br>//Drew <br></p>
