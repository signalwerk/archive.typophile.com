    html: <p>We recently got the sweet Dual 2 G5 and were pumped about Font Book. Nothing but problems. <br> <br>I tried to drag and drop fonts into FB and then it all got messed up. I tried to resolve the issue with Suitcase X1. Suitcase found over 200 corrupted fonts, cool problem fixed, right? No. There are still 168 fonts that Suitcase shows as installed, but don't actually exist. I can't get rid of them. It was taking our computer 5 minutes at least to load Flash.  <br> <br>Basically we have to reinstall Panther. I'm never opening FB again, and I think it's a joke that Apple released such a buggy program. Especially for a platform intended for designers. I've complained on Typotect enough, so I'm done.  <br> <br>Thanks for all of the above links, I can't wait to jump into them and find out the real deal.</p>
