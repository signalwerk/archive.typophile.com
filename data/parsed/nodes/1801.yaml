    html: "<p>Just installed Panther. First impressions: <br> <br>* DAMN fast compared to Jaguar <br> <br>* some bug with the Input Menu/Keyboard layouts - since the US is default but I need to use Estonian, I switch to Estonian, but every once in a while the system switches me back to US. REALLY annoying. Hope there's a fix/workaround/option somewhere, I'll keep looking. <br> <br>* FontBook is VERY fast (and very... umm... simple and reasonable) compared to Suitcase. After installing the software I'll see about how it will function with different apps. <br> <br>* Disappointed with what they've done with the default typeface on Finder/Safari/Other apps. Seems they've modified Helvetica and the kerning is totally screwed up. If you install it go to Typophile Forums topics front page and you see what I am talking about...  <br> <br>More later... <img src=\"https://web.archive.org/web/20080423012425im_/http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
