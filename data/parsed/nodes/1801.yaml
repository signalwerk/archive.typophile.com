  - id: 14207
    user: 2045
    date: 2003-10-25T17:08:00
    date_raw: 25.Oct.2003 5.08pm
    votes: null
    html: "<p>Seems to me everything is much MUCH improved in Panther: besides Finder (on steroids) the software runs smoother, the whole system customization is a lot faster, logins/boots are lightning fast etc. <br> <br>FontBook is right now probably not the hardcore tool to immediately replace the likes of ATM (may it rest in peace) or Suitcase. But if you have enough time to browse/compare/activate your fonts manually and you are very well aware of what is going on in your Fonts folders, it is extremely reasonable replacement to these tools.  <br> <br>It is fast, very simple and what's the best part - Apple most likely created it to develop it into the next Suitcase or ATM. I mean this is just version one. So, let's give it some time and I bet it will become a really powerful tool. <br> <br>Meanwhile I still have the problem with the Input Menu swicthing. Tried to swap my background picture for .jpg, but Panther still keeps changing my keyboard layout from Estonian back to US. <br> <br>It is probably a thing many users could not care less about, but do trust me - there are a lot of people using non-US keyboard... And it is a really annoying bug. Does anyone know if there's a workaround to tweak the system so, that Estonian could be the Input Menu language?</p>"
    html_clean: "<p>Seems to me everything is much MUCH improved in Panther: besides Finder (on steroids) the software runs smoother, the whole system customization is a lot faster, logins/boots are lightning fast etc. <br> <br>FontBook is right now probably not the hardcore tool to immediately replace the likes of ATM (may it rest in peace) or Suitcase. But if you have enough time to browse/compare/activate your fonts manually and you are very well aware of what is going on in your Fonts folders, it is extremely reasonable replacement to these tools.  <br> <br>It is fast, very simple and what's the best part - Apple most likely created it to develop it into the next Suitcase or ATM. I mean this is just version one. So, let's give it some time and I bet it will become a really powerful tool. <br> <br>Meanwhile I still have the problem with the Input Menu swicthing. Tried to swap my background picture for .jpg, but Panther still keeps changing my keyboard layout from Estonian back to US. <br> <br>It is probably a thing many users could not care less about, but do trust me - there are a lot of people using non-US keyboard... And it is a really annoying bug. Does anyone know if there's a workaround to tweak the system so, that Estonian could be the Input Menu language?</p>"
  - id: 138772
    user: 103
    date: 2003-10-25T18:38:00
    date_raw: 25.Oct.2003 6.38pm
    votes: null
    html: "<p>All the Font Book features Joe talks about are available in <br>FontAgent Pro (minus the keycaps thing which is already <br>accessible through the \"Character Palette\" in OS X's input <br>menu). But FontAgent Pro (and the other third-party <br>managers) have one thing Font Book is missing: auto- <br>activation. For those who haven't benefited from the goodness <br>of this feature, it automatically activates all the fonts in any <br>Illustrator/Photoshop/Quark/InDesign document when you  <br>open it. This saves a ton of time for those who have many  <br>clients/jobs/fonts to work juggle. <br> <br>Could Apple implement this in Font Book? Probably, and they <br>might do it better than Extensis or Insider. But will they? I <br>would be surprised. It would be the single feature that would <br>make those third party utilities obsolete, effectively pulling <br>the plug on an entire (though admittedly smallish) sector of  <br>OS X software.  <br> <br>No, I don't see anything new going into Font Book. <br>It's an excellent manager for the majority of OS X users, the <br>sort of thing the Mac OS should have been built with from <br>the beginning. But pro users will need something more, <br>and it would be dumb for Apple to flip off two longstanding  <br>developers and supply the goods themselves. <br> <br><i>(pardon the poor writing. this was written too late at night. <br>gee, i wish i was still in the same time zone as all you kids.)</i></p>"
