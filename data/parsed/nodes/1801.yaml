    html: <p>Very happy with Panther so far. The speed of the finder is  <br>much improved. It's faster/smoother. (I'm on a G4/667). I'll  <br>let you know what I think of FontBook after I've used for a  <br>while. <br> <br>What I didn't realize from the FontBook demo at TypeCon is  <br>that you can search for fonts (unlike Suitcase.) For example,  <br>searching for 'ding' reveals Webdings, Wingdings and Zapf  <br>Dingbats on my system. (I'm looking forward to searching  <br>for light or small caps or round or inline or smallcaps.) This  <br>is a feature I've long wished for. <br> <br>FontBook also has a "Keyboard Viewer" very similar to the  <br>old "Key Caps" applet where you can preview characters  <br>with various keystrokes. The improvement over Key Caps is  <br>you can select a font to preview it in. Very handy, especially  <br>for dingbat fonts. <br> <br>The "show font file" command is sweet. It locates the font  <br>in the finder. <br> <br> <br>_______ <br> <br>So, halfway through writing this I just discovered that  <br>Suitcase 10.1.3 "unexpectedly quits" whenever I launch it.  <br>Ouch. I've gotta sleuth that one out and get back to you.)</p>
