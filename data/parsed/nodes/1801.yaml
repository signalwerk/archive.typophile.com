    date: 2003-10-30T06:32:00
    date_raw: 30.Oct.2003 6.32am
    votes: null
    html: <p>Tiffany, I did a 'dirty' install on my pre-Quicksilver G4 (dual 450s). I was running a shoddy upgrade of 9.2 (from 9.1.2) and had non-critical problems all over. I was too eager to upgrade Friday night, so I just ran the Panther installer right over top of the old OS. It works flawlessly. <br> <br>I had a problem once when it woke up stupid (after being asleep all night) and I lost fast user switching until I restarted, but that's been it. Everything came over fine. <br> <br>However, I'd like to add that I don't have a font manager (besides Font Book) yet, so I can't comment on how that goes. <br> <br>I'm very happy with Panther thus far. I work primarily with classic apps and they all work well (of course QX 4.1 still has redraw issues, like Jaguar). I have Jaguar on a much faster machine at work (quicksilver G4, dual 867s), and it runs comparably.</p>
