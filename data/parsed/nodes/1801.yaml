  - id: 14236
    user: 2368
    date: 2003-10-30T15:04:00
    date_raw: 30.Oct.2003 3.04pm
    votes: null
    html: <p>I've upgraded to panther and I have had some serious font issues. All was well. Was using suitcase in Panther and I had no problems. Then I remembered one of the reasons I had upgraded. Fontbook! Tried it out. Thought it was nice, but I still prefered Suitcase. Then later, I wanted to play some more in Fontbook but forgot to quit Suitcase. That is when all hell broke loose.  <br> <br>I'm still not certain what happened, but it seems that any of the fonts that I had in Fontbook became corrupted and Suitcase (and even Font Agent Pro) would balk at even the idea of using or adding them again into those apps. <br> <br>Luckily, after wipping my system clean to figure this out, I just pulled the fonts that were damaged from some duplicates off a fireewire drive that I have and all seems to be working in the land of Panther. <br> <br>Just thought I'd warn everyone to be VERY carefull about having Fontbook open with other font management apps.</p>
    html_clean: <p>I've upgraded to panther and I have had some serious font issues. All was well. Was using suitcase in Panther and I had no problems. Then I remembered one of the reasons I had upgraded. Fontbook! Tried it out. Thought it was nice, but I still prefered Suitcase. Then later, I wanted to play some more in Fontbook but forgot to quit Suitcase. That is when all hell broke loose.  <br> <br>I'm still not certain what happened, but it seems that any of the fonts that I had in Fontbook became corrupted and Suitcase (and even Font Agent Pro) would balk at even the idea of using or adding them again into those apps. <br> <br>Luckily, after wipping my system clean to figure this out, I just pulled the fonts that were damaged from some duplicates off a fireewire drive that I have and all seems to be working in the land of Panther. <br> <br>Just thought I'd warn everyone to be VERY carefull about having Fontbook open with other font management apps.</p>
