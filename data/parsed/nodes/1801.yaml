    date: 2003-10-26T03:40:00
    date_raw: 26.Oct.2003 3.40am
    votes: null
    html: "<p>Hi, <br>I am a little conservative when it comes to functions and programs which I really like the way they are. <br>One reason for sticking with OS 9 as long as I have was the way I use ATM Deluxe: to me, its auto-activation function is THE way to save time when switching between jobs. As a freelance writer-designer of FontShop publications I use hundreds of fonts.  <br> <br>So let me get this straight. A font management program for me needs to have 3 features: <br>- auto-activation <br>- drag-and-drop creation of subsets (as in ATM-Deluxe) <br>- search feature based on parts of fontnames (\"name contains...\"). <br>I understand FontBook won't give me that right now. What will, when switching to OS X? <br>Jan</p>"
    html_clean: "<p>Hi, <br>I am a little conservative when it comes to functions and programs which I really like the way they are. <br>One reason for sticking with OS 9 as long as I have was the way I use ATM Deluxe: to me, its auto-activation function is THE way to save time when switching between jobs. As a freelance writer-designer of FontShop publications I use hundreds of fonts.  <br> <br>So let me get this straight. A font management program for me needs to have 3 features: <br>- auto-activation <br>- drag-and-drop creation of subsets (as in ATM-Deluxe) <br>- search feature based on parts of fontnames (\"name contains...\"). <br>I understand FontBook won't give me that right now. What will, when switching to OS X? <br>Jan</p>"
