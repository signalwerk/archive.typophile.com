    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 1.Apr.2006 7.01am </div>
      <p>P22 &amp; Lanston type presents: LTC Spacing Sorts</p>
    <p>   A tribute to the transition and evolution of type and typesetting from handset, to digital and the renaissance of hand printing using digital methods as a tool. The spacing sorts was meticulously digitized from hand set sources including ATF and Lanston type. We performed research in vintage printing shops to develop this indispensable type setting tool.</p>
    <p>   The cost of such a precision assortment of spacing materials in lead, copper &amp; brass from the 1912 ATF catalog was over $10 (approx. $188 in 2006, adjusted for inflation). Order your piece of type history now! We are offering this digital asset for only $19.95.</p>
    <p><a href="http://www.p22.com/lanston/products/spacing_sorts.html" title="http://www.p22.com/lanston/products/spacing_sorts.html">http://www.p22.com/lanston/products/spacing_sorts.html</a></p>
    <p>Best Regards.<br>
    P22 Type Foundry<br>
    <a href="http://www.p22.com" title="http://www.p22.com">http://www.p22.com</a></p>
