    <p>I just successfully installed the AFDKO command-line tools on Mac OS X as I've just tested runnin gthe "autohint -h" line and it gives me plenty of Help information… but I'm having problems when trying to install the FontLab macros.</p>
    <p>I've followed the guide step by step here </p>
    <p>file:///Users/Reserves/Library/Application%20Support/FontLab/Studio%205/Macros/FDK/Read_Me_First.html</p>
    <p>and I don't actually get any error in the Terminal window it's just nothing actually happens. This is what I get when following the 1-8 steps for installing the FontLab macros:</p>
    <p>Last login: Tue Jul  6 14:51:49 on ttys002<br>
    mike-jarboes-macbook-pro:~ Reserves$ cd<br>
    mike-jarboes-macbook-pro:~ Reserves$ /Users/Reserves/Library/Application\ Support/FontLab/Studio\ 5/Macros/FDK/Tools/FontLab python installFontLabMacros.py /Users/Reserves/Library/Application\ Support/FontLab/Studio\ 5/Macros<br>
    -bash: /Users/Reserves/Library/Application Support/FontLab/Studio 5/Macros/FDK/Tools/FontLab: is a directory<br>
    mike-jarboes-macbook-pro:~ Reserves$ </p>
    <p>Anyone know what I'm doing wrong? Please advise.</p>
