    html: <p>It is very visually appealing, however it does lead to some difficulties. <br> <br>I think the A in lotta is somewhat hard to read. It seems more of an e or complex o.   <br> <br>As for the stensson, I like the idea of a small simple font. Try experimenting with various sans-serif fonts and see if that helps. It also seems that it should be a bit to the right, as there is a space between the n of stensson and the a of lotta that looks like it should have something.</p>
