  html: <p>This is designed for a woman's clothing line that is known for her billowy beaded tops but also wants to venture into a more aggressive line, so I need to make sure that this logo will not only hold up for a while but feel feminine yet can hold up during a goth or punk phase. <br> <br>My main concern is that I can't seem to find the right typeface for the last name Stensson. Right now I am using Scala but want something that has more of an edge but is still feels classic enough to create contrast between the first name and second. Any suggestions of anykind will be of help! I am still trying to tweek the Lotta as well, but feel that the Stensson part needs more immediate attention.  <br> <br>Please let me know what you are getting from this. <br><img src="http://www.typophile.com/forums/messages/29/66559.jpg" alt="lotta logo"></p>
  html_clean: <p>This is designed for a woman's clothing line that is known for her billowy beaded tops but also wants to venture into a more aggressive line, so I need to make sure that this logo will not only hold up for a while but feel feminine yet can hold up during a goth or punk phase. <br> <br>My main concern is that I can't seem to find the right typeface for the last name Stensson. Right now I am using Scala but want something that has more of an edge but is still feels classic enough to create contrast between the first name and second. Any suggestions of anykind will be of help! I am still trying to tweek the Lotta as well, but feel that the Stensson part needs more immediate attention.  <br> <br>Please let me know what you are getting from this. <br><img src="http://www.typophile.com/forums/messages/29/66559.jpg" alt="lotta logo"></p>
