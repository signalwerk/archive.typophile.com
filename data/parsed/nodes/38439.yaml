    html: <p>The official rule for slab serifs (which I am about to make up) is that they have thick serifs, at least 50% as thick as the narrowest part of stem and other strokes, and no bracketting. Some people will call a Clarendon a slab serif (it fits, but has brackets), but they are the type of people who would steal sheep.</p>
