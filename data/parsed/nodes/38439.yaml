    html: |-
      <p>This was a great thread:</p>
      <p><a href="http://www.typophile.com/node/30127" title="http://www.typophile.com/node/30127">http://www.typophile.com/node/30127</a></p>
      <p>One of my posts to it seems relevant:</p>
      <p><em>slab serif and egyptian are synonyms,</em></p>
      <p>That’s always beeen my understanding. I named my slab-serif take on Bodoni “Egyptian” partly for that reason, as well as others, but most logically because the serifs don’t look at all like slabs in the Light and Thin weights.</p>
      <p>But for encompassing a variety of typefaces, rather than weights, “Slab” is more practical, which is no doubt why the FontBook uses it as a category, to include many hefty-serifed faces (eg for news text) that are not at all “Egyptian”.</p>
