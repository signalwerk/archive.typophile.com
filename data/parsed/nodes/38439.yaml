    <p>Could someone please point me in the direction of some literature (or a thread) where someone tries to nail down the criteria for a face being a slab-serif? </p>
    <p>A true formula would be extra nice. Something like "the thickness of the serif on a lower-case h, from the baseline to the point at which the slop of the bracket is equal to zero, must constitute at least X percentage of the stroke width of the h's stem."</p>
