      <p>So is Clarendon a slab/Egyptian then? How about New Century Schoolbook, or Utopia, or Font Bureau's Miller? I've seen each alternately described as a scotch roman, a transitional, or an Egyptian.</p>
      <p>Frankly, labels are as boring in typography as in life, but I suppose we need some metric to aid in compartmentalizing and categorizing the thousands of fonts out there nowadays....</p>
