    html: <p>No photo-taking was allowed, Miss Tiffany, but maybe the Dahesh Museum would send you a JPEG or two of the book inside pages. One text font, roughly equivalent to Acanthus today, was fascinating, esp the tiny crossbar in the middle of the lower case l character (as in love), which was printed clear as a bell...at the Morgan Library recently, I saw another big French art book around that period, an edition of Racine, with a big rendering of that same text font, impeccably printed...</p>
