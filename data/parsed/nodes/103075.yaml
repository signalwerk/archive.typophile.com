    <p>Hi everyone,<br>
    We recently released a new Corporate Design featuring Univers and Univers Condensed. It all works – great.<br>
    However the client s not willing to boy the 100+ licenses to get the fonts onto it employees computers for daily use on stationary etc.<br>
    So now I am looking for a substitute that ships with the standard Windows 7 package and resembles Univers and Univers Condensed as closely as possible. Unfortunately I am working on a Mac so I don’t have access to the entire Windows 7 library to try it out myself.<br>
    Anyone have any ideas, maybe even faced a similar issue in the past?<br>
    Any tips or recommendations are highly appreciated</p>
