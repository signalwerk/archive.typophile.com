  html: |-
    <p>We'd like to give you one typeface created by my class of kids in elementary school where I teach.</p>
    <p>It's limited on Cyrillic letters only, but maybe in future, we include Latin characters also.</p>
    <p>Hope you'll find it interesting :)</p>
    <p><a class="freelinking external" href="http://www.tourdefonts.com/Osmacka_azbukovica.zip" rel="nofollow">http://www.tourdefonts.com/Osmacka_azbukovica.zip</a> (TTF only).</p>
    <p>P.S. - I didn't influenced them or gave any creative directions, my role was just to do a technical job - to make a font from their letters.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Osmacka_azbukovica0_4016.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Osmacka_azbukovica_5351.png"></div><p></p>
