    html: <p>Could be wrong but should <a class="freelinking external" href="http://www.gestalten.com/new/all/24167" rel="nofollow">Bureau Grid</a>, a bespoke typeface by Mario Lombardo for Grid Magazine. It somehow mixes influences from <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/garage-gothic/" rel="nofollow">Garage Gothic</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/device/korolev/" rel="nofollow">Korolev</a>.</p>
