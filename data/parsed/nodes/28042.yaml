    html: |-
      <p>&gt;I do feel self-conscious sometimes about saying it that way</p>
      <p>We Americans, bless us, want to show our respect for foreigners by trying to pronounce their names their way. The English tend to unapologetically Anglicize foreign names. (At least traditionally; don't know whether that's changed.) Either way is ok, in my view. The problem with typeface names is that they have been so little spoken that for many there is no standard way to Anglicize them, in the sense that you can look it up and get something authoritative. </p>
      <p>So I say do what you are comfortable with--GAIR-a-mond or Gahr a MON (nasal 'on'), oo-ni-VAIR or universe--and enjoy the type!</p>
    html_clean: |-
