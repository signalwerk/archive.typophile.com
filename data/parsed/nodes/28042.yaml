      <p>MHSmith, you're probably right about the stress being on the end in Akzidenz. That's why I probably should have had a disclaimer that I don't speak German (or Dutch or Serbian for that matter)--it's all educated guesswork.</p>
      <p>I happen to be interested in pronunciation issues because when I write foreign proper names in Korean in the hangul alphabet, I have to know approximately how they are pronounced so I can transcribe them correctly. And I've found there is just no entirely satisfactory way of communicating pronunciations in writing, especially when different languages are involved. Things like regional variations in pronunciation in both the source and target languages, the degree to which the pronunciation should be adapted to the sound system of the target language...</p>
      <p>So it's a hopeless task. But I'm used to the IPA (most dictionaries I have use modified versions of it), and they are certainly fun to type.</p>
      <p>By the way, I did study Swedish in university and 'no-BELL' sounds like a perfectly good approximation of how Nobel would be pronounced in Swedish.</p>
