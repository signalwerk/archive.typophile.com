      <p>Having read an article in the September issue of Computer Arts Magazine (UK),  I was amused to read Jason Arber's comments regarding the name of my typeface Chevin. He reckons that – "my grandmother could think of a better name than this bizarre contraction of Chav and Kevin". </p>
      <p>I hadn't thought of that when I named it – it's actually named after the hill that overlooks the town where I live, as I couldn't think of a name and looked out of the window and thought 'That'll do'. </p>
      <p>– See the time, effort and complicated tought processes we type designers put in to come up with a catchy name?</p>
      <p>BTW it's pronounced 'Shevin' as in shout, not Chevin as in Charles. Oh, and while I'm at it; Houschka is pronounced 'Hooshka', not as in house.</p>
      <p>Nick Cooke</p>
