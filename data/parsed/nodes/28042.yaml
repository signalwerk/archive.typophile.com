      <p>Jongseong, I think you are right that pronounciation in many languages can only be done properly by using phonetic symbols--or by explaining which English letters you are going to use represent a specific sound or phonetic symbol. </p>
      <p>However, as most people don't know the phonetic symbols--I only know a few--I think it is just too complicated to try to represent  pronounciation in original languages accurately. What those who contribute to the wiki could do very helpfully is to indicate an appropriate or acceptable English pronounciation.</p>
      <p>For example if you ask Zapf, my guess is that he would find zapf, with the z as in zoo and the a in father an acceptable English variant. But probably z as in zoo and a as in cat less acceptable. If Dan can ask Zapf--who has taught to English speaking students so he would have dealt with the issue--that would settle it.   </p>
      <p>An example of the difficulty of doing phonetics is your phonetic version of German names. You use the 'schwa', the upside down e that represents a sound* common in English and Hebrew. However, if I'm not mistaken the schwa is isn't officially part of German. So using it to represent German names is already 'Anglicizing' them. Of course there are many dialects and pronounciations of German, so it may be accurate in some, but I don't think in official 'high German'. Perhaps some German speakers who know phonetics can enlighten us on contemporary German pronunciation. --But it is an endless discussion, as this thread shows. </p>
      <p>*In English, the schwa is the sound of the 'e' in 'the man'.</p>
