    html: |-
      <p>&gt;pronounce it so many different ways.</p>
      <p>I think there is always a choice of trying to pronounce it as in the language or origin, or Anglicise (or Americanize) it. If you have studied the language or are good at foreign phonemes, then my view is go for it. But it is perfectly acceptable to do an Anglicized version. So Univers is also 'universe', etc. </p>
      <p>In the case where the phoneme exists in English, then I think it preferable to use it. </p>
      <p>For example, we have the 'ts' or 'tz' sound, as in 'nuts', though in English it never starts a word. And we have the 'a' in 'father', as well as 'cat'. So I think 'tzahpf' (correct German) or 'zahpf' (z as in zoo, a bit Anglicized) is preferable to 'zapf', with the z as in zoo and the a as in cat.</p>
    html_clean: |-
