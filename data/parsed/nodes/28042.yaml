      <p>Sounds like something we should turn into a Wiki entry! I found a list here, which I borrowed from mostly for entries rather than pronunciation: <a href="http://www.faqs.org/faqs/fonts-faq/part5/" title="http://www.faqs.org/faqs/fonts-faq/part5/">http://www.faqs.org/faqs/fonts-faq/part5/</a></p>
      <p>Here's my take on pronunciation:</p>
      <p>Benguiat: BEN-gat</p>
      <p>Univers: oo'-nih-VAIR</p>
      <p>Arnold Boecklin: AR-nolled BOKE-lin (the BOKE part is actually a German o with umlaut, but that's as close as most English speakers will get)</p>
      <p>Fette Fraktur: FET-uh FROK-tour</p>
      <p>Peignot: pay-NYOH</p>
      <p>Sabon: sah-BON (second syllable should have a nasal element, like bonjour)</p>
      <p>Veljovic: VELL-yoh-vitch'</p>
      <p>Zapf: tzopf</p>
