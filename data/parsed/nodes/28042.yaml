      <p>I share SourisNoire's surprise that no one is jumping at the chance to use those IPA glyphs. Here is my take. I added what I took to be the original languages in parentheses. Of course, in English pronunciation, these will all be appropriately anglicised. I myself anglicise the words heavily when speaking in English. I must say though that I have hardly ever had the opportunity to pronounce many of these names in real life.</p>
      <p>I made no effort to reflect regional variances in pronunciation (e.g. the dozens of varieties of Swiss German). Please correct me if you find mistakes.</p>
      <p>Akzidenz Grotesk [ˈak.ʦɪ.dənʦ ɡʁo.ˈtɛsk] (German)<br>
      Avenir [av.ˈniʁ] (French)<br>
      Benguiat [ˈben.ɡæt] (English)<br>
      Berthold [ˈbɛɐ.tolt] (German)<br>
      Enschede [ˈɛn.sxə.deː] (Dutch)<br>
      Fraktur [ˈfʁak.tʊɐ] (German)<br>
      Frutiger [ˈfʁʊ.tɪ.ɡɐ] (German)<br>
      Garamond [ɡa.ʁa.ˈmõ] (French)<br>
      Gill [ɡɪl] (English)<br>
      Goudy [ˈɡaʊ.di] (English)<br>
      Kabel [ˈka.bəl] (German)<br>
      neue [ˈnɔʏ.ə] (German)<br>
      Peignot [pɛ.ˈɲo] (French)<br>
