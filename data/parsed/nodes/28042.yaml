  html: <p>I did a search for 'pronunciation' and found a couple forums with dead links. Does anyone know where that forum is which talks about the correct pronunciation of typefaces, or know where on the web I can find more information. Not any typeface in general, but more of a guide on all or a lot of typefaces. Thanks.</p>
