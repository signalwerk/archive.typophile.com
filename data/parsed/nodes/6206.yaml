    html: "<p>Beleza Eduardo <br>Is good seeing Brazilian here.  <br>Welcome to Typophile World ;D <br> <br>I remake all ascenders and descender, <br>i increasead in 1 pixel to improve the <br>legibility in texts <br> <br>On proportions, also made some alterations <br>I go to send one preview of Pico in text use, <br>It goes to improve the visualization of these <br>presumptions problems <br> <br>The name: The legend of PICO <br> <br>When I thought about a name for this screentype, <br>PICO came me the head, being related the PICTS <br>and PIXELS. I also was thinking about <br>version PICCOLO of a type called Rialto <br>(Piccolo is version for small type <br>texts of Rialto) <br> <br>I liked the word, very small, combines with one <br>screentype. I liked them its diverse meanings. <br>In the end of everything, this is the soul <br>screentype; Small in size, great in meaning and <br>potential <br> <br>Thanks for Critique <br> <br>PS. Voc</p>"
