    html: "<p>Capeto,  <br>  <br>The translation of Pico, in english is Peak <br>Your meaning is:  <br>  <br>1. the top part of a mountain that tapers to a point, or such a mountain itself.  <br>2. the protruding bill of a cap; visor.   <br>3. the point of highest intensity, achievement, value, position, or the like.   <br>Example: a stock market peak ; at the peak of her development as a singer  <br>4. any tapering, pointed protuberance or projection.   <br>  <br>Here in Brazil, Pico is a slang for:  <br>  <br>1. Illegal graffiti in big Builds  <br>For example, see this Pico:  <br><a href=\"http://www.pixegraffit.hpg.ig.com.br/predio_arsenal.jpg\" target=\"_blank\">http://www.pixegraffit.hpg.ig.com.br/predio_arsenal.jpg</a>  <br>  <br>2. Very good PARTY or very COOL place!  <br>For example: Ipanema in Rio de Janeiro is the 'PICO'  <br>  <br>[ ]</p>"
