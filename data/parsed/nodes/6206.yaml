    html: <p>the text sample looks nice, the double-s is  <br>better now and the curve "w" is more coherent. <br> <br>but i think the ascenders' and descenders'  <br>incoherencies should be fixed; for instance, <br>"d" is the same height of "l", but "f" is 1px  <br>down. "p" and "q" have descenders longer  <br>than "g". imho, ascenders' and descenders' <br>height should be the same for all characters. <br> <br>also, the "t" could be reduced in 1px. <br>and the dots in "i" and "j" could be bigger <br>and higher. "j" could be widened in 1px too. <br> <br>the "S" and "f" on the title are much better <br>than the ones shown in the settings. <br> <br>and finally, i think most of the uppercase still  <br>needs some work... most characters look narrow <br>to me. <br> <br>&gt;&gt;&gt; <br>sim, tenho acompanhado a lista tipografia... <br>at</p>
