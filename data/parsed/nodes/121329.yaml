    <p>I'm at wits end with this...</p>
    <p>We need to translate an English collateral piece to Chinese and the client requested a font called Kaiti. I see "Kaiti SC" in the font list but when we select it the font doesn't display in Chinese. What are we doing wrong?</p>
    <p>I read on this site that we might have trouble exporting a PDF using this font. Is that still true? </p>
    <p>We running InDesign 2014 on a Mac running Yosemite. We use Font Explorer X Pro too.</p>
    <p>Any advice would be greatly appreciated. </p>
    <p>Thanks<br>
    Christa</p>
