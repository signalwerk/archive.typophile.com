      <p>If, when you copy text from <a href="http://zh.wikipedia.org/wiki/%E4%B8%AD%E5%9C%8B">http://zh.wikipedia.org/wiki/中國</a> and paste it in InDesign, Kaiti SC renders it properly, then the problem is not due to Kaiti but most probably to the encoding of the file you were given. For instance, I took the text <a href="http://typophile.com/files/text-gb2312.txt">http://typophile.com/files/text-gb2312.txt</a> from <a href="http://www.bmo.com/s_chinese/home/home.html">www.bmo.com/s_chinese</a> which is GB2312 encoded and saved it as plain text. If you open the .txt file with your browser, you will most probably need to choose <code>view &gt; text encoding &gt; Simplified Chinese (GB 2312)</code> so that it displays properly.</p>
      <p>Added: the  very same line of Chinese text can also be found in <a href="/files/text-bm-utf8.txt">text-bm-utf8.txt</a>; this time however you need to select the encoding Unicode (UTF-8) to view it. To get that new file, I just opened with TextEdit the previous GB 2312 encoded text  and saved it in the UTF-8 encoding.</p>
