    html: |-
      <p>On OS X 10.9, only Kaiti SC Black has fsType set to "restricted embedding"; the other Kaiti fonts are set to "editable embedding"</p>
      <pre>    Font                   fsType
          
          Kaiti TC Bold          0x0008
          Kaiti TC Regular       0x0008
          Kaiti SC Black         0x0002
          Kaiti SC Bold          0x0008
          Kaiti SC Regular       0x0008
          STKaiti                0x0008
      </pre><p>For the meaning of 0x0008 and 0x0002, cf <a href="http://www.microsoft.com/typography/otspec/os2.htm#fst" title="http://www.microsoft.com/typography/otspec/os2.htm#fst">http://www.microsoft.com/typography/otspec/os2.htm#fst</a> The embedding problem with the regular and bold was with older versions of the OS.</p>
    html_clean: |-
