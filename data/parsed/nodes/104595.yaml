      <p>Sorry about that, Fontlab.</p>
      <p>Ironically, after spending countless hours dealing with this over the last week or two, I realized my descender alignment zone (like for my /g/) was under the primary zone column, and by moving it to the secondary zone column in Fontlab it now looks 10x better!</p>
