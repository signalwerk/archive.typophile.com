    <p>So, after spending the last couple years on my first font family, I am extremely close to releasing it, except for the fact that PS hinting is making my brain explode. </p>
    <p>I've figured out how to use the Adobe Font Development Kit for autohinting, but from my understanding, if you don't have good standard stems set up, the autohinting doesn't really help too much.</p>
    <p>So my question is, what is the proper way to calculate the standard stem, and is there any sort of way to automate this? Even if there is a script that will do it to a decent level seems like something that would work better than my current understanding.</p>
    <p>I've attached a screenshot showing how poorly my font is rendering on screen... (as you can see, the characters are hopping all around as if they were on a trampoline).</p>
    <p>At this point, any help whatsoever will be greatly appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-07-13 at 12_6023.03.52 PM.jpg"></div><p></p>
