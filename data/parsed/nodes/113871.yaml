      <p>You're welcome Alfred. I should have made a specific mention of Jugendstil, which is after all the leading version of the influences of Art Nouveau and Arts &amp; Crafts in Austria. So add to your list  David Kerkhoff's new font Himmelblau <a href="http://www.linotype.com/1247150/Himmelblau-family.html" title="http://www.linotype.com/1247150/Himmelblau-family.html">http://www.linotype.com/1247150/Himmelblau-family.html</a> Also designs from Eckmann &amp; Behrens are worth a look.<br>
      Don</p>
