      <p>bumping this thread to see if I can excavate more answers...</p>
      <p>First off, seems like by definition a glyph like "æ" can be defined as both a digraph AND a ligature.<br>
      But for most digraphs: ij, ch, ß, its a matter of phonetics. An "fl" ligature is still two sounds in one breath while "ij" is simply "ī" (as far as one syllable). Sure "fl" is one syllable as well but it seems like its more a matter of aesthetic congestion of ascenders that the two letters compromise into one.<br>
      ...I'm really just thinking this through rather than proving anything at all.</p>
      <p>So then would diacritical glyphs be labeled as digraphs? Seems like most of them derived from two characters mashed into one and then simplified to a small mark above (or below) the original character. (see: aͤ)</p>
      <p>Is any of what I'm thinking wrong at all? Seems in line with whats already been said... just in other words.</p>
