      <p><em>how seriously does anybody take these anymore &amp; why?</em></p>
      <p>It's necessary to modify the standard "ae" and "oe" digraphs, to make them slightly narrower than just merging their components. And it's especially important to make a distinction between these characters in italic. Why? -- because that's the way the old guys did it, and because it's smart alec stuff. And of course, it improves readability by disambiguation and more harmonious proportions.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Caesar_4908.png"></div><br>
      But monospaced -- think of it as lovable black sheep rather than sore thumb.<p></p>
