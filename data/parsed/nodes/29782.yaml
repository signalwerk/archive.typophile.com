      <p>These are interesting points. </p>
      <p>Allow me to sum up my understanding so far: speaking from the point of view of a text face or even directional signage point of view we have:</p>
      <p>- Digraphs which (maybe) should look obtrusively compressed like 'rr' 'ch' &amp; 'dz' so that their status as a digraph is reinforced</p>
      <p>- Digraphs which (maybe) should not be obtrusively compressed like 'ij' and which a layperson would ideally not notice.</p>
      <p>- Ligature/Digraphs which inevitably seem to be compressed like 'ae' but which (maybe) aught to look as natural as possible despite certain inherent difficulties in acheiving this.</p>
      <p>- Ligatures which probably aught too look as 'natural' or unobstrusive as possible like 'ff' 'fi' 'fl' 'ct' &amp; 'ffi' etc and which a layperson would ideally not notice.</p>
      <p>Is a structure like this accurate? If so, which digraphs fall into which camps?</p>
      <p>Adam, given what you said about the 'ae' and your notes about the polish vs. french 'acute' it strikes me that there might be cultural preference for the design of digraphs too. What do you think?</p>
