      <p>Matt: <em>But for most digraphs ... its a matter of phonetics.</em></p>
      <p>Yes, this is key to understanding the role of digraphs in orthography. Some languages treat some digraphs as distinct letters for sorting purposes, but that shouldn't be taken as a defining aspect of digraphs. English has many digraphs, but does not treat any of them as distinct letters (nor does it pronounce them consistenty).</p>
      <p>Don't forget trigraphs and tetragraphs, which are relatively common in some orthographies. Some Irish dialects pronounce up to six letters as a single phoneme.</p>
      <p>Other than those digraphs that have morphed into ligated forms, e.g. æ or fraktur ck, or that have a history of either ligation or other stylised treatment in display letters, e.g. Dutch ij, I don't think it is either possible or desirable to given special typographic treatment to digraphs, trigraphs, etc. There are simply too many variables of use in actual languages, such that the same combination of letters may constitute a digraph in some words but not in others.</p>
