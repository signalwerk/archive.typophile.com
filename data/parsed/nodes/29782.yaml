    <p>I was going over a PDF of Fedra Mono to learn things for <a href="http://typophile.com/node/29761" rel="nofollow">my Mono project</a>... When I noticed the <a href="/wiki/digraph" class="freelinking" rel="nofollow">Digraphs</a>. This was fascinating because it related so well &amp; was yet different than the earlier Ligature thread. The digraph we all probably know best is 'IJ' used in Dutch. Whenever I have seen it it just looked 'right'. But apparently there is also 'ch' 'll' and 'rr' in Spanish, 'ch' in Czech, 'dz',  'ch',  'lj', and 'nj' in Croat, and many more. I will provide a full list later perhaps. Some of these seem like they would set less well in the same space.  In a monospace they nearly all stick out like a sore thumb despite the consumate expertise of Peter Biľak. In a less constrained design they might be really lovely. But maybe not. Maybe their compression is part of their identity. My question is, how seriously does anybody take these anymore &amp; why? Please enlighten me.</p>
    <p>BTW, this is what <a href="http://www.typotheque.com/site/font_features.php?family_id=5&amp;id=58" rel="nofollow">Peter says</a>:</p>
    <p><cite><strong>Digraphs</strong><br>
    Some languages (e.g. Czech, Croat, Dutch, Hungarian, Latvian, Lithuanian, Maltese, Slovak, or Spanish) use two characters to represent a single phoneme; those double characters (dz, ij, ch) are called digraphs.</cite></p>
    <p><cite>Digraphs are treated as single ‘letters’ on their own right. They influence hyphenation, abbreviation, and alphabetic order. Digraphs function as letters for the purposes of sorting e.g. in Czech, Slovak, Spanish and Welsh ‘ch’ serves as a single unit and words beginning with ‘ch’ have their own section in a dictionary.</cite></p>
    <p><cite>Digraphs should not be confused with ligatures which are graphically stylized combinations of two or more letters. Whilst some ligatures indicate that successive sounds are to be pronounced as one (æ,œ) most of them are just typographical letter-combination, trying to improve a appearance of the words and eliminate possibly conflicting characters pairs (ff, fi, fl, ffi, fl). Those ligatures have a practical significance only for typesetting, and do not represents a semantic difference.</cite></p>
