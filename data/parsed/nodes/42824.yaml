    <p>Hi,</p>
    <p>We have a new font that is being released called Louisiana. An Art Director that I do work for has the most beautiful handwriting I have ever seen. So I asked her if she would like to make a font together and this is what we came up with :)</p>
    <p>I had to modify and correct some of the forms to make it work as a font. </p>
    <p>We are very pleased with the end result.</p>
    <p>-Charles Borges de Oliveira</p>
    <p>CBdO</p>
    <p><a href="http://www.borgeslettering.com" title="www.borgeslettering.com">www.borgeslettering.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Louisiana_4840.gif"></div><p></p>
