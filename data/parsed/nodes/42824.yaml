    html: |-
      <p>Thanks guys. Nice suggestion Nick. I had made a bunch of ligatures for this font but fontlab didnt like the new ligatures. Anytime I introduced new kerning to the font I would keep getting an error message when generating the font "causes overflow of offset to a subtable (0x11a00" It was frustrating so I had to bag the new ligatures and just keep the current ones. It is interesting to note that she is left handed which I believe may give to the slight italic slant.<br>
      -Charles</p>
