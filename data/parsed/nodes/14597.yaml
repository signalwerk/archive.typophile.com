    html: <p>Anton, I hate to harp on useage but I will. A knocked out logo at small sizes can fill-in  so you might need to develop a logo that works when not knocked out. The current type and spacing when set as type in small sizes will fall apart (visually). Once again this isn’t a type design problem but a Corporate Idenity problem and needs more research and feedback (focus groups?). I don’t have any emotional response to the name, maybe if it were attached to a service or product. I was once asked to do a review of the RubberMaid logo. My suggestions included testing the shape around the logo, the RubberMaid red and the typeface independantly. The idea was to see what elements were important in the CI, not just the elements like the typeface.</p>
