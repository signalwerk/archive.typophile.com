      <p>Formally speaking,</p>
      <p>The word Expantium is derived from the base word “expand”.</p>
      <p>I also noticed you have the typeface set in caps and kerned<br>
      wide.</p>
      <p>It appears, you are correlating the visual with the verbal.</p>
      <p>You might want to avoid such a 1 to 1 approach because, it<br>
      would be like using a “chop suey” typeface to describe an<br>
      Asian restaurant — corny, and not clever.</p>
