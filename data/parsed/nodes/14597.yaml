      <p>“<em>Your reference to the luxury font is highly interesting and from The Netherlands (Holland is a sobre place where luxury is sometimes considered as a sin) I express my gratitude for this, wherever you live on earth. I will contact the foundry for a sample.</em>”</p>
      <p>You’re welcome.</p>
      <p>The Netherlands is one of the best countries in the world for both quality and innovation in type design, so you’re in the right place to find great type and type designers. The aesthetic you’re seeking may not be part of the culture there, as you noted, but you could easily find a very skilled foundry to create some custom type for a logotype or even an entire custom typeface for you. This is, for many, the ultimate signifier of a completly distinct brand identity.</p>
      <p>Here are a few lists:<br>
      http://www.dutchtype.org/foundries.html<br>
      <a href="http://www.myfonts.com/country/nl/">http://www.myfonts.com/country/nl/</a></p>
      <p>Your concept of “gold-tech” is very interesting. You seem to have a clear image of what you want and the ability to articulate it, which could feed a strong creative brief for a type project. Though your appreciation of the new UPS logo is likely to draw some criticism from designers, who tend to disdain it.  : )</p>
      <p>If you go with the original you posted, Norbert’s suggestion about letterspacing is, as usual, a good one. The current spacing is slightly uneven across the word. Fortunately there are no major sins, but it should be immaculate, particularly for something like this. Also, size it down to about 25% (not an uncommon size for on-screen use) and determine whether it’s still working for you. The thinner strokes begin to close up, which might call for a custom on-screen drawing for small sizes or a typeface with a heavier light stroke.</p>
