      <p>Dear Norbert,</p>
      <p>Thank you for the right-on-the-mark review and clear advice. I wish that I’d have have talked to you before. The resurected Atari logo is fabulously beautiful. And exceptionally strong in movement.</p>
      <p>I have been experimenting with adding design elements. And decided for the moment not to engage in this path, as it would open-up an new universe of potential new expressions.. which I am not ready for, at the moment. And I fear this also a bit, because it would ‘lock-in’ the expression at a stage where everything in the company is still brand new and moving. </p>
      <p>As for now, it will be done probably in one of two years time from now - by adding this aspect together with a restyling of the word. My thought behind this is that this would offer the possibility to include feedback from advertising the target audience (the market) and incorporate this knowledge into the briefing to a design agency. And we’d have also a better idea of the strategic positioning of the company.</p>
      <p>For now I’d love a deliberately understated expression, where the soberness of the graphical representation creates a “tension” in the mind of the reader and starts a process of imagination. On the website, the reader is helped by webcontent to interpret the mark. On the letterhead, I use an undertitle that supports the interpretation.</p>
      <p>The modification of (components of-) the chosen typeface is something that should definately be done, and I’d anyhow need a typeface as a starting point.. something to begin with.</p>
      <p>Thanks for the very much appreciated advice and great talking to you. It’s I think about finding a starting point that is so difficult for me. I hope I can ask you for more advice later. Also, if any font would come into mind then I’d love to hear about it. </p>
      <p>With best regards.<br>
      Anton</p>
