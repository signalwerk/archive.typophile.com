    <p>Dear Typophile, </p>
    <p>I have been referred to Typophile to ask your specialist advice about a logotype (URW++ Craw Modern Regular). The logotype will be used in the Corporate ID design for an international business consulting company, that will start advertising in most of the western countries by the end of Q4. Looking much forward to your comments and ideas. We are pretty much locked-in to Craw Modern, but there may be better solutions, better fonts for the logotype. Much interested in your opinion. </p>
    <p>for information about the company, please see: <a href="http://www.expantium.com">www.expantium.com</a></p>
