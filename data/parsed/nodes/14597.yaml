      <p>Anton,</p>
      <p>Frank Lin’s (Caboume) suggestion bears merit in avoiding the obvious treatment of extended typefaces.</p>
      <p>David Berlow’s revival and expansion of Morris Fuller Benton’s Agency Gothic might provide a unique treatment using the typeface alone.</p>
      <p>I have been trying to find a type vendor’s site where my suggested treatment can be seen without you re-inputting the characters, but for now look here:</p>
      <p><a href="http://www.fontbureau.com/fonts/AgencyFB">AgencyFB Family</a><br>
      Note the alternate cap “M”<br>
      There are a variety of weights, but one of the condensed faces can give a visual message of “reaching for the heights” as opposed to expressing width.</p>
      <p><a href="http://www.myfonts.com/fonts/fontbureau/fb-agency/agencyfb-regularcondensed/charmap.html">AgencyFB Regular Condensed</a><br>
      Both caps and lowercase offer possibilities, but I think carefully letterspacing E-X-P-A-T-I-U-M using the alternate “M” might be closer to what you are looking for.</p>
      <p>Just my suggestion, Anton.<br>
      Good luck.</p>
      <p>Yes, I’m old, but I’m back in style!</p>
