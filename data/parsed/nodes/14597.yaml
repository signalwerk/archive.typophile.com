      <p>Anton, I am a <em>big</em> fan of the URW Craw Modern Regular, production issues aside. However, my first response, before visiting your site, was ‘high-end men’s clothier’. Not sure if this influences your decision. Expanded, wide-set, all caps type is an earmark of high fashion and luxury because it communicates: “we can afford the space to luxuriate it”. So much so, in fact, that <a href="http://www.orangeitalic.com/luxury/">two enterprising young type designers even created a hyper-exclusive (read: “expensive”) font set based on that concept/aesthetic</a>.</p>
      <p>Regardless, I agree with the others here who encourage looking at your production needs and also considering a custom logotype. I like the aesthetic as it stands, particularly if classic, high-end, and somewhat conservative is your goal.</p>
