      <p>&gt; <em>I would like to learn how to emphasize its expressive power via the use of an extraodinarily well-chosen typeface.</em></p>
      <p>Hello Anton,</p>
      <p>As I understand it, your intent is to express the (non-)word “EXPANTIUM” without the use of any graphical elements and without any modification or modulation of the selected typeface.</p>
      <p>Why are you limiting yourself?<br>
      I can understand if you have given yourself a personal challenge to find what seems like the “right typeface,” but I fear that even AFTER you have made the decision, you may be haunted with the notion that you are “not sure if that’s absolutely the right one.”</p>
      <p>What do I mean? There will always be a typeface that you have missed (digitized or not), and even if you have seen them all there are NEW ones created all the time. It may even be that a contrast of typeface weights or a combination of more than one type family may provide the best solution.</p>
      <p>Selecting typefaces to be used in graphic design, and creating a unique logotype are completely different challenges. You may not be aware of this, but even logos that appear to be using only a typeface, may be in fact MODIFIED, even slightly. Even after a logo has been created, it may be necessary to modify or update the look when appropriate.</p>
      <p>Sample: Resurection of the <a href="http://www.brandequity.com/frame_communications1.htm" target="new"><strong>ATARI brand</strong></a> (look just at the letterforms).</p>
      <p>Ask yourself if your personal challenge of using only ONE UNMODIFIED typeface is more important than finding an exceptional expression of “EXPANTIUM.” Even the sound of the word begs a dynamic and not static use of letterforms.</p>
      <p>Please understand that I am not diminishing your intent. I just want you and other readers to understand that creating a unique identity is NOT solely the task of finding the “right typeface.”</p>
