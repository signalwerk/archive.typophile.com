      <p>Dear Crugen,</p>
      <p>You very well sensed this particular aspect in expantium’s positioning. Where most business consulting groups apply “silver-tech’ graphical  concepts (bridges/scyscraper windows/silver-coloured iron will blue supporting colors) expantium will be explicitly positioned as “gold-tech”; which is much more difficult to realise (gold tends to be perceived as ‘less tecnical’ than silver and carries the risk to give a sense of obsoleteness to the associated services) but if done well, it will result in uniqueness, solidity and authority. </p>
      <p>Expantium’s services portfolio is centered around planning methodology at the corporate level with a strong focus on boardroom decision facilitation applied to complex M&amp;A work and (private equity-) investment projects. The projects really don’t come cheap.</p>
      <p>One of the very few companies that succeeded in creating a convincing gold-TECH corporate identity is in my view: <a href="http://www.ups.com">www.ups.com</a> ; extremely fascinating and unique (lot’s of gold, but overall very technical representation and never too glossy or over the top).</p>
      <p>Your reference to the luxury font is highly interesting and from The Netherlands (Holland is a sobre place where luxury is sometimes considered as a sin) I express my gratitude for this, wherever you live on earth. I will contact the foundry for a sample.</p>
      <p>Crugen please feel completely free to further comment or give further suggestions as per your discretion wherever you’d see any other areas of improvement on the logo, or alternatives to Craw Modern Regular. </p>
      <p>(an idea could be to use URW Bodoni T Medium Extra Wide, which is highly similar to Craw’s morphology and could eventually better qualify as it is slightly less pronounced in its extendedness which can partially solve the issues raised by the others. But I fear that the Craw will get away with the gold.. </p>
      <p>Have a nice evening</p>
      <p>Anton.</p>
