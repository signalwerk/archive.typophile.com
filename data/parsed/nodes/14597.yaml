      <p>“<em>Your reference to the luxury font is highly interesting and from The Netherlands (Holland is a sobre place where luxury is sometimes considered as a sin) I express my gratitude for this, wherever you live on earth. I will contact the foundry for a sample.</em>”</p>
      <p>You’re welcome.</p>
      <p>The Netherlands is one of the best countries in the world for both quality and innovation in type design, so you’re in the right place to find great type and type designers. The aesthetic you’re seeking may not be part of the culture there, as you noted, but you could easily find a very skilled foundry to create some custom type for a logotype or even an entire custom typeface for you. This is, for many, the ultimate signifier of a completly distinct brand identity.</p>
      <p>Here are a few lists:<br>
      http://www.dutchtype.org/foundries.html<br>
