    html: |-
      <p>I used the Serif Font ID Guide and got <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/baskerville-old-face/">Baskerville Old Face</a> (or <a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/frys-baskerville/">Fry's</a>) as what seems closest. The W looks to have a middle serif, which would eliminate Mrs Eaves and most other Baskervilles. The C does not look like it has 2 serifs, which also points to Old Face/Fry's. The white on black lettering looks bolder than the reverse, so it seems to have less contrast than the black on white way has, but I think these Baskervilles are most likely.</p>
      <p>- Mike Yanega</p>
