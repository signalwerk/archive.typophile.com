    html: |-
      <p>The sample Spire posted does not lead me to the same conclusion as before. It seems to be the same typeface, but it certainly looks different to me seeing it that way. For one thing, it really does look rather monotone. Strangely, what it seemed closest to, structurally, was Font Bureau's relatively new font <a class="freelinking external" href="http://www.fontbureau.com/fonts/ZocaloText/styles">Zócalo Text</a>. However the italic is way off and the rest is not dead on by any means. The E is especially odd, and I think should be a key letter. Zócalo has the long, underslung lower arm, and the L is rather wide, but not quite as exaggerated as the sample. The W looks more stepped than the Baskerville's I mentioned, and is more like the W's that Frederic Goudy often used, however, none of his fonts have an E like this, as far as I know.</p>
      <p>Anyone else have any ideas about this?</p>
      <p> - Mike Yanega</p>
