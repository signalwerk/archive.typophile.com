    <p>G'day folks,</p>
    <p>I am testing a logo to see how it performs at very small sizes. I'm wondering if there was a minimum size that people use to test logos, for example, if it's still readable at 10mm wide it will be fine. What do other people do?<br>
    I hope this makes sense, it does in my head but then...<br>
    thankyou</p>
    <p>Nick</p>
