    html: <p>I don't know specifics, but I always hear people say that a logo should work at sizes between a business card and a billboard. I honestly can't imagine a logo being much smaller than 1 cm (or even often being seen at that size), as you described; I'd think that if it's readable that small, that's incredibly good.</p>
