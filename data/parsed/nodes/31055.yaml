    html: <p>Unfortunately, Nicholas, I don't have very much experience to speak of. My gut feeling is that if you're thinking this much about clarity, it shouldn't be much of a problem in the end. The things I know you need to watch out for are little details that could get blurry or filled up when scaled down. If your logo has a lot of fine details, then it might be a good idea to make a simplified version for use in these difficult circumstances. Hope this is helpful; maybe someone else has more concrete knowledge.</p>
