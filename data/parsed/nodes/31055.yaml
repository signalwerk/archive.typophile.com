    html: <p>How small will it need to get, and where will it be seen? This is really relative, so as much as possible we test logos in their final environments and worst case scenarios. For a film production company we tested movement at small reversed sizes at screen res (ie as seen at the end of film credits), for an electrical engineer we tested etched in metal at around 10mm across.</p>
