    html: |-
      <p>Good rule of thumb on the pen -- but I think you have to consider resolution/quality/colour issues as well.</p>
      <p>Business cards are generally the smallest full colour litho application, but very high print resolution so rarely any problems.</p>
      <p>Pens the smallest print application, generally screen printed in 1 or 2 solid colours, potential for ink spread.</p>
      <p>You should check how it prints at likely sizes on low resolution devices - colour and b/w laser prints. Fax, although dying out, should be at least considered.</p>
      <p>Then there are web graphics and perhaps application icons. I remember having to make a logo work on an early WAP phone - tiny screen, no greyscale let alone colour.</p>
