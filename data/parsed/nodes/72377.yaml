  html: |-
    <p><strong>Robin</strong><br>
    It is a dingbats font with infinite possibilities to compose arrows thanks to more than 5000 kerning pairs !</p>
    <p><strong>LeChaufferie</strong><br>
    It is a display font with 1200 automatic ligatures.<br>
    This font received the Bukva:raz ! excellece type design distinction in 2002.<br>
    Now, LeChaufferie is in opentype format for a simpliest use.</p>
