      <p>"There is this concept out there: music, fonts, art = information. Information = free."</p>
      <p>True, though I wouldn't call it overly subscribed to concept and there's a bit of a jump there. </p>
      <p>Should Google have commissioned artists instead of asking for free work? Yes.</p>
      <p>Was the comparison to Nickelodeon and Target accurate? Not entirely. </p>
      <p>Is there room to support open source projects with pro-bono contributions? Sure. </p>
      <p>Do creatives still do a crap load of spec work for free? Yes.</p>
