      <p>Goodness sake- Jeff Koons, Bob Dylan and Gucci are different breed. They have made tons while as many illustrators are still struggling to get the next jobs!</p>
      <p>I can identify with that because I used to do illustrations. In my country clients prefer stock photos than illustrations.</p>
      <p>It's kind of similar with DRM. The big boys like Apple and Microsoft are applying DRM when they are already making billions. The font designers are the one who actually need DRM. People wrongly associate font design business (since it is kind of IT related) with these huge IT companies and they think that font designers are also making millions. </p>
      <p>When they protest against DRM, fonts designers become victims.</p>
