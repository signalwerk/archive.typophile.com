      <p>Hi Samantha, what a well deserving topic for research! I hope more teachers follow suit and start to more intentionally design their briefs to be more engaging to their students. I have a few clarifying questions and a couple of suggestions. One, what is your main objective with your research? Assuming that your project is perhaps not as stringent as a formal research experiment with independent and dependent variables, you would still likely benefit from some focus. For example, if you limit your measurement to the students' levels of engagement, you can define what that means. You would also likely do well to define the qualities of poorly designed briefs as well as contrast those with good qualities of your brief. </p>
      <p>That then brings us to your question of what typefaces to choose. Pivoting a little from what Daniel mentioned above, you'd do well to survey some high school students and ask them what sites they visit for their news or other important time-sensitive information and get them to tell you how "trusted" and "engaging" those sources are. If you already have a group of students that you are using for your test of briefs you could use the same group to survey ahead of time. The smaller the sample size the less general the results can be applied, but they'll likely be very applicable to that group, and would show merit for further research. From there, you can get a feel for what typefaces they are likely to pay attention to. You may or may not want to include other typographic variables such as alignment, spacing, and hierarchy as each of these influence the overall design but also require measurement if they are to be different between the good and bad brief samples. Otherwise, focusing exclusively on typefaces may be a more manageable project.</p>
      <p>Wish you the best of luck!</p>
