    html: <p>As a fellow new teacher, I've found that high school students are skeptical of overly designed stuff as it looks to be pulled from some pre-constructed curriculum. Authenticity is big with teenagers, and I like to use my design to signal to them that everything they are reading is either from a non-endemic source (something not designed for classrooms) or made by me.</p>
