      <p>A most interesting topic. It is definitely something that should be looked at because presentation of information on any medium matters when it is aimed at children and teenagers. Especially teenagers when they are developing there own sense of aesthetics, which in most cases would be pop. Children are easier to cater for because anything cute and eye catching are sufficient typographic criteria.</p>
      <p>In my opinion teenagers of today are bored with sans serif fonts because of its generic use in news papers, text books and other publications. If there briefs or course descriptions were written in a serif, it would engage there attention because of its modern feel.</p>
      <p>And if these information systems are designed in an engaging way, students who do not listen to their teachers would be more inclined to read it themselves.</p>
      <p>It would be very intriguing to do a survey to a group of high school kids of which type fonts they find interesting or engaging.</p>
      <p>Good Luck<br>
      QueenSammy</p>
