    <p>Hi everyone :)</p>
    <p>For my Design course I am writing a research paper on the bad quality of high school subject briefs (you know those horribly designed course and topic outlines teachers would hand out) and going to improve them myself. (I partly chose this topic because I'm going to be a high school teacher myself once I graduate and who knows? It might make a difference!)</p>
    <p>What I'll be looking into is typography, composition and students' reaction to the good and bad designed versions (ie. does their presentation improve with better design [as students usually lead by example], do they feel more inclined to read the sheet of paper if it's better designed - does it communicate better etc)</p>
    <p>While I was thinking about how I could go through the process of testing students response, I was remembered that students in this generation prefer information handed to them on screen ... so I am looking into typefaces and sizes that are good for reading on screen.</p>
    <p>What typefaces can you recommend - for screen or print?</p>
    <p>And with this, what sans serif and serif fonts go well together when presenting information for teenage students?</p>
    <p>If you can recommend your choices - and with any websites/sources that I could get some information from I would really, really appreciate it! </p>
    <p>Thanks</p>
    <p>Samantha</p>
