      <p>When I was out of school and enthusiastic about writing a thesis and getting my degree I read a lot about legibility. At first I thought legibility was all about a great typeface and superb typesetting. What I learned is that as with any perceptual process reading is a guessing game and the more interest, context and familiarity with the topic, the easiest reading will be as long as the typeface or typesetting is not too bad.</p>
      <p>Apart from recommending good screen fonts I would emphasize the importance of highlighting a lot of smaller but relevant information chunks (quotes, numeralia, short facts) that raise interest and give context before starting the reading. A couple of other good legibility practices (if you are not presenting long prose) are presenting the text in many smaller sections with descriptive titles and</p>
      <p>For screen legibility Open Sans or Merryweather are great choices. You can see many typeface pairings here:</p>
      <p><a href="http://fontpair.co/">http://fontpair.co/</a></p>
      <p>Don't be shy with typeface size on screen, most fonts will read well above 17 point size.</p>
