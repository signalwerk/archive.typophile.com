      <p>- New Platten Neu Family<br>
    — Michael Clark Script font sale<br>
    —- New TypeCaster!</p>
    <p>Introducing — Platten Neu</p>
    <p>The P22 Platten font family has been revisited and expanded by designer Colin Kahn. Platten is based on lettering found in German fountain pen practice books from the 1920s (you may have seen the similar Speedball books in the US). This round tip pen lettering is comparable to the basic forms used in grammar school teaching alphabets, but with a few original characteristics. The Italic version has even more of these unusual features. Geometric &amp; simple yet casual &amp; timeless. Perfect for many uses.</p>
    <p>P22 Platten Neu includes 6 Pro fonts (Light, Regular &amp; Demibold) with many alternates and ligatures (over 500 glyphs in each font) in Roman &amp; Italic with expanded Central European language coverage and Smallcaps (Roman only). Pro fonts are $39.95 each, non-Pro fonts are $19.95 each.<br>
    <a href="http://www.p22.com/ihof/plattenneu.html" title="http://www.p22.com/ihof/plattenneu.html">http://www.p22.com/ihof/plattenneu.html</a><br>
    Set of 6 Pro fonts, with 9 non-Pro fonts included: $129.95 Special Introduction price for the month of September -$89.95!</p>
    <p>——————————<br>
    A new, monthly feature on p22.com will be a revisiting of P22 fonts you may have missed.</p>
    <p>Sweepy, Sneaky &amp; Pooper Black<br>
    No, not 3 of Snow White’s sidekicks, but rather 3 related script fonts from Calligrapher Michael Clark.</p>
    <p>Pooper Black is based on a brush ethic and has an extreme axis that lends a certain amount of speed to the font while the lack of connectors “slows” it down. A wonderful face for packaging, titling, and short burst of text.<br>
    Pooper Black has been seen takin’ care of business on shop ads and food packaging.<br>
    <a href="http://www.p22.com/ihof/pooper.html" title="http://www.p22.com/ihof/pooper.html">http://www.p22.com/ihof/pooper.html</a></p>
    <p>Sneaky is a connecting-script and sibling of Pooper Black that shares a similar flow and casual elegance. It features shared details and relative size so that with careful design, the two can be mixed and matched.<br>
    <a href="http://www.p22.com/ihof/sneakypro.html" title="http://www.p22.com/ihof/sneakypro.html">http://www.p22.com/ihof/sneakypro.html</a></p>
    <p>Sweepy (winner of a Type Director Club 2006 award) is a lighter, and connecting version of Sneaky. Sweepy is a brush script that is casual and fluid. In the expanded OpenType version Sweepy is loaded with alternate characters and ligatures that offer more flexible lettering options.<br>
    <a href="http://www.p22.com/IHOF/sweepy.html" title="http://www.p22.com/IHOF/sweepy.html">http://www.p22.com/IHOF/sweepy.html</a></p>
    <p>Get them individually for the month of September for 20% off regular price Or get them all in one package for additional savings!<br>
    P22 Pooper Black, P22 Sweepy OT, P22 Sneaky Pro Regularly $79.85- only $49.95! ends Sept 30 <a href="http://www.p22.com/products/monthly.html" title="http://www.p22.com/products/monthly.html">http://www.p22.com/products/monthly.html</a></p>
    <p>—————<br>
    The P22 type preview tool, the TypeCaster has been revamped for easier previewing and better resolution. Now you can zoom in as well as out to see any given font in any given size with any of your own text. Give it a try!<br>
    <a href="http://www.p22.com/products/typecaster.html" title="http://www.p22.com/products/typecaster.html">http://www.p22.com/products/typecaster.html</a></p>
    <p>—————<br>
    Best wishes!<br>
    P22 type foundry<br>
    <a href="http://www.p22.com" title="http://www.p22.com">http://www.p22.com</a></p>
