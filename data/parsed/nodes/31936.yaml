    <p>Hey Guys,</p>
    <p>I have been given the pleasure of creating an identity for an alternative energy company.  In short their value proposition is to provide cost effective ways to convert waste into useful energy, hopefully resulting in energy independence for the US.  The communication needs are a real challenge due to the following objectives:</p>
    <p>Key Words &amp; Emotive Phrases<br>
    • Urgency ~ These technologies are needed, now.<br>
    • Savvy<br>
    • Progressive ~ They mentioned Apple as a brand and philosophy they admired. Non-traditional<br>
    • Recycle, renew ~ The underlying concept. However slightly different than the traditional recycling model.<br>
    • Heart ~ Passion for what they do and how they can help.<br>
    • Green<br>
    • Simple<br>
    • Clean</p>
    <p>The Must Nots<br>
    • Must not be associated with the traditional Environmentalist crazies.<br>
    • Must not appear to be a “tree hugger” company.</p>
    <p>So the challenge is to be professional enough to be taken seriously while leaving an element of environmental purity.  I’m not so much asking for ideas on the mark (unless you feel like dropping an idea) although I would greatly appreciate any typefaces that would communicate or closely communicate the objectives at hand.  You guys are the best so please let the links roll :)</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/31853" class="topic-previous" title="Go to previous forum topic">‹ Tattoo/Tribal Vector Art</a> <a href="/node/31843" class="topic-next" title="Go to next forum topic">CANDY &amp; VEER present SweetTalkNYC with Michael C. Place, Elisabeth Arkhipoff &amp; more... ›</a></div>
