    html: <p>A little bit of thought led me to <a href="http://beorcana.com/specs2.html">Beorcana</a>, brand new from <a href="/wiki/Carl%252BCrossgrove" class="wiki">Carl Crossgrove</a> and much discussed on Typophile. It’s non-traditional, but in a different way than Apple’s (I think now over-imitated) ultra-clean, sleek identity. It has a real warm and human feel to it, which is right up your company’s alley. A concern might be that the strong humanistic element would lead a bit to the “tree-hugger” feel, but I think that it’s clean and refined enough that it wouldn’t be a problem if handled correctly. I think, ultimately, its utility rests in your hands; I shudder at the poor uses of Optima I see floating about, but I believe that smart, considerate use of Beorcana for the company might be an interesting move.</p>
