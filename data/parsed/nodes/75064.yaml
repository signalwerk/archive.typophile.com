      <p>The yonah in the Koren Bible face is on another thread.</p>
      <p>I didn't know that Koren based his font on another font. This is your theory. I know he was influenced by "Sephardi scripts" but honestly I have no idea what that means. I also know that he spent a long time with experts in readability to improve the readibility of the fonts. However, I don't know the scientific process of the late '50s so I can't really tell you if that works or not.</p>
      <p>Regarding the quality of our books at small sizes. We have made tremendous development in the last year or two in increasing radically our production process. It's definately not there yet, but the books that we have printed in the last couple of years are of a much higher standard.</p>
      <p>The new Koren Siddur for Israel is currently at the printers and we have just start getting in the new Shabbat Chumashim for Israel (we did USA versions of these books last year in the Sacks and Talpiot Series). I think there you can see that the legibility of the Tanakh font is much better.</p>
      <p>However, I really do think that legibility is about what you are used to. For example in the English language, there was a period that books were printed all in italics. Today it's considered poor typography to set large amounts of text in italics, but isn't that because we are just not used to it?</p>
      <p>Israelis love the Koren font. They think it's really really legible. So perhaps it's different for people that read Hebrew all day than it is to people who read English all day. I honestly don't know.</p>
