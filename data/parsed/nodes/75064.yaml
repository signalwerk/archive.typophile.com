      <p>&gt;&gt; Israelis love the Koren font. They think it's really really legible. So perhaps it's different for people that read Hebrew all day than it is to people who read English all day. I honestly don't know.</p>
      <p>To me the added differentiation, many of the angled strokes, seems like it would add legibility, just like many of the rounded forms in Hadasa. If each letter was constructed in a very rigid way, and there was very little differentiation, this would make things less legible.</p>
      <p>I think the main reason that it's different for people who read English all day as opposed to Hebrew, is the fact that they may not be familiar with some of the forms Hebrew letters can take on. In all of the English introductions and lessens for Hebrew I've seen, they have really only used some very old Hebrew typefaces. Both Hadasa and Koren look a bit odd to many westerner's eyes, this is not even mentioning sans Hebrew fonts. I remember showing someone a Hebrew sans font, and she was saying "Are you sure that's Hebrew...? I don't know, that's really weird." So I showed her some awkyts/serif fonts, and she liked them much better. When I tried to explain to her that Hebrew, like most other languages, has a variety of styles and forms it can take on, she had the most peculiar look on her face. I do not know, but I think that is the position many people who don't use Hebrew often take.</p>
