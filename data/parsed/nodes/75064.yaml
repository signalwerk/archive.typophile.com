      <p>Brian,</p>
      <p>&gt;&gt; I'll take time to ask this question now: earlier someone posted (GoHebrew, I think) that Koren isn't a very readable typeface. What is the basis for this statement?</p>
      <p>In my view, most PostScrpt, TrueType, and OpenType fonts, need multiple versions of the same font, a same weight, to be best viewed at different sizes.</p>
      <p>Larger point sizes needs tighter sidebearings, or narrower inter-letter spacing, than small point sizes which need wider sidebearings, or wider inter-letter spacing.</p>
      <p>Larger point sizes can have letters that have greater details, while smaller point sizes must have less details, to be legible and conducive to comprehension.</p>
      <p>Smaller point sizes too need design adjustments in certain letter like the shin for example. The spaces between its vertical strokes must be farther apart. On the other hand, the spaces between its vertical strokes in a larger point size must be closer together. As the point size increases, the closer these vertical bars get to each other. As the point size decreases, the farther apart these vertical bars get to each other.</p>
      <p>Koren has many details in the designs of its letters. For example, look at the aleph and the gimmel. They are complex. Many letters, like the chof and peh, have unusual angles. These are details which draw attention to the eyes of the reader.</p>
      <p>Hence, this design works better at larger point sizes, and do not work well at small point sizes, like Biblical text.</p>
      <p>The sample I saw was fairly large text. At that size, details are pleasing to look  at.</p>
      <p>Fonts like Romm Vilna, Rashi, Hadasa, David, and the fonts of Tzvi Narkiss, are excellent for small text. Romm Vilna had different designs to appear at larger sizes. Rashi, Hadasa, David, and the fonts of Tzvi Narkiss, simply do not work at larger sizes. Koren could work well at larger sizes.</p>
      <p>Raphael, was Koreen of Masterfont licensed from KP?</p>
