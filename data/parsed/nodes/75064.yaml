      <p>Bill: <em>I think I understand the differences now: The Israeli law allows font designs to be protected by copyright...</em></p>
      <p>The difference is always easier to comprehend if you avoid phrases like ‘font designs’.</p>
      <p>A font is always a particular technical implementation of a typeface design, and that is true whether you are talking about trays of cast metal, sets of Linotype brass matrices, Berthold glass photo discs, Letraset rubdown sheets, or an OpenType digital font file. A typeface is a design, a font is an implementation. Both the design and the implementation may involve original creative work, and different jurisdictions recognise that and protect that work as intellectual property in different ways. The recent Israeli ruling apparently establishes that, under Israeli law, a typeface design may be subject to copyright protection. This is different from e.g. US or Canadian law, in which the design is subject a different category of intellectual property protection (design patent or design registration).</p>
