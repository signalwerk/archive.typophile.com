      <p>Microsoft paid for Times, I assume. And they paid for their new Cleartype collection. But they imitated Helvetica with Arial, and were sued successfully over Segoe imitating Frutiger. You'd think that paying the creator and foundry would be cheaper than paying lawyers. I really don't understand them, as I really doubt that Zvi Narkis and Eliyahu Koren were making exhorbitant demands for rights. </p>
      <p>In an article I posted to the Hebrew section, it was said that Microsoft paid Zvi Narkis after years of his complaints to them. So I don't know how this relates.</p>
      <p>Both Narkis and Koren are "type heroes" who devoted their lives to improving Hebrew type and graphic design. So this is also symbolic. Koren died in 2001, and Narkis last month.</p>
