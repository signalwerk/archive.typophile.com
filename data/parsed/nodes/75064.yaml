    html: |-
      <p>The Haaretz article is hugely inaccurate. I just downloaded the pdf of the decision (in Hebrew). </p>
      <p>Here is the deal:</p>
      <p>1) The "most popular Hebrew sans-serif" is not at issue here at all. That is a whole other story in itself. I did the design of the Arial Hebrew for Monotype (who licensed the font to both Apple &amp; Microsoft), so I happen to know it. Firstly, it is true that Zvi Narkis made claims against my Arial design back in the 90's. Unfortunately, despite clear expert opinion Microsoft obtained that Arial was an original design and not a copy of "Narkis Tam", they chose to settle with Zvi Narkis instead of litigating. Interestingly, one of the plaintiffs in the current case – Zvika Rozenberg – was consulting Apple on the development of the Hebrew fonts [Apple was intimately involved in the process, while Microsoft licensed the already existing font] and was involved during my Arial creation process. What IS at issue in the current case is an alleged misuse of the font "Narkisim" (which NOT a sans-serif font at all). Even the illustration in this Haaretz article uses the wrong fonts, not "Narkisim".</p>
      <p>2) I only quickly scanned the court decision, but it is clearly not the end of the case. The merits of the claims were not at all discussed here, the decision pertains ONLY to the definition of the legal protection enjoyed by fonts. It is a long document full of learned back-and-forth on whether fonts are to be considered "designs" or "intellectual property". The decision was "intellectual property" (in original Hebrew "creator rights").</p>
      <p>3) There is nothing in the decision about any restraining order prohibiting further usage.</p>
      <p>4) The legal costs are to cover FOR THIS PARTICULAR part of the case by the losing side – the defendants.</p>
      <p>The merits of the case are still to be argued, it would be interesting to see what the claims are.</p>
