      <p><em>what makes all the versions of baskerville valid new and unique versions?</em></p>
      <p>They're not all new or unique relative to each other, but some are new and unique in themselves and none of them are slavish copies of a design by John Baskerville and John Handy in 18th Century England. They're all interpretations of a style, because the original Baskerville design only exists in artefacts produced by lost fonts, i.e. books, <a href="http://www.tiro.com/John/Baskerville-a.jpg" rel="nofollow">and you won't find any single instance of a letter on the page that is identical to another</a>. The original design is obscured behind the printing process, and hence any ‘revival’ is a work of interpretation and production of a new design, not of direct implementation of the original design.</p>
      <p><em>what makes new times roman not an avenue of theft from linotype?</em></p>
      <p><a href="http://www.truetype-typography.com/articles/times.htm" title="http://www.truetype-typography.com/articles/times.htm">http://www.truetype-typography.com/articles/times.htm</a></p>
