      <p>Now this discussed really has gone off topic, and subsequent discussion of tools and lookups really belongs in the Build forum.</p>
      <p>Israel, I only use VOLT for OpenType Layout work, not the Adobe FDK tool. I only use the Adobe tool for hinting PostScript fonts.</p>
      <p><em>Basically, if the Adobe tool supports the OT command I think it's called SIZE, then the GSUB replaces each letter, that's it.</em></p>
      <p>The OTL 'size' feature is <em>not</em> a GSUB feature and it will not substitute different glyph sets within a font for different text sizes. The 'size' feature is very problematic, and it isn't supported in any major software that I'm aware of (maybe in XeTeX?), although you can use the Adobe FDK to define the 'size' feature in your GPOS table (but you can't mix VOLT and FDK workflows). The 'size' feature uses a GPOS lookup to store some information about the sizes at which a particular font is designed to be used, such that, in theory, an application could choose the appropriate font from a large family containing multiple size masters. It's a hack: an official hack but still a hack. It makes use of a table usually accessed late in text layout for store information that an application needs even before it determines what font should be used for the text. It should be replaced by a better mechanism more likely to be implemented by software developers. Since size specific designs are predominantly implemented as separate fonts, rather than as variant glyph collections in a font, I favour something like a SIZE table that an application could access long before it needs to be dealing with GSUB and GPOS.</p>
    html_clean: |-
