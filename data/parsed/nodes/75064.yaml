      <p>National laws are always binding on foreign companies doing business in the relevant country. One may not be able to arrest those who are physically in foreign countries, but everyone within a country must obey the laws there, and assets within the country can be seized, the continued ability to do business in that country can be ended, and so on.</p>
      <p>However, your other points are interesting, and could well mean that Microsoft has nothing to worry about.</p>
