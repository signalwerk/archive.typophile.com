      <p>Having found "An Annotated Bibliography of Hebrew Typesetting" by Sivan Toledo (it is on his web site that "Über hebräische typen und schriftarten" was found), it turns out it has type specimens in it, it is not just a big list of books.</p>
      <p>At the top of page 8 I finally saw why Koren is a strange and unique typeface. On the letters He and Heth, it has a little point on the right side of the letter, making the top symmetrical. I can see that as a unique innovation.</p>
      <p>At the top of page 13, however, an illustration of Intertype's Hebrew Modern seems to be bad news for Gohebrew (Israel Seldowitz) - apparently a Lamed with a curled ascender has been done before. (On page 15, we see that Linotype got into the act as well.)</p>
