      <p>[By this point in the conversation, this response might be considered an aside.]</p>
      <p>Rich: <em>This has me confused. (You know, I confuse easily.)<br>
      For a design patent, you have to have drawings, right? Which, under your definition is yet another implementation of "the design".<br>
      So, if these are all "implementations" of "the design", where does the actual "design" exist?</em></p>
      <p>A set of drawings (or even a printout or PDF showing a typeface, which is a typical US design patent submission document these days) is not an implementation of the design, it is a showing of the design. An implementation of a typeface is a font, i.e. a functional tool for setting type. What distinguishes the design from the font is that the same design can be implemented in multiple formats or technologies, and even if the manufacturing demands of these technologies affect alterations to shapes, the overall sense of the design remains intact and identifiably the same. It is in this distinction, and the gap that it opens between a protected design and a protected implementation, that the lawyers make their money.</p>
