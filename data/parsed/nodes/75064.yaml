      <p>Israel, Hebrew on the right or left doesn't make a difference as far as the eye jumping from one side to the other, if the reader's eye jumps from the end of a Hebrew or English line to the beginning of a line in the other language. </p>
      <p>If you jump from the beginning of a Hebrew line or an English line to the beginning of the other language—which the imperfectly bilingual reader will want to do sometimes—then Hebrew on the left and English on the right is shorter, and better. </p>
      <p>I don't think the reader has any reason to jump from the end of an English or Hebrew line to the end of a line of the other language: he or she isn't going to learn anything that way. That would be the only situation where the eye jump is closer for Hebrew on the right, English on the left. </p>
      <p>For these reasons, when you have pages of fully mirrored text, I think that Hebrew on the left is better. Thus I followed the Koren Siddur example in my Pirke Avot: Timeless Wisdom for Modern Life, to be published this week by the Jewish Publication Society. It has an appendix with the whole of Pirkei Avot on mirrored pages, uninterupted by commentary, with the Hebrew on the left and the English on the right. I used Hadasa MFO and my Williams Caslon Small (not yet published as a font) on the right. As you might guess, I think the Williams Caslon Small looks a lot better than the latin font used for the small text in the Jerusalem Bible :) </p>
      <p>When the situation is mixed Hebrew and English on the same page, I think the best way to do it is a more complex decision. For example, I don't fault the beautiful new Conservative Machzor for Hebrew on the right. In the main text of my Avot, with the commentary, the Hebrew is on separate lines from the English, on the same page.</p>
