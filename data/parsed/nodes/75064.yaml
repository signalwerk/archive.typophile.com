      <p>&gt; that is the design must be artistic as opposed to purely functional.<br>
      &gt; * According to para. 52 of the decision, for the design to satisfy the third<br>
      &gt; requirement it must be guided "mostly" by artistic considerations. This prong of<br>
      &gt; the test may cause problems in the future.</p>
      <p>Why problem? </p>
      <p>There is a reason why the judge Gruschkopf had mentioned different cases. In the  Interlego case Supreme Court judge Meir Shamgar  added the artistic or artistry  criteria because his aim was to prevent   one  side from gaining a  monopoly if the case was judged on functionality alone. </p>
      <p>There are several  artistry  criteria:<br>
      1. the choice option where the buyer has the option to choose from  several products on the shelf.<br>
      2. the creator's intention.<br>
      3. how the public accepted/viewed the product.<br>
      4. willingness of the public to pay for that product [if they think that the product is good and worth the expenses]<br>
      5. aesthetic<br>
      6. artistry</p>
      <p>Now the judge Gruschkopf said in section 52 that effort by itself is not enough. This is clear, why?  Let's say that a person is "designing"  typefaces by tweaking other designs, where no intention or care is given  to other aspects of the design; so this kind of case won't hold water. </p>
      <p>Judge Gruschkopf is saying that a typeface could and should be  under the umbrella of creator rights. He understands that a typeface design is  not a one day task/job, and the designer should have a long time to hold the rights to the designs in order to gain profit!<br>
      And by the law (Duration of Copyright, section 38): "Copyright in a work shall subsist during the life of its author and for 70 years after his death, subject to the provisions in this chapter."</p>
      <p>BTW, the judge is not accepting the view that   a typeface that was designed in the digital era is subject to a different law treatment than a typeface that was made by trays of cast metal.<br>
      This is also based on the ruling of Shamgar in the case of Interlego.</p>
