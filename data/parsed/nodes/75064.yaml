      <p>Readability versus Attractiveness</p>
      <p>Earlier, it was noted by Raphael that Koren was very readable, even at smaller point sizes. </p>
      <p>I argued it was not. Of the popular Hebrew typefaces, FrankRuehl, Hadasa, David, and the font designs of Tzvi Narkiss, Koren was the least readable, because of various factors. See above.</p>
      <p>Brian, who is not a Hebrew reader, agreed with Raphael, for the same reasons which I cited made Koren not readable.</p>
      <p>I think his terms are confused. A letter with many unusual features, and diagonal cuts on its ends, are attractive, and draw the attention of the eye.</p>
      <p>According to the established theory of 'eye movement', these (details and diagonals) are factors that will show down the eye in reading, and reduce readability, although they are in deed attractive.</p>
