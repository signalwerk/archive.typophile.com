      <p>Raphael, I don't agree that readability is only a matter of familiarity. Nor do I think Koren would have agreed, looking at his typeface, where he took pains to increase the differentiation of Hebrew letters along the tops of letters—less familiar but perhaps promoting readability. </p>
      <p>In Eurpoe, the all-italic style was quickly abandoned. And today, European readers are very familiar with italic, yet you almost never see a whole book of text published in it. </p>
      <p>There has been a lot of digital ink spilled on this subject on Typophile, and while there are big differences, I think it fair to say that most agree that there are some typefaces that are inherently less readable than others particularly at small (text) sizes in extended, continuous text. </p>
      <p>Good to know you are improving the text for small sizes.</p>
