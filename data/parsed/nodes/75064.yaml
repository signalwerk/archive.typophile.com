      <p>Typefaces are designs, while fonts are software. I assume that while Microsoft made use of the design of the typefaces in question, either Microsoft, or the company from which it licensed what it used in its products, originated fonts corresponding to those designs. And so Microsoft is being sued under an unusual Israeli law, which protects typefaces by the copyright law, instead of (as designs) by patent law.</p>
      <p>If the allegations against Microsoft, and its response, are both true, then I would expect things to play out like this: the fact that Microsoft may have been a victim of fraud when it licensed the typefaces in good faith would not entitle it to continue using them - it could recover what it owes to Koren from Kivun, <em>if they have the assets</em>, but this wouldn't necessarily be a shield for Microsoft against civil liability the way it is against criminal liability. (Under some circumstances, the court could go tell Koren to sue Kivun, at least to recover damages for past use, but generally acting in good faith doesn't protect one from being liable even when the moral fault is really someone else's.)</p>
