      <p>What I see is that Crown and Koren are "similar" to the extent that both are calligraphic serif typefaces with substantially less stroke contrast than the traditional typefaces for Hebrew.</p>
      <p>That doesn't make them identical, but in the case of Microsoft, a font for the identical typeface was, of course, what they licensed, allegedly from the wrong company, so this doesn't directly impinge on that.</p>
      <p>Certainly, in the English-language world, while typefaces do have some limited design protection, it isn't possible to pre-empt a whole genre of typefaces. Thus, the designer of Papyrus can't sue the designer of Ereshkigal - a similar face which is not a knock-off, but an original face although similar.</p>
      <p>If Israeli law makes it possible for one typographical firm to own a huge swath of modern Hebrew typography, this appears to be cause for concern.</p>
