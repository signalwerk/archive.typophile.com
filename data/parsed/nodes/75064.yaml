      <p>The article mentioned above</p>
      <p>see <a href="http://www.haaretz.com/print-edition/business/groundbreaking-hebrew-fonts-are-not-public-domain-1.318133">www.haaretz.com/print-edition/business/groundbreaking-hebrew-fonts-are-n...</a></p>
      <p>seems to be sort of a hoax or sort of a legal joke.</p>
      <p>1) The Israel copyright law does not contain any provisions for the copyright protection of fonts.</p>
      <p>see <a href="http://www.tau.ac.il/law/members/birnhack/IsraeliCopyrightAct2007.pdf">www.tau.ac.il/law/members/birnhack/IsraeliCopyrightAct2007.pdf</a></p>
      <p>2) The Israel copyright law as a national law is not binding for any foreign country, especially here it is not binding for Microsoft as a USA company.</p>
      <p>3) Both Israel and the USA are members of the RBC (Revised Berne Convention), but the USA became a RBC member four decades after the publication of the 1950 Hebrew fonts mentioned above.</p>
      <p>see <a href="http://www.wipo.int/treaties/en/documents/pdf/berne.pdf">www.wipo.int/treaties/en/documents/pdf/berne.pdf</a></p>
      <p>4) So, even if the 1950 Hebrew fonts were copyrightable as per the Israel copyright law (which they are not), this would be irrelevant for Microsoft, because the USA became a RBC member in 1989, while the 1950 Hebrew fonts were issued forty years earlier.</p>
