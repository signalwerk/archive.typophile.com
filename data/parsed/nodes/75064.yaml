      <p>Althous many letters are in deed similar, as it appears that Koren early versions and original were both based on the same source, Koren's final clearly contains many optimized changes for printing that mine does not have, as it was hand-drawn and not made for a medium that did not exist yet.</p>
      <p>I only are looking at these 10 letter difference as seen in Tzvika Rosenberg of Masterfont's digitised version of Koren.</p>
      <p>Most obvious is the poor spacing or kerning between the lamed (on the right) and the yud (on the left), as seen here: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mf koren li_4137.jpg"></div><p></p>
      <p>Lokk at the difference between he lamed (on the right) and the yud (on the left), and the difference between he lamed (on the right) and the chof (on the left), as seen here:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/mf koren lc_5231.jpg"></div><p></p>
      <p>The problem here is not in the design but the type philosophy of the dizitizer. He has many bad typography attitudes which in my view render him a non-professional etc.</p>
      <p>He once told me in the mid eighties when his Masterfont was still his dream, and he rode on a bicycle then to appointments, for whatever reason, long before it was cool and environmentally idealistic:</p>
      <p>"The hirik or shva position beneath the daleth or reish should be positioned on the right of bottom leg, so the viewer can distinguish it apart".<br>
      I retorted that "Jews have correctly placed underneath since we have had nikkud".</p>
      <p>Clearly, his ideas do not conform with aesthetics or traditions.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dd_3736.jpg"></div><p></p>
      <p>There may seem minor issues. But we are dealing with holy books in Hebrew, ancient scribal traditions, which good Hebrew typesetting should emulates, as Maimonides rules in the laws regarding the writing of a Sefer Torah in his Mishnah Torah codex of Jewish laws.</p>
      <p>One who deviates from these traditions is considered invalid. Creativity should allocated to that which is permissible.</p>
      <p>When one creates a font on the Apple Macintosh, the time and date is recoded permanently. I reviwed fonts from various font maker from Israel. Almost every font was created on the Sabbath, in violation of the Bible and Jewish law. What cares I, or what cares anyone? Everyone is free to do whatever the wish.</p>
      <p>But holy books are different, say I. A prayerbook or a Bible should respect the Sabbath. No, Raphael?</p>
