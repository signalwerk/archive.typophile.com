      <p>The sample I saw was fairly large text. At that size, details are pleasing to look  at.</p>
      <p>Fonts like Romm Vilna, Rashi, Hadasa, David, and the fonts of Tzvi Narkiss, are excellent for small text. Romm Vilna had different designs to appear at larger sizes. Rashi, Hadasa, David, and the fonts of Tzvi Narkiss, simply do not work at larger sizes. Koren could work well at larger sizes.</p>
      <p>Raphael, was Koreen of Masterfont licensed from KP?</p>
