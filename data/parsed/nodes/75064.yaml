      <p>Yes, gohebrew, as I mentioned earlier in this thread, Koreen of Masterfont was licensed from Koren. Eliyahu Koren even made some slight changes. We get royalties from sales of Koreen. But now you can also purchase from Masterfont, Koren. So you have a choice, both of Koreen and Koren. The company's preference is for people to purchase the real Koren font now that it has been fully digitised, but if somebody has started a project in the Koreen font and somebody else continues it and they want the same typeface, then clearly they may prefer to purchase Koreen.</p>
      <p>Regarding your comments about the font should change as the size changes. In principle I fully agree with you. The gimmel used to be the famous example where the tail of the gimmel should move further away as the letter gets smaller. I think that this was relevant for lead and could have been relevant for multiple masters, a technology that ceased to exist, and I think that Adobe have addressed that to a large extent with their new typefaces with caption, subhead, display etc optical weights. In practice, it's probably not going to happen though :-)</p>
