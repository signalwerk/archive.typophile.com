    html: |-
      <p>John, the decision was about the design itself, not the digital fonts. The claim is against an "unauthorized digitization" of these Narkisim and Koren designs by a third party.</p>
      <p>Moreover, it is a well-established law in Israel that the design itself is protected. The question here was not 'weather' it is protected, but rather 'under what rubric' does this protection fall? If a font is to be protected as a "design" – מתגם, then there is a time expiration on this protection (like with a patent). If they are to be protected under "creator rights (copyright)" - זכויות היוצרים, then the protection either doesn't expire at all or has a much longer shelf life (I am not clear on that last point). This question is irrelevant for newer designs that are protected in either case, but the designs in question date back to 1950's, so it is very relevant indeed.</p>
      <p>[Btw, the idea of a separate hearing on this purely legal issue was (according to this decision) proposed by the Judge himself in a pre-trial hearing back in March and accepted by both sides. Thus they can now proceed with the actual case based on this decision. My guess is that Microsoft will attempt to settle the case and might go after the entity that licensed the fonts to them in the first place.]</p>
