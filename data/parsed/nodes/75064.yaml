      <p>Raphael quotes:</p>
      <p>Baruch:<br>
      "other words, whoever did the digitizing of these fonts must have relied on the US law that only protects the actual electronic fonts of the non-patented art."</p>
      <p>This is exactly accurate, Raphael.</p>
      <p>US Copyright law rejected applications for font software as being "digital data that described letter forms".</p>
      <p>After outline typeface software was released by Adobe in the verbal PostScript language as scalable outlines defined mathematically, and later by Apple and Microsoft as TrueType, font software was no longer "digital data that described letter forms".</p>
      <p>So, the very conservative US Copyright Office now required outline typeface applicants to sign a disclaimer, rendering their applications powerless.</p>
      <p>I refused to sign in 1989.</p>
      <p>A long correspondence ensued between the then head of the US Copyright Office, Ms. D Lawrence, and myself, then the CEO/President of Font World, Inc. She asked me why the US Copyright Office should accept my applications for hundreds of outline typeface fonts in every world language except Chinese, Japanese, and Korean.</p>
      <p>I presented an analogy, which explain in easy-to-understand terms why the US Copyright Office should accept my applications.</p>
      <p>I told them that an outline typeface software was like telling a common story. Some storytellers are good, and some storytellers are better. It's the same story, but each one tells it different. </p>
      <p>One uses this word, while another uses that word. This is like placing the BCPs, the bezier control points in a PostScript font here or there, although the result look similar. However, one way renders better than the other.</p>
      <p>The US Copyright Office accepted this explanation, and issued me and those after me, US Copyright registration, granting me full intellectial property protection, even for Crown, inspired by the public domain design, that Eliyahu Koren claimed untruthfully for himself. The date was 1989.</p>
      <p>US Copyright law sign by the State of Israel in 1988.</p>
      <p>In the USA, US Copyright law does apply to art designs, such that employed by Eliyahu Koren. Rather, US Patent law applies, if certain conditions are met, as done by Linotype for Times-Roman. Eliyahu Koren never made a US Patent application, because to do so was too complicated until very recently.</p>
      <p>Hence, no intellectual property protection applies.</p>
