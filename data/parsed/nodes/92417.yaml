    <p>Hi,</p>
    <p>I was hoping someone could help me identify this geometric sans-serif typeface I came across on this Amsterdam based PR agency's website: <a href="http://schoondenboer.nl/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://schoondenboer.nl/</a>. It has very distinctive lower caps g's and y's.</p>
    <p>Thanks !</p>
    <p>Thom</p>
