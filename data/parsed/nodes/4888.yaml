    html: <p>Yes. <br> <br>InDesign (and the Mac OS) try to identify the codepage of the font to decide which language section of the font menu it belongs with. <br> <br>This approach has limitations, of course, when you have fonts that support multiple codepages. <br> <br>Does this approach seem reasonable to you? What would you suggest? <br> <br>T</p>
