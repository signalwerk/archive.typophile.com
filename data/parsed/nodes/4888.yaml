      <p><a href="http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html">Extending Cyrillic (and later Latin) character sets</a></p>
      <p>Hypatia Sans Pro, Thomas’ upcoming typeface family will also include the following characters:<br>
      U+0498	Zedescender<br>
      U+0499	zedescender<br>
      U+04A0	Kabashkir<br>
      U+0401	kabashkir<br>
      U+04AA	Esdescender<br>
      U+04AB	esdescender<br>
      U+04D0	Abrevecyr<br>
      U+04D1	abrevecyr<br>
      U+04D6	Iebreve<br>
      U+04D7	iebreve<br>
      U+04F2	Uhungarumlautcyr<br>
      U+04F3	uhungarumlautcyr<br>
      U+04E6	Odieresiscyr<br>
      U+04E7	odieresiscyr<br>
      U+04C1	Zhebreve<br>
      U+04C2	zhebreve<br>
      U+049C	Kavert<br>
      U+04B8	Chevert<br>
      U+049D	kavert<br>
      U+04B9	chevert</p>
      <p>These characters will add coverage for a few more Cyrillic languages:<br>
      Azeri<br>
      Bashkir<br>
      Chuvash<br>
      Dargin<br>
      Komi (Zyrian &amp; Permyak)<br>
      Moldavian (Cyrillic)</p>
