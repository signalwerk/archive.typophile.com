      <p>First, Thomas and speter, both those links result in an infinite redirect between <a href="http://www.adobe.com" title="www.adobe.com">www.adobe.com</a>... and store.adobe.com... But, this one does the trick:<br>
      <a href="http://www.adobe.com/type/browser/C/C_cyrillic.html" title="http://www.adobe.com/type/browser/C/C_cyrillic.html">http://www.adobe.com/type/browser/C/C_cyrillic.html</a></p>
      <p>Second, may I applaud Adobe’s efforts to design fonts with the whole character-set enchilada: Latin, Cyrillic and Greek. (Though, would a Greek enchilada feature feta? I digress.) I, for one, set a lot of type that features other languages and certainly prefer to use the same font for all the different editions. However, there are precious few quality fonts that feature the character-set trifecta and even fewer that also include support for East Asian diacritics (specifically, for me, Vietnamese).</p>
      <p>So, thanks, Thomas, for Myriad Pro, Minion Pro, Warnock Pro, Garamond Premier Pro, etc. I look forward to seeing the three new fonts soon. I can only hope that other foundries follow your example in this global age of communication to offer their fonts to users of non-Western alphabets.</p>
