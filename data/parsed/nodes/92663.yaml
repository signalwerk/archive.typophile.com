      <p>It’s interesting that the common glyphs in Greek-Latin-Cyrillic are not identical.<br>
      There’s no reason they need to be, except perhaps in multi-script display settings.<br>
      Did you experiment with that kind of layout?</p>
  - id: 508445
    user: 93940
