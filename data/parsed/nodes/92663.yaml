    <p> I am happy to announce the release of our new typeface: Colvert.</p>
    <p>Colvert is made by four designers: Natalia Chuvatin, Jonathan Perez, Kristyan Sarkis and Irene Vlachou.   Colvert is comprised of four families: Colvert Arabic, Colvert Cyrillic, Colvert Greek and Colvert Latin. These four type families can be used alone, or blended with one another, in an harmonious way. Each family has been made by a designer native speaker of the concerned writing system.   </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/colvert2_3893.jpg"></div><p></p>
    <p>This character has been envisioned as a peculiar approach to the question of the relationship between different writing systems. Each of the four families that make up Colvert is as visually differentiated as possible. We have tried to establish a minimum optical continuity and not to seek homogeneity between these type families, so each one can express at the best its own characteristics.   </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/colvert3_6154.jpg"></div><p></p>
    <p>Colvert includes all that seems to us necessary for the professional use of a publishing typeface for print: extended support for languages (more than 100 languages), small capitals (Cyrillic, Greek and Latin), oldstyle figures, polytonic Greek and Arabic ligatures.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/colvert5_6022.jpg"></div><p></p>
    <p>- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -<br>
    To download the type specimen, see <a class="freelinking external" href="http://www.typographies.fr/uk/index.php?page=fontes&amp;s=Colvert" rel="nofollow">this page</a> on the website of our foundry.<br>
    For more information on Colvert Arabic, see <a class="freelinking external" href="http://www.kristyansarkis.com/index.php?/root/colvert-arabic/" rel="nofollow">this page</a> on the website of Kristyan Sarkis.<br>
    Arabic Production made by Mathieu Réguer.</p>
    <p>Yours sincerely<br>
    &nbsp;<br>
    Jonathan Perez<br>
    <a href="http://www.typographies.fr" title="www.typographies.fr">www.typographies.fr</a></p>
