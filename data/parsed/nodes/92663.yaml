    votes: null
    html: |-
      <p>Thanks for your comments.<br>
      About your question: the goal was to work on differenciation, but we have tried to avoid taking systematic decisions. For each glyph, we have tried to think wether it is interesting/logical or not to make a differenciation.<br>
      Then, when we have taken the decision, I think we must keep this, even at display sizes (even if we can imagine how we design the difference could change between text and display sizes).</p>
