    html: |-
      <p>Ooohhh — rubdown type… I had hundreds of sheets of that. MecaNorma, Letraset, Chartpak and others. Even some that were not rubdown, but more or less floatdown (you’d cut out the bits, separate from the backing in water and place the transparent plastic with printed type on your layout).</p>
      <p>A big part of that was Helvetica, I am ashamed to admit, because I did a lot of exacting layouts for those information and serial number plates on machinery (best I did was for a F-16 droptank, but that was in Univers). You needed black as well as white type for that (the layouts were reversed) and white type was a bitch to work with — it would crack when you just looked at it. I must have tried every available rubdowntool available at the time. Had quite a collection of scalpels and x-acto’s too.</p>
      <p>Before rubdown I would hop over to the art school 400 yards from my high school during lunch break, set type and make prints on baryte, to use in the high school magazine I designed, edited and illustrated almost singlehandedly. Learned to love Gill Sans.</p>
      <p>Tossed all of the rubdowns the second year after I went Mac. Most of the eeeee’s and EEEEE’s were gone, anyway.</p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
