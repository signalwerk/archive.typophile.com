    html: |-
      <p>In 1991, I purchased several typefaces from <a class="freelinking-external" href="http://www.imageclub.com/">Image Club</a> in Calgary, Alberta. I had just written a magazine feature about the company and was excited at the prospect of choosing from what seemed at the time like an extensive catalog of type. The idea that I could go beyond what came on the Mac or with software packages seemed pretty wild.</p>
      <p>Three that I remember being on those hotly anticipated floppies were: </p>
      <p><strong>Groschen</strong> (a quirky, wide sans serif that I can’t seem to find on reputable commercial font sites, only as a free TTF download from a site theat seems sketchy — won’t name it here);</p>
      <p><strong>Caslon Antique</strong> (Did I mention I was living in Alberta? The rustic aesthetic must have rubbed off on me); and</p>
      <p><strong>Liberty</strong> (again, I don’t see it available at reputable commercial font sites, but it looks like <a class="freelinking-external" href="http://new.myfonts.com/fonts/bitstream/goudy-handtooled/">Goudy Handtooled</a>)</p>
