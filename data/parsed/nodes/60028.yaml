      <p>The first three fonts I bought were part of a load of type that damn near busted the springs on my brand-new 1971 Datsun pickup. I had found this lode over near West Burke, Vermont.</p>
      <p>I know there was one case of large Goudy Handtooled (see previous post for a link). What else was in that type stand I do not recall. I cleaned out the mouse poop, re-sorted all the foul distribution, and then . . . never used any of it, for I had no press. I sold it, for less than I paid, to the pressroom supervisor where I worked.</p>
      <p>The first day FontShop SF was in business I ordered a font (on floppy). Since it was their first-ever order they threw in a floppy with another font on it. I never used that one, either. The floppy rotted away in my nasty basement after we moved.</p>
      <p>powers</p>
