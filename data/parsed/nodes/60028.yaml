      <p>Three weights of Berthold “Boulevard” in 1967.</p>
      <p>That’s to say, real lead type!</p>
      <p>Had to import all the little packets wrapped in brown paper, from Germany into the UK, and lay them out in the second-hand type cases I had set up in my father-in-law’s garage.</p>
      <p>Cost me the equivalent of about $40,000 in today’s prices for just 3 weights (24pt, 18pt, 14pt, if I remember correctly, which sometimes I don’t after 42 years in the typesetting &amp; print trade).</p>
      <p>But I wanted it as something special that I was convinced would make my newly-started Wedding Invitation business really stand out!</p>
      <p>And now you can get it as a free download!!   :&lt;</p>
      <p>PHILIP CAPLAN</p>
