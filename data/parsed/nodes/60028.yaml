      <p>(Will, how could you be in this business &amp; afford a new vehicle?)</p>
      <p>Our typesetting machine (A-M) came with a bunch of fonts. These seemed sufficient for a while. The first two “fonts” I ordered were a special Times Roman — all the ligatures, old-style numbers, and small caps on one disk, and a special Berner (aka Sabon) with the same. They had to dig into the drawing drawer for the ligatures. The A-M “Sabon” were copies of Monotype drawings. </p>
      <p>The special work made them cost about US $500 each circa 1980; couldn’t afford a third one for a while.</p>
