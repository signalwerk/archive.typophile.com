    html: |-
      <p>Optimal line length depends on layout.</p>
      <p>Longer line lengths are slower if they increase the possibility of going astray between lines.</p>
      <p>If there is more leading, or paragraphs with fewer lines, that likelihood decreases.</p>
      <p>A page layout of really long lines, separated into three-line paragraphs, would, I predict, read very quickly. </p>
      <p>In particular, the reader would pick up considerable speed along the straights, before going into the hairpins.</p>
      <p>Page-width decks of 100+ characters, three or four lines deep, are quite manageable.</p>
