    <p>In his book <em>The Elements of Typographic Style</em>, Robert Bringhurst sets forth what he considers to the be the ideal for setting text. He states:</p>
    <p>- 45 to 75 characters line length (measure); specifically 66 including spaces; Single Column<br>
    - 40 to 50 characters; multi-column<br>
    - 85 to 90 characters; discontinuous text; generous leading<br>
    - 40 characters (minimum); justified<br>
    - 12 to 15 characters; marginal notes; English</p>
    <p>He also discusses the ideal page to great detail on pp. 171–176.</p>
    <p>I'm hoping to find other authors who've written down their ideals. What have you found as you've read? Would you share your findings? Even just the books and page numbers would be helpful.</p>
    <p>Thanks!</p>
