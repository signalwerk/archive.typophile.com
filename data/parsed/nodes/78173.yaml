      <p>If one is going to eschew ragged-right setting as an option, too many hyphens are distracting. So if a guideline for column width is only going to be used as a rule for deciding when to split the page into two columns, as the size of type is out of the control of the typographer (it being, presumably, the minimum one can get away with), then a broad range, like 1 1/4 alphabets to 2 1/2 alphabets, which encompasses a factor of two, makes sense.</p>
      <p>Let us then take, not 1 3/4, not 1 1/4, but... 1 5/8 alphabets as the optimum line length. 2 is a bit long, 1 1/2 is a bit short, but the shorter one is closer to the optimum. 1 1/4 to 2 1/2 are the acceptable range.</p>
      <p>So, as the part of the page left after the margins gradually widens, we know what to do.</p>
      <p>When that width passes 2 1/2 alphabets, we split the page into two columns at 1 1/4 alphabets.</p>
      <p>When it reaches 4 1/2 alphabets, that leaves us with two columns at 2 1/4 alphabets which we can split into three columns at 1 1/2 alphabets. But perhaps the point at which we should go from two columns to three is a bit earlier than this.</p>
      <p>When it reaches 6 alphabets, we pass from three columns at 2 alphabets to four columns at 1 1/2 alphabets.</p>
      <p>To conserve our forest resources, margins are also unlikely to be as generous as they ideally should be. Personally, I tend to think of anything over 3/4 inch as ostentation, but there is a time and place to wallow in that. A short book of fairy-tales for children, for example, should be made to look like William Morris or someone of similar tastes had printed it.</p>
      <p>While I am partial to crystal goblets, I also think there are exceptions, and not every book should fit this pattern. There are times when it is entirely appropriate for a book to have a noticeable and distinctive look that fits its contents, and yet does not obstruct reading.</p>
