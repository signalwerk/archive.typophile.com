      <p>Maybe not the most authoritative source, but worth a mention:</p>
      <p>Indesign Type – Professional Typography with Adobe InDesign,<br>
      Chapter 14 – Pages, Margins, Columns, and Grids, p. 240</p>
      <p>"As a rough guide, aim for 40 to 70 characters (including the spaces) per line.<br>
