      <p>Maybe not the most authoritative source, but worth a mention:</p>
      <p>Indesign Type – Professional Typography with Adobe InDesign,<br>
      Chapter 14 – Pages, Margins, Columns, and Grids, p. 240</p>
      <p>"As a rough guide, aim for 40 to 70 characters (including the spaces) per line.<br>
      That’s a big range, so there’s plenty of scope. More than 70 characters and<br>
      “doubling” can occur — the eye returns to the left column edge only to read<br>
      the same line again. If you are obligated to work with a measure that is too<br>
      wide, you can improve its readability by increasing the leading of your type."</p>
