      <p>@Miss Tiffany:<br>
      <cite>these people mention characters per line OR line lengths. Very few mention both and include point size.</cite></p>
      <p>Well, I was puzzled by the standard applied in the reference I cited. It cited several authorities that only mentioned one, but they were able to show a comparison chart and equivalence line lengths to characters per line. They had assumed a specific point size, 10 points, and I suppose that helped them, but I have to suspect they may have been guessing in some cases.</p>
      <p>But, as I noted, while something <em>like</em> point size is needed if you want to convert between "alphabets" and "pica ems" (<em>A Composition Manual</em> actually just said picas, but other references always use the term "pica em" for a pica as a horizontal distance; I don't know if that's more correct or archaic, though), point size itself just doesn't cut it.</p>
      <p>Some faces are condensed. Some faces have a larger x-height than others.</p>
      <p>Now, it could be that there are <em>two independent constraints</em> on line width - one relating to the amount of text in a line, the one I've been investigating, coming to the conclusion that the range 1 1/2 to 2 3/4 alphabets is appropriate - and another relating to the absolute width of a line.</p>
      <p>After all, if one assumes that a book is held at some standard distance from the eyes, it's the absolute width of the column that determines how much eye movement is necessary.</p>
