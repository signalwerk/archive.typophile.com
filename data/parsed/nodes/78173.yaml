      <p>Personally, I tend to hate long line lengths, where I have to turn my head to read. I have much less issue with short lines. This is surely affected by point size so character count and leading are not the only factors. I find that line length is determined mostly by other layout and fitting concerns.  This is not true when doing a straight text novel but I have never done one of those. When reading a straight text book, I tend to like the way Unger's book "While You Were Reading" is set. I can read the text easily without getting whiplash and can hold the book at a nice comfortable distance.</p>
      <p>I am not much for "magic" combinations of proportion, length, size, and leading but I do like a nice healthy margin to separate the text from the background clutter of the world.  This is my opinion and is not science by any means.  It seems there have been fashions of setting that have come, gone, and returned. There have also been technological reasons like newspaper fitting and simple things like physical galley dropping.  It must be a bitch to carry around a galley of type that is 10 inches wide! In magazines and newspapers, you have the positioning of ads and graphics to consider so they tend to be multi column.  Itis like cooking, the more ingredients you have, the more complicated the apportionment process.</p>
