      <p>&gt;if one assumes that a book is held at some standard distance from the eyes</p>
      <p>That raises an interesting question: do we instinctively change the distance of the book from our eyes when there is larger or smaller type? I don't know, but I would guess that we do. I suspect that there is a narrow comfort range for the visual angle of a word, and we instinctively adjust for that. Given that we hold books pretty close, a few inches one way or another will change the visual angle a lot.</p>
      <p>This ought to be pretty easy to test, by giving people reading material, not telling them what is tested--or tell them to focus on content--and check how far they hold books with differently sized type.</p>
