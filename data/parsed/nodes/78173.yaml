      <p>And, of course, if one wishes to see a paradigm of "The Ideal Book or Book Beautiful", which "is a composite thing made up of many parts"... Ecce Mundus: Industrial Ideals and The Book Beautiful by T. J. Cobden-Sanderson, published by the Hammersmith Publishing Society might serve.</p>
      <p>Although the second essay therein was more definitively published by the Doves Press, if I recall correctly. Ah, yes.</p>
      <p>But William Morris wrote an essay with a similar title, which began, "By the ideal book, I suppose we are to understand a book not limited by commercial exigencies of price"... but it continues on to say "I would therefore, put in a word for some form of gothic letter for use in our improved printed book. This may startle some of you;"... and I am indeed startled, although not truly surprised, as I am aware of his Troy and Chaucer types.</p>
