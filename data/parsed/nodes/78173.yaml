      <p>Here is an actual historical example, but still an <strong>artificial</strong> one, due to how it was chosen, as I will explain below, of a line with a width of 4 alphabets.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ideal_w12_4234.jpg"></div><p></p>
      <p>This is from <em>Williams' Syllabic Dictionary of the Chinese Language</em>. For the most part, where there is textual matter, the page is split into two columns. This includes the Introduction to the work, but not the Preface, which extends in a single column across the page.</p>
      <p>The Preface is, therefore, set in a larger type. The text in the example, however, is from an extended quotation from <em>within</em> the Preface, which is thus in a smaller type than the surrounding text.</p>
      <p>Thus, those who typeset the book were under no illusions that a line width equivalent to 4 alphabets was desirable, but it was considered tolerable for a short bit, and preferable to disturbing the over-all layout of the book and the page.</p>
