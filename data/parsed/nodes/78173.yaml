      <p>&gt;That raises an interesting question: do we instinctively change the distance of the book from our eyes when there is larger or smaller type?</p>
      <p>I was just working on that, not for size which I assume we set up to read for text... and our eyes, not our hands, do the rest of the adjustment. </p>
      <p>But here are two snaps from an ebook layout experiment I'm working on where different renderings, (ct vs std) cause (me at least) to seek a different distance for the first image, (around 25% farther away than usual) as it seems to change appearances from closer to farther.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/WindowsCTPublisher_5756.PNG"></div><p></p>
      <p>vs. the second, which seems more comfortable at a range of distances and does not seems to change appearance. </p>
      <p>(I'm working on the ironing out the spacing differences.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/WindowsStdPublisher_5879.PNG"></div><p></p>
