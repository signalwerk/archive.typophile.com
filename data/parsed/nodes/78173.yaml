      <p>I came across a comment in a fairly heated discussion about 'ideals' in typography on a <a class="freelinking external" href="http://www.pearsonified.com/2011/12/golden-ratio-typography.php#comment-185716" rel="nofollow">blog post</a>.</p>
      <blockquote><p>
      People look at 55 +- 10 as desirable because they believe it looks less assuming, and they think they can read it faster.</p>
      <p>What people think isn’t always in line with the truth though…</p>
      <p>In reality, people read longer line lengths faster, thus making longer line lengths more optimal.</p>
      <p>The trick is, you must start an article with a shorter line length so you get people to start reading your stuff. Then, you widen your content out so they can continue reading it as fast as possible.</p>
      <p>(You might think people will stop reading, but copywriters have long known that once you get people to read the first few sentences, they’re more likely to finish what they started).
      </p></blockquote>
      <p>Here Derek presents some evidence from studies that conclude longer line lengths are actually quicker to read, </p>
      <blockquote><p>
      “Line length has also been found to affect reading rate on screen (Duchnicky &amp; Kolers, 1983; Dyson &amp; Kipping, 1998). Both studies, although using different display technologies, found that longer line lengths (about 75 and 100 characters per line, respectively), were read faster than very short lines.”</p>
      <p>“Reading time was converted to words per minute. Results from a one-way within subjects ANOVA showed that there was a significant main effect of line length on reading speed, F (3, 57) = 3.45, p = .02, η2 = .15. The 95 cpl (M = 178.82, SD = 41.83) articles were read significantly faster than any of the other line lengths (35 cpl M = 167.21, SD = 33.66; 55 cpl M = 167.38, SD = 33.96 ; 75 cpl M = 169.44, SD = 33.48) (Figure 1).”</p>
      <p>“Youngman and Scharff (1999) used 12-point type and found that with no margins, when compared with 4 and 6 inch line lengths. Again, an 8-inch line length elicited ￼￼the fastest overall reading speed. users preferred the 4-inch.”
      </p></blockquote>
      <p>Thoughts, Typophiles?</p>
