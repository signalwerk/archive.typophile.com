      <p>another source:<br>
      an essay by Jan Tschichold in his collected »Schriften« (two vols., Brinkmann &amp; Bose, early 1990s). From what I remember, he addresses the relationship between measure and paragraph breaking. He argues that while it's obviously easier to get a decent-looking paragraph (fewer holes, less hyphenation) using, say, an 18-pica measure as opposed to a 9-pica measure, there are cases where (for a given font), say, a 12-pica measure will yield a better paragraph breaking than a 13-pica one. He lists a couple of examples, along the lines of: »for a 9pt Monotype Baskerville, use a 15-pica measure rather than a 16-pica one« etc. In case I find a copy at the libraray, I'll scan a couple of his illustrations; maybe someone's interested...</p>
