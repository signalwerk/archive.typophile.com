      <p>Obviously, on an e-book reader, it would be crazy for it to behave like some web sites do, and allow books to have characteristics that make them very awkward to read - like page formats that require you to scroll back and forth when reading each line, unless one chooses to display the page at an unreadably small size.</p>
      <p>But making the book's text able to dynamically reflow creates the problem that formatting is very restricted. A good page markup language might be able to support all the features of a conventional book, even "when starting after a drop cap, do the first line in all capitals, the second line in small caps, and then go to lower and upper case; oh, and do the first paragraph as one column, and the rest of the text in two columns in smaller type". But then what about books that use type graphically, that do anything original or unconventional?</p>
      <p>Or reading PDFs that are made up of page images of old books? Maybe there, what is needed is a map of how the text is on the page, so that two-column pages will automatically jog over when reading by repeatedly pressing the page down button.</p>
