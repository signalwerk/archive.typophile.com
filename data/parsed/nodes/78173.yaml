      <p>but you know what's funny?</p>
      <p>back in the old days, say 1998, we recognized that<br>
      we needed to have a reflowable format for the web.</p>
      <p>because, quite obviously, the size of their viewport<br>
      was something that was adjustable by end-users...</p>
      <p>web designers were advised they had to "let go"<br>
      of their old insistence on "pixel-perfect" layouts.</p>
      <p>but here we are, in 2011, and those designers have<br>
      grabbed back a lot of flexibility we thought we had.</p>
      <p>i would say that _most_ web-pages these days have<br>
      a design where the main body of their text is shown<br>
      in a column which has a fixed width.  including _this_<br>
      very page that you happen to be reading right now...</p>
      <p>so the very flexibility that we assumed we'd imposed<br>
      has now been stolen out from underneath us, so that<br>
      new things like the iphone or ipad often throw us into<br>
      situations again where the web just doesn't work right.</p>
      <p>horizontal scrollbars! who would have ever thought?...</p>
      <p>-bowerbird</p>
