      <p>It would seem to me that 18 ciceros are not in general "better" for German than 19 ciceros, it's just that, by accident, the large words in the specific text example used happened, coincidentally, to fit better in 18 ciceros. Had the long words fallen in slightly different locations, 19 ciceros might have been an accidental sweet spot.</p>
      <p>I am surprised that an acclaimed and hence competent typographer would fail to realize this. I can only conclude that his background is entirely artistic and aesthetic, and he isn't familiar with such matters as the behavior of statistics as the sample size becomes smaller.</p>
