      <p>the guy gets a lot of stuff wrong.  a lot.  wrong wrong wrong.</p>
      <p>but you might find his distinction about 3 reading "ranges"<br>
      to be interesting, at least from the standpoint of this thread.</p>
      <p>they are bed (near), knee (medium), and breakfast (far),<br>
      each with different settings for margins, font-size, etc.</p>
      <p>i think the labels are superfluous, and suggest that we<br>
      _not_ think that we can make decisions on things like<br>
      margins and font-size for people, but rather instead<br>
      give them the ability to control those things themselves.</p>
      <p>but there you have the reference...</p>
      <p>and here's another one...</p>
      <p>several e-book viewer-programs out there today offer<br>
      a "multi-column" option.  a.d.e. (adobe digital editions)<br>
      _forces_ the feature on you, whether you want it or not.</p>
      <p>the kindle, at least, lets you decide for yourself if you<br>
      want multiple columns, but if you toggle that feature on,<br>
      _it_ makes all the decisions regarding the feature itself.</p>
      <p>the decision as to how many columns (1 or 2 or more)<br>
      is made by considering the font-size and window-size,<br>
      so somebody has already made concrete decisions on<br>
      the very variables which you are discussing here, so it<br>
      might be useful to you to go and visit those decisions...</p>
      <p>and if you think you have anything meaningful to contribute<br>
      to the people who have made those decisions on such topics,<br>
      then you might want to engage them in conversation.  or not.</p>
      <p>-bowerbird</p>
