      <p>@bowerbird</p>
      <p>My thinking about scrolling pages/reflowable content has turned 180 degrees.</p>
      <p>The iPad, with it's ability to "throw scroll" (I don't have a better word for it, anybody?) had a lot to do with that.<br>
      While there might be some content that lends itself to 'carding' pagination, there isn't much.<br>
      Users can and should be given control over the layout. But defaults still count for a lot.<br>
      The universal adoption of Zoom as the default size/resize mechanism has changed the game. Pixels aren't what they used to be.<br>
      Now, if you want a font size change you have to include the code for that within the page. That's a big change that has gone largely unremarked. My understanding is that Webkit even has a CSS property for turning off zoom. (Memory is failing me on the specifics.) And in that case, we are back to a fixed 'optical' size - if the author wants to saddle the user with that without options.<br>
      Bad idea, IMHO.<br>
      But min-width/max-width has some legitimacy, I think. As a starting point. </p>
      <p>My eye doctor - a retinal specialist - is using iPads affixed to the wall for his eye testing charts. (Progressive dude, obviously.)</p>
      <p>Mobile and the problems inherent in tiny screens are going to take awhile to sort out.<br>
      Authors and users alike are going to be climbing a learning curve that's going to go on for a long time to come. It's just beginning, really. And - as the old cliché has it - we ain't seen nothin' yet!</p>
      <p>(BTW - I was in LA for SOTA conf but time constraints made a side trip impossible. And other personal stuff diverted my attention. See if you can come to New Orleans this year.)</p>
      <p>Rich</p>
