      <p>A few more sources:</p>
      <p>Eric Gill's Essay on Typography (page 88/89) "Practiced readers do not read letter by letter or even word by word, but phrase by phrase. It seems that consensus of opinion favors an average of 10-12 words per line"<br>
      Spiekerman's Stop Stealing Sheep and Learn how Type works (page 129) "The lines should be long enough to get thoughts in"</p>
      <p>I like both of these quotes, because the real principle is not about some mathematical formula or rule for line length, it is about allowing the reader to read phrase by phrase, or thought by thought with as few interruptions as possible. An interesting idea that the typographic line length becomes almost an element of punctuation, and affects the way a document is read, just like a line break in poetry or a punctuation mark at the end of a sentence.</p>
