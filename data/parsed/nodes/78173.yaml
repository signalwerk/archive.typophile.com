      <p>here's a bunch of related thoughts on the topic...</p>
      <p>***</p>
      <p>reflect on those "pocket books" which advertise<br>
      "the same pagination as the full-sized version".</p>
      <p>sometimes you can also find the same book in<br>
      an "oversized" edition, with identical pagination.</p>
      <p>how is this miracle achieved?  changed font-size.</p>
      <p>yet all of 'em are "readable", in fairly equal degrees.</p>
      <p>***</p>
      <p>this is probably why "the ideal" has typically been<br>
      specified in terms of numbers of characters per line,<br>
      because that's the essence of the important variable.</p>
      <p>***</p>
      <p>so, is pagesize one of the features we can vary<br>
      when we're specifying the "ideal"?  or is it fixed?<br>
      if it's fixed, what is it fixed at?</p>
      <p>***</p>
      <p>and, of course, the choice of the _font_ is going to<br>
      have an impact on the number of characters which<br>
      will fit within a measure of any specific length, so<br>
      does the font-choice enter into our "ideal" spec?</p>
      <p>***</p>
      <p>our notions of "ideal" have been influenced by<br>
      the actual examples we came across in our lives,<br>
      but those instances were constrained by the _cost_<br>
      of laying ink on paper, so the "ideal" was tainted...<br>
      the question was more "how much can we squeeze?"<br>
      rather than "what is the optimum we can achieve?"</p>
      <p>***</p>
      <p>my notion of "the ideal page" is one that is digital,<br>
      so readers can adjust it to their personal preference.</p>
      <p>so, have any such experiments been done?</p>
      <p>let people adjust page/window-size, font, font-size,<br>
      margins, leading, font-color, ink/background contrast,<br>
      paragraph indents, and whatever else you might want,<br>
      and then see what the values are across the population,<br>
      and how much variability there is within the population,<br>
      as well as the consistency across time for each person.</p>
      <p>i think that would be interesting research...</p>
      <p>-bowerbird</p>
