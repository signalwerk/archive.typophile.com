      <p>Thus spake quadibloc:<br>
      &gt; the large words in the specific text example used<br>
      &gt; happened, coincidentally, to fit better in 18 ciceros</p>
      <p>I can't find a word in Tschichold's examples that I would consider large -- by German standards. There's a couple of things I like about German, but its compound words are definitely not among them...</p>
      <p>»These things are not words, they are alphabetical processions. [...] Of course when one of these grand mountain ranges goes stretching across the printed page, it adorns and ennobles that literary landscape -- but at the same time it is a great distress to the new student, for it blocks up his way; he cannot crawl under it, or climb over it, or tunnel through it. So he resorts to the dictionary for help, but there is no help there. The dictionary must draw the line somewhere -- so it leaves this sort of words out. And it is right, because these long things are hardly legitimate words, but are rather combinations of words, and the inventor of them ought to have been killed.« (Mark Twain)</p>
      <p>The reason Tschichold's study is (probably) obsolete today is the fact that today we have Knuth's paragraph breaking and Zapf's font expansion algorithm...</p>
