      <p>It certainly is true that narrow columns require the ability to hyphenate. Since, at least for a time, word processing software or typesetting equipment could not include a hyphenation dictionary, if it was desired to enter body copy for which the size of the type or the width of the column might be altered (or even where the text might be edited), it was necessary to use a column wide enough so that, at need, one could achieve acceptable results even without hyphenation.</p>
      <p>Having shown examples of famous works with narrow column sizes, now I want to show some with wider columns. Telling the student that the rule is 1 3/4 alphabets, but it is not to be taken too seriously, is not really enough. Some guidance as to line length is needed to give an explicit scale to the printed line; one can't rely on every student having an instinctive feel for the matter. But just saying this isn't a strict rule leaves ambiguity. Instead, the next step is to investigate what is the acceptable range for line widths.</p>
      <p>This famous example of a "fine-print" document is 2 1/4 alphabets wide, and yet is held to be one of the finest specimens of printing (this is <em>not</em> an image of the original, I have merely retyped the text in a similar font, preserving the line breaks, and without justification, to determine the width in alphabets):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ideal_w6_6274.jpg"></div><p></p>
      <p>Here is some text from Hansard's <em>Typographia: An Historical Sketch</em>, which also measures at 2 1/4 alphabets, although it is intended to be merely good but plain printing:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ideal_w7_3549.jpg"></div><p></p>
      <p>And now here is an example of something that I thought might be seen as too wide, although, at 2 3/4 alphabets, it turns out that this is not true by much, if at all: the famous Frankford Arsenal Handbook of Optics, MIL-HDBK-141:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ideal_w8_5014.jpg"></div><p></p>
      <p>So now, at least, it becomes possible to give some practical guidance: anything from 1 1/2 to 2 1/4 alphabets is excellent, and after about 2 1/2 alphabets, it's time to begin thinking about alternatives. After about 3 alphabets, one is starting to get into trouble.</p>
      <p>And another example of something on the long side is also 2 3/4 alphabets wide, Simon Newcomb's account of his theory of the motions of Neptune:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ideal_w10_3874.jpg"></div><p></p>
      <p>Thus, it's even hard to find actual historical examples that go beyond 2 3/4 alphabets, which can be considered indicative.</p>
