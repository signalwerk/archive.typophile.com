      <p>&gt;character count is somewhere between 89 and 96 characters a line</p>
      <p>One of my pet peeves also. </p>
      <p>I suspect that the A4 and US letter-size are products of the typewriter age. And indeed if you use Courier, with say 1 inch margins, you get around 65 characters, if I remember rightly. But especially with Times New Roman, you get far more, as you say. </p>
      <p>One solution is to use fairly large type, with a large left margin, and ample right margin. Wide type, like Century Schoolbook can also help fill up the measure without too many characters. If designing stationary with a letter head and information, you can make use of the left margin.</p>
