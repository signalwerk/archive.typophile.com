    html: |-
      <p>Thanks, can you give links? Generally speaking, typographers view the range of good line measure as dependent on vertical spacing, word spacing, and type face. The margins and how many columns are also a factor. The rule of thumb is two and a half lc alphabets for single column text, so in other words roughly 65 average characters. This is both in Bringhurst's and Felici's guides to typography. </p>
      <p>As I've recently found, the work of Luckiesh in the late '30s adds additional variables to reading speed as important, particularly, fatigue as measured by increase in blink rate. In his tests readers were less fatigued by shorter lines than the standard recommendation. So there may be a conflict between speed and ease of reading. Luckiesh also distinguished between natural, unhurried rate, and maximal rate. Again, these may point different directions as far as line length. Most work since Luckiesh has not been as revealing on these issues, as they tend to not include and control for enough important variables. (My and Peter Enneson's brief account of Luckiesh's work is <a class="freelinking external" href="http://typophile.com/node/83684" rel="nofollow">here on Typophile,</a> and in the recent issue of Printing History.)</p>
