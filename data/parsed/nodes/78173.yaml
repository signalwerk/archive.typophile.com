      <p>A. 2 columns. Margins are on the side 1.6 cm on top 1.9 cm in the bottom 2.5 cm (= 1inch). Line length is around 50 letters. Text is set in 12/13.5.</p>
      <p><a target="_blank" href="http://img585.imageshack.us/img585/3691/screenshot20110513at255.png" rel="nofollow"><img src="http://img585.imageshack.us/img585/3691/screenshot20110513at255.th.png" border="0"></a></p>
      <p>B. 1 column. Margins outside: 4.7cm. Letters/kine: 63-70. Text: 12/13.75</p>
      <p><a target="_blank" href="http://img638.imageshack.us/img638/3691/screenshot20110513at255.png" rel="nofollow"><img src="http://img638.imageshack.us/img638/3691/screenshot20110513at255.th.png" border="0"></a></p>
      <p>Both A and B would fit the recommendations by Bringhurst. </p>
      <p>The next two layouts don't:</p>
      <p>C. Margins: 4.1cm. 71-79 letters/line. Text is set 12 to... don’t remember, 14.5 to 15. </p>
      <p><a target="_blank" href="http://img121.imageshack.us/img121/3691/screenshot20110513at255.png" rel="nofollow"><img src="http://img121.imageshack.us/img121/3691/screenshot20110513at255.th.png" border="0"></a></p>
      <p>D. “Standard margins”: 1 inch or 2.5 cm. 84-93 letters/line. Text is set 12 to... don’t remember, 14.5 to 15.25. </p>
      <p><a target="_blank" href="http://img38.imageshack.us/img38/3691/screenshot20110513at255.png" rel="nofollow"><img src="http://img38.imageshack.us/img38/3691/screenshot20110513at255.th.png" border="0"></a></p>
      <p>I am afraid that every other layout than variant D would just seem odd to a given random reader. </p>
      <p>Variant D has longer lines than any of the recommendations I read here, as far as I understood them. Variant D would be closest to how most people would treat a page in a word processor. </p>
      <p>Variant A has very small margins already. The line length would be in a good range. The general layout might be unexpected though for a ‘random office document’. With US-Letter the margins here could be bigger. I did not want to increase the margins more, as I thought the line length would be then too short. </p>
      <p>What do you think? What would be an appropriate layout that would not look odd to a random reader. Thanks</p>
      <p>P.S.: Typeface is Cycles Eleven, although I don't think it matters here. I am looking for recommendations suiting any serif typeface that is not as condensed as Times, any classical text face.</p>
