      <p>I just checked Hochuli, Detail in Typography. He has "between 60 and 70" characters for English, a little longer for German. (p. 34 English edition) Checking Felici, Complete Manual of Typography, he mentions (p. 120) three "more commonly proposed guidelines": </p>
      <p>"1. Optimal line length is between one and a half and two and a half times the length of the lower case alphabet.<br>
      2. Optimal line is nine or ten words (figure 5 1/2 characters per word.<br>
      3. 27 characters is the minimum line length, 40 the optimum, and 70 the maximum."</p>
      <p>He also mentions an outer limit, too long most of the time of "a measure (in picas) three times the size of type (in points)."</p>
      <p>Bringhurst (p. 26 second edition Elements of Typographic Style) says "Anything from 45 to 75 characters is widely regarded as a satisfactory length of line for a single-column page set in a serifed text face in a text size. The 66 character line (counting both letters and spaces) is widely regarded as ideal. For multiple column work, a better average is 40-50 characters."</p>
      <p>It seems that the most experienced book designers, like Charles and Mitchel &amp; Wightman, don't want to give numbers, noting the many variables.</p>
