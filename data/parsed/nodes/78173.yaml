      <p>Miss Tiffany,</p>
      <p>I don't much go in for prescriptive descriptions of interior design. I would recommend Rich Hendel's <cite>On Book Design</cite>. Or my favorite, <cite>The Art of the Printed Book</cite>, which shows solutions from over 400 years, encompassing varying fashions and notions of "ideal."</p>
      <p>Small examples:</p>
      <p>The largest set of problems an interior designer faces are problems occasioned by the text itself. If you say "See spot run" over and over, a number of ideal characters per line can be used. But the evenness of word spacing is controlled by the number of spaces in the line, not the number of characters.</p>
      <p>Another small example is the sheet, if the book to be run on a sheet-fed press. Does a 6-1/8 x 9-1/4 trim cost the same as a 6x9? It does from several book printers, so the extra size of the sheet allows different margins. And that space can be used for a number of things.</p>
      <p>I know. The response to the above could be, "Well, so what? Suppose everything works out" What's ideal?" But it is the same answer: the ideal is determined by the text, given the constraints of manufacturing. Were it otherwise, IBM could design a computer that not only won at <cite>Jeopardy!</cite>, but replaced book designers. Then where would we be?</p>
