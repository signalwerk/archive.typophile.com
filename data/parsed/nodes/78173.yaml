      <p>Of course, one of the characteristics of the ideal book, or the book beautiful, is the point size of the type. And the typeface itself is a concern as well; thus, if one is going to use generous leading, one shouldn't use a typeface with ruthlessly shortened descenders.</p>
      <p>One book I have, "A Composition Manual", published by the Printing Industries of America, gave, in the specific case of 10 point type, leaded 2 points, a list of recommendations from various authorities:</p>
      <p>Readability tests by Lukiesh and Moss: 13 pica ems<br>
      Sherbow's type charts: 15 pica ems</p>
      <p>The usual theory in printing at the time is cited as 1 1/2 alphabets, or 40 characters, which seems to be equivalent to 17 pica ems in the sample displayed.</p>
      <p>A reader preference test is cited as yielding 19 pica ems.</p>
      <p>A Dr. Javal and a Professor Huey advocate 21 pica ems (Dr. Javal as a maximum).</p>
      <p>Two alphabets are then noted as the ideal of some other printers who dissent from the usual 1 1/2 alphabet rule of thumb. This appears to be about 22 1/2 pica ems.</p>
      <p>Lessons in printing published by the International Typographical Union give 22 to 24 pica ems as the ideal.</p>
      <p>Scientific studies conducted in Britain are cited as establishing the rule that the ideal line length should not be over 24 pica ems.</p>
      <p>Someone checked the width of lines in typical textbooks, and found they range from 21 to 25 pica ems.</p>
      <p>And finally, Professors Patterson and Tinker are cited as recommending the range of 14 to 31 pica ems.</p>
      <p>So, at least at one time, collecting a lot of sources for this was considered reasonable.</p>
