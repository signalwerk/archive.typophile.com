      <p>quadibloc said:<br>
      &gt;   Obviously, on an e-book reader, it would be crazy for it<br>
      &gt;   to behave like some web sites do, and allow books to have<br>
      &gt;   characteristics that make them very awkward to read -<br>
      &gt;   like page formats that require you to scroll back and forth<br>
      &gt;   when reading each line, unless one chooses to<br>
      &gt;   display the page at an unreadably small size.</p>
      <p>.pdf was one of the earliest e-book formats, and yes,<br>
      if you create a .pdf at 8.5*11, with 1-inch margins, and<br>
      use 12-point type, and your end-user displays it on<br>
      some e-book hardware, you'll get exactly that situation.</p>
      <p>which made people cry out for a "reflowable" format...</p>
      <p>so we've developed beyond the _most_ primitive state.</p>
      <p>you might want to look at two programs in particular,<br>
      both because of their widespread currency out there,<br>
      the kindle reader (which is available on most platforms)<br>
      and adobe digital editions (which is available on many).</p>
      <p>these programs are only about 3 steps ahead of you and<br>
      your "obviously we don't want this kind of thing" stage,<br>
      when they _should_ be more like 33 steps ahead of that,<br>
      but they _are_ 3 steps ahead, so go get yourself caught up.</p>
      <p>&gt;   even "when starting after a drop cap, do the first line<br>
      &gt;   in all capitals, the second line in small caps, and then<br>
      &gt;   go to lower and upper case; oh, and do the first paragraph<br>
      &gt;   as one column, and the rest of the text in two columns<br>
      &gt;   in smaller type".</p>
      <p>i believe the mentality these days, and for a good time to come,<br>
      is that this kind of request would be filed in the bin that has the<br>
      big sign above it reading "ornamental", with the even-bigger sign<br>
      above that, which says "eschew".</p>
      <p>there would just be so many situations where that _didn't_ work<br>
      that the only way you could install something like that would be<br>
      to make it a user-option.  but then you have to face the hard fact<br>
      that even though this is the type of thing that gives typographers<br>
      wet dreams, the reaction it would pull from an end-user would be<br>
      more along the lines of an irritated and puzzled look that asked the<br>
      rhetorical question "why would i ever need something like _that_?"</p>
      <p>moreover, even if you wanted to present it as a user option, how<br>
      would you go about _presenting_ that option for their perusal?</p>
      <p>this is, indeed, the question that's often the most pressing one...<br>
      it's usually quite easy to program a function to pull off a feature,<br>
      even one like the one described right above.  but what is often<br>
      _extremely_ difficult is the development of an intuitive interface<br>
      to let an unsophisticated user understand and specify the option.</p>
      <p>&gt;   But then what about books that use type graphically,<br>
      &gt;   that do anything original or unconventional?</p>
      <p>an e-book viewer-program is an app that displays an e-book...</p>
      <p>to save our time and energy, we often want to create a single app<br>
      that will display any and all books that use the same file-format...<br>
      for the most part, these apps must, by definition, be "conventional",<br>
      because they will (to some extent) treat all the books the same way.</p>
      <p>but for a book that is unconventional, you just build a one-off app.</p>
      <p>&gt;   Or reading PDFs that are made up of page images of old books?</p>
      <p>you answered your own question there.  .pdf is a great format for<br>
      a fixed-page book, which is just what a bunch of scans would be...</p>
      <p>&gt;   Maybe there, what is needed is a map of how the text is on<br>
      &gt;   the page, so that two-column pages will automatically jog over<br>
      &gt;   when reading by repeatedly pressing the page down button.</p>
      <p>i'm not sure i understand the preoccupation with two-column pages.</p>
      <p>but yes, you can layer in the text _behind_ the scan on a .pdf page,<br>
      which makes the .pdf _searchable_, in a way that pure-scans are not<br>
      (since the scan is just a _picture_ of the text, and not the text itself).<br>
      this is what is done at octavo.com, which is a product of john warnock,<br>
      who is the guy who cofounded adobe and invented the .pdf format...</p>
      <p>or you can take another approach, and _replicate_ the paper-book<br>
      in electronic form, with a "cloning" that creates an _exact_reprint_...</p>
      <p>for examples of this, see the "digital reprints" from jose menendez:</p>
      <p>&gt; <a href="http://www.ibiblio.org/ebooks/Mabie/Books_Culture.pdf" title="http://www.ibiblio.org/ebooks/Mabie/Books_Culture.pdf">http://www.ibiblio.org/ebooks/Mabie/Books_Culture.pdf</a><br>
      &gt; <a href="http://www.ibiblio.org/ebooks/Cather/Antonia/Antonia.pdf" title="http://www.ibiblio.org/ebooks/Cather/Antonia/Antonia.pdf">http://www.ibiblio.org/ebooks/Cather/Antonia/Antonia.pdf</a><br>
      &gt; <a href="http://www.ibiblio.org/ebooks/Einstein/Einstein_Relativity.pdf" title="http://www.ibiblio.org/ebooks/Einstein/Einstein_Relativity.pdf">http://www.ibiblio.org/ebooks/Einstein/Einstein_Relativity.pdf</a></p>
      <p>again, these are .pdf e-books which clone the paper-book...</p>
      <p>(the einstein book is especially fun, because jose has inserted<br>
      corrections to some mistakes made by the original publisher.)</p>
      <p>one interesting thing you should know about the "reprints" is<br>
      a click on any page-number (in mabie and einstein) summons<br>
      the _scan_ of that page -- from google -- for your reference,<br>
      with the .pdf page side-by-side with the scan in your browser,</p>
      <p>this means there is a very tight coupling between the versions.</p>
      <p>it also means you can verify the two versions are highly similar<br>
      (right down to the end-line hyphenated words being retained),<br>
      and if you pull up a few pages you'll see for yourself it is true,<br>
      except, of course, the .pdf doesn't have any "broken type", or<br>
      crooked pages, or pictures of the scanner's thumb in a corner.</p>
      <p>the problem with jose's e-books are that we only have them<br>
      in the .pdf format, so it's not possible for us to "remix" them,<br>
