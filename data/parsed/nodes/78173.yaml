      <p>The margins, the leading, the column width... all these things are under the control of the typographer.</p>
      <p>As the typographer does not have the option to turn a treatise on general relativity or celestial mechanics into a detective story or a Western, the comprehensibility of the content (or even the language in which the text is written!), although indeed far outweighing the layout of the page in determining readability, is all that the typographer may control and can legitimately address.</p>
      <p>So there is no fault in not lamenting what one cannot change.</p>
