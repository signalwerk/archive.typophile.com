      <p>Ah. It is not this web site, but the whole world that is suffering?</p>
      <p>Yes, it is not just this web site. But books printed on paper are still what the vast majority of the world's people use to read. E-books are a toy for the rich, who can afford to pay new hardcover prices for a lousy reading experience.</p>
      <p>Fixing the problem, though, isn't up to typographers. They haven't got the power to tell Apple how it should make the iPad work. I suppose the typographers could offer some sort of polite, respectful advice to the programmers, who could then produce better designs for their employers. But typographers can't do miracles.</p>
      <p>In this case, the miracle would be a display screen that fits in your pocket, and which is 8 1/2" by 11" in size. Maybe e-book readers already let people use landscape mode, though; that would clearly help a little.</p>
      <p>Why, I've just had a creative idea that could improve Adobe Reader, at least. How about being able to choose a size smaller than "fit width", but which which pages down to the top of the next page when that is possible without missing text, even if it means moving down a bit less than a whole screen?</p>
      <p>Even <em>small</em> mercies like that would be helpful.</p>
