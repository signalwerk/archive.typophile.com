      <p>Ellen Lupton discusses the topic in her essay from 2003 (I found lots of references to this). The article has a bibliography with a few additional sources also. <a href="http://elupton.com/2009/10/science-of-typography/" title="http://elupton.com/2009/10/science-of-typography/">http://elupton.com/2009/10/science-of-typography/</a></p>
      <p>Some research has also been done that may go against Bringhurst's suggestion for line length for online reading.</p>
      <p><a href="http://psychology.wichita.edu/surl/usabilitynews/72/pdf/Usability%20News%2072%20-%20Shaikh.pdf" title="http://psychology.wichita.edu/surl/usabilitynews/72/pdf/Usability%20News%2072%20-%20Shaikh.pdf">http://psychology.wichita.edu/surl/usabilitynews/72/pdf/Usability%20News...</a><br>
      "This study examined the effects of line length on reading speed, comprehension, and user satisfaction of online news articles."</p>
      <p>And another one looking at online reading:<br>
      <a href="http://www.humanfactors.com/downloads/feb03.asp" title="http://www.humanfactors.com/downloads/feb03.asp">http://www.humanfactors.com/downloads/feb03.asp</a></p>
      <p>I'm always skeptical of these kinds of scientific studies on typography. They don't take into account the qualitative and subtle artistic requirements of typography, which are just as important, and likely have as much impact (or more) on how "readable" something is. that said, I think looking at all sides of the issue is valuable.</p>
