      <p>Just as the 1923 Big Red made headlines when it was available in a digitized form on the Internet Archive (the 1912 book, and its 1917 supplement, are there too, and in quality scans), that book is also <a class="freelinking external" href="http://www.archive.org/details/TheManualOfLinotypeTypography" rel="nofollow">available there</a>. It is well scanned, but it's only available in DJVU format, which is a trifle inconvenient.</p>
      <p>While I agree there are no "magic combinations", one could, even if unseriously, give a specific set of measurements as a starting point. However, one of the most fundamental attributes of a typeface can't properly be specified for the purpose.</p>
      <p>If I were to say that the ideal book were set in 11 point type with 3 points leading, I would also have to specify the typeface. Because, of course, the crucial variable isn't the size of the type in points, but its x-height.</p>
      <p>In metal type, it might be 11 point Caslon 540 with 3 points leading... or 13 point Jenson with 1 point leading, because some typefaces have very short and stubby descenders, and others have long ones - and extra leading takes the place of the missing descenders.</p>
      <p>Incidentally, I have the answer now: the ideal column width is 1 3/4 alphabets. I can say this, because I have looked upon the ideal book, and measured its column width - by retyping its text in a similar typeface under two alphabets of that typeface.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ideal_width_4514.jpg"></div><p></p>
      <p>Of course, this <em>is</em> unserious, as it just represents one opinion about the matter, but at least it shows what 1 3/4 alphabets looks like.</p>
