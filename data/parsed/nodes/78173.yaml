      <p>One point raised above that I didn't completely address, because I see it was raised by someone writing about an individual author with a polysyllabic style, before we came to Jan Tschihold's book, is the question of other factors.</p>
      <p>I was looking at the question of the ideal line length in the context I thought it was initially raised - what is best for the reader, if it can be achieved. That a shorter line is harder for the printer to hyphenate is <em>his</em> problem, and so if a particular writer, or a particular language, makes it harder to break lines so as to achieve even spacing... that affects the ease of achieving the ideal, not what the ideal is.</p>
      <p>But the narrow columns occasionally used when text is wrapped around images, or in some newspapers, are indeed criticized as too narrow specifically because horrendous spacing is occasionally needed. Assuming hyphenation is possible, though, this sets in at widths line one alphabet, or 3/4 alphabets, significantly below 1 1/2 alphabets.</p>
      <p>German may have very long words in it, but it doesn't have very long syllables.</p>
      <p>@bowerbird:<br>
      It's not clear what the typographers here (of which I am not one) could have written which would have been useful in relation to the issue which you raised.</p>
      <p>The question of whether text in E-books should flow or not relates to their fundamental design. And so debating that issue can hardly provide hits on how someone preparing an E-book for use on a specific platform could do a better job.</p>
