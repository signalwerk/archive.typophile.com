      <p>Isn’t “optimal” a superlative? </p>
      <p><cite> &gt; 1. Optimal line length is between one and a half and two and a half times the length of the lower case alphabet.</cite></p>
      <p>Taking Miller Text, 11 pt (just as a random example), that would yield anywhere between 17p7.68 and 29p4.8 (or between 2.94 and 4.9 inches) — almost a 2-inch difference in line length. That’s quite a wide range for something that’s supposed to be a superlative.</p>
      <p>Ain’t rules and numbers fun?</p>
