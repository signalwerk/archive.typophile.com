      <p>While it could be argued that old-style figures are superior to ranging figures for the same reason that lowercase is superior to all-caps, I don't think the strong modern preference for ranging figures can be overcome.</p>
      <p>After all, people don't try to read and comprehend long masses of digits. An individual number stands out more clearly from the surrounding text, and is thus more quickly recognizable as a number, if it is in ranging figures. In many places where numbers are used, uniformity is expected, and a clear distinction between numbers and lowercase letters is needed in algebraic formulae.</p>
      <p>Of course, sometimes, digits are mixed with capital letters. In that case, oldstyle figures would be more distinct, but at least, since capital letters tend to have square corners, and digits tend to be rounded, and narrower than capital letters, and so the weakness in this area is limited.</p>
