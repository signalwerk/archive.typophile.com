      <p>It's not so much that I only work on fine-print books, but that I would assume that they do represent the ideal, even if it is an ideal that is seldom considered worth the effort.</p>
      <p>William Morris noted that one wouldn't typeset a scientific treatise in the manner of a fine-print book. I would suggest that there is still at least one place for fine-print books, even today, however. Large type, generous margins, and a typeface as gentle on the eyes as possible, with some suggestion of antique character, would seem entirely appropriate to a children's book about dragons and castles and the like. Since books for small children are usually short, and they are usually set in large type in any event, designing them to fine-print standards ought not to affect their affordability.</p>
      <p>So I can't claim to practice what I preach. But as musical texts on harmony and counterpoint are wont to reiterate, one must first know the rules well before one is equipped to break them without disaster; and, so, while knowing that 1 1/2 alphabets is an ideal, whether of beauty or legibility, may be small comfort to the typesetter of a textbook on quantum mechanics who must make do with three, at least he will thereby know enough to split his page into two columns rather than to force his reader to endure lines that are <em>five</em> alphabets in length.</p>
      <p>Thus, in my example of Morris, above, I showed where his note on the founding of the Kelmscott Press was set with a width of 1 1/2 alphabets. But he also countenanced 1 3/4 alphabets, as in his "The Story of the Glittering Plain":</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ideal_width3_4211.jpg"></div><p></p>
      <p>However, one can also get quite far from fine-print books to the domain of computer manuals, and we will find that when a large company like IBM feels that enough copies of a manual will be printed that actual typesetting is justified, even then the same rules of legibility will be heeded; and so, two columns were used, but with a width of 1 7/8 alphabets each, in the first edition of System/360 Principles of Operation:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ideal_width5_5827.jpg"></div><p></p>
    html_clean: |-
      <p>It's not so much that I only work on fine-print books, but that I would assume that they do represent the ideal, even if it is an ideal that is seldom considered worth the effort.</p>
