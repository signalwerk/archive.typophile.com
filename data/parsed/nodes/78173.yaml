      <p>Charles knows way more about this than I do, but for what it's worth I am a believer in the "2 1/2 lower case alphabets" ideal for single column text. This is in Felici and amounts to the same thing as Bringhurst. I do find something that wide inviting for extended reading, and wider off-putting.</p>
      <p>I am talking about printed books with extended text.  </p>
      <p>I heard Bill Hill at TypeCon saying that that width is ideal because more causes us to turn our heads, rather than just our eyes, so that we are more likely to lose the line. I don't know where Bill Hill got it, though. </p>
      <p>In multi-column and lay-out with more white space there is more flexibility. </p>
      <p>The other rule I have read that I believe is that sans, compared to good serifed text fonts, usually require shorter lines and more leading to be readable, for more than a few lines. </p>
      <p>ps. I think that stating the rule in terms of "characters" can be misleading because the i and m are both characters, but one a lot wider than the other...</p>
