      <p>The 1923 <em>Manual of Linotype Typography</em> is remarkably prescriptive (or should that be descriptive?) in showing specimen pages from books of various sizes, made up with type. The page trim dimensions are listed, as are the type specs, and the various margins are clear to see. At the front of the manual are comprehensive specs for book make-up.</p>
      <p>I'm struck by how tall and thin many of the formats are.</p>
      <p>This is a gorgeous book and very inexpensive to acquire, compared with the famous ATF Big Red.</p>
