      <p>@lindenhayn, I would like to see that Tschichold example, if you find it. He was a master of spacing.</p>
      <p>My own experience is that the ideal line length varies from writer to writer. Once I imitated exactly the page specs of a book designed by David Bullen for North Point Press, because I thought it would be appropriate to the book I was designing; but with a different author who used his words differently, it turned out to give me quite a lot of loose lines – entirely unlike the effect in the North Point book. Same typeface, same point size, same leading, very likely much the same spacing and hyphenation; different effect. </p>
      <p>On another occasion, I was designing a bulky book of essays by a highly intellectual critic known for his polysyllabic elocution. I was using FF Quadraat, a slight condensed old-style design. I was expecting to have to make the lines fairly short in order to keep the paragraphs from bogging down, but I found that, because his writing style was so headlong, it leant itself to a surprisingly long line.</p>
