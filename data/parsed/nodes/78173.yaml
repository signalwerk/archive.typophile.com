      <p>@Tiffany, @John:</p>
      <p>I found, scanned, and started translating the Tschichold essay I <a class="freelinking external" href="http://typophile.com/node/78173#comment-448169" rel="nofollow">mentioned.</a> It was first published in Switzerland, 1972, IIRC, and later on became part of the collection published by Brinkmann &amp; Bose. As far as I know, there is no (official) English translation yet. It's only 2.5 pages long, plus lots of figures. Here is a first, rough translation of its central parts [I know, I should really get a De&lt;-&gt;En typographic dictionary]...</p>
      <p>cheers<br>
      Nils.</p>
      <p>--------------8&lt;-------------------------8&lt;-------------------------8&lt;---------------</p>
      <p><code><br>
      Looking at figures 1 to 3, we could draw the conclusion that a wider measure will always yield a more even word spacing. This is only true in a very broad sense. My study will show that a width difference of a mere cicero can result in a major difference in word spacing.<br>
         Figures 4 to 6 use the same type size as figures 1 to 3, but the measure is wider. It's no surprise that the 16-cicero measure doesn't look perfect -- what is surprising, though, is the fact that even a 19-cicero measure does not yield even word spacing. Using an 18-cicero measure, the paragraph looks a lot better! So in this typeface (and in the German language!), an 18-cicero measure is better than a 19-cicero one.<br>
         Even 20 and 21 cicero (figures 7 and 8) are not much better than 19 cicero, which is even more surprising. It takes a 22-cicero measure to get a pleasant paragraph. We see that, for [11-point] Baskerville and the German language, 22 cicero is the \enquote*{best} measure.<br>
         In German language, that is! I remains to be seen if the same holds true for English or French. [...] And our results are only valid for Baskerville. A different typeface of the same optical size, using the same measure, will not always, or rather: will never yield an equally good result. [...] The whole issue is pretty complex, even mysterious, and depends on a number of factors. There will hardly ever be a definite, universal answer.<br>
      </code></p>
      <p>Figures 1 to 4: 11-point Baskerville; 8, 9, 14, and 16 cicero measure<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/TSCHICHOLD1945p01_5944.png"></div><p></p>
      <p>Figures 5 to 9: 11-point Baskerville; 19, 18, 20, 21, and 22 cicero measure<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/TSCHICHOLD1945p02_5092.png"></div><p></p>
