      <p>In order to measure it's effectiveness you first need to (get your client to) define what they mean by "effective." Until then, you're chasing your client's tail.</p>
      <p>And if you are looking for data, you'll need to conduct some sort of experiment, be it laboratory or online questionnaire. In this instance your independent variable (the one you change) is looking like typeface, and other aspects of type.</p>
      <p>The roadblock you're coming up is with the dependent variable (what you measure) which your client has simply defined as "effectiveness." This could mean comprehension, time, visual search, fatigue, memory, aesthetic appeal &amp;c.</p>
      <p>Once that has been established you'll need to design an experiment which uses these variables. If you want reliable data then you will need to do things such as control your population, make sure everything is counterbalanced &amp;c.</p>
      <p>Lastly, you'll need to statistically analyze your data to see if your manipulations had a significant (outside the possibility of random chance) effect (pun intended).</p>
      <p>Short answer, collaborate with a cognitive psychologist from your local university (experimental, not clinical) with a background in reading comprehension. You may get lucky and find a masters or PhD student who will make this a project. This is not an easy task, but I applaud the people of ecofont for looking at it this way. And their cause.</p>
