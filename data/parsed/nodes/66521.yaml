      <p>A Dutch magazine’s art director (Piet Schreuders for VPRO Gids) just responded to a readers' question (why not use Ecofont throughout, instead of once) and his answer is (translating/paraphrasing):</p>
      <p>Over my dead body.<br>
      - It is ugly<br>
      - It is a sans and not usable for textmaterial<br>
      - It is less economic (less words per page than a normal typeface)<br>
      - Using holes in a glyph only works with bolder type. It is easier to save ink by using normal widths<br>
      - Ecofonts apparantly was developed for office use. Where toner and ink are best saved by printing less (which also saves paper)<br>
      - The Eco-font is, in short, a beautiful example of fashionable humbug.</p>
