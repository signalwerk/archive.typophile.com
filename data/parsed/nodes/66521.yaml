      <p>I seldom join a discussion on the Ecofont, but this forum topic triggerd my attention. In november 2008 SPRANQ creative communications, the Netherlands released the free Ecofont, that shows that ink saving holes can be made in glyphs while maintaining readability of the printed text. The Free version is no more than a way to show the principle. It does work, but it has some drawbacks. </p>
      <p>Our 'bigger plan': to apply the ink saving holes to widely used typefaces. Users will no longer need an (extra) typeface, but can use their normal fonts and print their text using less ink. For some typefaces, the ink savings (corpssize 10) add up to a mere 45%.</p>
      <p>The professional software is available for both home and business use. Please note that the Ecofont solution is a printing solution and not made/meant for offset.  </p>
      <p>Micha's analysis is correct; we do have the right permissions to do so, but only so under strict regulations.</p>
      <p>Regards,</p>
      <p>Gerjon Zomer<br>
      Co-owner SPRANQ / manager Ecofont</p>
