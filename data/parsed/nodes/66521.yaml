    <p>Hi All:</p>
    <p>It has been a LONG time since I checked in. Glad to see the old gang at it still.</p>
    <p>I've been asked to evaluate Ecofont, and am coming up short with actual data, or even anyone saying they use it. <a href="http://www.ecofont.eu/ecofont_en.html" title="http://www.ecofont.eu/ecofont_en.html">http://www.ecofont.eu/ecofont_en.html</a></p>
    <p>My thought is it's gimmicky, and the same thing could be accomplished much more easily  by:<br>
    Printing 25% fewer pages<br>
    Writing 25% fewer words<br>
    Make the font size 25% smaller<br>
    Use lightweight fonts, Don’t use bold anything.<br>
    Set your font fill color to a 75% black.</p>
    <p>But I need to give a fair assessment to well-intentioned people. Does anyone have even anecdotal experience to share?  </p>
    <p>Thanks all,</p>
    <p>Joe</p>
