      <p>Thanks George for the Phil Martin info.<br>
      The discussion of what is original work, what is legitimate use of existing designs, what is piracy etc. has been done many times before.<br>
      Perhaps it started with the the 19th century technology of electrotyping which enabled font makers to physically lift the imprints of competitor's typefaces to cast their own versions. whithout having to punch cut a copy. Font forgery has been with us ever since. Only the technology changes.<br>
      Don</p>
