    html: |-
      <p>Hi Fivos. No disputing that Dieter Steffmann is a prolific pirate. As for Chopin Script it seems to me that the previous discussion cited by you is balanced and useful. As far as I can see both the versions by URW and Claude meet the same standards of originality, as they are independently created from a non digital work, and both are derivative in that they rely on a previous design.  But the previous design was not covered by a design patent and so, in the US at least,  was in the public domain. Also, in the US at least, the case brought by Summer Stone to prevent use of r terminals that resembled his r -- which he lost -- provides some guidance as to what can be copied by others. There is clear protection for digital outlines generated by a computer program. Otherwise.... Perhaps the only people who get rich from font design are the lawyers.<br>
      Caveat: Non of my comments should be taken as legal guidance, as I am not a lawyer. Nor do they automatically apply to countries other than the US.<br>
      Don</p>
