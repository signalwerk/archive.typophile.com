    votes: null
    html: |-
      <p>"Phil Martin's Polonaise (1923?)" is incorrect insofar as Phil did very little original work and all of it was done from the early 1970s through the mid-80s. Even though he claimed to have designed over 400 fonts in his lifetime, the vast majority of the fonts he personally "created" were derived from the work of others. The majority of the truly original fonts were licensed from other designers although he ultimately bought up the rights. </p>
      <p>Originally Martin licensed many of his fonts to The Font Company, which is long gone. Since URW++ has the fonts I have to assume they are the ultimate licensee, at least. Phil sold his company to a close business friend when he retired. That man presumably still owns the rights.</p>
