      <p>Hi Don,</p>
      <p>I don't know much about Claude Pelletier and the only reason I mentioned "sweep 'n hack copies" is that the <strong>Chopin Script</strong> offered as a free font by Claude in Dafont:<br>
      <a href="http://www.dafont.com/chopin-script.font" title="http://www.dafont.com/chopin-script.font">http://www.dafont.com/chopin-script.font</a></p>
      <p>it actually looks like an exact copy of Phil Martin's <strong>Polonaise</strong> (1923?) which is a commercial font available from URW++<br>
      <a href="http://www.myfonts.com/fonts/urw/polonaise/urw-d-bold/glyphs.html" title="http://www.myfonts.com/fonts/urw/polonaise/urw-d-bold/glyphs.html">http://www.myfonts.com/fonts/urw/polonaise/urw-d-bold/glyphs.html</a></p>
      <p>With some further investigation though, I see that Dieter Steffmann have also done some digital versions of the font under both(!) names Polonaise and Chopin Script, therefore I'm now really confused about what was the original font name and if URW++ has actually any (exclusive) rights on this font.</p>
      <p>I'm glad that <strong>La Tribune CP</strong> seems like an original digitization.</p>
      <p>Fivos</p>
      <p>PS: See also here for a previous discussion on Chopin Script (probably not a rip-off):<br>
      <a href="http://typophile.com/node/101766" title="http://typophile.com/node/101766">http://typophile.com/node/101766</a></p>
