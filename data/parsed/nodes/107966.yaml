      <p>Don't know about Claude's "sweep 'n hack copies of other commercial fonts" but as far as I can tell this is an original digitization of a circa 1900 font, designed for headline use where space is limited. I recall monitoring some discussion of creation of the font on alt.binaries.fonts during November-December of 2011, but I can't remember the details other than that Claude posted some newspaper jpegs and revisions of the font.<br>
      Don</p>
