  html: <p>Hello, I'm looking for a sans-serif font with a lot of stylistic alternates similar to what <a class="freelinking external" href="http://www.typography.com/fonts/whitney/features/whitney-stylistic-sets" rel="nofollow">Whitney</a> and <a class="freelinking external" href="http://mbtype.com/pdf/concourse-type-specimen.pdf" rel="nofollow">Concourse</a> have. For example so you can swap out the default glyphs for single-story a, more humanist or more geometric t and M. I was thinking about going with Concourse because price/licensing are both good, but thought I'd look at alternative options. Any ideas? As those examples suggest I'm looking for a quite neutral design with a range of weights, suitable for body text or display. A condensed width and small caps would be nice.</p>
  html_clean: <p>Hello, I'm looking for a sans-serif font with a lot of stylistic alternates similar to what <a class="freelinking external link-external" href="http://www.typography.com/fonts/whitney/features/whitney-stylistic-sets" rel="nofollow">Whitney</a> and <a class="freelinking external link-external" href="http://mbtype.com/pdf/concourse-type-specimen.pdf" rel="nofollow">Concourse</a> have. For example so you can swap out the default glyphs for single-story a, more humanist or more geometric t and M. I was thinking about going with Concourse because price/licensing are both good, but thought I'd look at alternative options. Any ideas? As those examples suggest I'm looking for a quite neutral design with a range of weights, suitable for body text or display. A condensed width and small caps would be nice.</p>
