    html: |-
      <p>Sense and Sensibility<br>
      Neology Deco and Neology Grotesque</p>
      <p>Having invested a considerable amount of time in drawing alternates for most of the alphabet in these, I’m afraid I couldn’t summon the commitment to do condensed and small caps as well! And the Neology has no italic. </p>
      <p>However, it is always possible to do a good faux by using the stroke command, coupled with a little extra tracking and perhaps a touch of horizontal scaling. And there may be some instances where the next weight up can be used as a small cap.</p>
      <p>Hypatia<br>
      Chalet</p>
