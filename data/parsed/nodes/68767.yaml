  html: |-
    <p>Hey all,</p>
    <p>I am doing some research on fonts that exist in a serif and a sans version.<br>
    One example would be foundry's Foundry Form that exists as Foundry Form Sans and Foundry Form Serif.<br>
    Are there any other typefaces you can think of that exist in both versions?</p>
    <p>Next to that i would love to hear about morphing typefaces.<br>
    I guess im just diving into the world of flexible/dynamic type.<br>
    Anyone who can introduce me to that world and open the door for me?</p>
    <p>Thanx!</p>
