    html: <p>&gt;Why is there no comparably recognized British face? <br> <br>It seems to me that there were a great many  Didone faces cut in England and Scotland c.1800, that are "reading from the same page" as the well known Continental classics. Perhaps this is why no one in particular stood out. <br> <br>&gt;British art and literature never strayed very far from the lyric <br> <br>Although the UK didn't have a revolution like France, it was on the brink in the early 19th C, and the culture at that time was no less extreme. The national cultures were not isolated, and artists and scientists were very interested in what was happening elsewhere. The Jacobin  newspaper "Gazette.." was printed with Baskerville's type, for instance. British culture in the first half on the 19th century was considerably more modernist, and gothic, than it was neo-classical. <br> <br>&gt;quite impossible to mix Fenice <br> <br>Probably, but it's the simplification of serifs (or possibly call it "old style" serifs), most notable on C and S, that connects Walbaum with Fenice, and, to my eye, makes it look so at odds with Bodoni or Didot typefaces. <br> <br></p>
    html_clean: <p>&gt;Why is there no comparably recognized British face? <br> <br>It seems to me that there were a great many  Didone faces cut in England and Scotland c.1800, that are "reading from the same page" as the well known Continental classics. Perhaps this is why no one in particular stood out. <br> <br>&gt;British art and literature never strayed very far from the lyric <br> <br>Although the UK didn't have a revolution like France, it was on the brink in the early 19th C, and the culture at that time was no less extreme. The national cultures were not isolated, and artists and scientists were very interested in what was happening elsewhere. The Jacobin  newspaper "Gazette.." was printed with Baskerville's type, for instance. British culture in the first half on the 19th century was considerably more modernist, and gothic, than it was neo-classical. <br> <br>&gt;quite impossible to mix Fenice <br> <br>Probably, but it's the simplification of serifs (or possibly call it "old style" serifs), most notable on C and S, that connects Walbaum with Fenice, and, to my eye, makes it look so at odds with Bodoni or Didot typefaces. <br> <br></p>
