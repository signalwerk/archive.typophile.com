    html: <p>Nick, do you already opened a book from that period? Mixtures are quite typical and generally wonderful. Walbaum is square and strong enough for text when Didot delicate style will contrast wonderfully. <br> <br>In same veine, I'm pretty sure that, with careful selection, a mxiture of various Garamond will fit perfectly a layout <br> <br>More close to you, you should read again Bringhurst on type mixtures. <br> <br>But, perhaps we agree that Its quite impossible to mix Fenice with any others Didot-Bodoni-Walbaum? Same for many others faces too. <br> <br> <br>*** <br> <br>To me, Bulmer is the English counter part of Continental trend.</p>
