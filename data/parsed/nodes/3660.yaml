  - id: 27917
    user: 1262
    date: 2004-03-23T22:28:00
    date_raw: 23.Mar.2004 10.28pm
    votes: null
    html: <p><i>BTW, the big three of classic Didone/Modern fonts are Didot (French), Bodoni (Italian), and Walbaum (German). Why is there no comparably recognized British face? </i> <br> <br>As JFP notes, Bulmer is probably the closest that British types came to the full-blown Romantic types of the continent, yet it still remains closer to the neo-classical model of Baskerville, and is much less extreme than the Didot or Bodoni types. This isn't surprising, if you consider the cultural and political milieu of Britain at the time, and contrast it with the revolutionary circumstances of the continent. Romanticism in British art and literature never strayed very far from the lyric and retained strong neo-classical elements throughout the 19th century.</p>
    html_clean: <p><i>BTW, the big three of classic Didone/Modern fonts are Didot (French), Bodoni (Italian), and Walbaum (German). Why is there no comparably recognized British face? </i> <br> <br>As JFP notes, Bulmer is probably the closest that British types came to the full-blown Romantic types of the continent, yet it still remains closer to the neo-classical model of Baskerville, and is much less extreme than the Didot or Bodoni types. This isn't surprising, if you consider the cultural and political milieu of Britain at the time, and contrast it with the revolutionary circumstances of the continent. Romanticism in British art and literature never strayed very far from the lyric and retained strong neo-classical elements throughout the 19th century.</p>
