  html: <p>Does anyone have any recommendations on what versions of Walbaum are the better ones? I'm looking to buy one, and am really enamored of Stormtype's. But I can't find pdf's of anyone else's, and so I was wondering whether they're all the same or if one is considered better. <br> <br>Also, does anyone think it's a bad idea to design a philosophy journal using this font? I really like it -- I was recently drooling over an old copy of Heidegger's <i>Nietzsche</i> that I'm pretty sure was set in it -- but then again I'm not very experienced. (The feedback you guys gave on the newspaper design 6 months ago was helpful so I'm trying again.)</p>
