    html: |-
      <p>Erik Spiekermann (cofounder of the FontShop) says that building a custom typeface is much cheaper for Apple than licensing one. </p>
      <p>“If you get a complete character set, including Cyrillic and what have you, it’s way, way more expensive to pay licenses. If you’re talking about millions of units at a cent each, that’s a few hundred thousand dollars. You can design a hell of a typeface for that money."</p>
      <p>Also there is branding. “That’s been my other criticism about using Helvetica—that’s not their brand,” Spiekermann says. “Anybody can imitate that.” Not so with a custom typeface.</p>
      <p>(He also mentions that he was offered a job at Apple this summer but turned it down because he's retired.)</p>
      <p><a href="http://qz.com/262845/the-apple-watch-shows-that-jony-ive-is-finally-getting-serious-about-type-design/">http://qz.com/262845/the-apple-watch-shows-that-jony-ive-is-finally-gett...</a></p>
