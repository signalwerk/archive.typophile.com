  html: |-
    <p>I'm not much of an Apple fanboy but I couldn't help but notice the font in their watch UI, it seems like a mix of Univers and DIN, like it's engraved, maybe they wanted to suggest a classic machined quality to the product.</p>
    <p>A good thing they are drifting away from Helvetica.</p>
    <p>Does anyone know something about it?</p>
