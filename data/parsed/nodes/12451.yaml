      <p>Hve you looked at <a href="/wiki/Avenir%20Next" class="freelinking" rel="nofollow">Avenir Next</a>? <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a> is a typeface based on <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a> that <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Adrian Frutiger</a> designed in 1988. He had never been bappy with the cold, modern appearance of Futura, so he humanized it. In 2003, he and <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a> redrew Avenir, creating Avenir Next, which has better distribution of weight across the family, small caps, old style figures, and condensed styles. No <a href="/wiki/true%20italics" class="freelinking" rel="nofollow">true italics</a>, though. I don't think that Frutiger was ever a fan of those.</p>
      <p>Here is the <a href="http://www.linotype.com/90672/avenirnext-family.html" rel="nofollow">URL to Avenir Next</a>, and here is one to the old <a href="http://www.linotype.com/72/avenir-family.html" rel="nofollow">Avenir</a>.<br>
      __<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
