      <p>Although I do still like Futura - the regular width, not the condensed - my current two favorite sans for a sense of modern elegance are <a href="http://www.underware.nl/site2/index.php3?id1=auto&amp;id2=animated&amp;id3=allanimations" target="new" rel="nofollow">Auto 1</a> from Underware and <a href="http://www.stonetypefoundry.com/html_pages/MagmaOverview.html" target="new" rel="nofollow">Magma</a> from StoneType.</p>
      <p>More daring yet still elegant are <a href="http://www.psyops.com/html/spec_sophisto_ss.html" target="new" rel="nofollow">Sophisto</a> from MAC Rhino &amp; PSY/OPS, <a href="http://www.psyops.com/html/spec_faceplate.html" target="new" rel="nofollow">Faceplate Sans</a> from PSY/OPS and <a href="http://www.psyops.com/html/spec_reykjavik1.html" target="new" rel="nofollow">Reykjavik One</a> also from PSY/OPS.</p>
      <p>All these faces are fairly narrow, especially Magma and Sophisto.</p>
      <p>chester's stuff, recommended by Yves below, is simply incredible. In particular, I reach for <a href="http://thirstype.com/fonts.php?font=GalaxiePolaris" target="new" rel="nofollow">GalaxiePolaris</a> whenever I need a superbly stylish grotesk.</p>
      <p><a href="http://www.fountain.nu/catalogue/stalemate.asp" target="new" rel="nofollow">Stalemate</a> would have been on my list as well if Yves hadn't mentioned it already.</p>
      <p><a href="http://www.emigre.com/EFfeature.php?di=200" target="new" rel="nofollow">Vista Sans</a> is wonderful too, but beware. Even though designer Xavier Dupré says "the text weights are loosely spaced" I was shocked to discover just how loosely spaced they are - so much so that Vista Sans is not, in my view, a realistic choice for extended text at a bookish 9.5 points, for example. Magically, the text weights start to work and really are quite lovely starting at around 11 points - but they still seem better suited to shorter than to longer texts at this size as well.</p>
      <p>One final caveat on Vista: it is a very, very dark typeface. I usually have issues with the fact that many digital fonts are too light for my limited office toolset, but Vista is a little dark even for me. The book weight might be considered a regular in other fonts, the regular a medium, and the medium a bold.</p>
      <p>Regardless, I find Dupré's work amazing and am now saving my pennies for his FF Absara Sans, <a href="http://typographi.com/001000.php" target="new" rel="nofollow">reportedly</a> due out from FontShop later this year.</p>
