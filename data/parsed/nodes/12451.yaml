    html: <p>If you want a more conventional-looking alternative, particularly like Futura's small x-height <em>and</em> need a condensed companion as well, Christian Schwartz's <a href="http://www.houseindustries.com/index.php?page=showfont&amp;id=18" target="new" rel="nofollow">Neutraface</a> and <a href="http://www.houseindustries.com/index.php?page=showfont&amp;id=94" target="new" rel="nofollow">Neutraface Condensed</a> are the perfect choice. It's got true italics, and can be used both in Futura- (Neutraface Alternate) and Avenir (Neutraface "regular")-mode -- two type families in one! :-)</p>
