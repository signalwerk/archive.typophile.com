      <p>Personally I think there is no excuse whatsoever for using Futura Condensed, as I truly think that face is an abomination, sorry for ranting. :-)</p>
      <p>If you want a clean-<em>truly</em> modern-elegant look there are a number of contemporary alternatives that blow Futura, Frutiger and the lot right out of the water.</p>
      <p>I don't have time right now to give you a complete run-down, but for starters have a look at the very-forward-thinking-but-subtly-so sans serifs of every graphic designer's best kept secret <a href="http://www.psyops.com/html/specimens.html" target="new">Psy/Ops</a>, <a href="http://www.macrhino.com/" target="new">MacRhino</a>'s quite narrow <a href="http://www.fountain.nu/catalogue/stalemate.asp" target="new">Stalemate</a>, <a href="http://www.processtypefoundry.com/" target="new">Eric Olson</a>'s technical-yet-warm <a href="http://www.processtypefoundry.com/typefaces/klavika/index.html" target="new">Klavika</a>, <a href="http://www.thirstype.com/designers.php?designer=chester" target="new">Chester</a>'s <a href="http://www.thirstype.com/fonts.php?font=GalaxiePolaris" target="new">Galaxie Polaris</a>, <a href="http://www.thirstype.com/fonts.php?font=Infinity" target="new">Infinity</a> and <a href="http://www.thirstype.com/fonts.php?font=ApexSans" target="new">Apex Sans</a>, and <a href="http://www.lucasfonts.com/" target="new">Luc(as) de Groot</a>'s complete output.</p>
