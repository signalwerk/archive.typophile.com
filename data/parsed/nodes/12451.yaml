    <p>Hello,</p>
    <p>This is my first post here at typophile — what a cool website!<br>
    Anyways, here's my problem: I'm a graphic design student, and I find myself using Futura Condensed very often. Particularily when I'm going for the clean-modern-elegant look. Do you have any suggestions for other fonts that would fit the bill?</p>
    <p>Cheers!</p>
    <p>Chad Brewer</p>
