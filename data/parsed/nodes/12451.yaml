      <p>Hve you looked at <a href="/node/12461" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir Next</a>? <a href="/node/12462" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir</a> is a typeface based on <a href="/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a> that <a href="/node/12118" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adrian Frutiger</a> designed in 1988. He had never been bappy with the cold, modern appearance of Futura, so he humanized it. In 2003, he and <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a> redrew Avenir, creating Avenir Next, which has better distribution of weight across the family, small caps, old style figures, and condensed styles. No <a href="/node/add/wiki?edit%5Btitle%5D=true%20italics" title="Create node &quot;true italics&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">true italics</a>, though. I don't think that Frutiger was ever a fan of those.</p>
      <p>Here is the <a href="http://www.linotype.com/90672/avenirnext-family.html">URL to Avenir Next</a>, and here is one to the old <a href="http://www.linotype.com/72/avenir-family.html">Avenir</a>.<br>
      __<br><a href="http://www.typeoff.de">www.typeoff.de</a></p>
    html_clean: |-
