      <p>Chad,</p>
      <p>Futura is a very accommodating typeface for that clean-modern look however I find myself using Officina or Frutiger often too. The trick I find is to get 2 typefaces that are a nice complement of each other and go from there. I know it is bad to limit yourself to 2 and by no means is that what I am saying, but for somebody in school it is a very good thing to see what the limitations of said face are.</p>
      <p>My 2 during school were Futura Family (regular &amp; condensed) and Minion Pro, a very nice face however used quite often can create the same drone feeling that Times has created for itself.</p>
      <p>Good Luck,</p>
