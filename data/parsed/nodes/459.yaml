    html: <p>YES! keep it going. <br> <br>Hrant's deconstructing the 'virtual machine' that processes design - the human perceptual system. Some of it is objective, contextless, pure - some of it is about detecting faces and the difference between a copse of trees and a tiger. <br> <br>I think the notion of 'notan' invites the designer to start on grey rather than black or white (chiaroscuropsis?) cause in the real world 'figure' is positive and negative variations against ground. In a decade we'll know better how to maximize the channel between visual presentation and the mind. Feedback will play a big part. Until then we'll have to kern by eye, and gut. <br> <br>-chris</p>
