    date: 2003-10-25T13:29:00
    votes: null
    html: "<p>Kent, great post. <br> <br>What I would say myself is that: <br>- A font with \"too many\" pairs is usually better. Somebody who makes his base spacing bad to the point of needing many corrective pairs is unlikely to spend the time putting those pairs in! The habit of looking down upon large numbers of pairs (which de Groot has interestingly called an \"Americanism\") might be nothing more than an excuse not to provide good kerning. Gobs of auto-kerning notwithstanding. <br>- A font with too-few pairs is always bad! Unless it's to make an ideological point by having no pairs at all, like some of Dan Carr's work. <br> <br>BTW, don't forget Ypres, an important name in military history... as well as in Monty Python. <br> <br>hhp <br></p>"
