    html: <p>wow, thanks everybody for taking time and participating. <br>Randy, I've downloaded the book you mentioned and will surely read the recommended chapters first (and then the whole book ^_^ ). <br>Stuart, I didn't really get your concept of horizontical center, a line and kerning. Also, the concept of "rhythm" is hard to understand on the fly. I've seen it mentioned in "The Elements of Typographic Style" and other books on the subject, but it's hard to understand it like that. ;/ <br> <br>Also, what about those programs, like HZ-Program now built in InDesign for optical kerning? It calculates something with its formulas. Of course, it would be naive enough to think everybody knows those formulas, but does anyone happen to know the principle? What IS optical kerning? How can a programm be subjective?! O_o <br> <br>And the word "arbitrary" doesn't make my day shine. See, such an untrained eye as mine will need million years before it can kern right. -_;</p>
  - id: 2923
    user_id: 618
    user_name: aquatoad
    user_path: null
    date_raw: 27 Jun 2003 — 8:51am
    date: 2003-06-27T08:51:00
    votes: null
    html: <p><i>The key to determine how many kern pairs all comes down to the quality of the spacing job on the font. It is likely a perfectly spaced font could exist without any kern pairs.</i>  <br>  <br>Great point. That's why I immediatly jumped in and started talking spacing. For example, Alexey, if you look at the list of kerning pairs on pages 89 and 90 of the book you downloaded, the essentials are listed at the bottom of p.89. You probably will have to kern (Av, Ay, Aw, AW etc.) But good spacing might just take care of many on page 90 (for example OB, OD, OE, OF, OH, OI, OK, OL, OM, ON, OP, OR etc, a round next to a vertical, they're all going to be really close to the same) One suggestion might be to group the remaining ones into similar groups for kerning (Av, Ay, Aw will be relatively close) <br> <br><i>Regarding rules for kerning, I have a personal theory. . . If you were to determine the absolute horizontal center of a character and draw a line at that mark then set a long string of text, I would kern anything that exceeded a certain width or percentage minding the width of the glyph. </i> <br> <br>I also have personal theory, that guides my spacing/kerning :-) For the latin alphabet my experience is that the top half of the lower case has a larger impact on legibility and spacing. For example if you were to type the word l-i-t-t-l-e  or  f-i-t-t-i-n-g  and cover up the top half  a) you'd be hard pressed to read it, and b) the spacing would look really bad! But looking at the letters as a whole, the job might be spaced just right. I guess all that to say, top half of most letters will have the most effect on the spacing/kerning. <br> <br>One last thought, it's impossible to incorrectly space two letters. When you add the third, that's when it gets tricky. In your metrics window go down the line in groups of three, then check the line as a whole for overall rythm (for spacing and kerning). <br> <br>I am no expert! Expert methods wanted! <br> <br>Randy</p>
