    date: 2003-10-25T07:32:00
    votes: null
    html: <p>The raw number of kern pairs in a digital font cannot be used as a measure of the quality of the spacing. You must look at the nature of the pairs included. <br> <br>A font may have thousands of kern pairs because the base spacing is poor and has been compensated for. For example, does the font have more than about 150-200 lc-lc pairs?  <br> <br>Or it may have thousands of pairs because more combinations have been considered and included. Does the font include kerns for accented characters (as Thomas mentioned above) or infrequent combinations? <br> <br>A font may have fewer than 500 pairs because the design and the base spacing don't require more. Or it may have fewer because the designer just didn't bother to refine the spacing. <br> <br>It's often a matter of how thorough a designer chooses to be, balanced against a number of considerations. Code size used to be more of an issue in the early days; less so now. A commercial venture needs to decide how much additional time to spend reviewing pairs of lesser statistical value. A line needs to be drawn somewhere. Different foundries or designers will draw it at different places. <br> <br>For example, my Whitman fonts contain on average about 1700 kern pairs. Some may consider that high. But about 20-25% of those are for accented characters -- both UC-lc accents (V</p>
