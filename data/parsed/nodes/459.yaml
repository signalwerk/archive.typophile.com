  - id: 2939
    user_id: 909
    user_name: Thomas Phinney
    user_path: null
    date_raw: 24 Oct 2003 — 8:44pm
    date: 2003-10-24T20:44:00
    votes: null
    html: <p>I just noticed this thread with Kris's quote. <br> <br>Sure, more kerning = a bigger font and more data. But frankly, that's not much of an issue on modern computers and with most current-edition software. <br> <br>Lots of kerning may result from a designer trying to compensate for poor initial spacing. But even given ideal spacing, a well-made single-byte font may be able to make good use of several thousand kern pairs. <br> <br>Although Adobe's earliest fonts in the mid-80s typically had 100-200 kern pairs, by the time Adobe stopped making Type 1 fonts at the end of the 90s, 500-3000 was a fairly normal range of kerning pairs for an Adobe Original design. <br> <br>I'll note that the 100-200 count typically involved not kerning accented characters, so it was basically inadequate for most Latin languages beyond English. <br> <br>Today, the whole point has become moot for those of us doing OpenType fonts. The character sets may be larger (sometimes vastly larger), which means more kerning is needed. Further, the opportunity to use class-based kerning means that "pairs" and the linear relationship between total kerning and data size become irrelevant. <br> <br>If you took the kerning classes in Minion Pro Regular and expanded them into pairs, you'd end up with &gt;70,000 pairs (we did a test at one point in development; the final total would doubtless be larger). But the font also has something like 1600 glyphs. <br> <br>We don't generally "boast" about the quantity of kerning in Adobe fonts. It's not something we advertise on our Web site. But I will say that we spend a great deal of time and effort trying to get spacing and kerning right. <br> <br>Cheers, <br> <br>T <br></p>
  - id: 2940
    user_id: 1519
    user_name: kris
    user_path: null
    date_raw: 24 Oct 2003 — 9:21pm
    date: 2003-10-24T21:21:00
    votes: null
    html: <p>Thomas, I realised after I posted that contemporary  <br>technology pretty much renders file size irrelevant. But  <br>does "compensat[ing] for poor initial spacing" suggest <br>that the intial spacing effort would be poorly 'crafted'?  <br>If technology allows for many kerning pairs, does this <br>render metrics largely irrelevant? I know it is a poor  <br>comparison, but I realised that metal type has fixed  <br>spacing, which I presume means no kerning pairs,  <br>except ligatures. Was metal type spaced well, or was  <br>a little bad spacing here and there accepted because <br>of the limitations? <br> <br></p>
  - id: 2941
    user_id: 909
    user_name: Thomas Phinney
    user_path: null
    date_raw: 24 Oct 2003 — 9:33pm
    date: 2003-10-24T21:33:00
    votes: null
    html: <p>Kerning, even large amounts, is no substitute for good spacing in the first place. It rather complements good spacing. <br> <br>Metal typefaces were often well spaced, though sometimes poorly. They were probably better spaced on average than digital typefaces, because of the amount of work involved and metal type creation being a more specialized craft. In particular, the role of the punch-cutter in spacing was crucial. <br> <br>T</p>
