    date_raw: 26 Jun 2003 — 7:26am
    date: 2003-06-26T07:26:00
    votes: null
    html: <p>I like to think that design and typography is equally about aesthetics and creative flair as well as hard and fast rules. While i take your point that you can apply sets of rules to certain elements of typography including kerning, I think to a point it takes the fun out if it bowing to mere mathematical calculation.  <br> <br>The kerning of specific characters changes from font to font, but yes there are similarities between pairs of characters. I couldn't tell you whether the kerning between 'ey' is based on any mathematical rule, only that the shape of the characters means that they need to be closer together to appear visually equally spaced. <br> <br>Someone else might though...</p>
