    date: 2003-06-30T16:48:00
    votes: null
    html: <p><i>&gt;Good spacing is good notan</i> <br> <br>Hrant -- <br> <br>Are you making up new words again? This is the second or third time I've seen you use this "notan" word. What the hell does it mean and where does it come from? <br> <br>-- Kent. <br></p>
  - id: 2930
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 30 Jun 2003 — 5:57pm
    date: 2003-06-30T17:57:00
    votes: null
    html: "<p>&gt; This is the second or third time <br> <br>That's it?! I'll have to ramp it up...  ;-) <br> <br>Notan is an old and highly useful, deep term. So it's not-an invention of mine. :-) <br> <br>Notan is Japanese, and it means the counterbalancing and relationship of Black and White. Like Yin-Yang. <br> <br>Without getting too religious, I'd say that Notan is the entire basis of type design, but it has yet to gain proper respect in the West. You hear people say things like \"the black has to be balanced by the white\", but they don't go any deeper than that, towards the implications, like how lettering and type differ, and how chirography cannot generate optimal notan (because the two edges of the black over-ride the truly necessary relationship, the one between the black and the white). And the fact that the term has to be imported from the East is highly telling. <br> <br>Notan is the reason spacing is just as important as the letterforms, the reason a font is more than a set of pretty shapes. <br> <br>-- <br> <br>Recommended reading: <br>\"Notan: The Dark-Light Principle of Design\" <br>by Dorr Bothwell, Marlys Mayfielf <br>Only US$8, and it includes DIY exercises. <br> <br>hhp <br></p>"
