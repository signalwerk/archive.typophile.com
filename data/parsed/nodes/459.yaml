    votes: null
    html: "<p>rhythm (<i>noun</i>; 'ri-[th]m): movement or fluctuation  <br>marked by the <i>regular recurrence or natural flow of  <br>related elements</i> b : the repetition in a literary work of  <br>phrase, incident, character type, or symbol <br> <br>It doesn't exist? By saying \"rhythm\" aren't we talking about  <br>a regularity to the spacing, a cadence that is as even as  <br>possible throught any combination of characters. There will  <br>always be breaks in the rythm because of the shapes of  <br>latin letters. L + anyletter will cause a hiccup in the rhythm. <br> <br>The bait was tossed and my lip is expecting a sharp pain  <br>any moment now. <br> <br>Randy</p>"
  - id: 2926
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 28 Jun 2003 — 12:33pm
    date: 2003-06-28T12:33:00
    votes: null
    html: "<p>To be fair, there certainly is rhythm during deliberative reading (like looking at a poster). In fact there are probably many layers of rhythm there. <br> <br>But in text, there are only two parameters of rhythm: <br>1) The relationship of saccades to line lengths. <br>2) The textual content. <br>But #1 is a typesetting thing, and #2 is an authoring thing - both outside the scope of type design. <br> <br>So there can be no real rhythm at the letterform level, not even the bouma level. It sure sounds great though - like a kirin in the sky. <br> <br>hhp <br></p>"
