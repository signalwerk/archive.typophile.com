  - id: 2948
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 26 Oct 2003 — 9:03am
    date: 2003-10-26T09:03:00
    votes: null
    html: |-
      <p>As we've said, the raw number of kern pairs is no measure of the quality of a font's spacing. Ultimately, the best evidence is to set text and look at it. A well-spaced font will be, well . . . well spaced. <br> <br>Generally speaking, though, a truly refined font will have a greater number of pairs. That said, however, a <i>well-crafted</i> font should still set adequately with kerning turned off. Kerning is a refinement of spacing, not a substitute.  <br> <br>I'm no expert in the subject of spacing, but I have given considerable thought and study to the matter. Further to the turn this thread has taken, I thought I'd share the following analysis. <br> <br>Let me contrast two excellent text typefaces with two that often get used for the task but are, in my opinion, not built for the job. <br> <br>Matthew Carter's Miller is one of the most excellent text faces I've had the pleasure to work with over the years. His Fenway is also a contemporary masterpiece for text.  <br> <br>In comparison, Mrs Eaves and Filosofia are two typefaces which recently have begun to show up more and more for text in books (heaven forbid). While I admire Zuzana's designs and like both of these in display, I think it is no secret that they are not up to the task of extended text, spacing-wise.  <br> <br>I spent a little time a while back sorting some AFM files to gain a little more insight into the inner workings. I broke them down into the following categories: <br> <br><b>Uppercase-Uppercase</b> <br><b>Uppercase-lowercase</b>-- including the odd lc-UC, like <i>cT</i> or <i>cV</i> <br><b>Uppercase-punctuation</b> -- in either order, e.g., <i>"A</i> and <i>A"</i> <br><b>lowercase-lowercase</b> <br><b>lowercase-punctuation</b> -- in either order <br><b>punctuation-punctuation</b> -- e.g., various points with various quotes, etc. <br><b>numerals</b> -- involving figures as either element, in combination with anything: other numerals, punctuation, lowercase (e.g., <i>1t, 7t,</i> etc.) <br><b>accents</b> -- involving any accented character (cap or lc) as one of the elements, including Oslash, Ccedilla, dotlessi, etc. (which aren't accented, strictly speaking) but not the dipthongs <br> <br>Here is a breakdown of the number of kern pairs for each.  <br> <br><br>
      </p><table border="1">
      <tbody><tr>
      <td> </td><td>Miller</td><td>Fenway</td><td>Mrs Eaves</td><td>Filosofia </td></tr><tr><td>UC-UC</td><td>122</td><td>67</td><td>93</td><td>85 </td></tr><tr><td>UC-lc</td><td>200</td><td>277</td><td>58</td><td>78 </td></tr><tr><td>UC-punct</td><td>285</td><td>319</td><td>10</td><td>26 </td></tr><tr><td>lc-lc</td><td>156</td><td>97</td><td>7</td><td>5 </td></tr><tr><td>lc-punct</td><td>245</td><td>289</td><td>2</td><td>0 </td></tr><tr><td>numerals</td><td>64</td><td>129</td><td>0</td><td>0 </td></tr><tr><td>accents</td><td>33</td><td>137</td><td>0</td><td>0 </td></tr><tr><td>Total</td><td>1128</td><td>1359</td><td>170</td><td>194</td>
      </tr>
      </tbody></table>
      <p></p><p> <br> <br>It is instructive to look at the particular pairs in all these instances. I can't go into them here, but I recommend all those who wish to learn more about kerning to look closely into the AFM files of several fonts. <br> <br>-- K.</p>
