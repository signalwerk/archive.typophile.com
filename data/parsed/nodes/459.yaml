    date_raw: 29 Jun 2003 — 7:00pm
    date: 2003-06-29T19:00:00
    votes: null
    html: <p>In the end, a good definition of rhythm is not the point (I think ours differ), nor is the existence of rhythm or not. Trying to come up with a good plan to approach spacing and kerning is. I'd be most interested to hear (in detail if you're willing -- or anyone else for that matter) your course of action when setting about spacing and kerning a font.  <br> <br>I think Stuart was merely articulating some of what i'm (and Alexey's) hoping to hear more of. If I read his part about rhythm with relation to the other glyphs in an alphabet, that's just to say many letters in the roman alphabet have similar shapes, and thus could be spaced/kerned similarly. Forgive me Stuart if I'm off the deep end! <br> <br>Regards <br>Randy <br> <br>BTW Hrant, congratulations on post number 2700.</p>
