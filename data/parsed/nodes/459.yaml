    date: 2003-06-26T07:37:00
    votes: null
    html: <p>It's okay to have fun while working - not only in typography. I agree absolutely. But there is so much fun already working with it, that I thought, there are also some definite set of rules at least for some parts of the whole process. Like, Matthew, you say that kerning differs from font to font. True but I wasn't speaking about absolute values. I meant relative rules. Like, NM is 1 measure (1M). OK is 0.8M, WW is 0.5M and so on (hypothetically speaking). <br>I am surprised there are no rules regarding kerning. <br>How are kerning tabes made/calculated? I mean the ones supplied for every font. What are those principles?</p>
