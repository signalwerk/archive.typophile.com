  votes: null
  html: <p>Okay, newbie or not but after reading several books on typography I can't remember anyone mentioning anything about <b>how</b> to measure kerning. Most of the time would be told "Kerning is important!", "Double-check your kerning!", "blah!", "blah blah!", BUT .... how? Say, If I have a measure X which equals the letter-spacing here "NM", then how do I measure the kerning in the following pairs "NO", "OS", "WS", "PG", etc.. Do you have your techniques? Tell me, please.</p>
