    html: <p>&gt; Trying to come up with a good plan to approach spacing and kerning is. <br> <br>Totally. <br> <br>Good spacing is good notan (the relationship between white and black). Good notan is where the letters meld into good boumas. When the spacing is too tight/loose, the black gets lost in the discord between intra- and inter-letter white. <br> <br>&gt; post number 2700 <br> <br>Oh. Time flies. Or something. But you guys were supposed to remind me at 2048 (remember, I'm a binaryboy). So now you have to wait for 4096. <br> <br>hhp <br></p>
