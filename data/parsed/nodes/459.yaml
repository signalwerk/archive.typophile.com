    date_raw: 26 Jun 2003 — 9:36pm
    date: 2003-06-26T21:36:00
    votes: null
    html: <p>Regarding your original question, there are many ways to kern and as mentioned above it's all subjective depending on the type of type you're making . . . <br> <br>A text face has more predictable forms due to its nature and can actually look good without much additional kerning. In contrast, a display face that contains no repeating character forms in some cases can be riddled with kern pairs. <br> <br>The key to determine how many kern pairs all comes down to the quality of the spacing job on the font. It is likely a perfectly spaced font could exist without any kern pairs. <br> <br>Regarding rules for kerning, I have a personal theory. . . If you were to determine the absolute horizontal center of a character and draw a line at that mark then set a long string of text, I would kern anything that exceeded a certain width or percentage minding the width of the glyph. <br> <br>I think there is a rhythm that can be easily identified in relation to the rest of the glyphs in the typeface and to some degree could become a rule that requires kerning be applied. <br> <br>Beyond that, another thing to consider is that even if you decide to make as few kerning pairs as possible, if you make let's say a 'vo' kern, expect that will also be required for a 'v</p>
