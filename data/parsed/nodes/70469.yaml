    I am once again "typefacing". Back from the grave!<br>
    Anyway, i am having a strange issue in Fontlab.<br>
    Tried to import background but it doesnt recognize the .JPG or .BMP or even .GIF it does recognize .TIFF but when i try to import tiff it just gives me an error.</p>
    <p>Any idea?</p>
