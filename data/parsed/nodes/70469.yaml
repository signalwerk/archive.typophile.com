      <p>Hello @sendoushi<br>
      I had same the problem like you, of course I forgotten its solution cause I solved it for myself in bef0re; but today I missed it again. So I tried to find a way to solve my problem. after thinking and test different ways I found it again.</p>
      <p>If you open the image that you need for mapping in Fontlab in some applications like PS or everything else and copy the image to clipboard by selecting image(Ctrl+C), the image going to clipboard and then if you go to Fontlab studio and paste(Ctrl+V) buffered image; you get the result. also if it doesn't have good view in Fontlab in graphical app first mix it(change its mode to Grayscale or Black&amp;White)</p>
      <p>I checked our friends solutions in these post but none of them had effect. Firstly I wrote this post for myself for when I forget this solution again.</p>
      <p>Thanks admin for this forum.<br>
      Bless all of you</p>
