  html: |-
    <p>I'm looking for a font similar to Century Schoolbook, but I need OpenType features like fractions and old style figures. </p>
    <p>It needs to have:<br>
    -upward pointing serif on the R leg<br>
    -ball-shaped serifs on the J, c, f, g, &amp; r<br>
    -the tail of the Q loops around the inside of the ellipse</p>
    <p>Some of the "news" style faces like Excelsior or Corona would probably fit the bill, but as luck would have it, none of these seem to be available with the OpenType features I need either.</p>
