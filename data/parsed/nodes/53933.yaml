  html: |-
    <p>In my ongoing search for interesting type related art for home, does anyone know of a nice poster design, showing the evolutionary milestones in the development of type, at least in the latin alphabet, from blackletter, through humanist, oldstyle, transitional, modern etc, along with important names and dates?</p>
    <p>If none exists I think this would be a great project, and would produce something worthy of hanging on the office wall.</p>
