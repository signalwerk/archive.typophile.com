      <p>I don't know about poster, but for a info a really good book is Explicatio Formarum Litterarum -The Unfolding of Letterforms by Rutherford Aris. I got a complimentary copy at my first calligraphy conference in 1990. It covers first to 15th centuries very thoroughly with pullout timeline charts, lots of samples and notes.<br>
      Don't know how available it is currently. Amazon shows it as unavailable, but John Neal has it in his site:<br>
      <a href="https://www.johnnealbooks.com/prod_detail_list/s/9" title="https://www.johnnealbooks.com/prod_detail_list/s/9">https://www.johnnealbooks.com/prod_detail_list/s/9</a><br>
