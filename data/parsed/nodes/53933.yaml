    html: |-
      <p>Steve, here's a quick translation of the text on that web site. Sorry if it sounds garbled – my brain's like 99% full of my font right now :-)</p>
      <p><em>An educational poster for real connoisseurs of the Black Art. For the first time, this overview shows all German type foundries, as well as more than 200 takeovers and transfers, as a logical, genealogical tree. Connecting lines highlight individual developments. The resulting view clearly outlines the rise and bloom of the Black Art, as well as its abrupt termination by the rise of phototype.<br>
      Gutenberg was the first European to print with movable type. His idea quickly found enthusiastic followers, who continued to spread type casting throughout Germany and Europe. This new technology brought forth numerous new typefaces, the most important of which are displayed on the poster.</em></p>
      <p>I can recommend Christian's posters, though I haven't seen this one; I have his 2009 calendar poster and it's beautifully laid out and printed. I'm pretty sure he speaks English, so you could also email him directly with any further questions (there's an email link on the "Impressum" page).</p>
