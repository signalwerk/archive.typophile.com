      <p>Guys (and gals) thank you so much for all of the info... The webpage timeline, and that PDF are absolutely perfect for me to use as a learning/memory aid. </p>
      <p>One of my greatest ambitions (and the reason for my ongoing research) is to eventually create a general purpose typeface that will go some way to bringing back the notion of the serif into contemporary typography... I love what Erik Spiekermann et al have done with Meta Serif... I am convinced it's the way things will go, certainly in corporate usage (anyone think it will catch on in other areas?)</p>
      <p>Part of my research turned up an amazing fact, when I discovered I live barely 2 miles from Baskerville's birthplace... I meantioned this to a friend recently who laughed at my wanting to visit the place and wondered if I might be wanting to become a great typographer through osmosis. I know it's not so easy!</p>
      <p>Steve</p>
