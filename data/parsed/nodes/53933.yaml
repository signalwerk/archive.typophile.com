      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Letters3_3528.JPG"></div><br>
      When I was in high school, long before I dreamed that I would work for much of my adult life as a graphic designer, I bought this big box of "Foot-High Letters" that I found in a museum gift shop. It was a 1960s Dover reprint of a 1940 publication, probably originally intended for use in art classrooms. <p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Letters4_4765.JPG"></div><br>
      They're really meant to show the distinguishing characteristics of type families rather than the history of type design, but they still make handsome conversation pieces.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Letters1_5321.JPG"></div><br>
      A quick Google search turned up few UK dealers who list this set for the equivalent of US $10 or less. <p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Letters2_3563.JPG"></div><p></p>
