    <p>I am working on a project that is spoofing (but also celebrating) utilitarian, un-self-conscious bureaucratic designs, the kind you would see at the DMV or from a government utility.</p>
    <p>I am looking for fonts that will look authentic, but might also be dated (preferably from 1970s) and/or show poor design taste.</p>
