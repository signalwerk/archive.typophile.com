      <p>&gt; some IBM Selectric fonts</p>
      <p>Yeah, a lot of offices in those days used IBM typewriters to create documents and forms. Photocopiers existed but I'm not sure how common they were; I remember many offices using carbon paper if they just needed a few copies, or mimeograph machines if they needed many.</p>
      <p>If they had their forms commercially printed, it would usually be whatever fonts were available at the local print shop. Today we're used to having a huge number of fonts to choose from, but in those days a small printer often had a pretty limited selection, and layouts created by the printer were often dull and static (centered heads in caps, justified text, etc.).</p>
