      <p><a href="http://www.typodermic.com/83.html" rel="nofollow">Chainprinter</a> is the typical computer print out you'd see on licences, magazine subscriptions, report cards etc from the 60's to the mid 80's.</p>
      <p><a href="http://www.typodermic.com/03.html" rel="nofollow">Telidon</a> is similar to an early Epson dot matrix. But they didn't hit the streets until 1978 . . . before that it was mostly teletypes, daisy wheels and chain printers.</p>
      <p>Early daisy Wheel printers shared some of the same fonts as electric typewriters. So you could dig for some IBM Selectric fonts and get a similar effect.</p>
      <p>Offices had name plates, often with a fake woodgrain on white plastic. A router etched out the letters and it was usually a font like <a href="http://new.myfonts.com/fonts/larstornqvist/simpliciter-sans/" rel="nofollow">this</a> and usually all caps.</p>
