    html: |-
      <p>Usually, you are prohibited from taking a font you have licensed and using its outlines and other data to make another, whether that new creation is very similar or very distinct from the original. You can typically modify the outlines of the font in a program like Illustrator, but you usually cannot make a font out of your modifications. You can usually create a new font based on a previous design if the original is a printed specimen, i.e. not first created in digital form.</p>
      <p>I've emphasized that this is what I believe many <em>(not all)</em> <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a>s require, but as Tiffany said, you should examine the license agreement of the foundry you are considering licensing the font from and e-mail or call them if you have any questions.</p>
      <p>As for the recommendation, you should try searching Typophile first (I know I've seen a thread about rounded type recently) and then make a new post in General Discussions if you want more or more specific recommendations.</p>
    html_clean: |-
