      <p>How can I say this without sounding pedantic... "Helvetica" is not an English word. Sorry. That's why it isn't in the dictionary. However, if you look up "Helvetia," you will see this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/helvetia_6003.png"></div><p></p>
      <p>Now, if you looked up "Helvetica" in an encyclopedia and didn't find it... OK, that might be cause for alarm! :-)</p>
