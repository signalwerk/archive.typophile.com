      <p>Hi, glad to know you.</p>
      <p>I've handled this kind problem with cswh features as follow:</p>
      <ol>
      lookup cswh10 {
      <ol>
        ignore sub @fina1' [@letter_define];<br>
        sub @fina1' by @fina2;
      </ol>
      <p>} cswh10;
      </p></ol>
      <p><strong>@fina2</strong> is a class where the endings were placed.</p>
      <p>So far this works fine in Indesign, but I'm not yet sure if this fiture can generally be accessed in several other software which supporting OT</p>
      <p>Best regards.<br>
      awm</p>
