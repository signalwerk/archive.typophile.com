  html: |-
    <p>I've been seeing a change in the way Illustrator handles contextual ending letters and wondered what's different. I used to use a lookup in the calt feature and it would only work with end of words followed by a space. End of lines used to never work because of the nature of text strings. </p>
    <p>Here is what I use for a code:</p>
    <p>feature calt {<br>
         lookup calt_y.end1 {<br>
         ignore sub y' @ Letters;<br>
         sub y' space by y.end1;<br>
         } calt_y.end1;<br>
    } calt;</p>
    <p>The space character BTW is NOT included in @Letters. Normally the ending y should only be triggered when followed by a space, but for some reason it does this at ends of lines also where there is no space character following. Last year I was doing this in CS4 as well, but there was a software update since then and now it behaves differently. Normally having an ending character at the end of lines and words both wouldn't be a problem, but since its contextual and there are ending swqsh letters in the stylistic sets as well, it makes it harder for a user to sub the swash ends without turning the calt feature off first.</p>
