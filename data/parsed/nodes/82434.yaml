    html: |-
      <p>I don't think you can do that in OpenType today. Sorry.</p>
      <p>Unless of course the layout engines allow the hard return character to participate in OpenType shaping. But I'd be surprised if that was normal/common behavior across layout engines. But even that wouldn't be enough, if you want the feature to also work when the end of paragraph is also the end of the document or text block... you'd need to be able to detect app-inserted soft returns as well, which seems even more unlikely.</p>
      <p>If my belief above is correct, it would take very active application support to make such a feature work, because only the application knows whether the last character on the line is the end of just the line, or the end of the paragraph. The regular OpenType contextual workings aren't enough to handle that.</p>
      <p>Regards,</p>
      <p>T</p>
