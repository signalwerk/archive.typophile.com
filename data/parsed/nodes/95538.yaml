    <p>"Broken Letters: A Typogeography of Europe<br>
    Frank Jacobs on August 12, 2012, 8:27 PM</p>
    <p>"There are many ways to look at Europe other than as a collection of nation-states. Plenty of other imagined communities lurk beneath the surface of the standard political map. Check out the continent's alcohol belts [1], have a look at its core and periphery [2], or inspect the languages in which Europeans tweet [3].</p>
    <p>"What you'd probably not consider, is to study a map of the different alphabets in official use across Europe today."</p>
    <p><a href="http://bigthink.com/strange-maps/577-broken-letters-a-typogeography-of-europe?page=2">http://bigthink.com/strange-maps/577-broken-letters-a-typogeography-of-e...</a></p>
