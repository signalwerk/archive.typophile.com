    <p>What started out as a set of nerdy, cryptic notes to myself is gradually evolving into a full-blown blog of its own. I called it "typography/typology", which was lame and boring and NOT AT ALL NECRO. Since I'm all about the darkness, you can now find it under its new name, <a href="http://www.typomancy.org/" rel="nofollow">Typomancy</a>. I also gave it its own domain (it used to be stashed away as a mostly unpublicized subdirectory of my <a href="http://www.pushby.com/forrest/" rel="nofollow">personal homepage</a> (despite which Stephen and Dan and Luc Devroye, among others, managed to find it).</p>
    <p>Why have my own blog when there's already <a href="http://www.typographi.com/" rel="nofollow">Typographica</a>, <a href="http://www.typographer.org" rel="nofollow">Typographer</a>, and this fine blog? There isn't an ironclad reason, but part of it is that I'm still going to use <a href="http://www.typomancy.org/" rel="nofollow">Typomancy</a> as a place to stash my private notes to myself. Another, better reason is that I'm more interested in the lower-level aspects of type design, specifically dealing with font formats and the politics thereof. Also, it's fun to have a place to do my own experimentation with nameplates and site designs and the like.</p>
    <p>The three of you who bookmarked the old version of the blog will probably want to update your links; the old blog isn't being updated, even though it'll redirect you to the new one. Check it out, and thanks for reading!</p>
