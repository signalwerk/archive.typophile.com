    <p>Why have my own blog when there's already <a href="http://www.typographi.com/" rel="nofollow" class="link-external">Typographica</a>, <a href="http://www.typographer.org" rel="nofollow" class="link-external">Typographer</a>, and this fine blog? There isn't an ironclad reason, but part of it is that I'm still going to use <a href="http://www.typomancy.org/" rel="nofollow" class="link-external">Typomancy</a> as a place to stash my private notes to myself. Another, better reason is that I'm more interested in the lower-level aspects of type design, specifically dealing with font formats and the politics thereof. Also, it's fun to have a place to do my own experimentation with nameplates and site designs and the like.</p>
