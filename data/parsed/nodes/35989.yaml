    html: |-
      <p>Seconded, there is no BEST way.<br>
      But just converting by whatever default model and then adjusting is probably the worst advice one could give to you. Keep in mind that ANY process in the manipulation of an image will reduce the amount of information in it. </p>
      <p>The basic problem in RGB-&gt;CMYK conversion is that the first model uses Three (additive) colours, while the latter (subtractive) uses four. The first three colors, C, M, Y theoretically could be easily derived from the respective RGB-values. Now the problem is that the fourth color, black, has to be determined somewhat artificially, and that the way black is calculated will have massive consequences on C,M,Y. There's several basic models to determine the amount of black, like UCR (Under Color Removal), GCR (Grey Component Removal), good old Skeleton-Key, etc. All these work pretty differently, the set of plates will look very different, depending on the conversion method, and will give completely different results in print.</p>
