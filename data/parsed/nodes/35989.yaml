    html: |-
      <p>Don’t convert. And don’t use any profiles either.</p>
      <p>Your printer has to put your pdfs through the RIP anyway. The settings of his RIP software are set—or at least should be—to match the profile of his press, while each single press and every print job needs a different profile: rubbers, inks and paper type used, pressure, density, print speed, temperature and relative humidity of the press room, &amp;c. Al these different parameters affect dot gain and so they can‘t be predicted by your PhotoShop or other software, but ought to be adjusted, ideally, minutes before press run.</p>
      <p>If you convert your imagery from RGB to CMYK colour space yourself, valuable colour information will be lost, so that the final conversion in the RIP won’t have all the data to get the most optimal colour match.</p>
      <p>This procedure is being advised by engineers at Heidelberg Druckmaschinen AG. If your printer complaints you gave him a pdf in RGB colour space, either he is not knowing his craft, or he needs an update of his RIP preflyghting software. So, why are these profile conversion filters built into Adobe applications? Ask their marketeers.</p>
