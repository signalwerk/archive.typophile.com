      <p><em>This is the sort of information that makes me wish I could spend a year or so working at a printer.</em></p>
      <p>All printing companies are not created equal. Better yet, call the prepress department at the printer you intend to use and ask them what they want. If they give you the same answer that Ludwig did, follow the advice; if they don't concur with Ludwig, find out <strong>exactly</strong> what they prefer. If what the prepress person says makes sense, do it; if it all sounds like a bunch of mumbo-jumbo, they probably don't know what they're talking about, and you should give some serious consideration to finding another printer.</p>
