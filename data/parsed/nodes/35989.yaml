      <p>That's very interesting — I'd always been told it was best to minimize the amount of material the printer would have to RIP because their methods somehow produced lower-quality results than using Photoshop, et al. But that never made any sense to me, since it would seem that a printer would have everything to gain by possessing the best technology/know-how where the reproduction of digital images in print was concerned.</p>
      <p>This is the sort of information that makes me wish I could spend a year or so working at a printer.</p>
