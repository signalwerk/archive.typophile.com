      <p>Your options would be:</p>
      <p>1. Just fiddle around, proof, adjust, proof, adjust, evetually print. NOT recommended. You won't be happy nor confident in the long run, if the results are good, it's just good luck. You could have bad luck, too.</p>
      <p>2. Theoretically, you could try to integrate into a color workflow via profiles. That would make sense if you had control over your input devices and the RGB images to start with. Keep in mind that profiles aren't arcane magic, they just help how to reproduce a given color in a given color space in another color space. If your input image is bad, profiles won't make it any better, they can just help you to reproduce it most exactly as bad as was before.</p>
      <p>3. Educate yourself, calibrate your screen, talk to respectable and experienced printers, etc. Probably the best way, but time consuming.</p>
      <p>4. Find a printer and/or prepress company who will do it for you. Color conversion and prepress things in general are most of all a question of experience.</p>
