    html: |-
      <p>Hi,</p>
      <p>Word will only embed TTF fonts (OT or TT) not PostScript Type 1 or OpenType CFF. </p>
      <p>To check the embedding permissions of your fonts you can use... <a href="http://www.microsoft.com/typography/TrueTypeProperty21.mspx" title="http://www.microsoft.com/typography/TrueTypeProperty21.mspx">http://www.microsoft.com/typography/TrueTypeProperty21.mspx</a> </p>
      <p>Also check the font in Font Validator to make sure there are no serios errors as they may cause the font to be rejected by the embedding code.</p>
      <p>Cheers, Si</p>
