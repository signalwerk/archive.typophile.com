      <p>I can't say I carried out the most comprehensive programme, but I tested font embedding of my employer's new custom TT family and didn't find it reliable within Word, although it worked OK in Powerpoint. A bit of digging around on the web seemed to indicate a suspicious lack of detailed infomation, particularly on how the different levels of font embedding (print, editable, installable) work in practice. I'm not sure that it really works as described.</p>
      <p>Please correct me if I am wrong, though.</p>
