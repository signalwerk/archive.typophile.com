      <p>Is there a convincing need to embed them at all? I've never found one for Word.</p>
      <p>If they're for internal distribution as editable docs can't they just all have the fonts purchased and installed company wide? Or if for read-only distribution, use PDFs.</p>
      <p>Remember that font embedding will increase the size of documents and is not controllable on a font by font basis - you can easily end up with 1Mb 1 page docs if you embed a few large fonts.</p>
