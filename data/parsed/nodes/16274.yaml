    <p>Hello all. I hope that someone can help me solve an annoying problem I am having. (Especially Si Daniels. Hi Si.)</p>
    <p>We have a client who has fully licensed one of our fonts, and wishes to embed those fonts in internal Microsoft Word documents. This is allowed under the terms of our EULA.</p>
    <p>This client is having a hard time getting the fonts to embed in Microsoft Word 2002 and 2003, running on Windows XP. The software is probably localised for Norway.</p>
    <p>I have generated the fonts in CFF-flavoured and TT-flavoured OpenType, as well as "traditional" TrueType without any OT features. The embedding was, of course, turned on when generating.</p>
    <p>I have generated the fonts every way 'til Sunday, including using FontLab 45M, FontLab Studio 5W and 5MBeta, and have tried using TransType Pro 3M starting from every conceivable source: VFB, WinTTF, MacTTF, MacPST1, WinPST1...</p>
    <p>In other words, I have jumped through every hoop, to no avail.</p>
    <p>Is it possible that embedding in Word is a problem?<br>
    Is it possible that the client's font cache is now completely full of conflicting fonts?<br>
    Is it possible that FontLab and TransType are incorrectly saving embedding settings?</p>
    <p>Any help would be massively appreciated. Any off-list emails can be sent to chester (at) vllg.com.</p>
    <p>Thanks a bundle, phellow typophiles. (Can you believe that this is my first ever topic submission?)</p>
