    html: <p>In my opinion, your concern is well-founded, and the students who bought themselves the time to pay attention to refining the outlines of one case probably learned the most. I suggest you give future students the choice of an uppercase alphabet or a lowercase alphabet, plus an equal amount of other characters, and specifically tell them not to try to do both until after the review is over. Harmony between the two cases can be an unexpectedly advanced thing, a powerful distraction from understanding basic skills.</p>
