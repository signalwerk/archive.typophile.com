    html: <p>A single modular case with a little punctuation wast the first assignment given to them, in order to learn the ins and outs of Type Tool/Illustrator collaboration and the introductory principles of type design over 5 weeks. Most of what we're seeing here is their second font, a chance to take everything they learned the first time around and apply the new skills in a faster prototype without the software and process getting underfoot. Then the course ends. I'm not sure what's more important at this stage -- learning to refine characters of a single case better and being stuck with two single-case display-only alphabets at the end of the course or letting them give two cases a shot and learning just how amazingly different upper and lower case is. Its hard to say at this stage of development which path is <em>better.</em> Being a student-centered classroom I ultimately decided it was more important for the student to take a degree of ownership over the direction of their own learning. Students were given a choice the second time around, and each got a taste of what they wanted to learn, with the obvious outcome that there is so much more to learn regardless of the path they took. They are responsible for critiquing and helping each other refine their fonts every week some much of the learning of the struggles of what the other track is doing is served through observation and application. Often <em>what's best</em> in sequencing can only be judged by what's best for that particular student.</p>
