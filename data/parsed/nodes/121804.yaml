      <p>Kevin’s comment could be seen as a bit blunt, and perhaps not very articulate, but I don’t think is’s completely non-constructive: he points out that the alternates look arbitrary and directs to a place showcasing a good number of examples of the genre, including Paul Renner’s early studies for Futura. In short, an useful resource to making oneself familiar with current trends and their historical antecedents.<br>
      That said, given that</p>
      <blockquote><p>A problem or issue that this font would be able to fix would have to be legibility issues. It can easily replace any other font to make something important legible.</p></blockquote>
      <p>I would need to see something typeset in it to be able to give some meaningful feedback.</p>
