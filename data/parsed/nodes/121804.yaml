      <p>Hi cerulean, I'm the professor that you feared required a particular style in my intro to type design course. :-) Sorry to burst your bubble, but no. Each student's work reflects their own particular interests in selecting a typographical design problem to wrestle with.</p>
      <p>You might have noticed that about ten students have posted their projects this week. Thanks to all of you here at Typophile for your constructive feedback so far.</p>
      <p>Let me be clear: the objective was not to create a new paradigm of earth-shattering new font designs.  This is not a Masters level design course, it was an introduction to the entire font design process.</p>
      <p>The objectives of this assignment were to:<br>
      • Create a design brief that proposed a solution to a typographical design problem.<br>
      •&nbsp;Learn the fundamentals of font construction including re-learning type anatomy from a new perspective, that of a creator not a consumer.<br>
      • Examine and resolve issues of type color, letter pairings, metrics, ligatures and yes, the role of alternates or swashes and their placement in Type Tool<br>
      • Learn FontLab's Type Tool program, including file setup, organization, metrics, font generation and installation.<br>
      •&nbsp;Design of a type specimen sheet that highlights the font features in their best light and sample collateral pieces that show an appropriate application of the font which speaks to the target demographic.<br>
      • Solicitation of constructive criticism from a professional forum in order to improve aspects of their font.</p>
      <p>Looks like we've only half-succeeded on that last point in this thread on "Hydrogenic Sans" ;-) We got the criticism, but not much that was constructive. Personal distaste for and mockery of this style seems fairly irrelevant. </p>
      <p>We're all learning here, and you're right cerulean, this was a student exercise that met the criteria for understanding the font design process. Anyone have anything constructive to add?</p>
      <p>Thanks!</p>
