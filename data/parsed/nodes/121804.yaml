      <p>Students were given a choice of designing a full uppercase and full lowercase plus basic punctuation.<br>
      OR<br>
      Full uppercase and 10 numerals, plus 16 glyphs (ligatures, alternates, or additional punctuation) and the same basic punctuation set.</p>
      <p>There is a lot I'd do differently next time around, and eliminating this choice might be one of them. I enjoy offering choices in general but I feel those who stayed in a single case may have had an easier time than those who did both. I was concerned that cranking out both uppercase and lowercase in the 4 weeks allotted might not have been enough time to develop anything of high quality. The estimated time spent on task, including all of the steps illustrated above which included rounds of sketches not mentioned, was 40 hours. </p>
      <p>Results were mixed in both quality and complexity, but nobody failed. This is the first step in an important journey of understanding just how deep and wide the subject is. Some students will try it again with even more resolve, and some will just be grateful it is over :-)</p>
