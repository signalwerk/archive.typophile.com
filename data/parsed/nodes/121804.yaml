    <p>Hello my name is Jose Luis Ruvalcaba and I'm currently attending The Art Institute of Phoenix. I'm a senior and pursuing a degree in graphic design with a minor in typography. I'm currently enrolled in a font design class and I just completed my typeface! I would love your personal and professional opinion. Please let me know what you like and what would make this typeface better. </p>
    <p>Hydrogenic Sans<br>
    By: Jose Luis Ruvalcaba</p>
    <p>Hydrogenic Sans is geometric typeface based on fractions of a square. This font is really just meant to be legible at any size on any type of platform. This typeface was meant for body copy but along the process of creating this typeface the purpose of this font changed to be used for display, wether it’s used on a poster or on a billboard. A problem or issue that this font would be able to fix would have to be legibility issues. It can easily replace any other font to make something important legible.</p>
    <p>Something fun and special about this typeface are the alternate letters. These alternates can be used to make a headline stand out. It also allows the user to mix and match between the regular and alternate alphabet to create unique words and phrases.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hydrogenicsans_6218.jpg"></div><p></p>
