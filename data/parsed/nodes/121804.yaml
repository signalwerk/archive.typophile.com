      <p>Sorry if it was glib, but it was the only thing to remark on because I truly can't find any fault in the construction, execution, or presentation. As for my assumption, it was primed by having first seen <a href="http://www.typophile.com/node/121588" rel="nofollow">this classmate's entry</a>; I hope you can see why. I still feel you might ponder whether there is something about how you've set the task that steers students this way, perhaps by tacitly giving them the choice between doing twice the work (i.e. making a lowercase) and doing something like this.</p>
      <p>On a second look, I do have a few constructive observations. Many of the numerals seem lighter than the appropriate weight, and the question mark particularly so. My highest praise is for the design of the ampersand.</p>
