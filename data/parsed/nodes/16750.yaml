      <p>Alex</p>
      <p>Modifications to the mold to create kerning is done by altering the set-width of the mold at the casting machine. Letters that are normally cast flush to the sidebearings can be undercut on the right side to kern onto the shoulder of the following letter. This subtraction of width is at the discretion of the casterman and can be overdone. All characters have a set-width designation stamped on the matix. When followed these widths create proper fitting and in the case of letters like f (roman) a kern is automatically created. In italic matrix suites there are many letters that kern on the right side and make tight fitting in a line.</p>
      <p>Justification is the term given to the process of trimming the extra depth that results when a steel punch is over-depth into the matrix metal blank. Matrices are always over-driven since it is not really possible to strike the depth dead accurately. As a result the strike is made a couple of thousandths of an inch too deep and the face of the matrice is trimmed off to make the depth consistent over the entire suite of matrices. In b</p>
