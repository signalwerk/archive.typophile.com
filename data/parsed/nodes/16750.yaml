    <p>I’m interested in typography history and started by reading some books. But I’ve met several questions in my reading. Any help is welcomed.</p>
    <p>1)’In punchcutting, a modification to the mould allowed letters to be provided with kerns.’ What is that modification? Does anyone have details about that?</p>
    <p>2)Can anyone provide me with some information of “matrix justification”? Why and how?</p>
    <p>3)Does broadnib pen equal the quill pen?<br>
      What is a split-nib pen? Does it equal a quill pen with disposable metal nib?</p>
    <p>Thanks ahead.</p>
