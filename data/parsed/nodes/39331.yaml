  html: |-
    <p>I need to migrate my T1 fonts to OpenType format.<br>
    What is the best way of merge two T1 fonts in an unique OTF?</p>
    <p>Example:<br>
    Regular + Small Caps with old style number = OTF</p>
    <p>Thanks in advance,<br>
    Eduardo</p>
