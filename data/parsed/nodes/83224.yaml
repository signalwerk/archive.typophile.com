    <p></p><div class="imageWrap"><img src="http://typophile.com/files/letter2b_4583.gif"></div><p></p>
    <p>Letter.2 announces extension of early bird discount</p>
    <p>Buenos Aires (20 June, 2011) – The Letter.2  type design competition has announced that the deadline for its discounted submission rate will be extended by two weeks. Submission entry codes can be purchased at $15 (US Dollars) until Monday 4 July, 2011, whereas after this date the price of each entry will be $25 (US Dollars).</p>
    <p>The deadline extension is meant to address the reported problems related to the payment processing system that returned an error message when entered data contained special characters such as accented letters. To further solve the issue, Letter.2 created a special help page  to assist users, and has enabled an alternate payment option via Paypal  that is available on demand.</p>
    <p>Each submission entry is valid for a single font family, regardless of the amount of weights, styles or scripts within it. Additionally, entries can be purchased at a discounted rate even once the final submission is finalised after the discount cut-off date.</p>
    <p>About Letter.2</p>
    <p>Letter.2 is the second international competition of type design organized by the Association Typographique Internationale (ATypI). It aims to provide a wide-angled snapshot of the state of typeface design around the globe ten years after the 2001 competition, and to promote typographic excellence and best professional practices. It also intends to raise awareness about the role of typography at encouraging and maintaining cultural diversity.</p>
    <p>Letter.2 gives thanks to the collaboration of the Platinum sponsors FontLab, Typekit and Veer; the Gold sponsors Ascender Fonts, FontDeck, FontShop, Monotype Imaging, P22 Type Foundry, TypeTogether and Webink. Letter.2 is organised by the Association Typographique Internationale (ATypI).</p>
    <p>Find out more about Letter.2 at <a href="http://www.letter2.org" title="www.letter2.org">www.letter2.org</a></p>
    <p>Please spread the word!<br>
    Thank you<br>
    Veronika Burian</p>
