      <div class="comment-spam-body"><p>Today's trivia: the story plot is a woman accidentally artificially inseminated by her doctor during an examination.  It is a loose adaptation of a  Venezuelan telenovela.  The title for the  telenovela shows that the swash _G_ is derived from the graphic of an egg on top and a sperm below </p><div class="imageWrap"><img src="http://typophile.com/files/Juana_5819.jpg"></div><br>
      Don<p></p>
      </div>
