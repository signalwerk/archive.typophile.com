    html: |-
      <p>Agree with Don, custom lettering. 2 options for me:<br>
      - Don's approach: mash-up fonts, a basic sans and a script; for instance, the sans could be  <a class="freelinking external" href="http://www.dafont.com/buttacup.font" rel="nofollow">Buttacup</a> and the script <a class="freelinking external" href="http://www.myfonts.com/search/elan" rel="nofollow">Elan</a> (Don's suggestion), <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/lightnin" rel="nofollow">Lightnin</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/fontella" rel="nofollow">Fontella</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/gillies-gothic" rel="nofollow">Gillies Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/kaufmann" rel="nofollow">Kaufmann</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/penmanshift" rel="nofollow">Penmanshift</a> (nice this one), <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/coquette" rel="nofollow">Coquette</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ef/futura-script" rel="nofollow">Futura Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/ht-maison" rel="nofollow">Maison</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/varga" rel="nofollow">Varga</a> (nice too), <a class="freelinking external" href="http://www.dafont.com/airstream.font" rel="nofollow">Airstream</a><br>
      - choose an appropriate sans (<a class="freelinking external" href="http://www.dafont.com/buttacup.font" rel="nofollow">Buttacup</a>) and customize letters.<br>
      I like and even if it's different (flare serif) <a class="freelinking external" href="http://youngjerks.com/#/highway-typeface" rel="nofollow">Highway</a> by Dan Cassaro.<br>
      Some ready-to-go options: <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/selaive" rel="nofollow">Selaive</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/latinotype/merced" rel="nofollow">Merced</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/brownstone-sans" rel="nofollow">Brownstone Sans</a>, <a href="/wiki/https%3A/%252Fwww.behance.net/gallery/6367355/Myra-Caps-%28Typeface%29" class="freelinking" rel="nofollow">Myra Caps</a>, <a href="/wiki/https%3A/%252Fwww.behance.net/gallery/2721389/Kylie-%28Typeface%29" class="freelinking" rel="nofollow">Kylie</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/font-fabric/solomon" rel="nofollow">Solomon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/yellow-design/gist" rel="nofollow">Gist</a> (slab and inline... ouch... but same vein), <a class="freelinking external" href="http://www.myfonts.com/fonts/justanotherfoundry/peacock" rel="nofollow">Peacock</a><br>
      Maybe a dead-end but you could have a look to <a class="freelinking external" href="http://www.myfonts.com/fonts/font-fabric/nexa-rust" rel="nofollow">Nexa Rust</a> and try to mix Nexa Sans with its Script... Not sure it works though...</p>
