      <p>I hope you don't mind a few more thoughts.<br>
      First i think it is deffinately a step forward.<br>
      Is there a reason you have now gone for an inverted crusifix? Is it specifically a satanic vibe you want from it?<br>
      Though i really like the idea of the visual it is starting to look a little raggedy round the edges - have you tried mocking it up and photographing it yourself?<br>
      The overall much layout is better but i am not a fan of the comic book speach bubble - maybe try and intergrate the description into the rest of the layout.<br>
      You might also want to tweak the 'faith &amp; formulas' a bit more, they seem more seperate then in contrast.</p>
      <p>Good luck.</p>
      <p>Will</p>
