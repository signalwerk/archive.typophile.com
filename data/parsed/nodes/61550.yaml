      <p>You may find that a few fairly hardcore christians would take some offence from the distortian of crusifix but i don't think that should stop you putting it into your portfolio.</p>
      <p>On a purely aesthetic point, which may come way to late in your design process, have you tried loosing the dolll and the speckly background. It is a good visual concept that seems to loose impact through having so many visual elements.</p>
      <p>Type wise i would agree with crossbones abut formulas needing a new typeface. Have you tried having the faith/formular contrast being a serif/sans-serif contrast?</p>
      <p>Also your hierachy seems a little off; 'no cover' stands out way more than 'art show' and the time stands out more than the date, both of which seem the wrong way round to me.</p>
      <p>Hope some of this is useful.<br>
      Will</p>
