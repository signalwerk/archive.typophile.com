    html: |-
      <p>For what it's worth, the graphic doesn't say to me "art inspired by science and religion" so much as "art inspired by science and contempt for religion".  It's very sacrilegious.  I guess if that captures the essence of the show, then it's doing its job.</p>
      <p>I'm not crazy about the way "Formulas" is set in the second version.  In science and math publications, formulas are generally set in an italic serif; you might see if, say, Palatino Italic or Minion Pro Italic calls to mind the feel of a science text.</p>
      <p>I like the speech bubble.  Can't say that I like the graphic, but aside from the subject matter, I think the heavy black line around it in the second version is distracting.  Maybe you could make it thinner and/or lighter.</p>
