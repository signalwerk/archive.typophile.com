    <p>This art show is called "Faith and Formulas" which is supposed to suggest 'religion and science'. I chose a font that i thought looked faith-like and one that looked science-like. What do you guys think?</p><div class="imageWrap"><img src="http://typophile.com/files/faith_4831.jpg"></div><p></p>
    <p>Also, do you guys think something like this is too creepy to put in a portfolio. I was thinking employers might think its too scary. Should I try to create things that would fit the 'norm' ? Thanks.</p>
