      <p>Be careful. Most East Asian sans serif typefaces are most definitely <em>not</em> geometric. </p>
      <p>For Korean:</p>
      <p><a href="http://윤체 (Yoon-che)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://윤체 (Yoon-che)</a><br><a href="http://아트체 (Art-che)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://아트체 (Art-che)</a><br><a href="http://율려 (Yullyeo)" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://율려 (Yullyeo)</a></p>
      <p>The last of these is definitely a display face, but for a magazine masthead it should work really well.</p>
      <p>And last but not least, the classic geometric Korean face is <a href="http://안상수체" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://안상수체</a>, (Ahn Sang-Soo, 1985), the eponymous design by Ahn Sang-Soo. This is also definitely a display face.</p>
