    <p>Hi,<br>
    I'm in the process of creating a masthead for a fictional magazine, and I'm using futura extra bold – All caps.<br>
    I'm translating the title in other languages, and I want to try to make a japanese and/or korean version.<br>
    The problem is that japanese kanji/katakana/hiragana are really bound to calligraphy: is it possible, in your opinion, to create a "geometric" version of them (example: ん) and maintain legibility and recognizability?</p>
    <p>Thank you in advance,<br>
    AM</p>
