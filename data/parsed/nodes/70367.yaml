      <p>Be careful. Most East Asian sans serif typefaces are most definitely <em>not</em> geometric. </p>
      <p>For Korean:</p>
      <p><a class="freelinking external" href="http://yoonfont.co.kr/shop/font_han_view.asp?itemidx=1702" rel="nofollow">윤체 (Yoon-che)</a><br>
      <a class="freelinking external" href="http://www.sandoll.co.kr/SandollWeb/shop/product_down_read.asp?idx=728&amp;category=211" rel="nofollow">아트체 (Art-che)</a><br>
      <a class="freelinking external" href="http://yoonfont.co.kr/shop/font_han_view.asp?itemidx=1699" rel="nofollow">율려 (Yullyeo)</a></p>
      <p>The last of these is definitely a display face, but for a magazine masthead it should work really well.</p>
      <p>And last but not least, the classic geometric Korean face is <a class="freelinking external" href="http://www.hanyang.co.kr/font_pds/php/view.php?idx=35" rel="nofollow">안상수체</a>, (Ahn Sang-Soo, 1985), the eponymous design by Ahn Sang-Soo. This is also definitely a display face.</p>
