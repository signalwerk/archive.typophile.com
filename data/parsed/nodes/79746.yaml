    html: "<p>Help a ’merican understand: why a 'ch' ligature in \"Schrift\" and \"zeichnen\" but not \"Schönheit\"? And why a 'ch' lig at all?</p>"
  - id: 472130
    user_id: 2021
    user_name: Nick Shinn
    user_path: null
    user_image: /files/pictures/picture-2021.jpg
    date_raw: 26 Jul 2011 — 10:15pm
    date: 2011-07-26T22:15:00
    votes: null
    html: |-
      <p>Schönheit and Charakter are letterspaced = bold.<br>
      Presumably Saskia has no Bold, in the manner of old fraktur, where this convention for emphasis originated.<br>
      Allegro makes a good bold for this:<br>
      <a href="http://www.identifont.com/show?21W" title="http://www.identifont.com/show?21W">http://www.identifont.com/show?21W</a></p>
      <p>c is only ever followed by h or k in German, so making these ligatures was an efficiency.</p>
