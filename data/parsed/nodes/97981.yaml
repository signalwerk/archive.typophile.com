    html: |-
      <p>@oldnick you were right. I don't why why it didn't happen the first time. But today I incrementally  copied the font info of my current font to a dummy font and then I started generating font(from the dummy font) after copying each page from my original font font. Guess what? Turing off mathematical operators check box cured the issue.<br>
      Thanks<br>
      Typogruffer</p>
