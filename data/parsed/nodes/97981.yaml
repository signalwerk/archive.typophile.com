    <p>I am sure this is a very small issue but I have no clue how to solve this. When I generate an OTF file, the icon of the generated font shows the Sigma, Square root and not equal to symbols ( I did not even design these symbols yet!) on the icon instead of standard A, b and g.<br>
    PFA image to understand what I am saying</p>
    <p>Thanks<br>
    CG</p>
