    html: |-
      <p>I am getting closer to solving this for sure. At the moment I have a short list of likely culprits. Removing  “Mathematical Operators” is not on the list because I have a font that has that and it shows letters in the Windows icon.</p>
      <p>I have</p>
      <p>Basic Latin<br>
      Latin 1 Supplement<br>
      Latin Extended A<br>
      Latin Extended B<br>
      Spacing modifier Letters<br>
      Greek<br>
      Latin Extended additional<br>
      General Punctuation<br>
      Currency Symbols<br>
      Letterlike symbols<br>
      Mathematical Operators<br>
      Private Use<br>
      Alphabetic Presentation forms<br>
      Geometric Shapes</p>
      <p>Perhaps you can A/B test enough of these to get an answer faster than I can just now. I don't think all these are equally likely ( Greek? ...probably not ) but I can not say with authority which one makes the difference only that the key check box is probably in this set. That is assuming of course that there is only one! You might need more than one.</p>
