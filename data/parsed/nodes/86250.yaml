    <p>Hi,</p>
    <p>For a project I've been studying all the tabloid magazines and newspapers (US Weekly, People magazine, In Touch, National Enquirer etc.) and it seems like the magazines that are the most tabloid (hard gossip, politics etc.) are using something along the lines of <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/helvetica-inserat/" rel="nofollow">Helvetica Inserat</a>. </p>
    <p>see: <a href="http://cache.gawker.com/assets/images/gawker/2008/09/nationalenquirersarahpalinstorycoverawardsmarkpasetskydavidperel.jpg" title="http://cache.gawker.com/assets/images/gawker/2008/09/nationalenquirersarahpalinstorycoverawardsmarkpasetskydavidperel.jpg">http://cache.gawker.com/assets/images/gawker/2008/09/nationalenquirersar...</a></p>
    <p>At the same time all the more fashion and celebrity-minded magazines are using the pointy fonts like <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100009" rel="nofollow">Verlag</a>, <a class="freelinking external" href="http://www.houseind.com/fonts/neutraface2" rel="nofollow">Neutraface</a> or <a class="freelinking external" href="http://www.fontbureau.com/fonts/Relay" rel="nofollow">Relay</a>. Sometimes Futura condensed as well. </p>
    <p>See <a href="http://www.google.com/search?q=gossip+magazines&amp;client=safari&amp;rls=en&amp;oe=UTF-8&amp;um=1&amp;hl=da&amp;tbm=isch&amp;source=og&amp;sa=N&amp;tab=wi&amp;oq=gossip+magazines&amp;aq=f&amp;aqi=&amp;aql=&amp;gs_sm=e&amp;gs_upl=5682l5682l0l5878l1l1l0l0l0l0l0l0ll0l0" title="http://www.google.com/search?q=gossip+magazines&amp;client=safari&amp;rls=en&amp;oe=UTF-8&amp;um=1&amp;hl=da&amp;tbm=isch&amp;source=og&amp;sa=N&amp;tab=wi&amp;oq=gossip+magazines&amp;aq=f&amp;aqi=&amp;aql=&amp;gs_sm=e&amp;gs_upl=5682l5682l0l5878l1l1l0l0l0l0l0l0ll0l0">http://www.google.com/search?q=gossip+magazines&amp;client=safari&amp;rls=en&amp;oe=...</a></p>
    <p>Can someone think of fonts that are in between these? Or something that can be both when used in different weights or in condensed etc. Masculine enough to convey the 'big shocking sensation YOU HAVE TO READ' but a bit more feminine and fashion-minded (like Verlag etc). It needs to have some condensed cuts as well and it would be nice with something that isn't as overused as the above mentioned (verlag etc.) and with a larger x-height.</p>
    <p>Thank in advance.</p>
