      <p>Hey again. Thanks for some more good suggestions. </p>
      <p>I really like Brandon Grotesque, but I'm not sure it would cut if for the very condensed style in most tabloids. Rather than Trade Gothic I've experimented a bit with Benton Sans (it also has both condensed and extra condensed/compressed), but I feel like it's been used a bit too much. The same thing goes for Gotham although the condensed and narrow ultra weight works great.  Amplitude has a great range of styles, but too me it seems a bit dated, since it was used so much around 5 years ago.</p>
      <p>Has anyone seen <a href="http://new.myfonts.com/fonts/dstype/prelo-condensed" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Prelo condensed</a> in good use? Although it might be too masculine for the fashion/red carpet stories.</p>
