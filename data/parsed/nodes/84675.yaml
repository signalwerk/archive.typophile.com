    <p>(Hopefully I've posted this in the right section...)</p>
    <p>I'm putting together a website, and I thought I'd give using the @font-face feature a whirl, to allow me to embed some non-standard typefaces. My initial efforts to get this working are using ITC American Typewriter, font-squirrelled for a cross-compatible webkit, and embedded in my website, as instructed, thus:</p>
    <p>@font-face {<br>
      font-family: 'AmericanTypewriterBold';<br>
      src: url('fonts/americantypewriterstd-bold-webfont.eot');<br>
      src: url('fonts/americantypewriterstd-bold-webfont.eot?iefix') format('eot'),<br>
           	 url('fonts/americantypewriterstd-bold-webfont.woff') format('woff'),<br>
             url('fonts/americantypewriterstd-bold-webfont.ttf') format('truetype'),<br>
             url('fonts/americantypewriterstd-bold-webfont.svg#webfont') format('svg');<br>
        font-weight: bold;<br>
        font-style: normal;<br>
    }</p>
    <p>I works. But. It looks pretty shitty. I've also tried using it on a different face (clarendon, which I don't think is licensed to be used with @font-face, but I'm just at the point of playing rather than finalising anything at the moment...), which looks a bit better, but American Typewriter looks especially bad/different to how it should... Apart from being a bit unclean, it renders heavier and tracks closer together than it should. Oddly though it renders really nicely on my iphone, in spite of looking rubbish in chrome/safari on my macbook.</p>
    <p>Any suggestions and/or advice on the subject? Many thanks!</p>
