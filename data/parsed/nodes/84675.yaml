    html: |-
      <p>Different combinations of browsers and OS and font settings (font format, font smoothing settings and hinting information) produce very different results. </p>
      <p>In short:</p>
      <p>For body copy to look good (sharp, readable) across browsers you need a well hinted (see end of paragraph) font with truetype curves. The worst environment is typically Win XP with default settings and non-IE browsers: extremely few fonts hold up here. Most web font services serve truetype curves, but the hinting quality (code helping to interpret curves as pixels on screen) varies wildly. In this case the good ones are far between because hinting is such a time consuming task.</p>
      <p>For headlines to look good (smooth) across browsers, you need a web font with postscript curves and in some cases good postscript hinting. These are not commonly available yet, but Typekit has begun serving them for at least some fonts. Again, Windows is a causing trouble and doesn't support the use of postscript curves until IE9, so you'll need a font with truetype curves (.eot)  as a backup, and it will look jagged! This backup should also have some light y-direction hinting (too specific for you, but this is for example the level of hinting typically served by Fontshop).</p>
