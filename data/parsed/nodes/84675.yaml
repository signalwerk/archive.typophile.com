      <p>Thanks! I think I just about understand most of that...</p>
      <p>So in short:</p>
      <p>* Webfonts are still a bit hit and miss whatever your approach, due to different browsers/operating systems/combinations of both...</p>
      <p>* At this point in time there is no completely failsafe method of getting your font to appear perfectly on all systems..?</p>
