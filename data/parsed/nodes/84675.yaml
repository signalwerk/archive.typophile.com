    html: |-
      <p>Correct. With a little work you can get decent headlines in most cases. With a lot of work you can get decent text in most cases, but what constitutes decent text is not the same in all environments. And if "most cases" is acceptable to you is another discussion altogether.</p>
      <p>For now this work needs to be done by the type designer. In the future, we'll most likely have better rendering engines that take care of the problem.</p>
      <p>There are some good webfonts out there, you just have to look for them!</p>
