    <p>Hi again, </p>
    <p>I'm on a (rather quick) quest for a quirky/organic humanist sans serif in a heavy weight. The word I'm setting is "Coffey," so bonus points for a nice <em>ff</em> ligature. </p>
    <p>On my list:<br>
    <a class="freelinking external" href="http://www.ascenderfonts.com/font/corbel-family.aspx" rel="nofollow">Corbel</a><br>
    <a class="freelinking external" href="http://www.ascenderfonts.com/store/search.aspx?q=candara" rel="nofollow">Candara</a><br>
    <a class="freelinking external" href="http://www.ascenderfonts.com/font/mayberry-pro-extrabold.aspx" rel="nofollow">Mayberry</a><br>
    <a class="freelinking external" href="http://www.type-together.com/Bree" rel="nofollow">Bree</a><br>
    <a class="freelinking external" href="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html" rel="nofollow">Hypatia Sans (if I can figure out where to buy it)</a><br>
    <a class="freelinking external" href="http://new.myfonts.com/fonts/andreas-stotzner/lapidaria/" rel="nofollow">Lapidaria Sans</a><br>
    <a class="freelinking external" href="http://typography.com/fonts/font_overview.php?productLineID=100026" rel="nofollow">Whitney</a><br>
    <a class="freelinking external" href="http://www.fonts.com/FindFonts/detail.htm?pid=433477" rel="nofollow">Beorcana</a><br>
    <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_advert/" rel="nofollow">FF Advert</a><br>
    <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_scala_sans_ot/" rel="nofollow">FF Scala</a></p>
    <p>Of all these, Candara is closest to what I'm looking for, but doesn't have a heavy enough weight. Beorcana would be the other, but it might be too "quirky" for this particular job.</p>
    <p>Help! :)</p>
