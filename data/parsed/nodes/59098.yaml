    html: |-
      <p>Swung dash or something like it. It shouldn't be raised like the tilde character U+02DC, and needs to be large enough to stand out in technical text, but may or may not be as wide as the swung dash ⁓.</p>
      <p>The character is used in programming languages, in which usage it is best if it aligns vertically with =.</p>
      <p>I can't think of a use for this character in which it would be desirable for the glyph to be raised to the height of a diacritic mark.</p>
