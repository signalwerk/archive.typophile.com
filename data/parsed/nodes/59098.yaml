    html: <p>It's also used as a kind of emdash in early, two-CD releases in Japan. For example, the two-CD set of Bruce Springsteen's <em>The River</em> has a separate catalog number for each disc -- 50DP 355 and 50DP 356 -- and on the package spine the catalog number is shown as "50DP 355~6".</p>
