    html: |-
      <p>From the MS <a href="http://www.microsoft.com/typography/developers/fdsspec/maths.aspx">character design standards</a>:</p>
      <p><em>    * ASCII tilde<br>
            Unicode: U+007E</em></p>
      <p>      Design : This character is used in mathematics as an operator for 'is proportional or similar to'. This character is also commonly used in text as a sign of approximation. The double tilde U+2248 is the correct mathematical operator for ' is approximately equal to'.</p>
      <p>          Example of common usage : One inch is ~72 point in traditonal typography.</p>
      <p>      This is not the same design and character as the lowercase spacing tilde diacritic.</p>
      <p>      Alignment : Vertically centers on the plus sign.</p>
      <p>      Advance width : Advance width should be the same as the figure space width.</p>
      <p>      Spacing : This character should space between figure zeros. </p>
