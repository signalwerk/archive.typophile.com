  html: <p>I’m confused about what should actually go in the asciitilde glyph. Bringhurst claims it should be a swung dash, and some type designers seem to have done this, but in most fonts the asciitilde is either the tilde diacritical mark, sometimes modified to be a little taller and wider. Do people using it for mathematical similarity expect to see a swung dash there? Are people actually using it as a diacritical? Do end users really care at all?</p>
