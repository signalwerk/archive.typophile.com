    html: |-
      <p>ITC Mona Lisa is a digitization of Albert Auspurg’s 1930 design for Ludwig &amp; Mayer. Jaspert's Type Encyclopaedia [1970] comments that the "modern face design is not unlike the same founders' Firmin Didot."<br>
      Note that the Auspurg’s font was an open face. Pat Hickson created Mona Lisa Solid by filling in the open areas.<br>
      Don</p>
