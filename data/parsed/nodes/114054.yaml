      <p>The font was used in Steven Spielberg's movie "Artificial Intelligence" in for a poem with a message for the "boy."<br>
      <a href="https://www.youtube.com/watch?v=YUUs7ezHmfk" title="https://www.youtube.com/watch?v=YUUs7ezHmfk">https://www.youtube.com/watch?v=YUUs7ezHmfk</a><br>
      Here is a still<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ITCMonaLisaInUse2_3726.jpg"></div><br>
      Thanks to James Michaels for finding this info. See <a href="http://typophile.com/node/112979" title="http://typophile.com/node/112979">http://typophile.com/node/112979</a><br>
      My comment at the time was "The hard edges and formal structure of this Art Deco serif design -- tall, thin and very regular -- suggest a futuristic cold spirituality rather than joy or human warmth. A good fit for this rather depressing movie."<br>
      I wonder if it looks warmer and more optimistic in the National Week of Prayer image? I have my doubts.<br>
      Don<p></p>
