      <p>Hi Joshua,</p>
      <p>‘Moutard’ looks like <a href="http://new.myfonts.com/fonts/aboutype/revenue/?testdrive=dock%3Dfalse%26size%3D87%26w%3D720%26src%3Dcustom%26text%3DMOUTARD%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D24" rel="nofollow">Revenue</a>; maybe a bit stretched.<br>
      For ‘Champagne’, <a href="http://www.fontshop.com/fonts/downloads/bitstream/engravers_roman_bold/?&amp;sample_text=CHAMPAGNE&amp;sample_size=60" rel="nofollow">Engravers Roman</a> is very similar, though no cigar.<br>
      The script is an Anglaise, and might be custom – note the swashes. For alternatives, see <a href="http://new.myfonts.com/fonts/parachute/pf-champion-script-pro/?testdrive=dock%3Dfalse%26size%3D87%26w%3D600%26src%3Dcustom%26text%3DP%25C3%25A8re%2520%2526%2520Fils%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D40" rel="nofollow">Champion Script</a> or <a href="http://new.myfonts.com/fonts/adobe/bickham-script-mm/?testdrive=dock%3Dfalse%26size%3D87%26w%3D600%26src%3Dcustom%26text%3DP%25C3%25A8re%2520%2526%2520Fils%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D31" rel="nofollow">Bickham Script</a>; they both have tons of alternate glyphs and swashes to play around with. <a href="http://www.fontbureau.com/fonts/script/Novia" rel="nofollow">Novia</a> is another fine copperplate script. Even more options in this list of <a href="http://www.fontshop.com/fontlist/genres/copperplate_scripts/?&amp;sample_text=P%C3%A8re%20%26%20Fils&amp;sample_size=96" rel="nofollow">Formal Calligraphic Scripts</a>.</p>
      <p>F</p>
