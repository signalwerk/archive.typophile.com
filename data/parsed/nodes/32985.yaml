      <p><cite>the only thing missing is an option in the Character panel to view glyphs which are missing Unicode points (for example, Fedra Serif B Pro doesn’t have it’s small caps mapped, which means you can’t see them in MainType at the moment); this is, of course, a weakness in such a font itself</cite></p>
      <p>Hello Jason, actually Fedra follows Adobe's glyph naming recommendations. No weakness in the font. Small caps are alternate glyph forms which should not have their own Unicode points; those that Adobe assigned in earlier OTFs are 'private use'.<br>
      The way in which layout or font management software addresses these glyphs (via OT feature or via glyph palette) is a different story.</p>
