      <p>Well, I've been experimenting with MainType, and I like it quite a bit. The interface is similar to FontExpert's, but it's less cluttered and more intuitive. A few features that are not working or missing:</p>
      <p>1. In the font properties pane, the kerning pairs line does not seem to work, at least for OTF's of a postscript persuasion. For Cambria, I get 14,000 kerning pairs. For Adobe Jenson I get none.</p>
      <p>2. I wish the sample window had a button that would apply kerning (much like FontExpert does).</p>
      <p>3. The scroll wheel on my mouse doesn't work inside the various panes.</p>
      <p>Other than that, it's terrific. I'm certainly going to dump Suitcase now.</p>
