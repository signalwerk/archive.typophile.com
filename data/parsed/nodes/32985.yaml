      <p>Karsten, you know more about this sort of thing than I do, but by weakness I simply meant in relation to MainType; that is, Fedra Serif B Pro does not have Unicode points assigned to its small caps (or many of its ornaments, superior/inferiors, ligs, alternates, etc.), and thus such glyphs don't show up in a Unicode-only display such as the one built into MainType. Fedra is a wonderful font and I've corresponded with Peter as he was building the OT Pro version, but in this particular situation MainType isn't displaying all of the glyphs because many of them don't have Unicode tags. Thus, you're right, the issue here is simply to do with how font management applications pick and choose what to preview, not with any weakness in the font <em>as a font</em>.</p>
      <p>Carl, I've seen it, heard the horror stories, and am boycotting the thing after far too long a wait. Linotype dropped the ball on this, in my opinion, so free or not I'd rather support those who seem to care about Windows users.</p>
