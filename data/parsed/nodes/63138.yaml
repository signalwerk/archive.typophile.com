    <p>I'm redesigning <em>film comment</em> magazine for a school project. I'm working on the logotype right now, currently they are using the didot <em>fi</em> ligature in their masthead. I was curious of the diffrent <em>fi</em> ligatures out there, what are your favorites? Also whats the scoop on san serif ligatures?</p>
