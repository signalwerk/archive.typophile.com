    html: |-
      <p>Tula, Welcome as a new member.</p>
      <p>When you want us to match something you can make it much easier if you show us what you are trying to match. Please capture images to show, or include the actual links. The more work you expect us to do just to find your font samples, the less help you may actually get, because we get a lot of requests that don't require extra work first.</p>
      <p>The next point I want to make is that you often will not find fonts, especially free ones (in case that's what you wanted for the charity site) when you are trying to duplicate someone's branded look. The Guardian has had type designed for them, and if it's available, it sure will not be free. Not sure about what Flickr and Snapfish use, but often commercial sites use custom fonts to maintain a unique look. They are not happy when other sites try to imitate their style, as a general rule.</p>
      <p>- Mike Yanega</p>
