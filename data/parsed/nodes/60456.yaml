      <p>This is like saying you want to fly a plane, but a pilot is not in the budget. </p>
      <p>Either this project needs good design or it doesn't. </p>
      <p>If it doesn't need good design... just go to DaFont and grab anything and don't worry about how it looks. </p>
      <p>If design is important... hire a designer. It really is that simple. As with Mike and Barkeep, I'm only trying to give helpful, professional design advice. Either you got it, or you don't. You can't learn this stuff in a few weeks.</p>
      <p>Also, there are some nice, close matches to the Guardian Egyptian font. But I will be honest and say that I wouldn't divulge to someone who would use them as fuel in a fiery plane crash.</p>
