    <p>Are there any foundries/services who's fonts seem to render best across all platforms (Windows/Linux/Mac/Mobile)? Who puts extra care into their webfonts?</p>
    <p>I realise this is subjective, and there are browser samples available on most services. However, I am after real world / behind the scenes insight if possible. </p>
    <p>Thanks in advance.</p>
