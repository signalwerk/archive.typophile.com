    html: <p>That's a tall order. "All platforms" also includes all applications, rendering engines, color selection, and video driving software within those platforms, all technologies used for display devices, and even completely uncontrollable factors such as ambient lighting.  I think that the quest for the holy grail would be simpler!</p>
