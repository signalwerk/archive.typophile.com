    user_name: HVB
    user_path: null
    date_raw: 9 Jun 2012 — 1:42pm
    date: 2012-06-09T13:42:00
    votes: null
    html: |-
      <p>AFAIK, "Webfonts"  are standard fonts that have been made accessible/usable by web pages without users' ability to store/save/copy/pirate them. Some have been converted to other formats (e.g., EOT) to achieve that purpose.  General use is still in its infancy. </p>
      <p><a href="http://webfonts.myfonts.com/webfonts-know-how/what-are-webfonts-0" title="http://webfonts.myfonts.com/webfonts-know-how/what-are-webfonts-0">http://webfonts.myfonts.com/webfonts-know-how/what-are-webfonts-0</a></p>
      <p>Your response doesn't affect my comments; browsers are just a subset of "applications". And where is the line (if there is a line) between 'webfonts' and e-reader fonts? If there is one, it won't last very long.</p>
