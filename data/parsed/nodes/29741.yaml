  html: "<p>Is there a point in designing \"slanted\" versions of the punctuation marks and other supportive symbols (eg. ! ? , . / ; : ' \" \\ | {} [] () * % &lt;&gt; + - = @) in the italics of a typeface, or is it just a matter of consistency? Do you think that the italics of a typeface could work with \"upright\" designs of those characters?</p>"
