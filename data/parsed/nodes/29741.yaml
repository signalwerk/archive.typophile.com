      <p>Adam, I'm not surprised, but I do find it hard to keep up with all the characters and glyphs that are necessary in a font. I have a couple of faces under development for several years, and every time I get close to finishing them, I discover that I need to introduce more OT feature sets and more glyphs. Both slanted AND upright punctuation in an italic, as stylistic sets? Is this something your book designer friends have been crying out for?!</p>
      <p>It's a little precious to complain that most text faces suck, when book work is only one genre of text work, and most text faces have not been designed for it. News text faces certainly aren't pretty, and they're inappropriate for book work, but that doesn't mean they suck.</p>
      <p><em>Adobe “Pro” fonts are O.K. in this regard but far from being perfect.</em></p>
      <p>What is the Twardoch Standard? What would you add to Minion Pro, for instance?<br>
      How about Microsoft's CS fonts?</p>
