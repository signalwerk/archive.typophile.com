      <p>Nick, </p>
      <p>you may be surprised, but I actually talk to people like book designers and find out what they mean. I have a few fellow book designers who continuously are telling me that the vast majority of body faces that are on the market suck. They may have "pretty faces" but they're either spaced inconsequently or they don't contain the glyphs they should. Swashes and ligatures are bells and whistles that a good book designer does not necessarily *need*. But he would surely need an ample amount of punctuation marks, superscript and subscript letters and figures. Perhaps also small caps (even two sizes of them). Adobe "Pro" fonts are O.K. in this regard but far from being perfect. </p>
      <p>There are people who may have the goal of producing the largest number of typefaces possible, there may be others who only want to create a few, but good ones. </p>
      <p>A.</p>
