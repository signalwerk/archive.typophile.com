      <p>Kristian, </p>
      <p>actually, I recommend including both slanted and upright punctuation in an italic font (the upright being stylistic set 1, for example). Depending on the context and the language you're setting, people may want to set punctuation italic or upright. In some countries the typographic practice is that if you insert an italic quotation into parantheses in a upright text, the parantheses will be upright. However, if you use the upright parantheses from the upright font, you'll end up with spacing problems that need to be corrected manually. Therefore, it would be quite useful to have the upright fonts in the italic font, of course properly spaced to go well with the italic letters. </p>
      <p>A.</p>
    html_clean: |-
