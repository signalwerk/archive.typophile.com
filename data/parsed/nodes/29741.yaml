      <p>I think it depends on the face.<br>
      It is certainly more appropriate to have slanted marks in a sans serif, especially when the italic is very much a slanted version of the roman.<br>
      In serifed faces where the italic serifs are prominent, some upright marks such as the parentheses, look much better straight than slanted. The reason is that the serifs "fill out the square". See below.<br>
      Rather than accept the editor's view, via Chicago or whatever authority, this is more a decision for the typographer.<br>
      In italics, the degree of slant varies within most faces. The round letters in Helvetica, for instance, have less slant than the straight ones. And in many old style italics, some of the punctuation has very little slant at all. See the Caslon commas:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/slantmarks_4742.png"></div><p></p>
