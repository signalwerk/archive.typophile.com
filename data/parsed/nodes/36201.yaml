    html: <p>Almost certainly custom, so no font will match exactly. It’s a typical newspaper nameplate textura (I’ve been looking at a ton lately for a project). You could try <a class="freelinking-external" href="http://www.myfonts.com/fonts/lanston/ltc-goudy-text/">LTC Goudy Text</a> or <a class="freelinking-external" href="http://www.myfonts.com/fonts/bitstream/wedding-text/">Wedding Text</a> to come close, but the only way to have an exact replica is to do it yourself (or get the actual EPS from someone at the Inquirer).</p>
