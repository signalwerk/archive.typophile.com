    <p>Hello guys. So few friends and I are thinking of starting a monthly journal about jobs for university students. What we will have in it are job vacancies listings. We will print it in our university on an A3 paper and fold it, so it will be like a newspaper but for jobs for university students. We have some idea of what type of fonts we'd like to use, however we also would like to hear your opinions and suggestions as well. Our audience will be university students, age group 18-22 looking for a job. THANK YOU SO MUCH GUYS!!!!!!!!!! </p>
    <p>Also do you know of other similar magazines or newspapers that we could look at?</p>
    <p>love,<br>
    Claire and friends</p>
