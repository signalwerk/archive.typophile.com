      <p>Assuming no kerning:</p>
      <p>Statistically, the vast majority of letter combinations involving dcaron, lcaron and tcaron are better served by a negative right sidebearing, while allowing occasional failure.</p>
      <p>Also bear in mind words that end with dcaron, lcaron and tcaron, being followed by a space or (baseline) punctuation mark. Again, negative right sidebearing works better.</p>
