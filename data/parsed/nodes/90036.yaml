      <p>Comparing this question to an f is erroneous for a variety of reasons. The f has a wide range of form depending on the languages and technologies you expect to design to. Newspapers with no kerning need one solution- a narrow f. Users with access to kerning, ligatures and contextual shapes can use another solutions. If the font is just for a language with no clashes between f and diacritic mark then even more extravagant shapes are possible. In the case of the dcaron and lcaron the range of desirable variation is much much smaller. The f is very big and isn't going to be misread as easily as a small mark could be if an overlap occurs.</p>
      <p>I suggest that it is nearly always best to err on the side of using just space to make your worst case spacing scenario . I say this because it is practical - you can kern your way out out. But also because my reading of the science on the topic suggest that clashes are worse for reading that gaps are. People tolerate gaps really well. The shape of the Caron is relevant too. It is tall and thin. It far more susceptible to being misread/unidentified/ignored when placed next to an overlapping feature than other kinds of marks would be. </p>
      <p>You might also look at a cross section of fonts you respect.</p>
      <p>You might also ask David Březina at Rosetta Type <a href="http://rosettatype.com/" title="http://rosettatype.com/">http://rosettatype.com/</a> .</p>
      <p>What about some example images so we can see the context as well?</p>
