    <p>I always have to think about how to space the caron side of  dcaron/lcaron. </p>
    <p>Start with lowercase: do I use a negative sidebearing? In environments with no kerning, a negative sidebearing will at least work fine next to lowercase vowels and spaces, which it is how dcaron will appear most often. The disadvantage is that it will crash into k and some punctuation.</p>
    <p>On to uppercase: only one word, not counting proper nouns, begins with Ď or Ľ—ďáblův. So all caps settings seem like a bigger concern, and in such settings it could crash into E, I, U, and possibly O depending on the design of the caron and the O. So in this case should I go with a positive sidebearing?</p>
