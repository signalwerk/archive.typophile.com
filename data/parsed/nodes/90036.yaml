      <p>Sorry for causing a mess. Sometimes I can't communicate properly and regret later.</p>
      <p>I meant that carons are the same type of "design bug" as the f. So for "environments with no kerning" the best way is just to accept the gap, as we accept the gap after f. If not (I think of spacing next to the x-height letters), half of accents and all ascenders will crash with the caron. That's my "negative sidebearing".<br>
      I guess, nnfn/lcaron/adieresis/n/n in Adobe Caslon Pro - the overall rhythm, and specially the rhythm of accents, present themselves quiet well .</p>
