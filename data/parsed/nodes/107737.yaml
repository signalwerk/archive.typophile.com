    html: '<p>Very Garamond. Some sort of roughened version of <a class="freelinking external" href="http://www.myfonts.com/search/janson" rel="nofollow">Janson</a> actually. Some in the same vein: <a class="freelinking external" href="http://www.myfonts.com/fonts/letterperfect/old-claude" rel="nofollow">Old Claude LP</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/glc/1592-glc-garamond" rel="nofollow">1592 Garamond GLC</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/regula" rel="nofollow">Regula STF</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mvbfonts/mvb-celestia-antiqua" rel="nofollow">Celestia Antiqua MVB</a></p>'
