    html: |-
      <p>I quite like 'em &amp; I think you chose the right one for your avatar.<br>
      Have you tried making the horizontal bars of the E equal in length or perhaps cutting them diagonally, parallel with the Y)? It kind of bothers me in the bigger versions although it works well in the smaller ones... So it probably depends on what you're planning to use this for.<br>
      Another problem with the bigger versions could be the selected use of rounded corners. I'm not sure they do it justice. They might help to take the edge off a bit, but if that's you're intention, I think it needs more. Right now, there's too much contrast with the diagonally cuts that way (very clearly visible in the Y).  Maybe try intergrating Altaire's interpretation of a transport logo &amp; make it more aerodynamic. It might even be nice to see a slanted version of this.<br>
      I wouldn't use it on a black background by the way, that really doesn't work for me.<br>
      Overall, nice work that just needs a little finetuning depending on your plans for it.</p>
