  html: <p>I'm looking for suggestions on display typefaces that have an especially interesting/clever letter "Q". <br> <br>I'm very open to different suggestions, but at this point I want to exclude <br>-scripts <br>-"funny" type <br>-grunge type <br> <br>I also want the type to be quite legible. <br> <br>Any suggestions?</p>
