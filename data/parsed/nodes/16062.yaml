    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Thomas W. Phinney</strong> (1965-)</p>
    <p>Long-time <a href="/wiki/Adobe%20Systems" class="freelinking" rel="nofollow">Adobe Systems</a> employee (1997-2008) where he was the initial author (2005-08) of <a href="/wiki/typblography" class="freelinking" rel="nofollow">typblography</a>, and lastly Product Manager for Fonts and Global Typography. Currently Senior Product Manager for Fonts &amp; Typography at Extensis (2009-). Frequent conference speaker, often involved in evangelism and technical assistance relating to <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a>. Distant relative of <a href="/wiki/Joseph%20W.%20Phinney" class="freelinking" rel="nofollow">Joseph W. Phinney</a> of <a href="/wiki/American%20Type%20Founders" class="freelinking" rel="nofollow">American Type Founders</a> fame. Reportedly can be summoned by means of the <a href="/wiki/Phinn-signal" class="freelinking" rel="nofollow">Phinn-signal</a>. Designer of the typeface Hypatia Sans.</p>
    <p>Phinney has an MS in Graphic Arts Printing, specializing in design and typography, from the Rochester (NY) Institute of Technology, and an MBA from the University of California at Berkeley.</p>
    <p>For most of his time at Adobe, he reported to <a href="/wiki/David%20Lemon" class="freelinking" rel="nofollow">David Lemon</a>, and worked with colleagues including <a href="/wiki/Robert%20Slimbach" class="freelinking" rel="nofollow">Robert Slimbach</a> and <a href="/wiki/Christopher%20Slye" class="freelinking" rel="nofollow">Christopher Slye</a>.</p>
