      <div class="comment-spam-body"><p>Early, late or mid 19th century?<br>
      Italian script styles over 100 years would have been diverse but there would not have been a great number of metal typefaces.<br>
      Perhaps calligraphy and engraving might be good sources. Although much of this could be derivative of the English styles of the 18th century.<br>
      Here is a digital font based on a Bodoni script in a specimen book of his fonts issued in 1818 at Parma, Italy by his widow. <a href="http://www.myfonts.com/fonts/parachute/pf-bodoni-script-pro/" title="http://www.myfonts.com/fonts/parachute/pf-bodoni-script-pro/">http://www.myfonts.com/fonts/parachute/pf-bodoni-script-pro/</a><br>
      Based on very late 19th century Italian handwriting styles,  Diva by Nebiolo, as digitized by Rebecca Alaccari <a href="http://www.myfonts.com/fonts/canadatype/diva/" title="http://www.myfonts.com/fonts/canadatype/diva/">http://www.myfonts.com/fonts/canadatype/diva/</a><br>
      Don</p>
      </div>
