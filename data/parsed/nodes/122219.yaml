      <div class="comment-spam-body"><p>I have no information as to whether Sackers Italian Script <a href="http://www.myfonts.com/fonts/mti/sackers-italian-script/" title="http://www.myfonts.com/fonts/mti/sackers-italian-script/">http://www.myfonts.com/fonts/mti/sackers-italian-script/</a> is based on 19th century Italian scripts.<br>
      Luc Devroye has this to say about Sackers Italian Script and the other fonts in the Sackers family of fonts:<br>
      ---start quote---<br>
      The Sackers family (Monotype, and before that Agfa) contains a gorgeous tall-legged open style, Sackers Open Antique Roman. There are also Sackers Roman, Sackers Gothic (sans), Sackers Square Gothic, Sackers English Script, Sackers Classic Roman and Sackers Italian Script subfamilies. As a whole, this is an elegant but curious collection. There are few clues as to its origins, which may be a bit louche because we can easily recognize Engravers Gothic in the Sackers Gothic, for example. All typefaces look like they originate in the 19th century, and started probably out as engraved (copperplate) lettering. Monotype has these families: Sackers English Script, Sackers Gothic Light, Sackers Gothic Medium, Sackers Heavy Gothic, Sackers Heavy Roman, Sackers Italian Script, Sackers Light Classic Roman, Sackers Light Roman, Sackers Open Antique Roman, Sackers Solid Antique Roman, Sackers Square Gothic. Any information is welcome.<br>
      ---end quote---<br>
      <a href="http://luc.devroye.org/calligraphy.html" title="http://luc.devroye.org/calligraphy.html">http://luc.devroye.org/calligraphy.html</a><br>
      Don</p>
      </div>
