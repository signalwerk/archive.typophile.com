    <p>Ordinarily, Coke's packaging just seems noisy to me. I picked up a can the other day was stuck with the simple elegance of a recent redesign. Note the new type selection for the word "classic". Tasty.</p>
    <p>The production designer in charge of adding fake water droplets to the print files must be out sick. :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/coke_b4after_3541.jpg"></div><p></p>
    <p>Brand New has a nice post here:<br>
