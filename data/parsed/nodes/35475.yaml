      <p>To me they just look like old coke cans that must have been sitting in a basement since 1970. And Gotham just looks really out of place next to the wild swashy type. It feels like they’re just trying to make the fake-retro trend work for them, but doing the job by committee. </p>
      <p><cite>I wonder if Coke and Pepsi buyers really care about the constant rebranding or if it really impacts sales.</cite></p>
      <p>I read an article a few years ago that said Coke does so much marketing it’s next to impossible for them to guage the success of most of their efforts, so they just keep shifting money around and changing their methods to keep anybody from getting used to anything. Coke will drop a campaign if there’s a lot of public griping, such as with the insane degree of product placement in the second season of American Idol.</p>
