    html: <p>Okay, then. Washed the cars and had some more coffee.  <br> <br>This looks like Caxton's Type 3. A lettre de forme. This was used in the Ordinale seu Pica Sarum, Horae ad usum Sarum, A Psalter and the Westminster handbill. Caxton's type passed on to Wynken de Worde who printed a number of books with it.  <br> <br>Caxton's other lettre de forme were the Type 5 and Type 7 and Type 8.  <br> <br>Type 1, Type 2, Type 4, and Type 6 were batardes. Caxton's more popular works were printed in these. </p>
