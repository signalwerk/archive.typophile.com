    html: <p>Nope. <br> <br>But it is possible you are using a variant, so I don't think it fair that I drag this out. My immediate source was Alison Black's Typefaces for desktop publishing, a user guide (1990). A very good book by the way. <br> <br>I'm going to give this to you but the words that I've seen that make up the acronym are windows, icons, mouse, pointer. I verified this in a 1970s PARC document. WIMP is now known as GUI (graphical user interface). It was also at one time called the WIMP GUI. There, everything you ever wanted to know about WIMP. <br> <br>All yours now. <br> <br></p>
