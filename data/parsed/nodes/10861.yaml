    html: "<p>Well, based on Rule 16 (unless that has been revised) I guess I can legally answer this. <br> <br>I believe this to be the DK-type.  <br> <br>Developed in Strasbourg about 1440-1444 for the printing of book-like Donatuses and Kalenders: The 26-line, 27-line, 28-line, and 30-line Donatuses are the earliest. The Turkenkalender (1455), other Donatuses and other Kalenders, as well as broadsides were printed with it. It evolved into the face used for the 36-line Bible (1458-1460), and others, which were printed in Albrecht Pfister's Bamberg workshop. <br> <br>The capital P here is a indicator of difference from that of the textura in the 42-line Bible (the Gutenberg Bible) of 1455/6 or the Mainz Psalter, 1457.</p>"
    html_clean: "<p>Well, based on Rule 16 (unless that has been revised) I guess I can legally answer this. <br> <br>I believe this to be the DK-type.  <br> <br>Developed in Strasbourg about 1440-1444 for the printing of book-like Donatuses and Kalenders: The 26-line, 27-line, 28-line, and 30-line Donatuses are the earliest. The Turkenkalender (1455), other Donatuses and other Kalenders, as well as broadsides were printed with it. It evolved into the face used for the 36-line Bible (1458-1460), and others, which were printed in Albrecht Pfister's Bamberg workshop. <br> <br>The capital P here is a indicator of difference from that of the textura in the 42-line Bible (the Gutenberg Bible) of 1455/6 or the Mainz Psalter, 1457.</p>"
