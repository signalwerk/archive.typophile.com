    html: '<p>The "InDesign result" is on-screen rendering: the font may look better on-screen under a particular set of circumstances, but it does not necessarily follow that it will look better in all circumstances by applying this "magic formula." Your initial "Eureka" moment may simply have been an instance of harmonious hinting or just-so antialiasing...</p>'
