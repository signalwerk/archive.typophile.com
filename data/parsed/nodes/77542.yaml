      <p>We wound up writing an InDesign script that reports the width of a selected item (where "item" can be a "glyph"). Then I made up a font from the Font Lab scaling and another from the Fontographer scaling. Using the script to measure within InDesign, I got:</p>
      <p>Width of capital A (in InDesign) using </p>
      <p>InDesign's scaling: 5.6805 points,</p>
      <p>Fontographer's scaling: 5.7095 points,</p>
      <p>FontLab Studio's scaling: 5.6809 points.</p>
      <p>So, with the limited test, FL5 behaves closer to InDesign for horizontal.</p>
      <p>*</p>
      <p>On to redoing the ligatures and kerning.</p>
