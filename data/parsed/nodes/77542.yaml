    <p>I was fooling around with a font in InDesign, and noticed that scaling it to 99% horizontal, 100% vertical gave a better-looking font.</p>
    <p>So, I opened up the font in FontLab, and scaled it 99% horizontal 100 vertical. Then the same thing using the new Fontographer. Well, the two font editing programs gave different results, and not just in metrics. The differences are slight, as you would expect by such a small change, but they are there.</p>
    <p>Does anyone know, or think of a way I can test, which gives the same as the InDesign result?</p>
