      <p>Well, it might have been Nick, but I did make a PDF and print that out. Looked better on the 1200 dpi laser printout, too. The real test is a 2400 dpi offset press, but I do think it'll pass that one as well.</p>
      <p>The differences between FL and FOG are small, but making this change in a font does mean redoing the ligatures, and at least revisiting all the characters, sidebearings, and kerning. I really only want to do that once. ('Course I'd really like peace on Earth, too.)</p>
      <p>I guess what you're saying  is "just pick one and work with it . . ."</p>
