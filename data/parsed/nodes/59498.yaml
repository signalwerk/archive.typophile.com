    <p>Hi folks! I'm new here.</p>
    <p>Currently I'm a student starting my first-ever logo design project for a client. This is my first time, and I could use some info: What are the ground-rules for using fonts in wordmarks/logo design in general?</p>
    <p>Can I just purchase any font and use it as part of a wordmark? Can I modify a font outline and give that to the client? If I use a font, can I legally give my client the vector outline as an Illustrator file? What are the do's and don'ts of font licensing in corporate identity projects?</p>
    <p>You have my undying gratitude for any help you can offer. (Tips and pointers also welcome!)</p>
