    html: <p>It varies by the foundry and sometimes the particular font. Most font EULAs specifically allow a small number of glyph outlines to be used in logotypes, while some either disallow this or require a special extra license fee. Read your font's license carefully, and when in doubt, ask the foundry.</p>
