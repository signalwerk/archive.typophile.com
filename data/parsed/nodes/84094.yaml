  html: |-
    <p>I have been working on this identity project for a production company and the client chose a type direction that included modifications to Caslon Graphique. It is well received, but through some revisions more and more modifications were made to the type. I just wanted to get another set of eyes on this that know a lot more about type than I do. I feel like I am especially having trouble getting the 'S' just right. Any comments or critiques are appreciated. Thanks in advance.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SilentPartner_6013.png"></div><p></p>
