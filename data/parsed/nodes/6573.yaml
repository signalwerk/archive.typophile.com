    html: <p>FB <a href="http://www.myfonts.com/fonts/fontbureau/herald-gothic/heraldgothic-medium/testdrive.html?s=HARD+BOILED&amp;p=72">Herald Gothic</a> is pretty close, but has even more squarish corners. <br> <br>It's basically a condensed grotesk, of which there are quite a few possibilities. I like Pacific Standard. You've also got Roswell, which is a little more condensed.</p>
