    html: |-
      <p>cmd+j is the same as: tools &gt; multiple master &gt; mask to master.</p>
      <p>what i would do in this situation is to paste a copy of the new black m to the mask layer (make sure there’s nothing else in the mask), activate the black master and then cmd+j.</p>
