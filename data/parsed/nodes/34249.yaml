    html: |-
      <p>This is what I would do:</p>
      <p>1. copy the source glyph<br>
      2. go into the glyph window of the target<br>
      3. paste<br>
      4. Cmd+K, Cmd+M, Cmd+X<br>
      5. activate the master you want to be changed to the source<br>
      6. Cmd+J</p>
      <p>alternatively, if your source is already an “m” in another font:<br>
      1. assign mask, select the source font and the right master (or assign all)<br>
      2. activate the master you want to be changed to the source<br>
      3. Cmd+J</p>
