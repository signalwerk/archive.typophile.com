    <p>Hi there<br>
    I’m trying to make a a MM font in Fontlab 5. I have one weight axis. I build the MM I’m working on from two endpoints, a thin and a black. The problem is that if I now try to delete a glyph, say the black ’m’, and then paste a replacement in it’s place, Fontlab replaces both the thin and the black ’m’. I can’t find any mention of that in the manual – is it impossible to do?</p>
    <p>Another thing is the kerning. How can I (can I at all?) import metrics and kerning from other files into the MM font? I’m using identical kerning classes in the thin and the black, but I would like to take the metrics and kerning from the two start designs, thin and black, and put them in the MM version. How to do?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/34256" class="topic-previous" title="Go to previous forum topic">‹ Missing kerning in Multiple Master / Fontlab</a> <a href="/node/34230" class="topic-next" title="Go to next forum topic">FontLab Error: invalid first character in name (text was ".null") ›</a></div>
