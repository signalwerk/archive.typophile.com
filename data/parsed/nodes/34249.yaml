      <p>Hi,<br>
      the masters are connected, so you cannot delete/change only one. Normally I copy the new glyph to the mask and move the points of the Master to align with the mask.<br>
      OR<br>
      making to single master fonts and blend them and copy the glyph to the original MM font.</p>
      <p>if you import metrics in the metrics window, they apply the the selected master. So you can select the Thin master, import the thin afm file, switch to Black and import the black afm file.</p>
      <p>Georg</p>
