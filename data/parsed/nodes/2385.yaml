  html: <p>What's that so-called "Soft Hyphen" in slot 173 of the Windows codepage?  It's 00AD in Unicode. It shows up in the MyFonts tables, as well as the Windows CharacterMap, but it behaves very funny in Word and WordPad, whether I enter it using the Alt-zero method or I do a copy-paste from the CharacterMap. Is it supposed to appear/disappear like that? And sometimes turn into two hyphens?! Where's the "hard" hyphen? The regular one breaks too. Is there one that doesn't? <br> <br>hhp <br></p>
