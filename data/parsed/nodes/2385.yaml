    html: <p>That makes sense - it does only appear when it's end-of-line. I guess the point is to manually guide the hyphenation routine. The only little mystery is why Word <i>sometimes</i> subs two hyphens for it... <br> <br>And why is it missing from the MacRoman codepage? Doesn't Quark and stuff have bunches of different spaces and hyphens for textflow customization? <br> <br>hhp <br></p>
