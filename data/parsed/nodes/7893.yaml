  html: "<p>XXXXXXmas cards all around those days... <br>There is one for a collage in Thessaloniki. <br> <br>_2 concepts as you see.  <br>First one is folded in half to fit in a 23x11 cm envelope,  <br>second is a double sided post-card  <br>and i am thiking to print 3-4 cards   <br>with different images on the back. <br>_The client insists on using the photos they took  <br>from a concert they organized last month. <br>_What i am concerning more is how obvious is the object  <br>in card 2 (i won't say what it is) and how can i make  <br>the card#1 less \"heavy\" keeping all those photos. <br> <br>Type used: Minion. <br> <br>christos <br> <br><img src=\"http://www.typophile.com/forums/messages/29/54631.jpg\" alt=\"\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/54632.jpg\" alt=\"\"></p>"
