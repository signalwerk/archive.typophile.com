    html: <p>Embedding a "true" bitmap font into a TT shell is not enough - MacOS doesn't like those either. Especially not grayscale ones, which can cause even pre-X systems to perform a major flaming crash! Ironically, everything used to work seamlessly before System-8. <br> <br>The only way -like Chris says- is to make an outline font that behaves like a bitmap font at one specific size. These are generally called pixelfonts (with some nice automation indeed provided by Pyrus), and the great news is they can be grayscale too (blowing away any other font rendering method). <br> <br>hhp <br></p>
