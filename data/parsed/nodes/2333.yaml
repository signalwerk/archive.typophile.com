    html: <p>Hi Jon,  <br><br>I have heard about <span class="caps">OS</span> X’s pixel-font hostile antics. If I understand, you have created outline-style TrueType pixel fonts, similar to those used by Flash designers, for a Mac-centric audience. <br><br>If these bitmap fonts are immune to the <span class="caps">OS</span> X problem, it will conﬁrm TrueType/OpenType outlines as the system-independent bitmap font medium of choice. Ironic, but great. <br><br>FontLab+FlashFonter can convert old Mac fonts into the ‘ﬂash pixel font’ style. How did you do it? <br><br><span class="caps">BTW</span>, I’d like to try your e-World font on my Win2K system. Would you post the <span class="caps">OS</span> X TrueType in a .zip ﬁle. <br>? <br>-chris</p>
