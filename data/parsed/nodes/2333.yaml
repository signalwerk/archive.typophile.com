    html: <p>Hi Jon,  <br> <br>I have heard about OS X's pixel-font hostile antics. If I understand, you have created outline-style TrueType pixel fonts, similar to those used by Flash designers, for a Mac-centric audience. <br> <br>If these bitmap fonts are immune to the OS X problem, it will confirm TrueType/OpenType outlines as the system-independent bitmap font medium of choice. Ironic, but great. <br> <br>FontLab+FlashFonter can convert old Mac fonts into the 'flash pixel font' style. How did you do it? <br> <br>BTW, I'd like to try your e-World font on my Win2K system. Would you post the OS X TrueType in a .zip file. <br>? <br>-chris</p>
    html_clean: <p>Hi Jon,  <br> <br>I have heard about OS X's pixel-font hostile antics. If I understand, you have created outline-style TrueType pixel fonts, similar to those used by Flash designers, for a Mac-centric audience. <br> <br>If these bitmap fonts are immune to the OS X problem, it will confirm TrueType/OpenType outlines as the system-independent bitmap font medium of choice. Ironic, but great. <br> <br>FontLab+FlashFonter can convert old Mac fonts into the 'flash pixel font' style. How did you do it? <br> <br>BTW, I'd like to try your e-World font on my Win2K system. Would you post the OS X TrueType in a .zip file. <br>? <br>-chris</p>
