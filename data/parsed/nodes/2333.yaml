    html: "<p>Thanks Hrant. So what I have from pixelhaus is what you classify as #3 judging by the way that Dave at pixelhaus describes it (see above). I have installed the McMurdo font onto my system and here's the deal: <br> <br>1. The system runs fine. <br>2. TextEdit can use the font just fine. Omni Graffle can use it just fine. Both display great at 7pts. No AA. Illustrator doesn't know it exists. Photoshop can see it and use it. Applies AA if you want it too though you can say none and it displays as expected. <br>3. FontBook can see that there's a font there and despite what Dave at pixelhaus indicates I <b>can</b> see a preview of it. <br>4. Font Book crashes if I try to 'manage' the font in any way by adding it to a font collection. The system stays okay. <br>5. TypeTool has nothing to open. It doesn't crash, it just thinks it's opened everything there is to open, but nothing there for it. <br> <br>Screenshots (sorry for the haloing): <br>Here's TextEdit with text in McMurdo and McMurdo selected in the Font Panel: <br><img src=\"http://www.typophile.com/forums/messages/30/22152.jpg\" alt=\"\"> <br> <br>And here's Font Book showing a preview: <br><img src=\"http://www.typophile.com/forums/messages/30/22153.jpg\" alt=\"\"> <br> <br>So that's my experience so far. More soon. <br> <br>Jon</p>"
