    html: "<p>&gt; distinction between bitmap fonts and pixelfonts <br> <br>It's not like the terminology is solid, but there are three kinds of screen-optimized fonts: <br>1) The superhinted stuff, like the MS core fonts. These have no bitmap data - they have special code (\"instructions\") to perform funky distortions to the outlines which makes them render out as nice bitmaps at each size. These are always 1-bit (b&amp;w) in practice, although: it's actually possible to superhint for grayscale rendering - it just seems to be too much work; and above certain PPEM sizes grayscaling is enabled, essentially because the rendering algorithm no longer needs much hand-holding. <br>2) What are generally called pixelfonts, which are regular outline fonts that have blocky forms that map to a specific pattern at a given size. These can be 1-bit (b&amp;w) or more recently grayscale. <br>3) \"True\" bitmap fonts, which contain actual bitmap data, either as stand-alone files (like FON, or the old Mac NFNT stuff), or embedded in TT fonts which may or may not have outlines too. These can also be grayscale in theory, but it's hard to make them work on Windows, and since System8 MacOS has flaming-crashed if you try to use one. Sad. <br> <br>Although #3 in its embedded flavor is the most elegant (not least because it provides a nice separation between print and screen rendering), it's looking like you want to avoid it, especially on the Mac (although doing 1-bit versions for Windows is great*). And even #1 is being demoted on the Mac since Panther seems to ignore hinting. So #2 is looking great overall - even if they try the OS makers will have trouble preventing it from working. <br> <br>* <a href=\"http://www.themicrofoundry.com/f_arasan.html\" target=\"_blank\">http://www.themicrofoundry.com/f_arasan.html</a> <br> <br>Then there's ClearType, which is a different kettle of fish. Technically it's possible to apply any of the above three classes to CT (except maybe not the grayscale flavor of #2) but I've yet to see anybody actually do it. <br> <br>hhp <br></p>"
