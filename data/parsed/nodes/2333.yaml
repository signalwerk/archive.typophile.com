    html: "<p>Sorry I haven't been able to get back to the forums for awhile. <br> <br>Christopher: no problem, my message did read like an announcement. I remain mystified by font behaviour on OS X. I have downloaded these fonts from pixelhaus but I haven't installed or tried them yet. <br> <br>I currently have two bitmap fonts on my OS X system, one which can be used and one not. I am going to compare them to these from pixelhaus (just downloaded) to see what happens. <br> <br>BTW if you require a .zip file because you can't open a .sit file <a href=\"http://www.stuffit.com/win/expander/index.html\">here's</a> a utility to open .sit files on Windows. <br> <br>Hrant: you seem to be making a distinction between bitmap fonts and pixelfonts and I must confess my ignorance. Are you saying pixelfont==a bitmap font with no outlines in a TrueType shell? And \"true\" or real bitmap font is one that has no outline, nor does it require one to be rendered to the screen? Is that the gist of what you are saying? <br> <br>I'll try to keep you posted. <br> <br>Jon</p>"
    html_clean: "<p>Sorry I haven't been able to get back to the forums for awhile. <br> <br>Christopher: no problem, my message did read like an announcement. I remain mystified by font behaviour on OS X. I have downloaded these fonts from pixelhaus but I haven't installed or tried them yet. <br> <br>I currently have two bitmap fonts on my OS X system, one which can be used and one not. I am going to compare them to these from pixelhaus (just downloaded) to see what happens. <br> <br>BTW if you require a .zip file because you can't open a .sit file <a href=\"http://www.stuffit.com/win/expander/index.html\">here's</a> a utility to open .sit files on Windows. <br> <br>Hrant: you seem to be making a distinction between bitmap fonts and pixelfonts and I must confess my ignorance. Are you saying pixelfont==a bitmap font with no outlines in a TrueType shell? And \"true\" or real bitmap font is one that has no outline, nor does it require one to be rendered to the screen? Is that the gist of what you are saying? <br> <br>I'll try to keep you posted. <br> <br>Jon</p>"
  - id: 18754
