      <p>I've got a similar issue where I work -- not that I hate the existing logo, but i know it could be so much better (given that we are a creative firm), and work better in hundreds of ways, but it's OUR LOGO - our brand is out there, and changing it (even a little) means going against years of built-up equity.</p>
      <p>I spend a lot of time working on ways of presenting our logo in a unique way - illustratively, cropping, ghosting, reflecting, etc. etc... makes it seem much fresher without the loss of what it is.</p>
      <p>IMHO, the only place a logo NEEDS to be used "as is" is in a trademark application; once it's set, play with it!</p>
