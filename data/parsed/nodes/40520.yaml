      <p>To tell you the truth, logo did improve a lot. If you sell bikes I think you will have to change type because I think a VERY similar type is used in many many sport equipment companies (Gary Fisher for instance). It's different but not too much.</p>
      <p>Using a bold typeface may not necessarily be bad since people associate it with sports because many companies use it, but it should be distinct enough.</p>
      <p>Web 2.0 logo for a company that doesn't provide web 2.0 services to on-line communities etc. doesn't really make any sense to me. I'd rather go with a regular logo and then colour upgrade it with gradients/shadows/etc. if really needed.</p>
      <p>If you're a bike reseller I'd rather focus on that. A shark in the logo may be quite ok, since it's agile, aggressive and powerful. But not the one that you're using right now because it's rather cartoonish.</p>
      <p>Type in logos from A-F is very bad with various slants etc. G and F seem the only ones that may be usable.</p>
      <p>Some simple and fast suggestions:</p>
      <ul>
      <li>I'd make all letters in Greenfish of the same size, without emphasizing the G.
      </li><li>in this case "adventure sports" will have to be adjusted
      </li><li>create a new shark that would be more suitable for a logo and more powerful and adventurous that this cartoonish one
      </li><li>discard the colour at first and work from BW examples
      </li></ul>
