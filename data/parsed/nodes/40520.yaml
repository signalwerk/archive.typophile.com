    html: <p>Thanks so much for all your comments! I've been looking at this thing for so long that sometimes I begin to think maybe it's not so bad. Then every time I try to incorporate it into any sort of layout I just hate it. The fish is the result of compounding the founder's name plus his wife's former name. I think it's kind of clever. I think the financing partner contributed the "adventure" part, hoping to spice it up a bit. When I first came across the company I thought maybe they led some kind of wilderness fishing trips. I guess mountain biking can be an adventure, but I don't think most of what we sell really reflects that. The word Bikes was excluded from the title because the founder aspires to be the next Dicks Sporting Goods, eventually moving beyond just bikes. Really I think our branding problems stem directly from the wishy-washy business plan, or complete lack of a business plan, which is most frustrating, but I was hired to make pictures, so who am I to question their strategies? Unfortunately, it's very difficult to produce effective graphics when one doesn't know exactly whom one is marketing to or what one is supposed to be representing. I could vent for pages and pages, but I'll spare you! Not sure how I'll convince the boss- I guess outside consulting would be the only way, but we are reluctant even to pay $30 for a decent font, I can't see anyone agreeing to pay an outside consultant!</p>
