    html: |-
      <p>That we can't afford to throw away all of our  "built up equity" is essentially what my boss tells me whenever I try to mess with the logo. I usually don't push the issue, though because I have a feeling the real issue has more to do with her pride in little fishy. I can't believe that that fish has built up that much equity anyway; the company started in 2003 or so, and by the time I got there they'd adopted the ugly fish for some materials, but the top of their website still had an entirely different fish and typeface combo. Some of our shipping pouches had that old fish combo until at least a month or so ago. I can hardly believe that most of our customers identify with the fish in any meaningful way (evidence being that very few people buy any of our branded merchandise), or wouldn't recognize the company if it adopted another fish. But I don't have any sort of marketing or branding credentials, so any discussion would end up: "well I think this" "Well I think you're wrong," and she, being the boss, would end the conversation, and I, being rather non-confrontational, would drop the issue, and then at some point, after having kept all my opinions bottled up inside, would become frustrated and start ranting in a somewhat obscure forum on a typography website that I had come across while trying to find legitimate excuse for why we should not use the font "AddCityBoy" to represent our company, but that I had also come across in the past, and had bookmarked in my del.icio.us links,  and had enjoyed reading very much, expanding my meager knowledge of typography, and in which I would be comforted by the good citizens (netizens?), by their reassuring disapproval of that which had caused my frustrations. </p>
      <p>Really, I'm hoping to be doing some graduate studies in in the Fall, so I just have to hold out until then. I don't see them changing the logo any time soon, but perhaps if they can stay afloat despite the logo, someday they will become big enough to hire a consultant who will have the authority to tell them how ugly their logo is. Of course, by that time it probably will have gained some equity, but I'll be long gone by then, so won't have to worry about it!  </p>
      <p>@dunk I like to think that my Fine Arts extends to a modest degree toward illustration, but I acknowledge my shortcoming as a designer. That said, I think (and I think she agrees) my graphics are much nicer than those of my boss. And getting better all the time! Slowly, but surely...</p>
