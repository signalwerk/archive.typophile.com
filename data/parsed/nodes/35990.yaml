      <p>I'd agree with using Minion Pro for everything, esp. since there is a titling (aka "Display") version, along with a "Subhead" version. Combining Minion &amp; Myriad is "quite common" in several senses of the term.</p>
      <p>But if you must have a sans, some of the fonts at</p>
      <p><a href="http://www.greekfontsociety.org/pages/en_typefaces1.html" title="http://www.greekfontsociety.org/pages/en_typefaces1.html">http://www.greekfontsociety.org/pages/en_typefaces1.html</a></p>
      <p>have a Latin character set as well as Greek, and there are one or two in a Sans style.</p>
      <p>FWIW</p>
