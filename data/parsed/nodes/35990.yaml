  html: |-
    <p>Hello. I need your advice because I am an amateur involved in an open- and self-publishing project. The final product will be an e-book, or simply a pdf file. The topic is environmental law, policy and activism, and the audience is very diverse. The language is (modern) Greek, but some quotes and bibliography  might be in  English or  French, and a bi-lingual edition would also be desirable in the future (hence, we need essentially a bi-lingual typeface). I have chosen MinionPro for the text - partly because it is available, partly for readability and elegance (with Sabon a close second). I am looking for a sans-serif font for headlines and titles...I have considered Memorandum and Veto (but they do not offer Greek), as well as Myriad Pro (which is still an option), but I suspect there are other choices ....Please consider also cost (no more than 30-40 euros, so it has to be a bold typeface that is sold separately), and feel free to suggest other font combinations. Thanks.</p>
    <p>P.S. On second thought, do I need a separate font for headlines?</p>
