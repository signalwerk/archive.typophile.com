    html: |-
      <p>I was suggesting that the bowl of the g should look more like the bowl of the d--in your d, the stem stops the ellipse shape and makes it incomplete, and the g is the only letter where that ellipse is complete. </p>
      <p>I like the new serif structure in your latest set of letters, although I personally would leave the g with no serif (since all the other serifs are on the top left or bottom right of a letter). In the bowl shapes, though, I still see the clash that I was talking about before. If you drop a line from the top to the bottom extremum in your "o", it'll run vertically straight through your letter. If you stacked an "n" on top of a "u", though, and did the same thing, the line would run diagonal. That's what I'm trying to talk about.</p>
      <p>Also, for the m and n I prefer the serif on the top left. I don't think the t needs a top serif.</p>
