    html: |-
      <p>You've got this geometric thing going on with the caps, and it works well there. The uppercase reminds me vaguely of Neutraface. However, the lowercases are of two minds. Some of them are based off of what looks like a perfect ellipse (most of the round letters). Others, though, have a humanist feel in the round parts (ahmnu, and to a lesser extent fjltr). I think the letters would work better with each other if they all had the same feeling. If you go with the elliptical idea, I think the round parts could be slightly more square. The humanist curves seem, to me, to work better with the serifs you have on abdglpqt, but perhaps not as well with your caps, which are more geometric.</p>
      <p>There are also some curves that look a bit rough to me: BJPRSU, stu, and possibly a (depending on which way you go). For the B, P, and R, I would suggest making your horizontal straightaways a little longer. The J and U need longer vertical straightaways.</p>
      <p>I think it's fine that b &amp; q and p &amp; d have the same shape when rotated. They do in lots of fonts.</p>
