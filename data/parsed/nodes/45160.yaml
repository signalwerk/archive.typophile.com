    html: |-
      <p>With a bitmap, the circles aren't going to come out looking perfectly round unless your output resolution is really high.</p>
      <p>Does the output absolutely have to be a bitmap, or will grayscale do? Because you could just create the bitmap at, say, ten times the target resolution, convert it to grayscale, and then resize the image down to 10%. You should end up with nice anti-aliased circles.</p>
