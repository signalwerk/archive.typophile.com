    <p></p><div class="imageWrap"><img src="http://typophile.com/files/EmigreNews_5224.gif"></div><p></p>
    <p><strong>Emigre Gift Ideas</strong><br>
    Emigre may just have the perfect gift for your designer friend (or yourself), and the wrapping paper to wrap it all up in. Better yet, we'll include a gift! All orders over $5 shipped in December will receive a free set of the Puzzler wrapping paper. (Offer excludes font download orders.)</p>
    <p><a href="http://www.emigre.com/" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.emigre.com/" rel="nofollow"><img src="http://typophile.com/files/12-05-2006_6521.jpg"></a></div><p></p>
    <p><strong>Our Most Popular Gift Items</strong><br>
    A new offering of handmade, ceramic vases by Zuzana Licko is now available. The vases feature an assortment of colorful glazes applied to various shades of stoneware. Heights range from 3 to 11 inches.</p>
    <p>A limited number of rare back issues of Emigre magazine are still available. Currently on display at New York's MoMA, all our back issues have become true collector's items.</p>
    <p>And check out our T-Shirts, Artist Books, Posters and the always popular Sampler Bag, containing a collection of Emigre goodies.</p>
    <p><strong>Holiday Delivery</strong><br>
    For delivery by Dec. 22nd, place your US express orders by Dec. 19th. Holiday delivery is guaranteed only for express orders within the US.</p>
