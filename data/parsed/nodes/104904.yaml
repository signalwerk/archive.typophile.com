    <p>I have to create new image assets for a company who "misplaced" their previous webmaster. Alas, with him went all the information (color codes, fonts, etc) so i'm in a bit of a pickle.<br>
    Can anyone recognize this font?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled_5344.png"></div><br>
    From what i've heard it is "certainly a default font" but so far looking through my system fonts haven't helped much.<p></p>
    <p>Thanks</p>
