    html: <p>Generally, if the fonts in question have the smcp feature and the applications in question are OpenType-aware, you can get true small caps by highlighting your selected text and activating the smcp feature (usually with a checkbox on the character/font palette). However, I'm not familiar with either of the applications, so...</p>
