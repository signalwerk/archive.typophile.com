    html: |-
      <p>In Pages, what you want is the Typography palette. Go to the Fonts palette, click on the cogwheel thing toward the bottom, and select "Typography..." from the menu. This gives you access to the OpenType features, including small caps, that you can apply to the selected text. Since it's a pain to get to, you'll want to define a character style for small caps.</p>
      <p>I have no idea about NWE. When I last used it, maybe five or six years ago, it didn't support OpenType features, but maybe it has been improved since then.</p>
