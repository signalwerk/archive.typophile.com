    html: <p>Create outline for each page (actually you must for each individual text box) before exporting to pdf. Go to TYPE in the InDesign menu bar and then Create Outline. Make sure you first save a copy without creating outlines (because I don't think you can undo). Then you have made images of your text and you should be able to export the file to pdf. Does this make sense? Best, Anthony</p>
