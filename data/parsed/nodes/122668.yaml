      <p>Hello,</p>
      <p>Sorry to be so late getting back to you all, but I have been swamped, figuratively and literally.  (I live in Louisiana.)</p>
      <p>Thanks for the responses.  I tried asking the font creator to fix it.  However, he did not know how to fix it and does not even have a program necessary for the task.  This is the only font he ever created.</p>
      <p>Luckily, someone from this group emailed me privately with great info.  Even though he had rescued me with the information I needed, it stressed me because I have become handicapped by Windows and am no longer sure of command line stuff.</p>
      <p>This is the really amazing part.  I emailed High-logic, the folks who sell the FontCreator program.  I was so desperate that I was willing to buy the program just for one use, to fix this font.  However I did not have to.  They volunteered to fix the font for me for free so long as I would send them emails from the creator to verify that it was okay with him.  Within hours, the font was mailed back to me, healed.   I am still amazed by the fact that they trashed a chance to make a profit to help a goober.  If I ever decide to add font creation to all my other endeavors, I will certainly deal with them.  I got great customer service without even being a customer.  </p>
      <p>Thanks for all the responses and help.  My appreciation for humanity has been enhanced by this frustrating situation and caring people.</p>
      <p>Happy Mardi Gras.<br>
      Suzanneski</p>
