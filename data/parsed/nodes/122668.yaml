    html: |-
      <p>Anthony, in general converting text to outlines is regarded as <em>circumventing</em> the EULA.</p>
      <p>I believe the intention of most EULAs is not to forbid embedding the font <em>an sich</em>, but instead to forbid using the font at all inside a PDF. Therefore, you are violating perhaps not the letter of the EULA, but certainly its spirit.</p>
      <p>EULAs tend to lag behind technical possibilities -- that is, if 'just outline the fonts' becomes common practice, it'll surely get mentioned that is allowed/not allowed next time.</p>
