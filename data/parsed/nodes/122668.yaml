    html: |-
      <p>Here is what H &amp; Co says about outlining: <a href="http://www.typography.com/faq/question.php?faqID=100" title="http://www.typography.com/faq/question.php?faqID=100">http://www.typography.com/faq/question.php?faqID=100</a></p>
      <blockquote><p>
      The simplest way to supply a logo to a client is to convert it to outlines in a drawing program. This saves the client from needing to license and install fonts, and it guarantees that the logo will appear exactly as you designed it.</p>
      <p>If your client needs to install and use the fonts themselves, they’ll need to license the fonts for their own use, which they can do through this site.
      </p></blockquote>
      <p>The problem with embedding the font is that it can be extracted from pdf or postscript files. However, with current technology, fonts need the opentype tables to produce a decent output and those tables are not embedded in printouts. Maybe I am wrong but I would expect that with current technology, trying to extract a font from a pdf file is outdated and that the problems with technological advances come more from web fonts and fonts for e-pub than from those for desktop publication.</p>
