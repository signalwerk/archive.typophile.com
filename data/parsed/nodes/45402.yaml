    html: |-
      <p>Do you mean the numbers in Font Info -&gt; Font Dimensions -&gt; Subscript and Superscript?<br>
      These don't have any relation to the actual glyphs in your font, they are merely suggestions for programs that synthesize (i.e. scale and position) super- and subscripts. And it's not even guaranteed all programs use these; InDesign, for example, uses its own default settings.<br>
      The same goes for underline and strikeout thickness and position.</p>
      <p>Note that these numbers are in <em>design</em> values; for a typical Type 1 font in 1000ths, for a TTF in 2048ths. Typically, they are in percents in any other program (hint towards FL).</p>
