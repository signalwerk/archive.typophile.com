      <p><cite>Given that, would you consider ID at fault?</cite></p>
      <p>ID is OpenType-savvy which means that it gives access to especially designed superior/inferior numerals and (depends on the font) letters. Not only scaled, but also slightly bolder than merely scaled ones so they better fit with normal-sized letters.</p>
      <p><cite>From what point in the glyph window are xpos and ypos positions measured</cite></p>
      <p>The official description is at <a href="http://www.microsoft.com/OpenType/OTSpec/os2.htm" title="http://www.microsoft.com/OpenType/OTSpec/os2.htm">http://www.microsoft.com/OpenType/OTSpec/os2.htm</a></p>
