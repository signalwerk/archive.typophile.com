    <p></p><div class="imageWrap"><img src="http://typophile.com/files/photo_5157.PNG"></div><p></p>
    <p>So, I'm making an invitation for a girl who's pretty particular about the type of font she wants for the names.  She wants this one (which I think may have been actually done by hand) but what she likes is the calligraphy, hand drawn look of it, the girly, bubbly script of it and the boldness of the font (she's not a fan of thin calligraphy).</p>
    <p>So I need help either confirming that this is hand drawn (she just sent me a picture of it so I don't have much to investigate) and if it is hand drawn, is there a font that is very similar to this with the characteristics explained above!</p>
    <p>This would be a life saver!! Thank you guys!</p>
