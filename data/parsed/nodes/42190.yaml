    <p>I've been playing with this logo all weekend. It's for a record label focused on underground experimental electronic music. Trying some different variations here. I colored #4 because that's the one I'm leaning towards at the moment. Strikes a nice balance compared to 2/3 &amp; 5/6 I think.</p>
    <p>Looking for some feedback. Thanks.</p>
