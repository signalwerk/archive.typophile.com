      <p>Ha. Love it eeblet.</p>
      <p>I don't really see how depicting an outlet would be any more “edgy” than a plug per say. Just as “flat and trite” as jsgh would say. I listen to quite a lot of music and most of it is on indie labels. These labels, the ones with well designed identities, are usually not very edgy, but more subtle/sophisticated/modern for the most part.</p>
      <p>I get the idea though. Back to the drawing board. May just drop the visual element all together and stick with typography.</p>
      <p>Thanks again for the insight/suggestions.</p>
