      <p><a href="http://www.stepinsidedesign.com/" rel="nofollow">STEPInside Design</a></p>
      <p>If you can find old issues of Critique magazine, I always thought the writing was very good.</p>
      <p><a href="http://www.graphis.com/journals/index.php" rel="nofollow">Graphis</a> isn't what it used to be, but still worth a poke through at the bookstore.</p>
      <p>You should also consider the online forums/blogs that are populated and written by well-published authors. Specifically I'm thinking about <a href="http://www.designobserver.com/" rel="nofollow">Design Observer</a> and <a href="http://www.underconsideration.com/speakup/" rel="nofollow">Speak Up</a>.</p>
