      <p>Eye is probably still the best thing out there in the way of a general survey of graphic design in my opinion. It's a pity that it costs so much, but that's one of the results of not flooding the inside with advertising.</p>
      <p>Baseline is excellent for typography:<br>
      <a href="http://www.baselinemagazine.com/" title="http://www.baselinemagazine.com/">http://www.baselinemagazine.com/</a></p>
