    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : Indie Fonts 2</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IndieFonts2Book_4995.jpg"></div><p></p>
    <p><em>Indie Fonts 2</em>, a companion to the award winning <em><a href="/wiki/Indie%20Fonts" class="freelinking" rel="nofollow">Indie Fonts</a></em>, brings together an additional 19 independent font foundries from around the world. This book is an invaluable resource of over 1600 fonts for designers, art directors and typographers.</p>
    <p>This book is divided up by foundry so that the user can get a feel for the work produced by each group. This also makes it convenient to order fonts directly from their source. There is a visual font index provided in the front for quick scanning and a fully cross referenced index in the back containing font names, designers, and original designers.</p>
    <p>Contributing foundries include <a href="/wiki/Atomic%20Media" class="freelinking" rel="nofollow">Atomic Media</a>, <a href="/wiki/Feliciano" class="freelinking" rel="nofollow">Feliciano</a>, <a href="/wiki/Gal%C3%A1pagos" class="freelinking" rel="nofollow">Galápagos</a>, <a href="/wiki/Holland%20Fonts" class="freelinking" rel="nofollow">Holland Fonts</a>, <a href="/wiki/Identikal" class="freelinking" rel="nofollow">Identikal</a>, <a href="/wiki/ingoFonts" class="freelinking" rel="nofollow">ingoFonts</a>, <a href="/wiki/Jukebox" class="freelinking" rel="nofollow">Jukebox</a>, <a href="/wiki/MVB%20Fonts" class="freelinking" rel="nofollow">MVB Fonts</a>, <a href="/wiki/Neufville%20Digital" class="freelinking" rel="nofollow">Neufville Digital</a>, <a href="/wiki/Nick%E2%80%99s%20Fonts" class="freelinking" rel="nofollow">Nick’s Fonts</a>, <a href="/wiki/No%20Bodoni" class="freelinking" rel="nofollow">No Bodoni</a>, <a href="/wiki/Parkinson" class="freelinking" rel="nofollow">Parkinson</a>, <a href="/wiki/Sherwood" class="freelinking" rel="nofollow">Sherwood</a>, <a href="/wiki/Mark%20Simonson%20Studio" class="freelinking" rel="nofollow">Mark Simonson Studio</a>, <a href="/wiki/Storm" class="freelinking" rel="nofollow">Storm</a>, <a href="/wiki/Terminal%20Design" class="freelinking" rel="nofollow">Terminal Design</a>, <a href="/wiki/Underware" class="freelinking" rel="nofollow">Underware</a>, <a href="/wiki/Union%20Fonts" class="freelinking" rel="nofollow">Union Fonts</a> and <a href="/wiki/YouWorkForThem" class="freelinking" rel="nofollow">YouWorkForThem</a>.</p>
    <p>Accompanying this book is a Bonus Fonts CD-ROM that contains 38 indie fonts on an unlocked disc located in a sealed package in the back of this book. The fonts are licensed from each contributing foundry for use solely by the owner of this book.</p>
    <p>Websites: <a href="http://www.indie-fonts.com" rel="nofollow">P-Type Publications</a> | <a href="http://www.typeco.com/3Books2.html" rel="nofollow">Typeco</a></p>
    <p>Fonts included on the Bonus Fonts CD with the <em>Indie Fonts 2</em> book:</p>
