    <p>I'd like to help a friend in a design company in Korea. She has told me that there is growing frustration amongst designers in korea caused by 'Korean typeface companies".<br>
    They are sending legal notices to design companies and clients demanding more fees or penalties for 'using their typefaces for<br>
    corporate and brand logos without signing an additional agreement and more fees in accordance to a new rule' that they instilled<br>
    a couple of years ago. This means they are paying an additional fee and sign another licensing agreement if we use it for a logo even if they have the original license for the typeface.</p>
    <p>In addition, they are getting these notices for cases as far back as 6-7 years ago when they didn't have this 'new rule' in place.</p>
    <p>Does anyone know anything about this? I suspect that the EULA's are in Korean, so as a non-speaker i can't get much further.</p>
