    html: |-
      <p>&gt; threads that look like ping pong matches</p>
      <p>I think that looking at the diversity of posters is a good idea. For a while we've been thinking about ways to let some of the better threads float to the top. There is always the option of adding voting systems, etc, but it seems like queries that use intrinsic data that demonstrate interest are going to be better than prompting users for votes.</p>
      <p>There may also be ways to look at number of reads, and how often a diversity of people return to a certain thread.</p>
