      <p>The Miss Tiffany/tiffany disparity comes from how comments are stored in the database. When a comment is authored, the username is stamped in there to make future queries faster. If the user later changes their username, the comment names still show the old username, while the thread names are linked to the user database and change appropriately.</p>
