    html: <p>Ryan, <br>You are close to the idea. Letters are based on screen view of stardart typeface. Initially I was thinking about pseudoitalic typeface, which would be both clearly readable in  small sizes and primitivized, but not 'pixel'. I never use Mac. Uppercase is not so 'compact' but it still preserves the idea. I'll try to post the picture later.</p>
