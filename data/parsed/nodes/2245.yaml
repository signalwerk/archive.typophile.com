    html: <p>Not a specific example, but Smeijers has something to say about it. In the final chapter(s) of <a href="http://www.typophile.com/books/archives/1%20Essentials.html#000011">Counterpunch</a> he includes a call to designers to embrace the particular challenges brought by new technologies. I would add; if it's not type designers who take on these problems, the engineers/technologists surely will. =)</p>
