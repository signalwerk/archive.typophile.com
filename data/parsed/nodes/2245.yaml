    html: <p>Eduardo  Thanks for the links - The Typoteque article is great, kinda sums up nice viewpoint. <br> <br>Hrant, I have looked into stencil lettering, but couldn't find much research on it. I suppose it stems from the army and the most convenient way of labeling. Now that it has become an army brand, do the army use a stencil style digital font to print material? <br> <br>Question time... <br> <br>For <i>Mana</i>, are you using a seperate font containing only the anti-aliasing, to overlay the original? <br> <br>The way that some flash fonts now have a technique for tuned anti-aliasing is quite interesting. <br> <br>Do you think anti-aliasing will always be a user end thing? or do you think this can be developed into the font platform and controlled by the fontographer? or will greater resolution technology catch up before its viable developing further? <br> <br>What were some of the restrictions when designing your Armenian and Arabic fonts? I'm not familier with Armenian, but with reference to <i>Maral</i> what were your influences and limitations? <br> <br> <br>On the topic of anti-aliasing, have you seen Firework MX 2004, with its <a href="http://www.macromedia.com/software/fireworks/productinfo/features/static_tour/antialiasing/index.html#01" target="_blank">System and Custom Anti-Aliasing</a> Whadda ya think? I've played with it a bit, but can't get it as sharp as i would like. It also adjusts the kerning if you anti-alias too heavy. <br> <br>Nic</p>
