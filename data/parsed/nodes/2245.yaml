    html: <p>The 1923 ATF specimen shows four sizes of a typeface called Light Litho Gothic. All four sizes are cast on a 6 point body and the stem weight is less than a quarter point -- lighter even than Lightline Gothic. This sort of thing was only possible in metal after the development of the Benton pantographic punchcutter. <br> <br>-- K. <br></p>
