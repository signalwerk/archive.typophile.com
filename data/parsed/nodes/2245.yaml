  html: <p>Hi there. <br> <br>I'm currently completing a dissertation on typography and how it has been influenced though it's different mediums. <br> <br>I was wondering if anybody has any good stories or things i should research on this. At the moment, these are some of the things i have talked about.. <br> <br><b>Matthew Carter</b>. and how the screen demanded rethinking for typography. (Focussed on Verdana, Georgia) and Bell Centennial for the phone books. <br><i>Does anybody know how i can contact Matthew Carter?</i> <br><b>Zuzana Licko</b> - 'Matrix' for printers, lo-res etc.. the influence of the macintosh, <b>Susan Kare</b> <br> <br>...Movable metal type, Road signage, electronic signage, car number plates, typewriters, outline hinting methods, bitmap methods, printing techniques, cleartype, html.. <br> <br>Has anybody here designed typefaces using any strict restrictions, or had to design type for unusal mediums? If so it would be great if i could ask you a few questions about your designs. <br> <br>Many thanks <br>Nic Mulvaney</p>
  html_clean: <p>Hi there. <br> <br>I'm currently completing a dissertation on typography and how it has been influenced though it's different mediums. <br> <br>I was wondering if anybody has any good stories or things i should research on this. At the moment, these are some of the things i have talked about.. <br> <br><b>Matthew Carter</b>. and how the screen demanded rethinking for typography. (Focussed on Verdana, Georgia) and Bell Centennial for the phone books. <br><i>Does anybody know how i can contact Matthew Carter?</i> <br><b>Zuzana Licko</b> - 'Matrix' for printers, lo-res etc.. the influence of the macintosh, <b>Susan Kare</b> <br> <br>...Movable metal type, Road signage, electronic signage, car number plates, typewriters, outline hinting methods, bitmap methods, printing techniques, cleartype, html.. <br> <br>Has anybody here designed typefaces using any strict restrictions, or had to design type for unusal mediums? If so it would be great if i could ask you a few questions about your designs. <br> <br>Many thanks <br>Nic Mulvaney</p>
