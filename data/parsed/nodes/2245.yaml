    html: "<p>Ultralights: <br> <br>There were a few \"Typositor strip\" ultralights (eg Lightline Gothic), but the present growth in this genre is due to (a) being able to inspect working files at large magnification on monitors, (b) the fact that there is little degradation of image between font and printed job. (In comparison phototype was reproduced 6 or 7 times during the production process.) <br>and (c) It's really easy to make an ultralight font -- just draw a path and apply a stroke value. <br> <br><a href=\"http://www.shinntype.com/Assets/Depts/Essays/SeeLight.pdf\" target=\"_blank\">http://www.shinntype.com/Assets/Depts/Essays/SeeLight.pdf</a> <br> <br>Perhaps the earliest digital ultralight was Helvetica, but Font Bureau were pioneers in this area. Also check out Luc de Groot's new Hairline. Well, we all get older :-)</p>"
    html_clean: "<p>Ultralights: <br> <br>There were a few \"Typositor strip\" ultralights (eg Lightline Gothic), but the present growth in this genre is due to (a) being able to inspect working files at large magnification on monitors, (b) the fact that there is little degradation of image between font and printed job. (In comparison phototype was reproduced 6 or 7 times during the production process.) <br>and (c) It's really easy to make an ultralight font -- just draw a path and apply a stroke value. <br> <br><a href=\"http://www.shinntype.com/Assets/Depts/Essays/SeeLight.pdf\" target=\"_blank\" class=\"link-external\">http://www.shinntype.com/Assets/Depts/Essays/SeeLight.pdf</a> <br> <br>Perhaps the earliest digital ultralight was Helvetica, but Font Bureau were pioneers in this area. Also check out Luc de Groot's new Hairline. Well, we all get older :-)</p>"
