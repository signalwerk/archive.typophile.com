    html: <p>One area you might look at is type design for burned subtitles. This is a technology that uses a laser to burn text onto film, and the laser has to keep moving or you get blobs. A very difficult medium for which to design. If you are interested, I can put you in touch with Thomas Milo at DecoType in the Netherlands, who has addressed the very tricky business of making Arabic type for this technology.</p>
