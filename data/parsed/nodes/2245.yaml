    date: 2003-11-28T18:25:00
    date_raw: 28 Nov 2003 — 6:25pm
    votes: null
    html: "<p>For stencil lettering, check out Eric Kindel (like in Baseline magazine). <br> <br>Mana will be released as an outline font that renders the intended grayscale bitmaps when set at 16 PPEM only. I'll be making a 13 PPEM version of Mana too, and then a fat little 8 PPEM design called Pantagruel. <br> <br>Anti-aliasing (the hand-made stuff) yields a large jump in quality. The only real issue with it is gamma differences between platforms: you have to make different versions of the font. As for higher-res screens, I'll take those seriously when they finally show up en masse... <br> <br>For small Armenian bitmap fonts, the main issue is getting the floating punctuation not to look disasterous. As for Arabic, it really needs a lot of vertical room: 8 pixels (one of which is the talus - internal leading) forced huge structural compromises. <br> <br>The new Flash features seem great, but they're still only as good as the fonts. And the fonts (especially on MacOS) are too blurry when anti-aliased mechanically. You'll never get a \"5\" like that. <br> <br>hhp <br></p>"
    html_clean: "<p>For stencil lettering, check out Eric Kindel (like in Baseline magazine). <br> <br>Mana will be released as an outline font that renders the intended grayscale bitmaps when set at 16 PPEM only. I'll be making a 13 PPEM version of Mana too, and then a fat little 8 PPEM design called Pantagruel. <br> <br>Anti-aliasing (the hand-made stuff) yields a large jump in quality. The only real issue with it is gamma differences between platforms: you have to make different versions of the font. As for higher-res screens, I'll take those seriously when they finally show up en masse... <br> <br>For small Armenian bitmap fonts, the main issue is getting the floating punctuation not to look disasterous. As for Arabic, it really needs a lot of vertical room: 8 pixels (one of which is the talus - internal leading) forced huge structural compromises. <br> <br>The new Flash features seem great, but they're still only as good as the fonts. And the fonts (especially on MacOS) are too blurry when anti-aliased mechanically. You'll never get a \"5\" like that. <br> <br>hhp <br></p>"
