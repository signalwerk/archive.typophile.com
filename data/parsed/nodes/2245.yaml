    html: "<p>When I designed Beaufort, one of its defining features was very sharp serifs. That seemed like a neat idea at the time, something new I could do with PostScript.  <br> <br>In retrospect, the observation arose: nearly all typefaces designed in the digital era could be made using prior technology.  <br> <br>Relatedly, Zuzana Licko had commented, re Oblong, that reductionists of the early modern (eg Bauhaus) era could have made similar designs, but it wouldn't have occured to them. <br> <br>*** <br> <br>One of the biggest revolutions in typography happened in the early 19th century, when commercial \"jobbing\" typography (eg handbills) took off, and new genres such as fat face, shaded, 3d, Egyptian etc emerged. Prior to that typography was bookish and conservative. Pardon the sweeping generalizations! <br> <br>There are a few paragraphs in Typographia (Hansard, 1825?) where he alludes to this, eg p. 355. </p>"
    html_clean: "<p>When I designed Beaufort, one of its defining features was very sharp serifs. That seemed like a neat idea at the time, something new I could do with PostScript.  <br> <br>In retrospect, the observation arose: nearly all typefaces designed in the digital era could be made using prior technology.  <br> <br>Relatedly, Zuzana Licko had commented, re Oblong, that reductionists of the early modern (eg Bauhaus) era could have made similar designs, but it wouldn't have occured to them. <br> <br>*** <br> <br>One of the biggest revolutions in typography happened in the early 19th century, when commercial \"jobbing\" typography (eg handbills) took off, and new genres such as fat face, shaded, 3d, Egyptian etc emerged. Prior to that typography was bookish and conservative. Pardon the sweeping generalizations! <br> <br>There are a few paragraphs in Typographia (Hansard, 1825?) where he alludes to this, eg p. 355. </p>"
