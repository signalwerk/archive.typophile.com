    html: <p><b>1</b> <br>Erik Spiekermann once described how the rounded corners of a custom face for the <a href="http://www.typophile.com/contentbkgrnd/8.jpg">Berlin transportation system</a> saved them truckloads of production time. (I can't recall how much time or even the name of the font, but I remember it helped the transportation people meet their deadline.) <br> <br>Essentially, the letters were to be cut out of vinyl sheets. Each individual cut for a given glyph would take time to setup and make. By designing rounded corners most glyphs could be reduced to one or two cuts. (A v, for example, with square terminals would take 6 cuts. With rounded terminals and corners it would only require a single cut. The characters with counters or dots would require only 2 or 3 cuts.) <br> <br>Sorry if I don't have all the facts in tidy order, but that's the gist of it. You can <a href="http://www.typophile.com/contentbkgrnd/8.jpg">see a photo here</a>. Note, the BVG is the face in question. The other faces in the family do not all have rounded corners. <br> <br><b>2</b> <br>A font for Qualcomm's Brew platform (a mobile device operating system) are represented in a single bitmap. A wider font requires a larger bitmap -- larger in dimensions and thus file size. The speed of the interface is directly tied to how big the font is and therefore, how wide the actual alphabet is. So, while a wider font may be more readable on these devices, one has to consider the trade offs to make so that the interface speed is acceptible. <br> <br>(Jared worked on the project. Jared, do you recall if this was the Brew platform as a whole or for specific devices only?)</p>
