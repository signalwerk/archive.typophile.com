    html: "<p>Kyle, try this: <br> <br>Draw a square 1\" <br>Cmd+Shift+M (Ctrl+Shift+M) <br>Enter 1.1in in the Horizontal field (0 in other fields) <br>Press Copy <br>Press Cmd+D(Ctrl+D) for as many as you need horizontally <br>Now select all your boxes <br>Cmd+Shift+M (Ctrl+Shift+M) again <br>Enter 1.1in in the vertical field (0 in other fields) (copies upward -1.1in would copy downward) <br>Press Copy <br>Press Cmd+D(Ctrl+D) for as many as you need vertically <br> <br>Hope this helps. <br> <br>I suppose you could make a pattern tile and tile the area but I hardly ever do this so I can't remember how. <br> <br>Jon</p>"
    html_clean: "<p>Kyle, try this: <br> <br>Draw a square 1\" <br>Cmd+Shift+M (Ctrl+Shift+M) <br>Enter 1.1in in the Horizontal field (0 in other fields) <br>Press Copy <br>Press Cmd+D(Ctrl+D) for as many as you need horizontally <br>Now select all your boxes <br>Cmd+Shift+M (Ctrl+Shift+M) again <br>Enter 1.1in in the vertical field (0 in other fields) (copies upward -1.1in would copy downward) <br>Press Copy <br>Press Cmd+D(Ctrl+D) for as many as you need vertically <br> <br>Hope this helps. <br> <br>I suppose you could make a pattern tile and tile the area but I hardly ever do this so I can't remember how. <br> <br>Jon</p>"
