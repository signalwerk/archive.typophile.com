  html: <p>Ok, lets say I want to produce a huge grid of squares all at say 1", and a gap between each of say .1" -- whats the best way to go about this, so I can have it percise. I really dont want to have to duplicate these all by hand, not to mention I need them to be percise. <br> <br>Ideas?</p>
