      <p>The fonts need to be modified (or “fixed” from some points of view, including mine). You should contact the foundry you got them from to see if they have style-linked versions of the fonts available. If not, inquire as to whether you can make such modifications yourself, under their license terms.</p>
      <p>Good luck!</p>
      <p>T</p>
