    html: <p>You  need the  FFIL file (the printer font --LWFN; the screen font -- FFIL)</p>
    html_clean: <p>You  need the  FFIL file (the printer font --LWFN; the screen font -- FFIL)</p>
  - id: 253530
    user: 26256
    date: 2008-01-23T11:32:00
    date_raw: 23.Jan.2008 11.32am
    votes: null
    html: <p>I have other LWFN fonts load up fine. Do you know where the FFIL fonts are stored? It seams more like the data fork got corrupted when the fonts got burned on a CD or transfered via e-mail or ftp. Just not sure how to get around that.</p>
    html_clean: <p>I have other LWFN fonts load up fine. Do you know where the FFIL fonts are stored? It seams more like the data fork got corrupted when the fonts got burned on a CD or transfered via e-mail or ftp. Just not sure how to get around that.</p>
  - id: 253534
    user: 108
    date: 2008-01-23T11:49:00
    date_raw: 23.Jan.2008 11.49am
    votes: null
    html: <p>If the fonts were  ever sent via ftp or email and were saved as a .zip archive chances are the files were stripped of the dataforks. Your best bet would be to either have them send you a .sit archive of the same fonts or contact the foundry from which they were licensed for you to use and ask for a new copy.</p>
