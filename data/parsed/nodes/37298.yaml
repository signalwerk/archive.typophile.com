    <p>Hello Everyone,</p>
    <p>I am creating a logo for a neighborhood. This is not an official state or city entity, but the logo will be used by an small business association to advertise various neighborhood events sponsored by local businesses. Mt. Airy is well known for being a diverse community with a lot of emphasis on progressive politics (its where the hippies live).In short I am looking to create something casual, fun, &amp; contemporary (but definitely not corporate.)</p>
    <p>1. I am looking for input on the sketches below<br>
    2. I am looking for typefaces to inspire and inform the characteristics of the letter forms in the logo (as the logo will usually appear alongside the name of various events).</p>
    <p>So far I  been looking at the likes of Cheltenham, ITC Grouch, Bernhard Antiqua, they feel not quite contemporary enough, was considering Los Feliz from Emigre for a more up to date look...any other suggestions?</p>
    <p>Thanks! Malcolm.</p>
    <p></p><div class="imageWrap"><img src="/web/20080705152842im_/http://www.typophile.com/files/mtairy06_5691.gif"></div><p></p>
