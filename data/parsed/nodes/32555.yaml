      <p>Well, I don't mean to be rude what so ever....but you might want to brush up on your writing skills.  Not that you need them in order to design graphics, but I also had a hard time deciphering what exactly you were asking.  If salary is most important to you coming straight out of college--you will most likely not be getting a design job right away, and will need some writing/speech/interpersonal skills for a temporary job.  </p>
      <p>Reality is, yes, graphic design is a very hard field to get into, and VERY competitive.  I mean, it is important to have a degree from an accredited program, but that's worth almost nothing without a SOLID portfolio and legit experience.  It's almost impossible to get a legit job in design right out of school, unless you've already interned during school and what not.  What's your internship experience?  Here's a good website showing you how to really make your portfolio stand out from all your other competitors:  <a href="http://www.youthedesigner.com/2008/06/30/12-steps-to-a-super-graphic-design-portfolio/" title="http://www.youthedesigner.com/2008/06/30/12-steps-to-a-super-graphic-design-portfolio/">http://www.youthedesigner.com/2008/06/30/12-steps-to-a-super-graphic-des...</a>  </p>
      <p>So, also a lot of designers start off freelancing to have some small side jobs on their own if they can't go under the wing of a bigger company.  If you're new to freelancing, it's pretty much just running your own business, getting clients and tailoring your work to their needs...which also involves the work of taxation: <a href="http://www.anti9to5guide.com/2006/10/27/freelance-tax-faq/" title="http://www.anti9to5guide.com/2006/10/27/freelance-tax-faq/">http://www.anti9to5guide.com/2006/10/27/freelance-tax-faq/</a> some faq's to help guide you through that process.  But in order to actually establish, you need to actually be GOOD at marketing yourself.  You can try out <a href="http://www.marketingdegree.net/" title="http://www.marketingdegree.net/">http://www.marketingdegree.net/</a> to see what marketing is all about and how to build relationships with your clients--this is the ultimate root of all your business.</p>
      <p>Good luck.</p>
