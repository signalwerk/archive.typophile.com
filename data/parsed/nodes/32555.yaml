      <p>Well, this is really a personal question. The answer depends on 1) how much money you want, 2) how much money you really need, 3) how much a specific market pays entry-level designers in general, and 4) how much the studios that hire you themselves are willing to pay.</p>
      <p>Some studios are small (and mean?) and will just pay you a tad over minimum wage. I guess you could hit the jackpot, too. Back in the days of the internet bubble, I heard an urban legend about a recent grad from my school who got 72K right away… those were the days ;-)</p>
      <p>I don't mean to be morose, but the probable answer to your question is: just enough. Whatever that means. Entry-level salaries are rarely "great"…</p>
