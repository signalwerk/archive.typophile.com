      <p>I'm not sure what you are asking, here. Are you asking if you will earn enough money to live in the San Francisco area? Or are you asking whether or not it is true that local design studios tend to favor graduates from local "star power" art schools—like CCA and Art Center in this case—over anyone else?</p>
      <p>I can't vouch for SF myself; I've never worked or lived there. But in my experience, every market has a range of studios willing to pay a range of salaries. Some of them pay better than others. It is possible to make more than 40K, too, but you'd probably have to work mad overtime for that. Will you earn enough to live in SF? That depends on who hires you, in the end…</p>
      <p>Local art schools do tend to dominate their geographic areas. Its a head and reputation thing really. It is never impossible for graduates from other schools to get work in those markets; employers just often think that they are "better"… maybe because they went to those schools themselves, have worked with people who have, or just believe the hype. The art schools also have big alumni and referral networks, which makes it easier to get a job in some places if you can fit in that picture.</p>
      <p>Every market has its own "favorite" schools. But if you write a killer cover letter, have a good resume, and a good portfolio, you'll get interviews at great places, too.</p>
