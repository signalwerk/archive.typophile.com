    <p>I'm about to graduate from a public university with a degree in g.d. I went to school in Georgia for my undergrad before transferring to the bay area. I will be living in the bay area and employers I hear generally look for a b.fa degree as opposed to our school's b.a. degree- which only has an emphasis in g.d. I do have that degree as well as I completed it upon passing a portfolio review for the b.f.a.</p>
    <p>Friends say not to take less than 35/40k a year at minimum because of our skill level.</p>
    <p>The bay area is full of shitty designers, and where the good ones come in, there is a lot of hard competition- mostly from California College of the Arts and Art Center. I can't compete. Of course  I know that the portfolio I have matters in the end, but is there a place to draw the line and just say, "No - that's not enough?". </p>
    <p>what amount is realistic?</p>
