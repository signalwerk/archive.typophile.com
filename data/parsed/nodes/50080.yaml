    <p>As a bit of light relief from all this intellectual discussion - Here’s a set of photos taken recently in California. As a Brit these signs are just so glamourous, they say ’America’- you don’t get vertical signs like that over here. So much work goes into making them, but I suspect they’re fast disappearing, being replaced by soulless laser-cut vinyl. As you can see some of them are a bit battered and rusted. They should be preserved but will probably end up in a skip. I drove past lots of fantastic examples, but couldn’t be stopping every five minutes. I wish I had had much more time to photograph many more, but captured as many as possible. I’ll be back, as The Governator would say. Hope you like them.</p>
    <p><a href="https://web.archive.org/web/20081121162352/http://www.flickr.com/photos/30758026@N02/sets/72157607664316638/">Signage photos</a></p>
