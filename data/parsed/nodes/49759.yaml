    html: |-
      <p>I was going to say <a class="freelinking-external" href="http://www.josbuivenga.demon.nl/museo.html">Museo</a> (by Jos Buivenga), but then I read the line where you specify the industry and thought better of it. I would recommend you look a Buivenga’s other typefaces, like the <a class="freelinking-external" href="http://www.josbuivenga.demon.nl/fontin.html">Fontin</a> <a class="freelinking-external" href="http://www.josbuivenga.demon.nl/fontinsans.html">family</a>. That family provides enough variety to set the entire page.</p>
      <p>For a cleaner, friendly and pretty economical sans, check out <a class="freelinking-external" href="http://www.garagefonts.com/typespecimens_2.html?sku=GF095002X1P2&amp;start=1">District</a> (by GarageFonts) or <a class="freelinking-external" href="http://www.josbuivenga.demon.nl/delicious.html">Delicious</a> (also by Buivenga). Also take a look at Yanone’s <a class="freelinking-external" href="http://www.yanone.de/typedesign/kaffeesatz/">Kaffeesatz</a>.</p>
