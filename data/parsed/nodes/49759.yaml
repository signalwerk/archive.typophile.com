    <p>Hi,</p>
    <p>I am designing a cover letter for our catalogue that we are about to mail out. The cover letter is basically the address of the customer we are shipping to, plus some sales information about what is in the new catalogue. I want to lay it out with 4-6 boxes which have a headline like “New lower prices!” or “Great new freight rates” and a few words below those headlines that say “see page xx for details” or “Range XYZ page 55, range ABC, page 66” etc.</p>
    <p>I’m searching for fonts that I can use for the headline statements and the information below it. Something that says new and exciting and has a modern feel to it.</p>
    <p>The catalogue is for a wholesaler of organic and eco products.</p>
    <p>Any suggestions would be appreciated.</p>
    <p>Thanks,</p>
    <p>Jason</p>
