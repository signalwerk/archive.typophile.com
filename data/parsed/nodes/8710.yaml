    html: <p> I wouldn't mind seeing the apex of the lc "s" overshoot the x-height by a pixel as well. That might help it stand apart from the lc "a" and "o". <br> <br>Aside from this (and Gregory, Hrant and Joe's suggestions), it's a very interesting face, and I agree with Joe that it has great potential. It reminds me pleasantly of the old whimsical script-mimicking typewriter fonts, from the daisywheel and ball typewriter days. <br> <br>Very nice work! Keep it up! <br> <br>David </p>
