    <p>Hello,<br>
    my first post here.</p>
    <p>I have a problem that I don't think I have had before and I need help solving it. I can't find the problem on the web.</p>
    <p>When I copy my glyphs from Illustrator and paste them into FLS the shapes transforms from smooth rounded corners into just cornered. In Illustrator the anchor points is set to smooth. Why do FLS change my anchor points?</p>
    <p>My English is to limited to explain the problem. Please see the attached images.<br>
    The black and grey image is in Illustrator and the white image with a black line is in FLS.</p>
    <p>/<br>
    Theapbo</p>
