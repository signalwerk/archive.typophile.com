    html: <p>Thanks everyone. Since it appears this was most likely hand-lettered after all, I decided to cut my losses looking any further on the font front. Just went ahead and started with Dom Casual Bold, then hand-modified it to match fairly closely. Redrew W, C, e, and  a from scratch, for the rest I modified the Dom glyphs. Could have spent more time redrawing new glyphs, such as the lowercase s and maybe v as well, but felt I’d put in enough time by that point and decided to call it good. (Has to match pretty closely, but perfectly exact not a requirement.) Appreciate the input!</p>
