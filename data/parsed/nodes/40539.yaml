    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 3.Jan.2008 5.28pm </div>
      <p>The TDC deadlines for TDC54 (typographic design) and TDC22008<br>
    (typeface design) have been extended to Friday 11 January 2008.</p>
    <p>Entries need to be in New York by that date.<br>
    Type designs can be PDF’d and uploaded using the TDC competition<br>
    registration forms at</p>
    <p>which can also be used to register for the TDC54 competition<br>
    (physical entries are required, though).</p>
    <p>  Competition rules and guidelines can be found at</p>
    <p>Happy New Year, good luck and thank you!</p>
    <p>—<br>
    Gary Munch<br>
    Postmaster, Webmaster, Chairman<br>
    Type Directors Club</p>
