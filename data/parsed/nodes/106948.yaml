      <p>@ R.: You’re right =)<br>
      I was confusing the tags of FF DIN in MyFonts with possible classifications (my bad) … so there <strong>is</strong> something between humanist and geometric, that’s fascinating, i’ve seen myself confronted with a choice between those two. Unfortunately my teacher was a little old school, so he only taught us the <a class="freelinking external" href="http://de.wikipedia.org/wiki/DIN_16518" rel="nofollow">DIN 16518</a> classification, according to which the font would simply be called group 6: sans serif linear antiqua (Gruppe VI: Serifenlose Linear-Antiqua in german).<br>
      Would it be silly to ask you about a more adequate system to classify fonts (may be with a source of some kind)?</p>
