    html: <p>According to Wikipedia, FF DIN is (also) classified as a <a href="http://en.wikipedia.org/wiki/FF_DIN" rel="nofollow">realist sans</a>. This type of sans-serif falls somewhere in between humanist and geometric sans-serif typefaces. The humanist sans shows strong influences of handwriting, so there is considerable stroke contrast, and the glyph shapes are based on those of Venetian or Garalde old-style typefaces.  <a href="http://www.fontshop.com/fonts/downloads/linotype/optima_pro_roman/ot_ps?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=60&amp;sample_text=GKMQabeltuy&amp;ft=liga" rel="nofollow">Optima</a> is one of the best known humanist sans-serif typefaces. The geometric sans, by contrast, relies heavily on “geometric shapes, like near-perfect circle and square” (Wikipedia), i.e. the letters are rather constructed than handwritten, and display little stroke contrast. <a href="http://www.fontshop.com/fonts/singles/linotype/futura_pro_book/opentype_cff/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=60&amp;sample_text=GKMQabeltuy&amp;ft=liga&amp;acs_pt=32" rel="nofollow">Futura</a> is a prime example of that. FF DIN and your work are not quite as rigid as that, but also straighter in appearance than a humanist sans, so that’s why I’d call them realist (or neo-grotesque, an alternative term if you like that better ;).</p>
    html_clean: <p>According to Wikipedia, FF DIN is (also) classified as a <a href="http://en.wikipedia.org/wiki/FF_DIN" rel="nofollow" class="link-external">realist sans</a>. This type of sans-serif falls somewhere in between humanist and geometric sans-serif typefaces. The humanist sans shows strong influences of handwriting, so there is considerable stroke contrast, and the glyph shapes are based on those of Venetian or Garalde old-style typefaces.  <a href="http://www.fontshop.com/fonts/downloads/linotype/optima_pro_roman/ot_ps?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=60&amp;sample_text=GKMQabeltuy&amp;ft=liga" rel="nofollow" class="link-external">Optima</a> is one of the best known humanist sans-serif typefaces. The geometric sans, by contrast, relies heavily on “geometric shapes, like near-perfect circle and square” (Wikipedia), i.e. the letters are rather constructed than handwritten, and display little stroke contrast. <a href="http://www.fontshop.com/fonts/singles/linotype/futura_pro_book/opentype_cff/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=60&amp;sample_text=GKMQabeltuy&amp;ft=liga&amp;acs_pt=32" rel="nofollow" class="link-external">Futura</a> is a prime example of that. FF DIN and your work are not quite as rigid as that, but also straighter in appearance than a humanist sans, so that’s why I’d call them realist (or neo-grotesque, an alternative term if you like that better ;).</p>
