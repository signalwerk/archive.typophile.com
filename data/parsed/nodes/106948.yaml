      <p>Alas I am not an expert on font classification, but I know that Indra Kupferschmid is (she is also a <a href="http://typophile.com/user/20494" rel="nofollow">Typophile member</a>). On her <a href="http://kupferschrift.de/cms/tag/classification/" rel="nofollow">blog</a> she has published a number of posts about various classification systems (some in German, but that doesn’t seem to be a problem for you). I have not read all of them, but she probably also makes mention of the <a href="http://en.wikipedia.org/wiki/Vox-ATypI_classification" rel="nofollow">Vox-ATypI classification</a> according to which FF DIN would be a neo-grotesque (or a realist sans). I like that one.</p>
      <p>And by the way: good look with your first typeface! :)</p>
