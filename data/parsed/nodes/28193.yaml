    <p>I’m completely befuddled. Why is Horley absolutely never used?<br>
    <a href="http://www.myfonts.com/fonts/linotype/horley-old-style/" title="http://www.myfonts.com/fonts/linotype/horley-old-style/">http://www.myfonts.com/fonts/linotype/horley-old-style/</a></p>
    <p>At least I’d never heard about it before (I stumbled on it while searching for “Garalde” in Google) although I think it has some very worthwhile attributes; like look at that “g”! And the judicious vertical proportions. It was made by Pierport, and that immediately suggests to me that Morison was the cause of its persistent obscurity. For one thing, they could have just used that (at most having to make a short-extender version) instead of dreaming up Times New Roman! Amazing.</p>
    <p>hhp</p>
