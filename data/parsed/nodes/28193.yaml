      <p>Yes, it was an imitation of Goudy’s work, which was beginning to gain some popularity in Britain at the time. Horley is a small town near to the Monotype works.</p>
      <p><em>But it’s much less wonky and pokey.</em></p>
      <p>As Tobias Frere-Jones said of Horley when he and Mike Parker and I were talking about it some years ago: it lacks Goudy’s ’wandering lumpiness’.</p>
