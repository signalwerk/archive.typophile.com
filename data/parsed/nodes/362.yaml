  html: "<p>So, I just got my Eye 43. What of The Foundry's new  <br>Sterling? True to their ritual of catching trends a year or <br>two late, Quay and Sack now mimic Takard's Bliss.  <br>Funny to see a Tankard ad just 2 pages later. A pity  <br>it's for the new Shaker weights or one could have in  <br>their lap a handy printed comparison of Bliss/Sterling.  <br> <br>First note: The Foundry's brit face is missing that  <br>adorable tailed lc 'l'. <br> <br>Sterling: <a href=\"http://www.thefoundrystudio.co.uk/sterlingpreview.html\" target=\"_top\">http://www.thefoundrystudio.co.uk/sterlingpreview.html</a> <br> <br>Bliss: <a href=\"http://www.typography.net/type/bliss.htm\" target=\"_top\">http://www.typography.net/type/bliss.htm</a> <br> <br>Stephen</p>"
