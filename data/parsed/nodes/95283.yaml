    html: |-
      <p>Via the terminal, you can use atsutil to clear system font caches for the current user:<br>
      <code>atsutil databases -removeUser</code></p>
      <p>Or for all users and the system:<br>
      <code>sudo atsutil databases -remove</code></p>
      <p>Then shutdown and restart ATSServer:<br>
      <code>atsutil databases -shutdown<br>
      atsutil databases -ping</code><br>
      </p>
      <p>Illustrator's font cache is stored at:<br>
      <code>~/Library/Application Support/Adobe/Adobe Illustrator CS[x]/en_US/IllustratorFnt.lst</code></p>
      <p>Also, the maintenance utility <a class="freelinking external" href="https://web.archive.org/web/20150131143915/http://www.titanium.free.fr/download.php" rel="nofollow">Onyx</a> has been updated for Mountain Lion. The font options are found under Cleaning &gt; Fonts.</p>
