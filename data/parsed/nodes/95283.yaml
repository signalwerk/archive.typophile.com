  html: |-
    <p>I just realized my version of Font Nuke is not compatible with OS X Mountain Lion.</p>
    <p>Is there a way to manually clear font caches? I have an older version of FontExplorer that really doesn't work for clearing either Application or System caches. I really just need those for Adobe Illustrator cleared for the moment. </p>
    <p>Is there an easy way to clear font caches using Terminal? Does it require restart?</p>
    <p>I'm not sure when FontNuke will release a compatible version.</p>
    <p>Please advise.</p>
    <p>Thanks.</p>
