    html: |-
      <p>I wouldn’t do it, as I wouldn’t when text is on the recto and the verso is blank.<br>
      An exception would be if the page contains something not directly related to the text (a list of other books in the same collection, for example).<br>
      Also remember to account the folding when calculating the inner margin: more pages wider margin.</p>
