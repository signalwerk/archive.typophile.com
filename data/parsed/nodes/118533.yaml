  html: |-
    <p>If I look at the size and placement of a text block for more traditional books, I always end up with approximations of this:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/194_3841.jpg"></div><p></p>
    <p>This is in harmony to the page, the spread, and well balanced.</p>
    <p>Now my question is: what about the last page when the text block happens to be placed on a verso and the recto empty? Would I move the text block a little more into the middle of the page, because a balancing text block on the verso is missing? How is this handled traditionally?</p>
