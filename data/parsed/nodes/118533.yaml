    votes: null
    html: <p>Agreed, you should design the book as a whole and not design it as a series of spreads. If you made the end spread different, it might look right by itself, but would look off when viewed in context with the rest of the book.</p>
    html_clean: <p>Agreed, you should design the book as a whole and not design it as a series of spreads. If you made the end spread different, it might look right by itself, but would look off when viewed in context with the rest of the book.</p>
