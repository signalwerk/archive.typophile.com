      <div class="comment-spam-body"><p>At least some are William Page Chromatic [multicolor] fonts dating from around the 1860s and 1870s.<br>
      As Nick says, these were usually identified by number. However, in later years some were given names, particularly when metal type versions were released.<br>
      Some of these might match your mystery fonts <a href="https://www.myfonts.com/person/William_Hamilton_Page/" title="https://www.myfonts.com/person/William_Hamilton_Page/">https://www.myfonts.com/person/William_Hamilton_Page/</a><br>
      Don</p>
      </div>
