    <p>Closest I've come is <a href="http://www.myfonts.com/fonts/paratype/blackgroteskatt/" rel="nofollow">Black Grotesk</a>, stretched. It's close, but not quite there. The font blurb mentions that Black Grotesk is based on Gasetny Chorny (Ossip Lehmann foundry) and Kompakte Grotesk (Haas).</p>
