    <p><strong><a href="/node/12010" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Indices</a> : <a href="/node/17745" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Designers</a> : Chris Lozos</strong></p>
    <p>Chris Lozos began life as a lover of <a href="/node/120111" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">letters</a>. As a teenager, he earned pocket money lettering mail boxes and trucks. He studied Design at <a href="/search/node/Carnegie%2BMellon%2BUniversity" title="Search this site for content like &quot;Carnegie+Mellon+University&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Carnegie+Mellon+University</a> (called Carnegie Institute of Technology at the time) where he earned a BFA in <a href="/search/node/Graphic%2BDesign" title="Search this site for content like &quot;Graphic+Design&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Graphic+Design</a>. While at CMU, he studied with <a href="/node/59309" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">calligrapher</a> <a href="/search/node/Arnold%2BBank" title="Search this site for content like &quot;Arnold+Bank&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Arnold+Bank</a> who brought out a love of historic letterforms, learned to set <a href="/node/81704" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Hot metal</a> type in the Laboratory Press established there by <a href="/search/node/Jack%2BStauffacher" title="Search this site for content like &quot;Jack+Stauffacher&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Jack+Stauffacher</a>. Chris also was influenced by guest professors <a href="/node/10674" title="" class="freelink freelink-nodetitle freelink-internal" rel="nofollow">Hermann Zapf</a>, Rudy DeHarek, Martin Krampen and Gui Bonnsieppe (of the HfG Ulm). His greatest influence was typography proffessor Ken Hiebert, a student of <a href="/search/node/Emil%2BRuder" title="Search this site for content like &quot;Emil+Ruder&quot;" class="freelink freelink-search notfound freelink-internal" rel="nofollow">Emil+Ruder</a>.<br>
    After several decades of practicing graphic design, Chris renewed his affair with letter forms and began to design typefaces. In the past 2 years, he has designed type families, Leporello, Align, <a href="http://dezcom.com/typefaces/nowsans/" rel="nofollow">Now Sans</a>, <a href="http://dezcom.com/typefaces/weimarplakat/" rel="nofollow">Weimar Plakat 1923 Pro</a>, <a href="http://dezcom.com/typefaces/squeeze/" rel="nofollow">Dez Squeeze</a>, Chrishand, <a href="http://dezcom.com/typefaces/froggy/" rel="nofollow">Froggy</a>, <a href="http://dezcom.com/typefaces/boulder/" rel="nofollow">Boulder</a>, Backhand, Forehand, Dez HeadsUp, Dez SuperEgo <a href="http://dezcom.com/typefaces/tovarich/" rel="nofollow">Dez Tovarich</a>, and Petroula and hopes to be releasing them soon for distribution.<br>
    Chris abhors puns.</p>
