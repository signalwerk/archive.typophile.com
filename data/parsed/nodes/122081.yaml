      <p>Hmm. A calligraphic Optima. There doesn't seem to be anything wrong with the Cyrillic characters.</p>
      <p>I see the original version did not have the flare serifs characteristic of the current Cyrillic.</p>
      <p>As for your Greek, the only unusual thing is the capital Omega that looks like an underscored O.</p>
