  html: |-
    <p>I've expanded my <a href="http://typophile.com/node/120859" title="Click to visit an external URL." class="freelink freelink-external freelink-external">current project</a> to include the first draft of the Cyrillic character set.  I would welcome any feedback and suggestions for improvement.</p>
    <p>A few of the glyphs are identical to the equivalent Latin forms (which, I understand, is perfectly acceptable) but, as with the <a href="http://typophile.com/node/121394" title="Click to visit an external URL." class="freelink freelink-external freelink-external">recently added Greek character set</a>, I've avoided bolting together segments from existing Latin glyphs to create a new Cyrillic one.</p>
    <p>The first link shows a small sample text in Cyrillic; the second is the full character set from this font thus far, including Latin, Greek and Cyrillic (but not including small caps, alts etc).</p>
    <p><a href="http://freepdfhosting.com/2eb0b8d24d.pdf">http://freepdfhosting.com/2eb0b8d24d.pdf</a></p>
    <p><a href="http://freepdfhosting.com/c934899649.pdf">http://freepdfhosting.com/c934899649.pdf</a></p>
    <p>Thanks in advance!</p>
