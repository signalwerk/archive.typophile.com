      <p>Hi John, I think you probably saw an older version of the Greek character set; the underscored /Omega/ has since been replaced with a more conventional form.  The underscored style will be retained as an alt.</p>
      <p>As for the flare serifs, this internal inconsistency was not intentional and has been corrected.</p>
      <p><a href="http://freepdfhosting.com/1eb695813c.pdf" title="http://freepdfhosting.com/1eb695813c.pdf">http://freepdfhosting.com/1eb695813c.pdf</a></p>
