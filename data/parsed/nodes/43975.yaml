      <p>For the serif: <a href="http://www.suitcasetype.com/index.php?lmut=en&amp;part=fonts&amp;font=9" rel="nofollow">Dederon</a> is similar to Dolly and has a lot of characters, but still, it unfortunately doesn’t support cyrillic.<br>
      <a href="http://www.typotheque.com/site/fonts.php?id=6" rel="nofollow">Fedra Serif</a> does, but it isn’t very similar. Just sharing a little bit of Dutch flavour.</p>
