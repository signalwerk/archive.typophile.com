      <p>More not-so-usual serif typefaces with cyrillic characterset: <a href="http://www.stormtype.com/typefaces-fonts-shop/families-86-anselm-serif-pro" rel="nofollow">Anselm Serif</a>, <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_quadraat_cyrillic/" rel="nofollow">Quadraat</a>, <a href="http://www.paratype.com/pstore/default.asp?fcode=PT_SWF" rel="nofollow">Swift</a>, <a href="http://www.paratype.com/pstore/default.asp?fcode=PT_RLG" rel="nofollow">Raleigh</a>, <a href="http://www.adobe.com/type/browser/P/P_1709.html" rel="nofollow">Warnock</a>, <a href="http://www.paratype.com/pstore/default.asp?fcode=PT_OCT" rel="nofollow">Octava</a>, <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_maiola_cyrillic/" rel="nofollow">Maiola</a>.</p>
      <p>For the techy one: <a href="http://www.stormtype.com/typefaces-fonts-shop/families-15-etelka" rel="nofollow">Etelka</a>, maybe? <a href="http://www.myfonts.com/fonts/ascender/consolas/" rel="nofollow">Consolas</a>, <a href="http://www.fontshop.com/fonts/singles/paratype/ocr_one_regular_cyrillic/" rel="nofollow">OCR One</a>?</p>
