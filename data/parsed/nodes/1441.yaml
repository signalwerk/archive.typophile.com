  html: <p>I'm digitizing a client's hand-lettering. Is there any sure-fire way of giving the font a unique font ID number? Fontographer assigned it the same font ID as Futura Light Italic (I was generating font files using the "Easy" mode). When I took the font to another computer and double-clicked the screen font icons inside the font's suitcase, the previews showed up as Futura Light Italic! <br> <br>I know this is a very minor thing, but when I give my client the font files, I would like him to see his own hand-lettering in the preview window... BTW, this is to be a proprietary font, not a commercially released font (the FOG manual recommends getting a unique font ID number from Adobe for the latter). <br> <br>Any help on this would be appreciated. <br></p>
  html_clean: <p>I'm digitizing a client's hand-lettering. Is there any sure-fire way of giving the font a unique font ID number? Fontographer assigned it the same font ID as Futura Light Italic (I was generating font files using the "Easy" mode). When I took the font to another computer and double-clicked the screen font icons inside the font's suitcase, the previews showed up as Futura Light Italic! <br> <br>I know this is a very minor thing, but when I give my client the font files, I would like him to see his own hand-lettering in the preview window... BTW, this is to be a proprietary font, not a commercially released font (the FOG manual recommends getting a unique font ID number from Adobe for the latter). <br> <br>Any help on this would be appreciated. <br></p>
