    html: "<p>There are two different numbers that may be in play: Apple's suitcase FOND IDs, and Adobe's Type 1 UniqueIDs. <br> <br>Adobe does not believe UniqueIDs are still important in this day and age; you can leave them out. <br> <br>FOND IDs are required for suitcase-based formats, and the range the number falls into determines what the OS thinks the script of the font is (e.g. MacRoman, Cyrillic, etc.). However, the OS automatically resolves conflicts so the specific number is no longer important. <br> <br>Regards, <br> <br>T</p>"
