  html: <p>I’m digitizing a client’s hand-lettering. Is there any sure-ﬁre way of giving the font a unique font <span class="caps">ID</span> number? Fontographer assigned it the same font <span class="caps">ID</span> as Futura Light Italic (I was generating font ﬁles using the “Easy” mode). When I took the font to another computer and double-clicked the screen font icons inside the font’s suitcase, the previews showed up as Futura Light Italic! <br><br>I know this is a very minor thing, but when I give my client the font ﬁles, I would like him to see his own hand-lettering in the preview window… <span class="caps">BTW</span>, this is to be a proprietary font, not a commercially released font (the <span class="caps">FOG</span> manual recommends getting a unique font <span class="caps">ID</span> number from Adobe for the latter). <br><br>Any help on this would be appreciated. <br></p>
  html_clean: <p>I’m digitizing a client’s hand-lettering. Is there any sure-ﬁre way of giving the font a unique font <span class="caps">ID</span> number? Fontographer assigned it the same font <span class="caps">ID</span> as Futura Light Italic (I was generating font ﬁles using the “Easy” mode). When I took the font to another computer and double-clicked the screen font icons inside the font’s suitcase, the previews showed up as Futura Light Italic! <br><br>I know this is a very minor thing, but when I give my client the font ﬁles, I would like him to see his own hand-lettering in the preview window… <span class="caps">BTW</span>, this is to be a proprietary font, not a commercially released font (the <span class="caps">FOG</span> manual recommends getting a unique font <span class="caps">ID</span> number from Adobe for the latter). <br><br>Any help on this would be appreciated. <br></p>
