    html: "<p>Any number you pick will conflict with some existing font somewhere. According to a technote on Apple's developer site: <br> <br>\"As of late 1990, all free font family IDs had been registered, so any new font families created after that time must share their ID with a registered family; Developer Technical Support no longer registers family IDs.\" <br> <br>For the whole document, which should answer all your questions, see <a href=\"http://developer.apple.com/technotes/te/te_02.html\" target=\"_blank\">http://developer.apple.com/technotes/te/te_02.html</a></p>"
