    date: 2003-09-28T13:26:00
    date_raw: 28 September 2003 - 1:26pm
    votes: 0
    html: <p>Well, as it says on that page, applications shouldn’t be using font <span class="caps">ID</span>s anyway. They should be using font names. Font <span class="caps">ID</span>s are only supposed to be used by the system for keeping track of fonts internally. The system is supposed to assign an unused <span class="caps">ID</span> when there is a conﬂict.  <br><br>Nevertheless, I have seen conﬂicts such as you describe occassionally. I think it depends on how the fonts are installed and there may be some ambiguous situations, such as when you preview an uninstalled font in a font managment utility (Font Reserve, Suitcase). <br><br>My suggestion would be to choose a diﬀerent number. Higher numbers, I think, would be less likely to conﬂict with an installed font, but you will have to experiment to be sure.  <br><br>(Whatever you do, don’t use a font <span class="caps">ID</span> higher than 16382 for latin fonts. The font may be interpreted as non-roman (Chinese, Arabic, etc.) and will not display&nbsp;correctly.)</p>
    html_clean: <p>Well, as it says on that page, applications shouldn’t be using font <span class="caps">ID</span>s anyway. They should be using font names. Font <span class="caps">ID</span>s are only supposed to be used by the system for keeping track of fonts internally. The system is supposed to assign an unused <span class="caps">ID</span> when there is a conﬂict.  <br><br>Nevertheless, I have seen conﬂicts such as you describe occassionally. I think it depends on how the fonts are installed and there may be some ambiguous situations, such as when you preview an uninstalled font in a font managment utility (Font Reserve, Suitcase). <br><br>My suggestion would be to choose a diﬀerent number. Higher numbers, I think, would be less likely to conﬂict with an installed font, but you will have to experiment to be sure.  <br><br>(Whatever you do, don’t use a font <span class="caps">ID</span> higher than 16382 for latin fonts. The font may be interpreted as non-roman (Chinese, Arabic, etc.) and will not display&nbsp;correctly.)</p>
