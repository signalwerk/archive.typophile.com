    date: 2003-09-28T11:26:00
    date_raw: 28 Sep 2003 — 11:26am
    votes: null
    html: <p>Well, as it says on that page, applications shouldn't be using font IDs anyway. They should be using font names. Font IDs are only supposed to be used by the system for keeping track of fonts internally. The system is supposed to assign an unused ID when there is a conflict.  <br> <br>Nevertheless, I have seen conflicts such as you describe occassionally. I think it depends on how the fonts are installed and there may be some ambiguous situations, such as when you preview an uninstalled font in a font managment utility (Font Reserve, Suitcase). <br> <br>My suggestion would be to choose a different number. Higher numbers, I think, would be less likely to conflict with an installed font, but you will have to experiment to be sure.  <br> <br>(Whatever you do, don't use a font ID higher than 16382 for latin fonts. The font may be interpreted as non-roman (Chinese, Arabic, etc.) and will not display correctly.)</p>
    html_clean: <p>Well, as it says on that page, applications shouldn't be using font IDs anyway. They should be using font names. Font IDs are only supposed to be used by the system for keeping track of fonts internally. The system is supposed to assign an unused ID when there is a conflict.  <br> <br>Nevertheless, I have seen conflicts such as you describe occassionally. I think it depends on how the fonts are installed and there may be some ambiguous situations, such as when you preview an uninstalled font in a font managment utility (Font Reserve, Suitcase). <br> <br>My suggestion would be to choose a different number. Higher numbers, I think, would be less likely to conflict with an installed font, but you will have to experiment to be sure.  <br> <br>(Whatever you do, don't use a font ID higher than 16382 for latin fonts. The font may be interpreted as non-roman (Chinese, Arabic, etc.) and will not display correctly.)</p>
