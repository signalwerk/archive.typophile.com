    html: '<p>There are two diﬀerent numbers that may be in play: Apple’s suitcase <span class="caps">FOND</span> <span class="caps">ID</span>s, and Adobe’s Type 1 UniqueIDs. <br><br>Adobe does not believe UniqueIDs are still important in this day and age; you can leave them out. <br><br><span class="caps">FOND</span> <span class="caps">ID</span>s are required for suitcase-based formats, and the range the number falls into determines what the <span class="caps">OS</span> thinks the script of the font is (e.g. MacRoman, Cyrillic, etc.). However, the <span class="caps">OS</span> automatically resolves conﬂicts so the speciﬁc number is no longer important. <br><br>Regards, <br><br>T</p>'
    html_clean: '<p>There are two diﬀerent numbers that may be in play: Apple’s suitcase <span class="caps">FOND</span> <span class="caps">ID</span>s, and Adobe’s Type 1 UniqueIDs. <br><br>Adobe does not believe UniqueIDs are still important in this day and age; you can leave them out. <br><br><span class="caps">FOND</span> <span class="caps">ID</span>s are required for suitcase-based formats, and the range the number falls into determines what the <span class="caps">OS</span> thinks the script of the font is (e.g. MacRoman, Cyrillic, etc.). However, the <span class="caps">OS</span> automatically resolves conﬂicts so the speciﬁc number is no longer important. <br><br>Regards, <br><br>T</p>'
