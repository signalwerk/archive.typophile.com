    html: |-
      <p>I've included manicules in Fontesque, Figgins Sans, and Scotch Modern.<br>
      They're original designs, except for one of those in Scotch Modern, which is a revival.<br>
      Those in Scotch Modern Display (and the upcoming Fontesque OT) are optically scaled.<br>
      Those in Figgins Sans italic are italicized.</p>
      <p>Check out the PDFs at shinntype.com to see what they look like.</p>
