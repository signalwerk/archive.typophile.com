    <p>I'm preparing a short text on manicules and I've found some interesting ones by the above mentioned designers.<br>
    Unfortunately the source is from a Typophile chapbook dating from 1946, and their biographies are far from complete. And what I've found on the internet has not been very helpful, so far.</p>
    <p>Has anyone something to chip in here?</p>
    <p>Yours,</p>
    <p>ƒ</p>
