    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Proportional&nbsp;Figures</strong></p>
    <p>Proportional figures are those that have <a href="/node/add/wiki?edit%5Btitle%5D=advance%20width" title="Create node &quot;advance width&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">advance widths</a> that vary, based upon the relative width of each character. Proportional figures also typically incorporate <a href="/node/12410" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Kerning</a> so that they space evenly. This figure scheme is better suited for text whereas <a href="/node/16999" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">tabular figures</a> (those that share a common width) are better suited for setting figures in&nbsp;columns.</p>
    <p><strong>Additional Articles</strong><br><a href="http://fontfeed.com/archives/figuring-it-out-osf-lf-and-tf-explained/">The FontFeed: Figuring It Out: <span class="caps">OSF</span>, <span class="caps">LF</span>, and <span class="caps">TF</span>&nbsp;Explained</a></p>
