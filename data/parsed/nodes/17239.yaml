    <p>Proportional figures are those that have <a href="/node/add/wiki?edit%5Btitle%5D=advance%20width" title="Create node &quot;advance width&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">advance widths</a> that vary, based upon the relative width of each character. Proportional figures also typically incorporate <a href="/node/12410/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Kerning</a> so that they space evenly. This figure scheme is better suited for text whereas <a href="/node/16999/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">tabular figures</a> (those that share a common width) are better suited for setting figures in&nbsp;columns.</p>
