    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Proportional Figures</strong></p>
    <p>Proportional figures are those that have <a href="/wiki/advance%20width" class="freelinking" rel="nofollow">advance widths</a> that vary, based upon the relative width of each character. Proportional figures also typically incorporate <a href="/wiki/kerning" class="freelinking" rel="nofollow">kerning</a> so that they space evenly. This figure scheme is better suited for text whereas <a href="/wiki/tabular%20figures" class="freelinking" rel="nofollow">tabular figures</a> (those that share a common width) are better suited for setting figures in columns.</p>
    <p><strong>Additional Articles</strong><br>
