      <p>&gt;What I do think is interesting is where people spent the most time in disagreement like about the crossbar on the top of the J</p>
      <p>I wonder how much people were influenced by the model letter they were asked to draw?</p>
      <p>"Please draw the letter J" set in Verdana may produce different results than say "draw the letter J" set in Myriad. </p>
      <p>Cheers, Si</p>
