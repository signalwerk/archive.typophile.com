      <p>Thanks for the compliment Mamoun!<br>
      Just as a note for people who haven't read it, this article comes from my PhD thesis that I finished in October 2013 at the <a href="http://www.reading.ac.uk/typography/" rel="nofollow">Department of Typography</a>, and I anticipate that more material may be published in the future.</p>
      <p>Of course the question of reproduction size is a difficult one, as every paper publication has it limits of dimension and bigger would almost always be better here. Yet, I think they did a great job fitting in in many illustrations at reasonable sizes. I will consider putting up more material in the future, but this would have to be cleared with the collection's owners.</p>
      <p>Regarding your comment of typeface name, I must say that this was deliberate. I wanted to emphasise the difference between the widely used digital design - variously known as Simplified Arabic, Arial, Times New Roman and others - and the original Simplified Arabic design, which are quite distinct. It also points to the rather unfavourable policy of Microsoft in the 1990s to throw in whatever Arabic glyphs at their disposal without any apparent concern for the aesthetics: using the exact same Arabic glyphs for two typefaces as distinct as Arial and Times New Roman speaks for itself.</p>
      <p>BTW, I'm sure Hyphen, a small independent publisher, would be glad for people to order copies <a href="https://hyphenpress.co.uk/products/books/978-0-907259-48-0" rel="nofollow">directly from them</a>.</p>
