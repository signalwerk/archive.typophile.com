    <p>Titus Nemeth's article titled "Simplified Arabic: a new form of Arabic type for hot metal composition" was recently published in "Typography papers 9."<br>
    This is an excellent review of the development of Simplified Arabic since its inception in the 1950's. It will be of interest to anyone concerned with the history of Arabic typeface design. It would be even more useful if some of the figure were published large enough to show the details of the typefaces featured. Perhaps, Reading or Nemeth could publish these images in high resolution on the Internet for those of us who desire to learn more.<br>
    I have one minor comment on the content of the article: An example of the typeface named "Simplified Arabic" is shown, but it is not identified by its name as such. Rather it is identified as Arial/Times New Roman Arabic. This font is indeed included as the Arabic component of these multiple language fonts, but its original name should have been used.<br>
    Typography papers is a journal published by Hyphen Press, London, and edited, designed, and prepared by the Department of Typography &amp; Graphic Communication, University of Reading.<br>
    I purchased my copy from Amazon here:<br>
    <a href="http://smile.amazon.com/Typography-Papers-9-Paul-Luna/dp/0907259480/ref=sr_1_sc_1?s=books&amp;ie=UTF8&amp;qid=1402625337&amp;sr=1-1-spell&amp;keywords=typographic+papers+9" title="http://smile.amazon.com/Typography-Papers-9-Paul-Luna/dp/0907259480/ref=sr_1_sc_1?s=books&amp;ie=UTF8&amp;qid=1402625337&amp;sr=1-1-spell&amp;keywords=typographic+papers+9">http://smile.amazon.com/Typography-Papers-9-Paul-Luna/dp/0907259480/ref=...</a></p>
