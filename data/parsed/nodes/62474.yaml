    <p>We’re currently offering The <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bromwich/ " rel="nofollow"> Bromwich Family</a> (and the <a class="freelinking external" href="http://new.myfonts.com/package/325852/ " rel="nofollow"> Bromwich Value Pack</a>, including the associated Great Bromwich family) at a 35% discount on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bromwich/ " rel="nofollow"> Myfonts.com</a>.  Bromwich was one of our earliest families and is something of a favourite with us and others.  It remains a solidly popular face and is also somethingof a signature family for us, being the basis our our Foundry logos.</p>
