    <p></p><div class="imageWrap"><img src="http://typophile.com/files/!Futurelicpromo_4377.jpg"></div><p></p>
    <p>!Futurelic - a heavily distored science fiction themed typeface. Exploded minimalist characters are overrun with a texture beneath them, juxtaposing classical proportions and deformed ribbing. Available with vertical streaking in lessening degrees, the 'noisiest' is illustrated above. !Futurelic is a monospaced family featuring a full ascii set, as well as major accented characters, the Euro and OpenType-implemented auto-<a href="http://wwww.exclamachine.com/snark" rel="nofollow">snark</a>. The lowercase is a slightly more-legible tweaking of the caps, with alternate noise patterns.</p>
    <p>From <a href="http://wwww.exclamachine.com" rel="nofollow">!Exclamchine Type Foundry</a>, where design meets destruction.</p>
