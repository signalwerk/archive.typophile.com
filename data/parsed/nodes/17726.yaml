    html: "<p>We have a standing rule in our print shop: NEVER print anything directly from Illustrator, because its print engine is really lame. Either export/save your file as an EPS and place it in Quark, InDesign or Pagemaker, or save it as a PDF and print from Acrobat or Acrobat Reader.</p>"
