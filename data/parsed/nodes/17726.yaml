      <p>LJ 1020 for proofing type: a clear no!</p>
      <p>The datasheet PDF — just google the for the printer model and select the hp site — says: “Resolution: 1200 dpi effective output quality” which has a footnote: “600 x 600 dpi with HP REt and FastRes 1200 technology”. Which is not <strong>real</strong> 1200 dpi.</p>
      <p>Always be cautious with notions like “1200 dpi <strong>quality</strong>”, regardless of brand. Same with Xerox or IBM.</p>
      <p>I bought a LJ 1320 recently which gives good results at little costs. True 1200 dpi and double side printing which I haven’t tried yet. (But my impression is that the printing of the 1200 was a bit finer. And the quality of the 2100 is still unmatched.)</p>
      <p>Karsten</p>
