      <p>Actually, I have an HP 1200, and I think it does better than you’d expect for such a low price. For one, It seems to have true 1200 dpi resolution, which is pretty important for type. For two, it has a lot less gain than other lasers I’ve tried. I <em>think</em> the 1020 has the same engine, but it’s hard to be sure.</p>
      <p>Laser vs inkjet is harder to quantify. Both distort type considerably, but inkjets have gotten a lot better in recent years. One real advantage of lasers is that they work on plain papers. To proof type on an inkjet, you have to use glossy. It also helps to set a very high resolution and unidirectional printing in the driver (both of which slow down the printing quite a bit).</p>
      <p>I am very pleased with my Epson 2200. In the letter-size category, the R800 ($400 MSRP) has similar specs. I wouldn’t be surprised if the R220 ($99 MSRP) produces adequate results as well. It has a bigger drop size (3 pl vs 1.5 for the R800) and dye based inks (so they’ll fade), but the low end Epsons are pretty amazing for their price.</p>
      <p>Probably the single biggest thing you have to worry about is gain. If you have a high-gain printer and design your type to look good there, then it will be really weak and anemic when printed offset.</p>
      <p>See also this thread:</p>
      <p><a href="http://www.typophile.com/node/16926" title="http://www.typophile.com/node/16926">http://www.typophile.com/node/16926</a></p>
