    html: "<p>The low-end HP printers are perfectly adequate as office printers. As long as you don’t expect to do anything more than check spacing, overall color and alignment of your typefaces, it will work fine. Just don’t expect the printer to accurately reflect the subtleties of your outlines: you’ll need a Postscript printer for that, and you’re going to have to pay eight to ten times as much to get a true Postscript printer.</p>"
