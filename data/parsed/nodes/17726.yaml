      <p>istich:<br>
      It sounds as if the printer is getting binary data rather than ascii from Illustrator. Check the “options” in the graphics panel of the print dialogue, and check to see which PPD Illustrator is picking up.</p>
      <p>Switching to a different print driver and back to the LJ 1320 might be enough to sort out Illy.</p>
