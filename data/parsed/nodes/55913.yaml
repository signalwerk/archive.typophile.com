    html: <p>You’re being too conservative in a few ways (I ran into the same problem with the constructivist types I’ve worked on and never released). You stick to historical constructivist form in M and N, but then break to idealized serif form in E and F. And you’re trying to force some creativity with f, l, and p in a way that’s too academic. Loosen up some—the constructivists did some crazy things with their letters, but to find it you have to stay away from the the experiments of the Dutch and German designers whose funky letters make a nice-looking alphabet but bad-looking words; IMHO only the Stenberg brothers did regimented lettering very well. Check out the early chapter’s of Maria LaFont’s <em>Soviet Posters</em> to see examples of the stuff that doesn’t turn up in every history book—there’s a lot more possibility when stuff gets weird and less conceptual.</p>
