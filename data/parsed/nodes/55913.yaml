    <p>(I don't know if that name is available, but that's what I have it called for internal purposes) </p>
    <p>Anyway, here is my first "constructed" typeface. I realized I had never built a geometric typeface before, so I started on this. I like the look of bitmap types and of course, constructivist types, so that's what I was going for here. Oh, and it's monospaced.</p>
    <p>Critiques welcome :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/constructive_6226.png"></div><p></p>
    <p><a class="freelinking external" href="http://dangayle.com/ftp/constructive.pdf" rel="nofollow">Version .01 PDF</a> (edited to show paragraph)<br>
    <a class="freelinking external" href="http://dangayle.com/ftp/constructive.02.pdf" rel="nofollow">Version .02 PDF</a> (New forms and numerals)</p>
