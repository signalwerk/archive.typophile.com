  html: <p><a href="http://www.font.to/cgibin/at.cgi?a=227536" target="_blank">Fontlab Ltd.</a> will announce and demonstrate the third version of their font conversion program, TransType, at the ATypI convention in Vancouver.  <br> <br>TransType Pro, as this version will be called, will be the first font utility to offer full conversion of TrueType and Type 1 fonts into OpenType format (and vice versa). Further, it will be two-byte font compatible, meaning that large fonts of up to 65,000 characters will be convertible with this version of the program. <br> <br>TransType Pro will be available for both Macintosh and Windows platforms and final release is anticipated late this year. The price of the new program will be US $149.00, but current users of TransType 2 will be able to upgrade for a substantial discount. However, because all users may not need the power of TRPro, it will not replace TR2. Both products will remain on the market and continue to be supported and updated.</p>
  html_clean: <p><a href="http://www.font.to/cgibin/at.cgi?a=227536" target="_blank" class="link-external">Fontlab Ltd.</a> will announce and demonstrate the third version of their font conversion program, TransType, at the ATypI convention in Vancouver.  <br> <br>TransType Pro, as this version will be called, will be the first font utility to offer full conversion of TrueType and Type 1 fonts into OpenType format (and vice versa). Further, it will be two-byte font compatible, meaning that large fonts of up to 65,000 characters will be convertible with this version of the program. <br> <br>TransType Pro will be available for both Macintosh and Windows platforms and final release is anticipated late this year. The price of the new program will be US $149.00, but current users of TransType 2 will be able to upgrade for a substantial discount. However, because all users may not need the power of TRPro, it will not replace TR2. Both products will remain on the market and continue to be supported and updated.</p>
