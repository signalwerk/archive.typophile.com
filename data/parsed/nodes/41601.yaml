  html: <p>I just cleaned up the painful rehearsal schedule that my school's Shakespeare club created, and I recently got some poster reference books, so now I'm wondering where I can find examples of good schedule design. Other than in Edward Tufte's books, which I already have, in what books can I find examples of well-designed schedules? I'm not looking for any type of schedule in particular.</p>
  html_clean: <p>I just cleaned up the painful rehearsal schedule that my school's Shakespeare club created, and I recently got some poster reference books, so now I'm wondering where I can find examples of good schedule design. Other than in Edward Tufte's books, which I already have, in what books can I find examples of well-designed schedules? I'm not looking for any type of schedule in particular.</p>
