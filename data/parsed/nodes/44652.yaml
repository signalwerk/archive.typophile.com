    <p>I came across this thread <a href="http://www.typophile.com/node/43276" title="http://www.typophile.com/node/43276">http://www.typophile.com/node/43276</a> and I love the font Pablo uses in one of his logo ideas in his second post, the logo on the right. It reminds me of the face used for Australia's tourism branding. I don't even know what search terms to use to find something like it.</p>
    <p>Does anyone know what it is? Or one similar?</p>
    <p>(In case the image doesn't display, you can see it here: <a class="freelinking external" href="http://www.typophile.com/files/prueba%202_5770.gif" rel="nofollow">http://www.typophile.com/files/prueba%202_5770.gif</a>)</p>
