    html: |-
      <p>Contemporary living, is that modernism?<br>
      If so, a bit apologetic -- like yes, modernism is still up-to-date, really, even after post-modernism.<br>
      Go, modernity!</p>
      <p>The content is almost all hard-surfaced, perpendicular and sharp cornered, yet all three typefaces used are at odds with that sentiment, and unrelated to one another:</p>
      <p>Cocon: a sans softened by mannerist detail. The most contemporary thing about the site.<br>
      Georgia: a Scotch (19th century) design. Surely the other Microsoft default, Verdana, would have been more in sync. (Or the ultimate default, Helvetica/Arial.)<br>
      The serif tag-line, an old-style (antiqua) face. OK for Palladio...</p>
      <p>If you're going for the classic mid-century, retro-modern vibe, something like the 1960s face Eurostile would capture the tone better:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/contempo_5848.jpg"></div><p></p>
      <p>Why didn't you choose unusual types with plastic qualities and connotations that harmonize with those of your unusual subject matter?</p>
