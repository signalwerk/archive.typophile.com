  html: |-
    <p>Het Plantin Genootschap organiseert elk jaar expert classes over typografie en grafisch ontwerp. De opleiding focust op theoretische inzichten en historische achtergronden en combineert die met technische en praktische kennis.</p>
    <p>De term expert classes verwijst naar de docenten van het Plantin Genootschap. Hun jarenlange ervaring met de vele facetten van de grafische sector staat borg voor grote deskundigheid. Maar het Plantin Genootschap wil ook van zijn studenten echte experten maken. Ze verdiepen hun opleiding en/of werkervaring met een rijk palet aan nieuwe benaderingen.</p>
    <p>Het programma mikt op deskundigheid, oordeelsvermogen en kwaliteitsbewaking, van ontwerp tot eindproduct.</p>
