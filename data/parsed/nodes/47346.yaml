  html: |-
    <p>Hi<br>
    I have noticed that WPF Text Formatter does not show ligature marks in Arabic OpenType fonts correctly, that is when it tries to render a lam+kasra+alef+fatha, for example, it palces both kasra and fatha marks after lamalef ligature.<br>
    It seems that WPF does not use Uniscribe and may be the ligature-mark feature of OpenType is not yet implemented in it or I am missing some point.<br>
    Please advise me.<br>
    Thanks</p>
