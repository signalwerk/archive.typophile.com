    html: |-
      <p>That just takes me via another route to the settings for changing <em>that specific job</em>; it doesn't <em>stick</em> (well, it sticks while you keep the app open, but I want more stickiness than that!). What I was hoping for was something that would change the default so that I wouldn't <em>have</em> to go into these settings dialogs every time.</p>
      <p>Even the wording of the help file tells you to set the layout options you want when you go into the 'Summarize Comments' or 'Print with comments summary; menu items, suggesting that there isn't a way to have <em>pre-set</em> the layout options that you know you're going to want every time. </p>
      <p>Grrr.</p>
