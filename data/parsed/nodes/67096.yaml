    <p>Not strictly type related, but I figure there must be plenty of Acrobat users here. At any rate, this is less off-topic than birdhouse carpentry [ahem], so here goes:</p>
    <p>I use Acrobat Pro 7, and often need to use the "Print with comments summary" feature. This always launches with paper size set to "letter" and layout set to "Document and comments with sequence numbers on separate pages". But I <em>always</em> want "A4" and "Document and comments with connector lines on single pages". Anybody know if there's a way I can make this the default? Some preferences file or suchlike?</p>
    <p>[If anybody's thinking, "Why not ask an Adobe question in the Adobe user forums?", the answer is that I <em>did</em>, in <em>October</em>; since I got diddly response I thought I'd try elsewhere.]</p>
