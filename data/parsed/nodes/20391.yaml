      <p>You called?  :-&gt;</p>
      <p>As I'm fond of saying, Mrs Eaves* is a beautiful woman who has a pronounced speech impediment. The problem is most people are too busy staring at her hair and cleavage to notice she has trouble communicating. You could say that the problem is subvisible, and so escapes general criticism, like how laymen think sans fonts are just as -or even more- "legible" (read: readable) than serifs.</p>
      <p>* The font. I have neither seen a portrait of<br>
      Sarah Eaves nor read about her speech skill.</p>
      <p>When it comes to reading, a font's various attributes make it suitable for certain sizes. Mrs Eaves has vertical proportions suitable for 14 point at the lowest (and this is why some people will reject it outright as a text face - I personally think a large book, like one placed on a lectern, maintains 14-16 as a possibility for text). Mrs Eaves also has a color (lightish) suitable for sizes slightly above the nominal ideal (~11pt). BUT: its spacing is for sizes around 8! In addition, its spacing is just plain bad - although very few people (not even most typographers) will notice. And it's not an issue of kerning: although Mrs Eaves has deplorable kerning, it would still work much better if its base spacing were decent.</p>
      <p>&gt; Mrs. Eaves could get a passing grade if they invested some time in spacing</p>
      <p>No, it could be <cite>great</cite> if they did so. And they had a chance, when they released the OT version. Now, there <cite>is</cite> a good reason not to change a font's spacing when you re-release it (some clients will hate the reflow) but there's also a bad reason lurking in the background: hubris. Mrs Eaves's spacing hamartia was heavily discussed early on, and it's possible that fixing the spacing would have been an embarassing admission, and artiste-ic climb-down some people can't manage; these tend to be the same people who cannot tolerate any criticism of their fonts, and generally don't engage in criticisms of the fonts of others: they consider it all sacred Art. Which is of course entirely anti-user.</p>
      <p>--</p>
      <p>I guess in the end, most people find that being in the<br>
      company of great beauty is worth more than being able to<br>
      actually understand anything meaningful that beauty says.</p>
      <p>hhp</p>
