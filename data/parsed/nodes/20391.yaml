      <p>Peter, I figured you were trying to go beyond Mrs Eaves and into specifics of how the various parameters of a face relate - sorry I was lazy in my previous reply, in fact missing an important aspect:</p>
      <p>Those factors I mentioned are certainly not the only ones, and in this case specifically the issue of width comes strongly into play, with a wider font indeed needing more letterspacing, but also with a wider font being better for smaller sizes (so another area where there's an imbalance in Mrs Eaves).</p>
      <p>In terms of x-height, as we know about Latin in general, it's more important to consider that than the point size (although not at the expense of ignoring the weight of the extenders completely). So a font having a wide body (relative to the x-height) is more significant than a font simply having a small x-height. And good letterspacing depends on the proportions and color in the x-height region more than anything else.</p>
      <p>Where vertical proportions as a whole come into play however is in the suitability of a font for a given point size, since extenders play a greater role the deeper you go into immersion (the more you rely on the parafovea). There's of course a limit to how small you should make the x-height, since the fovea will always carry a notable chunk of the weight of reading.</p>
      <p>hhp</p>
