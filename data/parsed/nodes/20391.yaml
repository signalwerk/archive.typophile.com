    <p>I wanted my own <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs. Eaves</a> thread. So here it is.</p>
    <p>I don't get it. I just can't set this thing right. At sizes below twelve points Mrs. Eaves disappears on the page, thanks to it's horribly small x-height. At sizes twelve points and slightly above it looks better, but the spacing is still way off. It's like Licko squashed it and then pulled it apart. It breaks the cardinal rule of typography (praphrasing Eric Gill, or was it Tsichold?) that word/letter spacing must be tight. And a larger x-height makes for far better legibility and readability, too.</p>
    <p>People are swooning over this typeface, and I really don't understand why. Maybe the ligatures are causing this mysterious suspension of reality. Maybe its distinctive design has overshadowed its shortcomings. Either way, It's a chore to read it. Licko's reasons for these oddities certainly dont justify them. I switch to a good Baskerville or Sabon and I relax, my eyes no longer straining to move over to the next unnecessarily distant letter and word. Did Licko forget to finish the kerning? Jenson seems very similar to Mrs. Eaves in its letterforms, but the spacing is far tighter, the way it should be.</p>
    <p>Sorry for the rant, but I'm trying to find a reason to like this face as body copy. It just doesn't stand lengthy reading. Oh well. Perhaps someday I'll get my money's worth out of it.</p>
