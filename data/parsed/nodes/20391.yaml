      <p>Hrant, you're right about my intent.<br>
      My purpose was to indicate that a letterform-set with a wide average horizontal dimension relative to the vertical in the x-height area--because of the amount of internal white produced--requires a loose spacing to set properly, so the spacing Licko provided might not be wrong relative to the intrinsic demands of the letterform. </p>
      <p>Tight spacing is only productive if the design allows it, that is, if the counters are small enough in the horizontal dimension to bear it. Tightening the spacing of a font which is not made for tight spacing leads to other problems. Tight spacing is not a readability value at normal text sizes in itself. Words with tight spacing and compact counters benefit the perceptual integrity of the visual wordform, or as Noordzij might say the "consolidation of the word". But there is a discrimination affordance constraint for compact counters at small sizes. These countervailing pressures control the fitness of the face. In general I agree with the assessments about the fitness of the face for various forms of usage described above. It just strikes me as a face with an appeal incommensurate with it's fitness. It is a Bernard Modern in a way.</p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
