      <p>"Do fonts with a small x-height require tight spacing?"</p>
      <p>Peter, to be specific, all the factors Hrant named interact, all the time. The size a face is set at affects the behavior of spacing, and x-height also affects it, differently, at different sizes. There isn't an easy way to pick apart which feature (x-height, stem thickness, serif length, overall spacing) is causing a specific effect. They all affect each other.</p>
      <p>I would say colour in a text face is a very imprecise and subjective thing to describe, when other factors such as evenness of spacing, and differentiation of letterforms are so much more crucial to the performance of a face.</p>
      <p>Hrant has explained this above: Mrs. Eaves has letterforms and proportions which are appropriate for a specific size range, almost exclusively above 14 points. However, it seems to have spacing appropriate for sizes *much* smaller. This means that at small sizes, where the spacing is more appropriate, the face looks weak and tiny. At sizes where the letterforms hold up, the spacing is blowing apart. There's no size or setting that makes the face really excel, and certainly not for extended text.</p>
