      <p>What is the relationship between vertical proportions and spacing?<br>
      Do fonts with a small x-height require tight spacing? Why is that? Does it hold for condensed and expanded forms equally?</p>
      <p>Isn't spacing part of what makes up colour? That is, a font only has a certain colour under a certain spacing. Where the spaces between the letters and inside the letters are in synch, in a font such as Mrs. Eaves the typographical result will have an even texture but lightish colour. When the spacing is tighter than that given by the condition in which the whites are in synch, the colour may be darker, but the texture less even. [later edit: added the word "texture"]</p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
