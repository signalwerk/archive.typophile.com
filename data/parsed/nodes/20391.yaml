      <p>Eben - not that he's getting away with something, more that I don't like the direction he pulled design into for awhile. I think there's a hostility towards the reader - in the service of "breaking the mold" or something. Which is why I can appreciate his work from a distance. We need to be tweaked to be sure, but he never won me over.</p>
      <p>I'm an artist too and feel the same about a lot of the art I see - glad someone's making it but wouldn't want to live with it. And the same feeling that people are so hungry for the next big thing that they lose sight of the relationship with the viewer. We end up drowning in hype but only history will tell - either with art or typography - what the lasting effect will be.</p>
