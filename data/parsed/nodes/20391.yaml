      <p>I know this topic has been beaten to death around here, but I find it disturbing that designers, typographers (if there is such a distinct group), and the interested laity like myself are more or less the only ones who perceive this problem. </p>
      <p>When it comes to a serif face that is being passed off as an all-purpose font - or at least one that is not being marketed as something other than that, spacing and kerning is everything. You can have a serif font with gorgeous letterforms, but if it fails as body text its value diminishes considerably, at least in my book. </p>
      <p>All obvious stuff, but it's worth mentioning, I think.</p>
