      <p>I have never set anything in Mrs. Eaves, and haven't gone back into previous threads to review the discussion of spacing. My question is: is the spacing bad because it is all over the map, or is it bad because it is considered too loose [= an edit: was 'wide'].</p>
      <p>Licko designed the characters to be wider / shorter in their x height (Patty's: 'squat') than the typical Baskerville. This contributes to more white within the letters, and if perfect spacing keeps the whites between the letter in synch with the whites inside letters, the interletter spacing must be looser than what we might normally think. So the wideness of the face dictates an open spacing.</p>
      <p>If a compact, well-consolidated word image is what a text face should strive for, Mrs. Eaves moves in the other direction.</p>
      <p>Does Licko claim otherwise?</p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
