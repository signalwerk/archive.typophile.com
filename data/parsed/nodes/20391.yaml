      <p>Oh yeah, and I agree that Mrs Eaves doesn't cohere very nicely as a body text... It does have a certain colour that some folks might like. But it feels too brittle to me. It catches or restrains my eye too much as I read. I think that some of that is probably the kerning but much of it is letterforms. The letters are maybe just a little to interesting to play together nicely as a team. Which is an irritation. </p>
      <p>That said, Zuzana did kick ligatures into the spotlight again. We should should thank her for that. And I think it's worth metioning that no face Baskerville style face looks quite so happy or perky as Mrs Eaves. Particularly in the ligatures. To me the face has a kind of Californian - or maybe sf/bay area - optimism. Put the font on a package or invitation and you get the subliminal impression that you too can have the happiness that the font radiates. That quality too could be irritating or impressive depending on what your intent is. To me, it explains why graphic designers like the font so much - a built-in optimistic/sensual emotional character. Why people think it looks 'feminine' is beyond me. But assigning a sex to fonts trains or vegetables has always seemed silly to me.</p>
