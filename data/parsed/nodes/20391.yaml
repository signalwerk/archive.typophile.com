      <p>To me, it's a very simple issue. Perhaps my inexperience with respect to design might actually serve me well here. </p>
      <p>A serif face meant for body copy (was Mrs. Eaves meant for that?) is either reasonably easy to read, or it isn't. If it isn't, then the designer's intentions regarding the stylistic raison d'aitre of the face, such as Licko's goal of a "light", "open" face or whatever else she wanted to do to Baskerville, no longer matters. As a text face that is to have the same function as a Quadraat, Palatino, Renard, Dolly, etc., Mrs. Eaves fails. </p>
      <p>I really don't care what Licko's stylistic justifications are. If Mrs. Eaves breaks the rules of sound typograpyhy (simply put, stuff that makes type easy to read), then it's all a wasted effort in that regard. </p>
      <p>Mrs. Eaves finds success in other applications: wedding invitations, menus, displays, short tracts of texts, and so on. It's still a wide playing-field. SF's example is gorgeous. It seems the spacing is tighter as well.  </p>
      <p>Certainly, if the spacing were improved considerably by Licko, then we'd really have something that is worth more than a nice ligature set. The small x-height and overall squat letterforms would still not be ideal, but it would be enough to allow Mrs. Eaves to perform adequately as a versatile serif face. This would certainly inspire a greater appreciation of its beauty.</p>
