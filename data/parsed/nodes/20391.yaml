      <p>Repeated from above:<br>
      When it comes to reading, a font’s various attributes make it suitable for certain sizes. Mrs Eaves has vertical proportions suitable for 14 point at the lowest (and this is why some people will reject it outright as a text face - I personally think a large book, like one placed on a lectern, maintains 14-16 as a possibility for text). Mrs Eaves also has a color (lightish) suitable for sizes slightly above the nominal ideal (~11pt). BUT: its spacing is for sizes around 8!</p>
      <p>Although the numbers above are certainly open to discussion,<br>
      the important thing is that there's a relationship between a<br>
      font's spacing, color, vertical proportions and intended use.<br>
      And to me Mrs Eaves clearly violates the relationship(s).</p>
      <p>hhp</p>
