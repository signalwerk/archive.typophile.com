  html: |-
    <p>Is there a name for the anatomical condition in a capital W, where the second and third diagonal intersect (crossover one another) rather than form a pointed apex?</p>
    <p><a class="freelinking external" href="http://myfonts.us/td-xqRvmI" rel="nofollow">Garamond W</a>, for example.</p>
    <p>Vs. <a class="freelinking external" href="http://myfonts.us/td-PKXnLg" rel="nofollow">Minion</a>, for example.</p>
    <p>And while I'm at it, what's <a class="freelinking external" href="http://myfonts.us/td-swl07E" rel="nofollow">this</a> condition in Goudy catalogue called, where the second diagonal meets the third mid way up, creating a left-leaning terminal/apex?</p>
