    html: |-
      <p>I'm considering adding numbers and maybe some puncuation but an upper case as well...that would be a whole other mountain, maybe in the future. </p>
      <p>I agree with all your feedback wongxiao, but the problem is besides the c and e, I don't really have an approach in mind for the b and d (maybe a just a slight variation might do it) or for the p and q either. </p>
      <p>I want this font to maintain a certain illustrated font look to it so I definitely want uniqueness to each letter, that is why I agree that the c,e,b,d,p, and q need to examined. However, I'm kind of weary to put a stem on the m and r cause it might begin to look formulaic with the letters.</p>
      <p>You're right, this font has been alot of work, and working these last letters out is quite a challenge. Its like running a long marathon only to find a steep hill as you approach the finish.</p>
