      <p>Seems like a nice concept, overall... and a lot of work! Some things I noticed:</p>
      <p>- c and e could be more differentiated.<br>
      - b and d could be unique designs as opposed to mirrored versions of each other; same with p and q.<br>
      - r and m aren't doing it for me; I think they might look nicer with a stem on the left similar to what you have on n.</p>
      <p>Other than that I think it's very interesting. I like how you "filled in" all of the counters while maintaining its legibility. Will there be capitals?</p>
