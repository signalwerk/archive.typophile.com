      <p>Made changes on many of the letters suggested. I'm still open critiques. I'm probably still going to touch up the r more since I pretty much borrowed it from the m. I changed the b and d, I borrowed the q from the b, which I don't mind cause the q is going to be minimally used, I might change a little on the inside though just to try give each character a unique touch.</p>
