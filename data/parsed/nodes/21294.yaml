    <p>G'day,</p>
    <p>I know this has probably been broached before (if this is the case can someone brusquely tell me where to find it?) but is it ok by copyright to use illustrator to modify individual letterforms for use in, say, a poster? I realize that you normally need to get permission before altering the software of a font, but I wondered whether this extends to the individual letterforms which can be turned into vector data<br>
    thanks again, sorry if it's old ground</p>
    <p>Nick</p>
