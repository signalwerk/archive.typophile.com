    html: |-
      <p>The main objections to derivative fonts is the dilution of ownership rights that such fonts may contribute to. In general I think most type designers and foundries would find it acceptable to modify a character or set of characters in Illustrator, that's how most logos get made after all. </p>
      <p>The practice is so common I doubt many EULAs even talk about it. But having said that some EULAs are tricky and the best advice would be to check.</p>
