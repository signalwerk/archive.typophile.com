    html: |-
      <p>Modifying a letterform (or even several letterforms) that has been converted to outlines is <strong>not</strong> modifying the font. If anyone has a EULA that prohibits this very common practice, he/she/they ought to give some serious consideration to changing that EULA to conform to real-world practice.</p>
      <p>After following several threads in this forum, I changed my EULA to allow modification of my fonts for personal/corporate use: as long as the end product is not resold or redistributed, the end user ought to have the option of making changes that make the product work best for them.</p>
