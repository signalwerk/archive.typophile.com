  html: |-
    <p>You all know a thing or two about airport security.<br>
    Every year I fly once or twice to the US and I have started to see a pattern.</p>
    <p>The rigorous checks we all have to go through before boarding takes a lot of time and it is not always visible what they are for.<br>
    Anyhow.<br>
    Coming from The Netherlands, I feel that once they see where we are from we will have to undergo a 'random security check'. I'm not sure anymore how random these are ...</p>
    <p>But being cool about it (they are just doing their job), I feld I had to give this a podium in a t-shirt.</p>
    <p>Feel free to share your thoughts.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/thankyourforhavingus_5262.jpg"></div><p></p>
