    html: <p>As far as I know, an OTF font can contain either PostScript outlines, or TrueType outlines (i.e., its flavor). It's my assumption that hinting is dependent on whichever type of outline is in the OTF file.  <br> <br>And, like BitFonter, I believe that FontLab can only output TTF files with embedded bitmaps in them.</p>
