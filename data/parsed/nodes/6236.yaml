  - id: 43958
    user: 1043
    date: 2003-02-03T15:48:00
    date_raw: 3 Feb 2003 — 3:48pm
    votes: null
    html: <p>I've had a little experience with embedded bitmaps. My (free) font <a href="http://www.ms-studio.com/FontSales/anonymous.html" target="_blank"> Anonymous</a>, a Mac/Windows TrueType font, uses them for the Windows version. (The Mac version has them in the suitcase file.)  <br> <br>It works, but it depends on OS support (and application support sometimes) for it to work properly. On MacOS 9 (and earlier) and Windows they are used instead of the TT rasterizer at the sizes that you would expect. MacOS X uses the bitmaps only when they fall below its anti-aliasing threshhold, otherwise it ignores them.  <br> <br>Flash will use them (yay!) if the font is installed on the client system for dynamic and input text, but not (boo!) for static text and not for anything when you embed the font in the swf. <br> <br>Also, the size at which they are used on Windows differs from Macs in the usual way. In other words, if you have embedded a 12-pixel tall bitmap font, it will appear at 12-point on Macs but at 8-point on Windows (assuming that the Windows default 96-dpi setting has not been changed).</p>
    html_clean: <p>I've had a little experience with embedded bitmaps. My (free) font <a href="http://www.ms-studio.com/FontSales/anonymous.html" target="_blank"> Anonymous</a>, a Mac/Windows TrueType font, uses them for the Windows version. (The Mac version has them in the suitcase file.)  <br> <br>It works, but it depends on OS support (and application support sometimes) for it to work properly. On MacOS 9 (and earlier) and Windows they are used instead of the TT rasterizer at the sizes that you would expect. MacOS X uses the bitmaps only when they fall below its anti-aliasing threshhold, otherwise it ignores them.  <br> <br>Flash will use them (yay!) if the font is installed on the client system for dynamic and input text, but not (boo!) for static text and not for anything when you embed the font in the swf. <br> <br>Also, the size at which they are used on Windows differs from Macs in the usual way. In other words, if you have embedded a 12-pixel tall bitmap font, it will appear at 12-point on Macs but at 8-point on Windows (assuming that the Windows default 96-dpi setting has not been changed).</p>
