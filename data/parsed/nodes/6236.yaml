  html: <p>There seems to be a lot of interest here in designing or discussing low-resolution bitmapped fonts. <br> <br>OpenType fonts have a feature that allows bitmapped glyphs for specific point sizes, optimizing on-screen display.  Has anyone tried doing this? <br> <br>Paul</p>
