    votes: null
    html: "<p>I've experimented with this a little bit Paul, but I'm no technical wizard, so for your own safety, doubt everything I say here. As far as I'm aware, your OpenType font has to be TTF flavored - not CFF. I work in FontLab, so if you use that, try the following: <br> <br>1) open a glyph <br>2) Tools&gt;Operations&gt;TrueType Hinting <br>3) turn on the Bitmap tool (see below) <br>4) right click in the glyph window <br>5) select Generate Bitmap <br> <br>You have to generate bitmaps individually for each glyph, for each ppem you want to support, as far as I know. <br> <br>Hope that's helpful. <br> <br>Nate <br> <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/5073.gif\" alt=\"\"></p>"
    html_clean: "<p>I've experimented with this a little bit Paul, but I'm no technical wizard, so for your own safety, doubt everything I say here. As far as I'm aware, your OpenType font has to be TTF flavored - not CFF. I work in FontLab, so if you use that, try the following: <br> <br>1) open a glyph <br>2) Tools&gt;Operations&gt;TrueType Hinting <br>3) turn on the Bitmap tool (see below) <br>4) right click in the glyph window <br>5) select Generate Bitmap <br> <br>You have to generate bitmaps individually for each glyph, for each ppem you want to support, as far as I know. <br> <br>Hope that's helpful. <br> <br>Nate <br> <br> <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/5073.gif\" alt=\"\"></p>"
