    html: "<p>I came across something on it when I was reading through Adobe's somewhat technical Opentype specifications.  It seems like a good way to create a font to work for bitmapped work and print work.  It's probably a lot easier than painstakingly hinting fonts to pixel-perfection like Verdana or Georgia have been, and it would let you accentuate features (serifs, swashes, etc.) at tiny bitmapped sizes that would normally disappear. <br> <br>Nathan: I imagine that in Fontlab, you could probably highlight multiple glyphs and do the bitmap-generating operation, right? <br> <br>Paul</p>"
