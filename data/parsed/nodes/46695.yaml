    html: <p>According to <a class="freelinking external" href="http://www.microsoft.com/typography/fonts/font.aspx?FID=272&amp;FNAME=LilyUPC&amp;FVER=2.20" rel="nofollow">this Microsoft page</a> Lily UPC should come installed with Windows XP (and XP SP2)</p>
