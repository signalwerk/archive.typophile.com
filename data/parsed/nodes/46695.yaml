    <p>Hi!</p>
    <p>I want to ask some help. I made a logo design last week with AI CS3. I saved it<br>
    only in an "ai" file. Last night, my complete system crashed and I had to reinstall<br>
    everything. Now I tried to open my work and it sad, that Lily UPC font is missing, and<br>
    it opens the file, but the text is full of with missing character boxes.<br>
    Can anyone tell me, where can I download Lily UPC (or just simpy email me the upcll.ttf if you have got it), or with whitch program comes it together? (On my previous system there was a lot of demos installed, with Windows Vista Ult. Now i installed WinXP. Prof.) </p>
    <p>It's very important for me, becouse the customer has already accepted the plans and waiting for the finished work... </p>
    <p>Thanks and sorry about my poor English.</p>
    <p>Mate</p>
