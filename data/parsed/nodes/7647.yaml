    html: <p>Przemek <br> <br>Well, a few text fonts which I like and think works well together with Sophisto are; <br> <br>Proforma (Petr van Blockland) <br>Delicato (my own) <br>Eidetic Serif (Rodrigo Cavazos) <br> <br>I'm sure there are many others, but you asked for my favourites ;-) <br> <br>My Budapest experience was faboulus and fun. The city had many faces back then depending on which area you visited. I would love to go back and see the changes... I had a few trips to Prague too and it's pretty but much smaller. And Vienna was good looking but oh so boring. one day I'll visit Krakow too. <br>cheers</p>
