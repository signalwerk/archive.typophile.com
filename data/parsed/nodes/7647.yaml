    html: <p>Stefan, <br> <br>One more question came to my mind regarding Sophisto - what serif font would you recommend to accompany the typeface? As the designer you probably have your favorites, I would be happy to know them.  <br> <br>Ah, Budapest 10 years ago, it must have been a different world!... Maybe I am too sceptical, but I would not dare comparing Krakow to Prague, Brno or Budapest. The difference between the cities is quite significant, especially after 15 years of transformation. But perhaps it is only my impression and of course I can be wrong. <br> <br>przemek</p>
