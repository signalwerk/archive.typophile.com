    html: <p>Przemek <br> <br>I'm glad you find my typefaces apealing. Let me know if you have any further questions? Regarding Graficz, I've had a passion for the Central European style. I worked as an Art Director  in Budapest back in '93 and spend tons of hours just walking around town studying the general graphic style, taking photos of signs etc. Btw Luminance is inspired by a Czech typeface originally. <br> <br>Cheers</p>
