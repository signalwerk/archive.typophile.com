    html: <p> As we saw elsewhere in the forums, Emigre's Filosophia (and I would add Emigre's Mrs Eaves) works very well for rendered screen text. From the same sample, Avenir (from Adobe, et al) works well also. <br> <br>I've also used Stempel Schneidler with some success. <br> <br>I haven't tried it as such, but with its crisp, open forms I would also investigate FB's Hightower as well. <br> <br>David </p>
