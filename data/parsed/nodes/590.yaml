  html: <p> I am looking for a good, clean and not so common font for body text (as in an image) for a website. <br>Apart from being a font with flair and character, it has to be very readable and fairly sober. Away with Arial, Verdana, Tahoma, GillSans... <br> <br>Which font would you advice me? <br>(I tried Officina Sans, but I found that one too narrow for example). <br> <br>Thanks a lot <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br>Very interested in hearing the professionals opinion. <br> <br>Dave </p>
