    html: <p>Poppl Laudatio. <br><a href="http://www.bertholdtypes.com/bq_library/90089.html" target="_top">http://www.bertholdtypes.com/bq_library/90089.html</a> <br><a href="http://www.bertholdtypes.com/bq_library/90090.html" target="_top">http://www.bertholdtypes.com/bq_library/90090.html</a> <br> <br>I've been using it since '94 for a lot of my rendered on-screen text, and it's fabulous. As a bonus, at large sizes it contains a lot of visual interest, maintaining stylistic consistency with the small text. <br> <br>---- <br> <br>If you need to make very small legible text, Rotis (specifically the darkest weight of the Sans - which you might actually try to add a fake bold to as well) is in a class of its own (maybe surprisingly so), not least thanks to its economical narrowness.  <a href="http://www.themicrofoundry.com/other/rotis_12.gif" target="_top">http://www.themicrofoundry.com/other/rotis_12.gif</a> <br> <br> <br>hhp</p>
