    html: <p> Laudatio and Rotis both have low contrast, which helps. Also, the former has a huge x-height (which is great as long as the text is both small and short), while the latter has a narrowness which can often save the day. Laudatio (and Avenir) might benefit from some extra tracking. <br> <br>David, could you please put up a 13/14 of Avenir? I'm getting a good feeling about it. <br> <br>hhp </p>
