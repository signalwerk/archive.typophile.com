    html: |-
      <p>The figures Florian shows indicate that this series seems thoughtfully kerned. </p>
      <p>And going beyond what Nick said I said. I think the word "WARNOCK" sets perfectly at 72 pt. with one kern. All spacing and all pair kerning is based on the theory of making <em>all</em> combinations not absolutely fail. Failure in a Sans is maybe .5 to 1, and in Serif 2-3, manual kerns per 7-8 letters?  Near this example, e.g. the word "WARLACK" might not have a "WA" to kern at all? Or that's what we hope.</p>
      <p>"...My overshoots got cut off due to bad copy-paste. Haha :)"<br>
      ...and your 'ar' is tighter than his while your 'no' is looser than his, haha :y<br>
      Maybe try setting "WARLOCK", lighting 13 candles and zapping your computer's pram ;#</p>
      <p>Cheers!</p>
