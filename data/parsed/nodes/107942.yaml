    <p>Hello,</p>
    <p>I'm using FontLab Studio Pro v5 to create a basic icon font (just a few characters).</p>
    <p>In this font, along with the icons, I want to add "blanks" (that is, non-spacing and non-marking glyphs).</p>
    <p>I've posted a question on Stack related to how to create non-spacing/marking glyphs and I've gotten a little help so far.</p>
    <p>Right now, I'm stuck trying to figure how to:</p>
    <blockquote><p>[scale] all the contours in glyphs to zero sized area: Scale (1%) × 3 times <a href="http://graphicdesign.stackexchange.com/a/25853/10258" rel="nofollow">see answer here</a></p></blockquote>
    <p>I've found this section:</p>
    <p>Tools → Action... → Contour → Scale</p>
    <p>But I don't see how I can input "(1%) × 3 times".</p>
    <p>Could someone please enlighten me?</p>
    <p>I'd love some pro guidance here. :)</p>
    <p>TIA!</p>
    <p>Cheers,<br>
    M</p>
