      <blockquote><p>In this font, along with the icons, I want to add "blanks" (that is, non-spacing and non-marking glyphs).</p></blockquote>
      <p>Do you mean "white space" characters? If the encoding  is to be a Unicode-based (as opposed to a PostScript name-based font), you'll find a number of characters already assigned for spaces, just ready for you to fill in values. See Unicode "General Punctuation" (U+2000 through U+ 2011). You probably shouldn't cheat on the values of spaces based on the em, but "thin" and "hair" have no exact meaning, and you could use them as you see fit. While the "figure" and "punctuation" spaces kinda sorta have meanings, you could probably cheat a little and use them, too. </p>
      <p>Just fill out whatever value you want in the metrics window, and voilà!</p>
      <p>If you are actually talking about a character that "has black as well as white," you need to make, say, three copies of the glyph you want, and scale each glyph separately, using tools &gt; action &gt; contour &gt; scale &gt; (fill in values). There probably is a way to get the program to work so you only have to use the command one time (instead of three), but you'll spend far more time figuring it out than just running it three times.</p>
