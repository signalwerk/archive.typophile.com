      <p>If you want non-marking and non-spacing glyphs in FontLab Studio, I don't understand why you are doing all this scaling operation on marking and spacing glyphs. There are a bunch of easier ways.</p>
      <p>To create a non-marking and non-spacing glyph in FontLab Studio:<br>
      - go to the font window.<br>
      - double-click on any unused (grey) glyph slot shown in the font</p>
      <p>The glyph slot will turn white. You are done.</p>
      <p>If the glyph you want is not visible as a grey unused slot, you may need to select a different encoding view. </p>
      <p>Or you can use the "Generate Glyph" dialog. Let's say your first blank glyph is in the cap A slot, and you want more as B, C and D. At the font window, go to Glyph &gt; Generate Glyphs (Cmd-G). Type "A=B A=C A=D" and hit OK. Or copy your "A" glyph and paste into B, C and D.</p>
      <p>You can even use the Generate Glyphs dialog to generate empty non-spacing glyphs when you don't have any defined yet, because if you use a name it doesn't recognize as the input, it will create... an empty non-spacing glyph. So for example if you use the dialog and type in it "xyz=Irving xyz=Forbush" even though you have no glyph named xyz, you will still create glyphs named Irving and Forbush.</p>
      <p>Another route: once you have one such glyph (created as above), you can select an existing empty white glyph in the font window. Copy it, then do a contextual click (right-click or Ctrl-click) and choose "append glyph." A copy will get added to the end of the font, with a default name derived from the original glyph's name. You'll need to fix the encoding and name of the glyph, which you can do with another contextual click and selecting "properties" and editing in the resulting window.</p>
