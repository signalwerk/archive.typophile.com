      <p>1. The value in "scale" is a percentage. As such, it can be expressed as a decimal, right? So "1" here also equals .01, and the action is multiplication. Something that was 100 units wide becomes 1 unit wide after running the "scale" routine with a vale of "1". </p>
      <p>Try a little test with a character where the character is not simply "space,"</p>
      <p>2. But the "scale" action takes place on the bezier curves, it's not meant to change width in space-only characters. It may do so, but that wasn't the purpose of the tool. For space-only modification, you set the width directly, either in the glyph window by pulling the "width" bar, or easiest, in the metrics window, by directly assigning the width you want.</p>
      <p>It should be clear to you that you're using the program in ways the developers didn't intend, so the best course of action would be to try something &amp; see the result. Essentially, what you're doing is asking us to try these little tests for you, then report back. Problem with that is, as always, communication. (Nor should you be offended if no one wants to play.)</p>
