    html: <p>What T Phinney is suggesting is a much more straightforward way to do what you are looking to do. I'm puzzled about the 3 x 1% thing. Where did it come from? Also, I've had occasion to create fonts similar to the Adobe Blank Font but was able to cut down greatly on file size by duplicating the "blank" glyph by designating an initial glyph as a "master" to be inserted as a component into as many character slots as there needs to be. (Works great for repeating the same outline over and over again while adding next to nothing to the file size because a large part of the data is simply a pointer to a glyph contained within the same character, over and over again.)</p>
