    <p>Hi everyone - I found the perfect typeface for my design project "LTR Federal" - but unfortunately I don't have the $300 - does anyone maybe know of a cheaper typeface that is similar to this and of a reasonably high quality?</p>
    <p>I found this one that is free <a href="http://www.smackbomb.com/famousfonts/fonts/onedollar.html" title="http://www.smackbomb.com/famousfonts/fonts/onedollar.html">http://www.smackbomb.com/famousfonts/fonts/onedollar.html</a> but its not great quality and the proportions are out a fair bit.</p>
    <p>Thanks</p>
    <p>Jamie</p>
  html_clean: |-
