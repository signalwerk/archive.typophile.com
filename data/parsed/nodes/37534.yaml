      <p>Hi Jamie,<br>
      yes, the whole <a class="freelinking external" href="http://www.letterror.com/catalog/fed/order_pack.html" rel="nofollow">LTR Federal pack</a> is $300, but if you're looking for a single weight with shading, any of the <a class="freelinking external" href="http://www.letterror.com/catalog/fed/order_6.html" rel="nofollow">Six</a>, <a class="freelinking external" href="http://www.letterror.com/catalog/fed/order_9.html" rel="nofollow">Nine</a>, <a class="freelinking external" href="http://www.letterror.com/catalog/fed/order_12.html" rel="nofollow">Twelve</a> or <a class="freelinking external" href="http://www.letterror.com/catalog/fed/order_18.html" rel="nofollow">Eighteen Line</a> packs ships for $95. The Cameo -- <a class="freelinking external" href="http://www.letterror.com/catalog/fed/order_reserve.html" rel="nofollow">Reserve Note</a> version is only $45.</p>
      <p>Cheers,<br>
      Erik</p>
