    html: <p>A font can be 'enumerated' for the current session using Windows API's (AddFontResource) without the font being physically copied to the Windows fonts folder - this is how private fonts are enumerated (eg. the teletext fonts in Windows Vista) and how font management apps work. But as identified elsewhere, most people would consider the font installed, if only temporarily.</p>
