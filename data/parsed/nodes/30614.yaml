      <p>&gt; What I mean is that a TTF can reside quite nicely anywhere else on the computer, be previewed, etc, without being installed.</p>
      <p>Not sure this is what you want, but in Windows, if you uncheck "Copy fonts to Fonts folder" in the Add Fonts dialog box, a shortcut to the font is placed in the C:\Windows\Fonts folder instead of the font file itself. But it's still 'installed' in the sense that all Windows applications can see it.</p>
