    html: |-
      <p>oh boy, you're using windows and having problems - go figure.</p>
      <p>I'll write this thing from two perspectives, for everybody who reads this post.</p>
      <p>for Mac/Linux/Unix users:</p>
      <p>Fonts that are 'installed' in the system simply mean the fonts are located in a folder that the operating system or applications scan on startup to build a font-cache.  They're buried in the system, and when you 'install' a font, all it does it simply create a duplicate file within this folder.  For linux/unix users, the user's fonts are stored in a hidden .font folder in the user's home directory (~/.fonts/).  On the macintosh, these fonts are stored in home/library/fonts/.</p>
      <p>If you have specific groups of fonts sorted by project or style or however you sort them, place those fonts in a folder and when you want those fonts 'installed', simply move that folder into the user fonts folder and restart the application you are working in.</p>
      <p>For windows users:</p>
      <p>Windows isn't as intuitively designed as the *nix family of operating systems and wasn't built with production in mind.  It has been upgraded and hacked into being sufficient, but certain things like font-management are much more difficult on windows.</p>
      <p>I believe the font directory in windows is located somewhere around C:\system\fonts\ or something like that, it shouldn't take too much time to find it.  I'm not sure off-hand where user-fonts are installed, but same deal goes, if you place your groups of fonts in folders, you can move these folders or 'font modules' in and out, and after a restart, they're be recognized and in place.</p>
      <p>For users of both:</p>
      <p>There are programs like suitcase that allow font management and sorting, meaning you can have thousands of fonts installed, but only have certain fonts 'activated' at any given time (like an automated system to move the folders) and these can cost a lot of money, or some are free (as on linux with certain desktop environments).  One tool I love/hate is Linotype's free tool FontExplorer X.  It's free for mac, and the free PC version is coming soon.</p>
      <p>Think of it as an iTunes, but for fonts.  You're strong, you'll adapt.  But best of all, it allows you not only to browse your collection, but also type in a custom preview (which is handy for font identification) and will allow you to see it in all weights of any selected font simultaneously!</p>
      <p>Best of luck, and I hope this post was helpful to somebody out there!</p>
