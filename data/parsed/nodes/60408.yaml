      <p>While I can understand the ease of using Typophile’s tracking functionality (and I second the request to be able to track a thread without having posted oneself), there are alternatives:<br>
      Bookmark the thread in question. Most browsers let you organise your bookmarks in folders, thus you could set up your Typophile folder.<br>
      Every thread has an RSS feed, see the little ‘rss’ link at the end of the original post. If you use a Feedreader, you can subscribe to the thread and keep track of new posts. In some browsers, you can store the RSS feed as a dynamic or ‘live’ bookmark.<br>
      F</p>
