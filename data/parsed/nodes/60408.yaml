      <p>This site is great. But I do hope that something is fixed with the tracking so that Christopher Dean doesn't have to write the word Tracking in every single thread. I mean, imagine if that caught on and everyone wrote the word Tracking.</p>
      <p>If I do a search with the word Tracking, I find every single thread in which he has listed the word Tracking. What if I was looking for information on Tracking, as in letterspacing? I would be forced to sift thru all of his Tracking posts.</p>
      <p>I therefore propose that Christopher use a different word, unrelated to typography itself, such as "disruptive," or "selfish."</p>
      <p>Thanks.</p>
