      <p>Unfortunately, this is getting into You People Suck territory real fast. The fact remains that this site is not per se “moderated”&nbsp;and the so-called moderators have done nothing to make themselves conspicuous or available. A “PLEASE READ” sticky thread about <em>how to post</em> is no substitute for a properly managed and open advisory of who runs this site. (It’s “a Punchcut gig.”&nbsp;What?)</p>
      <p>Let me just ask one question here: More than half a decade in, why is it only now we are “meet[ing]” our “moderators”?</p>
      <p>Typophile is not MetaFilter, but MetaFilter works better than Typophile and you should steal their ideas. I already have a list of suggestions from MetaFilter’s admins. A later thread will be posted.</p>
      <p> “I think Typophile is just great!”&nbsp;is not an argument against improvement, including the improvement of adding a MetaPhile section for discussions <em>of</em> Typophile.</p>
      <p>Typography is a field that requires a long apprenticeship just to develop an eye. Well, guess what: The Internet has been around a long time (longer than the Web), and many online fora predate Typophile by years. Your own limited experience, and your gloss that things are just <em>fabulous</em> here, are no substitutes for a rationally managed and continuously improving Typophile.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
