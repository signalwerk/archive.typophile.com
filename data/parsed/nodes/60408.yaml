      <p><cite>Unfortunately, this is getting into You People Suck territory real fast.</cite></p>
      <p>Joe, your angry soul needs a little therapy. Perhaps getting outside and enjoying life beyond the internet would help. Or, maybe you'd like to volunteer your personal time to a community that you have been taking advantage of for over 4 years? Griping about it all the time is the easy part.</p>
      <p>I have said this more times than I would like to admit, but we are well aware of areas on the site that could use improvements. To the development, the architecture, and the need for new and improved features. We do what we can - <cite>when we have the resources</cite> - but as a design firm that has full time clients, and with a small handful of people that have families and real lives outside of their careers, making these changes can be very difficult to achieve. But we try and we do what we can and we are making progress on the next generation of the site.</p>
      <p>Moderators have <strong>always</strong> been present and known throughout the community, and have always been actively involved - for 9 years now. So making the claim that "…so-called moderators have done nothing to make themselves conspicuous or available" is absolute rubbish.</p>
