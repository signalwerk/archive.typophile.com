      <p>While there is always room for improvement in any site or forum and I agree that Typohile could use some fixin' for sure, it is far easier  to spot flaws than it is to fix them. We all have to remember that there is no paid staff or moderators here. This is a "for the love of it" group of volunteers who work here--they also have full-time jobs, full-time families, and the need for a few hours sleep on occasion. They are doing well more work than they are thanked by us to do. let alone paid by us to do.</p>
      <p>We all know it isn't the most perfectly done site on earth and we would all like to see constant improvement. Since it is a"for the love of it" free gig, that only happens when more people volunteer their private time to do it.  The point is, any of us who has a problem with the site can also volunteer not just a verbal solution but pitch in the sweat off their brow to make it happen.  Pony up or be willing to live with the bumpy ride. Give the moderators the slack that you would want if you were doing it as a freebe.</p>
      <p>ChrisL</p>
