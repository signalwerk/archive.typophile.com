    html: |-
      <p>This information, hitherto almost concealed, is still unavailable from the mostly-Flash, unindexable monstrosity that is the homepage or from any obvious other place. It was completely unknown to me (and, admit it, to you) until today.</p>
      <p>And it’s posted here to preëmpt a discussion of doing what the most successful online forum, MetaFilter, does: Run a separate forum just for discussions about the forum.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
