    html: "<p>Typophile books is a great list of books in Typography and Type Design, with some reviews, but it's going into hiding for two or three years. Like the tracker: <a href=\"http://www.typophile.com/tracker\" title=\"www.typophile.com/tracker\">www.typophile.com/tracker</a>, you can get to it by <a href=\"http://www.typophile.com/books\" title=\"www.typophile.com/books\">www.typophile.com/books</a>, but there's no link to it. Why is that, moderators?</p>"
