    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : <a href="/wiki/David%20Lawless" class="freelinking" rel="nofollow">David Lawless</a></strong></p>
    <p>David Lawless was born in Liverpool, <a href="/wiki/United%20Kingdom" class="freelinking" rel="nofollow">UK</a>, in <a href="/wiki/1974" class="freelinking" rel="nofollow">1974</a> and studied Graphic Design in 1992 at <a href="/wiki/Kingston%20University" class="freelinking" rel="nofollow">Kingston University</a>. He started work at MET2, a small design studio in Manchester, in 1994, as well as teaching Foundation and HND Graphic Design part time at St Helens College of Art &amp; Design.</p>
    <p>He now works full time at Studio Liddell, a design, illustration and animation studio based in Manchester.</p>
    <p><a href="http://www.studioliddell.com" title="www.studioliddell.com">www.studioliddell.com</a></p>
