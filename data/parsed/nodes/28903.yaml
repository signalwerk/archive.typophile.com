      <p>At last, an occasion to de-lurk. I was able to fit your draft into one page without major changes to the content or layout.</p>
      <p>Regardless of what you end up doing, though, there’s an important point: in Word, the line number formatting is based on the Normal style. It looks like you manually applied Sabon to each paragraph. Therefore, the line numbers in your draft are in 12 point Times New Roman (TNR), while the text is in 12 point Sabon. Whichever font and point size you end up using, you should make the appropriate changes to the Normal style and then use Normal style for all text except the footnotes, which use the Footnote Text style, and the superscript footnote references, which use the Footnote Reference style.</p>
      <p>This is what I did to get to one page:</p>
      <p>-- Set the top and bottom margins to 0.5 inches and the sides to 0.7 inches. This leaves you a little room to play with; I can make the top margins as small as 0.35 inches on most printers. I wouldn’t make the side margins much smaller than 0.7 inches, though.</p>
      <p>-- Changed the Normal and Footnote Reference styles to 10.5 point TNR and the Footnote Text style to 10 point TNR (see below for other fonts I tried). Used single line spacing, and for the Normal style only, used six points spacing after.</p>
      <p>-- Set the footnote spacing to zero before and after (set via the Footnote Text style).</p>
      <p>-- Deleted the six point spacing after the footnote separator (the horizontal line at the bottom of the page; you have to be in Normal view instead of Print Layout view to do this).</p>
      <p>-- Reapplied the modified styles to the text, footnote references, and footnotes.</p>
      <p>-- Deleted extra carriage returns.</p>
      <p>-- Ran the paragraph titles in with the body text and used a spaced en dash as a separator; a colon would work, too. Made the paragraph titles bold.</p>
      <p>-- Manually changed the spacing after the title (statement of faith) to twelve points.</p>
      <p>-- Manually changed the spacing after the last paragraph (a concluding prayer) to three points.</p>
      <p>-- Deleted “I believe that” from the start of each paragraph and rewrote the subsequent text accordingly. I didn’t delete “I believe that” when it occurred someplace other than the first sentence of a paragraph. If the opening "I believe that" is a requirement, you'll have to do more editing on other text. </p>
      <p>-- Made some minor edits to paragraphs that ended up having one or two words in the last line.</p>
      <p>After I got the text to fit on one page using TNR, I tried some other fonts. I’m not saying these are good, just that they worked, and will give you starting points for using other fonts:</p>
      <p>Classical Garamond (Bitstream clone of Sabon): 10 point text and footnote references, 9.5 point footnote text, line spacing set to exactly 11.8, content editing needed to eliminate some one or two word lines.</p>
      <p>Perpetua: 12 point text and footnote references, 11.5 point footnote text, line spacing set to exactly 11.3, content editing needed to eliminate some one or two word lines.</p>
      <p>Dante: 11 point text and footnote references, 10.5 point footnote text, line spacing set to exactly 11.8, no content editing needed.</p>
