      <p>Traci:</p>
      <p>I'd suggest the following: section headings in small caps of the same point size, with the explicatory text immediately following, beginning on the same line (this will save 11 lines at least); </p>
      <p>break the text up into two columns, although due to the numbering this might waste more space than it frees up, and if so, nevermind (there are ways around that though; labeling columns L and R and having the same column of numbers apply to both, but that might get complicated);</p>
      <p>get rid of the extra (double) spaces after periods and before the beginning of a new sentence;</p>
      <p>reduce the size of the right and top margins, and</p>
      <p>very slightly narrower type, although this you may not need.</p>
      <p>And watch your H&amp;Js.</p>
      <p>---</p>
      <p>jlt : <a href="http://www.hewnandhammered.com" title="http://www.hewnandhammered.com">http://www.hewnandhammered.com</a> : rnrmf!</p>
