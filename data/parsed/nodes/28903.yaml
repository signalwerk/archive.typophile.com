    <p>Hey All...<br>
    I have never been disappointed by this forum's brilliance on all things typography and page design. Hoping someone has some time and desire to help with this toughie. I really don't know a ton about this, and this is quite a practical situation... </p>
    <p>The document (attached) is for my final exam as a future minister. I just received word that the document addresses all of the requirements, but needs to be only one single page. There seem to be no rules about condensing, font size, etc. but it has to be readable (and, I would add, I would like for it not to look crazy and overwhelming compared to other candidates more consise statements.) </p>
    <p>So... the issues: </p>
    <p>1. What are the best ways to condense this so that it is still readable and doesn't look anxious? (I can play with the space between the letters, font size, margins, and all of those other things normal open office/microsoft users know how to do... If there's a really spectacular font that will help do the trick I would consider buying it and adding to my collection...) </p>
    <p>2. If there's no way around cutting some text, how much would you suggest? (Obviously the easiest route to go is to cut some text, I really hesitate to do that, however, because I know the "content" on this document will help me pass the exam (according to the person who read it.) </p>
    <p>What to do! What to do! Please help!! I'll be more than happy to help YOU with something "ministerish" in exchange, ha ha :) </p>
    <p>I'm attaching it in both .pdf and word. It might look goofy in word on your computer, depending on if you own Sabon or not. </p>
    <p>Thanks so much in advance! </p>
    <p>Traci "the wordy minister."<br>
    PS the line numbers on the side have to be included so that the questioners can make reference to them. ("In line X you say...")</p>
