    <p>A fresh, clean Slab that plays in the space between the Typewriter and the Storybook. I'm shooting for something highly sophisticated, and I'm very detailed in my approach; so please give me as in-depth a critique as you are able.</p>
    <p><a class="freelinking external" href="http://www.quiptracks.com/personal/Albuquerque_TextPoster.pdf" rel="nofollow">{PDF version}</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/r8_TextPoster_4813.gif"></div><p></p>
    <p>I don't mean to nag, but I know there are a lot of really talented fontographers here. And I know that they occasionally apply their expertise toward constructive advice... And I've tried to be a part of this community, writing several lengthy critiques of others' work. So, what I'm asking is: I can has critique now please?</p>
