      <p>Ah yes. I knew someone would bring up Museo. I was going to nip it in the bud but I forgot :P</p>
      <p>I discovered Museo 3/4 of the way into designing this font (Shocking, I know, since I now can't seem to escape it). I was kind of sad at first because the U A V, etc. are similar, but my font (really wish I had something else to call it) is a serious slab serif, whereas Museo is a Sans that bends into serif-like bits occasionally. Also, Museo uses geometric circles in its round characters (or close to) and has a much higher x-height.</p>
      <p>I'd like some non-Museo oriented critique, but I think I will make a comparison chart...</p>
