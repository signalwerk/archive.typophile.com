    html: |-
      <p><cite>Albuquerque is more memorable (albeit more prone to misspellings ;-) </cite><br>
      Indeed, Albu<strong>r</strong>querque has been misspelt in the US ever since (according to urban legend) that station master put it up wrong on the station sign.</p>
      <p>More seriously, I like it, though the <em>q</em> bothers me.  The point would normally go higher, but to parallel the <em>g</em>, you've placed it in the middle.  This makes it stick out like a thorn.  What about doing a stub on the descender?  It's quite common in Spanish to write the <em>q</em> with a crossed descender.</p>
      <p>I agree with aliason about <em>h</em>, <em>n</em>, and <em>u</em>: but I think just be condensing the letters some you should be okay.  The serifs aren't creating any extra space on the outside, just there's still a bit too much negative space on the inside.</p>
      <p>I'd probably also make the <em>A</em>'s spurs a bit bigger, in the smaller text they're practically invisible.  The only other thing is I'm not sure those punctuation marks quote fit the style, but I'd need to see some more complex quoting action to know for sure how I feel about it.</p>
