      <p>New version: (see first post)</p>
      <p>Biggest change was the Cap height, which I lowered by about the height of the serifs. Not a major change, but I think it made a major improvement.</p>
      <p>The /M/ was altered a bit beyond that, making the slopes less pronounced. riccard0 probably still won't like it, but I had another friend urging me to keep it the same.</p>
      <p>Numerous other small adjustments, mostly optical compensation, and added characters.</p>
