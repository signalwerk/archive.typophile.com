  html: "<p>Their typefaces are all over the world: on almost everyone's PC or Mac desktop, in the Paris Metro, you name it... <br> <br>Type Directors Club <br>Type Salon: Annual Judges Night <br>Thursday, January 20th, 6 p.m. <br> <br>Kris Holmes (Bigelow and Holmes) <br>Her pioneering work with Charles Bigelow for Apple and others, including the latest non-Latins. Lucida started releasing in 1984, so her talk is entitled \"Lucida Turns 21.\" <br>&amp; <br>Jean Fran</p>"
