      <p>This doesn't look especially familiar, so my suggestion is to find a roughly similar slab serif and customize the serifs to look like these. The O's are a special case, but I think you could move some outline points to create the indented notches.</p>
      <p>I notice that the S is oddly upside-down looking, so you might also flip the S in the font you choose.</p>
      <p>- Mike Yanega</p>
