    <p>I checked in with a typog-pal - he thinks it is some very idiosyncratic hand-lettering, which is probably true as it was commissioned from a branding company for a tailor-shop.<br>
    I am just curious if anyone can point me to anything very similar - or if it possibly exists in digital form as a serial font. I have done some online searching through some old Tuscans &amp; slab-serifs (as per suggested by my friend) but haven't encountered anything that suits my fancy as much as this one.<br>
    Also - if this is indeed just some fancy-pants hand-lettering - are there any copyright issues with 'ripping' it off? Or perhaps 'ripping' aspects of it?<br>
    Forgive these if they are amateur questions, I know next to nothing about typography. All I know is I adore this font and want to get my grabby hands all over it for the purposes of a website.</p>
    <p>Thanks for any advice!</p>
    <p>Dani</p><div class="imageWrap"><img src="http://typophile.com/files/nortonsons_identity_6_4033.jpg"></div><p></p>
