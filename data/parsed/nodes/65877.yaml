    <p>I will be using MVB Sirenne Text Bold (<a href="http://www.mvbfonts.com/html/fonts/sirenne/cs_sirenne_text_bd.htm" title="http://www.mvbfonts.com/html/fonts/sirenne/cs_sirenne_text_bd.htm">http://www.mvbfonts.com/html/fonts/sirenne/cs_sirenne_text_bd.htm</a>)for a business card design. </p>
