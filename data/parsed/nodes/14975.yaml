      <p>Creo que se ve muy bien, tiene detalles muy sabrosones...<br>
      Me gusta, y funcionaría muy bien.</p>
      <p>Creo que con tipografías así de bien diseñadas, deberíamos irnos despidiendo de tipos mas bien irregulares como gill sans. O sea, tipos como estos responden a un caracter mucho más moderno y no respetan tanto las proporciones historicas, sino que buscan la logica.</p>
      <p>Yo respeto mucho los tipos antiguos como gill sans, futura, las garamond, etc, pero en verdad... han sido superados.</p>
      <p>NO quiero ser sacrílego, pero tu tipo lo encuentro muy superior a los que están en uso actualmente, vigentes y "superestarificados" en muchos catálogos.</p>
      <p>Animo que me gustaría verlo luego trerminado y en uso</p>
