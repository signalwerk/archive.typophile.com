      <p>It looks very handsome, and it's warm.</p>
      <p>Stephan wrote: "is ‘Chile Sans’ the proposed name of the font? I doubt that there are intrinsic values of nationality to a typeface, but this is your decision, of course."</p>
      <p>And what would you say on how we got the "style name" Italic? Ok, in Spanish it's "letra grifa": in homage to Francesco Griffo, cut for Aldo Manuzio, Venezia, Italia. Don't know if Chile could be represented, but surely I would not identify Miguel's work with Africa or Germany.</p>
      <p>The Question and Exclamation Marks look somewhat close to the ones in Alejandro LoCelso's Australis (which is definitely good!). Do they come from vernacular forms?</p>
