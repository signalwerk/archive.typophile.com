      Now in spanish: Este trabajo ser{a mi primer intento serio de una tipografia para textos impresos que mostraré en Letraslatinas 2006, lo que me tiene muy motivado, pronto les linkeare a un blog para recibir mas comentarios de diseñadores.<br>
