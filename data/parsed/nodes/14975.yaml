      <p>Really interesting typeface. Overall I like the personality of this type face.<br>
      I'd suggest few things :<br>
      a: seems unbalanced. Probably the top is too long to the right or the bowl is too short.<br>
      g: the connection between the two storeys is too in the middle. His ear would be better if it had an other terminal, something like «a» or «s» terminal?<br>
      r: I would rework the top terminal. May be like the terminal of the «t».<br>
      B,R: the top bowl is too big compare to the bottom one.<br>
      H,E,F : the middle bar is also too low.</p>
