      <p>Hey, Gracias for your comments guys!<br>
      There are a lot of motivation behind Chile sans, i will use a blog too for updates and discuss about thsi font, and other chilean and latinamerican identity fonts who i am working on..</p>
      <p>- Please visit: <a href="http://chilediseno.blogspot.com/" title="http://chilediseno.blogspot.com/">http://chilediseno.blogspot.com/</a></p>
      <p>BTW, There are 2 new attachs in teh first post, updated: the regular version and somo fixations..</p>
      <p>Sim: there are some middle bar lower proportions who are axagerated, but is for a clear reason: friendlyness appearence. I want to fix it a little if got problems with legibility, but the idea is to mantain the proportions from humanistic a and e counterforms equal for the mixed open and close counterforms from A, R, etc.</p>
      <p>Eduardo: The previous effort will be a different font, with a new name. Now Chile sans its too soft because of the friendly appearence that i want to add on it, specially to make a great difference with other sans fonts like Meta, who are more serious, i will keep the idea to use sans for signage for example, but with latin cute tasty favour, just like vernacular Chilean signage.</p>
      <p>Best,</p>
      <p>mh.</p>
