    <p>Hi,</p>
    <p>This is Chile sans, a typeface for identity and reading. This "new" font its different form my past chile sans font with inverted contrast(who will be in stand by). Well, the concept behind the face is to make a font to be used by chilean graphic designers.<br>
    I will post advances for my new Chile sans font from today to the letras latinas 2006 exposition. The font include:<br>
    Regular, Bold, Italic, headline and Icons.<br>
    This is the current version of Chile, in headline. Your comments are welcome as always :)</p>
    <p>mh</p>
