      <p>Hi,<br>
      Did you change the space between the uc 'C' and lc 'h' in your (white on red) user picture? It looks slightly different to the 'Chile' in the (white on black) sample you provided. The C|h and the l|e do need a little less whitespace, I would say (also compared to l|a at the beginning). The S|a|n looks a bit odd (does the curved stem of 'a' need more whitespace to the right?)<br>
      Overall, it looks very nice, I like the rounded caps and the low height of the uppercase letters.<br>
      – is 'Chile Sans' the proposed name of the font? I doubt that there are intrinsic values of nationality to a typeface, but this is your decision, of course.</p>
