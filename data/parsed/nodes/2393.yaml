    html: "<p>Raja - you have a lot of clever stuff. Long loading <br>time for dialup ... <br> <br>I'll give you a Top 9 and 9 more to get rid of.  <br>Maybe that helps. Just one person's opinion. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>TOP 9, in no particular order: <br> <br>1. Studio Z <br>2. enlargel <br>3. Ashley <br>4. Gull Chaser <br>5. JCK <br>6. Fashion Australia (like this one the best!) <br>7. X365 <br>8. Alta View (omit the word business) <br>9. Bachman <br> <br>9 to get rid of, in no particular order. <br>1. Lightforce Student Ministries <br>2. Hostproject <br>3. Envirogreen <br>4. Angry Toddler <br>5. Fernely Online <br>6. AZ fans <br>7. DJ Clip <br>8. Tropical Landscaping <br>9. Select Advisors <br> <br>There are too many to give individual critiques, but <br>overall, I'd say you have some good instincts and <br>a good sense of what it takes to craft memorable logos. <br> <br>Your use of counters will take you far, as long <br>as you don't force it. <br> <br>There are a few instances where the logo could've <br>been helped by a more distinctive type treatment. <br> <br>(harvey lawncare or select consultants for example) <br> <br>and some instances where better art would've helped. <br>(angry toddler, fernely online, walnut works) <br> <br>getting deeper into typography can only help you as <br>progress as a logo designer. <br> <br>there are a lot of threads here with good information <br>and links. <br> <br>just ask for something, and we'll point you in the <br>right direction. <br> <br>one place to check out is logolounge. <br> <br><a href=\"http://www.logolounge.com/\" target=\"_blank\">www.logolounge.com/</a> <br> <br> <br>bj</p>"
