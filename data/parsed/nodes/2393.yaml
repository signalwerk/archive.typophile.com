  html: <p>Hi Everyone. My name is Raja and I have been designing for almost 2 years now. I picked up Photoshop 2 years ago and have been using it ever since. I am now trying to come to grips with Illustrator as I learn that it is the standard for logo creation. <br> <br>I received an anonymous email from someone that suggested I could really improve my work by having it critiqued here. Having browsed the threads, I am quite impressed by the knowledge, talent, experience, and willingness to help of members here, that I agree with that person. Anyway, I have temp page up that displays some of my logos, what I would like to know is, that if you had to reduce the number of logos to approximately 15, to display in your new portfolio, which are some that you definitely would remove, and also, which ones would you think should really be shocased in your portfolio? <br> <br>Any other comments or suggestions are also welcome (I know I have a lot to learn when it comes to type) <br> <br>Thanks!   <a href="http://webfellaz.com/" target="_blank">http://webfellaz.com/</a></p>
