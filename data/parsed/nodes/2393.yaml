    html: <p>Thanks all for taking the time to have a look and offer comments. Everything I read is still sinking in. I'm still a bit humbled after being nosey and checking your profiles <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>BJ Harvey, thanks for your shortlist and the nice comment. I agree with your top nine to get rid of. However, I feel, at this early stage, I need to show some cheesy, cliche designs. The majority of my clientele is made up of really small businesses such as teens starting up a 'web design firm', local ma and pa(that don't even have a website), relatives and logo design contest holders. The Norah Jones gig was the result of me just simply emailing her and proposing this idea, her management led me on for a bit and then never got back to me. Regarding type, I'm just learning how intricate and beautiful it is. I started out (2 years ago) designing web pages. I found that there was too much you could do, it was overwhelming to start out the design process. I started to focus on smaller desgins, banner ads, buttons etc. I then fell in love with the challenge of logo designing. One square inch to say more than what an entire website could say. Typography is the next level IMO. I have no education in design or art, so I may sound absurd. <br> <br>HD Schellnack, thanks for commenting. I havn't been designing logos for as long as you may think. I havn't ever worked for someone else or a design firm either. A lot of times I'm asked to mimic another design, I hate it, but I do it. Since I don't have enough confidence to raise my design rate, I practically take every job and give 'em what they want. I know this can open up a whole design ethics debate, but I have to do things to make ends meet, for now anyway. There are only a couple of designs that are in use that were sort of 'ripped'. If there are others, then something must be embedded in my subconscious from something I have seen before. Other than that, when I have the ball in my court, I stay 100% original. You are so right about broadening my style to something more modern. I just find it hard to be crafty or clever or apply some dichotomy when keeping inline with a modern style? I have never really been asked to create a brand. (I had to google a lot of the terminology used by you guys.) I agree totaly with your off-thread comment and Rodolfo Capeto's comment. <br> <br>Kevin Pease, an ambigramist, thanks! I really enjoyed your work. Your right about the suits, even though in my case they are known as the track suits, shot callers nonetheless, albeit on a deifferent field in my case. Not proud of the K@ logo, so, I'm going to remove it, I'm sure you'll find another to link to though <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Hrant H Papazian, thank you as well. I think Enlargel could penetrate into first place if it was made bigger? <br> <br>Daniel Poindexter, I can burn HostProject and CashGo (ironically the same client) but I'm still working on Fitness Wave , it's progressed since then, AND it's my ex-girlfreind starting up her own fitness club, that one has sentimental value for me, for a little while anyway<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> I even display the first logo I ever designed in my portfolio for sentimental reasons. <br> <br>Thanks again everyone, I know when I browse forums, I tend to not comment when I could have, just being lazy or something. This is very appreciated. <br> <br>-Relative Rookie</p>
