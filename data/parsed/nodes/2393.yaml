    html: "<p>Good range of work, some really good stuff, some poor and deriatrive, smacking of stuff you'd find in an old Graphis book. While most is very solid, it feels as if you've ripped of stuff from some 80s and 90s anthologies... with some exceptions they just don't feel contemporary. (Maybe because you did them some years back???) Still, for what they are they're pretty sound.  <br> <br>That said, your work shows a wide range and a very nice sense of graphical abstraction, even a strong hint of more simplicity and reduction and s olid eye for classic-american logo-style and composition.  Maybe you should broaden your range and develop an eye for a more modern approach to brand-identity and for more ideographic solutions. That, plus a step away from too classic a typographie, a step towards more contemporary fonts, would be nice. <br> <br>What I liked:  <br>Balance <br>Norah Jones (although it doesn't fit her music) <br>JCK (funny stuff :-)) <br>Leapman (typo needs work, though and the honeycomb-idea is quite close, still... it clicks with me) <br>Primacy (very 80s, imo, gaphics need a bit of polishing) <br>Health Edge (still... never let Xerox hear of THAT) <br> <br> <br>Off thread...  <br> <br>By the way: This site makes me realize a bad trend in design: Logos for everyone and their dog. I think a logogramm once was something for a global company, a major brand that has to be recognized internationally or so big that you needed a constructed identity to communicate to the masses who you are. Nowadays every small bakery seems to have a more or less individual </p>"
