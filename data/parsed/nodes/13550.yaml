  html: <p>P-Type Publications, a division of <a href="/wiki/P22" class="freelinking" rel="nofollow">P22</a>, publishes <a href="/wiki/Indie%20Fonts" class="freelinking" rel="nofollow">Indie Fonts</a>, a series of specimen books featuring fonts from selected font foundries. Each of these handsome volumes shows thousands of font samples in a way that makes it easy to visualize what the fonts will look like in print. In addition, each book includes a CD with representative fonts from most font foundries featured.</p>
  html_clean: <p>P-Type Publications, a division of <a href="/wiki/P22" class="freelinking link-lost" rel="nofollow">P22</a>, publishes <a href="/wiki/Indie%20Fonts" class="freelinking link-lost" rel="nofollow">Indie Fonts</a>, a series of specimen books featuring fonts from selected font foundries. Each of these handsome volumes shows thousands of font samples in a way that makes it easy to visualize what the fonts will look like in print. In addition, each book includes a CD with representative fonts from most font foundries featured.</p>
