    html: |-
      <p>Unless you have the ME (Middle East) version of Illustrator from WinSoft, setting Arabic text requires extra effort or software. If you have Illustrator CS4 or CS5, you can get a plug-in called ScribeDoor that will enable right-to-left languages: <a class="freelinking external" href="http://www.winsoft-international.com/en/store/scribedoor-for-illustrator.html" rel="nofollow">http://www.winsoft-international.com/en/store/scribedoor-for-illustrator.html</a></p>
      <p>You can also use scripts to manipulate right-to-left text in Illustrator CS4 or CS5, which are free but require a little more understanding of the software: <a class="freelinking external" href="http://www.thomasphinney.com/2009/01/adobe-world-ready-composer/" rel="nofollow">http://www.thomasphinney.com/2009/01/adobe-world-ready-composer/</a></p>
      <p>If you have Illustrator CS3 or earlier, then it is not capable of setting right-to-left languages. You need to upgrade to a more recent version or else obtain Illustrator ME.</p>
    html_clean: |-
