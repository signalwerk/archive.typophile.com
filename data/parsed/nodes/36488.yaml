    html: |-
      <p>the problem with all of these fonts is most of them (except tulip) are actual representation of ornaments or natural things that are inspired of nature. so they are more like photos, than typefaces.</p>
      <p>the thing is, you need to look at pictures of the nature and not copy a flower per-se, but to seek a kind of “graphic language” or “behavior” in the nature. for example, i can take a metal spring. take pictures of it, bend it, stretch it, in order to see how it “behaves” in different poses. then make a design of typeface that emulates that springy behavior, but never forgets the legibility and the graphic nature of the latin type.<br>
      it’s like a hybrid.</p>
