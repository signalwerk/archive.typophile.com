      <p>Oh, OK. You can do that in Corel with a Blend effect.<br>
      (when you said "blur" I assumed you were trying to get the effect of an object being blurred, as if it was moving past the viewer very quickly.)</p>
      <p>With the blend effect, you can draw the lightest part of the highlight you want to apply, then "blend" it into the base object, with as many steps as you'd like. Note that because you're working with vectors, this can be complicated. You're essentially creating lot of concentric contours, each slightly lighter than the previous one. The number of contours you use will determine how smooth the transition is, and it may take changing some of the nodes.</p>
      <p>I'm not sure what you're doing in the second image, it's too large for me to get what you're trying for.</p>
      <p>Jason C</p>
