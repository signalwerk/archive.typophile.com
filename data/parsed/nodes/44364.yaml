      <p>Hi; [I only have Corel X4 (14), but I think most of what I'll say is true in 13]<br>
      the actual "blur" effect is only available for bitmap images in CorelDraw, but dependign on what you want it to look like you might get something from other vector effects. The closest vector effect I can think of is the "distort" tool, available from the fly-out of the blend tool. you can see the tool here:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled_3639.jpg"></div><p></p>
      <p>In this graphic you can see the unaltered text, and effect caused by the distort tool:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Graphic1_5893.jpg"></div><p></p>
      <p>thanks,</p>
