    <p>As part of my studies I'm writing an article on personal charatersitics/personality traits which are common with typographers and good leaders  (its inspirational and I'm being a bit creative with it).<br>
    I was wondering if anyone had any thoughts about this? I was thinking along the lines of patience,  influence, conscientious,  visionary, often highly self-critical?  some can be introverted etc...</p>
    <p>I realise some of this is somewhat blurry or subjective and generalised!<br>
    Any thoughts or contributions would really be appreciated!</p>
