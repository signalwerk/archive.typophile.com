    html: <p>When you're writing something "inspirational" for "leaders", falsifiable observations of reality (such as an ad hoc psychological profile of typography professionals) are only going to get in the way. A purely metaphorical premise is safer. Write about what they can learn from <em>typefaces.</em> "The spaces between things are as important as the things themselves," that kind of stuff. You could probably even derive something genuinely meaningful about clarity of communication.</p>
