      <blockquote><p><strong>As part of my studies</strong> I'm writing an article on personal charatersitics/personality traits which are common with typographers and good leaders<cite> (emphasis added)</cite></p></blockquote>
      <p>Hmm. Can't think of any typographers who were also leaders, at least, if you count only corporation of over 50 employees or civil groupings larger than villages.</p>
      <p>Wouldn't it follow that any shared personality traits would be accidental? As you might find with any arbitrary paring, such as typographers and serial killers?</p>
      <p>BTW, if you check Wikipedia on 'type designers,' you'll find that in recent usage, 'type designers' prefer to be compared architects rather than to typographers. I can't imagine why, since the largest and most common  architectural works these days are strip malls (retail parks in the U.K.)... Perhaps apt, though, with the ending of the sign-painter era... <a href="http://typophile.com/node/114821" title="http://typophile.com/node/114821">http://typophile.com/node/114821</a></p>
      <p>Odd assignment...</p>
