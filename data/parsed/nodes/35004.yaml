    <p>Hi all</p>
    <p>I’ve been working on italic version of a sans fonts and using the method described here to correct the curve shape</p>
    <p><a href="https://web.archive.org/web/20080907035024/http://briem.ismennt.is/2/2.3.4a/2.3.4.34.curves.htm" title="http://briem.ismennt.is/2/2.3.4a/2.3.4.34.curves.htm">http://briem.ismennt.is/2/2.3.4a/2.3.4.34.curves.htm</a></p>
    <p>This method shows really good results for glyphs such as O,S,C,D etc. but with glyphs like P, R and B the results aren’t as good. Does anyone have any advise on this matter or know of other methods to help.</p>
    <p></p><div class="imageWrap"><img src="/web/20080907035024im_/http://www.typophile.com/files/P_5462.gif"></div><p></p>
