      <p>The quote from Typographers on Type<br>
      "When, in 1923, I started on my first type design Mr Stanley Morison, whose dissertations on typographical dogma I had avidly followed from their very beginning in <em>The Imprint</em>, had (though rigorously opposed to an all too direct influence of calligraphy on type and most of all to calligraphic characteristics in it) not yet come to deny that type has anything to do with calligraphy, as he has done from the final issue of <em>The Fleuron</em> onwards, to maintain that type does and should derive from sculptured script. I had grown old enought to be aware, with or without Mr Morison's lessons, that type and calligraphy are two essentially different things and that calligraphic influence in type should, as I put it in that same final issue of <em>The Fleuron</em>, be no more than an underlying force. Shall I be able ever to convince him that sculptured script, inscriptions and the like, derive from some form of calligraphy and that, therefore, neither calligraphy nor sculpturing nor engraving should be disregarded when we think of type? I almost doubt it…"<br>
      Jan van Krimpen (1892-1958). On designing and devising type, New York; The Typophiles, 1957<br>
      Any mistakes are down to my typing.<br>
      The 39 page calligraphic letter to Philip Hofer on certain problems connected with the mechanical cutting of punches, <em>Harvard College Library</em> airs the argument with Stanley Morison.</p>
      <p>Does anyone have that final issue of <em>The Fleuron</em> or a reproduction?<br>
      There is an extract in the same book of Stanley Morison's article.<br>
      Tim</p>
