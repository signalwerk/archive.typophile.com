      <p>John, your elaboration is welcome, and makes me think the  way I re-formulated my question is somewhat muddled and that the original formulation was clearer. Perhaps it would have been better to say that the notan requirement and the proper salience requirement or <em>vectors</em> are orthogonal. That is they impose different constraint, or pull in different directions. So design occurs in a force-field traversed by decisional vectors pulling in different directions, the one seeming to favour contrapuntal co-ordination of stroke outlines, and the other seeming to oppose it. Design occurs in a force-field traverse by countervailing pressures.</p>
      <p>Perhaps Hrant's concept of notan is properly differentiated and can accomodate tension or deliberate imbalance (so my second to last paragraph in the opening post is incorrect), but does his rejection of the relevance of assessing one's forms in swept-obect logistical  terms (a moving front of points is a swept object) suggest Hrant hasn't given enough creedence to an important countervailing pressure?</p>
      <p>I love your 'under(deter)mined': underdetermined implies deterred and undermined.</p>
      <p>The force of the pen. Try: the broadnibbed pen provides a formal or optical grammer rich (or dimensional) enough to promote well differentiate (or appropriately overdetermined) perceptual saliency maps and an effective distribution of cue value, but constrained enough not to contribute to the formal breakdown of the word image or, (to say thjis last bit differently) decay of the perceptual integrity and cohesiveness of the bounded map.</p>
      <p>This is why it is not regressive to use the puppetry of the pen as a touchstone or reference point.</p>
