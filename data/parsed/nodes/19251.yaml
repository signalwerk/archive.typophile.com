      <p>&gt;push it somewhat toward typographical specificity</p>
      <p>Yes, I think you raise a very interesting question: What, if anything, is the 'underlying force' of the pen? </p>
      <p>What I suspect is that one needs relatively simple rules to have a coherent looking script. And then one needs to violate them for even color. These rules will generally be pen rules, but they don't have to be. For example, they can be brush rules, or woodcutting rules, as in Chinese characters. But the strange thing is that it doesn't seem that geometrical rules work. All the rules seem somehow to have the hand in them. Why is this? </p>
      <p>Since Noordzij has given the most insight into the influence of the pen, perhaps Peter, you have some ideas?</p>
