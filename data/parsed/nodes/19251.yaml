    <p>Hrant argues that <a href="/wiki/chirography" class="freelinking">chirography</a> is anti-notan.</p>
    <p>This came up again recently in the <a href="http://typophile.com/node/18932 forum">so much for the dominance of chirography</a>, thread, in the context of my discussion of how the brain codes the orthographic shapes of words in terms of chirographic 'scripts'.</p>
    <p>While Hrant's argument has little or no direct bearing on whether the human mind in fact codes orthographic knowledge in terms of chirographic scripts, Hrant's argument has a monumental bearing on how we ought to see the task of typographers and type designers today. If <a href="/wiki/notan" class="freelinking">notan</a> is a relevant concept in the type domain, and if chirography is anti-notan, we should avoid chirographic 'artifacts' in type-design.</p>
    <p>Hrant argues 1) that notan is a relevant and 2) chirography <em>by it's very nature</em> limits our ability to meet the demands of black / white equivalence that the concept of notan evokes. This is so because the tool of writing gives precedence to and arbitrarily constrains the figural logic of the black in a way that is unfriendly to visual wordform (or <a href="/wiki/bouma" class="freelinking">bouma</a>) resolution, because effective visual wordform resolution needs the black and white in balance. (These statements are a mix of my words and his.)</p>
    <p>In a post on the form in question I said:</p>
    <p><em>I understand the logic of your argument from the concept of notan, but I have questions about it’s applicability as you present it.</em></p>
    <p>Your argument presumes notan in typographical contexts implies black / white balance or equivalence. Vision, however, operates according to a logic of saliency and cue-value, and some criterial components are white and others black. The cue values have to be well managed, and the saliencies proper, and doesn’t this imply local inequities in black / white management? So doesn’t this mitigate your claim of linked contours being anti-notan?</p>
    <p>Hrant suggested I make the post an opening statement in a new topic, which I'm happy to do.</p>
    <p>So the question is: notan evokes the notion of equivalence or equal valence, but doesn't the perceptual processing involved in visual wordform resolution rely on differential valences? Perhaps notan in the typographical domain is intended to mean a (global and dynamic) balancing of differential (local and weighted) valences across the bounded map, but doesn't this typographically pro-rated meaning, and the actual functionality of these differential valences at the stem / crossbar / bowl / counters level, soften the absoluteness of the claim that chirography is intrinsically anti-notan? The salience of local features benefits from well-formedness, which contrapuntal co-ordination of stroke outlines guarantees.</p>
    <p>So the absoluteness of the 'chirography is anti-notan' claim depends on a reversion to a more generic and less typographical-domain adjusted sense of notan than is warrented.</p>
    <p>However, my impression is that local effects play less of a role in Hrant's parafoveal guessing-biased scheme than they play in my foveo-centric scheme. And this in turn seems out of stem with Hrants sharp sense of local detail.</p>
