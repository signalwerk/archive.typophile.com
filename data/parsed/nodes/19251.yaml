      <p>"agreeing"</p>
      <p>yes</p>
      <p>'place-holders'</p>
      <p>Letters occupy slots in our notational system, so they are the place holders. Our notational system is alphabetic. Other notational systems fill their slots with other kinds of symbols or marks. We call the place holders in a syllabic script syllabics, and in a hieroglypic notational system heiroglyphs. I like to use the term because it is appropriately generic and keeps in front of us the fact that the occuppiers of the slots are inherent in a system, defined as much by optical-grammatical distances from each other as by referential assignments.</p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
