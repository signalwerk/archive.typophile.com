      <p>I'm glad to hear people talking about tension. So many people talk about 'evenness' as the ultimate goal of a type designer.</p>
      <p>The arm of a lc 'r' is a good example of where evenness and tension need to balance. If the arm is too long, the space becomes distracting. If it becomes too short, there is no tension between itself and its neighbors. It looses its identity and can't be decoded. Finding that balance between uniformity and tension is the challenge.</p>
      <p>Note that balance does not mean the same thing as uniformity/evenness. This is where a lot of people get confused.</p>
