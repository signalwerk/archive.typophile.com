      <p><em>I like to use the term because it keeps in front of us the fact that the occuppiers of the slots are inherent in a system, defined as much by optical-grammatical distances from each other as by referential assignments.</em></p>
      <p>Ironically, I think that is the same reason why I don't like the term. 'Place-holder' suggests to me something generic and temporary holding a place for something specific, e.g. in the way that the generic currency symbol 'sputnik' was used as a place-holder for a specific currency symbol to be grabbed from another font. So it doesn't keep in front of me 'the fact that the occuppiers of the slots are inherent in a system', because it suggests that they are not inherent, but exchangeable. A place-holder holds a place <em>for something</em>. For what? To borrow a construction from Eric Gill, letters are things not place-holders for things.</p>
      <p>To really keep before one the fact that the signs that are individual component of a writing system are 'defined as much by optical-grammatical distances from each other as by referential assignments', I think one needs to stress the holistic nature of writing systems, and for me at least the term place-holders undermines that. I think this is not your intent though.</p>
