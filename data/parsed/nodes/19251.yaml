      <p>William,<br>
      <a href="http://www.geijutsu.tsukuba.ac.jp/~artedu/ae_tsukuba/okazaki/001_08.html"><br>
      The original Japanese word notan actually consists of two Chinese words: 'No' and 'Tan'. 'No' means degrees such as depth, darkness, thickness, concentration, strength, or density. 'Tan' has the meanings of light, faint, pale, fleeting, or transitory. Thus, notan means the degree or gradation of subtle tone, excluding pure white and pure black, by which subjective feelings are represented and fused together.</a></p>
      <p>This suggests that the identification of notan with yin/yang and with black and white is actually a mistake, and that it instead refers to 'aesthetic awareness of tone sensibility', as seen in the sumi-e paintings.</p>
