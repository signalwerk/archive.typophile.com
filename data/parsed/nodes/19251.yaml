      <p><cite>doesn’t the perceptual processing involved in visual wordform resolution rely on differential valences?</cite><br>
      It must do if one accepts contrast as useful; and one conveniently simple model for contrast manipulation is chirography. I think that the ideal for immersive reading can be achieved by an apparently chirographic type in which the designer feels no requirement to conform exterior outlines to a single axis, interior outlines to the axes of their exteriors, or stroke width to the geometry of a moving front, and, as Bill says, this is exactly what one finds with many long-appreciated types.</p>
