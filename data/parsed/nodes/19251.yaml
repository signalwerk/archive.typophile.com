      <p>Peter: <em>I think ‘originating’ might be too atrong a word here, because: doesn’t the pre-history of the place-holders in our script system reached back before the broad nib?</em></p>
      <p>Our uppercase letters have a monoline pre-history in Greek inscriptional letters. But by the time they assumed the classical forms and proportions of our serif'd capitals, they were being shaped with broad brushes, as demonstrated by Fr Cattich. Roman casual writing, with styli in wax, is pretty much indecipherable for non-specialists: scarcely formally related to the evolved letterforms that we think of as the Latin script:</p>
      <p><a href="http://vindolanda.csad.ox.ac.uk/tablets/"></a></p><div class="imageWrap"><a href="http://vindolanda.csad.ox.ac.uk/tablets/"><img src="http://typophile.com/files/vindwaxtab.jpg"></a></div><br>
      .<p></p>
      <p>The late classical quadrata formal bookhand which evolved in the early middle ages into the uncial and half-uncial styles was written with the broad nib, as were the latter.</p>
      <p>Our miniscule alphabet which is, after all, the letters that we predominantly use in text, is very much a creation of the broad nib reed and quill pen. Our modern lowercase letterforms are evolved directly from the Carolingian miniscule, formalised and standardised by Alcuin of York in the early 800s AD, representing a selection of contemporary forms, all made with the broad nib. So I think it is fair to say that our alphabet originates in the broad nib.</p>
