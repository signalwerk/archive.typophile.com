      <p>Peter, I think what is applicable at the 'micro' level is the 'black/white' balance or what is sometimes called the balance of 'positive' and 'negative' space. </p>
      <p>I don't know for sure whether traditionally included in 'notan' is white space when it doesn't represent an object, such as snow. It seems this is the interpretation of Dow, who first introduced notan in the west. There was certainly a very powerful tradition in Japanese painting of strongly asymmentrical paintings with  dramatic use of relatively 'blank' space. This seems to be more dramatically done in Japanese painting than in Chinese, and perhaps they had their own notions about 'notan' also. Also I would be interested in whether 'positive' and 'negative' space pre-dates the introduction of 'notan' into Westsern art. </p>
      <p>At any rate, I think one aspect of the 'notan' concept is important in type design. This is explained in <a href="http://www.apogeephoto.com/mag1-3/mag1-3mf1.shtml">this interesting article</a> about composition in photography. Here it is pointed out that how you 'frame' a picture changes the balance of negative and positive space. And you can balance it better by good framing when you take the picture, and croping afterwards. </p>
      <p>In type design this corresponds to the spacing, which in effect frames the letter and defines the negative space of the letter, along with the counters. This issue of framing relates to the Kindersley thread, as he was concerned about balance of the black, and its overall relationship to the white. </p>
      <p>So yes, I think the balances of the black with itself and with the white are important factors, which relate also to rhythm and evenness of color. But I am unable at present to characterize the nature of these balances. I do want to understand it more, as I think this is in fact a key issue in type design.</p>
