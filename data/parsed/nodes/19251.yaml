      <p>Well, good thing I didn't bet. Yin Yang is the general concept, including in art, but light/dark does seem to be a special case of this with a separate word 'notan' in Japanese. The Book <a href="http://www.amazon.com/gp/product/0823059839/002-4123837-1995259?v=glance&amp;n=283155c">The Yin/Yang of Painting: A Contemporary Master Reveals the Secrets of Painting Found in Ancient Chinese Philosophy</a> is described thus: "Through the harmonious balancing of opposites, the ancient Chinese philosophy of yin yang is beautifully applied to the art of painting. ...Part One examines the traditional elements of painting-from value (light/dark) and texture (thick/thin) to color (warm/cold) and brushwork (sharp/blurred)-as evolving from a true balance of opposites." </p>
      <p>So here light/dark is one of four examples of yin yang applied to art. In the <a href="http://en.wikipedia.org/wiki/Yin_yang">Wikipedia article</a> on yin yang, they give the Japanese pronounciation of the characters for yin yang and it is not 'notan'. </p>
      <p>So it seems that the dark/light balance, or 'notan' is one of four traditional applications of the 'yin yang' concept traditionally applied to art and calligraphy in China. (Drawing and calligraphy were taught together, as both use the brush and calligraphy is valued as much or more than representational drawing.) </p>
      <p>Japanese evolved their own sense of light dark balance, but it is rooted in an older tradition. Furthermore, it is interesting that this is only one of four balances. </p>
      <p>As Peter noted, the thick/thin balance, originally a result of the broad nibbed pen, is one feature in tension with dark/light, but also helps to express key features of the letters. Hence, the original philosophy was actually richer than the 'notan' concept by itself-- and actually more descriptive of letter design. The emphasis on 'notan', perhaps at the expense of the other balances was the result of the first person who introduced the concept to the West, Arthur Wesley Dow, in his book Composition (1899), which greatly emphasized it.</p>
      <p>Japanese article Peter links to is not totally clear, but the accurate point is that Dow got his concept from Japanese art. But Japanese art got it from Chinese art. The important point is that the full traditional theory of application of the 'yin yang' concept to art actually casts more light on type design than the 'notan' concept by itself.</p>
