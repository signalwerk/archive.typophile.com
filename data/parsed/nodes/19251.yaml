      <p>The <em>The Fleuron</em> [1930] statement van Krimpen refers to (my translation): "A typographical letter always remains an infinitely stylized handwritten letter; this doesn't alter the fact that the pen is merely an assistive device for the designer, who ought never to allow the pen to lord it over his design. Paper, parchement and the point of the pen differ greatly from the steel punch and the tools of the graver. The movement of the pen ought to remain visible in the eventual form of the leaden letter, but styled in such a way that it is only present as a hidden factor.</p>
      <p>But note: I don't want to say the movement of the pen ought to remain visible. I want to say no more than that the optical-grammatical complexity--in terms of the distribution of saliencies and management of cue-value for role architectural particulars + role architecturally evoked form (such as counters--that the broadpen introduced (or allowed to be produced) sets a reasonable standard or benchmark, without defining a limit. We do not know that it defines a limit, on the far side of which resides decay. Perceptual processing in reading decides.</p>
