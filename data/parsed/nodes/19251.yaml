      <p>John's comment on the fluidity of white, and being indeterminate of shape outside counters is I both well observed and important to this discussion. In particular, I don't think sound the usual picture that you can space letters properly by simply how much sand will fill the interletter space. There is also very importantly, as Kindersley argued, the issue of the visual center of the letter. So here is another factor: not only rules for black, balance of white and black, but also visual centers.</p>
      <p>Also I should note that in Chinese and Chinese-influenced art, the balances involved are not simple symetries, but very often assymetrical balances. There is both tension and balance, as John notes, and in fact having both tension as well as balance is part of the goal.</p>
