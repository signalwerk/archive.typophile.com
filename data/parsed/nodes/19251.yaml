      <p><em>So the question is: notan evokes the notion of equivalence or equal valence, but doesn’t the perceptual processing involved in visual wordform resolution rely on differential valences?<br>
      ...</em></p>
      <p>So the absoluteness of the ‘chirography is anti-notan’ claim depends on a reversion to a more generic and less typographical-domain adjusted sense of notan than is warrented.</p>
      <p>I belive the term notan only evokes notions of equivalence or balance in the quite restricted sense that Hrant uses the term, and the more generic sense of notan, as a concept in Japanese aesthetics and as applied in a variety of traditional artforms including, of course, calligraphy, is quite broad enough to encompass differential valences in type design. So when Hrant says 'chirography is anti-notan', he is actually saying 'chirography is incompatible with notan understood as balance or equivalence between black and white'. I think notan is a very useful concept in discussing type -- as it is, ironically considering Hrant's interpretation, in discussing calligraphy, one of the key mediums in which the concept of Notan has been explored by Japanese artists --, so I think it is important to at least be aware of the broader sense of notan, even if one chooses to apply it strictly in terms of balance or equivalance.</p>
      <p>Notan is about the relationship of light and dark shapes. That relationship is not always one of balance, although the balance of light and dark obviously has resonance in Asian philosophy, expressed in the balanced opposition of yin and yang in Taoism for instance. The relationship is often one of tension, in which there is a deliberate imbalance, or in which the formal dominance of the light or dark is countered with the spacial dominance of the other, e.g a strong black shape in a large white field. It is also important to observe that in Japanese aesthetics notan is not limited to black and white, but is expressed in terms of light and dark. In the <a href="http://www.touchingstone.com/ShowMay03.html">sumi-e</a> style of painting, for instance, there may be no pure black or white at all, only shades of grey composed in areas of light and dark. In this context the notion of 'good notan' is obviously much more complex than mere balance.</p>
      <p>In terms of type design and readability, I do think that the concept of notan is most usefully applied in terms of black and white, or of high contrast and consistent tonality. There is enough evidence from readability studies to demonstrate the low contrast and iconsistent tonality is detrimental to reading, and so may be considered 'bad notan' in the particular field of design of text typefaces. But I think it is begging the question to define good notan for reading simply in terms of balance or equivalence.</p>
      <p>I don't think we are ready to apply a prescriptive idea of notan to type design: what we need is a descriptive effort, to understand what is happening in terms of notan, in terms of the relationship of black and white, in type that is easy to read and type that is hard to read. If we talk about valences, whether equivalent or differential, then that might suggest something measurable, but this is misleading if we think of it simply in terms of spacial area. The relationships of black and white that we perceive in type are not merely spacial but also formal, and such relationships may involve both tension and balance. While the white spaces between and within black letterforms may constitute formal architecture in their own right, they are also linked, spacially, to a surrounding field between lines of text and between words. The white is note only part of the role architecture of the letter, bouma and word shapes, but is also the container of the text as a whole. How is the black balanced against this? Clearly not by spacial equivalance, since the white has an obvious spacial dominance. The black assumes formal dominance, as is clear from the fact that individual letters are differentiated by their black shapes, not by their white shapes, which may be similar or identical (as the counterpunch made explicit) without undermining the identity of the individual letter.</p>
      <p>The interesting question that has been raised in recent years, most practicably by Evert Bloemsma, is whether readability is enhanced by giving more formal consideration or role-strength to the white shapes within letters. It is a great question, but it is a <em>question</em> not an answer. A typeface like Legato is a question, and it is sad pity Evert did not live long enough for an answer. But we should try to give him one, by studying Legato, both in the sense of examining it and testing it (and, of course, using it), and making other designs that explore this question.</p>
      <p>But we shouldn't assume that increasing the formal role-strength of the white spaces in and between letterforms automatically tends towards or 'restores' balance with the black in terms of notan. The spacial dominance of the white field remains. How does this interract with the role architecture of the internal and inter-letter white shapes? How does it affect the overall relationship of black and white.</p>
      <p>As I've noted before: it has become a commonplace for type designers to wax lyrical about how the 'design the white' or how 'creating the internal white is as important as creating the black'. But with the exception of someone like Evert, very few type designers seem to be able to explain this as a process. At most, they demonstrate an awareness of the white space in the process of designing the black. There are very few processes of white space design elaborated. [I'm reminded a remark Robin Kinross made about the observed difference between the way in which designers say they work and the way in which they actually work.] I suspect one of the main reasons for this is that, outside of the enclosed counter, between the letters and escaping from open counters, the white space becomes a fluid field. The formal role of the white space is under(deter)mined* by its own spacial dominance.</p>
      <p>* How's that for an Ennesonism.</p>
