      <p>Peter, thanks for clarifying what Hrant has been bothered about. I now understand it somewhat, which I didn't before. Still, there is so much vagueness about all of the claims, it is hard to know what to make of them. 'Notan' or 'Ying-Yang', or 'balance of black-and-white' is an important concept, but it is only a vague, general concept: that balance is important. What exactly it should be or what should guide it isn't specified. </p>
      <p>Similarly, if you want to claim that a 'chirographic' script is one in which the variation in the stroke follows a few simple consistent rules, I don't know how far that gets you. Because type since Jenson and Griffo are influenced by the pen, but are quite willing to violate it for what I prefer to call even color. </p>
      <p>I still think that the most felicitous way of saying things was Van Krimpen, who arguing with Morrison about this issue said that the pen has an enduring influence, without determining the shape of letters. (I'm sorry I don't have the quote.)</p>
      <p>Edit: I think I remember Van Krimpen's phrase now: that the pen is an<br>
      'underlying force' in type design.</p>
