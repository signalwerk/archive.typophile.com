      <p>A note on the meaning of 'notan'. I came across <a href="http://www.touchingstone.com/Paintings.htm">this excellent site</a>, which finally clarified to me the original meaning of 'notan'.   </p>
      <p>The original Chinese characters, 'nóng dàn' in Chinese or 'no-tan' in Japanese refer to how dense the ink is you use in an ink watercolor painting. The solid ink is mixed with water, and can mixed either more dense and dark (nóng) or more dilute and light (dàn). So how a painter handles 'notan' in an ink painting refers in the first place to how they handle the more and less dilute ink--the shades of grey--in the strokes themselves. But by extension the white is included in consideration of 'notan', and not just the strokes, as it is the most light or 'dilute' part of the painting. (A clear as opposed to dark sky is also described as 'dàn'. It also refers to thin or weak soup or tea.) </p>
      <p>The site has a number of Japanese ink paintings which beautifully illustrate the sensitive handling of shades of grey and black, including sensitivity to the 'negative space' or white.</p>
