      <p>&gt; equivalence or balance in the quite restricted sense that Hrant uses the term</p>
      <p>Perhaps Hrant can be more precise about what kind of balance or equivalence he is talking about.</p>
      <p>However, the concept of 'notan' itself is not very clear. It is, in John's terms, a question and not an answer. </p>
      <p>As I noted earlier in a discussion of this, 'notan' is I believe simply a translation of 'yin yang'. Can someone confirm that it is written with the same characters in Japanese?  Furthermore, application of the concept to calligraphy and painting is directly derived from Chinese characters and paintings, whom Japanese masters learned their craft from by copying. </p>
      <p>Treating this as a special, distinctive Japanese concept is not only historically wrong, but also misleading. While Japanese art developed its own aesthetic taste and its own masters and masterpieces, I don't believe there is anything distinctive in its concept of 'notan', especially in calligraphy. After all, most of the calligraphy is in Chinese characters, which already had a highly developed tradition in China.   </p>
      <p>Looking at 'notan' as a special Japanese concept--a parochial American way of thinking, by the way Hrant--is misleading because the 'yin yang' metaphysics is applied everywhere in Chinese traditions, including food and medicine. The merit of the 'yin yang' concept--it gives language to describe almost any relationship--is also its weakness. It puts a label on phenomena, but it does not really describe them in the focussed, powerful, testable way that western science has done. </p>
      <p>So if we are going to gain insight about the role of black and white shapes, and their relationship in type, we need to be more precise about what is claimed, and not throw around 'notan' as if it were a magic wand.</p>
      <p>There is a phenomenon that a number of type designers have mentioned, and if I remember rightly it was Tobias Frere-Jones who said that he was fascinated with how when letters are well done they become 'part of the paper' rather than 'sitting on top of the paper'.</p>
      <p>This kind of gestalt switch, where the letterforms create words that look natural and inevitable, is of course crucial in good typeface design. I doubt is well described only in terms of the relationship of the white and black. This is no doubt one extremely important variable, but so are the 'rules' by which the face is formed, and whether those rules are successfully made 'eye rules' and not just 'head rules'. </p>
      <p>Part of those rules is how the thick and thin parts of stokes are related to each other, and at which angles and orientation to vertical. These aspects of the rules are usefully described by Noordzij's 'moving front'. The question is whether rules on how the two ends of the moving front are related--as they are with the pen--is part of the effective forming of the 'gestalt'. Is it only black and white relationships, or is it black and black relationship also? </p>
      <p>Ps. Tim, thanks for the quote. It seems that it refers to letters or discussions rather than--as I mistakenly thought--being a letter so the original may well be the Dutch. In which case Peter can enlighten us further on the translation.</p>
