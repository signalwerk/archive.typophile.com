      <p>" [...] the broad nib provides this rich formal and optical grammar in the context of an alphabet of shapes <em>originating in the use of the broad nib</em>."</p>
      <p>John: I think 'originating' might be too atrong a word here, because: doesn't the pre-history of the place-holders in our script system reached back before the broad nib? Nevertheless you are right in suggesting the broadnibbed pen played a pivotal role in consolidating the role architectures of the current canonical forms of these place holders. </p>
      <p>I'd suggest further that, in making it's contribution, 'perceptual distance,' 'categorical perception' and 'consolidation of wordform'constraints were tacitly catalytic (i.e., probably not explicitly thematized). "Categorical perception" has to do with 'seeing as': if the arm of the 'r' loops down too far, after a certain point it is seen as an 'n'; or if the abscence of closure in the c is not salient, after a certain point it is seen as, or becomes easily confusable in 'noisy' arrays with 'o'. So in this way readability optimization issues have always been a hidden player in the shaping of our alphabet.</p>
      <p>When new technologies of production take hold, these very same constraints motivate, and rightly so, new solutions, which might be better than the old. I think what Hrants dislikes is a laziness in prospecting for them. (Is it there?)</p>
      <p>But I guess what I wanted to focus on in my comment was: what place in the galaxy of normative pressures on the design process should the 'notan' vector have, and is chirography properly assessed as intrinsically 'notantagonistic' [notan-antagonistic]. Perhaps it might be useful to distinguish different species of notan, one pertaining to cut or sculpted forms and the other to 'swept-object generated' forms and than giving to type design the task of making the transition to the first in forms generated by the products of the second. The reason to do it might be, the sculpted type of notan has a special pertinance in relation to perceptual processing in reading--a proposition which might well be defensible. This allows me to have my cake and eat Hrant's as well.</p>
      <p>Bill, it was John that supplied the link.</p>
