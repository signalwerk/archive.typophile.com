    html: |-
      <p>I’m not sure how you define luxury. The engraver I have used for many years is Artcraft, in southern Massachusetts. They can order any paper (Crane or otherwise) and will do any design with great skill.</p>
      <p><a href="http://www.artcraft.com/Index.html">http://www.artcraft.com/Index.html</a></p>
      <p>Just don’t be in a hurry to get the work. </p>
      <p>Nota bene: There is an Artcraft engraving company in Florida as well, but I know nothing about them.</p>
