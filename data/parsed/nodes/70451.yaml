    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ciseaux-matisse-poster-typophile_4858.jpg"></div><p></p>
    <p><strong>Ciseaux Matisse</strong> was inspired by the exhibition <cite>Drawing With Scissors</cite>, which I visited at the <cite>Kunsthalle Schirn</cite> in my hometown of Frankfurt am Main in 2003 and the book <cite>Jazz</cite> published in 1947 by <cite>Henri Matisse</cite>.</p>
    <p>Admittedly, before i visited that exhibition, I wasn’t a fan of Matisse’s work, neither his late nor the early work. That definitely changed after the exhibition. While his motifs have been overused on postcards and mouspads, in front of the originals you forget those tiny pictures. Some of the works were massive—larger than 24ft. By cutting directly into the color Matisse created shapes with strong dynamics.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ciseaux-matisse-specimen-typophile_4591.jpg"></div><p></p>
    <p>Years later, in 2007, I used that inspiration to cut an exclusive font for a newspaper that I designed at that time (see pictures below). Later I developed that font into the four styles featured here.<br>
    The <strong>cut-out style</strong> is a paper cutout; <strong>boxed</strong> is the paper background. Both <strong>linear</strong> and <strong>boxed linear</strong> have no curved outlines, so they are more <strong>aggressive.</strong> </p>
    <p>As drawing with scissors implies, all characters are <strong>cut by hand</strong>. With only uppercase letters, this font is designed for editorial use:<br>
    <strong>headlines, slogans</strong> in ads, or musical usage in <strong>posters</strong> and <strong>flyers</strong> that need the little touch of the <strong>jazz scissors.</strong></p>
    <p>In special cases the lowercase letters contain alternate shapes to the uppercase forms.</p>
    <p>The Font is available in a set with paper-scissors directly on my <strong> Website<br>
    <a class="freelinking external" href="http://www.haraldgeisler.com" rel="nofollow">http://www.haraldgeisler.com</a></strong></p>
