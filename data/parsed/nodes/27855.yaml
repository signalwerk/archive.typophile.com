      <p>I was going to put it in serifs, but I  only 1/2 the characters have any serifs, and they don't serve a real function.</p>
      <p>By considering the x-height and solving around that, you mean when I'm developing the italicized variation?</p>
      <p>Thanks for the feedback on the specific letters. I will thicken the 'I' so it shows more at smaller sizes. You are also right on the 'D', it is drawn from the V, but the differences aren't apparent enough. Will ponder a solution.</p>
      <p>The emphasis is on funky/weird, but I would like it to be usable for short titles and such.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry</p>
