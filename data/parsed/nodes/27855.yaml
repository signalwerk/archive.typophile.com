  html: |-
    <p>I'm working on a new font, my first to include a pretty full character set, with math operators as well as upper and lower greek and cyrillic. I'm currently trying to get the bold version to look 'right' and decide what to do for italics. I thought I'd post some of the regular version here for critique. I'm going for a retro-tech look, reminiscent of late '70's to 80 computer-system fonts, but more fun. Does it work?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/%21discinfernosamplerough.jpg" width="420" height="300" alt="">
