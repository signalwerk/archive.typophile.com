      <p>Adam Twardoch: 'Ever since its release in 2002, FontLab 4.x and FontLab Studio 5 was able to decompile binary OpenType Layout features into the AFDKO syntax, and compile them back into binary tables [...]'</p>
      <p>Not being familiar with either FL 4 or FLS 5, I am not able to judge the quality of the decompiling and compiling of the features in these apps. Also I can't judge the consistency of the OpenType fonts generated with FLS and therefor the necessity to check, change or enhance the data with a tool like OTM.</p>
      <p>As far as I know, FLS supports the AFDKO 1.6 currently (please correct me if I am wrong), whereas OTM supports the latest standard, i.e. the newly released version 2.5 (FM supports 2.0, but is being updated to 2.5). So, for this fact alone OTM could be a useful additional tool for your customers too, I reckon.</p>
