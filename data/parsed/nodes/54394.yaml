      <p>Thanks for the link to your own explanations, which are extremely informative.</p>
      <p>Avoiding reflows is of great practical importance, considering that e.g. in Germany alone there are more than 10,000 re-editions per year (i.e. second etc. editions of books published often many years ago). Unless you have kept the old font files, you will heve great problems making re-editions of old books without reflow.</p>
      <p>Another great problem are postscript printer drivers. For example, HP's Universal PS printing driver and Adobe's Universal PS printing driver create different reflows of the same book text files. The same holds true for different releases of Adobe's Distiller. All this is a great annoyance.</p>
