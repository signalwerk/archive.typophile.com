      <p>&gt; <cite>I have seen this only in really non-print-savvy applications, on Windows. (Mind you, that used to include MS Word.)</cite></p>
      <p>In the mixed journals-plus-books publishing house where I worked until my retirement, in-house editors produce scientific journals with professional publishing programs such as 3B2 (Arbotext), Redline, Pageone etc., but out-of-house book authors are scientists writing their books at home using simple MS Word in most cases.</p>
      <p>&gt; <cite>Whenever I have to do a new printing of my photography book with a couple of revisions, I use exactly the same operating system and software that I used to create it ten years ago. It’s growing increasingly difficult to find the right hardware, but the savings in time, energy and worry is well worth it.</cite></p>
      <p>You can say that again! In 2006, I embarked on the adventurous task of creating a PDF file of an old book of mine, the 4th printed edition of which was published in 1989, i.e. 17 years ago. For this purpose, I had to install Windows 3.11 and MS Word 6.0 and Adobe Acrobat Distiller 2.1, and using the then PS Type 1 version of the Palatino font, I could create a flawless PDF file without any reflow at all. The file of this book is downloadable here</p>
      <p><a href="http://www.sanskritweb.net/verlag/buchkalkulation.pdf" title="http://www.sanskritweb.net/verlag/buchkalkulation.pdf">http://www.sanskritweb.net/verlag/buchkalkulation.pdf</a></p>
      <p>Have a look at the Acrobat "Documents Properties" menue, and you will see that this PDF file was produced using the ancient Acrobat Distiller 2.1 for Windows and has the old Palatino fonts embedded which were compatible with the then built-in fonts of the ancient QMS 810 Laser printer used at that time.</p>
