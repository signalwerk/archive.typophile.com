    html: |-
      <p>&gt;people should just continue to use the Type 1 versions of the fonts</p>
      <p>That's a good point, and more than that: if a project is important, of course you keep the original font files - - it would be lunacy not to. Many, many responsible foundries will revise their fonts often in much smaller ways: for example Robert finally grew weary of the excessively tight fitting of the question mark in Minion, and longed to change it. I am sure he did in one or another of the dozens of versions of Minion, all of which are different, and all of which will cause reflow problems if you aren't using precisely the same version of the font that you started out with. </p>
      <p>Whenever I have to do a new printing of my photography book with a couple of revisions, I use exactly the same operating system and software that I used to create it ten years ago. It's growing increasingly difficult to find the right hardware, but the savings in time, energy and worry is well worth it. I keep whole ancient disk images backed up so I can use them again when necessary. Why not?</p>
