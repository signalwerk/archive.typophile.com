      <p>Many Adobe Originals have undergone smaller or larger redraws when developing the OpenType versions — mostly for aesthetic reasons. Utopia was Robert Slimbach's first typeface that he ever did for Adobe, so I'm not surprised he revised it. I consider Utopia Std a "director's cut". </p>
      <p>I wish he'd had more time on that project so a Pro version could be developed, on the other hand, the OpenType development project was huge at that time, so they were all working under a very tight schedule. Perhaps this will still happen.</p>
