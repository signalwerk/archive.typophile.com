      <p>&gt; In OTM one can export and import the GSUB and GPOS<br>
      &gt; features from and into an OpenType font. During<br>
      &gt; import OTM compiles the OpenType Layout features<br>
      &gt; (AFDKO syntax) and produces binary OpenType Layout tables.</p>
      <p>I think this is a great functionality. Ever since its release in 2002, FontLab 4.x and FontLab Studio 5 was able to decompile binary OpenType Layout features into the AFDKO syntax, and compile them back into binary tables, and this functionality was greatly appreciated by the users, so I'm very glad that DTL OTMaster has this function now as well — this is a very appropriate application to have this. </p>
      <p>It would be really great if DTL considered implementing export to the VOLT project syntax as well (and possibly also the TSIV, TSID, TSIP and TSIS tables used by VOLT). </p>
      <p>Best,<br>
      Adam</p>
