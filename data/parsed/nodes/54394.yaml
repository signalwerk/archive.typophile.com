    <p>Let us assume a publisher has a paperback, the first edition of which was typeset in 8 on 9 point in Adobe Utopia, PS font (PostScript Type 1, font file UTRG____.PFB).</p>
    <p>For the re-edition, the publisher wants to switch to Adobe Utopia, OT font (OpenType, font file UtopiaStd-Regular.otf).</p>
    <p>To his dismay, the publisher discovers that Utopia OT typeset in 8 on 9 point is much smaller than Utopia PS typeset in 8 on 9 point.</p>
    <p>see <a href="http://www.sanskritweb.net/temporary/utopia1.gif" title="http://www.sanskritweb.net/temporary/utopia1.gif">http://www.sanskritweb.net/temporary/utopia1.gif</a></p>
    <p>A technical analysis reveals that for the generation of the Utopia OT font, the glyphs of the Utopia PS font were reduced by 5 percent by Adobe.</p>
    <p>Example: The glyph of the capital "A" of Utopia PS has a height of 692 units, while the "A" of Utopia OT is 657 units high, which is 95 % of 692, i.e. reduction by 5 %.</p>
    <p>see <a href="http://www.sanskritweb.net/temporary/utopia2.gif" title="http://www.sanskritweb.net/temporary/utopia2.gif">http://www.sanskritweb.net/temporary/utopia2.gif</a></p>
    <p>So, if the publisher, for technical reasons, must use the OT font format for the re-edition, he himself has to convert the old PS font to the OT format via Fontlab instead of using Adobe's OT font which reduced the glyph size by 5 percent thus rendering Adobe's OT font unusable for the re-edition of the paperback.</p>
    <p>Why did Adobe reduce the glyph size?</p>
