      <p>Quincunx: 'Converting the old PS to OT doesn’t really make sense, because he won’t have any of the features for which he bought the OT version?'</p>
      <p>Probably the Adobe EULA does not permit the enduser to convert fonts anyway. Having said that, it <strong>is</strong> technically possible to import the features from the original OpenType font into a converted one using DTL OTMaster (OTM) or to generate a new OpenType font in DTL FontMaster (FM) using the original features.</p>
      <p>In OTM one can export and import the GSUB and GPOS features from and into an OpenType font. During import OTM compiles the OpenType Layout features (AFDKO syntax) and produces binary OpenType Layout tables. Before importing in the new font probably some editing of the features file will be necessary, for instance to match the character set of the newly generated OpenType font, and perhaps the syntax has to be checked also. Because of the different x-heights and subsequently widths, it is in this case advisable to remove the kern pairs and to replace these by the ones in the AFM file. </p>
      <p>For generating an OpenType font with the original features in FM, a little bit more work has to be done beforehand, but handling the features is easier because these don't have to match the character set. First in OTM the features file of the original OpenType font has to be exported. Second, a so called Character Layout (.cha) file has to be exported from OTM also (this assures that the naming convention in the .cha file is identical to the one used in the features file). An encoding vector has to be added to the .cha file (in this case the Adobe Standard Encoding will do) for instance with a simple find and replace file in/with BBEdit/AppleScript.<br>
      In BezierMaster the original font can be converted to BE format and the (checked) features file can be connected in the UFM dialog. In this case the character set does not have to match the characters listed in the features file, because all features that are not covered by the character set (listed in the .cha file) will be removed during the generation of the font by the modified URW++ version of Adobe's Hatch Open Type tool (HOT). One can also add a few lines to the features files concerning the intermediate table block info (this way one can control which information is taken from the features file and which not [if somebody is interested I can provide more technical info on how the features generation is automated and controlled in FM]). For the kerning the AFM file of the PostScript Type1 font can be directly used.</p>
    html_clean: |-
