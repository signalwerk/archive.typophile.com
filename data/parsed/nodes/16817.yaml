    html: |-
      <p>Interesting question, Eric. Is it about the design process, or how people use type? </p>
      <p>For the first, I might say it depends on the design goals. In one instance the designer might be concerned about historical precedent/aesthetics, whereas in another the same person might be designing for the limitations of a particular mode of reproduction (like newsprint, video subtitles, etc.) You could go further in addressing the culture, age, gender etc. of the audience.</p>
      <p>For the second instance, I think it’s difficult to say how character (the character of characters?) can be derived from usage, in that you can’t predict how people will use it. A face that is bundled with windows 95 will take on a different meaning than one that is sold at fontshop. When designers start using a corporate typeface in a different way for techno flyers all of a sudden the meaning shifts.</p>
