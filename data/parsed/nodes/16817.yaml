    html: |-
      <p>What’s the feeling? Modern or Antique? When you say modern, do you mean Neo-Classicist, Moderist, Post-Modern, or Contemporary.</p>
      <p>Antique: do you want old fashioned or just old? French, English, or Dutch. Or Venetian?</p>
      <p>Humanist or Geometric? That feeling determines the axis, to some degree, and a lot of other aesthetic traits.</p>
      <p>If your college is a Catholic University, it would need different type that a large State Institution or a small liberal powerhouse. Just an example. </p>
      <p>The Republicans and the Democrats should use separate typefaces. They actually do, but for the right reasons?</p>
      <p>Rudi Bauer asked Peter Bilak to “deprotestant-ize” Univers. Bilak drew Fedra.</p>
      <p>Thin, cheap, rougher paper needs thicker stems, less thins, and sturdy serifs. And open counters that won’t fill in. Big glossy coffee table books can be printed in Didot without any problems—because no one is going to read that text anyway.</p>
      <p>Aesthetic choices are often ground in historical habits—and sometimes for good reason.</p>
      <p>Who do you want to be as a designer? What do you want to make? (Surely you don’t just want to reiterate the past!) This is more important to ask yourself first, rather than what sort of letterforms you happen to like.</p>
      <p>Am I getting in the right direction?</p>
