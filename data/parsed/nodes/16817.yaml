    <p>In light of recent events...I have been asking myself a question. That maybe someone would give their 2 cents.</p>
    <p>1. How is the character of a new type ’extrapolated’ from it’s purpose.</p>
    <p>    How lets say, a text type for a newspaper vs. a text type for a historical novel vs. a text type for a contemporary design journal.</p>
    <p>Thanks</p>
    <p>edit:  How a types’ character is derived from it’s usage. Like, JFP designed a type for whatever use, what is the driving creative force/philosophy behind what shapes the letters take.</p>
