  html: |-
    <p>I've been working on a mildly complex font for a client (moonlighting outside my day job).</p>
    <p>I've never worked with using a lookupflag to ignore certain glyphs, but it seems like the perfect solution for a particular issue I encountered. So I tried to do it in FontLab. It compiled fine and I export the font, but the desired behavior is not occurring in InDesign CS5 (even when I set text with the WorldReady Composer active).</p>
    <p>I'm wondering if I am doing something wrong, or...? Here's my process.</p>
    <p>A) First, for the glyphs we want to be ignored, do the following in the FontLab glyph window:<br>
    - select the glyph.<br>
    - bring up the glyph properties dialog<br>
    - change the value of the OT popdown from "Unassigned" to "Mark"</p>
    <p>B) For EACH AND EVERY lookup we need the glyph to not interfere with, we need to add one line that reads "lookupflag IgnoreMarks ;" and goes right after the lookup is declared and before the substitution code, like this:</p>
    <p>  lookup LOOKUPNAME {<br>
        lookupflag IgnoreMarks ;<br>
        sub glyph' [a e i o u] by glyph.alt ;<br>
      } LOOKUPNAME ;</p>
    <p>C) In FontLab prefs, go to "Generating OpenType and TrueType" and make sure to check "Generate GDEF table"! This is critical because the glyphs being indicated as "Marks" are stored in the GDEF table and without that, it all won't work.</p>
    <p>Am I missing something?</p>
    <p>T</p>
