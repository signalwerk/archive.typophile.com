    html: |-
      <p>If the glyphs you want to ignore are not combining marks, then you should be using <code>MarkAttachmentType</code> (or the new, mostly unsupported, <code>UseMarkFilteringSet</code>), otherwise no idea why <code>IgnoreMarks</code> is not working for you (but I don't use FontLab). You can also write the <code>GDEF</code> table directly in the feature file, if it makes any difference.</p>
      <p>Edit: Another idea, but I'm not really sure, but I think the <code>lookupflage</code> should go the feature block itself, so try:</p>
      <p><code><br>
      feature calt {<br>
        lookupflag IgnoreMarks;<br>
          lookup LOOKUPNAME;<br>
      } calt;<br>
      </code></p>
