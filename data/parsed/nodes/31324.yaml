    votes: null
    html: |-
      <p>DIN is way too technical. It just contrasts in a bad way I think.</p>
      <p>Fago just seems too random of a choice. I just don't see the logic behind pairing these two. They're so different that using both in text application will probably make the details too obtrusive. As I said, it seems too random of a choice.</p>
      <p>Argo is actually a very acceptable typeface to pair with Collis. It's just that I personally preferred how the weight distribution in the other typefaces match Collis' somewhat. But, if you want a typeface which matches Collis pretty well in the general shape but contrasts in the weight distribution I think it's a good choice. Since you're using it for inline paragraphs it might actually be the better choice since the other typefaces might not contrast enough, but you would have to test that.</p>
      <p>Zwo is actually the same story as Argo.</p>
