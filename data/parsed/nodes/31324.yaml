    html: |-
      <p>Certainly. I think the overal design of Profile matches well with Collis; the bowls and shoulders are quite a perfect match. Indeed the x-height is smaller, but depending on how you use the typeface that shouldn't matter. I could be wrong, but I think it only matters if you use both typefaces at the same point size, which would make Profile look optically smaller. If you're going to use Profile for titles it shouldn't be a problem.</p>
      <p>Strada is a lot rounder which contrasts nicely with Collis. The details however are quite similar. It's probably not necessary, but I like how the typefaces contrast while the details of both faces are quite consistent with each other.</p>
      <p>Kievit's details are a bit more different, but the proportions match quite well and both Collis and Kievit look modern.</p>
      <p>As for Kievit's serif, I don't agree the best choice is always to take typefaces from the same super family. The reason for this is because the proportions and details don't necessarily need to match. I believe Hoefler &amp; Frere-Jones put tips on their websites on the different options you have of pairing typefaces.</p>
