  - id: 335428
    user: 31033
    date: 2009-03-16T17:19:00
    date_raw: 16.Mar.2009 5.19pm
    votes: null
    html: |-
      <p>We're wandering away from the original question, but if you don't mind a little manual labor, sure ID can do this.  For your middle third-of-a-line column you make a variant of your footnote paragraph format with zero leading and an indent of a third of a line; then for your last third of a line you indent the format two thirds of a line, with the same zero leading.  You must then manually apply those formats to the appropriate footnotes, but it works (though I admit I've never used this for more than two footnotes per line).</p>
      <p>David</p>
