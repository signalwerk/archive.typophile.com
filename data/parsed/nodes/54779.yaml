    html: <p>That is brilliant, David! I thought that since ID shows those frame borders around footnotes that you couldn't set them on the same line with 0pt leading. But if you set the "First Baseline Offset" to leading, and set the multicolumn footnotes to 0pt leading with an indent, sure enough it works. I feel giddy as a schoolgirl ...</p>
