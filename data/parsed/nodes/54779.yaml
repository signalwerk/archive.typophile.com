  html: |-
    <p>Is there a package that distributes footnotes on two or three columns, depending on how long they are?</p>
    <p>This style is used in some older books, e.g. Gadamer’s “Wahrheit und Methode”. I have written the following as an attempt, but it is inexact, clumsy, and ad hoc, as I lack a deep understanding of how TeX works, and really don’t want to spend the rest of my life learning about it. Comments or references to an already existing better version were much appreciated.</p>
    <p>% Footnotes.</p>
    <p>\usepackage[para]{footmisc}</p>
    <p>\def\thefootnote{}<br>
    \newcount{\left}<br>
    \newcount{\thisfoot}<br>
    \newcount{\counter}<br>
    \newcount{\lastright}<br>
    \newcount{\footcountline}<br>
    \newcount{\footcountpage}<br>
    \newcount{\feet}<br>
    \newcount{\footsize}<br>
    \newcount{\nextfoot}<br>
    \newcount{\nextnextfoot}<br>
    \newcount{\lastfoot}<br>
    \newcount{\footparcount}<br>
    \newcount{\nextlength}<br>
    \newcount{\nextnextlength}<br>
    \newlength{\limit}<br>
    \left=0<br>
    \thisfoot=0<br>
    \footcountline=1<br>
    \footcountpage=0<br>
    \lastright=0<br>
    \feet=0<br>
    \footparcount=0<br>
    \newcount{\lastsize}<br>
    \newboolean{firstfootonpage}<br>
    \newcount{\ofthree}<br>
    \newcount{\endofline}<br>
    \endofline=0</p>
    <p>\newlength{\halfwidth}<br>
    \newlength{\thirdwidth}<br>
    \newlength{\halfminusthird}<br>
    \newlength{\thirdminusindent}</p>
    <p>\AtBeginDocument{<br>
    \halfwidth=.5\textwidth<br>
    \thirdwidth=.333333\textwidth<br>
    \addtolength{\halfwidth}{-22pt}<br>
    \addtolength{\thirdwidth}{-29pt}<br>
    \halfminusthird=\halfwidth<br>
    \addtolength{\halfminusthird}{-\thirdwidth}<br>
    %\addtolength{\halfminusthird}{-2.2em}<br>
    \thirdminusindent=\thirdwidth<br>
    %\addtolength{\thirdminusindent}{-1.5em}<br>
    }</p>
    <p>\newcommand{\fc}[1]{%<br>
    \fn{%<br>
    \renewcommand*{\ibidemname}{ibid}%<br>
    \renewcommand*{\ibidemmidname}{ibid}%<br>
    \cite{#1}%<br>
    .}%<br>
    }</p>
    <p>\newcommand{\fn}[1]{%<br>
    \global\advance\thisfoot by 1%<br>
    \global\lastfoot=\thisfoot<br>
    \global\advance\lastfoot by -1%<br>
    \global\nextfoot=\thisfoot<br>
    \global\advance\nextfoot by 1%<br>
    \label{foot\the\thisfoot}%<br>
    \ifthenelse{\not\equal{\pageref{foot\the\thisfoot}}{\pageref{foot\the\lastfoot}}}{%<br>
    \sbox{\footbox}{\footnotesize\up{\the\thisfoot}\ex\noibidem#1}%<br>
    }{% else<br>
    \sbox{\footbox}{\footnotesize\up{\the\thisfoot}\ex#1}%<br>
    }%<br>
    \global\setbox\thisfoot=\hbox{\usebox{\footbox}}%<br>
    \ifthenelse{\not\equal{\pageref{foot\the\thisfoot}}{\pageref{foot\the\lastfoot}}}{%<br>
    \setboolean{firstfootonpage}{true}%<br>
    \global\lastsize=0%<br>
    }{% else<br>
    \setboolean{firstfootonpage}{false}%<br>
    \renewcommand*{\ibidemname}{\ibidemmidname}%<br>
    }%<br>
    %<br>
    \up{\the\thisfoot}<br>
    %<br>
    \settowidth{\length}{\usebox{\footbox}}%<br>
    \ifthenelse{\lengthtest{\length&gt;\halfwidth}}{% If paragraph<br>
    \footnote{%<br>
    \ifnum\endofline=1 \\makebox[.8em]{} \endofline=0 \fi%<br>
    \ifthenelse{\boolean{firstfootonpage}}{\makebox[.5em]{}}{}%<br>
    \up{\the\thisfoot}\ex#1%<br>
    \global\endofline=1%<br>
    }%<br>
    \global\lastsize=1%<br>
    }{% If not paragraph<br>
    \setbox0=\hbox{#1}%<br>
    \footnote{%<br>
    \ifthenelse{\lastsize&lt;2}{%<br>
    \%<br>
    \ifthenelse{\lengthtest{\length&gt;\thirdwidth}}{%<br>
    \makebox[\halfwidth][l]{\hspace{1em}\usebox{\footbox}}% 1/2<br>
    \global\lastsize=2%<br>
    }{% else<br>
    \makebox[\thirdwidth][l]{\hspace{1em}\usebox{\footbox}}% 1/3<br>
    \global\lastsize=3%<br>
    \global\ofthree=2%<br>
    }%<br>
    }{%<br>
    \ifthenelse{\lastsize=3}{%<br>
    \ifthenelse{\ofthree=2}{% 2/3<br>
    \ifthenelse{\not\lengthtest{\length&gt;\thirdwidth}%<br>
    % \and \not\lengthtest{\wd\nextfoot&gt;\thirdwidth}%<br>
    \and \equal{\pageref{foot\the\thisfoot}}{\pageref{foot\the\nextfoot}}}{% then<br>
    \global\lastsize=3%<br>
    \global\ofthree=3%<br>
    }{%<br>
    \makebox[\halfminusthird][l]{}% else, if 3/2 or last on page<br>
    \makebox[2.7em]{}% Indent second halfnote.<br>
    \usebox{\footbox}%<br>
    \global\lastsize=0%<br>
    \global\endofline=1%<br>
    }%<br>
    }{% else 3/3: printing 2/3<br>
    \ifthenelse{\not\lengthtest{\length&gt;\thirdwidth}}{% if small<br>
    \makebox[\thirdwidth][l]{\usebox\lastfoot}%<br>
    \makebox[29pt]{}%<br>
    }{% ?<br>
    %\makebox[\halfminusthird][l]{}%<br>
    \usebox\footbox%<br>
    \%\makebox[1.5em]{}%<br>
    }%<br>
    \usebox{\footbox}% Last of 3<br>
    \global\lastsize=0%<br>
    \global\endofline=1%<br>
    }%<br>
    }{% expected 2/2<br>
    \makebox[2.7em]{}% Indent second halfnote.<br>
    \usebox{\footbox}%<br>
    \global\lastsize=0%<br>
    \global\endofline=1%<br>
    %<br>
    }%<br>
    }%<br>
    }%<br>
    }%<br>
    }<img src="/sites/default/files/old-images/fns_5028.png"></p>
