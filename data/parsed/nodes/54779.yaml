    html: |-
      <p>I found this post looking to see if this feature is available for InDesign. I've included a link to a book set in QuarkXpress that has footnotes like this. Is there a way to do this in InDesign as well? My guess is that InFnote can do this, but I ain't sure.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rad-footnotes_5749.gif"></div><p></p>
