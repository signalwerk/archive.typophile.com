      <p>From 2 and 3 I get the impression of a company linked to the broadcasting industry. From the versions of 1, which I would like to see with your thoughts of colour if it is to have the red, blue and yellow, I can see a, possibly too obvious, play on stitch and hyphen but I don't get a complicated, passionate, detailed approach, maybe seen with product(s) or in a context with them it could work in the way a simple versus complex juxtaposition. Of the three I would pursue the first to develop with the aim of refinement but also to see if anything else strikes you in that direction.</p>
      <p>Tim</p>
