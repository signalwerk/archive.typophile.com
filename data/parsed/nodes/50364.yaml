      <p>Litera, great work!</p>
      <p>About their website, why don't use one of the many open source Content Management Systems to run the site.<br>
      Once you have designed the whole thing you can simply give them 'Editor' access, so they are able to edit text etc. without screwing the whole thing up. My personal favorite is CMSmadesimple - quite straightforward to use and low learning curve for you and the client.</p>
