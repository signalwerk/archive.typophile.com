    html: <p>An honest blunt critique is the best learning tool..I've learned to not take anything personally because in the end it's all business and delivering the best design to communicate the message properly. Retro, Indie type fonts may be your best resource.The lampshade needs to be very simple. The original lampshade displays a very feminine feel. In the new logos 1.d and p fit well between the lines and is the best font choice so far. 2. the d and p don't fit well.3. the box isn't needed and the shadow won't reduce too well in B/W and faxes. I would experiment with a 50's retro look with colours which are less saturated like a mint green and pastal yellow..with a scroll type frame or stylized scroll type lamp illustration. I really like the name and I think the right funky script(but different than the one in proof 3, because it's too cartoony.)will result in the approachable,friendly and unique company. Good Luck!</p>
