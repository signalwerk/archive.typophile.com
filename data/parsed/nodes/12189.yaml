      <p>Jay, I think the responses here are a good indication that the logo is a bit flat without context. The design above would probably benefit from the context of a website or stationary, but it really should be able to stand alone. The type isn't working as you probably want it to (I think it's not going far enough, personally, if you want to go for organic and human with the hand-drawn feel).</p>
      <p>I like the idea of the mark (the lamp, the light, the cut-paper feel, the lampshade being an external cover for a lightbulb which = inspiration/ideas), but the execution seems a bit off. First of all, that lampshade's ornament screams 'grandma lamp' to me. There's just no way around it. Though, I'm guessing a non-ornamental design looks a bit plain. Not sure what to tell you. Perhaps the addition of a hanging chain if you simplify the shade? Also, the lampshade clashes with the structure of sans. The two seem fundamentally dischordant, and the contrast isn't clicking for me. The lampshade's ornament wants Mrs. Eaves-esque warmth and friendly serifs, and the type wants an Ikea lamp.</p>
      <p>Not sure how to make it work, but if you do, I think it'll be great. Perhaps take a look at <a href="http://www.apple.com/ilife/" rel="nofollow">Apple's iLife logo</a>, which strikes some similar visual chords. (The green made me think of it.)</p>
