    html: <p>Really like the concept and I like drawing no. 2 best. Maybe if you want a casual, ('quirky' even) style you use a jaunty angle for the box surrounding the lampshade. I prefer hand-lettering over type; it shows a bit more effort has gone into the design and makes it look more personal.  Have a look at <a href="http://www.houseind.com/" rel="nofollow">House Industries</a>' work - very immediate and attention-getting. And it shows that you can have a stylish clean look along with personality at the same time.</p>
