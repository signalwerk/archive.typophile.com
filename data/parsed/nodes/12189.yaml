      <p>#3 doesn't do it for me at all. It screams "late 90s web design firm", and having spent several years toiling in the salt mines for one of those, I don't like to be reminded of it. I kind of dig the ominous penumbra around the lamp, but the lettering and that brownish-red... they kinda make me think of failed dotcoms, as well as making me twitch.</p>
      <p>I actually prefer the original to your revisions, and here's why: it totally evokes your group's background in film, because it reminds me of Saul Bass's classic title designs from the 1950s and 1960s. The rough feel of the Neo Retro, the layout of the elements, the idea of the lamp, they all work for me. I agree with those who say the lampshade is too frowsy for what you're trying to do, but that's my only real problem with the design. It looks retro without being too ironic.</p>
      <p>If I had to choose one of the revisions, I'd go with the type from #1 with the layout and icon from #2.</p>
