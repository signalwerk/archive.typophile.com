      <p>Thanks everyone for your comments - we check the site often to see what you all have to say.</p>
      <p>I think that perhaps our design idea is being misinterpreted - yes, we were going for a 'retro' feel, because we felt it was warm and approachable.  We thought the 'organic' quality, established through the colour scheme, the imperfect lettering and the irregular box, helped convey the message "we're a small company, personable and human."</p>
      <p>We completely understand your thoughts on the lettering.  Perhaps we SHOULD go for Sackers Gothic.  I'll post a revision to the logo shortly.</p>
