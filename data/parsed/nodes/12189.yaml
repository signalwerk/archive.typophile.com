    html: |-
      <p>Hey there, Jay,</p>
      <p>You reply to Dan that it’s a shame he doesn’t like the concept, because you think it works pretty well. I think you shouldn't put up your logo here for critique if you can't stand people being critical. Of course there is the issue of bluntness, but you are way better off with a blunt and just critique than a friendly but hazy one.</p>
      <p>Having said that - I think the basic concept of the logo is very nice. I agree with others that it needs working on, though. You may like the concept, but it is your customers that must do the liking, and I think you can assist them better than you do now.</p>
      <p>The lamp icon can be a strong image. In the latest version it is getting there, but graphically it is still quite busy. What can you throw away without losing the overall feel? Do you really need a box around the image? Can the lamp be bigger, smaller, simpler, richer, etc?</p>
      <p>A design teacher of mine once gave me a nice method to develop an image. Take a big sheet of paper and divide in lots of squares. Force yourself to draw the image again and again until you have filled the paper. Try all kinds of variations, everything you can think of, and don't be critical. The fun starts when you are out of ideas but still have to go on to fill the page. That's when the obvious solutions dry out and the creative ones appear. You may be surprised with what you can come up with. Sounds like a lot of work? Might be, but your logo is worth it.</p>
      <p>----------------------------------------------------<br>
      My work is a game. A very serious game [M.C. Escher]</p>
