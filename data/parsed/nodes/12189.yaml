      <p>I think you need to rethink the concept. Think about your business and clients, do they want to be associated with sloppy graphics and old ideas? Do you use "film", I doubt it. You can look retro and contempory at the same time. Your look as it stands looks sloppy (type and kerning), and old the kind of lamp you are using. </p>
      <p>Try going away from the computer get a pencil and paper and draw concepts. The corner you are painting your company into is too limiting. It might work for a while but in the long run you will regret it.</p>
