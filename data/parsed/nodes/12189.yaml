      <p>Daniel Weaver,</p>
      <p>Thank you for replying to my post.</p>
      <p>It's a shame you don't like the concept, we think it works pretty well.  Perhaps our work stands up as a little sloppy compared to your extremely starched-white-collar portfolio, but that's how we like it.  Our company is casual but dedicated, and as important as a corporate image is, our personalities and networking capabilities are attracting clients a month before we actually launch and we will keep them coming back.</p>
      <p>While we appreciate your opinion and everyone is entitled to their own, you came off really very harshly in your last post.  While tone is an extremely difficult thing to convey over the Internet, common courtesy would have steered you away from such harsh vocabulary.  This forum is a critique, not a platform for slander.  Many of us are new at this and just learning the ropes (as you might have guessed by the fact this logo is for a new graphic design firm and I'm a new member to Typophile).</p>
      <p>As my own mother noted: "If you do not have something nice to say, don't say anything at all."  Add in 'or constructive' next to 'nice' and you have something there.</p>
