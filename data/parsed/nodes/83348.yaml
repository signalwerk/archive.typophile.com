      <p>Frankly, yes, I am inclined to use clean typography for this thing, though "clean &amp; modern" has a broad definition. :)<br>
      The icon will not be used as much anyway, you are right here. Actually, I am thinking of taking the brush stroke and using it for other small applications, doing other graphics in this style.</p>
      <p>However, I do not see a humanist sans or expressionist face pulling out the job here. I don't know why, I can't reason that. A perfect find would be a family, with slabs and sans and serifs or stencils (Stag by Commercial Type / Jigsaw by Typotheque / Primetype's Manual maybe?) to use them interchangeably for headlines, menus, promotions, etc. Search for Bauholzdesign to see what the bar will look like inside – and to mix this picture with a playful typeface?</p>
      <p>As I said in my first post, the biggest reasoning for me is to support the wordplay with image-play: expressionism and machine age, both happening almost at the same historic period. I might be wrong. I might be trying to justify myself. Trully, I am a bit out of breath... (but I am still listening carefully)</p>
