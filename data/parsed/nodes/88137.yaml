  html: |-
    <p>Am a student and can't afford the fonts listed below.<br>
    However I need fonts that look as alike as the listed fonts below for an important design project.</p>
    <p>Berthold Akzidenz Grotesk Medium Condensed<br>
    Berthold Akzidenz Grotesk Medium<br>
    Berthold Akzidenz Grotesk Super<br>
    Minion Pro Display<br>
    Galliard Display Roman<br>
    AG Book Pro Regular </p>
    <p>Would be very happy if someone please could help me out with some free alternatives.</p>
