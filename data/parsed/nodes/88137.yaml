      <p>Instead of Galliard Display you can use Pona Display Demo: <a href="http://new.myfonts.com/fonts/tipografies/pona-display/" title="http://new.myfonts.com/fonts/tipografies/pona-display/">http://new.myfonts.com/fonts/tipografies/pona-display/</a></p>
      <p>When it comes to Akzidenz Grotesk, go for a geometric sans. Helvetica, Arial if you have, if not get one of their sisters:</p>
      <p>Tex Gyre Heros: <a href="http://www.fontsquirrel.com/fonts/TeX-Gyre-Heros" title="http://www.fontsquirrel.com/fonts/TeX-Gyre-Heros">http://www.fontsquirrel.com/fonts/TeX-Gyre-Heros</a><br>
      or Nimbus Sans, which is part of the URW font package: <a href="http://www.artifex.com/downloads/" title="http://www.artifex.com/downloads/">http://www.artifex.com/downloads/</a></p>
      <p>Another geometric sans is:<br>
      Eau: <a href="http://www.fontsquirrel.com/fonts/Eau" title="http://www.fontsquirrel.com/fonts/Eau">http://www.fontsquirrel.com/fonts/Eau</a></p>
