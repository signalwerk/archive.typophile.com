    html: |-
      <p>Akzidenz Grotesk &amp; AG Book = closest free option is probably Arial or Helvetica (free as in likely pre-installed on your computer)</p>
      <p>Minion Pro = if you have a Mac, perhaps Palatino would suffice (again, pre-installed). Also note that, I think--at least at one time--Minion was installed for you if you purchased an Adobe product such as Illustrator or Photoshop. </p>
      <p>Galliard = I'm not much help there. Maybe Georgia is close enough to the ballpark for you. But that's probably a long shot.</p>
