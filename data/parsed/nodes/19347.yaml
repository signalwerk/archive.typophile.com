    html: |-
      <p>I’m betting the key to this one lies in some old Dan Solo CD, but I don’t have any of those. I checked the ones for sale I could find online with no luck. I did see something with a similar feel at Nick’s Fonts, and I saw that a Dan Solo font was the inspiration. But between this and the other places are some of the sharpest ID-ers there are, but no luck. I haven’t seen Mike Bowfin lately, so keep checking back.</p>
      <p>I have looked so much the C, E, S, and K/Rs are etched in my mind.<br>
      : )</p>
