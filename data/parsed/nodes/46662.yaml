  html: |-
    <p>Hello!</p>
    <p>I am currently putting together my documentation, which is all about a sport/transportation product mainly used in northern regions like Scandinavia.<br>
    I decided to use Whitney light as my text font but looking for a fontstyle for the titles which is both matching to the text style as well as picing up the sport, fresh, adventurous character.<br>
    .. But nevertheless, probably the text font is not the best one as well.<br>
    Btw. the paragraphs are quite short, it only takes a minute to read it through.</p>
    <p>Any suggestions?</p>
    <p>Thx a lot!!</p>
    <p>regards</p>
    <p>Sepp</p>
