    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Eaglefeather_news_4089.jpeg"></div><p></p>
    <p>The Eaglefeather font family is based on the alphabet designed by the master architect, Frank Lloyd Wright, for the Eaglerock project in 1922. In 1998, in conjunction with the Frank Lloyd Wright Foundation, Taliesen West, P22 released the FLLW Eaglefeather Set, an adaptation of the font that included a set of extras and other type-savvy features. In 1999, the font was further expanded with a light version as well as small caps and a unique informal version in three weights- Regular, Light and Bold. P22 FLLW Eaglefeather Pro completes the family with the addition of two new weights, Hairline and Black, and adds new language support for Greek, Cyrillic and full Pan-European Latin plus OpenType features available for all pro styles. In all, the NEW Eaglefeather Pro Family contains 15 full-featured, OpenType fonts plus 20 basic styles.</p>
    <p>The OpenType features contained in P22 FLLW Eaglefeather Pro include automatic fractions, optimized kerning, localized language features, small caps, old style figures, superior and inferior figures, ligatures, stylistic sets as well as alternate forms of capitals A,H,N &amp; S for maximum flexibility. The full range of weights and styles allows for expanded typographic possibilities in a wide variety of uses. </p>
    <p>More information and previews can be seen here: <a href="http://www.p22.com/products/flwfa.html" rel="nofollow">P22 FLLW Eaglefeather Pro</a> </p>
    <p>Frank Lloyd Wright, Eaglefeather and Taliesen are registered trademarks of the Frank Lloyd Wright Foundation.</p>
