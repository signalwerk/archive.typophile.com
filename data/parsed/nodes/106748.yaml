    <p>This beeing my first post:<br>
    Hello everybody!</p>
    <p>I'm an architecture student and this is the first time I'm really dealing with typography. It's only a very basic draft supposed to show the characteristics of a font I want to create myself, as I can't seem to finde anything comparable that tries this fusion of geometric structure and "contemporary" spurless details.<br>
    If you know any existing font with these features, please tell me - there has to be one somewhere.<br>
    Anyway, please feel free to tell me, wether you think this is a project I should push further or if it is completely hopeless - architects tend to think they can do everything on their own and end up in a massive mess.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/draft-01.jpg" width="596" height="842" alt="">
