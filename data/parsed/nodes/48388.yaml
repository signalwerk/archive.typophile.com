    <p>Link: <a href="http://www.frankkent.com/" rel="nofollow">Frank Kent Motor Company</a></p>
    <p>Yes, this millenium has just started and I'm not a designer (which apparently means that I'm not really entitled to an opinion {grin}), but this icon for a local car dealer is as horrible as it is hilarious.  This snip is from their website, but their local billboards are, if you can believe it, even worse. Surely this is an avatar of the Apocalypse.</p>
    <p>DFW of DFW</p>
