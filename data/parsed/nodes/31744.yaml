    <p>1) does anyone know why i can’t update my icon ? ...i check “delete” next to the existing and select a new one, the new one is listed by name on my profile, but the old one remains. i’ve tried deleting and logging out, then reading a post to verify a blank space, then logging in and selecting the new icon for my profile, only to have the old one re-appear ! spooky.</p>
    <p>is there a tech admin ?</p>
    <p>2) do other folks see in forum categories that “critique” is the only category without:  topics/posts/latest listings ? there’s some good threads in there worth tracking.</p>
    <p>cheers.</p>
