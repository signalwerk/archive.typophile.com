  html: |-
    <p>Hello all,</p>
    <p>I wanted to put the word out on this exhibition to those in Melbourne between now and the 5th May.</p>
    <p><strong>+&amp;-=X: 20 Years of typo-graphics from the Tokyo Type Directors Club</strong></p>
    <p>The work on display is excellent and of the highest standard, what's more is it's a hands on exhibit, meaning the real work is on show and you are able to pick everything up and have a closer look at all of the work.</p>
    <p>+&amp;-=X Exhibition</p>
    <p>Faculty Gallery<br>
    Monash University<br>
    Art &amp; Design Building<br>
    900 Dandenong Road<br>
    Caulfield East 3145<br>
    Melbourne<br>
    Australia</p>
    <p>Opening hours: </p>
    <p>Monday - Friday<br>
    10 am to 5 pm<br>
    Saturday<br>
    1pm to 5pm </p>
    <p>Check it out if you can, it is well worth it.</p>
    <p>Cheers,<br>
    Barry.</p>
