      <p>2006 we did some typographic compositions in the typography class in Basel during our first year at the academy with our professor Philipp Stamm. We worked with the words of a quote by Kurt Schwitters taken from his script «Die neue Gestaltung in der Typografie» (loose translation: «The New Design in Typography») he did in 1930. It's:</p>
      <p><cite>«Gestaltung ist Einheit aus Vielheit, durch Auswahl, Begrenzung, Gliederung, Rhythmus, durch ruhendes oder gerichtet bewegtes Gleichgewicht, durch System.»</cite></p>
      <p>I would translate it this way:<br><cite>«Design is unity out of multiplicity, by selection, limitation, formation, rhythm, via static or directedly moved balance, via a system.»</cite></p>
      <p>He also writes <cite>«Die neue Typografie erfasst alles durch Gestaltung.»</cite> what means <cite>«The new typography compasses anything through design»</cite> – just to link the two terms in this context.</p>
    html_clean: |-
