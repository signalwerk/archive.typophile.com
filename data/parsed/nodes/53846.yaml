      <p>I see graphic design as the organization of information that is semantically correct, syntactically consistent and pragmatically understandable.<br>
      MASSIMO VIGNELLI</p>
      <p>We need to aim at essential things, to remove every redundant effects, every useless flowering, to elaborate a concept on mathematical bases, on fundamental ideas, on elementary structures; we strongly need to avoid waste and excess.<br>
      AG FRONZONI</p>
      <p>An image can only be one element in constructing a sequence of understanding.<br>
      GERMANO FACETTI</p>
