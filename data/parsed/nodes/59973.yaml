    html: <p>It's hard to tell the weights, etc. when the type is distroted by the folds of the clothing. <a href="http://new.myfonts.com/fonts/sideshow/coffee-service/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Coffee Service</a> may be a suitable match for "The" and <a href="http://www.linotype.com/187496/sackersgothicheavy-font.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sackers Gothic Heavy</a> may be a good match for "CITY". At first I thought I could see Copperplate Gothic serifs on the C, but now I'm not so sure.</p>
