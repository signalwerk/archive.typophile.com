    html: |-
      <p>Seems that the right-most node of your D is on a decimal, which is not going to work out for you in PostScriptLand. Fontographer allows you to put nodes and BCPs on decimals, but the generated fonts will be “flattened”: nodes and BCPs moved to the closest whole unit.</p>
      <p>And, no 450 is not too great a character width, but it seems that you’re not really using your em-square of 1000 units to the best advantage, jufging by this cap D. (It IS a cap D, right?)</p>
