    <p>hello,</p>
    <p>how do you set your sidebearings and character widths so that they are nice round numbers. i can set my character width to a certain width and my left side bearing, but not my right. it seems like only two out of the three numbers can be whole. </p>
    <p>also, is 450 too big for a character width?</p>
