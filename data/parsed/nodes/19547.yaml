  html: |-
    <p>When I recieve a polish Word document and want to import the text to various programs I get in trouble…<br>
    I need to use Helvetica Central Type 1. In Quark 6.5 it works fine. In InDesign, Text Edit and Word 2004 on Mac the text is translated to the right unicode values and then doesn’t work with the old Type1 fonts with different encoding. I have to choose an OpenType font to get the right result.</p>
    <p>I am working on a danish keyboard</p>
    <p>Is there a way that I can avoid the translation or do I have to get myself new fonts?</p>
