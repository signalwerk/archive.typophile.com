      <p>&gt; or do I have to get myself new fonts?</p>
      <p>I’d say, that’s the wisest thing you could do, especially if you’re going to work with CE characters.</p>
      <p>People update their applications, but usually forget that fonts need to be updated as well, since they’re software too.</p>
