    html: |-
      <p>About 15 years ago there was a company in the Finnish market that made cyrillic fonts with wrong encoding. Some customers still use them, and it’s rather annoying, when importing the text all glyphs are mixed up. So unless I want to use the same font as them, I have to type or find/replace the whole text.</p>
      <p>Freehand has for a long time been the default application in Finland (I don’t know why), and I have had problems with cyrillics and Baltic glyphs with it. I found, that it was easiest to fix problems in InDesign and then copy/paste the text to Freehand. With Adobe buying Macromedia we will be finally forced to move to Illustrator, which is good news, especially regarding the fonts.</p>
