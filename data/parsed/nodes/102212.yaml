      <p>Thanks for the example. I think I have seen Ernestine before. I love how it takes a typewriter inspiration and evolves it into something very charming, playful and in the Italic even delightful typeface. The Italic keeps the proportions and rythm alive, but borrows the handwriting element (as rennaissance and baroque antiquas do), which breaks with the Egyptienne sense over the regular style.</p>
      <p>I haven’t begun yet working on the Italic cuts of Hikari, as I am still busy with accents, special characters, subtle weight adjustments, spacing and kerning. And then there are Open Type features I want to look at, before I can even start thinking about the intermediate cuts, like Book (between Light and Regular), Medium, Bold and the Italics. I will try out a few things with the latter before I settle with a theme, but like you suggested, it would be challenging but nice if it could take it all a level higher.</p>
