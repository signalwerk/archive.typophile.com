      <p>Thanks for your words, Nick. I am aware of the passionate discussion and I didn’t take it the wrong way. Like I said, I was not so much aware of the differences of terminology in the English speaking and German speaking <em>schools of typography</em> (in a cultural way). </p>
      <p>Franklin Gothic, Trade Gothic and other classic American grotesque fonts never went out of fashion in the U.S. and Canada perhaps, but they were never really used in Europe prior to the late eighties, early nineties. I was an art director at a European advertising agency in 1993 and we had all recent editions of the TDC books and subscribed to a couple of typography and design magazines (it was the eighties, they still had money). I remember how our art directors were typographically influenced by what they saw in American print ads. For an example, we didn’t use Futura Extrabold Condensed much, but it was popular in New York ad agencies.</p>
      <p>While I am personally more a fan of books, magazines and posters using refined typography, it is a reality that the big living body of typography (= fonts applied in daily life) live in the mass media, mostly advertising in print and on TV, and lately mostly on the Web – which is why I find it important to cultivate the typography that is meant primarily for screen applications.</p>
      <p>There are a couple of interesting developments going on, among them <em>responsive typography</em>, different cuts of the same typeface that are used depending on the use of the medium, which means the screen size, the screen resolution, but also the use of the application (surrounding environments). The <em>responsive</em> part of the term derives from <em>responsive architecture</em>, a philosophy or principle that lets people experience their surrounding architecture depending on the circumstances (night/day, winter/summer, few people/a lot of people in the same space, for an example).</p>
      <p>I think a modern typeface should indeed be made for multiple purposes and if the designer aims for a wide spread application of their typeface, they should make fonts applicable for these environments – print, screen on TV, high resolution screens on computers, etc.</p>
      <p>Hikari is not designed to be a bread-and-butter font for book or longform journalism. But I hope it could become a responsive typeface, with enough weight and spacing variations and cuts (like a monospaced version) for various applications. I will definitely look into multiple languages, but this is the part that makes the release such a big amount of work.</p>
      <p>Last but not least, it is my first release in 20 years and I am looking into more ideas for future typefaces, like a humanist sans serif and a renaissance or baroque antiqua.</p>
      <p>One last word on <em>constructivism</em>.</p>
      <p>I did some research last night and found that the source of <em>russian constructivism</em> was demolished by the <em>Russian Bolshevism</em> around the time of 1920s, but its spirit had sparked a fire that lived on in the rest of Europe as <em>international constructivism</em>, particularly in Germany, where it influenced the creation of the <em>Bauhaus</em> and the associated movement. It had an influence on Paul Renner, when he began working on Futura, but of course the typeface he released is today not classified as <em>constructivist</em> but <em>geometric</em>. Still, in German (and Dutch) language the word <em>konstruktiv</em> is used to describe a dry and strict, rather geometric character of a piece of art, design or article of daily use.</p>
