      <p>Thanks for your advice! For the Italic I have planned a “true Italic” (despite the discussions lately that constructive sans serif fonts shouldn’t have a round lowercase “a”). I am also thinking about including alternative characters in Open Type, but I have yet to master the software and better understand OT principles. </p>
      <p>I have drawn Hikari in Fontographer (after a few initial sketches by hand), then converted it to Fontlab and I have been playing with a test version of Glyphs, which feels much more like modern software, but either I’m missing something or features like extrapolation (changing weight proportionally) are missing. I am suspecting they are done with Multiple Master layers, but I am not sure.</p>
