      <p>I think back when people didn't have a lot of fonts it made sense for different weights/styles to do a different job properly versus look like they all belong together*. But these days when somebody wants a narrow font that's squarish (because, as you imply, that looks better) he chooses the narrow style of a typeface that's squarish all around; he doesn't expect to get that from the narrow style of a roundish font - because frankly that doesn't make sense. So I think in older versions of Helvetica it was good design to have the narrow styles break with the "expected look" of the typeface, but these days that's a lousy design solution.</p>
      <p>* Like how <em>even within one font</em> caps could have a different job to do, hence a different look - see my last point here: <a href="http://typophile.com/node/102373#comment-551407">http://typophile.com/node/102373#comment-551407</a></p>
      <p>As for authenticity, I have to wonder: what proportion of users today expect the different weights of Helvetica to look like they used to look for the previous generation, versus following the expected look of Helvetica as a whole?</p>
      <p>hhp</p>
