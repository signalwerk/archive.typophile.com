      <p>I’m sorry, but I didn’t announce my work on Hikari in order to trigger a dogmatic discourse about etymologic roots and categorical ontology of typeface specifications throughout the history of time.</p>
      <p>I learned through this discussion, that the terminology of modern typography varies a lot in European and American culture, and I assume it may be similarly different in other regions and cultures. And of course, an exchange with people with a passion for a certain field will always create passionate discussions. </p>
      <p>However, my intention was simply to introduce you to a new font with a slightly different outlook, with an aesthetic orientation that differentiates itself from the traditional rails of yet another purist Akzidenz Grotesk or Helvetica interpretation. As subtle this reference may be, I regard it as a legitimate direction.</p>
      <p>What is it that gives <a href="http://typography.net/fontfamilies/view/39">Fenland</a> the flair of a flat, grassy landscape, other than the reference in its name and the <a href="http://www.flickr.com/photos/eyemagazine/7008972239/in/photostream/">intentional art direction</a> by its designer, Jeremy Tankard?</p>
      <p>Nick Shinn declares my attempt a <em>generic neo-grotesque</em> and he evaluates the market as a niche. I guess that makes sans serif highlights of recent years, like Dalton Maag’s <a href="http://www.daltonmaag.com/buyonline/fonts/aktivgrotesk">Aktiv Grotesk</a>, PS Type’s <a href="http://cargocollective.com/pstype/Runda">Runda</a>, Christian Schwartz’s <a href="http://commercialtype.com/typefaces/atlas/grotesk">Atlas Grotesk</a> and <a href="http://commercialtype.com/typefaces/graphik">Graphik</a>, Eric Olson’s <a href="http://typographica.org/typeface-reviews/colfax/">Colfax</a>, Laurenz Brunner’s <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Akkurat/">Akkurat</a> and <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Circular/<br />
      ">Circular</a>, Timo Gaessner’s <a href="http://www.milieugrotesque.com/typeface-maisonneue">Maison Neue</a>, Margaret Calvert’s <a href="http://www.newrailalphabet.co.uk/">New Rail Alphabet</a>, Playtype’s <a href="https://www.playtype.com/font/grot10">Grot10</a> and <a href="http://www.virusfonts.com/">Virus Fonts’</a> upcoming release <a href="http://virusfonts.com/news/2013/01/david-bowie-the-next-day-that-album-cover-design/">Doctrine</a>, used on the new David Bowie album <em>The Next Day</em>, all together <em>generic</em> niche products.</p>
      <p>Maybe so. But they seem to have found an active interest and acceptance, resonating in current poster- and book designs for art museums, design magazines and photo books. It seems to me that there is a bunch of designers who like attributes of the tone of voice of a Helvetica Neue, but they don’t necessarily want to wear the same old shoes.</p>
      <p>If typefaces were only designed to follow a trend and become instant hits, we would have the Lady Gagas among them triumph over the ones with a subtler tone of voice. If we called every interpretation of a standard <em>unoriginal</em>, we would lose joy in playing jazz.</p>
      <p>Hikari’s design reminded me of wooden framed paper walls, green tea and futon beds. Through its proportions and expression it resembles to me a distinct purity and elegance I see in one of the many faces of Japanese culture, a culture that sees Latin types with different eyes.</p>
      <p>I didn’t intend to reinvent the sans serif, grotesque or gothic font genres or classification. My goal was much simpler: to evoke a similar sensual experience, inspiring designers to use a new tone of voice, to see my font become alive in their works, their designs of identities, websites, magazines, posters and books.</p>
      <p>That, and I didn’t like to wear the same old shoes.</p>
