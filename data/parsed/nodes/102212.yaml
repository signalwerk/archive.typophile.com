      <p>@Albert Jan: <em>No matter what words we use, I think we talk about the same forms.</em></p>
      <p>But if I hear the word Constructivist in a discussion of type, I will assume the conversation concerns the heavy rectilinear lettering of Soviet Constructivist posters, not the circle-square-triangle of Futura. This is the cliché:<br><img src="/sites/default/files/old-images/1664651272488969_5794.jpg"></p>
      <p>@Henning: <em>In the late 1980s, American classics like Trade Gothic and Franklin Gothic were used again in Advertising, so the American newspaper title style has been a second strong influence on sans serif fonts…</em></p>
      <p>This makes no sense.<br>
      Trade Gothic and News Gothic were all-purpose jobbing types, not just news headline styles. And they had been used continuously prior to the late 1980s, so to say that they were used “again”, implying that they had fallen from use, is incorrect.</p>
      <p>There are four places to ﬁnd type history:<br>
      (1) Awards annuals and other design trade hagiography<br>
      (2) Foundry specimen books<br>
      (3) Type house catalogues<br>
      (4) Contemporary publications</p>
      <p>Design history as taught in design schools is, of course, academic, and IMO overly invested in (1) and (2).</p>
      <p>This next from a type house catalogue in Toronto, 1929, at the end of the Historicist era. You can ﬁnd Franklin Gothic in North American type house catalogues continuously since its introduction. It was never replaced by geometrics, but augmented.</p>
      <p> <img src="/sites/default/files/old-images/Moore_6355.jpg"><br>
      The use of the term “grotesque” for the older style of sans serif was in no way a value judgement; neither was “gothic”, which initially described Northern European culture, but was subsequently in the 19th and 20th centuries more generally associated with an ornate style of medieval architecture. These words had long since been stripped of their original meanings.</p>
