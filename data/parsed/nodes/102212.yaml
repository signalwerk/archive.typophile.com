    html: |-
      <p><img src="/sites/default/files/old-images/hikari-ampersand_4690.jpg"></p>
      <p>A lot of cleanup work has been done since my announcement last week. I have completed work on the special characters, like mathematical and Greek glyphs, as well as accents and little headaches, like the ampersand glyph. </p>
      <p>It’s always difficult to make a decision for the design of a classicist sans serif. Theoretically, the classicist sans serif follows the shapes of the classicist antiqua and the earlier baroque antiqua, which are standing at the end of an evolution of renaissance typefaces. Theoretically, the classicist sans serif ampersand should derive from these shapes, like seen in Bodoni, Times and Georgia (which in essence, are modern baroque antiquas). However, grotesk typefaces have come a long way in abstracting that shape and modern sans serif fonts have even returned to the roots, going back to the original ligature shape of a capital, handwriting E and the lowercase letter t, forming a ligature of “Et” (from Latin, et).</p>
      <p>I tried to come up with an ampersand that derives from the classicist form, but follows the clarity of formal language of the typeface as a whole. I am not sure if I succeeded 100%, but it seemed better than following the  recent trend of taking “Et” as a literal ligature.</p>
      <p>Your thoughts and comments are welcome – Hikari is still a work in progress.</p>
