    html: |-
      <p>The ampersand looks too much like 8.<br>
      At text size, readers will be confused.</p>
      <p>**</p>
      <p>Your historical terms are incorrect, which may be a language problem.</p>
      <p>Grotesk was not a derogatory term.</p>
      <p>Frutiger did not spark a renaissance in humanist sans type, as there was never much of that in the ﬁrst place, other than Gill Sans and Syntax, which was published not long before. The German version of Gill Sans with single-storey /a and /g could hardly be considered humanist—see my post with image here:<br><a href="http://typophile.com/node/44358">http://typophile.com/node/44358</a></p>
      <p>Constructivism in type is generally understood to refer to the rectangular, blocky style of lettering used in the Soviet Constructivist movement by Rodchenko etc.</p>
      <p>Your understanding of type history and type classiﬁcation is unconventional.<br>
      Either you are spreading misinformation, if readers believe what you are saying, and if they don’t, they will think you poorly informed.</p>
      <p>It may well be that Japan has inﬂuenced your design of this face, but it is unlikely that anyone else will be aware of Japanese connotations from what is essentially a generic neo-grotesque.</p>
      <p>Nonetheless, as you have chosen a Japanese name and are pursuing that allusion, I would recommend that you develop that idea in your writing and branding, and forget the other historical explanations.</p>
      <p>**</p>
      <p>I would also recommend that you publish at least eight weights, include multiple OpenType features, and have extended language support. That’s a huge amount of work, but necessary to sell licences for such a subtle genre exercise in such a crowded marketplace.</p>
