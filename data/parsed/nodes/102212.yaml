      <p>Sure, Marc – I think Colfax lies balanced between a geometric and a classicist sans serif. I would say it leans towards grotesque, or classicist shapes. Why? Because all endings of open circular shapes (the lowercase “a”, upper left ending, the lowercase “c”, “e”, etc.) are closing with the horizontal invisible line. They are bent towards a 90º up or down direction. Humanist sans serif typefaces often have endings towards a vertical line, or they are slightly bent.</p>
      <p>The main feature that makes Colfax lean towards the geometric sans serif is the lowercase “a” with its round belly, similar like Proxima Nova and early alternative versions in drawings of Futura.</p>
      <p>Interesting enough, Avenir and Gotham, as well as Proxima Nova, are all classified geometric sans serif typefaces, but only Proxima Nova has a similar lowercase a shape like Colfax.</p>
