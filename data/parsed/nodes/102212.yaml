      <p>Interesting, and I do understand that the differences in terminology have their roots in different language and cultures combined. The Swiss design and typography culture is strongly impacted by its past and great minds of those times.</p>
      <p>Apparently both references to the heritage of grotesque/grotesk are correct. Here is a translation of the text beneath, which I found <a href="http://www.typolexikon.de/g/grotesk.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">in this source</a>:</p>
      <p><em>“Semantically, the term ‘grotesque’ derives from the neo-French language of the 17th century, at first as an expression of the liberal arts to describe non-natural combinations of human, animal and plant parts. In etymology this term is borrowed from the Italian ‘grottesco’, which actually means ‘being part of the cave’. It refers to antique paintings and type or carving signs, which were discovered in caves and rooms filled with rubble. In Germany sans serif fonts are called ‘Grotesk’ until this date [4].”</em></p>
      <p>Original text: <em>“Semantisch stammt der Begiff »grotesque« aus der neufranzösischen Sprache des 17. Jahrhunderts, zunächst als Ausdruck der bildenden Kunst für nicht-natürliche Kombinationen von Menschen-, Tier- und Pflanzen-Teilen. Dieser Begriff ist etymologisch aus dem italienischen »grottesco« entlehnt, das eigentlich »zur Höhle gehörig« bedeutet. Gemeint sind damit antike Malereien und Schrift- bzw. Kerbzeichen, die in Höhlen und verschütteten Räumen entdeckt wurden. In Deutschland werden serifenlose Schriften bis heute als »Grotesk« bezeichnet [4].”</em></p>
