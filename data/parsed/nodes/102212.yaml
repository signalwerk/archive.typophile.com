      <p>In mentioning the marketability of the face I described it as a generic neo-grotesque, which was not intended as a negative comment. I was inﬂuenced by what Ivo Grabowitsch, FontFont Marketing Director, had said last week at the Typo San Francisco conference in his talk about “what type customers need today”, in which he proposed more originality and fewer subtle interpretations. </p>
