      <p>I see your point, but actually there are condensed grotesque typefaces (especially the bold cuts) that do have very straight lines. Take Impact, or Berthold Akzidenz Grotesk Condensed. Colfax is not a condensed version of a typeface, but it uses this pattern throughout the whole family. I agree, it is quite close to DIN, even more the original version, rather than the softer family from FontFont.</p>
      <p>I am not saying it should not be classified as geometric. I am saying it is leaning towards a grotesque.</p>
