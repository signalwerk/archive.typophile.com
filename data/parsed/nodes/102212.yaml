      <blockquote><p>According to my teachers, there were basically three sans serif directions: the humanist one (Gill Sans), the constructive one (Futura, Bauhaus) and the classicist one (Haassche Grotesk, Helvetica, Univers).</p></blockquote>
      <p>Exactly. No matter what words we use, I think we talk about the same forms. </p>
      <p>The typeface Frutiger is the result of Adrian Frutiger being the first type designer having a modernist take on the humanist sans. I can confirm that Frutiger had a huge influence on people like Gerard Unger, Lucas de Groot, Peter Matthias Noordzij and myself. Just to name a few, and not just because of Frutiger. His book Type Sign Symbol was an eye-opner to many designers that were at one side educated as traditional typographers but also appreciated the modernist movement.</p>
      <p>In Germany, the constructivist movement in art was one of the major forces that made Tschichold, Renner, Bayer and Schmidt look into the sign-painters and lettering manuals in which geometric typefaces, amongst them were also sans serifs, had been tumbling around for about 50 years. Creating a single storey lower case a from a perfect circle and a vertical stroke is as old as that.</p>
