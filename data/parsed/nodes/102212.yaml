      <p>My education in graphic design was at the Schule für Gestaltung in St. Gallen, where I had two typography teachers from 1983 until 1989, one from Zurich and one from St. Gallen. </p>
      <p>It may sound surprising, but even with the three design schools of Basel, Zurich and St. Gallen, there was a subtle rivalry among typography teachers about what was correct and what was incorrect.</p>
      <p>I remember one afternoon where us students were surrounding a handprint letterpress machine, with printed type specimens in Syntax and Haassche Grotesk hung on the wall. One of the students asked our teacher why they used to call those sans serif fonts “grotesk”, and my teacher replied that at the time before it became popular, typographers found the minimalism and abstraction of shape a lack of elegance and sophistication. They found it was a sign of cheapness and mundanity. He also noted the connection to the ongoing industrial revolution that almost demanded this kind of change in typographic spirit. *</p>
      <p>So my reference may not be historically complete, if William Thorowgood really invented the term. Maybe there exists a dissertation clearing up <em>why</em> he came up with the term, but to me, the explanation of my typography teacher always made sense, in art historic context.</p>
      <p>The font Frutiger was the first of its kind, which I am sure had an influence on Gerard Unger’s Argo (even if it evolved from Swift), or Luc de Groot’s Thesis family.</p>
      <p>Gill Sans and Syntax have a stronger connection to renaissance proportions than classicist or baroque antiqua proportions.</p>
      <p>English is indeed my second language. The German word “konstruktiv” is not automatically associated with Russian constructivism. In my typography courses we were touching the works of <a href="https://lh4.googleusercontent.com/Toy5yzXrh_QKT16JstccjwM_asbgKpyl0B7xnCT6dgJEh9Q_zJ4qHNs1D8JP9hZqEkHSxARv8XF5eOW-__IXOCbQFneQFxPOsCvIUMYLnO9LnKyU-Ks" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Jan Tschichold</a> as well, but also <a href="http://designkultur.files.wordpress.com/2011/02/paul-renners-first-drawings-for-futura.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Paul Renner’s studies</a> preceding his release of Futura. </p>
      <p>According to my teachers, there were basically three sans serif directions: the humanist one (Gill Sans), the constructive one (Futura, Bauhaus) and the classicist one (Haassche Grotesk, Helvetica, Univers).</p>
      <p>Regarding the Japanese reference in the choice of name – I believe this is enough to give the typeface a certain direction. Any sense of culture and style I project into the Hikari type family may be personal and nothing but a tone of voice I want to convey.</p>
      <p>Never the less it is true and relevant for the concept I have chosen. As a designer I was influenced by the assimilation of Western typography in current Japanese culture. It is of course completely irrelevant whether people seeing an application of the font will or will not make this connection – just as much it is irrelevant if an audience will think of the Swiss school of design, when they see an application of Helvetica Neue.</p>
      <p>Thank you for your recommendations. They go along with what I suggested throughout this discussion.</p>
      <p>---</p>
      <p><em><a href="http://www.wordnik.com/words/grotesque" title="Click to visit an external URL." class="freelink freelink-external freelink-external">* Grotesque:</a></em></p>
      <p><em>1. Characterized by ludicrous or incongruous distortion, as of appearance or manner.</em><br><em>2. Outlandish or bizarre, as in character or appearance. See Synonyms at fantastic.</em><br><em>3. Of, relating to, or being the grotesque style in art or a work executed in this style.</em></p>
