    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 30.Jan.2006 8.01am </div>
      <p>Hello from P22,</p>
    <p>This is just a quick reminder that there are only 2 days left to join the P22 club:<br>
    <a href="http://www.p22.com/members/club.html">http://www.p22.com/members/club.html</a><br>
    Year-round discounts and free fonts — A great deal for the font aficionado!</p>
    <p>There are also 2 days left for the sale on the <a href="/wiki/Jim%252BRimmer" class="wiki">Jim Rimmer</a> fonts:<br>
    <a href="http://www.p22.com/rtf/Fonts.html">http://www.p22.com/rtf/Fonts.html</a></p>
    <p>Plus we have lowered the minimum purchase amount to get a free copy of the P22 book:<br>
    <a href="http://www.p22.com/products/p22book.html">http://www.p22.com/products/p22book.html</a></p>
    <p>No new releases for February 2006, but stay tuned for many releases throughout the rest of the year.</p>
    <p>Best regards<br>
    P22 type foundry</p>
