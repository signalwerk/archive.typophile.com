    html: |-
      <p>Are you sure you are using the term "antialiased", and the reverse, "make it looks not anti-aliased", correctly?<br>
      "Aliased" is jaggy, with hard edges. "Antialiased" is with constructed soft edges.</p>
      <p>Using a pixel font, the text will (nearly) always be aliased. The "nearly" qualifier is because Acrobat <em>also</em> is able to antialias monochrome bitmaps of sufficiently high resolution (one can guess that to be &gt; 1.5 x physical screen dpi).</p>
      <p>If you <em>have</em> a real pixel (bitmap) font that you can use in InDesign, that will be passed on to the PDF unchanged; i.e., as pixels.</p>
      <p>However, I'm pretty sure you cannot use real bitmap fonts in InDesign--it's way too smart to allow that. Perhaps you have a simulated pixel font instead (<a class="freelinking external" href="http://www.zone38.net/font/" rel="nofollow">Press Start</a> comes first to mind). Those fonts are vector fonts, just like anything else, and just like other vector fonts it will be antialiased for screen in Acrobat.</p>
      <p>If you really <em>really</em> want a pixel font, create the text as image in Photoshop and place that into InDesign.</p>
      <p>Alternatively, you can do it the other way around: read your InDesign created PDF into Photoshop and rasterize; then save that as PDF again.</p>
