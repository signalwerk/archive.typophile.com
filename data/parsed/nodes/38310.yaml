      <p>For what you’re looking for, Leslie Carbaga’s Logo Font &amp; Lettering Bible is the best book that I have personally seen. I just bought it and wished I’d had this 10 years ago. </p>
      <p><a href="http://www.amazon.com/Logo-Font-Lettering-Bible-Comprehensive/dp/1581804369" title="http://www.amazon.com/Logo-Font-Lettering-Bible-Comprehensive/dp/1581804369">http://www.amazon.com/Logo-Font-Lettering-Bible-Comprehensive/dp/1581804...</a></p>
      <p>If anyone has any other recommendations, I’d be just as interested. I’m always looking for good books.</p>
