      <p>Adobe Press’s <em>Classroom in a Book</em> series is always a good investment, but their <a href="http://www.adobe.com/training/books/illustrator.html">Illustrator book</a> does not focus exclusively on type or logos.</p>
      <p>Leslie Cabarga has a new book called <a href="http://www.fwbookstore.com/product/1619/how"><em>The Secret Life of Logos</em></a>, but I think it is more about designing a good logo rather than how to draw one in Illustrator.</p>
