  html: |-
    <p>Courtesy director Spike Jones' <a href="http://weloveyouso.com/2009/10/pictorial-websters-will-blow-your-mind/" title="We Love You So – Where The Wild Things Are – Spike Jonze - Pictorial Webster’s Will Blow Your Mind!!!" rel="nofollow"><em>Where The Wild Things Are</em> production blog</a>, I found this delightful short film documenting <a href="http://www.quercuspress.com/" title="Quercus Press" rel="nofollow">John Carrera</a>'s decade-long effort to revive a century-old Pictorial Webster's reference book...</p>
    <p><strong><a href="http://vimeo.com/5228616" rel="nofollow">Pictorial Webster's: Inspiration to Completion</a></strong> from <a href="http://vimeo.com/user1882107" rel="nofollow">John Carrera</a> on <a href="http://vimeo.com" rel="nofollow">Vimeo</a>.<br>
    <em>From the discovery of the 1898 International Dictionary to linotyping the entries to printing the last print on the vandercook to cutting the fingertabs of the deluxe edition, this video gives a quick overview of the process of creating the Pictorial Webster's fine press edition.</em></p>
    <p>Very much worth watching!</p>
