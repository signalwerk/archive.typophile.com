    html: <p>(moved from Creative Squeeze thread) <br> <br>&gt;&gt; But it becomes your trademark simply by your using it.  <br> <br>Really. Since when. Not in the legal sense, not in the United States. <br> <br>If that were the case, Hrant would have a trademark on Helvomita. <br> <br>A work  is "copyrighted" when it's published* or seen by a third party.  <br>But a trademark is different. <br> <br>In a TM dispute, simply USING a mark first isn't enough.  <br>FIRST to FILE is also important if you want to use your  <br>mark outside of a limited geographic area. <br> <br>I agree that TMs typically destract... <br> <br>&gt;&gt;You can register it if you want to, but there isn't much point unless <br>you're a multi-million-dollar brand name. <br> <br>Partially disagree. If Scott wants to ensure that nobody gets the name, <br>now or in the future, not only does he need to be First to Use <br>but First to File. <br> <br>If someone independently comes up with Creative Squeeze and <br>files a federal trademark (and it goes through the process, <br>including being Published for Opposition) <br>then it will impede Scott from getting "national" with his mark. <br>He will have to stay regional and may <br>get a Cease and Desist from the other Creative Squeeze that'll <br>cost a lot more than $335 to handle. <br> <br>In my opinion. <br> <br>Hrant, you can file all kinds of city, county and state stuff but <br><a href="http://www.uspto.gov" target="_blank">www.uspto.gov</a> is the place to go to file a national trademark. <br> <br>If your trade channels don't extend beyond your state, then <br>it probably isn't necessary. <br> <br>These are opinions, btw, based on my own dealing with this <br>stuff. However, I'd check with a competent attorney. <br> <br>bj <br> <br> <br></p>
    html_clean: <p>(moved from Creative Squeeze thread) <br> <br>&gt;&gt; But it becomes your trademark simply by your using it.  <br> <br>Really. Since when. Not in the legal sense, not in the United States. <br> <br>If that were the case, Hrant would have a trademark on Helvomita. <br> <br>A work  is "copyrighted" when it's published* or seen by a third party.  <br>But a trademark is different. <br> <br>In a TM dispute, simply USING a mark first isn't enough.  <br>FIRST to FILE is also important if you want to use your  <br>mark outside of a limited geographic area. <br> <br>I agree that TMs typically destract... <br> <br>&gt;&gt;You can register it if you want to, but there isn't much point unless <br>you're a multi-million-dollar brand name. <br> <br>Partially disagree. If Scott wants to ensure that nobody gets the name, <br>now or in the future, not only does he need to be First to Use <br>but First to File. <br> <br>If someone independently comes up with Creative Squeeze and <br>files a federal trademark (and it goes through the process, <br>including being Published for Opposition) <br>then it will impede Scott from getting "national" with his mark. <br>He will have to stay regional and may <br>get a Cease and Desist from the other Creative Squeeze that'll <br>cost a lot more than $335 to handle. <br> <br>In my opinion. <br> <br>Hrant, you can file all kinds of city, county and state stuff but <br><a href="http://www.uspto.gov" target="_blank" class="link-external">www.uspto.gov</a> is the place to go to file a national trademark. <br> <br>If your trade channels don't extend beyond your state, then <br>it probably isn't necessary. <br> <br>These are opinions, btw, based on my own dealing with this <br>stuff. However, I'd check with a competent attorney. <br> <br>bj <br> <br> <br></p>
