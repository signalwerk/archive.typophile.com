    html: |-
      <p>The Universidad de Buenos Aires also has a new Master's in Type Design (Especialización en Diseño de Tipografía). In Ale Paul's interview with MyFonts, he said it started in 2009, but the information I've received from the University seems to indicate that the program doesn't start until 2011 (tho maybe it was founded this year?). I'm currently living in Buenos Aires, and I'm definitely looking at enrolling in 2011—it seems to have a stellar faculty, as well.</p>
      <p>The info is in Spanish, but: <a class="freelinking external" href="http://www.posgradofadu.com.ar/informacion.php?f=carrera_fundamentos&amp;tipo=2&amp;id=207" rel="nofollow">http://www.posgradofadu.com.ar/informacion.php?f=carrera_fundamentos&amp;tipo=2&amp;id=207</a></p>
      <p>If anyone has anymore information on this program that would be amazing! I know it's brand new, so the info is pretty much limited to what's on the University website (tho that is pretty comprehensive). Also, does anyone know if UBA charges any tuition for grad programs? Or what the selection process for enrollment is? Some info says I need to submit samples of my work, whereas other info says it has totally open enrollment.</p>
