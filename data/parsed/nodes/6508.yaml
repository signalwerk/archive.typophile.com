      <p>Daniel: I see how it might sound like that. The full name is "Seinan horitsu jimusho" or "Seinan Law Office". <br> <br>As for the photography, I agree it's not innovative, but the poured concrete walls, vertical blinds, and wide format, add up to quite a departure from the photos I've seen of Japanese lawyers on other promotional sites.  <br> <br>In case anyone is curious,  <br>"Sei" means blue, "nan" means South, as mentioned above, taken from the name of the area of Tokyo "Minami Aoyama" (literally South Blue Mountain although Aoyama was a person's name).  <br> <br>I'm wondering now if this would look a bit more substantial if I went all the way to "Seinan Law".  <br> <br>For reference, here is the latest iteration, including the Japanese characters that my partner is working on:  <br><img src="http://www.typophile.com/forums/messages/29/48446.gif" alt=""> <br></p>
