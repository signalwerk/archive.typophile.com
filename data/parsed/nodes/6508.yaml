    html: <p>Chris, could you give some background about the law firm. I feel the direction you have taken would work for a walkman product, or a car name. In the United States, firms are usually a family name and are treated very conseratively.  <br> <br>As for what you have created so far, you have to make up your mind on the ends of the characters. The S is soft, so is the e but the i and n is very sharp and crisp and the a is inbetween. Just some thoughts</p>
