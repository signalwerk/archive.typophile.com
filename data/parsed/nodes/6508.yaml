      <p>Thank you both for your comments.  <br> <br>The law firm's name is a inversion of the name of the neighborhood where their office sits. The neighborhood is known for trendy, expensive clothing, cafes and hair salons, as well as some stylish, high-end residential areas.  <br> <br>Their actual building's architecture is also a bit unique, greys and blacks with primary color accents, circle motifs and strong 45 degree angles. Not sure the period but looks 80's to me.  <br> <br>The firm itself is actually more of a loose partnership. Each lawyer has their own professional philosophy and work fairly independently.  <br> <br>The logo is not a project itself, but an accomodation I'm working into a website project, since the firm has no typographic identity to speak of.  <br> <br>The client wants  something that separates them from the ambulance chasers. They don't seem interested in using the site to grow business, but simply to attract respectable clients, and dissuade "problem" clients. They also want something "cool" but approachable.  Tall order huh? <br> <br>The English letters will be grouped with a complementary Japanese face that spells out the full name of the firm.  <br> <br>I'm including an update though it doesn't yet integrate Christos's great suggestions which I plan to give a try.  I also included sample photography for aesthetic reference. The client was quite happy with the photos. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/48178.jpg" alt=""><img src="http://www.typophile.com/forums/messages/29/48179.gif" alt=""></p>
