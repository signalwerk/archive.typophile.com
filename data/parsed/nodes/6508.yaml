    html: <p>Wow, thanks for the thorough comments, they are very helpful! <br> <br>I chose a sans partially because this will be accompanied by Japanese text of the full company name. Those characters are quite complex, so I thought a serif might be too noisey.  <br> <br>Also, as shown above, the photographic style is not your traditional studio headshot, I thought a serif might look poorly matched next to the fairly contemporary photographic style.</p>
