    <p>I'm designing a logotype for a law office here in Tokyo.  <br> <br>I envisioned a sans-serif that is sturdy but approachable, and decided to take a stab at it myself.  <br> <br>I'm not an experienced typeface designer, so there are still a lot of rough edges to work out, but I was wondering if perhaps some of the more experienced on this forum might be able to give me some nitpicky advice.  <br> <br>For reference, I started by making modifications to DIN Neuzeit Grotesk Light, though it's pretty far removed by now. <br> <br>As an alternative, if there are very similar faces in existance that don't cost a fortune, I'm open to the idea of buying something instead, although I'd like to persevere with what I got if at all possible (both as a challenge to myself and to avoid cutting into my budget). <br> <br>Thanks in advance for your guidance.  <br> <br> <img src="http://www.typophile.com/forums/messages/29/48105.gif" alt="Seinan version 1"></p>
