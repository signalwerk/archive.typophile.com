    html: <p>Nice work, clients would find this friendly-their counterparts (perhaps people being sued) would not find it intimidating enough, perhaps adding spikes or dripping blood. You could always sell this later to a heavy metal band if they don't go for it.  <br>But seriously...the "a" bugs me a bit, as it does not perfectly match rest of characters. S is too tall in logo as it will cause problems with regards to userbility. too much negative space around it vs. other characters. Maybe this is just me but compare it to for instance Microsoft's logo. Volume of caps and lc. should not be as extreme as shown here. If you had access to the 3page branding / style guide Microsoft uses it would all make more sense, so forgive me if this sounds too vague an arguement.  <br>I would also suggest top of "i"'s stem is a hair shorter, or as example I quickly created to show suggested mods- make the surrounding characters That contain curves on the horizontal) a hair taller. I should comment that I think you styling is very contemporary and clean. <br>Curious. Why go with sans vs. (more traditional) serif? <br> <img src="http://www.typophile.com/forums/messages/29/48306.jpg" alt="lawfirm logo mods"></p>
    html_clean: <p>Nice work, clients would find this friendly-their counterparts (perhaps people being sued) would not find it intimidating enough, perhaps adding spikes or dripping blood. You could always sell this later to a heavy metal band if they don't go for it.  <br>But seriously...the "a" bugs me a bit, as it does not perfectly match rest of characters. S is too tall in logo as it will cause problems with regards to userbility. too much negative space around it vs. other characters. Maybe this is just me but compare it to for instance Microsoft's logo. Volume of caps and lc. should not be as extreme as shown here. If you had access to the 3page branding / style guide Microsoft uses it would all make more sense, so forgive me if this sounds too vague an arguement.  <br>I would also suggest top of "i"'s stem is a hair shorter, or as example I quickly created to show suggested mods- make the surrounding characters That contain curves on the horizontal) a hair taller. I should comment that I think you styling is very contemporary and clean. <br>Curious. Why go with sans vs. (more traditional) serif? <br> <img src="http://www.typophile.com/forums/messages/29/48306.jpg" alt="lawfirm logo mods"></p>
