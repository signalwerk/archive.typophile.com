      <p>Alright Evie, since you are desperate I will have a stab at trying to help you.</p>
      <p>So you are looking for a thin, san-serif font to use as body text go with your titles that are in Roma? Just to get this straight.</p>
      <p>What is your budget? It helpful to have an exact figure to plan to, however for now I'll ignore it for the most part.</p>
      <p>I have to admit it's a little tricky sifting through all these font families for the perfect weight whilst keeping the "Roman theme":</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/tipo-pepel/trajana-sans/" rel="nofollow">Trajana Sans</a> - If you don't mind only having capital letters, this could be an option because it has a light variant. The san-serif counterpart to <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/trajan/" rel="nofollow">Trajan</a>, a beautiful Roman serif typeface.</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/search/futura/fonts/" rel="nofollow">Futura</a> - A legendary geometric font family based upon old-lettering, despite its futuristic-sounding name it has a wonderful old-fashioned ambiance to it. There is a light variant, but I couldn't find a thin variant so easily. Almost everyone loves Futura, it's well crafted and easy-to-read though I don't think it really belongs on most of McCarren's airport signage.</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/itf-alanmeeks/colosseum/" rel="nofollow">Colosseum</a> - Looks pretty good, definitely got a more old-fashioned jibe to it than the modern san-serif typefaces of this world. Also inspired by Trajan, but with lower case lettering making it a good compromise.</p>
      <p>Here are my suggestions! Tell me how I can improve on them.</p>
      <p>-Inferno986return-</p>
