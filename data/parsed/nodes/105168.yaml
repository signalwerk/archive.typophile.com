    <p>Hi everyone,</p>
    <p>Looking for some good suggestions on what font to use next to Roma (link)<br>
    <a href="http://www.myfonts.com/fonts/canadatype/roma/regular/" title="http://www.myfonts.com/fonts/canadatype/roma/regular/">http://www.myfonts.com/fonts/canadatype/roma/regular/</a></p>
    <p>I'm kinda looking for a sans serif preferably a thin or light version comparable to the Roma inline variant</p>
    <p><a href="http://www.myfonts.com/fonts/canadatype/roma/inline/" title="http://www.myfonts.com/fonts/canadatype/roma/inline/">http://www.myfonts.com/fonts/canadatype/roma/inline/</a></p>
    <p>I'd like to put some headers in a thin at around 24pt, i was thinking about using DTL Noble but the light isn't quite thin enough + its a bit over my budget :-D</p>
    <p>Hope someone can help, thanks!</p>
