  html: |-
    <p>Ian Lyman and Craig Mod have ginned up a <a href="http://craigmod.com/journal/font-face/" rel="nofollow">Webfonts test page</a> that uses genu-wine fonts from Underware. But very special fonts they are: “All of the type on this page was kindly licensed by Underware for specific use in this @font-face demo, as commissioned by the Mozilla foundation. With Underware's approval, we created glyph-limited editions of some of their typefaces for this one-time use only.” One-offs seem to be inimical to the entire concept of Webfonts, but we’re still at the demonstration-project stage, so I’m not all that surprised.</p>
    <p>But! What’s the kicker? Everybody’s favourite curmudgeon Mark Pilgrim, he of “<a href="http://diveintomark.org/archives/2009/04/21/f%75%63%6B-the-foundries" rel="nofollow">Fornicate the foundries</a>” fame, derides the project thus (<a href="http://delicious.com/url/4b026f480c60fad4105f615118c4ebd0?show=notes_only" rel="nofollow">via Delicious</a>): “[Hundreds] of open-source fonts, and they go out of their way to license proprietary alternatives.” Because typography, like information, wants to be free!</p>
