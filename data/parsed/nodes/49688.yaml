    html: |-
      <p>An apostrophe is always oriented the same way as a comma.</p>
      <p>While it did turn out right in this case, you can't always depend on automatic correction (such as in this forum, or in Word) to get these things right, because there's no way for the software to tell whether something is supposed to be a single quote or an apostrophe.</p>
