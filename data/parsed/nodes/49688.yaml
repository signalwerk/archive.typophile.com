    html: |-
      <p>Have to be careful with this question as modern convention could be said to be one way because this is so often seen done incorrectly these days! :-(</p>
      <p>Anyway, quotes are like 6s and 9s right? An apostrophe should <strong>always</strong> be a 9 if the font contains it.</p>
      <p>The “straight apostrophe” is a foot mark.</p>
