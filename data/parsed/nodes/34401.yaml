      <p><em>I see a lot of stretching, embossing, drop shadows various ‘filter effects’ in my neck of the woods...</em></p>
      <p>It's one thing to stretch, i.e., expand or compress type, and another thing to emboss, use a drop shadow, or apply filters...</p>
      <p>The main problem with expanding or compressing type in a page layout program is that it can distort "the proportion of the letters, forcing heavy elements to become thin, and thin elements to become thick." (Ellen Lupton <em>dixit</em>, in <em>Thinking with Type</em>.) This is why it is always better to use an expanded, condensed or compressed version of a typeface, if it is available, because the type designer will redraw the shapes to keep proportions looking the way they should. (I remember one of my design professors grimacing at the idea that phototypesetting allowed you to compress a face like Garamond).</p>
      <p>Adding a drop shadow, on the other hand, does not deform a lettershape, and in some situations a drop shadow can be useful.</p>
