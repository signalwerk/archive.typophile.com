    html: |-
      <p>OK, I've had a lot to catch up on here &amp; have quite a few remarks to make, but I'll try to keep it to the minimum...</p>
      <p>&gt; In this book, for example, the justification engine has been permitted to […] adjust the width of individual characters by [plus or minus] 2%.” That is stretching</p>
      <p>I've always been taught that it's exceptable to adjust your kerning between the parameters of -3/3 to get your font to fit. This is not stretching. Well, actually I haven't been taught since I've only taken a technical course to learn to work with the programs (on a selfstudying basis) &amp; there was never any discussion over design rules. But this is what I've learned from my colleagues &amp; books.</p>
      <p>My answer to a font that doesn't fit some space is indeed like many people here suggested looking for a different font that does fit. There's enough variety in fonts &amp; most commonly used fonts have an extended family of different size, thickness,...</p>
      <p>&gt; Have you ever tried to typeset in Word, it’s not easy</p>
      <p>That's exactly the problem. Too many people choose the wrong programs for their projects. Word is not the proper program for aesthetic executions. Unfortunately, this is a program that is widely used in àll offices &amp; therefor takes the form of the Trojan horse when companies send their own "designs" to a graphic company. The same thing is happening with Photoshop BTW, too many inexperienced people have gotten their hands on it &amp; (ab)using for homemade designs &amp; logo's.</p>
      <p>&gt; I have had lots of clients who have used Word as their page layout program — it’s one reason why they are ex-clients</p>
      <p>Too bad my boss is completely clueless when it comes to anything graphic. She bought her way into the company as a moneylusty opportunist &amp; actually runs the entire office now. After over 10 years in this business however, she still doesn't even know how to change a colour in Illustrator.</p>
      <p>&gt; Hear, hear, Asvetic! We could trade horror stories about that over drinks sometime. :-)</p>
      <p>How about this for a horror story... My ex-boss -who had been in the printing business for over 30 years- actually once stretched a Helvetica Black Condensed to 200%... The horror!<br>
      And that's not all... We used to make a lot of schoolpapers &amp; similar stuff in black &amp; white with one supporting Pantone colour (we standardly used 072 regardless of in what colour it would be printed, but obviously paying attention to that when using percentages (when it would be printed in yellow eg., you can't really use 10% of the supporting colour)) &amp; when he made a new logo for the company (we used to have a full colour one, a B/W one &amp; one in B/W with 072 &amp; used the one needed depending on how it was going to be printed), he accidently converted the 072 to CMYK which led to parts of the logo vanishing in print. It took them over six months to find out (we usually worked for other companies &amp; rarely saw the printed versions). You can imagine the bittersweet hilarity amongst me &amp; my colleagues when we heard this.</p>
      <p>I think that pretty much covers it (for now).</p>
