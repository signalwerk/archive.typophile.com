      <p>Interesting to see the opposing responses.  I have to say though, I'm deffinitley more inclined to lean towards the classic treatment of type.  Not to say I'm incapable of pushing the boat out for a fresh modern solution; it's simply the fear of, if we have full digital control over typographic manipulation, where should we draw the line?<br>
       If a font has to be stretched in order to fit, was it the right choice in the first place?  During my time in college, a visiting lecturer looked over my shoulder as I was stretching type vertically on screen to fit a poster; he's still alive, but I remember most of the blood leaving his face at the time.  He deffinitley knew his stuff, so from that point on, I was more careful in my treatment.<br>
      To Clauses, I don't profess to be a master typographer or anything so it's good to see your point of view</p>
