      <p>Big no-no!!!<br>
      I have seen my share of similar aggrevations over the year &amp; I think the problem is that graphic design is probably the field where most amateurs work. Eg. my ex-boss ussed to do a lot of stretching as well, but I think that lied in his more technical oldschool handset "cut &amp; pasterie" printing background. These people were taken by surprise by the digital era of graphic design &amp; propably thrilled to be able to easily stretch of font to fit some space. The other problem is that too many people out there consider themselves lucky &amp; make their own logo in Word using WordArt... I've actually seen logo's made in Exell, go figure.<br>
      For people who grew up in the digital era it's probably a lot easier to take (dis*)advantage of the technology. For certain projects I was even professionally obliged to use as manyy filters, embosses, shadows &amp; all that crap as possible, because the client wanted it to look "classy". People don't appreciate simplicity anymore. Too much choice leads to more bad decisions. That's the burden of consequence.<br>
      You might want to read this thread: <a href="http://typophile.com/node/32874" title="http://typophile.com/node/32874">http://typophile.com/node/32874</a></p>
      <p>* depending on who's doing what</p>
