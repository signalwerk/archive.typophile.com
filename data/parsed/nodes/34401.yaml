    html: |-
      <p><cite>I think the problem is that graphic design is probably the field where most amateurs work.</cite> - Hear Hear</p>
      <p>Working in a small office, I see type butchered on a regular basis. It's difficult to watch and not say anything, but I don't have control over all the reports/presentations. My services are available, but I'm not always available. So, a lot of the amateurs designers are taking things into their own hands and doing what NEEDS to be done. Their tools are primitive and their knowledge about what's right and wrong is limited. They stretch and smush and cram and drag as needed. It's not because they think that's aesthetically pleasing, it's because that's what they need to do when using the software available. </p>
      <p>Have you ever tried to typeset in Word, it's not easy. You need to have an intimate knowledge of the program, knowing where all the little inputs to manipulate line spacing, letter spacing, tracking, kerning and even tabulation. It's not suited for the novice user and if you don't know what to look for, you're not going to look for it. So manipulating text to "fit" happens quite often here and I suspect in a lot of other arenas as well.</p>
      <p>My beliefs are, as a true breed designer, you should never have to manipulate type beyond it's capabilities. You should know and understand if you do, and it should be a choice not a necessity to break these rules. We have superior tools that give us the ability to make this choice daily and as cliche as this sounds, with great power comes greater responsibility. David Carson didn't do what he did because he had too, he did it because he wanted to and he stood behind his choices. </p>
      <p>In the meantime, if you need to stretch type, hold down that Shift key and stretch away. </p>
      <p><em>sorry for the wall of text</em></p>
