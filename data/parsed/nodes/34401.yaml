      <p>my own experience leads me this way: learn the fundamentals first.</p>
      <p>for instance, i do not allow my first and second semester students to distort type in any way. no stretching, no filters, etc. i make them study the hand drawings of designers such as goudy to really learn to appreciate the care and consideration that went into the formation of the relationships in a typeface. this always causes groans and complaints of "stifling creativity." but i tell them, "tough."</p>
      <p>in the third semester or higher, i open the doors, but i call them on type distortion every time i see it, and make them justify why they chose that direction. more often than not, when they try to explain the reasoning, they come to their own conclusion that the distortion was unnecessary and go back to revise the work.  "if you want your type to be wide like that, why didn't you choose an extended face? in a face <em>designed </em> to be extended, the relationships of stroke, balance, etc. have been thoughtfully considered and factored into the face, whereas you throw all those relationships out the window by taking Impact and stretching in to 158%..."</p>
      <p>in other words, until a designer understands the basics of typography, i don't believe they should mess with the cosmos.  it just can't really be done intelligently without the understanding.</p>
      <p>a good example would be picasso's work: his early drawing a painting was realistic, well proportioned and figurative. it wasn't until he understood the fundamentals of form, proportion, etc. that he was able to <em> intelligently </em> abstract them.</p>
