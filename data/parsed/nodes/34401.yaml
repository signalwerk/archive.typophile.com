    html: "<p>Stretch away, as long as it looks good. Some rules of thumb: 1. Don't stretch too much. 2. On screen type can take a lot more stretching than off (low-rez + hinting makes it work.) 3. Extended types often feel more extended with a little stretch. 4. Some types stretch better than others. 5. 1-2% difference is totally acceptable. Use the InDesign paragraph composer, dial the word spacing way down, turn on the smallest amount of stretch (99-101%) and a little letter spacing (*gasp* variable letter spacing?). 6. Try not to look like you are designing a mortgage company flyer in Word. 7. Figure out how to draw an extended or condensed font to see how it's really done, and find out where stretching starts to break down. 8. Laugh at designers who get high and mighty about some rule that someone told them that they have never explored.</p>"
