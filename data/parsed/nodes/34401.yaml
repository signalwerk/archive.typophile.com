      <p>"Stifling creativity". Ha Ha! So that's what they call typing 180% into the scale window, creativity?  Gee, don't ask those kids to use a pencil or there will be a riot on cell block 8. </p>
      <p>One simple rule you can follow if your eyes aren't a useful guide: Any typeface with a very clear vertical stress will withstand non-proportional scaling better than typefaces with diagonal stress. Garamond, Goudy, Minion, etc. are more delicately drawn, and even their curves look messed up when squished (they go kind of diamond-shaped). The best circumstance is if the design has some contrast, on a vertical axis, and the shapes are sort of squarish or mechanical. Given that, there aren't many typefaces that will withstand the distortion. Type is usually designed with pretty careful spacing between letters as well as within them. If I adapt a typeface to make a condensed version, generally each letter will get a different amount of compression, because of the internal proportions. In addition the space between letters is adjusted. </p>
      <p>The general user of type is unaware of how delicate the balance of a well-made typeface is. It isn't something you can hammer on in Illustrator a bunch until it looks "pretty good". Most professional-grade typefaces are drawn (and spaced and kerned) so carefully that nobody thinks about it. But as anyone who has tried either customizing type, drawing a logo from scratch, or starting their first typeface has discovered, there's a lot more holding type together than it might seem. </p>
      <p>One other way to look at non-proportional scaling: Just because you can, doesn't mean you should. Same with using guns.</p>
