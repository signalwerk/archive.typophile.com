    <p>What are your feelings on stretching type?<br>
    (realising I may be shot for saying it)<br>
    I've always been told by graphic design puritans, that it's a no-no, and tried to follow these rules in my own work.  I see a lot of stretching, embossing, drop shadows various 'filter effects' in my neck of the woods, which makes me cringe, or am I being too harsh?</p>
