      <p>One of the times when I stretch is when I wish to make pseudo small capitals. The pros do it about 5% and sometimes it takes<br>
      10%. The stretching makes the vertical strokes heavier in order to match the regular capital letter that is next to it.<br>
      For example: 24 point caps with a 20 point caps. The weights are obviously different, but when you stretch the 20 point the weights tend to even out.</p>
