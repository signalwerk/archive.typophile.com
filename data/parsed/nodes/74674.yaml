  html: |-
    <p>Every creative professional, including the most seasoned designer, can benefit from learning to communicate more effectively with type. This workshop will give you the expert-level typographic skills and aesthetics necessary to visibly improve your type. Gourmet Typography Training will sharpen your eye and reignite your passion for typography.</p>
    <p><a class="freelinking external" href="http://www.aigaphilly.org/events.html#gourmet" rel="nofollow">http://www.aigaphilly.org/events.html#gourmet</a></p>
    <p>Session One: 9:00am – 12:00pm<br>
    This session teaches the fundamental typographic skills and aesthetics necessary for every designer. Learn to see and understand type and type designs like you've never seen before with a stimulating hands-on exercise, what makes a good typeface, the most common type crimes, and getting the most out of your software (typographically speaking).</p>
    <p>Session Two: 1:00pm – 4:00pm<br>
    This session teaches the advanced typographic skills and aesthetics every designer needs to know. Learn the hidden secrets of OpenType fonts, how to fine-tuning your type, tracking, word spacing tips and tricks, as well as mastering custom kerning. Take control of your type instead of letting it control you!</p>
    <p>About the Speaker<br>
    Ilene Strizver, founder of The Type Studio, is a typographic consultant, designer, writer and educator specializing in all aspect of visual communication, from the æsthetic to the technical. Ilene formerly was the Director of Typeface Development for International Typeface Corporation (ITC) where she developed more than 300 notable text and display typefaces.</p>
    <p>She writes the popular column, fy(t)i For Your Typographic Information for fonts.com, as well as TypeTalk for creativepro.com. Her book, Type Rules! The Designers Guide to Professional Typography, 3rd edition has received numerous accolades from the type and design community. She conducts her widely acclaimed Gourmet Typography Workshops internationally.</p>
    <p>WHEN: Friday, 8 October<br>
    TIME: Session One: 9:00am – 12:00pm (Check in: 8:30am)<br>
    Session Two: 1:00pm – 4:00pm (Check in: 12:30pm)<br>
    WHERE: Moore College of Art and Design, Media Room</p>
    <p><a class="freelinking external" href="http://www.aigaphilly.org/events.html#gourmet" rel="nofollow">http://www.aigaphilly.org/events.html#gourmet</a></p>
