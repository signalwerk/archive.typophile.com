    date: 2002-04-20T15:57:00
    date_raw: 20 Apr 2002 — 3:57pm
    votes: null
    html: <p>You can still do some retty neat things with Flash... originally my pixel font pixelon existed solely within flash - I hard-coded each character and wrote a display algorithm before realizing that I could use a truetype font and it would be much faster. Also, the new drawing api in MX makes 3d rendering much easier, as you can now draw surfaces. As an example, check out <a href="http://www.become.co.uk/3d2.swf" target="_top">http://www.become.co.uk/3d2.swf</a>. <br>This can have applications in simple 3d text extrusion. <br>MX rocks! (at least, in terms of what you can do with it, not in terms of the layout which I personally feel stinks) <br> <br>Matthew</p>
