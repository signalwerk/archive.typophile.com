    <p>Hi everyone, I am new here and I just wanted to say hello.<br>
    I look forward to getting to know my way around the site and I hope i will get to know some of you soon. </p>
    <p>I suppose I will introduce myself.<br>
    My name is Cody, I am 20 years old and I am a design student at Collins College in Tempe. I am not a great typographer or a great designer yet, but I am getting better, so if you have any critique don't hesitate to say it. :)</p>
    <p>Other than that I'm not quite sure what to say, other than that I look forward to getting to getting to know you guys.</p>
