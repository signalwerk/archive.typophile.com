      <p>&gt; the “rules” of unicase</p>
      <p>I actually think of unicase as being pretty free-form*. One of my students is working on a unicase font** and she's using either the UC or lc form (or a hybrid) depending on what works better for her particular design (a uniheight stencil face) not any inherited "external" rules.</p>
      <p>* And I suspect Nick agrees.</p>
      <p>** A strategy I actually encouraged her to consider, although not because it's "hip", but because it made structural sense.</p>
      <p>hhp</p>
