      <p><em>* And I suspect Nick agrees.</em></p>
      <p>Yes. When I was teaching the "design a unicase" course, my students came up with all kinds of sick stuff. And once you throw ascenders and descenders into the mix... disturbance.</p>
      <p>However, Brad Thompson was on to something with his particular bi-form configuration, which has become somewhat of a convention. </p>
      <p>Bayer's 1925 Universal Alphabet is kind of opposite, in that it substitutes a few Uppercase forms into the lower case, and he probably thought it was supremely logical, but it was never made into a font, and never caught on, whereas BT's idea rapidly spawned many biform fonts in 1950s typositor land.</p>
