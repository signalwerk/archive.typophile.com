    <p>Anyone know any good serif typefaces designed according to Bradbury's Alphabet 26 theory? (upper/lower sharing the same form)</p>
    <p>I know certain unicase faces have similar characteristics (like Cholla), but I'm looking for other examples.</p>
    <p>Here is a link to the Alphabet 26 project:</p>
    <p><a href="http://www.pbtweb.com/alpha26/index.html" title="http://www.pbtweb.com/alpha26/index.html">http://www.pbtweb.com/alpha26/index.html</a></p>
    <p>Justin</p>
