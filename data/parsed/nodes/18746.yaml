      <p>Right Hrant, it's a specialty niche.</p>
      <p>But the alphabet continues to evolve.<br>
      For instance, the "tailed" lower-case l from Meta has found its way into a lot of sans fonts, as has the serifed upper case I of Bell Centennial, to the extent that they don't look mannered any more.<br>
      The single story g, originally an italic concept, spread to the sans serif roman, after Akzidenz Grotesk.<br>
      The alphabetic evolution of the original Petrine Cyrillic capital D went from a triangle to (almost) a square.</p>
