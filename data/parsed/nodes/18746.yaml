      <p>I thought what Thompson did was find a typeface where the small caps had the same height as the lower case x-height, and similar weight, which just happened to be Baskerville. So anyone can do what he did, Claes.</p>
      <p>I took the idea a step further with <a href="http://www.myfonts.com/search?search%5Btext%5D=panoptica" rel="nofollow">Panoptica,</a> making it monowidth as well as unicase. Why? for concrete poetry.</p>
