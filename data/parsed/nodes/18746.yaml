      <p>In 1950, this was an interesting idea. Now though, I feel loathed to entertain the concept as a genuine attempt at improving letter recognition and consequently the ease of reading. It seems less rationalising the process of reading, than the superficial shapes of characters, and nowadays we know better, and appreciate the functional value of varied character shapes / impact of desc/ascenders etc. Not to forget of course, how the sudden upheavel of old and familiar methods can cause more damage than it's worth.</p>
      <p>The only value I see in this is the public's intrigue for it as display. Not to say that can't be an admirable thing itself however, but as for it improving our language system, do me a favour.</p>
    html_clean: |-
