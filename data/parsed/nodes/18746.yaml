      <p>&gt; Bayer’s 1925 Universal Alphabet is kind of opposite</p>
      <p>In a way, but a better opposant to Bayer was Cassandre: he -somewhat rightly- thought that the lc had a mottled heritage, and decided to "trickle down" the UC to the lc. And Cassandre enjoyed a pragmatism (check out the "d" in Peigot) that the gridnicks didn't.</p>
      <p>&gt; it was never made into a font</p>
      <p>Hasn't The Foundry done it?<br>
      As have some starry-eyed neophyte reductionists, I'm sure.</p>
      <p>hhp</p>
