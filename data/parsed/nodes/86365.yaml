      <p><cite>How do the big players - Linotype, Monotype - do it ?</cite></p>
      <p>They don’t. They sell the fonts to western designers who have to apply existing brand standards to Russian campaigns and products. The demand for popular classics like Helvetica is so high that firms in New York and London will buy enough Helvetica Cyrillic to make up the development cost.</p>
