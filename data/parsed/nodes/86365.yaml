      <p>I agree that IP law is irrelevant in some countries. In other countries, it's lopsided. And it's definitely inconsistent. </p>
      <p>That said, it's still a legal concept in terms of protection. So any protection is going to have to involve legalities be it pre-job (carefully written contracts/payments up front, etc...as suggested) or post-job (suing, which is probably not a viable option from a cost/benefit POV).</p>
