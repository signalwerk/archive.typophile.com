    html: |-
      <p>I only see the situation improving once an affordable alternative to font piracy becomes available to people in the poorer parts of the world. </p>
      <p>Sadly, I don't really see that happening any time soon, since most of the free/open source font development going on at the moment is either being done by Western hobbyists (who don't have the knowledge or interest to create fonts that target non-Latin alphabets) or being bankrolled by Google (who mainly want an easy-to-use library of fonts available for use on expensive tablets and smartphones and thus are also uninterested in fonts for the languages of poor countries)</p>
      <p>Also, I suspect that part of the problem is that the big players like the Mono-borg and Adobe "look the other way" when it comes to the piracy of their products in poor countries because they'd rather that people get hooked on their products while poor than that they start to develop local alternatives...</p>
