    <p>Hello,<br>
    I'm currently working on some fonts for the Russian and East-European markets, who are notorious for their copyright infringement &amp; piracy practices. I wonder how I could build some kind of license protection in the font beyond the licence information, which can be easily edited. It should protect the font from working on more than one computer.</p>
