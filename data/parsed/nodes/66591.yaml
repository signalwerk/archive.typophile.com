    html: |-
      <p>Stefan</p>
      <p>I'm 55, so you are a youngster to me. A blog (from web log) is for quick and dirty commenting on ... well, on anything. Many of them are quite boring, but some draw readerships in the thousands. John Nack of Adobe is one I often visit. (Also I seldom missed Thom Phinney when he was there). </p>
      <p>A web page is a bit more work to get something posted. A blog takes the technical work out of it, and you only have to worry about content.</p>
      <p>Mostly, you gain attention to your blog through providing good content, getting some buzz, and hopefully some people posting links to it.</p>
      <p>Don</p>
