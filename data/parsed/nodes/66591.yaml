    html: |-
      <p>OK, then, Christian, explain to me why it’s desirable for a <em>discussion forum</em> with an ill-defined ownership structure to host <em>technically limited</em> blogs that are hidden deep down in a directory structure.</p>
      <p>Indeed anyone can set up a blog. And anyone who wants a blog should do that – somewhere that blogs are meant to be set up, like your own server or an existing hosting service. Then at least the rest of the Web will know they’re there and can subscribe via RSS, and ownership won’t be at issue. (At the very least, you can wade through the endless terms of use of hosting sites, or just host your own. Where are the terms of use for blog hosting at Typophile? Found those yet, Christian?)</p>
