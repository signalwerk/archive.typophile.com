    html: |-
      <p>While it is true that anyone can go to blogger and publish a blog, Typophile offers the opportunity to infrequently post bloggish content without the regular posting that an official blog requires to have any readership at all.</p>
      <p>If you want to create type blog with many posts per week, you may want to establish your own site. If you just want to talk about the type related things you are working on / thinking about without the intent of starting a discussion thread, Typophile blogs might just be your thing.</p>
      <p>Lastly, if you don't like the blogs here, don't read them. You certainly don't have to read them to participate in the forums.</p>
