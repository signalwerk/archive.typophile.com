    html: |-
      <p>From <em>The Unicode Standard</em>, Section 16.2 on Layout Controls:</p>
      <blockquote><p>In addition to its primary meaning of <em>byte order mark</em> (…), the code point U+FEFF possesses the semantics of ZERO WIDTH NO-BREAK SPACE, which matches that of <em>word joiner</em>. Until Unicode 3.2, U+FEFF was the only code point with word joining semantics, but because it is more commonly used as <em>byte order mark</em>, the use of U+2060 WORD JOINER to indicate word joining is strongly preferred for any new text.</p></blockquote>
      <p>Few sentences earlier the author stresses not to confuse the <em>word joiner</em> with <em>zero width joiner</em>. Any chances that this very type of confusion lays at the root of FontLab’s messed up mapping?</p>
