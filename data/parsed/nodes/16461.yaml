    html: |-
      <p>For the Paduma Burmese font, Microsoft spec'd</p>
      <p>U+200C ; zero-width non-joiner<br>
      U+200D ; zero-width joiner<br>
      U+034F ; combining grapheme joiner (zero-width, no visible glyph)<br>
      U+2060 ; word joiner (so ignore my comment above about not being asked to include it in any fonts; I'd forgotten including it in Paduma)</p>
      <p>That should cover Thai too.</p>
      <p>Don't forget that any font with combining mark support should contain the U+25CC dotted circle, which is used as a generic mark base (and hence should have GPOS mark-to-base positioning defined).</p>
