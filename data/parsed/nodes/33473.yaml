    html: |-
      <p>"Dated" is probably just the handiest term they could think of - even if it's not totally accurate there's something to it: Bodoni looks like some regal gandfather, aloof and old. In fact it's almost dead. As G W Ovink put it: "Bodoni is an admirable letter for a death notice!"</p>
      <p>Didot will have the same problem.</p>
      <p>Souvenir is just retarded looking.</p>
      <p>I might recommend Mrs Eaves, as long as you won't be using it for anything over a line here and there, since it needs manual [re]spacing to look decent. Or you could try a Baskerville. Or maybe The Foundry's Wilson.</p>
      <p>hhp</p>
