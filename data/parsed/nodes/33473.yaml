    <p>Hi,</p>
    <p>I have been working on the branding of a company, but they do not like my choice of body font Bodoni in italics</p>
    <p>The font will be rolled out on everything from stationary to the campaign adverts.. I have cused Bodoni Italic Bold/medium/light as this font, treated as so, but they dont like this, they feel it is dated (what the??)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Typofile_5381.jpg"></div><p></p>
    <p>Anyway it has to work with certain quotes used througout the work eg:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/quote_5491.jpg"></div><p></p>
    <p>If anyone has any suggestions, i am after a similar serif font, elegant with some really nice curves, but quite soft in its nature. </p>
    <p>fonts i like, but am not sold on certain charaters,</p>
    <p>  Didot, im loving this but im sure its way to elegant for them..</p>
    <p>  Ziggurat italics, dont like the "Y" as this is a crucial character in the brand name., but i think this font has the softness i like..</p>
    <p>  Souvenir italics, this has the softness, but lacks the class as in bodoni and didot.</p>
    <p>AS you can see im just really after any suggestions, that you guys have of similar fonts, obscure, personal favorites anything at this stage will help me..</p>
    <p>thanks.</p>
