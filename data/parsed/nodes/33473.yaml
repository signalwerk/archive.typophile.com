      <p>Bodoni and Didot fonts were incredibly popular for business use in the mid 1980s to early 1990s. Unless you’re doing fashion work, where a Didot or Bodoni can still work, a Bodoni identity is going to look very, very dated.</p>
      <p>Your other choices-Ziggurat and Souvenir—also speak much more to the past than to the present. What sort of company is this that you feel it needs to have an identity with a period look?</p>
