    html: <p>hey thanks, andrew. i was startin to think i was just gonna be overlooked. <br>Shoeboxtoo - it's a second location and rather than be ShoeBox 2, they opted for Too. I don't know why they need the too in the name at all, but that's their thing. <br>thnx again for yer help. anyone else have suggestions?</p>
