    html: <p>Shoeboxtoo i see. What is the too for?  <br> <br>The S, O, and B you should weight thicker.  <br> <br>Fix the counters on the B.  <br> <br>Shoe has a lot of white space. I'd open up Boxtoo <br>which is pretty tight. <br> <br>Tracing over the logo always helps me to get rid of inconsistencies. <br> <br>I'd put a "polished" shoebox in my 'folio. <br>Good stuff.  <br> <br>Andrew</p>
