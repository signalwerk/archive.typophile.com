    html: <p>hey thnx brian, 'preciate yer help <br> <br><i>Is the curl above the face meant to resemble hair?</i> <br>yeah it is. i guess i don't have it quite right if it's not obvious. <br> <br>i think the bullet and the lining up were input from my client, but i can do whatever i want for my own purposes. <br> <br><i> Something I think strong logos have is an overall sense of moving to the right</i> <br> <br>hmmm, i'm not sure how i could fix that for Tessa </p>
