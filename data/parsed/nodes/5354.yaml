    <p>okay, so i'm trying to put together a portfolio and i've only tried my hand at a couple of logos. The first, Tessa B's, i rather like, but i think it needs a bit more polish. The second, ShoeBox, is really rough. I pretty much swiped the design idea from the Beatles. Is it even worth salvaging? showcasing? anyhow, i thought i'd just see if i got any response here. thnx for any help you can give me. <br></p>
