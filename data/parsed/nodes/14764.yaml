  html: |-
    <p>Well, I am looking for three images. Preferably of high quality and resolution. I need an image for the letter O, V, and a different type of O. <em>(This will be hard to guess what I am using this one for ;)</em></p>
    <p>I know a lot of you snap up digital images of this type of thing. Would anyone be willing to share? <em>(I will disclose usage with you privately)</em></p>
