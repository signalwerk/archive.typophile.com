    html: <p>Here’s a little NY bookstore tour.  Start at the new Taschen bookstore on Greene just south of Prince. Then walk 3.5 blocks to the MoMA store on Spring and Crosby St. Then just up Crosby St. is a famous used bookstore, I forget what it’s called, but it’s within 2 blocks. The Strand is within a 15-min walk up Broadway, at 12th St. The Strand is the best one. Design is one level up from the entrance.</p>
