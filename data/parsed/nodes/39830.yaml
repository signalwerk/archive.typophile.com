      <p>Its really a shame that Untitled closed down. But some of the general book shops in the city do have decent selections devoted to the area of design and typography.</p>
      <p>The Strand<br>
      MoMA (either Soho or uptown)<br>
      Zakka<br>
      Giant Robot<br>
      Cooper-Hewitt<br>
      New Museum (haven’t been yet)<br>
      Kinokuniya (everything is 50% off at the original location, new store just opened across Bryant Park)<br>
      St. Mark’s Bookshop<br>
      Rand McNally<br>
      Skyline bookstore (great for used type specimen books and annuals)</p>
      <p>Hope you have a wonderful time in New York! If you can you should see if its possible to set up a meeting at the TDC (don’t think any books for sale, but their collection is incredible)</p>
