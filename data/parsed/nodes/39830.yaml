    <p>Hi everybody,</p>
    <p>Sorry for the short notice here, but...</p>
    <p>Tomorrow I’m going on a two-day trip to New York City with a couple of friends, and I plan to hit some of the new and used bookstores down there.</p>
    <p>I was wondering if there are any decent typography/graphic design bookstores left in NYC that would be worth my while to visit?  I had hoped to go to Untitled, but I see by searching the forums here that they closed about two years ago.</p>
    <p>Any recommendations would be greatly appreciated.</p>
    <p>Thanks in advance for your time,<br>
    John the Fontaholic</p>
