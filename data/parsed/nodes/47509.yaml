      <p>Lineto’s fonts (Gravur, Typ 1451 and so on) are what they are: minimalist, industrial style fonts. That’s OK. I certainly don’t blame Lineto for anything. Their fonts seem to be designed by designers for their own work, because nothing available fits the bill. I respect that a lot. It’s creating your own style.</p>
      <p>There just have been so many ID-requests that turned out to be Lineto fonts lately.<br>
      ”Wanna be cool? - Look over at Lineto!“ seems to have become automatic. That’s my point. Being trendy is just copying styles. We all do that, of course. But we should be aware of it.</p>
      <p>Peace.</p>
