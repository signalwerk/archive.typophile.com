      <p>Before we close off this discussion, I'd just like to say that I don't particularly like people second-guessing me. So to make everything clear and avoid any more misunderstandings:</p>
      <p>I <em>was</em> serious about avoiding Helvetica and ITC Avant Garde Gothic. This is a personal statement, and I am <em>not</em> telling anyone else what to do or not do. Usually it's designers suffering from tunnel vision like Massimo Vignelli and his followers that go about trying to convince everyone to do it their way (re: his (in)famous five typefaces credo).</p>
      <p>So on a personal level, all I can say is that I will <em>never</em> use Helvetica or ITC Avant Garde Gothic <em>unless I have a very very good reason to do so.</em> That is because, yes, I <em>am</em> a Typophile, Naoise. I think I know enough about type to not be starstruck by the perennial "classic" fonts and make well-informed choices about which typefaces to choose for specific jobs. When you say they are "undeniably brilliant typefaces" and "the alternatives rarely live up to the original", that is your <em>personal</em> opinion, <em>not</em> a scientific fact. I personally find that Helvetica often falls short due to the problems in its design and structure, which is why since its rise in popularity many talented type designers have designed alternatives which deal with these shortcomings.</p>
      <p>Never <em>ever</em> again assume that I am "a so-called Typophile" just because I have a different opinion than yours. Please let's not resort to that kind of fundamentalism and respect each other's choices in an open dialogue.</p>
      <p>Peace.</p>
