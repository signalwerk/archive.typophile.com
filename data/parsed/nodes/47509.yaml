      <p>I understand both Naoise's and Bald's point and I can appreciate that Bald my not be that serious about avoiding Helvetica, while he probably is about Avant Garde. </p>
      <p>I think Avant Garde is sometimes overused by people with an untrained eye but every once in a while I think people really can do great stuff with it. I think one of the best examples of how <em>and</em> how not to use Avant Garde is Grafik. I personally love the Grafik logo, but using Avant Garde as your body text is just painful, I really feel it takes away from the magazine.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/avant_garde_logo_5185.jpg"></div><p></p>
      <p>As for Helvetica, I rarely like to bad mouth one of my favourite typefaces, Although you wouldn't find it in much of my work. This is probably due to the stigma that surrounds the typeface. As for a use of one particular typeface It's more important to examine the design and see if there was an appropriate choice made in regards to the content.</p>
      <p>Like all other design disciplines in the end the choice of a design element can often come down to a fashion trend. Which may in this case be Helvetica, Avant Garde or a lineto typeface. But soon enough what was once fashionable to the highend designers will overtime make its way down to the lay person designing a flyer to a small gig! </p>
      <p>There are many designers using both Helvetica and Avant Garde and I personally feel using them well. <a class="freelinking external" href="http://www.wearebuild.com" rel="nofollow">Build</a>,<a class="freelinking external" href="http://www.effektivedesign.co.uk" rel="nofollow">Effektive</a>,<a class="freelinking external" href="http://www.madethought.com" rel="nofollow">Madethought</a>,<a class="freelinking external" href="http://www.un.titled.co.uk" rel="nofollow">Un.titled</a> for example.</p>
      <p>These designers don't have to resort to alternatives to produce stunning original work.</p>
      <p>p.s may we start a new thread?</p>
    html_clean: |-
      <p>I understand both Naoise's and Bald's point and I can appreciate that Bald my not be that serious about avoiding Helvetica, while he probably is about Avant Garde. </p>
      <p>I think Avant Garde is sometimes overused by people with an untrained eye but every once in a while I think people really can do great stuff with it. I think one of the best examples of how <em>and</em> how not to use Avant Garde is Grafik. I personally love the Grafik logo, but using Avant Garde as your body text is just painful, I really feel it takes away from the magazine.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/avant_garde_logo_5185.jpg"></div><p></p>
      <p>As for Helvetica, I rarely like to bad mouth one of my favourite typefaces, Although you wouldn't find it in much of my work. This is probably due to the stigma that surrounds the typeface. As for a use of one particular typeface It's more important to examine the design and see if there was an appropriate choice made in regards to the content.</p>
