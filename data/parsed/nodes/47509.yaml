      <p>&gt; <em>On this basis should we hate Helvetica or Avant Garde?</em></p>
      <p>Not hate them, but <em>definitely</em> avoid them. Like, <em>really.</em> :^P</p>
      <p>&gt; <em>As for your comment “ArtsyFartsyFancy”. What may I ask you is even remotely Artsy, Fartsy or Fancy about Lineto typefaces?</em></p>
      <p>Not the typefaces themselves, but the context they are used in. We witness successive fashion waves here on the Type ID Board, and this is one of them. Lineto designs are usually very forward-thinking, but the context they are used in is <em>so</em> very safe and boring these days, which effectively diminishes their worth in my opinion. It's the 'white tiger' syndrome -- instead of being creative and trying to break the mould, many designers think that using the cool typeface all the other cool designers use is sufficient to make their work interesting. Not.</p>
