    html: |-
      <p>Like most things in a relativistic universe: it all depends. One man’s Medium is another man’s Book, and one or the other might be more suitable depending on the size used on the webpage. However, because of all the variables involved, I doubt that you can come up with a hard, fast rule that says “Always used Regular for sizes 14px and below, and always used Book for sizes 15px and above.”</p>
      <p>Unfortunately, one size does not fit all, nor is your calling plan really unlimited. Welcome to Twenty-first Century America.</p>
