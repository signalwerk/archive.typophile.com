    html: |-
      <p>A Book in a publication that’s is printed on bad stock by an indifferent printer may turn out looking like a Regular. A Regular printed on expensive glossy paper by a printer who does not know his job may look like a Book.</p>
      <p>It depends, in other words, on circumstances. Study those, or work with printers who are knowledgable…</p>
