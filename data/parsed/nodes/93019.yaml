  html: '<p>On average, which weight of a typeface would be more suitable for text in a webpage or document intended for screen viewing: "Regular", or "Book"?</p>'
  html_clean: '<p>On average, which weight of a typeface would be more suitable for text in a webpage or document intended for screen viewing: "Regular", or "Book"?</p>'
