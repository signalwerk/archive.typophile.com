  html: |-
    <p>Say you have a need to make a sans-serif font to go along with a serif font that's already designed. How would you go about it?<br>
    Simply lopping off the serifs sounds like it would be the easy thing to do, but so often the easy thing winds up being the wrong thing.</p>
