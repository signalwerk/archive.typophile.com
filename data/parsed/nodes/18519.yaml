      <p>You could also go to East Asia. In the 1950s, the People's Republic of China reformed written Chinese, creating what they call Simplified Chinese (the characters have less strokes). Taiwan still uses Traditional Chinese characters.</p>
      <p>Japan reformed Japanese somewhat, after WWII. I think that now when Japanese is written horizontally, the text runs from left to right, like Latin (allowing for Romaji—the Roman alphabet—to mix in better?). Vertically, Japanese columns are still ordered from right to left.</p>
      <p>A Korean emperor developed the Korean writing system independently, I think around 1400. I don't think that this was officially adopted throughout Korea until after 1945 though. The Koreans were also printing with movable metal type before Gutenberg. There is a lot about type to be learned there, I bet.</p>
