      <p>The history of blackletter <em>type</em> has always been political… from almost the very beginning. Gutenberg may have been involved with some Catholic reformists, who were interested in having definitive versions of scripture to help quell dissent and variety of interpretation. Gutenberg's texturas and Mainz texturas in general would become associated with Catholic printing in Germany during the Renaissance, while Fraktur would become associated with the Lutherans.</p>
      <p>But before Fraktur became associated by the Lutherans, it was commissioned by the German Emperor in Nuremberg, who may have desired forms like those from his mother's Burgundian family in Belgium.</p>
      <p>During and after the French Revolution, which divided Germany and caused all sorts of political change there (as I'm sure you know), the Serif vs. Fraktur debate arose, probably for the first time. And the Fraktu- backers were German nationalists; German nationalists were later able to force a political and cultural break with Austria (1848–1870), and then seized power and created the Second Empire. Yet the Second Empire was not really so big on Fraktur as one might think… the Reichstag debated ditching it almost altogether on more than one occasion.</p>
      <p>That takes me to the 20th Century… which has even more to write about! Too much for one post here.</p>
      <p>I'd bring them to the Frankfurt area (but I'm very biased). This was always a big center of German printing and type. First Gutenberg, then a myriad of foundries, almost all which disappeared or moved during by the late 20th century. Linotype is here now, too. There are several schools in the area, all of which are excellent for type, and two great museums, the Gutenberg Museum and the Klingspor Museum.</p>
      <p>If I were you, I'd take them to London first. There is great type stuff there (and maybe you could visit the University of Reading, too… that might have the best collection in the world… certainly the most accessible). Then come here. I'd be happy to lend you any hand I could. There are lots of other type types in the area as well, Germans and internationals…</p>
