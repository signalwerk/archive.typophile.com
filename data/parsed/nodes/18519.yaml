      <p>Typography was actually a <em>very</em> small part of the Bauhaus movement. Most typefaces associated with the Bauhaus actually had nothing to do with it, i.e., Futura (Paul Renner taught at a <em>competitor</em> design school to the Bauhaus, in Munich). Even Jan Tschichold who respected the Bauhaus' work and may have even applied for a position there cannot be lumped in the same boat (he taught at Renner's school in Munich for a while, for instance… just a reminder that Germany did not have a single typographic center, then or now ;-)  )</p>
      <p>The Schools in Stuttgart and Offenbach had much more vibrant and exciting typographic experiments and type/calligraphy instructors than the Bauhaus did, but they were a bit more "conservative." In any event, they didn't call for a complete break with the past, although I'm sure they saw themselves just as superior to it. </p>
      <p>(They were also politically much better off in the 1930s, but that is no reason to condemn them outright. It is so easy to get black&amp;white with 1930s Germany. Not everything fits so easily into either the good or bad camp, though… that's exactly what makes it so disconcerting. One must ask oneself, "where would I have fit in. what risks, exactly, would I have taken?" History is always 20/20, but those who really go about a relationship with the past should not put themselves above it, and should consider the gravity of what people went through. Certainly, those who collaborated deserve our disrespect, but like all walks of life, there were shades of grey in the German design community. Where does one draw the line?)</p>
      <p>Maybe instead of "From X to Y" you could call it something like "There and back again." I don't believe that the history of type design is linear, sorry :(</p>
