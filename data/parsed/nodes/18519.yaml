      <p>Thanks for the clarification, Dan. For what it's worth, I was just suggesting something catchy-sounding. I wasn't making any claims about historiography, so much as just trying to identify a particular area of interest.</p>
      <p>The official Bauhaus "school" may not have done as much typography as other things, but certainly the general anti-bourgeoius, strip-it-back-to-the-elements approach covered a large constellation of artistic activities, including those of that group. I don't think you can make such a broad claim against the link just because the link is subtle. Consider <a href="http://www.bauhaus.de/english/bauhaus1919/werkstaetten/werkstaetten_typographie.htm" rel="nofollow">this online archive</a>. Type is certainly not irrelevant there.</p>
      <p>EDIT: In fact, the more I revisit the issue, the more it looks like typography was VERY important in the Bauhaus. Indeed, the very idea of a "rational system" to define an alphabet, based on the "bare essentials" necessary, strikes me as very much a part of the whole early 20th-c modernist/anti-bourgeois/anti-victorian project, and was very much woven through the whole Bauhaus movement.</p>
