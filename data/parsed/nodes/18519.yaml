      <p>As for "Contrast the Roman absolutism with the Ancient Greek pragmatism.," that's an oversimplification if I ever saw one. Where'd that come from? Certainly not any cultural history I've ever seen, or perhaps not anything published after the mid-20th c, when such broad-brush categorization of our "heritage" cultures finally started to show their age. </p>
      <p>Depends what you read I guess. Within the realm of culture, I'd mix it up-- both had absolutist strains and both had pragmatic strains. Caesar was nothing if not pragmatic (Machiavellian, opportunistic, etc.) yet also sought to be dictator (absolutism?). </p>
