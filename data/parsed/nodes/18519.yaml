      <p>Hmm . . . the idea of E Asia is enticing, but I have no languages from that area of the world, no contacts, and little of my own understanding of the history and political culture of places like China, Korea, Japan. The story of Korean script, or the politics (and history, etc.) behind the several systems the Japanese use to write, to mention two, are fascinating, but I don't know what I'd bring to that mix: I'd be relying on experts there both for the typo(etc.)graphy and the politics and history.</p>
