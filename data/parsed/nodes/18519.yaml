      <p>You could call your B&amp;B "Fraktur and Frutiger," too, I suppose. And offer a special "Frutiger Fruit Plate." With Fraktured Fruit Forks.</p>
      <p>I think we need to make a distinction between pre-moveable type and post-moveable type, at least in the West. The "Ancient Romans" certainly were not modern in anything but relative terms. At that rate, you might say that any number of ancient cultures were "modern" in that their inscriptions were "sans serif." Right?</p>
      <p>What strikes me about sans-serif type of any kind, and especially the most simple, minimalist kind such as the hyper-"rationale" systems of early Modernism (ca. 1910-1930), is that in the world of moveable type ca. 1500 c.e., all these goldsmiths and jewelers didn't go, "Wait a SECOND. WHY are we imitating hand-drawn script and torturing ourselves so much here? I mean, if we stripped things down to the basics here, we could make most letters with a single punch and a couple minutes of cutting. Why are we making our lives so difficult?"</p>
      <p>To me, that's a clear example of how historical and cultural context affects the thinking of people down to the very basic elements of what is considered possible. I would say that any clean-lined, minimalist type looks "modern" precisely because it took over 400 years for people to figure out that they DIDN'T have to imitate monastery script, nor Roman monument carvings.</p>
      <p>Plus, there's a chicken-n-egg question here. Which came first, the minimalist "inclination" or the new artifacts that seemed to embody such an inclination? Hard to say-- and I'm not sure we need to answer it.</p>
      <p>- J</p>
