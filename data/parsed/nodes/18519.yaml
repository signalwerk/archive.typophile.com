      <p>Lettering Tours of Europe have been done by <a href="http://www.letterspace.com/LETTERING_TOURS/index.htm" rel="nofollow">these folks</a>. It seems that they no longer do this, but they can probably give you great advice. </p>
      <p>I think it is accurate to say that the great political, religious and social events influenced type, but not the other way around. Other than the invention of printing itself, which was a major social force, I think type design is more of an indicator than a cause. </p>
      <p>Chapter IV of Harry Carter's 'A View of Early Typography,' though pedantic in style, gives a facinating account of the spread of roman type vs blackletter. Catholicism, the King of France, Calvinism and Lutheranism all play roles in it.</p>
      <p>Other notable changes are the dropping of the long s after the French revolution (I don't know the full story) and the saga of the Nazi promotion and then abandonment of blackletter, which is well documented.</p>
