      <p>I hear you, Dan. And you're a lucky man to have been to those places. Closest I've been is an exhibit on Dutch architecture in Amsterdam.</p>
      <p>Anyway, I think the only real difference here probably is one of historiography, sorta. On the one hand, we can focus on the specifics of who did what, and when and where. Obviously that's the bedrock of any decent historical perspective. Although, I'm more inclined first to notice formal and conceptual parallels and similarities, which clearly can be reconstructed with varying degrees of caveats about who did what, and where and when. I'm not saying I like to fool around with lies and half-truths; rather, I'm just trying to make sense of what can be re-interpreted through our current lenses in ways that are useful without being totally groundless or fallacious.</p>
      <p>It's like a question of whether a particular sans-serif face is "Bauhaus" or not. Well, from one perspective, if it wasn't designed by Walter Gropius or others who actually sat and walked and talked and smoked in hallways and parlors together, then I guess the answer is a flat and categorical, "No." But if you edge over a little into the formalist/conceptual realm, and you're looking for evidence of a particular "aesthetic" (I know, some probably won't like that term), you certainly would be able to see it. </p>
      <p>In any event, I don't want to belabor this Bauhaus stuff. It keeps making me think of that awful band that I once thought was the best EVER. Better even than the Doors!</p>
      <p>- Jay</p>
