      <p><em>a detour to Israel during such a blackletter tour would<br>
      be da bomb.</em></p>
      <p>Well, as Hrant knows, I think that the history of blackletetr in politics is much too big to only be viewed through the WWII prism, but he is certainly right in that people associate blackletter with enemies of Israel. In fact, in Germany, blackletter is associated right now with heavy metal (which is, sadly, almost an exclusively radical right-wing phenomenon here) more than anything else. I personally believe that the way to get past this was to point out how well blackletter was used <strong>before</strong> the N.S. period, and try to recapture its experimental nature that way.</p>
      <p>Although I run into trouble here, too… as I mentioned above, some of blackletter's biggest fans from 1792–1932 were stark Nationalists… even though there is a difference between German Nationalists and German National Socialists (Nazis), many see this difference as purely academic :(</p>
      <p>Come to think of it (although you are right to assume it would never happen) going to Isreal would be a great way to take about the politics of script… certainly from the "Modern Hebrew" angle, if not anything else.</p>
