    html: "<p>You might focus on type that was designed in a self-consciously \"political\" way. Sure, every human artifact can be seen in a political light. But I'm thinking that, if you need to focus and find a practical destination for a study-abroad program, Germany and the Netherlands are probably the places to go. Call it \"From Blackletter to Bauhaus: Political Typography in Europe.\" Or something like that. Bauhaus design was the first example I really \"got\" as an explicitly political move in type-- strip it back to zero, strip out all the remnants of bourgeois life, the huge cultural disaster that led us to WW I, etc. Typography is only a part of that, I know, but it really stuck.</p>"
