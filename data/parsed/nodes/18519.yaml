      <p>Well, typography may have been important there (although I just don't believe that…), but if it was important, it was still much less important than anything else. The Bauhaus was founded by an architect. It had three directors, all architects. How much typography do you find in its general curriculum? Very little. Most contemporary schools today place more time and value on it than the Bauhaus did.</p>
      <p>I don't mean to discount the awesomeness of the type and lettering work that was done there. It is inspirational and will probably remain so forever. But the focus of the Bauhaus was on total art, and architecture (which the guys in charge thought was total art anyway). And architecture was the supreme discipline to which one could aspire. You see, I disagree on that last point there ;-)</p>
