      <p>This is a topic I am also very interested in, so I hope this thread develops. Here's my bibliographic contribution:</p>
      <p>Robin Kinross, "Unjustified Text and the Zero Hour," in <em>Unjustified Texts: Perspectives on Typography</em> (London: Hyphen Press, 2002), 286-301.</p>
      <p>By his own admission this essay is more of a sketch than a complete argument, but it may provide good food for thought about the relationship between the political climate and typographic elements (in this case the unjustified text emerging in the post WW2 world). </p>
      <p>The other thing I thought of was the discussions provoked by Shaw and Bain's <em>Blackletter</em> exhibition and catalogue, which it sounds like you already are planning to address. </p>
      <p>Good luck with your planning!</p>
