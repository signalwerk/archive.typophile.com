      <p>Joost Schmidt's work at the Bauhaus was great, I'm not denying that. And Bayer's Universal Alphabet continues to inspire (just look at FontShop's newest free font for the Soccer World Cup this summer…). But these were rather isolated experiments. Of coursed the Bauhaus used type in its design and advertising… typography is an essential part of graphic design. But they were more concerned with other things. Look at any Bauhaus book (especially the hundreds of retrospectives available in German…) and you'll find more teapots than posters or alphabets. The Bauhaus Archiv's website has a typography section, and I've been to both its physical museum and the current museum and school in the historic buildings in Dessau. Great stuff. But typography was a minor league pastime there.</p>
      <p>In foreign countries, the Bauhaus has a different vision from what it really might have been. Coming from the US to Germany, I expected it to be something else, sort of like the all-permeating religion it is for so many American designers. But, as I mentioned, the history of German design has so many interesting intertwining threads. And the 1920s have at least three that are all more typographically relevant—both to their time and today—than the Bauhaus' typography.</p>
      <p>That's my point, and I'm sticking to it!</p>
