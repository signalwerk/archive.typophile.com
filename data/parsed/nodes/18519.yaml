      <p>Germany gave birth to printing and blackletter type. Shortly thereafter, Venice and other Italian cities gave birth to the Humanist typefaces that we are still familiar with. And many of those first printers even came from Mainz—some directly from Gutenberg's workshop! (Mainz had a sort of civil war in the early 1460s, and artisans who could left the city for better conditions).</p>
      <p>So, going to Germany and Italy would make great historic sense. Between Berlin, Frankfurt, Venice, and Rome, you can't go wrong!</p>
