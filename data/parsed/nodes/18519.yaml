      <p>The ancient history here is not top quality.</p>
      <p><cite>The Romans pretty much copied everything Greek. I’m no historian, but wasn’t the common language Greek until about the time of the fall of the Roman Empire, around which time Latin became the common language?</cite><br>
      Exactly the opposite is true. Latin was the language of the empire until the creation of the Roman Empire in the East, which we call Byzantine. The movement of the political centre eastwards started with Diocletian, who after two centuries of Roman decline split the command structure, appointing a second Augustus and two Caesars; it continued with the building of Constantinople (called 'Nova Roma') by Constantine, who forced the Eastern cult of Christianity onto his empire, but who himself spoke hardly any Greek. Soon, though, Byzantines forgot their Latin, calling their emperor Basileus kai Isapostolos, king and equal of the apostles, in a thoroughly Persian variety of quasi-divine chiefdom, than which nothing could by less Modernist. In the West Latin became first a variety of barbarian peoples' creoles and then, in very much post-Classical form, a lingua franca for scholarship. Ciceronian Latin was only resurrected in the Renaissance, which development one might fairly call Modernist in the expansive Hrantian sense.</p>
      <p>The Roman alphabet of capitals was based on the Etruscan, not directly on the Greek. The Roman cursive - quite different from the monumental capitals - gave rise to various forms of uncial, which gave rise eventually to Carolingian miniscule, which became the humanists' lowercase. </p>
      <p><cite>I think Hrant was referring to when the ancient Romans — the Humanists — decided to use the Latin alphabet to more accurately portray the text of the philosophers.</cite><br>
      The humanists were Italians of the Renaissance, not ancient Romans. They did indeed accept the need to represent, as Erasmus said, Latin words by Latin elements, but they didn't realise that the MSS they were copying were Carolingian miniscule. [Of course you know that perfectly well Tiffany.]</p>
      <p>The idea that Romans were Modernist and absolutist, the Greeks pragmatists, is just nonsense. Compare Plato's Republic with Horace, for instance, and you'll find that if anything the opposite was true - though really this sort of caricature gets nowhere, not least because both were culturally very various over time and space. If you want real absolutism, look at Sparta. Even in lettering, the Romans were perfectly pragmatic, having a number of forms of their alphabet for different purposes. Serifs made letters more durable and more beautiful on monumental caps, but they weren't used in handwriting. Admittedly they wrote upwards with their reed pens, a refusal of concession to their materials which I think demonstrates a virtuous desire to slow down and take pains over something important and, of course, costly.</p>
