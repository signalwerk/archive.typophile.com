      <p>Craig, William, Hrant, Dan--</p>
      <p>Thanks for all the info right out of the gate! I rather suspected that if I was partial to Germany as a destination, the topic of the course might sort itself down to the story of blackletter (script and type both), and I suspected that Frankfurt (especially) or Berlin would present themselves as obvious choices of cities.</p>
      <p>I don't think London or Israel would be options I could pair with any German city (or one not close to the North Sea coast, in London's case), because of the travel time; these are for-credit courses and it might be hard to sell a proposal that has interruptions of much length in the calendar. (Moreover, stupidly, Israel would be a hard sell for too many parents.)</p>
      <p>One of the advantages to the exploration of type and nationalism would be that it would allow me to tap into issues of globalization--in a different way. In many of these courses, faculty take students to cities like Singapore or London to talk about how people from very different backgrounds and cultures, with diverging and conflicting interests, negotiate a common life (or don't, as the case many be). But here might be a chance to see the history of <em>resistance</em> to cultural and national diversity, fought on the battleground of what constitutes a proper form of type/writing, in the name of asserting, even creating, a national identity.</p>
      <p>Okay, enough of my own musing for now. Keep the ideas coming, please, folks. This could be a good idea after all.</p>
      <p>Thanks for the pointer, William. And thanks, Dan, for the offer--that's precisely the sort of friendly help I am shamelessly hoping to elicit.</p>
