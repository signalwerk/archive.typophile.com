      <p><a href="http://www.themicrofoundry.com/ss_rome3.html" title="http://www.themicrofoundry.com/ss_rome3.html">http://www.themicrofoundry.com/ss_rome3.html</a></p>
      <p>The one on the left is from a book, the other is from a photo I took at Delphi (in a Summer downpoor, an event the locals assured us happens once in a decade, supposedly) in 1995, not knowing what it signified, what it would signify to me today! And it's not visible in that detail, but guess what name you can find on the inscription itself: TRAIAN!</p>
      <p>And look at us today, with the Greek-on-the-street oblivious<br>
      to the Latinized junk littering his cultural landscape.</p>
