    html: <p>The ornate T looks like it comes from a typeface called "Bella Initials" according to p.114 of the Solotype Catalog. I am not sure if this has been digitized, but a similar font is Scriptorium's <a href="http://www.myfonts.com/fonts/scriptorium/rheingold/" target="_blank">'Rhiengold'</a>.</p>
