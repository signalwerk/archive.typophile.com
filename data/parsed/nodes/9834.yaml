  html: "<p>I'm looking for fonts used (or that closely resemble) in the following three images: <br> <br>An uppercase \"T\": <br><a href=\"http://www.cothier.com/ornate_t.jpg\" target=\"_blank\">http://www.cothier.com/ornate_t.jpg</a> <br> <br>The lowercase letters (but if the uppercase looks familiar, it'd be appreciated!): <br><a href=\"http://www.cothier.com/list.jpg\" target=\"_blank\">http://www.cothier.com/list.jpg</a> <br> <br>Ditto above: <br><a href=\"http://www.cothier.com/lost.jpg\" target=\"_blank\">http://www.cothier.com/lost.jpg</a> <br> <br>I know this is a few fonts, but I thought it might be better than starting multiple threads.  Sorry if it's not the normal posting procedure. <br> <br>Thanks in advance for any help anyone can provide!</p>"
  html_clean: "<p>I'm looking for fonts used (or that closely resemble) in the following three images: <br> <br>An uppercase \"T\": <br><a href=\"http://www.cothier.com/ornate_t.jpg\" target=\"_blank\" class=\"link-external\">http://www.cothier.com/ornate_t.jpg</a> <br> <br>The lowercase letters (but if the uppercase looks familiar, it'd be appreciated!): <br><a href=\"http://www.cothier.com/list.jpg\" target=\"_blank\" class=\"link-external\">http://www.cothier.com/list.jpg</a> <br> <br>Ditto above: <br><a href=\"http://www.cothier.com/lost.jpg\" target=\"_blank\" class=\"link-external\">http://www.cothier.com/lost.jpg</a> <br> <br>I know this is a few fonts, but I thought it might be better than starting multiple threads.  Sorry if it's not the normal posting procedure. <br> <br>Thanks in advance for any help anyone can provide!</p>"
