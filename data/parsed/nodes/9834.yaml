  - id: 62739
    user: 5983
    date: 2005-03-18T14:10:00
    date_raw: 18 Mar 2005 — 2:10pm
    votes: null
    html: "<p>The uppercase T is somewhat reminiscent of a font issued by the Classic Font Company, which they call \"Amadeus\": <br><a href=\"http://www.myfonts.com/fonts/classic/amadeus/\" target=\"_blank\">http://www.myfonts.com/fonts/classic/amadeus/</a> <br>See what you think. <br> <br>I'm 99% sure the second sample is hand-lettered calligraphy. There are, however, dozens of fonts made from hand-drawn calligraphy, many of which are freeware. \"Apple Chancery\" is a commercial font, but similar--a traditional \"Chancery Italic\" style. I would particularly recommend Pia Frauss' \"Francisco Lucas\" family, available for free download at: <br><a href=\"http://www.pia-frauss.de/fonts/fl.htm\" target=\"_blank\">http://www.pia-frauss.de/fonts/fl.htm</a> <br>IN terms of the uncials, there are plenty of good uncial fonts too, many free. Among my favourites are: <br>* MouserFonts' \"Gourdie Uncial\" and \"Gourdie Uncial Deux\" (go to: <a href=\"http://www.mouserfonts.com/\" target=\"_blank\">http://www.mouserfonts.com/</a>  and search for \"uncial\") <br>* \"Unciaal\" (<a href=\"http://www.dafont.com/en/font.php?file=unciaal\" target=\"_blank\">http://www.dafont.com/en/font.php?file=unciaal</a>) <br>* \"Cry Uncial\" (<a href=\"http://www.dafont.com/en/font.php?file=cry_uncial\" target=\"_blank\">http://www.dafont.com/en/font.php?file=cry_uncial</a>) <br>etc. <br>Fontcraft's Scriptorium is a good starting place as well: <br><a href=\"http://www.fontcraft.com/csa/fontcraft.php\" target=\"_blank\">http://www.fontcraft.com/csa/fontcraft.php</a> <br> <br>--Murray</p>"
