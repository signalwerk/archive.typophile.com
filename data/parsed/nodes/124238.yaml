    html: |-
      <p>First, I'll second the recommendation of the OpenType Cookbook as a reference and guide!</p>
      <p>In the OpenType panel....</p>
      <p>Your main code in the top right pane will look something like this, only with as many substitutions as you need. (You can also simplify the code here by creating classes, but that's another story.):<br><code><br>
      feature ss01 {<br>
          sub A by A.alt ;<br>
          sub B by B.alt ;<br>
      } ss01;<br></code></p>
      <p>In the lower right pane, you'll need languagesystem statements. At a minimum this will be something like the code below. If you support other writing systems, or have language-specific code in your font, it will get more complex (both here and in your code pane):</p>
      <p><code><br>
      languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br></code></p>
