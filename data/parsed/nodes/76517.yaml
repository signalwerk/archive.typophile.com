    votes: null
    html: |-
      <p>I agree this is a good start.</p>
      <p>I think a rounder, less eccentric tittle shape would fit the typeface better.<br>
      Some of the pointy terminals on the figures feel out of place.<br>
      The break from straight into curve in letters like B/P/R looks a bit mechanical to me.<br>
      Looks like you need increase overshoot for some terminals: notice for example how the last, curved stroke bottom of m/n looks a bit like it's riding high relative to the straight-cut strokes to its left.</p>
      <p>Works better at that small size than I would have guessed!</p>
