    html: |-
      <p>Sweet!<br>
      The numerals just caught my eye – maybe I'm missing something, but I'd say if your "3" stands, your "5" should probably do the same. The more common way would be to let the "3" hang, like the "5". (See <a href="http://www.flickr.com/photos/ninastoessinger/3912153709/" rel="nofollow">this</a> for instance, for a juxtaposition of old-style and modern models.)</p>
