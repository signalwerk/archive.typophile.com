    date: 2010-11-27T13:20:00
    votes: null
    html: "<p>Good points everyone. Thanks. I'm seeing a whole bunch of things that I have to alter. I think I'll hang that 3.  eliason: Could you clarify what you mean by making the title shapes rounder and less eccentric at the same time? I've been wondering if this face should have a more standard upper case, but create an alternate \"swash\" version. Something art-deco-ish.</p>"
