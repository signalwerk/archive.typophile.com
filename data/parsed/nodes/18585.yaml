    html: <p>I should also mention that for many years, Adrian Frutiger was deeply unhappy about Bitstream's decision to publish Zurich, Humanist 777 and other renamed versions of his typefaces. Unitl Bitstream signed the agreement with Linotype, the company was considered by many as a "guerilla foundry" of a sort. Bitstream's library includes some other renamed versions of other typefaces but not all were unauthorized. For example, Linotype  once published Matthew Carter's Shelley Script and then Bitstream published it as English 111. Matthew Carter was one of Bitstream's co-founders so English 111 is obviously authorized -- but Linotype owns the trademark Shelley Script. Similarly, Zapf Humanist and Zapf Calligraphic 801 were versions of Optima and Palatino autorized by Hermann Zapf but were published by Bitstream under other names since Linotype owns the trademarks.</p>
