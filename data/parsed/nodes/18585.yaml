    html: |-
      <p>Travis, </p>
      <p>no, it's not really the same. Adrian Frutiger drew two different ampersands for his Univers typeface. Linotype used one, Bitstream used the other. Zurich is simply a renamed Univers, while Arial and Helvetica are similar but different typefaces. Bitstream digitized Univers but they were not able to obtain permission from Linotype to use the Univers trademark so they released it as Zurich. In 2003, Linotype and Bitstream signed an agreement according to which Zurich is an "authorized version" of Univers -- but the name Zurich is still used. </p>
      <p>A.</p>
