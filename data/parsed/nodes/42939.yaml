    date: 2008-03-11T07:55:00
    votes: null
    html: |-
      <p>You can code a flash website with individual page bookmarking capabilities. It's not flash that takes page bookmarking away, it's the site owners who don't write their own code. </p>
      <p>Sorry if I sound snippy, but I have clients all the time that say "no flash" because they believe the two top myths; it can't be bookmarked, and it can't be spidered by search engines. Neither has been true since about 2003.</p>
