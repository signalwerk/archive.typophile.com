      <p>Is the condom logo a school project? If so, I'd drop it. Seems that every other student these days does a condom project in college ;o)</p>
      <p>Nice site. The Flash isn't over-the-top. That said, I'm not sure you really need flash. The one thing that I miss mostly on all-flash sites is the ability to bookmark specific pieces of work to show others.</p>
  - id: 265101
