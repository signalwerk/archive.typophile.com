      <p>Hey Guys, </p>
      <p>I hear you Alaskan on the age thing. Ageism is alive and well in America, I guess 25 year old's are scarier to work with then 35 year olds in our industry. ( that's a joke btw, it's about experience and knowledge of our industry imo.)<br>
      Regardless I think I heard this statement enough that I should remove it. </p>
      <p>But I will be updating my site a bit further with a Blog about stuff I see here and there to contextualize my personality to the work I do. And I will be fixing what I can on that slideshowpro flash swf. I think their are some gizmos I can turn on and off including the + and the full screen options. I think if I remove the full screen and either remove the + option or include a bit of a project description when you click on the + that would be a nice feature. </p>
      <p>It's still a work in progress and I wish you all thanks and for taking a second for the comments, critiques, and praise. I'll link you all to a personal wall paper illustration I created feel free to download it!<br>
      <a href="http://www.sisudesigns.com/submission/beginning.jpg" title="http://www.sisudesigns.com/submission/beginning.jpg">http://www.sisudesigns.com/submission/beginning.jpg</a></p>
