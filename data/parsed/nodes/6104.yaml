    html: <p>I think all these oval background placards that the federal government uses are set in, or at least inspired by, some variety of <a href="http://www.myfonts.com/fonts/linotype/goudy/old-style/testdrive.html?s=WHITE%2BHOUSE&amp;p=48">Goudy Old Style</a>, but some of the glyphs, like the "A" and the "S", look more compressed. It was probably custom designed based on Goudy Old Style (who knows, maybe they even commissioned Goudy to do it himself....)</p>
