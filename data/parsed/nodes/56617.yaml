      <p>Though the Dutch florin has been obsolesced by the euro, aren’t there other countries that use a currency called “florin”, whether or not the same symbol is used? Something in my mind says there is at least one, but I can’t pull it out.</p>
      <p>If not, the remaining future use of the florin symbol will be largely limited to texts on Dutch financial history and other period pieces, e.g.: a romantic comedy set in a Rotterdam grocery store in 1987, which a careful editor can easily fake with an italic <em>f</em> with hook from future disambiguated fonts.</p>
