    <p>Hi Guys,<br>
    I have a question for you. In this days, I try to make a pseudo-randomic typeface but, I note which I use maximum twelve step to change my code. It's true? Or is only my case?<br>
    Sequence: 125612   641342   615215</p>
    <p>Code:<br>
    feature calt { # Contextual Alternates<br>
    # Latin<br>
      lookup calt1 {<br>
      	sub @set_1 @set_1' by @set_2;<br>
      	sub @set_2 @set_1' by @set_3;<br>
      	sub @set_3 @set_1' by @set_4;<br>
      	sub @set_4 @set_1' by @set_5;<br>
      	sub @set_5 @set_1' by @set_6;<br>
    	} calt1;</p>
    <p>	lookup calt2 {<br>
    		sub @set_1 @set_2 @set_3' by @set_5;<br>
    		sub @set_2 @set_5 @set_4' by @set_6;<br>
    		sub @set_5 @set_6 @set_5' by @set_1;<br>
    		sub @set_6 @set_1 @set_6' by @set_2;<br>
    	}calt2;</p>
    <p>	lookup calt3 {<br>
    		sub @set_1 @set_2 @set_1' by @set_6;<br>
    		sub @set_2 @set_6 @set_2' by @set_4;<br>
    		sub @set_6 @set_4 @set_5' by @set_1;<br>
    		sub @set_4 @set_1 @set_6' by @set_3;<br>
    		sub @set_1 @set_3 @set_1' by @set_4;<br>
    		sub @set_3 @set_4 @set_2' by @set_2;<br>
    	} calt3;</p>
    <p>	lookup calt4 {<br>
    		sub @set_4 @set_2 @set_6' by @set_6;<br>
    		sub @set_4 @set_2 @set_6 @set_4' by @set_1;<br>
    		sub @set_6 @set_1 @set_1' by @set_5;<br>
                   #other sub<br>
    	} calt4;</p>
    <p>}calt;</p>
    <p>The script work until to calt3. Why ignore calt4?</p>
    <p>Thanks!</p>
