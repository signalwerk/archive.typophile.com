      <p>Here is the Old Hamcherry page from Fonts in Use:<br>
      <a href="http://fontsinuse.com/typefaces/7280/old-hamcherry" title="http://fontsinuse.com/typefaces/7280/old-hamcherry">http://fontsinuse.com/typefaces/7280/old-hamcherry</a></p>
      <p>It mentions Menlor Casual as a related typeface, but it doesn't seem to be commercially available in digital format, either:<br>
      <a href="https://www.flickr.com/photos/stewf/14948000769/" title="https://www.flickr.com/photos/stewf/14948000769/">https://www.flickr.com/photos/stewf/14948000769/</a></p>
      <p>Corvinus has some of the flavor of Old Hamcherry and Menlor (capital letters), but isn't a very good match for the lowercase....</p>
