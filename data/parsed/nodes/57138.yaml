      <p>I'd second some confirmation on this re the design.  locl is definitely the option, though of course it doesn't hurt to include them as character alternates.  I think it's basically giving them more Latinized shapes, but I also seem to recall someone saying that it's just one foundry that produces fonts with them in that style.  I could be mistaken though.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
