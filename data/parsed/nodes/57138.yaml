    html: <p>I'd vote for a stylistic set. I wouldn't necessarily object to locl, but I think it makes more sense as a stylistic set. It is true that the style you are referring to is dominant in the Bulgarian typographic scene (though by no means universal). However, it is not specific to Bulgaria. Many of the so-called Bulgarian features are basically upright cursive forms, and can be found in other places like Ukraine and Russia. There may be a culture-specific difference between preferred upright cursive forms, though. For instance, I don't ever recall seeing a <em>yu</em> with an ascender outside of Bulgaria (or <em>ka</em> with an ascender, for that matter, although I might be remembering wrong). If I had a lot of time on my hands, I might even create several stylistic sets in addition to the default Cyrillic forms...</p>
