    <p>Hello there. I have read my way through some of the previous threads on the Bulgarian 'peculiarities' in <a href="/wiki/Cyrillic" class="freelinking">Cyrillic</a>. I've looked at specimens, but I'm more confused now than before. Say I was to design these Bulgarian alternates, what would they look like? Are there consensus on the set and shape of the characters? And how should I implement them? In the 'locl' feature, stylistic alternate or both – or something else? In other words, help would be much appreciated.</p>
    <p>/Claus</p>
  html_clean: |-
