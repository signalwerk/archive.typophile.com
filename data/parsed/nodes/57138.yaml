      <p>my vote is for a stylistic set. this issue is similar to the capital eszett issue for German IMO: there is a vocal minority lobbying for its/their acceptance, but by and large most people likely prefer the traditional forms. but i could be wrong, this is just my sense.</p>
      <p>but as for forms, basically they look like upright italic forms. Here is one model that you could follow: <a href="http://www.flickr.com/photos/pauldhunt/428260560/in/set-72157600292550299/" title="http://www.flickr.com/photos/pauldhunt/428260560/in/set-72157600292550299/">http://www.flickr.com/photos/pauldhunt/428260560/in/set-72157600292550299/</a><br>
      of course there are other models. You might look at <a href="/wiki/Nick%2520Shin" class="freelinking">Nick Shin</a>'s specimen for his Modern Suite. <a href="http://shinntype.com/Figgins_Scotch.pdf" title="http://shinntype.com/Figgins_Scotch.pdf">http://shinntype.com/Figgins_Scotch.pdf</a> (p. 24). I believe he followed the model as set forth by the Bulgarian foundry Hermesoft.</p>
      <p>Hope this helps.</p>
