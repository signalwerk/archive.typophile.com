    <p>Whilst there's a huge amount of blogs for type design and book COVER design, I can't seem to find a decent blog for information and inspiration in layout design (BLAD and MLAD). I really want to find some lovely blogs with information about the newest and bestest interior book design, illustrated/picture book design, magazine layout etc etc. </p>
    <p>Any suggestions? (Maybe I'm not looking hard enough).</p>
