    html: <p>What in the world is an "English" typeface?  You mean the copies people made of Jenson's work?  Or the typefaces based on the textura or German blackletter?  (that is to say, none of those are truly "English") And who in the world would know the difference besides maybe some of us here? Certainly not anyone's clients.  Just throw a Union Jack on the page somewhere.  Bingo, now its English.</p>
