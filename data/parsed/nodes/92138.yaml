    html: |-
      <p>The “Scotch” types were cut by an Englishman, Richard Austin.<br>
      First in Scotland, then in the UK for his own Imperial Foundry.<br>
      http://en.wikipedia.org/wiki/Richard_Austin_(punchcutter)</p>
      <p>Commercial’s Austin:<br>
      <a href="http://commercialtype.com/typefaces/austin/austin/roman" title="http://commercialtype.com/typefaces/austin/austin/roman">http://commercialtype.com/typefaces/austin/austin/roman</a></p>
      <p>Shinntype’s Scotch Modern:<br>
      <a href="http://www.myfonts.com/fonts/shinn/scotch-modern/" title="http://www.myfonts.com/fonts/shinn/scotch-modern/">http://www.myfonts.com/fonts/shinn/scotch-modern/</a></p>
      <p>For the 20th century, there is too much to choose from with so broad a brief as “Modern English”</p>
