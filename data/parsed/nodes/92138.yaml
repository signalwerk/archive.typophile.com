    html: |-
      <p>Times New Roman is English, of course, designed for the London <em>Times</em> by Monotype's Victor Lardent in 1931 under the direction of Stanley Morison.<br>
      Was Gill Sans ruled out for design reasons, or in protest of Eric Gill's debauched private life? If you can use something else by Gill, Perpetua (from the late 1920s) is very nice. It, too, was designed at the instigation of Stanley Morison.</p>
