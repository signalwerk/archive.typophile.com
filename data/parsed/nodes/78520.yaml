      <p>I was indeed expecting Mr Gill.<br>
      However, the German magazine <em>Signal</em> occasionally used Gill Sans (the modified European version) during WWII, so WTF.</p>
      <p>It always strikes me as strange that different aspects of the mise-en-scène in a film can vary so much in authenticity.<br>
      Costume, make-up and hair styles, set decoration, and music (often patently anachronistic), as well as typography.<br>
      I wasn't totally convinced by the accent of Rush and Firth, which seemed a little too modern (i.e. 50 years after), and Firth not quite aristocratic enough. Bonham-Carter was spot on though, very plummy.</p>
