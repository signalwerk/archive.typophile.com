    <p>Went to see Oscar front-runner <em>The King’s Speech</em>.<br>
    Disappointed the intertitle/credit fonts were hopelessly wrong.<br>
    I mean, what bigger no-brainer could there be than "English sans serif, 1930s"? — and they go with… Futura.</p>
