      <p>I could defend the film by advancing the theory that Edward VIII was actually a British spy who managed to advance the Allied cause against Hitler, or defend Churchill by noting that Gandhi's pressure for independence for India an a rapid timetable contributed to the bloodshed which the forces seeking partition for Pakistan unleashed.</p>
      <p>However, I've brought already far too much politics into this forum, and these would be extreme longshots, so I think I'll leave Christopher Hitchens alone. Churchill, at least, has a reputation that is safe from any naysayers.</p>
      <p>As for Eric Gill: while Gill Sans would have been the appropriate choice, given recent revelations about his personal life, and the increasing awareness of the rights of women and the needs of the victims of sexual violence, and the dependence of a movie studio on its image and public goodwill... avoiding his typeface was only to be expected.</p>
