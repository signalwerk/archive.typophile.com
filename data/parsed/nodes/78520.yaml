      <p>Although you are right that making Eric Gill into an unperson is not appropriate either, movie studios, at least in the United States, are in a difficult position. Even while they make their money most effectively when pandering to our baser instincts, they must constantly struggle to prove to the American people that, no, they really aren't corrupting the youth of the nation.</p>
