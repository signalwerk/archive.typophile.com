      <p><em>And Nick, how many kings and queens do you know whom you might compare to Colin Firth in the accent department? </em></p>
      <p>George:<br><a href="https://web.archive.org/web/20190726180621/http://www.youtube.com/watch?v=DAhFW_auT20">http://www.youtube.com/watch?v=DAhFW_auT20</a></p>
      <p>Colin:<br><a href="https://web.archive.org/web/20190726180621/http://www.youtube.com/watch?v=zk56SwKzpwE">http://www.youtube.com/watch?v=zk56SwKzpwE</a></p>
      <p>Sorry, I don't think Firth cuts it.<br>
      He sounds like Bluebottle (Goon Show): George had a certain repose, as befits a king, despite the pauses.<br>
      In fact his speech mannerism becomes a kind of affectation.<br>
      Firth puts too much melodrama (never mind the music) into it, making the mannerism a debility. Too strident, too much variation in pitch, for one thing, too high a pitch for another. George is so much more relaxed, more musical and poetic in delivery than Firth's theatrical struggle. </p>
      <p>Bonham-Carter was excellent. Reminded me of several snooty upper-crust women I've known.</p>
