    <p></p><div class="imageWrap"><img src="http://typophile.com/files/geometric-480_5707.png"></div><p></p>
    <p>This late 19th century design conjures up early 20th century Dutch DeStijl lettering with a mostly strict adherence to right angles and minimal stroke modulation. Geometric began its life as a metal typeface from the Central Type Foundry, circa 1884. Soon after, this design was officially licensed to Morgan &amp; Wilcox and was shown in their 1890 catalog in Regular, Light and Condensed Light variations. After acquiring Morgan &amp; Wilcox, Hamilton Manufacturing offered Geometric Light Face Condensed as their own No 3020 and the Geometric Light Face as No 3021.</p>
    <p>HWT Geometric has been expanded digitally to include a Regular Condensed version. A heavier wood type specimen was found from an unknown manufacturer and digitized as it was found, resulting in the HWT Geometric Shopworn and Shopworn Inked variations. These digital versions all include a full Western and Central European character set of over 380 glyphs.</p>
    <p>Digitized by James Grieshaber<br>
    Special Thanks to David Shields for background research.</p>
    <p>For more information on this release-  <a href="http://www.hamiltonwoodtype.com/geometric.html" rel="nofollow">HWT Geometric</a><br>
    Special Introductory Offer available through June.</p>
    <p><a href="http://www.hamiltonwoodtype.com/index.html" rel="nofollow">Hamilton Wood Type Foundry</a></p>
