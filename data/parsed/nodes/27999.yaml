    <p>The new European marketing for the Playstation 3 was posted on <a href="http://www.kotaku.com/gaming/playstation-3/playstation-3s-euro-slogan-revealed-197774.php" rel="nofollow">Kotaku</a>, a gaming site, and it features<a href="http://www.underware.nl/site2/index.php3?id1=bello&amp;id2=overview" rel="nofollow"> Underware's Bello</a>! A capture is attached to this post. Not what I would've expected.</p>
    <p>You can watch the video <a href="http://youtube.com/watch?v=M9rsniZ4j6k" rel="nofollow">here on YouTube</a>.</p>
