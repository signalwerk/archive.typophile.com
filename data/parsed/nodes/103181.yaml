    <p>Hi there,</p>
    <p>I have already tried using WhatMyFont, Intellifont and a few others and no luck...</p>
    <p>What I am told by the person's whose image this is, is that it was created for him about 9-12 years ago... </p>
    <p>[this might help as it means the font has been around a while] and that he does not have the original font name or file.</p>
    <p>So, before having to force him to 'picking a new font', I figured I'd give this a shot...</p>
    <p>Thank you for your help oh masters of fonts!<br>
    Cheers,</p>
    <p>E.</p>
