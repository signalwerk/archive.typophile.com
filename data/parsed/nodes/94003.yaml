    html: |-
      <p>Hello @Andrej Krátky.<br>
      First I want to thank you for answer my effusive comments about Nara; and congrats you for the beautiful typefaces that you have. Thanks for working like that, its really a inspiration to see your drawings.</p>
      <p>I was really interested in the original drawing of Nara; but I only find some images in Typotheque blog.<br>
      I'm begining a research about typefaces with really abrupt connections in the transition points—and abrupt modulation. I find Vendôme, Preissing Pro, and begin to notice that Czech Typographic design full my expectations (I know that Vendôme wasn't czech, typophiles). </p>
      <p>So, what I really like to see, was more about Nara original drawings, to feel the original drawing curves and to learn a lot from them. But I don't know how difficult is to reach that.</p>
      <p>Again: thanks @Andrej Krátky; its really nice to keep in touch with the original thinker of that beauty!<br>
      ——————<br>
      Fábio Santos</p>
