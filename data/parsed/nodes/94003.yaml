      <p>Fabio,<br>
      I still do have all the original drawings for the regular variant of the typeface. They are quite large and would take a lot of time to scan:-(<br>
      Are you willing to come to Bratislava?:-)</p>
      <p>As far as to the history of Czech type, there is a nice article here:<br>
      <a href="http://www.typotheque.com/articles/czechoslovak_typography" title="http://www.typotheque.com/articles/czechoslovak_typography">http://www.typotheque.com/articles/czechoslovak_typography</a></p>
      <p>If you are seriously interested in Josef Tyfa, here you can read about Frantisek Storm and his collaboration with Tyfa:<br>
      <a href="http://www.eyemagazine.com/feature.php?id=98&amp;fid=487" title="http://www.eyemagazine.com/feature.php?id=98&amp;fid=487">http://www.eyemagazine.com/feature.php?id=98&amp;fid=487</a></p>
