    <p>From a post made 9 July, 2010, at 11:09 am:</p>
    <blockquote><p>FLS6 ...we're in the pre-alpha status now. Our intent is to have FontLab Studio 6 for Windows available by the end of this calendar year, and the Mac version 3-4 months later.</p>
    <p>These are early projections but we're on a steady development track right now.</p></blockquote>
    <p>Us FontLab users need support for AFDKO2.0 (from 2007) . AFDKO 2.5 would be nice, but give us something that supports {mark}, {mkmk}, and the "new" Adobe kerning, as found in Arno. </p>
    <p>You're apparently trying to hit a home run. How about just getting to first base? </p>
    <p>Or should we just give up?</p>
  html_clean: |-
