    html: "<p>An optimal keyboard depends heavily on the ergonomics of typing <i>frequently-occuring sequences of letters</i>. Since this varies greatly by language, your -admittedly valiant and interesting- effort will be: <br>1) Certainly computationally heavy. <br>2) Probably too much of a compromise for most any individual language. <br> <br>On the other hand, it could be useful as a means to the methodical -if ponderous- access of any letter in any [Latinate] language - somewhat similar to how the IPA phonetic alphabet works great for academic work, but can't be used at all well for actual reading. <br> <br>hhp <br></p>"
