    html: <p>Hrant, you're correct that my grandiose keyboard panacea is a bit far-fetched. I&nbsp;think I just ran a little far trying to get people excited. I do see some real potential in it, though. <br> <br>1) A standard extension to the qwerty layout. A cross-platform layout that anyone using qwerty can expect to have access to. And with a more logical layout than the ones provided with Apple's US&nbsp;and US&nbsp;Extended mappings (a good OS&nbsp;X mapping was my initial impetus). <br> <br>2)A standard set of characters for all Latinate keyboards. Even if the locations of the characters aren't the same, we could still probably come up with a common set of characters that are important to have access to (There are currently ~950 characters available with my mapping - more than would be necessary to standardize, I think) <br> <br>3) And again, specifically something useful to typographers (the idea was spawned by the layout in Bringhurst's Elements) <br> <br>I guess we don't necessarily need a European unification. And, I would hasten to add that the characters are far from ponderous to access. I've made an effort to (at the very least) improve on Apple's provided qwerty mappings. Common characters like quotation marks, guillemets, accents and additional letters have been carefully placed as logically as possible. Unfortunately, the images on the site don't make it as clear as possible, but the original image (a single keyboard with 4 characters displayed on each key) was fairly difficult to maintain. I'll restore that when the mapping reaches a less volatile state. <br> <br>But, thank you Hrant, for reining me in. I let myself get a little too caught up in the excitement of finally having this in a usable state.</p>
