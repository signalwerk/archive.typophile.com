    html: <p>That's a great idea. I used to operate a Compugraphic Editwriter sometimes and they had special keys for everything instead of using menus. This is sort of an old idea, but it worked very well. (You did have to enter special codes for special characters, however.) The reason they were able to do it was because the machine was designed to do only one thing, wheras modern personal computers are general purpose machines. But, with USB, you could easily swap keyboards tailored to specific tasks, as easily as you can run different applications for specific tasks.</p>
