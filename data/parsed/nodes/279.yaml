    html: <p>When he was head of the type group at MS, Robert Norton designed a typesetter's keyboard and even had a prototype built. I saw it a few years ago when I was in Redmond. It is huge and not only has keys for all sorts of extended punctuation but also a large number of accented characters and, my favourite, a key for turning on/off smallcaps. As far as I know, software was never made for it.</p>
