    html: "<p>Jesse: <br> <br>The first thing that comes to mind is to reverse the \"E\" to create the three. this will begin to help with the shape of the word. Next I might try combining the \"1\" and \"T\" using the left arm and stem of the \"T\" to create the \"1\", while separating (through space or color) the right arm of the \"T\". As for a type recommendation, I would probably look for something less soft (less rounded corners) to correlate with the forwardness of the title. <br> <br>Of course, this is just what I might try. I wish you luck coming to the perfect solution. I'm sure you'll get a lot of valuable assistance from some typophiles who are much more qualified than  I am. <br> <br>Aloha! <br>Scott</p>"
