  html: "<p>Hello, <br>I've often visited these boards but this is my first time posting. I've always seen typography as the upper echelon of design... and I find it a little intimidating. <br> <br>Anyway... on to my post. I've been running a graphic &amp; web design business for a little over two years now and I'm in need of a makeover for my site and identity. You can view what I have now here: <br> <br><a href=\"http://www.31threedesign.com\" target=\"_blank\">http://www.31threedesign.com</a> <br> <br>I want to start with a new logo but I've had a real hard time finding the right font to use, mainly because of the shape of the word and the fact that it begins with the number 3. <br> <br>This is something that I've been thinking of using... but it's still lacking in something. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/16523.gif\" alt=\"31three logo\"> <br> <br>It's a modified bank gothic. I've very open to suggestions and modifications. The illustrator file is <a href=\"http://www.31threedesign.com/31three.zip\">here</a> for those who like to mess with stuff. <br> <br>I'm not trying to get you to do my work for me... I'm just really stuck and need some help to get me rolling in a new direction. <br> <br>Thanks! <br>Jesse BC</p>"
  html_clean: "<p>Hello, <br>I've often visited these boards but this is my first time posting. I've always seen typography as the upper echelon of design... and I find it a little intimidating. <br> <br>Anyway... on to my post. I've been running a graphic &amp; web design business for a little over two years now and I'm in need of a makeover for my site and identity. You can view what I have now here: <br> <br><a href=\"http://www.31threedesign.com\" target=\"_blank\" class=\"link-external\">http://www.31threedesign.com</a> <br> <br>I want to start with a new logo but I've had a real hard time finding the right font to use, mainly because of the shape of the word and the fact that it begins with the number 3. <br> <br>This is something that I've been thinking of using... but it's still lacking in something. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/16523.gif\" alt=\"31three logo\"> <br> <br>It's a modified bank gothic. I've very open to suggestions and modifications. The illustrator file is <a href=\"http://www.31threedesign.com/31three.zip\" class=\"link-external\">here</a> for those who like to mess with stuff. <br> <br>I'm not trying to get you to do my work for me... I'm just really stuck and need some help to get me rolling in a new direction. <br> <br>Thanks! <br>Jesse BC</p>"
