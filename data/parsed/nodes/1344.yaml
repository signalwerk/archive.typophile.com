    html: <p>One possibility is that the difficulty you are having comes from the fact that the (arabic) numerals and (roman) letters have a different inner logic &amp; rules of thick-thin contrast.  <br> <br>If this is the case, then you might find a solution by making the numerals more different and contrasting, using weight, style, color etc., rather than more similar. You could also try separating them by a dash, dot, etc. <br> <br>I can see that you might improve on the current logo on your web site, but it does go the contrast/separation route. Maybe another solution on that same route will work for you.  </p>
    html_clean: <p>One possibility is that the difficulty you are having comes from the fact that the (arabic) numerals and (roman) letters have a different inner logic &amp; rules of thick-thin contrast.  <br> <br>If this is the case, then you might find a solution by making the numerals more different and contrasting, using weight, style, color etc., rather than more similar. You could also try separating them by a dash, dot, etc. <br> <br>I can see that you might improve on the current logo on your web site, but it does go the contrast/separation route. Maybe another solution on that same route will work for you.  </p>
