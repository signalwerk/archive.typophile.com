    html: <p>I think my style has shifted a lot in the past few years. When I was first transitioning from print to web I had a more classical style... but now that most of my time is spent on webdesign... it's taken a lot more contemporary feel. <br> <br>For example... here are two of my latest projects... still under development. <br> <br><a href="http://sea.surpasshosting.com/~lwc/" target="_blank">http://sea.surpasshosting.com/~lwc/</a> <br><a href="http://www.frame24productions.com/index2.php" target="_blank">http://www.frame24productions.com/index2.php</a> <br> <br>I'm really liking paralucent. It's a very beautiful font. It reminds me of helvetica neue that everyone is using these days... but it's also kinda unique. <br> <br>I just wish I could play with it a bit more before I plunked down the cashola.  </p>
