    html: <p>I had a minute to checkout your site today. I love the simplicity of it and you've done some very nice work. Have you considered dropping the numeral/letter approach altogether? I was drawn to the "31:3" on your portfolio page. It reminds me of traditional chapter:verse referencing. Considering the style you seem to convey through your work, I think this is an approach you could pull off very well. <br> <br>31:03, (31:03), [31:03], etc</p>
