      <p>Mário Feliciano, Dino dos Santos, Hudo D'Alte, Ricardo Santos... met them at AtypI, including Manuel R. Pereira da Silva &amp; his amazing work! (sad to know he passed a few years ago).</p>
      <p>I love Rui Abreu's Catacumba font!</p>
      <p>Marina Chaccur wrote about them for Tupigrafia magazine:<br>
      <a href="http://www.flickr.com/photos/tupigrafia/4834484505/" title="http://www.flickr.com/photos/tupigrafia/4834484505/">http://www.flickr.com/photos/tupigrafia/4834484505/</a></p>
      <p>And Luc Devroye have links to most of portuguese type designers here:<br>
      <a href="http://cg.scs.carleton.ca/~luc/portugal.html" title="http://cg.scs.carleton.ca/~luc/portugal.html">http://cg.scs.carleton.ca/~luc/portugal.html</a></p>
      <p>Abraços,</p>
      <p>Henrique Nardi</p>
      <p>]t[</p>
