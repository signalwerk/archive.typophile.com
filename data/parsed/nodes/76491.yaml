    <p>Hi everyone!</p>
    <p>I'm just doing a small investigation about how the world sees the Portuguese typeface design?<br>
    What do you know about it?<br>
    The players that you know?<br>
    The fonts that you love?<br>
    Where do you ear about their work?<br>
    Where do you see their fonts in use?</p>
    <p>Thanks in advance for all inputs.</p>
    <p>António Fonseca</p>
