    html: |-
      <p>Many thanks to anybody who invested their time and effort to answer my query, esp. Mr. Joe Treacey himself.</p>
      <p>@Stephen Coles:<br>
      you're right about Legato, in big sizes it looked a bit too lively for what i'd want, in smaller sizes it might just work as well as anyhting in A). My categorization was in reference to that particular project, not to the quality of the faces per se. I'd never question a groundbreaking design like Legato as an achievement in itself.</p>
      <p>@crossgrove:<br>
      In fact, i do like the big x-height, as it, as Mr. Treacey rightly states, does let the setting appear bigger than it actually is. Nonetheless, as often as i look at it, the caps do appear a bit too dark to me. And yes, since the project does incorporate almost 100% german text, this might be a problem.</p>
      <p>@ Joe Treacey<br>
      First of all, thanks for getting back.<br>
      Again, i didn't mean to question your work, competence and experience at all. I just had never heard of Treacyfaces before. And like you'd do before investing in a product or make your client invest in one, i wanted to check back about it's background. I frankly admit that i should have put my initial query more thoughtfully, and i do apologize if it implied any offence.<br>
      I just wanted to discuss this typeface as a practicing typographer on a factual level, you can of course ignore everything i stated that may be down to (my) taste and personal preference, i just wanted to illustrate the issues i was/still am on about:</p>
      <p>I still do find Forever does establish a rather uneven grey value when set in smaller sizes, no matter if tracked more loosely or by default.</p>
      <p>As stated above, i don't find the rather large x-height to be a problem, in fact i even find it (potentially) beneficial.</p>
      <p>And i still think the Caps are a bit too heavy for text settings, esp. in german setting they somewhat seem to jump at you.</p>
      <p>I didn't even mean to imply that these are design flaws, the way Forever behaves in settings, it's a 100% display face at least to my eyes, and probably an excellent one at that, it's just that we apparently need a rather dedicated text face to avoid the issues mentioned above (which may be actual issues at text sizes only). </p>
      <p>Again, no offence meant or implied. It's just what my eyes see and they're almost all that is there for a typographer to work with. And i usually trust mine.<br>
      Currently, we're thinking about using Forever in Headlines and the like and combining it with something else (see above), we have yet to test this option/combinations though.<br>
      Again – in case i came across offensive in any respect, i sincerely do apologize. Thank you for your input and the discussion.</p>
