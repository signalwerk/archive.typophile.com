      <p>Many thanks for your suggestion, Nick.<br>
      (Can you read thoughts re single-storey g? :-)<br>
      Opening up the tracking would of course solve my problem with the tight spacing (obviously), but the gap between lc r and e.g. lc a would increase even more, and the problem of the too heavy Caps wouldn't be adressed at all. Furthermore, as the work will be set in German with every noun beginning with a cap, this might become more prominent as when setting English.</p>
      <p>I've just done my homework myself (as i should have done in the first place admittingly) and there's quite a few alternatives, depending on what route to go with A, B, C denoting overall preference:</p>
      <p>A)<br>
      Amplitude<br>
      Fresco Sans<br>
      Kievit<br>
      Plus<br>
      Strada Condensed<br>
      Versa Sans<br>
      Vista Sans<br>
      (Auto – completely different, but could work)</p>
      <p>B)<br>
      Fago<br>
      PTL Manual<br>
      Sun<br>
      (Sanuk's not really a candidate)</p>
      <p>C)*<br>
      Legato<br>
      Geometric 212<br>
      Quay Sans/Foundry Journal</p>
      <p>*these would probably catch that quirkyness more than i'd want to.</p>
      <p>I also apologize for calling it "american display type quirkyness", the treatment of the edges and shapes in Forever remotely reminded me of Antique Olive as i just realized, and probably that was what didn't make me like it, esp. not for body copy :-)</p>
      <p>Thanks to all who replied for taking the time and effort.</p>
