      <p>I think Strada (not condensed), Vista, Fago and Amplitude seem to me to be most related to TF Forever. Fago and Amplitude seem to be likeliest to sustain longer passages at small sizes (though I haven't tested this). </p>
      <p>Whatever it was inspired by, Forever has the unmistakeable post-ITC ultra-high x-height, a hallmark of a lot of Treacy's designs. Given that, I'm very surprised to hear the caps appear dark. Not sure how much you would like that in text (even if you track Forever out as is suggested above). For the various reasons mentioned, maybe you want something with a smaller x-height. Is there any German text?</p>
