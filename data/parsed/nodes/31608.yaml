      <p>Hello, franzheidl —</p>
      <p>Rest assured that my TFForever was created from scratch, originally, by me. </p>
      <p>As such, it is "the real deal".</p>
      <p>It started from my spontaneous sketches, but most was actually designed by me right on the monitor. And then, naturally, tested extensively.</p>
      <p>The monitor-resolution samples at the point size you sampled them don't appear to me to tell you enough of the story. (In my humble opinion.)</p>
      <p>Treacyfaces, Inc. incorporated in 1984 with the royalties earned on the sales of my  TFBrynMawr series through Linotype, commissioned by their innovative type director and all around very nice person, Steve Byers. That series was developed starting in 1978. </p>
      <p>My Star Light and Star Bright designs appeared in the Chartpak competition winners catalogue in the Chartpak Velvet Touch Winning Faces competition in 1985, and they debuted in the 1986 catalogue. That started with ink on paper sketches, and sure was interesting to execute. The outlined stars were actually cut in amberlith (and rubylith, if rolls of that happened to be on sale that week) using a double-bladed X-Acto knife and french curves. A little while before vector art really came into its own on the desktop.</p>
      <p>I can tell you that we have by now hundreds of thousands of customers of just my TFForever, world wide. And would you believe that not one customer has ever complained about the spacing, or wanted to return it for an exchange or refund? It's true.</p>
      <p>An interesting sidebar: My tests show that our built-in letterspacing and kerning produces noticeably better and more consistent results than optical spacing turned on in InDesign (as a point of comparison). Customers that I've talked with about this wholeheartedly agree.</p>
      <p>Contrary to what you are seeing in that smallish JPG, the r design with its flared terminal does not open up any more of a gap than other sans do. In fact, in all sizes but especially in display sizes, the terminal design is advantageous in the way it both saves space and helps to maintain a distinction in shape recognition between the r and the character to follow it. Even often problematic follow-on characters like v w x y. The terminal itself was specifically designed to be less wide than other sans' r terminals, to solve the problem that many others have historically had with that part being (in my opinion) overstated.</p>
      <p>We have lots of customers setting German and other Western languages, and setting Eastern European languages with no problems. (No fonts have 'no problems', but we literally have no complaints and no returns.)</p>
      <p>Customers do have the freedom to track it more openly if needed. As long as you have enabled kerning, you will still benefit from that which we build into it. Last time I checked opening up tracking in all the major apps takes about a second. In any event, less time than it takes to write about it.</p>
      <p>And of course, point size range, surprinting, reproduction method, and paper are all considerations for setting any fonts more openly. Or, as it more often the case, more tightly. And with much additional hand-kerning adjustments.</p>
      <p>I spent many years in the quagmire of hand kerning set material before I started making my own faces. And I was determined that I'd fix that problem so that I would never have to face it again. And, so that art directors and other type users would be able to avoid it, too. That's why, as I introduced TFForever, I did so with 1700 kerning pairs per weight, far more than the 0 to 90 kerning pairs built in then, and more than the 500 that came later from competitors who were finally forced to 'add value' by doing something, anything, about their paltry or nonexistant kerning.</p>
      <p>It has been debated for decades whether a given font needs 1700 or more kerning pairs, if the font has been drawn and fitted properly to begin with. All I can tell you is that I make sure that our faces are drawn and fitted properly to begin with. And they still benefit from the added care.</p>
      <p>What I find most interesting about observations like this is the immediate need to classify TFForever as a display face. I look at it as more of a hybrid whose design allows the user quite a lot of utility to range between display, mid-size and text sizes rather effortlessly.</p>
      <p>I guess I would ask: What kind of point size(s) are you using? How extensive is your text?</p>
      <p>Did you know that one of the benefits of TFForever's size on the body and its x-height (which, by the way, is not outrageous) is that in text sizes, it looks about 2 point sizes larger than it actually is. And yet, it saves quite a lot of depth in long text.  Which is exceedingly helpful to magazines and catalogues, among others. And a big reason why they buy it and use it extensively.</p>
      <p>Just thought you might find that to be interesting reassurance and contrast, in light of your observations.</p>
      <p>Good luck with your search.</p>
      <p>Thanks very much.</p>
      <p>(Joe)</p>
      <p>Joseph D. Treacy<br>
      President &amp; Director of Typography<br>
      Treacyfaces, Inc. / treacyfaces.com</p>
