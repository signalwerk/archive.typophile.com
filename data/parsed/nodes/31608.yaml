    <p>A client of ours is completely in love with TFForver by <a href="http://www.treacyfaces.com" rel="nofollow">Treacyfaces</a>. I've never heard of that foundry before and would love to check before we actually buy/use it. I also see a few problematic issues with it, so i'd be very interested to hear of any alternatives in the same vein…<br>
    so here goes my questions:</p>
    <p>1) Does anybody have any experiences with fonts by this foundry? Are they ok in a technical sense/production-proof?</p>
    <p>2) Does anybody know wheter TFForever was inspired by something else, as I'd like to have the option of offering the "real deal" to our client, onyl in case there is any of course…</p>
    <p>Here's the issues i have with it, all IMO of course:</p>
    <p>– too tightly spaced</p>
    <p>– lc r shape does make for big white holes when followed by a rounded character or touches next character. </p>
    <p>– Capitals too heavy for my liking compared with lowercase, esp in the heavier weights.</p>
    <p>– overall a bit too quirky for my liking</p>
    <p>So if anybody could suggest some alternatives that avoid these issues and come across a bit more serious/less quirky in the details, i'd be grateful, as i feel this face isn't 100% up to the standard we'd want to supply, no offence intended.<br>
    Here's a test setting from their site (Regular and Demi):</p>
