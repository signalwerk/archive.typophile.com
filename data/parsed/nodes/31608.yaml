      <p>As with many faces developed during that time period, tight spacing was the norm for the day. I have purchased a face from Joe Treacy and found him easy to work with. I purchased TF Arrow, which is also tightly spaced. I just track it out to my liking depending on the size. I use only for display though. Treacy has been around since the early 1990s in the digital arena but has done work in the older technology as well. Give him a call.</p>
      <p>ChrisL</p>
