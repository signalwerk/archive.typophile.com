      <p>Hello Bob,<br>
      many thanks for your remarks. To clear this up: I didn't mean to have a go at the foundry/designer nor to imply anything bad about it. I just want to make sure we or the client don't run into problems later on (if we actually use it, that is) and had never heard of the foundry, that's why i was asking.<br>
      The only actual issue i see is that it spaces rather unevenly in longer text settings, which – in my opinion – is due not to bad spacing/kerning at all, but more to the character shapes themselves, and that's why i am still interested in hearing about alternative candidates. The font might work just fine for headlines, logos, etc.<br>
      The other issues i mentioned (quirkyness) probably are down to my personal taste, for my liking the face just tries a bit too hard to be original/deliver it's character. All in my humble opinion of course, others might just love it as it is and that's fine.</p>
