      <p>Interesting design, and nice analysis.</p>
      <p>There's a difference between not knowing how to make fonts versus <em>looking</em> like you don't... Quite often though it's pretty hard to tell the difference, and even though I'm not a fan of either I think the way one can incorporate "undesign" into a typeface does fascinate me. Even if the vast majority of "undesign" efforts are junk (what else is new?) I'm not sure this one is. And I might never be able to make up my mind...</p>
      <p>See this too:<br>
      <a href="http://typographica.org/typeface-reviews/dapifer/" title="http://typographica.org/typeface-reviews/dapifer/">http://typographica.org/typeface-reviews/dapifer/</a><br>
      Everybody knows Darden can make polished fonts, so there's something else going on.</p>
      <p>hhp</p>
