      <p>I like your review particularly the part with the metaphor for hammered metal, that’s precisely describing my impression of the font. The lowercase “g” is always a difficult letter, that offers a lot of room for personal opinion. Though i can’t agree, that i stumble upon it, when i read it. But when i take a second look, i think the regular lowercase “a” has a very rough round shape in the middle. And i instantly liked the concept of having a double story “g” for the regular font-style and a single story for the italic. Same goes for the “a”. The lowercase “c” has a bit of a <em>big head</em> especially in Extra Bold font-style.<br>
      All in all i think that it’s far from any <em>amateur-font</em>, but i think i see why you get an <em>amateurish</em> impression by taking a closer look. Anyway thanks for the review.<br>
      best regards</p>
