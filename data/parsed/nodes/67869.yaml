    <p>Hey guys, so this is my first run at a real logo for my photography. I've been trying for something clean, modern, not overpowering and artistic. I feel like i'm starting in the right direction but am struggling to bring it all into one piece. The hardest part is that I'm not just '"fill in your name here" Photography'. Its called "Socal Lag" but i'm also playing with the idea of incorporating my name into it as well. I feel like its complicated to make it simple because of the name but I feel like it can work! </p>
    <p>Thanks in advance for the harsh critiques! lol</p>
  html_clean: |-
