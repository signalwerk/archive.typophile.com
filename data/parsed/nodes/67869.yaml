    html: |-
      <p>K, you make a good point on the Lag.<br>
      Its meaning is in the slower life style that we have here. My business isn't just photography. While I do the normal weddings, senior portraits, head shots for actors and freelance jobs, I also do design for brochures, front end of sites, and other smaller jobs.<br>
      I wanted something that would show that it isn't the normal fast paced 'I'm here and then I'm gone' kind of vibe. I get to know my clients and there vibe before I start working with them, I feel like that makes a difference in the type of work I produce. I know its hard to express all that in a name but I feel like if I can capture just a little bit of that in the branding then after you meet me it will all click. Let me know if that doesn't make sense.</p>
      <p>I agree with the superscript of lag being confusing. I feel like when its all on the same line it doesn't flow as well to the eye. That may be because of the font choice. </p>
      <p>I have no strong feelings about the black element. I do like black and white tho, like most logos if I can create it to fit in B&amp;W then it is easy to create other versions in color.</p>
