      <p>I like Alex's extra space idea. It keeps it all on the same line and still plays with the laid back idea of what 'SoCal Lag' is. Jamming them all together just makes them seem like one word, forces them to be read too quickly and harms legibility. </p>
      <p>I'd also be cautious about using differing weights for the type as it'll give emphasis to whichever is heavier. Do you want 'Lag' to be emphasized over 'SoCal'? It's a common trend these days, and I'm wondering if it's appropriate in this case.</p>
