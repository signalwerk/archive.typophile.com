      <p>I’m not a native English speaker so maybe it’s just me but I keep reading either ‘so called Lag’ or ‘Social Lag’ into it. As long as you’re solely targeting people who immediately translate SoCal into Southern California this shouldn’t be much of a problem.<br>
      BTW, how would you speak out loud your studio name? Sometimes logos work well on paper but fail later because the name sounds odd when read.<br>
      And I second what Ross said, ‘lag’ prompts rather negative feelings (again, to me as a non-native E. speaker).</p>
      <p>The logo itself: I think ‘photography’ is set a tad too tight. Also, the lc- l and the UC. L could use a little bit of space. Otherwise the lc. l risks to disappear in smaller sizes.</p>
      <p>To me, too, SoCalLag and Photography still lack unity, maybe it’s the Ultra Thin weight and the rather big difference in size or the fact that ‘photography’ doesn’t visually align with the lower end of the ‘g’.</p>
      <p>Cheers,</p>
      <p>Jörg</p>
