    html: |-
      <p>I recently designed the specimens for <a class="freelinking external" href="http://commercialtype.com" rel="nofollow">Commercial Type</a>. </p>
      <p>You can see them <a class="freelinking external" href="http://abiabiabi.com/index.php?/project/commercial-type-specimens/" rel="nofollow">here</a>, and you can download them all on the <a class="freelinking external" href="http://commercialtype.com" rel="nofollow">CT website</a></p>
      <p>The grid was built to be easily adapted for a wide range of typeface styles (from Austin to Giorgio Sans to Guardian) while at the same time presenting each in a very reserved manner. I wanted the specimens to reference the plainspoken nature of late 19th century and early 20th century metal type specimens but with a very clean and modern edge. The specimens differ wildly in what they show for each typeface (compare <a class="freelinking external" href="http://commercialtype.com/typeface_images/giorgio/giorgio/Giorgio-family.pdf" rel="nofollow">Giorgio</a> with <a class="freelinking external" href="http://commercialtype.com/typeface_images/guardian/guardian_agate_sans/Guardian_Agate_Sans-family.pdf" rel="nofollow">Guardian Agate Sans</a> for instance).</p>
      <p>But I see you are doing this for personal use, so it need not be as (overly?) extensive as the CT ones.</p>
