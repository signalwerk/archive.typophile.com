    <p>Hi all,</p>
    <p>I am currently in a job which is primarily a PA for a finance company. However I have taken on a new role of redesigning Powerpoint tutorials which are converted into online tutorials.</p>
    <p>Does anyone have any good links about designing in Powerpoint or online tutorials. I would like to avoid the usual cheesy clip art and hope to redesign these learning materials in an attractive and modern way.</p>
