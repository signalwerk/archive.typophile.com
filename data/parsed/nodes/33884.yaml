    html: |-
      <p>I took a technical writing course this winter, and there was a section on PowerPoint presentations. Try to keep the text concise - maximum 6 lines per slide, 6 words per line. Colours should be high-contrast, and the text should be in a font that is readable on-screen. Graphics should be relevant to the text.</p>
      <p>As for avoiding cheesy clip art, avoid cheesy clip art.</p>
      <p> - Lex</p>
