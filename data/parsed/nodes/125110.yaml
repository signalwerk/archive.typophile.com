    html: |-
      <p>Character selection ‘unification’: Drag and drop the right image over the left — Voilà. One single character. (Especially useful for ‘i’s, ‘j’s, umlauts and stencil typefaces, obviously.)</p>
      <p>*Addendum: The font itself seems to be ‘<a href="http://jaydegarrow.wixsite.com/fonts/bad-grunge" target="_blank">Bad Grunge</a>’, by Jayde Garrow. (Not to be found on myFonts.)</p>
