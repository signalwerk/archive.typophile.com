  html: |-
    <p>Hello everyone,<br>
    often when I feed glyphs in the WTFont search engine, it breaks the glyph into various components, e.g. the "i" is broken into the stem and the dot. It gets much worse when I have to sometimes use fonts with effects or otherwise peculiar shapes. Do you have any solution for this?</p>
    <p>Also, is it just me, or is WTF returning slightly different results if one uploads different sizes of the same picture?</p>
    <p>Thank you in advance</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/glyph_break-up_0.jpg" width="370" height="658" alt="">
