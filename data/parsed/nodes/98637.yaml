      <p>I began experimenting with glyph substitution with this typeface, just to learn how to do it, and the idea popped into my head that I could use it to create clock symbols using Discretionary Ligatures. I finally figured out the "coding" and created created some very simple clock symbols that show any time in five minute increments. (That's an extra 144 glyphs per font!)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/holo_6608.png"></div><p></p>
      <p>Because this typeface is supposed to be layered, I built that into the clock symbols as well. The chart I created shows it best.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hole_5504.png"></div><p></p>
      <p>Does anyone think this is a useful or nifty feature? Or just a bother?</p>
      <p>And here are the missing characters from my pdf:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/holu_3653.png"></div><p></p>
