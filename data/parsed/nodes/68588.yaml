    html: |-
      <p>Nowhere nearly enough context here.</p>
      <p>Is the software running on Windows or Mac OSX? If so, then using the system default fonts is almost always a good idea unless there is a compelling reason otherwise.</p>
      <p>What Unicode coverage do you need? How many languages will the software be translated into?</p>
      <p>The <a href="http://en.wikipedia.org/wiki/DejaVu_fonts">DejaVu</a> fonts are pretty good for screen / UI. The Unicode coverage is excellent, it's legible (nice open apertures, large x-height, good balance between economy of space and not being too narrow, spacing is decent). It's not an artsy design at all, but it doesn't look frumpy or old-fashioned. It's also free.</p>
      <p>You might also look at <a href="http://en.wikipedia.org/wiki/Droid_%28font%29">Droid Sans</a>. It's very recent, a little square (which is very trendy right now), and even higher x-height and narrower than Deja Vu. Also free.</p>
      <p>If you've got budget and want to do something really creative, there's tons you can do. The <a href="http://gizmodo.com/5288932/palm-pres-fantastic-fonts-custom-designed-by-font-bureau-type-foundry">Prelude fonts</a> by Font Bureau for the Palm Pre are an awesome example.</p>
