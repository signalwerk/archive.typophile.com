      <p>Thanks for good suggestions, Raph! I especially like the Prelude fonts and it's very relevant to look at newer mobile phone fonts (I have also looked at Androids font, which also looks good) for some of the software. And yes, there is a budget :-)</p>
      <p>Unfortunately I can't go into much details here, because of confidentiality. The fonts will be used in the interface, for buttons, menus, body text and numbers. The Unicode coverage is important, good point!</p>
      <p>Sii, you don't need to get all Jacob Nielsen on me ;-) Let me rephrase, The font (family) should look modern and fresh, and at the same time be user friendly.</p>
