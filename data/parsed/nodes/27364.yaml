  html: |-
    <p>I’m looking for a serif typeface that is as thorough as TheSerif or PMN Caecilia — i.e., multiple weights, small caps, true italics, ranging figures, etc — but that isn’t TheSerif or PMN Caecilia. I can’t use TheSerif (long story why) and I can’t shake the feeling that PMN Caecilia is just a bit too precious (humanist) for this particular use. I’m tending toward slab(ish) serifs, but open to other suggestions, too. Any thoughts?</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080829115347/http://www.typophile.com/node/27522" class="topic-previous" title="Go to previous forum topic">‹ clean, fresh, ultra light sans ?</a> <a href="/web/20080829115347/http://www.typophile.com/node/27512" class="topic-next" title="Go to next forum topic">Best cut of Clarendon? ›</a></div>
