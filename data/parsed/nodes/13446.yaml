      <p>As you must already know the contribution of Otl Aicher to internationally recognized symbols and pictograms.</p>
      <p>Some background and additional reference information can be found at  <a href="http://www.biza-project.de/otl/start.htm" target="new'" rel="nofollow">http://www.biza-project.de/otl/start.htm</a>.</p>
      <p>Much of Aicher's images plus additonal pictograms can be found at <a href="http://www.piktogramm.com/no_sw/en_index.html" target="new" rel="nofollow">ERCO-Leuchten</a>.</p>
      <p>Other areas you should explore in terms of use of symbol, icon imagery and language systems (including GUI development) you can do a GOOGLE search on:<br>
      Advanced semiotic<br>
      GUI icon development (discussions of icon creation for computer interface)</p>
      <p>Good book on GUI by William Horton<br>
      <a href="http://www.classicsys.com/classic_site/cfm/books.cfm?ID=111&amp;topic=GUI%20Design" target="new" rel="nofollow">Icon Book: Visual Symbols for Computer Systems and Documentation</a>.</p>
      <p>I think designers often forget that more new symbols and icons are being developed for GUI than for architectural information signage.</p>
      <p>-----------------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
