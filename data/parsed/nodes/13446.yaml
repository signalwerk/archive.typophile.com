    <p>hello</p>
    <p>im very interested in pictogramms (symbols, icons), especially in their function as a substitute for typed words. i made an invitation for a party once for my brother when he moved in his new appartment. you can see it <a href="http://www.art.ificial.ch/jobs/wg.gif" target="_blank" rel="nofollow">here</a> (the top part is the front, the bottom part the back of the postcard - dont look at the typetreatment, its not too good). its simple, it was a rush job - but it shows what i mean.</p>
    <p>how do symbols evolve, and how do we perceive symbols? how does this "convention" on what symbols are internationaly understood (like the sportsymbols once made for the olympics) change or does it even exist?</p>
    <p>im just interested in a discussion about symbols and how they can replace written language sometimes, making things easier (navigation in a museum, driving in a car, getting an overview over a lot of different categories/subjects - the olympic sport symbols - etc. etc.</p>
