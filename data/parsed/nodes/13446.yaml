      <p>Hmmm, this is an interestering topic and one that I recently dabbled a bit in when I was working on my Thesis project for the Master's Communication Design program at Pratt here in N.Y. My thesis project was redesigning the New York City subway wayfinding system.</p>
      <p>While I went as far as creating a new typeface, and redesigning (and rewording) the signage, I also wanted to experiment in creating a custom pictogram system similar to those used in Olympic systems. Given the scope, I bit off more than I could chew. While I have completed my Master's degree, it is definitely a project that I continue to work on on my own time.</p>
      <p>Nick brings up some good points as one of the tasks that I found difficult to achieve was figuring out a pictogram for the term "exit". A word that shows its ugly head in multiple languages in every wayfinding system. Why can't we figure out an image to express that concept?</p>
