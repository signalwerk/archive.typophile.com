      <p>The old saw, "a picture is worth a thousand (or ten thousand) words" neglects a very important detail when it is applied to pictograms: the picture really needs to be unambiguous about exactly what it depicts. Otherwise, it's not even worth the single word or idea it is meant to convey.</p>
      <p>On the other hand, some symbols gain currency through extensive use, even if their meaning is not conveyed visually. The universal "No Entry" sign, a horizontal bar in a circle, doesn't really say much on its own, but over time most folks understand what it means. And I have yet to encounter a sign that says clearly and unequivocally "Ausgang/Ausfahrt, exit, salida, sortie,uitgang, uscita or way out (my favorite)."</p>
    html_clean: |-
