      <p>"Universally recognized signs and symbols have always been important means of communication. But why are certain primary shapes and configurations of dot and line perceived and remembered more easily than others? In this fascinating and now-classic study, the world-renowned typographer and designer Adrian Frutiger explores the development of signs and symbols in general and writing in particular, relating basic graphic principles and components to a wide range of historical, linguistic, and practical concerns. The author embraces everything from Egyptian hieroglyphics to modern company logos in his intriguing analysis of the way humans have always tried to express thought through graphic means."</p>
