    html: <p>UTS Universal Type Server is probably a good place to look for a start. It's by Extensis. They used to have Font Reserve and that was not so great with lots of issues, but UTS seems pretty reliable. I think they have plug-ins specific to Adobe Illustrator, but I don't remember the details on that.</p>
