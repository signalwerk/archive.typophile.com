    date: 2014-01-14T12:33:00
    date_raw: 14 Jan 2014 — 12:33pm
    votes: null
    html: |-
      <p>Universal Type Server has app-specific plug-ins for InDesign, Photoshop, Illustrator and QuarkXPress.</p>
      <p>Extensis had two previous server-based font management apps (its own Suitcase Server and the acquired Font Reserve Server), and then started over again with a new codebase for UTS to rectify a variety of architectural errors. That was quite some years back; UTS is now on version 4.</p>
      <p>The Universal Type Client is based on the same code as Suitcase Fusion.</p>
