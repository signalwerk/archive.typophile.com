    html: <p>Does Universal Type Server allow users to see what fonts look like without downloading the entire server library to their local machine? Part of the reason we're looking for a server solution is to allow users to more easily preview and utilize the fonts we already own. But we're currently running a trial of FontExplorer Server and it requires users to either download each font off the server individually or download the entire collection off the server before they can see what any of the fonts actually look like.</p>
