    user: 803
    date: 2014-01-08T17:18:00
    date_raw: 8 Jan 2014 — 5:18pm
    votes: null
    html: |-
      <p>Fonts on a server? Absolutely, no question it is the best way. I also recommend the server be read-only to all clients so they can't add or delete font files on the server; it is the server Admin's job to keep it organized properly and maintain good DRM.</p>
      <p>Slowdown? Nothing noticeable.</p>
