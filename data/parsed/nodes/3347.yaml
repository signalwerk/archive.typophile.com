    html: <p>I have to admit I've always had a hard time with gill sans. I've always thought it a bit globular. The uc B, for example--what a wierd proportion. High five to Gill for doing a humanized sans serif, though. In some ways, the wacky inconsistencies, odd proportions, and irrational variations in line weight (what's with the diagonal of the lc s?) give it character and readability. <br> <br><img src="http://www.typophile.com/forums/messages/4100/369.gif" alt="gill.gif"> <br> <br>Just a suggestion</p>
