  - id: 26035
    user: 909
    date: 2003-12-09T10:43:00
    date_raw: 9 Dec 2003 — 10:43am
    votes: null
    html: <p>I can't say what Gill was thinking, but I can point out some design issues for which that might seem like a reasonable solution. <br> <br>When a font weight gets that heavy, it is helpful to increase the x-height, allowing heavier horizontal strokes in letters with several horizontals such as a and e. <br> <br>However, once you get a really large x-height, if the i dot is to maintain an appropriate relative weight, it ends up above the descender height! Something has to give. One solution might be to make the linear part of the i much shorter than the x-height. Having tried this, I think at the extremes (Gill Ultra/Kayo), it looks as goofy as the miniaturized dot, because the main part of the i ends up so far below the x-height. So it becomes a question of which aspect of the design has to "give." <br> <br>My $.02, anyway. <br> <br>T</p>
    html_clean: <p>I can't say what Gill was thinking, but I can point out some design issues for which that might seem like a reasonable solution. <br> <br>When a font weight gets that heavy, it is helpful to increase the x-height, allowing heavier horizontal strokes in letters with several horizontals such as a and e. <br> <br>However, once you get a really large x-height, if the i dot is to maintain an appropriate relative weight, it ends up above the descender height! Something has to give. One solution might be to make the linear part of the i much shorter than the x-height. Having tried this, I think at the extremes (Gill Ultra/Kayo), it looks as goofy as the miniaturized dot, because the main part of the i ends up so far below the x-height. So it becomes a question of which aspect of the design has to "give." <br> <br>My $.02, anyway. <br> <br>T</p>
