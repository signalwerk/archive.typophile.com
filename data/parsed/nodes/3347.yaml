    html: "<p> Christian, don't forget: Gill was British... <br>But I personally love Gill Sans (almost as much as like Gill himself), since I don't value genericity. <br> <br>As for the lightness in the \"diagonal\" of the lc \"s\", that's a feature any real text font has: because of optical -and often reproductive- aberrations in small sizes, an \"s\" with balanced color at large sizes will actually look too dark in small sizes. I found this out when looking at the wonderful Lexicon specimen book. <br> <br>hhp </p>"
