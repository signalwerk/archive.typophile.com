  - id: 140906
    user: 1203
    date: 2001-07-13T12:00:00
    date_raw: 13 Jul 2001 — 12:00pm
    votes: null
    html: <p> All of Gill's lowercase 'p' are delicious, although I tend to love his cap Florentine 'R', especially in Perpetua. I agree with Joe on the italics as well. It was the "humanizing" of the face that makes it so beautiful, in my humble opinion. <br> <br>I'm not sure it has been 'proved' that Gill Sans derived from Johnston's face. I'm not arguing it didn't. Gill was in on the design of the Johnston face for the first three (or so) meetings. Johnston's face suffers from too much geometry in the wrong places and Gill avoided this with the humanist approach. <br> <br>I'm not sure I entirely agree (or disagree) that the English design the best faces. What about the French? I've come to appreciate the beautiful eccentricities, and I mean that as a compliment, of the lettering styles of the earlier part of the 20th century. I never did appreciate those faces, such as Choc and Vendome, until listening to Gerard Unger's seminar on French design. By the way, does anyone know of where I might find more information on Roger Excoffon? Preferably in English, but my brother speaks French. </p>
