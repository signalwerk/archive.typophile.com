    <p>Hi,<br>
    I am new to this forum and would like to ask your opinion/critiques on my new logo for a small design agency. The older one was created some time ago and now I'm not fully satisfied with it. It doesn't work very well on small sizes and looks a little bit old-fashioned to me. I've created several new versions with a modern look but can't decide which will work better. </p>
    <p>To keep continuity with the old logo I used same red and gray. The font is also the same.</p>
    <p>What logo do you think suits best for a small design studio? Do you have any negative associations with any of these logos? Any thoughts and opinions would be greatly appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Logo-0-old_4548.jpg"></div><br>
