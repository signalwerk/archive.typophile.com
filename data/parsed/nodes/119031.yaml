      <p>Hi and thanks a lot for the feedback! You guys are really very helpful!</p>
      <p>It's good to know that somebody likes the old logo :-). What if to make slight modifications of it and remove letters in order to solve problem with small sizes and add a star to the red square for the sake of a visual accent. I see star as a symbol of an achievement reachable through hard work, dedication and talent (hope it's not much trite and commonplace). And then it is probably better to move a red square to the right to the end of the usual direction of eye movement.</p>
      <p>What do you think of this? Is this version any better? Does the old logo looks old-fashioned to you? I feel the need for a more modern look buy maybe I'm plain wrong.</p>
      <p>I also made a version of the old logo without media at the bottom as JamesM  suggested.</p>
