  html: |-
    <p>What numbers should be included in a font that contains SmallCaps ?</p>
    <p>I'm working on a font that contains Oldstyle tabular, proportinal figures and Lining tabular, proportinal figures, what numbers should be included with the SmallCaps glyphs. </p>
    <p>Should there be SmallCap Oldstyle tabular, proportinal and SmallCap Lining tabular, proportinal figures ?</p>
