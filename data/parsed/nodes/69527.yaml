      <p>If you are working primarily as a graphic designer, you can use one of your own types.<br>
      For instance, Herb Lubalin with Avant Garde, Neville Brody with Industria.<br>
      But those are faces designed for specific projects (magazines).<br>
      I used to use my own faces occasionally when I was working as a graphic designer/art director, before I became a full-time type designer, but it was a compromising situation, because I could never be sure that I wasn't just using my typeface for a job because it was mine, and that some other face might not be better.<br>
      Now that I self-publish, I produce my own specimens. So you could do that too. In fact, all you have to do is sell a font at MyFonts, and produce a PDF specimen for it. Voilà.</p>
