      <p>Kevin, graphic design is a registered profession in the province of Ontario, which is unusual.<br>
      To become an R.G.D. you need a degree, some experience, and must pass a test.<br>
      So that kind of graphic designer has well-rounded abilities (although type design may not be part of it, not being included as a part of all degree courses).</p>
      <p>Whether with qualifications or not, graphic designers have a spectrum of abilities, and that applies to how they handle typography as well as things like colour, illustration, photography, motion graphics, interactivity, logos, environmental, &amp;c.</p>
      <p>Advertising art directors should be considered too, although they generally manage to fly under the radar, without even a Wiki entry for art direction. But what else could one expect of the stealthy bastards who orchestrate consumer culture?! </p>
      <p>Some people have a feel for display type, some for text work. Some of the best typographers I know are not graphic designers per se, but come from an editorial background: to them it's important how the text is read. By the same token, some of the worst typographers are graphic designer to whom text is nothing more than parallel grey bars in a page layout.</p>
      <p>As a type designer, whether of the Heroic DTP era, or coming to it in the more formalized environment of recent years, you have to product test your prototypes in various typographic layouts as part of the development process. Get that feedback loop going. This requires a certain amount of typographic skill. And one is also obliged to present one's designs in specimens: for competitions, if one thinks they are worthwhile, as well as for presentation to potential publishers and customers. So again, typographic expertise is required. In fact, designing a specimen which puts a typeface through its paces is one of the most intricate and technically demanding genres of typography . To a typophile, nothing is more admirable than a good type specimen.</p>
      <p>So it is far more likely that a type designer, especially one who designs and publishes their own original work, is a typographer as well, than a graphic designer may be a type designer. However, there are quite a few multi-person foundries where one principal concentrates on type design and production, and the other on the web site and marketing, or some other split of job function.</p>
