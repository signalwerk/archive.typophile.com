      <p>Many (but not all) graphic designers are typographers. A graphic designer is necessarily a particularly good or well trained typographer, however. It's not all that unusual for a graphic designer to know lots about expressive typography, using type to create mood and feeling, but very little about typographic history or the "rules" of typography. I see material with just basic errors, such as "dumb quotes" (a.k.a. "typewriter quotes") produced by folks who are nominally graphic designers.</p>
      <p>Speaking as a sometimes type designer, and somebody who is definitely a typographer, I can attest that not all typographers or type designers are necessarily graphic designers. I'm certainly not. I did a really mediocre poster for Hypatia Sans that my then-colleagues at Adobe very sensibly suggested wasn't worth posting on the Adobe type blog as a free download.  :(</p>
      <p>On the other hand, I've recently been collaborating with a graphic designer at work on some logo designs, and it's been a great process, because she has brought her graphic design sensibility into the process, and I have an understanding of letterform construction and balance that she lacks. I think our first logo was very successful, and I look forward to continuing work on others.</p>
      <p>Cheers,</p>
      <p>T</p>
