      <p>Typography is essentially the control of a single linear dimension (one-D) as the eye must travel linearly, and the mind parse sequentially to gain the logical meaning of typographically rendered language. Although the line folds back on itself to create columns of text, it's still not more than a fractional addition to the line.<br>
      Graphic design deals primarily with the planar (2D) space, emotional and instantaneous impacts. (3D or exhibition, 4D or animation are extensions and developments of the first two)</p>
      <p>Well executed design, of course, has a full complement of both.</p>
      <p>Regarding type design, it is the atomic to typography's molecular, and graphic design's chemical structure.</p>
      <p>IMHO, of course ;-)</p>
      <p>PF</p>
      <p>slowprint.com<br>
      ideaswords.com</p>
