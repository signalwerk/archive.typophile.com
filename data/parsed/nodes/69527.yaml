      <p><cite>Which one are you referring to?</cite></p>
      <p><cite>Type designer</cite></p>
      <p><cite>Then the answer is certainly no.</cite></p>
      <p>I think, it is just the other way around. The chance, that a type designer is a good graphic designer is a bit greater, because typography does not necessarily mean to use letters as elements of design. A type designer must have a closer look onto the single letters in enlargement and is confronted more with the forms of the letters, while a typgrapher of text-heavy books is confronted more with the harmony between spaces. While I can imagine, that the spaces also can be computed in future, I can hardly imagine a computer program, that is able to design a typeface.</p>
      <p>But in the moment, in which a typographer is using letters as design elements, he already is graphic designer, because then the forms of the letters are more than symbols of sounds (single letters) or closely defined notions (predefined letter strings / words).</p>
      <p>But you also wanted to know, if a graphic designer is necessarily also a typographer or typeface designer. My answer: No, because both, typography and typeface design require a deeper or at least a different comprehension of human perception. In a closer sense typography shall transport predefined ideas/notions (words or phrases) in the most effective way, while graphic design is playing more with the wide range of concrete forms of the notions.</p>
