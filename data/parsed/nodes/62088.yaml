      <p>Hey nick<br>
      So I spend 30 or so minutes looking it up for you. It’s not definite, but it seems that NBC Universal’s in-house team* in Universal City, CA uses your font. It includes theme park, web, PR, and promos. But I didn’t see it on stuffs designed by the New York team (news, daytime program).</p>
      <p>*nbc site’s meta tag, author: NBC.com Web Development/Engineer Team</p>
      <p>Note that NBC Universal is a subsidiary branch of GE. A company with their own teams of designers and uses multiple agencies. So I could be totally wrong. </p>
      <p>Here are the screen shot of the nbc site for prosperity  </p>
      <p><a class="freelinking-external" href="http://www.jwchen.com/share/nbcindex.png">website</a><br>
      <a class="freelinking-external" href="http://www.jwchen.com/share/nbcpromo.png">promotions a</a></p>
      <p>promotional posters<br>
