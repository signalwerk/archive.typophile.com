    html: |-
      <p>Many Israelis write cursive with a 'backhand' slant. It comes naturally from using the right hand in the same way that artists slant their lines and do hatching using the right hand. Conversely Leonardo with his left hand slanted his drawing and handwriting the other way.</p>
      <p>As an artist I sometimes take a drawing say in charcoal and place it face downwards and then rub on the back to transfer the image onto another paper or a canvas. It comes out slanted in the opposite way and therefore can be fresh to the eye.</p>
      <p>When I lived in Israel (in the 70s) I wrote Hebrew with a forehand slant as it appealed to me aesthetically. I liked the font Guttman Adii which slopes that way. This font does not seem to be readily available today.</p>
      <p>Here are my conclusions:<br>
      a) The default (if no one cares) is to have the slanted font 'backhand' - bottom left to top right.<br>
      b) Designing a font for widespread common use, have the slant 'backhand'.<br>
      b) Designing a font that is intended to be special or and for uncommon usage have the slant that is aesthetically appealing with that particular font design.<br>
      (In the case of my font Shuneet that will be 'forehand').</p>
      <p>Mike</p>
