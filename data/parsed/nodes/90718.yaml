    <p><a href="https://picasaweb.google.com/lh/photo/rL4kzOznMB8CKYfk2g0QTOAFD0TiseMad_FDRP6lklY?feat=embedwebsite" rel="nofollow"><img src="https://lh3.googleusercontent.com/-Qzp207Bl9xM/T1QR1tpAtqI/AAAAAAAACvU/Msw3jKK6tdY/s800/DavidHadash2.jpg" height="800" width="378"></a></p>
    <p>David Hebrew may seem like old news: it happens to be one of the most ubiquitous Hebrew fonts. Everyone has David Hebrew in some form or another installed on their computer (David on Windows, Raanana on Macs). In my recent book <a href="http://www.facebook.com/pages/The-Book-Jackets-of-Ismar-David/162614020459110" rel="nofollow">The Book Jackets of Ismar David</a> I touched on what made David Hebrew so popular:</p>
    <p>"Scarcity of good quality Hebrew type compelled David to embark on his quest to create a new typeface. His work began in 1937, and culminated in the 1954 release of David Hebrew by Intertype Corporation in Brooklyn, N.Y. David’s groundbreaking design was not a revival of an existing type, but was inspired by historic calligraphic hands, distilled to their purest expression. David Hebrew went on to become one of today's most popular Hebrew typefaces and may well be considered Ismar David's most recognized legacy in design. Its success may be attributed to the innovative design approach, but more likely it is due to its clarity, grace, and exceptional beauty."</p>
    <p>While all existing versions of digital David Hebrew are at best lookalikes of the original design, <a href="http://www.fonts.com/findfonts/searchresults.htm?kid=david+hadash#products" rel="nofollow">David Hadash™</a>  (Hadash means "new" in Hebrew) offers a faithful digitization of the original drawings, preserving the subtlety and better letterfit of the metal type design, subsequently lost in multiple generations of redrawing for new typesetting systems. This type is for the first time issued as a complete type family envisioned by the designer in the early 1930s, but never fully realized until today. It includes upright (called Formal), cursive (called Script) and monoline (called Sans), each in three weights, as well as extended character set for the upright (called Biblical), including a full set of cantillation marks (te'amim).</p>
    <p>It should be noted that the cursive (first issued in one weight by Intertype in 1950s) was the first true cursive Hebrew type of the 20th c. The never-before issued sans is noteworthy as one of the very few "humanistic" Hebrew sans types, closely following the classical proportions of the upright "serif" design. </p>
    <p>Despite having been designed over half a century years ago, the appearance of this long-awaited family today is remarkably fresh.</p>
    <p>Upd: See the official announcement <a href="http://www.fonts.com/FindFonts/RecentReleases/2012/DavidHadash.htm" rel="nofollow">here</a>.</p>
