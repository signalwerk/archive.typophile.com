  - id: 2108
    user: 1112
    date: 2003-06-16T18:00:00
    date_raw: 16 Jun 2003 — 6:00pm
    votes: null
    html: <p>I know the focus of this discussion (as is appropriate in a Typophile forum) has been on the typography, but now that I see that there's actually a graphic logo, I think you should get away from a Greek-inspired typeface entirely. (And actually, Trajan is Roman-inspired. Just saying.) <br> <br>The centaur image is strong -- I think it should dominate. The Greek-looking type really takes away from the potential power of the centaur. I think, looking at the Trajan variation, the type should be about 60% of its current size. I would suggest using a classic-inspired family -- <a href="http://www.myfonts.com/fonts/linotype/centaur/">Centaur</a>, perhaps? Just a little joke, but it is a nice typeface. Bears a couple of similarities to Trajan but is actually a full family and can provide you with a lot of flexibility for the myriad applications a school logo will engender.</p>
    html_clean: <p>I know the focus of this discussion (as is appropriate in a Typophile forum) has been on the typography, but now that I see that there's actually a graphic logo, I think you should get away from a Greek-inspired typeface entirely. (And actually, Trajan is Roman-inspired. Just saying.) <br> <br>The centaur image is strong -- I think it should dominate. The Greek-looking type really takes away from the potential power of the centaur. I think, looking at the Trajan variation, the type should be about 60% of its current size. I would suggest using a classic-inspired family -- <a href="http://www.myfonts.com/fonts/linotype/centaur/" class="link-external">Centaur</a>, perhaps? Just a little joke, but it is a nice typeface. Bears a couple of similarities to Trajan but is actually a full family and can provide you with a lot of flexibility for the myriad applications a school logo will engender.</p>
