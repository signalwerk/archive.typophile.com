    html: <p>I'm torn. I understand what you are saying Mr. Dave, but at the same time, I think the centaur is already dominant. The masculinity implied by Sophia (even with that name) overpowers the conservative Trajan. Trajan seems to obvious. If the Sophia is too liberal, perhaps Centaur might be nice.  And Mr. Dave's comment concerning flexibility is correct. <br> <br>Although, Centaur is no more Greek than is Trajan.  <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
