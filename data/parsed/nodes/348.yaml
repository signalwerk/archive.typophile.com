  - id: 2101
    user: 851
    date: 2003-06-13T15:42:00
    date_raw: 13 Jun 2003 — 3:42pm
    votes: null
    html: '<p>To get to GX weights and features for Skia on OS X: Install the Mac OS X Developer Tools CD (or download it from Apple Developer Connection; membership is free) and browse to Developer -&gt; Applications -&gt; Extras or Developer -&gt; Extras -&gt; Applications or something like that on your Macintosh HD. In there find and run WorldText.  <br> <br>Unfortunately you have to install the whole half-a-gig of Developer Tools to get to WorldText. But some of those tools are important anyway. <br> <br>In one of the menus, click on "Show Typography Palette." The Features tab works for Skia, Hoefler Text and Apple Chancery, and maybe a few other Apple fonts. The Variations tab works only for Skia. You can create a range of widths and weights with it.</p>'
    html_clean: '<p>To get to GX weights and features for Skia on OS X: Install the Mac OS X Developer Tools CD (or download it from Apple Developer Connection; membership is free) and browse to Developer -&gt; Applications -&gt; Extras or Developer -&gt; Extras -&gt; Applications or something like that on your Macintosh HD. In there find and run WorldText.  <br> <br>Unfortunately you have to install the whole half-a-gig of Developer Tools to get to WorldText. But some of those tools are important anyway. <br> <br>In one of the menus, click on "Show Typography Palette." The Features tab works for Skia, Hoefler Text and Apple Chancery, and maybe a few other Apple fonts. The Variations tab works only for Skia. You can create a range of widths and weights with it.</p>'
