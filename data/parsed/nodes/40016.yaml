      <p>Well, that’s like saying ’make a font work in English’. Since Visual Basic is a programming language written in English, as long as you have all the standard english characters, you’ll be fine.</p>
      <p>That said, I’m curious as to where this goal/request came from. I can’t say I’ve ever felt a need to have a font just for use with my visual basic programming ;o)</p>
      <p>Otherwise, if you mean ’rendered via a VB application’ I guess that depends on the type of application. If it’s a windows app, then you’d need a font compatible with windows. If it’s a web app, though, then that’s really not applicable.</p>
