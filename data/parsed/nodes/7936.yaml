    <p><img src="http://www.typophile.com/forums/messages/83/54815.jpg" alt="Airstream Logo"> <br> <br>So I saw this dilapidated graphic on top of an RV and was wondering what the font was? The company has since changed their logo, I guess this was only used during the late 80's very early 90's and finding another example was difficult, but I pinned it under the photo. Any clues for what it could be or what it is based off of?</p>
