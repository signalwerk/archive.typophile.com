    html: |-
      <p>Keeping the questions that timd poses foremost in your brain, decide on one element (whether that be a color, a typeface, a style of illustration, etc.). It's sort of an arbitrary decision, but you need a starting place. All other decisions and all other elements need to bear some relationship to this first element.</p>
      <p>As you apply more elements, you might decide that your first (arbitrary) element needs to be changed or modified.</p>
