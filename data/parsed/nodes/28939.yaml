      <p>Some more questions that need thinking about in conjunction with type choice</p>
      <p>What size is the book? (do you have a measure or a grid designed?)</p>
      <p>How is it being printed? (in colour, b&amp;w, laser, lithography; encapsulated to waterproof it)</p>
      <p>Should the audience be able to read it in a group? (and in this case perhaps be in a pool and showed the book from the edge)</p>
      <p>Is it important to have the whole drill on one page?</p>
      <p>Tim</p>
