      <p>Well, I imagine that a US equivalent of A4 (210x297mm) used landscape, with binding on the long edge will be the most useful, you will be best to choose a standard size so that folders, wire bindings or envelopes will fit easily and so your printer will run them without need for trimming.<br>
      Encapsulating is covering both sides and extending to protect the edges, laminating is protecting one side, but these terms are interchangeable in most circumstances.<br>
      I guess this is leading to a sans at quite a large size (14-18pt) with generous leading, the choice is still daunting, maybe try a whole selection of typefaces with a page of live text, print them out and whittle them down to what you feel works best or that you find most attractive. Helvetica may take a bashing these days but it can work.<br>
      Tim</p>
