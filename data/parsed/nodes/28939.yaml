    html: |-
      <p>Not sure of the <em>normal</em> hierarchy, but my first thoughts when faced with a project are how is it being produced (size, printing, stock, finishing), who is the audience (age range etc.), what is the content (images, illustrations, tables etc.) and what is the point of the piece (information, advertisement, promotional etc.). Other questions spiral from this. I don't really put one point as more important than the other.<br>
      Tim</p>
    html_clean: |-
