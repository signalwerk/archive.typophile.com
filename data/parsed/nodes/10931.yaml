  html: '<p>Ive decided I need to set up some sort of testing routine. At the minute Im looking at testing on OS9/X/Win98/XP, Flash, Distiller, Postscript print test from Quark Xpress. Have you any other suggestions? Also I notice Microsoft have a font validator app on their site: <br> <br><a href="http://www.microsoft.com/typography/developers/validator/" target="_blank">http://www.microsoft.com/typography/developers/validator/</a> <br> <br>Is this reliable enough to skip full Win98/XP testing? Are there any other similar utilities out there, or any for Mac OSX?</p>'
  html_clean: '<p>Ive decided I need to set up some sort of testing routine. At the minute Im looking at testing on OS9/X/Win98/XP, Flash, Distiller, Postscript print test from Quark Xpress. Have you any other suggestions? Also I notice Microsoft have a font validator app on their site: <br> <br><a href="http://www.microsoft.com/typography/developers/validator/" target="_blank" class="link-external">http://www.microsoft.com/typography/developers/validator/</a> <br> <br>Is this reliable enough to skip full Win98/XP testing? Are there any other similar utilities out there, or any for Mac OSX?</p>'
