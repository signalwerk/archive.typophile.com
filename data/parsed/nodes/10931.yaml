    html: <p>The MS Font Validator is an excellent tool for testing TT and OT fonts. I recommend using it not only for final font testing but also during production to catch little bugs that might otherwise slip by. In particular, I recommend running the Font Validator on a test font <i>before hinting</i>. Few things in font development are more annoying than finishing hinting a glyph only to discover that you have an invisible overlapping stem, correcting which will delete your hinting. <br> <br>In some respects the Font Validator is better than simply testing fonts for normal behaviour in apps, since there are plenty of bugs that may not reveal themselves in app behaviour. The Font Validator checks your font against the spec. <br> <br>On the other hand, I still recommend doing an install and print test. <br> <br>One thing you may find when testing FontLab generated fonts in the Font Validator is that you get a lot of error reports for the LTSH, HDMX and VDMX tables. This is due to a difference between FontLab's calculated values for these tables and the actual values reported back from the system rasteriser. You can fix these problems by downloading Microsoft's <a href="http://www.microsoft.com/typography/tools/tools.htm">CacheTT</a> and then selecting the FontLab option 'Use CacheTT program to generate device metrics tables in TT fonts'. This will run your fonts through CacheTT as part of the FL font generation, and will overwrite the FL calculated values.</p>
