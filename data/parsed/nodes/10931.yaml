    html: <p>I've not yet found any functional bugs (i.e. things that prevent the fonts from installing, rasterising and printing) if FontLab-generated LTSH, HDMX and VDMX errors are not corrected. In fact, in one font I worked on we were obliged to maintain the VDMX errors in order to ensure backwards compatibility with earlier versions of the font. <br> <br>If you do have a chance to fix these errors, i.e. if you have not released fonts or do not need to worry about backwards compatibility, then I think you should. Although the fonts will work okay with these errors, there will be discrepancy, e.g. in default linespacing, between fonts with correct and incorrect values. <br> <br>Apart from anything else, being able to confirm that tables in your font conform to the TT/OT spec can save you from a lot of customer support hassles. <br> <br>I presume that FontLab on Mac makes the same calculation errors, and I'm not sure how to fix the problem without CacheTT, which is only available for Windows.</p>
