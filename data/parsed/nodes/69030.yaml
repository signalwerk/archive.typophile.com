      <p>What Tomi is trying to say, is that this appears as a purely geometric shape, which happens to share similarities with a T. But, almost certainly it isn't a font.</p>
      <p>(You could find similar shaped Ts looking for "slab serif", but you'll notice that all will sport some sort of foot)</p>
