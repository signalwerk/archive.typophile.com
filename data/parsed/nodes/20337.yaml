      <p>Anyway, if you want my opinion, I'm tired of seeing cultural icons abused by designers.</p>
      <p>It's not that I have no sense of humour, but I tend to be more and more annoyed to see people targeting a single individual. And I don't care if it's a publically perceived "evil" figure. I just dislike it.</p>
      <p>In my opinion, Chris post was the most thoughtful and balanced, and of course it reflected the truth about the perception people tend to have. The Beatles, for example, as many people in the 1960s and 1970s, developed a fascination for eastern spirituality, which rarely led them to deepen their search. This is probably true of any generation. Any process of insight is costly. It seems the majority of people prefer to use things at a very superficial level, especially as we are tempted to spend a lot of idle hours on the web.</p>
