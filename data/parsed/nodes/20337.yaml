      <p>I suspect that type designer ( or a illo-cover designer) is in a position to speak with only just so much authority on politics/history/government. Including me. </p>
      <p>That said; my view is that no matter the system it can be benign (or not) but that contrary to Hrant's assertion it was not democracy but rather *industry* that allowed both a huge increase in populations ( via mechanised farming, longer food storage and transportation, and medicine) and a huge increase in our ability to kill via Machine guns, Bombs and Aircraft in the 20th century. I see nothing in a 'golden past' that suggests that monarchy was better in terms of the frequency of wars. The difference is population size + killing power. </p>
      <p>On the other hand I agree with Hrant to this extent: The US (like every other nation in history) is content only with governments ( democratic or otherwise ) who meet it's capitalistic/economic demands. Calling for democracy is as often as not a way to call for a regime we can better negotiate with. Democracies inconvinient to us often get invened in. </p>
      <p>Bemoaning the desire for consumer goods is easy for us. And no doubt the carrot that a 'system' or society can wield via consumer goods is very strong. But to me it isn't the power of these goods to shape politics that matters so much as the imapct of these goods on the environment that matters. Political ideology be damned; it seems to me that ecological sustainability is the real goal to worry about. </p>
      <p>But what do I know? Not nearly enough. That much I am sure of.</p>
