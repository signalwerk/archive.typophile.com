      <p>"Try to make a text typeface (one that other people would pay for and use) then you might see something else."</p>
      <p>Try to make a drawing (that otherr people would pay for and publish) and you might see something else too.  And about all your subconscious type talk:  I spend much of my time looking at drips and shapes and abstractions, so the subconscious is not a domain of text type alone.</p>
      <p>Another thing, does the world absolutely need more text type?  Is all of it not a complete luxury at this point?  I would say the same about illustration, paintings, and imagery in general.  I'm just in touch with how much of a luxury all of it is, and I love it.  You bring it to such a high state and end up sounding like a fine artist most of the time who thinks he'll change the world through his work.  Besides designers, the world could care less if all text type was in helvetica I think.  Where I come from most people communicate by just writing things down or hand painted signs and it seems to work just fine.  Let me know, I'm really just here to learn.  I have a great respect for type, as you do, but we differ on the reasons I think.</p>
