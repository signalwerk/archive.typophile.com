      <p>I pretty much agree with all that you have to say.  I don't know if it has been made clear.  I am both an illustrator and designer.  I work with type all the time, on magazine redesigns, posters, etc.  I have to make all these decisions about legibility and poetry and "voice".  None of this is new to me guys.</p>
