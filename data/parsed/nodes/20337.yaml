      <p>One of our local non-profit stores got sued by "Fashion Victim" the new owners of the Che photographic image. I googled and found this article:</p>
      <p><a href="http://thefrontweekly.com/print/36" title="http://thefrontweekly.com/print/36">http://thefrontweekly.com/print/36</a></p>
      <p>An excerpt:</p>
      <p><cite>Fashion Victim is suing Northern Sun Merchandising of Minneapolis, which has been peddling Guevara t-shirts for the past 25 years. Fashion Victim supposedly bought the rights to the famous image of Guevara from the photographer Alberto Korda in 2002, ignoring the fact that the image circulated freely in the public domain for decades and that the familiar two-toned stencil-like version of Korda's photograph wasn't created by Korda but instead by Irish artist Jim Fitzpatrick. The irony here, as a recent Utne Reader article points out, is that Fashion Victim manufactures its T-shirts in Honduras, a country that produces most of its exported clothing in sweatshops.</cite></p>
