      <p>In another thread, a while back, I not only explained how a monarchic system could best work, I even detailed how best to transition to it from this farce of a system we're plagued by now. Among other things, my scheme prevents familial succession. Civial war? Coups-d'etat? Who said any system can be perfect? But more than the least bloody (this is not a farm after all, I hope) I for one am looking for the <cite>least unfair</cite> system.</p>
      <p>You can posture and post-rationalize all you want, the fact on the ground is that democracy is simply not working - it's making things worse. "Massive historical ecidence" my finial. Democracy has been  made into a hitman for capitalism, a tool for tyrants, which is the only thing it can really ever be, considering human nature. Many of you here blame Bush for our problems (and nevermind that you were previously spewing that "don't blame" hogwash). Ask yourselves why he might be the biggest proponent of democracy in history (remembering that he's not some sort of visionary). It's not Bush talking, it's rampant capitalism, which benefits by democracy's power to replace nationalism with consumerism.</p>
      <p>The bottom line is that people are trained to build houses, make pizza, fly airplanes, and not to help decide matters of state. When you ask them to, all you're doing is leveraging their vanity and their lust for material goods to make them better peons.</p>
      <p>hhp</p>
