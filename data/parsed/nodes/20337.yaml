      <p>The consensus is in your head.  There is no freakin' "consensus" that, as you think, my work sucks.  But, of course, they are all peons.  Here you go:</p>
      <p>I love it. Subtlety is pleasant when you get it, but for most people who are on the go, ya gotta hit ‘em over the head.<br>
      —fontplayer</p>
      <p>I enjoy it. The Che symbolizing the used-to-be radical sixties folks now greying boomers with SUVs their iPods and sneakers :-) It is just plain fun, enjoy!<br>
      —ChrisL</p>
      <p>It isn’t about what Che really was, it was about the perception 60s youth had of him as a rebel. The youth of the 60s also misunderstood Eastern religions and philosophies as well but knew how to chant Om as they toked up. As a member of 60s youth, I was as guilty as the rest in my misconceptions at the time.<br>
      —ChrisL</p>
      <p>The only reason I don’t roll my eyes completely at the CA cover is the similarity of the Che image’s common appearance and the Apple iPod ad campaign.<br>
      —Chris Rugen</p>
      <p>I think they are be purposefully redundant. In other words I read it as a statement about how over-materialistic we are today. So much so that even something which can stand for something more than simple marketing is now being reduced to another tool to market to the masses.<br>
      —Tiffany</p>
      <p>i liked it, i think, because it wasn’t about che at all but rather a juxtaposition of mostly meaningless symbols — though symbols that people continually adopt as an expression of their values.<br>
      —ben millen</p>
      <p>the cool thing is that it inspired a discussion like this, which would indicate that it was a success on some level.<br>
      —ben millen</p>
      <p>Without having read the article, the image suggests shifting trends in the use of graphic design, exposing an ideological clash between Cuba’s political past and their impending future in the global marketplace. It’s not about a Cuban relationship to Apple, or Nike per se, but the effects of consumerism as a whole on the present design culture. Using multiple corporate elements helps convey this meaning (if you accept that Apple and Nike represent consumerism as a whole). I dont think I would’ve made that connection as swiftly had it been just an image of Che without the other symbols<br>
      —Graphic Fuzz</p>
      <p>I think showing the Nike swoosh AND the earbuds hints at consumer excess as well as the perceived “need” to be trendy.<br>
      —BruceS63</p>
      <p> the swoosh, the iconic earbuds &amp; che are all now ubiquitous parts of pop culture no matter when where or why they came from to begin with. Don’t like it? - too bad &amp; too late. So really, they are a kind of pop trifecta. The superimposition of two white marks over che gives the impression of complete pop saturation - or corruption - depending on where you stand. Anything less would fail to beat us senseless.<br>
      —Eben Sorkin</p>
      <p>I suppose the length of discussion* and readers of the dialogue validate the design to a degree.<br>
      —timd</p>
