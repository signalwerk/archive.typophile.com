      <p>Interesting that even a reformed revolutionary isn't allowed into an exhibition of "Che as icon". Here's the Guardian's take on it: <a href="http://arts.guardian.co.uk/news/story/0,,1788597,00.html" rel="nofollow">Sorry Gerry. You're just not the right sort for Che's V&amp;A party</a>.</p>
      <p>Trisha Ziff, the curator of <a href="http://www.vam.ac.uk/vastatic/microsites/1541_che/" rel="nofollow">Che Guevara: revolutionary &amp; icon</a> at the <a href="http://www.vam.ac.uk/" rel="nofollow">Victoria &amp; Albert Museum</a></p>
      <p><cite>... submitted her guest list, which included Mr Adams, a personal friend with whom she had worked on exhibitions in the past. She then received an email from Shaun Cole, acting head of the contemporary programme at the V&amp;A, who told her all guests had been approved "except Gerry Adams, who is not relevant or appropriate". Ms Ziff, already unhappy that the museum had removed much of the text accompanying and explaining the images, which has now been posted on the website instead, said: "I was gobsmacked. Inviting Gerry was not a stunt and it never occurred to me there would be a problem."</cite></p>
      <p>She and Mr Adams wondered if Guevara would also have been barred, had he still been alive.</p>
      <p>The explanation from the museum seemed to be that various fashion models had been invited to another exhibition opening at the same time, and one wouldn't want them bumping into the "irrelevant" and "inappropriate" Mr Adams.</p>
      <p>Meanwhile the museum shop will be selling copies of all the featured Che images, a Che-branded lip balm, a Che finger puppet, a Che chocolate cigar, a Che doll, a Che cigar box, Che T-shirts, Che stickers, Che neon signs and Che badges. Whether Che's works <em>Guerrilla Warfare</em>, <em>El socialismo y el hombre en Cuba</em> and <em>Critical Notes on Political Economy</em> will be available at the shop is not currently known by this author.</p>
