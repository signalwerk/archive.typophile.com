      <p>And I also watch the football with the funny ball.  Now really, in your argument about the masses is there such a difference between the two.  It's still a bunch of folks sitting around watching a ball.  You will tell me that soccer fans are just a higher being.  You make distinctions that just benefit what you like.  The round ball is good.  The BBC is great, except for the Irish stories.  Again, it's all the same.</p>
      <p>When I watch Brazil play, yes, I think of the slums, and what causes them.  But I grew up in a slum and something caused that too, called Communism.  What slum did you grow up in exactly?<br>
