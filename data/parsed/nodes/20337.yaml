      <p>My point is that, at this point, there is no difference, and I was trying to educate people about that fact, those who may not know.  Cuba, is a Capitalist country.  The currency is the Dollar, profit is key, they have all sorts of corrupt deals with European countries.  Say, Italy runs a paper company in Cuba, pays the government $20,000 a year per worker, and the government pays the worker $200.  My cousin is an accountant and has to hide these things from the employees at the factory.  So, when you talk about abusive labor tactics, Nike, Che, and I-pod are all in the same boat.  And, like Hrant, I'm trying to get people to open their minds. It may have come out of the blue for some because the design community is not aware of this stuff, Che is just an idolized pretty icon, but I thought my additions would jar some people into asking some questions.</p>
      <p>The other thing around here, which may come out in things I say, is that I see a very elitist attitude as type being the only solution to everything.  Things such as drawing a person is just wrong, etc. etc.  I am an illustrator, and an art director.  I use pictures, drawings, and type.  Such absolutism about type being of higher intellectual and spiritual value bugs me, so I may make fun of it once in a while.  I find a long discussion about what font is used in e-mail funny. No disrespect, it's just funny to me in the grand scheme.  And if you don't see the inherent comedy in that then you've been looking at type for too long, laugh at yourselves once in a while.</p>
      <p>thanks, er</p>
