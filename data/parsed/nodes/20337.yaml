      <p>It's emblematic you name music, since music seems a good example: while music per se can touch our deepest corners (in many ways), it's only in pop music elaborate ideas start to be conveyed through verbal language as well. This, depending on the use, can reinforce or weaken the emotional facet, but nonetheless lyrics articulate meaning, a thing which is not possible in classical or instrumental.</p>
      <p>By saying this I'm not even remotely implying analytical thought is, or should be considered something superior to mythic, symbolic or poetic one. In fact, poetry could be the best example: it's part of "the arts", but according on how you use it, you could convey meaning the most effectively, because you can be partly analytical as well.<br>
      In the end, it's all about a "common language", a language of communion.</p>
