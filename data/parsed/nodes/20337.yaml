      <p>"In 2001, after his nephew Dipendra purportedly staged a murder suicide, killing most of the royal family, including King Birendra (Dipendra's father, and Gyanendra's brother), Gyanendra became king again.The royal massacre has remained a controversial subject. The official investigation report mentions that Dipendra was drunk and was not able to control himself and yet it claims that within less than half an hour he carried four weapons and fired indiscriminately. Moreover, Dipendra was right handed and the entry wound that killed him was found on his left temple. This has led to speculation as to whether Dipendra was wholly responsible for the killings.</p>
      <p>Given these circumstances, some Nepalese have lost the faith they had in the monarch as an incarnation of a god."</p>
      <p>I would add that according to a Nepalese, many in the country suspect that the current king himself staged the killing of his brother and family, doing the Hamlet story more thoroughly. </p>
      <p>In any event, the new king dissolved parliament and tried to rule since 2001 as an absolute monarch, as Hrant would have it. There was increasing civil war, and in April the King finally gave in to pressure from the rebels, including the 'Maoists', and the international community, including the US and India. Five days ago, the King was stripped of all power by the parliament. </p>
      <p>Almost everyone would say that the replacement of the King by a more democratic government, representing the will of the people and ending the civil war was a positive development. And that pressure from India and the US was a good thing. </p>
      <p>But not, it would seem, Hrant, who continues with his crackpot reactionary politics in the face of massive historical evidence to the contrary, and the current fact that most of the poorest countries on earth have had some kind of absolute ruler--including Cuba. </p>
      <p>Hrant has been repeatedly challenged by a number of people to explain how you can have a good process to change rulers, or remove bad rulers without violence other than by a democractic process. And he doesn't answer but changes the subject to foreign wars (which absolute rulers are equally good or bad at starting), or starts insulting the challenger. </p>
      <p>As soon as you ask Hrant to get off wooly generalities like 'the empire', and get specific, he never answers. Now he claims that he focuses on 'reality' as opposed to 'formal accuracy'. In other words, no matter what evidence you give, he has given himself permission to ignore it.</p>
