    html: |-
      <p>Without having read the article, the image suggests shifting trends in the use of graphic design, exposing an ideological clash between Cuba's political past and their impending future in the global marketplace. It's not about a Cuban relationship to Apple, or Nike per se, but the effects of consumerism as a whole on the present design culture. Using multiple corporate elements helps convey this meaning (if you accept that Apple and Nike represent consumerism as a whole). I dont think I would've made that connection as swiftly had it been just an image of Che without the other symbols.</p>
      <p>I think your point about the treatment needing to be subdued or blown to the extreme is a good one. This piece falls somewhere in the middle, which is why it feels passé.</p>
    html_clean: |-
      <p>Without having read the article, the image suggests shifting trends in the use of graphic design, exposing an ideological clash between Cuba's political past and their impending future in the global marketplace. It's not about a Cuban relationship to Apple, or Nike per se, but the effects of consumerism as a whole on the present design culture. Using multiple corporate elements helps convey this meaning (if you accept that Apple and Nike represent consumerism as a whole). I dont think I would've made that connection as swiftly had it been just an image of Che without the other symbols.</p>
      <p>I think your point about the treatment needing to be subdued or blown to the extreme is a good one. This piece falls somewhere in the middle, which is why it feels passé.</p>
