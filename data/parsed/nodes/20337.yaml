      <p>I did not say I was annoyed by the use of an image which has become ubiquitous. My displeasement comes (and will always come) from what can be called a "scapegoat" syndrome. Evil acting is not partial, but this does not mean being "liberal" or addressing a problem by firing against a single individual solves anything. It leads only to a growing resentment.</p>
      <p>Surely Edel was aiming his cover design to a specific audience, and he was addressing something he considered important. But what does it mean "an homage to strange power of brands"? If he's sure his criticism went through, then he succeeded. I'm not the qualified audience to understand this. I may know poverty as we had in Italy in the early 20th century (part of my grandfathers were farmers and very poor) but I barely know who Che Guevara was, so I think it's not essential I get this particular message.</p>
      <p>Whatever message Edel cared about, the important is if it's received with an openly critical attitude by people who should get it. Visual suggestions rely largely on their context, but if a cliché helps, welcome.</p>
