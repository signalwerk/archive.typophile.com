      <p>I have to say I can't remember what I "meant" by wearing the T-shirt. Even if it was an attempt to provoke, I certainly didn't and don't intend to "communicate" by wearing certain clothes.</p>
      <p>Of course people interpret T-shirts in various ways, whether there's text on them or not. Those interpretations are sometimes interesting, often manipulable, occasionally dangerous. In this case, one would be forgiven for thinking I was a supporter of the Cuban Revolution. I'd heard, probably from the Guardian, about directors of French companies being barred from the USA if their company supplied spare parts to Cuban x-ray machines, and that pissed me off. I'd also heard, probably from Michael Moore, about the Cuban health service being far better than the USA's, and that pissed me off too. The American embarrassments of the Bay of Pigs and the Cuban Missile Crisis seemed, inexcusably, to explain their isolation of Cuba. So I had a few things to talk about over a drink if someone approached me because of the shirt. But I was also well aware that I wasn't being particularly daring wearing the shirt. For a start, Massachusetts is not Miami. And the police normally let people wear stuff like that: getting arrested is unlikely. The biggest risk was probably that I might be thought of as silly.</p>
      <p>Perhaps a couple of years before TypeCon 98, I'd turned up to the Royal Courts of Justices on the Strand to hear Helen Steel and David Morris (the <a href="http://en.wikipedia.org/wiki/McLibel" rel="nofollow">McLibel</a> two) defend themselves against McDonalds. I wore a shirt that said "It's time for all honest citizens to turn to crime". I rather liked the idea of the juxtaposition and thought I was being a bit daring. In the event... I felt like a teenage jerk and never wore the shirt again.</p>
      <p>During the "smart sanctions" bombing of Iraq (1991-2003), bearing in mind <a href="http://www.rejesus.co.uk/expressions/faces_jesus/gallery/che.html" rel="nofollow">a Jesus-themed T-shirt of Easter 1999</a>, I told a friend I was thinking of having a T-shirt made up in that style but depicting Saddam Hussein instead of Che or Jesus. If asked, I'd perhaps have made some comment about supporting neither Saddam's murderous regime nor Clinton's. It could have inspired some interesting debates in pubs. But there would have been serious risks: my favourite café in Cardiff was run by a lovely Iraqi man (who was later to tell me that everyone in Baghdad was waiting eagerly for the Americans to arrive). Some other Iraqis, who helped me out when I urgently needed a car stored for a week, had several edgy rottweilers on their semi in Rumney. Provoking such people is not big or clever. The friend, who might himself have been interested in wearing a Gerry Adams themed shirt, strongly advised against the Saddam shirt.</p>
      <p>After that I mostly lost interest in clothing that can easily be (mis)interpreted politically, apart from wearing a long black leather coat to ATypI in Leipzig. I checked with Adam Twardoch whether he thought it likely that it would be interpreted as a Nazi symbol. He reassured me it would not – however he still takes some pleasure in reminding me of my ridiculous outfit at that conference. Sadly I don't think it inspired any debates to rival those where the rehabilitation of blackletter is discussed.</p>
      <p><em>Edited to change "interpreted" to "(mis)interpreted"</em></p>
    html_clean: |-
