      <p><cite>Either join in and work for what you’re so passionate about or just go about working for the man. But don’t work for the man and wax poetically about the struggle. Join it.</cite></p>
      <p>Edel, I know we citizens of the USA are all ignorant bores and whiners (joke), but there are actually people here who do a tremendous amount of good work and are extremely involved in political struggle. You just don't happen to hear about it because we talk about type most of the time. Occasionally our politics will come out in a discussion, and that is something I enjoy. I enjoy reading your point of view, but hate hearing your assumptions about mine or those of anyone else here (even *gasp* hrant).</p>
      <p>I liked your cover because that particular image of Che is definitely a "brand" removed from the reality of who Che was and what he believed. The Nike swoosh and the iPod earbugs are equally removed from the reality of the production of shoes and personal electronics. </p>
      <p>I disliked your cover because of what isn't clear. What's lost, unfortunately, is the difference between Che, the person, and Nike/iPod, the corporations. It's not just that a different political philosophy is represented (communism vs. capitalism) but also the unfortunate juxtoposition of individual/corporation that evokes a particular political issue in the U.S.; the increasing trend toward assigning the rights of individuals to corporations:</p>
      <p><a href="http://en.wikipedia.org/wiki/Corporate_Personhood" title="http://en.wikipedia.org/wiki/Corporate_Personhood">http://en.wikipedia.org/wiki/Corporate_Personhood</a></p>
