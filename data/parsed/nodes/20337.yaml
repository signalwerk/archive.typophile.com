      <p>Essentially, except for voluntary immigrants who have moved to the homeland of a different ethnic group in search of greater economic opportunity, everyone should be free to live in an independent soverign nation of his own cultural group so as to be completely safe from being a minority. 99.99% of the world's people should be part of a majority of at least 95% where they live. And, yes, this applies to the Inuit and the Hawaiians too.</p>
