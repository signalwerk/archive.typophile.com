      <p>&gt;What is “victim mentality” to some might be a reality to others.</p>
      <p>I don't know if the term "victim mentality" is precisely defined, but it is often used in both psychology and sociology to describe an outlook of passivity and fixation on blaming. </p>
      <p>It is a real phenomenon, and not healthy and not helpful. It is also easy to slip into. One of the sites I just found googling on the term explained it using the ideas of the famous psychologist Victor Frankl. When Frankl was in a Nazi concentration camp he found the key to survival in rejecting a victim mentality, even though he was certainly a victim. Suffering is a very real part of life, and some of us are dealt immensely tougher hands than others. But how we respond to our situation is in every case partly our decision--that is what Frankl emphasized. </p>
      <p>Tiffany, I don't think it is impolite to bring this issue up. I think it is an important issue. How much any individual suffers from a 'victim' mentality is up to them to search their own soul and decide. It is not my call, and I'm sorry if it sounded like I was making any personal judgment, which I am not doing. </p>
      <p>I do note, however, that a lot of political venom is spit out on typophile in blaming, and very little energy in discussion of positive alternatives. Your discussion of EULAs is a good example of a healthier way: positively trying to make a difference, rather than just grumbling about 'the man' 'the establishment' 'the system' etc, etc.</p>
      <p>I am just suggesting that a fixation on blame is not a very healthy or productive thing. I'll leave it at that.</p>
