      <p>But I don't have a problem with you saying that typography is not everything, or the best thing about communication; I also don't have a problem when you say that type design is not a huge factor in society. But really, neither is design as a whole. Artists and graphic designers have this thing for thinking they can change the world, with their manifestos and and flowery conference openings. They can't. And your cover doesn't really have more effect than the typography inside, overall. Illustration, photography, etc. work their magic in the conscious realm, while things like text fonts, and text itself, do so mostly in the subconscious. So we're really in the same boat in terms of power... and at least type designers know they're powerless!  :-/</p>
