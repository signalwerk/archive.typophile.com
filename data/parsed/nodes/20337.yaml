      <p>Well, I love cats too, and a cat with an uzi is just plain funny.</p>
      <p>Let me try to answer some things here.  Not a chat room pro so bear with me.  I'll start from the last post.</p>
      <p>No, I didn't have the image stashed somewhere.  I actually haven't done anything with the straight Che image since I was a kid.  This is why I thought, for a biographical story about me, my work, and another on Cuban design in the same issue, this image made sense.  I have drawn Che posters in the background of drawings I did when I've traveled to Cuba to visit family, etc.  Some of those have been published.</p>
      <p>I think some of the problem is that people see the image on the site here and may not realize that it's meant to be seen, as Eric first saw it, at the Newsstand at Barnes and Noble or Borders or at a library.  Or in your mailbox if you subscribe to CA.  You look at it, makes you wonder what it's about, you look inside for a credit or info, and you might go ahead and read the inside stuff.</p>
      <p>I think part of the problem is that the original question assumes that this image was done for a bunch of type and design geeks like ourselves that spend the weekend on a chatroom discussing the intricacies of serifs.  I didn't do it for those folks alone.</p>
      <p>When you start working for magazines you realize that what the publisher wants is their stories to be read and their magazines to be purchased by as large an audience as possible.  So, I wanted Joe Schmo at the Barnes and Noble to be looking around and go "hey, it's Che, and i-pod, and nike", funny, what the hell is this, etc.  </p>
      <p>I like to communicate to a lot of different people.  My dad never got past the sixth grade but there's nothing like the feeling when I show him something and he gets it, laughs, asks questions, etc.  This is who the world is made up of, not type geeks.  If if works for them too, then great, but I'm not going to shelf an image because the art police might come after me.</p>
      <p>About Fredo's comment:  I don't think you need my life story to "get it".  I've had plenty of people e-mail or have a reaction without knowing much about me.  And there was a lot of talk about it here before I came into the picture.  I thought my info would just help people learn more about it.  </p>
      <p>I tried to give some info for anyone that looked at the magazine.  On the contents page there is a title, caption and credit.  It reads:</p>
      <p>Cover: "Brand CAChé".  "A wired Cuban generation seeks the status of our logo culture as we seek the rebel status of theirs"</p>
      <p>With those few chosen words I tried to describe a couple of ways that the image can be read, which was my intent, for it to be read in several ways.  I guess some people have trouble with that.  My background is in Painting and fine art so reading something 100 ways is what I was taught to do.</p>
      <p>One person that seems to be on the money on a lot of this is Eben Sorkin:</p>
      <p>He says "To me it just looks like an homage to strange power of brands."  Bingo, that's what I was after.  That's why it's called "Brand CA-Ché"  How they're all a brand, Che, i-pod, nike, even CA, and how people just get hypnotized by them.  Ad agencies throw around the term "brand cache" all the time. How to make your brand sing, blah, blah.  And when I go to Cuba, Che is treated the same way.  The one place you think would honor him has him plastered on watches, cigars, lighters, on and on.</p>
      <p>And on Eben's comment about going off topic, I meant the abusive stuff or things that I read 3 or 4 times and can't understand.  I think this is a conversation, it should go all over the place, about music, tv, culture.  I was just once on an illustrator's chat thing, there was a great intellectual subject at hand and somebody just came in and derailed the whole thing into a conversation about troubles he was having with his family.  So, it got me off the chat rooms for a while.  Rather be working instead.</p>
      <p>thanks, Edel</p>
