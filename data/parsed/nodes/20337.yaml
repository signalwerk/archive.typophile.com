      <p>Text type is in a "high state" exactly because it's <cite>not</cite> fine art. And almost none of us do it to change the world (although some of my own type does have a "political" angle - but that's extremely rare in the field). Mostly we do it because we enjoy it. In spite of everything. But that doesn't make it art - as long as the point is to serve others, and not merely express.</p>
      <p>In everything a person does, he strikes a balance between<br>
      pleasing himself and accomodating society. Each of strikes a<br>
      different balance, depending on so many things, including<br>
