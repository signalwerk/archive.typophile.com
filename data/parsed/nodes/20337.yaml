      <p>To me, the problem with asking such statements (is bombing X country right if they are commiting genocide?) is that it seems ignorant of history. My basic response, well, yes, if you are going to ignore reality until it turns into a predictable blood bath, then somebody needs to do something to end the bloodbath.</p>
      <p>Tragedies like mass killings in Kosovo don't just appear out of nowhere like a Jack-in-the-box. Deliberate policies led to the dismembership of Yugoslavia, including manipulation by the World Bank and inter-capitalist competition between Germany, France and the U.S. The tragedy resulted from capitalist international infighting and it probably won't be the last time we see such events.</p>
