      <p>Thanks Edel. I just need a regular break from my labors, so I go to Typophile, learn and occasionally mouth off on political topics. I once read that one of the  greatest threats to civilization is "boredom with established truths", such as the superiority of liberal democracy. That's why I make it a point to answer the haters. </p>
