      <p>I think many people have come to think of image as being more important than what it stands for.  What matters too much to some is being chic. Are we becoming a more shallow world? Probably true for the more "sophisticated consumer"--after all, isn't a designer logo required to be prominently displayed on our clothing to be truly chic?. Real people who have real struggles each day for basic needs don't have this luxury.<br>
      There is type on things but mostly branding. Edel showed a Time magazine cover and said it had no type on it. We have become so accustomed to the icons of our modern era that we no-longer consider the letters T-I-M-E in succession as a word. Type and letter forms are also visual images.  Communication happens either way.  It rarely is the intended message though. That is why graphic design is much harder than it is given credit for (if done well). Perhaps if we consider that the job of a magazine cover is simply to get someone to open it instead of getting the total meaning of the written story, we can find a bit more success in what we see done every day but still strive to do more when given the chance.</p>
      <p>ChrisL</p>
