      <p>Hi everyone,<br>
      This is the guy responsible for all this trouble!  I was looking around to see if anyone thought anything of my CA cover and landed here.  Glad it started up some discussion, it's great when a simple piece of art can do that these days I think.</p>
      <p>Let me put out some info that might help understand the image a bit.</p>
      <p>CA was doing a feature on the last ten years of my illustration work.  I do a lot of work for The New Yorker, TIME, Rolling Stone, etc.  I'm also an art director.  I found out they were also doing a story on Cuban design in the same issue so I sent this image for them to consider for the cover and they loved it.  Probably because they thought it would start some conversation such as this.</p>
      <p>How I came up with such brilliance!:<br>
      Well, I know it's not freakin' rocket science here, but it did make me chuckle.<br>
      I was born in Cuba in 1971, grew up in the "Revolution", lucky me.  Anyways, I must have drawn this image of Che about a hundred times when I lived in Cuba, starting around age 3.  It's everywhere, so it's what I drew, along with tanks, guns, and missiles, cause that's what was on t.v. there.  American kids draw superheroes and cartoons instead.  Che was my Mickey Mouse.</p>
      <p>I figured after all this time, I could do one more drawing of Che, kind of coming full circle after having left Cuba and "making it" in Capitalist U.S.  I thought maybe I had some license to mess with the image since it has so much to do with my biography.  A lot of this was lost on people that don't know me I guess.  But if one where to read the story inside you would have learned a lot about my background which helps put the image in some context.  </p>
      <p>How I came up with the idea:<br>
      My family that is still in Cuba just got access to the internet, e-mail, etc.  They are just learning about these i-pods, tech gear, brands, etc.  So I've started gettting e-mails from them requesting things like memory sticks, i-pods, things with brand names, etc.  Years ago I would get letters from them asking for medicine or food.  So, the idea that Cuba is slowly changing into a capitalist society is what came of this communication with my family back on the island.  And this image was the result.  </p>
      <p>Another thing that has bugged me over the years is all these people with Che t-shirts and the whole Che cult.  People that have no clue what a cold blooded killer Che was and how many people's lives were ruined by the Cuban revolution (Not well to do folks, but artists, musicians, poets, homosexuals, or anyone that had individual ideas and expressed them.)</p>
      <p>So,  people here in the U.S. that are all underground and hipster and "original" with the Che gear and that all wear the same brands and listen to their i-pods annoy me.  They try to act all rebel and counterculture but they're all fitting in in their own way.  I think this image worked for me as a criticism of such an attitude as well.</p>
      <p>I am very well aware that doing anything with "Che" is the biggest cli-"Che" ever.  I went ahead with it because I figured it would tick off some people and, if anyone knew me, they would realize that I just like to do that sometimes.  I feel some designers, artists, etc.  put up these rules, "oh you can't do that, gotta do it this way, must be super original always", it's a very American, western way to look at things.  It's not the way I grew up making imagery, we take one thing, do something to it, do something to it again.  Go to any country in Latin America and you'll see this kind of stuff, artists commenting on culture, on each other, a dialogue, which I think doesn't happen in the U.S. as much.</p>
      <p>Well, that's it for now.  I'm not much of a chat room person but I registered here, I'll check back and answer any questions you guys have.  It's great to talk about art, design, type, very smart stuff.  Not so crazy when the thing goes off the topic.</p>
      <p>Oh, and the machine gun cat is just freakin' awesome.</p>
      <p>Thanks for all the comments.</p>
      <p>Edel</p>
    html_clean: |-
