      <p>We've had major great power conflicts <em>between states</em> on average every fifty years for the past 250 years. It hasn't made any difference at all whether the states involved were monarchies, republics, parliamentary democracies or dictatorships. They have all been involved in the same global competitions for power, resources, territory and influence. The number of people killed in these conflicts, especially in the 20th century, increased because the technologies for killing have improved.</p>
      <p>In the same period of time, though, England has not had a single civil war, despite the fact that almost its entire previous history had consisted of regular periods of dynastic, regional and class warfare. What changed in the late 17th century was the role of the monarchy, which became circumscribed by law and most of its powers devolved to parliament.</p>
      <p>I sympathise, Hrant, that you live in a country with a particularly debased and corrupt pseudo-democracy, designed by 18th century oligarchs to maintain power in the hands of their class, but this romantic idea you have of monarchy is very naive. It certainly isn't any kind of solution. Monarchies are systems of familial wealth gathering established by violence and maintained by a mixture of mythology (the 'divine right of kings') and repression. It may be frustrating that protesting the actions of your government seems to have so little effect, but it beats having your tongue cut out.</p>
