    <p>I was at BN tonight, and I picked up the most recent issue of CA. Now I really like CA, so don't think I'm knocking it. See cover. I'd like to hear thoughts on the illlustration, whether it's implied meaning (commercialization/exploitation)  could have been expressed with more clarity and sophistication. My thoughts after a few seconds were, the illustration was repeating itself multiple times over, given the audience (us) the point would be made immediately w/o the swoosh or 'pod buds. IMHO</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Che_5533.jpg"></div><p></p>
