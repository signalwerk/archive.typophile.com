      <p>I think the image is graphically (optical-grammatically) as accomplished as any text type. It relies on a well-considered juxtaposition of white and black (notan). </p>
      <p>Additionally it relies on a strategic fusion / friction of iconic images. That is, it relies on, or exploits, the friction of images with a huge store of tacit, ambiant, positive and negative associational baggage: political, socio-cultural, ideological. This is what it does. It exploits these things in a primitive pre 'conceptually-fixed' state.</p>
      <p>That makes it at once iconoclastic, unsettling, and engagingly satirical. A hoot and and an outrage. My / my generation's allegences then and now are interrogated. I am asked: what happened?</p>
      <p>I am not told what to think, because the image is not a front for a readily circumscribable message. I am just presented with a stark juxtaposition. My baggage relative to these iconic markers is the echo chamber or amplifier for the interference pattern set in motion by a simple juxtaposition. I am asked to consider the meaning for me of these iconic things and I am asked to consider the meaning of their co-inherence in one image. If I have no baggage the image passes me by and I pass it by. If I interrogate it, it interrogates me.</p>
      <p>The image acts. It has a place.</p>
