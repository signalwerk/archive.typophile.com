      <p>Nigella: I enjoy looking at photos, and I take a lot of them myself. But there's an aspect to photography, arguably its central aspect, that's a myth: its alleged ability to "capture the moment", to reflect Life, or whatnot, which is completely a self-validating modern illusion. If you look to the early discourse concerning the "existential fallacy" of photography, before the time when it started making enough money for enough people that people started thinking "well, OK, what the hell", you will find some lucid arguments of why this particular technology is essentially <cite>entertainment</cite>. When we try to get closer to Life by increasing CCD resolution for example, we're entirely missing the point.</p>
