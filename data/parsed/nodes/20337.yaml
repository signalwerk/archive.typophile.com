      <p>&gt; the “side” of the bed, is it defined ...</p>
      <p>You know, I've always wondered about a similar conundrum when it comes to "clockwise" and "counter-clockwise": it really depends whether you're looking at the watch from the top or the bottom. And then there's the issue of which end of a word is the "head" and which is the "tail" - I mean, if a word is a car it's different than if it's a street luger for example. I remember having persistent arguments about this with my classmates when we moved to Palo Alto when I was a kid (although I had even more arguments with classmates when we moved back to Beirut).</p>
