      <p>Tyranny is an equal opportunity employer and has been for all of history. I often hear great praise heaped on my ancestral countryman Alexander the Great.  They say he brought "civilization" to the world he conquered.  That is a nice romantic notion  a couple of thousand years after the fact.  He was a bully and a marauder who conquered the world--meaning he was responsible for lots of killing while bringing "culture" as a gift to those he plundered.  How was Alexander any better than the Ottoman Turks years later who conquered and enslaved Greece? No better, no worse. I am Greek and have heard many stories from my grandparents of Turkish tyranny heaped upon Greece. I will bet that there were similar stories during Alexander's time about him as well.<br>
      There have been villains from every corner of the world. For every villain killed, another rises to fill the void. Every power from the Egyptians enslaving their neighbors at the time of the Pharaohs to the Greeks, Romans, Turks, English, Spaniards, French, Dutch, Russians, and Americans have done deeds most foul. There is no place on this earth where a border can be drawn that does not contain their fair share of evil. This is half the nature of humanity.  Thankfully, there is a good part in all as well. The duel between both parts of human nature is endless and timeless. Draw your borders. Blame whatever country or government you wish.  That does not solve a thing for more than a moment. Both the problem and the solution rests within each of us. The blame-game is fruitless guilt dumping. Do something positive.</p>
      <p>ChrisL</p>
