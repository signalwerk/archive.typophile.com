      <p>I never said that you thought Kosovars prospering was bad. I said that you did not make clear that it was to a great extent their own responsibility to do the work to prosper. Of course NATO should do what it can to create a stable framework for them to do that. But I thought that is what they are trying to do. I think our armed intervention and peace keeping now gives them a shot at building a better life. Do you think that once the civil war started we shouldn't have intervened? What do you suggest we do now? Withdraw? What do you suggest they do?</p>
      <p>&gt;international battles in which capitalist powers compete against each other</p>
      <p>You still seem to me to be putting all causation on the 'Capitalist' powers, and nothing on the locals. You still don't assign any blame to the locals, like Milosovic, except to say that 'there is blame enough to go around'. </p>
      <p>You seem to be saying--correct me if I'm wrong--that the world's problems are a simply a byproduct of capitalist powers competing. I think this leaves out a critcal factor: lot of the problems are because poor countries have rotten governments that keep them poor. </p>
      <p>The problems of the rich countries--and indeed not so rich ones like China is how to deal with these rotten states, like North Korea. It is not actually an easy problem.</p>
      <p>The point I have been trying to make from my first post here is that the method of starting with blame is a bad way to understand social problems. The first thing is to try to understand the causes. The causes are complex, and only when you start to understand the mix of social conditions, culture, economics can you really see what needs to be changed. Assigning blame is part of this, but only when you understand the bigger picture do you get a realistic picture of who is right and wrong when.</p>
