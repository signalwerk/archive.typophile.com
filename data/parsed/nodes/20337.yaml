      <p>I don't like the macho tone and absolutism of the Nicholson character's speech. Reminds me too much of Bush--the character seems to feel that he has no need to think, to do self-criticism, to have in depth understanding before taking a major risk. </p>
      <p>One of the earliest discussions of the moral problems of exercising power is the Talmudic discussion of an incident of King Saul. He met with a foreign power, and ignored their insults. As a result they thought he was weak. This emboldened them to start a war against the Israelites, in which many were killed and eventually King Saul himself died. The Talmudic conclusion is something like 'if you start by being kind when you should be cruel, you will end up being cruel when you should be kind.' This is quite contrary to the usual love-and-peace tone of the sages, so it is particularly startling and thought provoking.</p>
