      <p>hhp,<br>
      Yep, I understand what you mean about repeating the stories all over again.  People are interested, cause they're curious, and you want to inform, but one feels like one might be exploiting the matter sometimes.  </p>
      <p>I just met too many people through my college years that talked endlessly about struggles but grew up in a suburb, go to the Starbucks for their lattes, on and on, so I just roll my eyes a little too quickly when I see someone talking about the man.</p>
      <p>My point with the cover was that I had this one place to say something.  The magazine was doing two stories, one on my work and another on Cuban design.  I had a feeling the Cuban design story was going to praise the Revolution, how wonderful it was for poster design, blah, blah.  It went over the top with praise for the whole system, as many writers tend to do with the Revolution.  And the glorious Che propaganda posters inside the magazine just added to it.  So, I, having a different opinion because of my childhood, felt I needed to counter the impression all of that would give.  In the end, I don't think the writer of the Cuba story was too thrilled with my work because it went against his premise, but the editors went with it, probably for balance.</p>
