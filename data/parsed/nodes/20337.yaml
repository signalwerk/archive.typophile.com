      <p>&gt; does the world absolutely need more text type?</p>
      <p>Absolutely need? No. Would it benefit? Yes. </p>
      <p>Text type is definitely not only a problem of 'decoration'. It is also a problem of readability. The challenge of readable type has been regularly renewed by continually changing technology--both printing technology and how type is produced. </p>
      <p>For example, in the changeover to digital type, most of the classic designs--which had meanwhile been put into photo type--were initially too light. This mistake is still being corrected. </p>
      <p>And now we have the challenge of relatively low resolution screen type (eg 96 dpi vs 2700 dpi for print). That is why people are interested in what others use for e-mail. Basically all screen type is bad--not as readable as print--and the question is how to make it better. People are looking for clues. And Microsoft has invested a lot in developing the new Clear Type technology and fonts for screen.</p>
      <p>Also on the aesthetic side, I don't think the word 'decoration' quite captures what is going on. A typeface is like a 'voice' of the printed word. If you have a beautiful voice delivering a message, like a great actor, it is going to emotionally color it in a better way, even though you are not conscious of the voice, but rather are consciously focusing on the message. So for different purposes you want different type faces, just as different voices in song or acting. </p>
      <p>By the way, I think Hrant and are in close agreement about this!</p>
