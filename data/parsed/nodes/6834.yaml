    date_raw: null
    votes: null
    html: <p>That's certainly similar to the basic style this was based on, and it has the right N serifs (as does Wigwam on the previous page). The W serifs are not shown, but Barnum Condensed  (p.25 top) has the wrong W serifs. However, it doesn't seem to me that extending that type would result in the same thing as this sample. The E would not be as closed. Adding stroke thickness might get close, but remember, most of the Solotype Catalog faces were film type, not digital. <br> <br>Playbill, P.T. Barnum, Wanted and other similar digital fonts don't have the right serif configurations, and most of the Photo-Lettering fonts I saw like this didn't either, or else the serifs were completely square, and not bracketed like these. <br> <br>I still think I have seen this as a font, but I can't recall where.</p>
