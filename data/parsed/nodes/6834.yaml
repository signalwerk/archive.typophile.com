  html: <p>My first thought was that this was a very widenened version of something like Adobe's <a href="http://www.myfonts.com/fonts/linotype/ponderosa/?PREFS_SET%5BRenderSize%5D=72&amp;PREFS_SET%5BRenderString%5D=NO+MORE+WAR" target="_blank">Ponderosa</a>, but I can see that the result would not match. The W serifs are wrong, for one thing. <br> <br>I actually think this is the way the font really looks without distortion, and it's making me nuts, because I think I have seen this somewhere.</p>
