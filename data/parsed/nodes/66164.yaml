  html: |-
    <p>Greeting All Typophiles.</p>
    <p>My first post, but I had been lurking here for a long time.</p>
    <p>Briefly saying, I'm working on a educational corporate brochure with the target audience being middle and higher management. However, it can't look too sophisticated - good value for your buck kind of feel.</p>
    <p>I need help finding a display and body face.</p>
    <p>For the display, I like:<br>
    Serifa<br>
    Interstate<br>
    Foundry Form<br>
    Ceacilia<br>
    Rockwell</p>
    <p>and text:<br>
    Bodoni<br>
    Myriad<br>
    TheSans</p>
    <p>What do you think? Serifa with Myriad and The Sans? What about Bodoni?</p>
    <p>Pav</p>
