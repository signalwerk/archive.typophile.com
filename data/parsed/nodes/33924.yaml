    <p>I'm new to these forums, so if anybody has posted something similar in the past, my appologies.</p>
    <p>I'd like to know how some of you actually start to design a typeface. What are your procedures when designing and developing? I guess I would just like to know how it's done and maybe get a few pointers so I can set out designing.</p>
    <p>I figure once I have a couple hand sketches done, I would translate them to Illustrator to refine and then something like TypeTool to assemble it? I don't know - please let me know how YOU do it!</p>
    <p>Thanks</p>
    <p>Brian</p>
