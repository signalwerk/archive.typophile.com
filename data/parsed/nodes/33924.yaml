      <p>The way one starts on a new font depends too much on the given purpose at hand and the nature of the given designer for any elaboration to be highly useful to you in particular. If you try to follow somebody else's methods too closely you are likely to become confused and lost in the long term.</p>
      <p>If, like Eben says, you can focus on a specific purpose (and I would add factor in your own creative nature) then the <cite>technical</cite> advice we might be able/willing to provide should help you get to somehere meaningful (to you) faster and better.</p>
      <p>hhp</p>
