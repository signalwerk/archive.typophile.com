      <p>Billy, What book would that be?</p>
      <p>Brian, I am sure you will get many good answers but the first way to begin to get effective &amp; useful answers is to narrow the question. And actually that will be my 1st step. What is the purpose of the type? Answer that question well, and thoughtfully &amp; you will have a chance of doing something worthwhile. Otherwise - Maybe not so much.</p>
