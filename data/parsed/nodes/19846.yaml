      <p>Dan,</p>
      <p>Contemporary New York City. Lots of text plus a fair number of colour and b&amp;w photographs.  </p>
      <p>I would like to have a paragraph at the end that says something about the type designer(s) and the type(s). My preference is to use a type for the text designed by a current New York designer, but thus far have not come across one that both appeals to me and has an adequate character set.  Second preference is for a deceased New York designer, second because if someone is going to get paid for a typeface, it might as well be someone who can enjoy the money.  </p>
      <p>I am adamant about using a serif type for the text, quite prepared to consider a sans serif for titles and headings.</p>
      <p>Enjoyed the pinhole photos on your web site. </p>
      <p>I noticed the Bank of New York material. I think that the type they use for their name is too grave for my purposes, but I’m curious about what it is. </p>
      <p>Cheers</p>
