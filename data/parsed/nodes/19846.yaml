    <p>I am writing and designing a book that has strong connections to New York. </p>
    <p>I’d like to use a font or fonts that have an association with the city, perhaps because the font was designed there, perhaps because the font says New York. </p>
    <p>It must be a font suitable for a book that is available in roman, small caps and oldstyle/text figures. And maybe there is a sans serif that matches. </p>
    <p>Thanks.</p>
