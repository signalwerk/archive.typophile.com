      <p>Hi Eben, in all the starting madness, I hadn't updated with the actual biz cards we're using.  I was going with this approach, 10 different colors total for all the designs:  </p>
      <p>(Disclaimer - these are attempts are reconstructing the images from a CMYK 300 ppi 10-biz card spread, and so there are some things that are kind of off!)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bizcard_rainbow_1_4877.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bizcard_rainbow_2_3439.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bizcard_rainbow_3_4305.png"></div><p></p>
      <p>And then I realized that until we figure out how &amp; where we want them professionally printed, my printer's going to run out of colors too fast....  Plus, simple is nice:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bizcard_simple_3755.png"></div><p></p>
      <p>For Nate &amp; Ari's cards, I'm doing a similar treatment (those files are on my laptop!) to this last one.</p>
      <p>Thanks for all your input, Eben - when it comes times to send cards to the printer, I'll revisit this thread.  The general info card may get replaced by a small pamphlet, but Nate &amp; Ari will eventually want real cards.</p>
