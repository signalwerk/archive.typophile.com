      <p>I'd vote against the border. It feels to me like it's trying to be formal, which goes against the colorfulness, lowercase, puddles, even 3-dness of the logo, which says tasty fun. And you want a "clean" surface for the melted food. I'd take it off, at least on the logo side.</p>
      <p>All that said, here's an idea out of left field: what would happen if you turned the border into a trapezoid so that it looked more like a counter surface in perspective on which those puddles sit?</p>
