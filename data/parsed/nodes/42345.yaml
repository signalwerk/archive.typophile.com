    <p>Hi all,</p>
    <p>This is a straightforward design, but I'm having trouble because my eyes are very unfresh on this project. The logo's theoretically final, but I can tweak the kerning if you have suggestions on that.  I'm feeling waffle-y about the border - what I'd really like is an embossed border, but we are on a low budget.</p>
    <p>I suppose I should tell you: <a class="freelinking external" href="http://www.screamsorbet.com" rel="nofollow">Scream</a> is a two-person company who'll be selling in SF Bay Area farmer's markets, and then hopefully expanding to a brick-and-mortar store and/or restaurant sales.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bizcard_bothsides_6483.png"></div><p></p>
    <p>This image suffered a bit in the conversion from CMYK to RGB, but it's about right.  Again, letter spacing &amp; the border are the things I'm stuck on, although I welcome any thoughts at all.</p>
    <p>Thanks!<br>
    Beth</p>
