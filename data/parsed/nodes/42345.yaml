      <p>Thanks for the spacing suggestions, Eben.  And Darrel, I was thinking of doing something to add color to the back - perhaps the border?</p>
      <p>As I said in my post, the logo is done - the founders are happy with it, and it strikes a balance between elite/high-end and something that families with kids will flock to at farmer's markets.   (And something that won't offend the populist sensibilities of the founders.)  As far as the colors go - toy store is good.  Every one of those colors are actual colors of sorbets these guys have made, so there will be a nice moment of brand-strengthening when people see how vivid the natural fruit sorbets are (the prickly pear is pretty much 100% M, and the beet-lemon is a fabulous deep crimson).</p>
      <p>Anyhoo, if anyone has suggestions on how to work with the existing logo to make the business cards better, I'm all ears!  :)</p>
