    votes: null
    html: <p>I really like the simplicity of the design and the font choice which seems pretty inspired to me. But the overall effect I get is sort of "toy store". Probably via the colors which feel like paint instead of "food". Also it feels a bit "accessible/easy" rather than "elite/high end". If this was for sale in gas stations you would probably be bang-on; but it isn't. It's snobby foodie SF bay - no? ( my peeps! ) And so I think a softer more subtle color palette would be way more upscale. What about letting one of the puddles run in three rivulets? what about just one wipe of cream behind the letters in an arc? Maybe photographed from behind glass. I think less space between the a &amp; m would be good. Or looser spacing overall to match the a &amp; m. Can this be done in one spot color instead of CMYK? Or two? I guess you are not down with the very fancy decorated thing that's still seems to be all the rage... ;-) I will be interested to hear what the other folk think.</p>
