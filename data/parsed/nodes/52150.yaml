    <p>Hello,</p>
    <p>My name is Liesbeth Bonner and I am a graphic design master student at Sint-Lucas Ghent (Belgium). This year I have to write a thesis and I chose Comic Sans as my subject. I will mainly investigate the social aspects of the font: the reasons why so many people use it and so few designers like it. Offcourse I've never used Comic Sans, but for my thesis I am looking for great designers who did, with or without a twist of irony. </p>
    <p>I've heard that Will Holder used it one time, but I can't find visual material on the web about it or in books. There's also Gorik Lindemans who made posters for the dance production Rosas (by Anne Teresa De Keersmaeker) and was inspired by the colours of an ad for Aldi (a cheap supermarket), I can't find this poster either.</p>
    <p>Does anyone know where I can find these or are you a Comic Sans expert and do you know other designers who used it in a good way?</p>
    <p>The tips would be very welcome,<br>
    Thank you in advance,</p>
    <p>Liesbeth</p>
