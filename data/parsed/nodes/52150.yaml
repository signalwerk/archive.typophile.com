    html: |-
      <p>First of all, thanks for all the reactions.</p>
      <p>second, I shall explain the sentence quoted a couple of times above: </p>
      <p>'offcourse i've never used comic sans'.</p>
      <p> I said that as a graphic design student who never dared to use it because it's such a difficult typeface to use in an art-environment. I can understand that comic sans is appropriate for applied graphic design, for example a hairdresser's shop (i picked this one because i've seen one with CS in the logo). At school during practice, it's easier to use typefaces that are allready proven to be good ones like Didot, Futura, Baskerville, Garamond, Univers, all the big names in typeworld. I think the only way to use comic sans (and in a design approved by my teachers :)) is in a design that refers to the commercial world and uses it's elements but without just copying them. There has to be an additional value. And layered meanings. Irony is not necessarily a part of it.<br>
      This way of adopting elements of the 'low culture' can also be seen with other artists: Arne Sierens (<a href="http://www.arnesierens.be/" title="http://www.arnesierens.be/">http://www.arnesierens.be/</a>)is a playwright who's stories are situated in for example fastfood restaurants, but his plays are considdered art because of the layers and the additional value. Also designer Walter Van Beirendonck (<a href="http://www.waltervanbeirendonck.com/" title="http://www.waltervanbeirendonck.com/">http://www.waltervanbeirendonck.com/</a>) adopts elements of low culture and gives them a new meaning. It's in this way i would like to find some famous graphic designers who used comic sans, but i haven't found one yet. Maybe at the end of this year i myself can design something good with comic sans.</p>
      <p>And about my thesis statement: </p>
      <p>i'm still just researching and i'm following different paths at the same time. But i think i will mostly investigate the social aspects of the type: which people use it and for which purposes? which are the motives of the persons who use it? the things that are said by skinny_tires are indeed some of the important reasons of the popularity of comic sans, but even if we just look at the fonts delivered with every computer, comic sans is still the most popular. Is it, as some organisations who researched dyslectia say, the best readable type? is it good for children who are just learning to read? </p>
      <p>I hope you all get a nicer image of me and my thesis :) I haven't got the intention of turning my thesis in a freakshow to tell everyone how bad and ugly comic sans is. I want to investigate comic sans properly and if the solution is that comic sans a bad font is, then be it. But up to now, 'i believe in comic sans' (this is also my working titel of my masterproject)</p>
