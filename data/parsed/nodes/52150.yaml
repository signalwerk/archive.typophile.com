    html: "<p>Think of Comic Sans like this: Two people need to traverse across a large public park. Lets just assume that dogs are also allowed off leash to roam, play fetch or do their thing, there may be a few geese or other wildlife, etc. With those two people, one walks across while wearing utility boots, the other person, just in their bare feet while carrying their flip-flops. One person will be more concerned as to where they step while traveling to the other side while the other person possibly could care less. Both make it to the other side but one has more probability to really stink when they hop onto some public transit at the other side of the park. It is the same concept. It (Comic Sans,) is out there, it is possible to <em>step in</em> and you may stink if you don't care how you get to the destination.</p>"
