      <p>Usages of Comic Sans abound but what is your thesis statement?  You could gather some anecdotal information of funny or hideous uses of the typeface (tee hee, <em>look at this example</em> kind of stuff,) but what are you trying to define? Finding examples will only ratify its usage in almost any context you want to refer to. </p>
      <p>Some of its existence and prolific usage is because;<br>
      It is owned by Microsoft,<br>
      It is a default typeface on a couple of Microsoft programs,<br>
      It is readable at small sizes for dialog on computer screens,<br>
      It is free.</p>
      <p>On the other hand, why is a typeface like <strong><em>Coop Forged</em></strong> by House Industries <a class="freelinking external" href="http://www.houseind.com/index.php?page=showfont&amp;id=12&amp;subpage=viewfontspecimens" rel="nofollow">view here,</a> used so little? It is similar as maybe a dozen other comic-looking fonts. The argument my boil down to…it's not a default, not common and not free?</p>
      <p>A defined thesis statement will focus your intention, or what you are really trying to discover.</p>
