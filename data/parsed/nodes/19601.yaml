      <p>Patty, I think the Alts are embedded in the character set of the <a href="http://www.myfonts.com/fonts/letraset/fling/fling/charmap.html">Letraset version</a>. Linotype just split them out, because I think a lot of people don't know those Letraset fonts have alternate characters hidden in the font (see Papyrus and Fine Hand, to mention two that have more to them than most people realize.)</p>
      <p>- Mike Yanega</p>
