      <p><em>"Is it the new Eclat?"</em></p>
      <p>God, I hope not. Just because Martha uses it on her magazine doesn't mean it's wonderful. It has it's place, and one word on a cover is fine, I'd say. Martha could do for fonts what Oprah did for books, if she starts making that part of her 'style realms', and I don't really think it would be 'a good thing' for design.</p>
      <p>Why are people afraid to trust their own taste in type (or judgement in books, for that matter)?</p>
      <p>- Mike Yanega</p>
