    <p>Hello all.</p>
    <p>I’m desperately looking for any high quality examples (actually, any examples at all) of Romane, a font developed at Scriptorium de Toulouse in 1994 by one Séverine Hameau.</p>
    <p>So far I’ve seen it mentioned in passing a half dozen times and there are a couple of pictures – one on <a class="freelinking-external" href="http://www.typofonderie.com/gazette/articles/scriptoriumdetoulouse">Typofonderie</a>, and one on a French <a class="freelinking-external" href="http://www.culturesfrance.com/adpf-publi/folio/lettres/08.html">cultural directory</a>.</p>
    <p>Despite the fact that it was never committed to metal or digital type due to an accident, I can’t help but believe there must be more prints of it about – it won honorary mention for text font in Linotype’s 1st International Design Contest, it can’t have completely disappeared.</p>
    <p>So all in all I’m after any information at all, and would ideally like some URIs to high-res images. I’m completely besotted.</p>
    <p>Regards,<br>
    Barney</p>
