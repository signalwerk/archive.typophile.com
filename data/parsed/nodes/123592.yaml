    html: |-
      <p>I use so one script (saved as file in my /.FontForge/python/ directory) for tests.<br>
      Script : save copy of my font as temp.sfd, remove overlaps, corect direction etc., generate font (without hints), copy it (or overwrite) to my local fonts directory (<strong>on Linux</strong>) and remove temp files.</p>
      <p># -*- coding: utf-8 -*-<br>
      import shutil;<br>
      import os;</p>
      <p>def genTestOTF(arg, ft):<br>
         localFontdir='/.local/share/fonts/';<br>
         fDir=os.path.expanduser("~")+localFontdir;<br>
         ftActive=fontforge.activeFont();<br>
         ftActive.save('temp.sfd');<br>
         ft=fontforge.open('temp.sfd');<br>
         aLayer=ft.layers[ft.activeLayer].name;<br>
         ft.encoding='UnicodeBMP';<br>
         ft.selection.all();<br>
         for g in ft.selection.byGlyphs:<br>
            g.removeOverlap();<br>
            g.correctDirection();<br>
            g.canonicalStart();<br>
            g.canonicalContours();<br>
         fontNazwa = ft.fontname;<br>
         plik=fontNazwa+'_test.otf';<br>
         ft.generate(plik, flags=('opentype','dummy-dsig','apple','no-hints','no-flex'),layer=aLayer)<br>
         shutil.copy(plik,fDir+plik);<br>
         ft.close();<br>
         os.remove(plik);<br>
         os.remove('temp.sfd');</p>
      <p>fontforge.registerMenuItem(genTestOTF,None,None,"Font",None,"Generator","Quick test-otf");</p>
