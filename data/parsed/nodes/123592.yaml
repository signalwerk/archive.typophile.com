      <p>Thank you gluk, this is exactly what I was looking for. I installed the script and commented out the parts obviously responsible for installing the font to the OS font library, but I run into an error:</p>
      <p><code><br>
      File "/Applications/FontForge.app/Contents/Resources/opt/local/share/fontforge/python/test-otf.py" line 9, in genTestOTF<br>
      ftActive.save("temp.sfd")<br>
      EnvironmentError: Save As "test.sfd" failed<br></code></p>
      <p>I'm under Mac OS 10.9.5 running FontForge version "04:18 AEST 7-Jan-2015".<br>
      I installed the script under /Applications/FontForge.app/Contents/Resources/opt/local/share/fontforge/python/ .</p>
      <p>How could that be fixed?</p>
