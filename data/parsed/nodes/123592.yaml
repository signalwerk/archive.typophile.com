  - id: 600318
    user: 181984
    date: 2015-03-04T05:55:00
    date_raw: 4 March 2015 - 5:55am
    votes: 0
    html: |-
      <p>another system, different FontForge version, most probably another Python version... :-)<br>
      Ok,<br>
      most simplest way to make it, and avoid saveAs:<br>
      script bellow first save your work, then remove overlaps etc., generate .otf and revert your original font file (ff should ask you).</p>
      <p># -*- coding: utf-8 -*-<br>
      import os;</p>
      <p>def genTestOTF(arg, ft):<br>
         ft.save();<br>
         ft.encoding='UnicodeBMP';<br>
         ft.selection.all();<br>
         for g in ft.selection.byGlyphs:<br>
            g.removeOverlap();<br>
            g.correctDirection();<br>
            g.canonicalStart();<br>
            g.canonicalContours();<br>
         plik=ft.fontname+'_test.otf';<br>
         ft.generate(plik, flags=('opentype','dummy-dsig','apple','no-hints','no-flex'));<br>
         ft.selection.none();<br>
         ft.revert();</p>
      <p>fontforge.registerMenuItem(genTestOTF,None,None,"Font",None,"Generator","Quick test-otf");</p>
