  - id: 600318
    user: 181984
    date: 2015-03-04T03:55:00
    date_raw: 4 Mar 2015 — 3:55am
    votes: null
    html: |-
      <p>another system, different FontForge version, most probably another Python version... :-)<br>
      Ok,<br>
      most simplest way to make it, and avoid saveAs:<br>
      script bellow first save your work, then remove overlaps etc., generate .otf and revert your original font file (ff should ask you).</p>
      <pre># -*- coding: utf-8 -*-
      import os;

      def genTestOTF(arg, ft):
         ft.save();
         ft.encoding='UnicodeBMP';
         ft.selection.all();
         for g in ft.selection.byGlyphs:
            g.removeOverlap();
            g.correctDirection();
            g.canonicalStart();
            g.canonicalContours();
         plik=ft.fontname+'_test.otf';
         ft.generate(plik, flags=('opentype','dummy-dsig','apple','no-hints','no-flex'));
         ft.selection.none();
         ft.revert();

      fontforge.registerMenuItem(genTestOTF,None,None,"Font",None,"Generator","Quick test-otf");
      </pre>
