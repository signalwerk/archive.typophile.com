    <p>Hi!</p>
    <p>I'm relatively new to FontForge after I got some experience with FontLab Studio and so far I like it (especially going open source).<br>
    While testing a design I noticed that creating OTF fonts for testing in InDesign can be a tedious task. In FontLab I was used to a script that automatically <strong>created a copy</strong> of the file, <strong>removed overlaps</strong> and prompted the <strong>export dialog.</strong> So exporting OTF for testing was done in one click. </p>
    <p>I bet there is something similar in the FontForge world, but I couldn't find anything...<br>
    How do you "quick export" test OTFs in FontForge?</p>
    <p>Thanks!</p>
    <p>Martin</p>
