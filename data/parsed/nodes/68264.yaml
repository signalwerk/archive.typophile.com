    <p>Hello,<br><a href="http://vimeo.com/9682948">Simple</a> is a video created by students in <a href="http://tannerwoodford.com/syllabus/2010s">Advanced Media</a>, a course in the <a href="http://design.asu.edu/sdi/">School of Design Innovation</a> at <a href="http://www.asu.edu">Arizona State University</a>. For more context on this work-in-progress, <a href="http://typophile.com/node/68269">see other videos from this class</a> or <a href="http://tannerwoodford.com/syllabus/2010s/1.html">read the oﬃcial project description on the course syllabus</a>. The video was produced by Jennifer Bianchi, Samantha Dennerline, Michael Duah, Michelle Duah, Mitch Kistner, Lauren Ledbetter and Wenhui&nbsp;Yu.</p>
    <p><a href="http://vimeo.com/9682948">http://vimeo.com/9682948</a></p>
