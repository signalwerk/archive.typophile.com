    <div class="info">Submitted by <a href="/web/20081121111515/http://www.typophile.com/user/14650" title="View user profile.">Stephen Rapp</a> : 8.Oct.2008 4.09am </div>
      <p>Veer has just released Montague Script by Stephen Rapp</p>
    <p><a href="https://web.archive.org/web/20081121111515/http://www.veer.com/products/typedetail.aspx?image=UMT0000367" title="http://www.veer.com/products/typedetail.aspx?image=UMT0000367">http://www.veer.com/products/typedetail.aspx?image=UMT0000367</a></p>
    <p>Montague Script takes its name from a small hilltown of western Massachusetts rich in culture and history. I lived in this beloved community for a number of years and it’s where I first began my study of calligraphy and lettering.</p>
    <p>While most brush scripts take their cue from mid-twentieth century samples, Montague Script is a fresh, contemporary alternative. It comes directly from lettering written with a #3 sable brush on smooth vellum and is digitized with the same sensibility a lettering artist writes with. Montague reflects a dynamic interplay between form and rhythm not usually associated with type. Words suggest a baseline, yet are not bound by it. Letters vary in size, connect smoothly, yet break that connection purposefully as the scribe does intuitively. Beginnings, endings, alternates and ligatures come in as needed while you type. Many more alternates are available in the glyph palette of most current graphic software. Exuberant swash versions of upper and lowercase letters, as well as ligatures can be accessed through both the type and glyph palettes.</p>
