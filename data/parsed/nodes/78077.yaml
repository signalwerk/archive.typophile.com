      <p>Shop around. Some font companies don't charge extra for web embedding through certain sites. Some charge a little more for autohinting and a CSS stack. Some allow you to do your own conversions.</p>
      <p><em>Incidentally I also believe that every typeface should be available free for non-commercial uses, though that's just an ideal of my own and I respect others' option to charge for it.</em></p>
      <p>Be careful with that. I used to offer a lower or zero price for non commercial use. When I investigated, I found that customers don't understand the meaning of personal use. Personal use apparently means "I'm going to personally use this font for my business."</p>
      <p>Ad agencies were constantly buying personal use licenses to use for commercial use. Roughly half of the personal use purchases were from domains which happened to be ad/design agencies.</p>
      <p>I think it's human nature to buy the lowest price item and ignore the license agreement. If you make a font free you may as well make it free for commercial use because that's what people are going to use it for anyway.</p>
