      <p>I'm not sure I follow the argument. If you accept that @font-face distribution is new functionality that has value to their customers (in the same way as extended character sets and OpenType features have value), the font designers have two options. Charge more for a font and include these rights in their standard license, or charge separately for these extended rights under a supplemental license. I think option 2 seems more sensible, most customers don't need the distribution rights. </p>
      <p>&gt;There used to be a time when you owned something after you bought it.</p>
      <p>That's a myth. :-)</p>
