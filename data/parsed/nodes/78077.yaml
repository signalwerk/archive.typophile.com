      <p>@ Pablo</p>
      <p>You belong to the first ones in the Google font directory. I assume, you are getting less money, when the directory grows.</p>
      <p>Foundries don’t make distinctions between the commercial and the non-commercial use of their fonts. If they would do that, they could get more paying customers. In case of webfonts, foundries could easily control, if the project is non-commercial. One reason for this unflexibility is the wrong assumption, that a user, that has paid for a font, will not spread it out. In case of webfonts, this assumption is even more absurd, because it is in the nature of webfonts, that are spread out.</p>
      <p>However, I am starting a non-commercial project and Bitstream is not interested in my money, because my condition is, that I am allowed to subset the font in which I am interested. Instead of taking that money, Bitstream makes the offer, that I pay more money for a custom version of the font. This is so foolish, because the half of the character set of the webfont, in which I am interested, does not work in browsers because of missing encoding. One more time: Bitstream/Myfonts does not sell webfonts, but webfont licenses only. So the half of the money is for a digitized frazzle of paper and the other half is for the characters, that the browsers can access. Not to talk about the terrible hinting of the majority of the fonts, for which they sell webfont licenses.</p>
      <p>What I am doing now? Maybe providing a detailed tutorial, how to download webfonts with the help of certain Firefox plugins, how to preper these webfonts for editing in font editors like FontLab, namely the restoration of the name table, in which the specification was violated, providing a woff-to-sfnt-converter and so on. Nothing illegal. And instead of a translation of Adam’s TrueType hinting tutorial to German. Naturally strictly copyrighted. And additionally I recommend online-translaters “Russian to ‘your language’”. Why? Because my compassion for all you victims of piracy is actually decreasing. I meanwhile think, some of you are willingly victims. At least there is a point, at which the difference between a latent paranoia and masochism is almost not perceptible anymore.</p>
