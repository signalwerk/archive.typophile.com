      <p><cite>The right to use a font file in a certain way is not the foundry's to grant, the consumer already has it.</cite></p>
      <p>No. It's the opposite. The customer has no rights to use a font except those that the foundry grants as part of the license. That's the standard model for all proprietary software. Sorry to be a nitpicker, but there's enough Typophile threads that are polluted with urban legends like these.</p>
      <p>If you, in your career as a professional font designer, want to make your fonts free for noncommercial use, or offer them under a liberal commercial license, great. That's your choice. But those are rights you grant your customers as the owner of your work. Until then, those rights don't exist.</p>
      <p>The slave analogy is both inappropriate and unhelpful. I sense Godwin's Law about to kick in…</p>
