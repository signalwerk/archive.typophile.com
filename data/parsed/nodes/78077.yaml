      <p>well, I might be a little late, but I gotta chime in on a couple subjects.</p>
      <p>1. As far as charging an extra licensing fee for web use, I'm amazed at how affordable it usually is. I have my fonts available through a number of webfont distributors and I think they offer a great value to web designers who want to broaden their type selection with some more interesting fonts. If I were to make the prices for web fonts, I'd ask for a lot more. But because I trust my distributors, I just let them charge what they think is fair, per evolving industry standards. It doesn't cost much to implement web fonts in a website, and as per usual the ones you pay for are going to be better than the ones that are free.</p>
      <p>2. Re: Ray's thing about not getting feedback from freefont users: I've had a different experience. I feel like I DO get good suggestions and feedback from the freefonts I put out there. It is often this feedback that helps guide me in making improvements to new fonts and building them up to the quality level that justifies charging for them as commercial fonts later.<br>
        Most recently I released a family of 16 freefonts called Panefresco (on Fontsquirrel: <a href="http://www.fontsquirrel.com/fonts/panefresco" title="http://www.fontsquirrel.com/fonts/panefresco">http://www.fontsquirrel.com/fonts/panefresco</a> ;) and within days of release somebody wrote to tell me the left-double-smartquotes were broken in 6 of those weights. I was giddy that I was able to fix this (substantial) bug quickly after the font went out to just a few hundred people, instead of finding out about it later after it'd gone out to several thousand users.<br>
        Yes, most freefont users don't offer feedback, and just switch fonts instead. But there have been many occasions over the years where freefont customers have sent me bug reports and suggestions that have helped me make my fonts better.</p>
      <p>3. Re: Pablo's success with donations: Even though I've probably given out millions of freefonts over the years, donations have NEVER been a significant revenue stream for me. Waiting for donations for freefonts will never get a type designer fairly paid for his hard work on a font. I agree that Pablo's success in donations is probably mainly because of his brilliant Lobster font micro-site page (so proud to have gotten mentioned on there!) Most type designers don't have the time, patience or writing skills to produce such an effective pitch page for each font they make. Consequently most font designers are not going to be as happy with the amount of donations they receive for a font.</p>
      <p>4. Yeah, how about those Google Web Fonts? Seems like a really mediocre set of font offerings they've brought us to use on the web. Kinda like a half-assed freefont site, just converted to webfonts. And without the broad selection offered by most crappy freefont sites. I was happy to read Richard's article on the subject (<a href="http://readableweb.com/google-fonts-failing-for-internet-explorer-users/" title="http://readableweb.com/google-fonts-failing-for-internet-explorer-users/">http://readableweb.com/google-fonts-failing-for-internet-explorer-users/</a> ) to know I'm not the only one seeing this as a colossal font-fail from a great big corporation that's capable of doing so much better.</p>
