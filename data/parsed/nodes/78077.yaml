      <p><cite>Nonsense, or, dare I say, pure FUD.</cite></p>
      <p>"FUD" is a term associated with Microsoft and other companies that have tried to suppress customer choice by creating unjustified apprehension about the alternatives. "I guess you COULD use Linux on your server, but maybe you'll get sued for patent violations…"</p>
      <p>What I'm saying here is the opposite. Tunnel vision of any sort is dangerous. To me, OFL fonts serve a purpose; so do proprietary fonts. We can have both in the world. </p>
      <p>But to say that the OFL approach is intrinsically better — that's extremely limiting. And wrong. It's good for some things. It's not good for others. </p>
      <p>The analogy to other forms of open-source development, like software, is very weak. Successful open-source software projects have a person or small team that guides the project and decides what code makes the cut. These projects are nonprofit, but they're still meritocracies. </p>
      <p>There is no meritocratic pressure applied to OFL fonts. They're done when the designer says they're done. I guess "learning" to make mediocre fonts is a type of learning. I just don't think much of it because it doesn't allow new type designers to rise to their highest potential. </p>
      <p><cite>Would you say that doctors working for Doctors Without Borders will not become good doctors because they are not charging money on their patients?</cite></p>
      <p>But that just proves my point —&nbsp;they had to go to medical school to become doctors before they could work for DWB. A guy like me can't just show up with my forceps and scalpel and say "hey, I'd like to try my hand at an appendectomy. Don't worry, I watched one on YouTube."</p>
      <p><cite>The only things that makes you better at whatever you do is always keep learning and practicing, even if you don't charge money for it.</cite></p>
      <p>The standards you set for yourself also matter.</p>
