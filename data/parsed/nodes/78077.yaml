      <p>4. Yeah, how about those Google Web Fonts? Seems like a really mediocre set of font offerings they've brought us to use on the web. Kinda like a half-assed freefont site, just converted to webfonts. And without the broad selection offered by most crappy freefont sites. I was happy to read Richard's article on the subject (<a href="http://readableweb.com/google-fonts-failing-for-internet-explorer-users/" title="http://readableweb.com/google-fonts-failing-for-internet-explorer-users/" class="link-external">http://readableweb.com/google-fonts-failing-for-internet-explorer-users/</a> ) to know I'm not the only one seeing this as a colossal font-fail from a great big corporation that's capable of doing so much better.</p>
