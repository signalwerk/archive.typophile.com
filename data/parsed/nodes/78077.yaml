    html: "<p>And an idea for Germany: The citizens pay a culture tax dependent from their income. And they get a Flattr coupon for the tax. There could be different kinds of Flattr coupons. One for music, one for movies, one for software. If the citizen does not redeem the amount of the coupon in a certain period, the remaining amount is moved to a culture money pool. With the money in the pool projects like the renovation of historic monuments could be financed. Or a commission, that consists of non-politicians, which have outstanding services to culture, distributes the money to cultural projects. At the moment in Germany mainly politicians decide, which projects are worth to be financed, although most of them seem to miss any aesthetic feeling.</p>"
