      <p><em>—One of the points my post is that a good webfont is not the same as a print font. Sure, you can do nothing to your fonts and simply allow them to be used online. But if you want to do it right, you must spend money and/or time on extensive preparation (kerning, redesign) to make it work as well on Windows as most paying customers expect. This makes it a separate product deserving of its own price.</em></p>
      <p>I agree with this. To clarify, I was referring to what Arno is talking about—the webfonts by licence only. And even if there are optimized versions of a font available, I reserve the right to convert a non-optimized version I already own into a .woff, etc and use it on the web. That's something <strong>I</strong> can do for myself, as opposed to optimization which is legitimately a service done for me. It's ridiculous to charge for the former. I see it as being in the same category as trying to charge for the right to print a font on certain types of paper.</p>
      <p><em>—Fonts are not cars. Having said that, you actually can buy and, somehow, ‘own’ a typeface. It is called custom type (or ‘exclusive rights’) and will cost you the equivalent of a car. Licensing a font is more akin to renting a car. Most providers will prohibit taking the fonts to the web, or charge extra for it. Just like most car rental services do for taking the car across the border.</em></p>
      <p>The car metaphor is weak here. Having exclusive rights to a font is more like owning an entire line of cars, or maybe having a single custom car made. The renting argument doesn't make any sense—you don't return fonts, they can't be damaged, etc. If anything, a car-rental-related parallel would be if a new street was just paved and the rental place wanted to charge extra for you to be able to drive on it with their car. But really I don't think any of this car talk is illuminating or useful.</p>
