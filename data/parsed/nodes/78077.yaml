      <p>Hi folks,<br>
      I'm an accountant and hobbyist type designer. I run an open source and copyleft type foundry VTF (<a href="http://www.vtf.fadebiaye.com" title="www.vtf.fadebiaye.com">www.vtf.fadebiaye.com</a>) publishing my own typefaces (some are used in the real world) and starting to publish typefaces from professional type designers.<br>
      So I am not as established as most type designers, but I know economic rules and I've review most foundries EULA's (<a href="http://www.fadebiaye.com/type/guide_sat.pdf" title="http://www.fadebiaye.com/type/guide_sat.pdf">http://www.fadebiaye.com/type/guide_sat.pdf</a>) and most type designers are very wrong.<br>
      Due to an increasing competition, they won't survive without a valid economic model. Copyright is not an economic model ; copyright is just begging for money in most cases.</p>
      <p>Type designers should apply a payback ratio BEFORE making typefaces, over and over, like fools. Like cars makers, they make typefaces without looking at the market and then complain with copyright, apply stupid EULAs and so on.</p>
      <p>But as there is too many competitors, I'm not sure that type designers is profitable as such ; with a payback model rather than copyright, you can have your time and your money, not sure that you'll earn billions of bucks.</p>
      <p>Most type designers will have to diversify their business (e-books, ...) to survive. I'm perhaps a shit in type design, but I'm quite good and credible in economics (that's my job after all).</p>
