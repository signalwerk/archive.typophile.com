      <p><em>...that the individuating properties (nice word choice) of a font do not make it proprietary directly, nor are they proprietary themselves, but they do justify making a font proprietary. Is that what you are saying?</em></p>
      <p>Roughly. They form the basis of ownership by establishing a particular typeface as individually value-able. If something is individually value-able, there is something that may be owned, traded, licensed, etc. without impinging on the ownership, individual or collective, of other things whose own value is independent. Ownership itself is a matter of law (whether legislative, common, natural: there is no law without a philosophy of law, excepting arbitrary tyranny). I happen to think that natural law favours ownership of made things by the people who make them; indeed, I think it is the soundest basis of ownership that exists, much sounder than e.g. that used to justify private ownership of land.</p>
      <p>[I've written 'value-able' rather than 'valuable' because the latter term is so common now as a synonym for 'worth a lot' that we tend to overlook its primary meaning of 'can have a value assigned to it'.]</p>
