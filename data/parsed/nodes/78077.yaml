      <p><em>For programmers who create proprietary products and formats, they may have continuing goals, but they solve the problem in an entirely new way—which is what makes it proprietary.</em></p>
      <p>I think I know what you mean, but you should phrase that differently. "Solving problems in a new way" sounds like they're doing something clever and great. "Creating incompatibilities to tie clueless users to their software" better represents the practice of creating proprietary formats. As for any software itself, rarely does it solve any new problems, let alone in new ways. Writing good code may require some brains, but clever ideas shouldn't entitle you to anything.</p>
      <p>That said, I think Sii is right. You have yet to come up with a business model that allows fontographers to support a family and at the same time gives users unrestricted rights. I don't think there is one, because most people are like my grandparents: "You draw what? <em>Letters?</em> And you get <em>paid</em> for that?"</p>
      <p>In all seriousness, why don't you just go and occupy "ethical licensing" as your personal market niche? After all, it's still a market, with competition and all, and maybe your model will give you an edge over the rest?</p>
