      <p>Tristan: <em>I was referring to Hudson's usage again—that the characteristics of a font are what makes it proprietary.</em></p>
      <p>What I said, quite carefully, was this:</p>
      <p>‘...what is proprietary to each typeface and what invites ownership or licensing of each typeface is those things that distinguish it from other typefaces.’</p>
      <p>There's a play on words in here: those things that distinguish typefaces from each other -- what you have referred to as ‘characteristics’ -- are the <em>properties</em> of the typefaces that make them individually desirable and, hence, <em>own</em> their potential value. This seems to me self evident: if it were not the case, no one would want, let alone need, more than one typeface. The very fact that people do want more than one typeface means that they recognise independent value in different typefaces, and that value can only subsist in the ways in which those typefaces differ, i.e. in their individuating properties or, as you will, characteristics.</p>
      <p>From this, it seems to me to follow that the value that subsists in the individuating properties of the typeface make it possible for someone to claim certain rights, rights of authorship, to that typeface, without in any way prejudicing the common rights to that which the typeface shares with other typefaces i.e. the alphabet.</p>
