      <p><cite>¿How valuable is that for a new designer?</cite></p>
      <p>Throughout history, designers have been asked to forgo their fee and accept exposure, prestige, or other hard-to-quantify benefits in exchange for their work. If that gamble pays off 1% of the time, designers seeking exposure will point to that 1% as proof that it's a good bet. Meanwhile, experienced designers will point to the 99% as proof that it's not.</p>
      <p>The Google Font Directory is no different. I wouldn't try to talk a type designer out of participating. But if the main criterion for inclusion is your willingness to give your work away for free, it's not a very prestigious club. </p>
      <p>Put it another way: the big problem most new type designers have is not lack of exposure, but mediocre design skills. Releasing a font under the OFL, or on Google, will not make you a better designer. Subjecting your work to the scrutiny of better type designers will. (And posting samples on Typophile is not quite what I mean.)</p>
      <p><cite>As one in love with the process, I desperately want the field to rise above the impurities of other businesses.</cite></p>
      <p>One of the qualities that distinguishes the "process" of type design from others is its tradition of craftsmanship and exacting detail. There are notable exceptions, but usually, excellent type designers are made — through training &amp; practice —&nbsp;not born. </p>
      <p>Is there a place in the world for things like Google Font Directory and OFL fonts? Sure. But they don't support this tradition of craftsmanship, because a) they don't reward typographers who have learned the craft and b) they don't help educate new type designers in that tradition.</p>
      <p>So, if you're a new type designer who thinks "I care about the craft of type design" but also "OFL is the best," you need to think harder, because those are contradictory ideas. </p>
      <p>You can certainly have a career as a designer of free or cheap fonts — you can even make good money at it. But you're not going to be a very good type designer. Just like working at Burger King is not going to make you a very good chef.</p>
