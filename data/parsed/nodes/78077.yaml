      <p><em>In all seriousness, why don't you just go and occupy "ethical licensing" as your personal market niche? After all, it's still a market, with competition and all, and maybe your model will give you an edge over the rest?</em> | Well, I'm a ways off from occupying any market (I with the critique thread for Albuquerque Regular got this much attention), but I may very well do that. Let me restate my views on business models for font licencing...</p>
      <p>Here are my <em>suggestions</em>:<br>
      - Make multiple versions of a font—Basic, Pro, maybe Web if it's not included in Pro<br>
      - If you make something called a Web Font, it had better be hinted<br>
      - Charge based on the amount of work put into each<br>
      - Make the licences identical—what they are paying for is the <strong>file</strong><br>
      - (The thing I like about this method is that you don't have to rely on other people. It's self enforcing, except for people's ability to copy the file. But you have to just accept that no matter what you do. Also, if you have a basic version available, that's all most people who are inclined to steal fonts want anyway. I hope that people operating on a professional level are not as insensitive, but, again, it's an occupational hazard.)</p>
      <p>Here are my opinions:<br>
      - It is reasonable to limit the number of users<br>
      - It is unreasonable to limit the applications<br>
      - If they want to embed or create a .woff, that's their business<br>
      - If they want to use it poorly, that's their business<br>
      - If they want to buy a $900 dress and make it into a toilet seat cover...<br>
      - I think you can tell where this is going</p>
      <p>Here are my preconceptions:<br>
      - There is no hope for a type designer to make a living solely on that trade<br>
