      <p>&gt;Did type designers struggle to survive before they started charging for web rights of their non-hinted fonts?</p>
      <p>I think the answer is clearly yes. Type designers struggle to survive, and very few earn enough for type design to be their sole source of income. @font-face represents a new market, which may help them devote a greater proportion of their time to designing type. Income may come from selling extended licenses, doing paid work for Google, offering their work through service providers like typekit, or doing custom work for corporate clients. Open-sourcing some fonts may be part of that business strategy.</p>
