      <p>@chank</p>
      <p>Thanks for chiming in. I found your comments about user feedback extremely useful. And yeah, what's up with Google fonts? Google Dafonts is more like it.</p>
      <p>@butterick</p>
      <p><em>"Or if you're someone who assumes that a lawyer experienced in intellectual-property law knows no more or less than anyone else about intellectual-property law — no lawyer is infallible, and some issues in the law are genuinely ambiguous, but come on. As a matter of probability, that's just wrong."</em></p>
      <p>Kent implied that Tristan should give your opinion, in light of your being a member of the bar, more weight. And there's no rational reason he should, IMHO, that's all. (I am not looking to expand my remit and start picking on lawyers, too. Fear not!)</p>
      <p>And you're certainly right about Typophile being a crappy place to learn about author's rights. But I think that's just a reflection of the times we're living in. Making practical judgments about what's copyrightable and not in the world of atoms is pretty straightforward. Thirty years ago, you knew where you stood. But today? Fuggedaboutit!</p>
      <p>In one of the rare instances I agree with Antonin Scalia, I agree with him on this:</p>
      <p><em>"As laws have become more numerous, and as people have become increasingly ready to punish their adversaries in the courts, we can less and less afford protracted uncertainty regarding what the law may mean. Predictability, or as Llewellyn put it, "reckonability," is a needful characteristic of any law worthy of the name. There are times when even a bad rule is better than no rule at all."</em></p>
      <p>Today, intellectual property law - especially in regards to software - is mostly being made by judges on a case-by-case basis. Highly experienced IP lawyers are constantly, constantly surprised by court rulings. It's like the joke about particle physics: if you think you understand it, you don't understand it. There is no law worthy of the name. It's a crap shoot. And an expensive crap shoot, at that, where the wealthy hold a decided advantage.</p>
      <p>No point debating the "probabilities" of what the average lawyer might or might not know about IP law.</p>
      <p>For fun, here's today's font IP quiz:</p>
      <p>What was the basis of The Font Bureau's complaint against NBC?</p>
      <p>1) Breach of contract<br>
      2) Copyright infringement<br>
      3) Trademark infringement</p>
      <p>Multiple answers are permitted. (For example, 1 AND 2)<br>
      This is NOT open book, you gotta answer without looking it up. (And, BTW, I've seen online articles that get this very wrong.)<br>
      Extra credit if you can name the two typfaces involved.</p>
      <p>rich</p>
