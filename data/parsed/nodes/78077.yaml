      <p>The feedback I get from paying designers is more valuable than the feedback I get from free font users. It feels nice to get compliments, donations and praise but I've rarely received useful feedback from a typographer about a free font. How rarely? In 13 years, I can only recall a single instance of useful advice from a professional about a free font*. All useful feedback I get is from paying customers. While you'd think there's no shortage of people looking gift horses in mouths on the Internet, it never happens.</p>
      <p>The people with the most typographic knowledge are precisely the same people who are the least likely to even consider using a free font. Put that on a t-shirt, hippies.</p>
      <p>I'll give you an example: vertical metrics settings. Even tho I released hundreds of free fonts with bad vertical metrics, not a soul mentioned it. When I started selling fonts in 2001, I started getting feedback from customers who noticed that the vertical spacing was inconsistent between Mac/Windows, accents getting clipped. I also got feedback about Mac PS font families not appearing properly in specific application menus. Unless you happen to already be a typographer, how are you going to discover these things on your own? If someone uses a free fonts and it doesn't perform well, they'll just skip it and choose another font.</p>
      <p>With free fonts you're just going to get praise. Advice from free font users is like having an art teacher who praises everything you do. It makes you feel nice, reinforces ignorance and helps you develop bad design habits.</p>
      <p>* About 11 years ago, one kind, bold typographer pointed out how the overshoots in my free fonts were always too subtle.</p>
