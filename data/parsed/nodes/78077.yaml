      <p><cite>civil discussion among equals, and thus that I would be allowed some fair leniency. It is apparently more akin to a hearing</cite></p>
      <p>Dude, you can't expect to go onto a discussion board populated with professional typographers and expect a safe haven for flagrantly incorrect statements of fact and law.</p>
      <p><cite>You did and continue to present proprietary software as analogous with fonts. They are not literally software.</cite></p>
      <p>Not true. You are confounding font designs and font software. In the US, the design of a font is not copyrightable. (A font design can be patented, but that seldom happens.) But the instantiation of the font design as a digital file, including the placement of the points, and hinting, is copyrightable software. Moreover, unless the designer chooses some kind of open license, these font files are proprietary software. </p>
      <p><cite>Proprietary is both unique and can not be legally simulated by the competition</cite></p>
      <p>Not true.</p>
      <p><cite>From the Wikipedia article "Proprietary Software": Proprietary software is computer software licensed under exclusive legal right of the copyright holder. The licensee is given the right to use the software under certain conditions, but restricted from other uses, such as modification, further distribution, or reverse engineering.</cite></p>
      <p>That's an accurate definition. Note there is no reference to uniqueness or whether something can be simulated by the competition. </p>
      <p>And this all goes back to the original posting — your opinions about how webfonts should be licensed seemed to be based on a misunderstanding of what rights font foundries are entitled to assert. But having received some excellent clarifications, you're still contending that "proprietary software" means something different than it does, and that fonts aren't proprietary software.</p>
      <p>I'm reminded of the joke: What do you tell a man with two black eyes? Nothing, because he's already been told twice.</p>
      <p><cite>This was in response to Buttericks assertion of the similarity between proprietary software and fonts. I maintain that thinking of fonts as proprietary is at the very least ironic, and is not supported by the law</cite></p>
      <p>Too bad we don't have a lawyer on this board to clarify these things.</p>
