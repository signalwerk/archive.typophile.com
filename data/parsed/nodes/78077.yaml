    html: |-
      <p>@ Florian</p>
      <p><cite>Fonts are not cars.</cite></p>
      <p>Wow! If a deserved member of this forum admits that, it is like the Pope would admit, that god has not created the human.</p>
      <p>@ Tristan</p>
      <p>I couldn’t agree more. Or no, I can: If someone already has licensed a font, which then becomes available as webfont, it is pure rip-off, if he has to pay for a license a second time, especially if the font was not optimized for screen use. Furthermore it is pure rip-off, if you have to decide, if you want to license the PostScript or the TrueType flavored version of a font. And it is rip-off, if you license the pro version of a font and you get only the pro version, although it also is available as subset variety.</p>
      <p>Actually many foundries don’t sell webfonts, but webfont licenses only. Webfont does not mean, that you just pack a font into the woff, eot or svg format. Where is the effort of the foundry, that justifies an extra payment, if that, what they call a webfont, is absolutely not legible on screen? And if the half of the character set in that, what they call a webfont, can not be accessed by the browser, because it is not uniencoded (small caps in the pro version of a font, which is sold as webfont), why does the licensee has to pay the full price? And all these licenses, that forbid any modification, subsetting for example, they are beyond real life! It is like you would selling your childs to a factory and in the same time, you expect, that they don’t work there, because they could be harmed.</p>
      <p>Some of you cannot decide, what they want to be – exalted creators or manufacturers. Especially body text typefaces are not primary art, but objects of utility. But many license agreements are so beyond real life, that I think, the licensee obviously is only allowed to put the fonts into a vitrine. One example: The license agreement of TypeCulture. The user is not allowed to embed the font into PDF, but has to convert the outlines. And in their specimen you can read, that the font may be printed more fat, because it was converted. On the other side this license was obviously no protection, because Expo and Expo Serif are floating around the web in original condition. Really, a psychiatry can only come to the conclusion, that the authors of those agreements are paranoid. And auto aggressive, because there are probably many potential licensees, that don’t purchase licenses, because they had to break the license, if they want to do anything else with the fonts than putting them in a vitrine.</p>
      <p>Except from that there are masses of people, that are willing to accomplish cultural contributions for free. But they have to pay for each and everything. They cannot publish their work, because they would be liable to prosecution. And in the end the world looses their work. Alternatively they could do extra work for earning the money for the payment of all their digital materials (which cannot be stolen, because they are not physical stuff). And the more they work for money, the more they loose time for being creative. There is a point, at which strong copyright restrictions lead to cultural impoverishment, because you only can be creative, if you are professionally creative. And commercializing in art often ends in banalities.</p>
