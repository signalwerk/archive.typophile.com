      <p>1) There's more to the Internet than websites. iOS lets you develop apps that are native, "web apps" that behave like apps but live on the web, and hybrids in between. (Many "native" apps you can get today are essentially a light wrapper around a web browser.) This approach is apt to accelerate with the advent of HTML5. Because these apps are based on web technologies, webfonts will provide the typography. But Windows is not an issue.</p>
      <p>2) The huge installed base of Windows is a fact, but not always relevant. Specific sites may have substantially different usage profiles. For instance, I run a website where only half the visitors are on Windows, and only half of those use XP. I have two choices (as all web developers do): spend money on a webfont solution that accommodates the lowest common denominator, or use platform-specific CSS to give Windows users Georgia, and something different for everyone else. The best business decision is to spend my dollars on features that all the visitors can appreciate, not just 25% or 50%.</p>
      <p>I also consider the problem from the other direction: if half my visitors are on Mac, why should I limit myself to fully-hinted webfonts? Because that imposes unnecessary design limitations.</p>
      <p>Again, I'm glad folks are doing fully-hinted webfonts. For some websites, they will be essential. But for others, they won't be practical, and not because the people who run those websites are "idiots."</p>
