      <p>In the long term, no professional web developer will want a hosted webfont service. They will want to get a WOFF file, put it on their web server, and get on with it. Any type foundry serious about being in the webfont business needs to tune into that. FontShop, WebFont, MyFonts are already selling self-hosted licenses. Good for them. I hope others follow suit.</p>
      <p>Quality is a separate issue. Hinting, for instance, is great for people who need hinting. Those who don't — e.g., people who are exclusively targeting iOS —&nbsp;won't care to pay a premium for something they don't need. Foundries are free to make whatever bet they think is right and make their case to the customer.</p>
      <p>Previewing is a separate issue. MyFonts has no preview system. That's bad. TypeKit, last I tried it, had an inaccurate preview system. That's even worse. FontFont has fontfonter.com, which is good. Tim Ahrens has a similar kind of previewer for Facit. </p>
      <p>Pricing is a separate issue. I have reservations about subscription-based and usage-based pricing. But if foundries can make it stick, good for them. No idea how "ethics" come into it. Customers who need these rights can pay for them. Some foundries will eventually roll those rights into the main license; some won't. Compare PDF embedding. FontShop allows PDF embedding in its standard license for FontFonts. Other foundries charge extra, or don't allow it at all. Life goes on.</p>
