      <p>Hey Berlow, stop picking on type designers. That's my job!</p>
      <p>To get back to licensing - and leaving "quality" (whatever it means) alone for the moment, I find it tough to come to any conclusion about web font licensing except that we are at an impasse.</p>
      <p>A Mexican standoff of sorts caused by the fundamental nature of digital tech.</p>
      <p>Let's consider two general classes of developers looking to use web fonts:</p>
      <p>1) Those working on existing sites looking to "swap out" text-as-images and SIFr generated text. And, to some extent, the web safe system fonts.</p>
      <p>2) Those working on new sites or redesigns.</p>
      <p>The first group is probably a lot more amenable to the services solution, at least at first. They're swapping font-like elements for actual fonts. And they know what they are looking for. (Something like what they are already using but in another form.)</p>
      <p>The people in the second group, however, can't come away happy under the current system.<br>
      Most web protoyping is done in Illustrator/Photoshop and - barring a ground-breaking new app - that situation will continue for the foreseeable future.<br>
      And without an installable font how do you preview anything resembling what you're proposing for the client?<br>
      "Well, we're showing it you like this, but you have to imagine it with that font there."<br>
      Anybody who's ever had to pitch a development project to a client or management will find this hysterical. Once you use the word "imagine" you're ordered back to the drawing board.<br>
      And once they sign off, if anything's different in the final project, you'll be called on the carpet.</p>
      <p>The current system just forbids previewing. The price structure forbids it. And if you want to show a variety of fonts, the costs are nuts.</p>
      <p>But is the type industry about to suddenly change to a "try and then buy" lending-library type of solution?</p>
      <p>One three-man web design shop out of Indiana reported to me:</p>
      <p><em>"We don't like the idea of having to charge clients additional fees for fonts! Up till now we've struggled with what to do with fonts and haven't reached a solution.<br>
      We're playing with ideas and, perhaps mistakingly, are looking for economical solutions."<br>
      </em></p>
      <p>I think that's very typical of what's going on. Barriers at every turn.</p>
      <p>One solution would be for the Adobe apps - or an Adobe competitor - to have a feature for breaking free of the system fonts and directly accessing fonts for preview just as the browsers now do, but with, dare I say it, some kind of DRM restriction built in. (Just an idea off the top of my head. I don't know if I'm in favor of it, or opposed!)</p>
      <p>Extensis' WebInk app - from what I've seen of it - is a step in this direction.</p>
      <p>But that's where we stand today - a standoff.</p>
