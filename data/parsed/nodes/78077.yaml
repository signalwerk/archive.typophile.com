      <p><em>If the license is for webfonts and if the format is a webfont format, it does not mean, that it really is a webfont.</em></p>
      <p>Arno, the train has left the station.</p>
      <p>There is no technical standard for web font rasterization or hinting, which seems to be your main issue.<br>
      In order to open up the typeface world to web designers, and make available the vast range of typefaces promised by "@fontface", which, after all, is the point of the exercise, foundries and webfont distributors are selling types that have:<br>
      - a web licence<br>
      - format that works in web browsers to support "@fontface" and protect the rights of licensor and licensee<br>
      - TrueType hinting</p>
      <p>De facto, that is the general definition of "web font".</p>
      <p><em>The fair market is snow-blowing money at solutions centered on unhinted ttfs, smart rendering and resolution-appropriate devices, brought to us by a bureaucracy known as Apple. Now what?!</em></p>
      <p>What am I supposed to do David, miss the boat on a point of honour?<br>
      Would you have I not make Shinntype fonts available for web use, because they only have basic hinting, not delta?<br>
      That would be poor business.</p>
      <p>My fonts are distributed as web fonts by reputable companies, following the direction in which the industry is going.<br>
      Those distributors approached me and wanted my PostScript fonts, as is, and said they would turn them into web fonts (licence, wrapper, and TrueType autohinting), which they did.</p>
      <p>The ball is in the web designer's court.<br>
      The smart ones will use fonts such as Beaufort more for display than body copy.</p>
      <p>It's not like a font isn't a web font just because it's not delta hinted for optimum rendering in small body text.</p>
      <p><em>Where is the logic in that?</em></p>
      <p>By that criteria, any magazine display font that reads poorly in body text is not a print font.</p>
