      <blockquote><p>Foundries are starting to charge extra for the right to embed fonts on the web.</p></blockquote>
      <p>That's one way to look at it. Foundries who are investing massive amounts to optimize their fonts for the web see it differently.</p>
      <p>One of the points of <a href="http://typographica.org/2010/on-typography/the-webfont-revolution-is-over-let-the-evolution-begin/" rel="nofollow">my post</a> is that a good webfont is not the same as a print font. Sure, you can do nothing to your fonts and simply allow them to be used online. But if you want to do it right, you must spend money and/or time on extensive preparation (kerning, redesign) to make it work as well on Windows as most paying customers expect. This makes it a separate product deserving of its own price. </p>
      <p>That price is most fairly determined by the size of the user, be it a single blogger or a Fortune 500 company with a popular website.</p>
