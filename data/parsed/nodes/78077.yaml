      <p><em>… you still have the responsibility to offer a product that is what it claims to be … </em></p>
      <p>It's a web font: the format is for web use, and so is the licence agreement.<br>
      As far as the rendering goes, the distributor presents a "cascaded size" specimen for potential licensees to appraise its appearance in action -- which is a better "look-see" than purchasers of fonts for print get—unless there is a comprehensive offset-printed specimen, which is quite unusual these days.</p>
      <p>Web designers should be aware that all these new fonts they can now use instead of Georgia and Verdana are not hinted to the same standard. That's the trade off: way more selection, not so good rendering on Windows.</p>
