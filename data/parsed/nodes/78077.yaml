      <p><em>Due to the hinting, of course - I'm looking in Windows GDI</em></p>
      <p>It looks pretty good on a Mac screen.<br>
      I make no apologies for how it appears on Windows at certain sizes.</p>
      <p>I supplied FontSpring with "desktop" OpenType CFF files, and they made the conversions to the web formats.</p>
      <p>As I see it, the responsibility for screen-font appearance is split five ways:<br>
      - Foundry<br>
      - Reseller (also something of a manufacturer)<br>
      - User's device manufacturer<br>
      - User's browser application<br>
      - Web site designer: <em>caveat emptor</em>. The web designer is tasked with choosing a suitable font for the web page design, just as with print.</p>
      <p>And to an extent, end users can bump up the type size if they want to improve the rendering.</p>
      <p>However, as the typographer and font licensee, it is the web site designer who ultimately bears the most responsibility, and will control the market and how this plays out.</p>
      <p>Also, in future there will be better screen resolution, and Windows will improve its font rasterization to take account of how poorly it deals with all these fonts which are now available through @fontface, compared to Mac :-)</p>
