    html: |-
      <p>Tristan, as others have pointed out, the standard model for software including fonts is licensing, i.e. what you purchase is a license that grants certain rights to the use of that software and that may also reserve other rights. Unless a font license explicitly grants a permission for web linking with @font-face you can't assume that your purchase of that license includes such permission.</p>
      <p>In this model, the rights granted or reserved, like the price, is determined by what the market will bear. If all font users declined to purchase licenses that did not include permission to convert to and serve WOFF or another web font format, then foundries would need to respond to that. Of course, they'd likely raise their prices as part of the response, in order to recoup some of the income they would lose from being able to sell separate web font licenses or subscription services. And you might give some thought to whether you might not actually prefer a licensing model in which you pay a smaller amount for discreet rights rather than a larger amount for an exhaustive bundle of rights.</p>
      <p>Specific legal jurisdictions may have some say about what rights might be reserved, which are fair play, etc., but the basic licensing model is the same. Even open source software operates under a licensing model, just one in which few or no rights are reserved (but which may, in fact, involve imposition of responsibilities, such as requiring all products incorporating the open source code to be available under the same open source license).</p>
      <p><em>I see it as being in the same category as trying to charge for the right to print a font on certain types of paper.</em></p>
      <p>If a license were to prohibit printing a font on a particular type of paper, that might be perverse -- although I can think of reasons why a font designer might desire such a restriction, just as I can think of reasons for restricting the range of sizes at which a font might be used, i.e. to prevent users from making a the type designer's product look like crap --, but it would be entirely within the rights of the font license vendor to impose such a prohibition.</p>
