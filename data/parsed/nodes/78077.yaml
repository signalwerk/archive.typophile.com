      <p>The expression <em>personal use</em> invites to misunderstanding. <em>Non-commercial use</em> is the better expression in my opinion.</p>
      <p>Micropayment like Flattr could be an alternative to the free non-commercial use. And I assume, that it is easier to make out the illegal use of commercial webfonts than the illegal use of fonts in documents, that are created for printing, because in most cases you don’t have access to the digitized document, PDF for example. But in case of a webfont you can download it and check, if it is legally used.</p>
      <p>Edited: Micropayment shall mean in this context, that not the owner of the website pay for the font, but the visitors of the website. The owner of the website places a button with the text “webfont donation” on his website. (But not on each page. Only on the start page.)</p>
      <p>Or why not do the following: Someone wants to use a font for a non-commercial project. The address of the project is xyz.com. The commercial license costs 50 dollar per style. You could sell it for 10 or 15%, if it is used in a non-commercial web project and you only accept payments from an email-address, that belongs to xyz.com, <a href="mailto:alphabeta@xyz.com">alphabeta@xyz.com</a> for example. In this way, you could check, if the project is really not commercial. As far as I remember you can connect a Moneybookers-account with more than one email-address.</p>
      <p>Addition: Yes, why not place the licensee under the obligation to specify, on which website he wants to use your font? If you see, that your font is used on a website, that is not stored in your database, you know, that it is illegally used. If the website is non-commercial, the user pays 10 or 15%. If it is commercial, he pays 100%, but he gets additionally a free license for the print version of the font. But letting the customer pay twice (the FontFont model for example) is rip-off.</p>
