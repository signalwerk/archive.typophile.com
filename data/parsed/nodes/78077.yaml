      <p>As a lawyer, my policy is not to discuss legal issues with nonlawyers, except for basic issues that are ordinarily known to practitioners in a given field. For instance, most professional type designers correctly understand the distinction in copyright law between font designs and font software. That's basic. Or the mechanics of a proprietary-software license. That's basic too.</p>
      <p>That policy hasn't come about because I'm stingy or rude. It's come about because one inevitably runs into folks who are more interested in protecting their misinterpretations of the law, rather than educating themselves. (See, e.g., <a href="http://www.theonion.com/articles/area-man-passionate-defender-of-what-he-imagines-c,2849/" rel="nofollow">"Area Man Passionate Defender Of What He Imagines Constitution To Be"</a>.) </p>
      <p>For instance, if you're someone who really thinks fonts aren't software, why should the burden be on me to persuade you otherwise? Or if you're someone who assumes that a lawyer experienced in intellectual-property law knows no more or less than anyone else about intellectual-property law — no lawyer is infallible, and some issues in the law are genuinely ambiguous, but come on. As a matter of probability, that's just wrong.</p>
      <p>Typographers who carry around defective ideas about the law or the court system do themselves a disservice, because any intellectual-property business is deeply intertwined with the law. Typographers who <em>spread</em> defective ideas about the law do everyone else a disservice, like an ignorant teenager disseminating bad information about birth control.</p>
      <p>Typophile, for its many virtues, ends up being a bad place to learn about the law of typography because of the large quantity of opinion, speculation, and occasionally crackpot invective held out as "the law." Some folks get it right, but I can tell the difference only because I know better.</p>
      <p>For what it's worth, I find that lawyers are much more receptive to learning about typography than typographers are to learning about law. Which is the reverse of what I'd expect, since lawyers' livelihoods don't depend on typography.</p>
