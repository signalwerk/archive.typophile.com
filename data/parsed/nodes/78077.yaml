    html: <p>We admittedly offer products that may not always render well in Windows. However I think Fontspring bests many distributors offering third party fonts because our webfonts are always autohinted instead of a “dumb” conversion from OTF-&gt;TTF that others seem to use. (This same autohinter, used by our sister site Font Squirrel, is converting thousands and thousands of webfonts every month.) By doing this we open the webfont market to all font designers. You may argue whether this is good or bad philosophically. Our experience is that the vast majority of early adopters understand the rendering issues and choose accordingly. Foundries who 1) invest their time and money in hinting their fonts by hand and 2) Offer those fonts as webfonts are quite rare as you know. I see this as a temporary problem and a tradeoff worth making to move the font business forward.</p>
