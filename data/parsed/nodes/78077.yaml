      <p>@dunwich type</p>
      <p>Sorry, started waxing eloquent and forgot about ya.</p>
      <p>Yes, you are doing about all you can do. It's true.<br>
      But I gather you get my point that the buyers on the other end are caught in a bind also. It isn't laziness. It's fear of having bought something with no ROI if it proves inadequate for whatever reason. Few web devs can afford to speculate in this way.</p>
      <p>I'm reminded of a <a href="http://vimeo.com/7587791" rel="nofollow">video</a> Erik Speikermann did at ATYPI 2009 where he painted a picture, very charmingly and optmistically of how the web would just kind of naturally accept a situation similar to what happens in the print industry. With the font figured into the total cost and everybody lives happily ever after. (I hope I'm paraphrasing accurately. Erik's upbeat, winning personality masks all doubt about the plausibility of the scenario. It's so reasonable and so right, surely it will come to pass!)</p>
      <p>Look, you can make anybody swallow anything if you've got enough negotiating power, but the structure, the rhythm, the expectations in web work are entirely different and those who do it are not going to twist themselves into pretzels just because Puckett or Fink have got bills to pay.</p>
      <p>But enough already...</p>
