    html: <p>Fonts are not cars. Having said that, you actually <em>can</em> buy and, somehow, ‘own’ a typeface. It is called custom type (or ‘exclusive rights’) and will cost you the equivalent of a car. Licensing a font is more akin to renting a car. Most providers will prohibit taking the fonts to the web, or charge extra for it. Just like most car rental services do for taking the car across the border.</p>
