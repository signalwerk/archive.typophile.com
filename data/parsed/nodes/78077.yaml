      <p>Butterick: <em>Tristan, I was not drawing an "analogy" between the world of fonts and the world of proprietary software. I was pointing out that most fonts are proprietary software. This is a fact.</em></p>
      <p>Dictionary: <em>having analogy; corresponding in some particular: A brain and a computer are analogous.</em></p>
      <p>You did and continue to present proprietary software as analogous with fonts. They are not literally software.</p>
      <p><em>Not the only major flaw, by the way.</em> | Please continue. The ratio of snark to useful comments in this thread is sad.</p>
      <p>-</p>
      <p>k.l.: <em>Just look up what 'proprietary' means and use the term properly. And if you mean something else, use a more appropriate term. If you speak about originality/newness in type design, then just call it so. ... it does not matter much whether you introduced a term or anyone else did – it is up to you to pick it up (or not) and (once you decide to do so) to use it properly. Which you didn't, including in this other comment (your reply to John Hudson in the second half of it) when you continue abusing the term in question.</em> | I realize my delay in defining the term is suspicious, but can you not assume the worst about me—just for the sake of a civil conversation? We all use words based on the definition we have in our heads. The reason I hesitated to post the definition I was using was that I wanted to give a thorough presentation of the way I was thinking of it, the way the definition defines it, and the connotations it has in the context of software. You should be aware that the connotations of a word make its use more complex than its meaning alone would, and that they are often more important. I, being aware of this, looked up both the Wikipedia article on proprietary software and the dictionary definition of proprietary. I found that the definition "Belonging to a proprietor" was less than helpful, and was thus discouraged. I also had a headache, so I procrastinated my quest.</p>
      <p>My apologies as well for assuming this to be a civil discussion among equals, and thus that I would be allowed some fair leniency. It is apparently more akin to a hearing.</p>
      <p>I might point out that in your post you "picked up" both 'amateur' and 'proprietary' (the latter by implying a contrary opinion about it) without offering a definition for either. (How about being proactive?) Also, somewhat incidentally, the paragraph you refer to actually kind of comes close to defining what I meant by proprietary, but I'll get to that presently...</p>
      <p>Here are my thoughts on the word "proprietary" (which I am now sick of hearing)...</p>
      <p>Firstly, I will describe my understanding of it at the time I used it. Something that is Proprietary is <strong>both unique and can not be legally simulated by the competition</strong>. A proprietary format is one used solely by a particular program (though, technically, some such formats do get picked up by third parties, such as .doc, which can be opened and saved by OpenOffice"). John Hudson was using only the first half of this when he said that a font's proprietariness (paraphrasing here) is what makes it valuable; this is what I was pointing out when I said <em>"the differences in type that you're talking about are not strictly proprietary."</em> At this point, I admittedly should have supplied my definition in a more strict fashion, but I merely elaborated thusly: <em>Anyone can use those ideas in his own font—if he wants to put the work into making a font that already exists.</em></p>
      <p>From the dictionary (5th entry): manufactured and sold only by the owner of the patent, formula, brand name, or trademark associated with the product: <em>proprietary medicine.</em></p>
      <p>This is kind of vague, and fails to explain the commonly understood term "proprietary format" since formats are not sold, but it was the most relevant definition of the six. None of them came close to supporting Hudson's claims, but they also came short of fully justifying my own.</p>
      <p>From the Wikipedia article "Proprietary Software": Proprietary software is computer software licensed under exclusive legal right of the copyright holder. The licensee is given the right to use the software under certain conditions, but restricted from other uses, such as modification, further distribution, or reverse engineering.</p>
      <p>The type of associated licence agreement is indeed similar to those of fonts, probably justifying some people's arguments, but I can't remember whose.</p>
      <p>From the Wikipedia article "Proprietary Format": A proprietary format is a file format where the mode of presentation of its data is the intellectual property of an individual or organization which asserts ownership over the format. ... Proprietary formats are typically controlled by a private person or organization for the benefit of its applications, protected with patents or as trade secrets, and intended to give the license holder exclusive control of the technology to the (current or future) exclusion of others.</p>
      <p>This gives some credence to my "can't be legally simulated" clause, and in all of these I think it's fair to say that uniqueness is implied [waits for off-topic flamewar].</p>
      <p>Lets look back at my first use of the word, which was to say that type design is based on the superficial redesign of an non-proprietary catalog of symbols—an act, the idea of which I mistakenly referred to as unproprietary, confusing some. This was in response to Buttericks assertion of the similarity between proprietary software and fonts. I maintain that thinking of fonts as proprietary is at the very least ironic, and is not supported by the law. I'll repeat my previous statement regarding this:</p>
      <p>Additionally, the differences in type that you're talking about are not strictly proprietary. Anyone can use those ideas in his own font—if he wants to put the work into making a font that already exists. New ideas in fontography are increasingly rare—especially in text fonts. No one ever responded to my query about the legality of ripoff fonts, but as someone in another thread mentioned, the shapes of a font are not protected, only the file itself***.</p>
      <p>**Or at least tweaking them.</p>
      <p>***I know I said I wasn't interested in the legal issues, but I also think this is the right way to handle it.</p>
      <p>-</p>
      <p>Myself: <em>Design firms might charge based on how much they think they can squeeze out of a client, but not all of them.</em></p>
      <p>Nick: <em>Dude, you should get over being so cynical, and transcend the notion that the ethics of business is deciding where to draw the line between ripping off clients and altruism.</em></p>
      <p>*sigh* I said "might." I was giving a tentative example of a business that might charge based on "the size of the user" as Stephen put it. I can buy that you are merely passionate about these issues to a point, but as you devote more of this thread's space to vitriolic sniping, it becomes harder for me to assume the best about you.</p>
      <p>Elbert Hubbard, via Nick: <em>… the first requisite in success is not to achieve the dollar, but to confer a benefit … the reward will come automatically, and usually as a matter of course.</em> | This is fantastic advice and relevant to the conversation. Thank you for posting it.</p>
      <p><em>The benefits of @fontface and the gazillion web fonts it has spawned are increased selection, availability and low cost.<br>
      Sure, there are quality issues, but three-out-of-four in the tetrad of Price/Quality/Selection/Delivery ain't bad.<br>
      Quality is always an issue, which is why the edge bleeds.<br>
      Quality will improve (better rasterization, better resolution, better auto-hinting), but in the meantime the early adopters who are most discriminating and assiduous in their use of web fonts will be able to offer a genuine benefit to their clients, and they will flourish.</em> | I agree with all of this as well.</p>
      <p>-</p>
      <p>Sorry if I missed any points, but I really need to be going now. Let me just remind you all that I appreciate your contributions that are on-topic. I am enjoying the discussion and am eager to consider your contrary views.</p>
