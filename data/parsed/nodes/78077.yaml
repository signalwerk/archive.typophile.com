      <p>Sorry for the delay. I'll keep this one short.</p>
      <p>I missed this post by Hudson (I think it was posted as I was writing one of mine):</p>
      <p>--------</p>
      <p>Tristan, as Karsten points out, it is everything you have written that I thought identified you as an amateur, not a specific statement. Re-reading, though, I note</p>
      <p>I am an aspiring type designer</p>
      <p>and later</p>
      <p>There is no hope for a type designer to make a living solely on that trade</p>
      <p>which makes me wonder if you are yet an amateur, or only aspiring to become an amateur, since apparently having type design as a profession is beyond hope (which in turn makes me wonder what it is that I have been doing for the past seventeen years).</p>
      <p>Seriously, you don't know what you are talking about and are coming across as kinda foolish. You're talking to some type design professionals here, people who make a living doing this, and do know what they're talking about even though they often disagree. When David Berlow or Matthew Butterick say something -- even if I have trouble figuring out what David means a lot of the time and sometimes disagree -- I take it seriously because they have years of experience and a body of work to back it up. I'm sorry, Tristan, you don't have the basis of experience and knowledge to be making the kind of pronouncements you are spouting. Now, I won't hold this against you, because in 1994 I was young and inexperienced and shouted my mouth off on the comp.fonts newsgroup, but I reckon no one had grounds to take me seriously until about 1998, by when I'd actually done something. I look forward to the day when I can take you seriously.</p>
      <p>--------</p>
      <p>I should not have teased you for confusing your arguments with wordplay when I have been guilty of tongue-in-cheek comments that I should have known would be misinterpreted. I thought by labeling such things as "preconceptions," however, I would at least avoid people thinking they were "pronouncements." Of course people have made livings on type design. My hyperbole was based on comments in this forum, mostly. ("As to the original question, why don't you, rather than merely discuss, do what you propose and in two to five years tell us about your experiences? And to make it a real test, no support by parents, rich girlfriend, etc, are allowed." "I think the answer is clearly yes. Type designers struggle to survive, and very few earn enough for type design to be their sole source of income.") Those were both on this page. There were other influences too...some books I'd read maybe. I don't remember. That's why it was nothing more than a preconception. My preconceptions are wrong, you say? Well thanks for the tip. As a rational* person I already assumed that.</p>
      <p>Let me say one thing about amateurism, professionalism, and credibility. In a discussion, you are only as credible as you present yourself. Just saying "you're wrong" "you're an amateur" doesn't win arguments—there is no winning. If you are right, present your arguments (courteously).</p>
      <p>-</p>
      <p>Okay, as to Butterick's legal issues post... What you are saying makes sense. I can see how you would come to such a policy. But. I am not arguing to win here. You'll have to just take my word on that. I didn't mean to sound like I was discrediting your definition by calling it a legalism, I really do want to know if that's the reason we're at a stalemate about it. | <em>For instance, if you're someone who really thinks fonts aren't software, why should the burden be on me to persuade you otherwise?</em> | Because we're in a discussion. I don't run things by you to check whether or not they're right (except for those legal questions), I expect you to provide a counterclaim. My definition of software came from experience, and was confirmed by Wikipedia's definition: "a collection of computer programs and related data that provide the instructions telling a computer what to do and how to do it." I even got dragged into playing 20 Questions with you, coming up with a possible theory about why your definition is different. Could you meet me 1/4 of the way? 1/8?</p>
      <p>For someone with no time to argue for sport, you are sure dragging this out.</p>
