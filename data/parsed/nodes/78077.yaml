    <p>I've been researching the various means to embed fonts on the web off and on lately, and aside from giving me a headache with its numerous options and implementation methods, there was something about it that didn't sit with me. Foundries are starting to charge extra for the right to embed fonts on the web. I'm sure you're all aware of this by now, and from the lack of discussion about it that I could find here, I'd suppose you range from okay with it to gung-ho.</p>
    <p>Before I go on, let me say that I am an aspiring type designer who would, if it were viable, prefer to make a living on that alone. I have not, however lost touch with the needs, wants and rights of the consumer. Therefore, I can't feel right about this "give them the car, sell them the gas" policy. Incidentally I also believe that every typeface should be available free for non-commercial uses, though that's just an ideal of my own and I respect others' option to charge for it.</p>
    <p>There used to be a time when you owned something after you bought it.</p>
