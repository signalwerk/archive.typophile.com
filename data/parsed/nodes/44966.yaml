  html: |-
    <p>first question:<br>
    is there a technique for rounding glyph corners without distorting the rest of the glyph using FontLab or Illustrator?</p>
    <p>what i mean by this is how to make round corners on a P, D, B and other glyphs that have both straight lines and curves, but without changing the curves — just the corners.</p>
    <p>second question:<br>
    how to create a rounded corner from a corner that consists of a straight line and a curve?</p>
