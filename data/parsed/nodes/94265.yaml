      <p>In this case it is a font, albeit a custom one. (And one, incidentally, that I think is really attractive and interesting, one of my favourite new designs this year.) It's called Gaffer and is a collaboration between <a class="freelinking external" href="http://www.gregorybonnerhale.com/" rel="nofollow">GBH</a> and <a class="freelinking external" href="http://www.daltonmaag.com" rel="nofollow">Dalton Maag</a>. More info here: <a href="http://www.itsnicethat.com/articles/puma-gaffer-font" title="http://www.itsnicethat.com/articles/puma-gaffer-font">http://www.itsnicethat.com/articles/puma-gaffer-font</a></p>
      <p><img src="http://asset1.itsnicethat.com/system/files/042012/4f7da5855c3e3c4f31001367/img_col_main/gafferfont.jpg?1333959514"></p>
