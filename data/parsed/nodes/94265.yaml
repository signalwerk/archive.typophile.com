    html: |-
      <p>The football (soccer) letters by Puma, Nike, and Adidas usually aren't fonts, and don't have names per se. A number of people take the time to create computer fonts from the images available in uniform kits or from images such as the pictures of the jerseys that you've attached.</p>
      <p>On the following site, what the site author refers to as 'fonts' are the images that are available upon request (I don't know if he charges for them); they're most often in raster form but sometimes they're vectors.</p>
      <p><a class="freelinking external" href="http://www.switchimageproject.com/2011/11/puma-oh-puma.html" rel="nofollow">http://www.switchimageproject.com/2011/11/puma-oh-puma.html</a></p>
      <p> - Herb</p>
    html_clean: |-
