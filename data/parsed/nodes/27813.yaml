      <p>A Kodak Approval is a digital proofer, like a matchprint. It is not like an imagesetter. Actually the Approval among others (Latran/Polaroid Polar Proofer, Fuji Finalproof) are great because you can proof on the same stock which you will print and they have very high resloution 2,400-2540 SPI. For type I would think you could buy a L-300 or L-200 with a no frill L3 RIP and processor or a drysetter (imagesetter and film procesor with no chemicals to add) for far less than 10 or so Approval type of proofs. For intermediate proofs Xante makes the best graphic arts B&amp;W Laserprinters.<br>
      Rodi</p>
