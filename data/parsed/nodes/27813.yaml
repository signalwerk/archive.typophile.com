    html: |-
      <p>Some of those pseudo-2400 dpi laser printers use a "variable dot size" technology to fill in the jaggies. This would produce fuzzy-edged images were it not for the co-attractive properties of photostatic toner. If you're lucky, those partial pixels get sucked into the gaps by the larger toner mass's electrical field, creating a smooth contour.</p>
      <p>But that's something I read about a long time ago. I don't know if currently available products use that or something else that's more reliable.</p>
