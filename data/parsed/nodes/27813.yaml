      <p>Yes, any Lino can output either on film or on "paper" (which is actually much thinner than velox however). The problem is that since demand for paper is so low, and since the materials don't last in storage forever, in practice few service bureaus can actually carry out a paper output job, unless you're willing to buy a lino paper cartridge for them. And even then they have to be willing to swallow the overhead of switching between media (which is hard to justify with generally tiny margins).</p>
      <p>hhp</p>
