    <p>OK, I was just sitting and proofing my font on printouts and suddenly felt everything looked strange and then I realized that strange things had happened.</p>
    <p>Why is this happening? I’ve tried to read/understand the manual but am not sure on what to do to avoid this EXTREME problem.</p>
    <p>Please note that this is happening when I print in high-resolution 1200 dpi, and with large point sizes (40 pt).</p>
    <p>I’m working on Fontographer.</p>
    <p>Many thanks in advance from desperate man …</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/trouble_in_sweden_4634.jpg"></div><p></p>
