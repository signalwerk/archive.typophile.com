    html: |-
      <p>Hi Hrant,<br>
      You can buy a classic Approval for under a grand, but it is a little smaller than the 1984 380Sl my wife has. Approval prints run the gamut, but I think Tabloid should run $35.00 if you are not in a rush. They are pretty available, not everyone uses them for contract proofing and Inkjets are quickly biting away because of the cost per print. I've seen legal size (5 pt) type printing black on a yellow  and it was indistinguishable from film output. I have had Latran/Polar proofs made and they were great too, with 7pt serif (Bemtus from URW) knockout type being sharp as a razor.<br>
      For line art an old lino(or Agfa or Monoype, or screen or scitex, or<br>
      Ripit/Exxtra etc) work wonders even at Level 1 postscript. You get a level 3 RIP just to be able to iron out any minor issues and Level 3 is where most output devices are so you can have predictible results You don't have to calibrate if you are going for line work and a desktop imagesetter (Ripit/Exxtra) are no larger (and lighter) than a tabloid laser printer. A roll of film has about 100' feet and can be had at around $80.00-$120.00.<br>
      I had great experiences with L330s, Screens (very expensive even used), and Ripit/Exxtras. What I liked best about the Ripits is Adobe based RIP and ingenious flexible Drum,very accurate and light.</p>
      <p>Actually the problem that Goren describes is more of a Toner and SPI than any acutal laser issue, it is doing its best, but given the resolution and that the dots have to be made with Toner make it heavier. Have you ever noticed that type gets lighter and lighter when you go from Laserprinter to the actual printed piece? This is even more noticlble with inkjets on offset/copier paper too.</p>
      <p>The Truth shall set you free</p>
