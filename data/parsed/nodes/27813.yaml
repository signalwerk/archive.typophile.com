      <p>I have a Xante AW 1200. It uses PostScript and is true 1200 x 1200 dpi. When it is connected through an ethernet connection to the printer, one can vary the weight heavier and lighter in 5 steps. This way you can emulate the weight of an offset. It still doesn't have the sharpness of offset in the inside corners, etc, but you get a better idea. </p>
