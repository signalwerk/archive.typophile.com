      <p>OK, I have some good news / bad news. I got a local shop to make me a Kodak Approval print of sheet one of my tabloid-size Nour&amp;Patria specimen. Goran was right, and that guy was wrong - it's quite impressive. I can't find any of my old velox prints to compare it to directly, but to the naked eye it looks way crisp enough. Looking at it with my 35x loupe, I can see that the black is not extremely black however: it has faint whitish spots spread about. What's most interesting though is the lack of aliasing - instead the outlines are a bit coarse, basically what photo paper does I guess. Ironically, I suspect this might actually make the naked-eye result even better, at least in terms of fidelity to the -eventual- offset output, but possibly even in terms of readability (where I happen to believe there's such a thing as too crisp). On the other hand there's still much to be said for seeing what you've made as crisply as possible - especially when it comes to judging a font's color.</p>
      <p>As for the paper stock used, it has a slight off-white aspect, but also has a nice gentle matte feel, and most of all it's luxuriously thick: I measured it at 9 mils* which is almost as thick as a typical business card. This is I think about 3-4 times thicker than lino "RC paper", and probably twice as thick as velox.</p>
      <p>* With the Soviet micrometer I bought from Yerevan's flea market in October.  :-)</p>
      <p>The bad news: the stuff is very expensive, about $120 for a tabloid print! :-/  Which makes it not cost-effective for "internal" specimens, but -considering the superb paper- probably just the ticket for showing off your fonts.</p>
      <p>hhp</p>
