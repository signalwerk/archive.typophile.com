    <p>I was a little peeved the other day. I find it ironic that the premiere program for print design has a bit of a... design flaw. Or is it just me?</p>
    <p>Apparently, long copy conforms to the baseline. (Without my asking it to! How convenient, for one thing.) But I find it a little weird that the Baseline settings are found in the Preferences menu. And that, unlike the type with which it works, Baseline is adjusted in increments of inches/picas/etc., and not, point.</p>
    <p>Is there a justification for this? It seems like a poorly placed control that’s set up in a way that makes it harder to control.</p>
