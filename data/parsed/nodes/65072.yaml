      <p>It certainly sounds like you have set Align To Baseline as a default option; usually it is off, for new documents.</p>
      <p>The settings in Preferences are mixed: some of them Document-wide, others Application-wide. If you change any preference (any at all! imagine!) with no document open, it’ll become the default for new documents.</p>
      <p><cite>.. unlike the type with which it works, Baseline is adjusted in increments of inches/picas/etc., and not, point.</cite></p>
      <p>Its value is show in your very own preferred vertical measurement unit. One could argue that leading is measured in points in general (as well as in InDesign!), but one could also argue that the baseline grid is meant for the Respect the Grid guys, who don’t care for leading but <em>want</em> to define this grid in their own design units.</p>
