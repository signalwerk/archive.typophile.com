    html: <p>Sorry Peter, that has that early 70’s look when they kerned everything so tight they turned god into dog. As Stephen said it looks very dark and black and that might be because of the lack of breathing room between the characters. I seriously doubt the type designer ever imagined his/her work should have the characters crashed together like that. Its a good start, but a start.</p>
