  html: |-
    <p>I recently designed a logo for an on-campus publication that will be circulated twice a semester to all the teachers at my school. The name for the publication is The Spotlight and for now it will be distributed in print with an online version coming in a few months. The audience is college professors and the focus of the newsletter is to inform them about how they can incorporate technology in their teaching. My school is fairly small and as a result so is the audience.</p>
    <p>At this point in the logo design I’m not at liberty to make any major revisions. Still, I would like to make the best logo possible and so would appreciate your comments (even if they require major revision).</p>
    <p>Our first edition is going to print this Monday, so time is short. My main concern before the first printing is the kerning, particularly between the “li.” I originally had them touching, but I thought that reduced legibility too much. What do you think?</p>
    <p>As a side note, print design is still quite foreign to me, so can anyone point me to some good tips or guidelines for designing newsletters and magazines? My typographic skill, while still on a beginner’s level, is fairly solid. I’ve read <a href="wiki/Robert Bringhurst" class="wiki">Robert Bringhurst</a>’s book, which taught me a lot, but are there any resources (particularly on the web) that focus more specifically on designing for newsletters, magazines, newspapers, etc.?</p>
    <p>Thanks so much. I’m looking forward to your input.</p>
