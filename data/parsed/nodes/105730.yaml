    <p><a class="freelinking external" href="http://myfonts.us/6jqbgN" rel="nofollow">Chefscript Typeface - Buy licenses at MyFont</a><br>
    Chef Script is an experimental font designed by Carlos Fabian Camargo G. Its fantasy design contains 1463 glyphs to compose words, phrases and short messages on small and large sizes. The idea was born in a sketchbook that was perfected again by hand and achieving "non-neutral drawings" on tracing paper. With bezier digitization the empty and full parts of letters appeared with soft and eloquent curves as calligraphic result produces optimal readability.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/1_chefscript_andinistasdotnet_6383.png"></div><br>
