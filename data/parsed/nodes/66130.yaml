    html: |-
      <p>Wow. Thanks so much for this feedback, it's great! I did a bit of work on a few more of the characters tonight, taking most of your suggestions into account. Below is a sample of the font before the edit on top and after the edit underneath.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Implodium-Jan13_6492.gif"></div><p></p>
      <p>The characters I made edits to are the C, E (less "3D"), P, M, L (slightly thinned and less "3D"), G and R.</p>
      <p>I really like the swashy leg on the R, personally, but it doesn't work that well with a lot of the characters. Since I'm not planning on doing the lowercase characters for this font, I thought I could use the uppercase set for swashes, so I could include both versions of the R in the font. (I'd do them as OpenType alternates but I currently only have TypeTool.)</p>
      <p>As for the 3D look of some characters, I think I will back a few of those off a bit (I did already with the L and bottom horizontal stroke of the E) but I don't want to make them completely horizontal. I really like the slightly skewed look of the font.</p>
      <p>So, I'll work on it some more and upload a new PDF a little later, but I wanted to show the changes and thank you both for your input. Let me know if you have any other suggestions.</p>
      <p>Oh, and one final question about the name. First, do you think Implodium is a fitting and catchy name? No offense if you think it's stupid. Second, should it be "Ultra Compressed" or "Ultra Condensed"? Is there a difference between a compressed and condensed font?</p>
