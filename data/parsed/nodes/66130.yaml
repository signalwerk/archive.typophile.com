      <p>I think this is really good stuff and outstanding for a first font.</p>
      <p>You may want to try making the counters extend further into the M instead of or in addition to trapping the angles. Notice how on your W the highest part of the bottom counter goes higher than the lowest part of the top counters? That prevents the situation in your M where the black goes the full width of the letter.</p>
      <p>P looks weak to me.</p>
      <p>I wonder if there's some unhappy tension between the asymmetry of the S, with its low spine, and the halfway structure of letters like BHE. </p>
      <p>On some glyphs the angles you use start to take on a three-dimensional illusion that is distracting. It's mostly the characters that have a horizontal at the top or bottom - I first noticed it on the two and five, but it also happens on the 7 and E. Did you or would you think about not using the same angle that you use for the ends of the strokes on those "horizontals"?</p>
      <p>Is the flare on the R's leg a little overdone? I'm not sure.</p>
