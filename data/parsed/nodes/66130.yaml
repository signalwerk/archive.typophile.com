      <p>All improvements I think, except that I too liked the descending R leg - I just wondered if it should flare (get broader in stroke width) so much as it goes down. /P/ and /M/ look great now.</p>
      <p>/G/ is better and more fitting, but you may want to raise the crossbar (and consequently the overhanging part at the top) to make it more distinguishable from a /C/.</p>
      <p><em> Is there a difference between a compressed and condensed font?</em></p>
      <p>Some discussion here: <a href="http://typophile.com/node/41849" title="http://typophile.com/node/41849">http://typophile.com/node/41849</a></p>
      <p>I know this was sparked by comic books but it makes me think of painted signs on big windows at a car dealership a generation or two ago. That commercialist, retro flavor isn't captured by Implodium to me, although the jokey, action-packed feel does fit pretty well.</p>
