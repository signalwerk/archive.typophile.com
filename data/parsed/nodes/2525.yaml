  html: <p>A bit of a posting spree here… <br><br>Another <span class="caps">MT</span> font, similar in style to Dorothy. Like the majority of my fonts, I designed it with decorative useage in mind. However, I ﬁnd that it doesn’t look that bad set as a text font. Sort of a stylized Sans or something. <br><br>The numbers need a bit of work, I think, but on the whole, I enjoy the balance of this character set. Perhaps the lc x and uc x and y betray the rounded style of the other characters? <br><br><img src="http://www.typophile.com/forums/messages/29/22974.gif" alt=""></p>
  html_clean: <p>A bit of a posting spree here… <br><br>Another <span class="caps">MT</span> font, similar in style to Dorothy. Like the majority of my fonts, I designed it with decorative useage in mind. However, I ﬁnd that it doesn’t look that bad set as a text font. Sort of a stylized Sans or something. <br><br>The numbers need a bit of work, I think, but on the whole, I enjoy the balance of this character set. Perhaps the lc x and uc x and y betray the rounded style of the other characters? <br><br><img src="http://www.typophile.com/forums/messages/29/22974.gif" alt=""></p>
