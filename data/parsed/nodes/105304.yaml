    <p>Would any Typophile here have suggestions on how one might begin to create a type effect like this:<br>
    <a href="https://dl.dropboxusercontent.com/u/18213862/PA.jpg" title="https://dl.dropboxusercontent.com/u/18213862/PA.jpg">https://dl.dropboxusercontent.com/u/18213862/PA.jpg</a> ?</p>
