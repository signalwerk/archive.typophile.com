    html: |-
      <p>Here's three more ways...</p>
      <p><img src="http://www.graphicdeclaration.com/images/LOVE_stripeblurr.jpg"></p>
      <p>Common to all is to begin the process by creating a stripe pattern, and select that pattern contract the selection save to a new layer that selection. Reselect the wider stripe pattern and contract the selction then feather the selection and copy that to a new layer. By now you should have three stripe layers ...one master stripe pattern, one wide feathered stripe pattern, and one narrow stripe pattern. In your layer stack hide the master layer, show the wide feathered stripe pattern and place the narrow strip pattern layer directly above the wide feathered layer.</p>
      <p>From there the fun begins...</p>
      <p>Top example is simply a type layer placed in between the wide feathered stripe layer and the narrow stripe layer. Set the Blending mode to Overlay. The type is then rasterized and blurred.</p>
      <p>Middle example is a little more intricate and perhaps the most accurate and flexible (which imho makes it the best type effect technique). Place the type layer under the wide feathered stripe layer. Then use the Oval Tool to draw out an oval and use that oval on each and every section of each letter shape which you want to create the effect. Do this by scaling the oval and then go &gt; Make Selection from the vector oval. Feather the selection at will and then delete the selected parts of the wide feathered stripes to create the effect.</p>
      <p>Bottom example is something like the middle example except not nearly as flexible nor coolio ...but it is quicker/easier. Place the type layer under the wide feathered stripe layer. Duplicate the wide feathered stripe layer and merge that dupe layer with the type layer. Select all the section of the type in between the stripes and expand the selection, smooth the selection, feather the selection and then delete those sections. For this technique to work there must be another type layer of the same color placed just above the background layer.</p>
      <p>Any questions just fire away.</p>
      <p>Hope that helps.</p>
      <p>Having said all that I'm sure there must a plugin for this style of fx.</p>
