      <p>Gentle(wo)men, </p>
      <p>This is an early case of "matchmaking", but in this case a brilliant design to give the Arabic scripted world a visual equivalent for Roman numbers, typical for watches - with opportunely tapered shapes. It can take its place next to Yaḥyà Boutemène's uniquely profound structural solution for morphing Latin shapes onto Arabic graphemes (see Roland Meynet, L'écriture Arabe en question, plates 57-58). </p>
