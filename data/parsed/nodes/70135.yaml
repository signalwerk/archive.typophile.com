    html: "<p>Sorry to bump an old thread, but I have a pocket watch very similar to the Serkisoff watches pictured, although mine reads \"SERPOS &amp; CIE \\ CONSTANTINOPLE\". Unable to find anything online without the proper terminology, I was luckily able to decipher the numerals on my own (read: I spent my weekend at the library). The strange thing I noticed was that my watch has two 1s. The face is almost identical to the first picture in the thread, but the face reads '12, 1, 1, 3, 4, 5...7, 8, 9, 10, 11'. It doesn't look worn off or anything, just like they put the wrong numeral on it. I would appreciate any knowledge anyone has regarding my seemingly odd watch.</p>"
