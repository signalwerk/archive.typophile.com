      <p>Fascinating. <a href="http://forums.watchuseek.com/attachment.php?attachmentid=128884&amp;d=1221852099" rel="nofollow">Here is an image of another Serkisoff face</a>, which confirms my thought about the middle symbol at the ‘eight’ and ‘nine’ positions: this looks very much like the <a href="http://en.wikipedia.org/wiki/Indian_numerals" rel="nofollow">Hindi numeral 2</a>. But I can't make any sense of the rest of the symbols.</p>
      <p>Are you familiar with Ottoman timekeeping practise? They kept the daily count of hours from sunset, which they called 12 o'clock, so clocks and watches needed to be reset every day.</p>
