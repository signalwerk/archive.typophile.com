    html: |-
      <p>Hello everyone,</p>
      <p>I have just come across this interesting discussion. </p>
      <p>The classic book on the topic is Otto Kurz, <em>European clocks and watches in the Near East</em>, London, Warburg Institute, 1975. You can also find additional useful references on this topic in <a class="freelinking external" href="http://books.google.com/books?id=J3G4quReeVcC&amp;pg=PA285" rel="nofollow">David King, <em>World-maps for finding the direction and distance to Mecca</em>, Brill, 1999</a>, pp. 285–289. The list in footnote 24 on pp. 286–288 shows that such numeral forms on clocks and watches appeared already in the early-17th c., perhaps even in the 16th c. </p>
      <p>Concerning the tuğra above, I can't read it because it is mostly hidden by the minute hand, but it appears to be an Ottoman name, and thus is not related to Serkisoff. The number (327 or 227) at the right could be a serial number, or, far more likely, an abbreviation for the Hijra year 1327 (= 1909) or 1227 (= 1812). Given the photo of the watch displayed above, I would opt for the latter date.</p>
      <p>Regards,<br>
      FC</p>
