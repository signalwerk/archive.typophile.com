  html: |-
    <p>Hello typophiles,<br>
    this is Eklipse, my new typeface designed to defy the limits of legibility. She is also a journey into a universe of strange possibilities. With multi-lingual support, contains more than 60 ligatures and contextual alternates! Eklipse fits perfect in headlines, logos and small blocks of text. It's available throught MyFonts.com with a limited time discount.</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/neder/eklipse/" rel="nofollow">http://new.myfonts.com/fonts/neder/eklipse/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/eklipse_4902.gif"></div><p></p>
