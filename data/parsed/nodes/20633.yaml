      <p>I’ll just note that it’s my non-lawyerly understanding there are two separate things:</p>
      <p>1) is the proposed use permitted under the EULA (end useer licence agreement)<br>
      2) is the proposed use an infringement of copyright</p>
      <p>There are many things that might not be allowed under some particular EULA without being copyright infringement. Contrariwise, there are uses that would be infringement of copyright if they were not specifically permitted under the EULA.</p>
      <p>All of which might just be a long way to say, go talk to a lawyer. You can get a straw poll here of what industry folks think, but that is no-where near as valuable as a well informed legal opinion.</p>
      <p>(Note: One lawyer who I often hear people speak highly of in the area of font IP is Frank Martinez.)</p>
      <p>Cheers,</p>
      <p>T</p>
