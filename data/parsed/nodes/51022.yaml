      <p>The string is Simplified Chinese, meaning that only Simplified Chinese fonts will be able to render all of the glyphs. In particular, U+4E34 (临) is not present in Traditional Chinese, Japanese, and Korean fonts.</p>
      <p>As to how I entered the ideographs, it sort of helps to be the author of this tome: <a href="http://oreilly.com/catalog/9780596514471/" title="http://oreilly.com/catalog/9780596514471/">http://oreilly.com/catalog/9780596514471/</a></p>
