      <p>I'd imagine because Dr Ken knows these characters. If you didn't, you could use a character dictionary, which traditionally order characters by radical. Most characters are made up of discrete elements, or radicals, of which there are traditionally 216.</p>
      <p>Another way of ordering characters is by number of strokes. So you count the strokes (made easier by the rigid rules governing stroke order) and skim through, say, 9-stroke characters.</p>
      <p>A newer method is called SKIP and is used in "NTC's New Japanese-English Character Dictionary" by Jack Halpern. It uses a combination of patterns and stroke count to look up characters and generally works well.</p>
      <p>Incidentally, "Beautiful Country" is America. But don't feel too flattered: "beauty" sounds similar to the ME in aMErica. It's a phonetic association.</p>
    html_clean: |-
