    <p>Hello typophiles...</p>
    <p>Whew, need some help here. Have a client that has offices in China, and I need to recreate a logo using the Chinese characters - and not spend an entire day searching through the glyph palette.</p>
    <p>I've used whatthefont.com in the past to identify fonts English fonts... Is there some other kind of website that could "see" the characters in a jpeg so I could copy / paste into my layout?</p>
    <p>In the past, I've been able to simply copy / paste characters from supplied Word files or off their website - but there's nothing available for this particular logo (it's a new location).</p>
    <p>Any help would be greatly appreciated - thanks in advance, everyone!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Beijing_Clinical_Logo_Small_5553.jpg"></div><p></p>
