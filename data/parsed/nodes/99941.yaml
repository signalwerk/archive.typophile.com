    <p>Hello everybody,</p>
    <p>I am working on a new font, this time a serif one. The upper case characters are more or less defined, but I'm having trouble designing the lower case ones. I wish to know if there is such a thing as a rule of thumb for determining the widths of small case characters in relation to the stroke widths of caps. Any other info pertaining to the design of small case characters based on caps is very welcomed too!</p>
    <p>Regards</p>
