    votes: null
    html: |-
      <p>There are optical factors, but there are also design decisions to be made, so there isn't one solution. The caps are a different alphabet originally, and they are now used to signal a difference, such as the beginning of a sentence. Some old style serif caps were quite heavy in relation to the lower case, and now some sans have caps with low cap heights and very similar 'color' to the lower case. </p>
      <p>Because the caps take up more space, to have the same 'color' (grey) as the lower case they need to be somewhat bolder. But whether you want the caps and lower case the same even grey is a question for you to decide. Do you want them to have more signaling function, or do you want them to blend in more? The answer will tell you how bold you want to make the stems.</p>
