      <p>Uh... no.  :-)<br>
      1) If this is for text, lc comes first, so if anything it should go the other way.<br>
      2) As William hints, you can't force the two cases to be too close* without ruining one, or both.</p>
      <p>* Unless your plans are "experimental", which isn't a bad thing actually.</p>
