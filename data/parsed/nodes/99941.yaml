      <blockquote><p>I wish to know if there is such a thing as a rule of thumb for determining the widths of small case characters in relation to the stroke widths of caps</p></blockquote>
      <p>Usually, the are just a bit thinner. For example, if the stem of the caps is 90 units, the stem of the lowercase will be something arround 82 units (more or less).</p>
      <p>Lot of great tips here:<br>
      <a href="http://66.147.242.192/~operinan/2/2.3.1a/2.3.1.01.notes.htm" title="http://66.147.242.192/~operinan/2/2.3.1a/2.3.1.01.notes.htm">http://66.147.242.192/~operinan/2/2.3.1a/2.3.1.01.notes.htm</a></p>
      <p>I you want to buy a book to learn more about this stuff:<br>
      Doyald Young's blue book: Fonts and Logos, is the probably the best one<br>
      <a href="http://www.doyaldyoung.com/FL01.html" title="http://www.doyaldyoung.com/FL01.html">http://www.doyaldyoung.com/FL01.html</a></p>
