    votes: null
    html: |-
      <p>An important distinction can be made between old style (Garalde) and modern (Didone).</p>
      <p>In the old style genre, the broad nibbed pen informs terminals, producing a consistent wedge-shape. So majuscule /C looks like miniscule /c.</p>
      <p>However, in the modern style, the pointed nib informs terminal shape, producing a variety of balls, hooks, triangles and hairlines. So that /C has a triangular top terminal, whereas /c has a ball.</p>
      <p>You don’t have to slavishly follow convention, but this distinction provides a useful benchmark for conceptualizing and organizing your terminal strategy between the cases.</p>
