      <p>Dell has a lot of good deals on cheap laser printers. Regarding brands, try to stay away from oddball brands and go with the good stuff: Lexmark, Xante, KonicaMinolta, Canon, Xerox. I think Dell sells rebranded Lexmark models.</p>
      <p>Make sure that you check and see what toner stores in your area stock.  If you have to pay $10 to have Okidata ship you toner whenever you run out, it might not make sense to get their printer…</p>
      <p>I’ve been having good luck with my KonicaMinolta magicolor 2430DL. I’ve been using it with no hassle for nearly a year, and when I use glossy laser paper, the photographs look almost as good as high-end inkjet prints. Not bad for a $350 printer, especially since I haven’t bought any new toner since I got the printer.</p>
