    <p>Looking to buy a laser printer. Any suggestion on a brand other that HP? I love HP but I rather look for something that is not so pricey if it can be helped. Just looking for something basic that will print good text in Black and White in 8.5 x 11 or even 11 x 17. Doesn’t have to be fast, just reliable. Also, are all laser printers PS printers or just HP?</p>
    <p>Input will be greatly appreciated, thanks in advance.</p>
