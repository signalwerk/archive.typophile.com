    votes: null
    html: |-
      <p>Check the slanted ascender on the 'h'. That should help identify it. The £ and 'a' are also reasonably distinct. It's not Myriad.</p>
      <p>It looks like it was printed on newsprint, so that may be what caused the softening around the edges that make it appear rounder.</p>
