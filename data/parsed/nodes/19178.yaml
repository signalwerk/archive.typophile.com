    html: <p>It could be <a href="http://www.myfonts.com/fonts/linotype/myriad/headline/" rel="nofollow">Myriad</a>; there are quite a number of round-dot Frutiger clones out there, and it's a little hard to tell them apart from your somewhat low-fi reproduction.</p>
  - id: 117630
    user: 8916
    date: 2006-04-11T07:51:00
