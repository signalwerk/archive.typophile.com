    <p>Hi<br>
    I am designing the last cuts for a grotesk font.<br>
    It is an Opentype (PS), with features such as ligatures, arrows, etc. and it is a latin extended set (for PL, SW, etc.).<br>
    This 10 cuts font does work correctly when used directly inside Indesign (CS2) temporary fonts.<br>
    BUT<br>
    when i add it in a font manager such as FontExplorer or the Apple Font Book, it appears correctly in InDesign but makes my whole computer stop (the beautiful colored weel, you know) as soon as i use the hand tool to zoom or move inside a page.<br>
    WHY?<br>
    WHAT HAVE I DONE WRONG?<br>
    HELP!<br>
     <img src="http://www.optimo.ch/upload/font_type/SpecimenDada-bold.gif"></p>
