    votes: null
    html: |-
      <p><cite>Sometimes un-fancy is best.</cite></p>
      <p>I want to second that. I had a probably similar case: a scientific treatise with figures happen which to appear in many different roles: dates, numbers, tact figures … a lot more.<br>
      There comes the point when you realize that you could find a fancy solution for each special case. But altogether, it won’t be convincing to mix half a dozen fancies into one typography. What I ended up with: lining figures and that’s it. The figures of the font should be decent, of course.<br>
      Less is more, sometimes. Maybe simple is best.</p>
