  html: |-
    <p>I would like to use lowercase numerals in my dissertation. Dates and numbers without units look good but units give me a bit of a headache. Single letter units like V or A when typeset as small-caps look good but units with mixed sized letters like mV, Pa or kHz look strange. In extreme cases (Cal and cal) it may lead to errors. I tried changing the size of "m" in "mV" while using a small-caps "V". You can see different size combinations in the attached file. In my opinion 8.5 optical caption size "m" (or 9 optical normal with lack of caption size) with 10 small-caps "V" yields best results. What do you think of the practice and its results?</p>
