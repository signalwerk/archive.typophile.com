    html: |-
      <p>Looking at frode frank's suggestion from the other point of view, you could use a font where the capital letters (and regular numbers) are smaller than the full height. Gentium is a free one. Greta Text is an expensive one.<br>
      <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium</a><br>
      <a href="http://www.typotheque.com/fonts/greta_text/" title="http://www.typotheque.com/fonts/greta_text/">http://www.typotheque.com/fonts/greta_text/</a></p>
      <p>Myself, I think the standard numbers and letters would be fine.</p>
      <p>Whatever you do, make sure you're not getting too far away from the standard for your business or field of study. If in doubt, stay close to the work of other people. Sometimes un-fancy is best.</p>
      <p>A remark unrelated to your post... Man, that Arno Pro really looks good in your PDF. That's a nice font.</p>
