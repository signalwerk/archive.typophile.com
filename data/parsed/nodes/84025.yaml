    date: 2011-07-23T15:53:00
    date_raw: 23 Jul 2011 — 3:53pm
    votes: null
    html: "<p>Either 1: Find a font with small caps (with small cap figures) notably taller than the lowercase, or 2: Use regular capitals. If the units are supposed to go in text, I'd probably keep the numeral style from the rest of the content. Lowercase numerals make more sense in a mixed case setting than with small caps, anyway.</p>"
