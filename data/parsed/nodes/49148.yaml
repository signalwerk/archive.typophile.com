      <p>#1 is really nice. It has connection to water sports. Maybe you will have to tweak a the O over the wave. It somehow reminds me of sun, which is great, but it could probably be done better.</p>
      <p>#2: no relation to water sports whatsoever. not memorable and O is not part of the word Overton’s</p>
      <p>#3: Q? Noone seems the relation to QOMPAQ? Q? Very similar and also not enough relation to water sports.</p>
      <p>If I were you, I’d only work on #1. Forget the other two. Really.</p>
      <p>Penn&amp;ink suggested to remove the stroke. I think EXACTLY that particular stroke gives your logo some character. Without it will just be blunt and forgettable. And It will not go well with wave underneath that has stroke modulation. You’ll maybe have to introduce stroke weight on teh O’s stroke as well? Maybe... Try it.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
