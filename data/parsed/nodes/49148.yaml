      <p>The marks:</p>
      <p>The Obama force is strong with 1 and 3, and 3 definitely reads as a Q at a quick glance. Perhaps what 2 is missing is a little of the dynamism that 1 and 3 have? Try skewing it to match the leaning type, maybe make it blacker to get the positives and negatives vibrating a bit more?</p>
      <p>The type:</p>
      <p>1 definitely has more of what it sounds like you’re looking for: bold, in-your-face energy. I might rework some of the intersections between letters, but keep that RT, it’s tasty.</p>
      <p>(edit) The N’S in 1 is pretty great too!</p>
