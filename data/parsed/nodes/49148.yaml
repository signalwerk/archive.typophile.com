    <p>Overton’s is the world’s largest water sports dealer and are re-branding. They want a logo that can be used for a water sports demographic (wake boarding, water skiing, tubing, etc.) as well as for a marine electronic demographic (higher end products). Logo choices have been narrowed down to these three. Please critique these logos as much as you possibly can. Criticism of any kind is greatly appreciated, however the constructive kind is always better. Because of placement on some products, the icon will have to be strong enough to stand alone as well as work with the logo as a whole of course.</p>
    <p></p><div class="imageWrap"><img src="/files/Overtonslogo_4942.jpg"></div><p></p>
