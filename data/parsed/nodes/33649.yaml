    html: |-
      <p><em>is the regular apostrophe the correct usage in this case?</em></p>
      <p>Yes! What you've got in your sample is a single left quote mark, not an apostrophe. An apostrophe is the same as a single right quote mark. </p>
      <p>Unfortunately, we see this mistake frequently due to the simplemindedness of desktop publishing software, which can't tell the difference between the beginning of a quoted passage and a contraction. So much for "smart" quotes.</p>
