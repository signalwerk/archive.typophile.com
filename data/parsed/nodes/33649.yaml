    html: <p>Traditionally, what you want is a “turned comma.” An apostrophe is a “raised comma.” The “reversed apostrophe” or “reversed quote” is yet a different character — see the Unicode General punctuation range, I forget the Unicode number. The Lakeside Press use to use reversed quotes &amp; double quotes in a series they published — <cite>Tom Horn</cite> used them for sure.</p>
