    html: |-
      <p>“is the regular apostrophe the correct usage in this case?”</p>
      <p>Yes, and here’s why: because in this case, the apostrophe indicates <a href="http://en.wikipedia.org/wiki/Apostrophe#Apostrophe_showing_omission">an omission</a>. Which is why the apostrophe is in “here’s”, which is a truncated version of “here is” which omits the space and i.</p>
      <p>In your case, the apostrophe indicates the omitted 20.</p>
    html_clean: |-
