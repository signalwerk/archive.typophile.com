    html: |-
      <p>I know how they're supposed to be set, but does anyone know the actual effect?</p>
      <p>How is the CR's width used? What if it's too wide or too narrow? What effect would a zero width CR have?</p>
      <p>Is the NULL being zero width really important? What if it has a width? What effect does it really have?</p>
      <p>Knowing this sort of thing could be useful in tracking down bugs.</p>
