      <p>Yes, "don't make errors" is always a great idea, but few of us are that lucky or blessed. In fact, I'd say no one is. That's where validation tools such as Adobe's compareFamily and Microsoft Font Validator (and other tools) can really help...they run tons of consistency checks amongst various font values and can help spot oddities, bad situations, and outright errors before bad fonts ever go out the door...obviating the need for worry about what a given app does with oddly-made data.</p>
      <p>I follow what you're getting at, and it's true that having application-specific knowledge of these things can help diagnose problems. But if one of the variables is bad or weird font data, it's probably going to result in fixing the font anyway, so it kinda doesn't matter what the app is doing with that (bad) data. I would question the value of a list of stuff like, "this font bug makes BigCo's Awesome App do crazy stuff". We do maintain a list of *application* bugs (or what we think are bugs, or strange behaviors), but that list is fairly short. Most of the font-related problems we encounter can eventually be tracked back to bad or at least odd font data (surprise, surprise)...and very few cases are things that didn't show up in validation tools.</p>
