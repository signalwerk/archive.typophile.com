    date_raw: null
    votes: null
    html: |-
      <p>.null -- properly ‘NULL’, but lots of people use .null to no ill effect -- should be zero-width.</p>
      <p>CR should be the same width as your ‘space’ glyph.</p>
      <p>Will anything break if you don't set these widths correctly? Probably not, but one can't be sure.</p>
      <p>Of course, you can't be sure that something won't break if you set the widths correctly, either; but you can be sure that it isn't your fault.</p>
