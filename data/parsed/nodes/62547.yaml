      <p>I've experienced the CR vs space discrepancy in monospaced fonts problem. </p>
      <p>Yeah, well obviously "don't make errors" is always a good idea but I was wondering if anyone has noticed any other specific problems caused by incorrect widths on blank glyphs. I'm not trying to find out why I shouldn't make incorrect blank glyphs buy trying to shed light on the consequences to make these problems easier to isolate.</p>
      <p>A kind-of-related example: I received an email from someone who was working on their first font. It worked fine in some apps but in Adobe apps, the space appeared as a question mark. I knew right away that the problem was the space was named incorrectly. Abode cares about the name "space" being correct and most other apps don't. So having knowledge about how various apps react to non-standard fonts can help when it comes to tracking down font problems.</p>
