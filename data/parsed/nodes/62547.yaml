    html: |-
      <p>The problem is, "the actual effect" can be very difficult to track down. There are tens of thousands of font-consuming apps on a wide variety of operating platforms and you don't always have control of which of those apps are going to use your font. While many of these will use system-provided text rendering, some don't. Some will have certain expectations about the width and glyph content of these characters, some won't.</p>
      <p>To give a few actual examples related to this:<br>
      - I once dealt with a customer who was having trouble getting a certain character to render. It worked fine in one application but not in another. It turns out the character in question was encoded to the non-breaking space (U+00A0). Now, you're not really supposed to put glyph data in there, but for some reason the font in question had it. It turned out the "problem" app was ignoring glyph data (including width) for U+00A) (it just used the same advance from space/U+0020), while some other apps used it.</p>
      <p>- Line breaks of an allegedly monospaced font were inconsistent between regular and bold weights in one app. The glyphs were all on the same advance, except for the fact that the CR was a different width in the bold weight. Testing in the usual suspects didn't uncover this problem but in the problem app, the CR width entered the calculation for line breaks (this was before the days of Font Validator and other testing platforms which would have saved a lot of trouble).</p>
      <p>My experience is: if you enjoy wasting a lot of time tracking down difficult-to-reproduce bugs whose symptoms may be unrelated to the actual problem, you should ignore convention and do stuff like give the NULL glyph a non-zero advance width, or set the CR to something other than the space or stuff along these lines. Planned experiments aside, I don't like doing that, so I follow convention unless there's a very clear and demonstrable benefit to doing so.</p>
