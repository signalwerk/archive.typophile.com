      <p>I have a feeling that the "right" answer is deep in the software issue.  From the OT features registry under ccmp:</p>
      <p><cite>. . . The feature should be processed as the first feature processed . . . This allows the font vendor to do special handling of the mark combination when doing further processing without requiring larger contextual rules.</cite></p>
      <p>Other issues might be what software supports `mark' vs `ccmp'. I have always used ccmp for glyphs that do not have a precomposed Unicode slot, primarily because Adam Twardoch used that when he wrote a bit on how to make us these characters &amp; the associated code for an old "Fontlab tips" article.</p>
      <p><a href="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3403&amp;LastModified=4675609910422321102" title="http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3403&amp;LastModified=4675609910422321102">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mvie...</a></p>
      <p>You might even consider audience. Putting on my asbestos suit, I'd say   there is a certain group who will enter any character other that a-z by using the glyph pallet. And another group who, if the character is in Latin Extended A or B, will just enter the Unicode string</p>
