    <p>when should one use '<a href="/wiki/ccmp" class="freelinking">ccmp</a>' and when should one use '<a href="/wiki/mark" class="freelinking">mark</a>'?</p>
    <p>i'm under the impression that 'ccmp' is better suited for precomposed glyphs that have their own Unicode slots and 'mark' better for things like composing things like accented IPA glyphs or other accented characters that do not have unique Unicode points. Is this a fair assumption, or is there more i need to take into consideration?</p>
