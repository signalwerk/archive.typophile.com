      <p>I wonder why this strange Mr. Pike Werfer (a pseudonym?) wants to know my "status of education concerning programming". Anyone who visits my website will easily discover that I wrote 4 books about computer programming and that I was the editor in chief of a computer programming magazine and that I wrote a couple of commercial computer programs. For instance, Bill Gates programmed the Applesoft program interpreter in assembly language, and I programmed the Applesoft program editor in assembly language. That's not a joke, that's a fact.</p>
