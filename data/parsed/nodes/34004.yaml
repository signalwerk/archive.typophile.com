      <p>@fontplayer - thank you so much. I'm really thankful!! Let's hope he answers back. Since I would never touch a font without the consent of the person who made it. Golden Rule :-)</p>
      <p>@Miss Tiffany - sorry, but I guess I've got no choice. I didn't start this, but since he asks for it, I'll gladly let 'em have it. :-)</p>
      <p>@Uli - Hey Uli, since you are once again unable to answer a single question - could it be that you can't read? I do hope you're not blind :-) </p>
      <p>Well, your answer proves my point. You don't know anything about fonts, do you? But you like to be important, and prove it by posting links you found in google. So very clever of you. Why this community, I once again ask myself. Why not motorcycles?</p>
      <p>So, what would it help you if I told you that some of the table entries in the font are wrong? What would you say when I tell you that this font needs contextual features to really work? Would you understand when I tell you that the scaling is not always correct? What would you say if I pointed out that the hinting in some places could be improved? </p>
      <p>I remember some guy named Uli telling me that he could prove his point, but that I should check for myself, hihi.... Do you want me to post the link of the topic where you said it? I could, you know :-) Oh, it is a bad thing when your own words come back to haunt you, is it not? Was it not you who claimed things without being able to prove them? (Want the link :-) And now you're blaming me for not doing it. Oh, you would be such a bad politician. Don't you realize everybody can see through it, and is laughing about you (well, apart from the people who get aggravated by you - luckily, I'm not one of them)?</p>
      <p>I did not prove them, because I simply wanted to talk to people who are able to get me into contact with the designer, so that I can talk to him, or get the permission to do a new version. So I am talking to people like fontplayer. This topic was not about dissing the typeface. It was not about dissing the designer. I thought it unnecessary to prove anything, because it was not my intention to attack anyone. Read the initial question. So there was nothing negative in this topic until you dropped in. Do you feel good now? Oh, and do you WANT me to prove them? If so, I might sit down and make a list. Just for you. To shut you up properly. Come on, ask me :-)</p>
      <p>In case you want to learn something about fonts - and we are still talking about the SOFTWARE - then feel free to get a book. Oh, and the term "crap" simply states my opinion. Nothing else.</p>
      <p>Oh, just to make you happy - I have ALL versions of Scriptina here, and the links you posted were known to me - I have access to google, too, you know.</p>
      <p>Oh: 'The Dafont and Desktoppub font files have been tampered with by persons like Mr. Werfer who want “to improve the font quality”.' So you think you have enough knowledge to state that</p>
      <p>a. I tamper with fonts without the consent of the creator (why this thread, then?)<br>
      b. claim that I am not good enough to do it properly<br>
      c. you yourself have enough know-how to know when a font has been improved or not</p>
      <p>Uli, go away. Please. This is hilarious. Claiming without proof - did you not, just a few lines ago, state that this is a bad thing? Come on, make up your mind. Or is it like: other people need to prove it, I, the great Uli, do not need to. You claim that "people like me" manipulate software without the consent of the creator. You are accusing me of a crime, you do realize that? Without proof, of course. :-)) You should be thankful I do not know any shady lawyers, hihi... Oh, what fun. Every forum should have someone like you. Well, need to get to work now. See you soon, Mr. Stiehl. Naw, let's drop the Mister, eh, shouldn't we, Uli? Doesn't sound good :-)</p>
