      <p>Well, looky here - it is Uli, our great Latin speaker and self-proclaimed legal expert :-) So now your a font technology expert, too? I'm impressed.</p>
      <p>So, this font is not crap. Let me ask a few questions:</p>
      <p>1. What do you know about font technology? (We are talking about the SOFTWARE here, you do realize, I hope? We are NOT, I repeat, NOT talking about the design, we are NOT talking about the typeface, which is great.)<br>
      2. How many fonts have you actually done yourself?<br>
      3. What is the status of your education concerning font programming?<br>
      4. On what do you base your assumption that these fonts are okay? (and please do not say that letters come up when you press keys, please, please, please...)<br>
      5. What do you know about the structure of Truetype fonts?<br>
      6. What do you know about unicode tables?</p>
      <p>Oh, and one more thing - "But then, for Pike Werfer, most things are crap and abysmal." Please prove this by naming examples. As far as I know, we have not met, and I daresay I never tagged anything as crap before in this forum. I do believe the word abysmal popped up in our last conversation, though. However, "ULI" is not the equivalent of "most things." :-)  </p>
      <p>Otherwise, I would be forced to categorize this as a stupid and untrue attempt to insult me, proclaim things about me which are untrue and simply act the troll. Which means I will once more stop taking you serious, laugh about you, and invoke "The Silence Brigade."</p>
      <p>Please allow me to be so bold as to state my opinion: you know next to nothing about font software programming. Sorry to say it.</p>
      <p>This, however, is a conversation where people who DO know talk about how to improve a font which is not so good in order to honour the wonderful design which it visualises. Oh, and no shady lobbyists here. No money involved. Just enthusiastic type people. Sorry to disappoint you. </p>
      <p>Should I be correct, and should you not be able to answer the questions (as you did the last time we had an argument, which was quite embarrassing for you, I daresay), then I would politely ask you to stay out of it. Okay? It is simply rude to interrupt people who have a conversation by spouting unproved insults. It is a nono, Uli. Your mother should have taught you that.</p>
      <p>Oh, by the way - just to inform you, since I believe you are trying to get your fun out of annoying people (this is indeed an assumption, I have no proof of it :-), let me tell you that you do not annoy me. You entertain me. Therefore, stay with me and keep posting stuff like this - don't go away like last time. I do adore having arguments with people like you :-)</p>
