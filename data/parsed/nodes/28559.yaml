    <p>im looking for typeface that was designed - if i remember correctly - for the cover and or logo of a magazine in the 90ies (or end of the 80ies). i think i saw it on typophile once, but cant find it anymore.</p>
    <p>its made of straight lines and has a similar feeling to <a href="http://www.art.ificial.ch/2005/octroy.gif" target="_blank">this typeface</a> i did (but without round elements i think, it looked sharper). i thought the name of the magazine was ELEKTRA, but i also remember the S, so elektra is probably not right. i think the type was in red on the cover, but you see that its quite a distant memory ;)</p>
    <p>any idea?</p>
