      <p>Thanks Marc.</p>
      <p>Those are quite nice. I'm sure certain typographers/type designers would cringe to see such things used at display sizes for which they are not intended. But that's not to say we can't try something new.</p>
      <p>I was thinking to mix a type like in the NYT magazine with Psuedo* as a body text face.</p>
      <p>This treatment is no crystal goblet, that's for sure. Plus it is a mixing of like with like, which may or may not work.</p>
      <p>*Psuedo, by Michael Hernan. See attached. I have permission to use it, but not commercially.</p><div class="imageWrap"><img src="http://typophile.com/files/psuedo_heart_3831.jpg"></div><p></p>
