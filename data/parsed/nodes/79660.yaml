  html: |-
    <p>This sample is from the New York Times Style magazine. I'm curious about the ink traps, and whether or not it is commercially available. The handbag in the picture is part of the spread.</p>
    <p>I somehow don't think this style of ink trap is performance oriented, as -- at least to me -- it seems to recollect more ornate antique or tuscan forms. I think it's for display, rather than for small sizes in a directory. But I could be wrong, I could be wrong.</p>
    <p>Thank you</p>
