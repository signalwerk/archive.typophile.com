      <p>James Puckett's "unpopular soap box" is more popular than he imagines.  It's an honest opinion, held without malice by millions of good people around the world.  As a linguist, I want to explain why I hold a different opinion.</p>
      <p>When languages die, and especially when they die having never been described in any detail, linguists feel a real sense of irretrievable loss.  We care so much because our understanding of language is limited to the languages we can study, and it never fails that when new languages are studied, noteworthy observations emerge.  Some languages are so different from what we are used to that they violate some of our most basic linguistic or cognitive hypotheses.  Indigenous languages are often this way.</p>
      <p>The language faculty is one of the defining attributes of our species.  A language is the product of complex cognition and social interaction over the course of long periods of time.  Virtually every member of society contributes.  When a language is lost, along with it are lost the unique system of mechanisms that made it function, mechanisms that hold important clues to who we are, how we are "wired", and what our cognitive limits are; mechanisms that were centuries, even millenia, in the making.  You can't reproduce these things in a lab.  It's true that language will continue to evolve, and perhaps similar linguistic systems will reappear at some point in the future.  But even in the unlikely even that such a time comes, you and I and untold future generations will have already passed on.</p>
      <p>What is alarming about current trends in language endangerment is not the fact that it happens but the rate at which languages are disappearing.  It's true that throughout history languages have died out (as, for example, Etruscan), but most languages have just evolved into other languages (as, for example, Latin, which survives today as French, Italian, Spanish, Portuguese, Romanian, and others).  Until recent times it hasn't been the case that such a large percentage of the world's languages were destined to be superceded--by a handful of replacement languages which, in large part, happen to be related to each other.  In many parts of the world, the past few decades have seen a political climate change toward social justice for indigenous groups (a very recent example is a declaration on indigenous rights passed last week by the United Nations).  But these conciliatory actions are rarely able to repair the damage of decades or centuries of linguistic repression.  You can't bludgeon someone to the point of death, then apologize and expect them to recover.</p>
      <p>The price we pay for our predecessors' shortsightedness is the loss of some of the most beautiful things mankind ever produced, and along with them, the lost chance for a much more complete understanding of one of our most human dimensions.</p>
      <p>The least we can do is mourn the loss.</p>
