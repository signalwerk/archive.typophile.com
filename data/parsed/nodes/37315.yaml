      <p><em>change is good, change is normal, and the death of languages is a good sign that things are proceeding along exactly as they have been and should be.</em></p>
      <p>I can agree that good things come from language change and that there is such a thing as natural language change.  But language death is rarely a natural consequence of linguistic evolution, and it really is not the case that any and all change is good.</p>
      <p>The decline of Alaska's native languages has not been natural in any sense of the word.  It has come about as generations of children received corporal punishment for speaking their native languages and were repeatedly told that their languages were worthless and inferior to English.  A common misconception is that indigenous people weigh the pros and cons of abandoning their languages and pick the language of wider communication of their own free will.  The truth is that they "choose" to switch under great duress from oppressive (post-)colonial societies.  Language death usually follows repressive practices by the group whose language is ultimately adopted.  I can't view the end result of egregious human rights violations as evidence that things are proceeding as they should be.</p>
      <p><em>scientific progress is likely to be sped up by a world with fewer communication barriers, to the benefit of all people.</em></p>
      <p>Science rarely benefits all people equally.  Technology has done a great deal throughout history to increase the discrepancy between the "haves" and the "have nots".  I doubt that the indigenous peoples whose languages are lost will be among the primary beneficiaries of whatever future scientific advancement could be attributed to the loss of their languages.</p>
      <p>I'd like to know specifically how the mass death of minority languages is supposed to lead to scientific progress.  Most members of the dominant American society don't give Native Americans the time of day, let alone take the necessary steps to give them a seat at the table where they could contribute to scientific progress.  The ability to communicate more widely within the United States is already a reality, but it hasn't led to the kind of dialogue that will move anyone or anything forward.</p>
