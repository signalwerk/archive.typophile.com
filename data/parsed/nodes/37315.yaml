      <p>It's been a few years since I read up on this topic. But I seem to recall a demonstrable connection between linguistic diversity (that is, indeed, cultural diversity) and biological diversity (biodiversity). In other words: modern, western, scientific systems for categorizing (describing, classifying, labelling) natural phenomena are essentially reductive, with profound (and yes, dire) extra-linguistic (and extra-human) consequences. Or so the argument - a good one, as far as I can recall - goes. Like all utopias, the fantasy world of pure communication envisioned by James Puckett is, I fear, one that would be purchased at too high a price - biologically, culturally, psychologically, &amp;c.</p>
      <p>I couldn't agree more with the comments above regarding "linguistic imperialism" and the myriad varieties of English experience. Only, in my opinion, puns, metaphors, and other tokens of linguistic ambiguity are to be cherished, nourished, preserved for their own sake, but also because of the reasons hinted at in the preceding paragraph. I gather that Puckett, on the contrary, would - sooner or later - have us burn our Joyce and our Pynchon, ad infinitum. And read &amp; write exclusively Esperanto. </p>
      <p>Now, what would the design equivalent of that be?</p>
