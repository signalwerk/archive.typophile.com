      <p><cite>most of the languages no longer spoken here did in fact die without a trace, either written or spoken.<cite></cite></cite></p>
      <p>I suppose it's impossible to quantify dead languages, especially ones we are totally unaware of.  When you start to say that Latin is a "language no longer spoken here" but that, for example, 15th century English is a "language still spoken here," you begin to draw boundaries that make such numbers lose all meaning anyway.</p>
      <p>The more relevant point for this discussion is that the 21st century will witness language death on an unprecedented scale.  The Summer Institute of Linguistics' Ethnologue estimates that there were about 6900 living languages as of 2005 (during the 1990's Michael Krauss stated the number as roughly 6000, plus or minus maybe 10% depending on how you distinguish "languages" from "dialects").  The UNESCO Ad Hoc Expert Group on Endangered Languages in 2003 provided the following statistics:</p>
      <p>* about 97% of the world's population speak about 4% of the world's languages<br>
      * about 3% of the world's population speak about 96% of the world's languages<br>
      * at least 50% of the world's languages are losing speakers<br>
      * by their estimate, 90% of the world's languages may be replaced by dominant languages by the end of the 21st century.</p>
      <p>(See <a href="http://portal.unesco.org/culture/en/ev.php-URL_ID=9105&amp;URL_DO=DO_TOPIC&amp;URL_SECTION=201.html" title="http://portal.unesco.org/culture/en/ev.php-URL_ID=9105&amp;URL_DO=DO_TOPIC&amp;URL_SECTION=201.html">http://portal.unesco.org/culture/en/ev.php-URL_ID=9105&amp;URL_DO=DO_TOPIC&amp;U...</a>)</p>
      <p>I'll admit I'm dubious about that last estimate; surely it's a near worst-case scenario--although you can imagine that the best realistic case will still be quite grim.  It's also true that, as John mentioned, new languages (specifically, creoles) can crop up relatively quickly due to contact phenomena; and it's also likely that today's dominant languages will continue to evolve and eventually diversify into varieties so different that we would classify them as separate languages.  These languages which do not yet exist will also give us valuable insights.  But (and I don't mean to suggest that John or anyone else suggests otherwise) they are highly unlikely to represent the full range of typological features (the grammatical and phonetic attributes we use for structural [as opposed to historical] comparison and classification of languages) which will be lost as today's endangered languages disappear.</p>
    html_clean: |-
