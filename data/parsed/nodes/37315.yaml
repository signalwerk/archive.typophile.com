      <p>I see mankind as living on the edge of something similar. Nanotechnology is a reality, genetic engineering is a reality, fusion research is making (slow) progress, and access to and sharing of information now exist on an awesome scale. The developments laying before us are going to reshape human existence in ways we cannot begin to fathom. Humans are on the path to an amazing future, with billions of new years of evolutions in front of us. In some short span most of what got us to that point will likely be irrelevant, superseded, and made to appear hopelessly tiny and homogeneous in the face of whatever appears next. </p>
      <p>To me that promise smells like a big tasty omelette. If some cultural eggs must be cracked to get it, I say go for it. Weep for them if you must, but realize that standing in the way of change is standing in the path of a tornado.</p>
