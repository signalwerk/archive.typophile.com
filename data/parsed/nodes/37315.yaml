      <p><cite>...information goes away with the languages...We won’t even have the chance to evaluate whether we think it has value or not—scientific or otherwise.</cite></p>
      <p>Agreed. But given the amount of information mankind discovers and stores, and that there is always a limit to our capacity to preserve it, especially as said information becomes esoteric or simply hard to gather from those who hold it, such a loss is an inevitable part of the passage of time. For mankind to preserve all these things that are being lost would require us to direct a great deal of resources away from all of the new stuff going on, and that would break the circle of life and whatnot.</p>
      <p>Interestingly, I am seeing a parallel between this and <a href="http://www.bestlifeonline.com/cms/publish/health-fitness/Could_He_Live_to_2150.shtml" rel="nofollow">some interesting research about slowing aging via drugs</a>. Some scientists believe that the lifespans of animals are related to the predators in their environments, and that animals more likely to be eaten devote far more energy to reproducing quickly than to repairing their own cells, and thus age much faster. Conversely, those animals that have few or no natural predators have much more time to spew their seed into the local gene pool, and thus devote more energy to self-preservation and live longer lives. Perhaps we will one day reach such a point as a society, when so many of the menial tasks of life have been automated and resources have been made so plentiful that we can devote all the time we want to preserving, examining, and learning from the past.</p>
