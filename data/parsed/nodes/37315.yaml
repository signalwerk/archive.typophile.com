      <p>If the idea is for everyone to end up speaking English, we're in deep doo-doo. For evidence of same, you need look no further than a brief review of <em>Buttering Turnips, Twocking Chavs</em>, which appeared in the Times Literary Supplement a month or so ago.</p>
      <p>Among the many vagaries of English, the book in question points out several words in English which have contradictory meanings, e.g.,...</p>
      <ul>
      <li>when you say <strong>cleave</strong>, do you mean "stick together" or "break apart"?</li>
      <li>when you say <strong>clip</strong>, do you mean "cut" or "fasten"?</li>
      <li>when you say <strong>fast</strong>, do you mean "fixed" or "moving"?</li>
      <li>when you say <strong>left</strong>, do you mean "gone" or "remaining"?</li>
      <li>when you say <strong>sanction</strong>, do you mean "approve" or "ban"?</li>
      <li>when you say <strong>screen</strong>, you you mean "show" or "conceal"?</li>
      <li>when you say <strong>weather</strong>, do you mean "withstand" or "wear away"?</li>
      </ul>
      <p>Nuance is one thing; confusion is quite another. Before we embark on a campaign of linguistic imperialism, we need to get our own house in order first...</p>
