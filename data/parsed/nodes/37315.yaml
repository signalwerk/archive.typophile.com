      <p>There is far more at stake than just losing native languages. Words are often the gateway to thought, and diversity of language often allows for expanded collective consciousness.</p>
      <p>Consider how the English language itself is eroding and average vocabulary diminishing. The current operative mode is <em>reduction</em>, using fewer words in simplistic structure to convey broader meaning, often leading to ambiguity, not clarity.</p>
      <p>It's not that <em>many</em> languages are good, but that some languages (some verbal, some written) offer lexicons that inherently carry perceptions not found in any other language. The need to create words is based on the need to express ideas, emotions, descriptions or phenomena.</p>
      <p>When a culture becomes dominant over another, one of the most common actions historically is to ban the language. Not because the intent is to harmonize and improve communication, but chiefly to strip ideology and culture from a people. This would not have historically happened if it wasn't for the inherent power of  a people's language.</p>
      <p>To be clear -- I am not in favor of many languages just for pure numbers, but I am in favor of diversity of thought and expression.</p>
