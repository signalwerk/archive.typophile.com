      <p>I think it's a slight bit of travesty in the least that we're losing languages at such an alarming rate. But to be honest, it's not that unbelievable.I also disagree with the motion that the death of a language won't mean the death of a culture, or part of it. For a lot of these smaller languages, everything is an oral tradition. Who is going to translate that and pass it on, and in a new language that will certainly not capture the details as well. </p>
      <p>Growing up in the DRC, I spoke a tribal dialect, it's roots are in a larger language, so it will probably not die out too fast, but in the Congo alone there were more than 250 tribal languages. I spoke briefly with a masters student that was studying tribal dialects in the sub Sahara at Harvard and she'd never heard of the dialect however.</p>
      <p>I also spent a month working in the Bolivian highlands where Spanish is the 3rd language in the pecking order. It's interesting, because the older generations are not interested in learning Spanish, and there's a lot of lingering resentment that as festered for generations towards Spanish and everything that came with it. However, their kids, and the kids themselves see Spanish as a way for them to get jobs and move of of the small villages in the mountains. It creates a language gap where Quechua and Aymara, even as the competing official languages, will be weeded out in the outskirts… all for the sake of progress, and tradition will lose out. </p>
      <p>Working in Canada's North right now, there's a real sense of traditional values and languages, and the clash with the modern living styles and English. Illiteracy is very high here, and even working on documents for native governments, English is the first language, and then the native languages, and not everything will be translated over. So even if you can read your own tongue, you won't be able to read the entire document. </p>
      <p>My wife is Metis and grew up speaking French and English, and as trilingual speaker now, she still has trouble finding the right English words at times. I have the same problem coming back to Canada from the Congo – English is not as wonderful and expressive as people would like to make it out to be. Sure it has a lot of words, but it doesn't mean you're saying a lot. </p>
      <p>Dictionaries are subject to those that edit them and the beginning of the Webster dictionary is a great example of aiming to push 'simple english', as some would call it, with the eventual inclusion on words like "ain't". I hardly see them as the definitive rule of language to which we should hold standards to.</p>
