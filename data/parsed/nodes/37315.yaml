      <p>Nick: <em>New languages take a long time to create, and those evolving in a connected world are unlikely to have as much special value as the languages being lost.</em></p>
      <p>Actually, new languages don't take very long to create in the right environment, which is usually one in which people from different linguistic groups are thrown together by material necessity and have to find a way to communicate. If there is already a dominant regional or trade language, they will usually adopt that, but may bring to it vocabulary from their own language. But more remarkable is the phenomenon by which a pidgin, i.e. a crude collection of mutually understood words from different languages with minimal grammar, becomes a creole, i.e. a fully functional, grammatically sophisticated language, within a single generation of native speakers. It is generally thought that this process occurs when the children of speakers of a pidgin start to speak to each other: they instinctively develop a grammatical structure. Which is pretty remarkable when you think about it.</p>
      <p>What does take a long time is for a language to develop a richness of expression: the ability to say something in multiple ways with different nuances, or to say one thing and to suggest multiple meanings.</p>
