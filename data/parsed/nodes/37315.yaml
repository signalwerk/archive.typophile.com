      <p>The Welsh philosopher Rush Rhees referred to languages as 'records of ways of living that have meant something'. Languages come out of meaning, out of the significance that people have found worth giving name and structure, and when they die we lose the record of that meaning. Sometimes, it seems there is a temptation to thrust language loss into a kind of crude dialectic, in which the cultural loss is set against the positive material gains associated with speaking major regional and trade languages instead of minority local languages. This seems to me very unfortunate, because we should be able to appreciate those positive gains while also understanding the nature of the loss. There seems very little that can be done to prevent the death of most languages. A few, like Welsh might struggle back from the brink on account of particular regional legislative advantages; certainly, a lot more Welsh seems to be spoken in Wales today than was when I was growing up there. There are indications that local effort can preserve and renew languages when people care sufficiently about their heritage, as seems to be happening with Cornish. And there is always the spectacular example of modern Hebrew: the resurrection and reformation of a language that had no native speakers for the better part of two thousand years.</p>
      <p>But for thousands of languages that will pass out of existence, there is little anyone can do but try to make some record of them, which is the job of linguists, and to bear witness to their loss, which is the job of poets:</p>
      <p><strong>The Last Man to Speak Ubykh</strong><br>
      by John Burnside</p>
      <p><em>The linguist Ole Stig Andersen was keen to seek out the remaining traces of a West Caucasian language called Ubykh. Having heard that there was one remaining speaker he set out to find the man and arrived at his village on 8 October 1992. The man had died a few hours earlier.</em></p>
      <p>At times, in those last few months,<br>
      he would think of a word<br>
      and he had to remember the tree, or species of frog,</p>
      <p>the sound denoted:<br>
      the tree itself, or the frog, or the state of mind<br>
      and not the equivalent word in another language,</p>
      <p>the speech that had taken his sons<br>
      and the mountain light;<br>
      the graves he swept and raked; the wedding songs.</p>
      <p>While years of silence gathered in the heat,<br>
      he stood in his yard and whispered the name of a bird<br>
      in his mother tongue,</p>
      <p>while memories of snow and market days,<br>
      his father’s hands, the smell of tamarind,<br>
      inklings of milk and blood on a sunlit floor</p>
      <p>receded in the names no longer used:<br>
      the blue of childhood folded like a sheet<br>
      and tucked away.</p>
      <p>Nothing he said was remembered; nothing he did<br>
      was fact or legend<br>
      in the village square,</p>
      <p>yet later they would memorise the word<br>
      he spoke that morning, just before he died;<br>
      the word for death, perhaps, or meadow grass,</p>
      <p>or swimming to the surface of his mind,<br>
      that other word they used, when he was young,<br>
      for all they knew that nobody remembered.</p>
