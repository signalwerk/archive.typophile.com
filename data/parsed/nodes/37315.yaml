      <p>I going to hop on the unpopular soapbox and say <cite>good</cite>. That old languages die off and are replaced by new ones is a sign that everything is continuing as normal, the expanded pace means that people will be able to communicate more easily across cultures, share ideas faster, and those things will allow the scientific advances of the Twenty-first century to outclass all that has come before in ways that we will likely find mindblowing at times. </p>
      <p>To quote Octavia Butler, “God is change.” To try and stand in the way of such an inevitable, ineffable, and damn-near omnipotent force is no more sensible than to deny the most basic laws of science.</p>
