      <p><cite>Language = culture. Less languages = less culture.</cite></p>
      <p>Culture is not be dependent on language. Malevich and the thousands of artist he inspired  figured that out ages ago. Having fewer languages to speak will not prevent the creative minds of the world from contributing to their respective cultures. But it will make it easier for them to be understood by others, at least when the work is rooted in language to begin with.</p>
      <p><cite>Consider how the English language itself is eroding and average vocabulary diminishing.</cite></p>
      <p>Eroding? Dictionaries still add many new words every year—mcjob (noun) and google (verb) are great examples that have even lead to legal action. Vocabularies are not diminishing, they are changing. Readers in Milton’s time probably had as much trouble with Chaucer as readers now do Milton or Chaucer, and so on. This is not because vocabularies have diminished, it is because civilization has changed and language has changed to reflect that. </p>
      <p><cite>Loosing variety of cultures = bad</cite><br>
      <cite>I am in favor of diversity of thought and expression.</cite></p>
      <p>Diversity and variety are not spices that can just be tossed around to enliven and enlighten. If they can not remain relevant on their own, they are of little use to almost everyone. I do agree that diverse ideas are important, but not that said ideas are dependent on language or culture. There will still be an unending supply of new ideas, no matter how few languages we have.</p>
