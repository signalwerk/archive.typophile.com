      <p>I was assuming you will engrave the text into the concrete, but now I think I understand that the letters will be brass or something, and laid in flat. That sound good too, but in that case I would use a silvery but low-sheen metal. My point is it should not grab the eye, even though it’s cool - it should be a subtle element in your whole.</p>
      <p>BTW, concerning your desire for historical accuracy: all things being equal that’s certainly a good thing, but fair-faced concrete* certainly isn’t period to the 1920s, so your choice of font can be much more free, to match the overall atmosphere.</p>
      <p>* My dad, an engineer, calls it that - is that what you guys call it?</p>
      <p>hhp</p>
