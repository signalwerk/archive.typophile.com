      <p>I wouldn’t use larger caps for the initial letters.</p>
      <p>I would make the depth extremely slight - almost invisible. Anything more and you will tire of it soon enough, and start hating it, and hence the entire house.</p>
      <p>The font choice is cool, I would just worry about that “G”, especially in a foreign language. I might try out Penumbra too.</p>
      <p>hhp</p>
