      <p>Interesting. Ah.. I see you’re in twin cities, land of excellent old houses — Curious to see what a quasi-tudor-ac looks like. I say go with your original thought. It has a streamlined golden age of industry feel that seems like it would fit the mood you’re creating in the basement.</p>
