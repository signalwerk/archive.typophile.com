      <p>hrant...ah...yes it’d be flush with the surface. I was thinking stainless originally, but was afraid of not having any contrast against the gray of the concrete.</p>
      <p>Randy...as for as true authenticity, that’s already been thrown out the door a while ago. It’s a 1927 quasi tudor/quasi arts and crafts. It has elements of both but doesn’t scream either. First floor formal rooms are original. Bath is modern. Kitchen is ’contemporary (remodelled by previous owners) and this mantle is going in our finished basement against an existing massive brick fireplace. The basement is maybe ’loft styled’ with stained concrete floors. So, yea, it’s a mix, so not too worried about the neighborhood architectural board knocking at the door. ;0)</p>
      <p>I’d agree with the deco vibe, but Mackintosh, as much as I love that, would be too over the top in this house, IMHO. At least in the basement it would be.</p>
      <p>James...good point! I look forward to working with that typeface! </p>
      <p>Granted all this is predicated on being able to actually afford laser cut letters, so we’ll see if I can get over that first hurdle.</p>
