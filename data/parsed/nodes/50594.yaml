    <p>I’m about to create a concrete hearth for our fireplace. The hearth will be 1’ x 5’. I’m toying with the idea of putting an inset quote into the face of it using laser-cut core 10.</p>
    <p>I really like James’ Recovery revival (and this would be a fun excuse to buy it):</p>
    <p><a href="http://www.typetrust.com/fonts/font.php?id=NzQ5" title="http://www.typetrust.com/fonts/font.php?id=NzQ5">http://www.typetrust.com/fonts/font.php?id=NzQ5</a></p>
    <p>So I made a (really) quick mock-up. I didn’t do any letterspacing and just used the online typesetter for now. </p>
    <p>The house was built in 1927, so I think it’s roughly the same era as the typeface references. It’s also a nice fat face so would be easier to inset into the concrete. It is latin, so perhaps that’s a bit of conflict with the era of the language.</p>
    <p>Thoughts? Suggestions?</p>
    <p></p><div class="imageWrap"><img src="/files/recovery_5980.jpg"></div><p></p>
