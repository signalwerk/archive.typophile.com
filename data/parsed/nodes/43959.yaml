  html: |-
    <p>Here at Letterbox we have been steadily releasing new fonts and are adding to the foundry section of our website. </p>
    <p>Currently if you want to see our fonts in action you would use an swf file to preview them. For an example see: <a href="https://web.archive.org/web/20081011134043/http://www.letterbox.net.au/store/order_fonts_berber.html" title="http://www.letterbox.net.au/store/order_fonts_berber.html">http://www.letterbox.net.au/store/order_fonts_berber.html</a><br>
    This can be a time-consuming and a little clumsy.</p>
    <p>For the last year or so we have been dreaming of having our own type-tester like H&amp;FJ:<br>
    <a href="https://web.archive.org/web/20081011134043/http://www.typography.com/fonts/font_overview.php?productLineID=100033" title="http://www.typography.com/fonts/font_overview.php?productLineID=100033">http://www.typography.com/fonts/font_overview.php?productLineID=100033</a> <em>click test drive tab</em><br>
    or T26:<br>
    <a href="https://web.archive.org/web/20081011134043/http://www.t26.com/fonts/Forma" title="http://www.t26.com/fonts/Forma">http://www.t26.com/fonts/Forma</a> <em>click typesetter tab</em></p>
    <p>Now keeping in mind that we are a small foundry (and hiring a top-notch Ajax programmer isn’t within our budget) what are our options?</p>
    <p>We are aware of the LetterSetter™ application from LettError, but it doesn’t thrill us.</p>
    <p>Is there another option?</p>
    <p>Do you run a foundry? What is your experience? </p>
    <p>Is this an opportunity for some brilliant programmer to build an alternative?</p>
