      <p>Elise - You are ceratinly welcome.</p>
      <p>Mike - I think that vertical line in the C is supposed to be consistent with similar thin vertical strokes in other caps. It's present in Dan Solo's Dover version as well as knockoffs. It does look odd in the C, though.</p>
