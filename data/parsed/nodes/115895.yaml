      <p>I wonder if this could be hand-drawn. There is an unevenness in the letter heights that I wouldn't expect in a font, and I couldn't find this at a freebie site (where such things often show up).</p>
      <p>Maybe someone else recognizes it?</p>
      <p>- Mike Yanega</p>
