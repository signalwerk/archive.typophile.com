    html: <p>Is your "Commercial At" round enough. Is the left side too flat going round to the left and down? While I admire the R, will you run into some weird spacing issues? The way some of your bowls aren't conventionally shaped, such as the e and the P ... Hrant would maybe call the clotting but I think that is a negative term in this instance ... Should you have more of the rounding or filling in of the shapes in your N and M or X and Y? Do your joins end in too sharp a point?  <br> <br>Very interesting I can almost feel the Art Nouveau coming through, but your shapes aren't Art Nouveau.</p>
