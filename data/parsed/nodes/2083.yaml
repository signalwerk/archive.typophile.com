    html: <p>These are really beautiful forms, Kevin.  I love the new V. <br> <br>I also liked the old (excited) F, though it somehow didn't feel right; maybe making the arm (is it called an arm?) curve in the opposite direction could work, or even giving it some of the swaying movement of the A.  Could make an interesting alt.  Or maybe you could take a middle-of-the-road approach and make the F just a little bit excited.  That would be nice too. <br> <br>I might suggest flaring the stem base of the A just a tiny, tiny bit to the right; at the moment, it gives me this feeling that it's one of those paisley amoeba whatsits. <br> <br>Finally, something about your $ is bugging me; it looks more or less like a speared S rather than a symbol in its own right. <br> <br>Cheers!  I look forward to the completion of this face; I already have some ideas of where I might use it. *sinister chuckle*</p>
    html_clean: <p>These are really beautiful forms, Kevin.  I love the new V. <br> <br>I also liked the old (excited) F, though it somehow didn't feel right; maybe making the arm (is it called an arm?) curve in the opposite direction could work, or even giving it some of the swaying movement of the A.  Could make an interesting alt.  Or maybe you could take a middle-of-the-road approach and make the F just a little bit excited.  That would be nice too. <br> <br>I might suggest flaring the stem base of the A just a tiny, tiny bit to the right; at the moment, it gives me this feeling that it's one of those paisley amoeba whatsits. <br> <br>Finally, something about your $ is bugging me; it looks more or less like a speared S rather than a symbol in its own right. <br> <br>Cheers!  I look forward to the completion of this face; I already have some ideas of where I might use it. *sinister chuckle*</p>
