      <p>Hi Shortcake,<br>
      It seems that a program that supports the OSX text engine (and/or Unicode) is required to access the glyphs in Apple Symbols. The font has some strange behavior. For example,</p>
      <p>Type a word in an OSX app such as Text Edit, Pages, Intaglio or EazyDraw.<br>
      Insert an Apple Symbol character in the middle of the word.<br>
      Select All and change the font. The letters change shape, but the Apple Symbol is untouched! Why isn't it replaced by an oblong box? Intriguing…</p>
      <p>As you said, the font is not available in every application and it's sometimes listed at the top of the fonts menu, not at the bottom, as in Text Edit and Pages, etc. </p>
      <p>The closest I can get to your experience is Expression 3.3. Expression runs in OSX (it doesn't need Classic to start), but the Font Panel and Special Characters panel are inaccessible. When you type the alphabet and numerals and choose Apple Symbols, you get oblong boxes. </p>
      <p>Adobe software runs on top of OSX, but their programs use their own built-in text engine. You may be able to access Apple Symbols via InDesign's character pallette.</p>
      <p>In the 10.4 Finder, Apple Symbols is described as a Windows TrueType font with a .TTF suffix. There are no Typographic features, which suggests that it's a 'plain' TTF—not a Microsoft OpenType font. When the font is opened in Fontographer, the standard character slots (0-255, Mac encoding) are empty, which probably explains Expression's oblong boxes. </p>
      <p>This can of worms has the smell of Unicode about it. The PDF below describes Apple Symbols as a 'generic font that makes available many of the symbolic/non-linguistic characters from the UNICODE character set'. The PDF is not designed for Mac OS users, but it could be helpful.</p>
      <p>homepage.mac.com/atl/tex/AppleSymbols.pdf</p>
      <p>Every one of the 1167 glyphs in Apple Symbols have Unicodes, so if you know the Unicode input method, you may be able to access the glyphs by typing the Unicode values.</p>
      <p>What a mess!</p>
      <p>Ian</p>
