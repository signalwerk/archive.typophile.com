      <p>Okay, since nobody has given the correct answer here, I'll chip in. There are about a dozen different ways a piece of software can iterate through fonts installed on your computer. Most modern apps, including virtually all Cocoa software, any Carbon software that exclusively uses ATSUI, and most apps that use the Carbon Font Manager call the OS to give them a list of "available fonts". That list is composed exclusively of Unicode-compatible fonts, that is either fonts that declare Unicode codepages, or that declare a known encoding which OS X can convert to Unicode. Baghdad unfortunately, whilst it has its cmap table vectored correctly with Unicode codepoints, fails to declare any supported Unicode ranges, Windows codepages, its sequencing character set (if any), nor is it encapsulated within a suitcase with an appropriate FOND script ID associated. Mac OS X therefore turns a blind eye to it and deems it unsuitable for Unicode (since it cannot presume the glyphs at cmap IDs 600 to 6FF are really Arabic). Arial Hebrew is the same (though vectored from 590 to 5FF).<br>
      These fonts are included because they can and are used by software that is not Unicode aware, and ignores the fonts cmap, simply treating them as a MacArabic, CP1255 or whatever font. You will usually find, especially for the CE and CY versions of fonts, that their parent font now included the characters in the correct unicode positions (e.g. Courier CY has been superseded by adding Cyrillic glyphs to Courier).</p>
      <p>The purpose of Apple Symbols is to provide a fallback font for glyphs which are not available in any other font (not counting LastResort). If you have a character sequence such as "0068 0069 0020 263A" (hi ☺) and you set the font, then if your new font doesn't have a glyph for U+263A, *and* the application has font substitution enabled (it's on by default for ATSUI/Cocoa apps), then the OS will search for a font which has a glyph for that character, and display that glyph instead of an empty box. If it cannot find a matching glyph, one from the LastResort font is matched and returned. This is why the character ☺ will always be displayed using Apple Symbols.<br>
      As to why it's not appearing in your apps, that stumps me, as it shows up in TextEdit here!</p>
      <p>– Nicholas</p>
