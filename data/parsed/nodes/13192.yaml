    html: <p>You can access the "Apple symbols" font in Adobe Illustrator CS from the TYPE menu. Select the insertion point in your text, then select the TYPE menu (top of the screen) and select GLYPHS, scroll to the character you want and double click and the charactor will be inserted into your text. Hope this helps!</p>
