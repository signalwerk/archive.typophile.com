    html: <p>The fonts being discussed here don't have any glyphs within the range of Latin characters. So when you "access" them, what that would mean in some cases is inputing text with one of the non-English input methods. A keystroke is mapped to a different Unicode area to display a particular glyph. (forgive me if my terminology is not perfect here, I'm not a professional type designer) In the case of Arabic and Hebrew support, there are also considerations for the fact that text is right to left.  I'm not sure if this is obvious or not. I opened Symbol.dfont in FontLab and could see that while there are glyphs for numbers, there are none for letters. It's possible that Mac OS somehow detects that an active font isn't applicable to a given input method and hides it. (wild speculation here) It may have been previously discussed on this site that there is another Mystery Font in /System/Library/Fonts called LastResort.dfont. It contains dummy glyphs, black boxes with unicode range indicators, to fill space when a particular Unicode glyph is unavailable in the system. As far as I know, it doesn't appear in any font menu, ever. Of course the Character Pallette provides a nice interface to interact with some otherwise inaccessible type.</p>
