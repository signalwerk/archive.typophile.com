      <p>Open Text Edit.<br>
      Select Edit&gt;Special Characters.<br>
      In the View menu, select 'Glyph' and from the menu below that choose 'Glyph Catalog'.<br>
      In the Fonts menu, select Apple Symbols. The complete glyph palette appears.</p>
      <p>To enter a character in Text Edit, double-click the glyph in the glyph palette. Alternatively, single-click the Character Info panel or drag-and-drop into the document. </p>
      <p>This also works for Arial Hebrew and Baghdad.</p>
      <p>This feature can also be accessed from the Fonts Panel. It's very clever stuff, but I wish it was simpler.</p>
      <p>Ian</p>
