      <p>In FontBook, go to preferences and make sure you choose to make new fonts available for the computer. This will give system wide access. If you have mutliple accounts, and fonts are installed for a particular user, you can't use them. </p>
      <p>and if you have time - read that:  <a href="http://docs.info.apple.com/article.html?artnum=301332" title="http://docs.info.apple.com/article.html?artnum=301332">http://docs.info.apple.com/article.html?artnum=301332</a></p>
