    <p>I'm new to these boards so hopefully I'll be able to communicate this right!</p>
    <p>I just bought a new G5 with OS 10.4.1 on it. Am working on getting everything up and running.</p>
    <p>I discovered Font Book (which I know is not the best tool for sorting fonts, but for now it's what I have) and was browsing through the fonts that came installed. Discovered that what is on the list is not necessarily available to me in my software. The most glaring example is the "Apple Symbols" font. I see it in the Font Book, I see it in the Library/Fonts folder, but when I try to use it in ANY application (Adobe...Microsoft...or native apps) it is simply not there as an option!! </p>
    <p>Other fonts with this same problem are: Arial hebrew, Baghdad (the other ones I've found are all different languages - if that is relevant...however, some of the other language fonts do appear as choices, they just don't "work" in the applications, which I assume is because I don't have "international" turned on in the system preferences). </p>
    <p>Thanks in advance...</p>
