    <p>Well... I am formatting a book, and despite showing him a couple of options, my dad still wants to use a sans serif font. I posted here last week and got some good suggestions for serif fonts, but it looks like I won't get to use them.</p>
    <p>I'm a bit nervous about this since it goes against traditional book typesetting wisdom, and also because sans serif can be very modern and sometimes "cute", which wouldn't really fit with the subject material of this non-fiction book.</p>
    <p>So, what I am looking for is suggestions for:</p>
    <p>Sans serif fonts that are classy looking and would look nice in large amounts of text<br>
    OR (this next one is in case I can compromise with him)<br>
    Serif font, but that is not very complex and uses minimal serifs (something he will look at and think looks very readable- his idea of readable is basically sans serif).</p>
    <p>Thanks for any help.</p>
