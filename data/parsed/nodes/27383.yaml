    <p>hello folks,</p>
    <p>This is my first attempt to the type design. It's still incomplete but I have taken a snapshot from the Illustrator just to show the idea. I need your feedback to improve on the design. Am facing problems designing few letters and thus your comments would be really helpful for me. Though at the moment am not satisfied with any of these letters. </p>
    <p>The Idea was to combine both small and the capitals in one and thats why i've named it "Capsmall".</p>
    <p>Thanks in advance.</p>
    <p>satya,<br>
    Student, Graphic Design<br>
    National Institute of Design<br>
    Ahmedabad, India<br><img src="/sites/default/files/old-images/Capsmall_6389.jpg"></p>
