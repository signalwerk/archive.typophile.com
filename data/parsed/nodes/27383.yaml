      <p>Satya -</p>
      <p>There's something really appealing about it, very graphic. I think you should persevere.</p>
      <p>Personally, I like the forms which 'flow' into each other, such as 'b/B', 'p/P' and even 'u/U', rather than the ones which feel like one letterform is superimposed over another, like 'r/R' or 't/T', but that's just me.</p>
      <p>adrian</p>
