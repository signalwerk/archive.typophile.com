    <p>CALL FOR ENTRY DEADLINE: MARCH 15, 2013</p>
    <p>Announcing the Call For Entry for the 2013 Design Awards, the largest and most respected show of its kind in the country. </p>
    <p>Now in it's 23rd year, the Applied Arts Design Awards celebrate the very best work produced throughout North America and abroad.</p>
    <p>The Top Five Applied Arts Awards Winners Advantages:</p>
    <p>5   Showcased in the magazine.<br>
    4   Preserved in our online archive.<br>
    3   Displayed at the annual exhibit.<br>
    2   Chance to be the next AACE!<br>
    1   Elevated reputation.</p>
    <p>The Call For Entry begins on Monday, February 11th, with a deadline of Friday, March 15, 2013.</p>
    <p>Go to <a href="http://appliedartsmag.com/de_awards/" title="http://appliedartsmag.com/de_awards/">http://appliedartsmag.com/de_awards/</a> for more information, and a full list of categories.</p>
    <p>Questions? Contact Sarah Palmer at <a href="mailto:awards@appliedartsmag.com">awards@appliedartsmag.com</a>, or by phone, 416-510-0909 x27 (outside Toronto: 1-800-646-0347).</p>
