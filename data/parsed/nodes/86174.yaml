    html: |-
      <p>Thanks a lot guys. I love Planeta, and gestalten fonts look great, so good find for me.<br>
      Neutraface 2 Display Bold is a very close match though, it could be the one.<br>
      Both are welcome alternatives to Futura, I am finding that it finally seems decidedly dated to me – just find it a lot harder to use lately as opposed to even a few years back (NonFormat manage to use it well though). Both of these alternatives assert a more modern presence whilst retaining the overal character you get with Futura, so I'll have to get at least one of these.</p>
