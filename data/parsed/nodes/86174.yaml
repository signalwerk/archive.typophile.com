  html: |-
    <p>Hi,</p>
    <p>I've seen this typeface around for a long time and never been able to identify it. Now that I want to find an example, I can only find this header on this site:<br>
    <a href="http://www.jimmyturrell.com/" title="http://www.jimmyturrell.com/">http://www.jimmyturrell.com/</a><br>
    He's a great illustrator anyway, so check out the great work. But thetype in quest is his name/header. The small x height and so exaggerated cap and ascender height is quite striking. Otherwise he is reminiscent of century gothic and the like.</p>
    <p>Thanks in advance for taking any time with this!</p>
    <p>Lewis</p>
