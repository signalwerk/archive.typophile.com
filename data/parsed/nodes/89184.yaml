  html: |-
    <p>I have hundred's of film fonts mostly from the 50's 60's &amp; 70's.<br>
    Remnants of a lettering company I owned in the past.<br>
    These fonts were used in hand setting lettering for headline use.<br>
    Same font size as Typositor lettering but are film positives for hand setting.<br>
    Used for many years they are high quality materials.<br>
    I would hate to toss them but I have no storage space.<br>
    The fonts are in nine boxes 10"x10"x10" and weight approx 8# each.<br>
    I would be willing to ship to anyone willing to pay the freight cost.<br>
    Please let me know if anyone is interested. Unfortunately I do have a deadline and need to get rid of them by the end of February. Thanks.</p>
