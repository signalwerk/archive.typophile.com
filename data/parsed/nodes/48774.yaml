    <p>I've just begun working on a logo for a small jeweler. They gave me absolutely nothing to work off of- no existing designs or ideas of what they do or don't like. Their clientele remains fairly ambiguous as well. I'm flying blind. </p>
    <p>I came up with a ligature for a lettermark based on the lowercase j and m from ITC Modern No. 20. I really like the flow from the descender in the j up into the loops of the m. </p>
    <p>I'm unsure how I like Modern No. 20 for his name though, in the combination logo. </p>
    <p>Opinions?</p>
