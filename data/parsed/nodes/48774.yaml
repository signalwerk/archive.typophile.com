    html: |-
      <p>You've got some kerning issues with both the ligature and the name. </p>
      <p>The space within the ligature should be tighter. That might also solve the "jim" problem.</p>
      <p>The kerning within the name is not balanced at all. You need to go through and even the spaces between letters. For example, the "j" and "n" in jason are too far from the "aso". And the "r" in markesteyn is too far from the "k". I'm also wondering what this would look like with a sans-serif font for the name. Might be worth a look.</p>
      <p>Good progress on this so far.</p>
      <p>penn</p>
    html_clean: |-
