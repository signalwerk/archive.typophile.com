      <p>I still don't like the arc. I'd move the top of the arc even more to the right and also not ending it at perfect vertical angle with "m". I'd make it go a bit to the right and then ending on top of "m". But not too much to still make it look visually right from the top of "m". Check the "item" where the ligature arc also goes a bit more to the right as expected, but visually it looks perfectly round and nice.</p>
      <p>The wrong arc also makes the left stem of the "m" much higher then the rest of the letter so it becomes unbalanced.</p>
      <p>Otherwise: very nice job and interesting ligature.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
