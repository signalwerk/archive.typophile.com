      <p>Adam,<br>
      I think you could do the jeweler's name in a really clean typeface, possibly with engraving roots, such as AT Sackers Gothic, Blair, etc.<br>
      With the mark being quite decorative, the name doesn't need to fight for attention.<br>
      Set in Modern 20 the serifs in the name may also suffer when reduced to a small size, or when foilstamped on a jewelry box etc.<br>
      Good luck!</p>
