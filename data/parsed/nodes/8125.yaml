    html: <p>This sign comes out of the sign-painting tradition, not the world of type. Although there are cross-influences between the two disiplines (and in fact they have completely and sadly merged in the last few decades), any similarity to an existing font with something as old as this seems to be would be a happy coincidence. <br> <br>Something like <a href="http://www.myfonts.com/fonts/shinn/beaufort" target="_blank">Beaufort</a> would give a similar overall look, even though the J and R are different.</p>
