    html: <p>That's why I said loosely based. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>The "R" was what I used for most of my search, but overall Goudy seemed like a decently good fit... and that "J" looks like it may indeed be a custom addition.  There are a few fonts out there that match your "R" better than Goudy's, but the rest of the fonts were so far off that I didn't bother linking them.</p>
