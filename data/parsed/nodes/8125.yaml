    votes: null
    html: <p>Sorry, I think neither of those is as close as Mark's suggestion (Beaufort).  Perhaps you are letting the J influence you too much.  Your best chance would be to see if you could blend a closer J and R with the right weight of Beaufort. <br> <br>The fact is that you are looking for something that probably doesn't exist, as Mark explained, so the best you can do is come as close as possible, or pick a completely new direction, so that it just doesn't doesn't look like a poor match, but a conscious choice for a different look.</p>
