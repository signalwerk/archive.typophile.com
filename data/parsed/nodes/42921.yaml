    <p>Ive almost completed a new project of mine, its a blog built in flash, with a wordpress backend, so technically its quite ambitious.</p>
    <p>Im unsure about choosing Gotham as one of the fonts due to all the publicity its had lately and I never wanted to give the feeling of an American vernacular. Its just a beautiful face that I wanted to use in conjunction with some others to show off my design skills and style. So if you think its inappropriate please tell me.</p>
    <p>Its only WIP so forgive the senseless content in there.</p>
    <p><a href="http://www.n8w.co.uk/WIP/WordpressFlash/" title="http://www.n8w.co.uk/WIP/WordpressFlash/">http://www.n8w.co.uk/WIP/WordpressFlash/</a></p>
    <p>any thoughts appreciated.<br>
    thanks</p>
