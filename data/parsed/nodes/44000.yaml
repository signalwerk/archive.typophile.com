      <p>Incredibly, judging by your poster at flicker, it's not really that hard to read it in smaller sizes, though I definitely think they should be used huge! And maybe they don't even spell a word. Just plain, lone letterforms (or cropped areas of it). I get "masturbation" more than "sex addiction" out of it. There are pubic qualities to your typeface, in a good way :) Keep it up (no pun intended)! I agree with jayyy about the letterforms - some of them could be better and still have that ornamental thing going on!</p>
      <p>Cheers!</p>
      <p>Rodrigo Saiani</p>
