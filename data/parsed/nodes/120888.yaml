    <p>A widow IS NOT one stub end word on its own at the end of a paragraph.</p>
    <p>Or that's what I always thought.</p>
    <p>Typographic widows mean different things to different people. I've written a piece about my findings so far:<br><a href="http://www.youmayalsolike.co.uk/2014/10/when-is-widow-not-widow.html">http://www.youmayalsolike.co.uk/2014/10/when-is-widow-not-widow.html</a></p>
    <p>More interestingly, I've got a survey in which I'd  love to hear your opinions:</p>
    <p>What is a widow? TAKE THE SURVEY!<br><a href="http://www.surveymonkey.com/s/8NT3L8H">http://www.surveymonkey.com/s/8NT3L8H</a></p>
    <p>Thanks nice typographic people! Please feel free to share the survey, too.</p>
