  html: "<p>So I thought I had a decent handle on the use of small caps...  until I started working on an annual report for a state chapter of the ACLU.  <br> <br>On one hand, the name appears so frequently that one could make a good argument for small caps: overall color, less visual disturbance, etc.  But on the other, this is <i>their</i> annual report, and one could make a good argument for not wanting the organization's name to disappear into the text.  <br> <br>Bringhurst and other orthodox priests call for small caps in this situation. The other ACLU materials I have here don't use SC, but they make lots of other typographic faux pas, so I wouldn't base my decision on that, necessarily. On the third (?) hand, it's likely that if I use SC, the clients will just think it looks wrong since they're used to regular caps. <br> <br>It pains me, but for practical reasons I'm inclined to use real caps. Yet on the fourth hand, if I do, then I'll have to set PATRIOT Act in big caps too, which pains me more. What to do? <br> <br>--Meredith with four hands</p>"
  html_clean: "<p>So I thought I had a decent handle on the use of small caps...  until I started working on an annual report for a state chapter of the ACLU.  <br> <br>On one hand, the name appears so frequently that one could make a good argument for small caps: overall color, less visual disturbance, etc.  But on the other, this is <i>their</i> annual report, and one could make a good argument for not wanting the organization's name to disappear into the text.  <br> <br>Bringhurst and other orthodox priests call for small caps in this situation. The other ACLU materials I have here don't use SC, but they make lots of other typographic faux pas, so I wouldn't base my decision on that, necessarily. On the third (?) hand, it's likely that if I use SC, the clients will just think it looks wrong since they're used to regular caps. <br> <br>It pains me, but for practical reasons I'm inclined to use real caps. Yet on the fourth hand, if I do, then I'll have to set PATRIOT Act in big caps too, which pains me more. What to do? <br> <br>--Meredith with four hands</p>"
