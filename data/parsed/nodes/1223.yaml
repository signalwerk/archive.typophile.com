    html: "<p>&gt; I think HD is right about whether they'll notice the smallcaps: \"Why is OUR name so SMALL?\"  <br> <br>Man, I get stuff like this a lot. The right stuff has become wierd and 'wrong' to a lot of clients. I say do it all with SC as your judgment and references stipulate (if the face you choose allows). Make a typographic argument for it if they notice and if they don't relent just change their name and not the rest. Arguably, you'd just be choosing a typographic solution that best fits the situation. And that's what we want, right?  <br> <br>I've had the same battle both internally (in my head) and externally (with the client) about client acronyms. This thread makes me feel like much less of an amateur.</p>"
