    html: <p>It depends on the x-height/cap-height ratio as well as the smallcap height of the font in question. <br> <br>- If the x-height is big enough compared to the caps, then fullcaps can be OK. However this usually means the x-height is too big for good readability (at normal text sizes). <br> <br>- If the smallcaps are too small (like they so often are) then they might indeed not work. <br> <br>That said, typically the smallcaps are less bad than fullcaps. <br> <br>BTW, you might check out FF Atma - a smallcap size for every season! <br> <br>hhp <br></p>
    html_clean: <p>It depends on the x-height/cap-height ratio as well as the smallcap height of the font in question. <br> <br>- If the x-height is big enough compared to the caps, then fullcaps can be OK. However this usually means the x-height is too big for good readability (at normal text sizes). <br> <br>- If the smallcaps are too small (like they so often are) then they might indeed not work. <br> <br>That said, typically the smallcaps are less bad than fullcaps. <br> <br>BTW, you might check out FF Atma - a smallcap size for every season! <br> <br>hhp <br></p>
