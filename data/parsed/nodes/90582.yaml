    <p>Hi there, I would like some opinions on the right relationship (distance) bewteen ascenders and descenders in a paragraph. Here is a sample of a paragraph from a book text setting. Since I find a tighter leading more readable - and more pleasing -, I'm a bit perplexed by the close distance of ascenders and descenders in some specific places (see the second image). I wonder if this kind of setting will cause troubles in the reading process.</p>
    <p>Thanks for any suggestions and critique.</p>
