      <p>Right.</p>
      <p>The oldstyle had been set without extra leading, then when the neoclassical style came along in the late 18th century, extra leading was part of the look—hence different specs for Garamond and Baskerville.</p>
      <p>There is also the matter of line length, which has a bearing on rivers and the regularity of word space size, against which the effect of extender-proximity “islands” has a relationship.</p>
      <p>And times moves on, so one individual may get bored with a certain kind of setting — and it might also go out of fashion.</p>
      <p>All of these considerations may have affected the change of specs between the two publications of Morison’s tract.</p>
