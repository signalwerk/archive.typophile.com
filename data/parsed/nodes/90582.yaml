      <p>I think that Morison's first try was better, so I suppose I would advise the OP not to worry about the "close calls". Not that an extra 1/4 point of leading would hurt anything, but in general, longer ascenders and descenders are to be preferred over more leading for the same x-height and the same linespacing.</p>
      <p>Because the ascenders and descenders contain information, hence more of the printed page is actually doing work presenting the text to the eye.</p>
      <p>In practice, of course, typefaces have for some time tended to have small ascenders and descenders, so that one can get a larger x-height for the same text density (assuming no change in how condensed the face is, reduce the linespacing by 5% and increase the x-height by 5%, and you have the same amount of text on the page).</p>
      <p>And it's definitely true that x-height does an even better job of conveying information to the reader than ascenders and descenders, even if they do something and the leading does nothing.</p>
      <p>So using a typeface like Corona with generous leading is the worst case; using a typeface like Cloister Light set tightly is better; but the best case - from the standpoint of efficiency, <em>not</em> aesthetics - is using a <em>larger point size</em> of a typeface like Corona, also set tightly.</p>
      <p>The ascenders and descenders should be just long enough so that, even when the face is used without leading, the eye can easily follow the line without confusion. So that may mean a bit more than the newspaper faces offer.</p>
