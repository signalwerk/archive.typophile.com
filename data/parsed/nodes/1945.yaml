    html: <p>That's an impressive list, you could do some serious typography with those. <br> <br>There are a variety of serif classics, full family, but Myriad is the only sans, and only in the Condensed. <br> <br>One thing missing from the Adobe CDs, and Bitstream, are pixel fonts. </p>
