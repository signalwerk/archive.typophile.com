    html: <p>If you are still attached to a College, the 'Adobe Type Classics for Learning' is an amazing bargain. Bitstream I believe also has reasonably priced CD type collections. </p>
    html_clean: <p>If you are still attached to a College, the 'Adobe Type Classics for Learning' is an amazing bargain. Bitstream I believe also has reasonably priced CD type collections. </p>
  - id: 15421
