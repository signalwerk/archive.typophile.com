  html: <p>I know adobe has a great font CD collection, but they are very very expensive.  I am trying to find a font software for a PC computer that has a good variety of fonts, and not those cheesy fonts either.  Does anyone have any recommendations as to what sites to look on or what specific cd I should look for?  </p>
