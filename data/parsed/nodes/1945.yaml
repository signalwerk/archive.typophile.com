    date: null
    date_raw: null
    votes: null
    html: <p>If you're not eligible for educational pricing, then check out our "Adobe Type Basics OpenType Edition." There are some cheesy display fonts in here, but also a lot of good solid classic text faces, and some fairly innovative newer stuff (Blue Island, Nyx). <br> <br><a href="http://www.adobe.com/type/browser/P/P_1902.jhtml" target="_blank">http://www.adobe.com/type/browser/P/P_1902.jhtml</a> <br> <br>Cheers, <br> <br>T</p>
