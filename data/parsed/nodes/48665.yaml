    html: |-
      <p>&gt;&gt; <em>Do you think the new set is an improvement over the old logo?</em></p>
      <p>Yes, I do prefer the new set over the first one. While the effect of the diamond shape going both over and behind the G is cool, it would be lost somewhat when reduced to the size needed for a business card or sent via fax. This is why I always design logos first in just black and white. That way I know it will work on a photocopy or over a fax. With your second set, the lighter blue thin cross hairs could be converted to black for things like fax cover sheets and still work fine.<br>
      --<br>
      Nancy Foster<br>
      Fontzilla's Alter Ego  <a href="http://www.fontzilla.org" title="http://www.fontzilla.org">http://www.fontzilla.org</a></p>
