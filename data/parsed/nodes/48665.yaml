    <p>So I am planning to make a simple and clean personal business card with a sleek and clean look to it. I already have the logo and I wanted to see if I could get some advice on a nice professional looking Sans-serif type face that will complement  Times New Roman which I used in my logo. This is my personal logo.</p><div class="imageWrap"><img src="http://typophile.com/files/personal logo Cody G_5353.png"></div><p></p>
    <p>Any comments on the logo would also be appreciated, It is easy enough to recreate with any typeface, I just liked the way that Times New Roman looked. </p>
    <p>Thank you</p>
