      <p>Fit should have more to do with the actual glyphs in the individual font than with an external philosophy. It is more about visual physics and balancing forces inherent in the font than a personal philosophy of either aesthetics or readability. The problem is that there is no true measure that fits what the human eye and mind does in the act of reading. There are several possible ways to balance an equation when most of the factors are unknowns. Each designer uses his or her own set of visual measurements and ratios to find an answer. There have been both successes and failures in fitting using any methods available. Perhaps it is not the system one uses but the quality of execution one arrives at?</p>
      <p>ChrisL</p>
