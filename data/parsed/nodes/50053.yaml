      <p>&gt;One solution is to set round sidebearings tight, then gently kern the round-rounds positively. </p>
      <p>I always do this and even more so with caps. My biggest "discovery" (probably old hat to others but...) was to give up on Capital spacing feature and instead, space the caps purely with the lowercase then kern the caps to each other with positive kerning. This eliminates the unified application of space between all kinds of pairs and allows a more sensible approach. It only takes a couple of class-kerning pairs to work. The biggest factor is adding space between straight sidebearings with a chunk of positive kerning. It also lessens the issue with matching diagonals like A and V with straights like H and N.</p>
      <p>ChrisL</p>
