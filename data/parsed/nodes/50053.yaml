    votes: null
    html: <p>The theory apparently is that squarish rounds should be fitted as if they were straights, not rounds. (This has got nothing to do with DIN, which in Pool's version is fitted by a master.) The result is that rounds have about twice the sidebearings on either side that they need. (Strangely this did not occur to Zapf whose competently fitted Melior is the ultimate parent of this typeface -- not that Melior should be encouraged to breed.) Another global problem is that the caps are incorrectly fitted in relation to the lowercase, leading to the excessive gaps between uppercase letters followed by lowercase letters. Look at commissioned, where mmi is reasonable but co is too loose, om is looser still, and the snobbish e has erected a hedge to shield its unwelcome neighbours from view. Ca and Ra show the problem with the caps.</p>
