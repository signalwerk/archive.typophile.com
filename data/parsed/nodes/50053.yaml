      <p>&gt;I am more convinced by Bloemsma’s curve theories than by his stress theories</p>
      <p>I am not convinced by either. By 'curve theories' I take it you mean his quote from a teacher, "a straight line is a dead line." I think this is sometimes true, enough to make it a good quote. But it is also sometimes false. Straight verticals, for example, convey strength in some designs. The straights are also often combined with curves, and the tension is very lively, and not dead. </p>
      <p>As opposed to the 'sometimes true' view about straight lines, I just don't like the reversed contrast thing with roman. The "heavy vertical, lighter horizontal" rule is so deep in the DNA of the Imperial caps and Carolingian minuscule that I just don't think the reversal works. Hebrew is the other way around, and there the heavy horzontal, light vertical rule works fine--but the shapes are fundamentally different. Also the Roman Rustica caps are reversed contrast, but again have a different skeleton. When you take classic upper and lower case 'bones' and try to put reversed-contrast clothing on them, it always looks ill-fitting to my eyes.</p>
