      <p>Kris wrote: <em>I’m not seeing the reversed contrast, there isn’t any in there. Serrano has a fairly standard contrast. Where are you seeing it?</em></p>
      <p>I suspect the comments re. 'reversed contrast' are in response to the strong x-height and baseline horizontals and the correspondingly reduced weight in the mid-zone in the frequent letters a e and s, most notable in the heavier weight. You're right, Kris, this isn't 'reversed contrast', but I can see how this kind of weight manipulation might remind people of Evert's Balance. What Serrano actually has is Jean François Porchez-style <em>’orizontalité.</em> Very nice, too.</p>
