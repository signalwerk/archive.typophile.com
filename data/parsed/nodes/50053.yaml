      <p>&gt; <cite>Getting good rhythm and color is important to readability, and so readability is a constraint on text faces...</cite>.</p>
      <p>I agree with William. <strong>Good rhythm is consistantcy in color.</strong> There should not be strips of white space between the letters or words due to the shapes of the sides of the letters. This is where good kerning comes into play, as certain letter pairs need to be closer together, whiles others need to be further apart.</p>
      <p>Generally speaking, larger type is tighter to a fault, and smaller type is looser. Text faces for children are a little looser even at medium sizes, or the typeface design is very wide, like Schoolbook.</p>
      <p>In a well-made OpenType font, kerning becomes obsolete, or is only used as an override, like in InDesign diacritics panel (I assume the non-ME regular version has this pallete). </p>
      <p>I wonder if the leading OpenTpe font-makers are adding this extra feature. David Berlow of FontBureau, is this the case with your fonts? Thomas Pinney of Adobe, co-makers of OpenType, is this feature in your fonts? Is Linotype still around?</p>
