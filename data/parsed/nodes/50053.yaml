    votes: null
    html: |-
      <p>I did a project for a corporate client a few years ago which bears some similarity. This kind of work is more styling than design. Nothing wrong with that, it's the kind of font development the situation calls for. Smoothing some of the corners is a quite literal (though somewhat simplistic) interpretation of the brief for something "friendly", that can be pointed to, easily understood, and signed off on by various levels of client. Art directors contribute by deciding where, and in which direction, the go-faster streamlining goes. </p>
      <p>There is rarely enough time to do a thorough job from scratch, so it's expedient to whip up a font solution by taking something basic off the shelf and applying a little tinkering. Indiscriminately rounding some of the corners is one technique that does the job, as is chopping some of the perpendicular terminals off at angles. Voilà--a new custom typeface! </p>
      <p>**</p>
      <p>The positioning is no longer valid, following the economic crisis.<br>
      What people want is a bank that's secure, not friendly.<br>
      Surviving corporations will need to rebrand.</p>
