      <p>William, to answer your question about Berthold kerning, the other primary feature, and the one that takes up the most space, is positive cap-to-cap kerning. However, the purpose of this is not to fix errors that could have occurred because of incorrect relationships with the lowercase or with itself. The purpose is to guarantee, by default, well-spaced (near "letterspaced") caps in all-cap settings. I don't actually think it's a good system, though no less an authority than Erik Spiekermann is very much in favour of it. I think what Matthew Carter has worked out in his later work (the past ten or fifteen years) is just about the best. It is much more sophisticated, and not always easy to understand, but I always find that his fonts have the answer to any question I encounter. And I always have plenty, because I am not one of nature's fitters, and always find it a trial. </p>
      <p>&gt;BTW, who are these re-designers? Is it legal?</p>
      <p>No names! Under Adobe's rules, it would be legal, provided that the user had a license to the font. With Emigre I wouldn't like to say, except that a lot of use of the fonts would not take place without this treatment, and they don't seem to have sued anyone over it - - it would look so silly. How can you sue someone for repairing basic defects in your product?</p>
