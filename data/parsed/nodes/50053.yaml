      <p>&gt; Whether or not you drew it completely from scratch,<br>
      &gt; or modified another of your designs, is not the issue.</p>
      <p>It certainly can be an issue, and I would say generally is, since a "custom" solution does mean something special to the client. Even if a client is not knowledgeable about type, he will feel cheated if the font they paid a lot of money for is based on an existing one. On the other hand, if one tells the client this is what will be happening (as I've done recently for a client in Armenia) then it's OK.</p>
      <p>&gt; There is certainly nothing unprofessional about modifying one’s own work to produce new designs</p>
      <p>Nick, know that this was not the tone of your previous message.</p>
      <p>&gt; surely the metaphor that a rounded styling is friendly (not to mention<br>
      &gt; fashionable) is central to the typographic ethos of this project?</p>
      <p>You don't know that. Even if you or I think it's friendly, that doesn't mean the client thought so.</p>
      <p>&gt; how can that free the designer to do a completely thorough, from scratch, job?</p>
      <p>Of course, nothing is completely from scratch. Duh.</p>
