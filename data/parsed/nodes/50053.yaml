    html: <p>To forestall Hrant, the reason Mrs Eaves succeeds is not because of its bad spacing but in spite of it. The typeface has real charm and the looseness is tonic. Fixing the bad relationships but maintaining the looseness of Mrs Eaves, as more than one expert technician of my acquaintance has been paid well to do, only improves the typeface. One hopes that Licko has learnt something in the meantime, but refitting the commercial font would be impossible because of the necessity to preserve line integrity in older documents. On the other hand, there are people who are simply too invested in their sense of authority to learn.</p>
