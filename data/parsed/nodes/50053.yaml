      <p><em>I’m offering my thoughts (as you requested) as to how the mechanics of the working relationship between a foundry, the foundry’s client, and the client’s client affect the design of a custom type. I’d be interested in your insights, rather than just a straight assertion of how perfectly the design delivers on the brief.</em></p>
      <p>The mechanics are pretty straight forward. They came to me wanting a custom typeface to fit into their new branding direction. I looked at what they had graphic design wise, their mood boards, which typefaces they were referencing &amp; talked to the AD about what was good &amp; bad about those typefaces. Once I had a clear idea of what they needed I started drawing (yes, from a blank slate). The design was sent through at various stages to get feedback &amp; sign-off, all the way until it was finished. Isn't this how everyone does it? </p>
      <p><em>Nonetheless, the application of rounded corners wherever they don’t look too cutsey does seem to be a compromise. Despite your explanation of a system, there still seems to be a certain arbitrariness in the application of round corners. Why, for instance, is the top left of “u” sharp, but not the top left of “n”? Why no rounded corners in “w”?</em></p>
      <p>I put the curves in where it made visual sense to me. Any more would have ruined it. I tried rounded bits on the 'u' and 'w' but they looked wrong. If that is arbitrary, then so be it! </p>
      <p><em>But conceptually, when a client specifies not just a brief of abstract qualities, but an execution such as a rounded finish, how can that free the designer to do a completely thorough, from scratch, job?</em></p>
      <p>I'm not sure I understand why this is relevant. I'm a designer, not an artist. I want and need their feedback and input to make a typeface suitable for them. They initially wanted rounded corners, like Unit Rounded. I didn't do that, but we arrived at the rounded-to-a-point curve mutually during the collaborative design process. I think that client involvement makes a thorough job.</p>
      <p><em>On the “slightly reversed contrast” I meant as I said the a, which goes from relatively thick to the reduced, curved terminal…</em></p>
      <p>Ah. I thought you meant I had gone totally Antique Olive/Balance! Maybe one day, for something else.</p>
      <p><em>What Serrano actually has is Jean François Porchez-style ’orizontalité.</em></p>
      <p>What a lovely term for it!</p>
      <p><em>I’ll take a bet that this one will stick with Kris’s identity for some time to come.</em></p>
      <p>Hey Bill, just to clarify that the identity isn't mine, only the typeface. I'd hate to take credit where it's not due…</p>
      <p>--K</p>
