      <p>Fabio, thanks for the illustration. I now see some more of the similarities, and also more of the differences. I can better see why William is bothered by the terminals, but honestly, whereas I wouldn't want to use the font myself, I would love for my bank to use it -- and that's the whole purpose here. Fabio's design has a completely different flavour and feeling. Fabio, I wasn't serious about that Vafflard remark. Vafflard was the first (about 1783) to take the left bars off f and t, and I was the first to start reviving Vafflard's designs quite some years ago without however ever having released any of the work. (Interestingly, one of my quarrels with Adobe, when they took this work on, was that they decided halfway through that they wanted left bars put on. Matthew Carter and Sumner Stone, whom I consulted about this lunacy, professed themselves quite unable to understand it. That it was an issue at all illustrates my commitment to the barless f and t in this design. I gave in to them in the end -- what choice did I have? -- but that wasn't enough to save the project, which remains unreleased though occasionally used. A typophile thread where the font is illustrated is <a href="http://typophile.com/node/47453">http://typophile.com/node/47453</a>. You can see why Robert didn't want it released before Garamond Premier and some of his other later fonts, which incorporate many curiously similar ideas.)</p>
      <p>Hrant, will you remind me what I said about Unger and cuteness and how it turned out? I don't remember any of this.</p>
