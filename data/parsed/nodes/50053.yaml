      <p>Paul, this is reminiscent of David Berlow's comment in Robert Norton's TBR/TBF in the middle of an ITC selection committee meeting that he doesn't like Stone Sans italic and similar. (Something to do with masculine/feminine terminations which I never figured out.) </p>
      <p>I like your formulation of Classic+Cute -- which is acute (which is the original meaning of cute). The problem with a corporate typeface is that it must be noticed and must be liked, but must never waver in its credibility. This is very tough to do. A great corporate typeface must also have Zeitgeist awareness. The feeling that this design belongs here, now, I like it now and I will like it for ten years, if not forever. Very few type designers have the ability to connect with and exploit the visual language of their moment - - it is such a very subtle thing. It's very easy to lose, and for the few who succeed, the achievement seldom carries over beyond a generation.</p>
      <p>Cute is an interesting word in that it has simultaneous good and bad connotations, unlike for example 'naff' which can mean one of two opposite things (not invariably discoverable by context) but not both together. One could think of cute as having a possible axis with ego as one extreme and humour as another. </p>
      <p>In a recent thread criticizing the Vista C-fonts, I used cute primarily negatively. There, the design goal was to prepare several typefaces suitable for everyday, every-hour use, to be used by hundreds of millions of users. All-day, all-weather use. Crystal goblet design. In this I think they failed, except for the user base which happily cohabits with the most famous C-font of all, Comic Sans. However, any of the C-fonts would be considered superb candidates for a corporate identity or advertising project. </p>
      <p>By contrast we're using cute here in its happiest senses. This is a happy typeface. That is one of the very hardest things to do. I don't care how it happens, as long as it happens. </p>
      <p>Speaking of the how, two people have noted a resemblance between Serrano and Foco (including its primary designer, Fabio Maag). Based on the web samples available, I just don't see it at all, and I am something of an expert on what constitutes type cloning. If someone is going to make this case, I think they should make it in good, high, resolution. Don't say something looks like something unless you're willing to prove it. (I could just as well say that Foco looks like a sans version of the Vafflard font I have been working on for the past 15 years. It does! Shame! The f and t without the left bar are mine! Forever!) However, in this particular case, having spent some careful time with the web samples, and even allowing for the low res, I must say they look like completely different designs to me. The suggestion of influence should not have been made.</p>
