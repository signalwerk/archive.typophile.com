    <p>Kia ora folks,</p>
    <p>The rebranding of <a href="http://www.bnz.co.nz">BNZ</a> by <a href="http://www.dna.co.nz">DNA Design</a> has just gone live. They're using <a href="http://www.klim.co.nz/custom_serrano.php">Serrano</a>, a custom typeface that I whipped up for them. Kiwis will see the new rebrand roll out through the country over the next few months. Your thoughts are welcome, as always.  </p>
    <p>--K</p>
  html_clean: |-
