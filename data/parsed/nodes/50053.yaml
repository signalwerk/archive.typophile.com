      <p>Bill, concerning the Unger comments:<br>
      1) It might not have been you.<br>
      2) It might have been a private comment (in which case I apologize).<br>
      3) Hwoever/wherever it was, the opinion was that Unger's work is often cutesy.<br>
      4) In terms of "how it turned out", I just mean that Unger has been a superb contributor (as I think you agree) irrespective of any persistent theme (cuteness or otherwise) throughout his work.</p>
      <p>&gt; I am more convinced by Bloemsma’s curve theories than by his stress theories</p>
      <p>Well, his stress theories evolved rapidly and markedly even starting from Avance, and certainly by Legato. In the end (which came so soon) Bloemsma didn't see reverse contrast as anything central (if he ever did). He was slowly coming around to the practical benefits of (so-called) stroke contrast, serifs, etc., although absolutely not in terms of chirography, quite the contrary.</p>
      <p>&gt; Straight verticals, for example, convey strength in some designs.</p>
      <p>I agree. And honesty too.</p>
      <p>&gt; The “heavy vertical, lighter horizontal” rule is so deep<br>
      &gt; in the DNA of the Imperial caps and Carolingian minuscule</p>
      <p>This makes no sense to me. There is nothing comparable to DNA here. And really, even DNA mutates!  :-)</p>
      <p>&gt; the shapes are fundamentally different<br>
      &gt; .... a different skeleton</p>
      <p>This skeleton business has to go. Leave them in the closet, then burn the closet. We don't read skeletons; it's just an intellectually lethargic way to make fonts. And any differences are not "fundamental", but malleable; which is not to say we should change things in cavalier or chauvinistic fashion. But if something <em>needs</em> change, we should try.</p>
      <p>hhp</p>
