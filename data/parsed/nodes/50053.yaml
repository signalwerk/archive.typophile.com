      <p>&gt; ... o spacing in relation to n spacing is ...</p>
      <p>From my own experience I have a hunch that this might be due -at least in part- to the relative importance one gives to control-string spacing versus real-language spacing. If you rely too much on control-string spacing, the round-straight sequence (and by extension the overall) becomes too loose when you actually set text. One solution is to set round sidebearings tight, then gently kern the round-rounds positively. This is what I did in Harrier, and people seem to think highly of its spacing.</p>
      <p>hhp</p>
