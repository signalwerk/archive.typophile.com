      <p>On the "slightly reversed contrast" I meant as I said the a, which goes from relatively thick to the reduced, curved terminal, doesn't work so well, whereas the g tail, which tapers first, to me is very successful. And for me the top of the e and the r seem to have a little too much 'meat' also. The s is better, and again the g just right. </p>
      <p>I don't 'get' the illustration with Bookman; it seems to me totally different than Serrano. As to the treatment on the other verticals of the lower case, if you compare Meta, for example, on this there is not just horizontal sheers, but different treatment to go with the bent stem tops on the mnr. To me this is more harmonious.</p>
