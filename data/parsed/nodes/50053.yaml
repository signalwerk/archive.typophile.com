      <p><em>My problem is with describing type as “cute”, “friendly”, “beautiful”. What we associate with a typeface is what happens in our’s minds but is nothing found on paper as such.</em></p>
      <p>I talked further with Kris about this and it's so hard to describe what you are seeing that what you are feeling is sometimes easier (and maybe clearer, even if less precise). It's not the terminal treatments that make this work 'cute', it's the handling of all of the curves: they're all a bit over-plump you might say (or tend towards the super-ellipse if you want more techy terminology). It's this feature that makes all of Kris' work 'friendly', IMO. To me it's this feature that really sets Seranno and Foco apart: despite the rounded terminals of Foco, it feels more 'neutral' (throw me a more techinical term for that!) to me because the handling of the curves is different (to my eyes at least).</p>
      <p>terminology is such a tricky thing, really. even seemingly universal terms such as 'yellow' are cultural constructs and mean different things to different people. To me it's obvious that Kris' concept of a 'curve' is different from my own.</p>
