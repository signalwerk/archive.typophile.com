      <p>I am not sure the problem is that these matters are subjective. Describing or comparing visual features of typefaces, their roundness, edgyness etc, is part of our job, whether explicitly done or not. My problem is with describing type as "cute", "friendly", "beautiful". What we associate with a typeface is what happens in our's minds but is nothing found on paper as such. We better stick to describing what we see, like "rounded" (Nick) or "curve-to-a-point terminals"* (Kris) -- and <em>then</em>, maybe, if we feel like it, utter what we associate with this.</p>
      <p>* Finally I have a term for this.&nbsp;&nbsp;:)</p>
      <p>Trying to make sense of what has been said: Maybe the issue is that quite a few typefaces use a curve-vs-corner trick so they look either <em>a bit</em> rounded or <em>less</em> rounded. 1. With curve-to-a-point terminals -- especially Underware's work (Dolly, Sauna) stimulated others to adopt this feature. 2. With point-in-curve counter, a corner inside "e" or "o" counters -- that's the opposite, to make it look <em>less</em> round, part of the Reading house-style. Both found in sanserif and serif typefaces alike. In so far it's not a "just slapped on" issue (using Kris' term, cannot find who brought this up), but that curve-to-a-point or point-in-curve appear as just two ingredients that can be switched on/off with virtually every kind of typeface -- 1. like "e" or "c" curve-to-a-point terminals in very different styles like Serrano or Omnes or seriffed Sauna, and 2. there was an entire Typophile thread dedicated to typefaces with point-in-curve counters (cannot find it now).</p>
