    html: |-
      <p>Thanks guys! I was waiting for the Strada comparison… I had a mini panic attack at one stage when I realised that Serrano was looking close to Strada, so I asked Erik Spiekermann for advice &amp; he said it wasn't close enough to worry. The rounded terminals are actually suggestion from the AD after an early proof. At that stage there were no rounded bits—just normal square terminals. He suggested rounding on the uprights: </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Serrano-feedback-02_4134.gif"></div><p></p>
      <p>and curving the 't' tail to a point:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Serrano-feedback-01_4462.gif"></div><p></p>
      <p>I responded with a new draft with the suggested upright treatments and additional rounded-to-a-point terminals on a,c,e,f,g,j,l,r,s,t—as it would look weird just having it on the 't'. The AD/client liked it &amp; that was that! </p>
      <p>As for the logotypes, they were drawn in-house &amp; sent to me to polish. I'm not sure at what point they were started or what the references were, but they are a bit different from Serrano. I'm not entirely sure what motivated them to commission a custom face, perhaps they weren't entirely happy with anything currently available for retail? </p>
      <p>--K</p>
