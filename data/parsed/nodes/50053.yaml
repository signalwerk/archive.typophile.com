      <p>Wow, thanks for all the interesting feedback! I'm not too sure how to respond to the classic/cute description, people will see what they will. I always thought it was more 'humanist', in the looser sense of the word.  </p>
      <p><em>In looking again at it, I’m thinking that what bothers me is not so much the terminals themselves, as their combination with the slight reversed contrast, the Bloemsma influence.</em></p>
      <p>I'm not seeing the reversed contrast, there isn't any in there. Serrano has a fairly standard contrast. Where are you seeing it?</p>
      <p><em>Smoothing some of the corners is a quite literal (though somewhat simplistic) interpretation of the brief for something “friendly”, that can be pointed to, easily understood, and signed off on by various levels of client. </em></p>
      <p>You could say it was literal &amp; simplistic, or you could say it was quite appropriate to the brief. There were three other typefaces that they were using for a reference &amp; a starting point. All of them had rounded corners and only one was well-made enough to actually use. I was unwilling to do the 'rounded corner' thing, as it would date too quickly (web 2.0 etc). </p>
      <p><em>There is rarely enough time to do a thorough job from scratch, so it’s expedient to whip up a font solution by taking something basic off the shelf and applying a little tinkering.</em></p>
      <p>Are you insinuating that this isn't a thorough, from-scratch job? </p>
      <p><em>True. What I was trying to get at was the apparent lack of rationale for where the round corners go. Sure, one can discriminatingly place them here and there so that the overall effect in text is comfortable, but is that all there is?</em></p>
      <p>Let me be very clear. The rounded bits are not just slapped on here &amp; there to make it 'friendly'. The 'humanist' structure (like Thesis Sans) the open, generous counters (like Frutiger) and the overall narrow set are purposefully designed to convey the desired qualities. I have rounded ascenders, but not on the horizontals or the capital uprights—as these start to look too weird &amp; cutesy (haha) for a bank. All of the curve-to-a-point terminals are applied to curved terminals only, like a,c,e,s,f,t, etc. </p>
      <p>--K</p>
