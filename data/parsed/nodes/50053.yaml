      <p>Then again, this preference is not limited to Reading, of course. Jarno Lukkarila’s <a href="http://www.jarnolukkarila.com/template.php?yksikko=format_design&amp;sivu=about&amp;alasivu=about_xtra_sans&amp;alasivu_taso_2=neo-gothic_construction&amp;lang=en" rel="nofollow" class="link-external">Xtra Sans</a> is a prime example for the <cite>point-in-curve counter</cite> – and he studied at <a href="/wiki/KABK" class="freelinking link-lost" rel="nofollow">KABK</a>.</p>
