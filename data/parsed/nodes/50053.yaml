      <p>I have not seen anything of Serrano other than the web samples but based on those let me say again: this was conceptualized beautifully from scratch and is the very opposite of the kind of work that is done by designers who take something off the shelf and make a few (or many) changes -- an MO I frown on. Again, as near as I can judge, the Serrano implementation is superb in a way that is still extremely rare today. By implementation I mean primarily truly excellent fitting and other factors that make the typeface harmonious, usable, and useful. For example, I am crazy about Paul's Grandia typeface, which shows such deep understanding of the intangibles of serious reading, but I don't think the fitting is there yet based on the sample referenced here. Great fitting is a skill few great type designers have, and ideally would not have to worry about. Nick, I love your type but Richler proved you were not very comfortable with text fitting, remember? Part of what I am trying to say is that one of the reasons why Kris's decisions to treat this element (n) one way and that element (u) another way is <em>not</em> important is that the overall appearance of the set typeface is so overwhelmingly convincing. No doubt Serrano is open to criticism, but I have not yet heard a pertinent criticism expressed yet. As for prediction that</p>
      <p>&gt;Surviving corporations will need to rebrand.</p>
      <p>I'll take a bet that this one will stick with Kris's identity for some time to come.</p>
