      <p>I guess I agree with Paul about the 'cute' part about this design, but not about Kris's designs in general, where I would say 'beautiful'. </p>
      <p>In looking again at it, I'm thinking that what bothers me is not so much the terminals themselves, as their combination with the slight reversed contrast, the Bloemsma influence. A more assertive design that Kris did--I think it was called Karbon--made the Bloemsma influence work well. But here the softness of the terminals for me don't go well with the heavy looking strokes. For example, in the 'a', the top stroke is quite heavy--like Gill sans. But then comes the soft, tapered stroke which to me contradicts it. By contrast, if you look at the soft terminal at the bottom of the 'g', which has a thinner stroke, the effect is lovely. </p>
      <p>Also, I wonder whether it would look better with a rounded inner corner rather than outer corner in the stems of the m n r. And why have horizontal cuts terminating the 'w' when all the other verticals end in soft terminals? I just keep getting the feeling that a more formal design had a bow stuck on it. Very well drawn, but disconcerting to me. </p>
      <p>I am here looking at the bold, as this stuff is not noticeable in the lighter weight in the link to Kris's site.</p>
