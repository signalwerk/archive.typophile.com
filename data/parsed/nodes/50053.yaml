      <p>Bill, you are too tied to convention. Overly invested in a sense of authority, one might say.<br>
      Innovation is not, per se, incorrect. Of course, the sidebearings of Richler don't look right when one examines them closely and looks for divergence from standard theory and practice. In fact, I had to overcome my prejudices and concentrate on how the face reads in text, to fully commit to the concept.</p>
      <p>Ultimately, "fit" is not a matter of right or wrong. Like other aspects of type design, it's more a question of style and tone, and the personal discrimination of the designer. There are different styles of fit, and Richler is wide and open, whether you like it or not.</p>
