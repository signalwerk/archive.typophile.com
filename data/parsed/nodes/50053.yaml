      <p><em>You could say it was literal &amp; simplistic, or you could say it was quite appropriate to the brief.</em></p>
      <p>Yes, I said it was literal, simplistic, and appropriate.</p>
      <p><em>Are you insinuating that this isn’t a thorough, from-scratch job?</em></p>
      <p>I'm not insinuating. I'm offering my thoughts (as you requested) as to how the mechanics of the working relationship between a foundry, the foundry's client, and the client's client affect the design of a custom type. I'd be interested in your insights, rather than just a straight assertion of how perfectly the design delivers on the brief. </p>
      <p>Whether or not you drew it completely from scratch, or modified another of your designs, is not the issue. There is certainly nothing unprofessional about modifying one's own work to produce new designs; at the same time, drawing completely from scratch is no guarantee of quality. Conceptually, the wine typeface you showed here recently is more thoroughly original.</p>
      <p><em>The rounded bits are not just slapped on here &amp; there to make it ’friendly’.</em></p>
      <p>They aren't? You have said that your client started you off with three rounded types--surely the metaphor that a rounded styling is friendly (not to mention fashionable) is central to the typographic ethos of this project? However, you were, understandably, unwilling to remain at that superficial level, seeking a richer implementation of the desired qualities, with the "humanist" features and proportions that you gave to the face. Nonetheless, the application of rounded corners wherever they don't look too cutsey does seem to be a compromise. Despite your explanation of a system, there still seems to be a certain arbitrariness in the application of round corners. Why, for instance, is the top left of "u" sharp, but not the top left of "n"? Why no rounded corners in "w"?</p>
      <p>There's absolutely nothing wrong with making styling decisions with a discriminating eye, in fact, it polishes faces to perfection. But conceptually, when a client specifies not just a brief of abstract qualities, but an execution such as a rounded finish, how can that free the designer to do a completely thorough, from scratch, job?</p>
