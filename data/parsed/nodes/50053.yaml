      <p>&gt;There are several possible ways to balance an equation when most of the factors are unknowns. Each designer uses his or her own set of visual measurements and ratios to find an answer. There have been both successes and failures in fitting using any methods available. Perhaps it is not the system one uses but the quality of execution one arrives at?</p>
      <p>Yes. There are four basic questions to answer: how do you space H, O, n, o ? Everything follows from that. So: you have four dependent parameters: cap straights, cap rounds, lc straights, lc rounds. (Not that these do not have variations. For example, left b will sometimes be substantially less than left l. And it can happen, not seldom in a 'Modern', that what is right for n is not right for m.) </p>
      <p>The problem is that we look at these parameters as independent, when they are all dependent. Richler is a textbook example of this situation: the lc straights are a little loose, but the lc rounds are very, very loose. And the caps don't relate to either.</p>
      <p>Nick, if you can't see the disharmony of the Richler spacing, it's time to take a fresh look. Don't you want to be remembered for your successes rather than your failures, interesting and educative as they may be? </p>
      <p>Needless to say, spacing is only, ever, optimal at one point size. You hope, in a single master type, to have designed that optimal size such that positive tracking can take care of the smaller sizes and negative tracking can take care of the larger sizes. Or you design other sizes with different spacing. Or you tell your single master customers that they should only use the type at once size.</p>
      <p>There is no one right way, but just because that is true, it doesn't make a wrong way a right way. For example, o spacing in relation to n spacing is typically looser in Lino metal (and photo/digital); tighter in Mono metal, and tighter still in ATF metal. (Benton liked tight o's.) Matthew Carter has suggested that one reason for this progression may simply have to do with the comparative fragility of the type in the three systems. However that may be, Sumner Stone for example prefers looser o's in relation to n's than Carter does.</p>
      <p>Whatever way you solve the relationships, you must do so plausibly, without obvious rivers of space running through a single word. Like 'commission' in the Richler pdf where it will be obvious even to an un-typographically sophisticated reader that something is amiss. Look at 'personality'. lity is nicely spaced. But everything else is too loose, and the p looks as if it weren't even attached to the word.</p>
      <p>I suspect there may be more subtle problems, too. Look at full. ll is very nice, but I would guess that u has the same right sidebearing as l. It needs less, because it is only at x-height. It's a pity, because the typeface could really sing with good fitting!</p>
