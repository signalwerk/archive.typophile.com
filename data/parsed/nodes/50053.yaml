      <p>To get back on topic, I think Fabio's terminal treatment is more likely to work best at smaller sizes and I love anyone willing to take on the challenges of the left-bar-less f and t. (I am remembering Slimbach and Twombley's incomparable performance in this respect. 'Week 1. We think you should have a little blob, the teeniest thing, just two or three units, to the left of f and t. Week 2. Do you think you could shape the blobs a bit more? Just a couple of extra points? Week 3. We don't think two or three units is enough. Could you try five or six? Week 4. The blob shape isn't working for us, do you think you could make it more like a bar? Week 5. We know we asked you only for a tiny bar, just ten units, but do you think you could extend it just a tad to thirteen or fourteen? Week 6. Let's have the bar come out fully. We think that will give the characters better balance. Don't worry, Bill, it's just a blob. Nobody will notice it.' Oh, did I say I say I was going to stay on-topic?)</p>
      <p>I enjoyed also Kris's article about Balance. I am more convinced by Bloemsma's curve theories than by his stress theories and I am glad Kris didn't overdo the stress.</p>
      <p>I realize that Kris's approach to the terminals isn't entirely consistent, but it really works for me in sizes large enough to be visible. I think I know why: What is so <em>acute</em> about this treatment is that it states, through the simplest graphic elements, a strong message: innovation and modernity (C), plus tradition and stability (u). This is an utterly brilliant use of graphical elements to send a signal that will be recognized by everyone who has ever seen a conventional typeface in use. I really admire the intelligence and instinct at work here. William, surely, in these terms, you can see why he has done exactly what he did. I cannot think of another typeface where this has been done so successfully. It succeeds on so many different levels: visual, psychological, aesthetic. An exceptionally sophisticated command of contemporary marketing and advertising language is seen here at its clearest, its most elemental. I don't think I'm overstating the case when I say that we all can learn a lot from this typeface.</p>
