    html: <p>Kris, I think you fulfilled the brief admirably. And you're right, the point was not originality. Still, to me the terminals seem to me a little tacked on, not as organic as with your other faces. Also I find the tops of the BDR a bit awkward. As to alternatives, I think the way Myriad takes Frutiger and tapers the terminals is very systematically worked out, and is quite effective, even though I think Frutiger is a more beautiful face. A more soft, swashy treatment of terminals that works is in Goudy sans, but it's too busy and informal for a bank.</p>
