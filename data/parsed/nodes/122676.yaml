      <p>The  Google font <a href="https://www.google.com/fonts/specimen/EB+Garamond">EB_Garamond</a> contains all the characters you need except<br><code>U+02E4</code> <code>&nbsp;</code> <strong>ˤ</strong> <code>&nbsp;</code>    Modifier letter small reversed glottal stop<br>
      (in case you need it).</p>
