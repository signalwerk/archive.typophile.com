      <p>sii: I'm interested in starting up my own small business after graduation, so after spending hours on Typophile, I thought that the Adobe collection offers some of the top classic and well designed fonts for the best bang for the buck. It would be more than enough for my clients, but I agree, a lot of the type, although well designed, are overused. I bought this CD 6 months ago, but this sudden feeling just came to me yesterday.</p>
      <p>I could've used the money to buy a couple families from H+FJ, Emigre, and Underware but I might end up with only 7 families, and a client may want something completely different from the 7 families that I have that wouldn't be a problem with the Adobe package.</p>
      <p>I don't know, there's pros and cons, but I even though I have a wide range of flexibility, I am going to limit myself to some families to master, while having additional type that can be used as display when the occasion rises. Even if it's overused, it still looks great.</p>
