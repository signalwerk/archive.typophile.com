    <p>I recently bought the Adobe Type Collection, OpenType Edition from Monotype Imaging <a href="http://www.fonts.com/FindFonts/RecentReleases/2006/Adobe-Type-Coll-OT-Edition.htm" rel="nofollow">here</a> for $3999, when it was on sale for a limited time before it went back up to $4999. It did cut a big hole in my savings since I'm a starving student.</p>
    <p>I was wondering what other people's opinions are, since some like to build a small collection over time rather than buy a huge collection. Personally, I thought it was a steal for a graduating student, but nowadays, I'm drooling over some more newer typefaces from Hoefler + Frere-Jones, Emigre, Underware, and Storm that I could've used the $4000 on, though I'll end up with a small collection of families. In some ways, I feel a bit of regret, but in other ways, I feel like I'm taking the collection I have now for granted.</p>
    <p>Did I make a bad move by purchasing a large collection of classics but not so much on the fresh, distinctive, contemporary side? Or did I just start a typical library where future expansion is inevitable?</p>
    <p>Thanks for your thoughts and opinions.</p>
