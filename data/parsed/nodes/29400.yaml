      <p>Miss Tiffany: I think that was my initial thought; that this is a lifetime investment. A big reason why I bought the collection was from the research that I've done, looking up what are "the best" serif and sans serif fonts, as well as referring to Bringhurst, I found that the type collection has most of the well known classics. It just dawned upon me the more I hung out here, the more I'm realizing that most of the well-known ones are overused. Even if they are beautiful, I should, as a young designer, go more contemporary.</p>
      <p>Having the idea that it's an investment that will pay off is a little reassuring, since I will be charging the clients for typeface licensing. Considering that 3/4th of the payment I made toward this were from scholarships, I shouldn't feel too bad. I can always add Verlag to my collection one day ;)</p>
