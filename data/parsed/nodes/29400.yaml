      <p>Cyanide, as long as you are a graphic designer for years to come, having a solid type library is never a bad thing.</p>
      <p>In my own case, I used the $$$ I had from jobs to get hardware and Adobe apps (which come with a little type library on their own), then licensed fonts on a job-b(u)y-job basis. I must admit though, people expect designers to have fonts, and if you're picking up work from someone who's already got a style guide, they would often rather hear "yeah, I have Univers" than "so, I'm billing you for the fonts". I've hit some snags that you won't with all the standards in your toolbox.</p>
      <p>Don't regret it. Everyone's got a cousin who knows a guy who can get X product for 50% less, or thinks that X product is a waste when you could get Y. All choices open and close doors. As long as you consider which are opening and closing, who cares? It's not what all of us would do, but I bet a lot of us would if we could...</p>
