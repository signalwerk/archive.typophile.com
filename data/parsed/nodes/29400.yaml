      <p>I don't think it's a bad decision at all. As typophiles, some of us (myself especially) get a bit jaded about the classics, and addicted to the novelty of new releases. But the Adobe collection has a huge number of very usable and versatile faces, not all of them staid workhorses, either. You could put together a very contemporary publication using Warnock Pro and PMN Caecilia, both of which are part of the the collection.</p>
      <p>You've got a solid base to build from; as the opportunity arises, build on it with newer releases from more adventurous foundries.</p>
