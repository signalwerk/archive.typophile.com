      <p>&gt; In California, violators face a $10,000 fine and jail time. </p>
      <p>I don't support font piracy, but statements like this are misleading. Those are maximum fines. I was once charged with careless driving, and found out that in Ontario this could lead to a five year jail sentence. Found out later that almost never would anyone do a week in jail, it was only a fine (mine was about $100). If you killed someone, you might get jail time, but the charge was almost raised to dangerous driving.</p>
      <p>So while you might be able to get a four digit fine and jail time for type piracy in Calif, what is the actual level of punishment that is handed out. I suspect it is probation, and probably loss of the computer.</p>
