      <p>Shoulda coulda woulda</p>
      <p>People, don't be gross. Joachim already has buyers' remorse.</p>
      <p>That collection is very solid and substantial. Caslon, Minion, Jenson, Chaparral, Dante, Meridien, Perpetua, Galliard, Officina Sans, Joanna, Bickham Script Pro, Sava, Silentium, several Garamonds including the new Premier, etc. all in OT format isn't shabby at all. </p>
      <p>Its true there is a "look" to work done with only Adobe fonts. Avoid it by strategic purchases of other versatile families from other foundries. Adobe's OT library doesn't have anything like Dolly, Dalliance, Prensa, Neutraface, Quagmire, Luxury, or Neo Sans. As long as you're smart about how you use it, you're in good shape. Learning to expertly combine type will help you avoid that "90's" look.</p>
      <p>The type you bought should last a long time. And no matter what collection you get, you'll still have to add to it. Just don't expect to never buy new typefaces again. That's something I'd say to any designer.</p>
