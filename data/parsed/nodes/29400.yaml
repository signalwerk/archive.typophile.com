      <p>If you have to make a big investment, this one makes the most sense. Adobe OpenType versions give you access to old style figures (though, maddeningly, not in all cases), alternative weights, Central European accents, etc., that other issues do not. Your new collection deserves to be the center of any type library, and now you have it. It's certainly the center of mine.</p>
      <p>Having said that, you can now move to gradual purchases averaging around $200 for complete families. The major exception is ITC Galliard Pro, issued only by ITC for $315, in which, at long last, Carter has authorized oldstyle figures for all the fonts/weights in Galliard, which the Adobe OpenType version does NOT offer! But after that, Storm's Regent II for $55, everything from JoshuaDarden.com or Hoefler-FJ, plus individual picks like Zingha from FontShop--these are your best future buys at more modest prices. And don't forget MyFonts.com sales: the Portguese family Esta for $12 per font now! Giddyup!</p>
