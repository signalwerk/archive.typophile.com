      <p>Tiffany</p>
      <p>I did not post a link, nor would I have, nor do I know what that link would be. But I have seen how the technology works and on that site. The bit torrent technology itself is not in anyway illegal and it is a valid instrument for transferring massive quantities of information.</p>
      <p>I walked away from that demonstration with vivid thoughts. First, that the illegal activity seems a generational thing. The participants act under the guise of "sharing" and I suspect that is what they think they are doing. It is also very game-like, with massive amounts of statistics and graphs, along with denigration for those who do not readily share back and applauds for those who willing overshare. The concept of theft isn't a consideration for the participants, they are scoring points and gathering virtual rewards, whether it be a music library, a film library, a type library. </p>
      <p>Second, it would seem apparent that folks like this DO NOT buy fonts. Thus, I suspect this is less a threat to the type market than folks make it out to be, or, here, refuse to talk about. Ethical responsibility and respect for intellectual property are not a part of this scene. I doubt anyone who has actually ever paid for a font collection would put it up in a bit torrent scheme, more likely they illegally copied it in the first place. Another consideration is, would you actually want to trust the integrity of a font gathered in this manner? You get what you pay for?</p>
    html_clean: |-
