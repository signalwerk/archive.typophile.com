    html: <p>Already disccussed <a class="freelinking external" href="http://typophile.com/node/93971" rel="nofollow">here</a>. Officially, the new <a class="freelinking external" href="http://www.underconsideration.com/brandnew/archives/the_brooklyn_nets_i_call_technical_foul.php" rel="nofollow">Brooklyn Nets logo (including "BROOKLYN" lettering) has been designed by Jay-Z</a> himself and should be considered as a custom job. I first thought about <a class="freelinking external" href="http://www.myfonts.com/fonts/fontboutique/noga/" rel="nofollow">Noga</a> but, after having a closer look to the rest of the identity, <a class="freelinking external" href="http://www.nba.com/nets/" rel="nofollow">Nets' website</a> and considering the love affair between Akzidenz-Grostesk and NYC, I guess a slightly manipulated <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/light-condensed/" rel="nofollow">Akzidenz-Grotesk Condensed Light</a> (manually emboldened and rounded by adding an outline stroke) could do the job quite well.</p>
    html_clean: <p>Already disccussed <a class="freelinking external link-lost" href="http://typophile.com/node/93971" rel="nofollow">here</a>. Officially, the new <a class="freelinking external link-external" href="http://www.underconsideration.com/brandnew/archives/the_brooklyn_nets_i_call_technical_foul.php" rel="nofollow">Brooklyn Nets logo (including "BROOKLYN" lettering) has been designed by Jay-Z</a> himself and should be considered as a custom job. I first thought about <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/fontboutique/noga/" rel="nofollow">Noga</a> but, after having a closer look to the rest of the identity, <a class="freelinking external link-external" href="http://www.nba.com/nets/" rel="nofollow">Nets' website</a> and considering the love affair between Akzidenz-Grostesk and NYC, I guess a slightly manipulated <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/light-condensed/" rel="nofollow">Akzidenz-Grotesk Condensed Light</a> (manually emboldened and rounded by adding an outline stroke) could do the job quite well.</p>
