    html: <p>Already disccussed <a href="http://typophile.com/node/93971" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>. Officially, the new <a href="http://www.underconsideration.com/brandnew/archives/the_brooklyn_nets_i_call_technical_foul.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Brooklyn Nets logo (including "BROOKLYN" lettering) has been designed by Jay-Z</a> himself and should be considered as a custom job. I first thought about <a href="http://www.myfonts.com/fonts/fontboutique/noga/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Noga</a> but, after having a closer look to the rest of the identity, <a href="http://www.nba.com/nets/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nets' website</a> and considering the love affair between Akzidenz-Grostesk and NYC, I guess a slightly manipulated <a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-bq/light-condensed/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Akzidenz-Grotesk Condensed Light</a> (manually emboldened and rounded by adding an outline stroke) could do the job quite well.</p>
