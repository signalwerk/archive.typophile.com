    html: |-
      <p>Jan, I greatly appreciate you taking the time to write all this help.<br>
      My project wasn't to re-make anything DIN 1451 has, it was to extend and modernize it, hence I didn't do üÜ/ß (even if I could perhaps do a lowercase eszett).</p>
      <p>Frankly, in my unknowing pursuit of making something acceptable for personal use, I just went after Latin extended-A and the parts of Latin-1 Supplement I had time for.<br>
      (these exact lists<br>
      <a href="http://www.decodeunicode.org/en/latin_extended-a" title="http://www.decodeunicode.org/en/latin_extended-a">http://www.decodeunicode.org/en/latin_extended-a</a><br>
      <a href="http://www.decodeunicode.org/en/latin-1_supplement" title="http://www.decodeunicode.org/en/latin-1_supplement">http://www.decodeunicode.org/en/latin-1_supplement</a><br>
      )</p>
      <p>Explaining both Ŧ/ŧ and Ű/ű</p>
      <p>Knowing quite little about languages that actually use most of these accents and how they use them I generally just went with what fontlab gave me and tried to align it to the optical midpoint, fix anything I found aesthetically unpleasing and hint it.</p>
      <p>If I find the time and/or motivation for it I'll fix these problems now, but in a few months it'll almost guaranteed to be fixed.</p>
