    <p>I did intend to post here before it was finished asking for comments and alike, but now it's done already.<br>
    <a class="freelinking external" href="http://www.behance.net/gallery/Din-1451-modernization/7182369" rel="nofollow">http://www.behance.net/gallery/Din-1451-modernization/7182369</a></p>
    <p>For learning fontlab studio I took my favourite font DIN 1451 and added some ligatures. When the course entitled "Project work" came around I had already set my mind to either doing my own complete font, or modernizing DIN as far as time would allow me to. The course gave me 100 hours, but I likely put in closer to twice that.</p>
