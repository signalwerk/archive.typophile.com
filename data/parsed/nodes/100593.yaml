      <p>Typophile forums beeing somewhat unintuitive, I wanted to save-mid writing and ended up posting that.</p>
      <p>What I actually did was<br>
      Adding glyphs to make it support Unicode Basic latin, latin-1 supplement &amp; Latin Extended-A<br>
      Added and coded 13 ligatures, alternate ligatures (and made two stylistic alternate of ligatures)<br>
      Added a few (poorly implemented) characters and glyphs, alpha, omega, florin and a few others.<br>
      Added stylistic alternates (rounded letters with dieresis and i dots / dashed 0 and unimplemented alternate ligatures)<br>
      Added a few kerning classes &amp; exceptions.</p>
      <p>Both myself and my teacher/handler enjoyed this project.<br>
      I'll gladly take comments, critique or whatever you'd like to say.</p>
      <p>I'd also like to point out that this was my first real typographic work / time using fontlab and that I was 17 when I made this.</p>
