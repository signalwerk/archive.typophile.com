      <p>I can see few problems in diacritics, that you should solve before trying to do anything more with it:</p>
      <p>- Polish ogonek is not a some addon or accent like acute or slash, it is a intergral part of a letter. So in most cases it's smoothly connected to the letter. See polish diacritics at bottom.<br>
      - Caron should be in optical middle of the letter. See diacritics.eu at bottom.<br>
      - Caron with /t, /d, /l (ť, ď, ľ) should be more closer to the letter and tighter.<br>
      - Ring over letter like Ů should be much more stronger.<br>
      - Circumflex above h should be above the stem in the middle. See ilovetypography.com at bottom.<br>
      - I think breve is too wide.<br>
      - Double crossed t? (9th line at the end)<br>
      - tcedilla should be tcommaacent<br>
      - udieresis is missing (or it isn't on behance) uhungarumlaut is only for hungarian language<br>
      - commaaccent diacritics is missing - letters like R, N, G, T, r, n, g, t</p>
      <p>Links to study:<br>
      <a href="http://www.twardoch.com/download/polishhowto/index.html" title="http://www.twardoch.com/download/polishhowto/index.html">http://www.twardoch.com/download/polishhowto/index.html</a><br>
      <a href="http://www.diacritics.eu/en/" title="http://www.diacritics.eu/en/">http://www.diacritics.eu/en/</a><br>
      <a href="http://ilovetypography.com/2009/01/24/on-diacritics/" title="http://ilovetypography.com/2009/01/24/on-diacritics/">http://ilovetypography.com/2009/01/24/on-diacritics/</a><br>
      <a href="http://diacritics.typo.cz/" title="http://diacritics.typo.cz/">http://diacritics.typo.cz/</a></p>
      <p>Feel free to ask any question.<br>
      Jan</p>
