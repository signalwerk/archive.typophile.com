    <p>A friend of mine is getting tatted up. She wants to get a certain word in a script font. I suggested a few, she came back with </p>
    <p>Freebooter - <a href="http://www.dafont.com/freebooter-script.font" title="http://www.dafont.com/freebooter-script.font">http://www.dafont.com/freebooter-script.font</a></p>
    <p>I want to suggest to her a more professional version of this. This feels pretty cheap.</p>
    <p>Any suggestions?</p>
