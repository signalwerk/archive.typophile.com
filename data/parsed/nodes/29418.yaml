  html: |-
    <p>From a paperback, apparently (from the punctuation) typeset in England but published here in the 1960s...the italics and oldstyle figures look like Bembo, but the roman looks much funkier and if digitized would be a wonderful alternative to the more formal Monotype Bembo. Note the slanted hyphens and many other kinks and oddities. Has this or something very like it been digitized?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/olderBembo_6477.gif"></div><p></p>
