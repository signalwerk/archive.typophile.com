    html: |-
      <p>Thanks Carl, I did try out my Monotype digitized versions, which unfortunately are cleaner and lighter than my metal sample above, and thus very close to Centaur and Adobe Jenson. If Monotype were smart, considering the market interest in funky Renaissance faces, they would meet the Adobe competition by creating a unified P/F family, with easy keyboard link to the italic and, of course, with oldstyle figures loaded. Right now, all desirable options require manual switching: bor-ring! </p>
      <p>It's so interesting what you say about mimicking ink squash. Fonts that address this period really should be a shade heavier and less delicate...the best entrant right now is Dupré's funky, robust Zingha, with that fabulous lower case a!</p>
