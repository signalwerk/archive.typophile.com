    html: |-
      <p>John,</p>
      <p>If it's of interest, Poliphilus/Blado (they're meant as companions even with different names) were designed to mimic ink squash, so they do have this irregularity built into them, kind of an "antique" finish. They're also much less delicate than the original Bembo digitization, so they're very well suited to offset printing. A possible benefit is that Poliphilus is probably more economical than Bembo. The family is small, but at this point, unique.</p>
    html_clean: |-
