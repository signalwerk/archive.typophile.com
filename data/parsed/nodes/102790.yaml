    votes: null
    html: <p>It is the abbreviation of "videlicet", which means roughly "namely"; and the final glyph is tironian shorthand for the final "et", as an ending, not meaning "and" here. Some of these shorthnds were regularly used in print as long as 16th or even 17th century.</p>
