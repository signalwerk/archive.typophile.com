    html: |-
      <p>The particulars of how a Tyronian et looked depending on how a particular scribe -- and later, typefounder -- decided to render it. There is no one correct form. Long ago, I once spent an entire afternoon finding samples to show a client, who felt the one we used was somehow "wrong" (I used one with a descender).</p>
      <p>See <a href="http://en.wikipedia.org/wiki/Tironian_et" title="http://en.wikipedia.org/wiki/Tironian_et">http://en.wikipedia.org/wiki/Tironian_et</a>  </p>
      <p>As for using it in a philosophical journal in the context you suggest, yes, it would look weird. Not to mention causing the typesetter trouble...</p>
