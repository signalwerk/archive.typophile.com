  html: |-
    <p>Dear experts,</p>
    <p>can please anyone tell whether the form of tironian "et" in the image below is the correct one that had been used to write "viz." before people started to substitute "z" for it? And if so, do you think using this archaic form would be a good idea (in a bit old-fashioned philosophical journal)? Or do you think it would just look weird?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/viz_6068.gif"></div><p></p>
    <p>Thanks in advance,</p>
    <p>Nolmendil</p>
  html_clean: |-
