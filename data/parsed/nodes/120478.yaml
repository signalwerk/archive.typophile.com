      <p>'St. Georges': can't find a match, custom maybe? Closest I have are <a class="freelinking external" href="http://www.myfonts.com/search/novel+sans" rel="nofollow">Novel Sans</a> and <a class="freelinking external" href="http://www.exljbris.com/fontinsans.html" rel="nofollow">Fontin Sans</a>; BTW, /g looks pretty out of scope regarding the rest of the lettering (thinner) so could really be a custom(ization);<br>
      ('WEYBRIDGE': <a class="freelinking external" href="http://www.myfonts.com/search/times" rel="nofollow">Times</a>)<br>
      Note this logo is not the <a href="/wiki/https%3A/%252Fpbs.twimg.com/profile_images/2222983317/St-Georges-logo_rgb.jpg" class="freelinking" rel="nofollow">current version one</a> and could be found as vector <a class="freelinking external" href="http://www.stgeorgesweybridge.com/uploads/publication/file/2/Review_Easter_2014.pdf" rel="nofollow">here</a> (bottom of page 12) which I can positively identify as aforementioned Fontin Sans.</p>
