    html: |-
      <p>To get it work, on the Mac side you need to select the base font of a style-linked group, and then click on the Bold and Italic buttons. For example, to get the Semibold you'll need to select the Light, and then press the Bold button. This will get you the Semibold working cross-platform.</p>
      <p>For Myriad Pro, <a class="freelinking external" href="http://store1.adobe.com/type/browser/html/readmes/MyriadProReadMe.html#A2" rel="nofollow">refer to this page</a> to know which font is the base of each 4-font subfamily.</p>
