  html: |-
    <p>So here's the situation. I have a client who needs the Keynote (Mac) files I've created converted to PowerPoint (PC). Exporting to PowerPoint and opening them I notice only most of the fonts are still as they should be. So I figure I can change those few, no big deal. (I mean who really expects Keynote and PowerPoint to play nicely?) But, the biggest problem and almost total failure happens when I send them these PowerPoint files. If you look at this image you'll see that almost none of the fonts remain. I'm in touch with someone at Adobe and they tell me it is a problem with out the separate OS map fonts. So, I'm wondering if any of you have had the problem and if there is a slicker way to solve it. And I have to send them PowerPoint so maybe we're out of luck?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Font-Test_5455.png"></div><p></p>
