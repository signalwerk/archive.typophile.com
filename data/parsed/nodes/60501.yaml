    html: <p>Errr, I don't use Windows, so I tend to forget its oddities. In any case, keep in mind that this works if you create a PPT file on the Mac and open it on Windows. But you're getting the PPT files on Mac by converting from Keynote. So it's likely that a few (many) things will fail.</p>
