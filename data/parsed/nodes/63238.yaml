    html: |-
      <p>I think it looks quite interesting, although its looks a bit more like a 'techno' font than a fraktur. A, O and T do have real fraktur characteristics, the rest is more hybrid. This is fine, if that's what your going for. I think it is also hard because fraktur typefaces are hardly ever set in all caps (except perhaps for one or two words) and for good reason: it is almost illegible in all caps! So I guess if you want to make this work as caps only you will have to go for this kind of hybrid.</p>
      <p>I can't answer all your specific question (simply cause I don't know) but I'll give my voice on some.</p>
      <p>1. I think this is pretty good, it's got enough light in it to keep it legible.<br>
      3. I think this looks nice, and if your going for a hybrid, this would fit.</p>
      <p>Good luck with it and keep us posted on your progress</p>
      <p>Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
