    <p></p><div class="imageWrap"><img src="http://typophile.com/files/broken-english_specimen_6550.jpg"></div><p></p>
    <p>OK... don't hold back. This is still very much in the conceptual stage. I want to get feedback and assistance before I do the fine tuning.</p>
    <p>I also have a few questions.</p>
    <p>1. How is the ratio of height/width?</p>
    <p>2. What degree of angle should I use for all the diagonals? Does it look weird to mix it up a little?</p>
    <p>3. Do the ambicase styles of "N" and "Y" work?</p>
    <p>4. Should I slightly angle vertical and horizontal lines to compensate for optical distortions?</p>
    <p>Thanks for taking a look!</p>
    <p>_eric</p>
    <p>** EDITED Oct.19.2009: changed title from "Blackletter Stencil" **</p>
