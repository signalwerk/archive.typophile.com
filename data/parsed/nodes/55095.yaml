  html: |-
    <p>I am very proud to announce the release of my display typeface Fiasco.<br>
    Fiasco is a psychedelic constructivist face. Extremely influenced by the new rave trend. It is a reflex of it's excesses. Way too many elements, bright  neon colors, and that not-knowing-when-to-stop sort of behavior. Excess would be the word that best describes it. Acid House aesthetic remixed by the nu school djs. Fiasco dances to Justice, Simian, to nu rave, nu disco, electrorock and baltmore. Born in the 80's, grew in the 90's and appeared a couple years ago. Smileys, gas masks, raves, lollypops, it's all back. Neon Flashbacks.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fiasco1_5600.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fiasco2_3936.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fiasco3_3690.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fiasco4_4168.jpg"></div><p></p>
    <p>Fiasco is available from YouWorkForThem:<br>
    <a href="http://www.youworkforthem.com/product.php?sku=T0254" title="http://www.youworkforthem.com/product.php?sku=T0254">http://www.youworkforthem.com/product.php?sku=T0254</a><br>
    Best<br>
    Frederico</p>
