      <p>A few thoughts from my dreams last night. (Yes, after I work on something intensely for a few days it haunts me in my sleep.) I hope you all don’t mind helping me.</p>
      <p>- I’d like to remove overlap. If you see books that are overlapped, please point them out to me. (I’ll look as well.) We’ll vote on where they belong for real.<br>
      - I do want to add Book Design and Calligraphy/Lettering is a good idea too.<br>
      - If you see a book in one section and feel it belongs elsewhere please tell me.<br>
      - Again, don’t be afraid to point out errors. For instance, I realize that all of the books attached to Robin Kinross have the wrong publisher. (This will be fixed immediately.) </p>
      <p>Jason, you are a model citizen. Everyone please note how Jason sent me information to be added and follow in his noble footsteps.</p>
      <ol>Designing Type<br>
      by Karen Cheng<br>
      Publisher: Yale University Press; (April 3, 2006)<br>
      Paperback: 224 pages<br>
      ISBN: 0300111509<br>
      Price: $29.95 (list price)<br>
      <a href="http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509/sr=1-1/qid=1165538233/ref=pd_bbs_sr_1/002-2314699-9678433?ie=UTF8&amp;s=books">http://www.amazon.com/Designing-Type-Karen-Cheng/dp/0300111509/sr=1-1/qid=1165538233/ref=pd_bbs_sr_1/002-2314699-9678433?ie=UTF8&amp;s=books</a><p></p>
      <p>Jason Dewinetz: While I’ve read a few comments both positive &amp; negative on this book, as a reader with no formal training in type design I’ve found the book very useful towards a better understanding of how digital glyphs are put together, based one on another, etc. A well produced &amp; finely illustrated publication.</p></ol>
      <p>I realize there have been threads dedicated to horror of Amazon. Please consider that in this instance it is serving a very real and good purpose. When you purchase from Amazon you are doing a small part to support Typophile. So, consider if you are going to suggest a book please check to see if it is available on Amazon first. Then, if it isn’t please do give the link for the other site. </p>
      <p>This could be a great resource for everyone looking for books. I hope you are all as enthusiastic about it and ready to participate! Go team!</p>
