    <p>For Immediate Release:<br>
    Alameda, CA- February 12th, 2013</p>
    <p>Delve Fonts presents Rieven™ Roman, by Steven Skaggs.<br>
    Available now at: <a class="freelinking external" href="http://www.delvefonts.com/rieven_roman.html" rel="nofollow">http://www.delvefonts.com/rieven_roman.html</a></p>
    <p>In order to address those instances where the more contemporary letterforms are preferred, designer Steven Skaggs has expanded the Rieven family by creating a Roman version that can be used hand-in-hand with its predecessor, Rieven Uncial.</p>
    <p>Uncial-specific forms were replaced by Skaggs with more conventional venetian forms and the lowercase of the accompanying italic is almost entirely re-drawn. With these features, Rieven Roman is ideal for lengthier passages of text in magazines, books, and websites. It can be used in tandem with Rieven Uncial for a consistent style, and optimal readability.</p>
    <p>Included in the Rieven Roman package is Rieven Ornaments, a font comprised of over 180 useful symbols, circled numbers, arrows, and decorative ornaments.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rieven_roman_specimen_3774.jpg"></div><p></p>
    <p>A type specimen (PDF) for Rieven Roman can be downloaded at: <a class="freelinking external" href="http://www.delvefonts.com/pdf/specimen_rieven_roman.pdf" rel="nofollow">http://www.delvefonts.com/pdf/specimen_rieven_roman.pdf</a></p>
    <p>Steven Skaggs studied calligraphy and typography under Hermann Zapf. His calligraphic artworks are in the collections of the Klingspor Museum, Offenbach Germany, the Sackner Archive of Visual and Concrete Poetry in Miami, and the Akademie der Künst, Berlin. He has been active giving workshops and teaching throughout the United States as well as Canada, Italy, Switzerland and Germany. Steven Skaggs lives in Louisville, Kentucky where he is Professor of Design at the Hite Art Institute, University of Louisville.</p>
    <p>Delve Fonts is a full-service type foundry in Alameda, CA offering new, original typefaces and type design services including: Custom Type Design, Foreign Language Fonts, fonts for Games, Apps, and Mobile Devices.</p>
    <p>Sign up to receive the Delve Fonts newsletter: <a class="freelinking external" href="http://eepurl.com/ikNr" rel="nofollow">http://eepurl.com/ikNr</a></p>
    <p>Follow Delve Fonts on Twitter: <a class="freelinking external" href="http://www.twitter.com/delvew" rel="nofollow">http://www.twitter.com/delvew</a></p>
    <p>Like Delve Fonts on Facebook: <a class="freelinking external" href="http://www.facebook.com/delvefonts" rel="nofollow">http://www.facebook.com/delvefonts</a></p>
    <p>Rieven Roman is a trademark of Delve Fonts. All rights reserved.</p>
    <p>###</p>
