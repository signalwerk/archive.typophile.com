  html: <p>Hello. <br> <br>Is there anyone who has information about Normunds Hartmanis, Lithuanian typograph? <br> <br>I have just bought a book from the year 1957 about the swedish iron company LKAB. The typeface used in the headlines and on the cover of the book is made by Normunds Hartmanis.  <br>(I dont have the name of the typeface.) <br> <br>Is he a wellknown graphic designer? <br>Are there any books about his work? <br>Would it be possible to find examples of typefaces that he constructed? <br>  <br>Best regards <br>Magdalena, Sweden</p>
