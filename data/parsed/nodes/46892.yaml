    html: <p>Thank you. That's some gorgeous lettering. There really is something inspiring about carved letters, especially with the flowing calligraphic letterforms... You know that they were meticulously chiseled of course, but It feels like a special brush just cut through the stone in easy, graceful strokes.</p>
