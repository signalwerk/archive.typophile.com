      <p>I can think of a bunch of cities named after typefaces, that in turn have sports teams (Alemannia Aachen, that sort of thing), but I suspect that's cheating. </p>
      <p>So I'm digging through lists, and the one I've found so far is a team from Macau named after Stephenson Blake's Windsor: <a href="http://en.wikipedia.org/wiki/Windsor_Arch_Ka_I" title="http://en.wikipedia.org/wiki/Windsor_Arch_Ka_I">http://en.wikipedia.org/wiki/Windsor_Arch_Ka_I</a></p>
