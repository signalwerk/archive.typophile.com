  html: <p> I was just wondering what some people thought were the best serif faces ever, and/or the trendiest serif face ever? This is partly for a project I'm working on at school where I have to design a specimen book for the fonts of my choice. The concept for the book is "the fashionable serif" and all of the book will be based on fashion. I'm going to creat t-shirts with the specimen on the front and the name across the back like a baseball jersey. Anyways, any thoughts on the best serifs would be great. <br>I'm particularly fond of Goudy. </p>
