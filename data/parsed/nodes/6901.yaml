    html: "<p> Well, overall. <br>But the \"U\" is one good example. For one thing, that's the way the Romans would have made it. But Perpetua isn't just some anachronistic affectation: it's timeless. Well, at least timeless in relation to Western culture. <br> <br>Perpetua is austere, without being oppressive. It has a serious grace that doesn't need to prove itself. In comparison, Adobe Trajan is a Roman legionnaire who's been spending way too much time in Bay Area Starbuckses. <br> <br>hhp </p>"
