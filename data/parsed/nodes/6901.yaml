    html: <p> My vote for favorite serif face would have to go to Jenson (designed by Nicolas Jenson) and its various progeny. <br> <br>My favorite adaptation of Jenson is Cloister Old Style (Morris Benton), but I have yet to find a really good digitization of this typeface family. Rolling Stone Magazine uses a beautiful version that they commissioned for their body face. <br> <br>I also like Parkinson (Jim Parkinson), also based on Jenson. <br> <br>Golden Type (William Morris), Centaur &amp; Arrighi (Bruce Rogers, Frederic Warde) and Adobe Jenson (Robert Slimbach) are also worthy interpretations of the Jenson design forms. <br> <br>I'm working on my own design, Architrave, which is partly (and loosely) based on the Jenson model, and is currently showing in the Serif Critique forum. <br> <br>David </p>
    html_clean: <p> My vote for favorite serif face would have to go to Jenson (designed by Nicolas Jenson) and its various progeny. <br> <br>My favorite adaptation of Jenson is Cloister Old Style (Morris Benton), but I have yet to find a really good digitization of this typeface family. Rolling Stone Magazine uses a beautiful version that they commissioned for their body face. <br> <br>I also like Parkinson (Jim Parkinson), also based on Jenson. <br> <br>Golden Type (William Morris), Centaur &amp; Arrighi (Bruce Rogers, Frederic Warde) and Adobe Jenson (Robert Slimbach) are also worthy interpretations of the Jenson design forms. <br> <br>I'm working on my own design, Architrave, which is partly (and loosely) based on the Jenson model, and is currently showing in the Serif Critique forum. <br> <br>David </p>
