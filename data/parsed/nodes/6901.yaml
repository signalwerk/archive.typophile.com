    html: "<p> About the Perpetua U: I'm pretty sure there was an alternate done for the metal version (one with a foot, one not). Two Rs were done also I think. So I guess Gill/Morison didn't think that form of U was essential to Perpetua. <br> <br>As for other great titling faces to be used instead of Trajan, how about: Octavian (Kindersley knows from monumental), Dante Titling, or Requiem. </p>"
