    html: <p>Haha Sii :) I personally like and promote 'release early, release often'; my work to fund ttfautohint was driven by me wanting to remove a real and practical hinderance to doing so, since for as long as hinting is required for web fonts to be broadly useful, and hinting remains an expensive and hand-made piece of post production, then this way of designing isn't all that practical unless you have deep pockets - or like to do hinting ;) However, plenty of people have been complaining about the first publicly available version of Roboto, and I think its important to be aware of this in the context of choosing it as a house style type.</p>
