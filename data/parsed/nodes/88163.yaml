    <p>Dear Typophile.</p>
    <p>I need a typeface that is free to install on many computers, so everybody in the office can use it. I see that Google's Roboto is under "the apache license" - <a href="http://www.fontsquirrel.com/fonts/roboto#eula" title="http://www.fontsquirrel.com/fonts/roboto#eula">http://www.fontsquirrel.com/fonts/roboto#eula</a>.</p>
    <p>I'm unsure if that means that they're allowed to use Roboto as their main typeface.</p>
    <p>Do you know?</p>
    <p>- Chester</p>
