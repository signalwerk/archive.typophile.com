    html: |-
      <p>The only serious restriction in the Apache license - and I don't think it would apply here - is the name "Roboto" If you want to make a changed version and market it, the name needs to be different from Roboto.</p>
      <p>Other than that, you can do anything you like. Unfortunately, open-source licenses aren't any shorter or less boring than proprietary licenses but I'd give it a quick once-over just in case.</p>
