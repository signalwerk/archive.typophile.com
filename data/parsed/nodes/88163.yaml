      <p>Richard Fink, that's incorrect. The SIL OFL has the OPTION to restrict the use of 'upstream' names, and while it is almost always used, it is optional. In my personal opinion Google is likely to use that option if it asserts a trademark on the name. Perhaps it does, I don't know. </p>
      <p>Chester, yes they can use Roboto as their main typeface; however, since the font is under active development, you'll want to make sure they stay up to date with the latest and greatest versions (and keep in mind that this may reflow their documents. I also note that it seems to me that no official release has been made, only an early copy bundled with a programmers toolkit for development/prototyping by programmers - and that version has been spread all over the place, like to FontSquirrel.</p>
