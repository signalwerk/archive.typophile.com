    date_raw: 6 Jul 2008 — 10:18am
    votes: null
    html: |-
      <p>Thanks for the comments!</p>
      <p>I’m going back and reworking the diagonals/joins now. I had drawn them with the same weight as the verticals—way too heavy! The narrow joins are a symptom of the bold being based on the light, which was too narrow in places, so now I’m redrawing those letters in both weights. </p>
      <p>I think I’m going to dump the idea of old-style figures. I tried drawing a narrower set but wasn’t especially happy with the result, and I’m not sure that the proportions of gothic designs lend themselves to OSFs. I’ll look at the OSFs Erik. S did for Akzidenz and think about ways to make them work in the American style</p>
      <p>Eben, the extreme jump in weight was originally intended to allow me to interpolate the in-between weights (and drawing heavy letters was a fun shift from the light and my Fry’s revival). But now I think that I’ll be much better served by drawing everything out the slow(er) way—after all, this is a learning experience! </p>
      <p>Right now my plan is to finish this round of revisions and then do a rough pass on a regular weight so that I can better establish character and sport potential problems across all three weights. Up till now my process revolved around just getting it done, and I should have realized what a stupid method of drawing a font that would be.</p>
