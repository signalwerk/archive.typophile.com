    html: |-
      <p>There is a problem with the diagonals generally. They are usually about the cross section of the stems or less. Many of these here are fatter, which gives very uneven color--hence Muzzer's um extreme reaction. </p>
      <p>The joins are also heavy, as David noted. In general, with bolder weights, these require more tapering to look good. Compare a number of fonts you admire on both the issue of diagonals and joins. And the main thing, IMHO, is to always look for issues of even color. </p>
      <p>On your OS numbers, the 345 look way wider than the others. Also the cross bar on the 4 is I believe at or above the base line usually in OS numbers. </p>
      <p>I think the ear of the g is a bit long in the light--which doesn't have the color problems of the bold. But the g in the bold goes way overboard, I think. There are often 'g's with ears over the x-height, but this one looks out of place.</p>
