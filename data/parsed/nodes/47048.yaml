    html: |-
      <p>&gt;The narrow joins are a symptom of the bold being based on the light</p>
      <p>Ah, yes. If you overlay the light and bold outlines of the M and W and other diagonal letters in several fonts,  you will see how they have to widen the letters to get the joins to work. Otherwise you get the clots, as you have discovered. In the branches in the m and n etc the joins generally need more taper. Studying the clever stuff that great fonts do with different weights--and having them open to look at--I think you will find very helpful as you are doing the bold.</p>
