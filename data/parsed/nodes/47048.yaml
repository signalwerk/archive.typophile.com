    html: |-
      <p>James I don't think it's stupid. I just wanted to check about your intention. Keep in mind you may want to use these to generate a middle weight and then tweak it too. The main thing is that the glyphs have the same # of points and that those points relate. Or, you could do it all by hand I guess... It depends on what you want, when you want it &amp; so on. I think it might be smart to do it that way because if you start making more &amp; more fonts in the future you may find learning this approach* is helpful. You can always tweak glyphs afterwards!</p>
      <p>*I certainly plan to learn it! ;-)</p>
      <p>What I think I would do in your shoes though is to make sure that one weight was quite a bit more done before you </p>
      <p>a) make too many gyphs with acenets etc.<br>
      b) worry about weights too much</p>
      <p>In some ways it seems to me that generating the middle weight and then "perfecting" it might be the smartest 1st step from here. For one thing it is the middle or book weight that is likely to see the most use! </p>
      <p>I have read about design process' where they just built the far examples and telegraphed the middle design in from the two very far points - which sounds cool. But from a learning point of view sounds too tough. Also you might be like JFP and want you light &amp; heavy to move in different stylistic directions that preclude generating a middle from two extremes. Look at his Costa &amp; Anisette to see what I mean. </p>
      <p>I still haven't had time to sit down &amp; really do this properly. I am sorry about that!</p>
