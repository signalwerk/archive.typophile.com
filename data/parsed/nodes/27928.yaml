      <p>It’s funny that Linotype changed the name of ’Linotext’ to ’Mariage’. I wonder when that name change was done. Any idea Dan?</p>
      <p>As their writep mentions, it has been known by a ’plethora of names’, but <a href="http://www.myfonts.com/fonts/bitstream/wedding-text/">’Wedding Text’</a> is probably the best known, and is the original name of the Morris Fuller Benton typeface from 1901.</p>
      <p>- Mike Yanega</p>
