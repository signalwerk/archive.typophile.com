    html: |-
      <p>Linotext’s name has NOT been changed. We have two typefaces based off of Wedding Text, Mariage and Linotext.</p>
      <p>Here is the link to Linotext:<br>
      <a href="http://www.linotype.com/948/linotext-family.html" title="http://www.linotype.com/948/linotext-family.html">http://www.linotype.com/948/linotext-family.html</a></p>
      <p>Linotext is a slightly lighter font than Mariage, which feels like a slightly darker digitization to me. I recommeded Mariage in this case only because its slightly greater dense-ness seems closer to the Syndey Morning Herald’s nameplate than Linotext does.</p>
    html_clean: |-
