  html: <p>We're all acquainted with <a href="http://www.underware.nl/site2/index.php3" target="_blank">Underware</a>, right? Well, just like their typefaces, their <a href="http://www.typeworkshop.com/" target="_blank">workshops</a> are anything but <a href="http://www.typeworkshop.com/index.php?id1=Hannover_06_2004&amp;id2=results&amp;id3=&amp;id4=&amp;id5=&amp;idpic=07#pictloader" target="_blank">run-of-the-mill</a> and <a href="http://www.typeworkshop.com/index.php?id1=Rovaniemi_12_2003&amp;id2=daily&amp;id3=result1" target="_blank">ordinary</a>.  <br> <br>For anyone serious about type design, this could be just the jumpstart you need. Don't miss out on this opportunity. <br> <br>Thanks in part to a grant from the National Endowment for the Arts, SOTA brings the innovative Dutch design group Underware to teach an intensive week-long workshop at the California College of the Arts (CCA) July 12-17. CCA students and young professionals will participate, and one spot is available in the pro section. <br> <br>To sign up for this workshop or get on the waiting list email <a href="mailto:info@typesociety.org">info@typesociety.org</a>.</p>
