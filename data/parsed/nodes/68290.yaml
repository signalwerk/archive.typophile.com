    <p>Good Morning Wise People,</p>
    <p>Who can name this font?  It's used in the logo (and tagline) for a website that we're in the process of relaunching after a few years of relative dormancy.  I've perused various font sites, and it seems the records for the original site design have gone missing.  So I come to you.</p>
    <p><a href="http://www.therevealer.org/" title="http://www.therevealer.org/">http://www.therevealer.org/</a></p>
    <p>So many thanks, Ann</p>
