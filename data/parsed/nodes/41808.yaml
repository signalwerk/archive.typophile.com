    html: "<p>The problem is that nobody owns the font except the foundry. Everyone else is required to purchase a license for use. I do the same as aluminum: if it's a font I used only for that one job and don't want to use again I pass the fee (and the font) onto the client. For fonts I plan to add to my library and continue to use, I pay. It's a business expense and I budget it in. I do tend to buy them when I have a specific job in mind (which eases the pain) rather than just because I want them</p>"
