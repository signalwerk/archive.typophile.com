    <p>I am currently doing environmental graphics for a collegiate arena. The campus recently standardized all exterior building signage as Whitney semi-bold <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100026" rel="nofollow">[Hoefler &amp; Frere-Jones</a>], under the direction of a different design consultant. </p>
    <p>If that university purchased Whitney for the other design consultant to use, should my design group have access to that typeface too? Or do we need the university to purchase another  license, as we are two separate businesses?  </p>
    <p>I know this is a basic question, but one must learn these things along the way ...</p>
