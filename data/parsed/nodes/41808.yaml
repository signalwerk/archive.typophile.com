    html: |-
      <p>Should an agency/studio pass along its font licence costs to the client?</p>
      <p>Although the agency may get fonts for use on one client's job, it can subsequently use the fonts on work for other clients.</p>
      <p>Is it unprofessional to use the same fonts on work for different clients? After all, if clients pay for an unusual font, shouldn't they get some measure of exclusivity? If the typeface is in more common usage, as Gotham is, why should the client pay for something that has little exclusivity, and will probably be used by the agency on work for other clients?</p>
      <p>It seems to be a judgement call for the agency/studio, based on the re-usability of the fonts, and their cost as a proportion of the initial job expenses.</p>
      <p>Perhaps it makes more sense to budget a "new font cost" factor as a general overhead into the hourly rate -- unless one is going to restrict one's practice to fonts bundled with applications and OS's.</p>
      <p>That may seem like padding to some clients, if all they want is in fact a bundled font, but in that case they're using the wrong agency/studio.</p>
      <p>Even if you decide to make font licensing a general overhead cost, it may still be necessary to charge certain clients for exceptional font licence purchases.</p>
