      <p>Some foundries are better than others, but in the case of H&amp;FJ the transfer policy is there in black &amp; white - <a href="http://www.typography.com/home/eula.php" title="http://www.typography.com/home/eula.php">http://www.typography.com/home/eula.php</a> </p>
      <p>“5. No Transfer of Rights. You shall not sell, lease, sublicense, allow to use, or otherwise assign or transfer any of your rights, duties or obligations under this Agreement, in whole or in part, to any person or entity. Without limiting the foregoing, Typefaces licensed for use by a specific publication shall not be transferred to or used by other publications owned or managed by a common corporate parent, and/or affiliated with the specific publication to which this license has been granted, without the purchase of an additional license from H&amp;FJ.”</p>
      <p>Seems crystal clear to me, what’s there to discuss? If the terms are good enough for Obama, they should be good enough for everyone. Pay the man, ignore the EULA or shop elsewhere.</p>
