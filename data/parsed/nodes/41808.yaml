    html: |-
      <p>If I bill the client for a typeface, I transfer it to them upon completion of the job.</p>
      <p>Usually, though, If I'm getting a typeface, I want it too, so I usually just buy it and treat it as a business expense like any software. Then I can use it down the road.</p>
      <p>If I buy the font and the client also wants it for their own in-house use, then they buy their own license in addition to the one I bought.</p>
      <p>In the end, your own billing practices are irrelevant. All that matters (ethically/legally speaking) is that all concurrent users of the typeface have a license from the type foundry.</p>
