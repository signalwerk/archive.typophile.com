    html: |-
      <p>I can see Gemma's dilemma: the licensing requirements for the font seem to contrast with the client's perception that they are buying the same thing twice for only one use. This is an issue that designers deal with all the time with all sorts of digital assets: fonts, photos, illustrations, original layouts, etc.</p>
      <p>If a client requires that you use a typeface that you do not have, that may be an opportunity to have them purchase it for you (as apparently the other designer managed to do so). But no, now neither you nor the university have any claim to his font. I would say that most clients that do pay for typefaces don't fully grasp that this isn't necessarily something they get to walk away with. </p>
      <p>Whether you want to openly press the university to cover the cost or whether you eat it as just the price of doing business (and thereby distinguish yourself from the other designer) is really your call.</p>
