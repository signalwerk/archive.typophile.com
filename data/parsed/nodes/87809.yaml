    html: |-
      <p>I guess it's the latin characters included in a Chinese font.</p>
      <p>Chinese fonts do have a little tendency for using "ɑ" instead of "a". For example, the STSong shipped with MacOSX uses Garamond as its latin style, except a special single-story "ɑ".</p>
