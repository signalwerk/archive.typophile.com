      <p>I know the story. I was trying to think of some way of advancing the allegory, hence <em>The New Emperor’s New Clothes</em>. There is a double edged quality to the original tale that can make the person who invokes it a slave to it’s logic. The Emperor is foolish because he is afraid. However people often call on the tale to besmirch things they are afraid of. They express the same rash quality as the Emperor, only it’s inverted. The rush to accept things is easily exchanged for the rush to reject them.</p>
      <p>I will come back to your original comment <em>It has no artistic, aesthetic or creative merit whatsoever.</em> and link it to proof of my concept and also the subject of the article:</p>
