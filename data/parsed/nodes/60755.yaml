      <p>The Emperor’s New Clothes</p>
      <p>A story by Hans Christian Andersen. An emperor hires two tailors who promise to make him a set of remarkable new clothes that will be invisible to anyone who is either incompetent or stupid. When the emperor goes to see his new clothes, he sees nothing at all — for the tailors are swindlers and there aren’t any clothes. Afraid of being judged incompetent or stupid, the emperor pretends to be delighted with the new clothes and “wears” them in a grand parade through the town. Everyone else also pretends to see them, until a child yells out, “He hasn’t got any clothes on!”</p>
      <p>Nick Cooke</p>
