      <p>I also agree we are in some sort of golden age, perhaps our definitions differ! I wasn’t questioning your ability when I asked to see something that wasn’t <em>crap</em>, it could have been anything.</p>
      <p>I don’t think the aim of the modification is to look good, at least not in the way that your work looks good or Michael’s work looks good, and I’m sure the designer is aware of this conceit – even if the type designer did not intend it, the art director did.</p>
      <p>One definition of good is aesthetic, your own definition perhaps. Another way to define good might be appropriateness. As I said earlier I believe it is appropriate because it is uncomfortable and does not seek to pacify in the same way that some glossy magazines do. There is a deliberate tension there that has been – despite what you might think about the ease of the artworking – designed.</p>
