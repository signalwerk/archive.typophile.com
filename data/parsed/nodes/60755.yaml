      <p>Yes I have read the article. All that self-aware, ironic stuff gets right on my tits - “hey look, I’ve done something really shite, aren’t I brilliant?”</p>
      <p>But then I’m a type designer who spends hundreds of hours trying to create beauty, so it goes without saying that this goes against everything I stand for. After having spent so much time getting glyphs to look proportionally just right, then for some jumped-up **** to come along and receive heaps of praise for bastardizing the shit out of it is particularly galling for most people who design type.</p>
      <p>Besides I remember it from the first time round, which wasn’t that long ago, and it was bad then. So to my mind it’s just a lazy rehash.</p>
      <p>Andrew - have you read “The Emperor’s New Clothes”?</p>
      <p>Nick Cooke</p>
