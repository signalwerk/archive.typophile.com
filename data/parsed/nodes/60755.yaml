      <p>So you demand capital punishment for <a href="http://www.meireundmeire.de/projects/project/032c-1/event.html">Mike Meiré</a>?<br>
      The International Herald Tribune, in contrast, thought <a href="http://www.032c.de/">this work</a> was worth being awarded the ‘Best Magazine of the World’ in 2007. Bit of a stretch? This is was Meiré thinks about it:</p>
      <p>“If every magazine or every building or every brand or everybody tries to look appealing by using the same idea of being modern, it becomes interesting to go in the opposite direction, because life has different kinds of beauty to present. If people feel confused by it, it is because we are all so used to this kind of efficient, streamlined, correctness.”<br>
      “I am always interested in the concept of evolution = harmony/break/harmony …”</p>
      <p>You can read more about <a href="http://www.creativereview.co.uk/cr-blog/2007/august/the-provocative-mr-meire">The Provocative Mr Meiré</a> and <a href="http://www.creativereview.co.uk/cr-blog/2007/august/the-new-ugly">The New Ugly</a> on Creative Review.<br>
      F</p>
