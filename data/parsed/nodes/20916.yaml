      <p>Hmm, 8 point...<br>
      Look at Adobe's Cronos Pro. You might like the <a href="http://store.adobe.com/type/browser/F/CROP/F_CROP-10005300.html" rel="nofollow">Italic caption.</a></p>
      <p><a href="http://store.adobe.com/type/browser/F/HIGQ/F_HIGQ-10004300.html" rel="nofollow"> Highlander Book Italic </a>might be another possibility.</p>
      <p>You also might look at OurType's Fresco family, with a serif, and sans, an "informal" and a script. I don't know how well the script would work at 8 points, but Fresco is more compact than the faces you're using, so you might be able to go up a point with the space you'd save. Fresco Informal would work at smaller sizes, I think.</p>
      <p>I don't know how to link to individual samples on OurType's site, but go <a href="http://www.ourtype.be/home.html" rel="nofollow">here</a>, wait for the animation to finish, then select from the choices.</p>
