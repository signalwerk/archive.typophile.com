      <p>Helvetica actually has poor readability at small sizes. </p>
      <p>I think most people on this website will advise you strongly<br>
      against Comic Sans. There are much more attractive solutions for<br>
      a 'friendly' sans serif face. Look at Courier Sans (<a href="http://www.lineto.com" title="www.lineto.com">www.lineto.com</a>).<br>
      Or Helvetica Rounded. It provides quite distinct variation to 'regular'<br>
      Helvetica and is 'friendly' looking. </p>
      <p>Phil</p>
