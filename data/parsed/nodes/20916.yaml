    <p>I am working on a second edition of a phrase book and need some help finding a font.</p>
    <p>The phrase book has three columns - English, Spanish and Phonetics</p>
    <p>I will use Helvetica 9pt for the first two columns - I like it for its readability. Plus, with my book design, I need an uncluttered, very legible font, and I'm happy with Helvetica.</p>
    <p>Previously I used Comic Sans for the Phonetics column. I liked it because it was clearly VERY different from Helvetica. Since my phonetics is a language of my own creation, I like the very informal feeling of Comic Sans. However, in this edition, I want to decrease the font size to 8. At 8pt, the distinction between Comic Sans Regular and Comic Sans Bold largely disappears. (The distinction between bold and regular text is VERY important since it tells the user which syllable to stress.)</p>
    <p>I've been unable to find a good alternative font with the same characteristics. By the way, I'd love to find a font which also offers italic and perhaps several weights for greater flexibility.</p>
    <p>Even though standard serif fonts make a strong contrast with Helvetica, I don't like them for this application. They are too serious looking for my purposes.</p>
    <p>Thanks for any ideas that you can give me.</p>
    <p>Kathy</p>
