      <p>Chajm, if you are reviewing siddurim, you might be interested in looking at the new Reform siddur in the US: Mishkan Tefila. Whatever you think of its philosophy, graphically it is innovative, and I think quite well done. </p>
      <p>Its basic idea is to put the traditional prayers in both Hebrew and English on the right, and related modern prayers and poems on the left. The translations of the traditional prayers are more literal--and better--than the old Reform or Conservative siddurim. They also use plenty of white space and two colors of text to help orient the reader. <a class="freelinking external" href="http://www.nytimes.com/2007/09/03/us/03prayerbook.html?pagewanted=2&amp;sq=mishkan%20t&amp;st=cse%27fila%20book%20review&amp;scp=1" rel="nofollow">This review in the NY Times</a> has a link to a page spread, but it is small and one color so it doesn't really give you a good idea.</p>
      <p>The concept is that each congregation can mix the traditional and modern as they like.</p>
      <p>I'd be interested in what you all think of it as a piece of typography.</p>
