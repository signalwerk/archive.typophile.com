      <p>In the new Koren Siddur we tried to follow this system (actually this was done in Koren Siddurim from the beginning). You will notice that source references on the Hebrew and English sides hang from the top and on the Hebrew side, instructions that are inline or on the right of the text also hang from the top of the letter.</p>
