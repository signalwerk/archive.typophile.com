      <p>In that case, up and down also works.</p>
      <p>But if the reader prays in one languages and uses the other simply to help understanding, placing Hebrew on the right of English is logically preferred. Here, Mr. Prais seems incorrect. The burden of proof is upon him, and you.</p>
