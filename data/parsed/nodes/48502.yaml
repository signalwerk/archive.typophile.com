      <p>I forgot what I said before. But on the left should be English, and on the right should be Hebrew.</p>
      <p>Why?</p>
      <p>Here, less eye movement is better.</p>
      <p>The Hebrew reader moves his or her eye from the right to the left.<br>
      The English reader moves his or her eye from the left to the right.</p>
      <p>If the Hebrew reader starts on the far right, he or she can easily glance ahead for a translation of a word or phrase.<br>
      Similarly, if the Hebrew reader starts on the far left, he or she can easily glance ahead for a translation of a word or phrase.</p>
      <p>So, there is less eye movement.</p>
      <p>But if the Hebrew reader starts in the middle, he or she can only glance back for a translation of a word or phrase, and then again all the way over to continue.<br>
      Similarly, if the English reader starts in the middle, he or she can only glance back for a translation of a word or phrase, and then again all the way over to continue.</p>
      <p>So, there is more eye movement.</p>
