    <p>A challenge to English/Hebrew typesetters and Hebrew type designers is how to successfully mix and match Hebrew and English either side-by-side (as in a translated work or a technical manual), or in a single line, or top and bottom paragraphs (as in a poster or flyer).</p>
    <p>Rarely has this been done well. Often, we attempt to identify two different designs that work together well, as Boruch Gorkin did in his rendition of Ariel, which he created for Monotype and was later licensed to MicroSoft and Apple.</p>
    <p>Another approach is to design the Hebrew letter forms in accord with the design attributes of the English letter forms. This approach rarely works successfully, because the dominant strokes of Hebrew letter forms are horizontal, and the dominant strokes of English letter forms are vertical.</p>
    <p>I did this with the popular "Broadway Nights" design, creating a similar "freilich" (joyful) design, called "Purim Party". I knew it had become popular, and widely accepted, because it was "stolen" by others, and even ended up as lettering on the side of a Jewish school building. I think that this is a sign of success.</p>
