      <p>Mike,</p>
      <p>You raised an important point regarding brevity. It isn't that it's "in Hebrew, brevity is an valued quality". Rather, less words are required to express the same idea in Hrbrew than English This simply is due to the unique quality of Hebrew. Russian is even longer.</p>
      <p>Further, each word of Hebrew also alludes to another meaning as well. This is often not even translated.</p>
      <p>You are correct that in terms of typography, side-by-side text requires either smaller size type for English, or greater line spacing for Hebrew. Usually, the solution is both, to avoid extremes, too small English type or too mch space between lines for Hebrew.</p>
      <p>Another shrewd technigue is to increase the line lngth of the English, and reduce the line length for the Hebrew, and/or set the letters and words much closer in English, and much farther apart in the Hebrew.</p>
      <p>I believe custom made matching Hebrew and Englsh fonts with these qualities is the ideal solution.</p>
