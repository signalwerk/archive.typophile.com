    html: |-
      <p>John, when you have side by side, you can see what is translating what. The side by side approach thus helps the English speaker who knows some Hebrew, and wants to refer to the Hebrew to gain a deeper understanding of the text. And it helps the English speaker who is reading a prayer in Hebrew with only partial understanding and wants to refer to the English to understand the Hebrew better. Especially the latter is a most common situation for the Siddur, the prayer book. </p>
      <p>An example of this approach that takes the side-by-side approach the furthest is the Metsudah Siddur, which has mirrored English and Hebrew of the same phrases--Hebrew on the right, left aligned, English on the left, right aligned. The same phrase is mirrored in two languages on a common gutter.  Functionally, it is almost like an interlinear translation, but with the advantage that if you want to read the English or Hebrew straight, you can do it more easily. </p>
      <p>If you have large blocks of text up and down, as you show, you loose these advantages. But of course what is best depends on how the text is going to be used.</p>
