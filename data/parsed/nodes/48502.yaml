      <p>Firstly, Simon Prais is considered to be a world authority on Hebrew typography highlighted by the fact that various Univesities around the world that teach typography invite him at their expense to lecture on the subject so I wouldn't dismiss him too quickly.</p>
      <p>In fact he consulted on the new bilingual Koren Siddur (pages can be see at <a href="http://www.korenpub.com/siddurpages" title="www.korenpub.com/siddurpages">www.korenpub.com/siddurpages</a> – be patient they take a while to load).</p>
      <p>Of course the Hebrew should be on the left. This is for 3 reasons that I can think of:</p>
      <p>1. Whenever you have prayers that are set line by line such as Ashrei, if you set the Hebrew on the right then you get an ugly negative white space in the middle.</p>
      <p>2. Siddurim are Hebrew books. When opening a Hebrew book you should see Hebrew, not English. If the English is on the left, then you see English.</p>
      <p>3. When you finish a page of prayer and you start to turn over the page, you should see Hebrew again. (This is really the same argument as 2. to be honest).</p>
      <p>There are other reasons too. Let's say you are davening the Amida. You know it off by heart, but frankly you don't have a clue what you are saying so you decide to read the English whilst saying the Hebrew. By setting the English on the right, you can quickly see the beginning of the Hebrew prayer (eg Ata Kadosh) then without having to skim an entire spread, you simply glance over the spine and quickly see the beginning of the English. Much more user-friendly.</p>
      <p>Originally books were set eith the Hebrew on the left. Take a look at the Polyglot Bible here: <a href="http://www.newadvent.org/images/05286abx.jpg" title="http://www.newadvent.org/images/05286abx.jpg">http://www.newadvent.org/images/05286abx.jpg</a></p>
      <p>and you can see that Hebrew was printed on the left.</p>
      <p>Personally, if you are setting the Hebrew full justified, I think that the tradition of putting the Hebrew on the right is so strong that I wouldn't change it, but if you are setting text ragged (such as half the Koren Siddur), then you have no choice, if purely for aesthetic reasons, to set the Hebrew on the verso.</p>
