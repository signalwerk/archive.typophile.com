      <p>It is true that the direction of eye movement is an important consideration. however there are also other problems.<br>
      In a translation from Hebrew into English, the English will usually have more words.<br>
      In Hebrew, brevity is an valued quality.<br>
      There is sometimes a reluctance to put line breaks into a sacred text as they may indicate a particular interpretation.<br>
      When English and Hebrew have the same point size, the English with its vertically oriented Latin characters will be dominant the page unless the Hebrew is printed bold.<br>
      All these factors can result in texts that not "in sync" in the sense of layout. When I come across a Hebrew word I don't understand, it can be quite difficult to find the corresponding translation in the supposedly parallel text. Typically the font size is different and column width may also be different. The Hebrew may have the verse numbers outside the sacred text in the margin whilst the English has the numbers at the start of each verse.<br>
      Mike</p>
