      <p>gohebrew<br>
      Prais suggeted that the tops of the Hebrew characters were more important visually than the bottoms. Following this train of thought, by "baseline" I wasn't refering to y=0 in a font designer program but rather I was thinking of the visual effect. </p>
      <p>For instance, one might have the tops of all the lower case Latin characters and the tops of all the Hebrew characters share the same y value but not have their bottoms share the same y value. Putting it another way, the letters would be aligned at the top rather than the bottom.<br>
      Same might apply also to numerals.</p>
      <p>Mike</p>
