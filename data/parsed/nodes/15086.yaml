    html: |-
      <p>Hi Kristina,</p>
      <p>You refer to Warnock Pro as "a bit on the small side". What do you mean? If you mean the x-height/Cap ratio is great, that could be true. However, Warnock comes in 4 different size variants. If you have the smallest version, you have a set of fonts for all kinds of print work that are engineered to work at small sizes. I have to echo Hrant's point about relative size; condensed faces take up less room and therefore are smaller.... Wider faces can be set smaller and still be readable. So it may not be useful to focus on condensed designs. </p>
      <p>The features you require are economy, clarity, comfort for the reader, and several weights/styles so you can manage the hierarchy of info that is no doubt crammed into this calendar book. For that, you could pick any sturdy text family; Parable is quite nice, there's also Arnhem or Fresco from Ourtype.be, or Absara Serif and Sans, Clifford (smaller sizes)  from FontShop, Proforma (as mentioned earlier), Farnham, Miller, Prensa and Whitman from FontBureau, and Legacy superfamily, Albertina, Mentor superfamily, and Laurentian from fonts.com. Oh, and the Freight megafamily from Joshua Darden. </p>
      <p>Considering all the nice fonts that came with CS2, you have some pretty robust options there you can test out without any expense, to see which conserves the most space. I suggest you set your sample pages in Minion, Warnock, Chaparral, and if you chose this option, Garamond Premier Pro Text and Caption sizes. All of those are built for heavy text use at small sizes. You might be able to reduce your type size to 7 or 8 and not lose any reading comfort. Minion especially performs well when tracked and set with comfortable linespacing down to 7 or 8 points. </p>
      <p>At the very least, I hope you switch from Arial Narrow to something less torturous. Given your current options it would be unethical not to.   ;D</p>
