    <p>Hi, </p>
    <p>I edit a university calendar, which is nothing like a regular calendar; it's a 600+ page book with our rules and regulations and course descriptions. Pretty dense stuff. Right now we are using Arial Narrow at 9/10pt because, well, we always have, and it seemed to be good for cramming maximum text into minimum space. Recently, however, we changed from an ancient version of Word Perfect to InDesign, and now I am considering suggesting a font change as well. </p>
    <p>What font would you suggest that would be as efficient with space and readable? And, considering this is for company use and that at least two of us need to have the font on our computers, how does licensing work? (I have no experience with buying/licensing fonts.)</p>
    <p>Thanks for your suggestions,<br>
    Kristina</p>
