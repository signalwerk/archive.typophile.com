    html: "<p>There is a lots of typeface you can use. Lots of things can force us to work with a typeface instead of an other one. Of course the legibility and the readability are two of the most important. But don't forget the relation you have with a typeface you choose. Imagine, you have to design over 600 pages with a typeface. If you choose one you never tested, Is he readable, is she legibile, Is she has italic, bold or black if you need it? Do you like the one you choose, do you enjoy the g, the a or the ampersand for instance? If not, you'll find the job will be hard to do. Choose a typeface is an important decision. To me there is 3 most important tasks before to choose a typeface: make test, make test and make test again.</p>"
