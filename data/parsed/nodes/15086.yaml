      <p>1. Hugely better than the Arial Narrow horror you inherited.</p>
      <p>2. The logic behind which lines go to the edge of the page and which not is not totally obvious. This could use improvement, or another solution.</p>
      <p>3. I personally would make the titles in the margins larger. You've got some space there; having something bigger would add some more energy to the pages. Also the titles should be aligned more clearly with the text or dividing lines, I think.  </p>
      <p>4. It would help to carry over the titles on the pages with none. That way on every page you know what it's for. </p>
      <p>Good work so far. Immensely better.</p>
