      <p>Hi William, Thank you! That's encouraging.</p>
      <p>I'll use your suggestion about the titles in the margins, and probably align them with the first line of text because sometimes they appear where there is no dividing rule.</p>
      <p>Your comment #2 -- I did this based on Bringhurst and Lee who suggest it as a way of preventing widows and orphans. They both say it is preferable to fall a line short or a line long (on an entire spread) rather than stretch the leading or add extra space between paragraphs. I try to play with the text wrap to add or save a line, but in some cases nothing seems to work. </p>
      <p>Widow/orphan control is one of our major problems, and the main argument my colleague has presented for not aligning the text to a baseline grid. So if you have any other solutions, I'd really appreciate hearing them -- I've run out. However, based on Bringhurst, I feel confident that it is  not as bad to drop or add a line as it is to mess with the leading and start feathering (which is what we'd been doing). </p>
      <p>Thanks again; it's good to know I'm on the right track. This publication is not in any way going to represent perfect typography, but at least I'll have made it somewhat easier to read.</p>
      <p>Kristina</p>
