    html: |-
      <p>Hi Grossgrove,</p>
      <p>Thank you for the suggestions, I really appreciate the input. </p>
      <p>I have gone through pretty much all of the serif fonts in CS2, and somehow even the ones I like don't quite do it. Some seem big at 9pt for a 10pt leading, but too small at 8pt. Others just seem inappropriate. I don't yet have a better typographical vocabulary than that, unfortunately. </p>
      <p>Warnock was pretty good, but the people in my office who wear glasses thought the Arial Narrow was more readable than Warnock... go figure. I like that Parable is easy to read at 7 pt -- 8 pt is almost too big. And I like its open feel. </p>
      <p>Perhaps after readability the defining factor is the feel I want the publication to have. It's often thought of as an academic legal doorstopper that no one reads, and it's printed on something close to newsprint, but not as thin. I'd like the font to be readable and liven up the publication somewhat, even minutely. </p>
      <p>I'm having difficulty finding a sans serif for the headers and subheaders. I don't know which ones go well together. For now I've matched Parable with Myriad Pro. Something about the flare (like at the base of the uppercase M) seems right, but I could be way off.</p>
      <p>I'm not looking for a condensed font per se. I'm trying to bridge the need to not add too many pages to the book and the need for readability (I really need something that will work with the 10 pt leading). I know very little about typography, but I'm learning. </p>
      <p>I'm prepared to compromise somewhere because I may not have a choice, but overall I'm going for improvement. The fact that this publication has persisted in this format for so long speaks volumes about where the priority has been placed. Extra pages cost money...    </p>
      <p>I will check out the other fonts you've listed. Thanks again for the input. I'm beginning to feel like I've been staring at the project for too long. </p>
      <p>Kristina.</p>
