    html: |-
      <p>Kristina,</p>
      <p>Good news: If 8 is too small, and 9 is too large, InDesign will give you any fractional size between. Customize it to 8.4 if that feels right. But I wonder why you need to stick to 10 point leading? Is there already an InDesign template you're working from? </p>
      <p>I ask, because like the type size, leading is also finely adjustable in InDesign. When setting text, the combination of typeface, size, tracking, leading and column width all work together to produce blocks of text that are more or less comfortable and economical of space. Especially when switching from a condensed sans to a serif, the overall look will be very different; be wary of the impressions of people who are used to looking at this document. </p>
      <p>I do have some experience with typography, and from the type specs you've named, I can say very confidently that with a careful revision of typeface, size, and leading, you should be able to save paper and improve the feel of the document.  </p>
      <p>I just spent a few minutes comparing Minion, Utopia, Warnock, Georgia, Clifford, and Chaparral to Arial Narrow. To get the same column length, I had to change both the type size and the leading; Utopia ended up smallest at 7.5 on 10, and with a ratio like that, you end up with much more comfortable leading, which is also where you could realize a savings in pages. If you set Utopia at 7.5 on 9.5, the leading is still more comfortable, and you can fit more lines, which equals less paper. A major influence on the readability of your document is line spacing, and frankly I found Arial Narrow 9/10 pretty cramped. I think you have a great deal of leeway to improve your document; I suspect that if you showed these comparative samples to 100 students and staff none of them would pick Arial. If you like, I will forward the PDF to you. </p>
      <p>A Sans you could consider for heads is Cachet by Dave Farey. It's also softened, and square, like Parable.</p>
