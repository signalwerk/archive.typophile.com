    <p>A client has sent me two samples of typography he would like to try and incorporate into a brochure.</p>
    <p>Sorry for the poor quality of the copies.</p>
    <p>Can anyone identify the larger font used on both samples. There may not be enough information for a exact match but if a font name jumps to mind it would be appreciated.</p>
    <p>I realize both of these samples could be custom hand drawn letters and not part of font but if what you see suggests a font  I would appreciate your suggestions.</p>
    <p>Thank you in advance.</p>
