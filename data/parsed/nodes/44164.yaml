      <p>Goodness, don't change the B and D, they give the face much of its identity. Well, maybe the top curve join of the D could be smoothed out a little.</p>
      <p>The 2 and 5 have lost some distinction now. Try using a diagonal (like in 4) for the lower left of the 2. The 5 may need a compromise, like a smaller turn radius on that corner.</p>
      <p>4 is still reaching below the baseline. I think you got all the others.</p>
