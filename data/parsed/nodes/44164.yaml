    html: |-
      <p>I think something that strikes me as odd is that the only letter that is not monospaced (save the I) is the W. If the M isn't wider than the rest of the letterforms, I don't think the W should be either (even though Ws are usually a little bigger than the Ms). I think it throws off the rhythm of the rest of the letters, although I find it's shape the most interesting of all. The short vertical stubs atop the arm of the K and the X don't seem to match the other diagonal strokes. The terminus of the J has an angle on it that I don't se on any of the other letters/numbers.</p>
      <p>What Kevin mentioned about the H "overshooting" the cap height and baseline; Did you draw these with a stroke with the points on baseline/cap-height (perhaps in illustrator)? If you have the rounded edges attribute on the stroke, it will stick out past the endpoint to whatever point size that the stroke is set to.</p>
    html_clean: |-
