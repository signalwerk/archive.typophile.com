  - id: 460094
    user: 14722
    date: 2011-04-14T07:27:00
    date_raw: 14 Apr 2011 — 7:27am
    votes: null
    html: <p>Switching fonts instead of style-linking should not corrupt a document. Many publication designers do not use style-linking at all; they create styles for all instances of bolds and italics to avoid any linking or naming problems across different typefaces.</p>
    html_clean: <p>Switching fonts instead of style-linking should not corrupt a document. Many publication designers do not use style-linking at all; they create styles for all instances of bolds and italics to avoid any linking or naming problems across different typefaces.</p>
  - id: 460202
    user: 909
    date: 2011-04-14T19:53:00
    date_raw: 14 Apr 2011 — 7:53pm
    votes: null
    html: |-
      <p>There's no such thing as style-linking of fonts in an InDesign *file* anyway; InDesign only uses the style links as part of a shortcut way of switching fonts, but the net effect in terms of what is stored in the document file is no different than picking the other style off the menu.</p>
      <p>Cheers,</p>
      <p>T</p>
