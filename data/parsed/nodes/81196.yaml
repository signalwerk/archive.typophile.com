  html: |-
    <p>An Indesign file I've been working on has suddenly decided not to open (Error code 4) and I'm wondering what the problem might be.</p>
    <p>I wonder if it's to do with the fonts in the doc. I'm using Gill Sans MT Light for the body text but there are frequent 'bolds' in Gill Sans MT [ie. the medium weight]. They are not style linked, so that's rather a lot of font switching in the document.</p>
    <p>Might this sort of thing create an unstable document?</p>
    <p>thanks in advance,</p>
    <p>Geraint</p>
