    html: <p>This could be the result of font substitution entries in the registry. Open regedit and have a look under the key:<br><code>HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\FontSubstitutes</code></p>
