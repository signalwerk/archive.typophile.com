    html: |-
      <p>Thanks for the comment. First, to clarify, it's an "OB" monogram. I also thought that perhaps the stem of the B is too weak, especially in proportion to the back of the O and the end of the B. On the other hand, I don't want the bridge/web between the bottom and top of the O and B to be too heavy. Do you prefer the copy below?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Monogram-copy_4463.png"></div><p></p>
      <p>Compared to the original below:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Monogram-Big_3649.png"></div><p></p>
      <p>I personally feel that thickening the B stem actually throws off the balance of the monogram; the strength of the outer sides (left side of the O, right side of the B) makes up for a weaker center. Something about the increased thickness makes me feel that the letters are separately defined and the monogram is gluing them together, rather than the mark being a self-contained, more stylized symbol. But let me know your feelings about this; I can be easily persuaded.</p>
      <p>OB</p>
