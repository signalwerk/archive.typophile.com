    html: |-
      <p>At first glance i saw OB, then a second look made me see CB. Something about how the top of the C slides into the top of the B seems unresolved. Same with the bottom of the C joining the bottom of the B. </p>
      <p>Perhaps its the weight of the B's vertical Stem in comparison to the heavy back of the C. The bowls of the B match the C but it looks like the counter space of the C is eating into the stem of the B.</p>
      <p>Working that counter a bit might really define the characters and make a nice monogram. </p>
      <p>It looks good though. Nice work. Sorry if I have crossed my O's and C's</p>
