    html: <p>Do you have the whole CS? If yes, the best way is to set the colour profile in Bridge, as it synchronises across the whole suite. Then, depending where (US, Europe, Japan?) and how you work (print/screen?), select an appropriate profile , web offset/sheet-fed offset, etc.). That way the discrepancy can be solved (perhaps?) by tweaking the screens. 2¢</p>
