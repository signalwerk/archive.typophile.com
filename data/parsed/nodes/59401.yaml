    html: <p>Getting two screens to match is really hard to do unless you buy a good color calibration tool and don’t allow external light into the room. Your best bet is to just have one good display, keep it calibrated, but never trust it and always run test prints on a good inkjet that can handle real CMYK printing.</p>
