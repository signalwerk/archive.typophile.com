      <p>I'm by no mean an expert, since in our shop I only do black &amp; white. My partner does all the color work. But we both use dual monitor setups, and I have listened to him grumble . . .</p>
      <p>You absolutely, positively have to calibrate the monitors. Even for B&amp;W. With the old CRT's, this was relatively easy, as far as  painful things go. With the newer flat-screen monitors, the cheaper ones cannot be completely calibrated. Sadly, you need the costly monitors -- back lit, is it?</p>
      <p>I do use a dual monitor setup. What I do is to keep my tools, layers, history, actions etc. on one; the "good" monitor is for the image. In point of fact, I use a CRT for the "tools" monitor and a good, albeit not the best, LCD monitor for the image. If you gotta zoom in, bite the bullet &amp; take the time to do it on the good monitor. Otherwise, spend the 10+K for two very good monitors, or suffer as you're currently doing.</p>
      <p>The only other tip I could offer is to pick the colorspace you want work in to fit your needs. Use it, get use to it. Periodically make a profile for your proofing printer -- laser printers seem to have to be profiled every damn day, inkjet seem to hold longer. Before printing the image, convert. If, like us, you send work off to a printer (the book "printer" not the "proofing printer" in your shop), again, see if they have a profile for you to convert to, do that, then set the color space to "same as source" (i.e., "none") in the PDF file.</p>
      <p>If, on the other hand, your work is going to a compositor -- for example, if you're a cartographer -- do tag the images with the profile you've used. I guarantee you we don't work in the same colorspace you do. We're all better off if we just convert rather than first having to guess the proper profile to assign before converting.</p>
      <p>FWIW</p>
      <p>P.S. If, like me, you use a lot of layers, even having the image at 51% size won't really show what you've got. Flatten the image, take a look, and back up one step in the history to keep working. Also, I never flatten my working image before printing proofs. I make a copy, flatten that, &amp; change it to 8-bit. That way, you can make a correction to your working image with less risk of posturizing. We do work in the 16 bit mode, changing to 8 only for final . . .did I mention that our files are pretty large?</p>
