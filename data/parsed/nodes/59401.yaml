    <p>Hay,</p>
    <p>I have two screens and one of them has washed out colors, but only in Photoshop (CS4, Vista). I've googled about it and found that I have to use the screen's default color working space, but that's what I already had. I'm stumped and it's annoying for things to look unrepresentative in one of the screens, since my workflow depends on having zoomed out versions on the side. Has anyone ever come across a problem like this and perhaps managed to resolve it? I'm even considering a clean OS reinstall.</p>
    <p>P.S. Looking at the neigbouring topics, I'm starting to feel this was the wrong place to post. Sorry about that. I do use Photoshop for typography, though. :3</p>
