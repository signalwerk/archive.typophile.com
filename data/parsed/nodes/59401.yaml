    date_raw: 26.Jun.2009 1.19pm
    votes: null
    html: <p>Getting two screens the same is indeed hard to do, so your best bet is to just use the <em>same</em> profile on both screens (in the software). It may differ optically, but at least the <em>numbers</em> will be the same. I would never use the screen's profile, because it isn't very universal, and you don't know what range the profile has. I'd set Photoshop to Adobe RGB (1998), which has a good color range. And also keep the profiles the same in every Adobe application for consistency (you can use Bridge to change them all at once).</p>
    html_clean: <p>Getting two screens the same is indeed hard to do, so your best bet is to just use the <em>same</em> profile on both screens (in the software). It may differ optically, but at least the <em>numbers</em> will be the same. I would never use the screen's profile, because it isn't very universal, and you don't know what range the profile has. I'd set Photoshop to Adobe RGB (1998), which has a good color range. And also keep the profiles the same in every Adobe application for consistency (you can use Bridge to change them all at once).</p>
