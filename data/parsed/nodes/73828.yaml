  html: |-
    <p>Hello everyone,</p>
    <p>we made a script for automatic font family naming in FontLab and I want to share with you.</p>
    <p>Maybe some of you find it useful. We use it mostly for big families.<br>
    It’s relative simple to use. Documentation is included.</p>
    <p>This script changes the font names of all opened fonts for the use as font families. </p>
    <p>Example family:<br>
    My Family<br>
      – Light<br>
      – Light Italic<br>
      – Regular<br>
      – Italic<br>
      – Bold<br>
      – Bold Italic<br>
      – ExtraBold<br>
      – ExtraBold Italic</p>
    <p>The naming method will also split up the family into single-font-families in the font menu in non-OT-savvy Windows applications.</p>
    <p>The script is based on Karsten Luecke “Font Naming, Scheme [B], Page 7/8, Version 1.02” (See <a href="http://kltf.de/kltf_otproduction.shtml" rel="nofollow">documentation at his website</a>) but with some important changes:<br>
    a) The script will style-link italic styles<br>
    b) The use of "Regular" and "Regular Italic" in "Font Family" is now removed</p>
    <p>You can download the script here at Cape Arcona: <a href="http://www.cape-arcona.com/news/capearcona/opentype-production/" rel="nofollow">CA Font Fam­ily Nam­ing [B].py</a><br>
    Needles to say that FontLab Studio 5.0.3 or later and RoboFab is required.</p>
    <p>UPDATE: RoboFab is not required anymore!<br>
    UPDATE: The script will style-link italic styles<br>
    UPDATE [20 Oct 2010]: The use of "Regular" and "Regular Italic" in "Font Family" was removed </p>
    <p>Hope you like it.</p>
    <p>Thomas / Cape Arcona Type Foundry</p>
