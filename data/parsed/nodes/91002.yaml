    html: <p>I wouldn't have thought so. Rightward motion tends to have priority in the ductus of LTR scripts, especially if one knows one is subsequently going to be writing another sign to the right of the acute. It is moe efficient, and efficiency is also what is likely to produce the rotation in the second sign.</p>
  - id: 499517
    user_id: 23037
    user_name: Ross Mills
    user_path: null
    date_raw: 14 Mar 2012 — 2:41pm
    date: 2012-03-14T14:41:00
    votes: null
    html: <p>As you say, its really up to the authors to confirm the intent of the mark. It could be one of aspiration, or perhaps more likely for Cheyenne, one of tone—simply using a glyph form more commonly associated with aspiration, per se. That exact <em>form</em> of the mark is not one I recall coming across, although I have come across a superior 'c' on a few occasions. It wouldn't surprise me if it originates from a small, raised italic 'c' being used, depending on the era from which it originates. Or it could simply be an artifact of handwritten form, or something else entirely. In any case, its easily handled by mapping it as an alternate (once you establish what the most appropriate base form is [u+02BB, u+02BF, u+0314...]). I suppose it could also be related to the breve, circumflex or caron, or even one of the various forms of glottal, all of which have been used in Cheyenne orthographies. I could speculate further, but its probably pointless as the author can no doubt give a categorical answer.</p>
