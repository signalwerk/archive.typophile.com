      <p>For anyone who cares -- which at this point, might not include me -- we just sent the final PDF off to the printer.</p>
      <p>The strange "half-c" diacritic turned out to be a scribal mark used by James Mooney (1861-1921), which the "author" was trying to preserve. Of course Mooney's writings were all handwritten -- it is these writings on the subject that is being typeset, but for reasons not comprehensible to me, a few scribal forms had to be used. Author's are like that...</p>
      <p>You know there is trouble when you find yourself making up a few new characters for the index. Maybe this is an important book, maybe not. If so, there is going to be need for an errata in the second edition...with any luck, by that time I'll have passed away.</p>
      <p>(A grumble and aside: Next time someone wants you to set a double strikethough of just a period, think long &amp; hard about how you're going to achieve that with 10-point type...a hint: it can be done.)</p>
      <p>* * *</p>
      <p>We couldn't use it for this job, but I went ahead &amp; bought Ross Mills' Huronia. Going to try &amp; push it with some of the designers I know who deal with what are now termed "Native American" texts. I think it will work very well; getting that font family maybe the best thing that happened with this job.</p>
