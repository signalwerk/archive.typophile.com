      <p><cite>I can understand that exact preservation of the original is important in scholarly publications. </cite></p>
      <p>Less often than you might think. Either that, or we trivialize "scholarly" work. It's a good point, but your preaching to the choir. </p>
      <p>Or maybe I'm the Bible thumper here...</p>
      <p>One thing people may not know about scholarly publishing is "acquiring editor" is now a quite different job than "editor." It used to be a part-time duty of an editor, and the main challenge was to find a nice way to reject authors work -- "I'm sorry, but your manuscript does not fit our list at this time." (Unless the author's name was, say, "Samuelson"...)</p>
      <p>Now, acquisitions should be a part of marketing -- the acquiring editor tries to convince authors to sign up with a publisher. </p>
      <p>As with so many things, giveaways help.</p>
      <p>"Of course, you're right, we need to include that 72-dpi picture of Adolph Hitler, no one knows what the man looked like..." </p>
      <p>"It's wonderful that you had the stain on page 76 of  J.D. Salinger's manuscript analyzed, showing that it was Lipton tea rather than Bigelow. We'll be sure find a way to include a representation of that stain in the extract when it is typeset."</p>
      <p>To be serious for a minute, the original purpose of scholarly publishing -- at least, as a part the university -- was to publish work that was important, but aimed at such a small audience it would not be economically viable for a commercial publisher.</p>
      <p>During the tight times in the 1980s, almost all university administrations decided their presses needed to run lower deficits. Easiest way for a press to do that was to publish more titles, and start adding works that might make money. One press, located quite close to me, published about 20-25 books a year  in 1979. Now they publish close to 100 a year.</p>
      <p>Well, all sorts of changes in all parts of the book world. Eventually, scholarly publishing may morph into something that again makes sense. Right now, the whole business looks a little too much like late night television, with commercials hawking products with limited appeal. "But wait, there's more..."</p>
