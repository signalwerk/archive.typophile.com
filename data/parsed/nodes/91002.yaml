      <p>Ross -- As I said originally, both are used in this book. If these are diacriticals, and they seem to be, the *half ring* is no problem, U+0351. </p>
      <p>It is the *slanted half c* I wonder about. Are you suggesting this may just be the author's attempt to describe  U+0314? Again as you say, usually either one or the other is used. I do not yet have the manuscript to hand, but it is expected in day, and of course, due soon thereafter.</p>
      <p>Again, as I said, the "slanted half c"  always appears to the right of an acute, and in this text, anyway, the combination occurs over A, a, i, k, o, q, s, u, and y.   </p>
      <p>I think I'm going to have to wend my way through the editor(s) to the authors, with all that entails...</p>
  - id: 499392
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 13 Mar 2012 — 5:07pm
    date: 2012-03-13T17:07:00
    votes: null
    html: "<p>A chirographic analysis: if one has just written an acute accent, from lower left to upper right, the tendency will be to write either a following half circle or inverted reversed comma sign as a quick curved stroke back down and to the right, rather than, say, taking the time to very carefully judge the position of the top right of the half circle relative. So this will tend to produce a rotated accent in writing, but I'm with Ross in thinking that this is probably intended to be either the half circle or reversed inverted comma aspiration mark.</p>"
