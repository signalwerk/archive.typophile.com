      <p>David,</p>
      <p>No, I know that one. I have a pencil drawing provided -- you know what that's like, basic shape only. What they've drawn is an 'a' with an acute accent, with either the half ring or "short slanted c" beside the acute. Of course, in the drawing, they exaggerated the half ring -- it is drawn to almost a "u" on it's side -- to differentiate it from the "c" (no serifs in pencil drawings). If you ask for more, they draw it again :-(</p>
      <p>I could always make up a superior italic "c", scale it narrower, etc. etc. but it gets very tiring playing the "is it this?" game, and you always risk authors not realizing what you *can* do, so they settle for something less than ideal.</p>
      <p>If a *typophile* knew what it should be, I'd trust that.</p>
      <p>Thanks, though...</p>
