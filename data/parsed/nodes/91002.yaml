    <p>We've been sent a list of special characters to make up for a book <cite>In Sun's Likeness and Power: Cheyenne Accounts of Shield and Tipi Heraldry</cite>.</p>
    <p>Most I can figure out, like </p>
    <p>"capital A with right-opened half ring above"</p>
    <p>But then we hit</p>
    <p>"a with acute and slanted half 'c' above"</p>
    <p>Which is clearly different that the half ring.</p>
    <p>Anybody know what a "slanted half c" is in the Cheyenne language, or anything else, for that matter? If not a character in Unicode, then in anything? It may be *signage* as a part of the heraldry rather than a linguistic use, and I'll get up with the authors if needed, but it is going to be one of those things that will have to be done quickly (&amp; isn't everything these days?).</p>
