    html: <p>I don't see such a mark combination in the Glenmore and Leman orthography. Perhaps it's meant as some sort of prosodic marker for notating song? In any case, if you're getting this from the editor at the press, I think you should probably go directly to the author(s) if possible - in my experience there's generally less miscommunication about weird glyphs in a direct dialogue, and you'll need to confirm whatever you draw with the person who knows exactly what they're trying to indicate anyway.</p>
