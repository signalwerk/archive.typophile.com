      <p>Well, I've started the long, laborious process of getting up with the authors. For those of you who don't know, the "proper channel" is to first make contact with the designer, who passes you off to the copyeditor, who passes you to the acquiring editor, who then, after several fits &amp; starts, passes you to the authors...</p>
      <p>(Shortcutting this is why I post these things here!)</p>
      <p>I'm going to ramble now...</p>
      <p>I did hear from the designer, so we're started. She's going to use Charis, to take advantage of the character compliment. It's a Charis I've reworked, so it sets well, but is not, shall we say, attractive. Not it's purpose.</p>
      <p>I was hoping to finally have found a book that warranted purchasing Huronia, but I guess that will have to wait. Another problem is University Press budgets are awfully tight just now, and talking them into purchasing a typeface takes a lot of work -- and usually some examples of printed books.</p>
      <p>As a typesetting firm, we were able to stir up interest in Sumner Stone's Cycles back in the days when printing was repro-negative-plate, but Sumner just never reweighted Cycles for direct-to-plate printing. While I'm pretty sure he'd let me do the work, I just never quite found the time. &amp; when it comes to selling the presses on purchasing it, there are more alternatives to Cycles than to Huronia.</p>
      <p>I don't think weight will be a problem with Huronia. It looks like it will print fine DPT. I just need to buy it, &amp; use if for one of the rare projects I design as well as set. Or talk a designer into using tracings for layouts, then let us purchase it &amp; set a book with our licensed copies.  Sadly, the days when a designer can work that way are gone...</p>
      <p>* * *<br>
      I've know of Ross Mills ever since Richard Eckersley came back from somewhere all excited after meeting Ross &amp; discussing fonts for setting Native American languages. Richard's gone now, and I'm still waiting for an opportunity to work with Ross. One of the Native American books we do maybe, or maybe Matt Avery at Chicago will get some money in the budget. I know Matt is interested in Huronia generally, and he &amp; Isaac Tobin are very good designers, well beyond the "up &amp; coming" stage.</p>
      <p>OK, I'll stop rambling &amp; complaining now...</p>
      <p>Thanks for everyone's help; I suspect it will come back as John &amp; Ross said.</p>
