    html: <p>I've got a few quick comments, but keep in mind I'm a novice type designer. The terminal of the "c" is a bit too long. Your "d" feels unbalanced to me. Looking at your "d" and "p", you need to make sure that you give your bowls enough space from your junction points. Notice how your curves go in nicely on your "m",  "n" and "h" and still give your stem some breathing room. That adds legibility to your face. Promising start, keep chuggin'.</p>
