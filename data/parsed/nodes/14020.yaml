      <p>Looks very good, but there is one clear mistake: the lower half of the 'x' is--or at least seems to be--the same size as its upper half, what makes it look smaller, hence unstable. You should make the lower half bigger, and also make sure it's at least as wide as the upper half.</p>
      <p>oribendor</p>
