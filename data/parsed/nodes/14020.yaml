    html: |-
      <p>Thanx for the lesson in type anatomy. I'm new into type etc. but i also was a bit unsure if it is correct to call these things serifs.</p>
      <p>I also have a question about drawing curves in a letter. When I was transforming text into curves in Freehand I noticed that the most curves have much more bezierpoints than I used in my letters. For example I tried to draw the Arial f. A curve in the original letter has got 3 or more points. I would draw the same curve with just 1 point!? Should I try to use more points!? Why it is important to make more points, even if the letters look like the same!? I take notice that it is much more difficult to draw a curve with more than 1 ponit!</p>
      <p><a href="http://lastraw.de/Steven/ff.gif" rel="nofollow">Arial shape</a></p>
    html_clean: |-
