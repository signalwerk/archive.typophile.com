      <p>Hey,</p>
      <p>The 'x' and 'g' are much better now.</p>
      <p>As for the horizontal serifs of the 'f', 'g' and 't', their width is just fine, but I'm not sure about their height. Shouldn't you place them a little lower, so that their upper outline would be exactly the same height as the upper outline of the 'x'? I think you should.</p>
      <p>And is it really okay to call the horizontal stems of the 'f' and 't' "serifs"? I doubt it... ;-)</p>
      <p>oribendor</p>
