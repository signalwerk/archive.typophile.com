  html: "<p>Dear Typophile: <br>I am honored to join this group.  Please feel free to contact me if you have questions related to US law and fonts. <br> <br>On another note, I just bought a used G4 tower and I am looking for a used copy of Fontographer 3.5 or similar vintage.  Specifically, I need to be able to convert font data to postscript absolute for the purposes of US Copyright filings. I  am not looking for a favor and will pay market value.  Warmest regards, <br> <br>Frank Martinez</p>"
