    html: <p>Let me also put in another plug for <a href="http://fontforge.sourceforge.net/">FontForge</a>, a free software font editor which is also quite useful for converting font formats and related tasks. There are packages for Mac OSX. You'll probably need the Apple X11 server to run it, but that really isn't any more hassle than running a program in Classic. <br> <br>Oh, and welcome to typophile! You may not realize what a can of worms you have opened with your offer to help on legal questions <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
