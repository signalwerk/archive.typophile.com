    html: <p>In the spirit of making solid files and remaing current most <br>people here would suggest FontLab. It's all I use but... <br> <br>Three years ago in a last ditch effort to stick with FOG I found <br>Fontographer 3.5 and FontStudio 2 on Ebay for a mere $4.95 <br>each. After placing my bid I recieved a call from a software <br>clearence place in Californing asking if actually wanted this <br>stuff as it was still on floppies. Of course! So a week later <br>they arrived stil in the box. Both work on OS9 and I ended <br>up paying something like $15 total with shipping. I never use <br>them though. Kind of like collector automobiles for the poor.</p>
