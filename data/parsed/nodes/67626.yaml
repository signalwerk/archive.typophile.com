    html: |-
      <p>First, I would not call this a script, but a serif font.</p>
      <p>I think this is custom. The style mixes some Latin (triangular) serifs with ruled or slab serifs. The most similar font I found was Castle Type's <a class="freelinking external" href="http://new.myfonts.com/fonts/castletype/vincenzo/" rel="nofollow">Vincenzo</a>. It has similar serifs, although the middle arm of the E is too long. The necessary changes could be made by flattening the letters and adjusting the center arm of the E.</p>
      <p>Then the three dimensional effects would have to be done with layering.</p>
      <p>- Mike Yanega</p>
