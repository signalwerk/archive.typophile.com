  html: "<p>* Merry Christmas and Happy Holidays! * <br> <br>We're proud to announce the release of the Typophile Channel for Sherlock.  <br> <br>The channel is a free download for Macintosh typophiles at <a href=\"http://www.typophile.com/sherlock\" target=\"_top\">http://www.typophile.com/sherlock</a> and currently searches 15 typography sites including the following: <br> <br>Creative Pro <br>Fontzone <br>Letterror <br>Lines &amp; Splines <br>Luc Devroye's On Snot and Fonts <br>Myfonts.com <br>Oak Knoll Books &amp; Oak Knoll Press <br>Text matters <br>The Hoefler Type Foundry <br>Typeright.org <br>Typophile Forums <br>Yahoo Design Arts <br> <br>For those of you who are still using your Mac SE30s, Sherlock is Apple's new \"Find file\" tool, which supports the creation of channels for a more focused internet search. No more finding fish gills mixed in with \"Essay on Typography.\" <br> <br>The Typophile Channel is an ongoing project and we expect to add new sites as often as possible.  <br> <br><a href=\"http://www.typophile.com/sherlock\" target=\"_top\">http://www.typophile.com/sherlock</a> <br> <br>Happy downloads! <br> <br>Jared &amp; Joe, Typophile</p>"
