    html: "<p>The following is cross-posted from another <br>forum, because I'm naughty like that... <br> <br>On 12/12/01 5:00 PM, Michel Bujardet wrote: <br> <br>&gt; This will be extremely useful, and will conduce Mac users to sites a bit <br>&gt; less dreary than the seen-everywhere so called free PC fonts... <br> <br>This comment is right on. The plugin would be even <br>more effective in this regard if released to a wide <br>audience, including those who would normally turn to <br>google.com or free font archives. Any plans for that <br>Jared? It would extend the \"preaching\" beyond the choir. <br> <br> <br>On 12/12/01 6:14 PM, Jared Benson wrote: <br> <br>&gt; Are you suggesting a type-only google? Please elaborate. <br> <br>Oh, no, although the thought of that makes me shiver <br>with excitement.  <br> <br>I meant only that it would be great to see this Sherlock <br>plug-in publicized widely. There are many who may not <br>be aware know of these sites but are hungry for type news <br>and knowledge. These are the people who commonly rely <br>on general search engines or free font archives for help <br>and fonts, and they are often led to inadequate or false <br>information.  <br> <br>I frequently see one of the more serious examples of <br>this: a user looking for the \"Harry Potter font\" types just <br>that into a google.com search. This will inevitably lead <br>them to one of many knockoffs of Marcus Burlile's design, <br>Able, which is the actual font used for the \"Potter\" books. <br>I'm sure listers are aware that the public's perception that <br>fonts are free is becoming more and more common. The <br>proliferation of free knockoffs is a huge reason why. <br> <br>(see <a href=\"http://www.myfonts.com/FontForums/read.php?f=5&amp;i=1040&amp;t=1040\" target=\"_top\">http://www.myfonts.com/FontForums/read.php?f=5&amp;i=1040&amp;t=1040</a>) <br> <br>With a broad range of visitors, MyFonts.com has become <br>a good bridge between the more informed and the less <br>informed. It would be ideal to see the plugin promoted there. <br>Perhaps they could be encouraged to provide a blurb and <br>link for download on their front page. And better: how tough <br>would it be to develop the plug-in to search the MyFonts <br>forums as well? (It seems to be missing in this release.) <br> <br>Cheers, Jared. I think this can be a powerful thing on many <br>levels, especially if it's widely promoted. By the way, it's <br>good to see your bitmap font in use on the download page. <br>Benson Caps, everyone. Benson Caps. Mini 7 is old hat. <br> <br>Stephen</p>"
