    <p>Started messin' about, and before I knew it I'd got carried away.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OrganonSansx3_5584.gif"></div><p></p>
    <p>Here is a new sans family to complement the <a href="http://typophile.com/node/53885" rel="nofollow">Organon Serif</a> family which I recently completed. Organon Sans will have the same six weights, have same stem thickness and x-heights as the corresponding Serifs.</p>
    <p>If you compare character shapes of Sans and Serif you can see they are not always the same, but there is a familial resemblance.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Organon-S+S_6676.gif"></div><p></p>
