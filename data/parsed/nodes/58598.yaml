      <p>Very nice work!<br>
      There is one thing i don't really like: it's the dynamic of the "n". I prefere the round start of the "d".<br>
      I realise now that you had this difference in the serif, were it works quite well, still i'm not fond of this "style" in sans serifs, for me it always looks too hard.<br>
      Also, what about an old style "g"?</p>
