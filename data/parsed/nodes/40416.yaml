    <p>I’m working on the layout for a children’s book. The illustrations have a 1950’s animated feel (think Disney). I’ve decided on <a href="http://www.houseind.com/index.php?page=showfont&amp;id=565&amp;subpage=viewfonts">Burbank</a> from House Industries for the cover, etc., but need a legible serif (slab serif, perhaps?) for the body text.</p>
    <p>Any suggestions??</p>
