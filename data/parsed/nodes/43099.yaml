    <p>Ladies and Gents,</p>
    <p>The in-house design team here at Novell under the direction of David Groom, recently launched a redesign of Novell.com. We felt it was a bold step forward to use a swiss design &amp; typography approach in a technology sector. It has been up for almost 24hrs now and we have been getting some good feedback however most of it has been viscously against the new look and feel, especially the black backgrounds on the language selector and login pages. We would like to solicit your unbiased, truthful feedback both positive and negative.</p>
    <p>many thanks,</p>
    <p><a href="http://www.novell.com" title="http://www.novell.com">http://www.novell.com</a></p>
