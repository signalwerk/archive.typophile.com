      <p>I can only offer my opinion as a frequent user of the web sites of technology-related companies.  I assume you’ve been getting enough of these opinions already, but I’ll go ahead anyway since I’m hardly ever on a forum where my opinion is asked.</p>
      <p>My first reaction was “Not <em>another</em> company that’s decided making a stunning visual impression is better than helping me get to the information I want quickly.  Not another web site where everything is in motion and the menus don’t stay put. Not another web site where the use of flash on the front page gets in my face (typophile, I’m looking at you, too). Not another company where I have to figure out how to bypass the front page to get to useful content.”</p>
      <p>[Edited after a minute more thought.]<br>
      After getting past my first reaction, I realized that there are some more specific things I can say that (perhaps) may be helpful: (1) When you design a site like this, you are facing an uphill battle because I have come to <em>expect</em> a flash-based site to give me in particular a bad experience. (2) There’s no content on the front page.  When I visit, I’m usually looking for very specific technical information about one of your products, and the flash-based front page is at best distracting and at worst one more layer I’ve got to bypass. (3) <em>Please</em> make sure my scroll wheel will work inside your flash animation (even if that means not using a flash animation).  My laptop screen isn’t tall enough to fit the whole site, and when my scroll wheel no longer works, it feels like you’re telling me that your design is more important than allowing me to use my computer the way I normally do.</p>
      <p>I don’t mind the country selector—it’s good to remind residents of the United States that they can be alphabetized just like everyone else, rather than being listed first. </p>
      <p>Having gotten all that off my chest, my layman’s perspective is that the front page looks nice.  I also have a lot of sympathy for designers who <em>want</em> the page to be visually appealing, but it’s as if there’s a race out there for companies to show they aren’t falling behind in the race to have a bold new look. I liked the old, less-bold look, but I have come to the opinion that all these companies must have a very clear idea of who they’re trying to impress, and that person isn’t me.  </p>
      <p>Finally, I’ll also add that the version of the front page I saw first (with Javascript and Flash turned off, my default browsing setting) was... not bad.  It followed the same general layout, didn’t move around, and took me to a helpful menu relatively quickly once I got over the fear that it wouldn’t.  It also bypassed the language and country selection. So, as long as you keep providing a nice fall-back to those with the bells and whistles turned off, you have my blessing to go crazy with the bells and whistles.</p>
      <p>st</p>
