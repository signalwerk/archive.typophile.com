      <p>Aaron, the design works. I love sites that look like somebody designed the grid first instead of just using what has become a standard — the 3 column web site approach.  </p>
      <p>The white text on the black menus is a touch small. To get around the harsh contrast of the white text on black you could cheat with a slightly gray text instead of white. I think you could pull it off if the text were a touch larger. </p>
      <p>Other than that I think you’re hearing from the vocal minority. As with any redesign, people love to hate change.</p>
      <p>On a personal note, it’s been a while! I can’t believe David Groom has gone full circle back to Novell. It’s encouraging to see any company (technology or otherwise) that understands the value of a visual brand. Cheers and good luck with it.</p>
