      <p>On my computer your menu (second page, after going through the country stuff) is nearly unreadable. Small white type on black medium weight generally fails. Make the type bold, larger, or loose the black (there are colors out there, you know).</p>
      <p>Another note, on many Choose your country drop down lists, I can type a letter C and go immediately to that country. On yours I had to scroll. A small thing, but a useful one if you can implement it.</p>
