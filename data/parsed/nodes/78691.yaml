    date_raw: 6 Feb 2011 — 5:53am
    votes: null
    html: "<p>To the OP: Given that you stated that you're specifically looking for Japanese fonts that work with Adobe applications, have you poked around on the product DVD (or DVDs) that you received? I believe that we bundle many fonts with most of our applications, including Japanese ones. Look for a font folder, and inside look for files that include the strings \"KozMin,\" \"KozGo,\" or \"Ryo.\" If you find such files, these are OpenType Japanese fonts that will work with Adobe (and other) applications.</p>"
