  html: |-
    <p>I've downloaded some free Japanese fonts and want to use them in programs like Illustrator or InDesign.  They come as .ttf for Windows and .suit for OS X.  Neither have displayed anything but rectangles in Adobe or word processors.  On both operating systems, the fonts seem properly installed but they don't work with the Japanese text I copy and paste in.</p>
    <p>The Japanese fonts which appear to have been preloaded on my system work fine, so i know I can display Japanese but no other fonts i acquire work.</p>
    <p>Help!</p>
