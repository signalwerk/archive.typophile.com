    html: |-
      <p>Many of the free hiragana or katakana-only fonts found on the internet, including i2f's, appear to be encoded for entry with any of various western Latin (8-bit) keyboard layouts. The kana are mapped to the characters A-Z, etc. and not the proper Unicode points for their own script. This is inconvenient, but since most of these are clearly display fonts not intended for extended text use, it's an issue that can be dealt with. Some of these font developers supply a keyboard chart, but if you can't find one you'll have to experiment a while to determine which key corresponds to which character and draw out your own chart.</p>
      <p>If you really must use these fonts with properly encoded Japanese text or with one of the Japanese keyboard entry modes, you'll have to open the fonts in FontForge (only because that's what I have; other font editors may work too) and copy the glyphs to their correct unicode positions and generate new properly encoded fonts. You should, of course get permission of the original designer and/or foundry for permission before you do so, but that may not be possible.</p>
    html_clean: |-
