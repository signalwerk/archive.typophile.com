    <p>Hi all,</p>
    <p>About four months ago, I asked for some help with a <a class="freelinking external" href="http://www.typophile.com/node/120859" rel="nofollow">new project</a>.  Progress has been slower than I would have liked, but I'm back asking for your thoughts on my initial ideas for the italic version of the same font.</p>
    <p>Here's what I have so far.  </p>
    <p><a href="http://www.typophile.com/node/120859" title="http://www.typophile.com/node/120859">http://www.typophile.com/node/120859</a></p>
    <p>And, for the purposes of comparison, here's where I'm at with the original project.</p>
    <p><a href="http://freepdfhosting.com/91e209e0cb.pdf" title="http://freepdfhosting.com/91e209e0cb.pdf">http://freepdfhosting.com/91e209e0cb.pdf</a></p>
    <p>The italics share the same core design principles of the original, but are not simply skewed clones.  Most letterforms have been redrawn, for example, and the 'pinched' angles are more pronounced.</p>
    <p>All feedback would be appreciated. </p>
    <p>Thanks.</p>
