    html: |-
      <p>I think the /w/ could still be a touch lighter, but get a second opinion.<br>
      I don't think the roman is too loose (though the wordspace may be too wide). Because italic letters are sloped they are narrower, and the counters consequently smaller, so the interlettering space needs to be too. But looking at the small sizes in a printout now, I'd only tighten them a hair--it's pretty close to good. Overall, though loose and stiff when big, I think this works really well at text sizes.<br>
      The /p/ seems to me the most daring character. My eye gets hung up on it a bit, but I'm not sure how to advise you to rein it in. Would it be crazy to keep the bowl and the ascending stem but snip off the little bit on the left side?</p>
    html_clean: |-
