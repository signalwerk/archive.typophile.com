    html: |-
      <p>Hi Andreas,</p>
      <p>My aim for the italic is to create a sort of half-brother to the roman, if that makes sense.  I want them to appear clearly related but, at the same time, clearly different.  This is the reason for the alternate style /p/.  In fact, only the /v/, /w/, /x/, /y/ and /z/ are simple skewed versions of their roman counterparts.  Every other letter has been redrawn.</p>
      <p>I shaved a little more off the /p/ stem, mainly to avoid confusion with the /þ/.  The first draft of the caps has been added, but no numerals yet.</p>
      <p><a href="http://freepdfhosting.com/8c955fc39b.pdf" title="http://freepdfhosting.com/8c955fc39b.pdf">http://freepdfhosting.com/8c955fc39b.pdf</a></p>
