    html: |-
      <p>Andreas, I've reverted to a more conventional /p/.  I've reviewed the /s/ again and again, and remain happy that it is consistent.  I take your point about the /z/; I tried straightening it and also making the kink 'harder', but preferred the original.  I may return to it again, but my focus has been on creating a set of italic Greek characters.  </p>
      <p>Here's the latest version, showing pangrams in various languages, each in italic and then roman for comparison.</p>
      <p><a href="http://freepdfhosting.com/162b20fa48.pdf" title="http://freepdfhosting.com/162b20fa48.pdf">http://freepdfhosting.com/162b20fa48.pdf</a></p>
      <p>Whilst I've included Latin scripts, I'm most interested in feed back on the Greek at this time.  </p>
      <p>You'll notice the Greek italic at the top is not simply a skew, but a redraw, with some characters (alpha, beta, theta, kappa, rho and phi) taking completely different forms.  Firstly, any issues with the way the characters are drawn?  Secondly, are these different letterforms a bit <em>too</em> 'different' to be standard?</p>
      <p>As always, all thoughts on any aspect is most welcome.</p>
      <p>Edit to add: please ignore spacing; I'm focussing primarily on the shapes.</p>
