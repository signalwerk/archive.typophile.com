    html: <p>I use an MS Word file into which I have pasted blocks of copy from various foreign-language websites (French, Polish, Portuguese, Romanian and Turkish) which contain virtually all of the Latin 1250 and Latin 1252 characters. I usually do a visual check at 18 point with kerning turned on (ordinarily optional in Word) and do a line-by-line visual check. This may not be the most elegant solution, but it works...</p>
