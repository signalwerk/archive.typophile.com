    html: |-
      <p>I think that positioning every accented letter against the other is uneconomic and not necessary at all. It creates unnatural level of gray and unexisting "flows".</p>
      <p>My native language is polish, so I use this as an opportunity to test just a few accented characters which are the bridge to (from my point of view) the real "extended character set".</p>
      <p>The method is raw. First I work with InDesign file (since I don't trust MS) containing 12 pt lines with all possible combinations for polish, plus germandbls and ccedilla - 11 regional characters (aaaąabacać... ). Such set needs only one sheet of paper and gives an overall view of an "extended" typeface.</p>
      <p>After this I test another set, containing eth, dcroat, hbar and accents: umlaut, hungarian umlaut, macron, tilde.</p>
      <p>Then I know moreless, how will all the accents behave in context of default character set, and I can go to the next level, described by oldnick (I collect strange looking words).</p>
