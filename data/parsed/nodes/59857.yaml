    html: |-
      <p>Hello all,</p>
      <p>First of all thank you very much for all your comments. Great input for me.</p>
      <p>@Bendy, I will try to adjust the letters (N and W), ligatures would be great indeed, thank you for mentioning the other fonts I am working on.</p>
      <p>@podperson, I know it's hard to read but it's just a decorative font meant for titles and just a couple of words. The name "arhaic" is the Romanian equivalent to the English word "archaic". I thought I write Romanian words because it's based on old Romanian letters and it will probably used mainly for Romanian. I will adjust the M. I was also stroke by the lowercase a there, but didn't thought about creating a font using that solution. This is a great idea, thank you. I hope to see other font using it (@eliason), here on Typophile.</p>
      <p>@riccard0, yes you are right, it resembles Vyaz font and that's because they both share the same origin. There was a time when religious books in Romania were written using Slavonic language and some time later only the Cyrillic letters were used. Romanian language is a latin one and uses latin letters so there was only a period in time that the Romanian Orthodox Church used it. I was thinking of reviving them although they are hard to use. Only traditional, religious Romanian texts would be appropriate, but anyway I thought they should be brought to present day and computer use. So, yes it's a sort of a "nephew" of Vyaz. :)</p>
      <p>@alexfjeldall, more extreme decorative would be fun so I think I will do it. For now, the letters presented here are some of the variants I did and you can see them all on my blog (text is in Romanian but images speak for themselves) LInk:<br><a href="http://florinf.wordpress.com/2009/07/10/arhaic-romanesc-ornamental/">http://florinf.wordpress.com/2009/07/10/arhaic-romanesc-ornamental/</a><br>
      Undecorated would also be nice to do, so I think there would be a large family for this one.</p>
      <p>Thank you all.</p>
      <p>Florin</p>
