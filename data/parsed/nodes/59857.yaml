    html: |-
      <p>This one could be a really interesting type if you think of the wide range of combinations of ligatures possible.<br>
      1.The book says at its very beginning: VIATA and that shows the ligature v_i<br>
      I would re-design V and W because for example they would not work by A. The ball terminal of them are actually from the I (of viata).</p>
      <p>2. Try to compense it optically: The R and K of Simple variable, need to have a bit longer tail. Remember the -curve rule- of designing a type. (Circles always need to be bigger than squares to look the same size). Also look at the bottom of the S, it looks smaller than the T because of that. The serif of T is straight, the base of S curved. So, S must break the baseline a little bit.</p>
      <p>It is awesome when a type gives this possibilitie of playing with lots of alternate forms.<br>
      Do not surrender  , I like your project. Test how it writes, and upload new samples!</p>
      <p><a class="freelinking external" href="http://www.flickr.com/photos/msproviero" rel="nofollow">Lián Types</a></p>
