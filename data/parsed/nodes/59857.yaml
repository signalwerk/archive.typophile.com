      <p>It's beautiful if pretty hard to read. Is it supposed to be "arhaic" or "archaic"?</p>
      <p>I think I'd tweak a few elements for readability (sorry I'm a usability guy :-) ) -- e.g. the M has structural elements that are disguised as decoration which make it hard to parse. The A containing both a lowercase and uppercase A is very playful ... I wonder if this might not be something that one could tease out into an entire font (perhaps having almost identical upper and lowercase elements which simply de-emphasize some elements in a given glyph).</p>
