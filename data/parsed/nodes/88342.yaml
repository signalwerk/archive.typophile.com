      <p>hrant: "we do re-use the ten decimal digits in non-decimal systems and it still works out OK... [...] the symbol/numeral "1" for example has the same value in binary, decimal, hexadecimal, etc."</p>
      <p>People only re-used the same symbols for different numeral bases because they had no other immediate option that could be applied systematically. A make-shift work-around does not rule out supersedence by a surpassing tailor-made fix. Identical decimal numerals used for different bases only barely perform when the different bases are not co-existing in the same application or if there is a notation to explain explicitly what the base of a given number is supposed to be.</p>
      <p>A particular digit could hardly be said to have the same meaning in different base notations. Even within a same base numeral system, a character signifies different numbers depending on the context of its position in the place value. For example, in decimal notation a digit 1 followed by just one other digit to its right hand side means ten; but with two or three other digits to its right it would mean a hundred or thousand. But in base sixteen its values would be sixteen, two hundred and fifty-six, or four thousand and ninety-six. If there is no explicit instruction explaining what the place value is, since counting the number of digits to the right hand side is inadequate because it only provides the power or exponent of the base but not the base itself, then the digits themselves by their dedicated design ought to assume the role of informing the reader of the base. Otherwise, the reader would have to try to guess what the base is by watching how many different characters happen to appear in the numbers; although this method is not reliable, because the character signifying the largest number of units for the base might not appear in a given sample. </p>
      <p>Insistence on using only pre-existing alphanumeric characters for other bases than decimal is not optimal, has no inherent justification, and prevents the practical simultaneous use of different numeral base systems.</p>
      <p>I designed some cursive versions of the characters that I proposed here in my post of 19 Mar 2013 — 12:35pm (See image "DKdodenaryJPEG"). I have not done any further work on this picture since Tuesday 26th March 2013.</p><div class="imageWrap"><img src="http://typophile.com/files/DKdodenaryJPEG_5512.jpg"></div><p></p>
