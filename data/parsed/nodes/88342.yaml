      <p>Andreas:<br>
      <cite>What is needed on the long run is new glyphs and new characters (please inform yourself about this two crucial concepts). Everything else will not overcome the state of a – more or less – poor workaround. You’ll not get sustainable encoding practice for those characters as long as you use £ or # or something else which already exists for other expressions.</cite></p>
      <p>I'm glad to see you post this. I feel the same way. That's why I posted here. </p>
      <p><cite>* It should be simple graphs that can get easily written by hand, easily recognized by the eye and easily typographed.<br>
      (Your very first line example looks promising, I’d say.)</cite></p>
      <p>If you look around the internet a bit, at duodecimal sites, you'll find better examples of X / E upon which my sketch is based. </p>
      <p>hrant:<br>
      <cite>Good basic idea, but I think they should be only reminiscent of ABCDEF<br>
      while remaining identifiably distinct - otherwise there's really no point.</cite></p>
      <p>Agreed. I'm by no means any kind of final arbiter, although if I was, I'd work on my rounded glyphs a bit more. I would want computer-people to be able to glance at a string of new hexadecimal numbers and say to themselves "huh, those symbols are obviously hexadecimals, and not alphabet letters." No more confusion between hexadecimal strings and various algebraic expressions you might find in computer programming, plus the fact that now you could use hexadecimal in algebra with actual As and Bs. </p>
      <p>I can imagine keyboards being made with an extended set of numbers, although having read various cases for the dozenal system, I think it's more practical to add only two duodecimal numbers to the keyboard, rather than six for hexadecimal. </p>
      <p>riccard0:<br>
      <cite>If I were to lay down some research about duodecimal symbols, I would start looking for already used and working systems.</cite></p>
      <p>That's what the first four symbols that I posted are. They are in use by the Dozenal Societies of Great Britain and America. The sketches are my interpretations, but I didn't come up with those shapes. </p>
      <p>Té:<br>
      <cite>Well, if you're planning to do glyphs for the sedecimal range 10-15 (A-F), why not base them on scripty minuscules?</cite></p>
      <p>Why not? Because I'd want to create a sense of continuity between the capital letters that everybody uses now, and any new system. I've looked at minuscules in the desired context, and to me they look like algebraic and calculus expressions.</p>
