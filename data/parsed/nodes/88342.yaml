      <p>I happened to exchange thoughts on that with a certain Thomas Lambert about two years ago. And some more time ago I was in contact with Tilman Piesk about hexagesimal figures.</p>
      <p>I’m not a mathematician, I’m a signographer and fontist. It is good that mathematicians and typographers think about this together.<br>
      This matter is surely complex. Perhaps it would be most sensible to deal with dodekadic and hexagesimal figures at once. The issue seems to be the same.</p>
      <p>I try to answer briefly on this worthwile account of aspects:</p>
      <p><cite> It has to be able to translate to a seven-segment display.</cite><br>
      – this is a reasonable request, but aonther request would have to come first:<br>
      It has to be easily written and easily recognized (by humans).</p>
      <p><cite> It has to be something a 19th-century printer could dig out of a drawer by rotating or somehow being creative with existing characters.</cite><br>
      No. There is no reason why we should stick to the technical limitations of 19th century letterpress printing. B.t.w., they were often more flexible like we are nowadays when creation of new characters was at stake.</p>
      <p><cite> It has to look like other numbers.</cite><br>
      No. It has *to fit to the set of the existing figures*<br>
      (note: we are typographically talking about figures here, i.e. the graphical representations of the first numbers, not of numbers as such).</p>
      <p><cite> It has to be something used by Dozenalists since the 1940s.</cite><br>
      Possibly, but not neccessarily. It would be of merit, though.</p>
      <p><cite> It should be related to the letters that the words ten and eleven begin with. (T and E, or other letters in other languages)</cite><br>
      No. This is a linguacentric bias which there is absolutely no need for. Choose one language and you end up discriminating all others.</p>
      <p><cite> It has to be something that already appears somewhere on the keyboard, or ideally, on the telephone pad (* and # were used for a while for this reason)</cite><br>
      No, No, and once more NO.<br>
      What is needed on the long run is new glyphs and new characters (please inform yourself about this two crucial concepts). Everything else will not overcome the state of a – more or less – poor workaround. You’ll not get sustainable encoding practice for those characters as long as you use £ or # or something else which already exists for other expressions.</p>
      <p><cite> The single numeral for 10 should look like a 10 to evoke its history and subsequent demotion from a 2-digit number to a 1-digit number (actually my favourite constraint). </cite><br>
      I do not see any need for that constraint. B.t.w., X means also “ten”.</p>
      <p>* It should be simple graphs that can get easily written by hand, easily recognized by the eye and easily typographed.<br>
      (Your very first line example looks promising, I’d say.)</p>
      <p>* The graphs must not get eventually mixed up in recognition with other figures.</p>
