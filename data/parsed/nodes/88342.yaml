    <p>I've been playing with the designs of glyphs for a duodecimal number system, also known as dozenal, base-12, base twelve, and uncial. </p>
    <p>I'm not a font designer, but here are my sketches of the current frontrunners among the tiny baseTwelve community in the Dozenal Societies of Great Britain and America: </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dozenal ten eleven_6190.png"></div><br>
    These digits represent ten and eleven, respectively. <p></p>
    <p>And here's my sketches of my own design and personal choice: </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/10 and 11_4405.png"></div><p></p>
    <p>My sketches are by no means the only suggestions out there. But I happen to be the one posting this post, so I'll naturally put in my favorites. </p>
    <p>What I want from you is, well I guess this is sort of an advertisement to make you aware of the need for duodecimal glyphs. Think about it the next time you're designing a set of numerals. </p>
    <p>I'd also like to test the waters and see if anyone here has preferences for one symbol over another, and why, or why not. </p>
    <p>As for actual use, for now I guess these would go in the personal use area of Unicode, if I knew how to do that. In the ideal future, I'd like to see a small block of Unicode set aside for base-12 numerals, as well as special hexadecimal characters. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hex numerals_5287.png"></div><p></p>
