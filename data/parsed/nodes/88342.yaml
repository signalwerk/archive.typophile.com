      <p>"Constraint is the father of design." </p>
      <p>Does this apply to arbitrary constraints, too? I guess that would be the paternal grandmother of design, making arbitrary constraints for her son to follow. Some of the constraints that I've seen regarding duodecimal: </p>
      <p>* It has to be able to translate to a seven-segment display.</p>
      <p>* It has to be something a 19th-century printer could dig out of a drawer by rotating or somehow being creative with existing characters.</p>
      <p>* It has to look like other numbers.</p>
      <p>* It has to be something used by Dozenalists since the 1940s. </p>
      <p>* It should be related to the letters that the words ten and eleven begin with. (T and E, or other letters in other languages)</p>
      <p>* It has to be something that already appears somewhere on the keyboard, or ideally, on the telephone pad (* and # were used for a while for this reason)</p>
      <p>* The single numeral for 10 should look like a 10 to evoke its history and subsequent demotion from a 2-digit number to a 1-digit number (actually my favourite constraint).</p>
