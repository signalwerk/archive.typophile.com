      <p>Some random notes.<br>
      My relationship with the sexagesimal number system is mostly of fascination,* not of real use, outside of time tracking and such. Hey, we’re divisible by 5 too! ;-)<br>
      About constrains, other than what others already said better than I could do, IPA already claimed any shape even vaguely resembling a Latin letter, but it could be a minor issue, lest you need to write a book about the Mahl language of Minicoy Island.<br>
      I’m with Té about X for ten. Unfortunately it (and its variations) is already one of the most heavily laden with meanings symbols of the world.<br>
      If I were to lay down some research about duodecimal symbols, I would start looking for already used and working systems.<br>
      Té’s suggestion about Saturn led me to think about zodiacal symbols and their relationship with the twelve months. And what about the Chinese zodiacal symbols?** Their twelve years cycle is less meaningful, but they’re more related with numbers, with the symbol for “rat” sometimes replaced with the symbol for “first”.</p>
      <p>* <a href="http://www.newearthtime.net/" title="http://www.newearthtime.net/">http://www.newearthtime.net/</a><br>
      ** There are also the Twelve Symbols of Imperial power, if one wants.</p>
