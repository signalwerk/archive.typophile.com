      <p>Ah, there is a thread on this subject.</p>
      <p>The top two symbols, it turns out, were designed by W. A. Dwiggins, of Caledonia fame!</p>
      <p>The second two are due to Isaac Pitman, the shorthand innovator.</p>
      <p>And even the two you identify as your own invention and personal favorite are similar to one set that dates from the 1500s, designed by Juan Lobkowitz.</p>
      <p>Incidentally, I see that there are no duodecimal positions in Unicode at present. I would have thought that at the very least, the "10" and "11" used to print sterling pence amounts would be there, because some computer character codes had them.</p>
