      <p><cite>[X…] Unfortunately it (and its variations) is already one of the most heavily laden with meanings symbols of the world.</cite></p>
      <p>Lets be careful. Let’s try to describe **exactly** what is meant. It is essential not to mix up things here.<br>
      As a matter of fact, it is rather natural that the basic cross-shape is materialized in many different signs and characters, and in *some* symbols, too. It may help mentally to distinguish:</p>
      <p>• graph • sign • symbol. as well as • glyph and • character.</p>
      <p>In extensive fonts you are likely to find many different glyphs or characters based on one and the same graph:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/xxxxx_5509.jpg"></div><p></p>
      <p>A new figure glyph based on the X-graph could well be done, in the carving adjusted to the existing figures and proportions rather slim, like here the later two (Runic and Ogham).</p>
