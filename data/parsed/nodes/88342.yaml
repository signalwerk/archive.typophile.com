      <p>This<br>
      0123456789<br>
      ABCDEF<br>
      GHiJKLMNoPQRSTUVWXYZ<br>
      ԱԲԳԴԵԶԷԸԹԺԻԼԽԾԿՀՁՂՃՄՅՆՇՈՉՊՋՌ<br>
      սՎտՐՑՒՓՔ...Ֆ</p>
      <p>gets us up to base-64, before we have to switch to lower-case again.</p>
      <p>With a suitable typestyle, a lowercase Օ (here replaced by an ellipsis) wouldn't get confused with the Latin o either, so one could go to base-74, without any additional memorization... except having to learn the Armenian alphabet, of course.</p>
      <p>Come to think of it, though, while 4 and 7 are exceptions, most of the digits are rounded in shape, while most upper-case Latin letters are angular - and Greek, Cyrillic, and Armenian capital letters are closely enough related that the same applies to them. Perhaps another alphabet should be chosen, one with rounded shapes that match well with the digits...</p>
      <p>Thus, I unveil... New Hexadecimal!</p>
      <p>0123456789აბგდევ</p>
      <p>Oops; F and 3 will get confused (at least with oldstyle digits) and why is Georgian being aliased differently from everything else in my browser (perhaps resorting to a different font)?</p>
      <p>Hmm. I think I've come up with a way to avoid memorization entirely. Use a-z followed by A-Z, and avoid confusion by using a script face for the letters used as digits.</p>
