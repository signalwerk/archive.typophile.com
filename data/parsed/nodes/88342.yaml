      <p>It is not acceptable to merely add two new numeral characters to the ten digits of the decimal Indo-Arabic numeral system in order to make a duodecimal system. It would also then be necessary to write some kind of a note next to any number written with the supplemented numerals to the effect of "this is a base-twelve number", as otherwise the reader would not know what base the numeral system is supposed to be if only the digits of the small counting numbers zero to nine happen to appear in the expression of the number. But it is not convenient to have to write such a note every single time any number is written by an expanded decimal to base-twelve system.</p>
      <p>What should be required instead in the design of a duodenary system of numeral notation is creation of a complete set of twelve new numeral digits, such that none of the new digits could be confused with any of the old decimal number characters. The dozenal digits should also preferably look different from alphabetic letters. This I have done (See image "DKdozenalJPEG" of numeral characters adapted for familiar modular display).</p>
      <p>I used to complain about the decimal system of notation and advocate a base-twelve system instead as a child. The number ten as base for a numeral system seems quite bizarre in comparison to twelve. Now I have been routinely using a dozenal numeral system privately, and this differs from that which I display here in that only one of its numerals neatly written can be converted to one of the others by adding marks, but it is not so suitable for the monospaced concept.</p>
      <p>One person with good judgement can propose better in a single day what many other people in decades or centuries suggest.</p><div class="imageWrap"><img src="http://typophile.com/files/DKdozenalJPEG_5240.jpg"></div><p></p>
