  html: |-
    <p>Victoria Espinel, the new I.P Czar (officially the U.S. Intellectual Property Enforcement Coordinator), is soliciting suggestions on how to improve the state of intellectual property law and enforcement in this country. There are a number of more formal requirements (see the open request form <a class="freelinking external" href="http://www.whitehouse.gov/omb/assets/fedreg_2010/02232010_ipi.pdf" rel="nofollow">here</a>), but I think this could be a great opportunity to get the voice of the digital type industry heard. I don’t personally have the time or the well-developed, responsible worldview to put together a cogent proposal myself, but I imagine there are some great minds here that are more than up to the challenge. </p>
    <p>Submissions need to be in by March 24, 2010.<br>
    <a class="freelinking external" href="http://www.whitehouse.gov/blog/2010/02/23/intellectual-property-and-risks-public" rel="nofollow">http://www.whitehouse.gov/blog/2010/02/23/intellectual-property-and-risks-public</a></p>
