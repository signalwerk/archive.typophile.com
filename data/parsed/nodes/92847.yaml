    <p>Hey Typophile, </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/RoseTenaFont_4857.jpg"></div><p></p>
    <p>First post, thanks in advance.  Looking for the font that this "Rose Tena" yacht name is made of.  The image above came from a photograph, I cut it out of the photo and straightened it so it was vertical.  The yacht is in the Midwest region of the USA.  The lettering was applied with vinyl decals, and I would venture to say that it was done within the last 10 years.  The unique part about this font is the "T".  If we can identify that, I believe the rest of the font will follow.  It feels like it has a spanish, or latin flair to me.  Your help is greatly appreciated, as I have been tasked to use this particular font on another project.</p>
    <p>Thank you,</p>
    <p>TLathropID</p>
