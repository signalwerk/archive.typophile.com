    html: <p>The Altra is close, especially the Altra Heavy or Altra Black.  But still not perfect, the S in the logo has less white space, and the R and A in the logo stay pointy rather than getting cut off on the thicker Altra versions.  Do you think it's a knockoff, or were the letters modified?  It might be able to pass if there aren't any other options.</p>
