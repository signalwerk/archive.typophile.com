      <p>The description reads:<br>
      </p><blockquote>Altra is a family based on a tracing of an old clip art font.</blockquote><p></p>
      <p>So it’s possible that the vinyl letters came from the original source.<br>
      I think that fiddling with the Heavy weight (horizontal scaling, maybe an outer stroke) could bring you pretty close.</p>
