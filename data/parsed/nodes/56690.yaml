  html: |-
    <p>Ok I'm not thinking on using autospacing instead of manual kerning ;) I just want to know what happend if I do an autospacing to my whole font if I did manual kerning (OTF) The autospacing will affect my manual kerning? Or are they 2 separate things in the font?</p>
    <p>Thanks in advance!</p>
