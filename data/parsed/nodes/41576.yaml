      <p>Hi Jürgen,</p>
      <p>it’s <a href="http://typography.com/fonts/font_overview.php?productLineID=100026">Whitney</a> by <a href="/wiki/Tobias%252BFrere-Jones" class="wiki">Tobias Frere-Jones</a>, identified in <a href="http://www.typophile.com/node/19127">this older thread </a>.<br>
      You can always <a href="http://www.google.com/search?q=site:typophile.com%20visa">run a search</a> if you know what you’re looking for.</p>
      <p>For your second question:<br>
      There’s <a href="http://www.typografie.info/typowiki/index.php?title=Hausschrift-Liste_Unternehmen-zu-Schrift">a list of Corporate fonts</a> at German Typografie.info.</p>
      <p>An older Typophile thread mentions several <a href="http://www.typophile.com/node/27315">corporate initiated typeface designs</a></p>
      <p>And there’s the <a href="http://users.ncrvnet.nl/mstol/index.html">Website about Corporate Identity</a> by Hans Stol with a lot of useful information.<br>
      F</p>
