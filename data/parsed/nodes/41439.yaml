      <p>While all the technical data above is correct, there is a movement for making the em dash slightly wider than its escapement, giving a small sidebearing on either side, so that it does not crash into o and other letters that have small or no sidebearings. </p>
      <p>That said, doing this prevents you from putting several dashes in a row, and having them join (without kerning). Three ems is used in bibliographies to indicate the same author as the item above, for instance.</p>
