      <p>Kent,</p>
      <p>I usually make a *endash.lp* &amp; switch it on with lining numbers. Also, when doing a good job, plus, minus, equal, divide, and copyright. And sometimes less &amp; greater &amp; a few other operators. Sometimes too the dollar sign, pounds-sterling, etc. etc. (I usually use the oldstyle numbers as default, so the lining sets are .lp and .lt).</p>
      <p>The only real problem is where an endash is used in the text, as with (Chicago's example) "quasi-public--quasi-judicial body." (I think an em dash shows here, but s/b an endash.) If you are using lining numbers &amp; a higher en-dash, it would stick out. If you also switched on a raised-up hyphen, it would be too high for lower case letters.</p>
      <p>*case* is usually no problem, just have a higher hyphen &amp; all dashes along with whatever else you want -- quotes, parens, brackets, etc.</p>
      <p>FWIW</p>
