    html: |-
      <p>Let's talk about the visual appearance of dashes for a moment, not numbers. You don't have to go back too far in typographic history to find the time before the em-system.</p>
      <p>Visually, the "em-dash" was about as wide as the widest capital letter -- sometimes an "M", more often a "W".</p>
      <p>The "en-dash" was about as wide as a figure.</p>
      <p>The hyphen was about as wide as a lower-case "i" (which was about as wide as a word space, in the days when you always added space to justify a line).</p>
      <p>If you talk to an old Linotype operator (some are still living, and the linecaster didn't use the "em" system), he's apt to tell you that an em-space is about the size of a capital M.</p>
      <p>Moving to the current em-system, the technial "width" (setwidth) of the dashes is more or less fixed, 1000 units for an em-dash (on the 1,000 unit UPM), 500 units for an en. How much of that inside space (ink + sidebearings) is filled with ink is your business.</p>
      <p>As Dan said, you will need two- and three-em dashes.  Unless you write a kerning or ligaturing routine, that prohibits sidebearings. But, there are not many fonts I can think of where the capital M (or W) is 1,000 units. So my solution is to make a dash with ink about the size of M or W, set the width to 1,000, and make two ligatures for a two- and three-em dash, with no sidebearings, so if you need a 4- or 5- or whatever em dash, you can set it.</p>
      <p>I usually make the ink of an en-dash look right with a figure, and set the sidebearings the same as a hyphen, as an en-dash is also used between alpha charactes on occasion. It's width will usually be around 500 units, but if that works out to 550 or 450, I don't sweat it.</p>
      <p>FWIW</p>
