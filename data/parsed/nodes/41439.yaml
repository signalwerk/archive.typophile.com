      <p>I'm not familiar with UPM. However, I do know that an em space is the same size as the font's point size height (if a font is 10 pts an em space is 10 points.) And an en space is half an em space (so in the same example, a font is 10 pts, and en space is 5 points.)</p>
      <p>Applying this reasoning, an em dash would be 10 pts wide and an en dash would be 5 pts wide.</p>
