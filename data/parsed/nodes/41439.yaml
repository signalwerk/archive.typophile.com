      <p>" if you go back to foundry metal type (before hot metal), the em dash wasn’t part of the typeface, but was a separate “sort” and was the same width as the point size."</p>
      <p>Good point. This is also true into the age of mechanical metal type. Most fonts of that era, and up until the 1980's were made of 80-90 characters and all the rest were sorted in from a limited variety of options, usually 8, (sets of accents, reference, secondary punctuation and etc., though not &amp;). The upside of this was a consistent user experience with the downside that design suffered ever so slightly. </p>
      <p>Cheers!</p>
