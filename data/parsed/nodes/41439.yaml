    html: |-
      <p>"Still, I’m not sure if my em-dash should be 1000 UPM wide."</p>
      <p>Most fonts I know of are produced with a "3/4 em dash", not an Em dash, and, this may be confusing. There was no type designer present at the formation of the glyph sets to tell the techies that most users and uses were not going to want a 'real' Em dash, so we  who need to solve problems, not argue about technicalities, said dash'em, and made the right character, which is a full em space, with 1/8 em sidebearing on either side of a 3/4 em wide dash.</p>
      <p>If you are working on a face that is considerably less wide than 'regular', then you may also need to consider the widths of "M" and "N" as guides for your dashes, and then make the EM vs. 3/4 EM descision. The same is true in the wider direction, if you are working on a face considerably wider than 'regular'.</p>
      <p>Cheers!</p>
