      <p>Charles, Nick -- Thanks for the advice. </p>
      <p>There are "case" versions of monetaries and arithmetic signs for Whitman; they've been there from the beginning. And they'll be switched out with appropriate onum/lnum features. </p>
      <p>Substituting raised dashes with {case} is pretty much a no-brainer. The trick with the endash.uc, as Charles mentions, is that if you use a straight substitution for it with the {lnum} feature, then it will also appear in running text. Although the occurrence of an endash outside the context of a number range is not common, it still occurs. </p>
      <p>So, the solution currently in mind is to contextualize the substitution with a statement something along the lines of "sub @lnum endash' @lnum by endash.uc".</p>
      <p>-- K.</p>
