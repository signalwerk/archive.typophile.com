    html: |-
      <p>I have long been of the understanding historically, if you go back to foundry metal type (before hot metal), the em dash wasn't part of the typeface, but was a separate "sort" and was the same width as the point size. In fact, that's why its width was independent of the typeface.</p>
      <p>I certainly agree that typeface-dependent sizes probably look better in many cases. At Adobe we still largely adhere to the standard that an em dash should have an advance width equal to the UPM, however.</p>
      <p>Cheers,</p>
      <p>T</p>
