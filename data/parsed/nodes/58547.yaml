    <p>In typical Enschedé fashion, with understated fanfare:</p>
    <p><a class="freelinking external" href="http://www.teff.nl/fonts/burgundica/" rel="nofollow">http://www.teff.nl/fonts/burgundica/</a></p>
    <p>Astounding. And four weights! I never knew there was more than one! I always loved the caps in this design. There is nothing like them anywhere else.</p>
    <p>Be sure to click on the "Concept" link and dig the early version of the uppercase K. It's so good to see this typeface finally available. It also mentions that Noordzij's Tret is in production at TEFF and to be released in the future.</p>
