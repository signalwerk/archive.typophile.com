    html: |-
      <p>I cringed at the first sight of this.  Not fitting whatsoever, especially in light of the Spiderman AND XBOX relations.</p>
      <p>During my stint at T26, we “retired” roughly half of the library from active promotion due to low sales and poor quality.  Mata nearly got the ax, but the Spiderman phenomenon kept it selling.  Microsoft was considering OEM licensing Mata for Windows… not sure what happened with that.</p>
      <p>Mata was one of the first T26 fonts.  It’s amusing to see such a dated design make such a (IMO) premature comeback on so many high profile fronts.  A true life testament to publishing your designs… setting them loose upon the world for reckless and uninspired art directors to pitch for huge accounts.  Too bad Greg Samata is only seeing chump change for the usage.</p>
