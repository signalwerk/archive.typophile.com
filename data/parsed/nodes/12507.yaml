    <p>Interesting font choice for the upcoming PS3. </p>
    <p><a href="http://www.gaminghorizon.com/games/screenshots/465/465-0-1116292760.jpg">http://www.gaminghorizon.com/games/screenshots/465/465-0-1116292760.jpg</a> </p>
    <p>I’m sure the bloggers will soon notice that the new logo and the Spider-Man movie font are based on T26 Mata, the same font apparently used as the basis of the original Xbox logo. </p>
    <p>Si</p>
