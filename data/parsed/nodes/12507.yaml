      <p>&gt;Microsoft was considering OEM licensing Mata for Windows… not sure what happened with that.</p>
      <p>First I’ve heard about that and I’ve been invovled in MS fonts for ten years. Who did you talk to at MS? Perhaps this was for non-Windows usage? There was some interest in Luggage at one point and of course we only have limited rights to Flexure.  </p>
      <p>&gt;Too bad Greg Samata is only seeing chump change for the usage.</p>
      <p>What are you guys doing to promote the link? Have you made an Italic version to match the Sony derivative, or a version to match the Xbox logo (where the curves are rotated 90 degrees)? Seems like a bit of a missed opportunity?</p>
      <p>Cheers, Si</p>
