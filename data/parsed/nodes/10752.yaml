  html: "<p>At the risk of offending type historians everywhere, I thought I'd take a stab at recreating an old type specimen in bitmap form. It's Sunday, I'm home sick, so why not?  <br> <br>The following specimen is scanned from D.B.Updike's Printing Types, Vol 1, pg. 87. This was the type used for the first Bible printed in France: Freiburger, Gering and Kranz, Paris 1476 <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7679.gif\" alt=\"frei specimen\"> <br> <br>And then here's a couple of hours' work in Bitfonter: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7680.gif\" alt=\"freiburger\"> <br> <br>So before you slam the R and the V, let me know if the bitmap feels true to the original forms, and where improvements might be made. <br> <br>Thanks //jb</p>"
  html_clean: "<p>At the risk of offending type historians everywhere, I thought I'd take a stab at recreating an old type specimen in bitmap form. It's Sunday, I'm home sick, so why not?  <br> <br>The following specimen is scanned from D.B.Updike's Printing Types, Vol 1, pg. 87. This was the type used for the first Bible printed in France: Freiburger, Gering and Kranz, Paris 1476 <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7679.gif\" alt=\"frei specimen\"> <br> <br>And then here's a couple of hours' work in Bitfonter: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/7680.gif\" alt=\"freiburger\"> <br> <br>So before you slam the R and the V, let me know if the bitmap feels true to the original forms, and where improvements might be made. <br> <br>Thanks //jb</p>"
