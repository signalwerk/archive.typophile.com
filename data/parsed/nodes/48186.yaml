    <p>Hi all you type experts</p>
    <p>Is there a new(ish) font called Legenden? A beautiful, slightly condensed modern serif text face, makes a first appearance – at least to me – in beautiful new book<br>
    ’Buch gestaltung in St.Gallen’<br>
    by Roland Fruh<br>
    pub. VGS, 2008<br>
    ISBN 978-3-7291-1116-7.<br>
    Can anyone help?<br>
    BTW, the other font used is Futura, also beautiful, but that I know!<br>
    Thanks. </p>
    <p>Honestly...</p>
