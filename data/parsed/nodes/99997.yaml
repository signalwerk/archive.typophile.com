      <p>Sorry, don't know this type and very hard to find a similar that could be close to both uppercases and lowercases.<br>
      A list of alternatives, some matching lowercases, some uppercases but all requiring customization: <a class="freelinking external" href="http://fontfabric.com/static-free-font/" rel="nofollow">Static</a> (the closest I have but /R off and all spurs on lowercases to be removed), <a class="freelinking external" href="http://www.fontbros.com/families/spoon" rel="nofollow">Spoon</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dayflash/rotundus-rounded/" rel="nofollow">Rotundus Rounded</a> (not so far but many uppercases off and some lowercases), <a class="freelinking external" href="http://www.myfonts.com/fonts/nmassi/tesca/" rel="nofollow">Tesca</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/baobaby/borba-sans/" rel="nofollow">Borba Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-acme/af-module-classic/" rel="nofollow">Module Classic</a> (mainly uppercases), <a class="freelinking external" href="http://www.dafont.com/duepuntozero.font" rel="nofollow">Duepuntozero</a> (mainly lowercases)</p>
