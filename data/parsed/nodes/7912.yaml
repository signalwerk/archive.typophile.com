    html: <p>Hello Mr. Benjamin Shaykin ! <br> <br>Right today I put my eyes on 'Black &amp; White' by Steven Guarnaccia <br>and Susan Hochbaum -- wonderful book !  (<a href="http://tinyurl.com/5ybvu" target="_blank">http://tinyurl.com/5ybvu</a>) <br>Well, recently I have been bitten by sort of 'copyleft' virus, <br>and, well, no wonder you were confused because of my question. <br>It seems to me that this house is quite brave &amp; visually smart. <br>I'd love to work for such minds, so I envy you a little bit. <br>I was wondering who, in general, or specifically, is in charge <br>of choosing &amp; using typefaces in the books about Art &amp; Design <br>and Children's.  Does this always come from the authorship, or <br>is rather a consult between Chronicle and the book designers ? <br> <br>Thank you very much, <br>Alessandro</p>
