    html: "<p>I am used not ot read in beetween the lines. But. <br>I take this 'thread' I started to apologize with <br>the people on this forum (I love this forum) ; <br>since a few weeks ago happened to me something <br>I considered un-fair, I have probably posted some <br>bad thoughts, or I have been typo-graphically un- <br>ethic. I am sorry. <br> <br>Back to my ?/curiosity/concern -- If anybody here <br>is not working for Chronicle, I would appreciate <br>a comment on the typefaces they use, the form of <br>their books, for the lines 'Art + Design,' <br>'Children's Books' &amp; 'Literature' (if you have, <br>if you can, of course). Maybe you could post a <br>little scan of some interesting/odd/special <br>parts/details -- tha would be great, and I'm sure <br>other people here could add their point of view. <br>I don't feel like to write to Chronicle asking <br>this, I prefer to ask this here. Hope that my <br>'thread' is not too weird. <br> <br>Peter Sellers starring 'Hoffman' (1970) : <br>\"Hope never dies in a man with a good dirty mind.\"  <br>Quote from 'Hoffman' - <a href=\"http://www.petersellers.com\" target=\"_blank\">www.petersellers.com</a>. <br> <br>I know that, and I am looking forward to check <br>one (or more) book myself with my hands ; meanwhile <br>I appreciate any virtual help &amp;/or critical opinion <br>from this board. <br> <br>Sincerely, <br>Alessandro</p>"
