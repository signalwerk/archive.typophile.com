<!DOCTYPE doctype PUBLIC "-//w3c//dtd html 4.0 transitional//en">
<html>
<head>
<script type="text/javascript">

/* Return the string representing the number with dp digits after the point */
function fixDecPl(x,dp)
{
return x.toFixed(dp) 
}


function intvalues()
{
  var linstring     = '';
  var quadstring    = '';
  var deGrootstring = '';

  for(i=0; i<3; i++){
    var box = document.forms['loginterp'].elements[i];
    if (!box.value){
       alert('You haven\'t filled in ' + box.name + '!');
       box.focus();
       return;
    }
  }

  var  a = parseFloat(document.forms['loginterp'].start.value);
  var  b = parseFloat(document.forms['loginterp'].end.value);
  var  n = parseInt(document.forms['loginterp'].n.value);

  var dp = parseInt(document.forms['loginterp'].dp.value);       /* decimal places */

  document.forms['loginterp'].n.value = n     /* we use just the integer part */
  document.forms['loginterp'].dp.value = dp   /* idem  */

  var  il = a
  var  dl = (b - a)/(n+1)

  var  iq = Math.sqrt(a)
  var  dq = (Math.sqrt(b) - Math.sqrt(a))/(n+1)

  var  id = Math.log(a)
  var  dd = (Math.log(b) - Math.log(a))/(n+1)

  for (i=1; i<=n; i++) { 
     linstring      = linstring     + fixDecPl(il+i*dl,dp) + '    ';
     quadstring     = quadstring    + fixDecPl((iq+i*dq)*(iq+i*dq),dp) + '    ';
     deGrootstring  = deGrootstring + fixDecPl(Math.exp(id+i*dd),dp) + '    ';
  }

  document.forms['loginterp'].linear.value     = linstring;
  document.forms['loginterp'].quadratic.value  = quadstring;
  document.forms['loginterp'].deGroot.value    = deGrootstring;
}   

</script>
